# Per-(lang, category) variants explicitly marked n/a — primitive
# does not exist in the language's standard ecosystem. Consumed by
# scripts/category_audit.py. Adding an entry here flips a `-` cell
# to `n/a` so the matrix doesn't penalize the language for a gap
# that isn't real.

# Format:
#   <lang>:
#     <category>:
#       - <variant-name>

