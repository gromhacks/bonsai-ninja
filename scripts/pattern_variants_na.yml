# Per-(lang, category) variants explicitly marked n/a — primitive
# does not exist in the language's standard ecosystem. Consumed by
# scripts/category_audit.py. Adding an entry here flips a `-` cell
# to `n/a` so the matrix doesn't penalize the language for a gap
# that isn't real.

# Format:
#   <lang>:
#     <category>:
#       - <variant-name>

c:
  command-injection:
    - invoke-expression
    - perl-2-arg-pipe-open
    - php-exec-family
  graphql:
    - dynamic-query-execute
    - introspection-exposed
    - resolver-raw-filter
    - schema-from-untrusted-source
  llm:
    - bedrock-openai-anthropic-invoke
    - model-response-disclosure
    - prompt-construction
    - retrieval-context-injection
    - tool-call-context
  prototype-pollution:
    - assign-deep
    - object-merge
    - query-string-merge
    - schema-validator-bypass
    - set-by-path

