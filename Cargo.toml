[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
default_trait_access = "allow"
needless_pass_by_value = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
format_in_format_args = "allow"
explicit_iter_loop = "allow"
return_self_not_must_use = "allow"
unnecessary_wraps = "allow"
option_if_let_else = "allow"
items_after_statements = "allow"
single_match_else = "allow"
if_not_else = "allow"
redundant_closure_for_method_calls = "allow"
manual_find = "allow"
needless_lifetimes = "allow"
struct_excessive_bools = "allow"
missing_fields_in_debug = "allow"
match_same_arms = "allow"
collapsible_match = "allow"
format_push_string = "allow"
redundant_else = "allow"
derivable_impls = "allow"
only_used_in_recursion = "allow"
needless_continue = "allow"
elidable_lifetime_names = "allow"
map_unwrap_or = "allow"
needless_raw_string_hashes = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
incremental = false

# This workspace links a large 20-language compiler graph. Keeping incremental
# object generations for ordinary development causes old frontend-ABI and
# rustflag variants to accumulate without bound. Cargo still reuses complete,
# unchanged crate artifacts; intentional debugger sessions can opt back in
# with CARGO_PROFILE_DEV_DEBUG=2 and CARGO_PROFILE_DEV_INCREMENTAL=true.
[profile.dev]
debug = 0
incremental = false

# The workspace has hundreds of standalone integration-test executables, each
# linking the complete 20-language analysis graph. Embedded debug information
# and per-edit incremental generations make those artifacts machine-scale.
# Panic locations and test names remain available without DWARF; use
# `CARGO_PROFILE_TEST_DEBUG=2` and `CARGO_PROFILE_TEST_INCREMENTAL=true` only
# for an intentional debugger session. Exhaustive correctness uses this
# profile; ThinLTO release tests are reserved for measured production SLOs.
[profile.test]
debug = 0
incremental = false
# Integration tests execute the compiler and CLI thousands of times. A small
# amount of optimization keeps those semantic checks representative without
# paying release ThinLTO costs or multiplying cold CI runtime on Windows.
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
