[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/hash",
    "crates/diagnostics",
    "crates/vfs",
    "crates/parser",
    "crates/lang_api",
    "crates/index",
    "crates/resolve",
    "crates/cfg",
    "crates/callgraph",
    "crates/taint",
    "crates/abstract_interp",
    "crates/trace",
    "crates/db",
    "crates/workspace",
    "crates/inspect",
    "crates/browse",
    "crates/retrieval",
    "crates/sdk",
    "crates/testkit",
    "crates/conformance",
    "crates/lang_c",
    "crates/lang_cpp",
    "crates/lang_csharp",
    "crates/lang_scala",
    "crates/lang_rust",
    "crates/lang_go",
    "crates/lang_java",
    "crates/lang_kotlin",
    "crates/lang_swift",
    "crates/lang_javascript",
    "crates/lang_typescript",
    "crates/lang_php",
    "crates/lang_python",
    "crates/lang_perl",
    "crates/lang_ruby",
    "crates/lang_dart",
    "crates/lang_objc",
    "crates/lang_lua",
    "crates/lang_elixir",
    "crates/lang_erlang",
    "crates/adapters",
    "crates/cli",
    "crates/security",
    "security-patterns",
    "crates/factstore",
    "crates/idg",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/gromhacks/bonsai-ninja"
homepage = "https://github.com/gromhacks/bonsai-ninja"
readme = "README.md"
keywords = ["static-analysis", "code-intelligence", "security", "tree-sitter", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
description = "Local 20-language code intelligence and security analysis engine"

[workspace.dependencies]
# External parsing / tree-sitter
tree-sitter = "0.26"
# Pin the parser delivery contract: the release gate verifies that this exact
# version publishes every grammar and native bundle in our support matrix.
tree-sitter-language-pack = { version = "=1.15.0", default-features = false, features = ["dynamic-loading", "download"] }

# Shared infra
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained, API-compatible continuation of the deprecated `serde_yaml`
# crate. The workspace alias keeps call sites stable while rulepack
# conformance tests guard parsing behavior.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.11"
ahash = { version = "0.8", features = ["serde"] }
hashbrown = "0.16.1"
parking_lot = "0.12"
smallvec = { version = "1", features = ["union", "serde"] }
indexmap = "2"
once_cell = "1"
bitflags = "2"
rayon = "1"
regex = "1"
regex-syntax = "0.8"
rmp-serde = "1.3"
zstd = "0.13"
crossbeam-channel = "0.5"
fs2 = "0.4"
ignore = "0.4"
lru = "0.18.2"
tempfile = "3"
dirs = "6"
mimalloc = { version = "0.1.52", features = ["v2"] }
owo-colors = "4"
comfy-table = { version = "8", features = ["custom_styling"] }

# CLI / frontends
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18.6"

# Testing
pretty_assertions = "1"
insta = { version = "1", features = ["yaml", "json"] }
criterion = { version = "0.5", features = ["html_reports"] }
jsonschema = { version = "0.49.9", default-features = false }

# Workspace crates
bonsai_common = { package = "bonsai-ninja-common", version = "=0.2.2", path = "crates/common" }
bonsai_hash = { package = "bonsai-ninja-hash", version = "=0.2.2", path = "crates/hash" }
bonsai_diagnostics = { package = "bonsai-ninja-diagnostics", version = "=0.2.2", path = "crates/diagnostics" }
bonsai_vfs = { package = "bonsai-ninja-vfs", version = "=0.2.2", path = "crates/vfs" }
bonsai_parser = { package = "bonsai-ninja-parser", version = "=0.2.2", path = "crates/parser" }
bonsai_lang_api = { package = "bonsai-ninja-lang-api", version = "=0.2.2", path = "crates/lang_api" }
bonsai_index = { package = "bonsai-ninja-index", version = "=0.2.2", path = "crates/index" }
