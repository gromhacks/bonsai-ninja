bonsai_inspect = { package = "bonsai-ninja-inspect", version = "=0.2.2", path = "crates/inspect" }
bonsai_browse = { package = "bonsai-ninja-browse", version = "=0.2.2", path = "crates/browse" }
bonsai_retrieval = { package = "bonsai-ninja-retrieval", version = "=0.2.2", path = "crates/retrieval" }
bonsai_sdk = { package = "bonsai-ninja-sdk", version = "=0.2.2", path = "crates/sdk" }
bonsai_testkit = { package = "bonsai-ninja-testkit", version = "=0.2.2", path = "crates/testkit" }
