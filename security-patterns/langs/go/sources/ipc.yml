# Go IPC / subprocess-output sources.
- id: go.ipc.cmd_stdoutpipe
  enabled: true
  language: go
  trust: ipc
  tag: ipc-input
  packages: ["os/exec"]
  match:
    kind: call
    callee:
      regex: "\\.StdoutPipe$"
  constraints:
  - receiver_type_in: [exec.Cmd]
  - max_args: 0
  match_examples:
  - name: exec command stdout pipe
    code: |
      package main
      import "os/exec"
      func example() {
        cmd := exec.Command("id")
        _, _ = cmd.StdoutPipe()
      }
    expect_match_text: [cmd.StdoutPipe]
  - name: same stdout pipe method on local receiver negative
    code: |
      package main
      import "os/exec"
      type localCommand struct{}
      func (localCommand) StdoutPipe() (any, error) { return nil, nil }
      func example(cmd localCommand) { _, _ = cmd.StdoutPipe() }
    expect_no_match: true
  description: "exec.Cmd.StdoutPipe() - subprocess stdout; exact rulepack return typing and the compiler-proven receiver exclude same-named local methods."

