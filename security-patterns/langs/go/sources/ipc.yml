# Go IPC / subprocess-output sources.
- id: go.ipc.cmd_stdoutpipe
  enabled: true
  language: go
  trust: ipc
  tag: ipc-input
  packages: ["os/exec"]
  match:
    kind: call
    callee:
      regex: "\\.StdoutPipe$"
  match_examples:
  - name: generated direct match
    code: |
      import "os/exec"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        obj.StdoutPipe(target)
      }
  description: "exec.Cmd.StdoutPipe — subprocess stdout; tail-match across local receiver names like `cmd.StdoutPipe()`."

