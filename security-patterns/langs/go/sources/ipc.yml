# Go IPC / subprocess-output sources.
- id: go.ipc.cmd_stdoutpipe
  enabled: true
  language: go
  trust: ipc
  tag: ipc-input
  packages: ["os/exec"]
  match:
    kind: call
    callee:
      regex: "\\.StdoutPipe$"
  constraints:
  - max_args: 0
  match_examples:
  - name: exec command stdout pipe
    code: |
      package main
      import "os/exec"
      func example() {
        cmd := exec.Command("id")
        _, _ = cmd.StdoutPipe()
      }
    expect_match_text: [cmd.StdoutPipe]
  description: "exec.Cmd.StdoutPipe() - subprocess stdout; receiver-agnostic method regex gated to os/exec and zero arguments."

