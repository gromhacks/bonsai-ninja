# Go hardware / physical-input sources (GPIO, ADC, I2C register reads).
- id: go.physical.digital_read
  enabled: true
  language: go
  trust: physical
  tag: hw-input
  category: hardware-io
  packages: ["gobot.io/x/gobot", "github.com/stianeikeland/go-rpio"]
  match:
    kind: call
    callee:
      regex: "\\.DigitalRead$"
  match_examples:
  - name: gobot digital read
    code: |
      package main
      import "gobot.io/x/gobot"
      func example(adaptor gobot.DigitalReader) {
        _, _ = adaptor.DigitalRead("11")
      }
    expect_match_text: [adaptor.DigitalRead]
  description: "DigitalRead - physical GPIO pin state from attached hardware."

