# Go cloud-event / serverless handler sources.
- id: go.aws.lambda_event
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: go
  trust: service
  tag: event-input
  category: event-input
  payload_types: [event, json]
  frameworks: [aws-lambda]
  packages: ["github.com/aws/aws-lambda-go"]
  match:
    kind: param
    target:
      name: request
  description: "Disabled - `request` plus a workspace Lambda dependency does not prove that the function is passed to lambda.Start. Re-enable when callback-registration facts bind the handler parameter to the runtime call."

- id: go.aws.lambda_event_alt
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  trust: service
  tag: event-input
  category: event-input
  payload_types: [event, json]
  frameworks: [aws-lambda]
  packages: ["github.com/aws/aws-lambda-go"]
  match:
    kind: param
    target:
      name: event
  description: "Disabled - merged into go.aws.lambda_event (bare `event` collides with many other handler shapes)."
