# Go queue / broker message sources.
- id: go.kafka.consumer_message
  enabled: true
  language: go
  trust: service
  tag: queue-input
  category: queue-input
  payload_types: [event]
  packages:
  - "github.com/Shopify/sarama"
  - "github.com/segmentio/kafka-go"
  - "github.com/confluentinc/confluent-kafka-go"
  match:
    kind: read
    target:
      name: Value
      receiver_type_in: [ConsumerMessage, Message]
  match_examples:
  - name: sarama kafka consumer message
    code: |
      package main
      import "github.com/Shopify/sarama"
      func handle(msg *sarama.ConsumerMessage) {
        _ = msg.Value
      }
    expect_match_text: [msg.Value]
  - name: kafka payload binding name is irrelevant
    code: |
      package main
      import "github.com/segmentio/kafka-go"
      func handle(record kafka.Message) { _ = record.Value }
    expect_match_text: [record.Value]
  - name: unrelated value field negative
    code: |
      package main
      import "github.com/segmentio/kafka-go"
      type Setting struct{ Value []byte }
      func handle(setting Setting) { _ = setting.Value }
    expect_no_match: true
  description: "Kafka ConsumerMessage.Value / Message.Value on compiler-typed broker messages; the local binding name is irrelevant."

- id: go.amqp.delivery_body
  enabled: true
  language: go
  trust: service
  tag: queue-input
  category: queue-input
  payload_types: [event]
  packages: ["github.com/rabbitmq/amqp091-go", "github.com/streadway/amqp"]
  match:
    kind: read
    target:
      name: Body
      receiver_type_in: [Delivery]
  match_examples:
  - name: amqp delivery body
    code: |
      package main
      import amqp "github.com/rabbitmq/amqp091-go"
      func handle(delivery amqp.Delivery) {
        _ = delivery.Body
      }
    expect_match_text: [delivery.Body]
  - name: amqp arbitrary binding
    code: |
      package main
      import amqp "github.com/rabbitmq/amqp091-go"
      func handle(event amqp.Delivery) { _ = event.Body }
    expect_match_text: [event.Body]
  - name: unrelated body field negative
    code: |
      package main
      import amqp "github.com/rabbitmq/amqp091-go"
      type Envelope struct{ Body []byte }
      func handle(event Envelope) { _ = event.Body }
    expect_no_match: true
  description: "AMQP Delivery.Body on a compiler-typed broker delivery; the local binding name is irrelevant."

