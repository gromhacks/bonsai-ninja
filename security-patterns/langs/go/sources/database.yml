# Go database-origin sources.
- id: go.sql.rows_scan
  enabled: true
  language: go
  trust: database
  tag: db-input
  packages: ["database/sql"]
  match:
    kind: call
    callee:
      regex: "\\.Scan$"
  constraints:
  - receiver_type_in: [Rows, Row]
  - min_args: 1
  taint_semantics:
    source_output_args_from: 0
  match_examples:
  - name: sql rows scan
    code: |
      package main
      import "database/sql"
      func example(rows *sql.Rows) {
        var name string
        _ = rows.Scan(&name)
      }
    expect_match_text: [rows.Scan]
  - name: bufio scanner scan negative
    code: |
      package main
      import "bufio"
      func example(s *bufio.Scanner) {
        _ = s.Scan()
      }
    expect_no_match: true
  description: "sql.Rows.Scan / Row.Scan reads database values into every destination argument beginning at index 0. Receiver typing and `min_args: 1` reject bufio.Scanner.Scan()."

- id: go.gorm.scan
  enabled: true
  language: go
  trust: database
  tag: db-input
  packages: ["gorm.io/gorm"]
  match:
    kind: call
    callee:
      regex: "\\.Scan$"
  constraints:
  - receiver_type_in: [DB]
  - min_args: 1
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: gorm scan destination
    code: |
      package main
      import "gorm.io/gorm"
      func example(db *gorm.DB, out any) { _ = db.Scan(out) }
    expect_match_text: [db.Scan]
  - name: unrelated scan receiver negative
    code: |
      package main
      import "gorm.io/gorm"
      type Scanner struct{}
      func (Scanner) Scan(any) error { return nil }
      func example(s Scanner, out any) { _ = s.Scan(out) }
    expect_no_match: true
  description: "GORM DB.Scan(dest) populates destination argument 0 from database rows; the receiver-type constraint distinguishes it from other Scan methods."

- id: go.gorm.first
  enabled: true
  language: go
  trust: database
  tag: db-input
  packages: ["gorm.io/gorm"]
  match:
    kind: call
    callee:
      regex: "\\.First$"
  constraints:
  - receiver_type_in: [DB]
  - min_args: 1
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: gorm first
    code: |
      package main
      import "gorm.io/gorm"
      func example(db *gorm.DB, out any) {
        _ = db.First(out)
      }
    expect_match_text: [db.First]
  - name: zero arg first negative
    code: |
      package main
      import "gorm.io/gorm"
      func example(db *gorm.DB) {
        _ = db.First()
      }
    expect_no_match: true
  description: "GORM DB.First(&model, ...) - populates `model` from a DB row; second-order taint origin when row data was attacker-supplied. `min_args: 1` requires the destination argument."

