- id: go.pgx.row_scan
  enabled: true
  language: go
  trust: database
  tag: db-input
  packages: ["github.com/jackc/pgx/v4", "github.com/jackc/pgx/v5"]
  match:
    kind: call
    callee:
      regex: "\\.Scan$"
  constraints:
  - receiver_type_in: [Row, Rows]
  - min_args: 1
  taint_semantics:
    source_output_args_from: 0
  match_examples:
  - name: pgx row variadic destinations
    code: |
      package main
      import "github.com/jackc/pgx/v5"
      func read(row pgx.Row) { var name string; var age int; _ = row.Scan(&name, &age) }
    expect_match_text: [row.Scan]
  - name: unrelated scan receiver negative
    code: |
      package main
      import "github.com/jackc/pgx/v5"
      type Decoder struct{}
      func (Decoder) Scan(...any) error { return nil }
      func read(decoder Decoder, out any) { _ = decoder.Scan(out) }
    expect_no_match: true
  description: "pgx Row/Rows.Scan writes database columns into every variadic destination beginning at argument 0."

- id: go.pgx.rows_values
  enabled: true
  language: go
  trust: database
  tag: db-input
  payload_types: [text, binary]
  packages: ["github.com/jackc/pgx/v4", "github.com/jackc/pgx/v5"]
  match:
    kind: call
    callee:
      regex: "\\.Values$"
  constraints:
  - receiver_type_in: [Rows]
  - max_args: 0
  match_examples:
  - name: pgx current row values
    code: |
      package main
      import "github.com/jackc/pgx/v5"
      func read(rows pgx.Rows) { values, _ := rows.Values(); _ = values }
    expect_match_text: [rows.Values]
  - name: unrelated values receiver negative
    code: |
      package main
      import "github.com/jackc/pgx/v5"
      type Form struct{}
      func (Form) Values() []string { return nil }
      func read(form Form) { _ = form.Values() }
    expect_no_match: true
  description: "pgx Rows.Values returns the decoded values of the current database result row."
