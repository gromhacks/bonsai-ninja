# Go database-origin sources.
- id: go.sql.rows_scan
  enabled: true
  language: go
  trust: database
  tag: db-input
  packages: ["database/sql"]
  match:
    kind: call
    callee:
      regex: "\\.Scan$"
  constraints:
  - min_args: 1
  match_examples:
  - name: sql rows scan
    code: |
      package main
      import "database/sql"
      func example(rows *sql.Rows) {
        var name string
        _ = rows.Scan(&name)
      }
    expect_match_text: [rows.Scan]
  - name: bufio scanner scan negative
    code: |
      package main
      import "bufio"
      func example(s *bufio.Scanner) {
        _ = s.Scan()
      }
    expect_no_match: true
  description: "sql.Rows.Scan / Row.Scan - reads DB row values into destination vars. `min_args: 1` rejects the zero-arg `bufio.Scanner.Scan()` iterator decoy that shares the `.Scan$` tail."

- id: go.gorm.scan
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  trust: database
  tag: db-input
  packages: ["gorm.io/gorm"]
  match:
    kind: call
    callee:
      regex: "\\.Scan$"
  description: "Disabled - GORM DB.Scan(&dest) reads DB row values; bare `.Scan$` already matches via go.sql.rows_scan, which has the same call shape."

- id: go.gorm.first
  enabled: true
  language: go
  trust: database
  tag: db-input
  packages: ["gorm.io/gorm"]
  match:
    kind: call
    callee:
      regex: "\\.First$"
  constraints:
  - min_args: 1
  match_examples:
  - name: gorm first
    code: |
      package main
      import "gorm.io/gorm"
      func example(db *gorm.DB, out any) {
        _ = db.First(out)
      }
    expect_match_text: [db.First]
  - name: zero arg first negative
    code: |
      package main
      import "gorm.io/gorm"
      func example(db *gorm.DB) {
        _ = db.First()
      }
    expect_no_match: true
  description: "GORM DB.First(&model, ...) - populates `model` from a DB row; second-order taint origin when row data was attacker-supplied. `min_args: 1` requires the destination argument."

- id: go.gorm.find
  enabled: true
  language: go
  trust: database
  tag: db-input
  packages: ["gorm.io/gorm"]
  match:
    kind: call
    callee:
      regex: "\\.Find$"
  constraints:
  - min_args: 1
  match_examples:
  - name: gorm find
    code: |
      package main
      import "gorm.io/gorm"
      func example(db *gorm.DB, out any) {
        _ = db.Find(out)
      }
    expect_match_text: [db.Find]
  - name: zero arg find negative
    code: |
      package main
      import "gorm.io/gorm"
      func example(db *gorm.DB) {
        _ = db.Find()
      }
    expect_no_match: true
  description: "GORM DB.Find(&models, ...) - populates a slice of models from DB rows; second-order taint origin. `min_args: 1` requires the destination argument."
