- id: go.sqlx.get
  enabled: true
  language: go
  trust: database
  tag: db-input
  packages: ["github.com/jmoiron/sqlx"]
  match:
    kind: call
    callee:
      regex: "\\.Get$"
  constraints:
  - receiver_type_in: [DB, Tx]
  - min_args: 2
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: sqlx get destination
    code: |
      package main
      import "github.com/jmoiron/sqlx"
      func example(db *sqlx.DB, out any) { _ = db.Get(out, "SELECT name FROM users") }
    expect_match_text: [db.Get]
  - name: unrelated get receiver negative
    code: |
      package main
      import "github.com/jmoiron/sqlx"
      type Cache struct{}
      func (Cache) Get(any, string) error { return nil }
      func example(c Cache, out any) { _ = c.Get(out, "key") }
    expect_no_match: true
  description: "sqlx DB/Tx.Get(dest, query, ...) populates destination argument 0 from a database row."

