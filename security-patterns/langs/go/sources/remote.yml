      func handler(c *fiber.Ctx) {
        _ = c.FormValue("name")
      }
    expect_match_text: [c.FormValue]
  description: "FormValue(key) - attacker-controlled form/query value. Covers net/http, echo, and fiber FormValue helpers (same call shape)."
- id: go.nethttp.postform_value
