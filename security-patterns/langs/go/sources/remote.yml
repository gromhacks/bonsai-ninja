# Go HTTP / RPC sources. Receiver-agnostic regex rules are package-gated
# and, where needed, constrained by adapter-emitted receiver types so
# real handlers match without broad tails.

# --- Archive entry sources -------------------------------------------
- id: go.archive.tar_reader_next_header
  enabled: true
  language: go
  trust: remote
  tag: archive-input
  category: archive-input
  payload_types: [path]
  packages: [archive/tar]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      regex: "\\.Next$"
  match_examples:
  - name: tar reader next header
    code: |
      package main
      import "archive/tar"
      func next(tr *tar.Reader) {
        header, _ := tr.Next()
        _ = header.Name
      }
    expect_match_text: [tr.Next]
  description: "tar.Reader.Next() - returns archive-controlled header metadata. Taint the returned header so Zip Slip is reported only when header.Name reaches a path open/write sink."

# --- net/http stdlib --------------------------------------------------
- id: go.nethttp.request_param
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: go
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query, json, form, path, header, cookie]
  frameworks: [nethttp, gin, echo, fiber, chi, gorilla]
  packages: ["net/http", "github.com/gin-gonic/gin", "github.com/labstack/echo", "github.com/gofiber/fiber", "github.com/go-chi/chi", "github.com/gorilla/mux"]
  manifests: [go.mod]
  lockfiles: [go.sum]
  match:
    kind: param
    target:
      name: r
  description: "Disabled - bare `r` parameter matches non-request helpers; needs type-aware `*http.Request` parameter matching."
- id: go.nethttp.request_named
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: go
  trust: remote
  tag: http-input
  category: http-input
  packages: ["net/http"]
  match:
    kind: param
    target:
      name: req
  description: "Disabled - bare `req` parameter matches non-request helpers; needs type-aware `*http.Request` parameter matching."
