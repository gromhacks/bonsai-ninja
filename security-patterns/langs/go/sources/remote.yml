  language: go
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [form]
  frameworks: [nethttp, echo, fiber]
  packages: ["net/http", "github.com/labstack/echo", "github.com/gofiber/fiber"]
  match:
    kind: call
    callee:
      regex: "\\.FormValue$"
  match_examples:
  - name: net/http form value
    code: |
      package main
      import "net/http"
      func handler(r *http.Request) {
        _ = r.FormValue("name")
      }
