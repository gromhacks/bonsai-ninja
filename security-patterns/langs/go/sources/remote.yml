- id: go.nethttp.url_query
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: go.nethttp.query_value_get
  language: go
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query]
  packages: ["net/http"]
  match:
    kind: call
    callee:
      attribute: [URL, Query]
  match_examples:
  - name: generated direct match
    code: |
      import "net/http"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        URL.Query(target)
      }
  description: "Disabled - Query() exposes the url.Values container; go.nethttp.query_value_get models concrete string reads and avoids double-counting chained Query().Get expressions."
  imports:
  - net
- id: go.nethttp.query_value_get
  enabled: true
  language: go
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query]
  packages: ["net/http"]
  match:
    kind: call
    callee:
      regex: "\\.URL\\.Query\\(\\)\\.Get$|\\.Query\\(\\)\\.Get$"
  match_examples:
  - name: net/http query get
    code: |
      package main
      import "net/http"
      func handler(r *http.Request) {
        _ = r.URL.Query().Get("next")
      }
    expect_match_text: [r.URL.Query().Get]
  description: "r.URL.Query().Get(key) - attacker-controlled query parameter value."
