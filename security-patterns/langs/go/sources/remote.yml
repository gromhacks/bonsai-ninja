# --- GraphQL ----------------------------------------------------------
- id: go.graphql.resolveparams_args
  enabled: true
  language: go
  trust: remote
  tag: graphql-input
  payload_types: [json, graphql]
  packages: ["github.com/graphql-go/graphql", "github.com/graph-gophers/graphql-go", "github.com/99designs/gqlgen/graphql"]
  match:
    kind: read
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*\\.Args$"
      receiver_type_in: [ResolveParams]
  match_examples:
  - name: graphql resolve params args
    code: |
      package main
      import "github.com/graphql-go/graphql"
      func resolve(p graphql.ResolveParams) any {
        return p.Args["id"]
      }
    expect_match_text: [p.Args]
  - name: graphql arbitrary var resolve params args
    code: |
      package main
      import "github.com/graphql-go/graphql"
      func resolve(rp graphql.ResolveParams) any {
        return rp.Args["id"]
      }
    expect_match_text: [rp.Args]
  - name: non graphql args helper negative
    code: |
      package main
      import "github.com/graphql-go/graphql"
      func helper(rp map[string]any) any {
        return rp.Args
      }
    expect_no_match: true
  description: "graphql ResolveParams.Args - resolver arguments supplied by the client query. The receiver type gate avoids depending on local variable names."

- id: go.graphql.gqlgen_fieldcontext_args
  enabled: true
  language: go
  trust: remote
  tag: graphql-input
  payload_types: [json, graphql]
  frameworks: [gqlgen]
  packages: ["github.com/99designs/gqlgen/graphql"]
  match:
    kind: read
    target:
      regex: "^(fc|fieldContext|graphql\\.GetFieldContext\\([^)]*\\))\\.Args$"
  match_examples:
  - name: gqlgen field context args
    code: |
      package main
      import (
        "context"
        "github.com/99designs/gqlgen/graphql"
      )
      func resolve(ctx context.Context) any {
        fc := graphql.GetFieldContext(ctx)
        return fc.Args["id"]
      }
    expect_match_text: [fc.Args]
  description: "gqlgen graphql.FieldContext.Args - resolver argument map supplied by the client query. Direct generated resolver method parameters are not type-constrained enough for a safe global param rule."
