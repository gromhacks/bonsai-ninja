  tag: http-input
  category: http-input
  payload_types: [file, form]
  packages: ["net/http", "mime/multipart"]
  match:
    kind: call
    callee:
      regex: "\\.(FormFile|MultipartReader|ParseMultipartForm)$"
  constraints:
  - receiver_type_in: [Request]
  match_examples:
  - name: net/http uploaded file
    code: |
      package main
      import "net/http"
      func upload(r *http.Request) {
        file, header, err := r.FormFile("file")
        _, _, _ = file, header, err
      }
    expect_match_text: [r.FormFile]
  - name: net/http multipart reader
    code: |
      package main
      import "net/http"
      func upload(req *http.Request) {
        reader, err := req.MultipartReader()
        _, _ = reader, err
      }
    expect_match_text: [req.MultipartReader]
  description: "net/http multipart upload APIs - file parts, headers, and FileHeader.Filename are client-controlled."
- id: go.multipart.fileheader_filename
  enabled: true
  language: go
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [file, path]
  packages: ["mime/multipart"]
  match:
    kind: read
    target:
      name: Filename
  match_examples:
  - name: multipart filename read
    code: |
      package main
      import "mime/multipart"
      func upload(fh *multipart.FileHeader) string {
        return fh.Filename
      }
    expect_match_text: [Filename]
  description: "multipart.FileHeader.Filename - client-supplied upload filename; treat as tainted path/name input."
- id: go.nethttp.body_read
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [text]
  packages: ["net/http"]
  match:
    kind: read
    target:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.Body$"
  match_examples:
  - name: net/http request body read
    code: |
      package main
      import "net/http"
      func handler(r *http.Request) {
        _ = r.Body
      }
    expect_match_text: [r.Body]
  - name: net/http alternate request body read
    code: |
      package main
      import "net/http"
      func handler(req *http.Request) {
        _ = req.Body
      }
    expect_match_text: [req.Body]
  description: "Disabled - Body reads expose the stream object; go.nethttp.io_readall_request_body models the materialized request bytes and avoids double-counting Body reads passed to ReadAll."
- id: go.nethttp.io_readall_request_body
  enabled: true
  language: go
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [text]
  frameworks: [nethttp, echo]
  packages: ["net/http", "io", "github.com/labstack/echo"]
  match:
    kind: call
    callee:
      attribute: [io, ReadAll]
  constraints:
  - min_args: 1
  - arg_matches_regex:
      index: 0
      regex: "^(r|req|request)\\.Body$|\\.Request\\(\\)\\.Body$"
  match_examples:
  - name: net/http body readall
    code: |
      package main
      import (
        "io"
        "net/http"
      )
      func handler(r *http.Request) {
        _, _ = io.ReadAll(r.Body)
      }
    expect_match_text: [io.ReadAll]
  - name: echo request body readall
    code: |
      package main
      import (
        "io"
        "github.com/labstack/echo"
      )
      func handler(c echo.Context) {
        _, _ = io.ReadAll(c.Request().Body)
      }
    expect_match_text: [io.ReadAll]
  - name: chi request body readall
    code: |
      package main
      import (
        "io"
        "net/http"
      )
      func handler(w http.ResponseWriter, r *http.Request) {
        _, _ = io.ReadAll(r.Body)
      }
    expect_match_text: [io.ReadAll]
  - name: net/http body readall negative constraint boundary
    code: "package main\nimport (\n  \"io\"\n  \"net/http\"\n)\nfunc handler(r *http.Request) {\n  _, _ = io.ReadAll()\n}\n"
    expect_no_match: true
  description: "io.ReadAll over request Body - returned bytes are attacker-controlled request body content."

- id: go.net.conn_read
  enabled: true
  language: go
  trust: remote
  tag: network-input
  category: network-input
  payload_types: [binary]
  packages: ["net"]
  match:
    kind: call
    callee:
      regex: "\\.Read$"
  constraints:
  - receiver_type_in: [Conn, TCPConn, UDPConn]
  - min_args: 1
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: net conn read output buffer
    code: |
      package main
      import "net"
      func handle(conn net.Conn) {
        buf := make([]byte, 1024)
        _, _ = conn.Read(buf)
      }
    expect_match_text: [conn.Read]
  - name: unrelated read receiver negative
    code: |
      package main
      import "net"
      type localReader struct{}
      func (r localReader) Read(buf []byte) (int, error) { return 0, nil }
      func handle(r localReader) {
        buf := make([]byte, 1024)
        _, _ = r.Read(buf)
      }
    expect_no_match: true
  description: "net.Conn.Read(buf) / TCPConn.Read / UDPConn.Read - network peer bytes taint the caller-supplied buffer; receiver-type gate avoids treating every .Read method as remote input."

