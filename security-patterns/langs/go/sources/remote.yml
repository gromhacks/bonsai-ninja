  - receiver_type_in: [Context, Ctx]
  match_examples:
  - name: fiber form file
    code: |
      package main
      import "github.com/gofiber/fiber/v2"
      func handler(c *fiber.Ctx) {
        _, _ = c.FormFile("file")
      }
    expect_match_text: [c.FormFile]
  - name: fiber multipart form
    code: |
      import "github.com/gofiber/fiber"
      package main
      import "github.com/gofiber/fiber/v2"
      func handler(ctx *fiber.Ctx) {
        _, _ = ctx.MultipartForm()
      }
    expect_match_text: [ctx.MultipartForm]
  description: "fiber form-file, query parser, and upload helpers - attacker-controlled body/form/file data. FormValue is owned by the shared go.nethttp.form_value call-shape rule."

