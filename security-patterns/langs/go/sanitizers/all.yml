- id: go.sanitizer.filepath_clean
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: path-sanitize
  packages: ["path/filepath"]
  match:
    kind: call
    callee:
      attribute: [filepath, Clean]
  description: "Disabled - path normalisation (normpath / canonical / clean / realpath / expand_path) does NOT prevent directory
    traversal. `/var/www/../etc/passwd` canonicalises to `/etc/passwd`, which is still outside the intended root. A real sanitizer
    must be normalisation PLUS a containment check (startswith / strip_prefix / basename that drops the directory component).
    Marking these as sanitizers produced false negatives on attacker-controlled paths."
- id: go.sanitizer.filepath_islocal
  enabled: true
  language: go
  tag: path-sanitize
  packages: ["path/filepath"]
  match:
    kind: call
    callee:
      attribute: [filepath, IsLocal]
  constraints:
  - min_args: 1
  match_examples:
  - name: filepath is local guard
    code: |
      package main
      import "path/filepath"
      func safe(name string) bool {
        return filepath.IsLocal(name)
      }
    expect_match_text: [filepath.IsLocal]
  description: "filepath.IsLocal(path) - lexical path validation that rejects absolute paths and paths escaping via `..`;
    useful before joining under a fixed root."
- id: go.sanitizer.path_containment_hasprefix
  enabled: false
  language: go
  tag: path-sanitize
  packages: [strings]
  match:
    kind: call
    callee:
      attribute: [strings, HasPrefix]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "(clean|abs|full|joined|path|target|candidate)"
  - arg_matches_regex:
      index: 1
      regex: "(root|base|baseDir|allowedDir|uploadRoot)"
  match_examples:
  - name: cleaned path containment guard
    code: |
      package main
      import (
        "path/filepath"
        "strings"
      )
      func safe(root, name string) bool {
        joined := filepath.Clean(filepath.Join(root, name))
        return strings.HasPrefix(joined, root)
      }
    expect_match_text: [strings.HasPrefix]
  - name: cleaned path containment guard negative constraint boundary
    code: "package main\nimport (\n  \"path/filepath\"\n  \"strings\"\n)\nfunc safe(root, name string) bool {\n  joined :=
      filepath.Clean(filepath.Join(root, name))\n  return strings.HasPrefix()\n}\n"
    expect_no_match: true
  description: "Disabled - this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    strings.HasPrefix(clean/abs joined path, trusted root) - path containment check when paired with filepath.Clean/Abs/Join
    and a path separator-aware root."
  disabled_reason:
    code: over-broad
- id: go.sanitizer.filepath_rel_containment
  enabled: true
  language: go
  tag: path-sanitize
  packages: ["path/filepath"]
  match:
    kind: call
    callee:
      attribute: [filepath, Rel]
  constraints:
  - min_args: 2
  match_examples:
  - name: filepath relative containment basis
    code: |
      package main
      import "path/filepath"
      func rel(root, candidate string) (string, error) {
        return filepath.Rel(root, candidate)
      }
    expect_match_text: [filepath.Rel]
  description: "filepath.Rel(root, candidate) - containment primitive when followed by a `!strings.HasPrefix(rel, \"..\")`
    / `rel != \"..\"` guard."
