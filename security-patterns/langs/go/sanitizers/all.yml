# -- Open-redirect mitigations -------------------------------------------------
- id: go.sanitizer.url_parse_then_host_check
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: open-redirect-sanitize
  packages: [net/url]
  match:
    kind: call
    callee:
      regex: "^url\\.Parse$"
  description: "Disabled - url.Parse only normalizes; pair with .Hostname() allowlist check."

- id: go.sanitizer.gin_redirect_local
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: go
  tag: open-redirect-sanitize
  packages: ["github.com/gin-gonic/gin"]
  match:
    kind: call
    callee:
      regex: "\\.Redirect$"
  description: "Disabled - gin Context.Redirect alone is not a sanitizer. Enable with relative-path constraint."

- id: go.sanitizer.same_origin_path_hasprefix
  enabled: true
  language: go
  tag: same-origin-path
  packages: [strings]
  match:
    kind: call
    callee:
      attribute: [strings, HasPrefix]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^(path|pathname|next|returnTo|redirect|redirectTo|redirectURL|url)$"
  - arg_equals:
      index: 1
      value: "\"/\""
  match_examples:
  - name: same-origin redirect path guard
    code: |
      import "strings"
      package main

      func safeRedirect(next string) string {
        if strings.HasPrefix(next, "/") && !strings.HasPrefix(next, "//") {
          return next
        }
        return "/"
      }
    expect_match_text: [strings.HasPrefix]
  - name: same-origin redirect path guard negative constraint boundary
    code: "import \"strings\"\npackage main\n\nfunc safeRedirect(next string) string {\n  if strings.HasPrefix() && !strings.HasPrefix(next,
      \"//\") {\n    return next\n  }\n  return \"/\"\n}\n"
    expect_no_match: true
  description: "strings.HasPrefix(path, \"/\") on redirect/path variables - credits same-origin relative-path validation when
    used with a sibling `!strings.HasPrefix(path, \"//\")` network-path guard."

# -- Focused allowlist / regex / SQL binding validators -----------------------
- id: go.sanitizer.slices_contains_allowlist
  enabled: false
  language: go
  tag: allowlist-validate
  packages: [slices]
  match:
    kind: call
    callee:
      attribute: [slices, Contains]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^(allowed|allowlist|allowedValues|allowedNames|allowedRoles|allowedRoutes|allowedTargets|allowedHosts|allowedSchemes)$"
  - min_args: 2
  match_examples:
  - name: slices contains allowlist
    code: |
      import "slices"
      package main

      func ok(role string) bool {
        allowedRoles := []string{"user", "admin"}
        return slices.Contains(allowedRoles, role)
      }
    expect_match_text: [slices.Contains]
  - name: url host allowlist
    code: |
      package main
      import (
        "net/url"
        "slices"
      )
      func ok(raw string) bool {
        u, _ := url.Parse(raw)
        allowedHosts := []string{"api.example.com"}
