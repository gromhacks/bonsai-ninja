# Go sanitizers. Package-qualified calls use attribute match; method
# sanitizers use receiver-agnostic regexes with package/argument gates.
- id: go.sanitizer.html_escape_string
  enabled: true
  language: go
  tag: html-encode
  packages: [html]
  match:
    kind: call
    callee:
      attribute: [html, EscapeString]
  match_examples:
  - name: generated direct match
    code: |
      import "html"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        html.EscapeString(target)
      }
    expect_match_text: [html.EscapeString]
  description: "html.EscapeString - escapes &, <, >, ', \" for HTML text context."
- id: go.sanitizer.template_html_escape
  enabled: true
  language: go
  tag: html-encode
  packages: ["html/template"]
