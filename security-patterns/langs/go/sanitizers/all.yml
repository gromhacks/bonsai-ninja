    code: |
      import "github.com/microcosm-cc/bluemonday"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        obj.Sanitize(target)
      }
    expect_match_text: [obj.Sanitize]
  - name: bluemonday sanitize no-arg negative
    code: "import \"github.com/microcosm-cc/bluemonday\"\npackage main\n\nfunc example() {\n  obj.Sanitize()\n}\n"
    expect_no_match: true
  description: "bluemonday policy.Sanitize(html) - HTML-sanitises against an allow-list. `min_args: 1` rejects 0-arg same-name decoys."
