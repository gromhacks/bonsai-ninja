  - name: generated direct match negative constraint boundary
    code: "package main\nfunc example() {\n  Cookie()\n}\n"
    expect_no_match: true
  description: 'http.Cookie{Secure: true, HttpOnly: true} - Go cookie literal with secure flags.'
