# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: go.csrf.gorilla_csrf_protect
  enabled: true
  language: go
  tag: csrf-protect
  match:
    kind: call
    callee:
      attribute: [csrf, Protect]
  match_examples:
  - name: generated direct match
    code: |
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        csrf.Protect(target)
      }
    expect_match_text: [csrf.Protect]
  description: "gorilla/csrf csrf.Protect(key, opts...) - middleware factory."
- id: go.csrf.gin_csrf_middleware
  enabled: true
  language: go
  tag: csrf-protect
  match:
    kind: call
    callee:
      attribute: [csrf, Middleware]
  match_examples:
  - name: generated direct match
    code: |
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        csrf.Middleware(target)
      }
    expect_match_text: [csrf.Middleware]
  description: "gin-csrf csrf.Middleware(opts) - Gin CSRF protection."

# Lock-acquire sanitizers (T502). Tagged `lock-acquire` so
# reviewer enumerates guarded sections; the in-scope-cleanse
# semantics handle 'while lock is held, accesses are safe'.
- id: go.lock.mutex_lock
  enabled: true
  language: go
  tag: lock-acquire
  match:
    kind: call
    callee:
      regex: "^Mutex\\.Lock$"
  match_examples:
  - name: generated direct match
    code: |
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        Mutex.Lock(target)
      }
    expect_match_text: [Mutex.Lock]
  description: "sync.Mutex.Lock() - guard for the next shared-state access."
- id: go.lock.rwmutex_lock
  enabled: true
  language: go
  tag: lock-acquire
  match:
    kind: call
    callee:
      regex: "^RWMutex\\.Lock$"
  match_examples:
  - name: generated direct match
    code: |
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        RWMutex.Lock(target)
      }
    expect_match_text: [RWMutex.Lock]
  description: "sync.RWMutex.Lock() / RLock() - read/write lock."

# Cookie-secure sanitizers (T402). Cookie-set calls with
# httpOnly + secure flags are the SAFE shape; reviewer
# enumerates with `security sanitizers --tag cookie-secure`
# and audits routes that set cookies WITHOUT them.
- id: go.cookie.http_cookie_httponly_secure
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: go.cookie.cookie_struct_secure_httponly
  language: go
  tag: cookie-secure
  match:
    kind: call
    callee:
      name: Cookie
  constraints:
  - any_arg_matches_regex: |-
      HttpOnly.*true|Secure.*true
  match_examples:
  - name: generated direct match
    code: |
      package main

      type Cookie struct { HttpOnly bool; Secure bool }
      func example() {
        _ = Cookie{HttpOnly: true, Secure: true}
      }
    expect_match_text: [Cookie]
  - name: generated direct match negative constraint boundary
    code: "package main\nfunc example() {\n  Cookie()\n}\n"
    expect_no_match: true
  description: "Disabled - duplicate of go.cookie.cookie_struct_secure_httponly; the struct-literal `new` rule is the precise
    owner for secure http.Cookie literals."

