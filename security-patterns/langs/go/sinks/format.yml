- id: go.format.fmt_printf_tainted
  enabled: true
  language: go
  tag: format-string
  severity: medium
  packages: ["fmt"]
  imports: ["fmt"]
  cwe: [CWE-134]
  match:
    kind: call
    callee:
      attribute: [fmt, Printf]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted format string
    code: |
      package main
      import "fmt"
      func handle(input string) {
        fmt.Printf(input)
      }
    expect_match_text: [fmt.Printf]
  - name: literal format negative
    code: |
      package main
      import "fmt"
      func handle() {
        fmt.Printf("%s", "safe")
      }
    expect_no_match: true
  description: "fmt.Printf with tainted format string — attacker can include extra `%s`/`%d` directives that read past the supplied arg list (Go panics on arg-count mismatch but still leaks pre-panic output)."

