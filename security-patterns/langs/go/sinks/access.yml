      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        obj.UploadBuffer(target)
      }
  description: "Disabled - UploadBuffer uploads bytes to an already-selected blob client; the object/container selector lives on the receiver construction, not the data argument."

