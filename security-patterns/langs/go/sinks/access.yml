  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      regex: "\\.NewReader$"
  match_examples:
  - name: generated direct match
    code: |
      import "cloud.google.com/go/storage"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        ObjectHandle.NewReader(target)
      }
  description: "Disabled - ObjectHandle.NewReader(ctx) reads the receiver-selected object; the object selector is constructed earlier, not passed in this call."

