- id: go.access.aws_s3_get_object
  enabled: true
  language: go
  tag: access-control
  severity: high
  packages: ["github.com/aws/aws-sdk-go/service/s3", "github.com/aws/aws-sdk-go-v2/service/s3"]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      regex: "\\.GetObject$"
  match_examples:
  - name: generated direct match
    code: |
      import "github.com/aws/aws-sdk-go/service/s3"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        obj.GetObject(target)
      }
  description: "S3 GetObject — tainted bucket/key selector reads arbitrary object data."

