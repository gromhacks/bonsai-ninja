# Go weak-crypto / weak-randomness sinks.
- id: go.crypto.md5_new
  enabled: true
  language: go
  tag: weak-crypto
  category: source-independent
  severity: low
  packages: ["crypto/md5"]
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      attribute: [md5, New]
  match_examples:
  - name: generated direct match
    code: |
      import "crypto/md5"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        md5.New(target)
      }
  description: "md5.New - MD5 is collision-broken; unsafe for integrity or password hashing."
