- id: go.queue.send_message
  enabled: true
  language: go
  tag: queue-injection
  severity: high
  packages: ["github.com/aws/aws-sdk-go/service/sqs", "github.com/aws/aws-sdk-go-v2/service/sqs", "github.com/Azure/azure-sdk-for-go/sdk/messaging/azservicebus"]
  cwe: [CWE-20]
  match:
    kind: call
    callee:
      regex: "\\.SendMessage$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      import "github.com/aws/aws-sdk-go/service/sqs"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        obj.SendMessage(target)
      }
  - name: literal send message negative
    code: |
      import "github.com/aws/aws-sdk-go/service/sqs"
      package main

      func example() {
        obj.SendMessage("safe")
      }
    expect_no_match: true
  description: "Cloud queue SendMessage - tainted queue target/body injects arbitrary broker payloads."

