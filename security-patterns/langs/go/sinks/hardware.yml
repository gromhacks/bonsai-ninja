# Go hardware-control / bus-write sinks (GPIO, PWM, I2C register writes).
- id: go.hardware.digital_write
  enabled: true
  language: go
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: ["gobot.io/x/gobot", "github.com/stianeikeland/go-rpio"]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      regex: "\\.DigitalWrite$"
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: digital write tainted pin
    code: |
      package main
      import "gobot.io/x/gobot"

      func example(target string) {
        obj.DigitalWrite(target, 1)
      }
  - name: digital write literal negative
    code: |
      package main
      import "gobot.io/x/gobot"

      func example() {
        obj.DigitalWrite("D7", 1)
      }
    expect_no_match: true
  description: "DigitalWrite(pin, value) - attacker-controlled pin or output value toggles a physical output."

