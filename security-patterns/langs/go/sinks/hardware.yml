# Go hardware-control / bus-write sinks (GPIO, PWM, I2C register writes).
- id: go.hardware.digital_write
  enabled: true
  language: go
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: ["gobot.io/x/gobot", "github.com/stianeikeland/go-rpio"]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      regex: "\\.DigitalWrite$"
  match_examples:
  - name: generated direct match
    code: |
      import "gobot.io/x/gobot"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        obj.DigitalWrite(target)
      }
  description: "DigitalWrite — tainted pin/value toggles a physical output."

