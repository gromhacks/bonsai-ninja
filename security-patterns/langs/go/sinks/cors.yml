# go CORS misconfiguration sinks (T403).
- id: go.cors.gin_cors_default
  enabled: true
  language: go
  tag: cors
  category: source-independent
  severity: medium
  packages: [github.com/gin-contrib/cors]
  cwe: [CWE-942]
  match:
    kind: call
    callee:
      attribute: [cors, Default]
  constraints:
  - arg_count: 0
  match_examples:
  - name: gin-contrib default permissive CORS policy
    code: |
      package main
      import "github.com/gin-contrib/cors"

      func example() {
        _ = cors.Default()
      }
  - name: gin-contrib explicit origin policy negative
    code: |
      package main
      import "github.com/gin-contrib/cors"

      func example() {
        _ = cors.New(cors.Config{AllowOrigins: []string{"https://app.example"}})
      }
    expect_no_match: true
  description: |-
    gin-contrib/cors cors.Default() - allows all origins.
- id: go.cors.gorilla_handlers_allow_origin_wildcard
  enabled: true
  language: go
  tag: cors
  category: source-independent
  severity: medium
  packages: [github.com/gorilla/handlers]
  cwe: [CWE-942]
  match:
    kind: call
    callee:
      attribute: [handlers, AllowedOrigins]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^\[\]string\s*\{\s*"\*"\s*\}$'
  match_examples:
  - name: gorilla handlers wildcard origin policy
    code: |
      package main
      import "github.com/gorilla/handlers"

      func example() {
        _ = handlers.AllowedOrigins([]string{"*"})
      }
  - name: gorilla handlers explicit origin policy negative
    code: |
      package main
      import "github.com/gorilla/handlers"

      func example() {
        _ = handlers.AllowedOrigins([]string{"https://app.example"})
      }
    expect_no_match: true
  description: |-
    gorilla/handlers.AllowedOrigins([]string{'*'}) - wildcard.
