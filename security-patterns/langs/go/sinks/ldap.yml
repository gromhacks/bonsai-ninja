- id: go.ldap.newsearchrequest
  enabled: true
  language: go
  tag: ldap-injection
  severity: high
  packages:
  - github.com/go-ldap/ldap
  - github.com/go-ldap/ldap/v3
  - gopkg.in/ldap.v3
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - ldap
      - NewSearchRequest
  constraints:
  - arg_tainted:
      index: 6
  match_examples:
  - name: gin query into ldap search filter
    code: "package main\nimport (\n  \"fmt\"\n  \"github.com/gin-gonic/gin\"\n  \"github.com/go-ldap/ldap/v3\"\n)\nfunc handler(c *gin.Context) {\n  user := c.Query(\"user\")\n  filter := fmt.Sprintf(\"(uid=%s)\", user)\n  _ = ldap.NewSearchRequest(\"dc=example,dc=com\", ldap.ScopeWholeSubtree, ldap.NeverDerefAliases, 0, 0, false, filter, nil, nil)\n}\n"
    expect_match_text:
    - ldap.NewSearchRequest
  - name: beego input into ldap search filter
    code: "package main\nimport (\n  \"fmt\"\n  \"github.com/go-ldap/ldap/v3\"\n)\ntype Controller struct{}\nfunc (c *Controller) GetString(name string) string { return \"\" }\nfunc handler(c *Controller) {\n  user := c.GetString(\"user\")\n  filter := fmt.Sprintf(\"(uid=%s)\", user)\n  _ = ldap.NewSearchRequest(\"dc=example,dc=com\", ldap.ScopeWholeSubtree, ldap.NeverDerefAliases, 0, 0, false, filter, []string{\"cn\", \"mail\"}, nil)\n}\n"
    expect_match_text:
    - ldap.NewSearchRequest
  - name: literal ldap search filter negative
    code: |
      package main
      import "github.com/go-ldap/ldap/v3"
      func handler() {
        attrs := []string{"cn", "mail"}
        _ = ldap.NewSearchRequest("dc=example,dc=com", ldap.ScopeWholeSubtree, ldap.NeverDerefAliases, 0, 0, false, "(uid=alice)", attrs, nil)
      }
    expect_no_match: true
  description: "ldap.NewSearchRequest — tainted Filter string argument; constant filter strings are excluded so tainted attribute-name arrays do not masquerade as LDAP filter injection."
