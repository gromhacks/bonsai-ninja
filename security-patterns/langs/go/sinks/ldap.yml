- id: go.ldap.newsearchrequest
  enabled: true
  language: go
  tag: ldap-injection
  severity: high
  packages:
  - github.com/go-ldap/ldap
  - github.com/go-ldap/ldap/v3
  - gopkg.in/ldap.v3
  cwe:
  - CWE-90
  analysis_semantics:
    character_constraint:
      required_mappings:
      - {input: '\', output: '\5c'}
      - {input: '*', output: '\2a'}
      - {input: '(', output: '\28'}
      - {input: ')', output: '\29'}
      - {input: "\0", output: '\00'}
      accepted_providers:
      - factory: {name: strings.NewReplacer}
        operation: {regex: '^[A-Za-z_][A-Za-z0-9_]*\.Replace$'}
  match:
    kind: call
    callee:
      attribute:
      - ldap
      - NewSearchRequest
  constraints:
  - arg_tainted:
      index: 6
  match_examples:
  - name: gin query into ldap search filter
    code: "package main\nimport (\n  \"fmt\"\n  \"github.com/gin-gonic/gin\"\n  \"github.com/go-ldap/ldap/v3\"\n)\nfunc handler(c *gin.Context) {\n  user := c.Query(\"user\")\n  filter := fmt.Sprintf(\"(uid=%s)\", user)\n  _ = ldap.NewSearchRequest(\"dc=example,dc=com\", ldap.ScopeWholeSubtree, ldap.NeverDerefAliases, 0, 0, false, filter, nil, nil)\n}\n"
    expect_match_text:
    - ldap.NewSearchRequest
  - name: beego input into ldap search filter
    code: |
      package main
      import (
        "fmt"
        "github.com/beego/beego/v2/server/web"
        "github.com/go-ldap/ldap/v3"
      )
      func handler(c *web.Controller) {
        user := c.GetString("user")
        filter := fmt.Sprintf("(uid=%s)", user)
        _ = ldap.NewSearchRequest("dc=example,dc=com", ldap.ScopeWholeSubtree, ldap.NeverDerefAliases, 0, 0, false, filter, []string{"cn", "mail"}, nil)
      }
    expect_match_text:
    - ldap.NewSearchRequest
  - name: comments do not shift ldap filter argument
    code: |
      package main
      import (
        "github.com/gin-gonic/gin"
        "github.com/go-ldap/ldap/v3"
      )
      func handler(c *gin.Context) {
        user := c.Query("user")
        _ = ldap.NewSearchRequest(
          "dc=example,dc=com", ldap.ScopeWholeSubtree, ldap.NeverDerefAliases, 0, 0, false,
          // Security comments are syntax trivia, not positional arguments.
          "(uid=" + user + ")", // filter sink
          []string{"cn"}, nil,
        )
      }
    expect_match_text:
    - ldap.NewSearchRequest
  - name: literal ldap search filter negative
    code: |
      package main
      import "github.com/go-ldap/ldap/v3"
      func handler() {
        attrs := []string{"cn", "mail"}
        _ = ldap.NewSearchRequest("dc=example,dc=com", ldap.ScopeWholeSubtree, ldap.NeverDerefAliases, 0, 0, false, "(uid=alice)", attrs, nil)
      }
    expect_no_match: true
  description: "ldap.NewSearchRequest - tainted Filter string argument; constant filter strings are excluded so tainted attribute-name arrays do not masquerade as LDAP filter injection."
