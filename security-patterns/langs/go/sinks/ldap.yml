- id: go.ldap.conn_search
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: ldap-injection
  severity: high
  packages:
  - github.com/go-ldap/ldap
  - github.com/go-ldap/ldap/v3
  - gopkg.in/ldap.v3
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      regex: \.Search$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      import "github.com/go-ldap/ldap"
      package main

      func example(target string) {
        name := "user"
        value := "value"
        conn.Search(target)
      }
  - name: literal ldap search request negative
    code: |
      import "github.com/go-ldap/ldap"
      package main

      func example() {
        conn.Search("constantRequest")
      }
    expect_no_match: true
  description: "Disabled: go-ldap Conn.Search accepts a typed *SearchRequest, not a filter string. Crediting whole-object
    taint duplicates the precise NewSearchRequest filter finding and can mislabel tainted non-filter fields. Filter
    construction and field-write rules own the injection boundary."
