- id: go.ldap.conn_search
  enabled: true
  language: go
  tag: ldap-injection
  severity: high
  packages:
  - github.com/go-ldap/ldap
  - github.com/go-ldap/ldap/v3
  - gopkg.in/ldap.v3
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      regex: \.Search$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      import "github.com/go-ldap/ldap"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        conn.Search(target)
      }
  - name: literal ldap search request negative
    code: |
      import "github.com/go-ldap/ldap"
      package main

      func example() {
        conn.Search("constantRequest")
      }
    expect_no_match: true
  description: "go-ldap Conn.Search(req) — tainted Filter = LDAP injection; escape with ldap.EscapeFilter."
