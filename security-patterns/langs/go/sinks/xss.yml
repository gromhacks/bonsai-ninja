- id: go.xss.fmt_fprintf_w
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: go
  tag: xss
  severity: medium
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - fmt
      - Fprintf
  description: "Disabled — generic fmt.Fprintf; enable with a Content-Type: text/html response constraint."
- id: go.xss.responsewriter_write
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: xss
  severity: medium
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      regex: \.Write$
  description: "Disabled — w.Write([]byte(tainted)); enable when response Content-Type is text/html."
- id: go.xss.fmt_fprint_html_response
  enabled: true
  language: go
  tag: xss
  severity: high
  packages:
  - fmt
  - net/http
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - fmt
      - Fprint
  match_examples:
  - name: stdlib html response fprint
    code: "package main\nimport (\n  \"fmt\"\n  \"net/http\"\n)\nfunc handler(w http.ResponseWriter, r *http.Request) {\n  body := \"<h1>\" + input + \"</h1>\"\n  w.Header()[\"Content-Type\"] = []string{\"text/html; charset=utf-8\"}\n  fmt.Fprint(w, body)\n}\n"
    expect_match_text:
    - fmt.Fprint
  description: "fmt.Fprint(w, taintedHTML) after a text/html response Content-Type — stdlib raw HTML response body without template escaping. The matcher anchors to common ResponseWriter variables; review surrounding headers for text/html."
- id: go.xss.gin_data
  enabled: true
  language: go
  tag: xss
  severity: high
  packages:
  - github.com/gin-gonic/gin
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      regex: \.Data$
  match_examples:
  - name: gin raw html data
    code: "package main\nimport \"github.com/gin-gonic/gin\"\nfunc handler(c *gin.Context, body []byte) {\n  c.Data(200, \"text/html; charset=utf-8\", body)\n}\n"
    expect_match_text:
    - c.Data
  - name: gin raw html concat data
    code: "package main\nimport \"github.com/gin-gonic/gin\"\nfunc handler(c *gin.Context, name string) {\n  c.Data(200, \"text/html\", []byte(\"<h1>\" + name + \"</h1>\"))\n}\n"
    expect_match_text:
    - c.Data
  description: "gin Context.Data(status, \"text/html...\", tainted) — writes raw HTML bytes, including concatenated response fragments, without auto-escape."
- id: go.xss.fiber_send_string
