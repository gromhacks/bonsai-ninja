  - name: buffalo render raw string literal negative
    code: |
      package main
      import (
        "github.com/gobuffalo/buffalo"
        "github.com/gobuffalo/buffalo/render"
      )
      func handler(c buffalo.Context, r *render.Engine) error {
        return c.Render(200, r.String("<h1>safe</h1>"))
      }
    expect_no_match: true
  description: "Disabled - buffalo Context.Render(status, r.String(...)) needs nested-call taint correlation so literal render strings stay quiet while attacker-controlled render strings are reported."
