- id: go.xss.html_template_html
  enabled: true
  language: go
  tag: xss
  severity: high
  packages:
  - html/template
  - github.com/labstack/echo
  - github.com/kataras/iris/v12
  cwe:
  - CWE-79
  - CWE-94
  match:
    kind: call
    callee:
      attribute:
      - template
      - HTML
  match_examples:
  - name: generated direct match
    code: |
      import "html/template"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        template.HTML(target)
      }
  description: "template.HTML(tainted) — cast opts the string out of html/template auto-escape. Direct XSS (CWE-79); also CWE-94 since the cast lets attacker text inject template directives / scripts the engine would otherwise neutralize. Merged collision aliases: go.xss.echo_html."
  aliases:
  - go.xss.echo_html
  frameworks:
  - echo
  - iris
