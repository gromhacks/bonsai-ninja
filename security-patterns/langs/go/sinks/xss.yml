- id: go.xss.fmt_fprint_html_response
  enabled: true
  language: go
  tag: xss
  severity: high
  packages:
  - fmt
  - net/http
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - fmt
      - Fprint
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: stdlib html response fprint
    code: "package main\nimport (\n  \"fmt\"\n  \"net/http\"\n)\nfunc handler(w http.ResponseWriter, r *http.Request, input string) {\n  body := \"<h1>\" + input + \"</h1>\"\n  w.Header()[\"Content-Type\"] = []string{\"text/html; charset=utf-8\"}\n  fmt.Fprint(w, body)\n}\n"
    expect_match_text:
    - fmt.Fprint
  - name: stdlib html response fprint literal negative
    code: |
      package main
      import (
        "fmt"
        "net/http"
      )
      func handler(w http.ResponseWriter, r *http.Request) {
        w.Header()["Content-Type"] = []string{"text/html; charset=utf-8"}
        fmt.Fprint(w, "<h1>safe</h1>")
      }
    expect_no_match: true
  description: "fmt.Fprint(w, taintedHTML) after a text/html response Content-Type - stdlib raw HTML response body without template escaping. The matcher anchors to common ResponseWriter variables; review surrounding headers for text/html."
- id: go.xss.gin_data
  enabled: true
  language: go
  tag: xss
  severity: high
  packages:
  - github.com/gin-gonic/gin
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      regex: \.Data$
  constraints:
  - arg_tainted:
      index: 2
  - arg_matches_regex:
      index: 1
      regex: "\"(?i:(text/html|application/xhtml\\+xml|application/xml|text/xml|text/javascript|application/javascript|image/svg\\+xml))"
  match_examples:
  - name: gin raw html data
    code: "package main\nimport \"github.com/gin-gonic/gin\"\nfunc handler(c *gin.Context, body []byte) {\n  c.Data(200, \"text/html; charset=utf-8\", body)\n}\n"
    expect_match_text:
    - c.Data
  - name: gin raw html concat data
    code: "package main\nimport \"github.com/gin-gonic/gin\"\nfunc handler(c *gin.Context, name string) {\n  c.Data(200, \"text/html\", []byte(\"<h1>\" + name + \"</h1>\"))\n}\n"
    expect_match_text:
    - c.Data
  - name: gin raw html literal negative
    code: |
      package main
      import "github.com/gin-gonic/gin"
      func handler(c *gin.Context) {
        c.Data(200, "text/html; charset=utf-8", []byte("<h1>safe</h1>"))
      }
    expect_no_match: true
  - name: gin binary download negative
    code: |
      package main
      import "github.com/gin-gonic/gin"
      func handler(c *gin.Context, blob []byte) {
        c.Data(200, "application/octet-stream", blob)
      }
    expect_no_match: true
  description: "gin Context.Data(status, \"text/html...\", tainted) - writes raw HTML bytes, including concatenated response fragments, without auto-escape."
