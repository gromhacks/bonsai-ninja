  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      regex: \.SendString$
  description: "Disabled — fiber Ctx.SendString; enable when response Content-Type is text/html."
- id: go.xss.buffalo_render_string
  enabled: true
  language: go
  tag: xss
  severity: high
  frameworks:
  - buffalo
  packages:
  - github.com/gobuffalo/buffalo
  - github.com/gobuffalo/buffalo/render
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      regex: \.Render$
  match_examples:
  - name: buffalo render raw string
    code: "package main\nimport (\n  \"github.com/gobuffalo/buffalo\"\n  \"github.com/gobuffalo/buffalo/render\"\n)\nfunc handler(c buffalo.Context, r *render.Engine, name string) error {\n  return c.Render(200, r.String(\"<h1>\" + name + \"</h1>\"))\n}\n"
    expect_match_text:
    - c.Render
  description: "buffalo Context.Render(status, r.String(taintedHTML)) — renders raw string content as an HTTP response without template auto-escaping."
