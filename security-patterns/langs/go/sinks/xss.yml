- id: go.xss.raw_html_return
  enabled: true
  language: go
  tag: xss
  severity: high
  packages:
  - net/http
  - github.com/gin-gonic/gin
  - github.com/labstack/echo
  - github.com/labstack/echo/v4
  - github.com/kataras/iris/v12
  - github.com/gofiber/fiber
  - github.com/gofiber/fiber/v2
  - github.com/gobuffalo/buffalo
  cwe:
  - CWE-79
  match:
    kind: return
    target:
      regex: '(?is)<\s*(?:!doctype|html|body|script|div|span|p|a|img|svg|iframe|h[1-6]|ul|ol|li|table|form|input|textarea|button|br|hr)\b|&lt;'
  match_examples:
  - name: raw html helper return with tainted expression
    code: |
      package main
      import "net/http"
      func page(q string) string {
        _ = http.StatusOK
        return "<!doctype html><html><body><h1>" + q + "</h1></body></html>"
      }
    expect_match_text: ['"<!doctype html><html><body><h1>" + q + "</h1></body></html>"']
  - name: plain text helper return negative
    code: |
      package main
      import "net/http"
      func page(q string) string {
        _ = http.StatusOK
        return "Results for: " + q
      }
    expect_no_match: true
  description: "Return of a raw HTML response/helper body in a web package. Taint reachability is required for attacker-controlled content in the returned expression; package gating keeps ordinary string helpers out."
