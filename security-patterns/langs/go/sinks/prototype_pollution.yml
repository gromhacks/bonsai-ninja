# go prototype_pollution sinks.

# Prototype-pollution sinks (round 3 — cross-language).
- id: go.proto_pollution.mergo_map_with_body
  enabled: true
  language: go
  tag: prototype-pollution
  severity: low
  packages: [github.com/imdario/mergo]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      attribute: [mergo, MapWithOverwrite]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted merge source map
    code: |
      package main
      import "github.com/imdario/mergo"

      func merge(input map[string]any) {
        target := map[string]any{}
        mergo.MapWithOverwrite(&target, input)
      }
  - name: literal merge source negative
    code: |
      package main
      import "github.com/imdario/mergo"

      func merge() {
        target := map[string]any{}
        mergo.MapWithOverwrite(&target, map[string]any{"role": "user"})
      }
    expect_no_match: true
  description: 'mergo.MapWithOverwrite(target, attacker_map) — recursive merge with overwrite semantics; cross-bound attacker keys leak into target struct.'
