# Go JWT sinks. golang-jwt / dgrijalva-jwt / lestrrat-go/jwx / go-jose.
- id: go.jwt.golangjwt_parse_unverified
  enabled: true
  language: go
  tag: jwt
  severity: high
  packages: ["github.com/golang-jwt/jwt", "github.com/dgrijalva/jwt-go"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [jwt, ParseUnverified]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      import "github.com/golang-jwt/jwt"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        jwt.ParseUnverified(target)
      }
  - name: literal jwt negative
    code: "import \"github.com/golang-jwt/jwt\"\npackage main\n\nfunc example() {\n\
      \  target := \"tainted\"\n  name := \"user\"\n  value := \"value\"\n  jwt.ParseUnverified(target)\n\
      }\n"
    expect_no_match: true
  description: "jwt.ParseUnverified — decodes claims without signature verification;
    covers golang-jwt and legacy dgrijalva jwt-go."

- id: go.jwt.golangjwt_parse
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: go
  tag: jwt
  severity: medium
  packages: ["github.com/golang-jwt/jwt"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [jwt, Parse]
  description: "Disabled — jwt.Parse requires a keyfunc that must reject alg=none
    and pin the algorithm; enable per-project with nil/loose keyfunc constraint."

- id: go.jwt.dgrijalva_parse_unverified
  enabled: false
  disabled_reason:
    code: subsumed
  language: go
  tag: jwt
  severity: high
  packages: ["github.com/dgrijalva/jwt-go"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [jwt, ParseUnverified]
  description: "Disabled duplicate — same jwt.ParseUnverified shape is covered by
    go.jwt.golangjwt_parse_unverified with both package names."

- id: go.jwt.signing_method_none
  enabled: true
  language: go
  tag: jwt
  category: source-independent
  severity: critical
  packages: ["github.com/golang-jwt/jwt", "github.com/dgrijalva/jwt-go"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [jwt, NewWithClaims]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: SigningMethodNone
  match_examples:
  - name: generated direct match
    code: |
      import "github.com/golang-jwt/jwt"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        jwt.NewWithClaims(jwt.SigningMethodNone)
      }
  - name: literal jwt negative
    code: "import \"github.com/golang-jwt/jwt\"\npackage main\n\nfunc example() {\n\
      \  target := \"tainted\"\n  name := \"user\"\n  value := \"value\"\n  jwt.NewWithClaims(jwt.SigningMethodHS256)\n\
      }\n"
    expect_no_match: true
  description: "jwt.NewWithClaims(jwt.SigningMethodNone, …) — issues unsigned tokens;
    any client can forge claims."

- id: go.jwt.unsafe_allow_none
  enabled: true
  language: go
  tag: jwt
  category: source-independent
  severity: critical
  packages: ["github.com/golang-jwt/jwt", "github.com/dgrijalva/jwt-go"]
  cwe: [CWE-347]
  match:
    kind: read
    target:
      name: UnsafeAllowNoneSignatureType
  match_examples:
  - name: generated direct match
    code: |
      import "github.com/golang-jwt/jwt"
      package main

      type holder struct { UnsafeAllowNoneSignatureType string }
      func example(obj holder) {
        _ = obj.UnsafeAllowNoneSignatureType
      }
  description: "Reference to jwt.UnsafeAllowNoneSignatureType — enabling alg=none
    verification accepts forged tokens."

- id: go.jwt.skip_claims_validation
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: go
  tag: jwt
  severity: high
  packages: ["github.com/golang-jwt/jwt", "github.com/dgrijalva/jwt-go"]
  cwe: [CWE-347, CWE-613]
  match:
    kind: write
    target:
      name: SkipClaimsValidation
  match_examples:
  - name: generated direct match
    code: |
      import "github.com/golang-jwt/jwt"
      package main

      func example() {
        cfg.SkipClaimsValidation = true
      }
  description: "Disabled — requires a value constraint that proves Parser.SkipClaimsValidation is assigned true, not merely written."

