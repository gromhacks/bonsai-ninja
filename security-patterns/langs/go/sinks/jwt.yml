- id: go.jwt.gojose_parsesigned
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: go
  tag: jwt
  severity: medium
  packages: ["gopkg.in/square/go-jose.v2"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [jose, ParseSigned]
  description: "Disabled — go-jose ParseSigned is safe when .Verify() is called downstream;
    enable with a missing-Verify constraint."

# JWT alg-confusion (T400). HMAC verify with an RSA public
# key — when both HS* and RS* algorithms are allowed in the
# verifier's algorithm list, an attacker can sign their own
# token with the public key as the HMAC secret. Detect by
# matching the algorithm-list shape at the verify call.
- id: go.jwt.alg_confusion
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: untrusted-token
  severity: high
  packages: [github.com/golang-jwt/jwt]
  cwe: [CWE-345]
  match:
    kind: call
    callee:
      attribute: [jwt, Parse]
  description: "golang-jwt Parse callback that returns the wrong key type for the
    alleged algorithm — classic alg-confusion when verifier doesn't pin to a specific
    signing method family. (Audit-style — review the keyFunc.)"

- id: go.jwt.golang_jwt_parse_tainted_token
  enabled: true
  language: go
  tag: jwt
  severity: critical
  packages: [github.com/golang-jwt/jwt, github.com/dgrijalva/jwt-go]
  cwe: [CWE-347, CWE-327]
  match:
    kind: call
    callee:
      attribute: [jwt, Parse]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: jwt.Parse tainted token
    code: |
      package main

      import "github.com/golang-jwt/jwt"

      func verify(token string, keyfn jwt.Keyfunc) (*jwt.Token, error) {
        return jwt.Parse(token, keyfn)
      }
    expect_match_text: [jwt.Parse]
  - name: jwt.Parse literal negative
    code: |
      package main

      import "github.com/golang-jwt/jwt"

      func verify(keyfn jwt.Keyfunc) (*jwt.Token, error) {
        return jwt.Parse("fixed-static-token", keyfn)
      }
    expect_no_match: true
  description: "jwt.Parse(tainted_token, keyfn) — golang-jwt; without an algorithm
    whitelist inside `keyfn`, attacker can mount alg-none / HS-vs-RS confusion attacks."
