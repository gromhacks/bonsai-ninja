- id: go.nosql.redigo_eval
  enabled: true
  language: go
  tag: code-injection
  severity: high
  packages:
  - github.com/gomodule/redigo/redis
  - github.com/garyburd/redigo/redis
  cwe:
  - CWE-943
  - CWE-94
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_][A-Za-z0-9_]*\.Do$'
  constraints:
  - receiver_type_in: [redis.Conn, Conn]
  - arg_equals:
      index: 0
      value: '"EVAL"'
  - arg_tainted:
      index: 1
  match_examples:
  - name: redigo eval
    code: |
      import "github.com/gomodule/redigo/redis"
      package main
      func run(conn redis.Conn, script string) {
        _, _ = conn.Do("EVAL", script, 0)
      }
    expect_match_text:
    - conn.Do
  - name: redigo eval literal script negative
    code: |
      package main
      import "github.com/gomodule/redigo/redis"
      func run(conn redis.Conn) {
        _, _ = conn.Do("EVAL", "return 1", 0)
      }
    expect_no_match: true
  - name: local do method collision negative
    code: |
      package main
      import "github.com/gomodule/redigo/redis"
      type localConnection struct{}
      func (localConnection) Do(string, ...any) (any, error) { return nil, nil }
      func run(_ redis.Conn, connection localConnection, script string) {
        _, _ = connection.Do("EVAL", script, 0)
      }
    expect_no_match: true
  description: "redigo Conn.Do(\"EVAL\", taintedScript, ...) - attacker-controlled Lua executes inside Redis."
