- id: go.nosql.mongo_find
  enabled: true
  language: go
  tag: nosql-injection
  severity: high
  packages:
  - go.mongodb.org/mongo-driver
  - github.com/antchfx/xmlquery
  - github.com/antchfx/htmlquery
  cwe:
  - CWE-943
  - CWE-643
  match:
    kind: call
    callee:
      regex: \.Find$
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: mongo find with bson filter
    code: |
      package main
      import "go.mongodb.org/mongo-driver/bson"
      func lookup(ctx any, coll interface{ Find(any, any) (any, error) }, body string) {
        _, _ = coll.Find(ctx, bson.M{"name": body})
      }
    expect_match_text:
    - coll.Find
  - name: mongo find with caller controlled map filter
    code: |
      package main
      import "go.mongodb.org/mongo-driver"
      func lookup(ctx any, coll interface{ Find(any, any) (any, error) }, filter map[string]any) {
        _, _ = coll.Find(ctx, filter)
      }
    expect_match_text:
    - coll.Find
  - name: mongo find with operator object filter
    code: |
      package main
      import "go.mongodb.org/mongo-driver/bson"
      func lookup(ctx any, coll interface{ Find(any, any) (any, error) }, body string) {
        _, _ = coll.Find(ctx, bson.M{"role": bson.M{"$ne": body}})
      }
    expect_match_text:
    - coll.Find
  - name: mongo find literal filter negative
    code: |
      package main
      import "go.mongodb.org/mongo-driver/bson"
      func lookup(ctx any, coll interface{ Find(any, any) (any, error) }) {
        _, _ = coll.Find(ctx, bson.M{"active": true})
      }
    expect_no_match: true
  description: "mongo-go-driver Collection.Find(ctx, filter) — object-injection via bson.M/map filters from caller-controlled values, including nested $-operator objects. Merged collision aliases: go.nosql.mongo_findone, go.xpath.xmlquery_find."
  aliases:
  - go.nosql.mongo_findone
  - go.xpath.xmlquery_find
