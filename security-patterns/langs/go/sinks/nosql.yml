- id: go.nosql.redis_eval
  enabled: true
  language: go
  tag: code-injection
  severity: critical
  packages:
  - github.com/redis/go-redis/v9
  - github.com/go-redis/redis
  - github.com/go-redis/redis/v8
  cwe:
  - CWE-94
  - CWE-943
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_][A-Za-z0-9_]*\.Eval$'
  constraints:
  - receiver_type_in: [redis.Client, redis.ClusterClient, redis.Ring, redis.UniversalClient, redis.Cmdable, Client, ClusterClient, Ring, UniversalClient, Cmdable]
  - arg_tainted:
      index: 1
  match_examples:
  - name: go redis evaluates tainted Lua script
    code: |
      package main
      import (
        "context"
        "github.com/redis/go-redis/v9"
      )
      func run(client *redis.Client, script string) {
        _ = client.Eval(context.Background(), script, nil)
      }
    expect_match_text: [client.Eval]
  - name: go redis literal script negative
    code: |
      package main
      import (
        "context"
        "github.com/redis/go-redis/v9"
      )
      func run(client *redis.Client) {
        _ = client.Eval(context.Background(), "return 1", nil)
      }
    expect_no_match: true
  - name: local eval collision negative
    code: |
      package main
      import "github.com/redis/go-redis/v9"
      type localEvaluator struct{}
      func (localEvaluator) Eval(any, string, any) {}
      func run(_ *redis.Client, evaluator localEvaluator, script string) {
        evaluator.Eval(nil, script, nil)
      }
    expect_no_match: true
  description: "go-redis Client.Eval(ctx, tainted script, keys, args...) executes attacker-controlled Redis Lua. Exact receiver typing separates it from expression evaluators."
