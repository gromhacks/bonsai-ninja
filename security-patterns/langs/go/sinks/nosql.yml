- id: go.nosql.mongo_find
  enabled: true
  language: go
  tag: nosql-injection
  severity: high
  packages:
  - go.mongodb.org/mongo-driver
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      regex: \.(Find|FindOne)$
  constraints:
  - receiver_type_in: [mongo.Collection, Collection]
  - arg_tainted:
      index: 1
  analysis_semantics:
    nosql_filter:
      filter_arg_index: 1
      literal_value_operators: ["$eq"]
      safe_scalar_compiler_types: [string]
      safe_scalar_source_rules: [go.gin.context_param]
  match_examples:
  - name: mongo find with bson filter
    code: |
      package main
      import (
        "go.mongodb.org/mongo-driver/bson"
        "go.mongodb.org/mongo-driver/mongo"
      )
      func lookup(ctx any, coll *mongo.Collection, body string) {
        _, _ = coll.Find(ctx, bson.M{"name": body})
      }
    expect_match_text:
    - coll.Find
  - name: mongo find with caller controlled map filter
    code: |
      package main
      import "go.mongodb.org/mongo-driver/mongo"
      func lookup(ctx any, coll *mongo.Collection, filter map[string]any) {
        _, _ = coll.Find(ctx, filter)
      }
    expect_match_text:
    - coll.Find
  - name: mongo findone with caller controlled map filter
    code: |
      package main
      import "go.mongodb.org/mongo-driver/mongo"
      func lookup(ctx any, coll *mongo.Collection, filter map[string]any) {
        _ = coll.FindOne(ctx, filter)
      }
    expect_match_text:
    - coll.FindOne
  - name: mongo find with operator object filter
    code: |
      package main
      import (
        "go.mongodb.org/mongo-driver/bson"
        "go.mongodb.org/mongo-driver/mongo"
      )
      func lookup(ctx any, coll *mongo.Collection, body string) {
        _, _ = coll.Find(ctx, bson.M{"role": bson.M{"$ne": body}})
      }
    expect_match_text:
    - coll.Find
  - name: mongo find literal filter negative
    code: |
      package main
      import (
        "go.mongodb.org/mongo-driver/bson"
        "go.mongodb.org/mongo-driver/mongo"
      )
      func lookup(ctx any, coll *mongo.Collection) {
        _, _ = coll.Find(ctx, bson.M{"active": true})
      }
    expect_no_match: true
  - name: local find method collision negative
    code: |
      package main
      import "go.mongodb.org/mongo-driver/mongo"
      type localStore struct{}
      func (localStore) Find(any, any) (any, error) { return nil, nil }
      func lookup(ctx any, _ *mongo.Collection, store localStore, filter map[string]any) {
        _, _ = store.Find(ctx, filter)
      }
    expect_no_match: true
  description: "mongo-go-driver Collection.Find/FindOne(ctx, filter) - object-injection via bson.M/map filters from caller-controlled values, including nested $-operator objects. Exact receiver typing excludes unrelated Find methods."
  aliases:
  - go.nosql.mongo_findone
- id: go.nosql.mongo_aggregate
