- id: go.nosql.redigo_eval
  enabled: true
  language: go
  tag: code-injection
  severity: high
  packages:
  - github.com/gomodule/redigo/redis
  - github.com/garyburd/redigo/redis
  cwe:
  - CWE-943
  - CWE-94
  match:
    kind: call
    callee:
      regex: ^(conn|redisConn|redigoConn)\.Do$
  constraints:
  - arg_equals:
      index: 0
      value: '"EVAL"'
  - arg_tainted:
      index: 1
  match_examples:
  - name: redigo eval
    code: |
      import "github.com/gomodule/redigo/redis"
      package main
      func run(conn RedisConn, script string) {
        _, _ = conn.Do("EVAL", script, 0)
      }
      type RedisConn struct{}
      func (r RedisConn) Do(commandName string, args ...any) (any, error) { return nil, nil }
    expect_match_text:
    - conn.Do
  - name: redigo eval literal script negative
    code: |
      package main
      import "github.com/gomodule/redigo/redis"
      func run(conn RedisConn) {
        _, _ = conn.Do("EVAL", "return 1", 0)
      }
      type RedisConn struct{}
      func (r RedisConn) Do(commandName string, args ...any) (any, error) { return nil, nil }
    expect_no_match: true
  description: "redigo Conn.Do(\"EVAL\", taintedScript, ...) - attacker-controlled Lua executes inside Redis."
- id: go.nosql.cassandra_query
  enabled: true
  language: go
  tag: cql-injection
  severity: high
  packages:
  - github.com/gocql/gocql
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      name: Query
  constraints:
  - receiver_type_in: [Session]
  - arg_tainted:
      index: 0
  match_examples:
  - name: gocql session query tainted
    code: |
      package main
      import "github.com/gocql/gocql"
      func handler(session *gocql.Session, q string) {
        session.Query(q)
      }
    expect_match_text: [session.Query]
  - name: gocql session query literal negative
    code: |
      package main
      import "github.com/gocql/gocql"
      func handler(session *gocql.Session) {
        session.Query("SELECT * FROM users")
      }
    expect_no_match: true
  description: "gocql Session.Query(cql) - CQL injection; receiver-typed to distinguish from database/sql Query."
