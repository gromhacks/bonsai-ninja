# Go TLS misconfiguration. Assignment targets and their exact RHS expression
# are adapter-lowered compiler facts; rules own the security-sensitive values.
- id: go.tls.insecure_skip_verify
  enabled: true
  language: go
  tag: weak-tls
  category: source-independent
  severity: high
  packages: ["crypto/tls"]
  cwe: [CWE-295]
  match:
    kind: write
    target:
      regex: '^[^\.\s]+\.InsecureSkipVerify$'
      receiver_type_in: [tls.Config, Config]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^true$"
  match_examples:
  - name: certificate verification disabled
    code: |
      package main
      import "crypto/tls"

      func example(cfg *tls.Config) {
        cfg.InsecureSkipVerify = true
      }
    expect_match_text: [cfg.InsecureSkipVerify]
  - name: certificate verification retained negative
    code: |
      package main
      import "crypto/tls"

      func example(cfg *tls.Config) {
        cfg.InsecureSkipVerify = false
      }
    expect_no_match: true
  - name: same field on a local type negative
    code: |
      package main
      import "crypto/tls"

      type LocalConfig struct { InsecureSkipVerify bool }
      func example(cfg *LocalConfig) {
        cfg.InsecureSkipVerify = true
        _ = tls.VersionTLS13
      }
    expect_no_match: true
  description: "tls.Config.InsecureSkipVerify assignment - setting true disables certificate verification (MITM). Exact compiler receiver identity rejects same-named local fields."

- id: go.tls.minversion_old
  enabled: true
  language: go
  tag: weak-tls
  category: source-independent
  severity: medium
  packages: ["crypto/tls"]
  cwe: [CWE-326]
  match:
    kind: write
    target:
      regex: '^[^\.\s]+\.MinVersion$'
      receiver_type_in: [tls.Config, Config]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^(?:tls\\.)?(?:VersionSSL30|VersionTLS10|VersionTLS11)$"
  match_examples:
  - name: deprecated minimum TLS version
    code: |
      package main
      import "crypto/tls"

      func example(cfg *tls.Config) {
        cfg.MinVersion = tls.VersionTLS11
      }
    expect_match_text: [cfg.MinVersion]
  - name: modern minimum TLS version negative
    code: |
      package main
      import "crypto/tls"

      func example(cfg *tls.Config) {
        cfg.MinVersion = tls.VersionTLS12
      }
    expect_no_match: true
  - name: same minimum-version field on a local type negative
    code: |
      package main
      import "crypto/tls"

      type LocalConfig struct { MinVersion uint16 }
      func example(cfg *LocalConfig) {
        cfg.MinVersion = tls.VersionTLS11
      }
    expect_no_match: true
  description: "tls.Config.MinVersion - values VersionSSL30 / VersionTLS10 / VersionTLS11 allow deprecated-protocol downgrade. Exact compiler receiver identity rejects same-named local fields."

- id: go.tls.grpc_with_insecure
  enabled: true
  language: go
  tag: weak-tls
  category: source-independent
  severity: high
  packages: ["google.golang.org/grpc"]
  cwe: [CWE-295, CWE-319]
  match:
    kind: call
    callee:
      attribute: [grpc, WithInsecure]
  match_examples:
  - name: generated direct match
    code: |
      import "google.golang.org/grpc"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        grpc.WithInsecure(target)
      }
  description: "grpc.WithInsecure() - disables TLS entirely on gRPC client; plaintext transport."
