# Go file-upload sinks. multipart.FileHeader.Filename is a struct field
# (read), not a call. Framework helpers are method calls.
- id: go.upload.gin_saveuploadedfile
  enabled: true
  language: go
  tag: file-upload
  severity: high
  packages: ["github.com/gin-gonic/gin"]
  cwe: [CWE-434, CWE-22]
  match:
    kind: call
    callee:
      regex: "\\.SaveUploadedFile$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted gin upload destination
    code: |
      import "github.com/gin-gonic/gin"
      package main

      func example(target string, value string) {
        name := "user"
        obj.SaveUploadedFile(value, target)
      }
  - name: literal gin upload destination negative
    code: |
      package main
      func example(file any) {
        obj.SaveUploadedFile(file, "/srv/uploads/avatar.png")
      }
    expect_no_match: true
  description: "gin Context.SaveUploadedFile(file, dst) - if dst is built from header.Filename, path-traversal + unrestricted upload."

- id: go.upload.fiber_savefile
  enabled: true
  language: go
  tag: file-upload
  severity: high
  packages: ["github.com/gofiber/fiber"]
  cwe: [CWE-434, CWE-22]
  match:
    kind: call
    callee:
      regex: "\\.SaveFile$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted fiber upload destination
    code: |
      import "github.com/gofiber/fiber"
      package main

      func example(target string, value string) {
        name := "user"
        obj.SaveFile(value, target)
      }
  - name: literal fiber upload destination negative
    code: |
      package main
      func example(file any) {
        obj.SaveFile(file, "/srv/uploads/avatar.png")
      }
    expect_no_match: true
  description: "fiber Ctx.SaveFile(fileheader, path) - tainted path + client filename = traversal / unrestricted upload."
