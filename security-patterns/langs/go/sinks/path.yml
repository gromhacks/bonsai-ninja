  enabled: true
  language: go
  tag: path-traversal
  severity: high
  packages: ["path/filepath"]
  cwe: [CWE-22]
  analysis_semantics:
    guard_profile: relative-path-containment
    relative_path_containment_guard:
      candidate_canonicalizer:
        regex: '^filepath\.(Join|Clean)$'
      base_canonicalizer:
        attribute: [filepath, Abs]
      relative_path:
        attribute: [filepath, Rel]
      relative_path_result_index: 0
      relative_base_arg_index: 0
      relative_candidate_arg_index: 1
      rejection_check:
        attribute: [strings, HasPrefix]
      rejection_check_arg_index: 0
      rejection_prefix_arg_index: 1
      rejection_boundary_places: [os.PathSeparator]
      rejection_boundary_wrappers: [{name: string}]
      rejected_exact_values: [".."]
  match:
    kind: call
    callee:
      attribute: [filepath, Join]
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: join base with request path segment
    code: |
      package main
      import (
        "net/http"
        "path/filepath"
      )
      func file(r *http.Request, input string) string {
        name := input
        return filepath.Join("/srv/files", name)
      }
    expect_match_text: [filepath.Join]
  - name: join base with uploaded filename
    code: |
