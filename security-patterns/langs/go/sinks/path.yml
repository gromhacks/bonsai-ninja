- id: go.path.filepath_join
  enabled: true
  language: go
  tag: path-traversal
  severity: high
  packages: ["path/filepath"]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      attribute: [filepath, Join]
  match_examples:
  - name: join base with request path segment
    code: |
      package main
      import (
        "net/http"
        "path/filepath"
      )
      func file(r *http.Request) string {
        name := input
        return filepath.Join("/srv/files", name)
      }
    expect_match_text: [filepath.Join]
  - name: join base with uploaded filename
    code: |
      package main
      import (
        "mime/multipart"
        "path/filepath"
      )
      func dst(fh *multipart.FileHeader) string {
        return filepath.Join("/srv/uploads", fh.Filename)
      }
    expect_match_text: [filepath.Join]
  - name: tar extraction join with header name
    code: |
      package main
      import (
        "archive/tar"
        "path/filepath"
      )
      func dst(root string, hdr *tar.Header) string {
        return filepath.Join(root, hdr.Name)
      }
    expect_match_text: [filepath.Join]
  - name: zip extraction join with entry name
    code: |
      package main
      import (
        "archive/zip"
        "path/filepath"
      )
      func dst(root string, f *zip.File) string {
        return filepath.Join(root, f.Name)
      }
    expect_match_text: [filepath.Join]
  description: "filepath.Join(base, tainted...) — Join does NOT prevent traversal; an attacker segment containing '..' escapes `base`. Tainted segments here are a real path-traversal sink unless followed by a containment check (e.g. strings.HasPrefix on the cleaned result against a fixed root)."
