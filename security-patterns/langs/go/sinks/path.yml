# Go path-traversal sinks. os.* and ioutil.* / os.ReadFile/WriteFile
# accept arbitrary paths; tainted paths reach user-chosen files.
- id: go.path.os_open
  enabled: true
  language: go
  tag: path-traversal
  severity: high
  packages: [os]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      attribute: [os, Open]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted os open path
    code: |
      package main
      import "os"

      func file(path string) {
        _, _ = os.Open(path)
      }
    expect_match_text: [os.Open]
  - name: literal os open path negative
    code: |
      package main
      import "os"

      func file() {
        _, _ = os.Open("/srv/files/readme.txt")
      }
    expect_no_match: true
  description: "os.Open(tainted path) - reads an attacker-chosen file; classic traversal when joined with ../."
- id: go.path.os_openfile
  enabled: true
  language: go
  tag: path-traversal
  severity: high
  packages: [os]
  cwe: [CWE-22]
  analysis_semantics:
    guard_profile: relative-path-containment
    relative_path_containment_guard:
      candidate_canonicalizer:
        regex: '^filepath\.(Join|Clean)$'
      base_canonicalizer:
        attribute: [filepath, Abs]
      relative_path:
        attribute: [filepath, Rel]
      relative_path_result_index: 0
      relative_base_arg_index: 0
      relative_candidate_arg_index: 1
      guarded_path_arg_index: 0
      rejection_check:
        attribute: [strings, HasPrefix]
      rejection_check_arg_index: 0
      rejection_prefix_arg_index: 1
      rejection_boundary_places: [os.PathSeparator]
      rejection_boundary_wrappers: [{name: string}]
      rejected_exact_values: [".."]
  match:
    kind: call
    callee:
      attribute: [os, OpenFile]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted os openfile path
    code: |
      package main
      import "os"

      func file(path string) {
        _, _ = os.OpenFile(path, os.O_RDONLY, 0)
      }
    expect_match_text: [os.OpenFile]
  - name: literal os openfile path negative
    code: |
      package main
      import "os"

      func file() {
        _, _ = os.OpenFile("/srv/files/readme.txt", os.O_RDONLY, 0)
      }
    expect_no_match: true
  description: "os.OpenFile(tainted path, flags, mode) - tainted path + O_CREATE enables arbitrary write."
