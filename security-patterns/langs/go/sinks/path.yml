    code: |
      import "path"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        path.Join(target)
      }
  description: "path.Join(base, tainted...) — same traversal exposure as filepath.Join; '..' segments are not stripped by Join alone."

# Archive extraction (Zip Slip class). The destination path is built
# from the entry's name field; the library trusts the archive to
# specify safe relative paths. Gitea CVE-2022-1928 is the canonical
# motivator: services/repository/archiver/archiver.go used os.Create
# with filepath.Join(dest, header.Name) where header.Name was
# attacker-controlled.
- id: go.path.tar_reader_next
  enabled: true
  language: go
  tag: zip-slip
  severity: critical
  packages: [archive/tar]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      regex: "\\.Next$"
  match_examples:
  - name: tar reader next
    code: |
      package main
      import "archive/tar"
      func next(tr *tar.Reader) {
        _, _ = tr.Next()
      }
    expect_match_text: [tr.Next]
  description: "tar.Reader.Next() — returns header whose Name field is attacker-controlled inside the archive. Joining header.Name into a destination path without containment check is Zip Slip (CVE-2022-1928 shape)."
- id: go.path.zip_reader_open
  enabled: true
  language: go
  tag: zip-slip
  severity: high
  packages: [archive/zip]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      attribute: [zip, OpenReader]
  match_examples:
  - name: generated direct match
    code: |
      import "archive/zip"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        zip.OpenReader(target)
      }
  description: "zip.OpenReader returns *Reader whose File entries carry attacker-controlled Name fields. The Zip Slip vector is using entry.Name as a path component without containment check."
