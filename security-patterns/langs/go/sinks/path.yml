# Archive extraction (Zip Slip class). The destination path is built
# from the entry's name field; the library trusts the archive to
# specify safe relative paths. Gitea CVE-2022-1928 is the canonical
# motivator: services/repository/archiver/archiver.go used os.Create
# with filepath.Join(dest, header.Name) where header.Name was
# attacker-controlled.
- id: go.path.tar_reader_next
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: go.archive.tar_reader_next_header
  language: go
  tag: zip-slip
  severity: critical
  packages: [archive/tar]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      regex: "\\.Next$"
  match_examples:
  - name: tar reader next
    code: |
      package main
      import "archive/tar"
      func next(tr *tar.Reader) {
        _, _ = tr.Next()
      }
    expect_match_text: [tr.Next]
  description: "Disabled sink duplicate - tar.Reader.Next() returns an attacker-controlled header and is modeled as source go.archive.tar_reader_next_header; the actual Zip Slip sink is the later path open/write using header.Name."
- id: go.path.zip_reader_open
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: zip-slip
  severity: high
  packages: [archive/zip]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      attribute: [zip, OpenReader]
  match_examples:
  - name: generated direct match
    code: |
      import "archive/zip"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        zip.OpenReader(target)
      }
  description: "Disabled (over-broad) - zip.OpenReader merely opens an archive and is not itself the Zip Slip sink; flagging every call (including safe reads) would be noise. The real Go Zip Slip sink is the per-entry file write `os.Create/OpenFile(filepath.Join(dest, f.Name))` over `r.File`, where `f.Name` is the attacker-controlled member path. Belongs to a per-entry-name source model, not an OpenReader sink."
