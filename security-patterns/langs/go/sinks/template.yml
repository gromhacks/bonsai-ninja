- id: go.template.text_template_parse
  enabled: true
  language: go
  tag: ssti
  severity: high
  packages:
  - text/template
  - github.com/aymerick/raymond
  cwe:
  - CWE-1336
  - CWE-94
  match:
    kind: call
    callee:
      regex: \.Parse$
  match_examples:
  - name: generated direct match
    code: |
      import "text/template"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        tmpl.Parse(target)
      }
    expect_match_text:
    - tmpl.Parse
  description: "text/template Template.Parse(tainted) — SSTI; template with .Funcs gives RCE. Merged collision aliases: go.template.raymond_parse."
  aliases:
  - go.template.raymond_parse
- id: go.template.text_template_parsefiles
  enabled: true
  language: go
  tag: ssti
  severity: critical
  packages:
  - text/template
  cwe:
  - CWE-94
  - CWE-1336
  - CWE-22
  match:
    kind: call
    callee:
      attribute:
      - template
      - ParseFiles
  match_examples:
  - name: generated direct match
    code: |
      import "text/template"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        template.ParseFiles("{{ user }}")
