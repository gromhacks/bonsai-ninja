- id: go.template.text_template_parse
  enabled: true
  language: go
  tag: ssti
  severity: high
  packages:
  - text/template
  - html/template
  - github.com/aymerick/raymond
  cwe:
  - CWE-1336
  - CWE-94
  match:
    kind: call
    callee:
      regex: \.Parse$
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    # Template-source compilation is the semantic boundary. If the exact same
    # flow is subsequently emitted as raw HTML, retain this SSTI finding and
    # expose the transport sink as a related location.
    sink_terminal_priority: 200
  match_examples:
  - name: generated direct match
    code: |
      import "text/template"
      package main

      func example(tmpl *template.Template, target string) {
        tmpl.Parse(target)
      }
    expect_match_text:
    - tmpl.Parse
  - name: html template parse
    code: |
      import "html/template"
      package main

      func example(tmpl *template.Template, target string) {
        tmpl.Parse(target)
      }
    expect_match_text:
    - tmpl.Parse
  - name: literal template parse negative
    code: |
      import "text/template"
      package main

      func example(tmpl *template.Template) {
        tmpl.Parse("Hello {{ .Name }}")
      }
    expect_no_match: true
  description: "text/template/html/template Template.Parse(tainted) - SSTI; text/template with .Funcs can reach RCE, and html/template still parses attacker-controlled template source. Merged collision aliases: go.template.raymond_parse."
  aliases:
  - go.template.raymond_parse
- id: go.template.text_template_parsefiles
  enabled: true
  language: go
  tag: ssti
  severity: critical
  packages:
  - text/template
  cwe:
  - CWE-94
  - CWE-1336
  - CWE-22
  match:
    kind: call
    callee:
      attribute:
      - template
      - ParseFiles
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      import "text/template"
      package main

      func example(path string) {
        template.ParseFiles(path)
      }
    expect_match_text: [template.ParseFiles]
  - name: literal template parsefiles negative
    code: |
      import "text/template"
      package main

      func example() {
        template.ParseFiles("views/index.tmpl")
      }
    expect_no_match: true
  description: "template.ParseFiles(tainted path) - loads attacker-picked template file; combines path-traversal + SSTI."
