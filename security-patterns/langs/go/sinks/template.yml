- id: go.template.text_template_parse
  enabled: true
  language: go
  tag: ssti
  severity: high
  packages:
  - text/template
  - github.com/aymerick/raymond
  cwe:
  - CWE-1336
  - CWE-94
  match:
    kind: call
    callee:
      regex: \.Parse$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      import "text/template"
      package main

      func example(tmpl *template.Template, target string) {
        tmpl.Parse(target)
      }
    expect_match_text:
    - tmpl.Parse
  - name: literal template parse negative
    code: |
      import "text/template"
      package main

      func example(tmpl *template.Template) {
        tmpl.Parse("Hello {{ .Name }}")
      }
    expect_no_match: true
  description: "text/template Template.Parse(tainted) - SSTI; template with .Funcs gives RCE. Merged collision aliases: go.template.raymond_parse."
  aliases:
  - go.template.raymond_parse
- id: go.template.text_template_parsefiles
  enabled: true
  language: go
  tag: ssti
  severity: critical
  packages:
  - text/template
  cwe:
  - CWE-94
  - CWE-1336
  - CWE-22
  match:
    kind: call
    callee:
      attribute:
      - template
      - ParseFiles
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      import "text/template"
      package main

      func example(path string) {
        template.ParseFiles(path)
      }
    expect_match_text: [template.ParseFiles]
  - name: literal template parsefiles negative
    code: |
      import "text/template"
      package main

      func example() {
        template.ParseFiles("views/index.tmpl")
      }
    expect_no_match: true
  description: "template.ParseFiles(tainted path) - loads attacker-picked template file; combines path-traversal + SSTI."
- id: go.template.text_template_new_parse
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: go
  tag: ssti
  severity: high
  packages:
  - text/template
  cwe:
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - template
      - New
  match_examples:
  - name: generated direct match
    code: |
      import "text/template"
      package main

      func example() {
        target := "tainted"
        name := "user"
        value := "value"
        template.New("{{ user }}")
      }
  description: "Disabled - text/template.New(name) alone does not parse attacker-controlled template source. Re-enable only with multi-call correlation that proves a later Parse/ParseFiles consumes tainted template content."
