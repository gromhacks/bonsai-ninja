    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.Rollback$
  match_examples:
    - name: tx rollback site
      code: |
        package main
        import "database/sql"
        func handle(tx *sql.Tx) {
          tx.Rollback()
        }
      expect_match_text: [tx.Rollback]
  description: "Audit-pair site — engine surfaces the lifecycle event; correlate with subsequent uses of the same value once the must-alias + lifecycle-state primitives ship (see docs/contributing/analysis-roadmap.mdx). database/sql Tx.Rollback() — transaction-after-error race-pair; later tx.Exec on the same handle returns ErrTxDone."
