- id: go.llm.openai_create_chat_completion
  enabled: false
  language: go
  tag: web-llm
  severity: medium
  packages:
  - github.com/sashabaranov/go-openai
  cwe:
  - CWE-20
  - CWE-94
  match:
    kind: call
    callee:
      attribute:
      - client
      - CreateChatCompletion
  match_examples:
  - name: openai create chat completion
    code: "import \"github.com/sashabaranov/go-openai\"\npackage main\nfunc example(ctx\
      \ context.Context, client *openai.Client, req openai.ChatCompletionRequest)\
      \ {\n  client.CreateChatCompletion(ctx, req)\n}\n"
    expect_match_text:
    - client.CreateChatCompletion
  description: "client.CreateChatCompletion(ctx, request) \u2014 tainted prompt/tool\
    \ content reaches an LLM instruction surface."
  disabled_reason:
    code: over-broad
