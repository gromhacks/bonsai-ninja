- id: go.llm.openai_create_chat_completion
  enabled: true
  language: go
  tag: web-llm
  severity: medium
  packages:
  - github.com/sashabaranov/go-openai
  cwe:
  - CWE-20
  - CWE-94
  match:
    kind: call
    callee:
      attribute:
      - client
      - CreateChatCompletion
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: openai create chat completion tainted request
    code: |
      package main
      import "github.com/sashabaranov/go-openai"
      func example(ctx context.Context, client *openai.Client, user_input openai.ChatCompletionRequest) {
        client.CreateChatCompletion(ctx, user_input)
      }
    expect_match_text:
    - client.CreateChatCompletion
  - name: openai create chat completion literal negative
    code: |
      package main
      import "github.com/sashabaranov/go-openai"
      func example(ctx context.Context, client *openai.Client) {
        client.CreateChatCompletion(ctx, openai.ChatCompletionRequest{})
      }
    expect_no_match: true
  description: "client.CreateChatCompletion(ctx, request) - attacker-controlled prompt/tool content reaches an LLM instruction surface."

