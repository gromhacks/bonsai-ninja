- id: go.llm.bedrock_invoke_model
  enabled: true
  language: go
  tag: web-llm
  severity: medium
  packages:
  - github.com/aws/aws-sdk-go-v2/service/bedrockruntime
  cwe:
  - CWE-20
  - CWE-200
  match:
    kind: call
    callee:
      attribute:
      - bedrock
      - InvokeModel
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: bedrock invoke model tainted input
    code: |
      package main
      import "github.com/aws/aws-sdk-go-v2/service/bedrockruntime"
      func example(ctx context.Context, bedrock *bedrockruntime.Client, user_input *bedrockruntime.InvokeModelInput) {
        bedrock.InvokeModel(ctx, user_input)
      }
    expect_match_text:
    - bedrock.InvokeModel
  - name: bedrock invoke model literal negative
    code: |
      package main
      import "github.com/aws/aws-sdk-go-v2/service/bedrockruntime"
      func example(ctx context.Context, bedrock *bedrockruntime.Client) {
        bedrock.InvokeModel(ctx, &bedrockruntime.InvokeModelInput{})
      }
    expect_no_match: true
  description: "bedrock.InvokeModel(ctx, input) - attacker-controlled model body reaches a foundation-model execution surface."
