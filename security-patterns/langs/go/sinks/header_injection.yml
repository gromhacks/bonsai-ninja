- id: go.header.http_header_set
  enabled: true
  language: go
  tag: header-injection
  severity: high
  packages:
  - net/http
  cwe:
  - CWE-113
  match:
    kind: call
    callee:
      regex: ^(h|hdr|header|headers|httpHeader)\.Set$
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: http header variable set
    code: "package main\nimport \"net/http\"\nfunc hdr(r *http.Request) {\n  h := http.Header{}\n  value := input\n  h.Set(\"X-User\", value)\n}\n"
    expect_match_text:
    - h.Set
  - name: literal http header variable set negative
    code: |
      package main
      import "net/http"
      func hdr(r *http.Request) {
        h := http.Header{}
        h.Set("X-User", "safe")
      }
    expect_no_match: true
  description: "http.Header.Set(name, tainted) — response header maps assigned through a local header variable can still carry CRLF/header-injection risk."
