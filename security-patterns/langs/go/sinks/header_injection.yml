- id: go.header.responsewriter_header_set
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: header-injection
  severity: medium
  cwe:
  - CWE-113
  match:
    kind: call
    callee:
      regex: \.Set$
  match_examples:
  - name: generated direct match
    code: "package main\n\nfunc example() {\n  target := \"tainted\"\n  name := \"user\"\n  value := \"value\"\n  Header.Set(target, target)\n}\n"
  description: "Header().Set(name, value) — only response headers and arg 1 are injection-relevant; kept medium until receiver/arg precision improves."
- id: go.header.responsewriter_header_chain_set
  enabled: true
  language: go
  tag: header-injection
  severity: high
  cwe:
  - CWE-113
  - CWE-601
  - CWE-444
  match:
    kind: call
    callee:
      regex: ^(w|rw|writer|responseWriter)\.Header\(\)\.Set$
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: response writer header chain set
    code: |
      import "github.com/labstack/echo"
      package main
      import "net/http"
      func hdr(w http.ResponseWriter, r *http.Request) {
        name := "X-" + input
        val := "ok" + input
        w.Header().Set(name, val)
      }
    expect_match_text:
    - w.Header().Set
  - name: content disposition concat
    code: |
      import "github.com/labstack/echo"
      package main
      import "net/http"
      func download(w http.ResponseWriter, r *http.Request) {
        name := input
        w.Header().Set("Content-Disposition", "attachment; filename=" + name)
      }
    expect_match_text:
    - w.Header().Set
  - name: literal response writer header set negative
    code: |
      package main
      import "net/http"
      func hdr(w http.ResponseWriter, r *http.Request) {
        w.Header().Set("X-User", "safe")
      }
    expect_no_match: true
  description: "w.Header().Set(name, value) — response header name or value derived from tainted input can produce response-splitting/header-injection risk. Merged aliases: go.open_redirect.location_header_set."
  aliases:
  - go.open_redirect.location_header_set
  - go.header.echo_response_header_set
  - go.header.gin_writer_header_set
  - go.smuggle.set_dual_cl_te_headers
  packages:
  - github.com/labstack/echo
  - github.com/gin-gonic/gin
