- id: go.header.http_header_set
  enabled: true
  language: go
  tag: header-injection
  severity: high
  packages:
  - net/http
  cwe:
  - CWE-113
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_][A-Za-z0-9_]*\.Set$'
  constraints:
  - receiver_type_in: [http.Header, Header]
  - arg_tainted:
      index: 1
  match_examples:
  - name: http header variable set
    code: |
      package main
      import "net/http"
      func hdr(r *http.Request, value string) {
        h := http.Header{}
        h.Set("X-User", value)
      }
    expect_match_text:
    - h.Set
  - name: literal http header variable set negative
    code: |
      package main
      import "net/http"
      func hdr(r *http.Request) {
        h := http.Header{}
        h.Set("X-User", "safe")
      }
    expect_no_match: true
  - name: local set method collision negative
    code: |
      package main
      import "net/http"
      type localHeaders struct{}
      func (localHeaders) Set(string, string) {}
      func hdr(_ *http.Request, value string) {
        custom := localHeaders{}
        custom.Set("X-User", value)
      }
    expect_no_match: true
  description: "http.Header.Set(name, tainted) - response header maps assigned through a local header variable can still carry CRLF/header-injection risk."
