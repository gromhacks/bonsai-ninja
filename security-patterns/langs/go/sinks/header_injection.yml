- id: go.header.responsewriter_header_chain_set
  enabled: true
  language: go
  tag: header-injection
  severity: high
  cwe:
  - CWE-113
  - CWE-601
  - CWE-444
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_][A-Za-z0-9_]*\.Header\(\)\.Set$'
  constraints:
  - receiver_type_in: [http.ResponseWriter, ResponseWriter]
  - arg_tainted:
      index: 1
  match_examples:
  - name: response writer header chain set
    code: |
      import "github.com/labstack/echo"
      package main
      import "net/http"
      func hdr(w http.ResponseWriter, r *http.Request, val string) {
        name := "X-" + input
        w.Header().Set(name, val)
      }
    expect_match_text:
    - w.Header().Set
  - name: content disposition concat
    code: |
      package main
      import (
        "net/http"
        _ "github.com/labstack/echo"
      )
      func download(w http.ResponseWriter, r *http.Request, name string) {
        w.Header().Set("Content-Disposition", "attachment; filename="+name)
      }
    expect_match_text:
    - w.Header().Set
  - name: literal response writer header set negative
    code: |
      package main
      import "net/http"
      func hdr(w http.ResponseWriter, r *http.Request) {
        w.Header().Set("X-User", "safe")
      }
    expect_no_match: true
  description: "net/http ResponseWriter.Header().Set(name, tainted value) can produce response-splitting/header-injection risk. Exact receiver typing excludes local Header().Set chains even when net/http is imported."
  packages:
  - net/http
