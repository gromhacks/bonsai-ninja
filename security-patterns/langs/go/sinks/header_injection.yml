- id: go.header.set_cookie
  enabled: true
  language: go
  tag: header-injection
  severity: medium
  packages:
  - net/http
  cwe:
  - CWE-113
  match:
    kind: call
    callee:
      attribute:
      - http
      - SetCookie
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted set-cookie object
    code: |
      import "net/http"
      package main

      func example(w http.ResponseWriter, cookie *http.Cookie) {
        http.SetCookie(w, cookie)
      }
  - name: literal set-cookie object negative
    code: |
      import "net/http"
      package main

      func example(w http.ResponseWriter) {
        http.SetCookie(w, &http.Cookie{Name: "sid", Value: "safe"})
      }
    expect_no_match: true
  description: "http.SetCookie(w, cookie) — tainted cookie name/value reaches Set-Cookie header."
