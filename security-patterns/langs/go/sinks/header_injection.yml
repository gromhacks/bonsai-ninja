- id: go.header.gin_fileattachment
  enabled: true
  language: go
  tag: header-injection
  severity: high
  packages:
  - github.com/gin-gonic/gin
  cwe:
  - CWE-113
  match:
    kind: call
    callee:
      regex: \.FileAttachment$
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: gin file attachment tainted filename
    code: "package main\nimport \"github.com/gin-gonic/gin\"\nfunc download(c *gin.Context, file string, name string) {\n  c.FileAttachment(file, name)\n}\n"
    expect_match_text:
    - c.FileAttachment
  - name: literal gin file attachment filename negative
    code: "package main\nimport \"github.com/gin-gonic/gin\"\nfunc download(c *gin.Context, file string) {\n  c.FileAttachment(file, \"report.txt\")\n}\n"
    expect_no_match: true
  description: "gin Context.FileAttachment(file, filename) — filename argument is used to build Content-Disposition; CR/LF or quote injection can corrupt response headers."
