- id: go.ssrf.client_do
  enabled: true
  language: go
  tag: ssrf
  severity: high
  packages:
  - net/http
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      regex: ^(client|httpClient|hc|http\.DefaultClient)\.Do$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: client do request
    code: "package main\nimport \"net/http\"\nfunc fetch(client *http.Client, req\
      \ *http.Request) {\n  _, _ = client.Do(req)\n}\n"
    expect_match_text:
    - client.Do
  - name: short client do request
    code: "package main\nimport \"net/http\"\nfunc fetch(hc *http.Client, req *http.Request)\
      \ {\n  _, _ = hc.Do(req)\n}\n"
    expect_match_text:
    - hc.Do
  - name: literal request client do negative
    code: |
      package main
      import "net/http"
      func fetch(client *http.Client) {
        req, _ := http.NewRequest("GET", "https://example.test/health", nil)
        _, _ = client.Do(req)
      }
    expect_no_match: true
  description: "*http.Client.Do(req) \u2014 when req.URL came from user input this\
    \ fetches attacker-chosen URL."
