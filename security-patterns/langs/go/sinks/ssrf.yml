    - client.Do
  - name: short client do request
    code: "package main\nimport \"net/http\"\nfunc fetch(hc *http.Client, req *http.Request) {\n  _, _ = hc.Do(req)\n}\n"
    expect_match_text:
    - hc.Do
  - name: literal request client do negative
    code: |
