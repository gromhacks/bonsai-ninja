- id: go.ssrf.http_newrequest
  enabled: true
  language: go
  tag: ssrf
  severity: medium
  packages:
  - net/http
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute:
      - http
      - NewRequest
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: net http new request
    code: |
      package main
      import "net/http"
      func fetch(r *http.Request, url string) {
        _, _ = http.NewRequest("GET", url, nil)
      }
    expect_match_text:
    - http.NewRequest
  - name: literal new request url with variable method negative
    code: |
      package main
      import "net/http"
      func fetch(method string) {
        _, _ = http.NewRequest(method, "https://example.test/health", nil)
      }
    expect_no_match: true
  description: "http.NewRequest(method, url, body) - only arg 1 is SSRF-relevant."
