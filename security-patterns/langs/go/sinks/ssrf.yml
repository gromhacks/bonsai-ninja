  - name: generated direct match
    code: |
      import "net/http/httputil"
      package main

      func example(target string) {
        name := "user"
        value := "value"
        httputil.NewSingleHostReverseProxy(target)
      }
  - name: literal reverse proxy target negative
    code: |
      import (
        "net/http/httputil"
        "net/url"
      )
