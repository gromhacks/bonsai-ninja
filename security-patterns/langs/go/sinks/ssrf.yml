- id: go.ssrf.http_get
  enabled: true
  language: go
  tag: ssrf
  severity: high
  packages:
  - net/http
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      regex: ^http\.Get$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: net http get
    code: "package main\nimport \"net/http\"\nfunc fetch(target string) {\n  _, _ = http.Get(target)\n}\n"
    expect_match_text:
    - http.Get
  - name: chi query into http get
    code: |
      package main
      import (
        "net/http"
        "github.com/go-chi/chi/v5"
      )
      func handler(r *http.Request, target string) {
        _ = chi.URLParam(r, "id")
        _, _ = http.Get(target)
      }
    expect_match_text:
    - http.Get
  - name: literal http get url negative
    code: |
      package main
      import "net/http"
      func fetch() {
        _, _ = http.Get("https://example.test/health")
      }
    expect_no_match: true
  description: "http.Get(tainted URL) - server-side fetch of attacker-chosen URL."
- id: go.ssrf.http_client_get
  enabled: true
  language: go
  tag: ssrf
  severity: high
  packages:
  - net/http
  cwe:
  - CWE-918
  analysis_semantics:
    url_network_guard:
      root:
        kind: sink-argument-accessor
        argument_index: 0
        accessor: {name: String}
      parser:
        regex: '^[A-Za-z_][A-Za-z0-9_]*\.Parse$'
      scheme:
        component:
          field: Scheme
        allowed_values: [https]
      host_allowlist:
        component:
          accessor: {name: Hostname}
      dns:
        resolver:
          regex: '^net\.LookupIP$'
        private_address_predicates:
        - {name: IsLoopback}
        - {name: IsPrivate}
        - {name: IsLinkLocalUnicast}
      redirect:
        kind: receiver-field-exact-callback
        field: CheckRedirect
        required_return_place: http.ErrUseLastResponse
  match:
    kind: call
    callee:
      regex: ^(client|httpClient|hc|http\.DefaultClient)\.Get$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: net http client get
    code: |
      package main
      import (
        "net/http"
      )
      func fetch(r *http.Request, url string) {
        client := &http.Client{}
        _, _ = client.Get(url)
      }
    expect_match_text:
    - client.Get
  - name: net http default client get
    code: |
      package main
      import "net/http"
      func fetch(r *http.Request, url string) {
        _, _ = http.DefaultClient.Get(url)
      }
    expect_match_text:
    - http.DefaultClient.Get
  - name: net http short client get
    code: |
      package main
      import "net/http"
      func fetch(r *http.Request, hc *http.Client, target string) {
        _, _ = hc.Get(target)
      }
    expect_match_text:
    - hc.Get
  - name: literal http client get url negative
    code: |
      package main
      import "net/http"
      func fetch(client *http.Client) {
        _, _ = client.Get("https://example.test/health")
      }
    expect_no_match: true
  description: "(*http.Client).Get(tainted URL), including http.DefaultClient.Get - method form of net/http SSRF."
