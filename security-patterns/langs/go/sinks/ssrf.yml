  packages:
  - net/http/httputil
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute:
      - httputil
      - NewSingleHostReverseProxy
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: "import \"net/http/httputil\"\npackage main\n\nfunc example() {\n  target\
      \ := \"tainted\"\n  name := \"user\"\n  value := \"value\"\n  httputil.NewSingleHostReverseProxy(target)\n\
