    kind: call
    callee:
      attribute:
      - net
      - Dial
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: |
      import "net"
      package main

      func example(target string) {
        name := "user"
        value := "value"
        net.Dial("tcp", target)
      }
  - name: literal net dial address negative
    code: |
      import "net"
      package main

      func example(network string) {
        net.Dial(network, "example.test:443")
      }
    expect_no_match: true
  description: "net.Dial(network, tainted addr) - raw TCP/UDP to attacker-chosen host."
