- id: go.ssrf.http_get
  enabled: true
  language: go
  tag: ssrf
  severity: medium
  packages:
  - net/http
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      regex: ^http\.Get$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: net http get
    code: "package main\nimport \"net/http\"\nfunc fetch(target string) {\n  _, _\
      \ = http.Get(target)\n}\n"
    expect_match_text:
    - http.Get
  - name: chi query into http get
    code: "package main\nimport (\n  \"net/http\"\n  \"github.com/go-chi/chi/v5\"\n\
      )\nfunc handler(r *http.Request) {\n  _ = chi.URLParam(r, \"id\")\n  target\
      \ := \"https://example.test\"\n  _, _ = http.Get(target)\n}\n"
    expect_match_text:
    - http.Get
  - name: literal http get url negative
    code: |
      package main
      import "net/http"
      func fetch() {
        _, _ = http.Get("https://example.test/health")
      }
    expect_no_match: true
  description: "http.Get(tainted URL) \u2014 server-side fetch of attacker-chosen\
    \ URL."
- id: go.ssrf.http_client_get
  enabled: true
  language: go
  tag: ssrf
  severity: high
  packages:
  - net/http
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      regex: ^(client|httpClient|hc|http\.DefaultClient)\.Get$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: net http client get
    code: "package main\nimport (\n  \"net/http\"\n)\nfunc fetch(r *http.Request)\
      \ {\n  url := \"https://example.test\"\n  client := &http.Client{}\n  _, _ =\
      \ client.Get(url)\n}\n"
    expect_match_text:
    - client.Get
  - name: net http default client get
    code: "package main\nimport \"net/http\"\nfunc fetch(r *http.Request) {\n  url\
      \ := \"https://example.test\"\n  _, _ = http.DefaultClient.Get(url)\n}\n"
    expect_match_text:
    - http.DefaultClient.Get
  - name: net http short client get
    code: "package main\nimport \"net/http\"\nfunc fetch(r *http.Request, hc *http.Client)\
      \ {\n  target := \"https://example.test\"\n  _, _ = hc.Get(target)\n}\n"
    expect_match_text:
    - hc.Get
  - name: literal http client get url negative
    code: |
      package main
      import "net/http"
      func fetch(client *http.Client) {
        _, _ = client.Get("https://example.test/health")
      }
    expect_no_match: true
  description: "(*http.Client).Get(tainted URL), including http.DefaultClient.Get\
    \ \u2014 method form of net/http SSRF."
