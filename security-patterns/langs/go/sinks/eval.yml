  disabled_reason:
    code: requires-constraint
  language: go
  tag: code-injection
  severity: high
  packages:
  - github.com/d5/tengo/v2
  cwe:
  - CWE-94
  match:
    kind: call
    callee:
      regex: tengo\.NewScript\([^)]*\)\.Compile$
  description: "Disabled — the tainted script is an argument to tengo.NewScript(...), while this rule anchors on the chained Compile() call with no arguments."
- id: go.eval.anko_execute
  enabled: true
  language: go
  tag: code-injection
  severity: high
  packages:
  - github.com/mattn/anko/vm
  - text/template
  - github.com/gobuffalo/buffalo
  cwe:
  - CWE-94
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - vm
      - Execute
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: anko execute script
    code: "package main\nimport \"github.com/mattn/anko/vm\"\nfunc run(src string) {\n  _, _ = vm.Execute(nil, nil, src)\n}\n"
    expect_match_text:
    - vm.Execute
  - name: literal anko script negative
    code: |
      package main
      import "github.com/mattn/anko/vm"

      func run() {
        _, _ = vm.Execute(nil, nil, "println(1)")
      }
    expect_no_match: true
  description: "anko vm.Execute(env, stmts, taintedSource) — executes attacker-controlled Anko script text. Merged collision aliases: go.template.text_template_execute_html."
  aliases:
  - go.template.text_template_execute_html
