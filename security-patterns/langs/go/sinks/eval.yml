  - github.com/go-redis/redis
  cwe:
  - CWE-94
  - CWE-943
  match:
    kind: call
    callee:
      attribute:
      - expr
      - Eval
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted expr eval source
    code: |
      package main
      import "github.com/antonmedv/expr"

      func run(source string) {
        expr.Eval(source, nil)
      }
    expect_match_text:
    - expr.Eval
  - name: literal expr eval source negative
    code: |
      package main
      import "github.com/antonmedv/expr"

      func run() {
        expr.Eval("user.Name == 'alice'", nil)
      }
    expect_no_match: true
  description: "expr.Eval(tainted, env) — one-shot evaluate of tainted expression. Merged collision aliases: go.eval.yaegi_eval, go.nosql.redis_eval."
  aliases:
  - go.eval.yaegi_eval
  - go.nosql.redis_eval
