- id: go.eval.starlark_execfile
  enabled: true
  language: go
  tag: code-injection
  severity: critical
  packages:
  - go.starlark.net
  cwe:
  - CWE-94
  match:
    kind: call
    callee:
      attribute:
      - starlark
      - ExecFile
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: tainted starlark source
    code: |
      package main
      import "go.starlark.net/starlark"

      func example(src string) {
        starlark.ExecFile(nil, "user.star", src, nil)
      }
  - name: literal starlark source negative
    code: |
      package main
      import "go.starlark.net/starlark"

      func example(src string) {
        starlark.ExecFile(nil, "safe.star", "x = 1", nil)
      }
    expect_no_match: true
  description: "starlark.ExecFile(thread, filename, source, predeclared) — executes tainted Starlark source in-process."
- id: go.eval.gopher_lua_dostring
  enabled: true
  language: go
  tag: code-injection
  severity: critical
  packages:
  - github.com/yuin/gopher-lua
  cwe:
  - CWE-94
  match:
    kind: call
    callee:
      regex: \.DoString$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted lua source
    code: |
      package main
      import "github.com/yuin/gopher-lua"

      func run(script string) {
        obj.DoString(script)
      }
      var obj *lua.LState
    expect_match_text:
    - obj.DoString
  - name: literal lua source negative
    code: |
      package main
      import "github.com/yuin/gopher-lua"

      func run() {
        obj.DoString("print('ok')")
      }
      var obj *lua.LState
    expect_no_match: true
  description: "gopher-lua LState.DoString — runs tainted Lua; RCE inside the Lua sandbox (and escapes are common)."
