  - receiver_type_in: [interp.Interpreter, Interpreter]
  - arg_tainted:
      index: 0
  match_examples:
  - name: yaegi interpreter evaluates tainted Go
    code: |
      package main
      import "github.com/traefik/yaegi/interp"
      func run(engine *interp.Interpreter, source string) {
        _, _ = engine.Eval(source)
      }
    expect_match_text: [engine.Eval]
  - name: yaegi interpreter literal source negative
    code: |
      package main
      import "github.com/traefik/yaegi/interp"
      func run(engine *interp.Interpreter) {
        _, _ = engine.Eval("1 + 1")
      }
    expect_no_match: true
  - name: local eval method collision negative
    code: |
      package main
      import "github.com/traefik/yaegi/interp"
      type localEvaluator struct{}
      func (localEvaluator) Eval(string) {}
      func run(_ *interp.Interpreter, evaluator localEvaluator, source string) {
        evaluator.Eval(source)
      }
    expect_no_match: true
  description: "Yaegi Interpreter.Eval(tainted Go source) executes attacker-controlled code. Exact receiver typing separates it from expression and datastore Eval APIs."
