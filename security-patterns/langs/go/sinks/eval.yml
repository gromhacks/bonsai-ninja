- id: go.eval.starlark_execfile
  enabled: true
  language: go
  tag: code-injection
  severity: critical
  packages:
  - go.starlark.net
  cwe:
  - CWE-94
  match:
    kind: call
    callee:
      attribute:
      - starlark
      - ExecFile
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: tainted starlark source
    code: |
      package main
      import "go.starlark.net/starlark"

      func example(src string) {
        starlark.ExecFile(nil, "user.star", src, nil)
      }
  - name: literal starlark source negative
    code: |
      package main
      import "go.starlark.net/starlark"

      func example(src string) {
        starlark.ExecFile(nil, "safe.star", "x = 1", nil)
      }
    expect_no_match: true
  description: "starlark.ExecFile(thread, filename, source, predeclared) - executes tainted Starlark source in-process."
- id: go.eval.otto_run
  enabled: true
  language: go
  tag: code-injection
  severity: critical
  packages:
  - github.com/robertkrimen/otto
  cwe:
  - CWE-94
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_][A-Za-z0-9_]*\.Run$'
  constraints:
  - receiver_type_in: [otto.Otto, Otto]
  - arg_tainted:
      index: 0
  match_examples:
  - name: otto runtime executes tainted javascript
    code: |
      package main
      import "github.com/robertkrimen/otto"
      func run(vm *otto.Otto, source string) {
        _, _ = vm.Run(source)
      }
    expect_match_text: [vm.Run]
  - name: otto runtime executes literal javascript negative
    code: |
      package main
      import "github.com/robertkrimen/otto"
      func run(vm *otto.Otto) {
        _, _ = vm.Run("1 + 1")
      }
    expect_no_match: true
  - name: local run method collision negative
    code: |
      package main
      import "github.com/robertkrimen/otto"
      type localRunner struct{}
      func (localRunner) Run(string) {}
      func run(_ *otto.Otto, runner localRunner, source string) {
        runner.Run(source)
      }
    expect_no_match: true
  description: "Otto runtime Run(tainted source) evaluates attacker-controlled JavaScript. Exact receiver typing excludes process runners and ordinary Run methods."
