# Go's encoding/xml decoder does not resolve external entities by default.
# A decoder becomes security-relevant only when application code installs a
# CharsetReader that performs remote resolution.
- id: go.xxe.xml_newdecoder
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: xxe
  severity: medium
  packages: ["encoding/xml"]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [xml, NewDecoder]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted xml reader
    code: |
      package main
      import (
        "encoding/xml"
        "io"
      )

      func parse(r io.Reader) {
        xml.NewDecoder(r)
      }
    expect_match_text: [xml.NewDecoder]
  - name: literal xml reader negative
    code: |
      package main
      import (
        "encoding/xml"
        "strings"
      )

      func parse() {
        xml.NewDecoder(strings.NewReader("<root/>"))
      }
    expect_no_match: true
  description: "encoding/xml.NewDecoder(tainted reader) - stdlib ignores DOCTYPE entities by default, but flag because many handlers then stream-decode untrusted XML."

- id: go.xxe.xml_decoder_remote_charset_callback
  enabled: true
  language: go
  tag: xxe
  severity: high
  packages: ["encoding/xml", "net/http"]
  imports: ["encoding/xml", "net/http"]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [xml, NewDecoder]
  constraints:
  - receiver_origin_callback_param_reaches_call:
      receiver_factory:
        attribute: [xml, NewDecoder]
      factory_tainted_arg_index: 0
      receiver_member:
        regex: ^[^\.\s]+\.CharsetReader$
      callback_param_index: 0
      callback_call:
        attribute: [http, Get]
      callback_call_arg_index: 0
  match_examples:
  - name: tainted decoder remote charset callback
    code: |
      package main
      import (
        "encoding/xml"
        "github.com/labstack/echo"
        "io"
        "net/http"
      )
      func parse(c echo.Context) {
        dec := xml.NewDecoder(c.Request().Body)
        dec.CharsetReader = func(charset string, input io.Reader) (io.Reader, error) {
          response, err := http.Get("https://charset.invalid/" + charset)
          if err != nil {
            return nil, err
          }
          return response.Body, nil
        }
      }
    expect_match_text: [dec.CharsetReader]
  - name: callback parameter not sent to remote call negative
    code: |
      package main
      import (
        "encoding/xml"
        "io"
        "net/http"
      )
      func parse(userInput io.Reader) {
        dec := xml.NewDecoder(userInput)
        dec.CharsetReader = func(charset string, input io.Reader) (io.Reader, error) {
          response, err := http.Get("https://charset.invalid/utf-8")
          if err != nil {
            return nil, err
          }
          return response.Body, nil
        }
      }
    expect_no_match: true
  - name: clean decoder input negative
    code: |
      package main
      import (
        "encoding/xml"
        "io"
        "net/http"
        "strings"
      )
      func parse() {
        dec := xml.NewDecoder(strings.NewReader("<root/>"))
        dec.CharsetReader = func(charset string, input io.Reader) (io.Reader, error) {
          response, err := http.Get("https://charset.invalid/" + charset)
          if err != nil {
            return nil, err
          }
          return response.Body, nil
        }
      }
    expect_no_match: true
  description: "A tainted XML decoder is extended with a CharsetReader callback whose attacker-selected charset parameter reaches an outbound HTTP request. Factory, extension, callback parameter, and network call roles are declared here and proven from compiler facts."

- id: go.xxe.xml_decoder_charsetreader
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: xxe
  category: source-independent
  severity: medium
  packages: ["encoding/xml"]
  cwe: [CWE-611]
  match:
    kind: write
    target:
      regex: ^[^\.\s]+\.CharsetReader$
  constraints:
  - arg_not_matches_regex:
      index: 0
      regex: "^!\\s*[A-Za-z_][A-Za-z0-9_]*\\s*\\[\\s*charset\\s*\\]$"
  match_examples:
  - name: xml decoder charset reader assignment
    code: |
      package main
      import (
        "encoding/xml"
        "io"
      )
      func parse(dec *xml.Decoder, reader func(string, io.Reader) (io.Reader, error)) {
        dec.CharsetReader = reader
      }
    expect_match_text: [dec.CharsetReader]
  - name: allowlisted charset reader negative
    code: |
      package main
      import (
        "encoding/xml"
        "errors"
        "io"
      )
      var allowedCharsets = map[string]bool{"utf-8": true, "us-ascii": true}
      func parse(dec *xml.Decoder) {
        dec.CharsetReader = func(charset string, input io.Reader) (io.Reader, error) {
          if !allowedCharsets[charset] {
            return nil, errors.New("disallowed charset")
          }
          return input, nil
        }
      }
    expect_no_match: true
  description: "Disabled sink-grep rule: assigning a custom CharsetReader is not itself a vulnerability. The enabled remote-callback rule requires compiler proof from a tainted decoder through the callback's charset parameter to an outbound request."

- id: go.xxe.xml_decoder_strict_false
  enabled: true
  language: go
  tag: xxe
  category: source-independent
  severity: medium
  packages: ["encoding/xml"]
  cwe: [CWE-611]
  match:
    kind: write
    target:
      regex: ^[^\.\s]+\.Strict$
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^false$"
  match_examples:
  - name: xml decoder strict disabled
    code: |
      package main
      import "encoding/xml"
      func parse(dec *xml.Decoder) {
        dec.Strict = false
      }
    expect_match_text: [dec.Strict]
  - name: xml decoder strict enabled negative
    code: |
      package main
      import "encoding/xml"
      func parse(dec *xml.Decoder) {
        dec.Strict = true
      }
    expect_no_match: true
  description: "xml.Decoder.Strict = false - disables strict XML parsing; higher risk when paired with a custom CharsetReader or entity handling."

- id: go.xxe.xml_decoder_entity_map
  enabled: true
  language: go
  tag: xxe
  category: source-independent
  severity: medium
  packages: ["encoding/xml"]
  cwe: [CWE-611]
  match:
    kind: write
    target:
      regex: ^[^\.\s]+\.Entity$
  match_examples:
  - name: xml decoder entity assignment
    code: |
      package main
      import "encoding/xml"
      func parse(dec *xml.Decoder, entities map[string]string) {
        dec.Entity = entities
      }
    expect_match_text: [dec.Entity]
  description: "xml.Decoder.Entity assignment - custom entity maps expand attacker-controlled XML entities; audit for unsafe entity expansion."
- id: go.xxe.xml_unmarshal
  enabled: true
  language: go
  tag: xxe
  severity: low
  packages: ["encoding/xml"]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [xml, Unmarshal]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted xml bytes
    code: |
      package main
      import "encoding/xml"

      func parse(data []byte) {
        var out any
        xml.Unmarshal(data, &out)
      }
    expect_match_text: [xml.Unmarshal]
  - name: literal xml bytes negative
    code: |
      package main
      import "encoding/xml"

      func parse() {
        var out any
        xml.Unmarshal([]byte("<root/>"), &out)
      }
    expect_no_match: true
  description: "xml.Unmarshal(tainted) - stdlib is XXE-safe by default; flag for audit of non-stdlib or entity-expansion DoS."

- id: go.xxe.xml_decoder_decode
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: xxe
  severity: low
  packages: ["encoding/xml"]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      regex: "\\.Decode$"
  match_examples:
  - name: xml decoder decode
    code: |
      import "encoding/xml"
      package main
      func example(dec Decoder, out any) {
        dec.Decode(out)
      }
      type Decoder struct{}
      func (d Decoder) Decode(v any) error { return nil }
    expect_match_text: [dec.Decode]
  description: "Disabled - bare `.Decode` cannot be type-disambiguated from gob.Decoder.Decode and stdlib XML decode is low-confidence for XXE by itself. Keep xml.NewDecoder plus CharsetReader/Entity/Strict rules for XML parser audit coverage."
  imports:
  - encoding
