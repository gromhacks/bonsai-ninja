- id: go.open_redirect.framework_redirect_status_url
  enabled: true
  language: go
  tag: open-redirect
  severity: medium
  packages:
  - github.com/gin-gonic/gin
  - github.com/labstack/echo
  - github.com/gofiber/fiber
  - github.com/beego/beego
  - net/http
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.Redirect$
      base_name_in:
      - c
      - ctx
      - ctxt
      - e
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: gin context redirect status url
    code: |
      package main
      import "github.com/gin-gonic/gin"
      func redirect(c *gin.Context, target string) {
        c.Redirect(302, target)
      }
    expect_match_text:
    - c.Redirect
  - name: echo redirect status url
    code: |
      package main
      import "github.com/labstack/echo"
      func redirect(ctx echo.Context, target string) error {
        return ctx.Redirect(302, target)
      }
    expect_match_text:
    - ctx.Redirect
  - name: literal redirect target negative
    code: |
      package main
      import "github.com/gin-gonic/gin"
      func redirect(c *gin.Context) {
        c.Redirect(302, "/home")
      }
    expect_no_match: true
  description: "gin/echo Context.Redirect(status, tainted URL) - review for external absolute URLs; relative-path redirects are usually safe. Merged collision aliases: go.open_redirect.framework_redirect, go.open_redirect.http_redirect."
  aliases:
  - go.open_redirect.framework_redirect
  - go.open_redirect.http_redirect
