- id: go.sqli.pgx_query
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: sql-injection
  severity: high
  packages:
  - github.com/jackc/pgx
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      attribute:
      - pgx
      - Conn
      - Query
  description: "Disabled - real pgx usage is `conn.Query(ctx, sql, args...)` on a local var, not the literal chain `pgx.Conn.Query`; the bare `.Query$` rule (go.sqli.db_query) already covers pgx call shape."
