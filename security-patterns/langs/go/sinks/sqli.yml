- id: go.sqli.gorm_raw
  enabled: true
  language: go
  tag: sql-injection
  severity: high
  packages:
  - gorm.io/gorm
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      regex: \.Raw$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: gorm raw query string
    code: "package main\nimport (\n  \"fmt\"\n  \"gorm.io/gorm\"\n)\nfunc byName(db *gorm.DB, name string) {\n  db.Raw(fmt.Sprintf(\"SELECT * FROM users WHERE name = '%s'\", name))\n}\n"
    expect_match_text:
    - db.Raw
  - name: gorm raw literal negative
    code: "package main\nimport \"gorm.io/gorm\"\nfunc byName(db *gorm.DB, name string) {\n  db.Raw(\"SELECT * FROM users WHERE name = ?\", name)\n}\n"
    expect_no_match: true
  description: "GORM DB.Raw(tainted) - raw SQL; use placeholders or First/Where struct form."
