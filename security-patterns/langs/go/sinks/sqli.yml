- id: go.sqli.db_query
  enabled: true
  language: go
  tag: sql-injection
  severity: high
  packages:
  - database/sql
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      regex: ^(db|tx|stmt|conn|database|d|t|client|sqlDB|sqlTx)\.Query$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted query string
    code: |
      package main
      import "database/sql"

      func example(db *sql.DB, target string) {
        db.Query(target)
      }
    expect_match_text: [db.Query]
  - name: literal query string negative
    code: |
      package main
      import "database/sql"

      func example(db *sql.DB, name string) {
        db.Query("SELECT * FROM users WHERE name = ?", name)
      }
    expect_no_match: true
  description: "database/sql DB.Query / Tx.Query / Stmt.Query - tainted SQL = injection; use ? / $1 placeholders."
