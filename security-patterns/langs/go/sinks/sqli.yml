  - name: sqlx queryx literal negative
    code: "package main\nimport \"github.com/jmoiron/sqlx\"\nfunc list(db *sqlx.DB, q string) {\n  _, _ = db.Queryx(\"SELECT * FROM users WHERE name = ?\", q)\n}\n"
    expect_no_match: true
  - name: echo query param into sqlx queryx
    code: "package main\nimport (\n  \"github.com/jmoiron/sqlx\"\n  \"github.com/labstack/echo\"\n)\nfunc list(c echo.Context, db *sqlx.DB) {\n  q := c.QueryParam(\"q\")\n  _, _ = db.Queryx(\"SELECT * FROM users WHERE name = '\" + q + \"'\")\n}\n"
    expect_match_text:
    - db.Queryx
  description: sqlx DB.Queryx / Tx.Queryx with string-built SQL.
