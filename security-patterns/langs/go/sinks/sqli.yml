- id: go.sqli.gorm_exec
  enabled: false
  disabled_reason:
    code: over-broad
  language: go
  tag: sql-injection
  severity: high
  packages:
  - gorm.io/gorm
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      regex: \.Exec$
  match_examples:
  - name: gorm exec raw sql
    code: "package main\nimport (\n  \"net/http\"\n  \"gorm.io/gorm\"\n)\nfunc update(db *gorm.DB, r *http.Request) {\n  role := \"admin\"\n  db.Exec(\"UPDATE users SET role = '\" + role + \"'\")\n}\n"
    expect_match_text:
    - db.Exec
  description: "Disabled - duplicate call shape with go.sqli.db_exec for receiver `db.Exec`; until semantic receiver facts distinguish GORM from database/sql, the database/sql rule owns Exec sinks, including GORM-style raw SQL examples."
