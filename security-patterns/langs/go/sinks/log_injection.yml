- id: go.log_injection.log_println_concat
  enabled: true
  language: go
  tag: log-injection
  severity: medium
  cwe:
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - log
      - Println
  match_examples:
  - name: generated direct match
    code: "package main\n\nfunc example() {\n  target := \"tainted\"\n  name := \"user\"\n  value := \"value\"\n  log.Println(name + value)\n}\n"
  description: "log.Println(... + tainted) / log.Println(fmt.Sprintf(...)) — CRLF in attacker text forges log entries."
