  - arg_tainted:
      index: 0
  match_examples:
  - name: slog warn tainted message
    code: "package main\nimport \"log/slog\"\nfunc audit(user string) {\n  slog.Warn(\"user=\" + user)\n}\n"
    expect_match_text:
    - slog.Warn
  - name: slog error tainted message
    code: "package main\nimport \"log/slog\"\nfunc audit(user string) {\n  slog.Error(\"user=\" + user)\n}\n"
    expect_match_text:
    - slog.Error
  - name: slog warning ordinary value negative
    code: |
      package main
      import "log/slog"
      func audit(user string) {
        slog.Warn(user)
      }
    expect_no_match: true
  description: slog Debug/Warn/Error with attacker-controlled message text can inject line breaks or forged structured-log records.
- id: go.log_injection.zerolog_msg
  enabled: true
  language: go
  tag: log-injection
  severity: medium
  packages:
  - github.com/rs/zerolog
  cwe:
  - CWE-117
  match:
    kind: call
    callee:
      regex: \.Msg$
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(\+|fmt\.Sprintf|Sprintf|\\n|\\r)'
  - arg_tainted:
      index: 0
  match_examples:
  - name: zerolog tainted message
    code: |
      import "github.com/rs/zerolog"
      package main
      func audit(event Event, user string) {
        event.Msg("user=" + user)
      }
      type Event struct{}
      func (e Event) Msg(msg string) {}
    expect_match_text:
    - event.Msg
  - name: zerolog ordinary message negative
    code: |
      import "github.com/rs/zerolog"
      package main
      func audit(event Event, user string) {
        event.Msg(user)
      }
      type Event struct{}
      func (e Event) Msg(msg string) {}
    expect_no_match: true
  description: "zerolog Event.Msg(taintedMessage) — attacker-controlled log message text can forge log output. Merged aliases: go.log_injection.zerolog_msg_concat."
  aliases:
  - go.log_injection.zerolog_msg_concat
