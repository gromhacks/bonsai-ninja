- id: go.log_injection.logger_info_concat
  enabled: true
  language: go
  tag: log-injection
  severity: high
  cwe:
  - CWE-117
  packages:
  - github.com/sirupsen/logrus
  - go.uber.org/zap
  - github.com/rs/zerolog
  imports:
  - github.com/sirupsen/logrus
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.Info$"
      base_name_in: [logger, log, lgr, _logger, sugar, slogger, zlog]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(\+|fmt\.Sprintf|Sprintf|\\n|\\r)'
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      package main
      import "github.com/sirupsen/logrus"
      func example(name string, value string) {
        logger := logrus.New()
        logger.Info(name + value)
      }
  - name: log var alias match
    code: |
      package main
      import "github.com/sirupsen/logrus"
      func example(name string, value string) {
        log := logrus.New()
        log.Info(name + value)
      }
    expect_match_text: [log.Info]
  - name: logger info ordinary value negative
    code: |
      package main
      import "github.com/sirupsen/logrus"
      func example(user string) {
        logger := logrus.New()
        logger.Info(user)
      }
    expect_no_match: true
  description: "<receiver>.Info(... + tainted) - log-injection via concat (logrus/zap/zerolog). WS4 receiver-name keying: was attribute:[logger,Info] which missed the common var aliases (log/lgr/sugar); now regex+base_name_in over conventional logger var names, gated on the logger frameworks (required for receiver-agnostic regexes). The stdlib `log` package has no .Info (Print/Println/Fatal/Panic), so log.Info is always a structured logger - no collision with go.log_injection.log_*; slog excluded (its own rule)."
- id: go.log_injection.slog_info_concat
  enabled: true
  language: go
  tag: log-injection
  severity: high
  packages:
  - log/slog
  cwe:
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - slog
      - Info
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(\+|fmt\.Sprintf|Sprintf|\\n|\\r)'
  - arg_tainted:
      index: 0
  match_examples:
  - name: slog info concat
    code: "package main\nimport \"log/slog\"\nfunc audit(user string) {\n  slog.Info(\"login user=\" + user)\n}\n"
    expect_match_text:
    - slog.Info
  - name: slog info ordinary value negative
    code: |
      package main
      import "log/slog"
      func audit(user string) {
        slog.Info(user)
      }
    expect_no_match: true
  description: "slog.Info(... + tainted) - concatenated attacker text in structured log messages can forge log entries. Merged aliases: go.log_injection.slog_info_message, go.log_injection.slog_info_constant_message_arg."
  aliases:
  - go.log_injection.slog_info_message
  - go.log_injection.slog_info_constant_message_arg
