- id: go.log_injection.log_println_concat
  enabled: true
  language: go
  tag: log-injection
  severity: high
  cwe:
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - log
      - Println
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(\+|fmt\.Sprintf|Sprintf|\\n|\\r)'
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      package main

      func example(name string, value string) {
        target := "tainted"
        log.Println(name + value)
      }
  - name: log println ordinary value negative
    code: |
      package main
      func example(user string) {
        log.Println(user)
      }
    expect_no_match: true
  description: "log.Println(... + tainted) / log.Println(fmt.Sprintf(...)) - CRLF in attacker text forges log entries."
