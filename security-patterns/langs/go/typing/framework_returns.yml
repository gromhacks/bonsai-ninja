# Non-finding Go framework return types. These rules enrich compiler receiver
# and value facts; they never emit findings.
- id: go.typing.os_exec_command
  enabled: true
  language: go
  packages: [os/exec]
  imports: [os/exec]
  returns_type: exec.Cmd
  match: { kind: call, callee: { attribute: [exec, Command], binding_origin: imported } }
  match_examples:
  - name: os exec command factory
    code: |
      package main
      import "os/exec"
      func run() { cmd := exec.Command("id"); _, _ = cmd.StdoutPipe() }
    expect_match_text: [exec.Command]
  - name: local exec-shaped value is not os exec
    code: |
      package main
      import stdexec "os/exec"
      var _ = stdexec.Command
      type localExec struct{}
      func (localExec) Command(string) string { return "safe" }
      func run(exec localExec) { _ = exec.Command("id") }
    expect_no_match: true
  description: "os/exec.Command returns *exec.Cmd; provider identity remains rulepack data."

- id: go.typing.os_exec_command_context
  enabled: true
  language: go
  packages: [os/exec]
  imports: [os/exec]
  returns_type: exec.Cmd
  match: { kind: call, callee: { attribute: [exec, CommandContext], binding_origin: imported } }
  match_examples:
  - name: os exec command context factory
    code: |
      package main
      import (
        "context"
        "os/exec"
      )
      func run() { cmd := exec.CommandContext(context.Background(), "id"); _, _ = cmd.StderrPipe() }
    expect_match_text: [exec.CommandContext]
  - name: local exec-shaped context factory is not os exec
    code: |
      package main
      import stdexec "os/exec"
      var _ = stdexec.CommandContext
      type localExec struct{}
      func (localExec) CommandContext(any, string) string { return "safe" }
      func run(exec localExec, ctx any) { _ = exec.CommandContext(ctx, "id") }
    expect_no_match: true
  description: "os/exec.CommandContext returns *exec.Cmd; provider identity remains rulepack data."

- id: go.typing.http_context_param_string
  enabled: true
  language: go
  returns_type: string
  packages:
  - github.com/gin-gonic/gin
  - github.com/labstack/echo
  - github.com/kataras/iris/v12
  - github.com/gobuffalo/buffalo
  match:
    kind: call
    callee:
      name: Param
  constraints:
  - receiver_type_in: [Context, Ctx]
  match_examples:
  - name: Gin path parameter returns a string
    code: |
      package main
      import "github.com/gin-gonic/gin"
      func handler(c *gin.Context) {
        id := c.Param("id")
        _ = id
      }
    expect_match_text: [c.Param]
  description: "Go framework path-parameter accessors return a typed string. Typing-only; never a finding."

- id: go.typing.logrus_new_logger
  enabled: true
  language: go
  packages: [github.com/sirupsen/logrus]
  imports: [github.com/sirupsen/logrus]
  returns_type: logrus.Logger
  match:
    kind: call
    callee:
      attribute: [logrus, New]
      binding_origin: imported
  match_examples:
  - name: logrus New returns a logger
    code: |
      package main
      import "github.com/sirupsen/logrus"
      func audit() { arbitrary := logrus.New(); arbitrary.Info("ready") }
    expect_match_text: [logrus.New]
  - name: local logrus-shaped factory is not the imported provider
    code: |
      package main
      import standard "github.com/sirupsen/logrus"
      var _ = standard.New
      type factory struct{}
      func (factory) New() string { return "safe" }
      func audit(logrus factory) { _ = logrus.New() }
    expect_no_match: true
  description: "logrus.New returns a logrus.Logger; typing-only receiver evidence for logging rules."

