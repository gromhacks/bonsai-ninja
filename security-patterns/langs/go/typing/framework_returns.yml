- id: go.typing.zap_sugared_logger
  enabled: true
  language: go
  packages: [go.uber.org/zap]
  imports: [go.uber.org/zap]
  returns_type: zap.SugaredLogger
  match:
    kind: call
    callee:
      name: Sugar
  constraints:
  - receiver_type_in: [zap.Logger]
  match_examples:
  - name: zap Logger Sugar returns a SugaredLogger
    code: |
      package main
      import "go.uber.org/zap"
      func audit() { base := zap.NewNop(); arbitrary := base.Sugar(); arbitrary.Info("ready") }
    expect_match_text: [base.Sugar]
  - name: unrelated Sugar method does not gain zap type
    code: |
      package main
      import standard "go.uber.org/zap"
      var _ = standard.NewNop
      type recipe struct{}
      func (recipe) Sugar() string { return "safe" }
      func audit(value recipe) { _ = value.Sugar() }
    expect_no_match: true
  description: "zap.Logger.Sugar returns zap.SugaredLogger; typing-only receiver evidence for logging rules."
