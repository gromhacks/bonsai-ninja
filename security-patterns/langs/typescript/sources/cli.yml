# TypeScript CLI / environment input sources.
- id: typescript.source.readline_question
  enabled: true
  language: typescript
  trust: local
  tag: cli-input
  payload_types: [text]
  packages: [readline, readline-sync]
  match:
    kind: call
    callee:
      name: question
  constraints:
  - min_args: 1
  taint_semantics:
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: readline question
    code: |
      const _u = require("readline");
      function demo(input, req, obj) {
        return question(input);
      }
  - name: readline question callback
    code: |
      const _u = require("readline");
      function demo(rl: any) {
        rl.question("name?", (answer: string) => {
          return answer;
        });
      }
    expect_match_text: [rl.question]
  - name: readline question no args negative
    code: |
      const _u = require("readline");
      function demo(question: any) {
        return question();
      }
    expect_no_match: true
  description: "readline.Interface.question(query, callback) and readline-sync question(query) - interactive stdin prompt. Callback answer parameters and synchronous return values are attacker-controlled."

