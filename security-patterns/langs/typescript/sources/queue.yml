  match_examples:
  - name: pubsub message data
    code: |
      const _u = require("@google-cloud/pubsub");
      function demo(input, req, obj) {
        return message.data;
      }
  description: "GCP Pub/Sub Message.data - publisher-controlled Buffer. This owns the ambiguous `message.data` adapter fact; WebSocket structured frames use `frame.data` / `packet.data` to avoid duplicate source evidence."

