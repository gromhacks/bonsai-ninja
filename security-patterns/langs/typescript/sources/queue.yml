# TypeScript message-queue sources (kafkajs / amqplib / bullmq / SQS / PubSub).
- id: typescript.source.kafkajs_message_value
  enabled: true
  language: typescript
  trust: service
  tag: queue-input
  packages: [kafkajs]
  match:
    kind: read
    target:
      attribute: [message, value]
  match_examples:
  - name: kafkajs message value
    code: |
      const _u = require("kafkajs");
      function demo(input, req, obj) {
        return message.value;
      }
  description: "kafkajs consumer message.value - producer-controlled bytes."

- id: typescript.source.kafkajs_message_key
  enabled: true
  language: typescript
  trust: service
  tag: queue-input
  packages: [kafkajs]
  match:
    kind: read
    target:
      attribute: [message, key]
  match_examples:
  - name: kafkajs message key
    code: |
      const _u = require("kafkajs");
      function demo() {
        return message.key;
      }
    expect_match_text: [message.key]
  - name: unrelated message property negative
    code: |
      const _u = require("kafkajs");
      function demo() {
        return message.offset;
      }
    expect_no_match: true
  description: "kafkajs consumer message.key - producer-controlled partition key, frequently used downstream as a lookup/identifier value."

