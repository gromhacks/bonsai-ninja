# TypeScript message-queue sources (kafkajs / amqplib / bullmq / SQS / PubSub).
- id: typescript.source.kafkajs_message_value
  enabled: true
  language: typescript
  trust: service
  tag: queue-input
  packages: [kafkajs]
  match:
    kind: read
    target:
      attribute: [message, value]
  match_examples:
  - name: kafkajs message value
    code: |
      const _u = require("kafkajs");
      function demo(input, req, obj) {
        return message.value;
      }
  description: "kafkajs consumer message.value - producer-controlled bytes."

- id: typescript.source.amqplib_msg_content
  enabled: true
  language: typescript
  trust: service
  tag: queue-input
  packages: [amqplib]
  match:
    kind: read
    target:
      attribute: [msg, content]
  match_examples:
  - name: amqplib msg content
    code: |
      const _u = require("amqplib");
      function demo(input, req, obj) {
        return msg.content;
      }
  description: "amqplib msg.content - RabbitMQ publisher-controlled bytes."

- id: typescript.source.bullmq_job_data
  enabled: true
  language: typescript
  trust: service
  tag: queue-input
  packages: [bullmq, bull]
  match:
    kind: read
    target:
      attribute: [job, data]
  match_examples:
  - name: bullmq job data
    code: |
      const _u = require("bullmq");
      function demo(input, req, obj) {
        return job.data;
      }
  description: "bullmq/bull Job.data - enqueuer-controlled payload."

- id: typescript.source.sqs_message_body
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: typescript
  trust: service
  tag: queue-input
  packages: ["@aws-sdk/client-sqs"]
  match:
    kind: read
    target:
      attribute: [Message, Body]
  description: "Disabled - adapters index local receivers like `message.Body`, not receiver types like `Message.Body`."

- id: typescript.source.pubsub_message_data
  enabled: true
  language: typescript
  trust: service
  tag: queue-input
  packages: ["@google-cloud/pubsub"]
  match:
    kind: read
    target:
      attribute: [message, data]
  match_examples:
  - name: pubsub message data
    code: |
      const _u = require("@google-cloud/pubsub");
      function demo(input, req, obj) {
        return message.data;
      }
  description: "GCP Pub/Sub Message.data - publisher-controlled Buffer. This owns the ambiguous `message.data` adapter fact; WebSocket structured frames use `frame.data` / `packet.data` to avoid duplicate source evidence."

