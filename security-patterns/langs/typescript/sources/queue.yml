- id: typescript.source.sqs_message_body
  enabled: true
  language: typescript
  trust: service
  tag: queue-input
  packages: ["@aws-sdk/client-sqs"]
  match:
    kind: read
    target:
      name: Body
      receiver_type_in: [Message]
  match_examples:
  - name: sqs message body read
    code: |
      import { Message } from "@aws-sdk/client-sqs";
      function handle(message: Message): string | undefined {
        const b = message.Body;
        return b;
      }
  description: "SQS Message.Body - queue message body read on a typed Message receiver."

