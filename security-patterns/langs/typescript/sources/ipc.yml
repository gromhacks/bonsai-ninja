- id: typescript.source.process_message_callback
  enabled: true
  language: typescript
  trust: ipc
  tag: ipc-input
  payload_types: [event, json]
  match:
    kind: call
    callee:
      attribute: [process, "on"]
  constraints:
  - arg_count: 2
  - arg_matches_regex:
      index: 0
      regex: "^['\"]message['\"]$"
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: typed Node child-process IPC message
    code: |
      process.on("message", message => {
        sink(message);
      });
    expect_match_text: [process.on]
  - name: process lifecycle event has no IPC payload
    code: |
      process.on("exit", code => sink(code));
    expect_no_match: true
  description: "First parameter of process.on('message', listener) - structured IPC data delivered by a Node parent or cluster controller."

- id: typescript.source.worker_parent_port_message_callback
  enabled: true
  language: typescript
  trust: ipc
  tag: ipc-input
  payload_types: [event, json]
  packages: [worker_threads, "node:worker_threads"]
  match:
    kind: call
    callee:
      attribute: [parentPort, "on"]
  constraints:
  - arg_count: 2
  - arg_matches_regex:
      index: 0
      regex: "^['\"]message['\"]$"
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: typed worker parentPort message
    code: |
      import { parentPort } from "node:worker_threads";
      parentPort!.on("message", value => sink(value));
    expect_match_text: [parentPort!.on]
  - name: non-message parentPort event has no message payload
    code: |
      import { parentPort } from "node:worker_threads";
      parentPort!.on("close", () => cleanup());
    expect_no_match: true
  description: "First parameter of parentPort.on('message', listener) - structured-clone data received from the owning Node thread."

- id: typescript.source.worker_message_port_callback
  enabled: true
  language: typescript
  trust: ipc
  tag: ipc-input
  payload_types: [event, json]
  packages: [worker_threads, "node:worker_threads"]
  match:
    kind: call
    callee:
      name: "on"
  constraints:
  - receiver_type_in: [MessagePort]
  - arg_count: 2
  - arg_matches_regex:
      index: 0
      regex: "^['\"]message['\"]$"
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: typed MessagePort callback
    code: |
      import type { MessagePort } from "node:worker_threads";
      function attach(port: MessagePort) {
        port.on("message", value => sink(value));
      }
    expect_match_text: [port.on]
  - name: ordinary emitter message is not a typed MessagePort
    code: |
      import type { MessagePort } from "node:worker_threads";
      class Emitter { on(name: string, cb: Function) {} }
      function attach(emitter: Emitter) {
        emitter.on("message", value => sink(value));
      }
    expect_no_match: true
  description: "First parameter of a compiler-typed worker_threads MessagePort 'message' listener - data received through that port."
