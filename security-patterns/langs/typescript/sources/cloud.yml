# TypeScript cloud-event sources whose producer is a service or broker.
- id: typescript.source.cloudevents_data
  enabled: true
  language: typescript
  trust: service
  tag: cloud-event
  packages: [cloudevents]
  match:
    kind: read
    target: { attribute: [cloudEvent, data] }
  match_examples:
  - name: cloudevents data
    code: |
      const _u = require("cloudevents");
      function demo() { return cloudEvent.data; }
    expect_match_text: [cloudEvent.data]
  description: "CloudEvents cloudEvent.data attribute - service-delivered event payload."
