- id: typescript.source.graphql_resolver_args
  enabled: true
  language: typescript
  trust: remote
  tag: graphql-input
  category: graphql-input
  payload_types: [graphql]
  packages: [graphql, "@nestjs/graphql", "type-graphql", apollo-server-hapi, "@apollo/server", graphql-yoga, "@graphql-yoga/node", express-graphql]
  match:
    kind: param
    target:
      name: args
      param_index_in: [1]
  match_examples:
  - name: graphql resolver args param
    code: |
      const _u = require("graphql");
      function resolver(parent: unknown, args: any, context: unknown, info: unknown) {
        return args;
      }
    expect_match_text: [args]
  - name: graphql first args helper negative
    code: |
      const _u = require("graphql");
      function helper(args: any, other: any) {
        return args;
      }
    expect_no_match: true
  description: "GraphQL resolver `(parent, args, ...)` parameter - client-supplied field arguments. The zero-based index gate avoids tainting ordinary first-argument helpers named `args`."

