# TypeScript remote (HTTP / WS / GraphQL / RPC) input sources.
- id: typescript.source.express_req_body
  enabled: true
  language: typescript
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [json]
  frameworks: [express, next, nextjs, restify, polka]
  packages: [express, next, restify, polka]
  match:
    kind: read
    target:
      attribute: [req, body]
  match_examples:
  - name: express req body
    code: |
      const _u = require("express");
      function demo(input, req, obj) {
        return req.body;
      }
  description: "Express-compatible req.body, including restify/polka handlers."

