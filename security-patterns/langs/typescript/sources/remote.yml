  match_examples:
  - name: window location hash
    code: |
      function demo(input, req, obj) {
        return location.hash;
      }
    expect_match_text: [location.hash]
  - name: explicit window location hash
    code: |
      function demo() {
        return window.location.hash;
      }
    expect_match_text: [window.location.hash]
  description: "window.location.hash / location.hash — DOM-XSS source."

