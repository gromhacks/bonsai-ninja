  frameworks: [koa]
  packages: [koa]
  match:
    kind: read
    target:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.headers(\\[['\"]referer['\"]\\]|\\.referer)$"
  description: "Subsumed by typescript.source.koa_ctx_headers, which taints the whole Koa request-header object (the adapter normalizes the `.headers[...]`/`.headers.referer` subscript read to the parent header object)."

