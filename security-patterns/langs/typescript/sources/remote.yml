- id: typescript.source.fastify_req_user_agent
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: typescript.source.fastify_request_headers
  language: typescript
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [header]
  frameworks: [fastify]
  packages: [fastify]
  match:
    kind: read
    target:
      regex: "^req\\.headers$|^(req|request)\\.headers\\.userAgent$"
  match_examples:
  - name: fastify req headers user agent
    code: |
      const _u = require("fastify");
      function demo(req: any) {
        return req.headers["user-agent"];
      }
    expect_match_text: [req.headers]
  - name: fastify request headers userAgent
    code: |
      const _u = require("fastify");
      function demo(request: any) {
        return request.headers.userAgent;
      }
    expect_match_text: [request.headers.userAgent]
  description: "Disabled duplicate — bracket User-Agent reads are surfaced as the whole `req.headers` / `request.headers` object and are already covered by the framework header-object rules; dot `request.headers.userAgent` cannot be kept without colliding on the same example family."

- id: typescript.source.nestjs_body_decorator
  enabled: true
  language: typescript
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [json]
  packages: ["@nestjs/common"]
  match:
    kind: param
    target:
      annotation: Body
  match_examples:
  - name: nestjs body dto parameter
    code: |
      import { Body, Post } from "@nestjs/common";
      class DemoController {
        @Post()
        create(@Body() dto: any) {
          return dto;
        }
      }
    expect_match_text: [dto]
  - name: nestjs body field parameter
    code: |
      import { Body, Post } from "@nestjs/common";
      class DemoController {
        @Post()
        create(@Body("name") name: string) {
          return name;
        }
      }
    expect_match_text: [name]
  description: "NestJS @Body() / @Body('field') parameter — request body DTO or selected body field."

- id: typescript.source.nestjs_message_body_decorator
  enabled: true
  language: typescript
  trust: remote
  tag: ws-input
  payload_types: [event]
  packages: ["@nestjs/websockets"]
  match:
    kind: param
    target:
      annotation: MessageBody
  match_examples:
  - name: nestjs websocket message body
    code: |
      import { MessageBody, SubscribeMessage } from "@nestjs/websockets";
      class EventsGateway {
        @SubscribeMessage("chat")
        handle(@MessageBody() payload: any) {
          return payload;
        }
      }
    expect_match_text: [payload]
  description: "NestJS @SubscribeMessage handler @MessageBody() parameter — websocket caller-controlled message payload."

