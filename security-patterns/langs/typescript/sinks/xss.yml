- id: typescript.xss.innerhtml
  enabled: true
  language: typescript
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: write
    target:
      regex: ^.+\.innerHTML$
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: innerhtml
    code: "function demo(input, req, obj) {\n  obj.innerHTML = input; return obj.innerHTML;\n}\n"
  - name: local innerhtml variable negative
    code: "function demo(input) {\n  const innerHTML = input; return innerHTML;\n}\n"
    expect_no_match: true
  description: Element.innerHTML = tainted.
