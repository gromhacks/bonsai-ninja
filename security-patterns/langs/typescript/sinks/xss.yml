- id: typescript.xss.html_return
  enabled: true
  language: typescript
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: return
    target:
      regex: "(?is)^\\s*(?:`|'|\").*(<!doctype|<html\\b|<[a-z][a-z0-9:-]*\\b[^>]*>)"
  analysis_semantics:
    character_escape:
      required_mappings:
      - {input: "&", output: "&amp;"}
      - {input: "<", output: "&lt;"}
      - {input: ">", output: "&gt;"}
      - {input: '"', output: "&quot;"}
      - {input: "'", output: "&#39;"}
  match_examples:
  - name: raw html template return
    code: "function page(q: string) {\n  return `<!doctype html><h1>${q}</h1>`;\n}\n"
    expect_match_text:
    - "`<!doctype html><h1>${q}</h1>`"
  description: "Route/helper return of raw HTML expression. Taint reachability decides whether interpolated content is attacker controlled."
- id: typescript.xss.serialize_javascript_unsafe_embed
  enabled: true
  language: typescript
  tag: xss
  severity: high
  packages:
  - serialize-javascript
  imports:
  - serialize-javascript
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      regex: ^(serialize|serializeJavascript|serializeJavaScript)$
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: serialize-javascript unsafe option
    code: "import serialize from \"serialize-javascript\";\nfunction embed(input: unknown) {\n  return serialize(input, { unsafe: true });\n}\n"
    expect_match_text:
    - serialize
  - name: serializeJavaScript unsafe option
    code: |
      const _u = require("serialize-javascript");
      function embed(serializeJavaScript: any, input: unknown) {
        return serializeJavaScript(input, { unsafe: true });
      }
    expect_match_text:
    - serializeJavaScript
  - name: arg tainted literal negative
    code: |
      import serialize from "serialize-javascript";
      function embed(input: unknown) {
        return serialize("safe", { unsafe: true });
      }
    expect_no_match: true
  description: serialize-javascript with unsafe embedding options can emit attacker-controlled script-context content.
