- id: typescript.tls.grpc_create_insecure
  enabled: true
  language: typescript
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [grpc, "@grpc/grpc-js"]
  cwe: [CWE-319]
  match:
    kind: call
    callee:
      regex: "^(grpc\\.)?credentials\\.createInsecure$"
  match_examples:
  - name: grpc credentials create insecure
    code: |
      const _u = require("grpc");
      function demo(grpc: any) {
        return grpc.credentials.createInsecure();
      }
    expect_match_text: [grpc.credentials.createInsecure]
  - name: imported credentials create insecure
    code: |
      const _u = require("grpc");
      function demo(credentials: any) {
        return credentials.createInsecure();
      }
    expect_match_text: [credentials.createInsecure]
  description: "gRPC credentials.createInsecure() creates an unencrypted client/server channel."

- id: typescript.tls.https_request_reject_unauth
  enabled: true
  language: typescript
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [https]
  imports: [https, "node:https"]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.request$'
      binding_origin: imported
  constraints:
  - arg_aggregate_fields_equal:
      argument_index: 0
      required_fields:
      - path: [rejectUnauthorized]
        value: {kind: boolean, value: false}
  match_examples:
  - name: typed https request explicitly disables certificate verification
    code: |
      import * as https from "https";
      function fetch(host: string) {
        return https.request({ host, rejectUnauthorized: false });
      }
    expect_match_text: [https.request]
  - name: typed https request keeps certificate verification enabled
    code: |
      import * as https from "https";
      function fetch(host: string) {
        return https.request({ host, rejectUnauthorized: true });
      }
    expect_no_match: true
  - name: aliased typed HTTPS provider disables certificate verification
    code: |
      import * as secureTransport from "node:https";
      secureTransport.request({ hostname: "service.invalid", rejectUnauthorized: false });
    expect_match_text: [secureTransport.request]
  - name: local https request helper is not the imported runtime module
    code: |
      import * as runtimeHttps from "https";
      void runtimeHttps.request;
      const https = { request(options: object) { return options; } };
      https.request({ rejectUnauthorized: false });
    expect_no_match: true
  description: "https.request({rejectUnauthorized: false}) disables TLS certificate verification."

