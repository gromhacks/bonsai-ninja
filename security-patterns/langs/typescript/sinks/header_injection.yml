- id: typescript.header.bun_response_content_disposition
  enabled: true
  language: typescript
  tag: header-injection
  severity: high
  packages:
  - bun
  - next
  cwe:
  - CWE-113
  - CWE-79
  - CWE-601
  match:
    kind: new
    callee:
      name: Response
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: bun response content disposition
    code: |
      const _u = require("bun");
      function download(filename: string) {
        return new Response("ok", { headers: { "Content-Disposition": filename } });
      }
    expect_match_text:
    - Response
  - name: literal bun response content disposition negative
    code: |
      const _u = require("bun");
      function download() {
        return new Response("ok", { headers: { "Content-Disposition": "attachment; filename=safe.txt" } });
      }
    expect_no_match: true
  description: "Bun/fetch Response headers Content-Disposition value - tainted filename can inject response headers. Merged aliases: typescript.xss.bun_response_html_body."
  aliases:
  - typescript.xss.bun_response_html_body
  - typescript.open_redirect.fetch_response_location
- id: typescript.header.hapi_content_disposition
  enabled: true
  language: typescript
  tag: header-injection
  severity: high
  packages:
  - '@hapi/hapi'
  cwe:
  - CWE-113
  - CWE-601
  - CWE-79
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.response\\([\\s\\S]*\\)(?:\\s*\\.[A-Za-z_$][A-Za-z0-9_$]*\\([\\s\\S]*\\))*\\s*\\.header$|^[A-Za-z_$][A-Za-z0-9_$]*\\.response\\.header$"
      base_name_in:
      - h
      - reply
      - res
      - response
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: hapi response content disposition
    code: |
      const _u = require("@hapi/hapi");
      function download(h: any, filename: string) {
        return h.response("ok").header("Content-Disposition", filename);
      }
    expect_match_text:
    - h.response("ok").header
  - name: hapi response fluent content disposition
    code: |
      const _u = require("@hapi/hapi");
      function download(h: any, filename: string) {
        return h.response(Buffer.from("data"))
          .type("application/octet-stream")
          .header("Content-Disposition", filename);
      }
    expect_match_text:
    - "h.response(Buffer.from(\"data\")) .type(\"application/octet-stream\").header"
  - name: literal hapi response content disposition negative
    code: |
      const _u = require("@hapi/hapi");
      function download(h: any) {
        return h.response("ok").header("Content-Disposition", "attachment; filename=safe.txt");
      }
    expect_no_match: true
  description: "Hapi <h>.response(...).header('Content-Disposition', tainted) - filename/header value can inject response headers. The bare `response.header(...)` shape is intentionally not matched here to avoid colliding with express/fastify; rely on the response()-prefixed shape and the package gate. Merged aliases: typescript.open_redirect.hapi_response_header_location, typescript.xss.hapi_response_html_body."
  aliases:
  - typescript.open_redirect.hapi_response_header_location
  - typescript.xss.hapi_response_html_body
- id: typescript.header.nest_header_xss_protection_disabled
  enabled: true
  language: typescript
  tag: header-injection
  category: source-independent
  severity: low
  packages:
  - '@nestjs/common'
  cwe:
  - CWE-693
  match:
    kind: call
    callee:
      name: Header
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "(?i)^['\"]X-XSS-Protection['\"]$"
  - arg_matches_regex:
      index: 1
      regex: "^['\"]0['\"]$"
  match_examples:
  - name: nest header xss protection disabled
    code: |
      const _u = require("@nestjs/common");
      function routeHeader(Header: any) {
        return Header("X-XSS-Protection", "0");
      }
    expect_match_text:
    - Header
  - name: nest header content type negative
    code: |
      const _u = require("@nestjs/common");
      function routeHeader(Header: any) {
        return Header("Content-Type", "application/json");
      }
    expect_no_match: true
  description: "NestJS @Header('X-XSS-Protection', '0') disables the legacy browser XSS filter. The arg-0/arg-1 regexes pin the specific header and `0` value so unrelated @Header(...) decorators stay quiet."
