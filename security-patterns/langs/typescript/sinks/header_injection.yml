- id: typescript.header.node_setheader
  enabled: true
  language: typescript
  tag: header-injection
  severity: high
  packages: [http, express, fastify, '@hapi/hapi', koa, '@nestjs/common']
  cwe:
  - CWE-113
  - CWE-601
  - CWE-444
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.setHeader$
      base_name_in:
      - res
      - response
      - reply
      - ctx
      - resp
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: node setheader
    code: |
      const _u = require("@nestjs/common");
      function demo(input, req, obj) {
        return res.setHeader("X-User", input + "\r\nX-Injected: 1");
      }
  - name: literal node setheader negative
    code: |
      const _u = require("@nestjs/common");
      function demo() {
        return res.setHeader("X-User", "safe");
      }
    expect_no_match: true
  description: "Node res.setHeader(name, value with CRLF) - response splitting. Merged aliases: typescript.open_redirect.node_setheader_location."
  aliases:
  - typescript.open_redirect.node_setheader_location
  - typescript.header.node_content_disposition_setheader
  - typescript.header.nest_res_setheader
