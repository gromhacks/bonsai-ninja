- id: typescript.header.express_res_set
  enabled: true
  language: typescript
  tag: header-injection
  severity: high
  packages:
  - express
  - restify
  cwe:
  - CWE-113
  - CWE-601
  - CWE-444
  match:
    kind: call
    callee:
      attribute:
      - res
      - set
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: express res set value
    code: |
      const _u = require("express");
      function demo(input, req, obj) {
        return res.set("Content-Disposition", input);
      }
  - name: literal express res set negative
    code: |
      const _u = require("express");
      function demo() {
        return res.set("Content-Disposition", "attachment; filename=safe.txt");
      }
    expect_no_match: true
  description: 'Express/Restify res.set(name, tainted). Merged aliases: typescript.open_redirect.express_res_set_location.'
  aliases:
  - typescript.open_redirect.express_res_set_location
