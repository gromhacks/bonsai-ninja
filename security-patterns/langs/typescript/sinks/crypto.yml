- id: typescript.crypto.bcrypt_low_rounds
  enabled: true
  language: typescript
  tag: weak-crypto
  category: source-independent
  severity: medium
  packages:
  - bcrypt
  - bcryptjs
  cwe:
  - CWE-916
  match:
    kind: call
    callee:
      attribute:
      - bcrypt
      - hash
  constraints:
  - arg_lt:
      index: 1
      value: 10
  match_examples:
  - name: bcrypt low rounds
    code: |
      import bcrypt from "bcrypt";
      function hash(password: string) {
        return bcrypt.hash(password, 4);
      }
    expect_match_text: [bcrypt.hash]
  - name: bcrypt acceptable rounds negative
    code: |
      import bcrypt from "bcrypt";
      function hash(password: string) {
        return bcrypt.hash(password, 12);
      }
    expect_no_match: true
  description: "bcrypt.hash(password, rounds) with rounds < 10 - too cheap to compute; use an adequate work factor."
