  description: "crypto.createDecipher (no IV) — deprecated API derives predictable IVs from password material."
- id: typescript.crypto.gcm_decipher_no_authtaglength
  enabled: true
  language: typescript
  tag: weak-crypto
  severity: medium
  packages:
  - crypto
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - crypto
      - createDecipheriv
  match_examples:
  - name: gcm decipher missing auth tag length
    code: |
      const _u = require("crypto");
      function demo(key: Buffer, iv: Buffer) {
        return crypto.createDecipheriv("aes-256-gcm", key, iv);
      }
    expect_match_text:
    - crypto.createDecipheriv
  description: crypto.createDecipheriv('*-gcm', key, iv) without authTagLength can accept unexpectedly short GCM tags.
