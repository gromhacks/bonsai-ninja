- id: typescript.nosql.mongo_mapreduce
  enabled: true
  language: typescript
  tag: code-injection
  severity: critical
  packages:
  - mongodb
  cwe:
  - CWE-94
  - CWE-943
  match:
    kind: call
    callee:
      attribute:
      - collection
      - mapReduce
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: mongo mapreduce
    code: "const _u = require(\"mongodb\");\nfunction demo(input, req, obj) {\n  return collection.mapReduce(input, function reduce() {});\n}\n"
  - name: mongo mapreduce literal negative
    code: "const _u = require(\"mongodb\");\nfunction demo(collection) {\n  return collection.mapReduce(function map() {}, function reduce() {});\n}\n"
    expect_no_match: true
  description: "mongodb collection.mapReduce(map, reduce, options) - tainted map JavaScript is evaluated server-side."
