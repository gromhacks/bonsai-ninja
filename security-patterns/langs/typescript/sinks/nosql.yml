- id: typescript.nosql.mongo_find
  enabled: true
  language: typescript
  tag: nosql-injection
  severity: high
  packages:
  - mongodb
  - mongoose
  imports:
  - mongodb
  - mongoose
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      regex: (?:^|\.)(?:find|findOne|findOneAnd(?:Update|Delete|Replace))$
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    nosql_filter:
      filter_arg_index: 0
      literal_value_operators: ["$eq"]
      safe_scalar_runtime_types: [string]
  match_examples:
  - name: mongo find
    code: "const _u = require(\"mongodb\");\nfunction demo(input, req, obj) {\n  return collection.find(input, { \"$where\": input });\n}\n"
  - name: mongo findOne destructured shorthand
    code: "const _u = require(\"mongodb\");\nfunction login(collection: any, req: any) {\n  const { username, password } = req.body;\n  return collection.findOne({ username, password });\n}\n"
    expect_match_text:
    - collection.findOne
  - name: mongoose model findOne destructured shorthand
    code: "const _u = require(\"mongodb\");\nfunction login(UserModel: any, req: any) {\n  const { email, password } = req.body;\n  return UserModel.findOne({ email, password });\n}\n"
    expect_match_text:
    - UserModel.findOne
  - name: couchdb selector find
    code: "const _u = require(\"mongodb\");\nfunction query(db: any, selector: any) {\n  return db.find(selector);\n}\n"
    expect_match_text:
    - db.find
  - name: mongo find literal negative
    code: "const _u = require(\"mongodb\");\nfunction demo(collection: any) {\n  return collection.find({ active: true });\n}\n"
    expect_no_match: true
  description: 'Mongo-style find/findOne filter APIs - tainted filter documents enable operator injection. Merged collision aliases: typescript.nosql.mongo_findone, typescript.nosql.mongo_credential_object_filter, typescript.nosql.mongo_caller_controlled_filter_value, typescript.nosql.mongoose_model_find, typescript.nosql.couchdb_find.'
  aliases:
  - typescript.nosql.mongo_findone
  - typescript.nosql.mongo_credential_object_filter
  - typescript.nosql.mongo_caller_controlled_filter_value
  - typescript.nosql.mongo_findone_body_spread
  - typescript.nosql.mongo_shorthand_credential_filter
  - typescript.nosql.mongoose_model_find
  - typescript.nosql.mongoose_model_findone
  - typescript.nosql.mongoose_credential_object_filter
  - typescript.nosql.mongoose_caller_controlled_filter_value
  - typescript.nosql.mongoose_shorthand_credential_filter
  - typescript.nosql.mongoose_findoneandupdate
  - typescript.nosql.mongoose_findoneanddelete
  - typescript.nosql.mongoose_findoneandreplace
  - typescript.nosql.mongoose_model_findone_body_spread
  - typescript.nosql.couchdb_find
