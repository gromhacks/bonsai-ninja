- id: typescript.xxe.fast_xml_parser_entities_enabled
  enabled: true
  language: typescript
  tag: xxe
  severity: medium
  packages:
  - fast-xml-parser
  cwe:
  - CWE-611
  match:
    kind: new
    callee:
      name: XMLParser
  match_examples:
  - name: fast xml parser process entities
    code: "import { XMLParser } from \"fast-xml-parser\";\nfunction parser() {\n  return new XMLParser({ processEntities: true });\n}\n"
    expect_match_text:
    - XMLParser
  - name: fast xml parser html entities
    code: |
      const { XMLParser } = require("fast-xml-parser");
      function parser() {
        return new XMLParser({ htmlEntities: true });
      }
    expect_match_text:
    - XMLParser
  description: "fast-xml-parser with entity processing enabled — audit tainted XML for entity expansion and unsafe downstream interpretation."
- id: typescript.xxe.parse_xml_resolve_entities
  enabled: true
  language: typescript
  tag: xxe
  severity: high
  packages:
  - parse-xml
  - libxmljs
  - libxmljs2
  cwe:
  - CWE-611
  match:
    kind: call
    callee:
      regex: ^(parseXml|parseXML|parseXMLString)$
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: parse-xml resolve entities
    code: |
      const _u = require("parse-xml");
      function parse(parseXml: any, input: string) {
        return parseXml(input, { resolveEntities: true });
      }
    expect_match_text:
    - parseXml
  - name: arg tainted literal negative
    code: |
      const _u = require("parse-xml");
      function parse(parseXml: any, input: string) {
        return parseXml("<root/>", { resolveEntities: true });
      }
    expect_no_match: true
  description: "parse-xml/libxml-style parser call with entity resolution enabled — tainted XML can trigger XXE file reads or SSRF."
