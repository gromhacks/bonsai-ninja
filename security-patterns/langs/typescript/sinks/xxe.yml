- id: typescript.xxe.libxmljs_parsexml
  enabled: true
  language: typescript
  tag: xxe
  severity: high
  packages:
  - libxmljs
  - libxmljs2
  imports:
  - libxmljs
  - libxmljs2
  cwe:
  - CWE-611
  match:
    kind: call
    callee:
      attribute:
      - libxmljs
      - parseXml
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: libxmljs parsexml
    code: |
      const _u = require("libxmljs");
      function demo(input, req, obj) {
        return libxmljs.parseXml(input);
      }
    expect_match_text:
    - libxmljs.parseXml
  - name: arg tainted literal negative
    code: |
      const _u = require("libxmljs");
      function demo(input, req, obj) {
        return libxmljs.parseXml("<root/>");
      }
    expect_no_match: true
  description: "libxmljs.parseXml — flag if `noent: true` (enables entity expansion). Merged aliases: typescript.xxe.libxmljs_parser_default_entities_resolve."
  aliases:
  - typescript.xxe.libxmljs_parser_default_entities_resolve
