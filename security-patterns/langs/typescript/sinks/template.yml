- id: typescript.template.swig_setdefaults_autoescape_off
  enabled: true
  language: typescript
  tag: xss
  category: source-independent
  severity: high
  packages:
  - swig
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - swig
      - setDefaults
  constraints:
  - any_arg_matches_regex: "(?i)autoescape\\s*[:=]\\s*false"
  match_examples:
  - name: swig setdefaults autoescape off
    code: |
      const _u = require("swig");
      function demo(input, req, obj) {
        return swig.setDefaults(input, { autoescape: false });
      }
    expect_match_text: [swig.setDefaults]
  - name: swig setdefaults autoescape default negative
    code: |
      const _u = require("swig");
      function demo(input, req, obj) {
        return swig.setDefaults(input, { autoescape: true });
      }
    expect_no_match: true
  description: "swig.setDefaults({autoescape: false}) - autoescape disabled. The options regex requires `autoescape: false` so safe configs stay quiet. TypeScript via the same swig API."
