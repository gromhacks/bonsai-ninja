- id: typescript.template.ejs_render
  enabled: true
  language: typescript
  tag: ssti
  severity: high
  packages:
  - ejs
  imports:
  - ejs
  cwe:
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - ejs
      - render
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: ejs render
    code: |
      const _u = require("ejs");
      function demo(input, req, obj) {
        return ejs.render(input, "<%= user %>");
      }
    expect_match_text:
    - ejs.render
  - name: arg tainted literal negative
    code: |
      const _u = require("ejs");
      function demo(input, req, obj) {
        return ejs.render("Hello <%= user %>", "<%= user %>");
      }
    expect_no_match: true
  description: "ejs.render(tainted) - server-side template injection. Merged aliases: typescript.template.ejs_render_template_variable."
  aliases:
  - typescript.template.ejs_render_template_variable
