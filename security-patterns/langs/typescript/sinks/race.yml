# typescript race / TOCTOU sinks (T501).

# TOCTOU check sites - pair with subsequent open/chmod use-sites
# in source order to identify the race window.
- id: typescript.toctou.fs_existssync
  enabled: true
  language: typescript
  tag: race
  category: source-independent
  severity: medium
  cwe: [CWE-367]
  match:
    kind: call
    callee:
      attribute: [fs, existsSync]
  match_examples:
    - name: fs existssync
      code: |
        function demo(input, req, obj) {
          return fs.existsSync(input);
        }
  description: "fs.existsSync(path) - check site preceding fs.openSync/readFileSync."
