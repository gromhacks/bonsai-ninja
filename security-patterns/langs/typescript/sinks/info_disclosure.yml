- id: typescript.info_disclosure.console_log_secret
  enabled: true
  language: typescript
  tag: information-disclosure
  severity: medium
  cwe:
  - CWE-200
  match:
    kind: call
    callee:
      attribute:
      - console
      - log
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)(secret|token|password|passwd|api[_-]?key|credential|private[_-]?key)'
  match_examples:
  - name: console log secret
    code: "function demo(secretToken: string) {\n  console.log(secretToken);\n}\n"
    expect_match_text:
    - console.log
  - name: console log ordinary value negative
    code: |
      function demo(username: string) {
        console.log(username);
      }
    expect_no_match: true
  description: "console.log(secret/token/password) - secret-shaped data written to process logs or captured stdout."
- id: typescript.info_disclosure.response_send_error_stack
  enabled: true
  language: typescript
  tag: information-disclosure
  severity: high
  packages:
  - express
  - restify
  - fastify
  - '@adonisjs/core'
  - '@adonisjs/http-server'
  cwe:
  - CWE-209
  match:
    kind: call
    callee:
      attribute:
      - res
      - send
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)\b(?:err|error|exception|e)\s*\.\s*(?:stack|message)\b|\b(?:stackTrace|stack_trace|errorStack|errStack)\b'
  match_examples:
  - name: response send error stack
    code: |
      const _u = require("express");
      function handler(req: Request, res: Response, err: Error) {
        return res.send(err.stack);
      }
    expect_match_text:
    - res.send
  - name: response send normal template negative
    code: |
      const _u = require("express");
      function handler(req: Request, res: Response, html: string) {
        return res.send(html);
      }
    expect_no_match: true
  description: "Express res.send(error.stack/message) - exposes internal exception details to the response body."
- id: typescript.info_disclosure.response_render_error_page
  enabled: true
  language: typescript
  tag: information-disclosure
  severity: medium
  packages:
  - express
  cwe:
  - CWE-209
  match:
    kind: call
    callee:
      attribute:
      - res
      - render
  constraints:
  - arg_matches_regex:
      index: 1
      regex: '(?i)\b(?:err|error|exception|stack|stackTrace|errorStack)\b'
  match_examples:
  - name: response render error page
    code: |
      const _u = require("express");
      function handler(req: Request, res: Response, err: Error) {
        return res.render("error", { error: err, stack: err.stack });
      }
    expect_match_text:
    - res.render
  - name: response render normal view negative
    code: |
      const _u = require("express");
      function handler(req: Request, res: Response, user: any) {
        return res.render("profile", { name: user.name, title: "Profile" });
      }
    expect_no_match: true
  description: "Express res.render(view, {error/stack/...}) - debug or exception details rendered into an error page. The arg-1 locals regex pins error/stack-shaped keys so ordinary view renders stay quiet."
- id: typescript.info_disclosure.postmessage_wildcard_target
  enabled: true
  language: typescript
  tag: information-disclosure
  severity: medium
  cwe:
  - CWE-200
  - CWE-346
  match:
    kind: call
    callee:
      regex: ^(window|parent|opener|targetWindow|frameWindow)\.postMessage$
  constraints:
  - arg_matches_regex:
      index: 1
      regex: "^['\"]\\*['\"]$"
  match_examples:
  - name: window postmessage wildcard
    code: "function send(secret: string) {\n  return window.postMessage(secret, '*');\n}\n"
    expect_match_text:
    - window.postMessage
  - name: parent postmessage wildcard
    code: "function send(token: string) {\n  return parent.postMessage(token, '*');\n}\n"
    expect_match_text:
    - parent.postMessage
  - name: postmessage explicit origin negative
    code: "function send(token: string) {\n  return window.postMessage(token, 'https://app.example.com');\n}\n"
    expect_no_match: true
  description: "postMessage(data, '*') with wildcard targetOrigin can disclose data to an unexpected origin. The arg-1 regex requires the literal '*' so calls naming an explicit origin stay quiet."
