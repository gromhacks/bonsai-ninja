- id: typescript.open_redirect.simple_oauth2_redirect_tainted
  enabled: true
  language: typescript
  tag: open-redirect
  severity: high
  packages: [simple-oauth2]
  imports: [simple-oauth2]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.authorizeURL$"
      base_name_in:
      - client
      - oauth2
      - oauth
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: simple-oauth2 authorizeURL tainted redirect_uri
    code: |
      const _u = require("simple-oauth2");
      function login(client: any, input: string) {
        return client.authorizeURL({ redirect_uri: input, scope: "read" });
      }
    expect_match_text: [client.authorizeURL]
  - name: simple-oauth2 authorizeURL literal negative
    code: |
      const _u = require("simple-oauth2");
      function login(client: any) {
        return client.authorizeURL({ redirect_uri: "https://app.example.com/cb", scope: "read" });
      }
    expect_no_match: true
  description: "simple-oauth2 client.authorizeURL({redirect_uri: tainted}) - attacker-controlled redirect_uri leaks the auth code or token to a malicious endpoint."
