- id: typescript.open_redirect.express_res_redirect
  enabled: true
  language: typescript
  tag: open-redirect
  severity: high
  packages:
  - express
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - res
      - redirect
  constraints:
  - arg_tainted:
      index: 0
  - arg_string_composition_not_starts_with:
      index: 0
      value: "/"
      allow_prefix: true
      literal_regex: '^/[^/\\\x00-\x20\x7f]'
  match_examples:
  - name: express res redirect
    code: |
      const _u = require("express");
      function demo(input, req, obj) {
        return res.redirect(input);
      }
    expect_match_text: [res.redirect]
  - name: literal express redirect negative
    code: |
      const _u = require("express");
      function demo(res: any) {
        return res.redirect("/dashboard");
      }
    expect_no_match: true
  - name: express fixed local query prefix negative
    code: |
      const express = require("express");
      const app = express();
      app.get("/", (req, res) => res.redirect("/next?to=" + req.query.next));
    expect_no_match: true
  - name: express single slash cannot prove a local target
    code: |
      const express = require("express");
      const app = express();
      app.get("/", (req, res) => res.redirect("/" + req.query.next));
    expect_match_text: [res.redirect]
  - name: express network path remains unsafe
    code: |
      const express = require("express");
      const app = express();
      app.get("/", (req, res) => res.redirect("//" + req.query.next));
    expect_match_text: [res.redirect]
  - name: express backslash authority remains unsafe
    code: |
      const express = require("express");
      const app = express();
      app.get("/", (req, res) => res.redirect("/\\" + req.query.next));
    expect_match_text: [res.redirect]
  description: "Express res.redirect(tainted URL) - sends user-controlled Location header."
