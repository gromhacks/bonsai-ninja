- id: typescript.open_redirect.hapi_redirect
  enabled: true
  language: typescript
  tag: open-redirect
  severity: high
  packages:
  - '@hapi/hapi'
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - h
      - redirect
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    same_origin_path_constraint:
      require_scheme_rejection: true
      require_authority_rejection: true
      require_absolute_path: true
      require_scheme_relative_rejection: true
      required_predicates:
      - {target: {name: startsWith}, argument_value: {kind: string, value: "/"}, required_result: true}
      - {target: {name: startsWith}, argument_value: {kind: string, value: "//"}, required_result: false}
      accepted_static_fallbacks: ["/"]
      sink_argument_index: 0
  match_examples:
  - name: hapi redirect
    code: "const _u = require(\"@hapi/hapi\");\nfunction demo(input, req, obj) {\n  return h.redirect(input);\n}\n"
  - name: arg tainted literal negative
    code: "const _u = require(\"@hapi/hapi\");\nfunction demo(input, req, obj) {\n  return h.redirect(\"/account\");\n}\n"
    expect_no_match: true
  description: Hapi h.redirect(tainted).
