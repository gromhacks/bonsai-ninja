- id: typescript.open_redirect.koa_location_header
  enabled: true
  language: typescript
  tag: open-redirect
  severity: high
  packages:
  - koa
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - ctx
      - set
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^['\"]Location['\"]$"
  - arg_tainted:
      index: 1
  match_examples:
  - name: koa location header with tainted target
    code: |
      const _u = require("koa");
      function demo(input: string) {
        return ctx.set("Location", input);
      }
    expect_match_text: [ctx.set]
  - name: koa location header with literal target negative
    code: |
      const _u = require("koa");
      function demo() {
        return ctx.set("Location", "/account");
      }
    expect_no_match: true
  - name: koa non-location header negative
    code: |
      const _u = require("koa");
      function demo(input: string) {
        return ctx.set("X-Trace", input);
      }
    expect_no_match: true
  description: "Koa ctx.set(\"Location\", tainted target) writes an attacker-controlled redirect target. The exact literal header-name constraint keeps ordinary response headers in the generic header-injection rule."
