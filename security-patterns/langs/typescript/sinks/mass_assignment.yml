# typescript mass_assignment sinks.

# Mass-assignment sinks (T400 follow-on). Bulk-attribute APIs
# that accept the request body without an explicit allowlist.
- id: typescript.mass_assign.mongoose_set_body
  enabled: true
  language: typescript
  tag: mass-assignment
  severity: high
  packages: [mongoose]
  cwe: [CWE-915]
  match:
    kind: call
    callee:
      attribute: [Document, set]
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: mongoose set body
    code: |
      const _u = require("mongoose");
      function demo(input, req, obj) {
        return Document.set(input, req.body);
      }
    expect_match_text: [Document.set]
  - name: mongoose set literal field negative
    code: |
      const _u = require("mongoose");
      function demo() {
        return Document.set("status", "active");
      }
    expect_no_match: true
  description: "Mongoose Document.set(req.body) - bulk-assigning an attacker-controlled object writes every key, including privilege fields, without an allowlist. The `any_arg_tainted` gate keeps fixed single-field `.set('field', literal)` calls quiet. TS via @types/mongoose."
