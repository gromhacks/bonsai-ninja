- id: typescript.queue.aws_send_message_command
  enabled: true
  language: typescript
  tag: queue-injection
  severity: high
  packages: ["@aws-sdk/client-sqs"]
  cwe: [CWE-20]
  match:
    kind: new
    callee:
      name: SendMessageCommand
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: aws send message command
    code: |
      const { SendMessageCommand } = require("@aws-sdk/client-sqs");
      function demo(input, req, obj) {
        return new SendMessageCommand(input);
      }
  - name: aws send message command literal negative
    code: |
      const { SendMessageCommand } = require("@aws-sdk/client-sqs");
      function demo() {
        return new SendMessageCommand({ MessageBody: "safe" });
      }
    expect_no_match: true
  description: "new SendMessageCommand({QueueUrl, MessageBody}) — tainted queue target/body injects arbitrary SQS messages."

