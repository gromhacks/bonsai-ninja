- id: typescript.queue.azure_servicebus_send_messages
  enabled: true
  language: typescript
  tag: queue-injection
  severity: high
  packages: ["@azure/service-bus"]
  cwe: [CWE-20]
  match:
    kind: call
    callee:
      regex: "\\.sendMessages$"
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: azure servicebus send messages
    code: |
      const _u = require("@azure/service-bus");
      function demo(input, req, obj) {
        return sender.sendMessages(input);
      }
  - name: azure servicebus literal negative
    code: |
      const _u = require("@azure/service-bus");
      function demo() {
        return sender.sendMessages([{ body: "safe" }]);
      }
    expect_no_match: true
  description: "ServiceBusSender.sendMessages — tainted queue payload or entity path injects arbitrary Service Bus messages."

- id: typescript.queue.gcp_pubsub_publish_message
  enabled: true
  language: typescript
  tag: queue-injection
  severity: high
  packages: ["@google-cloud/pubsub"]
  cwe: [CWE-20]
  match:
    kind: call
    callee:
      regex: "\\.publishMessage$"
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: gcp pubsub publish message
    code: |
      const _u = require("@google-cloud/pubsub");
      function demo(input, req, obj) {
        return topic.publishMessage(input);
      }
  - name: gcp pubsub literal negative
    code: |
      const _u = require("@google-cloud/pubsub");
      function demo() {
        return topic.publishMessage({ data: Buffer.from("safe") });
      }
    expect_no_match: true
  description: "Pub/Sub topic.publishMessage — tainted topic payload injects arbitrary Pub/Sub messages."
