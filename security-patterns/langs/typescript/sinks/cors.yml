- id: typescript.cors.cors_wildcard_with_credentials
  enabled: true
  language: typescript
  tag: cors
  category: source-independent
  severity: medium
  packages:
  - cors
  cwe:
  - CWE-942
  match:
    kind: call
    callee:
      name: cors
  constraints:
  - any_arg_matches_regex: "(?i)credentials\\s*[:=]\\s*true"
  match_examples:
  - name: cors wildcard with credentials
    code: |
      const _u = require("cors");
      function demo(input, req, obj) {
        return cors({ origin: "*", credentials: true });
      }
    expect_match_text: [cors]
  - name: cors no credentials negative
    code: |
      const _u = require("cors");
      function demo(input, req, obj) {
        return cors({ origin: "https://app.example.com" });
      }
    expect_no_match: true
  description: "cors({origin: '*', credentials: true}) - reflecting any origin while allowing credentials defeats the same-origin policy. The options regex requires `credentials: true` so default/locked-down cors() configs stay quiet. TS via @types/cors."
- id: typescript.cors.nest_enablecors_default
  enabled: true
  language: typescript
  tag: cors
  category: source-independent
  severity: medium
  packages:
  - '@nestjs/core'
  cwe:
  - CWE-942
  match:
    kind: call
    callee:
      name: enableCors
  match_examples:
  - name: nest enablecors default
    code: |
      const _u = require("@nestjs/core");
      function bootstrap(app: any) {
        return app.enableCors();
      }
    expect_match_text:
    - app.enableCors
  description: 'NestJS app.enableCors() with no origin allowlist enables permissive CORS defaults. Merged aliases: typescript.cors.nest_enablecors_wildcard.'
  aliases:
  - typescript.cors.nest_enablecors_wildcard
- id: typescript.cors.nestfactory_create_cors_any
  enabled: true
  language: typescript
  tag: cors
  category: source-independent
  severity: medium
  packages:
  - '@nestjs/core'
  cwe:
  - CWE-942
  match:
    kind: call
    callee:
      attribute:
      - NestFactory
      - create
  constraints:
  - any_arg_matches_regex: "(?i)cors\\s*[:=]\\s*(?:true|\\{[^}]*origin\\s*[:=]\\s*['\"]\\*['\"])"
  match_examples:
  - name: nestfactory create cors true
    code: |
      const _u = require("@nestjs/core");
      function bootstrap(AppModule: any) {
        return NestFactory.create(AppModule, { cors: true });
      }
    expect_match_text:
    - NestFactory.create
  - name: nestfactory create cors wildcard
    code: |
      const _u = require("@nestjs/core");
      function bootstrap(AppModule: any) {
        return NestFactory.create(AppModule, { cors: { origin: "*" } });
      }
    expect_match_text:
    - NestFactory.create
  - name: nestfactory create no cors negative
    code: |
      const _u = require("@nestjs/core");
      function bootstrap(AppModule: any) {
        return NestFactory.create(AppModule);
      }
    expect_no_match: true
  description: 'NestFactory.create(..., {cors: true/origin:''*''}) enables permissive CORS. The options regex requires the permissive cors config so plain app bootstraps stay quiet.'
