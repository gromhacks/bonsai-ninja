# TypeScript eval / dynamic-code sinks.
- id: typescript.eval.builtin_eval
  enabled: true
  language: typescript
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^eval$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: builtin eval
    code: |
      function demo(input, req, obj) {
        return eval(input);
      }
  - name: literal eval negative
    code: |
      function demo() {
        return eval("1 + 1");
      }
    expect_no_match: true
  description: "eval() — the JS global eval identifier executes tainted strings as code."

- id: typescript.eval.function_constructor
  enabled: false
  disabled_reason:
    code: subsumed
  language: typescript
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: new
    callee:
      name: Function
  description: "Disabled duplicate — adapter also emits new Function(...) as the call-form Function fact, covered by typescript.eval.function_constructor_call."

- id: typescript.eval.function_constructor_call
  aliases: [typescript.eval.function_constructor]
  enabled: true
  language: typescript
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: Function
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: function constructor
    code: |
      function demo(input, req, obj) {
        return new Function(input);
      }
    expect_match_text: [Function]
  - name: function constructor call concat
    code: |
      function demo(body: string) {
        return Function("return " + body);
      }
    expect_match_text: [Function]
  - name: function constructor call body variable
    code: |
      function demo(body: string) {
        return Function(body);
      }
    expect_match_text: [Function]
  - name: arg tainted literal negative
    code: "function demo(input, req, obj) {\n  return new Function(\"safe\");\n}\n"
    expect_no_match: true
  description: "Function('...' + body) / Function(body) — call-form Function constructor compiles attacker-controlled source."

