- id: typescript.eval.safe_eval
  enabled: true
  language: typescript
  tag: code-injection
  severity: critical
  packages: [safe-eval]
  imports: [safe-eval]
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^(safeEval|safeEval2|safeEvalModule|safeEvalPackage)$|^safeEval\\.safeEval$"
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: safe-eval default import
    code: |
      import safeEval from "safe-eval";
      function run(input: string) {
        return safeEval(input);
      }
    expect_match_text: [safeEval]
  - name: safe-eval namespace call
    code: |
      const _u = require("safe-eval");
      function run(safeEval: any, input: string) {
        return safeEval.safeEval(input);
      }
    expect_match_text: [safeEval.safeEval]
  - name: arg tainted literal negative
    code: |
      import safeEval from "safe-eval";
      function run(input: string) {
        return safeEval("1 + 1");
      }
    expect_no_match: true
  description: "safe-eval evaluates JavaScript source and has had sandbox-escape CVEs; tainted code remains code injection."

