# TypeScript eval / dynamic-code sinks.
- id: typescript.eval.builtin_eval
  enabled: true
  language: typescript
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^eval$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: builtin eval
    code: |
      function demo(input, req, obj) {
        return eval(input);
      }
  - name: literal eval negative
    code: |
      function demo() {
        return eval("1 + 1");
      }
    expect_no_match: true
  description: "eval() - the JS global eval identifier executes tainted strings as code."

- id: typescript.eval.function_constructor_call
  aliases: [typescript.eval.function_constructor]
  enabled: true
  language: typescript
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: Function
      binding_origin: runtime-global
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: function constructor
    code: |
      function demo(input, req, obj) {
        return new Function(input);
      }
    expect_match_text: [Function]
  - name: function constructor call concat
    code: |
      function demo(body: string) {
        return Function("return " + body);
      }
    expect_match_text: [Function]
  - name: function constructor call body variable
    code: |
      function demo(body: string) {
        return Function(body);
      }
    expect_match_text: [Function]
  - name: body after parameter definitions
    code: |
      function example(body) { return new Function("x", "y", body); }
    expect_match_text: [Function]
  - name: local Function is not the runtime constructor
    code: |
      function example(body: string) {
        function Function(value: string) { return value; }
        return Function(body);
      }
    expect_no_match: true
  - name: arg tainted literal negative
    code: "function demo(input, req, obj) {\n  return new Function(\"safe\");\n}\n"
    expect_no_match: true
  description: "Function('...' + body) / Function(body) - call-form Function constructor compiles attacker-controlled source."

- id: typescript.eval.vm_runinthiscontext
  enabled: true
  language: typescript
  tag: code-injection
  severity: critical
  packages: [vm]
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [vm, runInThisContext]
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: vm runinthiscontext
    code: |
      const _u = require("vm");
      function demo(input, req, obj) {
        return vm.runInThisContext(input);
      }
  - name: arg tainted literal negative
    code: |
      const _u = require("vm");
      function demo(input, req, obj) {
        return vm.runInThisContext("1 + 1");
      }
    expect_no_match: true
  description: "Node vm.runInThisContext(tainted) - compiles & runs arbitrary JS."

