- id: typescript.eval.require_dynamic
  enabled: true
  language: typescript
  tag: code-injection
  severity: high
  cwe: [CWE-94, CWE-470]
  match:
    kind: call
    callee:
      name: require
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: require dynamic
    code: |
      function demo(input, req, obj) {
        return require(input);
      }
  - name: require literal negative
    code: |
      function demo() {
        return require("express");
      }
    expect_no_match: true
  description: "require(tainted) - attacker-controlled CommonJS module specifier can load unintended code or files."

# Reflection-based dynamic invocation (T406). Tag
# code-injection so reviewer enumerates with `security sinks
# --tag code-injection`. Treats reflection as eval-equivalent
# when the dispatched name comes from attacker input.
- id: typescript.eval.reflect_apply
  enabled: true
  language: typescript
  tag: code-injection
  severity: high
  cwe: [CWE-470]
  match:
    kind: call
    callee:
      attribute: [Reflect, apply]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: reflect apply
    code: |
      function demo(input, req, obj) {
        return Reflect.apply(input);
      }
  - name: reflect apply literal target negative
    code: |
      function demo() {
        return Reflect.apply(Math.max, null, [1, 2]);
      }
    expect_no_match: true
  description: "Reflect.apply (TS) - same as JS. JS Reflect global has no canonical ecosystem package, so strict `['Reflect', 'apply']` match only."
