# Reflection-based dynamic invocation (T406). Tag
# code-injection so reviewer enumerates with `security sinks
# --tag code-injection`. Treats reflection as eval-equivalent
# when the dispatched name comes from attacker input.
- id: typescript.eval.reflect_apply
  enabled: true
  language: typescript
  tag: code-injection
  severity: high
  cwe: [CWE-470]
  match:
    kind: call
    callee:
      attribute: [Reflect, apply]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: reflect apply
    code: |
      function demo(input, req, obj) {
        return Reflect.apply(input);
      }
  - name: reflect apply literal target negative
    code: |
      function demo() {
        return Reflect.apply(Math.max, null, [1, 2]);
      }
    expect_no_match: true
  description: "Reflect.apply (TS) — same as JS. TODO(only_when_packaged): JS Reflect global has no canonical ecosystem package, so OnlyWhenPackaged lax-tail can never fire — strict `['Reflect', 'apply']` match only."
