# TypeScript insecure-deserialization sinks.
- id: typescript.deser.node_serialize_unserialize
  enabled: true
  language: typescript
  tag: insecure-deserialization
  severity: critical
  packages: [node-serialize]
  imports: [node-serialize]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      regex: "^(serialize|nodeSerialize|nodeSerializer)\\.unserialize$|^unserialize$"
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: node serialize unserialize
    code: |
      const _u = require("node-serialize");
      function demo(input, req, obj) {
        return serialize.unserialize(input);
      }
    expect_match_text: [serialize.unserialize]
  - name: node serialize alias unserialize
    code: |
      import nodeSerialize from "node-serialize";
      function demo(input: string) {
        return nodeSerialize.unserialize(input);
      }
    expect_match_text: [nodeSerialize.unserialize]
  - name: arg tainted literal negative
    code: |
      const _u = require("node-serialize");
      function demo(input, req, obj) {
        return serialize.unserialize('{"ok":true}');
      }
    expect_no_match: true
  description: "node-serialize module: `serialize.unserialize(tainted)` — RCE via IIFE trick."

