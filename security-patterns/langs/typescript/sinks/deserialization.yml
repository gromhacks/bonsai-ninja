- id: typescript.deser.serialize_javascript_deserialize
  enabled: false
  disabled_reason:
    code: over-broad
  language: typescript
  tag: insecure-deserialization
  severity: medium
  packages: [serialize-javascript]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: deserialize
  description: "Disabled — bare `deserialize` name is too broad; serialize-javascript's own deserialization uses eval() internally but the library recommends never deserializing untrusted output."

- id: typescript.deser.yaml_load_unsafe
