# Bare-name `unserialize(blob)` shape: node-serialize is sometimes
# imported as the default export so the call site is just
# `unserialize(...)` rather than `serialize.unserialize(...)`.
- id: typescript.deser.node_serialize
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: typescript
  tag: insecure-deserialization
  severity: critical
  packages: [node-serialize]
  imports: [node-serialize]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: unserialize
  description: "Disabled duplicate — bare `unserialize(...)` and `serialize.unserialize(...)` collapse to the same adapter fact in v1 matching."

