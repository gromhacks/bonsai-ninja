  severity: high
  packages: [js-yaml]
  imports: [js-yaml]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [yaml, load]
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: yaml load unsafe
    code: |
      const _u = require("js-yaml");
      function demo(input, req, obj) {
        return yaml.load(input);
      }
    expect_match_text: [yaml.load]
  - name: arg tainted literal negative
    code: |
      const _u = require("js-yaml");
      function demo(input, req, obj) {
        return yaml.load("ok: true");
      }
    expect_no_match: true
  description: "js-yaml yaml.load (pre-v4 default) — permits !!js/function tags = code execution unless SAFE_SCHEMA is used."

