  description: "serialize-to-js .deserialize — reconstructs JavaScript values/functions from strings; unsafe on tainted input."

- id: typescript.deser.msgpack_decode_unpack
  enabled: true
  language: typescript
  tag: insecure-deserialization
  severity: high
  packages: [msgpack-lite, "@msgpack/msgpack", msgpack5, msgpackr, "notepack.io"]
  imports: [msgpack-lite, "@msgpack/msgpack", msgpack5, msgpackr, "notepack.io"]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.(decode|decodeAsync|unpack|deserialize)$"
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: msgpack decode
    code: |
      import * as msgpack from "@msgpack/msgpack";
      function handle(payload: Uint8Array) {
        return msgpack.decode(payload);
      }
    expect_match_text: [msgpack.decode]
  - name: msgpackr unpack
    code: |
      import * as msgpackr from "msgpackr";
      function handle(payload: Buffer) {
        return msgpackr.unpack(payload);
      }
    expect_match_text: [msgpackr.unpack]
  - name: arg tainted literal negative
    code: |
      import * as msgpack from "@msgpack/msgpack";
      function handle(payload: Uint8Array) {
        return msgpack.decode(new Uint8Array());
      }
    expect_no_match: true
  description: "MessagePack decode/unpack/deserialize APIs — untrusted binary frames can materialize unexpected object graphs and prototype-bearing keys."
