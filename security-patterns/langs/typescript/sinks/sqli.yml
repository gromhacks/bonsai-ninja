- id: typescript.sqli.knex_raw
  enabled: true
  language: typescript
  tag: sql-injection
  severity: high
  packages:
  - knex
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      attribute:
      - knex
      - raw
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: knex raw
    code: |
      const _u = require("knex");
      function demo(input, req, obj) {
        return knex.raw(input, "SELECT * FROM users WHERE id = " + input);
      }
  - name: arg tainted literal negative
    code: |
      const _u = require("knex");
      function demo(input, req, obj) {
        return knex.raw("SELECT 1", "SELECT * FROM users WHERE id = " + input);
      }
    expect_no_match: true
  description: "knex.raw(tainted) - template-interpolated SQL."
