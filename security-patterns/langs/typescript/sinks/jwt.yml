- id: typescript.jwt.sign_none
  enabled: true
  language: typescript
  tag: jwt
  category: source-independent
  severity: high
  packages:
  - jsonwebtoken
  imports:
  - jsonwebtoken
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      attribute:
      - jwt
      - sign
  constraints:
  - arg_matches_regex:
      index: 2
      regex: "(?i)algorithm\\s*[:=]\\s*['\\\"]none['\\\"]"
  match_examples:
  - name: sign none
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.sign(input, null, { algorithm: 'none' });
      }
  - name: sign hmac negative
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.sign(input, "secret", { algorithm: "HS256" });
      }
    expect_no_match: true
  description: "jwt.sign(..., {algorithm: 'none'}) - produces unsigned tokens."
- id: typescript.jwt.verify_ignore_expiration
  enabled: true
  language: typescript
  tag: jwt
  category: source-independent
  severity: critical
  packages:
  - jsonwebtoken
  cwe:
  - CWE-347
  - CWE-345
  match:
    kind: call
    callee:
      attribute:
      - jwt
      - verify
  constraints:
  - arg_matches_regex:
      index: 2
      regex: "(?i)(ignoreExpiration\\s*[:=]\\s*true|algorithms\\s*[:=]\\s*\\[[^\\]]*['\\\"]none['\\\"])"
  match_examples:
  - name: verify ignore expiration
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.verify(input, "secret", { ignoreExpiration: true });
      }
  - name: verify expiration checked negative
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.verify(input, "secret", { ignoreExpiration: false });
      }
    expect_no_match: true
  description: "jwt.verify(..., {ignoreExpiration: true}) - accepts expired tokens. Merged aliases: typescript.jwt.verify_none_algorithm, typescript.jwt.alg_confusion."
  aliases:
  - typescript.jwt.verify_none_algorithm
  - typescript.jwt.alg_confusion
- id: typescript.jwt.decode_unsafe
  enabled: true
  language: typescript
  tag: jwt
  severity: high
  packages:
  - jsonwebtoken
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - jwt
      - decode
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: decode unsafe
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.decode(input);
      }
  - name: arg tainted literal negative
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.decode("header.payload.signature");
      }
    expect_no_match: true
  description: "jwt.decode - returns payload WITHOUT verifying signature; trusting it = auth bypass."
