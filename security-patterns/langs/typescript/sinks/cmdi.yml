- id: typescript.cmdi.exec_sync
  enabled: true
  language: typescript
  tag: command-injection
  severity: critical
  category: process-exec
  packages:
  - child_process
  imports:
  - child_process
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      attribute:
      - child_process
      - execSync
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: exec sync
    code: "const _u = require(\"child_process\");\nfunction demo(input, req, obj)\
      \ {\n  return child_process.execSync(input);\n}\n"
  - name: arg tainted literal negative
    code: "const _u = require(\"child_process\");\nfunction demo(input, req, obj)\
      \ {\n  return child_process.execSync(\"echo safe\");\n}\n"
    expect_no_match: true
  description: "child_process.execSync \u2014 shell-interprets its first arg."
