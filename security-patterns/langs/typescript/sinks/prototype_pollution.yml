# Hand-rolled recursive merge `target[key] = source[key]` - the
# canonical homemade prototype-pollution vector. The engine
# surfaces the index-write site; constraint requires the rhs to be
# a same-key index read (`[key]` on both sides). Tainted source
# object pollutes Object.prototype when the source has __proto__.
- id: typescript.proto_pollution.recursive_merge
  enabled: true
  language: typescript
  tag: prototype-pollution
  severity: high
  cwe: [CWE-1321]
  match:
    kind: write
    target:
      regex: "(\\[|\\.key$)"
  constraints:
  - arg_tainted: {index: 0}
  analysis_semantics:
    dynamic_key_denylist_guard:
      collection_constructor:
        name: Set
      membership_check:
        name: has
      membership_subject_arg_index: 0
      collection_values_arg_index: 0
      rejected_exact_values: ["__proto__", "constructor", "prototype"]
  match_examples:
  - name: recursive merge
    code: |
      function merge(target: any, source: any) {
        for (const key in source) {
          target[key] = source[key];
        }
      }
    expect_match_text: [target.key]
  - name: recursive merge literal value negative
    code: |
      function merge(target: any, source: any) {
        target.safe = "safe";
      }
    expect_no_match: true
  description: "Recursive merge `target[key] = source[key]` - homemade deep-merge vector. Without `__proto__` / `constructor` / `prototype` filtering, attacker-controlled source object pollutes Object.prototype."

- id: typescript.proto_pollution.recursive_merge_call
  enabled: true
  language: typescript
  tag: prototype-pollution
  severity: high
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*(?:merge|Merge|walk|Walk)[A-Za-z0-9_$]*$"
  constraints:
  - min_args: 2
  - arg_matches_regex:
      index: 0
      regex: "\\[[^\\]]+\\]"
  - arg_matches_regex:
      index: 1
      regex: "\\[[^\\]]+\\]"
  - arg_tainted:
      index: 1
  analysis_semantics:
    dynamic_key_denylist_guard:
      collection_constructor:
        name: Set
      membership_check:
        name: has
      membership_subject_arg_index: 0
      collection_values_arg_index: 0
      rejected_exact_values: ["__proto__", "constructor", "prototype"]
  match_examples:
  - name: recursive walk call keyed source
    code: |
      function apply(target: any, source: any, key: string) {
        return _walk(target[key], source[key]);
      }
    expect_match_text: [_walk]
  - name: recursive merge call literal negative
    code: |
      function merge(target: any) {
        return merge(target.safe, {});
      }
    expect_no_match: true
  description: "Recursive deep-merge helper call target[key], source[key] - tainted source object is walked into the target without filtering prototype keys."

- id: typescript.proto_pollution.recursive_deep_merge
  enabled: true
  language: typescript
  tag: prototype-pollution
  severity: high
  packages: [recursive-deep-merge]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      name: recursiveDeepMerge
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: recursive deep merge exported function
    code: |
      import recursiveDeepMerge from "recursive-deep-merge";
      function applyConfig(input: object) {
        return recursiveDeepMerge({}, input);
      }
    expect_match_text: [recursiveDeepMerge]
  - name: recursive deep merge literal negative
    code: |
      import recursiveDeepMerge from "recursive-deep-merge";
      function applyConfig() {
        return recursiveDeepMerge({}, {});
      }
    expect_no_match: true
  description: "recursive-deep-merge(target, attacker_obj) - recursive merge APIs can honor __proto__/constructor.prototype keys and pollute Object.prototype."

- id: typescript.proto_pollution.recursive_deep_merge_method
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: typescript.proto_pollution.lodash_namespace_merge_variants
  language: typescript
  tag: prototype-pollution
  severity: high
  packages: [recursive-deep-merge]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      attribute: [recursiveDeepMerge, merge]
  description: "Disabled - `recursiveDeepMerge.merge` is covered by `typescript.proto_pollution.lodash_namespace_merge_variants` whose receiver-agnostic regex matches any `<ident>.merge`."

- id: typescript.proto_pollution.deepmerge_package
  enabled: true
  language: typescript
  tag: prototype-pollution
  severity: high
  packages: [deepmerge, deep-extend, merge-deep]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      regex: "^(deepmerge|mergeDeep|deepExtend)$"
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: deepmerge function
    code: |
      import deepmerge from "deepmerge";
      function applyConfig(input: object) {
        return deepmerge({}, input);
      }
    expect_match_text: [deepmerge]
  - name: mergeDeep function
    code: |
      import mergeDeep from "merge-deep";
      function applyConfig(input: object) {
        return mergeDeep({}, input);
      }
    expect_match_text: [mergeDeep]
  - name: deepmerge literal negative
    code: |
      import deepmerge from "deepmerge";
      function applyConfig() {
        return deepmerge({}, {});
      }
    expect_no_match: true
  description: "Deep recursive merge package calls - audit tainted objects for __proto__/constructor/prototype keys before merging."

- id: typescript.proto_pollution.lodash_namespace_merge_variants
  enabled: true
  language: typescript
  tag: prototype-pollution
  severity: high
  packages: [lodash, lodash.merge]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.(merge|defaultsDeep)$|^merge$"
  constraints:
  - any_arg_tainted: true
  analysis_semantics:
    dynamic_key_denylist_guard:
      collection_constructor:
        name: Set
      membership_check:
        name: has
      membership_subject_arg_index: 0
      collection_values_arg_index: 0
      rejected_exact_values: ["__proto__", "constructor", "prototype"]
      require_recursive_filter: true
      filtered_value_argument_index: 1
  match_examples:
  - name: lodash namespace merge
    code: |
      const _u = require("lodash");
      function applyConfig(lodash: any, input: object) {
        return lodash.merge({}, input);
      }
    expect_match_text: [lodash.merge]
  - name: lodash.merge package default function
    code: |
      import merge from "lodash.merge";
      function applyConfig(input: object) {
        return merge({}, input);
      }
    expect_match_text: [merge]
  - name: lodash merge literal negative
    code: |
      const _u = require("lodash");
      function applyConfig(lodash: any) {
        return lodash.merge({}, {});
      }
    expect_no_match: true
  description: "lodash merge/defaultsDeep variants and lodash.merge package default export - recursive merge prototype-pollution sinks."
