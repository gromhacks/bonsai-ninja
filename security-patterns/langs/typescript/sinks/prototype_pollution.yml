# typescript prototype_pollution sinks.

# Prototype-pollution sinks. Object-merge / set-by-path APIs
# that honor `__proto__` / `constructor` / `prototype` keys.
- id: typescript.proto_pollution.object_assign_request_body
  enabled: true
  language: typescript
  tag: prototype-pollution
  severity: high
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      attribute: [Object, assign]
  match_examples:
  - name: object assign request body
    code: |
      function apply(req: any, target: any) {
        return Object.assign(target, req.body);
      }
    expect_match_text: [Object.assign]
  - name: object assign prototype key object
    code: |
      function apply(target: any, value: string) {
        return Object.assign(target, { "__proto__": value });
      }
    expect_match_text: [Object.assign]
  description: "Object.assign(target, source) — shallow merge can still pollute when a tainted source object carries special keys. JS Object global has no canonical ecosystem package, so strict `['Object', 'assign']` match only."

- id: typescript.proto_pollution.lodash_merge
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: typescript.proto_pollution.lodash_namespace_merge_variants
  language: typescript
  tag: prototype-pollution
  severity: high
  packages: [lodash]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      attribute: [_, merge]
  description: "Disabled — `_.merge` is covered by `typescript.proto_pollution.lodash_namespace_merge_variants` whose receiver-agnostic regex `^[A-Za-z_$][A-Za-z0-9_$]*\\.(merge|defaultsDeep)$|^merge$` already includes the `_.merge` shape."
- id: typescript.proto_pollution.lodash_set
  enabled: true
  language: typescript
  tag: prototype-pollution
  severity: high
  packages: [lodash]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      attribute: [_, set]
  match_examples:
  - name: lodash set
    code: |
      const _u = require("lodash");
      function demo(_: any, input: object, value: unknown) {
        return _.set(input, "__proto__.polluted", value);
      }
    expect_match_text: [_.set]
  - name: lodash set proto dot path
    code: |
      const _u = require("lodash");
      function apply(_: any, target: object, value: unknown) {
        return _.set(target, "__proto__.polluted", value);
      }
    expect_match_text: [_.set]
  - name: lodash set constructor prototype dot path
    code: |
      const _u = require("lodash");
      function apply(_: any, target: object, value: unknown) {
        return _.set(target, "constructor.prototype.admin", value);
      }
    expect_match_text: [_.set]
  description: "_.set(obj, attacker_path, value) — path-based set with `__proto__.x` or `constructor.prototype.x` slips into Object.prototype."

- id: typescript.proto_pollution.lodash_setwith
  enabled: true
  language: typescript
  tag: prototype-pollution
  severity: high
  packages: [lodash]
  cwe: [CWE-1321]
  match:
