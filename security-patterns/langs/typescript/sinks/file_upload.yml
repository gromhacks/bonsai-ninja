# TypeScript file-upload sinks (multer / formidable / express-fileupload / busboy).
- id: typescript.upload.express_fileupload_mv_any_file
  enabled: true
  language: typescript
  tag: file-upload
  severity: high
  packages: [express-fileupload]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.mv$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: uploadedFile mv tainted destination
    code: |
      const { UploadedFile } = require("express-fileupload");
      function save(input: string) {
        const uploadedFile = new UploadedFile();
        return uploadedFile.mv(input);
      }
    expect_match_text: [uploadedFile.mv]
  - name: file mv tainted destination
    code: |
      const { UploadedFile } = require("express-fileupload");
      function save(input: string) {
        const file = new UploadedFile();
        return file.mv(input);
      }
    expect_match_text: [file.mv]
  - name: file mv literal destination negative
    code: |
      const { UploadedFile } = require("express-fileupload");
      function save() {
        const file = new UploadedFile();
        return file.mv("/srv/uploads/avatar.png");
      }
    expect_no_match: true
  description: "express-fileupload .mv(dest) - writing uploaded content to attacker-influenced destination paths. Receiver-agnostic; package context gate on express-fileupload narrows to that ecosystem."

- id: typescript.upload.path_join_original_filename
  enabled: true
  language: typescript
  tag: file-upload
  severity: high
  packages: [multer, formidable, busboy, express-fileupload, path]
  cwe: [CWE-22, CWE-434]
  match:
    kind: call
    callee:
      attribute: [path, join]
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: multer originalname path join
    code: |
      const _u = require("multer");
      function dest(path: any, uploadDir: string, file: any) {
        return path.join(uploadDir, file.originalname);
      }
    expect_match_text: [path.join]
  - name: literal upload path join negative
    code: |
      const _u = require("multer");
      function dest(path: any) {
        return path.join("/srv/uploads", "avatar.png");
      }
    expect_no_match: true
  - name: busboy filename path join
    code: |
      const _u = require("multer");
      function dest(path: any, uploadDir: string, info: any) {
        return path.join(uploadDir, info.filename);
      }
    expect_match_text: [path.join]
  description: "Joining upload directories with client-controlled filenames - filename traversal/overwrite sink before file write or mv."
