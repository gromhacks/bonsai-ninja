# TypeScript path-traversal sinks.
- id: typescript.path.fs_readfile
  enabled: true
  language: typescript
  tag: path-traversal
  severity: high
  packages: [fs]
  imports: [fs]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      regex: "^fs\\.readFile$"
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: fs readfile
    code: |
      const _u = require("fs");
      function demo(input, req, obj) {
        return fs.readFile(input);
      }
  - name: arg tainted literal negative
    code: |
      const _u = require("fs");
      function demo(input, req, obj) {
        return fs.readFile("/tmp/safe.txt");
      }
    expect_no_match: true
  description: fs.readFile — tainted path enables traversal.

