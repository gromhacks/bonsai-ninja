- id: typescript.ldap.ldapjs_search
  enabled: true
  language: typescript
  tag: ldap-injection
  severity: high
  packages:
  - ldapjs
  - ldapts
  imports:
  - ldapjs
  - ldapts
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - client
      - search
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ldapjs search
    code: "const _u = require(\"ldapjs\");\nfunction demo(input, req, obj) {\n  return\
      \ client.search(\"(uid=\" + input + \")\");\n}\n"
    expect_match_text:
    - client.search
  - name: ldapjs search literal negative
    code: "const _u = require(\"ldapjs\");\nfunction demo(input, req, obj) {\n  return\
      \ client.search(\"(uid=alice)\");\n}\n"
    expect_no_match: true
  description: "ldapjs/ldapts client.search - tainted filter/DN enables LDAP\
    \ injection."
