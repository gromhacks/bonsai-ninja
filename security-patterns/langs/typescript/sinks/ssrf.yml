- id: typescript.ssrf.got
  enabled: true
  language: typescript
  tag: ssrf
  severity: high
  packages:
  - got
  imports:
  - got
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      name: got
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: got
    code: "const _u = require(\"got\");\nfunction demo(input, req, obj) {\n  return\
      \ got(input);\n}\n"
  - name: arg tainted literal negative
    code: "const _u = require(\"got\");\nfunction demo(input, req, obj) {\n  return\
      \ got(\"https://example.com\");\n}\n"
    expect_no_match: true
  description: "got(url) - top-level got() call with tainted URL."
