# TypeScript log-injection sinks.

- id: typescript.log_injection.structured_logger_concat
  enabled: true
  language: typescript
  tag: log-injection
  severity: high
  cwe: [CWE-117]
  match:
    kind: call
    callee:
      regex: "^(slog|logger|log|app\\.log)\\.(info|warn|error|debug)$"
  constraints:
  - arg_tainted: {index: 0}
  - arg_matches_regex:
      index: 0
      regex: '(\+|`|\$\{|\\n|\\r)'
  match_examples:
    - name: app log info concat
      code: |
        function demo(app: any, body: string) {
          return app.log.info("login failed: " + body);
        }
      expect_match_text: [app.log.info]
    - name: slog info template
      code: |
        function demo(slog: any, body: string) {
          return slog.info(`user=${body}`);
        }
      expect_match_text: [slog.info]
    - name: arg tainted literal negative
      code: |
        function demo(app: any, body: string) {
          return app.log.info("login failed");
        }
      expect_no_match: true
  description: "app.log.info/logger/slog with concatenated attacker text - control characters or forged prefixes can corrupt audit logs."

- id: typescript.log_injection.console_newline
  enabled: true
  language: typescript
  tag: log-injection
  severity: medium
  cwe: [CWE-117]
  match:
    kind: call
    callee:
      attribute: [console, log]
  constraints:
  - arg_tainted: {index: 0}
  analysis_semantics:
    character_constraint:
      required_excluded_characters: ["\r", "\n"]
      accepted_providers:
      - operation: {regex: '^replace$'}
      - factory: {name: String}
        operation: {regex: '^String\.replace$'}
      - factory: {name: map}
        operation: {regex: '^map\.join$'}
      - factory: {regex: '^charCodeAt\.toString\.padStart$'}
        operation: {regex: '^(?:replace|String\.replace)$'}
  match_examples:
  - name: typed console log receives attacker-controlled text
    code: |
      function audit(input: string) {
        console.log(input);
      }
    expect_match_text: [console.log]
  - name: typed console log literal is not a tainted log entry
    code: |
      function audit() {
        console.log("service started");
      }
    expect_no_match: true
  description: "console.log(tainted text) can permit forged log records when CR or LF remains in the value."
