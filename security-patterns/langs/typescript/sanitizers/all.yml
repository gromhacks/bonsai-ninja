      import argon2 from "argon2";
      function verify(hash: string, input: string) {
        return argon2.verify(hash, input);
      }
    expect_match_text: [argon2.verify]
  description: "argon2.verify - Argon2id constant-time verification."

# -- Open-redirect mitigations -------------------------------------------------
- id: typescript.sanitizer.is_url_module
  enabled: true
  language: typescript
  tag: open-redirect-sanitize
  packages: [is-url, is-url-superb]
  match:
    kind: call
    callee:
      regex: "^isURL$"
  match_examples:
  - name: is-url call
    code: |
      import isURL from "is-url";
      function ok(input: string) {
        return isURL(input);
      }
    expect_match_text: [isURL]
  description: "is-url(input) - boolean URL validator; pair with allowlist."

- id: typescript.sanitizer.valid_url_iswebui
  enabled: true
  language: typescript
  tag: open-redirect-sanitize
  packages: [valid-url]
  match:
    kind: call
    callee:
      attribute: [validUrl, isWebUri]
  match_examples:
  - name: valid-url isWebUri
    code: |
      import validUrl from "valid-url";
      function ok(input: string) {
        return validUrl.isWebUri(input);
      }
    expect_match_text: [validUrl.isWebUri]
  description: "valid-url isWebUri - returns the URL if it is valid http(s); rejects javascript:/data:/file:."

- id: typescript.sanitizer.same_origin_path_startswith
  enabled: true
  language: typescript
  tag: same-origin-path
  match:
    kind: call
    callee:
      regex: "^(path|pathname|next|returnTo|redirect|redirectTo|redirectUrl|url)\\.startsWith$"
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^['\"]\\/['\"]$"
  match_examples:
  - name: same-origin redirect path guard
    code: |
      function safeRedirect(next: string): string {
        if (next.startsWith("/") && !next.startsWith("//")) {
          return next;
        }
        return "/";
      }
    expect_match_text: [next.startsWith]
  - name: same-origin redirect path guard negative constraint boundary
    code: "function safeRedirect(next: string): string {\n  if (next.startsWith() && !next.startsWith(\"//\")) {\n    return
      next;\n  }\n  return \"/\";\n}\n"
    expect_no_match: true
  description: "startsWith(\"/\") on redirect/path variables - credits same-origin relative-path validation when used with
    a sibling `!startsWith(\"//\")` network-path guard."

# -- Focused allowlist / regex / SQL binding validators -----------------------
- id: typescript.sanitizer.allowlist_set_has
  enabled: false
  language: typescript
  tag: allowlist-validate
  match:
    kind: call
    callee:
      regex: "^(allowed|allowlist|allowedValues|allowedNames|allowedRoles|allowedRoutes|allowedTargets|ALLOWED_[A-Za-z0-9_]+)\\\
        .has$"
  constraints:
  - min_args: 1
  match_examples:
  - name: named Set allowlist has
    code: |
      const allowedRoles = new Set(["user", "admin"]);
      function ok(role: string): boolean {
        return allowedRoles.has(role);
      }
    expect_match_text: [allowedRoles.has]
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    Named Set.has allowlists - boolean finite-set validation, limited to allowlist-named receivers."

  disabled_reason:
    code: over-broad
- id: typescript.sanitizer.allowlist_array_includes
  enabled: false
  language: typescript
  tag: allowlist-validate
  match:
    kind: call
    callee:
      regex: "^(allowed|allowlist|allowedValues|allowedNames|allowedRoles|allowedRoutes|allowedTargets|ALLOWED_[A-Za-z0-9_]+)\\\
        .includes$"
  constraints:
  - min_args: 1
  match_examples:
  - name: named array allowlist includes
    code: |
      const allowedRoutes = ["/home", "/profile"];
      function ok(next: string): boolean {
        return allowedRoutes.includes(next);
      }
    expect_match_text: [allowedRoutes.includes]
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    Named Array.includes allowlists - validates that input is one of a finite literal set."

  disabled_reason:
    code: over-broad
- id: typescript.sanitizer.allowlist_object_hasown
  enabled: false
  language: typescript
  tag: allowlist-validate
  match:
    kind: call
    callee:
      regex: "^Object\\.(hasOwn|hasOwnProperty)$|^Object\\.prototype\\.hasOwnProperty\\.call$"
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^(allowed|allowlist|allowedMap|allowedRoutes|allowedTargets|ALLOWED_[A-Za-z0-9_]+)$"
  - min_args: 2
  match_examples:
  - name: object map allowlist hasOwn
    code: |
      const allowedRoutes: Record<string, string> = { home: "/home", profile: "/profile" };
      function pick(name: string): string {
        if (Object.hasOwn(allowedRoutes, name)) {
          return allowedRoutes[name];
        }
        return "/";
      }
    expect_match_text: [Object.hasOwn]
  - name: object map allowlist hasOwn negative constraint boundary
    code: "const allowedRoutes: Record<string, string> = { home: \"/home\", profile: \"/profile\" };\nfunction pick(name:
      string): string {\n  if (Object.hasOwn()) {\n    return allowedRoutes[name];\n  }\n  return \"/\";\n}\n"
    expect_no_match: true
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    Object.hasOwn/Object.prototype.hasOwnProperty.call over allowlist-named maps - validates finite object-map keys before
    selecting a trusted mapped value."

  disabled_reason:
    code: over-broad
- id: typescript.sanitizer.named_regex_test
  enabled: false
  language: typescript
  tag: regex-validate
  match:
    kind: call
    callee:
      regex: "^(uuid(Re|Regex|Pattern)|slug(Re|Regex|Pattern)|id(Re|Regex|Pattern)|safe(Re|Regex|Pattern)|allowed(Re|Regex|Pattern))\\\
        .test$"
  constraints:
  - min_args: 1
  match_examples:
  - name: safe named regex test
    code: |
      const uuidRe = /^[0-9a-f-]{36}$/i;
      function ok(id: string): boolean {
        return uuidRe.test(id);
      }
    expect_match_text: [uuidRe.test]
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    Named allowlist regex .test validators - constrained to receivers named for UUID/slug/id/safe/allowed validation."

  disabled_reason:
    code: over-broad
- id: typescript.sanitizer.db_placeholder_query
  enabled: true
  language: typescript
  tag: sql-parameter
  packages: [mysql, mysql2, pg]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.(query|execute)$"
  constraints:
  - min_args: 2
  - arg_matches_regex:
      index: 0
      regex: "^['\"`][^'\"`]*(SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|VALUES)[^'\"`]*(\\?|\\$[0-9]+)"
  - arg_not_matches_regex:
      index: 0
      regex: "\\$\\{|\\+"
  match_examples:
  - name: pg pool query with bind args
    code: |
      const _u = require("mysql");
      function byId(pool: any, id: string) {
        return pool.query("SELECT * FROM users WHERE id = $1", [id]);
      }
    expect_match_text: [pool.query]
  - name: pg pool query with bind args negative constraint boundary
    code: "const _u = require(\"mysql\");\nfunction byId(pool: any, id: string) {\n  return pool.query();\n}\n"
    expect_no_match: true
  description: "mysql/mysql2/pg query or execute calls with a literal placeholder SQL string and separate bind args. Receiver-agnostic;
    package context gate on the driver list prevents over-matching."

- id: typescript.sanitizer.char_allowlist_replace_strip
  enabled: true
  language: typescript
  tag: char-allowlist
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.replace$"
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^\\/\\[\\^[A-Za-z0-9_\\\\\\- .:@\\/]+\\]\\+?\\/g$"
  - arg_equals:
      index: 1
      value: '""'
  match_examples:
  - name: regex character allowlist strip
    code: |
      function cleanName(input: string): string {
        return input.replace(/[^a-zA-Z0-9_-]/g, "");
      }
    expect_match_text: [input.replace]
  - name: regex character allowlist strip negative constraint boundary
    code: "function cleanName(input: string): string {\n  return input.replace();\n}\n"
    expect_no_match: true
  description: "String.replace(/[^allowlist]/g, \"\") - strips every character outside a small explicit allowlist."

# -- Additional focused validation, containment, binding, and escaping --------
- id: typescript.sanitizer.sanitize_html
  enabled: true
  language: typescript
  tag: html-sanitize
  packages: [sanitize-html]
  match:
    kind: call
    callee:
      name: sanitizeHtml
  match_examples:
