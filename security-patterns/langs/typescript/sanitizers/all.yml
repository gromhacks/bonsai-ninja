# TypeScript sanitizers — tag names use the spec-canonical vocabulary
# (html-encode / html-sanitize / url-encode / url-parse / shell-escape /
# sql-parameter / constant-time / jwt-verify / path-sanitize / ldap-escape /
# numeric-coerce / validation).

# ── HTML ────────────────────────────────────────────────────────────────────
- id: typescript.sanitizer.dompurify_sanitize
  enabled: true
  language: typescript
  tag: html-sanitize
  packages: [dompurify, "isomorphic-dompurify"]
  imports: [dompurify]
  match:
    kind: call
    callee:
      regex: "^DOMPurify\\.sanitize$"
  match_examples:
  - name: dompurify namespace sanitize
    code: |
      import DOMPurify from "dompurify";
      function clean(input: string) {
        return DOMPurify.sanitize(input);
      }
    expect_match_text: [DOMPurify.sanitize]
  description: "DOMPurify.sanitize — strips executable HTML/SVG, returns XSS-safe fragment."

- id: typescript.sanitizer.xss_library
  enabled: true
  language: typescript
  tag: html-sanitize
  packages: [xss]
  imports: [xss]
  match:
    kind: call
    callee:
      name: xss
  match_examples:
  - name: xss module filter
    code: |
      import xss from "xss";
      function clean(input: string) {
        return xss(input);
      }
    expect_match_text: [xss]
  description: "`xss` library filter — whitelists tags/attrs, escapes the rest."

- id: typescript.sanitizer.he_encode
  enabled: true
  language: typescript
  tag: html-encode
  packages: [he]
  match:
    kind: call
    callee:
      regex: "^he\\.encode$"
  match_examples:
  - name: he encode
    code: |
      import * as he from "he";
      function clean(input: string) {
        return he.encode(input);
      }
    expect_match_text: [he.encode]
  description: "he.encode — HTML entity encode (named + numeric refs)."

- id: typescript.sanitizer.he_escape
  enabled: true
  language: typescript
  tag: html-encode
  packages: [he]
  match:
    kind: call
    callee:
      regex: "^he\\.escape$"
  match_examples:
  - name: he escape
    code: |
      import * as he from "he";
      function clean(input: string) {
        return he.escape(input);
      }
    expect_match_text: [he.escape]
  description: "he.escape — escapes &<>\"' to HTML entities."

- id: typescript.sanitizer.validator_escape
  enabled: true
  language: typescript
  tag: html-encode
  packages: [validator]
  match:
    kind: call
    callee:
      regex: "^validator\\.escape$"
  match_examples:
  - name: validator escape
    code: |
      import validator from "validator";
      function clean(input: string) {
        return validator.escape(input);
      }
    expect_match_text: [validator.escape]
  description: "validator.escape — replaces HTML-unsafe characters with entity refs."

# ── URL ─────────────────────────────────────────────────────────────────────
- id: typescript.sanitizer.validator_is_url
  enabled: true
  language: typescript
  tag: validation
  packages: [validator]
  match:
    kind: call
    callee:
      regex: "^validator\\.isURL$"
  match_examples:
  - name: validator isURL
    code: |
      import validator from "validator";
      function ok(input: string) {
        return validator.isURL(input);
      }
    expect_match_text: [validator.isURL]
  description: "validator.isURL — URL format check; pair with allowlist to block open-redirect."

- id: typescript.sanitizer.validator_is_numeric
  enabled: true
  language: typescript
  tag: numeric-coerce
  packages: [validator]
  match:
    kind: call
    callee:
      regex: "^validator\\.isNumeric$"
  match_examples:
  - name: validator isNumeric
    code: |
      import validator from "validator";
      function ok(input: string) {
        return validator.isNumeric(input);
      }
    expect_match_text: [validator.isNumeric]
  description: "validator.isNumeric — digits-only check; neutralises tainted numeric paths."

# ── SQL ─────────────────────────────────────────────────────────────────────
- id: typescript.sanitizer.sqlstring_escape
  enabled: true
  language: typescript
  tag: sql-parameter
  packages: [sqlstring, mysql, mysql2]
  match:
    kind: call
    callee:
      regex: "^SqlString\\.escape$"
  match_examples:
  - name: SqlString escape
    code: |
      import * as SqlString from "sqlstring";
      function clean(input: string) {
        return SqlString.escape(input);
      }
    expect_match_text: [SqlString.escape]
  description: "sqlstring.escape — MySQL-quotes the value for direct interpolation."

- id: typescript.sanitizer.sql_template_strings
  enabled: true
  language: typescript
  tag: sql-parameter
  packages: [sql-template-strings]
  match:
    kind: call
    callee:
      name: SQL
  match_examples:
  - name: sql-template-strings tag
    code: |
      import SQL from "sql-template-strings";
      function byId(id: string) {
        return SQL`SELECT * FROM users WHERE id = ${id}`;
      }
    expect_match_text: [SQL]
  description: "sql-template-strings tagged template — parametrises interpolations."

- id: typescript.sanitizer.mysql_escape
  enabled: true
  language: typescript
  tag: sql-parameter
  packages: [mysql, mysql2]
  match:
    kind: call
    callee:
      regex: "^mysql\\.escape$"
  match_examples:
  - name: mysql escape
    code: |
      import mysql from "mysql2";
      function clean(input: string) {
        return mysql.escape(input);
      }
    expect_match_text: [mysql.escape]
  description: "mysql / mysql2 .escape() — quotes literals for raw SQL."

- id: typescript.sanitizer.pg_format
  enabled: true
  language: typescript
  tag: sql-parameter
  packages: [pg-format]
  match:
    kind: call
    callee:
      name: format
  match_examples:
  - name: pg-format call
    code: |
      import format from "pg-format";
      function clean(input: string) {
        return format("%L", input);
      }
    expect_match_text: [format]
  description: "pg-format format() — quotes with %I / %L specifiers (bare `format` name; narrow in audit)."

# ── Shell ───────────────────────────────────────────────────────────────────
- id: typescript.sanitizer.shell_quote
  enabled: true
  language: typescript
  tag: shell-escape
  packages: [shell-quote]
  match:
    kind: call
    callee:
      regex: "^shellQuote\\.quote$"
  match_examples:
  - name: shell-quote quote
    code: |
      import * as shellQuote from "shell-quote";
      function quote(argv: string[]) {
        return shellQuote.quote(argv);
      }
    expect_match_text: [shellQuote.quote]
  description: "shell-quote.quote — produces a POSIX-safe shell-escaped string."
- id: typescript.sanitizer.shell_escape_default
  enabled: true
  language: typescript
  tag: shell-escape
  packages: [shell-escape]
  match:
    kind: call
    callee:
      name: shellescape
  match_examples:
  - name: shell-escape default import
    code: |
      import shellescape from "shell-escape";
      function quote(argv: string[]) {
        return shellescape(argv);
      }
    expect_match_text: [shellescape]
  description: "shell-escape default export — produces a POSIX-safe shell-escaped string."

# ── Validation (zod / joi / yup / class-validator) ──────────────────────────
- id: typescript.sanitizer.zod_parse
  enabled: true
  language: typescript
  tag: validation
  packages: [zod]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.parse$"
  match_examples:
  - name: schema parse
    code: |
      const _u = require("zod");
      function clean(schema: any, input: unknown) {
        return schema.parse(input);
      }
    expect_match_text: [schema.parse]
  description: "zod schema.parse — throws on shape mismatch; coerced output is schema-constrained."

- id: typescript.sanitizer.zod_safeparse
  enabled: true
  language: typescript
  tag: validation
  packages: [zod]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.safeParse$"
  match_examples:
  - name: schema safeParse
    code: |
      const _u = require("zod");
      function clean(schema: any, input: unknown) {
        return schema.safeParse(input);
      }
    expect_match_text: [schema.safeParse]
  description: "zod schema.safeParse — non-throwing schema validation."

- id: typescript.sanitizer.yup_validate
  enabled: true
  language: typescript
  tag: validation
  packages: [yup]
  match:
    kind: call
    callee:
      regex: "^yupSchema\\.validate(Sync)?$"
  match_examples:
  - name: schema validate
    code: |
      const _u = require("yup");
      function clean(yupSchema: any, input: unknown) {
        return yupSchema.validate(input);
      }
    expect_match_text: [yupSchema.validate]
  description: "yup schema.validate / validateSync — schema validation."

- id: typescript.sanitizer.joi_validate
  enabled: true
  language: typescript
  tag: validation
  packages: [joi, "@hapi/joi"]
  match:
    kind: call
    callee:
      regex: "^joiSchema\\.validate$"
  match_examples:
  - name: joi schema validate
    code: |
      const _u = require("joi");
      function clean(joiSchema: any, input: unknown) {
        return joiSchema.validate(input);
      }
    expect_match_text: [joiSchema.validate]
  description: "Joi schema.validate — validates and coerces input against a declared schema."

- id: typescript.sanitizer.class_validator_validate
  enabled: false
  disabled_reason:
    code: over-broad
  language: typescript
  tag: validation
  packages: [class-validator]
  match:
    kind: call
    callee:
      name: validate
  description: "Disabled — bare validate overmatches unrelated functions; enable when import-aware matching can prove class-validator."

# ── JWT ─────────────────────────────────────────────────────────────────────
- id: typescript.sanitizer.jwt_verify
  enabled: true
  language: typescript
  tag: jwt-verify
  packages: [jsonwebtoken]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.verify$"
  match_examples:
  - name: jwt verify
    code: |
      import jwt from "jsonwebtoken";
      function verify(token: string, key: string) {
        return jwt.verify(token, key);
      }
    expect_match_text: [jwt.verify]
  description: "jsonwebtoken.verify — asserts signature & expiry (pin `algorithms`)."

- id: typescript.sanitizer.jose_jwtverify
  enabled: true
  language: typescript
  tag: jwt-verify
  packages: [jose]
  match:
    kind: call
    callee:
      name: jwtVerify
  match_examples:
  - name: jose jwtVerify
    code: |
      import { jwtVerify } from "jose";
      async function verify(token: string, key: CryptoKey) {
        return jwtVerify(token, key);
      }
    expect_match_text: [jwtVerify]
  description: "jose.jwtVerify — verifies JWS signature + claims."

# ── Constant-time compare ───────────────────────────────────────────────────
- id: typescript.sanitizer.crypto_timingsafeequal
  enabled: true
  language: typescript
  tag: constant-time
  packages: [crypto]
  match:
    kind: call
    callee:
      regex: "^crypto\\.timingSafeEqual$"
  match_examples:
  - name: crypto timingSafeEqual
    code: |
      import crypto from "crypto";
      function same(a: Buffer, b: Buffer) {
        return crypto.timingSafeEqual(a, b);
      }
    expect_match_text: [crypto.timingSafeEqual]
  description: "crypto.timingSafeEqual — constant-time buffer comparison (anti-timing-oracle)."

# ── Path ────────────────────────────────────────────────────────────────────
- id: typescript.sanitizer.path_normalize
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: typescript
  tag: path-sanitize
  packages: [path]
  match:
    kind: call
    callee:
      attribute: [path, normalize]
  description: "Disabled — path.normalize alone does NOT prevent traversal; requires path.resolve + prefix check."

# ── NoSQL operator stripping ────────────────────────────────────────────────
- id: typescript.sanitizer.mongo_sanitize
  enabled: true
  language: typescript
  tag: nosql-sanitize
  packages: [mongo-sanitize, express-mongo-sanitize]
  match:
    kind: call
    callee:
      name: mongoSanitize
  match_examples:
  - name: mongo-sanitize call
    code: |
      import mongoSanitize from "mongo-sanitize";
      function clean(input: unknown) {
        return mongoSanitize(input);
      }
    expect_match_text: [mongoSanitize]
  description: "mongo-sanitize — strips top-level $-prefixed and dot-containing keys, neutralising operator injection."

- id: typescript.sanitizer.express_mongo_sanitize
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: typescript.sanitizer.mongo_sanitize
  language: typescript
  tag: nosql-sanitize
  packages: [express-mongo-sanitize]
  match:
    kind: call
    callee:
      name: mongoSanitize
  description: "Disabled duplicate — same `mongoSanitize()` call shape is covered by typescript.sanitizer.mongo_sanitize with
    express-mongo-sanitize package metadata merged."

