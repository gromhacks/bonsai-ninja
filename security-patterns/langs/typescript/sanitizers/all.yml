- id: typescript.sanitizer.named_regex_match
  enabled: false
  language: typescript
  tag: regex-validate
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.match$"
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^(uuid(Re|Regex|Pattern)|slug(Re|Regex|Pattern)|id(Re|Regex|Pattern)|safe(Re|Regex|Pattern)|allowed(Re|Regex|Pattern))$"
  match_examples:
  - name: input match slug regex
    code: |
      function ok(input: string, slugRe: RegExp) {
        return input.match(slugRe);
      }
    expect_match_text: [input.match]
  - name: value match allowed pattern
    code: |
      function ok(value: string, allowedPattern: RegExp) {
        return value.match(allowedPattern);
      }
    expect_match_text: [value.match]
  - name: input match slug regex negative constraint boundary
    code: "function ok(input: string, slugRe: RegExp) {\n  return input.match();\n}\n"
    expect_no_match: true
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    String.match(named allowlist regex) gates — regex object must be named for safe/id/slug/uuid/allowed validation."

  disabled_reason:
    code: over-broad
- id: typescript.sanitizer.path_containment_startswith
  enabled: false
  language: typescript
  tag: path-sanitize
  packages: [path]
  match:
    kind: call
    callee:
      regex: "^(resolved|resolvedPath|fullPath|candidate|targetPath|filePath)\\.startsWith$"
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^(root|base|baseDir|uploadDir|publicDir|safeRoot|allowedRoot)"
  match_examples:
  - name: resolved path startsWith uploadDir
    code: |
      const _u = require("path");
      function ok(resolved: string, uploadDir: string) {
        return resolved.startsWith(uploadDir);
      }
    expect_match_text: [resolved.startsWith]
  - name: fullPath startsWith safeRoot
    code: |
      const _u = require("path");
      function ok(fullPath: string, safeRoot: string) {
        return fullPath.startsWith(safeRoot);
      }
    expect_match_text: [fullPath.startsWith]
  - name: resolved path startsWith uploadDir negative constraint boundary
    code: "const _u = require(\"path\");\nfunction ok(resolved: string, uploadDir: string) {\n  return resolved.startsWith();\n\
      }\n"
    expect_no_match: true
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    Canonical path containment guard after path.resolve/normalize — validates the resolved candidate remains under a trusted
    root."

  disabled_reason:
    code: over-broad
- id: typescript.sanitizer.url_origin_host_allowlist
  enabled: false
  language: typescript
  tag: open-redirect-sanitize
  match:
    kind: call
    callee:
      regex: "^(allowedOrigins|allowedHosts|allowedRedirectHosts|trustedOrigins|trustedHosts|ALLOWED_(ORIGINS|HOSTS))\\.(has|includes)$"
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^(url\\.)?(origin|host|hostname)|parsed\\.(origin|host|hostname)$"
  match_examples:
  - name: allowed origins has url origin
    code: |
      function ok(url: URL, allowedOrigins: Set<string>) {
        return allowedOrigins.has(url.origin);
      }
    expect_match_text: [allowedOrigins.has]
  - name: allowed hosts includes parsed hostname
    code: |
      function ok(parsed: URL, allowedHosts: string[]) {
        return allowedHosts.includes(parsed.hostname);
      }
    expect_match_text: [allowedHosts.includes]
  - name: allowed origins has url origin negative constraint boundary
    code: "function ok(url: URL, allowedOrigins: Set<string>) {\n  return allowedOrigins.has();\n}\n"
    expect_no_match: true
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    URL origin/host allowlist membership — credits finite allowlists over parsed URL origin/host/hostname values."

  disabled_reason:
    code: over-broad
- id: typescript.sanitizer.prisma_tagged_raw_query
  enabled: true
  language: typescript
  tag: sql-parameter
  packages: ["@prisma/client"]
  imports: ["@prisma/client"]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.\\$(queryRaw|executeRaw)$"
  constraints:
  - arg_not_matches_regex:
      index: 0
      regex: "Prisma\\.raw|\\$\\{|\\+"
  match_examples:
  - name: prisma queryRaw tagged template literal placeholder
    code: |
      const _u = require("@prisma/client");
      async function byId(prisma: any, id: string) {
        return prisma.$queryRaw`SELECT * FROM users WHERE id = ${id}`;
      }
    expect_match_text: [prisma.$queryRaw]
  - name: prisma executeRaw tagged template literal placeholder
    code: |
      const _u = require("@prisma/client");
      async function update(prisma: any, id: string) {
        return prisma.$executeRaw`UPDATE users SET seen = true WHERE id = ${id}`;
      }
    expect_match_text: [prisma.$executeRaw]
  - name: prisma queryRaw tagged template literal placeholder negative constraint boundary
    code: |
      import { Prisma } from "@prisma/client";
      async function example(prisma: any, table: string) {
        return prisma.$queryRaw(Prisma.raw("SELECT * FROM " + table));
      }
    expect_no_match: true
  description: "Prisma $queryRaw/$executeRaw tagged-template form — interpolations are parameterized unless Prisma.raw/string
    concatenation is used."

- id: typescript.sanitizer.sequelize_query_bindings
  enabled: true
  language: typescript
  tag: sql-parameter
  packages: [sequelize]
  match:
    kind: call
    callee:
      regex: "^sequelize\\.query$"
  constraints:
  - any_arg_matches_regex: "\\b(replacements|bind)\\s*:"
  - arg_not_matches_regex:
      index: 0
      regex: "\\$\\{|\\+"
  match_examples:
  - name: sequelize replacements
    code: |
      const _u = require("sequelize");
      function byId(sequelize: any, id: string) {
        return sequelize.query("SELECT * FROM users WHERE id = :id", { replacements: { id } });
      }
    expect_match_text: [sequelize.query]
  - name: sequelize bind
    code: |
      const _u = require("sequelize");
      function byId(sequelize: any, id: string) {
        return sequelize.query("SELECT * FROM users WHERE id = $id", { bind: { id } });
      }
    expect_match_text: [sequelize.query]
  - name: sequelize replacements negative constraint boundary
    code: "const _u = require(\"sequelize\");\nfunction byId(sequelize: any, id: string) {\n  return sequelize.query();\n\
      }\n"
    expect_no_match: true
  description: "Sequelize raw query with replacements/bind options and literal SQL text — parameterized form."

- id: typescript.sanitizer.ldap_escape_variants
  enabled: true
  language: typescript
  tag: ldap-escape
  packages: [ldap-escape, ldapjs]
  match:
    kind: call
    callee:
      regex: "^(ldapEscape|ldapjs|ldap)\\.(filter|escapeFilter|escape)$"
  match_examples:
  - name: ldap escape filter variant
    code: |
      const _u = require("ldap-escape");
      function clean(ldapjs: any, input: string) {
        return ldapjs.escapeFilter(input);
      }
    expect_match_text: [ldapjs.escapeFilter]
  - name: ldap escape namespace filter
    code: |
      const _u = require("ldap-escape");
      function clean(ldapEscape: any, input: string) {
        return ldapEscape.filter(input);
      }
    expect_match_text: [ldapEscape.filter]
  description: "LDAP filter escaping variants — RFC 4515 escaping before LDAP search filter interpolation."

- id: typescript.sanitizer.xpath_literal_escape
  enabled: true
  language: typescript
  tag: xpath-parameter
  packages: [xpath-escape, xpath]
  match:
    kind: call
    callee:
      regex: "^(xpathEscape|xpathLiteral|xpath\\.literal)$"
  match_examples:
  - name: xpath-escape call
    code: |
      import xpathEscape from "xpath-escape";
      function clean(input: string) {
        return xpathEscape(input);
      }
    expect_match_text: [xpathEscape]
  - name: xpath literal namespace
    code: |
      const _u = require("xpath-escape");
      function clean(xpath: any, input: string) {
        return xpath.literal(input);
      }
    expect_match_text: [xpath.literal]
  description: "XPath literal escaping — quotes attacker-controlled strings before XPath expression interpolation."

- id: typescript.sanitizer.xml_escape
  enabled: true
  language: typescript
  tag: xxe-sanitizer
  packages: [entities, "html-entities"]
  match:
    kind: call
    callee:
      regex: "^(entities|htmlEntities)\\.(encodeXML|encodeNonAsciiHTML)$"
  match_examples:
  - name: entities encodeXML
    code: |
      const _u = require("entities");
      function clean(entities: any, input: string) {
        return entities.encodeXML(input);
      }
    expect_match_text: [entities.encodeXML]
  description: "XML entity escaping for text nodes and attributes; HTML encoders such as he.escape/escapeHtml are owned by
    the HTML sanitizer rules to avoid duplicate sanitizer evidence."

- id: typescript.sanitizer.libxmljs_safe_options
  enabled: true
  language: typescript
  tag: xxe-sanitizer
  packages: [libxmljs, libxmljs2]
  match:
    kind: call
    callee:
      regex: "^libxmljs\\.(parseXml|parseXmlString|loadXml)$"
  constraints:
  - any_arg_matches_regex: "noent\\s*:\\s*false|dtdload\\s*:\\s*false|nonet\\s*:\\s*true"
  match_examples:
  - name: libxmljs parseXml safe noent false
    code: |
      const _u = require("libxmljs");
      function parse(libxmljs: any, input: string) {
        return libxmljs.parseXml(input, { noent: false, nonet: true });
      }
    expect_match_text: [libxmljs.parseXml]
  - name: libxmljs loadXml safe dtdload false
    code: |
      const _u = require("libxmljs");
      function parse(libxmljs: any, input: string) {
        return libxmljs.loadXml(input, { dtdload: false, nonet: true });
      }
    expect_match_text: [libxmljs.loadXml]
  - name: libxmljs parseXml safe noent false negative constraint boundary
    code: "const _u = require(\"libxmljs\");\nfunction parse(libxmljs: any, input: string) {\n  return libxmljs.parseXml();\n\
      }\n"
    expect_no_match: true
  description: "libxmljs parser calls with safe XXE options — entity expansion/DTD loading disabled and network access blocked."

# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) — taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: typescript.passthrough.decode_uri_component
  enabled: true
  language: typescript
  tag: passthrough-decode
  match:
    kind: call
    callee:
      name: decodeURIComponent
  match_examples:
  - name: decodeURIComponent passthrough
    code: |
      function decode(input: string) {
        return decodeURIComponent(input);
      }
    expect_match_text: [decodeURIComponent]
  description: "decodeURIComponent(s) — preserves taint."
- id: typescript.passthrough.decode_uri
  enabled: true
  language: typescript
  tag: passthrough-decode
  match:
    kind: call
    callee:
      name: decodeURI
  match_examples:
  - name: decodeURI passthrough
    code: |
      function decode(input: string) {
        return decodeURI(input);
      }
    expect_match_text: [decodeURI]
  description: "decodeURI(s) — preserves taint."

# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: typescript.csrf.csurf_middleware
  enabled: true
  language: typescript
  tag: csrf-protect
  match:
    kind: call
    callee:
      name: csurf
  match_examples:
  - name: csurf middleware
    code: |
      import csurf from "csurf";
      function protection() {
        return csurf();
      }
    expect_match_text: [csurf]
  description: "csurf() — Express/Koa CSRF middleware factory."
- id: typescript.csrf.koa_csrf
  enabled: true
  language: typescript
  tag: csrf-protect
  match:
    kind: call
    callee:
      attribute: [koa, csrf]
  match_examples:
  - name: koa csrf
    code: |
      function protection(koa: any) {
        return koa.csrf();
      }
    expect_match_text: [koa.csrf]
  description: "Koa CSRF middleware setup."

# Lock-acquire sanitizers (T502). Tagged `lock-acquire` so
# reviewer enumerates guarded sections; the in-scope-cleanse
# semantics handle 'while lock is held, accesses are safe'.
- id: typescript.lock.mutex_acquire
  enabled: true
  language: typescript
  tag: lock-acquire
  match:
    kind: call
    callee:
      attribute: [mutex, acquire]
  match_examples:
  - name: mutex acquire
    code: |
      async function locked(mutex: any) {
        return mutex.acquire();
      }
    expect_match_text: [mutex.acquire]
  description: "async-mutex Mutex.acquire() (TS via @types/async-mutex)."

# Cookie-secure sanitizers (T402). Cookie-set calls with
# httpOnly + secure flags are the SAFE shape; reviewer
# enumerates with `security sanitizers --tag cookie-secure`
# and audits routes that set cookies WITHOUT them.
- id: typescript.cookie.set_with_httponly_secure
  enabled: true
  language: typescript
  tag: cookie-secure
  match:
    kind: call
    callee:
      attribute: [res, cookie]
  constraints:
  - any_arg_matches_regex: |-
      httpOnly.*true|secure.*true
  match_examples:
  - name: secure httponly cookie
    code: |
      function setCookie(res: any, token: string) {
        return res.cookie("sid", token, { httpOnly: true, secure: true });
      }
    expect_match_text: [res.cookie]
  - name: secure httponly cookie negative constraint boundary
    code: "function setCookie(res: any, token: string) {\n  return res.cookie();\n}\n"
    expect_no_match: true
  description: "res.cookie(name, val, {httpOnly: true, secure: true}) — TS via @types/express."
