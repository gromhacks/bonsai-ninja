    code: |
      import sanitizeHtml from "sanitize-html";
      function clean(input: string) {
        return sanitizeHtml(input);
      }
    expect_match_text: [sanitizeHtml]
  description: "sanitize-html — tag/attribute allowlist stripping."

- id: typescript.sanitizer.escape_html_module
  enabled: true
