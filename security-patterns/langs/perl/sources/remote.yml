    code: |
      use Catalyst;
      sub handle {
        my ($c) = @_;
        return $c->req->captures();
      }
    expect_match_text: [c->req->captures]
  - name: application arguments are not route captures
    code: |
      use Catalyst;
      sub handle {
        my ($job) = @_;
        return $job->args();
      }
    expect_no_match: true
  description: "Catalyst c->req->args()/captures() - client-controlled path components captured by the route dispatcher."

- id: perl.source.plack_environment_request_fields
  enabled: true
  language: perl
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [header, path, query]
  packages: [Plack, "Plack::Request", PSGI]
  match:
    kind: read
    target:
      regex: "^\\$?[A-Za-z_][A-Za-z0-9_]*\\.(QUERY_STRING|PATH_INFO|REQUEST_URI|HTTP_[A-Z0-9_]+|CONTENT_TYPE|CONTENT_LENGTH)$"
  match_examples:
  - name: PSGI inbound header environment entry
    code: |
      use Plack::Request;
      sub app {
        my ($env) = @_;
        return $env->{HTTP_X_FORWARDED_HOST};
      }
    expect_match_text: [env.HTTP_X_FORWARDED_HOST]
  - name: PSGI server software metadata is not client input
    code: |
      use Plack::Request;
      sub app {
        my ($env) = @_;
        return $env->{SERVER_SOFTWARE};
      }
    expect_no_match: true
  description: "PSGI/Plack environment request fields - query/path/request URI, HTTP_* headers, and content headers. Server/process metadata entries are deliberately excluded."
