  - name: same json spelling without Mojolicious import negative
    code: |
      sub json { return "safe" }
      sub example { json("local") }
    expect_no_match: true
  description: "Mojolicious $c->req->json - parsed JSON request body. Fully attacker-controlled. `max_args: 1` keeps it to the request-side accessor/JSON-Pointer form and off encode-side `render(json => {...})` calls that take a hashref payload."

# -- Other I/O sources ---------------------------------------------
- id: perl.source.socket_recv_buffer
  enabled: true
  language: perl
  trust: remote
  category: net-input
  tag: net-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      name: recv
  constraints:
  - top_level: true
  - arg_count: 4
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: Perl socket recv output buffer
    code: |
      sub example {
        my ($socket) = @_;
        recv($socket, my $buffer, 4096, 0);
        return $buffer;
      }
    expect_match_text: [recv]
  - name: receiver method is not the Perl recv builtin
    code: |
      sub example {
        my ($handle) = @_;
        return $handle->recv(4096);
      }
    expect_no_match: true
  description: "Second argument of Perl's recv(SOCKET, SCALAR, LENGTH, FLAGS) builtin - buffer overwritten with peer-supplied socket bytes. The return value is peer-address/status information and is not the data carrier."

# -- Disabled / FP-prone -------------------------------------------
- id: perl.source.mojolicious_req_param
  enabled: true
  language: perl
  trust: remote
  category: http-input
  tag: http-input
  packages: [Mojolicious]
  imports: ["Mojo::Base"]
  match:
    kind: call
    callee:
      regex: '^\$?[A-Za-z_][A-Za-z0-9_]*->param$'
  constraints:
  - min_args: 1
  - max_args: 1
  match_examples:
  - name: Mojolicious controller parameter
    code: |
      package App::Controller::Search;
      use Mojo::Base 'Mojolicious::Controller', -signatures;
      sub show ($controller) { return $controller->param('q'); }
    expect_match_text: [controller->param]
  - name: non-controller object parameter method is not Mojolicious input
    code: |
      package App::Config;
      sub show ($config) { return $config->param('q'); }
    expect_no_match: true
  description: "Mojolicious controller ->param(name) on a file proven by Mojo::Base framework ownership; the receiver binding name is arbitrary."

- id: perl.source.mojolicious_req_body
  enabled: true
  language: perl
  trust: remote
  category: http-input
  tag: http-input
  packages: [Mojolicious]
  imports: ["Mojo::Base"]
  match:
    kind: call
    callee:
      regex: '^\$?[A-Za-z_][A-Za-z0-9_]*->req->body$'
  constraints:
  - max_args: 0
  match_examples:
  - name: Mojolicious raw request body
    code: |
      package App::Controller::State;
      use Mojo::Base 'Mojolicious::Controller', -signatures;
      sub restore ($controller) { return $controller->req->body; }
    expect_match_text: [controller->req->body]
  - name: response body accessor is not inbound request data
    code: |
      package App::Client;
      sub restore ($client) { return $client->response->body; }
    expect_no_match: true
  description: "Mojolicious controller ->req->body raw request bytes, constrained by the exact request chain and Mojo::Base ownership."

- id: perl.source.mojolicious_every_param
  enabled: true
  language: perl
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [query, form]
  packages: [Mojolicious]
  match:
    kind: call
    callee:
      name: every_param
  constraints:
  - arg_count: 1
  match_examples:
  - name: Mojolicious multi-value request parameter
    code: |
      use Mojolicious;
      sub handle {
        my ($c) = @_;
        return $c->every_param('tag');
      }
    expect_match_text: [c->every_param]
  - name: unrelated parameter helper is not the Mojolicious API
    code: |
      use Mojolicious;
      sub handle {
        my ($c) = @_;
        return $c->param_names();
      }
    expect_no_match: true
  description: "Mojolicious controller every_param(name) - every client-supplied query/form value for one parameter name."

- id: perl.source.mojolicious_request_header
  enabled: true
  language: perl
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [header]
  packages: [Mojolicious]
  match:
    kind: call
    callee:
      regex: "^\\$?[A-Za-z_][A-Za-z0-9_]*->req->headers->header$"
  constraints:
  - arg_count: 1
  match_examples:
  - name: Mojolicious inbound request header
    code: |
      use Mojolicious;
      sub handle {
        my ($c) = @_;
        return $c->req->headers->header('X-Test');
      }
    expect_match_text: [c->req->headers->header]
  - name: response header lookup is not inbound request input
    code: |
      use Mojolicious;
      sub handle {
        my ($c) = @_;
        return $c->res->headers->header('X-Test');
      }
    expect_no_match: true
  description: "Mojolicious c->req->headers->header(name) - one client-supplied inbound request header; the req namespace distinguishes it from response headers."

