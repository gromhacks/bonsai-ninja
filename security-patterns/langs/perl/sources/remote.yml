- id: perl.source.plack_upload_filename
  enabled: true
  language: perl
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [path]
  packages: ["Plack::Request", "Plack::Request::Upload", "Mojolicious", CGI]
  match:
    kind: call
    callee:
      name: filename
  constraints:
  - max_args: 0
  match_examples:
  - name: perl.source.plack_upload_filename example
    code: |
      use Plack::Request;
      sub example {
        my ($upload) = @_;
        $upload->filename()
      }
  - name: perl.source.plack_upload_filename setter negative
    code: |
      use Plack::Request;
      sub example {
        my ($upload, $input) = @_;
        $upload->filename($input)
      }
    expect_no_match: true
  description: "Plack/Mojolicious/CGI upload filename accessor - client-controlled multipart filename metadata. `max_args: 0` keeps it to the zero-arg read accessor and off any one-arg setter form."

