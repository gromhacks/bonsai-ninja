# Perl HTTP sources.
# Adapter note: $req->param etc match as `call` with bare `name:` = method.
# Where multiple frameworks share a method name, one rule lists every
# framework that exposes it (CGI.pm-style param/header/cookie verbs are
# almost universal across Perl web stacks).
- id: perl.source.cgi_param
  enabled: true
  language: perl
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [query, form]
  packages: [CGI, "CGI::Simple", "Plack::Request", "Dancer2", "Catalyst", "Mojolicious", Kelp, Raisin, "Web::Simple"]
  match:
    kind: call
    callee:
      name: param
  match_examples:
  - name: perl.source.cgi_param example
    code: |
      use CGI;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        param($input)
      }
  - name: CGI Simple request parameter
    code: |
      use CGI::Simple;
      sub example {
        my ($q) = @_;
        return $q->param('name');
      }
    expect_match_text: [q->param]
  - name: same package without the request accessor
    code: |
      use CGI::Simple;
      sub example {
        my ($q) = @_;
        return $q->url();
      }
    expect_no_match: true
  description: "->param('name') - CGI $q->param, Plack::Request $req->param, Dancer/Dancer2 param helper, Catalyst $c->req->param. All return user-supplied query/body values."

