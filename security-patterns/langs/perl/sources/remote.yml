# -- DBI second-order taint ----------------------------------------
# Database row reads are not first-order remote, but represent
# stored-input flows that can re-enter SQL/eval/cmd sinks. Marked
# `trust: database` so audits opt in via --trust database.
- id: perl.source.dbi_fetchrow_array
  enabled: true
  language: perl
  trust: database
  category: db-input
  tag: db-input
  packages: [DBI]
  match:
    kind: call
    callee:
      name: fetchrow_array
  match_examples:
  - name: perl.source.dbi_fetchrow_array example
    code: |
      use DBI;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        fetchrow_array($input)
      }
  description: "DBI $sth->fetchrow_array - row values previously written to the DB. Models second-order injection (stored XSS / SQL gadget reuse)."

- id: perl.source.dbi_fetchrow_hashref
  enabled: true
  language: perl
  trust: database
  category: db-input
  tag: db-input
  packages: [DBI]
  match:
    kind: call
    callee:
      name: fetchrow_hashref
  match_examples:
  - name: perl.source.dbi_fetchrow_hashref example
    code: |
      use DBI;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        fetchrow_hashref($input)
      }
  description: "DBI $sth->fetchrow_hashref - hash form of fetchrow_array; same second-order trust model."

