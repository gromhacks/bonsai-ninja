  trust: database
  category: db-input
  tag: db-input
  payload_types: [db-row]
  packages: [DBI]
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.fetchrow_(array|arrayref)$'
