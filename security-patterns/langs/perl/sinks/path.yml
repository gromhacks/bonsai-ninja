# Archive extraction (Zip Slip class). Archive::Zip and Archive::Extract
# trust archive entry names; joining entry name into a destination
# path without containment is Zip Slip.
- id: perl.path.archive_zip_extract_to_filenamed
  enabled: true
  language: perl
  tag: zip-slip
  severity: high
  packages: ["Archive::Zip"]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: extractToFileNamed
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.path.archive_zip_extract_to_filenamed example
    code: |
      use Archive::Zip;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        extractToFileNamed($input)
      }
  - name: literal archive zip extract negative
    code: |
      use Archive::Zip;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        extractToFileNamed("tmp/unpacked/file.txt")
      }
    expect_no_match: true
  description: "Archive::Zip member->extractToFileNamed(tainted dest) - destination derived from archive entry name is Zip Slip."
- id: perl.path.archive_zip_extract_member
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: perl
  tag: zip-slip
  severity: high
  packages: ["Archive::Zip"]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: extractMember
  match_examples:
  - name: perl.path.archive_zip_extract_member example
    code: |
      use Archive::Zip;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        extractMember($input)
      }
  description: "Disabled - extractMember(member [, dest]) is only a Zip Slip sink when dest/member state is archive-entry-derived; use extractToFileNamed(dest) until state tracking exists."
- id: perl.path.archive_extract_extract
  enabled: true
  language: perl
  tag: zip-slip
  severity: high
  packages: ["Archive::Extract"]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: extract
  constraints:
  - arg_tainted:
      kw: to
  match_examples:
  - name: perl.path.archive_extract_extract example
    code: |
      use Archive::Extract;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        extract(to => $input)
      }
  - name: literal archive extract destination negative
    code: |
      use Archive::Extract;
      sub example {
        my ($input) = @_;
        extract(to => "/tmp/out")
      }
    expect_no_match: true
  description: "Archive::Extract ->extract(to => tainted) - auto-detects tar/zip; trusts archive contents."

# 3-arg `open(my $fh, '<', '/var/data/' . $name)` shape with a literal
# `<` mode. Distinguished from the cmdi `open ... |cmd` form by the
# arg-1 mode regex requiring `<`, `>`, `>>`, `<+`, `>+`, or `+>` -
# never a leading `|` (that's the cmdi shape).
