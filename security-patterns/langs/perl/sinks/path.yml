# Perl path-traversal sinks. Tainted filename = traversal to ../ or /etc/passwd.
- id: perl.path.open_read
  enabled: false
  disabled_reason:
    code: over-broad
  language: perl
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: open
  description: "Disabled - bare `name: open` is FP-prone; no canonical exists. Without a mode-string constraint we cannot distinguish path (`<path`) from cmdi (`|cmd`) or other open() shapes. Re-enable when adapter supports mode-string argument inspection. perl.path.file_slurp_read covers the safer File::Slurp call shape."

- id: perl.path.unlink
  enabled: true
  language: perl
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: unlink
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.path.unlink example
    code: |
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        unlink($input)
      }
  - name: literal unlink negative
    code: |
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        unlink("tmp/report.txt")
      }
    expect_no_match: true
  description: "unlink() - tainted path deletes arbitrary files (DoS, privilege escalation via replace-on-rename races)."

- id: perl.path.rename
  enabled: true
  language: perl
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: rename
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.path.rename source example
    code: |
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        rename($input, "tmp/output.txt")
      }
  - name: literal rename source negative
    code: |
