# Perl file-upload sinks (CGI / Mojolicious / Dancer).
# Matches client-controlled filename retrieval on uploaded files.
- id: perl.upload.cgi_upload_filename
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: perl
  tag: file-upload
  severity: medium
  packages: [CGI, Dancer2]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      name: upload
  match_examples:
  - name: perl.upload.cgi_upload_filename example
    code: |
      use CGI;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        upload($input)
      }
  description: "Disabled - upload('field') returns client-controlled filename/handle state; report the later file-write sink until return-state tracking exists."

- id: perl.upload.mojo_upload_filename
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: perl
  tag: file-upload
  severity: medium
  packages: [Mojolicious]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      name: filename
  match_examples:
  - name: perl.upload.mojo_upload_filename example
    code: |
      use Mojolicious;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        filename($input)
      }
  description: "Disabled - filename() returns client-controlled state; report the later file-write sink until return-state tracking exists."

- id: perl.upload.dancer2_upload
  enabled: false
  disabled_reason:
    code: over-broad
  language: perl
  tag: file-upload
  severity: medium
  packages: [Dancer2]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      name: upload
  description: "Disabled - same bare `upload` call shape as perl.upload.cgi_upload_filename; keep one placeholder until receiver/package facts distinguish CGI and Dancer2 upload APIs."
