# Perl template engines (Template Toolkit / Mason / Text::Template).
- id: perl.template.toolkit_process
  enabled: true
  language: perl
  tag: ssti
  severity: high
  packages: [Template]
  cwe: [CWE-1336]
  match:
    kind: call
    callee:
      name: process
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.template.toolkit_process example
    code: |
      use Template;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $tt->process($input)
      }
  - name: literal toolkit process negative
    code: |
      use Template;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $tt->process("pages/home.tt")
      }
    expect_no_match: true
  description: "Template Toolkit $tt->process — tainted template path or string-ref. Receiver allowlist filters unrelated `->process` methods (queue/job/event processors that share the verb name)."

- id: perl.template.text_template_fill_in
  enabled: true
  language: perl
  tag: ssti
  severity: critical
  packages: ["Text::Template"]
  cwe: [CWE-94, CWE-1336]
  match:
    kind: call
    callee:
      name: fill_in
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.template.text_template_fill_in example
    code: |
      use Text::Template;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        fill_in($input)
      }
  - name: literal text template fill in negative
    code: |
      use Text::Template;
      sub example {
        my ($input) = @_;
        fill_in("Hello [% name %]")
      }
    expect_no_match: true
  description: "Text::Template fill_in — evaluates embedded Perl."

