# Templating engine autoescape disabled (T302). Config-shape
# sinks: when the developer explicitly turns off the engine's
# default HTML autoescape, every subsequent render is XSS-prone.
- id: perl.template.template_toolkit_filter_off
  enabled: true
  language: perl
  tag: xss
  severity: high
  packages: [Template]
  cwe: [CWE-79]
  match:
    kind: call
    callee:
      attribute: [Template, new]
  match_examples:
  - name: perl.template.template_toolkit_filter_off example
    code: |
      use Template;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        Template->new({ FILTERS => {} })
      }
  description: "Template::Toolkit Template->new with FILTERS overriding default escape — autoescape off."
