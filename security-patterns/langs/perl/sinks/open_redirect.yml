# Perl open-redirect.
# Catalyst $c->res->redirect and Dancer2 redirect() both match the cgi_redirect
# rule's bare name - one rule covers them all.
- id: perl.open_redirect.cgi_redirect
  enabled: true
  language: perl
  tag: open-redirect
  severity: high
  packages: [CGI]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      name: redirect
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.open_redirect.cgi_redirect example
    code: |
      use CGI;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $cgi->redirect($url)
      }
  - name: literal cgi redirect negative
    code: |
      use CGI;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $cgi->redirect("/dashboard")
      }
    expect_no_match: true
  description: "CGI $q->redirect / Dancer2 redirect / Catalyst $c->res->redirect - tainted URL."

- id: perl.open_redirect.mojo_redirect_to
  enabled: true
  language: perl
  tag: open-redirect
  severity: high
  packages: [Mojolicious]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      name: redirect_to
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.open_redirect.mojo_redirect_to example
    code: |
      use Mojolicious;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        redirect_to($url)
      }
  - name: literal mojo redirect negative
    code: |
      use Mojolicious;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        redirect_to("/dashboard")
      }
    expect_no_match: true
  description: "Mojolicious $c->redirect_to(tainted)."
