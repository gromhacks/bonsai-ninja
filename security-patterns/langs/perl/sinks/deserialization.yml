# Perl insecure-deserialization.
- id: perl.deser.storable_retrieve
  enabled: true
  language: perl
  tag: insecure-deserialization
  severity: critical
  packages: [Storable]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: retrieve
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.deser.storable_retrieve example
    code: |
      use Storable;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        retrieve($input)
      }
  - name: literal storable retrieve negative
    code: |
      use Storable;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        retrieve("cache/session.storable")
      }
    expect_no_match: true
  description: "Storable::retrieve - deserialises blessed refs + CODE refs; crafted input = RCE. Use JSON for untrusted data."

