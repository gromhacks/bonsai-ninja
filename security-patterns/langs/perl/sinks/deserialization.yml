- id: perl.deser.yaml_load
  enabled: true
  language: perl
  tag: insecure-deserialization
  severity: critical
  packages: [YAML, "YAML::XS", "YAML::Syck", "JSON::Syck"]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: Load
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.deser.yaml_load example
    code: |
      use YAML;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        Load($input)
      }
  - name: perl.deser.json_syck_load example
    code: |
      use JSON::Syck;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        Load($input)
      }
    expect_match_text: [Load]
  - name: literal yaml load negative
    code: |
      use YAML;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        Load("---\nname: alice\n")
      }
    expect_no_match: true
  description: "YAML::Load / YAML::XS::Load / YAML::Syck::Load / JSON::Syck::Load - all share the Syck/loader gadget that historically processes `!perl/code` tags that eval Perl; RCE on untrusted input. JSON::Syck uses the same backend and exported `Load` name."

