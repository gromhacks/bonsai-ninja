# Perl XXE sinks.
# XML::LibXML default parser expands entities until $parser->expand_entities(0)
# is set; XML::Parser ditto with NoExpand/no_expand.
- id: perl.xxe.xml_libxml_parse_file
  enabled: true
  language: perl
  tag: xxe
  severity: high
  packages: ["XML::LibXML"]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      name: parse_file
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.xxe.xml_libxml_parse_file example
    code: |
      use XML::LibXML;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        parse_file($input)
      }
  - name: literal libxml parse file negative
    code: |
      use XML::LibXML;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        parse_file("config/trusted.xml")
      }
    expect_no_match: true
  description: "XML::LibXML $parser->parse_file - disable load_ext_dtd / expand_entities."

