# Perl code-injection sinks (eval / do).
#
# DOCUMENTED FRAGILE BARE-NAME RULE (kept on purpose):
#   perl.eval.builtin_eval — `eval` is a real Perl builtin (perlfunc).
#
# `eval EXPR` compiles+runs the string as Perl code. `eval { BLOCK }` is
# Perl's exception-catching form and is safe — it shares the keyword name
# but takes a block, not a string. There is no `use Foo;` to gate on; the
# bare-name match is the correct shape. The pack-audit "bare-name without
# packages" warning on perl.eval.builtin_eval is expected and intentional.
#
# False-positive control comes from:
#   - the taint graph (the string argument must be tainted to fire),
#   - max_args: 1 + top_level: true (block form passes a code ref, not a
#     scalar; this filters most safe-block usages),
#   - argument shape review when triaging.

- id: perl.eval.builtin_eval
  enabled: true
  language: perl
  tag: code-injection
  severity: critical
  category: code-exec
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: eval
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.eval.builtin_eval example
    code: |
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        eval($input)
      }
  - name: literal eval negative
    code: |
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        eval("1 + 1")
      }
    expect_no_match: true
  description: "eval EXPR — Perl builtin; compiles and runs the string argument as Perl. Tainted string = RCE. `eval { BLOCK }` form is safe but shares the keyword; taint-flow + max_args filters."

- id: perl.eval.do_file
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: perl
  tag: code-injection
  severity: critical
  category: code-exec
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: eval
  match_examples:
  - name: perl.eval.do_file example
    code: |
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        do $input
      }
  description: "Disabled duplicate — current Perl adapter surfaces this with the same call shape as perl.eval.builtin_eval; keep the canonical eval rule enabled until the adapter exposes `do EXPR` distinctly."

# Distinct ID for the scalar-form `eval $expr` shape. The canonical
# perl.eval.builtin_eval rule covers this too; this entry is kept so
# audits can address the scalar-eval miss case by ID and so packs
# that disable the canonical rule still surface scalar-form eval.
- id: perl.eval.scalar
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: perl
  tag: code-injection
  severity: critical
  category: code-exec
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: eval
  match_examples:
  - name: perl.eval.scalar example
    code: |
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        eval($payload)
      }
  description: "Disabled duplicate — current adapter emits eval($scalar) with the same call shape as perl.eval.builtin_eval; keep builtin_eval as the canonical Perl eval sink."
