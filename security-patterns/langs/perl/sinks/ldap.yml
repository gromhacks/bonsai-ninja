# Perl LDAP-injection (Net::LDAP).
# $ldap->search(filter => $tainted) matches as bare name call.
- id: perl.ldap.net_ldap_search
  enabled: true
  language: perl
  tag: ldap-injection
  severity: high
  packages: ["Net::LDAP"]
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      name: search
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: perl.ldap.net_ldap_search example
    code: |
      use Net::LDAP;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $ldap->search(filter => $input)
      }
  - name: literal ldap search negative
    code: |
      use Net::LDAP;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $ldap->search(filter => "(uid=alice)")
      }
    expect_no_match: true
  description: "Net::LDAP $ldap->search(filter => tainted)."

