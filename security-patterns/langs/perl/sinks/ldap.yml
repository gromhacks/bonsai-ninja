  cwe: [CWE-90]
  match:
    kind: call
    callee:
      name: add
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.ldap.net_ldap_add example
    code: |
      use Net::LDAP;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $ldap->add($input)
      }
  - name: literal ldap add negative
    code: |
      use Net::LDAP;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $ldap->add("uid=alice,ou=people,dc=example,dc=com")
      }
    expect_no_match: true
  description: "Net::LDAP $ldap->add(dn => tainted)."

