- id: perl.ssrf.net_http_new
  enabled: true
  language: perl
  tag: ssrf
  severity: high
  packages: ["Net::HTTP"]
  cwe: [CWE-918]
  match:
    kind: call
    callee:
      attribute: ["Net::HTTP", "new"]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: perl.ssrf.net_http_new example
    code: |
      use Net::HTTP;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        Net::HTTP->new(Host => $input)
      }
  - name: literal net http host negative
    code: |
      use Net::HTTP;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        Net::HTTP->new(Host => "example.com")
      }
    expect_no_match: true
  description: "Net::HTTP->new(Host => tainted) - raw HTTP client; tainted Host = SSRF to arbitrary internal host."

- id: perl.ssrf.lwp_simple_getstore
  enabled: true
  language: perl
  tag: ssrf
  severity: high
  packages: ["LWP::Simple"]
  cwe: [CWE-918]
  match:
    kind: call
    callee:
      name: getstore
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.ssrf.lwp_simple_getstore example
    code: |
      use LWP::Simple;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        getstore($input, "tmp/out.dat")
      }
  - name: literal lwp simple getstore negative
    code: |
      use LWP::Simple;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        getstore("https://example.com/file", "tmp/out.dat")
      }
    expect_no_match: true
  description: "LWP::Simple getstore(tainted_url, file) - fetches an attacker-controlled URL and writes the body to disk; combines SSRF with a file-write primitive. Exported bare-name function unique to LWP::Simple."

