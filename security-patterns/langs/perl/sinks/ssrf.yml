# Perl SSRF sinks (HTTP clients).
# Adapter note: $ua->get(...) matches as call with bare name = method;
# one rule covers LWP::UserAgent, HTTP::Tiny, Mojo::UserAgent (same verb names).
- id: perl.ssrf.useragent_get
  enabled: true
  language: perl
  tag: ssrf
  severity: high
  packages: ["LWP::UserAgent", "HTTP::Tiny", "Mojo::UserAgent", "LWP::Simple"]
  cwe: [CWE-918]
  match:
    kind: call
    callee:
      name: get
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.ssrf.useragent_get example
    code: |
      use LWP::UserAgent;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $ua->get($input)
      }
  - name: perl.ssrf.lwp_simple_get example
    code: |
      use LWP::Simple;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        get($input)
      }
    expect_match_text: [get]
  - name: literal useragent get negative
    code: |
      use LWP::UserAgent;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $ua->get("https://example.com/health")
      }
    expect_no_match: true
  description: "$ua->get(tainted_url) / LWP::Simple get(tainted_url) - LWP::UserAgent / HTTP::Tiny / Mojo::UserAgent / LWP::Simple share the verb name; tainted URL = SSRF to internal services / cloud metadata. Receiver allowlist filters generic `get` collisions on hash/object accessors that don't actually issue HTTP requests."

