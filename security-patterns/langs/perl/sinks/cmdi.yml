      index: 0
  match_examples:
  - name: perl.cmdi.exec example
    code: "sub example {\n  my ($input, $url, $id, $payload, $request) = @_;\n  exec($input)\n\
      }\n"
  - name: literal exec negative
    code: "sub example {\n  my ($input, $url, $id, $payload, $request) = @_;\n  exec(\"\
      echo safe\")\n}\n"
    expect_no_match: true
  description: "exec() - Perl builtin (perlfunc). Same shell semantics as system()\
