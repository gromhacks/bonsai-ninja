- id: perl.cmdi.system
  enabled: true
  language: perl
  tag: command-injection
  severity: critical
  category: process-exec
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      name: system
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.cmdi.system example
    code: "sub example {\n  my ($input, $url, $id, $payload, $request) = @_;\n  system($input)\n\
      }\n"
  - name: literal command negative
    code: "sub example {\n  my ($input, $url, $id, $payload, $request) = @_;\n  system(\"\
      echo safe\")\n}\n"
    expect_no_match: true
  description: "system() - Perl builtin. Single-string form invokes /bin/sh -c,\
    \ so any tainted substring is shell-metachar injection. List form is safer; taint-flow\
    \ + arg shape filters."
