- id: perl.cmdi.open_pipe
  aliases:
  - perl.path.open_concat
  enabled: false
  language: perl
  tag: command-injection
  severity: critical
  category: process-exec
  cwe:
  - CWE-78
  - CWE-22
  match:
    kind: call
    callee:
      name: open
  match_examples:
  - name: perl.cmdi.open_pipe example
    code: "sub example {\n  my ($input, $url, $id, $payload, $request) = @_;\n  open(\"\
      |whoami\")\n}\n"
  description: "open() with a leading or trailing `|` - Perl builtin pipe-open\
    \ form (`open(FH,\"|cmd\")` or `open(FH,\"cmd|\")`); spawns a shell. Tainted mode/filename\
    \ string = RCE. Pipe-shape regex narrows to actual pipe usage; bare-name is correct\
    \ because `open` is a Perl global. Also covers merged aliases: perl.path.open_concat."
  disabled_reason:
    code: over-broad
- id: perl.cmdi.ipc_open2
  enabled: true
  language: perl
  tag: command-injection
  severity: critical
  category: process-exec
  packages:
  - IPC::Open2
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      name: open2
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: perl.cmdi.ipc_open2 example
    code: "use IPC::Open2;\nsub example {\n  my ($input, $url, $id, $payload, $request)\
      \ = @_;\n  my ($read, $write);\n  open2($read, $write, $input)\n}\n"
  - name: literal ipc open2 negative
    code: "use IPC::Open2;\nsub example {\n  my ($input, $url, $id, $payload, $request)\
      \ = @_;\n  my ($read, $write);\n  open2($read, $write, \"echo safe\")\n}\n"
    expect_no_match: true
  description: "IPC::Open2 open2 - single-string form spawns a shell; tainted\
    \ command = RCE."
