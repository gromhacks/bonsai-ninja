# Perl SQL-injection sinks (DBI + DBIx::Class + Rose::DB).
# Adapter note: $dbh->method(...) matches as call with callee name = method.
# Bare-name rules are broad; rely on taint-flow + arg-shape review.
- id: perl.sqli.dbi_do
  enabled: false
  disabled_reason:
    code: over-broad
  language: perl
  tag: sql-injection
  severity: critical
  packages: [DBI]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: do
  description: "Disabled — bare `name: do` overmatches the Perl keyword `do EXPR` and other `->do` accessors; no canonical exists. Re-enable when adapter supports receiver-type narrowing for $dbh->do."

- id: perl.sqli.dbi_selectrow_array
  enabled: true
  language: perl
  tag: sql-injection
  severity: high
  packages: [DBI]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: selectrow_array
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.sqli.dbi_selectrow_array example
    code: |
      use DBI;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        selectrow_array($input)
      }
  - name: literal selectrow array negative
    code: |
      use DBI;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        selectrow_array("select 1")
      }
    expect_no_match: true
  description: "DBI $dbh->selectrow_array."

