# Interpolation-shape DBI prepare. This fires only when the prepare arg shows
# scalar interpolation (`$var`) or dot-concat, meaning SQL is assembled before
# binding.
- id: perl.sqli.dbi_prepare_interp
  enabled: true
  language: perl
  tag: sql-injection
  severity: critical
  packages: [DBI]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: prepare
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.sqli.dbi_prepare_interp example
    code: |
      use DBI;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $dbh->prepare($payload)
      }
  - name: literal dbi prepare negative
    code: |
      use DBI;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $dbh->prepare("select 1")
      }
    expect_no_match: true
  description: "$dbh->prepare(tainted_sql) - interpolated/concatenated SQL bypasses placeholder binding. The taint boundary is the SQL string argument; safe literal prepares are skipped by arg_tainted."
