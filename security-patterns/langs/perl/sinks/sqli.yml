- id: perl.sqli.dbi_selectall
  enabled: true
  language: perl
  tag: sql-injection
  severity: high
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: selectall_arrayref
      call_kind_in: [method]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.sqli.dbi_selectall example
    code: |
      sub example {
        my ($handle, $input) = @_;
        $handle->selectall_arrayref($input)
      }
  - name: literal selectall arrayref negative
    code: |
      sub example {
        my ($handle) = @_;
        $handle->selectall_arrayref("select 1")
      }
    expect_no_match: true
  - name: same-spelled bare function is not the DBI method
    code: |
      sub example {
        my ($input) = @_;
        selectall_arrayref($input)
      }
    expect_no_match: true
  description: "DBI method selectall_arrayref(sql) with a tainted SQL program. The compiler-proven method call kind excludes same-spelled application functions; receiver binding names have no semantic role."

