# Perl TLS misconfig.
- id: perl.tls.lwp_ssl_verify_none
  enabled: true
  language: perl
  tag: weak-tls
  category: source-independent
  severity: high
  packages: ["LWP::UserAgent"]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: ssl_opts
  constraints:
  - keyword_arg_equals: {name: SSL_verify_mode, value: "0"}
  match_examples:
  - name: LWP TLS peer verification disabled
    code: |
      use LWP::UserAgent;
      sub example {
        my $ua = LWP::UserAgent->new;
        $ua->ssl_opts(verify_hostname => 0, SSL_verify_mode => 0);
      }
  - name: LWP TLS peer verification required negative
    code: |
      use LWP::UserAgent;
      sub example {
        my $ua = LWP::UserAgent->new;
        $ua->ssl_opts(verify_hostname => 1, SSL_verify_mode => 1);
      }
    expect_no_match: true
  description: "LWP::UserAgent `$ua->ssl_opts(..., SSL_verify_mode => 0)` disables peer verification; the exact named scalar argument rejects verified configurations."

- id: perl.tls.mojo_useragent_insecure
  enabled: true
  language: perl
  tag: weak-tls
  category: source-independent
  severity: high
  packages: ["Mojo::UserAgent"]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: insecure
  constraints:
  - arg_equals: {index: 0, value: "1"}
  match_examples:
  - name: Mojo user agent insecure mode enabled
    code: |
      use Mojo::UserAgent;
      sub example {
        my $ua = Mojo::UserAgent->new;
        $ua->insecure(1);
      }
  - name: Mojo user agent insecure mode disabled negative
    code: |
      use Mojo::UserAgent;
      sub example {
        my $ua = Mojo::UserAgent->new;
        $ua->insecure(0);
      }
    expect_no_match: true
  description: "Mojo::UserAgent `$ua->insecure(1)` disables certificate verification; the exact scalar argument rejects secure mode."

- id: perl.tls.io_socket_ssl_verify_none
  enabled: true
  language: perl
  tag: weak-tls
  category: source-independent
  severity: high
  packages: ["IO::Socket::SSL"]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      attribute: ["IO::Socket::SSL", "new"]
  constraints:
  - keyword_arg_equals: {name: SSL_verify_mode, value: "0"}
  match_examples:
  - name: IO Socket SSL peer verification disabled
    code: |
      use IO::Socket::SSL;
      sub example {
        IO::Socket::SSL->new(PeerHost => 'service.example', SSL_verify_mode => 0);
      }
  - name: IO Socket SSL peer verification required negative
    code: |
      use IO::Socket::SSL;
      sub example {
        IO::Socket::SSL->new(PeerHost => 'service.example', SSL_verify_mode => 1);
      }
    expect_no_match: true
  description: "`IO::Socket::SSL->new(..., SSL_verify_mode => 0)` disables peer verification; the exact named scalar argument rejects verified configurations."

- id: perl.tls.http_tiny_verify_ssl_off
  enabled: true
  language: perl
  tag: weak-tls
  category: source-independent
  severity: high
  packages: ["HTTP::Tiny"]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      attribute: ["HTTP::Tiny", "new"]
  constraints:
  - keyword_arg_equals: {name: verify_SSL, value: "0"}
  match_examples:
  - name: HTTP Tiny peer verification disabled
    code: |
      use HTTP::Tiny;
      sub example {
        HTTP::Tiny->new(verify_SSL => 0);
      }
  - name: HTTP Tiny peer verification enabled negative
    code: |
      use HTTP::Tiny;
      sub example {
        HTTP::Tiny->new(verify_SSL => 1);
      }
    expect_no_match: true
  description: "`HTTP::Tiny->new(verify_SSL => 0)` disables peer verification; the exact named scalar argument rejects the secure setting."
