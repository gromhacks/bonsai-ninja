# Perl NoSQL injection (MongoDB / Redis).
# Adapter note: $coll->method matches as call with bare name = method.
- id: perl.nosql.mongodb_find
  enabled: true
  language: perl
  tag: nosql-injection
  severity: high
  packages: ["MongoDB"]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      name: find
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.nosql.mongodb_find example
    code: |
      use MongoDB;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $coll->find($input)
      }
  - name: literal mongodb find negative
    code: |
      use MongoDB;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $coll->find({ name => "alice" })
      }
    expect_no_match: true
  description: "MongoDB::Collection find with tainted filter. Receiver allowlist filters generic `find` collisions on hash/iterator/array-find calls that share the verb without being MongoDB ops."

