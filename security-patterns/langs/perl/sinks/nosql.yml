- id: perl.nosql.redis_eval
  enabled: true
  language: perl
  tag: nosql-injection
  severity: high
  packages: ["Redis"]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      name: evalsha
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: perl.nosql.redis_eval example
    code: |
      use Redis;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        evalsha($input)
      }
  - name: literal redis evalsha negative
    code: |
      use Redis;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        evalsha("0123456789abcdef0123456789abcdef01234567")
      }
    expect_no_match: true
  description: "Redis->evalsha — Lua script injection via SHA."

- id: perl.nosql.redis_eval_direct
