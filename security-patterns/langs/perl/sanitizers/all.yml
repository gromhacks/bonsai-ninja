# Perl sanitizers. CANONICAL tags only:
#   url-encode, html-encode, html-sanitize, shell-escape, sql-parameter,
#   constant-time, jwt-verify, path-sanitize, xxe-sanitizer, ldap-escape,
#   numeric-coerce, validation.
# Non-canonical tags are rejected by the pack audit.

# -- HTML ------------------------------------------------------------
- id: perl.sanitizer.html_entities_encode
  enabled: true
  language: perl
  tag: html-encode
  packages: ["HTML::Entities"]
  match:
    kind: call
    callee:
      name: encode_entities
  match_examples:
  - name: perl.sanitizer.html_entities_encode example
    code: |
      use HTML::Entities;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        encode_entities($input)
      }
    expect_match_text: ["encode_entities"]
  description: "HTML::Entities::encode_entities — HTML-encodes <, >, &, quotes; neutralises reflected XSS in text nodes."

- id: perl.sanitizer.cgi_escape_html
  enabled: true
  language: perl
  tag: html-encode
  packages: [CGI]
  match:
    kind: call
    callee:
