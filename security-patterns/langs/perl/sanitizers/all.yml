# -- Validation / schema --------------------------------------------
# JSON::PP::decode_json acts as a validation gate when paired with a
# schema check downstream — at minimum it forces the input to be valid
# JSON and types the resulting structure (string/number/bool/array/hash),
# blocking shell/SQL/eval string-shape injection through the bytestream.
- id: perl.sanitizer.json_pp_decode_json
  enabled: true
  language: perl
  tag: validation
  packages: ["JSON::PP", "JSON", "JSON::XS", "Cpanel::JSON::XS"]
  match:
    kind: call
    callee:
      name: decode_json
  match_examples:
  - name: perl.sanitizer.json_pp_decode_json example
    code: |
      use JSON::PP;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        decode_json($input)
      }
    expect_match_text: ["decode_json"]
  description: "decode_json (JSON / JSON::PP / JSON::XS / Cpanel::JSON::XS) — parses bytes into typed scalars/refs; rejects
    malformed input. Acts as a validation gate when callers schema-check the result."

