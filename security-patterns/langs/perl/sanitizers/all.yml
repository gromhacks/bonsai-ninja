# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) — taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: perl.passthrough.uri_unescape
  enabled: true
  language: perl
  tag: passthrough-decode
  match:
    kind: call
    callee:
      name: uri_unescape
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: perl.passthrough.uri_unescape example
    code: |
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        uri_unescape($input)
      }
    expect_match_text: ["uri_unescape"]
  description: "URI::Escape::uri_unescape($s) — preserves taint."

# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: perl.csrf.cgi_application_plugin_csrf
  enabled: true
  language: perl
  tag: csrf-protect
  match:
    kind: call
    callee:
      name: csrf_check
  match_examples:
  - name: perl.csrf.cgi_application_plugin_csrf example
    code: |
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        csrf_check($input)
      }
    expect_match_text: ["csrf_check"]
  description: "CGI::Application::Plugin::CSRF csrf_check — CSRF token verification."

# Cookie-secure sanitizers (T402). Cookie-set calls with
# httpOnly + secure flags are the SAFE shape; reviewer
# enumerates with `security sanitizers --tag cookie-secure`
# and audits routes that set cookies WITHOUT them.
- id: perl.cookie.cgi_cookie_httponly_secure
  enabled: true
  language: perl
  tag: cookie-secure
  match:
    kind: call
    callee:
      name: cookie
  constraints:
  - any_arg_matches_regex: |-
      HttpOnly|Secure
  match_examples:
  - name: perl.cookie.cgi_cookie_httponly_secure example
    code: |
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        cookie(-HttpOnly => 1)
      }
    expect_match_text: ["cookie"]
  - name: perl.cookie.cgi_cookie_httponly_secure example negative constraint boundary
    code: "sub example {\n  my ($input, $url, $id, $payload, $request) = @_;\n  cookie()\n}\n"
    expect_no_match: true
  description: "CGI::Cookie->new(... -httponly => 1, -secure => 1, ...)."
