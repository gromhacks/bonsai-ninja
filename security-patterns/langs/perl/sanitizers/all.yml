# -- Audit-derived validation / binding sanitizers -----------------------------
- id: perl.sanitizer.same_origin_path_regex
  enabled: true
  language: perl
  tag: same-origin-path
  match:
    kind: call
    callee:
      name: m
  constraints:
  - any_arg_matches_regex: "\\^/"
  match_examples:
  - name: perl.sanitizer.same_origin_path_regex example
    code: |
      sub example {
        my ($next) = @_;
        $next =~ m{^/};
      }
    expect_match_text: [m]
  - name: perl.sanitizer.same_origin_path_regex example negative constraint boundary
    code: "sub example {\n  m();\n}\n"
    expect_no_match: true
  description: "m{^/} — same-origin redirect/path guard for root-relative targets."

- id: perl.sanitizer.list_util_any_allowlist
  enabled: false
  language: perl
  tag: allowlist-validate
  packages: ["List::Util"]
  match:
    kind: call
    callee:
      name: any
  constraints:
  - any_arg_matches_regex: "(?i)allow(ed|list)|permitted|valid"
  match_examples:
  - name: perl.sanitizer.list_util_any_allowlist example
    code: |
      use List::Util;
      sub example {
        my ($role) = @_;
        List::Util::any { $_ eq $role } @ALLOWED_ROLES;
      }
    expect_match_text: [List::Util::any]
  - name: perl.sanitizer.list_util_any_allowlist example negative constraint boundary
    code: "sub example {\n  List::Util::any();\n}\n"
    expect_no_match: true
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    List::Util::any { $_ eq $value } @ALLOWED_* — explicit enum/set allowlist membership check."

  disabled_reason:
    code: over-broad
- id: perl.sanitizer.hash_exists_allowlist
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: perl
  tag: allowlist-validate
  match:
    kind: call
    callee:
      name: exists
  description: "Disabled — Perl `exists $allowed{$value}` is the desired hash allowlist shape, but the current adapter does
    not emit `exists` as a call/read fact."

- id: perl.sanitizer.regex_full_string_shape
  enabled: true
  language: perl
  tag: regex-validate
  match:
    kind: call
    callee:
      name: m
  constraints:
  - any_arg_matches_regex: "(\\\\A|\\^).*(\\\\z|\\$)"
  - arg_not_matches_regex:
      index: 0
      regex: "\\^\\("
  match_examples:
  - name: perl.sanitizer.regex_full_string_shape example
    code: |
      sub example {
        my ($slug) = @_;
        $slug =~ m/\A[a-z0-9_-]+\z/;
      }
    expect_match_text: [m]
  - name: perl.sanitizer.regex_full_string_shape example negative constraint boundary
    code: "sub example {\n  m();\n}\n"
    expect_no_match: true
  description: "Anchored m// validator — full-string shape check for UUIDs, slugs, emails, and similar bounded formats."

- id: perl.sanitizer.dbi_execute_bound_values
  enabled: true
