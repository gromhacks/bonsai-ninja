# -- SQL -------------------------------------------------------------
# DBI prepare with `?` placeholders is the canonical SQL-parameter
# sanitizer in Perl: $sth = $dbh->prepare("SELECT ... WHERE id = ?");
# $sth->execute($id). Match the prepare site only when the SQL string
# contains a `?` placeholder so concat-prepare bugs aren't masked.
- id: perl.sanitizer.dbi_prepare_placeholder
  enabled: true
  language: perl
  tag: sql-parameter
  packages: [DBI]
  match:
    kind: call
    callee:
      name: prepare
  constraints:
  - any_arg_matches_regex: "\\?"
  match_examples:
  - name: perl.sanitizer.dbi_prepare_placeholder example
    code: |
      use DBI;
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        prepare("SELECT * FROM users WHERE id = ?")
      }
    expect_match_text: ["prepare"]
  - name: perl.sanitizer.dbi_prepare_placeholder example negative constraint boundary
    code: "use DBI;\nsub example {\n  my ($input, $url, $id, $payload, $request) = @_;\n  prepare()\n}\n"
    expect_no_match: true
  description: "DBI $dbh->prepare with `?` placeholder — placeholders bind values out-of-band so any tainted bind value cannot
    escape its slot. Only fires when the SQL literal contains a `?`, so raw concat into prepare still falls through to the
    SQLi sink."

- id: perl.sanitizer.dbi_execute
  enabled: false
  disabled_reason:
    code: over-broad
  language: perl
  tag: sql-parameter
  packages: [DBI]
  match:
    kind: call
    callee:
      name: execute
  description: "Disabled — bare `execute` overmatches unrelated method calls; sanitization fact already attached at the prepare(?)
    site above."

- id: perl.sanitizer.dbi_quote
  enabled: false
  disabled_reason:
    code: over-broad
  language: perl
  tag: sql-parameter
  packages: [DBI]
  match:
    kind: call
    callee:
      name: quote
  description: "Disabled — bare `quote` overmatches and DBI quote is only an escape helper; prefer prepare(?) placeholders."

# -- Path ------------------------------------------------------------
# Heuristic untaint: `if ($input =~ m/^([\w-]+)$/) { $clean = $1 }`. The
# capture-into-$1 idiom is how Perl taint mode launders strings. We
# match the regex-match call shape; the taint engine treats the captured
# value as untainted on the success path.
- id: perl.sanitizer.taint_untaint_regex_capture
  enabled: true
  language: perl
  tag: validation
  match:
    kind: call
    callee:
      name: m
  constraints:
  - any_arg_matches_regex: "\\^\\([^)]+\\)\\$"
  match_examples:
  - name: perl.sanitizer.taint_untaint_regex_capture example
    code: |
      sub example {
        my ($input, $url, $id, $payload, $request) = @_;
        $input =~ m/^(safe)$/;
      }
    expect_match_text: ["m"]
  - name: perl.sanitizer.taint_untaint_regex_capture example negative constraint boundary
    code: "sub example {\n  m();\n}\n"
    expect_no_match: true
  description: "Taint-mode untaint via anchored regex capture (m/^([...])$/ then $1) — the canonical Perl idiom for laundering
    tainted strings under -T. Heuristic: matches anchored single-capture patterns. Only sanitises when the captured group
    is what flows on."

- id: perl.sanitizer.file_spec_canonpath
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: perl
  tag: path-sanitize
  packages: ["File::Spec"]
  match:
    kind: call
    callee:
      name: canonpath
  description: "Disabled — File::Spec->canonpath collapses redundant separators/.. segments but still needs a trusted-root
    prefix check."

- id: perl.sanitizer.cwd_abs_path
