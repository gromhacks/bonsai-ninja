# External Perl factory return types. Provider and API identities remain in
# rule data; shared matching consumes only generic local-to-type aliases.
- id: perl.typing.cwd_abs_path_passthrough
  enabled: true
  language: perl
  packages: [Cwd]
  imports: [Cwd]
  match:
    kind: call
    callee:
      attribute: [Cwd, abs_path]
      binding_origin: imported
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: imported Cwd abs_path preserves path provenance
    code: |
      use Cwd qw(abs_path);
      my $canonical = abs_path($input);
    expect_match_text: [abs_path]
  - name: local abs_path helper shadows the imported function
    code: |
      use Cwd qw(abs_path);
      sub abs_path { return '/srv/assets'; }
      my $canonical = abs_path($input);
    expect_no_match: true
  description: "Cwd::abs_path canonicalizes its input path but preserves its provenance. The exact imported call site is matcher-compiled before generic argument-to-result transfer."

- id: perl.typing.file_spec_catfile_passthrough
  enabled: true
  language: perl
  packages: [File::Spec]
  imports: [File::Spec]
  match:
    kind: call
    callee:
      attribute: [File::Spec, catfile]
      binding_origin: imported
  taint_semantics:
    call_result_passthrough_args_from: 0
  match_examples:
  - name: File Spec joins every actual path component
    code: |
      use File::Spec;
      my $path = File::Spec->catfile($root, $directory, $name);
    expect_match_text: [File::Spec->catfile]
  - name: unrelated package method is not File Spec
    code: |
      package LocalSpec;
      sub catfile { return '/srv/assets/file'; }
      package main;
      my $path = LocalSpec->catfile($root, $name);
    expect_no_match: true
  description: "File::Spec->catfile derives its result from every compiler-observed path component. The variadic transfer expands to actual call arity and has no argument cap."

- id: perl.typing.dbi_connect
  enabled: true
  language: perl
  packages: [DBI]
  imports: [DBI]
  returns_type: "DBI::db"
  match:
    kind: call
    callee:
      attribute: [DBI, connect]
      binding_origin: imported
  match_examples:
  - name: DBI connection factory
    code: |
      use DBI;
      my $dbh = DBI->connect('dbi:SQLite:dbname=app.db');
    expect_match_text: [DBI->connect]
  - name: local connect function is not a DBI factory
    code: |
      use DBI;
      package DBI;
      sub connect { return bless {}, __PACKAGE__ }
      package main;
      my $dbh = DBI->connect('local');
    expect_no_match: true
  description: "DBI->connect returns a DBI::db handle. Typing-only; never a finding."

- id: perl.typing.dbi_prepare
  enabled: true
  language: perl
  packages: [DBI]
  imports: [DBI]
  returns_type: "DBI::st"
  match:
    kind: call
    callee:
      attribute: ["DBI::db", prepare]
  match_examples:
  - name: DBI statement factory
    code: |
      use DBI;
      my $dbh = DBI->connect('dbi:SQLite:dbname=app.db');
      my $sth = $dbh->prepare('select name from users');
    expect_match_text: [dbh->prepare]
  - name: unrelated prepare method is not a DBI statement factory
    code: |
      use DBI;
      package LocalBuilder;
      sub prepare { return LocalStatement->new() }
      package main;
      my $builder = LocalBuilder->new();
      my $sth = $builder->prepare('local');
    expect_no_match: true
  description: "DBI::db prepare returns a DBI::st statement handle. Typing-only; never a finding."

