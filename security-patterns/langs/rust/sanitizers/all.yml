      fn example() {
          let target = "tainted";
          let query = "user";
          RwLock::read(target);
      }
    expect_match_text: ["RwLock::read"]
  description: "std::sync::RwLock::read() - read-side guard."
- id: rust.lock.rwlock_write
  enabled: true
  language: rust
  tag: lock-acquire
  match:
    kind: call
    callee:
      attribute: [RwLock, write]
  match_examples:
  - name: generated direct match
    code: |
      fn example() {
          let target = "tainted";
