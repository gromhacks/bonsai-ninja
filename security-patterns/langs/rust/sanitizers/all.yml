# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) - taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: rust.passthrough.percent_decode_str
  enabled: true
  language: rust
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [percent_encoding, percent_decode_str]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: generated direct match
    code: |
      fn example() {
          let target = "tainted";
          let query = "user";
          percent_encoding::percent_decode_str(target);
      }
    expect_match_text: ["percent_encoding::percent_decode_str"]
  description: "percent_encoding::percent_decode_str(s) - preserves taint."
- id: rust.passthrough.urlencoding_decode
  enabled: true
  language: rust
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [urlencoding, decode]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: generated direct match
    code: |
      fn example() {
          let target = "tainted";
          let query = "user";
          urlencoding::decode(target);
      }
    expect_match_text: ["urlencoding::decode"]
  description: "urlencoding::decode(s) - preserves taint."

# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: rust.csrf.tower_csrf
  enabled: true
  language: rust
  tag: csrf-protect
  match:
    kind: call
    callee:
      regex: "^CsrfLayer::new$"
  match_examples:
  - name: generated direct match
    code: |
      fn example() {
          let target = "tainted";
          let query = "user";
          CsrfLayer::new(target);
      }
    expect_match_text: ["CsrfLayer::new"]
  description: "tower-csrf CsrfLayer::new - middleware-layer CSRF enforcement for axum/tower."

