# Rust sanitizers. Tags use the canonical taxonomy shared across langs
# (html-encode, html-sanitize, url-encode, path-sanitize, constant-time,
# numeric-coerce, ldap-escape, auth-sanitizer, jwt-verify).
- id: rust.sanitizer.percent_encoding_utf8
  enabled: true
  language: rust
  tag: url-encode
  packages: [percent_encoding]
  match:
    kind: call
    callee:
      attribute: [utf8_percent_encode]
  match_examples:
  - name: generated direct match
    code: |
      use percent_encoding;
      use percent_encoding;
      use percent_encoding::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          utf8_percent_encode(target);
      }
    expect_match_text: [utf8_percent_encode]
  description: "percent_encoding::utf8_percent_encode - URL-encodes tainted input before embedding in URLs / query strings."
  imports:
  - percent_encoding
