- id: rust.sanitizer.str_starts_with_same_origin
  enabled: true
  language: rust
  tag: same-origin-path
  packages: [std]
  match:
    kind: call
    callee:
      regex: "(^|\\.)starts_with$"
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^"/[^"]*"$'
  match_examples:
  - name: starts_with local path
    code: |
      use std::process::Command;
      fn example(target: &str) {
          target.starts_with("/app/");
      }
    expect_match_text: [target.starts_with]
  - name: starts_with local path negative constraint boundary
    code: "use std::process::Command;\nfn example(target: &str) {\n    target.starts_with();\n}\n"
    expect_no_match: true
  description: "str::starts_with(\"/...\") - same-origin redirect/path guard for slash-rooted local paths."

