      fn example() {
          let target = "tainted";
          let query = "user";
          Mutex::lock(target);
      }
    expect_match_text: ["Mutex::lock"]
  description: "std::sync::Mutex::lock() - RAII guard; the returned MutexGuard releases at drop."
- id: rust.lock.rwlock_read
  enabled: true
  language: rust
  tag: lock-acquire
  match:
    kind: call
    callee:
      attribute: [RwLock, read]
  match_examples:
