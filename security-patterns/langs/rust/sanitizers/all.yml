    expect_match_text: ["RwLock::write"]
  description: "std::sync::RwLock::write() - write-side guard."

# Cookie-secure sanitizers (T402). Cookie-set calls with
# httpOnly + secure flags are the SAFE shape; reviewer
# enumerates with `security sanitizers --tag cookie-secure`
# and audits routes that set cookies WITHOUT them.
- id: rust.cookie.cookie_builder_http_only_secure
  enabled: true
  language: rust
  tag: cookie-secure
  match:
    kind: call
    callee:
      attribute: [CookieBuilder, http_only]
  constraints:
  - any_arg_matches_regex: |-
      true
  match_examples:
  - name: generated direct match
    code: |
      fn example() {
          let target = "tainted";
          let query = "user";
          CookieBuilder::http_only(true);
      }
    expect_match_text: ["CookieBuilder::http_only"]
  - name: generated direct match negative constraint boundary
    code: "fn example() {\n    let target = \"tainted\";\n    let query = \"user\";\n    CookieBuilder::http_only();\n}\n"
    expect_no_match: true
  description: "cookie crate Cookie::build(...).http_only(true).secure(true)."

# Rate-limit middleware presence sanitizers (round 2 fill).
- id: rust.ratelimit.tower_governor_layer
  enabled: true
  language: rust
  tag: rate-limit
  packages: [tower_governor]
  match:
    kind: call
    callee:
      regex: "^GovernorLayer::new$"
  match_examples:
  - name: generated direct match
    code: |
      use tower_governor::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          GovernorLayer::new(target);
      }
    expect_match_text: ["GovernorLayer::new"]
  description: 'tower-governor GovernorLayer - rate-limit middleware for axum/tower stacks.'

# Ownership-transfer passthroughs. These stdlib calls return a raw
# pointer (or reconstruct an owner) that ALIASES the value passed in,
# so taint must propagate through them — `Box::into_raw(b)` hands back
# a pointer to `b`'s contents, `Box::from_raw(p)` reconstitutes the
# box from `p`. Modeling them as identity edges lets a tainted owner
# reach a downstream unsafe `ptr::read`/`ptr::write` on the leaked
# pointer (the canonical raw-pointer aliasing UAF shape). Tagged
# `passthrough-transform` (canonical passthrough family); the engine
# acts on `call_result_passthrough_args`.
- id: rust.passthrough.box_into_raw
  enabled: true
  language: rust
  tag: passthrough-transform
  packages: [std, alloc]
  match:
    kind: call
    callee:
      attribute: [Box, into_raw]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: generated direct match
    code: |
      use std::boxed::Box;
      fn example() {
          let b = Box::new(0u8);
          Box::into_raw(b);
      }
    expect_match_text: ["Box::into_raw"]
  description: "Box::into_raw(b) - leaks the box to a raw pointer aliasing its contents; taint flows through."
- id: rust.passthrough.box_from_raw
  enabled: true
  language: rust
  tag: passthrough-transform
  packages: [std, alloc]
  match:
    kind: call
    callee:
      attribute: [Box, from_raw]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: generated direct match
    code: |
      use std::boxed::Box;
      fn example(p: *mut u8) {
          let _b = unsafe { Box::from_raw(p) };
      }
    expect_match_text: ["Box::from_raw"]
  description: "Box::from_raw(p) - reconstitutes a box from a raw pointer; taint flows through."
- id: rust.passthrough.cstring_into_raw
  enabled: true
  language: rust
  tag: passthrough-transform
  packages: [std, alloc]
  match:
    kind: call
    callee:
      attribute: [CString, into_raw]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: generated direct match
    code: |
      use std::ffi::CString;
      fn example(s: CString) {
          CString::into_raw(s);
      }
    expect_match_text: ["CString::into_raw"]
  description: "CString::into_raw(s) - leaks the C string to a raw pointer aliasing its buffer; taint flows through."
