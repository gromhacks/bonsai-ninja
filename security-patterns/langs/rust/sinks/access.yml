- id: rust.access.aws_get_object
  enabled: true
  language: rust
  tag: access-control
  severity: high
  packages: [aws_sdk_s3]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      regex: "\\.get_object$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      use aws_sdk_s3;
      use aws_sdk_s3;
      use aws_sdk_s3::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          obj.get_object(target);
      }
  - name: literal aws get object negative
    code: |
      use aws_sdk_s3;
      fn example() {
          obj.get_object("reports/fixed.csv");
      }
    expect_no_match: true
  description: "aws-sdk-s3 get_object - tainted bucket/key selector reads arbitrary object data."

  imports:
  - aws_sdk_s3
