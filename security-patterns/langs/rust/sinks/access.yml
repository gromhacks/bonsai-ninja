- id: rust.access.aws_get_object
  enabled: true
  language: rust
  tag: access-control
  severity: high
  packages: [aws_sdk_s3]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      regex: "\\.get_object$"
  match_examples:
  - name: generated direct match
    code: |
      use aws_sdk_s3;
      use aws_sdk_s3;
      use aws_sdk_s3::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          obj.get_object(target);
      }
  description: "aws-sdk-s3 get_object — tainted bucket/key selector reads arbitrary object data."

  imports:
  - aws_sdk_s3
