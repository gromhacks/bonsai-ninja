- id: rust.ssrf.reqwest_get
  enabled: true
  language: rust
  tag: ssrf
  severity: high
  packages: [reqwest]
  cwe: [CWE-918]
  match:
    kind: call
    callee:
      attribute: [reqwest, get]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted reqwest get url
    code: |
      use reqwest::dummy;
      fn example(target: &str) {
          reqwest::get(target);
      }
  - name: literal reqwest get url negative
    code: |
      use reqwest::dummy;
      fn example() {
          reqwest::get("https://example.com/status");
      }
    expect_no_match: true
  description: "reqwest::get(url) - top-level fetch; tainted URL reaches internal network or attacker-chosen host."
