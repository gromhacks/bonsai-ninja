- id: rust.tls.rustls_dangerous_set_certificate_verifier
  enabled: true
  language: rust
  tag: weak-tls
  category: source-independent
  severity: critical
  packages: [rustls]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      attribute: [ClientConfig, dangerous]
  match_examples:
  - name: generated direct match
    code: |
      use rustls::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          ClientConfig::dangerous(target);
      }
  description: "rustls ClientConfig::dangerous() - sets a no-op certificate verifier (NoCertVerification pattern); completely disables the TLS trust anchor check."

- id: rust.tls.rustls_dangerous_config_set_verifier
  enabled: true
  language: rust
  tag: weak-tls
  category: source-independent
  severity: critical
  packages: [rustls]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      attribute: [DangerousClientConfig, set_certificate_verifier]
  match_examples:
  - name: rustls dangerous verifier setter
    code: |
      use rustls::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          DangerousClientConfig::set_certificate_verifier(target);
      }
    expect_match_text: [DangerousClientConfig::set_certificate_verifier]
  description: "rustls DangerousClientConfig::set_certificate_verifier - custom verifier hook commonly used for no-op certificate validation."

