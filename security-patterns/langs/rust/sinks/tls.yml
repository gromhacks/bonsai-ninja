- id: rust.tls.openssl_verify_none
  enabled: true
  language: rust
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [openssl]
  imports: ["openssl::ssl"]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: set_verify
  constraints:
  - receiver_type_in: [SslConnectorBuilder, "openssl::ssl::SslConnectorBuilder"]
  - arg_matches_regex:
      index: 0
      regex: '^(SslVerifyMode::|openssl::ssl::SslVerifyMode::)?NONE$'
  match_examples:
  - name: OpenSSL Rust peer verification disabled
    code: |
      use openssl::ssl::{SslConnectorBuilder, SslVerifyMode};
      fn configure(builder: &mut SslConnectorBuilder) { builder.set_verify(SslVerifyMode::NONE); }
    expect_match_text: [builder.set_verify]
  - name: OpenSSL Rust peer verification enabled negative
    code: |
      use openssl::ssl::{SslConnectorBuilder, SslVerifyMode};
      fn configure(builder: &mut SslConnectorBuilder) { builder.set_verify(SslVerifyMode::PEER); }
    expect_no_match: true
  - name: unrelated Rust set verify receiver negative
    code: |
      use openssl::ssl::SslConnectorBuilder as OpenSslBuilder;
      struct SslConnectorBuilder;
      impl SslConnectorBuilder { fn set_verify(&mut self, _: Mode) {} }
      enum Mode { NONE }
      fn configure(builder: &mut SslConnectorBuilder) { builder.set_verify(Mode::NONE); }
    expect_no_match: true
  description: "openssl SslConnectorBuilder::set_verify - flag when argument is SslVerifyMode::NONE (disables peer cert verification)."

