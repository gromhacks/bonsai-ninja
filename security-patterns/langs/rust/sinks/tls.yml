  cwe: [CWE-295]
  match:
    kind: call
    callee:
      attribute: [TlsConnectorBuilder, danger_accept_invalid_certs]
  match_examples:
  - name: generated direct match
    code: |
      use native_tls;
      use native_tls;
      use native_tls::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          TlsConnectorBuilder::danger_accept_invalid_certs(target);
      }
  description: "native-tls TlsConnectorBuilder::danger_accept_invalid_certs(true) - disables certificate chain validation, enabling MITM."
