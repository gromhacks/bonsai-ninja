# Rust TLS misconfiguration - disabling cert / hostname verification
# exposes the client to MITM.
- id: rust.tls.danger_accept_invalid_certs
  enabled: true
  language: rust
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [reqwest]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      attribute: [ClientBuilder, danger_accept_invalid_certs]
  match_examples:
  - name: generated direct match
    code: |
      use reqwest::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          ClientBuilder::danger_accept_invalid_certs(target);
      }
  description: "reqwest ClientBuilder::danger_accept_invalid_certs(true) - disables the TLS certificate chain check, enabling MITM with any self-signed cert."

