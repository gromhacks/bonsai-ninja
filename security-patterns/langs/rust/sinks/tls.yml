# Rust TLS misconfiguration - disabling cert / hostname verification
# exposes the client to MITM.
- id: rust.tls.danger_accept_invalid_certs
  enabled: true
  language: rust
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [reqwest]
  imports: [reqwest]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: danger_accept_invalid_certs
  constraints:
  - receiver_type_in: [ClientBuilder, "reqwest::ClientBuilder"]
  - arg_equals: {index: 0, value: "true"}
  match_examples:
  - name: reqwest invalid certificates explicitly accepted
    code: |
      use reqwest::ClientBuilder;
      fn configure(builder: ClientBuilder) { let _ = builder.danger_accept_invalid_certs(true); }
    expect_match_text: [builder.danger_accept_invalid_certs]
  - name: reqwest certificate validation retained negative
    code: |
      use reqwest::ClientBuilder;
      fn configure(builder: ClientBuilder) { let _ = builder.danger_accept_invalid_certs(false); }
    expect_no_match: true
  - name: unrelated Rust builder collision negative
    code: |
      use reqwest::ClientBuilder as ReqwestClientBuilder;
      struct ClientBuilder;
      impl ClientBuilder { fn danger_accept_invalid_certs(self, _: bool) -> Self { self } }
      fn configure(builder: ClientBuilder) { let _ = builder.danger_accept_invalid_certs(true); }
    expect_no_match: true
  description: "reqwest ClientBuilder::danger_accept_invalid_certs(true) - disables the TLS certificate chain check, enabling MITM with any self-signed cert."

