- id: rust.sqli.sqlx_query
  enabled: true
  language: rust
  tag: sql-injection
  severity: high
  packages: [sqlx]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      attribute: [sqlx, query]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted sqlx query string
    code: |
      use sqlx::dummy;
      fn example(target: &str) {
          sqlx::query(target);
      }
  - name: literal sqlx query string negative
    code: |
      use sqlx::dummy;
      fn example() {
          sqlx::query("select * from users where id = $1");
      }
    expect_no_match: true
  description: "sqlx::query — function form accepts a runtime string; tainted SQL bypasses the `query!` macro's compile-time check."
