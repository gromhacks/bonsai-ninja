- id: rust.sqli.sea_orm_statement_from_sql_and_values
  enabled: true
  language: rust
  tag: sql-injection
  severity: medium
  packages: [sea_orm]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      attribute: [Statement, from_sql_and_values]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted sea-orm sql string
    code: |
      use sea_orm;
      fn example(db: DbBackend) {
          let target = "tainted";
          Statement::from_sql_and_values(db, target, vec![]);
      }
  - name: literal sea-orm sql string negative
    code: |
      use sea_orm;
      fn example(db: DbBackend, value: Value) {
          Statement::from_sql_and_values(db, "SELECT * FROM users WHERE id = ?", vec![value]);
      }
    expect_no_match: true
  description: "Statement::from_sql_and_values(db, tainted_sql, values) — bindings are safe, but a tainted SQL string at construction time is still raw dynamic SQL."
