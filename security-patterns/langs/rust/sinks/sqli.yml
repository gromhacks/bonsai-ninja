- id: rust.sqli.tokio_postgres_query
  enabled: true
  language: rust
  tag: sql-injection
  severity: high
  packages: [tokio_postgres, postgres]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      attribute: [Client, query]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted tokio postgres query string
    code: |
      use tokio_postgres;
      use tokio_postgres;
      use tokio_postgres::dummy;
      fn example(target: &str) {
          Client::query(target, &[]);
      }
  - name: literal tokio postgres query string negative
    code: |
      use tokio_postgres;
      use tokio_postgres;
      use tokio_postgres::dummy;
      fn example() {
          Client::query("select * from users where id = $1", &[]);
      }
    expect_no_match: true
  description: "tokio-postgres / postgres Client::query — accepts runtime SQL string; flag when the SQL itself is built from tainted input (parameterised `$1, $2` values are safe). Typed-receiver sqli (PATTERN_GUIDE-exempt from SQL-keyword arg shape); `min_args: 1` rejects 0-arg decoys."
  imports:
  - tokio_postgres
