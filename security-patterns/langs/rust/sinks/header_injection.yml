- id: rust.header.axum_headers_insert
  enabled: true
  language: rust
  tag: header-injection
  severity: high
  packages:
  - axum
  - http
  cwe:
  - CWE-113
  - CWE-444
  match:
    kind: call
    callee:
      attribute:
      - HeaderMap
      - insert
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted header insert value
    code: |
      use axum::dummy;
      fn example(target: &str) {
          HeaderMap::insert("X-Trace", target);
      }
  - name: literal header insert value negative
    code: |
      use axum::dummy;
      fn example() {
          HeaderMap::insert("X-Trace", "safe");
      }
    expect_no_match: true
  description: "http HeaderMap::insert(name, tainted) - used by axum / hyper response builders; tainted value = CRLF header-injection. Merged collision aliases: rust.smuggle.headers_insert_dual."
  aliases:
  - rust.smuggle.headers_insert_dual
