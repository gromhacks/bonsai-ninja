- id: rust.header.actix_response_header
  enabled: true
  language: rust
  tag: header-injection
  severity: high
  packages:
  - actix_web
  cwe:
  - CWE-113
  match:
    kind: call
    callee:
      attribute:
      - HttpResponseBuilder
      - insert_header
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      use actix_web;
      use actix_web;
      use actix_web::dummy;
      fn example(target: &str) {
          let query = "user";
          HttpResponseBuilder::insert_header(target);
      }
  - name: literal arg 0 negative
    code: |
      fn example() {
          HttpResponseBuilder::insert_header("safe");
      }
    expect_no_match: true
  description: "actix-web HttpResponseBuilder::insert_header((name, tainted)) - tainted header value = CRLF-injection / response-splitting (newlines inject new headers / body)."
  imports:
  - actix_web
