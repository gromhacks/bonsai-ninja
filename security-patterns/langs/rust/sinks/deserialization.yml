# Rust deserialization sinks.
- id: rust.deser.serde_yaml_from_str
  enabled: true
  language: rust
  tag: insecure-deserialization
  severity: medium
  packages: [serde_yaml]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [serde_yaml, from_str]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted yaml string
    code: |
      use serde_yaml::dummy;
      fn example(target: &str) {
          serde_yaml::from_str(target);
      }
  - name: literal yaml string negative
    code: |
      use serde_yaml::dummy;
      fn example() {
          serde_yaml::from_str("name: safe");
      }
    expect_no_match: true
  description: "serde_yaml::from_str - YAML supports tagged types (`!!tag:yaml.org,2002:...`) and billion-laughs-style alias expansion; DoS risk even with typed deserialize."

- id: rust.deser.serde_yaml_from_slice
  enabled: true
  language: rust
  tag: insecure-deserialization
  severity: medium
  packages: [serde_yaml]
  cwe: [CWE-502]
  match:
