  description: "serde_yaml::from_slice - same YAML alias / tag exposure as from_str."

- id: rust.deser.serde_yaml_from_reader
  enabled: true
  language: rust
  tag: insecure-deserialization
  severity: medium
  packages: [serde_yaml]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [serde_yaml, from_reader]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted yaml reader
    code: |
      use serde_yaml::dummy;
      fn example(target: std::io::Cursor<Vec<u8>>) {
          serde_yaml::from_reader(target);
      }
  - name: safe yaml reader negative
    code: |
      use serde_yaml::dummy;
      fn example() {
          serde_yaml::from_reader(std::io::Cursor::new(b"name: safe".to_vec()));
      }
    expect_no_match: true
  description: "serde_yaml::from_reader - same YAML alias / tag exposure; additionally allows unbounded input via Reader."

- id: rust.deser.bincode_deserialize
  enabled: true
  language: rust
  tag: insecure-deserialization
  severity: high
  packages: [bincode]
  cwe: [CWE-400, CWE-502]
  match:
    kind: call
    callee:
      attribute: [bincode, deserialize]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: untrusted bytes decoded without an allocation limit
    code: |
      use bincode;
      fn decode(input: &[u8]) {
        let _ = bincode::deserialize::<Vec<String>>(input);
      }
  - name: static bytes do not create a taint sink
    code: |
      use bincode;
      fn decode() {
        let _ = bincode::deserialize::<Vec<String>>(b"safe");
      }
    expect_no_match: true
  description: "bincode::deserialize on attacker-controlled bytes can allocate from serialized length prefixes without a configured size limit; the exact fully-qualified call and tainted payload constraint keep typed decoding of trusted bytes quiet."
