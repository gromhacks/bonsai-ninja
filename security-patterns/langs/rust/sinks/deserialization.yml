  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted yaml slice
    code: |
      use serde_yaml::dummy;
      fn example(target: &[u8]) {
          serde_yaml::from_slice(target);
      }
  - name: literal yaml slice negative
    code: |
      use serde_yaml::dummy;
      fn example() {
