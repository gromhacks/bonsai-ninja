- id: rust.path.fs_read_to_string
  enabled: true
  language: rust
  tag: path-traversal
  severity: high
  packages: [std, tokio]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      attribute: [fs, read_to_string]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted read_to_string path
    code: |
      use std::process::Command;
      fn example(target: &str) {
          fs::read_to_string(target);
      }
  - name: literal read_to_string path negative
    code: |
      use std::process::Command;
      fn example() {
          fs::read_to_string("/var/app/config.txt");
      }
    expect_no_match: true
  description: "std::fs::read_to_string (and tokio::fs::read_to_string via suffix) - tainted path reads arbitrary files."
