# Rust LDAP-injection (ldap3).
- id: rust.ldap.ldap3_search
  enabled: true
  language: rust
  tag: ldap-injection
  severity: high
  packages: [ldap3]
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      attribute: [LdapConn, search]
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: tainted ldap search filter
    code: |
      use ldap3::dummy;
      fn example(target: &str) {
          LdapConn::search("ou=people,dc=example,dc=com", Scope::Subtree, target, vec!["cn"]);
      }
  - name: literal ldap search filter negative
    code: |
      use ldap3::dummy;
      fn example() {
          LdapConn::search("ou=people,dc=example,dc=com", Scope::Subtree, "(uid=safe)", vec!["cn"]);
      }
    expect_no_match: true
  description: "ldap3 LdapConn::search - flag tainted filter."

