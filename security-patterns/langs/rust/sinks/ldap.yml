- id: rust.ldap.ldap3_modify
  enabled: true
  language: rust
  tag: ldap-injection
  severity: high
  packages: [ldap3]
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      attribute: [LdapConn, modify]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      use ldap3::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          LdapConn::modify("(uid=user)");
      }
  - name: literal arg 0 negative
    code: |
      fn example() {
          LdapConn::modify("safe");
      }
    expect_no_match: true
  description: "ldap3 LdapConn::modify - tainted DN / attribute values enable directory tampering."

