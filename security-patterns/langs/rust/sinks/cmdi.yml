- id: rust.cmdi.std_command_new
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: rust
  tag: command-injection
  severity: critical
  category: process-exec
  packages:
  - std
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      regex: ^Command::new$
  description: "Disabled - bare Command::new with no arg constraint fires on every process spawn. The real RCE sinks are rust.cmdi.std_command_new_shell and rust.cmdi.std_command_new_bash (argv-form without a shell wrapper is safe)."
- id: rust.cmdi.std_command_new_shell
  enabled: true
  language: rust
  tag: command-injection
  severity: critical
  packages:
  - std
  - tokio
  - async_process
  - async_std
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      attribute:
      - Command
      - new
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted command program
    code: |
      use std::process::Command;
      fn example(target: &str) {
          Command::new(target);
      }
  - name: literal command program negative
    code: |
      use std::process::Command;
      fn example() {
          Command::new("true");
      }
    expect_no_match: true
  description: "Command::new(tainted) - attacker-controlled program names select arbitrary binaries. Shell-wrapper command strings are covered by tainted Command.arg(...) calls. Merged collision aliases: rust.cmdi.tokio_command_new, rust.cmdi.async_process_command, rust.cmdi.async_std_command_new."
  aliases:
  - rust.cmdi.tokio_command_new
  - rust.cmdi.async_process_command
  - rust.cmdi.async_std_command_new
