  - CWE-454
  - CWE-526
  match:
    kind: call
    callee:
      attribute:
      - Command
      - env
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: |
      use std::process::Command;
      fn example(input: &str) {
          Command::env("PATH", input);
      }
