- id: rust.cmdi.command_env_tainted
  enabled: true
  language: rust
  tag: env-leak
  severity: medium
  category: process-exec
  packages:
  - std
  - tokio
  cwe:
  - CWE-454
  - CWE-526
  match:
    kind: call
    callee:
      attribute:
      - Command
      - env
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: |
      use std::process::Command;
      fn example(input: &str) {
          Command::env("PATH", input);
      }
  - name: literal arg 1 negative
    code: |
      fn example() {
          Command::env("safe", "safe");
      }
    expect_no_match: true
  description: "Command::env(name, tainted) - injects an attacker-controlled environment variable into a child process; pair with missing env_clear() to detect env-bleed (PATH, LD_PRELOAD, AWS_*) into spawned processes."
