- id: rust.cmdi.std_command_new_shell
  enabled: true
  language: rust
  tag: command-injection
  severity: critical
  packages:
  - std
  imports:
  - std::process::Command
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      attribute: [std, process, Command, new]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted command program
    code: |
      use std::process::Command;
      fn example(target: &str) {
          Command::new(target);
      }
  - name: literal command program negative
    code: |
      use std::process::Command;
      fn example() {
          Command::new("true");
      }
    expect_no_match: true
  - name: locally shadowed Command is not std process execution
    code: |
      use std::process::Command as StdCommand;
      struct Command;
      impl Command { fn new(_: &str) -> Self { Self } }
      fn example(target: &str) { Command::new(target); }
    expect_no_match: true
  description: "std::process::Command::new(tainted) lets attacker-controlled program names select arbitrary binaries."

- id: rust.cmdi.std_command_shell_wrapper_output
  enabled: true
  language: rust
  tag: command-injection
  severity: critical
  category: process-exec
  packages: [std]
  imports: ["std::process::Command"]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [Command, new, arg, arg, output]
      binding_origin: imported
  constraints:
  - receiver_matches_regex: '^Command::new\("(?:/bin/)?(?:sh|bash)"\)\.arg\("-c"\)\.arg\(.+\)$'
  - receiver_tainted: true
  match_examples:
  - name: executed shell wrapper receives a dynamic command
    code: |
      use std::process::Command;
      fn example(input: &str) {
          let _ = Command::new("sh").arg("-c").arg(input).output();
      }
    expect_match_text: ['Command::new("sh").arg("-c").arg(input).output']
  - name: direct argv execution is not shell command injection
    code: |
      use std::process::Command;
      fn example(input: &str) {
          let _ = Command::new("ping").arg("-c").arg(input).output();
      }
    expect_no_match: true
  - name: a configured but unexecuted shell builder is not an execution sink
    code: |
      use std::process::Command;
      fn example(input: &str) {
          let _ = Command::new("sh").arg("-c").arg(input);
      }
    expect_no_match: true
  - name: local Command builder is not std process execution
    code: |
      use std::process::Command as StdCommand;
      struct Command;
      impl Command {
          fn new(_: &str) -> Self { Self }
          fn arg(self, _: &str) -> Self { self }
          fn output(self) {}
      }
      fn example(input: &str) {
          Command::new("sh").arg("-c").arg(input).output();
      }
    expect_no_match: true
  description: "An imported std::process::Command fluent chain that executes sh/bash with -c interprets its dynamic final argument as shell syntax. The complete compiler call identity keeps direct argv execution and unexecuted builders out of scope."

- id: rust.cmdi.std_command_shell_builder_execute
  enabled: true
  language: rust
  tag: command-injection
  severity: critical
  category: process-exec
  packages: [std]
  imports: ["std::process::Command"]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: '^(?:[A-Za-z_][A-Za-z0-9_]*\.)?(?:status|output|spawn)$'
  constraints:
  - receiver_type_in: [StdProcessCommand]
  - receiver_tainted: true
  - arg_count: 0
  - receiver_factory_arguments_equal:
      factory: {attribute: [Command, new]}
      items:
      - index: 0
        accepted_values:
        - {kind: string, value: sh}
        - {kind: string, value: /bin/sh}
        - {kind: string, value: bash}
        - {kind: string, value: /bin/bash}
  - requires_prior_receiver_call:
      call: {name: arg}
      static_string_args_regex: '^-c$'
  match_examples:
  - name: variable std process shell builder executes a dynamic command
    code: |
      use std::process::Command;
      fn example(input: &str) {
          let mut command = Command::new("sh");
          command.arg("-c");
          command.arg(input);
          let _ = command.status();
      }
    expect_match_text: [command.status]
  - name: direct argv execution does not interpret shell syntax
    code: |
      use std::process::Command;
      fn example(input: &str) {
          let mut command = Command::new("echo");
          command.arg(input);
          let _ = command.status();
      }
    expect_no_match: true
  - name: shell builder without command mode is not command injection
    code: |
      use std::process::Command;
      fn example(input: &str) {
          let mut command = Command::new("sh");
          command.arg(input);
          let _ = command.status();
      }
    expect_no_match: true
  - name: branch-only command mode does not establish unconditional state
    code: |
      use std::process::Command;
      fn example(input: &str, mode: bool) {
          let mut command = Command::new("sh");
          if mode { command.arg("-c"); }
          command.arg(input);
          let _ = command.status();
      }
    expect_no_match: true
  - name: configured but unexecuted shell builder is not a sink
    code: |
      use std::process::Command;
      fn example(input: &str) {
          let mut command = Command::new("sh");
          command.arg("-c");
          command.arg(input);
      }
    expect_no_match: true
  - name: locally shadowed Command builder is not std process execution
    code: |
      use std::process::Command as StdCommand;
      struct Command;
      impl Command {
          fn new(_: &str) -> Self { Self }
          fn arg(&mut self, _: &str) {}
          fn status(&mut self) {}
      }
      fn example(input: &str) {
          let mut command = Command::new("sh");
          command.arg("-c");
          command.arg(input);
          command.status();
      }
    expect_no_match: true
  description: "A typed imported std-process builder created for sh/bash, unconditionally configured with `-c`, populated with tainted receiver state, and then executed interprets that state as shell syntax. Factory, configuration, and execution spellings remain entirely in rule data."

