# Rust LLM sinks (OpenAI / Anthropic / Bedrock client wrappers).
- id: rust.llm.openai_api_rs_chat_completion_create
  enabled: true
  language: rust
  tag: web-llm
  severity: medium
  packages: [openai_api_rs]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      name: chat_completion_create
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted openai chat completion request
    code: |
      use openai_api_rs;
      use openai_api_rs;
      use openai_api_rs::dummy;
      fn example(prompt: &str) {
          chat_completion_create(prompt);
      }
    expect_match_text: [chat_completion_create]
  - name: literal openai chat completion request negative
    code: |
      use openai_api_rs;
      use openai_api_rs;
      use openai_api_rs::dummy;
      fn example() {
          chat_completion_create("Summarize the release notes");
      }
    expect_no_match: true
  description: "openai-api-rs chat_completion_create - tainted prompt content reaches an LLM instruction / tool surface."

  imports:
  - openai_api_rs
