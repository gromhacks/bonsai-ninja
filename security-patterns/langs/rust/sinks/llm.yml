- id: rust.llm.anthropic_messages_create
  enabled: true
  language: rust
  tag: web-llm
  severity: medium
  packages: [anthropic]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      attribute: [anthropic, messages, create]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted anthropic messages request
    code: |
      use anthropic::dummy;
      fn example(prompt: &str) {
          anthropic::messages::create(prompt);
      }
    expect_match_text: ["anthropic::messages::create"]
  - name: literal anthropic messages request negative
    code: |
      use anthropic::dummy;
      fn example() {
          anthropic::messages::create("Summarize the release notes");
      }
    expect_no_match: true
  description: "Anthropic Rust client messages::create - tainted prompt content reaches Claude."
