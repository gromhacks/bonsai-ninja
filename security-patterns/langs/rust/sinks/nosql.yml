    kind: call
    callee:
      attribute: [Session, query]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted scylla query string
    code: |
      use scylla::dummy;
      fn example(target: &str) {
          Session::query(target);
      }
  - name: literal scylla query string negative
    code: |
      use scylla::dummy;
      fn example() {
          Session::query("select * from users where id = ?");
      }
    expect_no_match: true
  description: "scylla / cdrs-tokio Session::query — tainted CQL string = CQL injection (use prepared statements with bind values)."

