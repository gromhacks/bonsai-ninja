# Rust NoSQL injection.
- id: rust.nosql.mongodb_collection_find
  enabled: true
  language: rust
  tag: nosql-injection
  severity: high
  packages: [mongodb]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      attribute: [Collection, find]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted mongodb find filter
    code: |
      use mongodb::dummy;
      fn example(target: Document) {
          Collection::find(target);
      }
  - name: safe mongodb find filter negative
    code: |
      use mongodb::dummy;
      fn example() {
          Collection::find(doc! {"status": "active"});
      }
    expect_no_match: true
  description: "mongodb Collection::find — tainted Document filter enables NoSQL operator-injection ($where, $expr, $regex)."
