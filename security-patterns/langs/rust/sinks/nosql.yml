- id: rust.nosql.redis_cmd_eval
  enabled: true
  language: rust
  tag: nosql-injection
  severity: high
  packages: [redis]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      attribute: [redis, cmd]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      use redis::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          redis::cmd("EVAL");
      }
  - name: generated direct match
    code: |
      use redis::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          redis::cmd("EVALSHA");
      }
  - name: literal arg 0 negative
    code: |
      fn example() {
          redis::cmd("safe");
      }
    expect_no_match: true
  description: "redis::cmd(\"EVAL\"/\"EVALSHA\") with a tainted script body or attacker-chosen SHA1 executes Lua on the Redis server."

