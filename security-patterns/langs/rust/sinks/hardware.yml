- id: rust.hardware.transfer_in_place
  enabled: true
  language: rust
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [embedded_hal, linux_embedded_hal]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      regex: "\\.transfer_in_place$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted spi transfer buffer
    code: |
      use embedded_hal;
      use embedded_hal;
      use embedded_hal::dummy;
      fn example(target: &mut [u8]) {
          obj.transfer_in_place(target);
      }
  - name: safe spi transfer buffer negative
    code: |
      use embedded_hal;
      use embedded_hal;
      use embedded_hal::dummy;
      fn example() {
          let safe = [0u8, 1u8];
          obj.transfer_in_place(safe);
      }
    expect_no_match: true
  description: "transfer_in_place — tainted SPI frame bytes are sent to an attached peripheral."
  imports:
  - embedded_hal
