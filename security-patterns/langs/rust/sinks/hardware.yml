- id: rust.hardware.set_duty_cycle
  enabled: true
  language: rust
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [rppal]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      regex: "\\.set_duty_cycle$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted pwm duty cycle
    code: |
      use rppal::dummy;
      fn example(target: f64) {
          obj.set_duty_cycle(target);
      }
  - name: literal pwm duty cycle negative
    code: |
      use rppal::dummy;
      fn example() {
          obj.set_duty_cycle(0.5);
      }
    expect_no_match: true
  description: "set_duty_cycle(value) - attacker-controlled PWM duty cycle actuates attached hardware."

- id: rust.hardware.smbus_write_byte_data
  enabled: true
  language: rust
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [i2cdev, linux_embedded_hal]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      regex: "\\.smbus_write_byte_data$"
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: smbus write byte data tainted register
    code: |
      use i2cdev::dummy;
      fn example(target: u8) {
          obj.smbus_write_byte_data(target, 0xff);
      }
  - name: smbus write byte data literal negative
    code: |
      use i2cdev::dummy;
      fn example() {
          obj.smbus_write_byte_data(0x10, 0xff);
      }
    expect_no_match: true
  description: "smbus_write_byte_data(register, value) - attacker-controlled I2C register/value mutates an attached device."

- id: rust.hardware.smbus_write_word_data
  enabled: true
