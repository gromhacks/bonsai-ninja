# Rust hardware-control / bus-write sinks (GPIO, PWM, I2C/SMBus, SPI).
- id: rust.hardware.set_high
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: rust
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [embedded_hal, rppal]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      regex: "\\.set_high$"
  description: "Disabled - embedded-hal set_high() is a no-argument state change; tainted control-flow reachability is not expressible in the current YAML constraint vocabulary."
  imports:
  - embedded_hal

- id: rust.hardware.set_low
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: rust
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [embedded_hal, rppal]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
