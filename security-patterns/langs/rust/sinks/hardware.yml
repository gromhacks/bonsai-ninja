# Rust hardware-control / bus-write sinks (GPIO, PWM, I2C/SMBus, SPI).
- id: rust.hardware.set_high
  enabled: true
  language: rust
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [embedded_hal, rppal]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      regex: "\\.set_high$"
  match_examples:
  - name: generated direct match
    code: |
      use embedded_hal;
      use embedded_hal;
      use embedded_hal::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          obj.set_high(target);
      }
  description: "set_high — tainted control flow drives a digital output high."

  imports:
  - embedded_hal
