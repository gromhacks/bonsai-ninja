- id: rust.hardware.set_duty_cycle
  enabled: true
  language: rust
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [rppal]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      regex: "\\.set_duty_cycle$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted pwm duty cycle
    code: |
      use rppal::dummy;
      fn example(target: f64) {
          obj.set_duty_cycle(target);
      }
  - name: literal pwm duty cycle negative
    code: |
      use rppal::dummy;
      fn example() {
          obj.set_duty_cycle(0.5);
      }
    expect_no_match: true
  description: "set_duty_cycle — tainted PWM value actuates attached hardware."

