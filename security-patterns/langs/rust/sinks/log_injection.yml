# rust log_injection sinks.

# Log-injection sinks (round 2 fill).
- id: rust.log_injection.log_info_newline
  enabled: true
  language: rust
  tag: header-injection
  severity: medium
  packages: [log]
  cwe: [CWE-117]
  match:
    kind: call
    callee:
      attribute: [log, info]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(\\n|\\r|format!\(|\+)'
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      use log::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          log::info("user\\n");
      }
  - name: rust log info ordinary negative
    code: |
      use log::dummy;
      fn example(user: &str) {
          log::info("user={}", user);
      }
    expect_no_match: true
  description: 'log::info!("... {user} ...\n") — newline in user text forges log entries.'
