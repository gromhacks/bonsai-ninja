# rust race / TOCTOU sinks (T501).

# TOCTOU check sites - pair with subsequent open/chmod use-sites
# in source order to identify the race window.
- id: rust.toctou.path_exists
  enabled: true
  language: rust
  tag: race
  category: source-independent
  severity: medium
  packages: [std]
  cwe: [CWE-367]
  match:
    kind: call
    callee:
      attribute: [Path, exists]
  match_examples:
    - name: generated direct match
      code: |
        use std::path::Path;
        fn example() {
            let target = "tainted";
            let query = "user";
            Path::exists(target);
        }
  description: "std::path::Path::exists() - check site preceding File::open is TOCTOU."

# Disabled until the matcher can prove the receiver type is a mutex-like
# guard. Matching repeated bare `.lock()` calls over-reports stdout,
# parser caches, page-cache state, and other ordinary lock sites.
- id: rust.race.mutex_double_lock
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: rust
  tag: race
  severity: high
  cwe: [CWE-362, CWE-833]
  match:
    kind: call
    callee:
      name: lock
  description: "Disabled - even with receiver_type_in: [Mutex] the `same_receiver_call_count_at_least: 2` constraint does not discriminate a double-lock from a single lock (verified: fires on both), so this over-fires. Needs a working same-receiver call-count fact or control-flow-ordered lock-state tracking."
