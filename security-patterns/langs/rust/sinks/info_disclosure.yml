# Rust information-disclosure sinks (logs, debug output, error responses).
- id: rust.info_disclosure.log_error_secret
  enabled: true
  language: rust
  tag: information-disclosure
  severity: medium
  packages: [log]
  cwe: [CWE-200]
  match:
    kind: call
    callee:
      attribute: [log, error]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)(secret|token|password|passwd|api[_-]?key|credential|private[_-]?key)'
  match_examples:
  - name: rust log error secret-shaped data
    code: |
      use log::dummy;
      fn example() {
          let token = "secret";
          log::error("token={}", token);
      }
    expect_match_text: [log::error]
  - name: rust log ordinary error negative
    code: |
      use log::dummy;
      fn example(user: &str) {
          log::error("user={}", user);
      }
    expect_no_match: true
  description: "log::error with secret-shaped data - credentials or tokens can leak to centralized logs."

- id: rust.info_disclosure.eprintln_error
  enabled: true
  language: rust
  tag: information-disclosure
  severity: medium
  cwe: [CWE-209]
  match:
    kind: call
    callee:
      name: eprintln
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)(error|exception|stack|trace|backtrace|panic)'
  match_examples:
  - name: rust eprintln error details
    code: |
      fn example() {
          let err = "stack backtrace";
          eprintln("error: {}", err);
      }
    expect_match_text: [eprintln]
  - name: rust eprintln ordinary negative
    code: |
      fn example(user: &str) {
          eprintln("user: {}", user);
      }
    expect_no_match: true
  description: "eprintln!(error/backtrace) - diagnostic internals can leak through stderr logs."

- id: rust.info_disclosure.actix_internal_server_error_body
  enabled: true
  language: rust
  tag: information-disclosure
  severity: high
  packages: [actix_web]
  cwe: [CWE-209]
  match:
    kind: call
    callee:
      attribute: [HttpResponse, InternalServerError]
  match_examples:
  - name: rust actix error response
    code: |
      use actix_web;
      use actix_web;
      use actix_web::dummy;
      fn example() {
          let err = "database stack";
          HttpResponse::InternalServerError(err);
      }
    expect_match_text: [HttpResponse::InternalServerError]
  description: "actix-web HttpResponse::InternalServerError(error text) - sends exception / stack details to clients."
  imports:
  - actix_web
