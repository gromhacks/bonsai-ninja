    callee:
      attribute: [Handlebars, register_template_string]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted handlebars registered template
    code: |
      use handlebars::dummy;
      fn example(target: &str) {
          Handlebars::register_template_string("profile", target);
      }
  - name: literal handlebars registered template negative
    code: |
      use handlebars::dummy;
      fn example() {
          Handlebars::register_template_string("profile", "Hello {{ user }}");
      }
