# Rust template-injection / SSTI (Tera, Handlebars, MiniJinja, Liquid).
- id: rust.template.tera_render_str
  enabled: true
  language: rust
  tag: ssti
  severity: critical
  packages: [tera]
  cwe: [CWE-94, CWE-1336]
  match:
    kind: call
    callee:
      attribute: [Tera, render_str]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted tera render_str template
    code: |
      use tera::dummy;
      fn example(target: &str) {
          Tera::render_str(target);
      }
  - name: literal tera render_str template negative
    code: |
      use tera::dummy;
      fn example() {
          Tera::render_str("Hello {{ user }}");
      }
    expect_no_match: true
  description: "Tera::render_str(tainted) - compiles an ad-hoc Jinja-style template from a runtime string; tainted source = SSTI with filter-abuse RCE."

