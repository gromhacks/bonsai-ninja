# Rust open-redirect (actix-web / axum / rocket / warp).
- id: rust.open_redirect.actix_web_response_found
  enabled: false
  disabled_reason:
    code: over-broad
  language: rust
  tag: open-redirect
  severity: high
  packages: [actix_web]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      attribute: [HttpResponse, Found]
  match_examples:
  - name: generated direct match
    code: |
      use actix_web;
      use actix_web;
      use actix_web::dummy;
      fn example(target: String) {
          let query = "user";
          HttpResponse::Found(target);
      }
  description: "Disabled — HttpResponse::Found() only selects a status; the tainted Location value is added by a later header call, so this requires builder-state tracking."

  imports:
  - actix_web
