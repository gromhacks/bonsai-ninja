- id: rust.open_redirect.axum_redirect_to
  enabled: true
  language: rust
  tag: open-redirect
  severity: high
  packages: [axum, rocket]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      attribute: [Redirect, to]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted redirect to target
    code: |
      use axum::dummy;
      fn example(target: String) {
          Redirect::to(target);
      }
  - name: literal redirect to target negative
    code: |
      use axum::dummy;
      fn example() {
          Redirect::to("/dashboard");
      }
    expect_no_match: true
  description: "Redirect::to(tainted) — covers axum and rocket (same `[Redirect, to]` suffix). Tainted URL = open redirect."

