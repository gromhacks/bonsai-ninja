# Rust XXE sinks.
#
# The real RCE/file-disclosure surface is libxml2 bindings (`libxml`
# crate), the `yaserde` serde-XML codec (which hands the buffer to
# quick-xml but without disabling DTD loading in all configurations),
# and anything routed through `xml-rs`'s DOCTYPE path.

- id: rust.xxe.quick_xml_read_event_into
  enabled: true
  language: rust
  tag: xxe
  severity: high
  packages: [quick-xml]
  imports: [quick_xml]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      name: read_event_into
  constraints:
  - receiver_type_in: [QuickXmlReader]
  - receiver_tainted: true
  match_examples:
  - name: tainted quick-xml reader consumes an event
    code: |
      use quick_xml::Reader;
      fn parse(input: &str) {
          let mut reader = Reader::from_str(input);
          let mut buffer = Vec::new();
          let _ = reader.read_event_into(&mut buffer);
      }
    expect_match_text: [reader.read_event_into]
  - name: literal quick-xml reader is not tainted
    code: |
      use quick_xml::Reader;
      fn parse() {
          let mut reader = Reader::from_str("<root/>");
          let mut buffer = Vec::new();
          let _ = reader.read_event_into(&mut buffer);
      }
    expect_no_match: true
  - name: unrelated reader method is not quick-xml
    code: |
      struct Reader;
      impl Reader { fn read_event_into(&mut self, _: &mut Vec<u8>) {} }
      fn parse(input: &str, reader: &mut Reader) {
          let mut buffer = input.as_bytes().to_vec();
          reader.read_event_into(&mut buffer);
      }
    expect_no_match: true
  description: "A compiler-typed quick-xml reader consumes events from attacker-controlled XML. The receiver provenance comes from the rule-declared factory transfer rather than API logic in the engine."

- id: rust.xxe.libxml_parse_string
  enabled: true
  language: rust
  tag: xxe
  severity: high
  packages: [libxml]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [Parser, parse_string]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted libxml parse string
    code: |
      use libxml::dummy;
      fn example(target: &str) {
          Parser::parse_string(target);
      }
  - name: literal libxml parse string negative
    code: |
      use libxml::dummy;
      fn example() {
          Parser::parse_string("<root/>");
      }
    expect_no_match: true
  description: "libxml Parser::parse_string - wraps libxml2 which DOES expand external entities by default; tainted XML = XXE (file-disclosure, SSRF via DTD)."

