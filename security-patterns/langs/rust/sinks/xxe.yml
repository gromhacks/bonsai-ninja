# Rust XXE sinks.
#
# Most pure-Rust XML parsers (quick-xml, xml-rs, roxmltree,
# sxd-document) don't expand external entities by default — they're
# listed disabled so an author can opt in per codebase after
# reviewing whether the project configured entity expansion.
#
# The real RCE/file-disclosure surface is libxml2 bindings (`libxml`
# crate), the `yaserde` serde-XML codec (which hands the buffer to
# quick-xml but without disabling DTD loading in all configurations),
# and anything routed through `xml-rs`'s DOCTYPE path.

- id: rust.xxe.libxml_parse_string
  enabled: true
  language: rust
  tag: xxe
  severity: high
  packages: [libxml]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [Parser, parse_string]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted libxml parse string
    code: |
      use libxml::dummy;
      fn example(target: &str) {
          Parser::parse_string(target);
      }
  - name: literal libxml parse string negative
    code: |
      use libxml::dummy;
      fn example() {
          Parser::parse_string("<root/>");
      }
    expect_no_match: true
  description: "libxml Parser::parse_string — wraps libxml2 which DOES expand external entities by default; tainted XML = XXE (file-disclosure, SSRF via DTD)."

