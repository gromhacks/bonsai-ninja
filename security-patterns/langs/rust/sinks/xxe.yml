  match_examples:
  - name: tainted serde xml string
    code: |
      use serde_xml_rs;
      use serde_xml_rs;
      use serde_xml_rs::dummy;
      fn example(target: &str) {
          serde_xml_rs::from_str(target);
      }
  - name: literal serde xml string negative
    code: |
      use serde_xml_rs;
      use serde_xml_rs;
      use serde_xml_rs::dummy;
      fn example() {
          serde_xml_rs::from_str("<root/>");
      }
    expect_no_match: true
  description: "serde-xml-rs::from_str — backed by xml-rs; tainted XML traverses DOCTYPE handling before deserialization."

  imports:
  - serde_xml_rs
- id: rust.xxe.xml_rs_parse
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: rust
  tag: xxe
  severity: medium
  packages: [xml_rs]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [EventReader, new]
  description: "Disabled — xml-rs exposes DOCTYPE events but does not fetch external entities unless the caller wires a resolver; enable on codebases that implement `EntityResolver`."

