- id: rust.xxe.yaserde_from_reader
  enabled: true
  language: rust
  tag: xxe
  severity: high
  packages: [yaserde]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [de, from_reader]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted yaserde xml reader
    code: |
      use yaserde::dummy;
      fn example(target: std::io::Cursor<Vec<u8>>) {
          de::from_reader(target);
      }
  - name: safe yaserde xml reader negative
    code: |
      use yaserde::dummy;
      fn example() {
          de::from_reader(std::io::Cursor::new(b"<root/>".to_vec()));
      }
    expect_no_match: true
  description: "yaserde::de::from_reader — stream deserializer; tainted reader over attacker XML can resolve DTDs in some configurations."

