- id: rust.crypto.md2_new
  enabled: true
  language: rust
  tag: weak-crypto
  category: source-independent
  severity: low
  packages: [md2]
  cwe: [CWE-327, CWE-328]
  match:
    kind: call
    callee:
      attribute: [Md2, new]
  match_examples:
  - name: rustcrypto md2 constructor
    code: |
      use md2::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          Md2::new(target);
      }
    expect_match_text: [Md2::new]
  description: "RustCrypto md2::Md2::new — MD2 is obsolete and collision-broken; use SHA-256 or stronger."
