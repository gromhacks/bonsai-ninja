  match_examples:
  - name: generated direct match
    code: |
      use rand::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          rand::random(target);
      }
  description: "rand::random — thin wrapper around thread_rng; same caveat (not a CSPRNG guarantee). Use OsRng for security-sensitive values."
