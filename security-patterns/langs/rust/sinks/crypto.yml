- id: rust.crypto.md5_compute
  enabled: true
  language: rust
  tag: weak-crypto
  category: source-independent
  severity: low
  packages: [md5]
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      attribute: [Md5, new]
  match_examples:
  - name: generated direct match
    code: |
      use md_5;
      use md_5;
      use md_5::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          Md5::new(target);
      }
  description: "md5 / md-5 crate — collision-broken since 2004; not suitable for signatures, password hashing, or integrity."
  imports:
  - md_5
