- id: rust.crypto.rand_thread
  enabled: true
  language: rust
  tag: weak-randomness
  category: source-independent
  severity: medium
  packages: [rand]
  cwe: [CWE-330]
  match:
    kind: call
    callee:
      attribute: [rand, thread_rng]
  match_examples:
  - name: generated direct match
    code: |
      use rand::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          rand::thread_rng(target);
      }
  description: "rand::thread_rng — ChaCha12-seeded-from-OS; safe for MOST uses but not guaranteed for secrets (changes without semver bump). For tokens / keys / nonces, use OsRng or ChaCha20Rng seeded from OsRng."
- id: rust.crypto.rand_random
  enabled: true
