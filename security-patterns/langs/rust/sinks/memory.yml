# Rust memory-safety sinks. Unsafe-block raw-pointer operations and
# transmutes bypass the borrow checker; tainted pointers, lengths, or
# byte values can turn those primitives into out-of-bounds access or
# type-confusion bugs.
- id: rust.memory.ptr_read
  enabled: true
  language: rust
  tag: memory-safety
  severity: high
  category: memory
  packages: [std, core]
  cwe: [CWE-125, CWE-416]
  match:
    kind: call
    callee:
      attribute: [ptr, read]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ptr read tainted pointer
    code: |
      use std::ptr;
      unsafe fn example(user_input: *const u8) -> u8 {
          ptr::read(user_input)
      }
  - name: ptr read safe pointer negative
    code: |
      use std::ptr;
      unsafe fn example() -> u8 {
          let safe = 7u8;
          ptr::read(&safe)
      }
    expect_no_match: true
  description: "std::ptr::read(src) - attacker-controlled raw pointer can cause out-of-bounds read or use-after-free in unsafe code."

- id: rust.memory.ptr_write
  enabled: true
  language: rust
  tag: memory-safety
  severity: critical
  category: memory
  packages: [std, core]
  cwe: [CWE-787]
  match:
    kind: call
    callee:
      attribute: [ptr, write]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ptr write tainted destination
    code: |
      use std::ptr;
      unsafe fn example(user_input: *mut u8) {
          ptr::write(user_input, 1);
      }
  - name: ptr write safe destination negative
    code: |
      use std::ptr;
      unsafe fn example() {
          let mut safe = 0u8;
          ptr::write(&mut safe, 1);
      }
    expect_no_match: true
  description: "std::ptr::write(dst, val) - attacker-controlled raw destination pointer enables arbitrary memory write inside unsafe code."

- id: rust.memory.ptr_copy_nonoverlapping
  enabled: true
  language: rust
  tag: memory-safety
  severity: critical
  category: memory
  packages: [std, core]
  cwe: [CWE-787, CWE-120, CWE-125]
  match:
    kind: call
    callee:
      attribute: [ptr, copy_nonoverlapping]
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: copy nonoverlapping tainted count
    code: |
      use std::ptr;
      unsafe fn example(src: *const u8, dst: *mut u8, user_input: usize) {
          ptr::copy_nonoverlapping(src, dst, user_input);
      }
  - name: copy nonoverlapping literal count negative
    code: |
      use std::ptr;
      unsafe fn example(src: *const u8, dst: *mut u8) {
          ptr::copy_nonoverlapping(src, dst, 16);
      }
    expect_no_match: true
  description: "ptr::copy_nonoverlapping(src, dst, count) - attacker-controlled pointer or count can cause out-of-bounds copy."

