# Rust memory-safety sinks. Unsafe-block raw-pointer operations and
# transmutes - tainted offsets / lengths reach memory primitives that
# bypass the borrow checker.
- id: rust.memory.ptr_read
  enabled: true
  language: rust
  tag: memory-safety
  severity: high
  category: memory
  packages: [std, core]
  cwe: [CWE-125, CWE-787]
  match:
    kind: call
    callee:
      attribute: [ptr, read]
  match_examples:
  - name: generated direct match
    code: |
      use std::process::Command;
      fn example() {
          let target = "tainted";
          let query = "user";
          ptr::read(target);
      }
  description: "std::ptr::read(src) - reads from a raw pointer; tainted offset/pointer = out-of-bounds read or use-after-free in unsafe blocks."
- id: rust.memory.ptr_write
  enabled: true
  language: rust
  tag: memory-safety
  severity: critical
  category: memory
  packages: [std, core]
  cwe: [CWE-787]
  match:
    kind: call
    callee:
      attribute: [ptr, write]
  match_examples:
  - name: generated direct match
    code: |
      use std::process::Command;
