# Rust XSS sinks (template trust markers + raw HTML responses).
- id: rust.xss.maud_pre_escaped
  enabled: true
  language: rust
  tag: xss
  severity: high
  packages: [maud]
  cwe: [CWE-79]
  match:
    kind: new
    callee:
      name: PreEscaped
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted maud pre escaped body
    code: |
      use maud::dummy;
      struct PreEscaped<T>(T);
      fn example(target: &str) {
          let _x = PreEscaped(target);
      }
  - name: literal maud pre escaped body negative
    code: |
      use maud::dummy;
      struct PreEscaped<T>(T);
      fn example() {
          let _x = PreEscaped("<b>safe</b>");
      }
    expect_no_match: true
  description: "maud PreEscaped(tainted) - bypasses HTML escape."

- id: rust.xss.axum_html_response
  enabled: true
  language: rust
  tag: xss
  severity: high
  packages: [axum]
  cwe: [CWE-79]
  match:
    kind: new
    callee:
      attribute: [response, Html]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted axum html response body
    code: |
      use axum::dummy;
      mod response { pub struct Html<T>(pub T); }
      fn example(target: &str) {
          let _x = response::Html(target);
      }
  - name: literal axum html response body negative
    code: |
      use axum::dummy;
      mod response { pub struct Html<T>(pub T); }
      fn example() {
          let _x = response::Html("<p>safe</p>");
      }
    expect_no_match: true
  description: "axum::response::Html(tainted) - marks string as text/html response; no escape."
