# Rust file-upload sinks - attacker-chosen filename flowing into a
# filesystem path without allowlist / basename stripping.
- id: rust.upload.rocket_tempfile_persist_to
  enabled: true
  language: rust
  tag: file-upload
  severity: medium
  packages: [rocket]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [TempFile, persist_to]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted rocket tempfile persist path
    code: |
      use rocket::dummy;
      fn example(target: &str) {
          TempFile::persist_to(target);
      }
    expect_match_text: ["TempFile::persist_to"]
  - name: literal rocket tempfile persist path negative
    code: |
      use rocket::dummy;
      fn example() {
          TempFile::persist_to("/var/app/uploads/file.bin");
      }
    expect_no_match: true
  description: "rocket TempFile::persist_to(path) - persisting uploads to attacker-influenced paths can overwrite arbitrary files."
