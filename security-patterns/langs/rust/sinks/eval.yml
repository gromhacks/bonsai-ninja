# Reflection-based dynamic invocation (T406). Tag
# code-injection so reviewer enumerates with `security sinks
# --tag code-injection`. Treats reflection as eval-equivalent
# when the dispatched name comes from attacker input.
- id: rust.eval.libloading_get
  enabled: true
  language: rust
  tag: code-injection
  severity: high
  cwe: [CWE-470]
  match:
    kind: call
    callee:
      attribute: [Library, get]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted library symbol
    code: |
      fn example(target: &[u8]) {
          Library::get(target);
      }
  - name: literal library symbol negative
    code: |
      fn example() {
          Library::get(b"safe_symbol");
      }
    expect_no_match: true
  description: "libloading Library.get(attacker_symbol_name) — load arbitrary symbol by name from a dlopen'd library; reflection-equivalent dynamic dispatch."
