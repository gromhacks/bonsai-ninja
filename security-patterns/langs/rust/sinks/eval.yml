  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted dynamic library path
    code: |
      use libloading::dummy;
      fn example(target: &str) {
          Library::new(target);
      }
  - name: literal dynamic library path negative
    code: |
      use libloading::dummy;
      fn example() {
          Library::new("/usr/lib/libsafe.so");
      }
    expect_no_match: true
  description: "libloading::Library::new(tainted) — loads arbitrary .so/.dll."

