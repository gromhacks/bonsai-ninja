# Rust eval / dynamic-code sinks (embedded interpreters + dynamic loading).
- id: rust.eval.deno_core_execute_script
  enabled: true
  language: rust
  tag: code-injection
  severity: critical
  packages: [deno_core]
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [JsRuntime, execute_script]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted deno script source
    code: |
      use deno_core::dummy;
      fn example(target: &str) {
          JsRuntime::execute_script(target);
      }
  - name: literal deno script source negative
    code: |
      use deno_core::dummy;
      fn example() {
          JsRuntime::execute_script("1 + 1");
      }
    expect_no_match: true
  description: "deno_core JsRuntime::execute_script — tainted source executes inside the embedded V8 runtime (sandbox escapes historical)."

- id: rust.eval.js_context_eval
  enabled: true
  language: rust
  tag: code-injection
  severity: critical
  packages: [boa_engine, rquickjs]
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [Context, eval]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted js eval source
    code: |
      use boa_engine::dummy;
      fn example(target: &str) {
          Context::eval(target);
      }
  - name: literal js eval source negative
    code: |
      use boa_engine::dummy;
      fn example() {
          Context::eval("1 + 1");
      }
    expect_no_match: true
  description: "JS embedded-engine Context::eval — covers boa_engine::Context::eval and rquickjs::Context::eval (same `[Context, eval]` suffix). Tainted script = RCE inside the JS sandbox (and sandbox escapes exist for both). `min_args: 1` rejects 0-arg `Context.eval()` decoys."

