- id: rust.typing.warp_filter_query
  enabled: true
  language: rust
  packages: [warp]
  imports: [warp]
  returns_type: WarpFilter
  match: { kind: call, callee: { attribute: [warp, query] } }
  match_examples:
  - name: warp query filter factory
    code: |
      use std::collections::HashMap;
      use warp::Filter;
      fn route() { let input = warp::query::<HashMap<String, String>>(); consume(input); }
      fn consume<T>(_: T) {}
  - name: local query factory collision
    code: |
      use warp::Filter;
      mod local { pub fn query<T>() -> T { panic!() } }
      fn route() { let input: String = local::query(); consume(input); }
      fn consume<T>(_: T) {}
    expect_no_match: true
  description: "warp::query returns a filter descriptor; the compiler keeps generic arguments separate from the exact callable identity."

