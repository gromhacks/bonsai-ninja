- id: rust.typing.warp_filter_and
  enabled: true
  language: rust
  packages: [warp]
  imports: [warp]
  returns_type: WarpFilter
  match: { kind: call, callee: { name: and } }
  constraints: [{ receiver_type_in: [WarpFilter] }]
  match_examples:
  - name: typed warp and composition
    code: |
      use warp::Filter;
      fn route() { let input = warp::body::bytes(); let combined = input.and(warp::path::param::<String>()); consume(combined); }
      fn consume<T>(_: T) {}
  - name: local and method collision
    code: |
      use warp::Filter;
      struct Local;
      impl Local { fn and(self, _: Local) -> Local { self } }
      fn route(local: Local) { let _ = local.and(Local); }
    expect_no_match: true
  description: "Filter::and preserves the rulepack-owned WarpFilter descriptor type; the compiler-proven receiver type excludes unrelated methods."

