# Rust CLI / local input sources (argv, stdin, environment).
- id: rust.cli.argv
  enabled: true
  language: rust
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      attribute: [env, args]
  match_examples:
  - name: generated direct match
    code: |
      fn example() {
          let target = "tainted";
          let query = "user";
          env::args(target);
      }
  description: "std::env::args - process argv."
