- id: rust.cli.clap_parse
  enabled: true
  language: rust
  trust: local
  tag: local-input
  payload_types: [text]
  frameworks: [clap]
  packages: [clap]
  match:
    kind: call
    callee:
      attribute: [Parser, parse]
  match_examples:
  - name: generated direct match
    code: |
      use clap::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          Parser::parse(target);
      }
  description: "clap::Parser::parse - argv-derived struct."
- id: rust.cli.stdin_read_line
  enabled: true
  language: rust
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: read_line
  constraints:
  - min_args: 1
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: generated direct match
    code: |
      fn example() {
          let target = "tainted";
          let query = "user";
          read_line(target);
      }
  - name: read_line no-arg negative
    code: |
      fn example() {
          read_line();
      }
    expect_no_match: true
  description: "std::io::Stdin::read_line(&mut buf) - interactive input fills the buffer arg. `min_args: 1` rejects zero-arg same-name decoys."
- id: rust.cli.read_to_string
  enabled: true
  language: rust
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: read_to_string
  constraints:
  - min_args: 1
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: read to string output buffer
    code: |
      fn example(mut reader: impl std::io::Read) {
          let mut data = String::new();
          reader.read_to_string(&mut data);
      }
    expect_match_text: [reader.read_to_string]
  - name: read to string no-arg negative
    code: |
      fn example(mut reader: impl std::io::Read) {
          reader.read_to_string();
      }
    expect_no_match: true
  description: "std::io::Read::read_to_string(&mut String) - fills the destination string from stdin/file/socket reader; local trust source unless narrowed by a remote framework rule."
