- id: rust.cli.env_var
  enabled: true
  language: rust
  trust: config
  tag: local-input
  payload_types: [text]
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: call
    callee:
      attribute: [env, var]
  match_examples:
  - name: generated direct match
    code: |
      fn example() {
          let target = "tainted";
          let query = "user";
          env::var(target);
      }
  - name: env set_var negative
    code: |
      fn example() {
          env::set_var("KEY", "value");
      }
    expect_no_match: true
  description: "std::env::var - process environment variable."
