- id: rust.cli.clap_parse
  enabled: true
  language: rust
  trust: local
  tag: local-input
  payload_types: [text]
  frameworks: [clap]
  packages: [clap]
  match:
    kind: call
    callee:
      attribute: [Parser, parse]
  match_examples:
  - name: generated direct match
    code: |
      use clap::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          Parser::parse(target);
      }
  description: "clap::Parser::parse — argv-derived struct."
- id: rust.cli.stdin_read_line
  enabled: true
  language: rust
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: read_line
