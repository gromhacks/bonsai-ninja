# Rust cloud-runtime event sources (FaaS / serverless handlers).
- id: rust.aws.lambda_event_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: rust
  trust: service
  tag: event-input
  payload_types: [event, json]
  frameworks: [aws-lambda]
  packages: [lambda_runtime]
  manifests: [Cargo.toml]
  match:
    kind: param
    target:
      name: event
  description: "Disabled — `kind: param` cannot currently prove the enclosing function is a Lambda handler, so bare `event` overmatches unrelated Rust callbacks."
- id: rust.aws.lambda_handler_event
  enabled: true
  language: rust
  trust: service
  tag: event-input
  payload_types: [event]
  frameworks: [aws-lambda]
  packages: [lambda_runtime]
  match:
    kind: call
    callee:
      attribute: [LambdaEvent, payload]
  match_examples:
  - name: lambda event payload
    code: |
      use lambda_runtime::LambdaEvent;
      fn example() {
          LambdaEvent::payload();
      }
    expect_match_text: ["LambdaEvent::payload"]
  description: "lambda_runtime LambdaEvent::payload — AWS Lambda event payload; local receiver calls require semantic LambdaEvent receiver-type facts."
