# Rust message-queue / broker sources.
- id: rust.rdkafka.message_payload
  enabled: true
  language: rust
  trust: service
  tag: queue-input
  payload_types: [queue-message, binary]
  frameworks: [rdkafka]
  packages: [rdkafka]
  match:
    kind: call
    callee:
      regex: "\\.payload$"
  constraints:
  - receiver_type_in: [BorrowedMessage]
  - max_args: 0
  match_examples:
  - name: rdkafka borrowed message payload
    code: |
      use rdkafka::message::BorrowedMessage;
      fn example(message: &BorrowedMessage<'_>) { let _ = message.payload(); }
    expect_match_text: [message.payload]
  - name: unrelated payload receiver negative
    code: |
      use rdkafka::message::BorrowedMessage;
      struct Local;
      impl Local { fn payload(&self) -> &[u8] { &[] } }
      fn example(message: &Local) { let _ = message.payload(); }
    expect_no_match: true
  description: "rdkafka BorrowedMessage::payload() - Kafka message payload; local receiver calls require semantic BorrowedMessage receiver-type facts."
- id: rust.lapin.delivery_data
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: rust
  trust: service
  tag: queue-input
  payload_types: [queue-message, binary]
  frameworks: [lapin]
  packages: [lapin]
  match:
    kind: read
    target:
      name: data
      receiver_type_in: [Delivery, lapin::message::Delivery]
  match_examples:
  - name: lapin delivery data
    code: |
      use lapin::message::Delivery;
      fn consume(delivery: Delivery) { let _ = delivery.data; }
    expect_match_text: [delivery.data]
  - name: unrelated data field negative
    code: |
      use lapin::message::Delivery;
      struct Local { data: Vec<u8> }
      fn consume(local: Local) { let _ = local.data; }
    expect_no_match: true
  description: "Disabled pending Rust field-read receiver-type facts. lapin Delivery.data is broker input, but a bare data field would overmatch local structs."
- id: rust.nats.message_data
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: rust
  trust: service
  tag: queue-input
  payload_types: [queue-message, binary]
  frameworks: [nats, async-nats]
  packages: [nats, async_nats]
  match:
    kind: read
    target:
      name: payload
      receiver_type_in: [Message, async_nats::Message, nats::Message]
  match_examples:
  - name: async nats message payload
    code: |
      use async_nats::Message;
      fn consume(message: Message) { let _ = message.payload; }
    expect_match_text: [message.payload]
  - name: unrelated payload field negative
    code: |
      use async_nats::Message;
      struct Local { payload: Vec<u8> }
      fn consume(local: Local) { let _ = local.payload; }
    expect_no_match: true
  description: "Disabled pending Rust field-read receiver-type facts. nats/async-nats Message.payload is broker input, but a bare payload field would overmatch local structs."
- id: rust.sqs.receive_message
  enabled: true
  language: rust
  trust: service
  tag: queue-input
  payload_types: [json, text]
  frameworks: [aws-sdk-sqs]
  packages: [aws_sdk_sqs]
  match:
    kind: call
    callee:
      regex: "\\.body$"
  constraints:
  - receiver_type_in: [Message, aws_sdk_sqs::types::Message]
  - max_args: 0
  match_examples:
  - name: sqs message body
    code: |
      use aws_sdk_sqs::types::Message;
      fn example(message: &Message) { let _ = message.body(); }
    expect_match_text: [message.body]
  - name: unrelated body receiver negative
    code: |
      use aws_sdk_sqs::types::Message;
      struct Local;
      impl Local { fn body(&self) -> Option<&str> { None } }
      fn example(message: &Local) { let _ = message.body(); }
    expect_no_match: true
  description: "aws-sdk-sqs Message::body() - SQS message body; local receiver calls require semantic Message receiver-type facts."
