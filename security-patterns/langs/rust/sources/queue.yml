# Rust message-queue / broker sources.
- id: rust.rdkafka.message_payload
  enabled: true
  language: rust
  trust: service
  tag: queue-input
  payload_types: [queue-message, binary]
  frameworks: [rdkafka]
  packages: [rdkafka]
  match:
    kind: call
    callee:
      attribute: [BorrowedMessage, payload]
  match_examples:
  - name: rdkafka borrowed message payload
    code: |
      use rdkafka::message::BorrowedMessage;
      fn example() {
          BorrowedMessage::payload();
      }
    expect_match_text: ["BorrowedMessage::payload"]
  description: "rdkafka BorrowedMessage::payload() - Kafka message payload; local receiver calls require semantic BorrowedMessage receiver-type facts."
- id: rust.lapin.delivery_data
  enabled: false
  disabled_reason:
    code: over-broad
  language: rust
  trust: service
  tag: queue-input
  payload_types: [queue-message, binary]
  frameworks: [lapin]
  packages: [lapin]
  match:
    kind: read
    target:
      name: data
  description: "Disabled - bare `data` overmatches unrelated fields; enable with a receiver-qualified Delivery.data read once Rust field receiver facts are available."
- id: rust.nats.message_data
  enabled: false
  disabled_reason:
    code: over-broad
  language: rust
  trust: service
  tag: queue-input
  payload_types: [queue-message, binary]
  frameworks: [nats, async-nats]
  packages: [nats, async_nats]
  match:
    kind: read
    target:
      name: payload
  description: "Disabled - bare `payload` overmatches unrelated fields; enable with a receiver-qualified Message.payload read once Rust field receiver facts are available."
- id: rust.sqs.receive_message
  enabled: true
  language: rust
  trust: service
  tag: queue-input
  payload_types: [json, text]
  frameworks: [aws-sdk-sqs]
  packages: [aws_sdk_sqs]
  match:
    kind: call
    callee:
      attribute: [Message, body]
  match_examples:
  - name: sqs message body
    code: |
      use aws_sdk_sqs::types::Message;
      fn example() {
          Message::body();
      }
    expect_match_text: ["Message::body"]
  description: "aws-sdk-sqs Message::body() - SQS message body; local receiver calls require semantic Message receiver-type facts."
