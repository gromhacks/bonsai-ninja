# Rust hardware / physical-input sources (GPIO, interrupts, I2C register reads).
- id: rust.physical.input_pin_is_high
  enabled: true
  language: rust
  trust: physical
  tag: hw-input
  category: hardware-io
  packages: [embedded_hal, rppal]
  match:
    kind: call
    callee:
      regex: "\\.is_high$"
  match_examples:
  - name: generated direct match
    code: |
      use embedded_hal;
      use embedded_hal;
      use embedded_hal::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          obj.is_high(target);
      }
  - name: output pin set_high negative
    code: |
      use embedded_hal::dummy;
      fn example() {
          obj.set_high();
      }
    expect_no_match: true
  description: "InputPin::is_high - digital GPIO state from attached hardware."

  imports:
  - embedded_hal
