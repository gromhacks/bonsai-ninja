      regex: '(^|[.])args$'
  constraints:
  - max_args: 0
  - receiver_type_in: [Context]
  match_examples:
  - name: async graphql context args
    code: |
      use async_graphql::Context;
      fn resolver(ctx: &Context) {
          ctx.args();
      }
  - name: non graphql args helper negative
    code: |
      use async_graphql::Context;
      struct Helper;
      impl Helper {
          fn args(&self) {}
      }
      fn helper(ctx: &Helper) {
          ctx.args();
      }
    expect_no_match: true
  description: "async-graphql Context::args() - resolver arguments supplied by the GraphQL caller. Receiver type is required so generic args() helpers stay clean."
