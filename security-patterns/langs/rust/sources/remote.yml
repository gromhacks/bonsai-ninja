          let query = "user";
          headers::get(target);
      }
  - name: unrelated map insert negative
    code: |
      use hyper::dummy;
      fn example() {
          headers::insert("X-Trace", "1");
      }
    expect_no_match: true
  description: "HeaderMap::get(name) - attacker-controlled HTTP header value; sink-side risk is header-reflection XSS / log-injection / SSRF (Host, X-Forwarded-For)."
