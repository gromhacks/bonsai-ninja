  - async_graphql
  match:
    kind: call
    callee:
      regex: '(^|[.])args$'
  constraints:
  - max_args: 0
  - receiver_type_in: [Context, "async_graphql::Context"]
  match_examples:
  - name: async graphql context args
    code: |
      use async_graphql::Context;
      fn resolver(ctx: &Context) {
          ctx.args();
      }
  - name: non graphql args helper negative
    code: |
      use async_graphql::Context;
      struct Helper;
      impl Helper {
          fn args(&self) {}
      }
      fn helper(ctx: &Helper) {
          ctx.args();
      }
    expect_no_match: true
  description: "async-graphql Context::args() - resolver arguments supplied by the GraphQL caller. Receiver type is required so generic args() helpers stay clean."

- id: rust.tide.request_route_value
  enabled: true
  language: rust
  trust: remote
  tag: http-input
  payload_types: [path, query]
  frameworks: [tide]
  packages: [tide]
  match:
    kind: call
    callee:
      regex: '(^|[.])(param|query)$'
  constraints:
  - receiver_type_in: [Request, "tide::Request"]
  - max_args: 1
  match_examples:
  - name: tide route parameter
    code: |
      use tide::Request;
      fn handler(req: Request<()>) {
          let _ = req.param("id");
      }
    expect_match_text: [req.param]
  - name: local request query helper is not input
    code: |
      use tide::Request;
      struct LocalRequest;
      impl LocalRequest { fn query(&self) -> String { String::new() } }
      fn helper(req: &LocalRequest) { let _ = req.query(); }
    expect_no_match: true
  description: "Tide Request route-parameter and typed-query accessors return values decoded from the inbound HTTP request."

- id: rust.tide.request_body_value
  enabled: true
  language: rust
  trust: remote
  tag: http-input
  payload_types: [text, json]
  frameworks: [tide]
  packages: [tide]
  match:
    kind: call
    callee:
      regex: '(^|[.])(body_string|body_json)$'
  constraints:
  - receiver_type_in: [Request, "tide::Request"]
  - max_args: 0
  match_examples:
  - name: tide request body text
    code: |
      use tide::Request;
      async fn handler(mut req: Request<()>) {
          let _ = req.body_string().await;
      }
    expect_match_text: [req.body_string]
  - name: local body renderer is not input
    code: |
      use tide::Request;
      struct Document;
      impl Document { fn body_string(&self) -> String { String::new() } }
      fn helper(doc: &Document) { let _ = doc.body_string(); }
    expect_no_match: true
  description: "Tide Request body_string/body_json decode the remote request entity as text or JSON."

- id: rust.salvo.request_value
  enabled: true
  language: rust
  trust: remote
  tag: http-input
  payload_types: [path, query, form, json]
  frameworks: [salvo]
  packages: [salvo]
  imports: ["salvo::http"]
  match:
    kind: call
    callee:
      regex: '(^|[.])(query|form|param|payload|parse_json)$'
  constraints:
  - receiver_type_in: [Request, "salvo::http::Request"]
  - max_args: 1
  match_examples:
  - name: salvo query value
    code: |
      use salvo::http::Request;
      async fn handler(req: &mut Request) {
          let _: Option<String> = req.query("q");
      }
    expect_match_text: [req.query]
  - name: local query helper is not request input
    code: |
      use salvo::http::Request;
      struct Store;
      impl Store { fn query(&self, key: &str) -> String { key.into() } }
      fn helper(store: &Store) { let _ = store.query("q"); }
    expect_no_match: true
  description: "Salvo Request query/form/path/body decoders return values supplied by the inbound HTTP request."

- id: rust.ntex.extractor_param
  enabled: true
  language: rust
  trust: remote
  tag: http-input
  payload_types: [query, json, path]
  frameworks: [ntex]
  packages: [ntex, ntex-web]
  match:
    kind: param
    target:
      regex: '^[A-Za-z_][A-Za-z0-9_]*$'
      param_type_in: [Query, "ntex::web::types::Query", Json, "ntex::web::types::Json", Path, "ntex::web::types::Path"]
  match_examples:
  - name: ntex destructured query extractor
    code: |
      use ntex::web::types::Query;
      struct Params { q: String }
      async fn handler(Query(params): Query<Params>) { let _ = params.q; }
    expect_match_text: [params]
  - name: ordinary ntex handler parameter is not an extractor
    code: |
      use ntex::web::types::Query;
      async fn handler(params: String) { let _ = params; }
    expect_no_match: true
  description: "ntex-web Query/Json/Path extractor parameters, including destructured tuple-struct patterns, carry request data into a handler."
