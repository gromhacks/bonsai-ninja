- id: rust.axum.multipart_field_file_name
  enabled: true
  language: rust
  trust: remote
  tag: http-input
  payload_types: [path]
  frameworks: [axum]
  packages: [axum]
  match:
    kind: call
    callee:
      name: file_name
  constraints:
  - max_args: 0
  - receiver_type_in: [Field, "axum::extract::multipart::Field"]
  match_examples:
  - name: axum multipart field file name
    code: |
      use axum::extract::multipart::Field;
      fn example(field: Field<'_>) {
          field.file_name();
      }
    expect_match_text: [field.file_name]
  - name: same method on local field negative
    code: |
      use axum::extract::multipart::Field;
      struct LocalField;
      impl LocalField { fn file_name(&self) -> &str { "safe" } }
      fn example(field: LocalField) { field.file_name(); }
    expect_no_match: true
  description: "axum multipart Field::file_name() - client-controlled Content-Disposition filename; taints path/file-upload sinks."
