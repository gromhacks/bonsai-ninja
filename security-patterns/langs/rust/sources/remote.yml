- id: rust.tokio.async_read
  enabled: false
  disabled_reason:
    code: over-broad
  language: rust
  trust: remote
  tag: socket-input
  payload_types: [binary]
  frameworks: [tokio]
  packages: [tokio]
  match:
    kind: call
    callee:
      attribute: [AsyncReadExt, read]
  description: "Disabled — `AsyncReadExt::read` covers both untrusted sockets and trusted local files; default-on would over-fire on every file/byte read. Enable for TCP/UDP-handler audits where the reader is known to be a network socket."
