# Rust HTTP / RPC remote-input sources.
# Web-framework extractors - actix-web, axum, warp, rocket, hyper.
- id: rust.actix.web_query
  enabled: true
  language: rust
  trust: remote
  tag: http-input
  payload_types: [query]
  frameworks: [actix-web]
  packages: ["actix_web"]
  manifests: [Cargo.toml]
  lockfiles: [Cargo.lock]
  match:
    kind: call
    callee:
      attribute: [actix_web, web, Query]
  match_examples:
  - name: generated direct match
    code: |
      use actix_web;
      use actix_web;
      use actix_web::dummy;
      fn example() {
          let target = "tainted";
          let query = "user";
          actix_web::web::Query(target);
      }
  description: "actix_web::web::Query<T> extractor - parses querystring into T."
  imports:
  - actix_web
