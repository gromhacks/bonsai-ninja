# Rust HTTP / RPC remote-input sources.
# Web-framework extractors - actix-web, axum, warp, rocket, hyper.
- id: rust.actix.web_query
  enabled: true
  language: rust
  trust: remote
  tag: http-input
  payload_types: [query]
  frameworks: [actix-web]
  packages: ["actix_web"]
  manifests: [Cargo.toml]
  lockfiles: [Cargo.lock]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      param_type_in: [Query, actix_web::web::Query]
  match_examples:
  - name: actix typed query extractor parameter
    code: |
      use actix_web::web;
      async fn handler(query: web::Query<String>) { let _ = query; }
    expect_match_text: [query]
  - name: same binding wrong type negative
    code: |
      use actix_web::web;
      async fn helper(query: String) { let _ = query; }
    expect_no_match: true
  description: "actix_web::web::Query<T> handler parameter contains the parsed request query string."
  imports:
  - actix_web
