  description: "actix_multipart ContentDisposition::get_filename() - client-controlled multipart filename; taints path/file-upload sinks."
- id: rust.warp.filter_callback_inline
  enabled: true
  language: rust
  trust: remote
  tag: http-input
  payload_types: [query, json, form, header, cookie, path]
  frameworks: [warp]
  packages: [warp]
  match:
    kind: call
    callee:
      regex: '[.](and_then|map)$'
  constraints:
  - receiver_matches_regex: '(^|.*[^A-Za-z0-9_])warp::(query|header|cookie|path::param|body::(json|form|bytes))([:<(.]|$)'
  - arg_is_inline_callback: 0
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 0
      source_param_indices_from: 0
  match_examples:
  - name: inline composed warp filter callback
    code: |
      use std::collections::HashMap;
      use warp::Filter;
      fn route() {
          let _ = warp::path("items")
              .and(warp::query::<HashMap<String, String>>())
              .and_then(|query| async move { consume(query) });
      }
      fn consume<T>(_: T) {}
  - name: warp filter construction alone is not source data
    code: |
      use std::collections::HashMap;
      use warp::Filter;
      fn route() { let _ = warp::query::<HashMap<String, String>>(); }
    expect_no_match: true
  description: "Inline Warp filter compositions deliver all compiler-declared callback parameters from remote request extractors. Filter descriptor results remain clean."

- id: rust.warp.filter_callback_typed
  enabled: true
  language: rust
  trust: remote
  tag: http-input
  payload_types: [query, json, form, header, cookie, path]
  frameworks: [warp]
  packages: [warp]
  match:
    kind: call
    callee:
      regex: '[.](and_then|map)$'
  constraints:
  - receiver_type_in: [WarpFilter]
  - receiver_not_matches_regex: '(^|.*[^A-Za-z0-9_])warp::(query|header|cookie|path::param|body::(json|form|bytes))([:<(.]|$)'
  - arg_is_inline_callback: 0
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 0
      source_param_indices_from: 0
  match_examples:
  - name: assigned typed warp filter callback
    code: |
      use std::collections::HashMap;
      use warp::Filter;
      fn route() {
          let input = warp::query::<HashMap<String, String>>();
          let _ = input.and_then(|query| async move { consume(query) });
      }
      fn consume<T>(_: T) {}
  - name: local and_then receiver negative
    code: |
      use warp::Filter;
      struct Local;
      impl Local { fn and_then<F>(&self, callback: F) {} }
      fn route(local: Local) { local.and_then(|value| consume(value)); }
      fn consume<T>(_: T) {}
    expect_no_match: true
  description: "Assigned Warp filter values retain rulepack-declared WarpFilter type through exact factory/method-result fixed points; their callback parameters are remote request input."
