# Local CLI / environment / Mix task sources. System.argv, IO.gets,
# Mix task args are `trust: local` (attacker-local); System.get_env /
# Application.get_env are `trust: config` (whoever set the env var).
- id: elixir.cli.argv
  enabled: true
  language: elixir
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      attribute: [System, argv]
  match_examples:
    - name: declared shape
      code: |
        defmodule App do
          def test(input) do
            System.argv(input)
          end
        end
  description: "System.argv/0 - command-line arguments passed to the VM; whoever launched the BEAM controls these."

- id: elixir.cli.io_gets
  enabled: true
  language: elixir
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      attribute: [IO, gets]
  match_examples:
    - name: declared shape
      code: |
        defmodule App do
          def test(input) do
            IO.gets(input)
          end
        end
  description: "IO.gets/1 - interactive stdin line (blocking read)."

- id: elixir.cli.io_read
  enabled: true
  language: elixir
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      attribute: [IO, read]
  match_examples:
    - name: declared shape
      code: |
        defmodule App do
          def test(input) do
            IO.read(input)
          end
        end
  description: "IO.read/2 - reads from a device (stdin by default)."

- id: elixir.cli.mix_task_args
  enabled: false
  disabled_reason:
    code: over-broad
  language: elixir
  trust: local
  tag: local-input
  payload_types: [text]
  frameworks: [mix]
  match:
    kind: param
    target:
      name: args
  description: "Disabled duplicate - bare `param name: args` is covered by elixir.absinthe.resolver_args; System.argv/0 remains the precise CLI source."

- id: elixir.config.system_get_env
  enabled: true
  language: elixir
  trust: config
  tag: config-input
  payload_types: [text]
  match:
    kind: call
    callee:
      attribute: [System, get_env]
  match_examples:
    - name: declared shape
      code: |
        defmodule App do
          def test(input) do
            System.get_env(input)
          end
        end
  description: "System.get_env/1,2 - process environment variable; config-trust (same process set it, but still external input)."

- id: elixir.config.application_get_env
  enabled: true
  language: elixir
  trust: config
  tag: config-input
  payload_types: [text]
  match:
    kind: call
    callee:
      attribute: [Application, get_env]
  match_examples:
    - name: declared shape
      code: |
        defmodule App do
          def test(input) do
            Application.get_env(input)
          end
        end
  description: "Application.get_env/3 - Elixir app config (config/*.exs + runtime.exs); origin is releases/deployers."

- id: elixir.config.application_fetch_env
  enabled: true
  language: elixir
  trust: config
  tag: config-input
  payload_types: [text]
  match:
    kind: call
    callee:
      attribute: [Application, fetch_env!]
  match_examples:
    - name: declared shape
      code: |
        defmodule App do
          def test(input) do
            Application.fetch_env!(input)
          end
        end
  description: "Application.fetch_env!/2 - same origin as get_env/3 but raises on missing."
