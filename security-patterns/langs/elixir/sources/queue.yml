  imports:
  - Broadway
- id: elixir.oban.job_args
  enabled: true
  language: elixir
  trust: service
  tag: queue-input
  payload_types: [json]
  packages: [oban]
  match:
    kind: read
    target:
      attribute: [job, args]
  match_examples:
  - name: oban job args read
    code: |
      use Oban.Worker
      defmodule MyWorker do
        def perform(job) do
          a = job.args
          a
        end
      end
  description: "Oban.Job.args - job payload read via `job.args` field access in a worker's perform/1."

  imports:
  - Oban

