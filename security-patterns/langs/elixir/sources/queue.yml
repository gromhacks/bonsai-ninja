  - Gen_stage
- id: elixir.amqp.basic_deliver
  enabled: false
  disabled_reason:
    code: over-broad
  language: elixir
  trust: service
  tag: queue-input
  payload_types: [queue-message]
  packages: [amqp]
  match:
    kind: param
    target:
      name: payload
  match_examples:
  - name: declared shape
    code: |
      alias Amqp
      defmodule App do
        def handle(payload) do
          payload
        end
      end
  description: "Disabled - duplicate bare `payload` parameter shape with elixir.phoenix.channel_handle_in under the current matcher."

  imports:
  - Amqp
- id: elixir.bandit.handle_data
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [binary]
  packages: [bandit]
  match:
    kind: param
    target:
      regex: "^[a-z_][A-Za-z0-9_]*$"
      in_method: [handle_data]
      param_index_in: [0]
      param_count_in: [2]
  match_examples:
  - name: declared shape
    code: |
      alias Bandit
      defmodule App do
        def handle_data(data, state) do
          data
        end
      end
  description: "First parameter of Bandit/WebSock handle_data/2 - peer bytes proven by callback name, arity, and position."
  imports:
  - Bandit
