# Async queue / pipeline sources. All marked `trust: service` - the
# queue operator is semi-trusted but the payload itself often
# originates from an external caller that eventually becomes a
# message.
- id: elixir.broadway.message
  enabled: true
  language: elixir
  trust: service
  tag: queue-input
  payload_types: [queue-message]
  frameworks: [broadway]
  packages: [broadway]
  match:
    kind: param
    target:
      regex: "^[a-z_][A-Za-z0-9_]*$"
      in_method: [handle_message]
      param_index_in: [1]
      param_count_in: [3]
  match_examples:
  - name: declared shape
    code: |
      alias Broadway
      defmodule App do
        def handle_message(_processor, message, context) do
          message
        end
      end
  description: "Second parameter of Broadway handle_message/3 - queue message proven by callback name, arity, and position."

  imports:
  - Broadway
- id: elixir.broadway.batch_messages
  enabled: true
  language: elixir
  trust: service
  tag: queue-input
  payload_types: [queue-message]
  frameworks: [broadway]
  packages: [broadway]
  match:
    kind: param
    target:
      regex: "^[a-z_][A-Za-z0-9_]*$"
      in_method: [handle_batch]
      param_index_in: [1]
      param_count_in: [4]
  match_examples:
  - name: declared shape
    code: |
      alias Broadway
      defmodule App do
        def handle_batch(_batcher, messages, _info, context) do
          messages
        end
      end
  description: "Second parameter of Broadway handle_batch/4 - batch of queue messages proven by callback name, arity, and position."

  imports:
  - Broadway
- id: elixir.oban.job_args
  enabled: true
  language: elixir
  trust: service
  tag: queue-input
  payload_types: [json]
  packages: [oban]
  match:
    kind: read
    target:
      attribute: [job, args]
  match_examples:
  - name: oban job args read
    code: |
      use Oban.Worker
      defmodule MyWorker do
        def perform(job) do
          a = job.args
          a
        end
      end
  description: "Oban.Job.args - job payload read via `job.args` field access in a worker's perform/1."

  imports:
  - Oban

- id: elixir.oban.worker_perform
  enabled: true
  language: elixir
  trust: service
  tag: queue-input
  payload_types: [json]
  packages: [oban]
  match:
    kind: param
    target:
      regex: "^[a-z_][A-Za-z0-9_]*$"
      in_method: [perform]
      param_index_in: [0]
      param_count_in: [1]
  match_examples:
  - name: declared shape
    code: |
      alias Oban
      defmodule App do
        def perform(job) do
          job
        end
      end
  description: "First parameter of Oban.Worker perform/1 - job payload proven by callback name, arity, and position."

  imports:
  - Oban
