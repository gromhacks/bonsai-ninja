- id: elixir.amqp.basic_deliver
  enabled: false
  disabled_reason:
    code: over-broad
  language: elixir
  trust: service
  tag: queue-input
  payload_types: [queue-message]
  packages: [amqp]
  match:
    kind: param
    target:
      name: payload
  match_examples:
  - name: declared shape
    code: |
      alias Amqp
      defmodule App do
        def handle(payload) do
          payload
        end
      end
  description: "Disabled — duplicate bare `payload` parameter shape with elixir.phoenix.channel_handle_in under the current matcher."

  imports:
  - Amqp
- id: elixir.bandit.handle_data
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [binary]
  packages: [bandit]
  match:
    kind: param
    target:
      name: data
  match_examples:
  - name: declared shape
    code: |
      alias Bandit
      defmodule App do
        def handle(data) do
          data
        end
      end
  description: "Bandit/Cowboy raw socket handler — `handle_data/handle_info` `data` parameter carries unparsed bytes from the peer. Bare-name match on `data`."
  imports:
  - Bandit
