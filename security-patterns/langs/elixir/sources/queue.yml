# Async queue / pipeline sources. All marked `trust: service` - the
# queue operator is semi-trusted but the payload itself often
# originates from an external caller that eventually becomes a
# message.
- id: elixir.broadway.message
  enabled: true
  language: elixir
  trust: service
  tag: queue-input
  payload_types: [queue-message]
  frameworks: [broadway]
  packages: [broadway]
  match:
    kind: param
    target:
      regex: "^[a-z_][A-Za-z0-9_]*$"
      in_method: [handle_message]
      param_index_in: [1]
      param_count_in: [3]
  match_examples:
  - name: declared shape
    code: |
      alias Broadway
      defmodule App do
        def handle_message(_processor, message, context) do
          message
        end
      end
  - name: same arity outside the Broadway callback is not a message boundary
    code: |
      alias Broadway
      defmodule App do
        def deliver(_processor, message, context) do
          {message, context}
        end
      end
    expect_no_match: true
  description: "Second parameter of Broadway handle_message/3 - queue message proven by callback name, arity, and position."

  imports:
  - Broadway
- id: elixir.broadway.batch_messages
  enabled: true
  language: elixir
  trust: service
  tag: queue-input
  payload_types: [queue-message]
  frameworks: [broadway]
