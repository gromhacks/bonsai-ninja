# Phoenix / Plug / Absinthe / LiveView HTTP + socket request sources.
# Every enabled rule MUST have `trust:` - without it the security
# dataflow ranker can't tell attacker input apart from service or local
# input. All of these are `trust: remote`.
- id: elixir.phoenix.params
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query, json]
  frameworks: [phoenix]
  match:
    kind: param
    target:
      param_index_in: [1]
      param_count_in: [2]
      in_owner_base: [use_arg_controller]
  match_examples:
  - name: named Phoenix controller params
    code: |
      defmodule App do
        use Web, :controller
        def show(conn, params) do
          params
        end
      end
  - name: destructured Phoenix controller params
    code: |
      defmodule App do
        use Web, :controller
        def show(conn, %{"id" => id}) do
          id
        end
      end
  - name: controller callback with a different arity is not a Phoenix action boundary
    code: |
      defmodule App do
        use Web, :controller
        def show(conn, params, context) do
          {conn, params, context}
        end
      end
    expect_no_match: true
  - name: same callback shape outside a controller owner is not Phoenix params
    code: |
      defmodule Worker do
        use Jobs, :worker
        def show(conn, params) do
          {conn, params}
        end
      end
    expect_no_match: true
  description: "Second parameter on an Elixir module that explicitly declares the `use _, :controller` role - merged route, query, and body input. The adapter supplies only the parsed owner-role fact; Phoenix meaning remains rule data."
- id: elixir.plug.conn_params_read
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: read
    target:
      attribute: [conn, params]
  match_examples:
  - name: plug conn params read
    code: |
      alias Plug
      defmodule App do
        def handle(conn) do
          p = conn.params
          p
        end
      end
  description: "Plug.Conn.params - merged path/query/body params read via `conn.params` field access."

  imports:
  - Plug

# Bare-name `conn` source on Plug.Conn. Distinct ID from the read-
# shape rule above so the param-shape match (which the elixir adapter
# emits for function parameters) provides cross-fn coverage of the
# `conn.params["body"]` access pattern via the parameter identifier.
- id: elixir.plug.query_params_read
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: read
    target:
      attribute: [conn, query_params]
  match_examples:
  - name: plug conn query params read
    code: |
      alias Plug
      defmodule App do
        def handle(conn) do
          q = conn.query_params
          q
        end
      end
  description: "Plug.Conn.query_params - parsed query-string params read via `conn.query_params` field access."

  imports:
  - Plug

