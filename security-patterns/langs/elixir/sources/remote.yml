  match_examples:
  - name: plug conn query params read
    code: |
      alias Plug
      defmodule App do
        def handle(conn) do
          q = conn.query_params
          q
        end
      end
  description: "Plug.Conn.query_params - parsed query-string params read via `conn.query_params` field access."

  imports:
  - Plug

