        end
      end
  description: "Disabled - URI.query_decoder/1,2 lazily transforms the value supplied by its caller and must retain, not invent, provenance."

- id: elixir.phoenix.channel_handle_in
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [json]
  frameworks: [phoenix]
  packages: [phoenix]
  match:
    kind: param
    target:
      regex: "^[a-z_][A-Za-z0-9_]*$"
      in_method: [handle_in]
      param_index_in: [1]
      param_count_in: [3]
  match_examples:
  - name: declared shape
    code: |
      alias Phoenix
      defmodule App do
        def handle_in(event, payload, socket) do
          payload
        end
      end
  description: "Second parameter of Phoenix.Channel handle_in/3 - client message payload proven by callback name, arity, and position."

  imports:
  - Phoenix
- id: elixir.phoenix.liveview_handle_event
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [json]
  frameworks: [phoenix_live_view]
  packages: [phoenix_live_view]
  match:
    kind: param
    target:
      regex: "^[a-z_][A-Za-z0-9_]*$"
      in_method: [handle_event]
      param_index_in: [1]
      param_count_in: [3]
  match_examples:
  - name: LiveView event payload
    code: |
      alias Phoenix.LiveView
      defmodule PageLive do
        use Phoenix.LiveView
        def handle_event(event, payload, socket) do
          {:noreply, socket}
        end
      end
    expect_match_text: [payload]
  - name: wrong callback arity negative
    code: |
      alias Phoenix.LiveView
      defmodule PageLive do
        use Phoenix.LiveView
        def handle_event(payload, socket), do: {:noreply, socket}
      end
    expect_no_match: true
  description: "Second parameter of Phoenix LiveView handle_event/3 - client-supplied event payload."
  imports: [Phoenix.LiveView]

- id: elixir.phoenix.liveview_handle_params
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query, url]
  frameworks: [phoenix_live_view]
  packages: [phoenix_live_view]
  match:
    kind: param
    target:
      regex: "^[a-z_][A-Za-z0-9_]*$"
      in_method: [handle_params]
      param_index_in: [0, 1]
      param_count_in: [3]
  match_examples:
  - name: LiveView params and URI
    code: |
      alias Phoenix.LiveView
      defmodule PageLive do
        use Phoenix.LiveView
        def handle_params(params, uri, socket) do
          {:noreply, socket}
        end
      end
    expect_match_text: [params, uri]
  - name: helper with different name is not LiveView input
    code: |
      alias Phoenix.LiveView
      defmodule PageLive do
        use Phoenix.LiveView
        def normalize(params, uri, socket), do: {params, uri, socket}
      end
    expect_no_match: true
  description: "First two parameters of Phoenix LiveView handle_params/3 - URL parameters and URI supplied by the client navigation."
  imports: [Phoenix.LiveView]

- id: elixir.absinthe.resolver_args
  enabled: true
  language: elixir
  trust: remote
  tag: graphql-input
  payload_types: [graphql, json]
  frameworks: [absinthe]
  packages: [absinthe]
  match:
    kind: param
    target:
      regex: "^[a-z_][A-Za-z0-9_]*$"
      in_method: [resolve]
      param_index_in: [1]
      param_count_in: [3]
  match_examples:
  - name: absinthe resolver args
    code: |
      alias Absinthe
      defmodule App do
        def resolve(parent, args, resolution) do
          args
        end
      end
  - name: non resolver args helper negative
    code: |
      alias Absinthe
      defmodule App do
        def helper(parent, args, resolution) do
          args
        end
      end
    expect_no_match: true
  description: "Second parameter of an Absinthe resolve/3 callback - GraphQL caller-supplied arguments, selected by method, arity, and position rather than a conventional binding name."
  imports:
  - Absinthe

- id: elixir.plug.request_metadata
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [text, url, query]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: read
    target:
      regex: '^[A-Za-z_][A-Za-z0-9_]*\.(host|method|path_info|path_params|request_path|query_string|remote_ip|scheme)$'
  match_examples:
  - name: Plug request path
    code: |
      alias Plug.Conn
      defmodule App do
        def path(conn), do: conn.request_path
      end
    expect_match_text: [conn.request_path]
  - name: response status is not request input
    code: |
      alias Plug.Conn
      defmodule App do
        def status(conn), do: conn.status
      end
    expect_no_match: true
  description: "Selected Plug.Conn request metadata fields - authority, method, route/query path data, scheme, and peer address supplied by the HTTP connection."
  imports: [Plug]

- id: elixir.plug.request_accessors
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [binary, header, url, ip]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: call
    callee:
      regex: '^Plug\.Conn\.(get_peer_data|request_url|read_part_body|read_part_headers)$'
  match_examples:
  - name: Plug multipart body read
    code: |
      alias Plug.Conn
      defmodule App do
        def part(conn), do: Plug.Conn.read_part_body(conn)
      end
    expect_match_text: [Plug.Conn.read_part_body]
  - name: response header setter is not input
    code: |
      alias Plug.Conn
      defmodule App do
        def set(conn), do: Plug.Conn.put_resp_header(conn, "x", "local")
      end
    expect_no_match: true
  description: "Exact Plug.Conn accessors that return peer, URL, or multipart request data."
  imports: [Plug]
