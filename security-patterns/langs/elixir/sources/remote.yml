# Phoenix / Plug / Absinthe / LiveView HTTP + socket request sources.
# Every enabled rule MUST have `trust:` — without it the security
# dataflow ranker can't tell attacker input apart from service or local
# input. All of these are `trust: remote`.
- id: elixir.phoenix.params
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query, json]
  frameworks: [phoenix]
  packages: [phoenix]
  manifests: [mix.exs]
  match:
    kind: param
    target:
      name: params
  match_examples:
  - name: declared shape
    code: |
      alias Phoenix
      defmodule App do
        def handle(params) do
          params
        end
      end
  description: "Phoenix.Controller action `params` — second arg of every controller `action(conn, params)`; carries merged route/query/body params. Bare-name match: also fires on any other function with a `params` parameter."

  imports:
  - Phoenix
- id: elixir.phoenix.conn_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [json, query]
  frameworks: [phoenix, plug]
  packages: [plug]
  match:
    kind: param
    target:
      name: conn
  description: "Disabled — whole Plug.Conn taints too broadly without field-sensitive conn access tracking; params/read_body/header accessors stay enabled."

- id: elixir.plug.conn_params_read
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query]
  frameworks: [plug]
  match:
    kind: read
    target:
      name: params
  description: "Disabled — current Elixir adapter does not emit property-read facts for `conn.params`; Phoenix `params` parameter rules cover the common source shape."

# Bare-name `params` source on Plug.Conn. Distinct ID from the read-
# shape rule above so the param-shape match (which the elixir adapter
# DOES emit on bare receivers) provides cross-fn coverage of the
# `conn.params["body"]` access pattern via the param identifier.
- id: elixir.source.plug_conn_params
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query, json]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: param
    target:
      name: conn
  match_examples:
  - name: declared shape
    code: |
      alias Plug
      defmodule App do
        def handle(conn) do
          conn
        end
      end
  description: "Plug action `conn` parameter — first arg of every Plug callback. Bare-name match: also fires on any other function with a `conn` parameter; treat findings on non-Plug modules as audit hints. Used to seed `conn.params[...]` access flows that the read-shape rule cannot model."

  imports:
  - Plug
