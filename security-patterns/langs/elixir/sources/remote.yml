- id: elixir.plug.get_session
  enabled: true
  language: elixir
  trust: service
  tag: token-input
  category: session-input
  payload_types: [cookie]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: call
    callee:
      attribute: [Plug, Conn, get_session]
  match_examples:
  - name: declared shape
    code: |
      alias Plug
      defmodule App do
        def test(input) do
          Plug.Conn.get_session(input)
        end
      end
  - name: Plug session write is not an input source
    code: |
      alias Plug
      defmodule App do
        def store(conn), do: Plug.Conn.put_session(conn, "role", "local")
      end
    expect_no_match: true
  - name: Plug session population is not the session value boundary
    code: |
      alias Plug
      defmodule App do
        def load(conn), do: Plug.Conn.fetch_session(conn)
      end
    expect_no_match: true
  description: "Plug.Conn.get_session/2 - application session state loaded through the configured cookie/store; a service/session boundary rather than raw request input."

  imports:
  - Plug
