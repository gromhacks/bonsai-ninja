- id: elixir.plug.fetch_query_params
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: elixir.plug.query_params_read
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: call
    callee:
      attribute: [Plug, Conn, fetch_query_params]
  description: "Subsumed by elixir.plug.query_params_read: fetch_query_params/2 only populates conn.query_params, which is now seeded precisely as a `conn.query_params` read source. The whole-conn return taint this rule needed would over-taint unrelated conn fields."

  imports:
  - Plug
- id: elixir.plug.fetch_cookies
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: elixir.plug.cookies_read
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [cookie]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: call
    callee:
      attribute: [Plug, Conn, fetch_cookies]
  description: "Subsumed by elixir.plug.cookies_read: fetch_cookies/2 only populates conn.cookies/req_cookies, now seeded precisely as a `conn.cookies` read source. Whole-conn return taint would over-taint unrelated conn fields."

  imports:
  - Plug
- id: elixir.plug.fetch_session
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [cookie]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: call
    callee:
      attribute: [Plug, Conn, fetch_session]
  match_examples:
  - name: declared shape
    code: |
      alias Plug
      defmodule App do
        def test(input) do
          Plug.Conn.fetch_session(input)
        end
      end
  description: "Disabled - this returns a Plug.Conn with request-derived session fields, but field-insensitive return taint over-taints unrelated conn fields. Re-enable when session field reads can be seeded precisely."

  imports:
  - Plug
- id: elixir.plug.get_session
  enabled: true
  language: elixir
  trust: service
  tag: token-input
  category: session-input
  payload_types: [cookie]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: call
    callee:
      attribute: [Plug, Conn, get_session]
  match_examples:
  - name: declared shape
    code: |
      alias Plug
      defmodule App do
        def test(input) do
          Plug.Conn.get_session(input)
        end
      end
  - name: Plug session write is not an input source
    code: |
      alias Plug
      defmodule App do
        def store(conn), do: Plug.Conn.put_session(conn, "role", "local")
      end
    expect_no_match: true
  description: "Plug.Conn.get_session/2 - application session state loaded through the configured cookie/store; a service/session boundary rather than raw request input."

  imports:
  - Plug
