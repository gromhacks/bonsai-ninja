- id: elixir.uri_decode_query
  enabled: false
  disabled_reason:
    code: over-broad
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query]
  match:
    kind: call
    callee:
      attribute: [URI, decode_query]
  match_examples:
  - name: uri decode query
    code: |
      defmodule App do
        def test(input) do
          URI.decode_query(input)
        end
      end
  - name: uri encode_query negative
    code: |
      defmodule App do
        def test(input) do
          URI.encode_query(input)
        end
      end
    expect_no_match: true
  description: "Disabled - URI.decode_query/1,2 parses arbitrary strings, including constants and trusted configuration. It is a passthrough transform, not an origin."

