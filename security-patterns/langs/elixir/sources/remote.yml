- id: elixir.plug.fetch_query_params
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: call
    callee:
      attribute: [Plug, Conn, fetch_query_params]
  match_examples:
  - name: declared shape
    code: |
      alias Plug
      defmodule App do
        def test(input) do
          Plug.Conn.fetch_query_params(input)
        end
      end
  description: "Plug.Conn.fetch_query_params/2 — parses the raw query string into conn.query_params; the returned conn carries attacker-controlled query data."

  imports:
  - Plug
