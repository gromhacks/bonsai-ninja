# Phoenix / Plug / Absinthe / LiveView HTTP + socket request sources.
# Every enabled rule MUST have `trust:` - without it the security
# dataflow ranker can't tell attacker input apart from service or local
# input. All of these are `trust: remote`.
- id: elixir.phoenix.params
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query, json]
  frameworks: [phoenix]
  packages: [phoenix]
  manifests: [mix.exs]
  match:
    kind: param
    target:
      name: params
      param_index_in: [1]
      param_count_in: [2]
  match_examples:
  - name: declared shape
    code: |
      alias Phoenix
      defmodule App do
        def show(conn, params) do
          params
        end
      end
  description: "Second parameter named params on a Phoenix controller action(conn, params) - merged route, query, and body input."

  imports:
  - Phoenix
- id: elixir.phoenix.conn_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [json, query]
  frameworks: [phoenix, plug]
  packages: [plug]
  match:
    kind: param
    target:
      name: conn
  description: "Disabled - whole Plug.Conn taints too broadly without field-sensitive conn access tracking; params/read_body/header accessors stay enabled."

- id: elixir.plug.conn_params_read
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: read
    target:
      attribute: [conn, params]
  match_examples:
  - name: plug conn params read
    code: |
      alias Plug
      defmodule App do
        def handle(conn) do
          p = conn.params
          p
        end
      end
  description: "Plug.Conn.params - merged path/query/body params read via `conn.params` field access."

  imports:
  - Plug

# Bare-name `conn` source on Plug.Conn. Distinct ID from the read-
# shape rule above so the param-shape match (which the elixir adapter
# emits for function parameters) provides cross-fn coverage of the
# `conn.params["body"]` access pattern via the parameter identifier.
- id: elixir.source.plug_conn_params
  enabled: false
  disabled_reason:
    code: over-broad
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query, json]
  frameworks: [plug]
  packages: [plug]
  match:
    kind: param
    target:
      name: conn
  match_examples:
  - name: declared shape
    code: |
      alias Plug
      defmodule App do
        def handle(conn) do
          conn
        end
      end
  description: "Disabled - whole Plug.Conn taint is field-insensitive and over-taints safe config/control fields such as rewrite tuples. Re-enable only when the adapter can seed params/query/body/header field reads precisely."

  imports:
  - Plug
- id: elixir.plug.query_params_read
  enabled: true
  language: elixir
  trust: remote
  tag: http-input
  payload_types: [query]
  frameworks: [plug]
