# Cloud-service response sources. The Elixir Lambda runtimes configure their
# handler identity outside ordinary Elixir source, so a bare `event`/`payload`
# parameter is not a compiler-proven boundary. Exact SDK response calls are:
# their module owner and execution point are present in the parsed program.
- id: elixir.cloud.ex_aws_response
  enabled: true
  language: elixir
  trust: service
  tag: cloud-input
  category: cloud-input
  payload_types: [json, binary]
  frameworks: [ex_aws]
  packages: [ex_aws]
  imports: [ExAws]
  match:
    kind: call
    callee:
      regex: '^ExAws\.(request|request!|stream|stream!)$'
  constraints:
  - min_args: 1
  - max_args: 2
  match_examples:
  - name: ExAws service response
    code: |
      alias ExAws
      defmodule CloudReader do
        def load(operation), do: ExAws.request!(operation)
      end
    expect_match_text: [ExAws.request!]
  - name: aliased ExAws response in a pipeline
    code: |
      alias ExAws, as: Cloud
      defmodule CloudReader do
        def load(operation), do: operation |> Cloud.request!()
      end
    expect_match_text: [Cloud.request!]
  - name: ExAws operation constructor is not a response
    code: |
      alias ExAws
      defmodule CloudReader do
        def build(bucket, key), do: ExAws.S3.get_object(bucket, key)
      end
    expect_no_match: true
  - name: same tail on an unrelated module is not cloud input
    code: |
      alias ExAws
      defmodule CloudReader do
        def load(operation), do: LocalStore.request(operation)
      end
    expect_no_match: true
  description: "ExAws request/request!/stream/stream! - response data returned across an authenticated cloud-service boundary; operation constructors remain clean until executed."
