# Cloud runtime event sources. Lambda/CloudEvents invocation payloads
# are `trust: service` - a cloud service forwards data that frequently
# originated from an attacker (API Gateway -> Lambda, SNS -> Lambda).
- id: elixir.aws_lambda.handler_event
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: elixir
  trust: service
  tag: cloud-input
  payload_types: [json]
  match:
    kind: param
    target:
      name: event
  description: "Disabled - `handle(event)` is ordinary Elixir syntax and the rule has no runtime package, behavior, or callback-registration evidence tying it to Lambda."

- id: elixir.aws_lambda.handler_event_alt
  enabled: false
  disabled_reason:
    code: over-broad
  language: elixir
  trust: service
  tag: cloud-input
  payload_types: [json]
  match:
    kind: param
    target:
      name: payload
  description: "Disabled - a bare `payload` parameter has no Lambda runtime, behavior, or callback-registration evidence. Phoenix channel payloads are modeled separately by their exact handle_in/3 signature."
