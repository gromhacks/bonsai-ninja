# -- Ecto parameterised splice (^var) -------------------------------
# The `^expr` operator inside an Ecto query/fragment is what marks a
# value as a bound parameter. The matcher cannot see the `^` operator
# directly, but the Ecto.Query.dynamic/2 builder always parameterises
# its interpolations.
  imports:
  - Comeonin
- id: elixir.sanitizer.ecto_query_dynamic
  enabled: true
  language: elixir
  tag: sql-parameter
  packages: [ecto]
  match:
    kind: call
    callee:
      attribute: [Ecto, Query, dynamic]
  match_examples:
  - name: declared shape
    code: |
      alias Ecto
      defmodule App do
        def test(input) do
          Ecto.Query.dynamic(input)
        end
      end
    expect_match_text: [Ecto.Query.dynamic]
  description: "Ecto.Query.dynamic/2 — builds a composable WHERE clause; `^value` interpolations bind through the parameter
    engine instead of string-concat."

  imports:
  - Ecto
- id: elixir.sanitizer.string_starts_with_same_origin
  enabled: true
  language: elixir
  tag: same-origin-path
  match:
    kind: call
    callee:
      attribute: [String, "starts_with?"]
  constraints:
  - arg_matches_regex:
      index: 1
      regex: '^"/[^"]*"$'
  match_examples:
  - name: starts_with local path
    code: |
      defmodule App do
        def test(input) do
          String.starts_with?(input, "/app/")
        end
      end
    expect_match_text: ["String.starts_with?"]
  - name: starts_with local path negative constraint boundary
    code: "defmodule App do\n  def test(input) do\n    String.starts_with?()\n  end\nend\n"
    expect_no_match: true
  description: "String.starts_with?(input, \"/...\") — same-origin redirect/path guard for slash-rooted local paths."

- id: elixir.sanitizer.allowlist_member
  enabled: false
  language: elixir
  tag: allowlist-validate
  match:
    kind: call
    callee:
      regex: "^(Enum\\.member\\?|MapSet\\.member\\?|Map\\.has_key\\?)$"
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^(allowed|allowlist|whitelist|safe_values|safe_paths)$"
  match_examples:
  - name: enum member allowlist
    code: |
      defmodule App do
        def test(input) do
          Enum.member?(allowed, input)
        end
      end
    expect_match_text: ["Enum.member?"]
  - name: enum member allowlist negative constraint boundary
    code: "defmodule App do\n  def test(input) do\n    Enum.member?()\n  end\nend\n"
    expect_no_match: true
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    Enum.member?/MapSet.member?/Map.has_key? against an allowlist-named collection — validates membership in a finite accepted
    set."

  disabled_reason:
    code: over-broad
- id: elixir.sanitizer.regex_match_full
  enabled: true
  language: elixir
  tag: regex-validate
  match:
    kind: call
    callee:
      attribute: [Regex, "match?"]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^~r/\\^.*\\$/"
  match_examples:
  - name: anchored Regex.match?
    code: |
      defmodule App do
        def test(input) do
          Regex.match?(~r/^[a-z0-9_-]+$/, input)
        end
      end
    expect_match_text: ["Regex.match?"]
  - name: anchored Regex.match? negative constraint boundary
    code: "defmodule App do\n  def test(input) do\n    Regex.match?()\n  end\nend\n"
    expect_no_match: true
  description: "Regex.match? with an anchored full-string allowlist pattern — validates slug/UUID-style shape before downstream
    use."

- id: elixir.sanitizer.postgrex_query_bind
  enabled: true
  language: elixir
  tag: db-bind-parameter
  packages: [postgrex]
  match:
    kind: call
    callee:
      attribute: [Postgrex, query]
  constraints:
  - min_args: 3
  match_examples:
  - name: Postgrex parameter list
    code: |
      alias Postgrex
      defmodule App do
        def test(conn, input) do
          Postgrex.query(conn, "select * from users where name = $1", [input])
        end
      end
    expect_match_text: [Postgrex.query]
  description: "Postgrex.query(conn, sql, params) — sends a separate parameter list for $N placeholders instead of SQL concatenation."

  imports:
  - Postgrex
- id: elixir.sanitizer.string_replace_char_allowlist
  enabled: true
  language: elixir
  tag: char-allowlist
  match:
    kind: call
    callee:
      attribute: [String, replace]
  constraints:
  - any_arg_matches_regex: "\\[\\^[^\\]]+\\]"
  - any_arg_matches_regex: '^""$'
  match_examples:
  - name: strip non slug chars
    code: |
      defmodule App do
        def test(input) do
          String.replace(input, ~r/[^A-Za-z0-9_-]/, "")
        end
      end
    expect_match_text: [String.replace]
  - name: strip non slug chars negative constraint boundary
    code: "defmodule App do\n  def test(input) do\n    String.replace()\n  end\nend\n"
    expect_no_match: true
  description: "String.replace(input, ~r/[^safe]/, \"\") — strips characters outside a safe allowlist."

# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) — taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: elixir.passthrough.uri_decode
  enabled: true
  language: elixir
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [URI, decode]
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          URI.decode(input)
        end
      end
    expect_match_text: [URI.decode]
  description: "URI.decode(s) — preserves taint."
- id: elixir.passthrough.uri_decode_www_form
  enabled: true
  language: elixir
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [URI, decode_www_form]
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          URI.decode_www_form(input)
        end
      end
    expect_match_text: [URI.decode_www_form]
  description: "URI.decode_www_form(s) — preserves taint."

# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: elixir.csrf.plug_csrf_protection
  enabled: true
  language: elixir
  tag: csrf-protect
  match:
    kind: call
    callee:
      attribute: [Plug, CSRFProtection, call]
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          Plug.CSRFProtection.call(input)
        end
      end
    expect_match_text: [Plug.CSRFProtection.call]
  description: "Plug.CSRFProtection — Phoenix's default CSRF plug."
- id: elixir.csrf.protect_from_forgery
  enabled: true
  language: elixir
  tag: csrf-protect
  match:
    kind: call
    callee:
      name: protect_from_forgery
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          protect_from_forgery(input)
        end
      end
    expect_match_text: [protect_from_forgery]
  description: "Phoenix protect_from_forgery — controller CSRF enforcement."

# Cookie-secure sanitizers (T402). Cookie-set calls with
# httpOnly + secure flags are the SAFE shape; reviewer
# enumerates with `security sanitizers --tag cookie-secure`
# and audits routes that set cookies WITHOUT them.
- id: elixir.cookie.put_resp_cookie_with_secure
  enabled: true
  language: elixir
  tag: cookie-secure
  match:
    kind: call
    callee:
      attribute: [Plug, put_resp_cookie]
  constraints:
  - any_arg_matches_regex: |-
      http_only.*true|secure.*true
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          Plug.put_resp_cookie(http_only: true)
        end
      end
    expect_match_text: [Plug.put_resp_cookie]
  - name: declared shape negative constraint boundary
    code: "defmodule App do\n  def test(input) do\n    Plug.put_resp_cookie()\n  end\nend\n"
    expect_no_match: true
  description: "Plug.Conn.put_resp_cookie(conn, key, val, http_only: true, secure: true)."

# Rate-limit middleware presence sanitizers (round 2 fill).
- id: elixir.ratelimit.hammer_check_rate
  enabled: true
  language: elixir
  tag: rate-limit
  packages: [hammer]
  match:
    kind: call
    callee:
      attribute: [Hammer, check_rate]
  match_examples:
  - name: declared shape
    code: |
      alias Hammer
      defmodule App do
        def test(input) do
          Hammer.check_rate(input)
        end
      end
    expect_match_text: [Hammer.check_rate]
  description: 'Hammer.check_rate — Elixir rate-limit primitive.'
  imports:
  - Hammer
