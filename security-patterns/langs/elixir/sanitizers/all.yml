# Elixir sanitizers. Tag values follow the spec-canonical names
# (html-encode, html-sanitize, url-encode, shell-escape, sql-parameter,
# constant-time, jwt-verify, path-sanitize, xxe-sanitizer, ldap-escape,
# numeric-coerce, validation). Non-canonical tags are rejected by the
# pack audit.

# -- HTML ------------------------------------------------------------
- id: elixir.sanitizer.phoenix_html_html_escape
  enabled: true
  language: elixir
  tag: html-encode
  frameworks: [phoenix]
  packages: [phoenix_html]
  match:
    kind: call
    callee:
      regex: "^Phoenix\\.HTML\\.html_escape$"
  match_examples:
  - name: declared shape
    code: |
      alias Phoenix_html
      defmodule App do
        def test(input) do
          Phoenix.HTML.html_escape(input)
        end
      end
    expect_match_text: [Phoenix.HTML.html_escape]
  description: "Phoenix.HTML.html_escape/1 — escapes `<`, `>`, `&`, `\"`, `'` and returns a :safe tuple; neutralises reflected
    XSS in EEx/HEEx templates."

  imports:
  - Phoenix_html
- id: elixir.sanitizer.html_sanitize_ex_strip_tags
  enabled: true
  language: elixir
  tag: html-sanitize
  packages: [html_sanitize_ex]
  match:
    kind: call
    callee:
      attribute: [HtmlSanitizeEx, strip_tags]
  match_examples:
  - name: declared shape
    code: |
      alias Html_sanitize_ex
      defmodule App do
        def test(input) do
          HtmlSanitizeEx.strip_tags(input)
        end
      end
    expect_match_text: [HtmlSanitizeEx.strip_tags]
  description: "HtmlSanitizeEx.strip_tags/1 — drops every HTML tag, leaving only text; safe for plain-text contexts."

  imports:
  - Html_sanitize_ex
- id: elixir.sanitizer.html_sanitize_ex_basic_html
  enabled: true
  language: elixir
  tag: html-sanitize
  packages: [html_sanitize_ex]
  match:
    kind: call
    callee:
      attribute: [HtmlSanitizeEx, basic_html]
  match_examples:
  - name: declared shape
    code: |
      alias Html_sanitize_ex
      defmodule App do
        def test(input) do
          HtmlSanitizeEx.basic_html(input)
        end
      end
    expect_match_text: [HtmlSanitizeEx.basic_html]
  description: "HtmlSanitizeEx.basic_html/1 — allow-lists a safe subset of HTML tags / attributes."

