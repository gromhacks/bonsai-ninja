- id: elixir.path.file_open
  enabled: true
  language: elixir
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      attribute: [File, open]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          File.open(input)
        end
      end
  - name: literal file open negative
    code: |
      defmodule App do
        def test(input) do
          File.open("priv/static/index.html")
        end
      end
    expect_no_match: true
  description: "File.open/2 — tainted path reads arbitrary files; with :write modes also overwrites."
