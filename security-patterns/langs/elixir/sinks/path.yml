# Archive extraction (Zip Slip class). Erlang's :zip module is
# accessible from Elixir as :zip.extract/2. Trusts archive entry
# names — joining entry name into dest without containment is Zip Slip.
- id: elixir.path.zip_extract
  enabled: true
  language: elixir
  tag: zip-slip
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      attribute: [":zip", extract]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          :zip.extract(input)
        end
      end
  - name: literal zip extract negative
    code: |
      defmodule App do
        def test(input) do
          :zip.extract("priv/fixtures/archive.zip")
        end
      end
    expect_no_match: true
  description: ":zip.extract(archive, opts) — extracts entries to filesystem using attacker-controlled entry names; Zip Slip applies."
- id: elixir.path.zip_unzip
  enabled: true
  language: elixir
  tag: zip-slip
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      attribute: [":zip", unzip]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          :zip.unzip(input)
        end
      end
  - name: literal zip unzip negative
    code: |
      defmodule App do
        def test(input) do
          :zip.unzip("priv/fixtures/archive.zip")
        end
      end
    expect_no_match: true
  description: ":zip.unzip(archive, opts) — same as :zip.extract; documented alias."
