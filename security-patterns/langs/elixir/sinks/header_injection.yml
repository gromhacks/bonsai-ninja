# Elixir response-header / CRLF injection (Plug + Phoenix).
- id: elixir.header.plug_put_resp_header
  enabled: true
  language: elixir
  tag: header-injection
  severity: high
  packages: [plug]
  cwe: [CWE-113]
  match:
    kind: call
    callee:
      attribute: [Plug, Conn, put_resp_header]
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: declared shape
    code: |
      alias Plug
      defmodule App do
        def test(conn, input) do
          Plug.Conn.put_resp_header(conn, "x-user", input)
        end
      end
  - name: literal put resp header negative
    code: |
      alias Plug
      defmodule App do
        def test(conn, input) do
          Plug.Conn.put_resp_header(conn, "x-user", "safe")
        end
      end
    expect_no_match: true
  description: "Plug.Conn.put_resp_header(conn, name, tainted) - value is written verbatim; `\\r\\n` splits the response / injects cookies."

  imports:
  - Plug
