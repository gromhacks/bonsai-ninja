# Elixir SSTI / template-injection sinks. EEx compiles the <% %>
# expressions to Elixir AST and evaluates them — a tainted template
# body is arbitrary code execution.
- id: elixir.ssti.eex_eval_string
  enabled: true
  language: elixir
  tag: ssti
  severity: critical
  cwe: [CWE-1336]
  match:
    kind: call
    callee:
      attribute: [EEx, eval_string]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          EEx.eval_string(input)
        end
      end
  - name: literal eex eval string negative
    code: |
      defmodule App do
        def test(input) do
          EEx.eval_string("hello <%= @name %>")
        end
      end
    expect_no_match: true
  description: "EEx.eval_string/3 — tainted template body runs <% %> expressions; equivalent to Code.eval_string on the attacker's payload."

