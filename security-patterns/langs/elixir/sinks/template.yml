- id: elixir.ssti.solid_render
  enabled: true
  language: elixir
  tag: ssti
  severity: medium
  packages: [solid]
  cwe: [CWE-1336]
  match:
    kind: call
    callee:
      attribute: [Solid, render]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      alias Solid
      # uses solid
      defmodule App do
        def test(input) do
          Solid.render(input)
        end
      end
  - name: literal solid render negative
    code: |
      alias Solid
      defmodule App do
        def test(input) do
          Solid.render("Hello {{ name }}")
        end
      end
    expect_no_match: true
  description: "Solid.render/2 — Elixir Liquid engine; tainted template source exposes template logic even if sandboxed."
  imports:
  - Solid
