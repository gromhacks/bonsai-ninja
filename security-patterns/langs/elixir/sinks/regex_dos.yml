- id: elixir.redos.regex_compile
  enabled: true
  language: elixir
  tag: redos
  severity: medium
  packages: [stdlib]
  cwe: [CWE-1333]
  match:
    kind: call
    callee:
      attribute: [Regex, compile]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      alias Stdlib
      # uses stdlib
      defmodule App do
        def test(input) do
          Regex.compile(input)
        end
      end
  - name: literal regex compile negative
    code: |
      alias Stdlib
      defmodule App do
        def test(input) do
          Regex.compile("^[a-z]+$")
        end
      end
    expect_no_match: true
  description: "Regex.compile(tainted_pattern) — attacker-controlled regular expressions can trigger catastrophic backtracking."

  imports:
  - Stdlib
