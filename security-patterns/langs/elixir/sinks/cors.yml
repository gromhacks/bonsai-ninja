# elixir CORS misconfiguration sinks (T403).
- id: elixir.cors.cors_plug_origin_wildcard
  enabled: true
  language: elixir
  tag: cors
  category: source-independent
  severity: medium
  packages: [cors_plug]
  cwe: [CWE-942]
  match:
    kind: call
    callee:
      attribute: [CORSPlug, init]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '"\*"'
  match_examples:
  - name: declared shape
    code: |
      alias Cors_plug
      defmodule App do
        def test(input) do
          CORSPlug.init("*")
        end
      end
  - name: specific origin negative
    code: |
      alias Cors_plug
      defmodule App do
        def test(input) do
          CORSPlug.init("https://app.example.com")
        end
      end
    expect_no_match: true
  description: |-
    Plug CORSPlug origin '*' - wildcard CORS reflects every origin and defeats the
    same-origin policy; an explicit allow-list origin is safe, so the rule requires
    the literal "*".
  imports:
  - Cors_plug
