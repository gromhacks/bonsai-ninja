# Elixir command injection. Covers Elixir stdlib (System.cmd/shell,
# Port.open :spawn), Erlang stdlib (:os.cmd, :erlang.open_port) and
# common process wrappers (MuonTrap, Exexec, Porcelain, Rambo).
- id: elixir.cmdi.system_cmd
  enabled: true
  language: elixir
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [System, cmd]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          System.cmd(input)
        end
      end
  - name: literal system cmd negative
    code: |
      defmodule App do
        def test(input) do
          System.cmd("whoami")
        end
      end
    expect_no_match: true
  description: "System.cmd(tainted_cmd, args) - attacker-controlled executable paths can spawn unintended programs. Shell-command strings passed through `sh -c` are covered by elixir.cmdi.system_cmd_shell_args."

- id: elixir.cmdi.system_cmd_shell_args
  enabled: true
  language: elixir
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [System, cmd]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^"(/bin/)?(sh|bash)"$'
  - arg_matches_regex:
      index: 1
      regex: '"-c"'
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted shell command argument
    code: |
      defmodule App do
        def test(input) do
          System.cmd("sh", ["-c", input])
        end
      end
  - name: literal shell command argument negative
    code: |
      defmodule App do
        def test() do
          System.cmd("sh", ["-c", "whoami"])
        end
      end
    expect_no_match: true
  - name: argv command argument negative
    code: |
      defmodule App do
        def test(input) do
          System.cmd("echo", [input])
        end
      end
    expect_no_match: true
  description: "System.cmd(\"sh\", [\"-c\", tainted]) - shell-command string is interpreted by /bin/sh."

