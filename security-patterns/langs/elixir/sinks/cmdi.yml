    kind: call
    callee:
      regex: "^:os\\.cmd$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          :os.cmd(input)
        end
      end
  - name: literal os cmd negative
    code: |
      defmodule App do
        def test() do
          :os.cmd("whoami")
