  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      alias System
      defmodule App do
        def test(input) do
          System.shell(input)
        end
      end
  - name: literal system shell negative
    code: |
      alias System
      defmodule App do
        def test(input) do
