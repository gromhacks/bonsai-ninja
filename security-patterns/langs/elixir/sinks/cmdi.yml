- id: elixir.cmdi.port_open_spawn
  enabled: true
  language: elixir
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [Port, open]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          Port.open({:spawn, input})
        end
      end
  - name: literal port spawn negative
    code: |
      defmodule App do
        def test(input) do
          Port.open({:spawn, "whoami"})
        end
      end
    expect_no_match: true
  description: "Port.open({:spawn, cmd}, _) - :spawn mode runs the command via /bin/sh. Prefer {:spawn_executable, path} with explicit args."

