- id: elixir.llm.ex_aws_bedrock_invoke_model
  enabled: true
  language: elixir
  tag: web-llm
  severity: medium
  packages: [ex_aws_bedrock]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      attribute: [ExAws, Bedrock, invoke_model]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: elixir ex aws bedrock invoke model
    code: |
      alias Ex_aws_bedrock
      defmodule App do
        def test(prompt) do
          ExAws.Bedrock.invoke_model(prompt)
        end
      end
    expect_match_text: [ExAws.Bedrock.invoke_model]
  - name: literal bedrock invoke model negative
    code: |
      alias Ex_aws_bedrock
      defmodule App do
        def test(prompt) do
          ExAws.Bedrock.invoke_model("{\"prompt\":\"Summarize\"}")
        end
      end
    expect_no_match: true
  description: "ExAws.Bedrock.invoke_model - tainted request body steers the underlying foundation model."
  imports:
  - Ex_aws_bedrock
