# Elixir LLM sinks (OpenAI / Anthropic / Bedrock client wrappers).
- id: elixir.llm.openai_chat_completion
  enabled: true
  language: elixir
  tag: web-llm
  severity: medium
  packages: [openai]
  imports:
  - openai
  - Openai
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      attribute: [OpenAI, chat_completion]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: elixir openai chat completion
    code: |
      alias Openai
      defmodule App do
        def test(prompt) do
          OpenAI.chat_completion(prompt)
        end
      end
    expect_match_text: [OpenAI.chat_completion]
  - name: literal openai chat completion negative
    code: |
      alias Openai
      defmodule App do
        def test(prompt) do
          OpenAI.chat_completion("Summarize this document.")
        end
      end
    expect_no_match: true
  description: "OpenAI.chat_completion - tainted prompt content reaches an LLM instruction / tool surface."

- id: elixir.llm.anthropic_messages_create
