# JWT alg-confusion (T400). HMAC verify with an RSA public
# key - when both HS* and RS* algorithms are allowed in the
# verifier's algorithm list, an attacker can sign their own
# token with the public key as the HMAC secret. Detect by
# matching the algorithm-list shape at the verify call.
  imports:
  - Jose
- id: elixir.jwt.alg_confusion
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: elixir
  tag: untrusted-token
  severity: high
  packages: [joken]
  cwe: [CWE-345]
  match:
    kind: call
    callee:
      attribute: [Joken, verify_and_validate]
  match_examples:
  - name: declared shape
    code: |
      alias Joken
      defmodule App do
        def test(input) do
          Joken.verify_and_validate("HS256RS256")
        end
      end
  description: "Disabled - requires a rulepack constraint that proves the unsafe JWT
    configuration, not just the broad API shape. Joken verify_and_validate with mixed
    HMAC+RSA algorithms - alg-confusion vector."
  imports:
  - Joken
