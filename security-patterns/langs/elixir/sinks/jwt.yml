# Elixir JWT sinks (Joken / Guardian / jose).
- id: elixir.jwt.joken_decode_and_verify
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: elixir
  tag: jwt
  severity: high
  packages: [joken]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [Joken, decode_and_verify]
  match_examples:
  - name: declared shape
    code: |
      alias Joken
      defmodule App do
        def test(input) do
          Joken.decode_and_verify(input)
        end
      end
  description: "Disabled - requires a rulepack constraint that proves the unsafe JWT
    configuration, not just the broad API shape. Joken.decode_and_verify/3 - verifies
    against the configured default_signer; weak secret, alg=none, or an HS256 signer
    set from env without strength checks accepts forged tokens."

  imports:
  - Joken
- id: elixir.jwt.joken_verify
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: elixir
  tag: jwt
  severity: high
  packages: [joken]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [Joken, verify]
  match_examples:
  - name: declared shape
    code: |
      alias Joken
      # uses joken
      defmodule App do
        def test(input) do
          Joken.verify(input)
        end
      end
  description: "Disabled - requires a rulepack constraint that proves the unsafe JWT
    configuration, not just the broad API shape. Joken.verify/3 - explicit signer
    supplied; misconfigured signer (alg=none, shared weak secret) accepts forged tokens."

  imports:
  - Joken
- id: elixir.jwt.joken_peek_claims
  enabled: true
  language: elixir
  tag: jwt
  severity: high
  packages: [joken]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [Joken, peek_claims]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      alias Joken
      defmodule App do
        def test(input) do
          Joken.peek_claims(input)
        end
      end
  - name: literal jwt negative
    code: "alias Joken\ndefmodule App do\n  def test(\"safe\") do\n    Joken.peek_claims(\"\
      safe\")\n  end\nend\n"
    expect_no_match: true
  description: "Joken.peek_claims/1 - returns JWT claims without any signature check;
    trusting the output for authorisation is an auth bypass."

  imports:
  - Joken
- id: elixir.jwt.joken_peek_header
  enabled: true
  language: elixir
  tag: jwt
  severity: medium
  packages: [joken]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [Joken, peek_header]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      alias Joken
      defmodule App do
        def test(input) do
          Joken.peek_header(input)
        end
      end
  - name: literal jwt negative
    code: "alias Joken\ndefmodule App do\n  def test(\"safe\") do\n    Joken.peek_header(\"\
      safe\")\n  end\nend\n"
    expect_no_match: true
  description: "Joken.peek_header/1 - attacker-controlled JWT header (alg, kid); never
    drive verification decisions from these values (kid-confusion, alg=none)."

  imports:
  - Joken
