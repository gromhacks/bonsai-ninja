# Elixir JWT sinks (Joken / Guardian / jose).
- id: elixir.jwt.joken_peek_claims
  enabled: true
  language: elixir
  tag: jwt
  severity: high
  packages: [joken]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [Joken, peek_claims]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      alias Joken
      defmodule App do
        def test(input) do
          Joken.peek_claims(input)
        end
      end
  - name: literal jwt negative
    code: "alias Joken\ndefmodule App do\n  def test(\"safe\") do\n    Joken.peek_claims(\"\
      safe\")\n  end\nend\n"
    expect_no_match: true
  description: "Joken.peek_claims/1 - returns JWT claims without any signature check;
    trusting the output for authorisation is an auth bypass."

  imports:
  - Joken
- id: elixir.jwt.joken_peek_header
  enabled: true
  language: elixir
  tag: jwt
  severity: medium
  packages: [joken]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [Joken, peek_header]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      alias Joken
      defmodule App do
        def test(input) do
          Joken.peek_header(input)
        end
      end
  - name: literal jwt negative
    code: "alias Joken\ndefmodule App do\n  def test(\"safe\") do\n    Joken.peek_header(\"\
      safe\")\n  end\nend\n"
    expect_no_match: true
  description: "Joken.peek_header/1 - attacker-controlled JWT header (alg, kid); never
    drive verification decisions from these values (kid-confusion, alg=none)."

  imports:
  - Joken
- id: elixir.jwt.jose_jwt_peek_payload
  enabled: true
  language: elixir
  tag: jwt
  severity: high
  packages: [jose]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [JOSE, JWT, peek_payload]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      alias Jose
      defmodule App do
        def test(input) do
          JOSE.JWT.peek_payload(input)
        end
      end
  - name: literal jwt negative
    code: "alias Jose\ndefmodule App do\n  def test(\"safe\") do\n    JOSE.JWT.peek_payload(\"\
      safe\")\n  end\nend\n"
    expect_no_match: true
  description: "JOSE.JWT.peek_payload/1 - returns claims without any signature check;
    trusting these is auth bypass."

# JWT alg-confusion (T400). HMAC verify with an RSA public
# key - when both HS* and RS* algorithms are allowed in the
# verifier's algorithm list, an attacker can sign their own
# token with the public key as the HMAC secret. Detect by
# matching the algorithm-list shape at the verify call.
  imports:
  - Jose
