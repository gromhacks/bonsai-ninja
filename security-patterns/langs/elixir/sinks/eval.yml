- id: elixir.eval.kernel_apply
  enabled: true
  language: elixir
  tag: code-injection
  severity: high
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: apply
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted apply module or function
    code: |
      defmodule App do
        def test(input) do
          apply(input, :run, [])
        end
      end
  - name: tainted apply argument list negative
    code: |
      defmodule App do
        def test(input) do
          apply(SafeModule, :run, [input])
        end
      end
    expect_no_match: true
  description: "apply/2,3 with a tainted function or module operand - attacker controls dynamic dispatch. The argument-list operand alone is intentionally not a sink."
- id: elixir.eval.kernel_apply_function_name
  enabled: true
  language: elixir
  tag: code-injection
  severity: high
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: apply
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted apply function name
    code: |
      defmodule App do
        def test(input) do
          apply(SafeModule, input, [])
        end
      end
  - name: tainted apply args negative
    code: |
      defmodule App do
        def test(input) do
          apply(SafeModule, :run, [input])
        end
      end
    expect_no_match: true
  description: "apply(Module, tainted_function, args) - attacker controls which exported function is invoked."
- id: elixir.eval.string_to_atom
  enabled: true
  language: elixir
  tag: dos
  severity: medium
  cwe: [CWE-770]
  match:
    kind: call
    callee:
      attribute: [String, to_atom]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          String.to_atom(input)
        end
      end
  - name: literal string to atom negative
    code: |
      defmodule App do
        def test(input) do
          String.to_atom("ready")
        end
      end
    expect_no_match: true
  description: "String.to_atom/1 - unbounded atom creation exhausts the BEAM atom table (max ~1M, not GC'd); prefer String.to_existing_atom/1."

