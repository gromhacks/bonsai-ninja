# Elixir code-execution sinks. Code.eval_* compiles and runs arbitrary
# Elixir source; :erl_eval is the Erlang analogue; apply/3 dispatches
# to any exported function; String.to_atom leaks into atom-table DoS.
- id: elixir.eval.code_eval_string
  enabled: true
  language: elixir
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [Code, eval_string]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          Code.eval_string(input)
        end
      end
  - name: arg tainted literal negative
    code: "defmodule App do\n  def test(input) do\n    Code.eval_string(\"safe\")\n  end\nend\n"
    expect_no_match: true
  description: "Code.eval_string/1 - compiles and evaluates arbitrary Elixir source at runtime; full RCE if the string is tainted."
- id: elixir.eval.code_eval_quoted
  enabled: true
  language: elixir
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [Code, eval_quoted]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          Code.eval_quoted(input)
        end
      end
  - name: literal quoted eval negative
    code: |
      defmodule App do
        def test(input) do
          Code.eval_quoted(quote do: 1 + 1)
        end
      end
    expect_no_match: true
  description: "Code.eval_quoted/2 - executes any AST, including attacker-built quoted expressions."
