- id: elixir.eval.erl_eval
  enabled: true
  language: elixir
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^:erl_eval\\.exprs$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          :erl_eval.exprs(input)
        end
      end
  - name: literal erl eval negative
    code: |
      defmodule App do
        def test(input) do
          :erl_eval.exprs([])
        end
      end
    expect_no_match: true
  description: "Erlang :erl_eval.exprs/2 - evaluates an Erlang AST; tainted AST = arbitrary code execution."
