- id: elixir.sqli.ecto_fragment
  enabled: true
  language: elixir
  tag: sql-injection
  severity: high
  packages:
  - ecto
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      regex: ^fragment$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      alias Ecto
      defmodule App do
        def test(input) do
          fragment(input)
        end
      end
  - name: literal fragment negative
    code: |
      alias Ecto
      defmodule App do
        def test(input) do
          fragment("name = ?")
        end
      end
    expect_no_match: true
  description: "Ecto fragment(\"...\") — string interpolation inside fragment is spliced directly into SQL. Merged collision aliases: elixir.sqli.ecto_query_api_fragment."
  aliases:
  - elixir.sqli.ecto_query_api_fragment
  imports:
  - Ecto
