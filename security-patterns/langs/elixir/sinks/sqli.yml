- id: elixir.sqli.ecto_repo_query
  enabled: true
  language: elixir
  tag: sql-injection
  severity: critical
  packages:
  - ecto_sql
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      regex: '^(?:[A-Z][A-Za-z0-9_]*\.)*Repo\.query$'
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      alias Ecto_sql
      # uses ecto_sql
      defmodule App do
        def test(input) do
          Repo.query(input)
        end
      end
  - name: application repo module
    code: |
      alias Ecto_sql
      defmodule App do
        def test(input) do
          MyApp.Repo.query(input)
        end
      end
  - name: literal repo query negative
    code: |
      alias Ecto_sql
      defmodule App do
        def test(input) do
          Repo.query("SELECT * FROM users")
        end
      end
    expect_no_match: true
  description: "Repo.query/2 or App.Repo.query/2 — raw SQL with interpolated values bypasses Ecto's parameter binding."
  imports:
  - Ecto_sql
