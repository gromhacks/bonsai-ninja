- id: elixir.xxe.sweet_xml_parse
  enabled: true
  language: elixir
  tag: xxe
  severity: high
  packages: [sweet_xml]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [SweetXml, parse]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      alias Sweet_xml
      # uses sweet_xml
      defmodule App do
        def test(input) do
          SweetXml.parse(input)
        end
      end
  - name: literal sweet xml parse negative
    code: |
      alias Sweet_xml
      defmodule App do
        def test(input) do
          SweetXml.parse("<root/>")
        end
      end
    expect_no_match: true
  description: "SweetXml.parse/1 - delegates to :xmerl with default options; external entities expand, file:// URIs are dereferenced."

  imports:
  - Sweet_xml
- id: elixir.xxe.sweet_xml_sigil
  enabled: false
  disabled_reason:
    code: over-broad
  language: elixir
  tag: xxe
  severity: low
  packages: [sweet_xml]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      name: sigil_x
  description: "Disabled - SweetXml ~x sigil is usually a static XPath pattern, not tainted; enable when auditing dynamic XPath construction."

