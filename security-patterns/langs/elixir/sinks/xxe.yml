# Elixir XXE sinks. :xmerl expands external entities by default; most
# Elixir XML libs wrap :xmerl or Saxy.
- id: elixir.xxe.xmerl_scan_string
  enabled: true
  language: elixir
  tag: xxe
  severity: high
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      regex: "^:xmerl_scan\\.string$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      defmodule App do
        def test(input) do
          :xmerl_scan.string(input)
        end
      end
  - name: literal xmerl string negative
    code: |
      defmodule App do
        def test(input) do
          :xmerl_scan.string("<root/>")
        end
      end
    expect_no_match: true
  description: ":xmerl_scan.string/1,2 - Erlang XML parser; external entities / DTDs are expanded unless `[{allow_entities, false}]` + custom acc_fun rejects them."

