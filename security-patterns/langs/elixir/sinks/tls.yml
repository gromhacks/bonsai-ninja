# Elixir TLS misconfiguration rules. Exact option names and values remain
# rulepack data; the adapter supplies only typed aggregate/scalar facts.
- id: elixir.tls.ssl_connect_verify_none
  enabled: true
  language: elixir
  tag: weak-tls
  category: source-independent
  severity: high
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      regex: "^:ssl\\.connect$"
  constraints:
  - arg_aggregate_fields_equal:
      argument_index: 1
      required_fields:
      - path: [verify]
        value: {kind: string, value: verify_none}
  match_examples:
  - name: exact disabled verification option
    code: |
      defmodule App do
        def test(input) do
          :ssl.connect(input, verify: :verify_none)
        end
      end
  - name: peer verification remains enabled
    code: |
      defmodule App do
        def test(input) do
          :ssl.connect(input, verify: :verify_peer)
        end
      end
    expect_no_match: true
  - name: same option on an unrelated call
    code: |
      defmodule App do
        def test(input) do
          LocalSocket.connect(input, verify: :verify_none)
        end
      end
    expect_no_match: true
  description: "Erlang :ssl.connect(_, verify: :verify_none) - peer certificate is not validated; MITM trivial."

- id: elixir.tls.tesla_insecure_adapter
  enabled: true
  language: elixir
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [tesla]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      attribute: [Tesla, client]
      binding_origin: imported
  constraints:
  - arg_aggregate_fields_equal:
      argument_index: 1
      required_fields:
      - path: [insecure]
        value: {kind: boolean, value: true}
  match_examples:
  - name: exact insecure client option
    code: |
      alias Tesla
      # uses tesla
      defmodule App do
        def test(input) do
          Tesla.client(input, insecure: true)
        end
      end
  - name: secure client option
    code: |
      alias Tesla
      # uses tesla
      defmodule App do
        def test(input) do
          Tesla.client(input, insecure: false)
        end
      end
    expect_no_match: true
  - name: same method and option on a local module
    code: |
      # uses tesla
      defmodule Tesla do
        def client(input, options), do: {input, options}
      end
      defmodule App do
        def test(input) do
          Tesla.client(input, insecure: true)
        end
      end
    expect_no_match: true
  description: "Tesla.client(_, insecure: true) - Hackney adapter with cert validation disabled; MITM trivial."

  imports:
  - Tesla
