- id: elixir.nosql.cassandra_query
  enabled: true
  language: elixir
  tag: nosql-injection
  severity: high
  packages: [xandra]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: "^Xandra\\.execute$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: declared shape
    code: |
      alias Xandra
      defmodule App do
        def test(conn, input) do
          Xandra.execute(conn, input, [])
        end
      end
  - name: literal xandra execute negative
    code: |
      alias Xandra
      defmodule App do
        def test(conn, input) do
          Xandra.execute(conn, "SELECT * FROM users WHERE id = ?", [])
        end
      end
    expect_no_match: true
  description: "Xandra.execute/4 - raw CQL with interpolated strings enables CQL injection; use prepared statements (`Xandra.prepare!/2` + `%Xandra.Prepared{}`)."

  imports:
  - Xandra
