# Elixir NoSQL injection.
- id: elixir.nosql.mongo_find
  enabled: true
  language: elixir
  tag: nosql-injection
  severity: high
  packages: [mongodb_driver]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      attribute: [Mongo, find]
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: declared shape
    code: |
      alias Mongodb_driver
      defmodule App do
        def test(conn, input) do
          Mongo.find(conn, "users", input)
        end
      end
  - name: literal mongo find negative
    code: |
      alias Mongodb_driver
      defmodule App do
        def test(conn, input) do
          Mongo.find(conn, "users", %{name: "alice"})
        end
      end
    expect_no_match: true
  description: "Mongo.find/4 - tainted filter map allows operator injection ($where, $ne, $regex)."

  imports:
  - Mongodb_driver
- id: elixir.nosql.mongo_aggregate
  enabled: true
  language: elixir
  tag: nosql-injection
  severity: high
  packages: [mongodb_driver]
  cwe: [CWE-943]
  match:
    kind: call
