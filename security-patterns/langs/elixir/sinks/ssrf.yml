- id: elixir.ssrf.httpoison_get
  enabled: false
  language: elixir
  tag: ssrf
  severity: high
  packages:
  - httpoison
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute:
      - HTTPoison
      - get
  match_examples:
  - name: declared shape
    code: "alias Httpoison\ndefmodule App do\n  def test(input) do\n    HTTPoison.get(input)\n\
      \  end\nend\n"
  description: "HTTPoison.get/3 \u2014 tainted URL fetches attacker-chosen endpoints,\
    \ including cloud metadata (169.254.169.254) and internal services."
  imports:
  - Httpoison
  disabled_reason:
    code: over-broad
