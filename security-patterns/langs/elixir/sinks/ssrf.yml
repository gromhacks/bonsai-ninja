  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted finch request struct
    code: "alias Finch\n# uses finch\ndefmodule App do\n  def test(input) do\n   \
      \ Finch.request(input)\n  end\nend\n"
  - name: literal finch request struct negative
    code: |
      alias Finch
      defmodule App do
        def test(request) do
          Finch.request(%Finch.Request{})
        end
      end
    expect_no_match: true
  description: "Finch.request/3 \u2014 dispatches the request struct; the URL inside\
    \ is attacker-controlled if built from tainted data."
  imports:
  - Finch
