- id: elixir.ssrf.mint_connect
  enabled: true
  language: elixir
  tag: ssrf
  severity: high
  packages:
  - mint
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute:
      - Mint
      - HTTP
      - connect
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted mint connect host
    code: |
      alias Mint
      # uses mint
      defmodule App do
        def test(input) do
          Mint.HTTP.connect(:http, input, 80)
        end
      end
  - name: literal mint connect host negative
    code: |
      alias Mint
      defmodule App do
        def test() do
          Mint.HTTP.connect(:http, "example.com", 80)
        end
      end
    expect_no_match: true
  description: "Mint.HTTP.connect/4 \u2014 tainted host opens a TCP connection to\
    \ attacker-chosen peer (pre-TLS)."
  imports:
  - Mint
- id: elixir.ssrf.mint_request
  enabled: true
  language: elixir
  tag: ssrf
  severity: high
  packages:
  - mint
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute:
      - Mint
      - HTTP
      - request
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: tainted mint request path
    code: |
      alias Mint
      # uses mint
      defmodule App do
        def test(conn, input) do
          Mint.HTTP.request(conn, "GET", input, [])
        end
      end
  - name: literal mint request path negative
    code: |
      alias Mint
      defmodule App do
        def test(conn) do
          Mint.HTTP.request(conn, "GET", "/safe", [])
        end
      end
    expect_no_match: true
  description: "Mint.HTTP.request/5 \u2014 tainted path / host header allows attacker-directed\
    \ HTTP request over the connection."
  imports:
  - Mint
- id: elixir.ssrf.hackney_request
  aliases:
  - elixir.tls.hackney_insecure
  enabled: true
  language: elixir
  tag: ssrf
  severity: high
  packages:
  - hackney
  cwe:
  - CWE-918
  - CWE-295
  match:
    kind: call
    callee:
      regex: ^:hackney\.request$
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted hackney request url
    code: |
      alias Hackney
      defmodule App do
        def test(input) do
          :hackney.request(:get, input, [], <<>>, [])
        end
      end
  - name: literal hackney request url negative
    code: |
      alias Hackney
      defmodule App do
        def test() do
          :hackney.request(:get, "https://example.com", [], <<>>, [])
        end
      end
    expect_no_match: true
  description: ":hackney.request/5 \u2014 tainted URL reaches arbitrary hosts (the\
    \ Erlang HTTP client underlying many Elixir libs). Also covers merged aliases:\
    \ elixir.tls.hackney_insecure."
  imports:
  - Hackney
