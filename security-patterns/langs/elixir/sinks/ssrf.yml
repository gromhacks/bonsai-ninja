- id: elixir.ssrf.finch_build
  enabled: true
  language: elixir
  tag: ssrf
  severity: high
  packages:
  - finch
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute:
      - Finch
      - build
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted finch build url
    code: "alias Finch\n# uses finch\ndefmodule App do\n  def test(input) do\n   \
      \ Finch.build(:get, input)\n  end\nend\n"
  - name: literal finch build url negative
    code: |
      alias Finch
      defmodule App do
        def test() do
          Finch.build(:get, "https://example.com")
        end
      end
    expect_no_match: true
  description: "Finch.build/5 \u2014 tainted URL is baked into the %Finch.Request{};\
    \ subsequent Finch.request/2 sends it."
  imports:
  - Finch
- id: elixir.ssrf.finch_request
