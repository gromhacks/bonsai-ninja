- id: elixir.ssrf.httpoison_get
  enabled: true
  language: elixir
  tag: ssrf
  severity: high
  packages:
  - httpoison
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute:
      - HTTPoison
      - get
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted httpoison get url
    code: |
      alias Httpoison
      defmodule App do
        def test(input) do
          HTTPoison.get(input)
        end
      end
  - name: literal httpoison get url negative
    code: |
      alias Httpoison
      defmodule App do
        def test() do
          HTTPoison.get("https://example.com")
        end
      end
    expect_no_match: true
  description: "HTTPoison.get/3 - tainted URL fetches attacker-chosen endpoints,\
    \ including cloud metadata (169.254.169.254) and internal services."
  imports:
  - Httpoison
