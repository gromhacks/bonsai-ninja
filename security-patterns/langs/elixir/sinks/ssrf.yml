- id: elixir.ssrf.httpoison_request
  enabled: true
  language: elixir
  tag: ssrf
  severity: high
  packages:
  - httpoison
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute:
      - HTTPoison
      - request
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted httpoison request url or struct
    code: "alias Httpoison\n# uses httpoison\ndefmodule App do\n  def test(input)\
      \ do\n    HTTPoison.request(input)\n  end\nend\n"
  - name: literal httpoison request negative
    code: |
      alias Httpoison
      defmodule App do
        def test() do
          HTTPoison.request("https://example.com")
        end
      end
    expect_no_match: true
  description: "HTTPoison.request/5 \u2014 generic verb; tainted URL reaches arbitrary\
    \ hosts."
  imports:
  - Httpoison
