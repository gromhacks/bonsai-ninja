  - name: tainted req post url or options
    code: |
      alias Req
      defmodule App do
        def test(input) do
          Req.post(input)
        end
      end
  - name: tainted req post body negative
    code: |
      alias Req
      defmodule App do
        def test(input) do
          Req.post(url: "https://example.com", body: input)
        end
