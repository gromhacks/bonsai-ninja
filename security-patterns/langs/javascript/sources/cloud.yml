# JavaScript cloud-event sources whose producer is a service or broker.
- id: javascript.cloud.aws_lambda_event
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: javascript
  trust: service
  tag: cloud-event
  payload_types: [event, json]
  frameworks: [aws-lambda]
  packages: ["aws-sdk", "@aws-sdk/client-lambda", "aws-lambda"]
  match:
    kind: param
    target: { name: event }
  description: "Disabled - JavaScript Lambda handlers are registered outside source, so a bare `event` parameter plus an SDK dependency does not prove an invocation boundary."

- id: javascript.cloud.aws_lambda_event_records
  enabled: true
  language: javascript
  trust: service
  tag: cloud-event
  payload_types: [event, json]
  frameworks: [aws-lambda]
  packages: ["aws-lambda"]
  match:
    kind: read
    target: { attribute: [event, Records] }
  match_examples:
  - name: aws lambda event records
    code: |
      const _u = require("aws-lambda");
      function demo() { return event.Records; }
    expect_match_text: [event.Records]
  - name: unrelated event property negative
    code: |
      const _u = require("aws-lambda");
      function demo() { return event.httpMethod; }
    expect_no_match: true
  description: "AWS Lambda event.Records - batch of SQS, SNS, Kinesis, DynamoDB, or S3 records delivered by a service."

- id: javascript.cloud.cloudevent_data
  enabled: true
  language: javascript
  trust: service
  tag: cloud-event
  packages: [cloudevents]
  match:
    kind: read
    target: { attribute: [cloudEvent, data] }
  match_examples:
  - name: cloudevent data
    code: |
      const _u = require("cloudevents");
      function demo() { return cloudEvent.data; }
  description: "CloudEvents cloudEvent.data attribute - service-delivered event payload."
