- id: javascript.source.window_location_hash
  enabled: true
  language: javascript
  trust: remote
  tag: browser-input
  match:
    kind: read
    target:
      regex: "^(window\\.|document\\.)?location\\.hash$"
  match_examples:
  - name: window location hash
    code: |
      function demo(input, req, obj) {
        return location.hash;
      }
    expect_match_text: [location.hash]
  - name: explicit window location hash
    code: |
      function demo() {
        return window.location.hash;
