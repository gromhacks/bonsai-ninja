# JavaScript HTTP / RPC / browser remote sources.
# Event-driven cloud handlers live in cloud.yml. HTTP-triggered cloud
# entrypoints stay here because they are network-attacker reachable.
#
# Every enabled source uses either an attribute-chain target (e.g. [req, body])
# or a rare, framework-specific parameter/property name. Bare ubiquitous names
# (`body`, `query`, `params`, `headers`, `data`, `message`, `req`, …) are off
# by default — flip them on only in an audit profile that accepts the FP cost.

# ── Express (attribute chains on `req`) ─────────────────────────────────────
- id: javascript.source.express_req_body
  enabled: true
  language: javascript
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [json]
  frameworks: [express, koa, fastify, nestjs, next, nextjs, restify, polka]
  packages: [express, koa, koa-body, fastify, next, restify, polka]
  match:
    kind: read
    target:
      attribute: [req, body]
  match_examples:
  - name: express req body
    code: |
      const _u = require("express");
      function demo(input, req, obj) {
        return req.body;
      }
  description: req.body — HTTP request body for Express-compatible frameworks; attribute-chain avoids matching every `.body` read.

