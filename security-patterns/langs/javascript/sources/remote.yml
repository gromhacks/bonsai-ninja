  constraints:
  - min_args: 1
  match_examples:
  - name: express req.get header
    code: |
      const _u = require("express");
      function demo(req) {
        return req.get("x-forwarded-host");
      }
    expect_match_text: [req.get]
  - name: express req.header accessor
    code: |
      const _u = require("express");
      function demo(req) {
        return req.header("referer");
      }
    expect_match_text: [req.header]
  description: "Express/Nest req.get()/req.header() — single request header value, attacker-controlled."

