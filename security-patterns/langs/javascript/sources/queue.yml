# JavaScript queue / message-bus consumer sources (trust: service).
# Queue payloads originate from another service inside the trust boundary,
# but the *producer* may still be remote-attacker-influenced.
# Attribute-chain payload reads are precise enough to ship on by default.
# Bare queue handler param names stay off until we support stronger
# framework-signature narrowing.

- id: javascript.source.kafkajs_message_value
  enabled: true
  language: javascript
  trust: service
  tag: queue-input
  packages: [kafkajs]
  match:
    kind: read
    target:
      attribute: [message, value]
  match_examples:
  - name: kafkajs message value
    code: |
      const _u = require("kafkajs");
      function demo(input, req, obj) {
        return message.value;
      }
  description: "kafkajs consumer message.value — producer-controlled bytes."

