- id: javascript.source.bun_file_materialize
  enabled: true
  language: javascript
  trust: local
  tag: file-input
  payload_types: [text, binary, json]
  frameworks: [bun]
  match:
    kind: call
    callee:
      regex: "^Bun\\.file\\(.+\\)\\.(text|arrayBuffer|json)$"
  constraints:
  - max_args: 0
  match_examples:
  - name: Bun materializes local file text
    code: |
      async function load(path) {
        return await Bun.file(path).text();
      }
    expect_match_text: [Bun.file(path).text]
  - name: Bun file handle alone is not materialized input
    code: |
      function open(path) {
        return Bun.file(path);
      }
    expect_no_match: true
  description: "Bun.file(path).text()/arrayBuffer()/json() - materialized contents of the selected local file; Bun.file(path) alone is only a handle and is intentionally excluded."
