# JavaScript CLI / process sources.

- id: javascript.source.readline_question
  enabled: true
  language: javascript
  trust: local
  tag: cli-input
  payload_types: [text]
  packages: [readline, readline-sync]
  match:
    kind: call
    callee:
      name: question
  match_examples:
  - name: readline question
    code: |
      const _u = require("readline");
      function demo(input, req, obj) {
        return question(input);
      }
  description: "readline.Interface.question — interactive stdin prompt; callback arg is tainted."

- id: javascript.source.process_argv
  enabled: true
  language: javascript
  trust: local
  tag: cli-input
  match:
    kind: read
    target:
      attribute: [process, argv]
  match_examples:
  - name: process argv
    code: |
      function demo(input, req, obj) {
        return process.argv;
      }
  description: process.argv — CLI arguments, attacker-controlled when the Node process is launched with untrusted args.

