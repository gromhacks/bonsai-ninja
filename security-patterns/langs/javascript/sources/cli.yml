# JavaScript CLI / process sources.

- id: javascript.source.readline_question
  enabled: true
  language: javascript
  trust: local
  tag: cli-input
  payload_types: [text]
  packages: [readline]
  match:
    kind: call
    callee:
      name: question
  constraints:
  - receiver_type_in: [Interface]
  - arg_count: 2
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: readline interface question callback
    code: |
      const readline = require("readline");
      function demo() {
        const rl = readline.createInterface({ input: process.stdin });
        rl.question("name?", answer => {
          return answer;
        });
      }
    expect_match_text: [rl.question]
  - name: application question method is not readline input
    code: |
      const readline = require("readline");
      class Survey { question(prompt, callback) { callback("fixed"); } }
      function demo(survey) {
        survey.question("name?", answer => sink(answer));
      }
    expect_no_match: true
  description: "readline.Interface.question(query, callback) - callback parameter 0 is interactive stdin input. Factory-derived receiver typing prevents same-named application methods from matching, and the void registration result remains clean."

- id: javascript.source.readline_sync_question
  enabled: true
  language: javascript
  trust: local
  tag: cli-input
  payload_types: [text]
  packages: [readline-sync]
  analysis_semantics:
    allow_file_package_evidence: false
  match:
    kind: call
    callee:
      name: question
  constraints:
  - min_args: 1
  match_examples:
  - name: readline sync CommonJS binding question
    code: |
      const rlsync = require("readline-sync");
      function demo() {
        return rlsync.question("name?");
      }
    expect_match_text: [rlsync.question]
  - name: same named application method beside readline sync import
    code: |
      const rlsync = require("readline-sync");
      class Survey { question(prompt) { return "fixed"; } }
      function demo(survey) {
        return survey.question("name?");
      }
    expect_no_match: true
  description: "readline-sync CommonJS-binding question(query) - synchronous interactive stdin input. Exact compiler import-alias evidence binds the receiver to readline-sync; file-level dependency presence alone cannot qualify a same-named application method."

