- id: javascript.source.fs_readfile_sync
  enabled: true
  language: javascript
  trust: local
  tag: file-input
  payload_types: [text, binary]
  packages: [fs]
  match:
    kind: call
    callee:
      attribute: [fs, readFileSync]
  constraints:
  - min_args: 1
  match_examples:
  - name: fs readFileSync
    code: |
      const fs = require("fs");
      function demo(path) {
        return fs.readFileSync(path, "utf8");
      }
    expect_match_text: [fs.readFileSync]
  - name: fs readFileSync no args negative
    code: |
      const fs = require("fs");
      function demo() {
        return fs.readFileSync();
      }
    expect_no_match: true
  description: "fs.readFileSync(path[, options]) - materializes local file bytes/text into a value."

- id: javascript.source.fs_promises_readfile
  enabled: true
  language: javascript
  trust: local
  tag: file-input
  payload_types: [text, binary]
  packages: [fs]
  match:
    kind: call
    callee:
      attribute: [fs, promises, readFile]
  constraints:
  - min_args: 1
  match_examples:
  - name: fs promises readFile
    code: |
      const fs = require("fs");
      async function demo(path) {
        return await fs.promises.readFile(path, "utf8");
      }
    expect_match_text: [fs.promises.readFile]
  - name: fs promises alias readFile
    code: |
      const fsp = require("fs/promises");
      async function demo(path) {
        return await fsp.readFile(path, "utf8");
      }
    expect_match_text: [fsp.readFile]
  - name: same chain on a local object is not filesystem input
    code: |
      const realFs = require("fs");
      const local = { promises: { readFile(path) { return "fixed"; } } };
      function demo(path) { return local.promises.readFile(path); }
    expect_no_match: true
  description: "fs.promises.readFile(path[, options]) - promise resolving to local file bytes/text."

- id: javascript.source.fs_readfile_callback
  enabled: true
  language: javascript
  trust: local
  tag: file-input
  payload_types: [text, binary]
  packages: [fs]
  match:
    kind: call
    callee:
      attribute: [fs, readFile]
  constraints:
  - min_args: 2
  - max_args: 2
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [1]
  match_examples:
  - name: fs readFile callback without options
    code: |
      const fs = require("fs");
      function demo(path) {
        fs.readFile(path, (err, data) => {
          return data;
        });
      }
    expect_match_text: [fs.readFile]
  - name: fs access callback does not carry file contents
    code: |
      const fs = require("fs");
      function demo(path) {
        fs.access(path, err => {
          return err;
        });
      }
    expect_no_match: true
  description: "fs.readFile(path, callback) - callback data parameter receives local file bytes/text."

- id: javascript.source.fs_readfile_options_callback
  enabled: true
  language: javascript
  trust: local
  tag: file-input
  payload_types: [text, binary]
  packages: [fs]
  match:
    kind: call
    callee:
      attribute: [fs, readFile]
  constraints:
  - min_args: 3
  - max_args: 3
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 2
      source_param_indices: [1]
  match_examples:
  - name: fs readFile callback with options
    code: |
      const fs = require("fs");
      function demo(path) {
        fs.readFile(path, "utf8", function(err, data) {
          return data;
        });
      }
    expect_match_text: [fs.readFile]
  - name: fs writeFile callback does not carry file contents
    code: |
      const fs = require("fs");
      function demo(path) {
        fs.writeFile(path, "local", err => {
          return err;
        });
      }
    expect_no_match: true
  description: "fs.readFile(path, options, callback) - callback data parameter receives local file bytes/text."

- id: javascript.source.process_stdin_on_data
  enabled: true
  language: javascript
  trust: local
  tag: cli-input
  payload_types: [text, binary]
  match:
    kind: call
    callee:
      attribute: [process, stdin, "on"]
  constraints:
  - min_args: 2
  - max_args: 2
  - arg_matches_regex:
      index: 0
      regex: "^['\"]data['\"]$"
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: process stdin data callback
    code: |
      function demo() {
        process.stdin.on("data", chunk => {
          return chunk;
        });
      }
    expect_match_text: [process.stdin.on]
  - name: process stdin non-data event negative
    code: |
      function demo() {
        process.stdin.on("close", () => {});
      }
    expect_no_match: true
  description: "process.stdin.on('data', callback) - callback chunk parameter receives piped stdin bytes."

- id: javascript.source.deno_read_file
  enabled: true
  language: javascript
  trust: local
  tag: file-input
  payload_types: [binary]
  frameworks: [deno]
  match:
    kind: call
    callee:
      attribute: [Deno, readFile]
  constraints:
  - min_args: 1
  - max_args: 2
  match_examples:
  - name: Deno reads local file bytes
    code: |
      async function load(path) {
        return await Deno.readFile(path);
      }
    expect_match_text: [Deno.readFile]
  - name: Deno file write is not input
    code: |
      async function save(path, data) {
        return await Deno.writeFile(path, data);
      }
    expect_no_match: true
  description: "Deno.readFile(path[, options]) - materializes bytes from a local filesystem path."

