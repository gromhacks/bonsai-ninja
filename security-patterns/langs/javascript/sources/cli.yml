# JavaScript CLI / process sources.

- id: javascript.source.readline_question
  enabled: true
  language: javascript
  trust: local
  tag: cli-input
  payload_types: [text]
  packages: [readline, readline-sync]
  match:
    kind: call
    callee:
      name: question
  constraints:
  - min_args: 1
  match_examples:
  - name: readline question
    code: |
      const _u = require("readline");
      function demo(input, req, obj) {
        return question(input);
      }
  - name: readline question no args negative
    code: |
      const _u = require("readline");
      function demo() {
        return question();
      }
    expect_no_match: true
  description: "readline.Interface.question(query, callback) - interactive stdin prompt; the callback receives attacker-controlled input. Package-gated and requires at least the query argument so zero-arg same-name decoys stay quiet."

- id: javascript.source.process_argv
  enabled: true
  language: javascript
  trust: local
  tag: cli-input
  match:
    kind: read
    target:
      attribute: [process, argv]
  match_examples:
  - name: process argv
    code: |
      function demo(input, req, obj) {
        return process.argv;
      }
  description: process.argv - CLI arguments, attacker-controlled when the Node process is launched with untrusted args.

