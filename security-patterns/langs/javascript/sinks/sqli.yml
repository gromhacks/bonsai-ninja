- id: javascript.sqli.prisma_raw_fragment
  enabled: true
  language: javascript
  tag: sql-injection
  severity: high
  packages:
  - '@prisma/client'
  imports:
  - '@prisma/client'
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      attribute:
      - Prisma
      - raw
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: prisma raw order by
    code: "const { Prisma } = require(\"@prisma/client\");\nfunction orderBy(column) {\n  return Prisma.raw(\"ORDER BY \" + column);\n}\n"
    expect_match_text:
    - Prisma.raw
  - name: prisma raw where template
    code: |
      const _u = require("@prisma/client");
      function where(Prisma, name) {
        return Prisma.raw(`WHERE name = '${name}'`);
      }
    expect_match_text:
    - Prisma.raw
  - name: literal prisma raw fragment negative
    code: |
      const _u = require("@prisma/client");
      function orderBy(Prisma) {
        return Prisma.raw("ORDER BY created_at");
      }
    expect_no_match: true
  description: Prisma.raw creates an unescaped SQL fragment; tainted strings bypass Prisma.sql tagged-template binding.
