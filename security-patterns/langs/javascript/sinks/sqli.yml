  match:
    kind: call
    callee:
      regex: ^PrismaClient\.\$queryRawUnsafe$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: prisma query raw unsafe
    code: |
      const _u = require("@prisma/client");
      function demo(input, req, obj) {
        return PrismaClient.$queryRawUnsafe(input, "SELECT * FROM users WHERE id = " + input);
      }
  - name: literal prisma query raw unsafe negative
    code: |
      const _u = require("@prisma/client");
      function demo(input) {
        return PrismaClient.$queryRawUnsafe("SELECT * FROM users WHERE id = ?", input);
      }
    expect_no_match: true
  description: "Prisma $queryRawUnsafe disables the tagged-template protection - tainted input is injected."
