- id: javascript.sqli.method_query_concat
  enabled: true
  language: javascript
  tag: sql-injection
  severity: critical
  category: sql-exec
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      name: query
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: method query concat
    code: |
      const _u = require("mysql");
      function demo(input, req, obj) {
        return conn.query("SELECT * FROM users WHERE id = " + input);
      }
  - name: literal method query negative
    code: |
      const _u = require("mysql");
      function demo(input) {
        return conn.query("SELECT * FROM users WHERE id = ?", [input]);
      }
    expect_no_match: true
  description: "<recv>.query(sql) where arg has a SQL keyword AND concat / template-literal marker - driver-agnostic SQL-injection sink for `conn.query(...)`, `db.query(...)`, and `client.query(...)` shapes the package-anchored rules miss. Merged aliases: javascript.sqli.method_query_sql_variable."
  aliases:
  - javascript.sqli.method_query_sql_variable
  - javascript.sqli.mysql_query
  - javascript.sqli.mysql_query_db
  - javascript.sqli.mysql2_pool_query
  - javascript.sqli.sequelize_query
  - javascript.sqli.typeorm_query
  - javascript.sqli.typeorm_manager_query
  - javascript.sqli.typeorm_datasource_query
  - javascript.sqli.pg_query
  - javascript.sqli.pg_client_query
  - javascript.sqli.mssql_query
  packages:
  - mysql
  - mysql2
  - sequelize
  - typeorm
  - pg
  - mssql
  imports:
  - mysql
  - mysql2
  - sequelize
  - pg
  - mssql
- id: javascript.sqli.method_execute_concat
  enabled: true
  language: javascript
  tag: sql-injection
  severity: critical
  category: sql-exec
  cwe:
  - CWE-89
  - CWE-943
  match:
    kind: call
    callee:
      name: execute
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: method execute concat
    code: |
      const _u = require("graphql");
      function demo(input, req, obj) {
        return conn.execute("SELECT * FROM users WHERE id = " + input);
      }
  - name: literal method execute negative
    code: |
      const _u = require("mysql2");
      function demo(input) {
        return conn.execute("SELECT * FROM users WHERE id = ?", [input]);
      }
    expect_no_match: true
  description: "<recv>.execute(sql) - same shape as `query`, used by mysql2 prepared statements + several ORMs. Merged collision aliases: javascript.graphql.schema_execute, javascript.nosql.cassandra_execute, javascript.sqli.mysql_execute, javascript.sqli.mysql_execute_db, javascript.sqli.mysql2_pool_execute."
  aliases:
  - javascript.graphql.schema_execute
  - javascript.nosql.cassandra_execute
  - javascript.sqli.mysql_execute
  - javascript.sqli.mysql_execute_db
  - javascript.sqli.mysql2_pool_execute
  packages:
  - graphql
  - cassandra-driver
  - mysql2
  imports:
  - mysql2
- id: javascript.sqli.prisma_instance_query_raw_unsafe
  enabled: true
  language: javascript
  tag: sql-injection
  severity: critical
  packages:
  - '@prisma/client'
  imports:
  - '@prisma/client'
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.\$queryRawUnsafe$
      base_name_in:
      - prisma
      - db
      - client
      - tx
      - conn
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: prisma instance queryRawUnsafe concat
    code: |
      const _u = require("@prisma/client");
      async function byId(prisma, id) {
        return prisma.$queryRawUnsafe("SELECT * FROM users WHERE id = " + id);
      }
    expect_match_text:
    - prisma.$queryRawUnsafe
  - name: prisma instance queryRawUnsafe sql variable concat
    code: |
      const _u = require("@prisma/client");
      async function byId(prisma, sql, id) {
        return prisma.$queryRawUnsafe(sql + id);
      }
    expect_match_text:
    - prisma.$queryRawUnsafe
  - name: prisma instance queryRawUnsafe template
    code: |
      const _u = require("@prisma/client");
      async function byName(prisma, name) {
        return prisma.$queryRawUnsafe(`SELECT * FROM users WHERE name = '${name}'`);
      }
    expect_match_text:
    - prisma.$queryRawUnsafe
  - name: literal prisma instance queryRawUnsafe negative
    code: |
      const _u = require("@prisma/client");
      async function byId(prisma) {
        return prisma.$queryRawUnsafe("SELECT * FROM users WHERE id = 1");
      }
    expect_no_match: true
  description: "Prisma client instance $queryRawUnsafe - raw SQL string execution with no tagged-template parameterization."
