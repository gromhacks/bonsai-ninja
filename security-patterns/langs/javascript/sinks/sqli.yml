- id: javascript.sqli.knex_raw
  enabled: true
  language: javascript
  tag: sql-injection
  severity: high
  category: sql-exec
  packages:
  - knex
  imports:
  - knex
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      attribute:
      - knex
      - raw
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: knex raw
    code: |
      const _u = require("knex");
      function demo(input, req, obj) {
        return knex.raw(input, "SELECT * FROM users WHERE id = " + input);
      }
  - name: literal knex raw negative
    code: |
      const _u = require("knex");
      function demo(input) {
        return knex.raw("SELECT * FROM users WHERE id = ?", [input]);
      }
    expect_no_match: true
  description: "knex.raw interpolates the string directly into the query - always unsafe on tainted input."
- id: javascript.sqli.prisma_query_raw_unsafe
