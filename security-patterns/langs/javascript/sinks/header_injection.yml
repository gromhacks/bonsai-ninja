- id: javascript.header.bun_response_content_disposition
  enabled: true
  language: javascript
  tag: header-injection
  severity: high
  packages:
  - bun
  - next
  cwe:
  - CWE-113
  - CWE-79
  - CWE-601
  match:
    kind: new
    callee:
      name: Response
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: bun response content disposition
    code: |
      const _u = require("bun");
      function download(filename) {
        return new Response("ok", { headers: { "Content-Disposition": filename } });
      }
    expect_match_text:
    - Response
  - name: literal bun response content disposition negative
    code: |
      const _u = require("bun");
      function download() {
        return new Response("ok", { headers: { "Content-Disposition": "attachment; filename=safe.txt" } });
      }
    expect_no_match: true
  description: "Bun/fetch Response headers Content-Disposition value - tainted filename can inject response headers. Merged aliases: javascript.xss.bun_response_html_body."
  aliases:
  - javascript.xss.bun_response_html_body
  - javascript.open_redirect.fetch_response_location
- id: javascript.header.hapi_content_disposition
  enabled: true
  language: javascript
  tag: header-injection
  severity: high
  packages:
  - '@hapi/hapi'
  cwe:
  - CWE-113
  - CWE-601
  - CWE-79
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.response\([^)]*\)\.header$|^[A-Za-z_$][A-Za-z0-9_$]*\.response\.header$
      base_name_in:
      - h
      - reply
      - res
      - response
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: hapi response content disposition
    code: |
      const _u = require("@hapi/hapi");
      function download(h, filename) {
        return h.response("ok").header("Content-Disposition", filename);
      }
    expect_match_text:
    - h.response("ok").header
  - name: literal hapi response content disposition negative
    code: |
      const _u = require("@hapi/hapi");
      function download(h) {
        return h.response("ok").header("Content-Disposition", "attachment; filename=safe.txt");
      }
    expect_no_match: true
  description: "Hapi <h>.response(...).header('Content-Disposition', tainted) - filename/header value can inject response headers. The bare `response.header(...)` shape (where the framework passes a `response` object directly) is intentionally not matched here to avoid colliding with express/fastify; rely on the response()-prefixed shape and the package gate. Merged aliases: javascript.open_redirect.hapi_response_header_location, javascript.xss.hapi_response_html_body."
  aliases:
  - javascript.open_redirect.hapi_response_header_location
  - javascript.xss.hapi_response_html_body
