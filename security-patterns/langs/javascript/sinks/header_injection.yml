- id: javascript.header.node_content_disposition_setheader
  enabled: true
  language: javascript
  tag: header-injection
  severity: high
  packages: [http, express, fastify, '@hapi/hapi', koa]
  cwe:
  - CWE-113
  - CWE-601
  - CWE-444
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.setHeader$
      base_name_in:
      - res
      - response
      - reply
      - ctx
      - resp
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: node content disposition setHeader
    code: |
      const http = require("http");
      function download(res, filename) {
        return res.setHeader("Content-Disposition", filename);
      }
    expect_match_text:
    - res.setHeader
  - name: literal node content disposition setHeader negative
    code: |
      const http = require("http");
      function download(res) {
        return res.setHeader("Content-Disposition", "attachment; filename=safe.txt");
      }
    expect_no_match: true
  description: "Node <res>.setHeader(name, tainted) - header value can inject response headers. Receiver-agnostic; the taint engine narrows by argument flow. Merged aliases: javascript.open_redirect.node_setheader_location."
  aliases:
  - javascript.open_redirect.node_setheader_location
  - javascript.header.express_setheader
  - javascript.smuggle.set_dual_cl_te_headers
