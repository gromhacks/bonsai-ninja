- id: javascript.header.express_response_set
  enabled: true
  language: javascript
  tag: header-injection
  severity: high
  packages:
  - express
  - restify
  cwe:
  - CWE-113
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - res
      - set
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: express response set value
    code: |
      const _u = require("express");
      function demo(input, req, obj) {
        return res.set("Content-Disposition", input);
      }
  - name: literal express response set negative
    code: |
      const _u = require("express");
      function demo() {
        return res.set("Content-Disposition", "attachment; filename=safe.txt");
      }
    expect_no_match: true
  description: 'Express/Restify res.set(name, tainted). Merged aliases: javascript.open_redirect.express_res_set_location.'
  aliases:
  - javascript.open_redirect.express_res_set_location
- id: javascript.header.express_response_set_object
  enabled: true
  language: javascript
  tag: header-injection
  severity: high
  packages:
  - express
  - restify
  cwe:
  - CWE-113
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - res
      - set
  constraints:
  - max_args: 1
  - arg_tainted:
      index: 0
  match_examples:
  - name: express response set object
    code: |
      const _u = require("express");
      function demo(input, req, obj) {
        return res.set(input);
      }
  - name: literal express response set object negative
    code: |
      const _u = require("express");
      function demo() {
        return res.set({ "Content-Disposition": "attachment; filename=safe.txt" });
      }
    expect_no_match: true
  description: "Express/Restify res.set(headersObject) - tainted header map can inject response headers or Location values."
