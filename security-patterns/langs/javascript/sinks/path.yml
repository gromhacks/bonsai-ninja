- id: javascript.path.fs_readfile
  enabled: true
  language: javascript
  tag: path-traversal
  severity: high
  packages: [fs]
  imports: [fs]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      regex: "^fs\\.readFile$"
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    guard_profile: path-consumer-containment
    path_consumer_containment_guard:
      canonicalizer:
        attribute: [path, resolve]
      base_canonicalizer:
        regex: '^(path\.resolve|fs\.realpath(?:Sync)?)$'
      path_constructor:
        attribute: [path, resolve]
      containment_check:
        name: startsWith
      sink_path_arg_index: 0
      path_constructor_base_arg_index: 0
      boundary_places: [path.sep]
  match_examples:
  - name: fs readfile
    code: |
      const _u = require("fs");
      function demo(input, req, obj) {
        return fs.readFile(input);
      }
  - name: literal fs readfile negative
    code: |
      const _u = require("fs");
      function demo() {
        return fs.readFile("/var/app/config.json");
      }
    expect_no_match: true
  description: fs.readFile - tainted path enables directory traversal.

