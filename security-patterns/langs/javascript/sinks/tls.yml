- id: javascript.tls.https_reject_unauthorized
  enabled: true
  language: javascript
  tag: weak-tls
  severity: high
  cwe:
  - CWE-295
  match:
    kind: write
    target:
      name: rejectUnauthorized
  match_examples:
  - name: https reject unauthorized
    code: "function demo(input, req, obj) {\n  rejectUnauthorized = input; return rejectUnauthorized;\n}\n"
  description: "`rejectUnauthorized` property assignment — when set to false, disables TLS certificate validation (MITM). Write-match accepts any RHS; audit the literal."
- id: javascript.tls.node_tls_reject_unauth_env
  enabled: true
  language: javascript
  tag: weak-tls
  severity: high
  cwe:
  - CWE-295
  match:
    kind: write
    target:
      name: NODE_TLS_REJECT_UNAUTHORIZED
  match_examples:
  - name: node tls reject unauth env
    code: "function demo(input, req, obj) {\n  NODE_TLS_REJECT_UNAUTHORIZED = input; return NODE_TLS_REJECT_UNAUTHORIZED;\n}\n"
  description: "process.env.NODE_TLS_REJECT_UNAUTHORIZED assignment — when set to '0', disables TLS verification process-wide."
- id: javascript.tls.axios_https_agent_reject_unauth
  enabled: true
  language: javascript
  tag: weak-tls
  severity: high
  packages:
  - https
  - axios
  cwe:
  - CWE-295
  match:
    kind: new
    callee:
      attribute:
      - https
      - Agent
  match_examples:
  - name: axios https agent reject unauth
    code: |
      const _u = require("https");
      function demo(input, req, obj) {
        return new https.Agent(input, { rejectUnauthorized: false });
      }
  description: "new https.Agent({rejectUnauthorized: false}) — agent ignores cert errors."
- id: javascript.tls.request_strict_ssl_false
  enabled: true
  language: javascript
  tag: weak-tls
  severity: high
  packages:
  - request
  cwe:
  - CWE-295
  match:
    kind: write
    target:
      name: strictSSL
  match_examples:
  - name: request strict ssl false
    code: |
      const _u = require("request");
      function demo(input, req, obj) {
        strictSSL = input; return strictSSL;
      }
  description: "request strictSSL property assignment — when set to false, legacy http client cert validation is off."
- id: javascript.tls.tls_connect_reject_unauth
  enabled: true
  language: javascript
  tag: weak-tls
  severity: high
  packages:
  - tls
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      attribute:
      - tls
      - connect
  match_examples:
  - name: tls connect reject unauth
    code: |
      const _u = require("tls");
      function demo(input, req, obj) {
        return tls.connect(input, { rejectUnauthorized: false });
      }
  description: "tls.connect({rejectUnauthorized: false}) — raw TLS socket with validation off."
- id: javascript.tls.fetch_node_insecure
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: weak-tls
  severity: medium
  cwe:
  - CWE-295
  match:
    kind: write
    target:
      name: insecureHTTPParser
  description: "Disabled — insecureHTTPParser is HTTP-parser laxity (request smuggling), not TLS validation."
- id: javascript.tls.grpc_create_insecure
  enabled: true
  language: javascript
  tag: weak-tls
  severity: high
  packages:
  - grpc
  - '@grpc/grpc-js'
  cwe:
  - CWE-319
  match:
    kind: call
    callee:
      regex: ^(grpc\.)?credentials\.createInsecure$
  match_examples:
  - name: grpc credentials create insecure
    code: |
      const _u = require("grpc");
      function demo(grpc) {
        return grpc.credentials.createInsecure();
      }
    expect_match_text:
    - grpc.credentials.createInsecure
  - name: imported credentials create insecure
    code: |
      const _u = require("grpc");
      function demo(credentials) {
        return credentials.createInsecure();
      }
    expect_match_text:
    - credentials.createInsecure
  description: gRPC credentials.createInsecure() creates an unencrypted client/server channel.
- id: javascript.tls.disable_verify_node_https
  enabled: false
  disabled_reason:
    code: subsumed
  language: javascript
  tag: weak-tls
  severity: high
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      attribute:
      - https
      - request
  description: "Disabled duplicate — same https.request rejectUnauthorized:false shape is covered by javascript.tls.https_request_reject_unauth."
- id: javascript.tls.disable_verify_axios
  enabled: true
  language: javascript
  tag: weak-tls
  severity: high
  packages:
  - axios
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      attribute:
      - axios
      - create
  match_examples:
  - name: disable verify axios
    code: |
      const _u = require("axios");
      function demo(input, req, obj) {
        return axios.create(input, { rejectUnauthorized: false });
      }
  description: "axios.create({httpsAgent: new https.Agent({rejectUnauthorized: false})}) — global axios with TLS verification off."
- id: javascript.tls.disable_verify_env
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: weak-tls
  severity: high
  cwe:
  - CWE-295
  match:
    kind: write
    target:
      name: process.env.NODE_TLS_REJECT_UNAUTHORIZED
  description: "process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0' — disables TLS verification for the entire process."
