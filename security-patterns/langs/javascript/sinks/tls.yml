- id: javascript.tls.node_tls_reject_unauth_env
  enabled: true
  language: javascript
  tag: weak-tls
  category: source-independent
  severity: high
  cwe:
  - CWE-295
  match:
    kind: write
    target:
      attribute: [process, env, NODE_TLS_REJECT_UNAUTHORIZED]
      binding_origin: runtime-global
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^(?:"0"|''0''|0)$'
  match_examples:
  - name: node tls reject unauth env
    code: |
      process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0";
  - name: ordinary similarly named variable negative
    code: |
      function configure(value) {
        NODE_TLS_REJECT_UNAUTHORIZED = value;
      }
    expect_no_match: true
  - name: enabled node tls verification negative
    code: |
      process.env.NODE_TLS_REJECT_UNAUTHORIZED = "1";
    expect_no_match: true
  - name: locally shadowed process object negative
    code: |
      function configure(process) {
        process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0";
      }
    expect_no_match: true
  description: "`process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'` disables TLS verification process-wide; compiler-proven runtime ownership and exact value constraints reject local shadows and enabled settings."
- id: javascript.tls.axios_https_agent_reject_unauth
  enabled: true
  language: javascript
  tag: weak-tls
  category: source-independent
  severity: high
  packages:
  - https
  imports: [https, "node:https"]
  cwe:
  - CWE-295
  match:
    kind: new
    callee:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.Agent$'
      binding_origin: imported
  constraints:
  - arg_aggregate_fields_equal:
      argument_index: 0
      required_fields:
      - path: [rejectUnauthorized]
        value: {kind: boolean, value: false}
  match_examples:
  - name: HTTPS agent disables certificate verification
    code: |
      const https = require("https");
      function demo(input, req, obj) {
        return new https.Agent({ rejectUnauthorized: false });
      }
  - name: https agent default options negative
    code: |
      const https = require("https");
      function demo() {
        return new https.Agent({ keepAlive: true });
      }
    expect_no_match: true
  - name: local https object is not the imported runtime module
    code: |
      const runtimeHttps = require("https");
      void runtimeHttps.Agent;
      const https = { Agent: class Agent { constructor(options) {} } };
      new https.Agent({ rejectUnauthorized: false });
    expect_no_match: true
  description: "new https.Agent({rejectUnauthorized: false}) disables certificate validation. The exact compiler-decoded aggregate field keeps ordinary agent construction and dynamic/spread options quiet."
- id: javascript.tls.request_strict_ssl_false
  enabled: true
  language: javascript
  tag: weak-tls
  category: source-independent
  severity: high
  packages:
  - request
  imports: [request]
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*(?:\.(?:get|post|put|patch|delete|head))?$'
      binding_origin: imported
  constraints:
  - arg_aggregate_fields_equal:
      argument_index: 0
      required_fields:
      - path: [strictSSL]
        value: {kind: boolean, value: false}
  match_examples:
  - name: request call disables TLS verification
    code: |
      const request = require("request");
      function fetch(url) {
        return request({ url, strictSSL: false });
      }
  - name: request call enables TLS verification negative
    code: |
      const request = require("request");
      function fetch(url) {
        return request({ url, strictSSL: true });
      }
    expect_no_match: true
  - name: aliased request provider disables TLS verification
    code: |
      const sendRequest = require("request");
      sendRequest({ uri: "https://service.invalid", strictSSL: false });
    expect_match_text: [sendRequest]
  - name: local request function is not the imported package
    code: |
      const externalRequest = require("request");
      void externalRequest.get;
      function request(options) { return options; }
      request({ strictSSL: false });
    expect_no_match: true
  - name: unused options property is not a request sink negative
    code: |
      const request = require("request");
      function configure(options) {
        options.strictSSL = false;
        return options;
      }
    expect_no_match: true
  description: "A request package call whose exact compiler-decoded options contain `strictSSL: false` disables certificate validation; unused objects and secure calls stay quiet."
- id: javascript.tls.request_strict_ssl_false_second_options
  enabled: true
  language: javascript
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [request]
  imports: [request]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*(?:\.(?:get|post|put|patch|delete|head))?$'
      binding_origin: imported
  constraints:
  - arg_aggregate_fields_equal:
      argument_index: 1
      required_fields:
      - path: [strictSSL]
        value: {kind: boolean, value: false}
  match_examples:
  - name: request URL overload disables TLS verification
    code: |
      const request = require("request");
      function fetch(url) {
        return request.get(url, { strictSSL: false });
      }
  - name: request URL overload retains TLS verification negative
    code: |
      const request = require("request");
      function fetch(url) {
        return request.get(url, { strictSSL: true });
      }
    expect_no_match: true
  - name: local request object is not the imported package
    code: |
      const externalRequest = require("request");
      void externalRequest.get;
      const request = { get(url, options) { return options; } };
      request.get("https://service.invalid", { strictSSL: false });
    expect_no_match: true
  description: "The request package URL overload disables certificate validation only when its second, compiler-decoded options aggregate sets `strictSSL: false`."
- id: javascript.tls.tls_connect_reject_unauth
  enabled: true
  language: javascript
  tag: weak-tls
  category: source-independent
  severity: high
  packages:
  - tls
  imports: [tls, "node:tls"]
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.connect$'
      binding_origin: imported
  constraints:
  - arg_aggregate_fields_equal:
      argument_index: 0
      required_fields:
      - path: [rejectUnauthorized]
        value: {kind: boolean, value: false}
  match_examples:
  - name: tls connect reject unauth
    code: |
      const tls = require("tls");
      function connect() {
        return tls.connect({ host: "service.invalid", port: 443, rejectUnauthorized: false });
      }
  - name: tls connect default options negative
    code: |
      const tls = require("tls");
      function connect() {
        return tls.connect(443, { host: "api.example.com" });
      }
    expect_no_match: true
  - name: local tls object is not the imported runtime module
    code: |
      const runtimeTls = require("tls");
      void runtimeTls.connect;
      const tls = { connect(options) { return options; } };
      tls.connect({ rejectUnauthorized: false });
    expect_no_match: true
  description: "tls.connect({rejectUnauthorized: false}) opens a raw TLS socket with validation off; the exact compiler-decoded aggregate field rejects secure, dynamic, and spread option values."
