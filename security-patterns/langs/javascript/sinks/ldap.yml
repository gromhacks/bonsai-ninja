# JavaScript LDAP-injection (ldapjs / ldap-client / activedirectory).
- id: javascript.ldap.ldapjs_search
  enabled: true
  language: javascript
  tag: ldap-injection
  severity: high
  packages: [ldapjs, ldapts]
  imports: [ldapjs, ldapts]
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      attribute: [client, search]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ldapjs search
    code: |
      const _u = require("ldapjs");
      function demo(input, req, obj) {
        return client.search("(uid=" + input + ")");
      }
    expect_match_text: [client.search]
  - name: literal ldapjs search negative
    code: |
      const _u = require("ldapjs");
      function demo() {
        return client.search("(uid=alice)");
      }
    expect_no_match: true
  description: "ldapjs/ldapts client.search with tainted filter."

