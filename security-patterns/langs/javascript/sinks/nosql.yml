- id: javascript.nosql.mongo_find
  enabled: true
  language: javascript
  tag: nosql-injection
  severity: high
  packages:
  - mongodb
  imports:
  - mongodb
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      regex: (?:^|\.)(?:find|findOne|findOneAnd(?:Update|Delete|Replace))$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: mongo find
    code: |
      const _u = require("mongodb");
      function demo(input, req, obj) {
        return collection.find(input, { "$where": input });
      }
  - name: mongo findOne destructured shorthand
    code: |
      const _u = require("mongodb");
      function login(collection, req) {
        const { username, password } = req.body;
        return collection.findOne({ username, password });
      }
    expect_match_text:
    - collection.findOne
  - name: mongoose model findOne destructured shorthand
    code: |
      const _u = require("mongodb");
      function login(UserModel, req) {
        const { email, password } = req.body;
        return UserModel.findOne({ email, password });
      }
    expect_match_text:
    - UserModel.findOne
  - name: couchdb selector find
    code: |
      const _u = require("mongodb");
      function query(db, selector) {
        return db.find(selector);
      }
    expect_match_text:
    - db.find
  - name: literal mongo find negative
    code: |
      const _u = require("mongodb");
      function query(collection) {
        return collection.find({ active: true });
      }
    expect_no_match: true
  description: "Mongo-style find/findOne filter APIs — tainted object-form filters enable $where/$regex/operator injection. Merged collision aliases: javascript.nosql.mongo_findone, javascript.nosql.mongo_credential_object_filter, javascript.nosql.mongo_caller_controlled_filter_value, javascript.nosql.mongoose_find, javascript.nosql.couchdb_find."
  aliases:
  - javascript.nosql.mongo_findone
  - javascript.nosql.mongo_credential_object_filter
  - javascript.nosql.mongo_caller_controlled_filter_value
  - javascript.nosql.mongo_findone_body_spread
  - javascript.nosql.mongo_shorthand_credential_filter
  - javascript.nosql.mongoose_find
  - javascript.nosql.mongoose_findone
  - javascript.nosql.mongoose_credential_object_filter
  - javascript.nosql.mongoose_caller_controlled_filter_value
  - javascript.nosql.mongoose_shorthand_credential_filter
  - javascript.nosql.mongoose_findoneandupdate
  - javascript.nosql.mongoose_findoneanddelete
  - javascript.nosql.mongoose_findoneandreplace
  - javascript.nosql.nedb_find
  - javascript.nosql.mongoose_model_findone_body_spread
  - javascript.nosql.couchdb_find
