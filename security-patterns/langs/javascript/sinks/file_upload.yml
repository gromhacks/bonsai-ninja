# JavaScript file-upload sinks (multer/formidable/express-fileupload/busboy).
- id: javascript.upload.express_fileupload_mv_any_file
  enabled: true
  language: javascript
  tag: file-upload
  severity: high
  packages: [express-fileupload]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.mv$"
  constraints:
  - arg_tainted:
      index: 0
  - receiver_tainted: true
  match_examples:
  - name: uploadedFile mv tainted destination
    code: |
      const _fileupload = require("express-fileupload");
      function save(req) {
        const uploadedFile = req.files.avatar;
        const destination = "/srv/uploads/" + uploadedFile.name;
        return uploadedFile.mv(destination);
      }
    expect_match_text: [uploadedFile.mv]
  - name: file mv tainted destination
    code: |
      const _fileupload = require("express-fileupload");
      function save(req) {
        const file = req.files.document;
        const destination = "/srv/uploads/" + file.name;
        return file.mv(destination);
      }
    expect_match_text: [file.mv]
  - name: file mv literal destination negative
    code: |
      const _fileupload = require("express-fileupload");
      function save(req) {
        const file = req.files.avatar;
        return file.mv("/srv/uploads/avatar.png");
      }
    expect_no_match: true
  description: "express-fileupload .mv(dest) - moving a remotely supplied upload to an attacker-influenced destination. The receiver and destination must both carry compiler-proven taint, and receiver-agnostic syntax is admitted only with package evidence."

- id: javascript.upload.path_join_original_filename
  enabled: true
  language: javascript
  tag: file-upload
  severity: high
  packages: [multer, formidable, busboy, express-fileupload, path]
  cwe: [CWE-22, CWE-434]
  match:
    kind: call
    callee:
      attribute: [path, join]
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: multer originalname path join
    code: |
      const _u = require("multer");
      function dest(path, uploadDir, file) {
        return path.join(uploadDir, file.originalname);
      }
    expect_match_text: [path.join]
  - name: literal upload path join negative
    code: |
      const _u = require("multer");
      function dest(path) {
        return path.join("/srv/uploads", "avatar.png");
      }
    expect_no_match: true
  - name: busboy filename path join
    code: |
      const _u = require("multer");
      function dest(path, uploadDir, info) {
        return path.join(uploadDir, info.filename);
      }
    expect_match_text: [path.join]
  description: "Joining upload directories with client-controlled filenames - filename traversal/overwrite sink before file write or mv."
