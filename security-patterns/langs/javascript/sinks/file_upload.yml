# JavaScript file-upload sinks (multer/formidable/express-fileupload/busboy).
- id: javascript.upload.multer_diskstorage
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: file-upload
  severity: high
  packages: [multer]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [multer, diskStorage]
  description: "Disabled duplicate — javascript.upload.multer_destination_filename_callbacks covers the same multer.diskStorage site with callback-specific examples."

- id: javascript.upload.formidable_form
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: file-upload
  severity: high
  packages: [formidable]
  cwe: [CWE-434]
  match:
    kind: new
    callee:
      attribute: [formidable, IncomingForm]
  match_examples:
  - name: formidable form
    code: |
      const _u = require("formidable");
      function demo(input, req, obj) {
        return new formidable.IncomingForm(input);
      }
  description: "Disabled — new formidable.IncomingForm() is upload parser setup, not a vulnerability by itself. Flag the downstream path/write using multipart filename sources."

- id: javascript.upload.express_fileupload_mv
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: javascript.upload.express_fileupload_mv_any_file
  language: javascript
  tag: file-upload
  severity: high
  packages: [express-fileupload]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [files, mv]
  description: "Subsumed by javascript.upload.express_fileupload_mv_any_file — the receiver-agnostic regex covers `files.mv` plus the more common `req.files.<name>.mv` shape."

- id: javascript.upload.busboy_on_file
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: file-upload
  severity: medium
  packages: [busboy]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [busboy, on]
  match_examples:
  - name: busboy on file
    code: |
      const _u = require("busboy");
      function demo(input, req, obj) {
        return busboy.on('file');
      }
  description: "Disabled — busboy.on('file', handler) is normal event registration. Model handler filename metadata as a source and flag downstream writes."

- id: javascript.upload.express_fileupload_mv_any_file
  enabled: true
  language: javascript
  tag: file-upload
  severity: high
  packages: [express-fileupload]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.mv$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: uploadedFile mv tainted destination
    code: |
      const { UploadedFile } = require("express-fileupload");
      function save(input) {
        const uploadedFile = new UploadedFile();
        return uploadedFile.mv(input);
      }
    expect_match_text: [uploadedFile.mv]
  - name: file mv tainted destination
    code: |
      const { UploadedFile } = require("express-fileupload");
      function save(input) {
        const file = new UploadedFile();
        return file.mv(input);
      }
    expect_match_text: [file.mv]
  - name: file mv literal destination negative
    code: |
      const { UploadedFile } = require("express-fileupload");
      function save() {
        const file = new UploadedFile();
        return file.mv("/srv/uploads/avatar.png");
      }
    expect_no_match: true
  description: "express-fileupload .mv(dest) — writing uploaded content to attacker-influenced destination paths. Receiver-agnostic; package context gate on express-fileupload narrows to that ecosystem."

- id: javascript.upload.path_join_original_filename
  enabled: true
  language: javascript
  tag: file-upload
  severity: high
  packages: [multer, formidable, busboy, express-fileupload, path]
  cwe: [CWE-22, CWE-434]
  match:
    kind: call
    callee:
      attribute: [path, join]
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: multer originalname path join
    code: |
      const _u = require("multer");
      function dest(path, uploadDir, file) {
        return path.join(uploadDir, file.originalname);
      }
    expect_match_text: [path.join]
  - name: literal upload path join negative
    code: |
      const _u = require("multer");
      function dest(path) {
        return path.join("/srv/uploads", "avatar.png");
      }
    expect_no_match: true
  - name: busboy filename path join
    code: |
      const _u = require("multer");
      function dest(path, uploadDir, info) {
        return path.join(uploadDir, info.filename);
      }
    expect_match_text: [path.join]
  description: "Joining upload directories with client-controlled filenames — filename traversal/overwrite sink before file write or mv."

- id: javascript.upload.multer_destination_filename_callbacks
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: file-upload
  severity: medium
  packages: [multer]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [multer, diskStorage]
  match_examples:
  - name: multer diskStorage filename originalname
    code: |
      const _u = require("multer");
      const storage = multer.diskStorage({
        filename(req, file, cb) {
          cb(null, file.originalname);
        }
      });
    expect_match_text: [multer.diskStorage]
  - name: multer diskStorage destination
    code: |
      const _u = require("multer");
      const storage = multer.diskStorage({
        destination(req, file, cb) {
          cb(null, req.body.dir);
        }
      });
    expect_match_text: [multer.diskStorage]
  description: "Disabled — multer.diskStorage itself is normal upload configuration. Flag path.join/file-write flows fed by file.originalname or request fields instead."
