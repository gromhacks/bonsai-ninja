      const { AgentExecutor } = require("langchain");
      async function demo(input) {
        const agent = new AgentExecutor();
        return agent.call({ input });
      }
    expect_match_text: [agent.call]
  - name: langchain agent.call literal negative
    code: |
      const { AgentExecutor } = require("langchain");
      async function demo() {
        const agent = new AgentExecutor();
