- id: javascript.llm.cohere_chat
  enabled: true
  language: javascript
  tag: web-llm
  severity: medium
  packages: [cohere-ai]
  imports: [cohere-ai]
  cwe: [CWE-74, CWE-1427]
  match:
    kind: call
    callee:
      regex: "^CohereClient\\.chat$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: cohere client chat tainted
    code: |
      const { CohereClient } = require("cohere-ai");
      async function demo(input) {
        const client = new CohereClient();
        return client.chat({ message: input });
      }
    expect_match_text: [client.chat]
  - name: cohere client chat literal negative
    code: |
      const { CohereClient } = require("cohere-ai");
      async function demo() {
        const client = new CohereClient();
        return client.chat({ message: "Hello" });
      }
    expect_no_match: true
  description: "Cohere client.chat({message: tainted}) - attacker-controlled message hijacks Cohere chat instructions and can drive tool / connector calls."
