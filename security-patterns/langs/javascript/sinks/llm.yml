- id: javascript.llm.langchain_chain_invoke
  enabled: true
  language: javascript
  tag: web-llm
  severity: medium
  packages: [langchain, "@langchain/core"]
  imports: [langchain]
  cwe: [CWE-74, CWE-1427]
  match:
    kind: call
    callee:
      regex: "^(Runnable|RunnableSequence|LLMChain|AgentExecutor)\\.invoke$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: langchain chain.invoke tainted
    code: |
      const { Runnable } = require("langchain");
      async function demo(input) {
        const chain = new Runnable();
        return chain.invoke(input);
      }
    expect_match_text: [chain.invoke]
  - name: langchain chain.invoke literal negative
    code: |
      const { Runnable } = require("langchain");
      async function demo() {
        const chain = new Runnable();
        return chain.invoke({ question: "What is 2+2?" });
      }
    expect_no_match: true
  description: "LangChain chain.invoke(tainted) / runnable.invoke - attacker-controlled chain input drives the LLM, can hijack instructions or steer tool calls."

- id: javascript.llm.langchain_agent_call
