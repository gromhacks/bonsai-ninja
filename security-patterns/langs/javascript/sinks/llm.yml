- id: javascript.llm.openai_chat_completions_create
  enabled: true
  language: javascript
  tag: web-llm
  severity: medium
  packages: [openai]
  imports: [openai]
  cwe: [CWE-74, CWE-1427]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.chat\\.completions\\.create$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: openai chat completions create
    code: |
      const _u = require("openai");
      function demo(input, req, obj) {
        return openai.chat.completions.create(input);
      }
  - name: openai chat completions literal negative
    code: |
      const _u = require("openai");
      function demo() {
        return openai.chat.completions.create({ messages: [{ role: "user", content: "safe" }] });
      }
    expect_no_match: true
  description: "openai.chat.completions.create - tainted prompt content reaches an LLM instruction / tool surface."

