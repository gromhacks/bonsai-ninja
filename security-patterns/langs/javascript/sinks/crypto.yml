- id: javascript.crypto.math_random
  enabled: true
  language: javascript
  tag: weak-randomness
  category: source-independent
  severity: medium
  cwe:
  - CWE-330
  - CWE-338
  match:
    kind: call
    callee:
      attribute:
      - Math
      - random
  match_examples:
  - name: math random
    code: "function demo(input, req, obj) {\n  return Math.random(input);\n}\n"
  description: "Math.random - non-cryptographic; flag in security-sensitive paths. JS Math global has no canonical ecosystem package, so strict `['Math', 'random']` match only."
- id: javascript.crypto.bcrypt_low_rounds
  enabled: true
  language: javascript
  tag: weak-crypto
  category: source-independent
  severity: medium
  packages:
  - bcrypt
  - bcryptjs
  cwe:
  - CWE-916
  match:
    kind: call
    callee:
      attribute:
      - bcrypt
      - hash
  constraints:
  - arg_lt:
      index: 1
      value: 10
  match_examples:
  - name: bcrypt low rounds
    code: |
      const bcrypt = require("bcrypt");
      function hash(password) {
        return bcrypt.hash(password, 4);
      }
    expect_match_text: [bcrypt.hash]
  - name: bcrypt acceptable rounds negative
    code: |
      const bcrypt = require("bcrypt");
      function hash(password) {
        return bcrypt.hash(password, 12);
      }
    expect_no_match: true
  description: "bcrypt.hash(password, rounds) with rounds < 10 - too cheap to compute; use an adequate work factor."
