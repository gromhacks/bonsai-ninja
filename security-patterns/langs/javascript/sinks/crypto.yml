- id: javascript.crypto.math_random
  enabled: true
  language: javascript
  tag: weak-randomness
  severity: medium
  cwe:
  - CWE-330
  - CWE-338
  match:
    kind: call
    callee:
      attribute:
      - Math
      - random
  match_examples:
  - name: math random
    code: "function demo(input, req, obj) {\n  return Math.random(input);\n}\n"
  description: "Math.random — non-cryptographic; flag in security-sensitive paths. TODO(only_when_packaged): JS Math global has no canonical ecosystem package, so OnlyWhenPackaged lax-tail can never fire — strict `['Math', 'random']` match only."
