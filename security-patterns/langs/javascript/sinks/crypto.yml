- id: javascript.crypto.createhash_md5
  enabled: true
  language: javascript
  tag: weak-crypto
  category: source-independent
  severity: low
  packages:
  - crypto
  imports:
  - crypto
  - node:crypto
  cwe:
  - CWE-327
  - CWE-328
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.createHash$'
      binding_origin: imported
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "(?i)^['\"](?:md2|md4|md5|sha1|sha-1)['\"]$"
  match_examples:
  - name: createhash md5
    code: |
      const crypto = require("crypto");
      function demo(input, req, obj) {
        return crypto.createHash('md5');
      }
  - name: createhash secure digest negative
    code: |
      const crypto = require("crypto");
      function demo() {
        return crypto.createHash("sha256");
      }
    expect_no_match: true
  - name: aliased Node crypto hash provider
    code: |
      const nodeCrypto = require("node:crypto");
      nodeCrypto.createHash("sha1");
    expect_match_text: [nodeCrypto.createHash]
  - name: application createHash collision negative
    code: |
      const crypto = { createHash(name) { return name; } };
      function demo() {
        return crypto.createHash("md5");
      }
    expect_no_match: true
  description: "Node crypto.createHash with a compiler-decoded weak digest name is insecure; SHA-2/SHA-3 and application-local providers stay quiet. Merged aliases: javascript.crypto.createhash_sha1."
  aliases:
  - javascript.crypto.createhash_sha1
- id: javascript.crypto.createcipher_des
  enabled: true
  language: javascript
  tag: weak-crypto
  category: source-independent
  severity: high
  packages:
  - crypto
  imports:
  - crypto
  - node:crypto
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.createCipheriv$'
      binding_origin: imported
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "(?i)^['\"](?:des|des-ede|des-ede3|des3|rc4|rc2|bf|blowfish|[a-z0-9-]*-ecb)['\"]$"
  match_examples:
  - name: createcipher des
    code: |
      const crypto = require("crypto");
      function demo(input, req, obj) {
        return crypto.createCipheriv('des');
      }
  - name: createcipher authenticated mode negative
    code: |
      const crypto = require("crypto");
      function demo(key, iv) {
        return crypto.createCipheriv("aes-256-gcm", key, iv);
      }
    expect_no_match: true
  - name: aliased Node crypto cipher provider
    code: |
      const nodeCrypto = require("node:crypto");
      nodeCrypto.createCipheriv("des");
    expect_match_text: [nodeCrypto.createCipheriv]
  - name: application createCipheriv collision negative
    code: |
      const crypto = { createCipheriv(name) { return name; } };
      function demo() {
        return crypto.createCipheriv("des");
      }
    expect_no_match: true
  description: "Node crypto.createCipheriv with an exact weak cipher or ECB algorithm is insecure; authenticated/non-ECB modes and local providers stay quiet. Merged aliases: javascript.crypto.createcipher_des_ede, javascript.crypto.createcipher_rc4, javascript.crypto.createcipher_aes128_ecb, javascript.crypto.createcipher_aes192_ecb, javascript.crypto.createcipher_aes256_ecb."
  aliases:
  - javascript.crypto.createcipher_des_ede
  - javascript.crypto.createcipher_rc4
  - javascript.crypto.createcipher_aes128_ecb
  - javascript.crypto.createcipher_aes192_ecb
  - javascript.crypto.createcipher_aes256_ecb
