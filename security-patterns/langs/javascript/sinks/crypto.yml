- id: javascript.crypto.gcm_decipher_no_authtaglength
  enabled: true
  language: javascript
  tag: weak-crypto
  category: source-independent
  severity: medium
  packages:
  - crypto
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - crypto
      - createDecipheriv
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "(?i)^['\"][a-z0-9-]*-gcm['\"]$"
  - arg_count: 3
  match_examples:
  - name: gcm decipher missing auth tag length
    code: |
      const _u = require("crypto");
      function demo(key, iv) {
        return crypto.createDecipheriv("aes-256-gcm", key, iv);
      }
    expect_match_text:
    - crypto.createDecipheriv
  - name: gcm decipher with explicit auth tag length negative
    code: |
      const crypto = require("crypto");
      function demo(key, iv) {
        return crypto.createDecipheriv("aes-256-gcm", key, iv, { authTagLength: 16 });
      }
    expect_no_match: true
  - name: non-GCM decipher negative
    code: |
      const crypto = require("crypto");
      function demo(key, iv) {
        return crypto.createDecipheriv("aes-256-cbc", key, iv);
      }
    expect_no_match: true
  description: "Node crypto.createDecipheriv with a compiler-decoded GCM algorithm and exactly three arguments omits authTagLength; explicit tag-length options and non-GCM modes stay quiet."
