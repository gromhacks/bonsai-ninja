- id: javascript.crypto.createhash_md5
  enabled: true
  language: javascript
  tag: weak-crypto
  severity: low
  packages:
  - crypto
  imports:
  - crypto
  cwe:
  - CWE-327
  - CWE-328
  match:
    kind: call
    callee:
      attribute:
      - crypto
      - createHash
  match_examples:
  - name: createhash md5
    code: |
      const _u = require("crypto");
      function demo(input, req, obj) {
        return crypto.createHash('md5');
      }
  description: "crypto.createHash('md5') — broken hash. Merged aliases: javascript.crypto.createhash_sha1."
  aliases:
  - javascript.crypto.createhash_sha1
