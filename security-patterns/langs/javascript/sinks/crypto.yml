- id: javascript.crypto.deprecated_createdecipher
  enabled: true
  language: javascript
  tag: weak-crypto
  severity: high
  packages:
  - crypto
  cwe:
  - CWE-327
  - CWE-1204
  match:
    kind: call
    callee:
      attribute:
      - crypto
      - createDecipher
  match_examples:
  - name: deprecated createdecipher
    code: |
      const _u = require("crypto");
      function demo(input, req, obj) {
        return crypto.createDecipher("aes-256-ctr", input);
      }
    expect_match_text:
    - crypto.createDecipher
  description: "crypto.createDecipher (no IV) — deprecated API derives predictable IVs from password material."
- id: javascript.crypto.gcm_decipher_no_authtaglength
  enabled: true
  language: javascript
  tag: weak-crypto
  severity: medium
  packages:
  - crypto
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - crypto
      - createDecipheriv
  match_examples:
  - name: gcm decipher missing auth tag length
    code: |
      const _u = require("crypto");
      function demo(key, iv) {
        return crypto.createDecipheriv("aes-256-gcm", key, iv);
      }
    expect_match_text:
    - crypto.createDecipheriv
  description: crypto.createDecipheriv('*-gcm', key, iv) without authTagLength can accept unexpectedly short GCM tags.
