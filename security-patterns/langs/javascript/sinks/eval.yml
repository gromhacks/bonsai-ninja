# JavaScript eval / dynamic-code sinks.
- id: javascript.eval.builtin_eval
  enabled: true
  language: javascript
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^eval$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: builtin eval
    code: |
      function demo(input, req, obj) {
        return eval(input);
      }
  - name: literal eval negative
    code: |
      function demo() {
        return eval("1 + 1");
      }
    expect_no_match: true
  description: |
    eval() — attacker-controlled JS is executed in the current scope.
    Bare-name match is intentional: `eval` is a real ECMAScript global.
    The `top_level: true` constraint excludes property access shapes
    like `foo.eval(x)` (e.g. mongodb db.eval, vm.runInThisContext)
    which are covered by their own package-scoped rules.

- id: javascript.eval.function_constructor
  enabled: false
  disabled_reason:
    code: subsumed
  language: javascript
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: new
    callee:
      name: Function
  description: "Disabled duplicate — adapter also emits new Function(...) as the call-form Function fact, covered by javascript.eval.function_constructor_call."

- id: javascript.eval.function_constructor_call
  aliases: [javascript.eval.function_constructor]
  enabled: true
  language: javascript
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: Function
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: function constructor
    code: |
      function demo(input, req, obj) {
        return new Function(input);
      }
    expect_match_text: [Function]
  - name: function constructor call concat
    code: |
      function demo(body) {
        return Function("return " + body);
      }
    expect_match_text: [Function]
  - name: function constructor call body variable
    code: |
      function demo(body) {
        return Function(body);
      }
    expect_match_text: [Function]
  - name: arg tainted literal negative
    code: "function demo(input, req, obj) {\n  return new Function(\"safe\");\n}\n"
    expect_no_match: true
  description: "Function('...' + body) / Function(body) — call-form Function constructor compiles attacker-controlled source."

