- id: javascript.eval.require_dynamic
  enabled: true
  language: javascript
  tag: code-injection
  severity: high
  cwe: [CWE-94, CWE-470]
  match:
    kind: call
    callee:
      name: require
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: require dynamic
    code: |
      function demo(input, req, obj) {
        return require(input);
      }
  - name: require literal negative
    code: |
      function demo() {
        return require("express");
      }
    expect_no_match: true
  description: "require(tainted) - attacker-controlled CommonJS module specifier can load unintended code or files."

# Reflection-based dynamic invocation (T406). Tag
# code-injection so reviewer enumerates with `security sinks
# --tag code-injection`. Treats reflection as eval-equivalent
# when the dispatched name comes from attacker input.
- id: javascript.eval.bracket_index_dynamic_call
  enabled: true
  language: javascript
  tag: code-injection
  severity: high
  cwe: [CWE-470]
  match:
    kind: call
    callee:
      attribute: [Reflect, apply]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: bracket index dynamic call
    code: |
      function demo(input, req, obj) {
        return Reflect.apply(input);
      }
  - name: literal bracket index dynamic call negative
    code: |
      function demo() {
        return Reflect.apply(Math.max, null, [1, 2]);
      }
    expect_no_match: true
  description: "Reflect.apply(target, this, args) - when target is selected by attacker name, eval-equivalent. JS Reflect global has no canonical ecosystem package, so strict `['Reflect', 'apply']` match only."
