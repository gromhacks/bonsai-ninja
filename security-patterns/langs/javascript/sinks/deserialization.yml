- id: javascript.deser.js_yaml_load
  enabled: true
  language: javascript
  tag: insecure-deserialization
  severity: high
  packages: [js-yaml]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [yaml, load]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: js yaml load
    code: |
      const _u = require("js-yaml");
      function demo(input, req, obj) {
        return yaml.load(input);
      }
    expect_match_text: [yaml.load]
  - name: literal js yaml load negative
    code: |
      const _u = require("js-yaml");
      function demo() {
        return yaml.load("name: demo");
      }
    expect_no_match: true
  description: js-yaml.load uses DEFAULT_SCHEMA which resolves arbitrary tags - use safeLoad/FAILSAFE_SCHEMA on tainted input.

- id: javascript.deser.yaml_load_namespace
  enabled: true
  language: javascript
  tag: insecure-deserialization
  severity: high
  packages: [yaml, js-yaml]
  imports: [yaml, js-yaml]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [YAML, load]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: YAML load namespace
    code: |
      const _u = require("yaml");
      function parse(YAML, input) {
        return YAML.load(input);
      }
    expect_match_text: [YAML.load]
  - name: literal YAML load namespace negative
    code: |
      const _u = require("yaml");
      function parse(YAML) {
        return YAML.load("name: demo");
      }
    expect_no_match: true
  description: "YAML.load(tainted) - namespace-imported YAML loaders can construct unsafe objects/tags from untrusted YAML."

