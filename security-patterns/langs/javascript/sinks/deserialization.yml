- id: javascript.deser.node_serialize_unserialize
  enabled: true
  language: javascript
  tag: insecure-deserialization
  severity: critical
  packages: [node-serialize]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      regex: "^(serialize|nodeSerialize|nodeSerializer)\\.unserialize$|^unserialize$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: namespace require call
    code: |
      const serialize = require("node-serialize");
      function handle(payload) {
        return serialize.unserialize(payload);
      }
    expect_match_text: [serialize.unserialize]
  - name: aliased node serialize call
    code: |
      const nodeSerialize = require("node-serialize");
      function handle(payload) {
        return nodeSerialize.unserialize(payload);
      }
    expect_match_text: [nodeSerialize.unserialize]
  - name: destructured unserialize call
    code: |
      const { unserialize } = require("node-serialize");
      function handle(payload) {
        return unserialize(payload);
      }
    expect_match_text: [unserialize]
  - name: literal node serialize unserialize negative
    code: |
      const serialize = require("node-serialize");
      function handle() {
        return serialize.unserialize("{\"ok\":true}");
      }
    expect_no_match: true
  description: node-serialize.unserialize - evaluates embedded function bodies; RCE on tainted input.

- id: javascript.deser.serialize_javascript_deserialize
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: insecure-deserialization
  severity: critical
  packages: [serialize-javascript]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: deserialize
  description: "Disabled - bare `deserialize(...)` fires on every ORM/queue/worker `.deserialize` call; enable with receiver narrowing to the serialize-javascript module."

