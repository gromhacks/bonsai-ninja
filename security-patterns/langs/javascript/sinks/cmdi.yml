- id: javascript.cmdi.child_process_exec
  enabled: true
  language: javascript
  tag: command-injection
  severity: critical
  category: process-exec
  packages: [child_process]
  imports: [child_process]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^child_process\\.exec$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: child process exec
    code: |
      const _u = require("child_process");
      function demo(input, req, obj) {
        return child_process.exec(input);
      }
  - name: literal child process exec negative
    code: |
      const _u = require("child_process");
      function demo() {
        return child_process.exec("whoami");
      }
    expect_no_match: true
  description: child_process.exec runs the command through /bin/sh so any interpolation is a shell-injection.

