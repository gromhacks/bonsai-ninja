- id: javascript.redos.regexp_constructor
  enabled: true
  language: javascript
  tag: redos
  severity: medium
  cwe: [CWE-1333]
  match:
    kind: call
    callee:
      name: RegExp
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: regexp constructor
      code: |
        function demo(input, req, obj) {
          return RegExp(input);
        }
    - name: literal regexp constructor negative
      code: |
        function demo() {
          return RegExp("^[a-z]+$");
        }
      expect_no_match: true
  description: "RegExp(tainted_pattern) / new RegExp(tainted_pattern) - attacker-controlled regular expressions can trigger catastrophic backtracking."
