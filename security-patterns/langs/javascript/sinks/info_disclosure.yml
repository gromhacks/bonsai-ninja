- id: javascript.info_disclosure.console_log_secret
  enabled: true
  language: javascript
  tag: information-disclosure
  severity: medium
  cwe:
  - CWE-200
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - console
      - log
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)(secret|token|password|passwd|api[_-]?key|credential|private[_-]?key)'
  match_examples:
  - name: console log secret
    code: "function demo(secretToken) {\n  console.log(secretToken);\n}\n"
    expect_match_text:
    - console.log
  - name: console log ordinary value negative
    code: |
      function demo(username) {
        console.log(username);
      }
    expect_no_match: true
  description: "console.log(secret/token/password) - secret-shaped data written to process logs or captured stdout. Merged aliases: javascript.log_injection.console_newline."
  aliases:
  - javascript.log_injection.console_newline
- id: javascript.info_disclosure.response_send_error_stack
  enabled: true
  language: javascript
  tag: information-disclosure
  severity: high
  packages:
  - express
  - restify
  - fastify
  - '@adonisjs/core'
  - '@adonisjs/http-server'
  cwe:
  - CWE-209
  match:
    kind: call
    callee:
      attribute:
      - res
      - send
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)\b(?:err|error|exception|e)\s*\.\s*(?:stack|message)\b|\b(?:stackTrace|stack_trace|errorStack|errStack)\b'
  match_examples:
  - name: response send error stack
    code: |
      const _u = require("express");
      function handler(req, res, err) {
        return res.send(err.stack);
      }
    expect_match_text:
    - res.send
  - name: response send normal template negative
    code: |
      const _u = require("express");
      function handler(req, res, html) {
        return res.send(html);
      }
    expect_no_match: true
  description: "Express res.send(error.stack/message) - exposes internal exception details to the response body."
- id: javascript.info_disclosure.response_render_error_page
  enabled: true
  language: javascript
  tag: information-disclosure
  severity: medium
  packages:
  - express
  cwe:
  - CWE-209
  match:
    kind: call
    callee:
      attribute:
      - res
      - render
  match_examples:
  - name: response render error page
    code: |
      const _u = require("express");
      function handler(req, res, err) {
        return res.render("error", { error: err, stack: err.stack });
      }
    expect_match_text:
    - res.render
  description: "Express res.render(error, err/stack) - debug or exception details can be rendered into an error page."
- id: javascript.info_disclosure.postmessage_wildcard_target
  enabled: true
  language: javascript
  tag: information-disclosure
  severity: medium
  cwe:
  - CWE-200
  - CWE-346
  match:
    kind: call
    callee:
      regex: ^(window|parent|opener|targetWindow|frameWindow)\.postMessage$
  match_examples:
  - name: window postmessage wildcard
    code: "function send(secret) {\n  return window.postMessage(secret, '*');\n}\n"
    expect_match_text:
    - window.postMessage
  - name: parent postmessage wildcard
    code: "function send(token) {\n  return parent.postMessage(token, '*');\n}\n"
    expect_match_text:
    - parent.postMessage
  description: postMessage with targetOrigin '*' can disclose data to an unexpected origin.
