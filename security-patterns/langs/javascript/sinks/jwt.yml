- id: javascript.jwt.sign_none
  enabled: true
  language: javascript
  tag: jwt
  category: source-independent
  severity: high
  packages:
  - jsonwebtoken
  imports:
  - jsonwebtoken
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      attribute:
      - jwt
      - sign
  constraints:
  - arg_matches_regex:
      index: 2
      regex: "(?i)algorithm\\s*[:=]\\s*['\\\"]none['\\\"]"
  match_examples:
  - name: sign none
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.sign(input, null, { algorithm: 'none' });
      }
  - name: sign hmac negative
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.sign(input, "secret", { algorithm: "HS256" });
      }
    expect_no_match: true
  description: "jwt.sign with algorithm 'none' - unsigned token, trivially forgeable."
- id: javascript.jwt.verify_none_algorithm
  enabled: true
  language: javascript
  tag: jwt
  category: source-independent
  severity: high
  packages:
  - jsonwebtoken
  imports:
  - jsonwebtoken
  cwe:
  - CWE-347
  - CWE-345
  match:
    kind: call
    callee:
      attribute:
      - jwt
      - verify
  constraints:
  - arg_matches_regex:
      index: 2
      regex: "(?i)(algorithms\\s*[:=]\\s*\\[[^\\]]*['\\\"]none['\\\"]|ignoreExpiration\\s*[:=]\\s*true)"
  match_examples:
  - name: verify none algorithm
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.verify(input, "secret", { algorithms: ['none'] });
      }
  - name: verify hmac negative
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.verify(input, "secret", { algorithms: ["HS256"] });
      }
    expect_no_match: true
  description: "jwt.verify(..., {algorithms: ['none']}) - accepts unsigned tokens. Merged aliases: javascript.jwt.verify_ignore_expiration, javascript.jwt.alg_confusion."
  aliases:
  - javascript.jwt.verify_ignore_expiration
  - javascript.jwt.alg_confusion
- id: javascript.jwt.sign_no_secret
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: javascript
  tag: jwt
  severity: high
  packages:
  - jsonwebtoken
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      attribute:
      - jwt
      - sign
  description: "Disabled - overlaps with sign_none; enable only when missing-secret detection is wired up."
- id: javascript.jwt.decode_unsafe
  enabled: true
  language: javascript
  tag: jwt
  severity: high
  packages:
  - jsonwebtoken
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - jwt
      - decode
  constraints:
  - arg_tainted: {index: 0}
  match_examples:
  - name: decode unsafe
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.decode(input);
      }
  - name: decode literal negative
    code: |
      const _u = require("jsonwebtoken");
      function demo(input, req, obj) {
        return jwt.decode("header.payload.signature");
      }
    expect_no_match: true
  description: "jwt.decode - parses the token without verifying the signature; never trust the payload."
