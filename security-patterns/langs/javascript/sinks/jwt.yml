- id: javascript.jwt.jose_jwt_verify_alg_none
  enabled: true
  language: javascript
  tag: jwt
  category: source-independent
  severity: critical
  packages: [jose]
  imports: [jose]
  cwe: [CWE-347, CWE-327]
  match:
    kind: call
    callee:
      attribute: [jose, jwtVerify]
  constraints:
  - arg_matches_regex:
      index: 2
      regex: "(?i)\"none\""
  match_examples:
  - name: jose jwtVerify alg none accepted
    code: |
      const _u = require("jose");
      function check(token, key) {
        return jose.jwtVerify(token, key, { algorithms: ["none"] });
      }
  - name: jose jwtVerify alg HS256 negative
    code: |
      const _u = require("jose");
      function check(token, key) {
        return jose.jwtVerify(token, key, { algorithms: ["HS256"] });
      }
    expect_no_match: true
  description: 'jose.jwtVerify(..., {algorithms: ["none"]}) - accepts unsigned tokens; alg-none JWT bypass.'
