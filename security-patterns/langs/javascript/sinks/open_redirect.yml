- id: javascript.open_redirect.express_res_redirect
  enabled: true
  language: javascript
  tag: open-redirect
  severity: high
  packages:
  - express
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - res
      - redirect
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: express res redirect
    code: |
      const _u = require("express");
      function demo(input, req, obj) {
        return res.redirect(input);
      }
  - name: literal express res redirect negative
    code: |
      const _u = require("express");
      function demo() {
        return res.redirect("/dashboard");
      }
    expect_no_match: true
  description: Express res.redirect(tainted).
