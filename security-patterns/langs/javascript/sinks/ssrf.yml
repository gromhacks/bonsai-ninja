- id: javascript.ssrf.fetch
  enabled: true
  language: javascript
  tag: ssrf
  severity: high
  category: network-egress
  packages:
  - node-fetch
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      regex: ^fetch$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: fetch
    code: |
      const _u = require("node-fetch");
      function demo(input, req, obj) {
        return fetch(input);
      }
  - name: literal fetch url negative
    code: |
      const _u = require("node-fetch");
      function demo() {
        return fetch("https://example.com");
      }
    expect_no_match: true
  description: "fetch(url) - tainted URL enables SSRF to internal endpoints (metadata services, localhost)."
