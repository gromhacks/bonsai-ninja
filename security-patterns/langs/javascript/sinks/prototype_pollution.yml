- id: javascript.proto_pollution.deepmerge_package
  enabled: true
  language: javascript
  tag: prototype-pollution
  severity: high
  packages: [deepmerge, deep-extend, merge-deep]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      regex: "^(deepmerge|mergeDeep)$"
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: deepmerge function
    code: |
      const deepmerge = require("deepmerge");
      function applyConfig(input) {
        return deepmerge({}, input);
      }
    expect_match_text: [deepmerge]
  - name: mergeDeep function
    code: |
      const mergeDeep = require("merge-deep");
      function applyConfig(input) {
        return mergeDeep({}, input);
      }
    expect_match_text: [mergeDeep]
  - name: deepmerge literal negative
    code: |
      const deepmerge = require("deepmerge");
      function applyConfig() {
        return deepmerge({}, {});
      }
    expect_no_match: true
  description: "Deep recursive merge package calls - audit tainted objects for __proto__/constructor/prototype keys before merging."

- id: javascript.proto_pollution.lodash_namespace_merge_variants
  enabled: true
  language: javascript
  tag: prototype-pollution
  severity: high
  packages: [lodash, lodash.merge]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.(merge|defaultsDeep)$|^merge$"
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: lodash namespace merge
    code: |
      const _u = require("lodash");
      function applyConfig(lodash, input) {
        return lodash.merge({}, input);
      }
    expect_match_text: [lodash.merge]
  - name: lodash.merge package default function
    code: |
      const merge = require("lodash.merge");
      function applyConfig(input) {
        return merge({}, input);
      }
    expect_match_text: [merge]
  - name: lodash merge literal negative
    code: |
      const _u = require("lodash");
      function applyConfig(lodash) {
        return lodash.merge({}, {});
      }
    expect_no_match: true
  description: "lodash merge/defaultsDeep variants and lodash.merge package default export - recursive merge prototype-pollution sinks."
