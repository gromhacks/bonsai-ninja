- id: javascript.proto.object_assign_user
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: prototype-pollution
  severity: high
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      attribute: [Object, assign]
  description: "Disabled - Object.assign is only prototype-pollution relevant when merging untrusted keys into a sensitive target."

# Prototype-pollution sinks. Object-merge / set-by-path APIs
# that honor `__proto__` / `constructor` / `prototype` keys.
- id: javascript.proto_pollution.object_assign_request_body
  enabled: true
  language: javascript
  tag: prototype-pollution
  severity: high
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      attribute: [Object, assign]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: object assign request body
    code: |
      function apply(req, target) {
        return Object.assign(target, req.body);
      }
    expect_match_text: [Object.assign]
  - name: object assign prototype key object
    code: |
      function apply(target, value) {
        return Object.assign(target, { "__proto__": value });
      }
    expect_match_text: [Object.assign]
  - name: object assign literal source negative
    code: |
      function apply(target) {
        return Object.assign(target, { safe: true });
      }
    expect_no_match: true
  description: "Object.assign(target, source) - shallow merge can still pollute when a tainted source object carries special keys. JS Object global has no canonical ecosystem package, so strict `['Object', 'assign']` match only."

- id: javascript.proto_pollution.lodash_merge
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: javascript.proto_pollution.lodash_namespace_merge_variants
  language: javascript
  tag: prototype-pollution
  severity: high
  packages: [lodash]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      attribute: [_, merge]
  description: "Disabled - `_.merge` is covered by `javascript.proto_pollution.lodash_namespace_merge_variants` whose regex `^[A-Za-z_$][A-Za-z0-9_$]*\\.(merge|defaultsDeep)$|^merge$` already includes the `_.merge` shape and any local namespace alias."
- id: javascript.proto_pollution.lodash_set
  enabled: true
  language: javascript
  tag: prototype-pollution
  severity: high
  packages: [lodash]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      attribute: [_, set]
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: lodash set
    code: |
      const _u = require("lodash");
      function demo(_, input, value) {
        return _.set(input, "__proto__.polluted", value);
      }
    expect_match_text: [_.set]
  - name: lodash set proto dot path
    code: |
      const _u = require("lodash");
      function apply(_, target, value) {
        return _.set(target, "__proto__.polluted", value);
      }
    expect_match_text: [_.set]
  - name: lodash set constructor prototype dot path
    code: |
      const _u = require("lodash");
      function apply(_, target, value) {
        return _.set(target, "constructor.prototype.admin", value);
      }
    expect_match_text: [_.set]
  - name: lodash set literal negative
    code: |
      const _u = require("lodash");
      function apply(_) {
        return _.set({}, "safe.path", "safe");
      }
    expect_no_match: true
  description: "_.set(obj, attacker_path, value) - path-based set with `__proto__.x` or `constructor.prototype.x` slips into Object.prototype."
