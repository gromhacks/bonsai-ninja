- id: javascript.proto_pollution.recursive_merge
  enabled: true
  language: javascript
  tag: prototype-pollution
  severity: high
  cwe: [CWE-1321]
  match:
    kind: write
    target:
      regex: "(\\[|\\.key$)"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: recursive merge write by key
    code: |
      function merge(target, source) {
        for (const key in source) {
          target[key] = source[key];
        }
      }
    expect_match_text: [target.key]
  - name: recursive deep walk merge write
    code: |
      function walk(dst, src) {
        Object.keys(src).forEach((key) => {
          if (src[key] && typeof src[key] === "object") walk(dst[key] ||= {}, src[key]);
          else dst[key] = src[key];
        });
      }
    expect_match_text: [dst.key]
  - name: recursive merge literal value negative
    code: |
      function merge(target, source) {
        target.safe = "safe";
      }
    expect_no_match: true
  description: "Recursive merge target[key] = source[key] - homemade deep-merge vector when __proto__/constructor/prototype keys are not filtered."

- id: javascript.proto_pollution.recursive_deep_merge
  enabled: true
  language: javascript
  tag: prototype-pollution
  severity: high
  packages: [recursive-deep-merge]
  cwe: [CWE-1321]
  match:
    kind: call
    callee:
      name: recursiveDeepMerge
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: recursive deep merge exported function
    code: |
      const recursiveDeepMerge = require("recursive-deep-merge");
      function applyConfig(input) {
        return recursiveDeepMerge({}, input);
      }
    expect_match_text: [recursiveDeepMerge]
  - name: recursive deep merge literal negative
    code: |
      const recursiveDeepMerge = require("recursive-deep-merge");
      function applyConfig() {
        return recursiveDeepMerge({}, {});
      }
    expect_no_match: true
  description: "recursive-deep-merge(target, attacker_obj) - recursive merge APIs can honor `__proto__` / `constructor.prototype` keys and pollute Object.prototype."

