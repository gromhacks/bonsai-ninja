- id: javascript.xxe.libxmljs2_unsafe_options
  enabled: true
  language: javascript
  tag: xxe
  severity: critical
  packages:
  - libxmljs2
  cwe:
  - CWE-611
  match:
    kind: call
    callee:
      regex: ^libxmljs2\.(parseXml|parseXmlString|loadXml)$
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    configured_call_argument_guard:
      configuration_argument_index: 1
      guarded_value_argument_indices: [0]
      required_fields:
      - path: [noent]
        value: {kind: boolean, value: false}
      - path: [replaceEntities]
        value: {kind: boolean, value: false}
      - path: [nonet]
        value: {kind: boolean, value: true}
      - path: [dtdload]
        value: {kind: boolean, value: false}
  match_examples:
  - name: libxmljs2 parseXml noent
    code: |
      const _u = require("libxmljs2");
      function parse(libxmljs2, input) {
        return libxmljs2.parseXml(input, { noent: true });
      }
    expect_match_text:
    - libxmljs2.parseXml
  - name: libxmljs2 loadXml network dtd
    code: |
      const _u = require("libxmljs2");
      function parse(libxmljs2, input) {
        return libxmljs2.loadXml(input, { dtdload: true, nonet: false });
      }
    expect_match_text:
    - libxmljs2.loadXml
  - name: libxmljs2 literal negative
    code: |
      const _u = require("libxmljs2");
      function parse(libxmljs2, input) {
        return libxmljs2.parseXml("<root/>", { noent: true });
      }
    expect_no_match: true
  description: "libxmljs2 parse/load with noent/dtdload/nonet-unsafe options - explicitly enables XXE file-read or SSRF behavior."
