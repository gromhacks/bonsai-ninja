- id: javascript.xxe.libxmljs_parsexml
  enabled: true
  language: javascript
  tag: xxe
  severity: critical
  packages:
  - libxmljs
  imports:
  - libxmljs
  cwe:
  - CWE-611
  match:
    kind: call
    callee:
      attribute:
      - libxmljs
      - parseXml
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: libxmljs parsexml
    code: |
      const _u = require("libxmljs");
      function demo(input, req, obj) {
        return libxmljs.parseXml(input);
      }
    expect_match_text:
    - libxmljs.parseXml
  - name: libxmljs parsexml literal negative
    code: |
      const _u = require("libxmljs");
      function demo(input) {
        return libxmljs.parseXml("<root/>");
      }
    expect_no_match: true
  description: "libxmljs.parseXml - default parser resolves external entities; tainted XML enables XXE file read / SSRF. Merged aliases: javascript.xxe.libxmljs_parsexml_noent."
  aliases:
  - javascript.xxe.libxmljs_parsexml_noent
- id: javascript.xxe.parse_xml_resolve_entities
  enabled: true
  language: javascript
  tag: xxe
  severity: high
  packages:
  - parse-xml
  - libxmljs
  - libxmljs2
  cwe:
  - CWE-611
  match:
    kind: call
    callee:
      regex: ^(parseXml|parseXML|parseXMLString)$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: parse-xml resolve entities
    code: |
      const _u = require("parse-xml");
      function parse(parseXml, input) {
        return parseXml(input, { resolveEntities: true });
      }
    expect_match_text:
    - parseXml
  - name: parse-xml literal negative
    code: |
      const _u = require("parse-xml");
      function parse(parseXml, input) {
        return parseXml("<root/>", { resolveEntities: true });
      }
    expect_no_match: true
  description: "parse-xml/libxml-style parser call with entity resolution enabled - tainted XML can trigger XXE file reads or SSRF."
