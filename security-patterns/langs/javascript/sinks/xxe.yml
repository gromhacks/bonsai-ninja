- id: javascript.xxe.fast_xml_parser_entities_enabled
  enabled: true
  language: javascript
  tag: xxe
  severity: medium
  packages:
  - fast-xml-parser
  cwe:
  - CWE-611
  match:
    kind: new
    callee:
      name: XMLParser
  match_examples:
  - name: fast xml parser process entities
    code: "const { XMLParser } = require(\"fast-xml-parser\");\nfunction parser() {\n  return new XMLParser({ processEntities: true });\n}\n"
    expect_match_text:
    - XMLParser
  - name: fast xml parser html entities
    code: |
      const _u = require("fast-xml-parser");
      function parser(XMLParser) {
        return new XMLParser({ htmlEntities: true });
      }
    expect_match_text:
    - XMLParser
  description: "fast-xml-parser with entity processing enabled — audit tainted XML for entity expansion and unsafe downstream interpretation."
- id: javascript.xxe.libxmljs_loadxml
