- id: javascript.xxe.fast_xml_parser_entities_enabled
  enabled: true
  language: javascript
  tag: xxe
  severity: high
  imports:
  - fast-xml-parser
  cwe:
  - CWE-776
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.parse$'
  constraints:
  - arg_tainted: {index: 0}
  - receiver_factory_argument_fields_equal:
      factory: {name: XMLParser}
      configuration_argument_index: 0
      required_fields:
      - path: [processEntities]
        value: {kind: boolean, value: true}
  match_examples:
  - name: fast xml parser processes tainted entities
    code: "const { XMLParser } = require(\"fast-xml-parser\");\nconst parser = new XMLParser({ processEntities: true });\nfunction parse(xml) {\n  return parser.parse(xml);\n}\n"
    expect_match_text:
    - XMLParser
  - name: fast xml parser entities disabled negative
    code: |
      const { XMLParser } = require("fast-xml-parser");
      const parser = new XMLParser({ processEntities: false });
      function parse(xml) {
        return parser.parse(xml);
      }
    expect_no_match: true
  description: "Remotely tainted XML reaches an immutable fast-xml-parser receiver configured with processEntities=true. The compiler-proven configuration and consumption path permits exponential entity expansion and availability loss (CWE-776); this is not a claim that the parser resolves external SYSTEM entities."
