  - libxmljs
  - libxmljs2
  imports:
  - libxmljs
  - libxmljs2
  cwe:
  - CWE-611
  match:
    kind: call
    callee:
      attribute:
      - libxmljs
      - loadXml
  match_examples:
  - name: libxmljs loadXml
    code: "const libxmljs = require(\"libxmljs\");\nfunction parse(input) {\n  return libxmljs.loadXml(input);\n}\n"
