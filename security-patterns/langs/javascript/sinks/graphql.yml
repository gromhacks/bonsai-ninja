- id: javascript.graphql.graphql_execute
  enabled: true
  language: javascript
  tag: graphql-injection
  severity: high
  packages:
  - graphql
  imports:
  - graphql
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      attribute:
      - graphql
      - graphql
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: graphql execute
    code: |
      const _u = require("graphql");
      function demo(query, schema) {
        return graphql.graphql({ schema, source: query });
      }
    expect_match_text:
    - graphql.graphql
  - name: graphql execute source variable
    code: |
      const _u = require("graphql");
      function demo(graphql, schema, source) {
        return graphql.graphql({ schema: schema, source: source });
      }
    expect_match_text:
    - graphql.graphql
  - name: graphql execute literal negative
    code: |
      const _u = require("graphql");
      const schema = {};
      function demo() {
        return graphql.graphql({ schema, source: "{ viewer { id } }" });
      }
    expect_no_match: true
  description: "graphql.graphql(source: tainted) — dynamic GraphQL documents can drive resolver-side injection or schema probing."
