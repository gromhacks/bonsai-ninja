  severity: medium
  packages:
  - '@apollo/server'
  - apollo-server
  - apollo-server-express
  cwe:
  - CWE-943
  match:
    kind: new
    callee:
      name: ApolloServer
  match_examples:
  - name: apollo server resolver dispatch
    code: |
      const { ApolloServer } = require("@apollo/server");
      function boot(typeDefs, resolvers) {
        return new ApolloServer({ typeDefs, resolvers });
      }
    expect_match_text:
    - ApolloServer
  description: "ApolloServer({resolvers}) — GraphQL resolver dispatch surface where args/context become attacker-controlled resolver inputs."
