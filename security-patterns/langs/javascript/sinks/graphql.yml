- id: javascript.graphql.express_graphql_dispatch
  enabled: true
  language: javascript
  tag: graphql-injection
  severity: medium
  packages:
  - express-graphql
  imports:
  - express-graphql
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      regex: ^(graphqlHTTP|expressGraphQL)$
  match_examples:
  - name: express graphql dispatch
    code: |
      const _u = require("express-graphql");
      function mount(app, schema, resolvers) {
        return app.use("/graphql", graphqlHTTP({ schema, rootValue: resolvers }));
      }
    expect_match_text:
    - graphqlHTTP
  description: "express-graphql graphqlHTTP({schema/rootValue/context}) — resolver dispatch surface fed by HTTP GraphQL arguments."
- id: javascript.graphql.apollo_server_resolvers
