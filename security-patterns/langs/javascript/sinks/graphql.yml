- id: javascript.graphql.graphql_request_send
  enabled: true
  language: javascript
  tag: graphql-injection
  severity: medium
  packages: [graphql-request]
  imports: [graphql-request]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: "^GraphQLClient\\.request$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: graphql-request client request tainted
    code: |
      const { GraphQLClient } = require("graphql-request");
      function demo(input) {
        const client = new GraphQLClient("/graphql");
        return client.request(input);
      }
    expect_match_text: [client.request]
  - name: graphql-request client request literal negative
    code: |
      const { GraphQLClient } = require("graphql-request");
      function demo() {
        const client = new GraphQLClient("/graphql");
        return client.request("{ viewer { id } }");
      }
    expect_no_match: true
  - name: graphql-request unrelated receiver negative
    code: |
      const _u = require("graphql-request");
      function demo(httpClient, input) {
        return httpClient.request(input);
      }
      demo({ request: () => null }, "");
    expect_no_match: true
  description: "graphql-request GraphQLClient.request(tainted_query) — sends attacker-controlled GraphQL document to a remote endpoint, enabling injection or schema probing."

- id: javascript.graphql.apollo_client_query
  enabled: true
  language: javascript
  tag: graphql-injection
  severity: medium
  packages: ["@apollo/client", apollo-client]
  imports: ["@apollo/client"]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: "^ApolloClient\\.query$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: apollo client query tainted
    code: |
      const { ApolloClient } = require("@apollo/client");
      function demo(input) {
        const client = new ApolloClient({});
        return client.query({ query: input });
      }
    expect_match_text: [client.query]
  - name: apollo client query literal negative
    code: |
      const { ApolloClient } = require("@apollo/client");
      const SAFE = "{ viewer { id } }";
      function demo() {
        const client = new ApolloClient({});
        return client.query({ query: SAFE });
      }
    expect_no_match: true
  - name: apollo client unrelated receiver negative
    code: |
      const _u = require("@apollo/client");
      function demo(sqlClient, input) {
        return sqlClient.query({ query: input });
      }
      demo({ query: () => null }, "");
    expect_no_match: true
  description: "Apollo Client.query({query: tainted}) — sends attacker-controlled document to the GraphQL endpoint; resolver-side injection or introspection probing."

