- id: javascript.xss.document_write
  enabled: true
  language: javascript
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - document
      - write
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: document write tainted
    code: "function demo(input) {\n  return document.write(input);\n}\n"
    expect_match_text:
    - document.write
  - name: document write literal
    code: "function demo() {\n  return document.write(\"<p>safe</p>\");\n}\n"
    expect_no_match: true
  description: "document.write(tainted) \u2014 legacy DOM XSS vector. arg_tainted scopes to attacker-controlled content; literal/static strings don't fire (R6)."
