- id: javascript.xss.innerhtml
  enabled: true
  language: javascript
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: write
    target:
      name: innerHTML
  match_examples:
  - name: innerhtml
    code: "function demo(input, req, obj) {\n  innerHTML = input; return innerHTML;\n}\n"
  description: "Element.innerHTML = tainted \u2014 DOM XSS."
