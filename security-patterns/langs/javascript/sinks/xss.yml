- id: javascript.xss.html_return
  enabled: true
  language: javascript
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: return
    target:
      regex: (?is)^\s*(?:`|'|").*(<!doctype|<html\b|<[a-z][a-z0-9:-]*\b[^>]*>)
  match_examples:
  - name: raw html template return
    code: "function page(q) {\n  return `<!doctype html><h1>${q}</h1>`;\n}\n"
    expect_match_text:
    - '`<!doctype html><h1>${q}</h1>`'
  description: Route/helper return of raw HTML expression. Taint reachability decides whether interpolated content is attacker controlled.
- id: javascript.xss.serialize_javascript_unsafe_embed
  enabled: true
  language: javascript
  tag: xss
  severity: high
  packages:
  - serialize-javascript
  imports:
  - serialize-javascript
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      regex: ^(serialize|serializeJavascript|serializeJavaScript)$
  match_examples:
  - name: serialize-javascript unsafe option
    code: "const serialize = require(\"serialize-javascript\");\nfunction embed(input) {\n  return serialize(input, { unsafe: true });\n}\n"
    expect_match_text:
    - serialize
  - name: serializeJavaScript unsafe option
    code: "const _u = require(\"serialize-javascript\");\nfunction embed(serializeJavaScript, input) {\n  return serializeJavaScript(input, { unsafe: true });\n}\n"
    expect_match_text:
    - serializeJavaScript
  description: serialize-javascript with unsafe embedding options can emit attacker-controlled script-context content.
