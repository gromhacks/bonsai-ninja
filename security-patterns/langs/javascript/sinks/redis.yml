- id: javascript.redis.eval
  enabled: true
  language: javascript
  tag: nosql-injection
  severity: high
  packages: [redis, ioredis]
  cwe: [CWE-943, CWE-94]
  match:
    kind: call
    callee:
      attribute: [redis, eval]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: eval
    code: |
      const _u = require("redis");
      function demo(input, req, obj) {
        return redis.eval(input);
      }
  - name: literal redis eval negative
    code: |
      const _u = require("redis");
      function demo() {
        return redis.eval("return 1");
      }
    expect_no_match: true
  description: redis.eval - Lua script injection when the script or keys/args are tainted.

