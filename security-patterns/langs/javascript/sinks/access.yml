- id: javascript.access.azure_blob_download
  enabled: true
  language: javascript
  tag: access-control
  severity: high
  packages: ["@azure/storage-blob"]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      regex: "\\.downloadToBuffer$"
  match_examples:
  - name: azure blob download
    code: |
      const _u = require("@azure/storage-blob");
      function demo(input, req, obj) {
        return blobClient.downloadToBuffer(input);
      }
  description: "BlobClient.downloadToBuffer — tainted blob selector reads arbitrary Azure blob data."

