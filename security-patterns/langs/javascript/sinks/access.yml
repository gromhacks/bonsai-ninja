    code: |
      const _u = require("@azure/storage-blob");
      function demo(input, req, obj) {
        return blobClient.uploadData(input);
      }
  description: "Disabled — BlobClient.uploadData(data) uploads bytes to an already-selected blob client. The storage target is receiver construction, not this data argument."

