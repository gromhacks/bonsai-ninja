- id: javascript.access.aws_get_object_command
  enabled: true
  language: javascript
  tag: access-control
  severity: high
  packages: ["@aws-sdk/client-s3"]
  cwe: [CWE-284, CWE-639]
  match:
    kind: new
    callee:
      name: GetObjectCommand
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: aws get object command
    code: |
      const { GetObjectCommand } = require("@aws-sdk/client-s3");
      function demo(input, req, obj) {
        return new GetObjectCommand(input);
      }
  - name: literal aws get object command negative
    code: |
      const { GetObjectCommand } = require("@aws-sdk/client-s3");
      function demo() {
        return new GetObjectCommand({ Bucket: "app", Key: "reports/fixed.csv" });
      }
    expect_no_match: true
  description: "new GetObjectCommand({Bucket, Key}) — tainted selector reads arbitrary S3 objects."

