- id: javascript.access.azure_blob_download
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: access-control
  severity: high
  packages: ["@azure/storage-blob"]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      regex: "\\.downloadToBuffer$"
  match_examples:
  - name: azure blob download
    code: |
      const _u = require("@azure/storage-blob");
      function demo(input, req, obj) {
        return blobClient.downloadToBuffer(input);
      }
  description: "Disabled — BlobClient.downloadToBuffer() reads from the receiver-selected blob; selector taint belongs on BlobClient construction."

- id: javascript.access.azure_blob_upload
  enabled: false
