      }
    expect_match_text: [input.toString]
  description: "receiver.toString(...) changes representation but preserves receiver-controlled content; preserve taint through the returned string."

# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: javascript.csrf.csurf_middleware
  enabled: true
  language: javascript
  tag: csrf-protect
  match:
    kind: call
    callee:
      name: csurf
  match_examples:
  - name: csurf middleware
    code: |
      const csurf = require("csurf");
      function protection() {
        return csurf();
      }
    expect_match_text: [csurf]
  description: "csurf() - Express CSRF middleware factory; presence on the app/router signals CSRF protection."
- id: javascript.csrf.express_csrf
  enabled: true
  language: javascript
  tag: csrf-protect
  match:
    kind: call
    callee:
      attribute: [express, csrf]
  match_examples:
  - name: express csrf
    code: |
      const express = require("express");
      function protection() {
        return express.csrf();
      }
    expect_match_text: [express.csrf]
  description: "express.csrf() - legacy Express built-in; same protection."

# Lock-acquire sanitizers (T502). Tagged `lock-acquire` so
# reviewer enumerates guarded sections; the in-scope-cleanse
# semantics handle 'while lock is held, accesses are safe'.
- id: javascript.lock.mutex_acquire
  enabled: true
  language: javascript
  tag: lock-acquire
  match:
    kind: call
    callee:
      attribute: [mutex, acquire]
  match_examples:
  - name: mutex acquire
    code: |
      async function locked(mutex) {
        return mutex.acquire();
      }
    expect_match_text: [mutex.acquire]
  description: "async-mutex Mutex.acquire() - releases via the returned token."

# Cookie-secure sanitizers (T402). Cookie-set calls with
# httpOnly + secure flags are the SAFE shape; reviewer
# enumerates with `security sanitizers --tag cookie-secure`
# and audits routes that set cookies WITHOUT them.
- id: javascript.cookie.set_with_httponly_secure
  enabled: true
  language: javascript
  tag: cookie-secure
  match:
    kind: call
    callee:
      attribute: [res, cookie]
  constraints:
  - any_arg_matches_regex: |-
      httpOnly.*true|secure.*true
  match_examples:
  - name: secure httponly cookie
    code: |
      function setCookie(res, token) {
        return res.cookie("sid", token, { httpOnly: true, secure: true });
      }
    expect_match_text: [res.cookie]
  - name: secure httponly cookie negative constraint boundary
    code: "function setCookie(res, token) {\n  return res.cookie();\n}\n"
    expect_no_match: true
  description: "res.cookie(name, val, {httpOnly: true, secure: true}) - cookie set with HttpOnly + Secure flags."

# Rate-limit middleware presence sanitizers (architectural).
- id: javascript.ratelimit.express_rate_limit
  enabled: true
  language: javascript
  tag: rate-limit
  packages: [express-rate-limit]
  match:
    kind: call
    callee:
      name: rateLimit
  match_examples:
  - name: express-rate-limit middleware
    code: |
      const rateLimit = require("express-rate-limit");
      function middleware() {
        return rateLimit({ windowMs: 60000, max: 100 });
      }
    expect_match_text: [rateLimit]
  description: "express-rate-limit middleware factory - presence signals throttling; absence on /login is the finding."
- id: javascript.ratelimit.express_slow_down
  enabled: true
  language: javascript
  tag: rate-limit
  packages: [express-slow-down]
  match:
    kind: call
    callee:
