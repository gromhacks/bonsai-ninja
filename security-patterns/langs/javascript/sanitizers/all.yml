# JavaScript sanitizers - tag names use the spec-canonical vocabulary
# (html-encode / html-sanitize / url-encode / url-parse / shell-escape /
# sql-parameter / constant-time / jwt-verify / path-sanitize / ldap-escape /
# numeric-coerce / validation).

# -- HTML --------------------------------------------------------------------
- id: javascript.sanitizer.dompurify_sanitize
  enabled: true
  language: javascript
  tag: html-sanitize
  packages: [dompurify, isomorphic-dompurify]
  imports: [dompurify]
  match:
    kind: call
    callee:
      regex: "^DOMPurify\\.sanitize$"
  match_examples:
  - name: dompurify namespace sanitize
    code: |
      const DOMPurify = require("dompurify");
      function clean(input) {
        return DOMPurify.sanitize(input);
      }
    expect_match_text: [DOMPurify.sanitize]
  description: DOMPurify.sanitize - strips executable HTML/SVG/MathML, yielding an XSS-safe fragment.

- id: javascript.sanitizer.xss_library
  enabled: true
  language: javascript
  tag: html-sanitize
  packages: [xss]
  imports: [xss]
  match:
    kind: call
    callee:
      name: xss
  match_examples:
  - name: xss module filter
    code: |
      const xss = require("xss");
      function clean(input) {
        return xss(input);
      }
    expect_match_text: [xss]
  description: xss library filter - whitelists tags/attrs and escapes the rest.

- id: javascript.sanitizer.sanitize_html
  enabled: true
  language: javascript
  tag: html-sanitize
  packages: [sanitize-html]
  match:
    kind: call
    callee:
      name: sanitizeHtml
  match_examples:
  - name: sanitize-html call
    code: |
      const sanitizeHtml = require("sanitize-html");
      function clean(input) {
        return sanitizeHtml(input);
      }
    expect_match_text: [sanitizeHtml]
  description: sanitize-html - tag/attribute allowlist stripping.

- id: javascript.sanitizer.he_encode
  enabled: true
  language: javascript
  tag: html-encode
  packages: [he]
  match:
    kind: call
    callee:
      regex: "^he\\.encode$"
  match_examples:
  - name: he encode
    code: |
      const he = require("he");
      function clean(input) {
        return he.encode(input);
      }
    expect_match_text: [he.encode]
  description: he.encode - HTML-entity-encodes a string (safe for text contexts).

- id: javascript.sanitizer.escape_html_lodash
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: html-encode
  packages: [lodash, underscore]
  match:
    kind: call
    callee:
      name: escape
  description: "Disabled - bare escape overmatches unrelated helper functions; use receiver-qualified lodash/underscore rules."

- id: javascript.sanitizer.lodash_escape
  enabled: true
  language: javascript
  tag: html-encode
  packages: [lodash, underscore]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.escape$"
  match_examples:
  - name: lodash namespace escape
    code: |
      const _ = require("lodash");
      function clean(input) {
        return _.escape(input);
      }
    expect_match_text: [_.escape]
  description: "lodash/underscore escape - HTML-encodes a string for text/attribute context."

- id: javascript.sanitizer.lodash_named_escape
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: javascript.sanitizer.lodash_escape
  language: javascript
  tag: html-encode
  packages: [lodash]
  match:
    kind: call
    callee:
      regex: "^lodash\\.escape$"
  description: "Disabled - covered by javascript.sanitizer.lodash_escape to avoid duplicate sanitizer evidence."

- id: javascript.sanitizer.escape_html_module
  enabled: true
  language: javascript
  tag: html-encode
  packages: [escape-html]
  match:
    kind: call
    callee:
      name: escapeHtml
  match_examples:
  - name: escape-html call
    code: |
      const escapeHtml = require("escape-html");
      function clean(input) {
        return escapeHtml(input);
      }
    expect_match_text: [escapeHtml]
  description: escape-html module - returns an HTML-encoded copy of the input.

- id: javascript.sanitizer.validator_escape
  enabled: true
  language: javascript
  tag: html-encode
  packages: [validator]
  imports: [validator]
  match:
    kind: call
    callee:
      regex: "^validator\\.escape$"
  match_examples:
  - name: validator escape
    code: |
      const validator = require("validator");
      function clean(input) {
        return validator.escape(input);
      }
    expect_match_text: [validator.escape]
  description: validator.escape - HTML-escapes &, <, >, ", ', /.

- id: javascript.sanitizer.validator_whitelist
  enabled: true
  language: javascript
  tag: char-allowlist
  packages: [validator]
  imports: [validator]
  match:
    kind: call
    callee:
      regex: "^validator\\.whitelist$"
  constraints:
  - min_args: 2
  match_examples:
  - name: validator whitelist
    code: |
      const validator = require("validator");
      function clean(input) {
        return validator.whitelist(input, "a-zA-Z0-9_-");
      }
    expect_match_text: [validator.whitelist]
  - name: validator whitelist negative constraint boundary
    code: "const validator = require(\"validator\");\nfunction clean(input) {\n  return validator.whitelist(input);\n}\n"
    expect_no_match: true
  description: "validator.whitelist(str, chars) - removes every character not present in the explicit allowlist string."

# -- URL ---------------------------------------------------------------------
- id: javascript.sanitizer.encodeuricomponent
  enabled: true
  language: javascript
  tag: url-encode
  match:
    kind: call
    callee:
      name: encodeURIComponent
  match_examples:
  - name: encode uri component
    code: |
      function clean(input) {
        return encodeURIComponent(input);
      }
    expect_match_text: [encodeURIComponent]
  description: encodeURIComponent - percent-encodes a URL component (safe for query-string values).

- id: javascript.sanitizer.encodeuri
  enabled: true
  language: javascript
  tag: url-encode
  match:
    kind: call
    callee:
      name: encodeURI
  match_examples:
  - name: encode uri
    code: |
      function clean(input) {
        return encodeURI(input);
      }
    expect_match_text: [encodeURI]
  description: encodeURI - percent-encodes a URL (preserves reserved chars).

- id: javascript.sanitizer.querystring_escape
  enabled: true
  language: javascript
  tag: url-encode
  packages: [querystring]
  imports: [querystring]
  match:
    kind: call
    callee:
      regex: "^querystring\\.escape$"
  match_examples:
  - name: querystring escape
    code: |
      const querystring = require("querystring");
      function clean(input) {
        return querystring.escape(input);
      }
    expect_match_text: [querystring.escape]
  description: "querystring.escape - Node built-in percent-encoder for query-string component values."

- id: javascript.sanitizer.url_constructor
  enabled: true
  language: javascript
  tag: validation
  match:
    kind: new
    callee:
      name: URL
  match_examples:
  - name: url constructor
    code: |
      function parse(input) {
        return new URL(input);
      }
    expect_match_text: [URL]
  description: new URL(input) - throws on malformed URLs and exposes host/protocol for allowlisting.

- id: javascript.sanitizer.validator_isurl
  enabled: true
  language: javascript
  tag: validation
  packages: [validator]
  match:
    kind: call
    callee:
      regex: "^validator\\.isURL$"
  match_examples:
  - name: validator isURL
    code: |
      const validator = require("validator");
      function ok(input) {
        return validator.isURL(input);
      }
    expect_match_text: [validator.isURL]
  description: validator.isURL - boolean URL validator (use together with a host allowlist).

# -- Shell -------------------------------------------------------------------
- id: javascript.sanitizer.shell_quote
  enabled: true
  language: javascript
  tag: shell-escape
  packages: [shell-quote]
  match:
    kind: call
    callee:
      regex: "^shellQuote\\.quote$"
  match_examples:
  - name: shell-quote quote
    code: |
      const shellQuote = require("shell-quote");
      function quote(argv) {
        return shellQuote.quote(argv);
      }
    expect_match_text: [shellQuote.quote]
  description: shell-quote .quote - POSIX-shell-escapes an argv array for safe interpolation.

- id: javascript.sanitizer.shell_escape_module
  enabled: true
  language: javascript
  tag: shell-escape
  packages: [shell-escape]
  match:
    kind: call
    callee:
      name: shellescape
  match_examples:
  - name: shell-escape call
    code: |
      const shellescape = require("shell-escape");
      function quote(argv) {
        return shellescape(argv);
      }
    expect_match_text: [shellescape]
  description: shell-escape - escapes a single argv token for /bin/sh.

# -- SQL ---------------------------------------------------------------------
- id: javascript.sanitizer.sql_template_strings
  enabled: true
  language: javascript
  tag: sql-parameter
  packages: [sql-template-strings]
  match:
    kind: call
    callee:
      name: SQL
  match_examples:
  - name: sql-template-strings tag
    code: |
      const SQL = require("sql-template-strings");
      function byId(id) {
        return SQL`SELECT * FROM users WHERE id = ${id}`;
      }
    expect_match_text: [SQL]
  description: sql-template-strings tagged template - produces a parameterised query object.

- id: javascript.sanitizer.sqlstring_escape
  enabled: true
  language: javascript
  tag: sql-parameter
  packages: [sqlstring, mysql, mysql2]
  match:
    kind: call
    callee:
      regex: "^sqlstring\\.escape$"
  match_examples:
  - name: sqlstring escape
    code: |
      const sqlstring = require("sqlstring");
      function clean(input) {
        return sqlstring.escape(input);
      }
    expect_match_text: [sqlstring.escape]
  description: sqlstring.escape - escapes a value for MySQL string literals (prefer `?` placeholders).

- id: javascript.sanitizer.mysql_escape
  enabled: true
  language: javascript
  tag: sql-parameter
  packages: [mysql, mysql2]
  match:
    kind: call
    callee:
      regex: "^mysql\\.escape$"
  match_examples:
  - name: mysql escape
    code: |
      const mysql = require("mysql2");
      function clean(input) {
        return mysql.escape(input);
      }
    expect_match_text: [mysql.escape]
  description: mysql/mysql2 .escape - driver-level value escaping.

- id: javascript.sanitizer.pg_format
  enabled: true
  language: javascript
  tag: sql-parameter
  packages: [pg-format]
  match:
    kind: call
    callee:
      name: format
  match_examples:
  - name: pg-format call
    code: |
      const format = require("pg-format");
      function clean(input) {
        return format("%L", input);
      }
    expect_match_text: [format]
  description: pg-format - postgres format() with %I/%L identifier & literal escaping.

# -- Constant-time / crypto --------------------------------------------------
- id: javascript.sanitizer.crypto_timing_safe_equal
  enabled: true
  language: javascript
  tag: constant-time
  packages: [crypto]
  imports: [crypto]
  match:
    kind: call
    callee:
      regex: "^crypto\\.timingSafeEqual$"
  match_examples:
  - name: crypto timingSafeEqual
    code: |
      const crypto = require("crypto");
      function same(a, b) {
        return crypto.timingSafeEqual(a, b);
      }
    expect_match_text: [crypto.timingSafeEqual]
  description: crypto.timingSafeEqual - constant-time buffer comparison for secrets/HMACs.

# -- JWT verify --------------------------------------------------------------
- id: javascript.sanitizer.jwt_verify
  enabled: true
  language: javascript
  tag: jwt-verify
  packages: [jsonwebtoken]
  imports: [jsonwebtoken]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.verify$"
  match_examples:
  - name: jwt verify
    code: |
      const jwt = require("jsonwebtoken");
      function verify(token, key) {
        return jwt.verify(token, key);
      }
    expect_match_text: [jwt.verify]
  description: jwt.verify - signature verification (safe only when `algorithms` is pinned to a non-`none` list).

- id: javascript.sanitizer.jose_jwtverify
  enabled: true
  language: javascript
  tag: jwt-verify
  packages: [jose]
  match:
    kind: call
    callee:
      name: jwtVerify
  match_examples:
  - name: jose jwtVerify
    code: |
      const { jwtVerify } = require("jose");
      async function verify(token, key) {
        return jwtVerify(token, key);
      }
    expect_match_text: [jwtVerify]
  description: jose jwtVerify - signature verification with explicit key material.

# -- Path --------------------------------------------------------------------
- id: javascript.sanitizer.path_normalize
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: path-sanitize
  packages: [path]
  imports: [path]
  match:
    kind: call
    callee:
      attribute: [path, normalize]
  description: "Disabled - path.normalize canonicalizes .. and . segments but does not enforce trusted-root containment."

- id: javascript.sanitizer.path_basename
  enabled: true
  language: javascript
  tag: path-sanitize
  packages: [path]
  match:
    kind: call
    callee:
      attribute: [path, basename]
  match_examples:
  - name: path basename
    code: |
      const path = require("path");
      function clean(input) {
        return path.basename(input);
      }
    expect_match_text: [path.basename]
  description: path.basename - strips directory components, leaving just the filename.

- id: javascript.sanitizer.sanitize_filename
  enabled: true
  language: javascript
  tag: path-sanitize
  packages: [sanitize-filename]
  match:
    kind: call
    callee:
      name: sanitizeFilename
  match_examples:
  - name: sanitize-filename call
    code: |
      const sanitizeFilename = require("sanitize-filename");
      function clean(input) {
        return sanitizeFilename(input);
      }
    expect_match_text: [sanitizeFilename]
  description: "sanitize-filename - strips path separators, control chars, and reserved names from a client-supplied filename (JS analogue of werkzeug.secure_filename)."

# -- LDAP --------------------------------------------------------------------
- id: javascript.sanitizer.ldap_escape
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: ldap-escape
  packages: [ldap-escape, ldapjs]
  match:
    kind: call
    callee:
      regex: "^ldapEscape\\.filter$"
  description: "Disabled duplicate - javascript.sanitizer.ldap_escape_variants covers ldapEscape.filter plus ldapjs/ldap escapeFilter
    variants."

# -- Numeric coercion --------------------------------------------------------
- id: javascript.sanitizer.number_coerce
  enabled: true
  language: javascript
  tag: numeric-coerce
  match:
    kind: call
    callee:
      name: Number
  match_examples:
  - name: Number coercion
    code: |
      function clean(input) {
        return Number(input);
      }
    expect_match_text: [Number]
  description: Number(x) - coerces to a finite number or NaN (use with isFinite/isInteger check).

- id: javascript.sanitizer.parseint
  enabled: true
  language: javascript
  tag: numeric-coerce
  match:
    kind: call
    callee:
      name: parseInt
  match_examples:
  - name: parseInt coercion
    code: |
      function clean(input) {
        return parseInt(input, 10);
      }
    expect_match_text: [parseInt]
  description: parseInt(x, 10) - integer coercion; neutralises string-based SQL/path/shell injection vectors.

- id: javascript.sanitizer.parsefloat
  enabled: true
  language: javascript
  tag: numeric-coerce
  match:
    kind: call
    callee:
      name: parseFloat
  match_examples:
  - name: parseFloat coercion
    code: |
      function clean(input) {
        return parseFloat(input);
      }
    expect_match_text: [parseFloat]
  description: parseFloat - float coercion.

# -- Validation (zod/joi/yup) ------------------------------------------------
- id: javascript.sanitizer.zod_parse
  enabled: true
  language: javascript
  tag: validation
  packages: [zod]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.parse$"
  match_examples:
  - name: schema parse
    code: |
      const { ZodObject } = require("zod");
      function clean(input) {
        const schema = new ZodObject({});
        return schema.parse(input);
      }
    expect_match_text: [schema.parse]
  description: zod schema.parse - throws on shape/type mismatch; coerced output is schema-constrained.

- id: javascript.sanitizer.zod_safeparse
  enabled: true
  language: javascript
  tag: validation
  packages: [zod]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.safeParse$"
  match_examples:
  - name: schema safeParse
    code: |
      const { ZodObject } = require("zod");
      function clean(input) {
        const schema = new ZodObject({});
        return schema.safeParse(input);
      }
    expect_match_text: [schema.safeParse]
  description: zod schema.safeParse - returns {success,data}; data is schema-constrained.

- id: javascript.sanitizer.joi_validate
  enabled: true
  language: javascript
  tag: validation
  packages: [joi, "@hapi/joi"]
  match:
    kind: call
    callee:
      regex: "^joiSchema\\.validate$"
  match_examples:
  - name: joi schema validate
    code: |
      const _u = require("joi");
      function clean(joiSchema, input) {
        return joiSchema.validate(input);
      }
    expect_match_text: [joiSchema.validate]
  description: "Joi schema.validate - validates and coerces input against a declared schema."

- id: javascript.sanitizer.yup_validate
  enabled: true
  language: javascript
  tag: validation
  packages: [yup]
  match:
    kind: call
    callee:
      regex: "^yupSchema\\.validate(Sync)?$"
  match_examples:
  - name: schema validateSync
    code: |
      const _u = require("yup");
      function clean(yupSchema, input) {
        return yupSchema.validateSync(input);
      }
    expect_match_text: [yupSchema.validateSync]
  description: "yup schema.validate / validateSync - coerces and rejects out-of-shape input."

- id: javascript.sanitizer.ajv_validate
  enabled: true
  language: javascript
  tag: validation
  packages: [ajv]
  match:
    kind: call
    callee:
      regex: "^validate$"
  match_examples:
  - name: ajv compiled validate
    code: |
      const _u = require("ajv");
      function clean(validate, input) {
        return validate(input);
      }
    expect_match_text: [validate]
  description: "ajv compiled validator - JSON-schema validation; data is shape-constrained on success."

# -- NoSQL operator stripping (mongo-sanitize / express-mongo-sanitize) ------
- id: javascript.sanitizer.mongo_sanitize
  enabled: true
  language: javascript
  tag: nosql-sanitize
  packages: [mongo-sanitize, express-mongo-sanitize]
  match:
    kind: call
    callee:
      name: mongoSanitize
  match_examples:
  - name: mongo-sanitize call
    code: |
      const mongoSanitize = require("mongo-sanitize");
      function clean(input) {
        return mongoSanitize(input);
      }
    expect_match_text: [mongoSanitize]
  description: "mongo-sanitize - strips top-level $-prefixed and dot-containing keys from input objects, neutralising operator
    injection."

- id: javascript.sanitizer.express_mongo_sanitize
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: javascript.sanitizer.mongo_sanitize
  language: javascript
  tag: nosql-sanitize
  packages: [express-mongo-sanitize]
  match:
    kind: call
    callee:
      name: mongoSanitize
  description: "Disabled duplicate - same `mongoSanitize()` call shape is covered by javascript.sanitizer.mongo_sanitize with
    express-mongo-sanitize package metadata merged."

# -- Password / KDF verifiers (constant-time compare) ------------------------
- id: javascript.sanitizer.bcrypt_compare
  enabled: true
  language: javascript
  tag: constant-time
  packages: [bcrypt, bcryptjs, bcrypt-nodejs]
  match:
    kind: call
    callee:
      regex: "^bcrypt\\.compare(Sync)?$"
  match_examples:
  - name: bcrypt compare
    code: |
      const bcrypt = require("bcrypt");
      function verify(input, hash) {
        return bcrypt.compare(input, hash);
      }
    expect_match_text: [bcrypt.compare]
  description: "bcrypt.compare / compareSync - constant-time hash verification; safe replacement for === password compare."

- id: javascript.sanitizer.argon2_verify
  enabled: true
  language: javascript
  tag: constant-time
  packages: [argon2]
  match:
    kind: call
    callee:
      regex: "^argon2\\.verify$"
  match_examples:
  - name: argon2 verify
    code: |
      const argon2 = require("argon2");
      function verify(hash, input) {
        return argon2.verify(hash, input);
      }
    expect_match_text: [argon2.verify]
  description: "argon2.verify - Argon2id constant-time verification."

- id: javascript.sanitizer.scrypt_compare
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: constant-time
  packages: [scrypt-kdf, "@noble/hashes"]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.verify$"
  match_examples:
  - name: scrypt verify
    code: |
      const scrypt = require("scrypt-kdf");
      function verify(hash, input) {
        return scrypt.verify(hash, input);
      }
    expect_match_text: [scrypt.verify]
  description: "Disabled - receiver-agnostic .verify collides with jsonwebtoken.verify; enable only after adapter facts can prove the receiver is the scrypt-kdf module."

# -- Path containment --------------------------------------------------------
- id: javascript.sanitizer.path_resolve
  enabled: false
  disabled_reason:
    code: over-broad
  language: javascript
  tag: path-sanitize
  packages: [path]
  match:
    kind: call
    callee:
      attribute: [path, resolve]
  description: "Disabled - path.resolve canonicalises but does not enforce a trusted root; only credit when followed by a
    startsWith check."

# -- Context-aware HTML/URL/JS encoders (node-esapi) -------------------------
# ESAPI offers context-distinct encoders. Each is tagged so a URL-context
# sink does NOT count an HTML-encoded string as sanitized (and vice versa).
- id: javascript.sanitizer.esapi_encode_for_html
  enabled: true
  language: javascript
  tag: html-encode
  packages: [node-esapi]
  match:
    kind: call
    callee:
      regex: "^ESAPI\\.encoder\\(\\)\\.encodeForHTML$"
  match_examples:
  - name: esapi encodeForHTML
    code: |
      const _u = require("node-esapi");
      function clean(ESAPI, input) {
        return ESAPI.encoder().encodeForHTML(input);
      }
    expect_match_text: [ESAPI.encoder().encodeForHTML]
  description: "node-esapi encodeForHTML - entity-encodes for HTML text/attribute context. NOT a substitute for URL or JS-string
    encoding."

- id: javascript.sanitizer.esapi_encode_for_url
  enabled: true
  language: javascript
  tag: url-encode
  packages: [node-esapi]
  match:
    kind: call
    callee:
      regex: "^ESAPI\\.encoder\\(\\)\\.encodeForURL$"
  match_examples:
  - name: esapi encodeForURL
    code: |
      const _u = require("node-esapi");
      function clean(ESAPI, input) {
        return ESAPI.encoder().encodeForURL(input);
      }
    expect_match_text: [ESAPI.encoder().encodeForURL]
  description: "node-esapi encodeForURL - percent-encodes for URL context. Use when interpolating into href/src/action."

- id: javascript.sanitizer.esapi_encode_for_javascript
  enabled: true
  language: javascript
  tag: js-encode
  packages: [node-esapi]
  match:
    kind: call
    callee:
      regex: "^ESAPI\\.encoder\\(\\)\\.encodeForJavaScript$"
  match_examples:
  - name: esapi encodeForJavaScript
    code: |
      const _u = require("node-esapi");
      function clean(ESAPI, input) {
        return ESAPI.encoder().encodeForJavaScript(input);
      }
    expect_match_text: [ESAPI.encoder().encodeForJavaScript]
  description: "node-esapi encodeForJavaScript - escapes for inline-JS string-literal context."

- id: javascript.sanitizer.esapi_encode_for_css
  enabled: true
  language: javascript
  tag: css-encode
