- id: cpp.access.aws_s3_get_object
  enabled: true
  language: cpp
  tag: access-control
  severity: high
  packages: [aws-sdk-cpp-s3]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      attribute: [S3Client, GetObject]
  match_examples:
  - name: generated direct match
    code: |
      #include <aws-sdk-cpp-s3.h>
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        S3Client::GetObject(arg);
      }
  description: "AWS SDK C++ S3Client::GetObject — tainted bucket/key selector reads arbitrary object data."

