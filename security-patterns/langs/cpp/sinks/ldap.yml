- id: cpp.ldap.ldap_search_ext_s
  enabled: true
  language: cpp
  tag: ldap-injection
  severity: high
  packages:
  - openldap
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      name: ldap_search_ext_s
  constraints:
  - arg_tainted:
      index: 3
  match_examples:
  - name: generated direct match
    code: "#include <openldap.h>\nvoid example() {\n  const char *arg = \"tainted\";\n  const char *fmt = arg;\n  const char *query = arg;\n  ldap_search_ext_s(arg);\n}\n"
  - name: literal arg 3 negative
    code: |
      void example() {
        ldap_search_ext_s("safe", "safe", "safe", "safe");
      }
    expect_no_match: true
  description: "OpenLDAP ldap_search_ext_s(ld, base, scope, filter, ...) - tainted filter allows injection."
