- id: cpp.ldap.ldapcpp_search
  enabled: true
  language: cpp
  tag: ldap-injection
  severity: high
  packages:
  - ldapcpp
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - LDAPAsynConnection
      - search
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: tainted ldap-cpp search filter
    code: |
      #include <ldapcpp.h>
      void example() {
        const char *arg = "tainted";
        LDAPAsynConnection::search("ou=People", 2, arg);
      }
  - name: literal ldap-cpp search filter negative
    code: |
      #include <ldapcpp.h>
      void example() {
        LDAPAsynConnection::search("ou=People", 2, "(uid=safe)");
      }
    expect_no_match: true
  description: "LDAPAsynConnection::search(base, scope, tainted_filter) - ldap-cpp wrapper."
