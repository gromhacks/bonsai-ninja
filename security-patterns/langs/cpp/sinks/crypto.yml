# C++ weak / broken cryptography.
- id: cpp.crypto.md5_evp
  enabled: true
  language: cpp
  tag: weak-crypto
  severity: low
  packages: [openssl]
  cwe: [CWE-327, CWE-328]
  match:
    kind: call
    callee:
      name: EVP_md5
  match_examples:
  - name: generated direct match
    code: |
      #include <openssl/evp.h>
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        EVP_md5(arg);
      }
  description: "OpenSSL EVP_md5 — MD5 is collision-broken."

