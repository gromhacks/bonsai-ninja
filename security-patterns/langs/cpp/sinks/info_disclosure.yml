# C++ information-disclosure sinks (stdio, logging, HTTP error bodies).
- id: cpp.info_disclosure.spdlog_error_secret
  enabled: true
  language: cpp
  tag: information-disclosure
  severity: medium
  packages: [spdlog]
  cwe: [CWE-200]
  match:
    kind: call
    callee:
      attribute: [spdlog, error]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)(secret|token|password|passwd|api[_-]?key|credential|private[_-]?key)'
  match_examples:
  - name: generated direct match
    code: |
      #include <spdlog/spdlog.h>
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        spdlog::error("api_key={}", arg);
      }
    expect_match_text: [spdlog::error]
  - name: spdlog ordinary error negative
    code: |
      #include <spdlog/spdlog.h>
      void example(const char *user) {
        spdlog::error("user={}", user);
      }
    expect_no_match: true
  description: "spdlog::error with secret-shaped values persists sensitive data in application logs."

- id: cpp.info_disclosure.fmt_print_secret
  enabled: true
  language: cpp
  tag: information-disclosure
  severity: medium
  packages: [fmt]
  cwe: [CWE-200]
  match:
    kind: call
    callee:
      attribute: [fmt, print]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)(secret|token|password|passwd|api[_-]?key|credential|private[_-]?key)'
  match_examples:
  - name: generated direct match
    code: |
      #include <fmt.h>
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        fmt::print("secret={}", arg);
      }
    expect_match_text: [fmt::print]
  - name: fmt print ordinary value negative
    code: |
      #include <fmt.h>
      void example(const char *user) {
        fmt::print("user={}", user);
      }
    expect_no_match: true
  description: "fmt::print of secret-shaped values can expose tokens on stdout or stderr."
