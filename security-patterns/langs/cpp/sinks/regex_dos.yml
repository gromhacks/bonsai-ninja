- id: cpp.redos.std_regex_ctor
  enabled: true
  language: cpp
  tag: redos
  severity: medium
  cwe: [CWE-1333]
  match:
    kind: new
    callee:
      name: regex
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      void example() {
        const char *arg = "tainted";
        auto *x = new regex(arg);
      }
  - name: literal arg 0 negative
    code: |
      void example() {
        auto *x = new regex("safe");
      }
    expect_no_match: true
  description: "std::regex(tainted_pattern) — compiling an attacker-controlled regex pattern."

