# C++ ReDoS / regex-engine sinks — std::regex / boost::regex with tainted pattern or input.
- id: cpp.redos.std_regex_search
  enabled: true
  language: cpp
  tag: redos
  severity: medium
  cwe: [CWE-1333]
  match:
    kind: call
    callee:
      attribute: [std, regex_search]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: |
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        std::regex_search(arg);
      }
  - name: literal arg 1 negative
    code: |
      void example() {
        std::regex_search("safe", "safe");
      }
    expect_no_match: true
  description: "std::regex_search(input, pattern) — catastrophic backtracking when pattern is attacker-controlled."

