- id: cpp.path.fopen
  enabled: true
  language: cpp
  tag: path-traversal
  severity: high
  cwe:
  - CWE-22
  match:
    kind: call
    callee:
      name: fopen
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: "void example() {\n  const char *arg = \"tainted\";\n  const char *fmt = arg;\n  const char *query = arg;\n  fopen(arg);\n}\n"
  - name: literal arg 0 negative
    code: |
      void example() {
        fopen("safe");
      }
    expect_no_match: true
  description: "fopen(path, mode) — tainted path traverses outside base dir."
- id: cpp.path.open
  enabled: true
  language: cpp
  tag: path-traversal
  severity: high
  cwe:
  - CWE-22
  match:
    kind: call
    callee:
      name: open
  constraints:
  - top_level: true
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted posix open path
    code: |
      #include <fcntl.h>
      void example() {
        const char *arg = "tainted";
        open(arg, 0);
      }
  - name: literal open path negative
    code: |
      #include <fcntl.h>
      void example() {
        open("/tmp/safe", 0);
      }
    expect_no_match: true
  description: "POSIX open(path, flags) — tainted path traverses outside base dir. Bare name retained because POSIX open is a true top-level symbol; top_level constraint suppresses ifstream::open / socket::open / QFile::open collisions."
