- id: cpp.tls.openssl_verify_none
  enabled: true
  language: cpp
  tag: weak-tls
  severity: high
  packages:
  - openssl
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      name: SSL_CTX_set_verify
  match_examples:
  - name: generated direct match
    code: "#include <openssl/evp.h>\nvoid example() {\n  const char *arg = \"tainted\"\
      ;\n  const char *fmt = arg;\n  const char *query = arg;\n  SSL_CTX_set_verify(arg,\
      \ SSL_VERIFY_NONE);\n}\n"
  description: "OpenSSL SSL_CTX_set_verify(ctx, SSL_VERIFY_NONE, NULL) \u2014 no cert\
    \ verification."
- id: cpp.tls.openssl_set_verify_none
  enabled: true
  language: cpp
  tag: weak-tls
  severity: high
  packages:
  - openssl
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      name: SSL_set_verify
  match_examples:
  - name: generated direct match
    code: "#include <openssl/evp.h>\nvoid example() {\n  const char *arg = \"tainted\"\
      ;\n  const char *fmt = arg;\n  const char *query = arg;\n  SSL_set_verify(arg,\
      \ SSL_VERIFY_NONE);\n}\n"
  description: "OpenSSL SSL_set_verify(ssl, SSL_VERIFY_NONE, NULL) \u2014 per-connection\
    \ no verify."
- id: cpp.tls.boost_asio_verify_none
  enabled: true
  language: cpp
  tag: weak-tls
  severity: high
  packages:
  - boost.asio
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      attribute:
      - context
      - set_verify_mode
  match_examples:
  - name: generated direct match
    code: "#include <boost/asio.hpp>\n#include <boost/asio.hpp>\n#include <boost/asio.hpp>\n\
      void example() {\n  const char *arg = \"tainted\";\n  const char *fmt = arg;\n\
      \  const char *query = arg;\n  context::set_verify_mode(verify_none);\n}\n"
  description: "boost::asio::ssl::context::set_verify_mode(verify_none). Arg-shape\
    \ constraint requires the verify-none enumerator literal \u2014 `set_verify_mode(verify_peer)`\
    \ does NOT fire."
  imports:
  - boost
  - boost/asio.hpp
- id: cpp.tls.qt_qssl_setpeerverifymode
  enabled: true
  language: cpp
  tag: weak-tls
  severity: high
  packages:
  - Qt
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      regex: ^QSslConfiguration::setPeerVerifyMode$
  match_examples:
  - name: generated direct match
    code: "#include <QtCore/Qt>\n#include <QtCore/Qt>\n#include <QtCore/Qt> /* Qt\
      \ */\nvoid example() {\n  const char *arg = \"tainted\";\n  const char *fmt\
      \ = arg;\n  const char *query = arg;\n  QSslConfiguration::setPeerVerifyMode(arg);\n\
      }\n"
  description: "Qt QSslConfiguration::setPeerVerifyMode(VerifyNone) \u2014 disables\
    \ cert check."
  imports:
  - QtCore
  - QtCore/Qt
