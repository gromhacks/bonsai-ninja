- id: cpp.tls.openssl_verify_none
  enabled: true
  language: cpp
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [openssl]
  imports: [openssl/ssl.h, openssl]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: SSL_CTX_set_verify
      binding_origin: runtime-global
  constraints:
  - arg_matches_regex:
      index: 1
      regex: '^(SSL_VERIFY_NONE|0)$'
  match_examples:
  - name: OpenSSL context verification disabled
    code: |
      #include <openssl/ssl.h>
      void configure(SSL_CTX *context) {
        SSL_CTX_set_verify(context, SSL_VERIFY_NONE, nullptr);
      }
    expect_match_text: [SSL_CTX_set_verify]
  - name: OpenSSL context peer verification negative
    code: |
      #include <openssl/ssl.h>
      void configure(SSL_CTX *context) {
        SSL_CTX_set_verify(context, SSL_VERIFY_PEER, nullptr);
      }
    expect_no_match: true
  - name: local OpenSSL context setter collision negative
    code: |
      #include <openssl/evp.h>
      static void SSL_CTX_set_verify(void *, int, void *) {}
      void configure(void *context) {
        SSL_CTX_set_verify(context, SSL_VERIFY_NONE, nullptr);
      }
    expect_no_match: true
  description: "OpenSSL SSL_CTX_set_verify with the exact no-verification mode disables certificate-chain verification for the context."

