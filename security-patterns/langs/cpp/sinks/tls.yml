- id: cpp.tls.poco_context_verify_none
  enabled: true
  language: cpp
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [Poco]
  imports: [Poco/Net/Context.h, Poco]
  cwe: [CWE-295]
  match:
    kind: new
    callee:
      attribute: [Poco, Net, Context]
  constraints:
  - min_args: 5
  - arg_matches_regex:
      index: 4
      regex: '^(Poco::Net::Context::|Context::)?VERIFY_NONE$'
  match_examples:
  - name: Poco TLS context verification disabled
    code: |
      #include <Poco/Net/Context.h>
      void configure() {
        auto *context = new Poco::Net::Context(
            Poco::Net::Context::CLIENT_USE, "", "", "",
            Poco::Net::Context::VERIFY_NONE);
      }
    expect_match_text: ["Poco::Net::Context"]
  - name: Poco TLS context relaxed verification negative
    code: |
      #include <Poco/Net/Context.h>
      void configure() {
        auto *context = new Poco::Net::Context(
            Poco::Net::Context::CLIENT_USE, "", "", "",
            Poco::Net::Context::VERIFY_RELAXED);
      }
    expect_no_match: true
  - name: local Poco context collision negative
    code: |
      #include <Poco/Foundation.h>
      namespace Local { struct Context { Context(int, const char *, const char *, const char *, int); }; }
      void configure() {
        auto *context = new Local::Context(0, "", "", "", 0);
      }
    expect_no_match: true
  description: "Poco::Net::Context constructed with the exact VERIFY_NONE mode disables peer certificate verification."

- id: cpp.tls.cpphttplib_server_verify_off
  enabled: true
  language: cpp
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [cpp-httplib]
  imports: [httplib.h, httplib]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: enable_server_certificate_verification
  constraints:
  - receiver_type_in: [Client, "httplib::Client"]
  - arg_equals:
      index: 0
      value: "false"
  match_examples:
  - name: cpp-httplib server verification disabled
    code: |
      #include <httplib.h>
      void configure(httplib::Client &client) {
        client.enable_server_certificate_verification(false);
      }
    expect_match_text: [client.enable_server_certificate_verification]
  - name: cpp-httplib server verification enabled negative
    code: |
      #include <httplib.h>
      void configure(httplib::Client &client) {
        client.enable_server_certificate_verification(true);
      }
    expect_no_match: true
  - name: unrelated cpp-httplib method collision negative
    code: |
      #include <httplib.h>
      namespace local { struct Client { void enable_server_certificate_verification(bool); }; }
      void configure(local::Client &client) {
        client.enable_server_certificate_verification(false);
      }
    expect_no_match: true
  description: "cpp-httplib Client::enable_server_certificate_verification(false) disables server certificate verification."
