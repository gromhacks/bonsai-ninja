- id: cpp.tls.boost_asio_verify_none
  enabled: true
  language: cpp
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [boost.asio]
  imports: [boost/asio/ssl.hpp, boost]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: set_verify_mode
  constraints:
  - receiver_type_in: [context, "boost::asio::ssl::context"]
  - arg_matches_regex:
      index: 0
      regex: '^(boost::asio::ssl::)?verify_none$'
  match_examples:
  - name: Boost Asio verification disabled
    code: |
      #include <boost/asio/ssl.hpp>
      void configure(boost::asio::ssl::context &context) {
        context.set_verify_mode(boost::asio::ssl::verify_none);
      }
    expect_match_text: [context.set_verify_mode]
  - name: Boost Asio peer verification negative
    code: |
      #include <boost/asio/ssl.hpp>
      void configure(boost::asio::ssl::context &context) {
        context.set_verify_mode(boost::asio::ssl::verify_peer);
      }
    expect_no_match: true
  - name: unrelated Boost verify-mode receiver negative
    code: |
      #include <boost/asio/ssl.hpp>
      namespace local { struct context { void set_verify_mode(int); }; }
      void configure(local::context &context) {
        context.set_verify_mode(boost::asio::ssl::verify_none);
      }
    expect_no_match: true
  description: "boost::asio::ssl::context::set_verify_mode with the exact verify_none enumerator disables peer verification."

