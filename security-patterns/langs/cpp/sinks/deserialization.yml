# C++ deserialization sinks (Boost.Serialization + cereal + Qt + protobuf).
- id: cpp.deser.boost_text_iarchive
  enabled: true
  language: cpp
  tag: insecure-deserialization
  severity: high
  packages: [boost.serialization]
  cwe: [CWE-502]
  match:
    kind: new
    callee:
      name: text_iarchive
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <boost/serialization/serialization.hpp>
      #include <boost/serialization/serialization.hpp>
      #include <boost/serialization/serialization.hpp>
      void example() {
        const char *arg = "tainted";
        auto *x = new text_iarchive(arg);
      }
  - name: literal arg 0 negative
    code: |
      void example() {
        auto *x = new text_iarchive("safe");
      }
    expect_no_match: true
  description: "boost::archive::text_iarchive — gadget-chain RCE risk when polymorphic types are registered."

  imports:
  - boost/serialization/serialization.hpp
  - boost
