  description: "Disabled - newHttpResponse is a factory; the actual sink is setBody on the returned object."
- id: cpp.xss.pistache_setbody
  enabled: true
  language: cpp
  tag: xss
  severity: high
  packages:
  - pistache
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - ResponseWriter
      - send
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted pistache response body
    code: |
      #include <pistache/endpoint.h>
      void example() {
        const char *arg = "tainted";
        ResponseWriter::send(200, arg);
      }
  - name: literal pistache response body negative
    code: |
      #include <pistache/endpoint.h>
      void example() {
        ResponseWriter::send(200, "safe");
      }
    expect_no_match: true
  description: "pistache ResponseWriter::send(code, tainted) - reflected XSS when body is HTML."
