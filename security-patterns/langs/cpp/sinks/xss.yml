- id: cpp.xss.cpphttplib_set_content
  aliases:
  - cpp.info_disclosure.httplib_error_detail
  enabled: true
  language: cpp
  tag: xss
  severity: high
  packages:
  - cpp-httplib
  cwe:
  - CWE-79
  - CWE-209
  match:
    kind: call
    callee:
      attribute:
      - Response
      - set_content
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: "#include <httplib.h>\n#include <httplib.h>\nvoid example() {\n  const char *arg = \"tainted\";\n  const char *fmt = arg;\n  const char *query = arg;\n  Response::set_content(\"<p>\" + arg + \"</p>\", \"text/html\");\n}\n"
  - name: literal arg 0 negative
    code: |
      void example() {
        Response::set_content("safe");
      }
    expect_no_match: true
  description: "cpp-httplib Response::set_content(tainted, \"text/html\") - reflected XSS. Also covers merged aliases: cpp.info_disclosure.httplib_error_detail."
  imports:
  - httplib.h
  - httplib
- id: cpp.xss.crow_response_body
  enabled: true
  language: cpp
  tag: xss
  severity: high
  packages:
  - crow
  cwe:
  - CWE-79
  match:
    kind: write
    target:
      attribute:
      - res
      - body
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: "#include <crow.h> /* crow */\nvoid example() {\n  res.body = \"tainted\";\n}\n"
  - name: literal crow body negative
    code: |
      #include <crow.h>
      void example() {
        res.body = "<p>safe</p>";
      }
    expect_no_match: true
  description: "crow res.body = tainted - reflected XSS if Content-Type is HTML."
