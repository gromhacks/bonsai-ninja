- id: cpp.xss.cpphttplib_set_content
  enabled: true
  language: cpp
  tag: xss
  severity: high
  packages:
  - cpp-httplib
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - Response
      - set_content
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    character_escape:
      value_arg_indices: [0]
      required_mappings:
      - {input: "&", output: "&amp;"}
      - {input: "<", output: "&lt;"}
      - {input: ">", output: "&gt;"}
      - {input: '"', output: "&quot;"}
      - {input: "'", output: "&#39;"}
  match_examples:
  - name: generated direct match
    code: |
      #include <httplib.h>
      void example(const char *arg) {
        const char *fmt = arg;
        const char *query = arg;
        Response::set_content("<p>" + arg + "</p>", "text/html");
      }
  - name: literal arg 0 negative
    code: |
      void example() {
        Response::set_content("safe");
      }
    expect_no_match: true
  description: "cpp-httplib Response::set_content(tainted, \"text/html\") - reflected XSS."
  imports:
  - httplib.h
  - httplib
- id: cpp.xss.crow_response_body
  enabled: true
  language: cpp
  tag: xss
  severity: high
  packages:
  - crow
  cwe:
  - CWE-79
  match:
    kind: write
    target:
      attribute:
      - res
      - body
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <crow.h>
      void example(const char *arg) {
        res.body = arg;
      }
  - name: literal crow body negative
    code: |
      #include <crow.h>
      void example() {
        res.body = "<p>safe</p>";
      }
    expect_no_match: true
  description: "crow res.body = tainted - reflected XSS if Content-Type is HTML."

- id: cpp.xss.crow_response_constructor
  enabled: true
  language: cpp
  tag: xss
  severity: high
  packages: [crow]
  imports: [crow.h, crow]
  cwe: [CWE-79]
  match:
    kind: call
    callee:
      attribute: [crow, response]
      binding_origin: imported
  constraints:
  - arg_tainted:
      index: 0
  - arg_matches_regex:
      index: 0
      regex: '<[A-Za-z!/][^>]*>'
  match_examples:
  - name: Crow response constructed from explicit HTML
    code: |
      #include <crow.h>
      crow::response emit(const std::string& value) {
        return crow::response("<p>" + value + "</p>");
      }
    expect_match_text: ["crow::response"]
  - name: raw dynamic Crow response has no proven HTML execution context
    code: |
      #include <crow.h>
      crow::response emit(const std::string& body) {
        return crow::response(body);
      }
    expect_no_match: true
  - name: constant Crow response body is not tainted
    code: |
      #include <crow.h>
      crow::response emit() {
        return crow::response("<p>safe</p>");
      }
    expect_no_match: true
  - name: local value named crow is not the imported framework API
    code: |
      #include <crow.h>
      struct LocalResponder {
        int response(const std::string& value) { return value.size(); }
      };
      int emit(LocalResponder& crow, const std::string& body) {
        return crow.response(body);
      }
    expect_no_match: true
  description: "Crow's imported response constructor is an XSS boundary only when the exact argument syntax contains HTML markup; a raw dynamic byte/string response has no compiler-proven HTML execution context."

