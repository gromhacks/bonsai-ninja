- id: cpp.xss.drogon_newhttpresponse
  enabled: false
  disabled_reason:
    code: over-broad
  language: cpp
  tag: xss
  severity: medium
  packages:
  - drogon
  cwe:
  - CWE-79
  match:
    kind: call
