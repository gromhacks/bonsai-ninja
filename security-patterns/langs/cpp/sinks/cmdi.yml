- id: cpp.cmdi.system
  enabled: true
  language: cpp
  tag: command-injection
  severity: critical
  category: process-exec
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      regex: ^system$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted command string
    code: "void example(const char *input) {\n  system(input);\n}\n"
  - name: literal command negative
    code: "void example() {\n  system(\"safe\");\n}\n"
    expect_no_match: true
  description: "libc system(cmd) - shell-interpreted command."
