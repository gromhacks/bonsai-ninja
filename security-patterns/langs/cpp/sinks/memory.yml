- id: cpp.memory.memcpy
  enabled: true
  language: cpp
  tag: memory-safety
  severity: high
  cwe:
  - CWE-120
  - CWE-125
  - CWE-787
  match:
    kind: call
    callee:
      name: memcpy
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: tainted length
    code: "void example(char *dst, const char *src, unsigned long n) {\n  memcpy(dst,\
      \ src, n);\n}\n"
  - name: fixed length is not tainted n
    code: "#define FIXED_LEN 40\nvoid example(char *dst, const char *src) {\n  memcpy(dst,\
      \ src, FIXED_LEN);\n}\n"
    expect_no_match: true
  description: "memcpy(dst, src, n) \u2014 tainted n past dst is OOB write (CWE-787,\
    \ e.g. Sudo Baron Samedit); tainted n past src is OOB read (CWE-125, e.g. Heartbleed);\
    \ generic copy-overflow is CWE-120."
