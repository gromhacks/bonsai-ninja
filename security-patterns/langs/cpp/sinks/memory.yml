- id: cpp.memory.strcpy
  enabled: true
  language: cpp
  tag: memory-safety
  severity: critical
  cwe:
  - CWE-120
  - CWE-121
  match:
    kind: call
    callee:
      name: strcpy
  match_examples:
  - name: generated direct match
    code: "void example() {\n  const char *arg = \"tainted\";\n  const char *fmt =\
      \ arg;\n  const char *query = arg;\n  strcpy(arg);\n}\n"
  description: "strcpy(dst, src) \u2014 unbounded copy; src length controls overflow."
