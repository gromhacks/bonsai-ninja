- id: cpp.memory.malloc_tainted_size
  enabled: true
  language: cpp
  tag: memory-safety
  severity: high
  cwe:
  - CWE-190
  - CWE-789
  - CWE-787
  match:
    kind: call
    callee:
      name: malloc
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted allocation size
    code: "void *malloc(unsigned long size);\nint main(int argc, char **argv) {\n  malloc(argv);\n  return argc;\n}\n"
  - name: sizeof operand is not runtime size taint
    code: "void *malloc(unsigned long size);\nint main(int argc, char **argv) {\n  unsigned long cap = 32;\n  malloc(sizeof(argv) * cap);\n  return argc;\n}\n"
    expect_no_match: true
  description: "malloc(n) - tainted n with multiplicative computation can overflow\
    \ size_t; subsequent copies against the un-overflowed value go OOB (CWE-787)."
