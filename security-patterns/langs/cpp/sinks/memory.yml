  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted new size
    code: "void *realloc(void *ptr, unsigned long size);\nint main(int argc, char **argv) {\n  void *ptr = 0;\n  realloc(ptr, argv);\n  return argc;\n}\n"
  - name: tainted pointer is not tainted new size
    code: "void *realloc(void *ptr, unsigned long size);\nint main(int argc, char **argv) {\n  realloc(argv, 64);\n  return argc;\n}\n"
    expect_no_match: true
  description: "realloc(ptr, n) with tainted size - overflow path same as malloc."
- id: cpp.memory.delete_use_after
  enabled: false
  language: cpp
  tag: memory-safety
  severity: critical
  cwe:
  - CWE-416
  - CWE-415
  match:
    kind: call
    callee:
      name: delete
  match_examples:
  - name: generated direct match
    code: "void example() {\n  int *ptr = new int;\n  delete ptr;\n}\n"
  description: "C++ `delete p` audit hint - sink fires on the free site; UAF\
    \ correlation requires the engine to flag a later dereference of the same pointer\
    \ (CWE-416). Also covers double-free shapes (CWE-415) when the same pointer reaches\
    \ two delete sites."
  disabled_reason:
    code: over-broad
