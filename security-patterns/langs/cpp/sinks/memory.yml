- id: cpp.memory.strcpy
  enabled: true
  language: cpp
  tag: memory-safety
  severity: critical
  cwe:
  - CWE-120
  - CWE-121
  match:
    kind: call
    callee:
      name: strcpy
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: strcpy tainted source
    code: |
      void example(char *dst, const char *user_input) {
        strcpy(dst, user_input);
      }
  - name: strcpy literal source negative
    code: |
      void example(char *dst) {
        strcpy(dst, "fixed");
      }
    expect_no_match: true
  description: "strcpy(dst, tainted_src) - unbounded copy; source length controls stack/heap overflow."
