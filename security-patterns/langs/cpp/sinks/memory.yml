  tag: memory-safety
  severity: critical
  cwe:
  - CWE-120
  - CWE-242
  match:
    kind: call
    callee:
      name: gets
  match_examples:
  - name: generated direct match
    code: "void example() {\n  const char *arg = \"tainted\";\n  const char *fmt =\
