# C++ format-string sinks — tainted format argument.
# (iostreams are safe by default; these are C-style APIs still used from C++.)
- id: cpp.format.printf_tainted
  enabled: true
  language: cpp
  tag: format-string
  severity: high
  cwe: [CWE-134]
  match:
    kind: call
    callee:
      name: printf
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted format string
    code: |
      void example(const char *input) {
        const char *fmt = input;
        printf(fmt);
      }
  - name: literal format negative
    code: |
      void example() {
        printf("%s", "safe");
      }
    expect_no_match: true
  description: "printf(fmt, ...) with tainted fmt — arbitrary read/write via %n / %s."

- id: cpp.format.fprintf_tainted
  aliases:
    - cpp.info_disclosure.fprintf_stderr_secret
  enabled: true
  language: cpp
  tag: format-string
  severity: high
  cwe: [CWE-134, CWE-200]
  match:
    kind: call
    callee:
      name: fprintf
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted format string
    code: |
      void example(void *stream, const char *input) {
        const char *fmt = input;
        fprintf(stream, fmt);
      }
  - name: literal format negative
    code: |
      void example(void *stream) {
        fprintf(stream, "%s", "safe");
      }
    expect_no_match: true
  description: "fprintf(stream, fmt, ...) with tainted fmt. Also covers merged aliases: cpp.info_disclosure.fprintf_stderr_secret."

- id: cpp.format.sprintf_tainted
  aliases:
    - cpp.memory.sprintf
  enabled: true
  language: cpp
  tag: format-string
  severity: critical
  cwe: [CWE-134, CWE-120]
  match:
    kind: call
    callee:
      name: sprintf
  constraints:
  - arg_tainted:
      index: 1
  taint_semantics:
    output_arg_flows:
    - output_arg_index: 0
      value_start_arg_index: 1
  match_examples:
  - name: tainted format string
    code: |
      void example(char *buf, const char *input) {
        const char *fmt = input;
        sprintf(buf, fmt);
      }
  - name: literal format negative
    code: |
      void example(char *buf) {
        sprintf(buf, "%s", "safe");
      }
    expect_no_match: true
  description: "sprintf(buf, fmt, ...) with tainted fmt — format injection + overflow. Also covers merged aliases: cpp.memory.sprintf."

