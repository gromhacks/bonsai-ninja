- id: cpp.format.std_format_tainted
  enabled: true
  language: cpp
  tag: format-string
  severity: high
  cwe: [CWE-134]
  match:
    kind: call
    callee:
      attribute: [std, format]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted format string
    code: |
      void example(const char *input) {
        std::format(input);
      }
  - name: literal format negative
    code: |
      void example() {
        std::format("{}");
      }
    expect_no_match: true
  description: "std::format(fmt, args...) with non-literal/tainted fmt — C++20 format consteval is bypassed when the template is a runtime string (use std::vformat at your own risk)."

