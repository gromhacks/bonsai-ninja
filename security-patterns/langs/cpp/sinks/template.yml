- id: cpp.template.inja_render
  enabled: true
  language: cpp
  tag: ssti
  severity: high
  packages:
  - inja
  cwe:
  - CWE-1336
  - CWE-94
  match:
    kind: call
    callee:
      attribute:
      - Environment
      - render
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted inja render template
    code: |
      #include <inja.h>
      void example(const char *arg) {
        const char *fmt = arg;
        const char *query = arg;
        Environment::render(arg);
      }
  - name: literal inja render template negative
    code: |
      #include <inja.h>
      void example() {
        Environment::render("{{ user }}");
      }
    expect_no_match: true
  description: "inja Environment::render(tainted_template, data) - tainted template source = SSTI."
- id: cpp.template.inja_render_file
  enabled: true
  language: cpp
  tag: ssti
  severity: high
  packages:
  - inja
  cwe:
  - CWE-1336
  - CWE-94
  match:
    kind: call
    callee:
      attribute:
      - Environment
      - render_file
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <inja.h>
      void example(const char *arg) {
        const char *fmt = arg;
        const char *query = arg;
        Environment::render_file( arg);
      }
  - name: literal arg 0 negative
    code: |
      void example() {
        Environment::render_file("safe");
      }
    expect_no_match: true
  description: "inja Environment::render_file(tainted_path, data) - tainted template path."
- id: cpp.template.drogon_view_response
  enabled: true
  language: cpp
  tag: ssti
  severity: high
  packages:
  - drogon
  cwe:
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - HttpResponse
      - newHttpViewResponse
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <drogon/drogon.h>
      void example(const char *arg) {
        const char *fmt = arg;
        const char *query = arg;
        HttpResponse::newHttpViewResponse( arg);
      }
  - name: literal arg 0 negative
    code: |
      void example() {
        HttpResponse::newHttpViewResponse("safe");
      }
    expect_no_match: true
  description: "Drogon HttpResponse::newHttpViewResponse(tainted_view_name, ...) - attacker picks which CSP view to render."
