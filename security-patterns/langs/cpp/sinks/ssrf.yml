- id: cpp.ssrf.curl_easy_setopt_url
  enabled: true
  language: cpp
  tag: ssrf
  severity: high
  cwe:
  - CWE-918
  analysis_semantics:
    compiler_guard:
      capability: terminal-predicate.compound-static-allowlist
      required_evidence:
      - guarded-argument:2=predicate-argument:0
      - predicate-complete:true
      - finite-static-string-membership:true
      - prefix-call:rfind
      - prefix-value:string:https://
      - prefix-position:number:0
      - prefix-remainder-call:substr
      - membership-call:count
      - membership-token-boundary:true
      - membership-subject-derived-from-prefix:true
      - related-call:curl_easy_setopt:argument:0=guarded-argument:0
      - related-call:curl_easy_setopt:argument:1=place:CURLOPT_FOLLOWLOCATION
      - related-call:curl_easy_setopt:argument:2=number:0
      sanitizer_tag: ssrf
      category: finite-host-allowlist-and-no-redirect
  match:
    kind: call
    callee:
      name: curl_easy_setopt
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: generated direct match
    code: |
      void example(const char *input) {
        curl_easy_setopt("safe", "safe", input);
      }
  - name: literal arg 2 negative
    code: |
      void example() {
        curl_easy_setopt("safe", "safe", "safe");
      }
    expect_no_match: true
  description: "curl_easy_setopt(CURLOPT_URL, tainted) - outbound request to an attacker-controlled host."
