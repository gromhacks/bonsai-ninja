- id: cpp.ssrf.curl_easy_setopt_url
  aliases:
  - cpp.tls.curl_ssl_verifypeer_off
  - cpp.tls.curl_ssl_verifyhost_off
  enabled: true
  language: cpp
  tag: ssrf
  severity: high
  cwe:
  - CWE-918
  - CWE-295
  match:
    kind: call
    callee:
      name: curl_easy_setopt
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: generated direct match
    code: |
      void example(const char *input) {
        curl_easy_setopt("safe", "safe", input);
      }
  - name: literal arg 2 negative
    code: |
      void example() {
        curl_easy_setopt("safe", "safe", "safe");
      }
    expect_no_match: true
  description: "curl_easy_setopt(CURLOPT_URL, tainted) - outbound request to attacker host. Also covers merged aliases: cpp.tls.curl_ssl_verifypeer_off, cpp.tls.curl_ssl_verifyhost_off."
