# C++ eval / dynamic-code sinks (embedded interpreters + dynamic loading).
- id: cpp.eval.dlopen
  enabled: true
  language: cpp
  tag: code-injection
  severity: critical
  cwe: [CWE-94, CWE-470]
  match:
    kind: call
    callee:
      name: dlopen
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        dlopen(arg);
      }
  - name: literal arg 0 negative
    code: |
      void example() {
        dlopen("safe");
      }
    expect_no_match: true
  description: "dlopen(tainted) — loads arbitrary shared library as code."

- id: cpp.eval.dlsym
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: cpp
  tag: code-injection
  severity: medium
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: dlsym
  description: "Disabled — dlsym is benign unless the symbol name is tainted."

