# C++ file-upload sinks - client-controlled filenames reaching the filesystem.
- id: cpp.upload.cpphttplib_multipart
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: cpp.source.cpphttplib_file_value
  language: cpp
  tag: file-upload
  severity: medium
  packages: [cpp-httplib]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [Request, get_file_value]
  match_examples:
  - name: generated direct match
    code: |
      #include <httplib.h>
      #include <httplib.h>
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        Request::get_file_value(arg);
      }
  description: "Disabled - get_file_value returns client-controlled multipart metadata and is modeled as cpp.source.cpphttplib_file_value. The sink is the later filesystem write."

  imports:
  - httplib.h
  - httplib
- id: cpp.upload.drogon_uploaded_file
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: cpp.source.drogon_uploaded_filename
  language: cpp
  tag: file-upload
  severity: medium
  packages: [drogon]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [HttpFile, getFileName]
  match_examples:
  - name: generated direct match
    code: |
      #include <drogon/drogon.h>
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        HttpFile::getFileName(arg);
      }
  description: "Disabled - HttpFile::getFileName is a client-controlled filename source, not a write sink. Downstream save/open rules carry the vulnerability."

- id: cpp.upload.drogon_save
  enabled: true
  language: cpp
  tag: file-upload
  severity: high
  packages: [drogon]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [HttpFile, save]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <drogon/drogon.h>
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        HttpFile::save(arg);
      }
  - name: literal arg 0 negative
    code: |
      void example() {
        HttpFile::save("safe");
      }
    expect_no_match: true
  description: "Drogon HttpFile::save / saveAs - writes uploaded bytes to disk; flag when filename is unsanitised."

- id: cpp.upload.drogon_save_as
  enabled: true
  language: cpp
  tag: file-upload
  severity: high
  packages: [drogon]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [HttpFile, saveAs]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <drogon/drogon.h>
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        HttpFile::saveAs(arg);
      }
  - name: literal arg 0 negative
    code: |
      void example() {
        HttpFile::saveAs("safe");
      }
    expect_no_match: true
  description: "Drogon HttpFile::saveAs(path) - tainted path writes arbitrary file."

- id: cpp.upload.poco_partstore
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: cpp
  tag: file-upload
  severity: medium
  packages: [Poco]
  cwe: [CWE-434]
  match:
    kind: new
    callee:
      name: PartHandler
  match_examples:
  - name: generated direct match
    code: |
      #include <Poco/Net/PartHandler.h>
      using Poco::Net::PartHandler;
      void example() {
        const char *arg = "tainted";
        auto *x = new PartHandler(arg);
      }
  description: "Disabled - PartHandler receives uploaded part metadata but is not a filesystem sink. Model its callback filename as a source once subclass/callback facts are available."
