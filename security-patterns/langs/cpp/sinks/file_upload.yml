# C++ file-upload sinks - client-controlled filenames reaching the filesystem.
- id: cpp.upload.drogon_save
  enabled: true
  language: cpp
  tag: file-upload
  severity: high
  packages: [drogon]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [HttpFile, save]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <drogon/drogon.h>
      void example(const char *arg) {
        const char *fmt = arg;
        const char *query = arg;
        HttpFile::save(arg);
      }
  - name: literal arg 0 negative
    code: |
      void example() {
        HttpFile::save("safe");
      }
    expect_no_match: true
  description: "Drogon HttpFile::save / saveAs - writes uploaded bytes to disk; flag when filename is unsanitised."

