- id: cpp.upload.poco_partstore
  enabled: true
  language: cpp
  tag: file-upload
  severity: medium
  packages: [Poco]
  cwe: [CWE-434]
  match:
    kind: new
    callee:
      name: PartHandler
  match_examples:
  - name: generated direct match
    code: |
      #include <Poco/Net/PartHandler.h>
      using Poco::Net::PartHandler;
      void example() {
        const char *arg = "tainted";
        auto *x = new PartHandler(arg);
      }
  description: "Poco::Net::PartHandler subclass — handles uploaded parts; flag when filename is used on disk."
