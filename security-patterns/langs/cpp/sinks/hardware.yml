# C++ hardware-control / bus-write sinks (GPIO, PWM, I2C/SMBus, SPI, UART).
- id: cpp.hardware.gpio_set_value
  enabled: true
  language: cpp
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [linux-gpio]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      name: gpio_set_value
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: gpio set value tainted pin
    code: |
      #include <linux/gpio.h>
      void example(int user_input) {
        gpio_set_value(user_input, 1);
      }
  - name: gpio set value literal negative
    code: |
      #include <linux/gpio.h>
      void example() {
        gpio_set_value(17, 1);
      }
    expect_no_match: true
  description: "gpio_set_value(pin, value) - attacker-controlled pin or value drives physical hardware state."
  imports:
  - linux
  - linux/gpio.h

