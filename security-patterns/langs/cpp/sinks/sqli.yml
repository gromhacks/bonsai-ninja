- id: cpp.sqli.sqlite3_exec
  enabled: true
  language: cpp
  tag: sql-injection
  severity: critical
  packages:
  - sqlite3
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      name: sqlite3_exec
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: "#include <sqlite3.h>\nvoid example() {\n  const char *arg = \"tainted\";\n  const char *fmt = arg;\n  const char *query = arg;\n  sqlite3_exec(arg);\n}\n"
  - name: literal arg 1 negative
    code: |
      void example() {
        sqlite3_exec("safe", "safe");
      }
    expect_no_match: true
  description: "sqlite3_exec(db, sql, ...) — raw SQL, no binding."
- id: cpp.sqli.sqlite3_prepare_v2
  enabled: true
  language: cpp
  tag: sql-injection
  severity: medium
  packages:
  - sqlite3
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      name: sqlite3_prepare_v2
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted sqlite3 prepare sql
    code: |
      #include <sqlite3.h>
      void example(sqlite3 *db) {
        const char *arg = "tainted";
        sqlite3_prepare_v2(db, arg, -1, 0, 0);
      }
  - name: literal sqlite3 prepare sql negative
    code: |
      #include <sqlite3.h>
      void example(sqlite3 *db) {
        sqlite3_prepare_v2(db, "SELECT * FROM users WHERE id = ?", -1, 0, 0);
      }
    expect_no_match: true
  description: "sqlite3_prepare_v2(db, tainted_sql, ...) — placeholders are safe, but a tainted SQL string at prepare time still permits query construction injection."
