- id: cpp.sqli.libpq_pqexecparams_string_built
  enabled: true
  language: cpp
  tag: sql-injection
  severity: medium
  packages:
  - libpq
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      name: PQexecParams
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted pqexecparams sql
    code: |
      #include <libpq-fe.h> /* libpq */
      void example(PGconn *conn) {
        const char *arg = "tainted";
        PQexecParams(conn, arg, 0, 0, 0, 0, 0, 0);
      }
  - name: literal pqexecparams sql negative
    code: |
      #include <libpq-fe.h> /* libpq */
      void example(PGconn *conn, const char *value) {
        const char *params[] = { value };
        PQexecParams(conn, "SELECT * FROM users WHERE id = $1", 1, 0, params, 0, 0, 0);
      }
    expect_no_match: true
  description: "PQexecParams(conn, tainted_sql, ...) — parameter values are safe, but a tainted SQL string at prepare/execute time is still raw dynamic SQL."
  imports:
  - libpq-fe.h
  - libpq-fe
