- id: cpp.sqli.sqlite3_exec
  enabled: true
  language: cpp
  tag: sql-injection
  severity: critical
  packages:
  - sqlite3
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      name: sqlite3_exec
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: "#include <sqlite3.h>\nvoid example() {\n  const char *arg = \"tainted\";\n  const char *fmt = arg;\n  const char *query = arg;\n  sqlite3_exec(arg);\n}\n"
  - name: literal arg 1 negative
    code: |
      void example() {
        sqlite3_exec("safe", "safe");
      }
    expect_no_match: true
  description: "sqlite3_exec(db, sql, ...) — raw SQL, no binding."
