- id: cpp.open_redirect.crow_location
  enabled: true
  language: cpp
  tag: open-redirect
  severity: high
  packages:
  - crow
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - response
      - redirect
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted crow redirect
    code: "#include <crow.h> /* crow */\nvoid example() {\n  const char *arg = \"tainted\";\n  const char *fmt = arg;\n  const char *query = arg;\n  response::redirect(arg);\n}\n"
  - name: literal crow redirect negative
    code: |
      #include <crow.h>
      void example() {
        response::redirect("/dashboard");
      }
    expect_no_match: true
  description: "crow response::redirect(tainted) — unchecked redirect."
- id: cpp.open_redirect.poco_set_location
  enabled: true
  language: cpp
  tag: open-redirect
  severity: medium
  packages:
  - Poco
  cwe:
  - CWE-113
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - HTTPResponse
      - redirect
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted poco redirect
    code: |
      #include <Poco/Net/HTTPServerResponse.h>
      void example() {
        const char *arg = "tainted";
        HTTPResponse::redirect(arg);
      }
  - name: literal poco redirect negative
    code: |
      #include <Poco/Net/HTTPServerResponse.h>
      void example() {
        HTTPResponse::redirect("/dashboard");
      }
    expect_no_match: true
  description: "Poco::Net::HTTPServerResponse::redirect(tainted) — unchecked external redirect unless the target is constrained to local paths or an allowlist."
