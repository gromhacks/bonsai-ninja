- id: cpp.open_redirect.cpphttplib_set_redirect
  enabled: true
  language: cpp
  tag: open-redirect
  severity: high
  packages:
  - cpp-httplib
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - Response
      - set_redirect
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: "#include <httplib.h>\n#include <httplib.h>\nvoid example() {\n  const char *arg = \"tainted\";\n  const char *fmt = arg;\n  const char *query = arg;\n  Response::set_redirect(target);\n}\n"
  - name: literal arg 0 negative
    code: |
      void example() {
        Response::set_redirect("safe");
      }
    expect_no_match: true
  description: "cpp-httplib Response::set_redirect(tainted) — unchecked URL allows phishing."
  imports:
  - httplib.h
  - httplib
