- id: cpp.nosql.hiredis_eval
  enabled: true
  language: cpp
  tag: nosql-injection
  severity: high
  packages: [hiredis]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      name: redisCommand
  constraints:
  - arg_matches_regex:
      index: 1
      regex: '(?i)^"EVAL\b'
  - arg_tainted:
      index: 2
  match_examples:
  - name: tainted redis eval script
    code: |
      #include <hiredis/hiredis.h>
      void example(redisContext *ctx, const char *arg) {
        redisCommand(ctx, "EVAL %s 0",arg);
      }
  - name: literal arg 1 negative
    code: |
      #include <hiredis/hiredis.h>
      void example(redisContext *ctx) {
        redisCommand(ctx, "GET %s", "safe");
      }
    expect_no_match: true
  description: "hiredis redisCommand(ctx, \"EVAL ...\", taintedScript) - Redis Lua injection."

- id: cpp.nosql.hiredis_command_generic
  enabled: true
  language: cpp
  tag: nosql-injection
  severity: high
  packages: [hiredis]
  cwe: [CWE-943, CWE-134]
  match:
    kind: call
    callee:
      name: redisCommand
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted redisCommand format
    code: |
      #include <hiredis/hiredis.h>
      void example(redisContext *ctx, const char *arg) {
        redisCommand(ctx,arg);
      }
  - name: tainted value with literal format negative
    code: |
      #include <hiredis/hiredis.h>
      void example(redisContext *ctx) {
        const char *arg = "tainted";
        redisCommand(ctx, "GET %s", arg);
      }
    expect_no_match: true
  description: "hiredis redisCommand(ctx, fmt, ...) - tainted command format permits attacker-controlled Redis operations."
