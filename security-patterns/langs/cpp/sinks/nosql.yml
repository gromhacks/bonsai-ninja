- id: cpp.nosql.hiredis_eval
  enabled: true
  language: cpp
  tag: nosql-injection
  severity: high
  packages: [hiredis]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      name: redisCommand
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: |
      #include <hiredis/hiredis.h>
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        redisCommand(arg, "EVAL %s");
      }
  - name: literal arg 1 negative
    code: |
      void example() {
        redisCommand("safe", "safe");
      }
    expect_no_match: true
  description: "hiredis redisCommand(\"EVAL %s\", tainted) — Redis Lua injection."

