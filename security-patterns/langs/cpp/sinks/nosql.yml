# C++ NoSQL injection (mongocxx / hiredis).
- id: cpp.nosql.mongocxx_find
  enabled: true
  language: cpp
  tag: nosql-injection
  severity: high
  packages: [mongocxx]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*(\.|::)find$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <mongocxx/client.hpp>
      void example(const char *arg) {
        const char *fmt = arg;
        const char *query = arg;
        collection::find( arg);
      }
  - name: literal arg 0 negative
    code: |
      void example() {
        mongocxx_find("safe");
      }
    expect_no_match: true
  description: "mongocxx collection::find(filter) - flag when BSON filter is built from tainted input."

