- id: cpp.header.crowcpp_add_header
  enabled: true
  language: cpp
  tag: header-injection
  severity: high
  packages: [crow]
  cwe: [CWE-113]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*(\.|::)add_header$
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: |
      #include <crow.h> /* crow */
      void example(const char *arg) {
        const char *fmt = arg;
        const char *query = arg;
        response::add_header(arg,arg);
      }
  - name: literal arg 1 negative
    code: |
      void example() {
        crowcpp_add_header("safe", "safe");
      }
    expect_no_match: true
  description: "crow response.add_header(name, tainted) - CRLF injection."

