# C++ header / CRLF injection - HTTP response header values from tainted input.
- id: cpp.header.cpphttplib_set_header
  enabled: true
  language: cpp
  tag: header-injection
  severity: high
  packages: [cpp-httplib]
  cwe: [CWE-113]
  match:
    kind: call
    callee:
      attribute: [Response, set_header]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: |
      #include <httplib.h>
      void example(const char *input) {
        Response::set_header("safe", input);
      }
  - name: literal arg 1 negative
    code: |
      void example() {
        Response::set_header("safe", "safe");
      }
    expect_no_match: true
  description: "cpp-httplib Response::set_header(name, tainted) - CRLF in value splits response."

  imports:
  - httplib.h
  - httplib
