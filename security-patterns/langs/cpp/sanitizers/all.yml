# C++ sanitizers / validators - reduce severity or suppress when in-path.
- id: cpp.sanitizer.isalnum_char_allowlist
  enabled: true
  language: cpp
  tag: char-allowlist
  match:
    kind: call
    callee:
      regex: "(^|::)isalnum$"
  match_examples:
  - name: alnum allowlist predicate
    code: |
      #include <cctype>
      void example(unsigned char input) {
        std::isalnum(input);
      }
    expect_match_text: [std::isalnum]
  description: "std::isalnum / isalnum - character allowlist predicate used to copy only alphanumeric bytes into a sanitized buffer."

- id: cpp.sanitizer.strncpy_bounded
  enabled: false
  disabled_reason:
    code: over-broad
  language: cpp
  tag: validation
  match:
    kind: call
    callee:
      name: strncpy
  match_examples:
  - name: generated direct match
    code: |
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        strncpy(arg);
      }
    expect_match_text: [strncpy]
  description: "Disabled - strncpy bounds the write count but does not guarantee NUL-termination when the source length reaches
    the bound; it is not a reliable sanitizer for buffer-overflow/string-safety taint."

- id: cpp.passthrough.strncpy_copy
  enabled: true
  language: cpp
  tag: passthrough-transform
  match:
    kind: call
    callee:
      name: strncpy
  taint_semantics:
    output_arg_flows:
    - output_arg_index: 0
      value_arg_indices: [1]
  match_examples:
  - name: source buffer copied into destination
    code: |
      void example(char *dst, const char *src, unsigned long n) {
        strncpy(dst, src, n);
      }
    expect_match_text: [strncpy]
  description: "strncpy(dst, src, n) - value-preserving copy from src to dst for downstream taint transfer; not sanitizer credit."

- id: cpp.passthrough.strcpy_copy
  enabled: true
  language: cpp
  tag: passthrough-transform
  match:
    kind: call
    callee:
      name: strcpy
  taint_semantics:
    output_arg_flows:
    - output_arg_index: 0
      value_arg_indices: [1]
  match_examples:
  - name: source string copied into destination
    code: |
      void example(char *dst, const char *src) {
        strcpy(dst, src);
      }
    expect_match_text: [strcpy]
  description: "strcpy(dst, src) - value-preserving copy from src to dst for downstream taint transfer; memory-safety findings remain owned by cpp.memory.strcpy."

- id: cpp.passthrough.stpcpy_copy
  enabled: true
  language: cpp
