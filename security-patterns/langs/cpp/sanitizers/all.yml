        memmove(dst, src, n);
      }
    expect_match_text: [memmove]
  description: "memmove(dst, src, n) - byte copy transfers source taint into dst; not sanitizer credit."

- id: cpp.passthrough.sscanf_outputs
  enabled: true
  language: cpp
  tag: passthrough-transform
  match:
    kind: call
    callee:
      name: sscanf
  taint_semantics:
    output_arg_flows:
    - output_arg_index: 2
      value_arg_indices: [0]
    - output_arg_index: 3
      value_arg_indices: [0]
    - output_arg_index: 4
      value_arg_indices: [0]
    - output_arg_index: 5
      value_arg_indices: [0]
  match_examples:
  - name: parsed fields inherit input-buffer taint
    code: |
      void example(const char *input) {
        char user[64];
        char host[64];
        sscanf(input, "%63s %63s", user, host);
      }
    expect_match_text: [sscanf]
  description: "sscanf(input, format, ...) - parsed output arguments derive from input; this is a taint transfer, not a new source."

