      }
    expect_match_text: [strncat]
  description: "strncat(dst, src, n) - bounded append still transfers source content into dst; not a sanitizer credit."

- id: cpp.passthrough.memcpy_copy
  enabled: true
  language: cpp
  tag: passthrough-transform
  match:
    kind: call
    callee:
      name: memcpy
  taint_semantics:
    output_arg_flows:
    - output_arg_index: 0
      value_arg_indices: [1]
  match_examples:
  - name: source buffer copied into destination
    code: |
      void example(void *dst, const void *src, unsigned long n) {
        memcpy(dst, src, n);
      }
    expect_match_text: [memcpy]
  description: "memcpy(dst, src, n) - byte copy transfers source taint into dst; length-risk findings remain owned by cpp.memory.memcpy."

