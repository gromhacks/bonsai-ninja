# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) - taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: cpp.passthrough.curl_easy_unescape
  enabled: true
  language: cpp
  tag: passthrough-decode
  match:
    kind: call
    callee:
      name: curl_easy_unescape
  taint_semantics:
    call_result_passthrough_args: [1]
  match_examples:
  - name: generated direct match
    code: |
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        curl_easy_unescape(arg);
      }
    expect_match_text: [curl_easy_unescape]
  description: "libcurl curl_easy_unescape - preserves taint (C++ via libcurl)."
- id: cpp.passthrough.std_string
  enabled: true
  language: cpp
  tag: passthrough-transform
  match:
    kind: call
    callee:
      attribute: [std, string]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: std::string ctor preserves taint
    code: |
      void example(char *input) {
        std::string s = std::string(input);
      }
    expect_match_text: ["std::string"]
  description: "std::string(x) explicit constructor - string construction preserves attacker content (WS3 coercion passthrough). The inline form already propagated via arg-walking; this rule makes the assignment-RHS form `std::string s = std::string(p)` flow too. Only propagates when arg0 is tainted, so std::string(\"literal\") adds nothing; the type-declaration usage `std::string s` is not a call and is unaffected."

# Lock-acquire sanitizers (T502). Tagged `lock-acquire` so
# reviewer enumerates guarded sections; the in-scope-cleanse
# semantics handle 'while lock is held, accesses are safe'.
- id: cpp.lock.std_lock_guard
  enabled: true
  language: cpp
  tag: lock-acquire
  match:
    kind: call
    callee:
      attribute: [std, lock_guard]
  match_examples:
  - name: generated direct match
    code: |
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        std::lock_guard(arg);
      }
    expect_match_text: ["std::lock_guard"]
  description: "std::lock_guard<std::mutex>(m) - RAII lock guard."
- id: cpp.lock.std_unique_lock
  enabled: true
  language: cpp
  tag: lock-acquire
  match:
    kind: call
    callee:
      attribute: [std, unique_lock]
  match_examples:
