- id: cpp.sanitizer.absl_strformat
  enabled: true
  language: cpp
  tag: format-string
  match:
    kind: call
    callee:
      attribute: [absl, StrFormat]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^"[^"]*"$'
  match_examples:
  - name: generated direct match
    code: |
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        absl::StrFormat("%s", arg);
      }
    expect_match_text: ["absl::StrFormat"]
  - name: nonliteral format negative constraint boundary
    code: |
      void example(const char *fmt, const char *arg) {
        absl::StrFormat(fmt, arg);
      }
    expect_no_match: true
  description: "absl::StrFormat with a literal format string - user data is bound as arguments rather than interpreted as
    format syntax."

- id: cpp.sanitizer.fmt_format_literal
  enabled: true
  language: cpp
  tag: format-string
  match:
    kind: call
    callee:
      attribute: [fmt, format]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^"[^"]*"$|^FMT_STRING\('
  match_examples:
  - name: generated direct match
    code: |
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        fmt::format("{}", arg);
      }
    expect_match_text: ["fmt::format"]
  - name: nonliteral format negative constraint boundary
    code: |
      void example(const char *fmt, const char *arg) {
        fmt::format(fmt, arg);
      }
    expect_no_match: true
  description: "fmt::format with a literal or FMT_STRING format - attacker data is passed as a value argument, not as format
    syntax."

