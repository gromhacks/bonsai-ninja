    expect_match_text: [stpcpy]
  description: "stpcpy(dst, src) - value-preserving copy from src to dst for taint transfer; not sanitizer credit."

- id: cpp.passthrough.strcat_copy
  enabled: true
  language: cpp
  tag: passthrough-transform
  match:
    kind: call
    callee:
      name: strcat
  taint_semantics:
    output_arg_flows:
    - output_arg_index: 0
      value_arg_indices: [1]
  match_examples:
  - name: appended source flows into destination
    code: |
      void example(char *dst, const char *src) {
        strcat(dst, src);
      }
    expect_match_text: [strcat]
  description: "strcat(dst, src) - appends source bytes into dst; downstream sinks should see dst as tainted when src is tainted."

- id: cpp.passthrough.strncat_copy
  enabled: true
