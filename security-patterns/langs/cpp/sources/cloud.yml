# C++ cloud / serverless sources.
- id: cpp.cloud.aws_lambda_request_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: cpp
  trust: service
  tag: cloud-event
  payload_types: [event, json]
  frameworks: [aws-lambda]
  packages: [aws-lambda-cpp]
  match:
    kind: param
    target:
      name: request
  description: "Disabled - bare `request` is too broad outside Lambda-only audits; use the more specific invocationRequest rule below when available."

- id: cpp.cloud.aws_lambda_invocation_request
  enabled: true
  language: cpp
  trust: service
  tag: cloud-event
  payload_types: [event, json]
  frameworks: [aws-lambda]
  packages: [aws-lambda-cpp]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      param_type_in: [invocation_request, aws::lambda_runtime::invocation_request]
  match_examples:
  - name: typed lambda invocation request
    code: |
      #include <aws/lambda-runtime/runtime.h>
      using namespace aws::lambda_runtime;
      invocation_response handler(const invocation_request& request) {
        return invocation_response::success(request.payload, "application/json");
      }
    expect_match_text: [request]
  - name: same name wrong type negative
    code: |
      #include <aws/lambda-runtime/runtime.h>
      void helper(const char *request) {
        (void)request;
      }
    expect_no_match: true
  imports: [aws/lambda-runtime/runtime.h]
  description: "AWS Lambda C++ runtime invocation_request parameter - invocation payload proven by its declared runtime type rather than the variable name."
