  match_examples:
  - name: generated direct match
    code: |
      void example() {
        char buf[4096];
        recvfrom(0, buf, sizeof(buf), 0, 0, 0);
      }
  description: "BSD socket recvfrom(fd, buf, len, flags, ...) — remote datagram bytes taint the caller buffer."
- id: cpp.archive.libzip_zip_get_name
  enabled: true
  language: cpp
  trust: remote
  tag: archive-input
  payload_types: [path]
  packages: [libzip]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: zip_get_name
  match_examples:
  - name: libzip archive entry name
    code: |
      #include <libzip.h>
      void example(zip_t *archive) {
        const char *name = zip_get_name(archive, 0, 0);
      }
    expect_match_text: [zip_get_name]
  description: "libzip zip_get_name(za, idx, flags) — archive-controlled entry name. Taint the returned name; Zip Slip is reported only when that value reaches a path open/write sink."
- id: cpp.archive.minizip_unzgetcurrentfileinfo_filename
  enabled: true
  language: cpp
  trust: remote
  tag: archive-input
  payload_types: [path]
  packages: [minizip]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: unzGetCurrentFileInfo
  taint_semantics:
    source_output_args: [2]
  match_examples:
  - name: minizip archive filename output
    code: |
      #include <minizip/unzip.h>
      void example(unzFile archive) {
        char filename[256];
        unzGetCurrentFileInfo(archive, 0, filename, sizeof(filename), 0, 0, 0, 0);
      }
    expect_match_text: [unzGetCurrentFileInfo]
  description: "minizip unzGetCurrentFileInfo(..., filename, filename_size, ...) — archive-controlled entry name is written to the filename output buffer. Zip Slip is reported only when that buffer reaches a path open/write sink."
