  payload_types: [binary, text, json]
  frameworks: [crow]
  packages: [crow]
  match:
    kind: read
    target:
      regex: '^[A-Za-z_][A-Za-z0-9_]*[.]body$'
      receiver_type_in: [request, "crow::request"]
  match_examples:
  - name: typed Crow request body read
    code: |
      #include <crow.h>
      void example(const crow::request& request) {
        auto payload = request.body;
      }
    expect_match_text: [request.body]
  - name: same property on a local type negative
    code: |
      #include <crow.h>
      struct LocalRequest { std::string body; };
      void example(const LocalRequest& request) {
        auto payload = request.body;
      }
    expect_no_match: true
  description: "Crow crow::request.body read - the exact typed request body supplied by the remote client."
