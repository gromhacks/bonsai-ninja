# Untrusted-size parameter source for the cpp.memory.malloc_tainted_size
# / calloc / realloc family. Names taken from common C++ network-parser
# conventions (size, len, length, count, n_bytes). Bare-name regex
# matches widely; engine taint flow + the malloc-family sinks scope
# real findings.
  imports:
  - QtCore
  - QtCore/Qt
- id: cpp.input.untrusted_size_param
  enabled: true
  language: cpp
  trust: remote
  tag: network-input
  payload_types: [binary]
  match:
    kind: param
    target:
      regex: "^(size|len|length|n|count|n_bytes|num_bytes|payload_len|msg_len|frame_len|total_len|hdr_len)$"
  match_examples:
  - name: generated direct match
    code: |
      void example(const char *size) {
        (void)size;
      }
  description: "Multi-arg size-style parameter (`size`, `len`, `length`, `count`, …) typically populated from a peer-controlled message header. Pairs with cpp.memory.malloc_tainted_size / calloc / realloc and the memcpy family for CWE-190/787 detection."
