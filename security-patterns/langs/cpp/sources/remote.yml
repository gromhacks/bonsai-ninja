# C++ remote / network input sources.
- id: cpp.input.recv
  enabled: true
  language: cpp
  trust: remote
  tag: network-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      name: recv
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: generated direct match
    code: |
      void example() {
        char buf[4096];
        recv(0, buf, sizeof(buf), 0);
      }
  description: "BSD socket recv(fd, buf, len, flags) - remote bytes taint the caller-supplied buffer argument."
- id: cpp.input.recvfrom
  enabled: true
