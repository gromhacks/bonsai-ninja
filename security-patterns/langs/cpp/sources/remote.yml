  - max_args: 1
  match_examples:
  - name: generated direct match
    code: |
      #include <crow.h> /* crow */
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        request::get_header_value(arg);
      }
  description: "Crow request::get_header_value(name) — caller-controlled HTTP header. Signature: `get_header_value(const std::string &name)` — exactly 1 arg; bounds reject same-name decoys."

