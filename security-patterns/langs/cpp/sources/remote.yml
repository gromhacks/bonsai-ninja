- id: cpp.input.crow_request_param
  enabled: true
  language: cpp
  trust: remote
  tag: http-input
  payload_types: [json, query, multipart]
  frameworks: [crow]
  packages: [crow]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      param_type_in: [request, "crow::request"]
  match_examples:
  - name: crow request parameter
    code: |
      #include <crow.h>
      void example(const crow::request& req) {
        (void)req;
      }
    expect_match_text: [req]
  - name: same name wrong type negative
    code: |
      #include <crow.h>
      void example(const char *req) {
        (void)req;
      }
    expect_no_match: true
  description: "Crow crow::request handler parameter - complete HTTP request matched from its declared compiler type."

- id: cpp.input.crow_request_body
