- id: cpp.input.params_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: cpp
  trust: remote
  tag: http-input
  match:
    kind: param
    target:
      name: params
  description: "Disabled — unscoped `params` parameter name matches every function with a param named `params` (render loops, math helpers, anything). The per-framework crow / drogon / pistache / cpphttplib rules below capture the real HTTP-handler shape with proper package scoping."
- id: cpp.input.crow_request_param
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: cpp
  trust: remote
  tag: http-input
  payload_types: [json, query, multipart]
  frameworks: [crow, drogon, cpphttplib]
  packages: [crow, drogon, cpp-httplib]
  match:
    kind: param
    target:
      name: req
  match_examples:
  - name: generated direct match
    code: |
      #include <crow.h> /* crow */
      void example(const char *req) {
        (void)req;
      }
  description: "Disabled — a bare `req` parameter name is not a security boundary without type/enclosing-handler evidence. Use precise request accessor rules such as multipart/file/query helpers until the C++ adapter can scope param rules to framework handler signatures."
