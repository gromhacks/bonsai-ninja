# A bare size-like parameter name cannot prove a remote trust boundary in an
# ordinary C++ library. Keep the retired rule as an explicit compatibility
# record; concrete network/framework sources still feed the allocation sinks.
  imports:
  - QtCore
  - QtCore/Qt
- id: cpp.source.userver_http_request_value
  enabled: true
  language: cpp
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query, path, header, text]
  packages: [userver]
  match:
    kind: call
    callee:
      regex: "^(?:.*\\.)?(GetArg|GetHeader|RequestBody)$"
  constraints:
  - receiver_type_in: [HttpRequest, "userver::server::http::HttpRequest"]
  match_examples:
  - name: userver request argument
    code: |
      #include <userver/server/http/http_request.hpp>
      std::string value(const userver::server::http::HttpRequest& request) { return request.GetArg("q"); }
    expect_match_text: [request.GetArg]
  - name: same method on unrelated receiver negative
    code: |
      #include <userver/server/http/http_request.hpp>
      struct Cache { std::string GetArg(const char*); };
      std::string value(Cache& cache) { return cache.GetArg("q"); }
    expect_no_match: true
  description: "userver HttpRequest GetArg/GetHeader/RequestBody accessors return client-controlled request data; receiver type prevents generic method collisions."

