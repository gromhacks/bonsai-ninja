- id: cpp.input.qt_qcoreapplication_arguments
  enabled: true
  language: cpp
  trust: local
  tag: local-input
  packages: [Qt]
  match:
    kind: call
    callee:
      attribute: [QCoreApplication, arguments]
  match_examples:
  - name: generated direct match
    code: |
      #include <QtCore/Qt>
      #include <QtCore/Qt>
      #include <QtCore/Qt> /* Qt */
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        QCoreApplication::arguments(arg);
      }
  description: "Qt QCoreApplication::arguments - CLI args."
