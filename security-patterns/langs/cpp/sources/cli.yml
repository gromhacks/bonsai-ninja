- id: cpp.input.getline
  enabled: true
  language: cpp
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      regex: "^getline$"
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: posix getline output line
    code: |
      void example(void *fp) {
        char *line = 0;
        unsigned long len = 0;
        getline(&line, &len, fp);
      }
    expect_match_text: [getline]
  description: "POSIX getline(lineptr, n, stream) - reads a line from stdin/file into the caller-supplied output pointer."
- id: cpp.input.fgets
  enabled: true
  language: cpp
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: fgets
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: fgets output buffer
    code: |
      void example(void *fp) {
        char buf[256];
        fgets(buf, sizeof(buf), fp);
      }
    expect_match_text: [fgets]
  description: "fgets(buf, n, stream) - reads a line from stdin/file into the destination buffer."
