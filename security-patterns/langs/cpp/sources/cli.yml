        char buf[256];
        fread(buf, 1, sizeof(buf), fp);
      }
    expect_match_text: [fread]
  description: "fread(ptr, size, nmemb, stream) - reads file/stdin bytes into the destination buffer."
- id: cpp.input.fscanf
  enabled: true
  language: cpp
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: fscanf
  taint_semantics:
    source_output_args: [2, 3, 4, 5]
  match_examples:
  - name: fscanf output buffers
    code: |
      void example(void *fp) {
        char user[64];
        char host[64];
        fscanf(fp, "%63s %63s", user, host);
      }
    expect_match_text: [fscanf]
  description: "fscanf(stream, format, ...) - reads formatted text from a FILE* into caller-supplied output arguments."
- id: cpp.input.read
  enabled: true
  language: cpp
  trust: local
  tag: local-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      regex: "^read$"
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: posix read output buffer
    code: |
      void example(int fd) {
        char buf[256];
        read(fd, buf, sizeof(buf));
      }
    expect_match_text: [read]
  - name: method read is not posix read
    code: |
      void example(std::istream &stream) {
        char buf[256];
        stream.read(buf, sizeof(buf));
      }
    expect_no_match: true
  description: "POSIX read(fd, buf, count) - reads descriptor bytes into the destination buffer. Anchored to the unqualified function so C++ stream/container .read() methods are not treated as this source."
- id: cpp.input.pread
  enabled: true
  language: cpp
  trust: local
  tag: local-input
  payload_types: [binary]
  match:
