- id: cpp.input.sscanf
  enabled: false
  disabled_reason:
    code: over-broad
  language: cpp
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: sscanf
  match_examples:
  - name: generated direct match
    code: |
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        sscanf(arg);
      }
  description: "Disabled - sscanf parses an in-memory buffer; taint comes from the buffer, not sscanf itself. cpp.passthrough.sscanf_outputs preserves real input-buffer-to-output flows."
- id: cpp.input.scanf
  enabled: true
  language: cpp
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: scanf
  taint_semantics:
    source_output_args: [1, 2, 3, 4]
  match_examples:
  - name: scanf stdin output args
    code: |
      void example() {
        char a[64];
        char b[64];
        char c[64];
        char d[64];
        scanf("%63s %63s %63s %63s", a, b, c, d);
      }
    expect_match_text: [scanf]
  description: "scanf - reads from stdin into the destination arguments; the parsed buffers carry user-supplied input."
