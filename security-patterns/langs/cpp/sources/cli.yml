# C++ local / CLI / stdin sources (trust: local).
- id: cpp.input.argv_param
  enabled: true
  language: cpp
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: param
    target:
      name: argv
      in_method: [main]
  match_examples:
  - name: main argv
    code: |
      int main(int argc, char **argv) {
        return argc;
      }
  - name: helper argv is not process argv
    code: |
      void helper(const char *argv) {
        (void)argv;
      }
    expect_no_match: true
  description: "main(int argc, char** argv) parameter."
- id: cpp.input.cin_read
  enabled: true
  language: cpp
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: read
    target:
      name: cin
  match_examples:
  - name: generated direct match
    code: |
      struct IO { int cin; } io;
      void example() {
        auto x = io.cin;
      }
  description: "std::cin stream reads."
- id: cpp.input.getenv
  enabled: true
  language: cpp
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: getenv
  match_examples:
  - name: generated direct match
    code: |
      void example() {
        const char *arg = "tainted";
        const char *fmt = arg;
        const char *query = arg;
        getenv(arg);
      }
  description: "libc getenv - environment is attacker-influenced in shared hosts."
