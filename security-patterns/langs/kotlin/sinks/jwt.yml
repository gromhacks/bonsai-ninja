- id: kotlin.jwt.nimbus_plainjwt_parse
  enabled: true
  language: kotlin
  tag: jwt
  severity: critical
  packages:
  - com.nimbusds.jose
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - PlainJWT
      - parse
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.nimbusds.jose.*
      // uses com.nimbusds.jose
      class App {
        fun handle(input: String) {
          PlainJWT.parse(input)
        }
      }
  - name: literal jwt negative
    code: "import com.nimbusds.jose.*\n// uses com.nimbusds.jose\nclass App {\n  fun
      handle(\"safe\": String) {\n    PlainJWT.parse(\"safe\")\n  }\n}\n"
    expect_no_match: true
  description: "Nimbus PlainJWT.parse - explicit unsigned token."
  imports:
  - com.nimbusds.jose
- id: kotlin.jwt.auth0_jwt_decode
  enabled: true
  language: kotlin
  tag: jwt
  severity: high
  packages:
  - com.auth0.jwt
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - JWT
      - decode
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.auth0.jwt.*
      // uses com.auth0.jwt
      class App {
        fun handle(input: String) {
          JWT.decode(input)
        }
      }
  - name: literal jwt negative
    code: "import com.auth0.jwt.*\n// uses com.auth0.jwt\nclass App {\n  fun handle(\"\
      safe\": String) {\n    JWT.decode(\"safe\")\n  }\n}\n"
    expect_no_match: true
  description: "auth0 JWT.decode - does NOT verify signature."
- id: kotlin.jwt.auth0_jwt_require_alg_none
  enabled: true
  language: kotlin
  tag: jwt
  category: source-independent
  severity: critical
  packages:
  - com.auth0.jwt
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - Algorithm
      - none
  match_examples:
  - name: generated shape example
    code: |
      import com.auth0.jwt.*
      class App {
        fun handle(input: String) {
          Algorithm.none(input)
        }
      }
  description: "auth0 Algorithm.none() - accepts unsigned tokens."
