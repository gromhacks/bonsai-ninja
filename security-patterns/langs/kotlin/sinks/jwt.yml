- id: kotlin.jwt.jjwt_parser_unsigned
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: kotlin
  tag: jwt
  severity: high
  packages:
  - io.jsonwebtoken
  cwe:
  - CWE-347
  - CWE-345
  match:
    kind: call
    callee:
      attribute:
      - Jwts
      - parser
  match_examples:
  - name: generated shape example
    code: |
      import io.jsonwebtoken.*
      // uses io.jsonwebtoken
      class App {
        fun handle(input: String) {
          Jwts.parser(input)
        }
      }
  description: "Disabled - requires a rulepack constraint that proves the unsafe JWT
    configuration, not just the broad API shape. jjwt Jwts.parser() without .setSigningKey()
    - unsigned decode. Merged aliases: kotlin.jwt.alg_confusion_jjwt."
  aliases:
  - kotlin.jwt.alg_confusion_jjwt
