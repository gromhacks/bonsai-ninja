- id: kotlin.jwt.nimbus_plainjwt_parse
  enabled: true
  language: kotlin
  tag: jwt
  severity: critical
  packages:
  - com.nimbusds.jose
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - PlainJWT
      - parse
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.nimbusds.jose.*
      // uses com.nimbusds.jose
      class App {
        fun handle(input: String) {
          PlainJWT.parse(input)
        }
      }
  - name: literal jwt negative
    code: "import com.nimbusds.jose.*\n// uses com.nimbusds.jose\nclass App {\n  fun
      handle(\"safe\": String) {\n    PlainJWT.parse(\"safe\")\n  }\n}\n"
    expect_no_match: true
  description: "Nimbus PlainJWT.parse - explicit unsigned token."
  imports:
  - com.nimbusds.jose
