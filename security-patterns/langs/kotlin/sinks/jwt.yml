- id: kotlin.jwt.jjwt_parser_unsigned
  enabled: true
  language: kotlin
  tag: jwt
  severity: high
  packages:
  - io.jsonwebtoken
  cwe:
  - CWE-347
  - CWE-345
  match:
    kind: call
    callee:
      attribute:
      - Jwts
      - parser
  match_examples:
  - name: generated shape example
    code: |
      import io.jsonwebtoken.*
      // uses io.jsonwebtoken
      class App {
        fun handle(input: String) {
          Jwts.parser(input)
        }
      }
  description: "jjwt Jwts.parser() without .setSigningKey() — unsigned decode. Merged aliases: kotlin.jwt.alg_confusion_jjwt."
  aliases:
  - kotlin.jwt.alg_confusion_jjwt
