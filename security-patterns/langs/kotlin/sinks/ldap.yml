- id: kotlin.ldap.search_controls
  enabled: true
  language: kotlin
  tag: ldap-injection
  severity: high
  packages: [javax.naming.directory]
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - DirContext
      - search
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import javax.naming.directory.*
      // uses javax.naming.directory
      class App {
        fun handle(input: String) {
          DirContext.search("(uid=" + input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import javax.naming.directory.*
      // uses javax.naming.directory
      class App {
      fun handle(input: String) {
        DirContext.search("safe")
      }
      }
    expect_no_match: true
  description: "JNDI DirContext.search - filter interpolation is LDAP injection; attackers bypass auth checks or enumerate directory entries."
