- id: kotlin.ssrf.url_openconnection_tainted_receiver
  enabled: true
  language: kotlin
  tag: ssrf
  severity: high
  packages: [java.net]
  cwe: [CWE-918]
  match:
    kind: call
    callee:
      attribute: [URL, openConnection]
  constraints:
  - receiver_tainted: true
  match_examples:
  - name: URL connection from tainted text
    code: |
      import java.net.URL
      fun fetch(value: String) = URL(value).openConnection()
    expect_match_text: [URL(value).openConnection]
  - name: URL connection from a literal
    code: |
      import java.net.URL
      fun fetch(value: String) = URL("https://example.test/status").openConnection()
    expect_no_match: true
  description: "URL.openConnection() on a receiver constructed from tainted URL text performs the outbound request."
- id: kotlin.ssrf.url_ctor
  enabled: true
  language: kotlin
  tag: ssrf
  severity: medium
  cwe:
  - CWE-918
  match:
    kind: new
    callee:
      name: URL
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    url_reconstruction_guard:
      sink_argument_index: 0
      parser: {attribute: [URI, create]}
      scheme:
        component: {field: scheme}
        comparison_predicate: {name: equals}
        allowed_values: [https]
      host_allowlist:
        component: {field: host}
        membership_predicate: {name: contains}
        static_collection_factories:
        - {name: setOf}
      path_component: {field: path}
      path_fallback: "/"
  match_examples:
  - name: generated shape example
    code: "class App {\n  fun handle(input: String) {\n    URL(input)\n  }\n}\nclass\
      \ URL(vararg args: Any?)\n"
  - name: arg tainted literal negative
    code: "class App {\nfun handle(input: String) {\n  URL(\"safe\")\n}\n}\nclass\
      \ URL(vararg args: Any?)\n"
    expect_no_match: true
  description: "new URL(tainted) - flag construction of URLs from user input."
