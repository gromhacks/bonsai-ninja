# Kotlin LLM sinks (OpenAI, Anthropic, Bedrock, LangChain4j).
- id: kotlin.llm.openai_chatcompletion
  enabled: true
  language: kotlin
  tag: web-llm
  severity: medium
  packages: [com.openai.api]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      attribute: [OpenAI, chatCompletion]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.openai.api.*
      class App {
        fun handle(input: String) {
          OpenAI.chatCompletion(input)
        }
      }
    expect_match_text: [OpenAI.chatCompletion]
  - name: arg tainted literal negative
    code: |
      import com.openai.api.*
      class App {
      fun handle(input: String) {
        OpenAI.chatCompletion("safe")
      }
      }
    expect_no_match: true
  description: "Kotlin OpenAI client chatCompletion - tainted prompt content reaches an LLM instruction and tool surface."

  imports:
  - com.openai.api
