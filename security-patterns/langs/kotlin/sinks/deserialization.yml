- id: kotlin.deser.object_input_stream_tainted_receiver
  enabled: true
  language: kotlin
  tag: insecure-deserialization
  severity: critical
  packages: [java.io]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [ObjectInputStream, readObject]
  constraints:
  - receiver_tainted: true
  match_examples:
  - name: object input stream from tainted bytes
    code: |
      import java.io.ByteArrayInputStream
      import java.io.ObjectInputStream
      fun restore(data: ByteArray): Any {
        val stream = ObjectInputStream(ByteArrayInputStream(data))
        return stream.readObject()
      }
    expect_match_text: [stream.readObject]
  - name: clean object input stream receiver
    code: |
      import java.io.ByteArrayInputStream
      import java.io.ObjectInputStream
      fun restore(data: ByteArray): Any {
        val stream = ObjectInputStream(ByteArrayInputStream(byteArrayOf()))
        return stream.readObject()
      }
    expect_no_match: true
  description: "ObjectInputStream.readObject() where the stream receiver was constructed from tainted bytes."

