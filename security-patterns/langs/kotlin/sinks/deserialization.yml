- id: kotlin.deser.jackson_enable_default_typing
  enabled: true
  language: kotlin
  tag: insecure-deserialization
  category: source-independent
  severity: critical
  packages: ["com.fasterxml.jackson.databind"]
  imports: [com.fasterxml.jackson.databind]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: enableDefaultTyping
      receiver_type_in: [ObjectMapper, com.fasterxml.jackson.databind.ObjectMapper]
  match_examples:
  - name: typed Jackson mapper enables legacy default typing
    code: |
      import com.fasterxml.jackson.databind.ObjectMapper
      class App {
        fun configure(mapper: ObjectMapper) { mapper.enableDefaultTyping() }
      }
    expect_match_text: [mapper.enableDefaultTyping]
  - name: unrelated mapper collision
    code: |
      class LocalMapper { fun enableDefaultTyping() {} }
      class App { fun configure(mapper: LocalMapper) { mapper.enableDefaultTyping() } }
    expect_no_match: true
  description: Jackson enableDefaultTyping - gadget-chain RCE.
