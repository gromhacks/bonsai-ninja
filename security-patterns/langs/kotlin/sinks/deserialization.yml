- id: kotlin.deser.kotlinx_polymorphic_decode
  enabled: true
  language: kotlin
  tag: insecure-deserialization
  severity: high
  packages: ["org.jetbrains.kotlinx:kotlinx-serialization-json"]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [PolymorphicSerializer, deserialize]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import org.jetbrains.kotlinx.kotlinxserializationjson.*
      // uses org.jetbrains.kotlinx:kotlinx-serialization-json
      class App {
        fun handle(input: String) {
          PolymorphicSerializer.deserialize(input)
        }
      }
  - name: literal polymorphic payload negative
    code: |
      import org.jetbrains.kotlinx.kotlinxserializationjson.*
      // uses org.jetbrains.kotlinx:kotlinx-serialization-json
      class App {
        fun handle() {
          PolymorphicSerializer.deserialize("""{"type":"Safe"}""")
        }
      }
    expect_no_match: true
  description: "kotlinx.serialization PolymorphicSerializer.deserialize — class discriminator is attacker-controlled; can instantiate any registered subclass."

  imports:
  - org
  - org.jetbrains.kotlinx.kotlinxserializationjson
