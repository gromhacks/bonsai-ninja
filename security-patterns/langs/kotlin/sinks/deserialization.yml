- id: kotlin.deser.jackson_enabledefaulttyping_with_as
  enabled: true
  language: kotlin
  tag: insecure-deserialization
  category: source-independent
  severity: critical
  packages: ["com.fasterxml.jackson.databind"]
  imports: [com.fasterxml.jackson.databind]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: enableDefaultTypingAsProperty
      receiver_type_in: [ObjectMapper, com.fasterxml.jackson.databind.ObjectMapper]
  match_examples:
  - name: typed Jackson mapper enables legacy property typing
    code: |
      import com.fasterxml.jackson.databind.ObjectMapper
      class App {
        fun configure(mapper: ObjectMapper) {
          mapper.enableDefaultTypingAsProperty(ObjectMapper.DefaultTyping.NON_FINAL, "@type")
        }
      }
    expect_match_text: [mapper.enableDefaultTypingAsProperty]
  - name: unrelated property typing method collision
    code: |
      class LocalMapper { fun enableDefaultTypingAsProperty(value: Any, name: String) {} }
      class App {
        fun configure(mapper: LocalMapper) {
          mapper.enableDefaultTypingAsProperty(Any(), "@type")
        }
      }
    expect_no_match: true
  description: "Jackson ObjectMapper.enableDefaultTypingAsProperty - same gadget-chain RCE surface as enableDefaultTyping."

