# Java XXE sinks (SAX / DOM / StAX / DocumentBuilder / Transformer / XPath / Schema).
- id: kotlin.xxe.saxparser_parse
  enabled: true
  language: kotlin
  tag: xxe
  severity: high
  packages: [javax.xml.parsers]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [SAXParser, parse]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import javax.xml.parsers.*
      // uses javax.xml.parsers
      class App {
        fun handle(input: String) {
          SAXParser.parse(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import javax.xml.parsers.*
      // uses javax.xml.parsers
      class App {
      fun handle(input: String) {
        SAXParser.parse("safe")
      }
      }
    expect_no_match: true
  description: "SAXParser.parse - disable external entities."

