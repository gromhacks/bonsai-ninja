- id: kotlin.xxe.documentbuilder_parse_local
  enabled: true
  language: kotlin
  tag: xxe
  severity: high
  packages: [javax.xml.parsers]
  imports: [javax.xml.parsers]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      regex: '\.parse$'
  constraints:
  - receiver_type_in: [DocumentBuilder]
  - arg_tainted:
      index: 0
  analysis_semantics:
    receiver_callback_configuration_guard: &document_builder_apply_hardening
      provider_factory:
        attribute: [DocumentBuilderFactory, newInstance]
      wrapper_call:
        name: apply
      callback_argument_index: 0
      sink_receiver_builder:
        name: newDocumentBuilder
      required_calls:
      - call: {name: setFeature}
        identity_argument_indices: [0]
        required_arguments:
        - index: 0
          accepted_static_values:
          - {kind: string, value: "http://apache.org/xml/features/disallow-doctype-decl"}
        - index: 1
          accepted_static_values: [{kind: boolean, value: true}]
      - call: {name: setFeature}
        identity_argument_indices: [0]
        required_arguments:
        - index: 0
          accepted_static_values:
          - {kind: string, value: "http://xml.org/sax/features/external-general-entities"}
        - index: 1
          accepted_static_values: [{kind: boolean, value: false}]
      - call: {name: setFeature}
        identity_argument_indices: [0]
        required_arguments:
        - index: 0
          accepted_static_values:
          - {kind: string, value: "http://xml.org/sax/features/external-parameter-entities"}
        - index: 1
          accepted_static_values: [{kind: boolean, value: false}]
  match_examples:
  - name: typed document builder parses tainted input
    code: |
      import javax.xml.parsers.DocumentBuilder
      fun parse(builder: DocumentBuilder, input: String) = builder.parse(input)
    expect_match_text: [builder.parse]
  - name: typed document builder parses a literal
    code: |
      import javax.xml.parsers.DocumentBuilder
      fun parse(builder: DocumentBuilder, input: String) = builder.parse("safe.xml")
    expect_no_match: true
  - name: local parser with same method is not XML
    code: |
      import javax.xml.parsers.DocumentBuilder
      class LocalParser { fun parse(input: String): Any = Any() }
      fun parse(parser: LocalParser, input: String) = parser.parse(input)
    expect_no_match: true
  description: "DocumentBuilder.parse on an exact typed receiver consumes tainted XML unless the factory lifecycle is hardened."

- id: kotlin.xxe.documentbuilder_factory_chain_parse
  enabled: true
  language: kotlin
  tag: xxe
  severity: high
  packages: [javax.xml.parsers]
  imports: [javax.xml.parsers]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.newDocumentBuilder\(\)\.parse$'
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    receiver_callback_configuration_guard: *document_builder_apply_hardening
  match_examples:
  - name: document-builder factory chain parses tainted input
    code: |
      import javax.xml.parsers.DocumentBuilderFactory
      fun parse(factory: DocumentBuilderFactory, input: String) =
        factory.newDocumentBuilder().parse(input)
    expect_match_text: [factory.newDocumentBuilder().parse]
  - name: document-builder factory chain parses a literal
    code: |
      import javax.xml.parsers.DocumentBuilderFactory
      fun parse(factory: DocumentBuilderFactory, input: String) =
        factory.newDocumentBuilder().parse("safe.xml")
    expect_no_match: true
  - name: local same-shaped builder chain is not javax XML
    code: |
      import javax.xml.parsers.DocumentBuilderFactory
      class LocalBuilder { fun parse(input: String): Any = Any() }
      class LocalFactory { fun newDocumentBuilder(): LocalBuilder = LocalBuilder() }
      fun parse(factory: LocalFactory, input: String) = factory.newDocumentBuilder().parse(input)
    expect_no_match: true
  description: "Exact DocumentBuilderFactory.newDocumentBuilder().parse(...) call chain; provider identity remains in rule data while the adapter emits generic call/type facts."

