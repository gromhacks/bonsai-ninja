- id: kotlin.nosql.mongo_find
  enabled: true
  language: kotlin
  tag: nosql-injection
  severity: high
  packages:
  - org.mongodb
  - org.springframework.ldap
  cwe:
  - CWE-943
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - MongoCollection
      - find
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import org.mongodb.*
      class App {
        fun handle(input: String) {
          MongoCollection.find(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import org.mongodb.*
      class App {
      fun handle(input: String) {
        MongoCollection.find("safe")
      }
      }
    expect_no_match: true
  description: "MongoCollection.find - flag tainted Bson filter. Merged collision aliases: kotlin.nosql.mongo_find_local_document, kotlin.ldap.spring_ldap_template_find."
  aliases:
  - kotlin.nosql.mongo_find_local_document
  - kotlin.ldap.spring_ldap_template_find
