- id: kotlin.nosql.bson_document_from_map
  enabled: true
  language: kotlin
  tag: nosql-injection
  severity: high
  packages:
  - org.mongodb
  cwe:
  - CWE-943
  match:
    kind: new
    callee:
      name: Document
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: bson document from caller map
    code: |
      import org.mongodb.*
      class App {
        fun handle(callerMap: Map<String, Any>): Any {
          return Document(callerMap)
        }
      }
      class Document(vararg args: Any?)
    expect_match_text:
    - Document
  - name: arg tainted literal negative
    code: |
      import org.mongodb.*
      class App {
      fun handle(callerMap: Map<String, Any>): Any {
        return Document("safe")
      }
      }
      class Document(vararg args: Any?)
    expect_no_match: true
  description: "Document(callerMap) - MongoDB selector built from a caller-controlled map can carry operators such as $ne or $where."
- id: kotlin.nosql.basicdbobject_operator_ctor
  enabled: true
  language: kotlin
  tag: nosql-injection
  severity: high
  packages:
  - org.mongodb
  cwe:
  - CWE-943
  match:
    kind: new
    callee:
      name: BasicDBObject
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: basic db object operator constructor
    code: |
      import org.mongodb.*
      class App {
        fun handle(operator: String, value: Any): Any {
          return BasicDBObject(operator, value)
        }
      }
      class BasicDBObject(vararg args: Any?)
    expect_match_text:
    - BasicDBObject
  - name: arg tainted literal negative
    code: |
      import org.mongodb.*
      class App {
      fun handle(value: Any): Any {
        return BasicDBObject("safe", value)
      }
      }
      class BasicDBObject(vararg args: Any?)
    expect_no_match: true
  description: "BasicDBObject(\"$ne\", value) and related operator keys - caller-controlled operator objects can bypass intended equality checks."
- id: kotlin.nosql.spring_mongo_template_criteria_is
  enabled: true
  language: kotlin
  tag: nosql-injection
  severity: high
  packages:
  - org.springframework.data.mongodb
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      attribute:
      - Criteria
      - is
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: spring criteria operator object
    code: |
      import org.springframework.data.mongodb.*
      class App {
        fun handle(operatorObject: Any): Any? {
          return Criteria.is(operatorObject)
        }
      }
    expect_match_text:
    - Criteria.is
  - name: arg tainted literal negative
    code: |
      import org.springframework.data.mongodb.*
      class App {
      fun handle(operatorObject: Any): Any? {
        return Criteria.is("safe")
      }
      }
    expect_no_match: true
  description: "Spring Data Mongo Criteria.is(operator object) - caller-controlled criteria value can inject Mongo operators when maps/documents are passed through."
  imports:
  - org.springframework.data.mongodb
