- id: kotlin.open_redirect.send_redirect
  enabled: true
  language: kotlin
  tag: open-redirect
  severity: high
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - HttpServletResponse
      - sendRedirect
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "class App {\n  fun handle(input: String) {\n    HttpServletResponse.sendRedirect(input)\n  }\n}\n"
  - name: arg tainted literal negative
    code: |
      class App {
      fun handle(input: String) {
        HttpServletResponse.sendRedirect("safe")
      }
      }
    expect_no_match: true
  description: HttpServletResponse.sendRedirect(tainted).
