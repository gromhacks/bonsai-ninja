- id: kotlin.log_injection.mdc_put
  enabled: true
  language: kotlin
  tag: log-injection
  severity: medium
  packages:
  - slf4j
  - log4j
  cwe:
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - MDC
      - put
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: mdc put request header
    code: |
      import slf4j.*
      class App {
        fun handle(header: String) {
          MDC.put("x-request-id", header)
        }
      }
    expect_match_text:
    - MDC.put
  - name: arg tainted literal negative
    code: |
      import slf4j.*
      class App {
      fun handle(header: String) {
        MDC.put("x-request-id", "safe")
      }
      }
    expect_no_match: true
  description: "MDC.put(key, tainted header) - attacker-controlled logging context value can forge structured logs or poison downstream log correlation."
