- id: kotlin.log_injection.slf4j_info_format
  enabled: true
  language: kotlin
  tag: header-injection
  severity: medium
  packages:
  - slf4j
  cwe:
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - Logger
      - info
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import slf4j.*
      class App {
        fun handle(input: String) {
          Logger.info("\\n" + input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import slf4j.*
      class App {
      fun handle(input: String) {
        Logger.info("safe")
      }
      }
    expect_no_match: true
  description: "Logger.info(\"...$user...\\n\") - newline in interpolated user text forges log entries. Merged aliases: kotlin.log_injection.logger_info_concat."
  aliases:
  - kotlin.log_injection.logger_info_concat
