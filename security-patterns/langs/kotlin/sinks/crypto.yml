- id: kotlin.crypto.kotlin_random_nextbytes
  enabled: true
  language: kotlin
  tag: weak-randomness
  category: source-independent
  severity: medium
  packages:
  - kotlin.random
  cwe:
  - CWE-330
  - CWE-338
  match:
    kind: call
    callee:
      attribute:
      - Random
      - nextBytes
  match_examples:
  - name: generated shape example
    code: |
      import kotlin.random.*
      class App {
        fun handle(input: String) {
          Random.nextBytes(input)
        }
      }
  description: "kotlin.random.Random.nextBytes — not cryptographically secure; use java.security.SecureRandom for keys/tokens/IVs."

