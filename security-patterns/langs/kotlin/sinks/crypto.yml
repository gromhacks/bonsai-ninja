- id: kotlin.crypto.bouncycastle_des
  enabled: true
  language: kotlin
  tag: weak-crypto
  category: source-independent
  severity: high
  packages:
  - bcprov
  cwe:
  - CWE-327
  match:
    kind: new
    callee:
      name: DESEngine
  match_examples:
  - name: generated shape example
    code: |
      import bcprov.DESEngine
      class App {
        fun handle(input: String) {
          DESEngine(input)
        }
      }
      // Shadow declaration so the Kotlin adapter tags `DESEngine(...)`
      // as a constructor call (Kotlin has no `new` keyword) and the
      // `kind: new` rule fires; the import binding above is what
      // satisfies the package gate at match time.
      class DESEngine(vararg args: Any?)
  description: BouncyCastle DESEngine.
- id: kotlin.crypto.keyfactory_dh_512
