- id: kotlin.crypto.md5_digest
  enabled: true
  language: kotlin
  tag: weak-crypto
  category: source-independent
  severity: low
  cwe:
  - CWE-327
  - CWE-328
  match:
    kind: call
    callee:
      attribute:
      - MessageDigest
      - getInstance
  constraints:
  - arg_matches_regex:
      index: 0
      regex: (?i)\b(MD5|SHA-?1)\b
  match_examples:
  - name: generated shape example
    code: "class App {\n  fun handle(input: String) {\n    MessageDigest.getInstance(\"MD5\")\n  }\n}\n"
  - name: safe digest negative
    code: |
      class App {
        fun handle() {
          MessageDigest.getInstance("SHA-256")
        }
      }
    expect_no_match: true
  description: 'MessageDigest.getInstance("MD5"). Merged aliases: kotlin.crypto.sha1_digest.'
  aliases:
  - kotlin.crypto.sha1_digest
- id: kotlin.crypto.cipher_des
  enabled: true
  language: kotlin
  tag: weak-crypto
  category: source-independent
  severity: high
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      attribute:
      - Cipher
      - getInstance
  constraints:
  - arg_matches_regex:
      index: 0
      regex: (?i)(\b(DES|DESede|3DES|RC4|ARCFOUR|Blowfish)\b|/ECB/)
  match_examples:
  - name: generated shape example
    code: "class App {\n  fun handle(input: String) {\n    Cipher.getInstance(\"DES\")\n  }\n}\n"
  - name: safe aead cipher negative
    code: |
      class App {
        fun handle() {
          Cipher.getInstance("AES/GCM/NoPadding")
        }
      }
    expect_no_match: true
  description: 'Cipher.getInstance("DES"). Merged aliases: kotlin.crypto.cipher_des_cbc, kotlin.crypto.cipher_3des, kotlin.crypto.cipher_rc4, kotlin.crypto.cipher_aes_ecb, kotlin.crypto.cipher_blowfish.'
  aliases:
  - kotlin.crypto.cipher_des_cbc
  - kotlin.crypto.cipher_3des
  - kotlin.crypto.cipher_rc4
  - kotlin.crypto.cipher_aes_ecb
  - kotlin.crypto.cipher_blowfish
- id: kotlin.crypto.random_ctor
  enabled: true
  language: kotlin
  tag: weak-randomness
  category: source-independent
  severity: medium
  cwe:
  - CWE-330
  - CWE-338
  match:
    kind: new
    callee:
      name: Random
  match_examples:
  - name: generated shape example
    code: "class App {\n  fun handle(input: String) {\n    Random(input)\n  }\n}\nclass Random(vararg args: Any?)\n"
  description: "new java.util.Random — non-cryptographic."
- id: kotlin.crypto.math_random
  enabled: true
  language: kotlin
  tag: weak-randomness
  category: source-independent
  severity: medium
  cwe:
  - CWE-330
  match:
    kind: call
    callee:
      attribute:
      - Math
      - random
  match_examples:
  - name: generated shape example
    code: "class App {\n  fun handle(input: String) {\n    Math.random(input)\n  }\n}\n"
