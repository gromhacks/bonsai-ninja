# Java eval / dynamic-code sinks (javax.script + reflection + JEXL/MVEL/Groovy/SpEL).
- id: kotlin.eval.scriptengine_eval
  enabled: true
  language: kotlin
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [ScriptEngine, eval]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      class App {
        fun handle(input: String) {
          ScriptEngine.eval(input)
        }
      }
  - name: arg tainted literal negative
    code: "class App {\n  fun handle(input: String) {\n    ScriptEngine.eval(\"safe\")\n  }\n}\n"
    expect_no_match: true
  description: "javax.script ScriptEngine.eval — Nashorn / Rhino RCE."

- id: kotlin.eval.compiledscript_eval
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: kotlin
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [CompiledScript, eval]
  match_examples:
  - name: generated shape example
    code: |
      class App {
        fun handle(input: String) {
          CompiledScript.eval(input)
        }
      }
  description: "Disabled — CompiledScript.eval() executes code compiled earlier; needs receiver state from a tainted compile step, not an eval argument."

- id: kotlin.eval.method_invoke
  enabled: false
