- id: kotlin.tls.set_default_hostname_verifier_allow
  enabled: true
  language: kotlin
  tag: weak-tls
  severity: critical
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      attribute:
      - HttpsURLConnection
      - setDefaultHostnameVerifier
  match_examples:
  - name: generated shape example
    code: |
      import javax.net.ssl.*
      class App {
        fun handle(input: String) {
          HttpsURLConnection.setDefaultHostnameVerifier(input)
        }
      }
  description: "HttpsURLConnection.setDefaultHostnameVerifier((h,s) -> true) — global bypass. Merged aliases: kotlin.tls.disable_verify_hostname_verifier."
  aliases:
  - kotlin.tls.disable_verify_hostname_verifier
  packages:
  - javax.net.ssl
