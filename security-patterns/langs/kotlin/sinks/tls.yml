- id: kotlin.tls.set_default_hostname_verifier_allow
  enabled: true
  language: kotlin
  tag: weak-tls
  category: source-independent
  severity: critical
  cwe:
  - CWE-295
  imports: [javax.net.ssl.HttpsURLConnection]
  match:
    kind: call
    callee:
      attribute:
      - HttpsURLConnection
      - setDefaultHostnameVerifier
      binding_origin: imported
  constraints:
  - arg_inline_callback_returns_static:
      index: 0
      value: {kind: boolean, value: true}
  match_examples:
  - name: imported inline hostname verifier always accepts
    code: |
      import javax.net.ssl.HttpsURLConnection
      class App {
        fun configure() {
          HttpsURLConnection.setDefaultHostnameVerifier { host, session -> true }
        }
      }
    expect_match_text: [HttpsURLConnection.setDefaultHostnameVerifier]
  - name: rejecting hostname verifier
    code: |
      import javax.net.ssl.HttpsURLConnection
      class App {
        fun configure() {
          HttpsURLConnection.setDefaultHostnameVerifier { host, session -> false }
        }
      }
    expect_no_match: true
  - name: conditional hostname verifier
    code: |
      import javax.net.ssl.HttpsURLConnection
      class App {
        fun configure(allow: Boolean) {
          HttpsURLConnection.setDefaultHostnameVerifier { host, session -> if (allow) true else false }
        }
      }
    expect_no_match: true
  - name: named hostname verifier remains unproven
    code: |
      import javax.net.ssl.HttpsURLConnection
      class App {
        fun verify(host: String, session: Any): Boolean = true
        fun configure() { HttpsURLConnection.setDefaultHostnameVerifier(::verify) }
      }
    expect_no_match: true
  - name: local connection type collision
    code: |
      import javax.net.ssl.HttpsURLConnection
      object HttpsURLConnection {
        fun setDefaultHostnameVerifier(value: (Any) -> Boolean) {}
      }
      class App {
        fun configure() { HttpsURLConnection.setDefaultHostnameVerifier { value -> true } }
      }
    expect_no_match: true
  description: "HttpsURLConnection.setDefaultHostnameVerifier((h,s) -> true) - global bypass. Merged aliases: kotlin.tls.disable_verify_hostname_verifier."
  aliases:
  - kotlin.tls.disable_verify_hostname_verifier
  packages:
  - javax.net.ssl
