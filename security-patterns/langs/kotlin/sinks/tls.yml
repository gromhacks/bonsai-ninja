- id: kotlin.tls.apache_httpclient_trustself
  enabled: true
  language: kotlin
  tag: weak-tls
  category: source-independent
  severity: high
  packages:
  - org.apache.http
  imports: [org.apache.http.ssl.SSLContextBuilder, org.apache.http.ssl.TrustSelfSignedStrategy]
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      name: loadTrustMaterial
      receiver_type_in: [org.apache.http.ssl.SSLContextBuilder]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^(?:TrustSelfSignedStrategy\.)?INSTANCE$'
  match_examples:
  - name: imported self-signed trust strategy
    code: |
      import org.apache.http.ssl.SSLContextBuilder
      import org.apache.http.ssl.TrustSelfSignedStrategy
      class App {
        fun configure(builder: SSLContextBuilder) {
          builder.loadTrustMaterial(TrustSelfSignedStrategy.INSTANCE)
        }
      }
    expect_match_text: [builder.loadTrustMaterial]
  - name: ordinary trust material strategy
    code: |
      import org.apache.http.ssl.SSLContextBuilder
      class App {
        fun configure(builder: SSLContextBuilder, strategy: Any) {
          builder.loadTrustMaterial(strategy)
        }
      }
    expect_no_match: true
  - name: local builder with the same method is not Apache HttpClient
    code: |
      import org.apache.http.ssl.TrustSelfSignedStrategy
      class SSLContextBuilder {
        fun loadTrustMaterial(strategy: Any) {}
      }
      class App {
        fun configure(builder: SSLContextBuilder) {
          builder.loadTrustMaterial(TrustSelfSignedStrategy.INSTANCE)
        }
      }
    expect_no_match: true
  description: Apache HttpClient loadTrustMaterial(TrustSelfSignedStrategy).
- id: kotlin.tls.sslcontext_getinstance_ssl
  enabled: true
  language: kotlin
  tag: weak-tls
  category: source-independent
  severity: high
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      attribute:
      - SSLContext
      - getInstance
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)^"(?:SSL|SSLv2|SSLv3|TLSv1|TLSv1\.1)"$'
  match_examples:
  - name: obsolete SSL protocol literal
    code: |
      import javax.net.ssl.SSLContext
      class App { fun configure() { SSLContext.getInstance("SSL") } }
    expect_match_text: [SSLContext.getInstance]
  - name: modern TLS protocol literal
    code: |
      import javax.net.ssl.SSLContext
      class App { fun configure() { SSLContext.getInstance("TLSv1.3") } }
    expect_no_match: true
  description: "SSLContext.getInstance(\"SSL\") - legacy SSLv3 context, vulnerable to POODLE; use \"TLSv1.2\" or \"TLSv1.3\". Merged aliases: kotlin.tls.sslcontext_getinstance_ssl_v3."
  aliases:
  - kotlin.tls.sslcontext_getinstance_ssl_v3
