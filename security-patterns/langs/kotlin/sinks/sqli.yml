- id: kotlin.sqli.connection_createstatement_execute
  enabled: true
  language: kotlin
  tag: sql-injection
  severity: critical
  packages:
  - java.sql
  imports:
  - java.sql
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.createStatement\\(\\)\\.(execute|executeQuery|executeUpdate)$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: chained create statement execute query
    code: |
      import java.sql.Connection
      class App(private val conn: Connection) {
        fun handle(input: String) {
          conn.createStatement().executeQuery("SELECT * FROM users WHERE id = '$input'")
        }
      }
    expect_match_text: [conn.createStatement().executeQuery]
  - name: chained create statement execute query literal negative
    code: |
      import java.sql.Connection
      class App(private val conn: Connection) {
        fun handle() {
          conn.createStatement().executeQuery("SELECT * FROM users")
        }
      }
    expect_no_match: true
  description: "Connection.createStatement().execute*(tainted SQL) — chained JDBC Statement execution without a prepared statement."
