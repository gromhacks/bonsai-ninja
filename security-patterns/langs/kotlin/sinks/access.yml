- id: kotlin.access.initialcontext_lookup
  enabled: true
  language: kotlin
  tag: jndi-injection
  severity: critical
  packages: ["javax.naming", "jakarta.naming"]
  cwe: [CWE-917, CWE-502]
  match:
    kind: call
    callee:
      attribute: [InitialContext, lookup]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: initial context lookup
    code: |
      import javax.naming.*
      // uses javax.naming
      class App {
        fun handle(name: String) {
          InitialContext.lookup(name)
        }
      }
  - name: arg tainted literal negative
    code: |
      import javax.naming.*
      // uses javax.naming
      class App {
      fun handle(name: String) {
        InitialContext.lookup("safe")
      }
      }
    expect_no_match: true
  description: "javax.naming.InitialContext.lookup(tainted) - remote JNDI lookup can trigger class loading or deserialization."
