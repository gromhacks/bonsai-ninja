- id: kotlin.template.freemarker_autoesc_off
  enabled: true
  language: kotlin
  tag: ssti
  category: source-independent
  severity: high
  packages:
  - freemarker
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - Configuration
      - setAutoEscapingPolicy
  constraints:
  - arg_matches_regex:
      index: 0
      regex: 'DISABLE_AUTO_ESCAPING_POLICY'
  match_examples:
  - name: generated shape example
    code: "import freemarker.*\nclass App {\n  fun handle(input: String) {\n    Configuration.setAutoEscapingPolicy(DISABLE_AUTO_ESCAPING_POLICY)\n\
      \  }\n}\n"
  - name: enable auto escaping negative
    code: |
      import freemarker.*
      class App {
        fun handle() {
          Configuration.setAutoEscapingPolicy(ENABLE_AUTO_ESCAPING_POLICY)
        }
      }
    expect_no_match: true
  description: "FreeMarker (via Java interop) Configuration.setAutoEscapingPolicy(DISABLE_AUTO_ESCAPING_POLICY) - autoescape disabled at config."
