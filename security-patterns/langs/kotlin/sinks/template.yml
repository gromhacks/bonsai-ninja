- id: kotlin.template.thymeleaf_processstring
  enabled: true
  language: kotlin
  tag: ssti
  severity: high
  packages:
  - org.thymeleaf
  - freemarker
  cwe:
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - TemplateEngine
      - process
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "import org.thymeleaf.*\n// uses org.thymeleaf\nclass App {\n  fun handle(input:\
      \ String) {\n    TemplateEngine.process(\"{{\" + input)\n  }\n}\n"
  - name: thymeleaf fragment expression concat
    code: "import org.thymeleaf.*\n// uses org.thymeleaf\nclass App {\n  fun handle(fragment:\
      \ String, ctx: Any): Any? {\n    return TemplateEngine.process(\"layout :: \"\
      \ + fragment, ctx)\n  }\n}\n"
    expect_match_text:
    - TemplateEngine.process
  - name: arg tainted literal negative
    code: "import org.thymeleaf.*\n// uses org.thymeleaf\nclass App {\nfun handle(input:\
      \ String) {\n  TemplateEngine.process(\"safe\")\n}\n}\n"
    expect_no_match: true
  description: 'Thymeleaf TemplateEngine.process with tainted template. Merged collision
    aliases: kotlin.template.freemarker_process, kotlin.template.freemarker_template_process_local.'
  aliases:
  - kotlin.template.freemarker_process
  - kotlin.template.freemarker_template_process_local
