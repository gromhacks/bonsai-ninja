- id: kotlin.template.freemarker_template_ctor
  enabled: true
  language: kotlin
  tag: ssti
  severity: critical
  packages:
  - freemarker
  cwe:
  - CWE-94
  - CWE-1336
  match:
    kind: new
    callee:
      name: Template
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated shape example
    code: "import freemarker.*\nclass App {\n  fun handle(template: String, cfg: Any)\
      \ {\n    Template(\"name\", template, cfg)\n  }\n}\nclass Template(vararg args:\
      \ Any?)\n"
  - name: arg tainted literal negative
    code: "import freemarker.*\nclass App {\n  fun handle(template: String, cfg: Any)\
      \ {\n    Template(\"name\", \"safe\", cfg)\n  }\n}\nclass Template(vararg args:\
      \ Any?)\n"
    expect_no_match: true
  description: "new freemarker.template.Template(\"name\", tainted) - source\
    \ string is template."
