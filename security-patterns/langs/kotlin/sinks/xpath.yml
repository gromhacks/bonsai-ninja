- id: kotlin.xpath.xpath_evaluate
  enabled: true
  language: kotlin
  tag: xpath-injection
  severity: high
  packages: ["javax.xml.xpath"]
  imports: ["javax.xml.xpath"]
  cwe: [CWE-643]
  match:
    kind: call
    callee:
      attribute: [XPath, evaluate]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: typed xpath evaluate receiver
    code: |
      import javax.xml.xpath.XPath
      import javax.xml.xpath.XPathFactory
      fun handle(name: String, xpath: XPath, doc: Any) {
        val expr = "//user[name=\"" + name + "\"]"
        xpath.evaluate(expr, doc)
      }
    expect_match_text: [xpath.evaluate]
  - name: literal expression negative
    code: |
      import javax.xml.xpath.XPath
      import javax.xml.xpath.XPathFactory
      fun handle(xpath: XPath) {
        xpath.evaluate("//safe", "")
      }
    expect_no_match: true
  description: "XPath.evaluate(expr, doc) - XPath injection through javax.xml.xpath in Kotlin code."

- id: kotlin.xpath.xpath_compile
  enabled: true
  language: kotlin
  tag: xpath-injection
  severity: high
  packages: ["javax.xml.xpath"]
  imports: ["javax.xml.xpath"]
  cwe: [CWE-643]
  match:
    kind: call
    callee:
      attribute: [XPath, compile]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: typed xpath compile receiver
    code: |
      import javax.xml.xpath.XPath
      import javax.xml.xpath.XPathFactory
      fun handle(name: String, xpath: XPath) {
        xpath.compile("//user[name=\"" + name + "\"]")
      }
    expect_match_text: [xpath.compile]
  - name: literal expression negative
    code: |
      import javax.xml.xpath.XPath
      import javax.xml.xpath.XPathFactory
      fun handle(xpath: XPath) {
        xpath.compile("//safe")
      }
    expect_no_match: true
  description: "XPath.compile(expr) - compiled XPath expressions built by concatenating attacker input are injectable before later evaluation."
