- id: kotlin.queue.aws_sqs_send_message
  enabled: true
  language: kotlin
  tag: queue-injection
  severity: high
  packages: ["software.amazon.awssdk:sqs"]
  cwe: [CWE-20]
  match:
    kind: call
    callee:
      regex: "^SqsClient\\.sendMessage$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import software.amazon.awssdk.sqs.*
      class App {
        fun handle(input: String) {
          SqsClient.sendMessage(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import software.amazon.awssdk.sqs.*
      class App {
      fun handle(input: String) {
        SqsClient.sendMessage("safe")
      }
      }
    expect_no_match: true
  description: "SqsClient.sendMessage - tainted queue target/body injects arbitrary SQS messages."

  imports:
  - software.amazon.awssdk.sqs
  - software
