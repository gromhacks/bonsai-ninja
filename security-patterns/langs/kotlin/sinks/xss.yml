- id: kotlin.xss.printwriter_write
  enabled: true
  language: kotlin
  tag: xss
  severity: high
  packages: [java.io]
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - PrintWriter
      - write
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import java.io.*
      // uses java.io
      class App {
        fun handle(input: String) {
          PrintWriter.write(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import java.io.*
      // uses java.io
      class App {
      fun handle(input: String) {
        PrintWriter.write("safe")
      }
      }
    expect_no_match: true
  description: PrintWriter.write.
