- id: kotlin.header.servlet_response_setheader
  enabled: true
  language: kotlin
  tag: header-injection
  severity: high
  packages:
  - javax.servlet
  - jakarta.servlet
  cwe:
  - CWE-113
  - CWE-601
  - CWE-444
  match:
    kind: call
    callee:
      attribute:
      - HttpServletResponse
      - setHeader
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated shape example
    code: |
      import javax.servlet.*
      class App {
        fun handle(value: String) {
          HttpServletResponse.setHeader("X-Name", value)
        }
      }
  - name: arg tainted literal negative
    code: |
      import javax.servlet.*
      class App {
        fun handle(value: String) {
          HttpServletResponse.setHeader("X-Name", "safe")
        }
      }
    expect_no_match: true
  description: 'HttpServletResponse.setHeader. Merged aliases: kotlin.header.servlet_response_content_disposition, kotlin.open_redirect.servlet_response_setheader_location.'
  aliases:
  - kotlin.header.servlet_response_content_disposition
  - kotlin.open_redirect.servlet_response_setheader_location
  - kotlin.smuggle.set_dual_cl_te_headers
