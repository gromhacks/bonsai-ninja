- id: kotlin.cmdi.runtime_exec_array
  enabled: false
  disabled_reason:
    code: over-broad
  language: kotlin
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: exec
  description: "Disabled — bare `exec` name is ubiquitous (`.exec()` extension, matchers, etc.); use attribute-qualified kotlin.cmdi.runtime_exec_string instead."
