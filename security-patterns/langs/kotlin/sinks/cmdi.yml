- id: kotlin.cmdi.runtime_exec
  enabled: true
  language: kotlin
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^Runtime\\.getRuntime(?:\\(\\))?\\.exec$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      class App {
        fun handle(input: String) {
          Runtime.getRuntime.exec(input)
        }
      }
  - name: runtime getRuntime call shape
    code: |
      class App {
        fun handle(input: String) {
          Runtime.getRuntime().exec(input)
        }
      }
  - name: literal runtime exec negative
    code: |
      class App {
        fun handle() {
          Runtime.getRuntime().exec("whoami")
        }
      }
    expect_no_match: true
  description: Runtime.getRuntime().exec.
- id: kotlin.cmdi.processbuilder_ctor
  enabled: true
  language: kotlin
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: new
    callee:
      name: ProcessBuilder
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      class App {
        fun handle(input: String) {
          ProcessBuilder(input)
        }
      }
      class ProcessBuilder(vararg args: Any?)
  - name: arg tainted literal negative
    code: |
      class App {
      fun handle(input: String) {
        ProcessBuilder("safe")
      }
      }
      class ProcessBuilder(vararg args: Any?)
    expect_no_match: true
  description: "ProcessBuilder(tainted) — untrusted command elements control child process execution."
- id: kotlin.cmdi.processbuilder_start
  enabled: true
  language: kotlin
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [ProcessBuilder, start]
  constraints:
  - receiver_tainted: true
  match_examples:
  - name: processbuilder command then start
    code: |
      class App {
        fun handle(input: String) {
          val pb = ProcessBuilder()
          pb.command(input)
          pb.start()
        }
      }
    expect_match_text: [pb.start]
  - name: clean processbuilder start negative
    code: |
      class App {
        fun handle() {
          val pb = ProcessBuilder()
          pb.command("/bin/echo")
          pb.start()
        }
      }
    expect_no_match: true
  description: "ProcessBuilder.start() after a tainted command list reaches process execution."
