- id: kotlin.cmdi.runtime_exec
  enabled: true
  language: kotlin
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^(?:java\\.lang\\.)?Runtime\\.getRuntime(?:\\(\\))?\\.exec$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      class App {
        fun handle(input: String) {
          Runtime.getRuntime.exec(input)
        }
      }
  - name: runtime getRuntime call shape
    code: |
      class App {
        fun handle(input: String) {
          Runtime.getRuntime().exec(input)
        }
      }
  - name: fully-qualified no-import shape
    code: |
      class App {
        fun handle(input: String) {
          java.lang.Runtime.getRuntime().exec(input)
        }
      }
  - name: literal runtime exec negative
    code: |
      class App {
        fun handle() {
          Runtime.getRuntime().exec("whoami")
        }
      }
    expect_no_match: true
  description: Runtime.getRuntime().exec.
- id: kotlin.cmdi.processbuilder_ctor
  enabled: true
  language: kotlin
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: ProcessBuilder
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    configured_argument_factory_guard:
      sink_argument_index: 0
      factory:
        name: listOf
      required_arguments:
      - index: 0
        require_static_value: true
  match_examples:
  - name: generated shape example
    code: |
      class App {
        fun handle(input: String) {
          ProcessBuilder(input)
        }
      }
      class ProcessBuilder(vararg args: Any?)
  - name: arg tainted literal negative
    code: |
      class App {
      fun handle(input: String) {
        ProcessBuilder("safe")
      }
      }
      class ProcessBuilder(vararg args: Any?)
    expect_no_match: true
  description: "ProcessBuilder(tainted) - untrusted command elements control child process execution."
- id: kotlin.cmdi.processbuilder_shell_command
  enabled: true
  language: kotlin
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: ProcessBuilder
  constraints:
  - arg_matches_regex: {index: 0, regex: '^"(?:/bin/)?sh"$'}
  - arg_equals: {index: 1, value: '"-c"'}
  - arg_tainted: {index: 2}
  match_examples:
  - name: shell command token is tainted
    code: |
      fun execute(input: String) {
          ProcessBuilder("/bin/sh", "-c", input)
      }
    expect_match_text: [ProcessBuilder]
  - name: path-resolved shell command token is tainted
    code: |
      fun execute(input: String) {
          ProcessBuilder("sh", "-c", input)
      }
    expect_match_text: [ProcessBuilder]
  - name: direct argv passes data without a shell
    code: |
      fun execute(input: String) {
          ProcessBuilder("/usr/bin/printf", "%s", input)
      }
    expect_no_match: true
  description: "ProcessBuilder with exact `sh -c` or `/bin/sh -c` prefix interprets the tainted third token as shell syntax; direct executable argv remains outside this shell-specific boundary."
