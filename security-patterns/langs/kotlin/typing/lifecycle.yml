- id: kotlin.typing.lifecycle_released_receiver
  enabled: true
  language: kotlin
  match:
    kind: call
    callee:
      regex: '(?:^|\.)(?:release|dispose)$'
  lifecycle_transition:
    state: freed
    binding: { kind: receiver }
  match_examples:
  - name: dispose changes the receiver state
    code: 'fun f(resource: Resource) { resource.dispose() }'
    expect_match_text: [resource.dispose]
  description: "Kotlin release/dispose moves the receiver to freed. Typing-only; never a finding."
