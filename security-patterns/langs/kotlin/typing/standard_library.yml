- id: kotlin.typing.document_builder_factory_new_instance
  enabled: true
  language: kotlin
  imports: [javax.xml.parsers]
  returns_type: DocumentBuilderFactory
  match:
    kind: call
    callee:
      attribute: [DocumentBuilderFactory, newInstance]
      binding_origin: imported
  match_examples:
  - name: document builder factory return type
    code: |
      import javax.xml.parsers.DocumentBuilderFactory
      fun factory() = DocumentBuilderFactory.newInstance()
    expect_match_text: [DocumentBuilderFactory.newInstance]
  - name: local factory is not javax XML
    code: |
      import javax.xml.parsers.DocumentBuilderFactory as JavaDocumentBuilderFactory
      object DocumentBuilderFactory { fun newInstance() = LocalFactory() }
      class LocalFactory
      fun factory() = DocumentBuilderFactory.newInstance()
    expect_no_match: true
  description: "DocumentBuilderFactory.newInstance returns the exact factory receiver type used by later configuration and builder calls."

- id: kotlin.typing.document_builder_factory_new_document_builder
  enabled: true
  language: kotlin
  imports: [javax.xml.parsers]
  returns_type: DocumentBuilder
  match:
    kind: call
    callee:
      name: newDocumentBuilder
      receiver_type_in: [DocumentBuilderFactory]
  match_examples:
  - name: document builder factory creates a typed builder
    code: |
      import javax.xml.parsers.DocumentBuilderFactory
      fun builder(): Any {
        val factory = DocumentBuilderFactory.newInstance()
        return factory.newDocumentBuilder()
      }
    expect_match_text: [factory.newDocumentBuilder]
  - name: local newDocumentBuilder receiver is not javax XML
    code: |
      import javax.xml.parsers.DocumentBuilderFactory
      class LocalFactory { fun newDocumentBuilder(): Any = Any() }
      fun builder(factory: LocalFactory) = factory.newDocumentBuilder()
    expect_no_match: true
  description: "DocumentBuilderFactory.newDocumentBuilder returns DocumentBuilder for exact chained and assigned receiver matching."

- id: kotlin.typing.java_sql_driver_manager_get_connection
  enabled: true
  language: kotlin
  imports: [java.sql]
  returns_type: Connection
  match:
    kind: call
    callee:
      attribute: [DriverManager, getConnection]
      binding_origin: imported
  match_examples:
  - name: imported JDBC driver manager returns Connection
    code: |
      import java.sql.DriverManager
      fun connection(url: String) = DriverManager.getConnection(url)
    expect_match_text: [DriverManager.getConnection]
  - name: local driver manager does not receive JDBC typing
    code: |
      object DriverManager { fun getConnection(url: String) = LocalConnection() }
      class LocalConnection
      fun connection(url: String) = DriverManager.getConnection(url)
    expect_no_match: true
  description: "Imported java.sql.DriverManager.getConnection returns Connection; typing-only metadata supports exact receiver inference."

- id: kotlin.typing.java_sql_connection_create_statement
  enabled: true
  language: kotlin
  imports: [java.sql]
  returns_type: Statement
  match:
    kind: call
    callee:
      name: createStatement
      receiver_type_in: [Connection]
  match_examples:
  - name: compiler-typed JDBC connection creates Statement
    code: |
      import java.sql.Connection
      fun statement(connection: Connection) = connection.createStatement()
    expect_match_text: [connection.createStatement]
  - name: unrelated createStatement method is not JDBC
    code: |
      import java.sql.DriverManager
      class LocalConnection { fun createStatement() = LocalStatement() }
      class LocalStatement
      fun statement(connection: LocalConnection) = connection.createStatement()
    expect_no_match: true
  description: "A compiler-typed java.sql.Connection.createStatement call returns Statement; typing-only metadata supports later JDBC sink matching."

- id: kotlin.typing.spring_resttemplate_constructor
  enabled: true
  language: kotlin
  imports: [org.springframework.web.client]
  returns_type: RestTemplate
  match:
    kind: new
    callee:
      attribute: [org, springframework, web, client, RestTemplate]
      binding_origin: imported
  match_examples:
  - name: imported constructor types a local receiver
    code: |
      import org.springframework.web.client.RestTemplate
      fun example(url: String) {
        val client = RestTemplate()
        client.getForObject(url, String::class.java)
      }
    expect_match_text: [RestTemplate]
  - name: ordinary local factory does not borrow the imported type
    code: |
      import org.springframework.web.client.RestTemplate as SpringClient
      class LocalClient
      fun RestTemplate() = LocalClient()
      fun example() { val client = RestTemplate() }
    expect_no_match: true
  description: "Imported Spring RestTemplate construction returns its exact receiver type; local factories do not inherit that identity."
