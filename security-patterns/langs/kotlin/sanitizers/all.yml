# False-positive audit fill: validators and parameter binding shapes.
- id: kotlin.sanitizer.same_origin_path_startswith_slash
  enabled: true
  language: kotlin
  tag: same-origin-path
  match:
    kind: call
    callee:
      name: startsWith
  constraints:
  - arg_equals:
      index: 0
      value: '"/"'
  - same_receiver_call_count_at_least: 2
  match_examples:
  - name: paired same-origin path guard
    code: |
      class App {
        fun allow(next: String): Boolean {
          return next.startsWith("/") && !next.startsWith("//")
        }
      }
    expect_match_text: [next.startsWith]
  - name: paired same-origin path guard negative constraint boundary
    code: "class App {\n  fun allow(next: String): Boolean {\n    return next.startsWith() && !next.startsWith(\"//\")\n \
      \ }\n}\n"
    expect_no_match: true
  description: "Same-origin redirect path guard paired with a second startsWith call on the same receiver for the `!path.startsWith(\"\
    //\")` scheme-relative rejection shape."

- id: kotlin.sanitizer.pattern_matches_safe_shape
  enabled: true
  language: kotlin
  tag: regex-validate
  match:
    kind: call
    callee:
      attribute: [Pattern, matches]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^["'']\^?(\[A-Za-z0-9_|\[A-Fa-f0-9)'
  - min_args: 2
  match_examples:
  - name: slug shape validator
    code: |
      class App {
        fun allow(slug: String): Boolean {
          return Pattern.matches("^[A-Za-z0-9_-]{1,64}$", slug)
        }
      }
    expect_match_text: [Pattern.matches]
  - name: slug shape validator negative constraint boundary
    code: "class App {\n  fun allow(slug: String): Boolean {\n    return Pattern.matches()\n  }\n}\n"
    expect_no_match: true
  description: "Pattern.matches with a bounded UUID/slug-style allowlist regex validates string shape."

- id: kotlin.sanitizer.regex_replace_char_allowlist_strip
  enabled: true
  language: kotlin
  tag: char-allowlist
  match:
    kind: call
    callee:
      name: replace
  constraints:
  - any_arg_matches_regex: '\[\^[-A-Za-z0-9_ /]+\]'
  - any_arg_matches_regex: '^["'']["'']$'
  match_examples:
  - name: strip to safe slug chars
    code: |
      class App {
        fun clean(input: String): String {
          return input.replace(Regex("[^A-Za-z0-9_-]"), "")
        }
      }
    expect_match_text: [input.replace]
  - name: strip to safe slug chars negative constraint boundary
