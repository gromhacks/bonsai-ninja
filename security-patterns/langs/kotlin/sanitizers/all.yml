- id: kotlin.sanitizer.xml_factory_disallow_doctype_true
  enabled: true
  language: kotlin
  tag: xxe-sanitizer
  packages: ["javax.xml.parsers"]
  imports: [javax.xml.parsers.DocumentBuilderFactory, javax.xml.parsers.SAXParserFactory]
  match:
    kind: call
    callee:
      name: setFeature
  constraints:
  - receiver_type_in:
    - DocumentBuilderFactory
    - SAXParserFactory
    - javax.xml.parsers.DocumentBuilderFactory
    - javax.xml.parsers.SAXParserFactory
  - arg_matches_regex:
      index: 0
      regex: 'disallow-doctype-decl'
  - arg_matches_regex:
      index: 1
      regex: 'true|TRUE'
  match_examples:
  - name: document builder disallow doctype
    code: |
      import javax.xml.parsers.DocumentBuilderFactory
      class App {
        fun configure(factory: DocumentBuilderFactory) {
          factory.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)
        }
      }
    expect_match_text: [factory.setFeature]
  - name: document builder disallow doctype negative constraint boundary
    code: "import javax.xml.parsers.*\nclass App {\n  fun configure(factory: DocumentBuilderFactory) {\n    factory.setFeature()\n\
      \  }\n}\nclass DocumentBuilderFactory {\n  fun setFeature(vararg args: Any?) {}\n}\n"
    expect_no_match: true
  - name: local XML factory does not earn doctype sanitizer credit
    code: |
      import javax.xml.parsers.SAXParserFactory
      class DocumentBuilderFactory { fun setFeature(vararg args: Any?) {} }
      class App {
        fun configure(factory: DocumentBuilderFactory, parserFactory: SAXParserFactory) {
          factory.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)
        }
      }
    expect_no_match: true
  description: "XML parser feature hardening - disallows DOCTYPE declarations to block XXE payloads."

- id: kotlin.sanitizer.xml_factory_restrict_external_access
  enabled: true
  language: kotlin
  tag: xxe-sanitizer
  packages: ["javax.xml.XMLConstants"]
  imports: [javax.xml.XMLConstants, javax.xml.parsers.DocumentBuilderFactory, javax.xml.parsers.SAXParserFactory, javax.xml.validation.SchemaFactory, javax.xml.transform.TransformerFactory]
  match:
    kind: call
    callee:
      name: setAttribute
  constraints:
  - receiver_type_in:
    - DocumentBuilderFactory
    - SAXParserFactory
    - SchemaFactory
    - TransformerFactory
    - javax.xml.parsers.DocumentBuilderFactory
    - javax.xml.parsers.SAXParserFactory
    - javax.xml.validation.SchemaFactory
    - javax.xml.transform.TransformerFactory
  - arg_matches_regex:
      index: 0
      regex: 'ACCESS_EXTERNAL_DTD|ACCESS_EXTERNAL_SCHEMA|ACCESS_EXTERNAL_STYLESHEET'
  - arg_matches_regex:
      index: 1
      regex: '^""$'
  match_examples:
  - name: restrict external dtd access
    code: |
      import javax.xml.XMLConstants
      import javax.xml.parsers.DocumentBuilderFactory
      class App {
        fun configure(factory: DocumentBuilderFactory) {
          factory.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, "")
        }
      }
    expect_match_text: [factory.setAttribute]
  - name: restrict external dtd access negative constraint boundary
    code: "import javax.xml.XMLConstants.*\nclass App {\n  fun configure(factory: DocumentBuilderFactory) {\n    factory.setAttribute()\n\
      \  }\n}\nclass DocumentBuilderFactory {\n  fun setAttribute(vararg args: Any?) {}\n}\nobject XMLConstants {\n  const
      val ACCESS_EXTERNAL_DTD = \"\"\n}\n"
    expect_no_match: true
  - name: local XML factory does not earn external-access sanitizer credit
    code: |
      import javax.xml.XMLConstants
      class DocumentBuilderFactory { fun setAttribute(vararg args: Any?) {} }
      class App {
        fun configure(factory: DocumentBuilderFactory) {
          factory.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, "")
        }
      }
    expect_no_match: true
  description: "XMLConstants ACCESS_EXTERNAL_* set to empty string - blocks external DTD/schema/stylesheet resolution."
- id: kotlin.passthrough.string_format
  enabled: true
  language: kotlin
  tag: passthrough-transform
  match:
    kind: call
    callee:
      attribute: [String, format]
  taint_semantics:
    call_result_passthrough_args: [0, 1, 2, 3, 4, 5, 6, 7]
  match_examples:
  - name: string format preserves arg taint
    code: |
      fun h(input: String): String {
        return String.format("q=%s", input)
      }
    expect_match_text: [String.format]
  description: "Kotlin String.format(fmt, args...) - formatted string derives from its arguments; preserves taint."
