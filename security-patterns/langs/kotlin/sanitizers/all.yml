# JWT signature-verification sanitizers (jwt-verify). The verify
# path proves the token signature before its claims are trusted;
# the unverified decode/parse path is the corresponding sink.
- id: kotlin.sanitizer.auth0_jwt_verifier_verify
  enabled: true
  language: kotlin
  tag: jwt-verify
  packages: ["com.auth0.jwt"]
  match:
    kind: call
    callee:
      attribute: [JWTVerifier, verify]
  constraints:
  - min_args: 1
  match_examples:
  - name: auth0 jwt verifier verify
    code: |
      import com.auth0.jwt.*
      class App {
        fun check(verifier: JWTVerifier, token: String) {
          verifier.verify(token)
        }
      }
    expect_match_text: [verifier.verify]
  - name: auth0 jwt verifier verify negative constraint boundary
    code: "import com.auth0.jwt.*\nclass App {\n  fun check(verifier: JWTVerifier) {\n    verifier.verify()\n  }\n}\n"
    expect_no_match: true
  description: "auth0 java-jwt JWTVerifier.verify(token) - validates the JWT signature and registered claims against the configured Algorithm before claims are trusted."
- id: kotlin.sanitizer.nimbus_jwt_verify
  enabled: true
  language: kotlin
  tag: jwt-verify
  packages: ["com.nimbusds.jose"]
  match:
    kind: call
    callee:
      attribute: [SignedJWT, verify]
  constraints:
  - min_args: 1
  match_examples:
  - name: nimbus signed jwt verify
    code: |
      import com.nimbusds.jose.*
      class App {
        fun check(jwt: SignedJWT, verifier: Any) {
          jwt.verify(verifier as JWSVerifier)
        }
      }
    expect_match_text: [jwt.verify]
  - name: nimbus signed jwt verify negative constraint boundary
    code: "import com.nimbusds.jose.*\nclass App {\n  fun check(jwt: SignedJWT) {\n    jwt.verify()\n  }\n}\n"
    expect_no_match: true
  description: "Nimbus JOSE SignedJWT.verify(JWSVerifier) - cryptographically verifies the JWS signature before the payload is trusted."

# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) - taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: kotlin.passthrough.urldecoder_decode
  enabled: true
  language: kotlin
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [URLDecoder, decode]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: generated shape example
    code: |
      class App {
        fun handle(input: String) {
          URLDecoder.decode(input)
        }
      }
    expect_match_text: [URLDecoder.decode]
  description: "java.net.URLDecoder.decode(s, charset) - preserves taint (Kotlin via Java interop)."

