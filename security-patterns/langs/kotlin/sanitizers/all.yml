      attribute: [XPath, evaluate]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '\$[A-Za-z_][A-Za-z0-9_]*'
  - min_args: 2
  match_examples:
  - name: xpath evaluate placeholder
    code: |
      import javax.xml.xpath.*
      class App {
        fun find(xpath: XPath, doc: Any): Any {
          return xpath.evaluate("/users/user[@id=$id]", doc)
        }
      }
    expect_match_text: [xpath.evaluate]
  - name: xpath evaluate placeholder negative constraint boundary
    code: "import javax.xml.xpath.*\nclass App {\n  fun find(xpath: XPath, doc: Any): Any {\n    return xpath.evaluate()\n\
      \  }\n}\n"
    expect_no_match: true
  description: "XPath.evaluate with `$name` placeholders is the parameterized side of XPath variable binding."

