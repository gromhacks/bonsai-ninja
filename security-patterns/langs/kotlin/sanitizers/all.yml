  match:
    kind: call
    callee:
      name: addValue
  constraints:
  - receiver_type_in:
    - MapSqlParameterSource
    - org.springframework.jdbc.core.namedparam.MapSqlParameterSource
  - min_args: 2
  match_examples:
  - name: named parameter source add value
    code: |
      import org.springframework.jdbc.core.namedparam.MapSqlParameterSource
      class App {
        fun bind(params: MapSqlParameterSource, input: String) {
          params.addValue("name", input)
        }
      }
    expect_match_text: [params.addValue]
  - name: local named parameter source does not prove JDBC binding
    code: |
      import org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate
