# Kotlin message-queue consumers.
- id: kotlin.source.azure_queue_trigger
  enabled: true
  language: kotlin
  trust: service
  tag: queue-input
  payload_types: [event, text, binary, json]
  packages: [com.microsoft.azure.functions]
  match:
    kind: param
    target: { annotation: QueueTrigger }
  match_examples:
  - name: azure storage queue trigger payload
    code: |
      import com.microsoft.azure.functions.annotation.QueueTrigger
      class Function {
        fun run(@QueueTrigger(name = "message", queueName = "orders") message: String) { }
      }
    expect_match_text: [message]
  - name: ordinary queue parameter negative
    code: |
      import com.microsoft.azure.functions.annotation.QueueTrigger
      class Function { fun helper(message: String) { } }
    expect_no_match: true
  description: "Azure Functions Kotlin @QueueTrigger parameter - message supplied by Azure Queue Storage."

