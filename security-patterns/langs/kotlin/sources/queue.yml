# Kotlin message-queue consumers.
- id: kotlin.source.kafka_consumer_record
  enabled: true
  language: kotlin
  trust: service
  tag: queue-input
  packages: [org.apache.kafka.clients.consumer]
  match:
    kind: call
    callee:
      name: value
  constraints:
  - receiver_type_in: [ConsumerRecord]
  match_examples:
  - name: kafka consumer record value
    code: |
      import org.apache.kafka.clients.consumer.ConsumerRecord
      fun onMessage(record: ConsumerRecord<String, String>) {
        val body = record.value()
      }
    expect_match_text: ["record.value"]
  - name: unrelated value negative
    code: |
      fun f(record: Widget) {
        val body = record.value()
      }
    expect_no_match: true
  description: "Kafka ConsumerRecord.value() returns the broker-supplied message payload - attacker-controllable. Gated on the ConsumerRecord receiver type (resolved from the local/param declaration) so unrelated value() methods stay quiet."

