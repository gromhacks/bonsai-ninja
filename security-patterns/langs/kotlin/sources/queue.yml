- id: kotlin.source.spring_messaging_payload
  enabled: true
  language: kotlin
  trust: service
  tag: queue-input
  payload_types: [event, text, binary, json]
  packages: [org.springframework.messaging]
  match:
    kind: param
    target:
      annotation: Payload
  match_examples:
  - name: explicit spring messaging payload
    code: |
      import org.springframework.messaging.handler.annotation.Payload
      class Consumer {
        fun receive(@Payload order: Order) { }
      }
      class Order
    expect_match_text: [order]
  - name: spring header is not payload
    code: |
      import org.springframework.messaging.handler.annotation.Header
      class Consumer {
        fun receive(@Header("trace") trace: String) { }
      }
    expect_no_match: true
  description: "Spring Messaging @Payload parameter - explicit broker or messaging payload boundary shared by Kafka, AMQP, JMS, and related listener adapters."

- id: kotlin.source.amqp_delivery_getbody
  enabled: true
  language: kotlin
  trust: service
  tag: queue-input
  packages: ["com.rabbitmq"]
  match:
    kind: call
    callee:
      name: getBody
  constraints:
  - receiver_type_in: [Delivery]
  match_examples:
  - name: amqp delivery getbody
    code: |
      import com.rabbitmq.client.Delivery
      fun onMessage(delivery: Delivery) {
        val body = delivery.getBody()
      }
    expect_match_text: ["delivery.getBody"]
  - name: unrelated getbody negative
    code: |
      fun f(delivery: Widget) {
        val body = delivery.getBody()
      }
    expect_no_match: true
  description: "RabbitMQ AMQP Delivery.getBody() returns the broker-supplied message bytes - attacker-controllable. Gated on the Delivery receiver type (resolved from the local/param declaration) so unrelated getBody() methods stay quiet."

