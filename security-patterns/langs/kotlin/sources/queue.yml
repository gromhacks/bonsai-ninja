- id: kotlin.source.kafka_consumer_record
  enabled: true
  language: kotlin
  trust: service
  tag: queue-input
  packages: [org.apache.kafka.clients.consumer]
  match:
    kind: call
    callee:
      name: value
  constraints:
  - receiver_type_in: [ConsumerRecord]
  match_examples:
  - name: kafka consumer record value
    code: |
      import org.apache.kafka.clients.consumer.ConsumerRecord
      fun onMessage(record: ConsumerRecord<String, String>) {
        val body = record.value()
      }
    expect_match_text: ["record.value"]
  - name: unrelated value negative
    code: |
      fun f(record: Widget) {
        val body = record.value()
      }
    expect_no_match: true
  description: "Kafka ConsumerRecord.value() returns the broker-supplied message payload - attacker-controllable. Gated on the ConsumerRecord receiver type (resolved from the local/param declaration) so unrelated value() methods stay quiet."

- id: kotlin.source.kafka_listener
  enabled: true
  language: kotlin
  trust: service
  tag: queue-input
  payload_types: [text]
  packages: [org.springframework.kafka.annotation]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      param_type_in: [String, kotlin.String, java.lang.String]
  constraints:
  - enclosing_decorator_in: [KafkaListener]
  match_examples:
  - name: spring kafka string payload
    code: |
      import org.springframework.kafka.annotation.KafkaListener
      class Consumer {
        @KafkaListener(topics = ["orders"])
        fun receive(payload: String) { }
      }
    expect_match_text: [payload]
  - name: ordinary string parameter negative
    code: |
      import org.springframework.kafka.annotation.KafkaListener
      class Consumer {
        fun helper(payload: String) { }
      }
    expect_no_match: true
  description: "String parameter on a Spring @KafkaListener method - converted Kafka message payload."

