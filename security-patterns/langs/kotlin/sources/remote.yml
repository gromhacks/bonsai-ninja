# Kotlin HTTP / RPC / cross-app request sources.
#
# -- Adapter coverage notes (audited 2026-04) ---------------------------------
# Many Kotlin/JVM source surfaces are property accesses (Ktor
# `call.parameters`, `call.request.queryParameters`, `call.request.headers`,
# `call.request.cookies`, `PartData.originalFileName`) and JVM annotation
# binding (Spring `@RequestParam`/`@RequestBody`/`@PathVariable`/
# `@RequestHeader`/`@CookieValue`/`@KafkaListener`/`@RabbitListener`,
# JAX-RS `@QueryParam`/`@PathParam`/`@HeaderParam`/`@FormParam`/
# `@CookieParam`, Azure `@HttpTrigger`). The shared adapter kit now emits
# common member-read facts and parameter annotation metadata, so the Ktor,
# Spring, and JAX-RS rules below are enabled where their shapes are precise.
# The current Kotlin adapter:
#
#   1. Emits common `read` facts and parameter annotations.
#   2. Does NOT consistently carry static receiver-type information for local
#      variables (`val record: ConsumerRecord`, `val msg: TextMessage`,
#      `val intent: Intent`), so local receiver fallbacks must be package/import
#      gated and method/arity constrained.
#
# Per docs/pattern-guide.mdx the fix is in the Kotlin adapter, not here:
#
#   > If a source-visible value flow is missing, fix adapter extraction or
#   > the semantic graph. Do not encode the missing edge in YAML.
#
# The bundled pack contains only executable rules. New framework shapes belong
# here only after their required compiler facts and collision-negative examples
# exist.

- id: kotlin.source.gcloud_function_handle
  enabled: true
  language: kotlin
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [event, json, query, path, header]
  packages: [com.google.cloud.functions]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_class: [HttpFunction]
      in_method: [service]
      param_index_in: [0]
      param_type_in: [HttpRequest, com.google.cloud.functions.HttpRequest]
  match_examples:
  - name: google cloud kotlin http request
    code: |
      import com.google.cloud.functions.HttpFunction
      import com.google.cloud.functions.HttpRequest
      import com.google.cloud.functions.HttpResponse
      class Function : HttpFunction {
        override fun service(request: HttpRequest, response: HttpResponse) { }
      }
    expect_match_text: [request]
  - name: helper request negative
    code: |
      import com.google.cloud.functions.HttpRequest
      class Function { fun helper(request: HttpRequest) { } }
    expect_no_match: true
  description: "Google Cloud Kotlin HttpFunction.service request parameter - remote HTTP request proven by interface, method, position, and declared type."

- id: kotlin.source.azure_http_trigger
  enabled: true
  language: kotlin
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [json, text]
  packages: ["com.microsoft.azure.functions"]
  match:
    kind: param
    target: { annotation: HttpTrigger }
  match_examples:
  - name: azure http trigger request parameter
    code: |
      import com.microsoft.azure.functions.annotation.HttpTrigger
      class App {
        fun run(@HttpTrigger(name = "req") req: Request) { }
      }
      class Request
    expect_match_text: [req]
  - name: unannotated http trigger name negative
    code: |
      import com.microsoft.azure.functions.annotation.HttpTrigger
      class App { fun run(HttpTrigger: String) { } }
    expect_no_match: true
  description: "Azure Functions @HttpTrigger annotated parameter - HTTP request envelope supplied by the remote caller."

- id: kotlin.source.azure_http_request_getbody
  enabled: true
  language: kotlin
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [json, text]
  packages: ["com.microsoft.azure.functions"]
  imports: [com.microsoft.azure.functions.HttpRequestMessage]
  match:
    kind: call
    callee: { name: getBody }
  constraints:
  - receiver_type_in: [HttpRequestMessage, com.microsoft.azure.functions.HttpRequestMessage]
  match_examples:
  - name: azure http trigger request body
    code: |
      import com.microsoft.azure.functions.HttpRequestMessage
      class App {
        fun run(req: HttpRequestMessage<String>) { req.getBody() }
      }
    expect_match_text: [req.getBody]
  - name: unrelated getbody negative
    code: |
      import com.microsoft.azure.functions.HttpRequestMessage
      class App { fun run(req: Widget) { req.getBody() } }
      class Widget { fun getBody(): String = "" }
    expect_no_match: true
  - name: local request type is not the Azure request contract
    code: |
      import com.microsoft.azure.functions.ExecutionContext
      class HttpRequestMessage<T> { fun getBody(): T? = null }
      class App {
        fun run(req: HttpRequestMessage<String>, context: ExecutionContext) { req.getBody() }
      }
    expect_no_match: true
  description: "Azure Functions request getBody() - remote HTTP request body supplied by the caller."

