# Kotlin HTTP / RPC / cross-app request sources.
#
# ── Adapter coverage notes (audited 2026-04) ─────────────────────────────────
# Many Kotlin/JVM source surfaces are property accesses (Ktor
# `call.parameters`, `call.request.queryParameters`, `call.request.headers`,
# `call.request.cookies`, `PartData.originalFileName`) and JVM annotation
# binding (Spring `@RequestParam`/`@RequestBody`/`@PathVariable`/
# `@RequestHeader`/`@CookieValue`/`@KafkaListener`/`@RabbitListener`,
# JAX-RS `@QueryParam`/`@PathParam`/`@HeaderParam`/`@FormParam`/
# `@CookieParam`, Azure `@HttpTrigger`). The shared adapter kit now emits
# common member-read facts and parameter annotation metadata, so the Ktor,
# Spring, and JAX-RS rules below are enabled where their shapes are precise.
# Remaining gaps are receiver-type precision and framework-specific
# annotation shapes that are not surfaced yet. The current Kotlin adapter:
#
#   1. Emits common `read` facts and parameter annotations.
#   2. Does NOT carry static receiver-type information for local variables
#      (`val record: ConsumerRecord`, `val msg: TextMessage`,
#      `val intent: Intent`), so attribute-style `[ConsumerRecord, value]`
#      matches miss real call sites.
#
# Per docs/pattern-guide.mdx the fix is in the Kotlin adapter, not here:
#
#   > If a source-visible value flow is missing, fix adapter extraction or
#   > the semantic graph. Do not encode the missing edge in YAML.
#
# Tracking task: propagate declared receiver types on local variables and add
# any missing framework-specific annotation shapes. Once shipped, flip the
# remaining `enabled: false` typed rules below to true and re-run the audit.
#
# Below this header: enabled annotation/read sources and callable-shape
# sources that work today, plus tail-matched receivers that are stable enough
# to enable.

- id: kotlin.source.spring_request_param
  enabled: true
  language: kotlin
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query]
  packages: [org.springframework.web]
  match:
    kind: param
    target:
      annotation: RequestParam
  match_examples:
  - name: generated shape example
    code: |
      import org.springframework.web.*
      class App {
        fun handle(@RequestParam value: String) {
        }
      }
  description: "Spring @RequestParam annotated parameter — query/form value bound from the HTTP request."

