# Kotlin CLI / process-local inputs.
- id: kotlin.source.main_args
  enabled: false
  disabled_reason:
    code: over-broad
  language: kotlin
  trust: local
  tag: cli-input
  match:
    kind: param
    target:
      name: args
  description: "Disabled — `kind: param` cannot currently prove the enclosing function is top-level `main`, so bare `args` overmatches ordinary helper parameters."

- id: kotlin.source.system_getenv
  enabled: true
  language: kotlin
  trust: local
  tag: env-input
  match:
    kind: call
    callee:
      attribute: [System, getenv]
  match_examples:
    - name: generated shape example
      code: |
        class App {
          fun handle(input: String) {
            System.getenv(input)
          }
        }
  description: "System.getenv — environment variable."

- id: kotlin.source.system_getproperty
  enabled: true
  language: kotlin
  trust: local
  tag: env-input
  match:
    kind: call
    callee:
      attribute: [System, getProperty]
  match_examples:
    - name: generated shape example
      code: |
        class App {
          fun handle(input: String) {
            System.getProperty(input)
          }
        }
  description: "System.getProperty — JVM system property."

- id: kotlin.source.kotlin_readline
  enabled: true
  language: kotlin
  trust: local
  tag: cli-input
  match:
    kind: call
    callee:
      name: readLine
  match_examples:
    - name: generated shape example
      code: |
        class App {
          fun handle(input: String) {
            readLine(input)
          }
        }
  description: "kotlin.io.readLine() — stdin line."
