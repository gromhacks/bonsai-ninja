# Kotlin IPC / cross-app input sources.
- id: kotlin.source.android_getintent_getstringextra
  enabled: true
  language: kotlin
  trust: ipc
  tag: ipc-input
  packages: [android]
  match:
    kind: call
    callee:
      regex: "\\.getStringExtra$"
  constraints:
  - min_args: 1
  match_examples:
    - name: generated shape example
      code: |
        import android.*
        class App {
          fun handle(intent: Intent, key: String) {
            intent.getStringExtra(key)
          }
        }
        class Intent {
          fun getStringExtra(vararg args: Any?): String = ""
        }
      expect_match_text: [intent.getStringExtra]
  description: "Android Intent.getStringExtra(...) - package-scoped IPC extra read from a local intent receiver."

- id: kotlin.source.android_getintent_getextras
  enabled: false
  disabled_reason:
    code: over-broad
  language: kotlin
  trust: ipc
  tag: ipc-input
  match:
    kind: call
    callee:
      attribute: [Intent, getExtras]
  description: "Disabled - `getExtras` is too broad as a receiver-agnostic callable; enable a typed Intent receiver rule once adapters surface receiver-type facts."
