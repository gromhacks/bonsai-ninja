# Kotlin IPC / cross-app input sources.
- id: kotlin.source.android_getintent_getstringextra
  enabled: true
  language: kotlin
  trust: ipc
  tag: ipc-input
  packages: [android]
  match:
    kind: call
    callee:
      attribute: [Intent, getStringExtra]
  constraints:
  - min_args: 1
  match_examples:
    - name: generated shape example
      code: |
        import android.*
        class App {
          fun handle(intent: Intent, key: String) {
            intent.getStringExtra(key)
          }
        }
        class Intent {
          fun getStringExtra(vararg args: Any?): String = ""
        }
      expect_match_text: [intent.getStringExtra]
    - name: same getter on a local intent-shaped type
      code: |
        import android.*
        class LocalIntent { fun getStringExtra(key: String): String = "fixed" }
        class App { fun handle(intent: LocalIntent) = intent.getStringExtra("name") }
      expect_no_match: true
  description: "Android Intent.getStringExtra(...) - package-scoped IPC extra read from a local intent receiver."

- id: kotlin.source.process_output_streams
  enabled: true
  language: kotlin
  trust: ipc
  tag: ipc-input
  payload_types: [text, binary]
  packages: [java.lang]
  match:
    kind: call
    callee:
      regex: '(^|[.])(getInputStream|getErrorStream)$'
  constraints:
  - receiver_type_in: [Process, java.lang.Process]
  - max_args: 0
  match_examples:
  - name: Kotlin child-process output stream
    code: |
      import java.lang.Process
      fun output(process: Process) = process.getInputStream()
    expect_match_text: [process.getInputStream]
  - name: local process model is not an IPC source
    code: |
      import java.lang.Process
      class LocalProcess { fun getInputStream(): String = "constant" }
      fun output(process: LocalProcess) = process.getInputStream()
    expect_no_match: true
  description: "java.lang.Process stdout/stderr streams used from Kotlin - values returned by a local child process."
