# Kotlin cloud-function entry points (AWS / GCP / Azure).
- id: kotlin.source.aws_lambda_handler
  enabled: true
  language: kotlin
  trust: service
  tag: cloud-event
  payload_types: [event, json, text, binary]
  packages: ["com.amazonaws:aws-lambda-java-core"]
  imports: [com.amazonaws.services.lambda.runtime]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_class: [RequestHandler, RequestStreamHandler]
      in_method: [handleRequest]
      decl_kind_in: [method]
      param_index_in: [0]
  match_examples:
  - name: aws lambda kotlin handler input
    code: |
      import com.amazonaws.services.lambda.runtime.Context
      import com.amazonaws.services.lambda.runtime.RequestHandler
      class Function : RequestHandler<Order, String> {
        override fun handleRequest(event: Order, context: Context): String = "ok"
      }
      class Order
    expect_match_text: [event]
  - name: same method outside handler negative
    code: |
      import com.amazonaws.services.lambda.runtime.RequestHandler
      class Helper {
        fun handleRequest(event: String) { }
      }
    expect_no_match: true
  description: "First parameter of an AWS Lambda Kotlin RequestHandler or RequestStreamHandler handleRequest method - invocation event payload proven by interface, method, and position."

- id: kotlin.source.azure_blob_trigger
  enabled: true
  language: kotlin
  trust: service
  tag: cloud-event
  payload_types: [event, file, binary]
  packages: [com.microsoft.azure.functions]
  match:
    kind: param
    target: { annotation: BlobTrigger }
  match_examples:
  - name: azure blob trigger payload
    code: |
      import com.microsoft.azure.functions.annotation.BlobTrigger
      class Function {
        fun run(@BlobTrigger(name = "blob", path = "incoming/{name}") blob: ByteArray) { }
      }
    expect_match_text: [blob]
  - name: ordinary blob parameter negative
    code: |
      import com.microsoft.azure.functions.annotation.BlobTrigger
      class Function { fun helper(blob: ByteArray) { } }
    expect_no_match: true
  description: "Azure Functions Kotlin @BlobTrigger parameter - object content supplied by the triggering storage blob."
