- id: php.access.wordpress_ajax_action
  enabled: true
  language: php
  tag: access-control
  severity: medium
  packages:
  - wordpress
  cwe:
  - CWE-285
  match:
    kind: call
    callee:
      name: add_action
  match_examples:
  - name: php.access.wordpress_ajax_action example
    code: |
      <?php
      use wordpress;
      use wordpress;
      function example($input, $url, $id, $payload, $request) {
        add_action('wp_ajax_nopriv_export_report', 'export_report');
      }
    expect_match_text:
    - add_action
  description: WordPress wp_ajax/wp_ajax_nopriv hook registration — audit callback authorization checks such as current_user_can().
