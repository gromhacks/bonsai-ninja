- id: php.access.aws_get_object
  enabled: true
  language: php
  tag: access-control
  severity: high
  packages:
  - aws/aws-sdk-php
  cwe:
  - CWE-284
  - CWE-639
  match:
    kind: call
    callee:
      name: getObject
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.access.aws_get_object example
    code: |
      <?php
      use aws\awssdkphp;
      use aws\awssdkphp;
      use aws\aws-sdk-php;
      function example($input, $url, $id, $payload, $request) {
        getObject($input);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      use aws\awssdkphp;
      function example($input, $url, $id, $payload, $request) {
        getObject(["Bucket" => "reports", "Key" => "public.json"]);
      }
    expect_no_match: true
  description: AWS SDK for PHP getObject — tainted bucket/key selector reads arbitrary object data.
  imports:
  - aws
  - aws/awssdkphp
  - aws\awssdkphp
