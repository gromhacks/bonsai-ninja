# PHP memory-safety / lifecycle audit-pair sites.
# These rules fire on the *transition site* — the PHP adapter rejects
# `$`-prefixed binding names from the lifecycle lattice, so the
# `requires_state` engine constraint (P6) cannot gate the use site
# until the adapter normalises `$fp` → `fp` for the binding key.

- id: php.memory.fclose
  enabled: true
  language: php
  tag: memory-safety
  severity: medium
  cwe: [CWE-404, CWE-416]
  match:
    kind: call
    callee:
      name: fclose
  match_examples:
  - name: fclose site
    code: |
      <?php
      function example($fp) {
          fclose($fp);
      }
    expect_match_text: [fclose]
  description: "Audit-pair site — engine surfaces the lifecycle event; correlate with subsequent uses of the same value. fclose($fp) — later fread/fwrite on the same handle returns false (use-after-close, CWE-416). The PHP adapter doesn't yet strip the `$` prefix from the lifecycle binding key, so this rule cannot gate via `requires_state` and stays a transition-site audit-pair."
