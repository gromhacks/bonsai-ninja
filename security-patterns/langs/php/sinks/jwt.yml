- id: php.jwt.firebase_decode
  enabled: true
  language: php
  tag: jwt
  severity: high
  packages:
  - firebase/php-jwt
  cwe:
  - CWE-347
  - CWE-345
  match:
    kind: call
    callee:
      attribute:
      - JWT
      - decode
  match_examples:
  - name: php.jwt.firebase_decode example
    code: |
      <?php
      use firebase\phpjwt;
      use firebase\phpjwt;
      use firebase\php-jwt;
      function example($input, $url, $id, $payload, $request) {
        JWT::decode($input);
      }
  description: 'Firebase JWT::decode — flag missing/none alg whitelist. Merged aliases: php.jwt.alg_confusion.'
  aliases:
  - php.jwt.alg_confusion
  imports:
  - firebase/phpjwt
  - firebase
  - firebase\phpjwt
- id: php.jwt.firebase_encode_none
  enabled: true
  language: php
  tag: jwt
  severity: critical
  packages:
  - firebase/php-jwt
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - JWT
      - encode
  match_examples:
  - name: php.jwt.firebase_encode_none example
    code: |
      <?php
      use firebase\phpjwt;
      use firebase\phpjwt;
      use firebase\php-jwt;
      function example($input, $url, $id, $payload, $request) {
        JWT::encode($input, $input, "none");
      }
  description: JWT::encode with alg='none'.
  imports:
  - firebase/phpjwt
  - firebase
  - firebase\phpjwt
