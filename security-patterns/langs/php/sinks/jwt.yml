- id: php.jwt.lcobucci_validator_unverified
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: php
  tag: jwt
  severity: medium
  packages:
  - lcobucci/jwt
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - Validator
      - validate
  description: Disabled — Validator is the check; flag missing SignedWith constraint.
