# PHP path-traversal sinks. fopen/file_get_contents + include family.
#
# Retained bare-name rule: php.path.copy
#   `copy` is a real PHP built-in global (filesystem function); there is no
#   stdlib method `Foo::copy` that would shadow it. `top_level: true` filters
#   out userland `$collection->copy(...)` decoys. Fragile per pack-audit but
#   intentional - copy() with a tainted source or destination is a real LFI /
#   arbitrary-write primitive. Do not scope by package.
- id: php.path.fopen
  enabled: false
  disabled_reason:
    code: over-broad
  language: php
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: fopen
  description: "Disabled - canonical rule is php.ssrf.fopen_url in ssrf.yml. Same call shape; SSRF is strictly worse reach than LFI, so keep the single higher-severity rule."

- id: php.path.file_get_contents
  enabled: false
  disabled_reason:
    code: over-broad
  language: php
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: file_get_contents
  description: "Disabled - canonical rule is php.ssrf.file_get_contents_url in ssrf.yml (SSRF strictly supersedes LFI when URL wrappers are in play)."

- id: php.path.file_put_contents
  enabled: true
  language: php
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: file_put_contents
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: php.path.file_put_contents example
      code: |
        <?php
        function example($input, $url, $id, $payload, $request) {
          file_put_contents($input);
        }
    - name: arg tainted literal negative
      code: |
        <?php
        function example($input, $url, $id, $payload, $request) {
          file_put_contents("cache/report.txt", "safe");
        }
      expect_no_match: true
  description: "file_put_contents()."

