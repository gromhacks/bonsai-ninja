# PHP path-traversal sinks. fopen/file_get_contents + include family.
#
# Retained bare-name rule: php.path.copy
#   `copy` is a real PHP built-in global (filesystem function); there is no
#   stdlib method `Foo::copy` that would shadow it. `top_level: true` filters
#   out userland `$collection->copy(...)` decoys. Fragile per pack-audit but
#   intentional - copy() with a tainted source or destination is a real LFI /
#   arbitrary-write primitive. Do not scope by package.
- id: php.path.file_get_contents
  enabled: true
  language: php
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: file_get_contents
      binding_origin: runtime-global
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    guard_profile: path-consumer-containment
    path_consumer_containment_guard:
      canonicalizer: {name: realpath}
      base_canonicalizer: {name: realpath}
      path_constructor_is_string_composition: true
      containment_check: {name: str_starts_with}
      containment_check_candidate_arg_index: 0
      containment_check_base_arg_index: 1
      accepted_boundary_values:
      - {kind: string, value: "/"}
      sink_path_arg_index: 0
      path_constructor_base_arg_index: 0
      boundary_places: []
  match_examples:
  - name: dynamic local file read is a path boundary
    code: |
      <?php
      function read_document($path) {
        return file_get_contents($path);
      }
  - name: fixed local file read is not path traversal
    code: |
      <?php
      function read_banner() {
        return file_get_contents('/srv/app/banner.txt');
      }
    expect_no_match: true
  - name: namespace-local helper does not inherit the builtin boundary
    code: |
      <?php
      namespace Local;
      function file_get_contents($path) { return $path; }
      function read_document($path) {
        return file_get_contents($path);
      }
    expect_no_match: true
  description: "file_get_contents($path) reads a caller-controlled local path. This unconstrained dynamic-resource shape is classified once as path traversal."

- id: php.path.file_put_contents
  enabled: true
  language: php
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: file_put_contents
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: php.path.file_put_contents example
      code: |
        <?php
        function example($input, $url, $id, $payload, $request) {
          file_put_contents($input);
        }
    - name: arg tainted literal negative
      code: |
        <?php
        function example($input, $url, $id, $payload, $request) {
          file_put_contents("cache/report.txt", "safe");
        }
      expect_no_match: true
  description: "file_put_contents()."

