# PHP DOMXPath is a built-in class (no `use` import) and the matcher's
# lax-tail gate requires a `packages:` signal. The instance-form
# `$xpath->query($expr)` cannot be matched safely without an
# adapter-emitted import, and the literal static form
# `DOMXPath::query(...)` is unusual. Disabled until either:
#   - the matcher learns to recognise PHP built-in classes without
#     an import-time package signal, or
#   - rule constraints allow per-receiver-type narrowing.
- id: php.xpath.domxpath_query
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: php
  tag: xpath-injection
  severity: high
  cwe: [CWE-643]
  match:
    kind: call
    callee:
      attribute: [DOMXPath, query]
  description: "DOMXPath::query — disabled pending PHP built-in class recognition."

- id: php.xpath.domxpath_evaluate
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: php
  tag: xpath-injection
  severity: high
  cwe: [CWE-643]
  match:
    kind: call
    callee:
      attribute: [DOMXPath, evaluate]
  description: "DOMXPath::evaluate — disabled pending PHP built-in class recognition."
