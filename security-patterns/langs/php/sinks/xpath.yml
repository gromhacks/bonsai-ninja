# PHP DOMXPath is a built-in class (no `use` import) and the matcher's
# package context gate requires a `packages:` signal. The instance-form
# `$xpath->query($expr)` cannot be matched safely without an
# adapter-emitted import, and the literal static form
# `DOMXPath::query(...)` is unusual. Disabled until either:
#   - the matcher learns to recognise PHP built-in classes without
#     an import-time package signal, or
#   - rule constraints allow per-receiver-type narrowing.
- id: php.xpath.domxpath_query
  enabled: true
  language: php
  tag: xpath-injection
  severity: high
  cwe: [CWE-643]
  match:
    kind: call
    callee:
      name: query
  constraints:
  - receiver_type_in: [DOMXPath]
  - arg_tainted:
      index: 0
  match_examples:
  - name: domxpath query tainted
    code: |
      <?php
      function handle(DOMDocument $doc, $q) {
        $xpath = new DOMXPath($doc);
        return $xpath->query($q);
      }
    expect_match_text: ["$xpath->query"]
  - name: domxpath query literal negative
    code: |
      <?php
      function handle(DOMDocument $doc) {
        $xpath = new DOMXPath($doc);
        return $xpath->query("//user");
      }
    expect_no_match: true
  description: "DOMXPath::query(expr) - tainted XPath expression = injection; receiver-typed to a DOMXPath instance."

