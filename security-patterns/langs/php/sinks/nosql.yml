- id: php.nosql.mongo_collection_find
  enabled: true
  language: php
  tag: nosql-injection
  severity: high
  packages:
  - mongodb/mongodb
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      attribute:
      - Collection
      - find
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.nosql.mongo_collection_find example
    code: |
      <?php
      use mongodb\mongodb;
      use mongodb\mongodb;
      function example($input, $url, $id, $payload, $request) {
        Collection::find($payload);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      use mongodb\mongodb;
      function example($input, $url, $id, $payload, $request) {
        Collection::find(["status" => "active"]);
      }
    expect_no_match: true
  description: 'MongoDB\Collection::find - flag tainted filter array. Merged collision aliases: php.nosql.mongo_collection_findone, php.nosql.mongo_collection_filter_value_object.'
  aliases:
  - php.nosql.mongo_collection_findone
  - php.nosql.mongo_collection_filter_value_object
  imports:
  - mongodb\mongodb
  - mongodb
