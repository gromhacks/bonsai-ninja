- id: php.tls.allow_self_signed
  enabled: true
  language: php
  tag: weak-tls
  category: source-independent
  severity: medium
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      name: stream_context_create
      binding_origin: runtime-global
  constraints:
  - arg_aggregate_fields_equal:
      argument_index: 0
      required_fields:
      - path: [ssl, allow_self_signed]
        value: {kind: boolean, value: true}
  match_examples:
  - name: stream context accepts self-signed certificates
    code: |
      <?php
      function configure() {
        return stream_context_create(['ssl' => ['allow_self_signed' => true]]);
      }
  - name: stream context rejects self-signed certificates negative
    code: |
      <?php
      function configure() {
        return stream_context_create(['ssl' => ['allow_self_signed' => false]]);
      }
    expect_no_match: true
  - name: namespaced helper does not change stream certificate policy
    code: |
      <?php
      namespace Application;
      function stream_context_create(array $options) { return $options; }
      function configure() {
        return stream_context_create(['ssl' => ['allow_self_signed' => true]]);
      }
    expect_no_match: true
  description: "`stream_context_create` with exact nested `ssl.allow_self_signed => true` accepts untrusted certificates; compiler aggregate facts reject the secure setting."
