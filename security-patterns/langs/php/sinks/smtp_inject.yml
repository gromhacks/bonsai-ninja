- id: php.smtpinj.mail
  enabled: true
  language: php
  tag: smtp-injection
  severity: high
  cwe: [CWE-93]
  match:
    kind: call
    callee:
      name: mail
  constraints:
  - arg_tainted:
      index: 3
  match_examples:
  - name: mail with tainted additional_headers
    code: |
      <?php
      function handle($input) {
        return mail("a@x", "subject", "body", "From: " . $input);
      }
    expect_match_text: [mail]
  - name: literal headers negative
    code: |
      <?php
      function handle() {
        return mail("a@x", "subject", "body", "From: noreply@example.com");
      }
    expect_no_match: true
  description: "PHP `mail($to, $subject, $message, $additional_headers)` — CR/LF in `$additional_headers` injects new headers (CC/BCC/MIME)."
