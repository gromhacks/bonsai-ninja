- id: php.ssrf.guzzle_request
  enabled: true
  language: php
  tag: ssrf
  severity: high
  packages:
  - guzzlehttp/guzzle
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute:
      - Client
      - request
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: php.ssrf.guzzle_request example
    code: |
      <?php
      use guzzlehttp\guzzle;
      use guzzlehttp\guzzle;
      function example($input, $url, $id, $payload, $request) {
        Client::request("GET", $url);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      use guzzlehttp\guzzle;
      function example($input, $url, $id, $payload, $request) {
        Client::request("GET", "https://example.com/api");
      }
    expect_no_match: true
  description: Guzzle Client::request(method, tainted_url).
  imports:
  - guzzlehttp\guzzle
  - guzzlehttp
