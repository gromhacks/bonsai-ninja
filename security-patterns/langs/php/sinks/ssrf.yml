- id: php.ssrf.curl_exec
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: php
  tag: ssrf
  severity: high
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      name: curl_exec
  match_examples:
  - name: php.ssrf.curl_exec example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  curl_exec($input);\n}\n"
  description: "Disabled — curl_exec() dispatches URL stored on the curl handle; php.ssrf.curl_setopt_url carries the tainted URL argument."
- id: php.ssrf.curl_setopt_url
  enabled: true
  language: php
  tag: ssrf
  severity: high
  cwe:
  - CWE-918
  - CWE-295
  match:
    kind: call
    callee:
      name: curl_setopt
  constraints:
  - arg_matches_regex:
      index: 1
      regex: ^CURLOPT_URL$
  - arg_tainted:
      index: 2
  match_examples:
  - name: php.ssrf.curl_setopt_url example
    code: "<?php\nfunction example($ch, $url, $id, $payload, $request) {\n  curl_setopt($ch, CURLOPT_URL, $url);\n}\n"
  - name: curl setopt literal url negative
    code: "<?php\nfunction example($ch, $url) {\n  curl_setopt($ch, CURLOPT_URL, \"https://example.com/\");\n}\n"
    expect_no_match: true
  description: 'curl_setopt CURLOPT_URL = tainted. Merged aliases: php.tls.curl_ssl_verifypeer_off, php.tls.curl_ssl_verifyhost_off.'
  aliases:
  - php.tls.curl_ssl_verifypeer_off
  - php.tls.curl_ssl_verifyhost_off
