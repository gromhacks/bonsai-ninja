- id: php.ssrf.curl_setopt_url
  enabled: true
  language: php
  tag: ssrf
  severity: high
  cwe:
  - CWE-918
  - CWE-295
  analysis_semantics:
    compiler_guard:
      capability: terminal-predicate.compound-static-allowlist
      required_evidence:
      - guarded-argument:2=predicate-argument:0
      - predicate-complete:true
      - finite-static-string-membership:true
      - parser-call:parse_url
      - scheme-component:scheme
      - scheme-value:string:https
      - membership-call:in_array
      - membership-component:host
      - membership-argument:2=boolean:true
      - related-call:curl_setopt:argument:0=guarded-argument:0
      - related-call:curl_setopt:argument:1=place:CURLOPT_FOLLOWLOCATION
      - related-call:curl_setopt:argument:2=boolean:false
      sanitizer_tag: ssrf
      category: finite-host-allowlist-and-no-redirect
  match:
    kind: call
    callee:
      name: curl_setopt
  constraints:
  - arg_matches_regex:
      index: 1
      regex: ^CURLOPT_URL$
  - arg_tainted:
      index: 2
  match_examples:
  - name: php.ssrf.curl_setopt_url example
    code: "<?php\nfunction example($ch, $url, $id, $payload, $request) {\n  curl_setopt($ch, CURLOPT_URL, $url);\n}\n"
  - name: curl setopt literal url negative
    code: "<?php\nfunction example($ch, $url) {\n  curl_setopt($ch, CURLOPT_URL, \"https://example.com/\");\n}\n"
    expect_no_match: true
  description: 'curl_setopt CURLOPT_URL = tainted. TLS verification options are independent configuration targets.'
