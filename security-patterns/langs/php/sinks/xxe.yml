# PHP XXE sinks.
- id: php.xxe.simplexml_load_string
  enabled: true
  language: php
  tag: xxe
  severity: high
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      name: simplexml_load_string
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: php.xxe.simplexml_load_string example
      code: |
        <?php
        function example($input, $url, $id, $payload, $request) {
          simplexml_load_string($input);
        }
    - name: arg tainted literal negative
      code: |
        <?php
        function example($input, $url, $id, $payload, $request) {
          simplexml_load_string("<root/>");
        }
      expect_no_match: true
  description: "simplexml_load_string — flag if LIBXML_NOENT or LIBXML_DTDLOAD set."

