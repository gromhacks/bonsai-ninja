- id: php.redos.preg_match
  enabled: true
  language: php
  tag: redos
  severity: medium
  cwe: [CWE-1333]
  match:
    kind: call
    callee:
      name: preg_match
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: preg_match tainted pattern
    code: |
      <?php
      function example($pattern) {
        return preg_match($pattern, "aaaaaaaaaaaaaaaa!");
      }
  - name: preg_match literal pattern negative
    code: |
      <?php
      function example($subject) {
        return preg_match('/^[a-z]+$/', $subject);
      }
    expect_no_match: true
  description: "preg_match(tainted_pattern, subject) - attacker-controlled PCRE patterns can trigger catastrophic backtracking."

