- id: php.xss.echo
  enabled: true
  language: php
  tag: xss
  severity: medium
  cwe:
  - CWE-79
  analysis_semantics:
    flow_classes: [browser-output]
  match:
    kind: call
    callee:
      name: echo
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.xss.echo example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  echo $payload;\n}\n"
  - name: arg tainted literal negative
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  echo \"safe\";\n}\n"
    expect_no_match: true
  description: echo(tainted) - direct HTML output to response body. Constraint requires interp (`$var`) or concat (`.`) shape so plain literal echos are skipped; the taint engine is the second gate.
- id: php.xss.psr7_response_body_write
  enabled: true
  language: php
  tag: xss
  severity: high
  packages: [psr/http-message, slim/slim, laminas/laminas-diactoros, mezzio/mezzio]
  cwe: [CWE-79]
  match:
    kind: call
    callee:
      regex: '^\$?[A-Za-z_][A-Za-z0-9_]*->getBody\(\)\.write$'
      receiver_type_in: [ResponseInterface]
  constraints:
  - arg_tainted:
      index: 0
  - arg_matches_regex:
      index: 0
      regex: '<'
  match_examples:
  - name: PSR-7 HTML response body write
    code: |
      <?php
      use Psr\Http\Message\ResponseInterface as Outgoing;
      function respond($input, Outgoing $response) {
        $response->getBody()->write("<h1>{$input}</h1>");
      }
    expect_match_text: ['$response->getBody().write']
  - name: literal PSR-7 response body is not XSS
    code: |
      <?php
      use Psr\Http\Message\ResponseInterface as Outgoing;
      function respond(Outgoing $response) {
        $response->getBody()->write('<h1>ready</h1>');
      }
    expect_no_match: true
  - name: unrelated stream body writer is not a PSR-7 response
    code: |
      <?php
      class Buffer { function getBody() { return $this; } function write($x) {} }
      function respond($input, Buffer $buffer) { $buffer->getBody()->write($input); }
    expect_no_match: true
  - name: encoded JSON response body is not HTML
    code: |
      <?php
      use Psr\Http\Message\ResponseInterface as Outgoing;
      function respond($input, Outgoing $response) {
        $response->getBody()->write(json_encode($input));
      }
    expect_no_match: true
  description: "PSR-7 ResponseInterface body stream write of tainted markup; exact imported response typing distinguishes inbound/outbound message bodies and arbitrary stream builders."
  imports: [Psr, Psr\Http\Message]
- id: php.xss.twig_markup
  enabled: true
  language: php
  tag: xss
  severity: high
  packages:
  - twig/twig
  cwe:
  - CWE-79
  match:
    kind: new
    callee:
      name: Markup
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.xss.twig_markup example
    code: |
      <?php
      use twig\twig;
      function example($input, $url, $id, $payload, $request) {
        new Markup($input);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      use twig\twig;
      function example($input, $url, $id, $payload, $request) {
        new Markup("safe");
      }
    expect_no_match: true
  description: new \Twig\Markup(tainted) - bypasses autoescape.
  imports:
  - twig\twig
  - twig
