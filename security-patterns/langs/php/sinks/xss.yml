- id: php.xss.twig_markup
  enabled: true
  language: php
  tag: xss
  severity: high
  packages:
  - twig/twig
  cwe:
  - CWE-79
  match:
    kind: new
    callee:
      name: Markup
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.xss.twig_markup example
    code: |
      <?php
      use twig\twig;
      use twig\twig;
      function example($input, $url, $id, $payload, $request) {
        new Markup($input);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      use twig\twig;
      function example($input, $url, $id, $payload, $request) {
        new Markup("safe");
      }
    expect_no_match: true
  description: new \Twig\Markup(tainted) - bypasses autoescape.
  imports:
  - twig\twig
  - twig
