- id: php.template.twig_create_template
  enabled: true
  language: php
  tag: ssti
  severity: critical
  packages:
  - twig/twig
  cwe:
  - CWE-94
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - Environment
      - createTemplate
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.template.twig_create_template example
    code: |
      <?php
      use twig\twig;
      use twig\twig;
      function example($input, $url, $id, $payload, $request) {
        Environment::createTemplate($input);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      use twig\twig;
      function example($input, $url, $id, $payload, $request) {
        Environment::createTemplate("Hello user");
      }
    expect_no_match: true
  description: Twig Environment::createTemplate(tainted) - full SSTI.
  imports:
  - twig\twig
  - twig
