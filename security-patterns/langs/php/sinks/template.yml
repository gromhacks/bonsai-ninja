- id: php.template.twig_environment_autoescape_off
  enabled: true
  language: php
  tag: xss
  category: source-independent
  severity: high
  packages:
  - twig
  cwe:
  - CWE-79
  match:
    kind: new
    callee:
      attribute:
      - Twig
      - Environment
  match_examples:
  - name: php.template.twig_environment_autoescape_off example
    code: |
      <?php
      use twig;
      use twig;
      function example($input, $url, $id, $payload, $request) {
        new Twig\Environment(['autoescape' => false]);
      }
  description: new Twig\Environment($loader, ['autoescape' => false]) - global autoescape off.
