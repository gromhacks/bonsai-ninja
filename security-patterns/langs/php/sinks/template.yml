        $smarty->escape_html = false;;
      }
  description: $smarty->escape_html = false - disables HTML autoescape on output.

- id: php.template.twig_environment_array_loader
  enabled: true
  language: php
  tag: ssti
  severity: critical
  packages:
  - twig/twig
  imports:
  - twig\twig
  - twig
  cwe:
  - CWE-94
  - CWE-1336
  match:
    kind: new
    callee:
      attribute:
      - Twig
      - Loader
      - ArrayLoader
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: twig array loader tainted template
    code: |
      <?php
      use twig\twig;
      function example($input) {
        new Twig\Loader\ArrayLoader(['index' => $input]);
      }
    expect_match_text: ["Twig\\Loader\\ArrayLoader"]
  - name: twig array loader literal negative
    code: |
      <?php
      use twig\twig;
      function example() {
        new Twig\Loader\ArrayLoader(['index' => 'Hello {{ name }}']);
      }
    expect_no_match: true
  description: "new Twig\\Loader\\ArrayLoader([name => tainted_source]) - registers attacker-controlled template source; downstream Environment::render(name) compiles and executes it as Twig."

- id: php.template.latte_render_to_string
