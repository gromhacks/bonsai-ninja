- id: php.llm.openai_chat_create
  enabled: true
  language: php
  tag: web-llm
  severity: medium
  packages:
  - openai-php/client
  cwe:
  - CWE-20
  - CWE-94
  match:
    kind: call
    callee:
      attribute:
      - client
      - chat
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: openai chat create
    code: |
      <?php
      use openaiphp\client;
      use openaiphp\client;
      use openai-php\client;
      function example($client, $input) {
        return $client->chat($input);
      }
    expect_match_text:
    - $client->chat
  - name: arg tainted literal negative
    code: |
      <?php
      use openaiphp\client;
      function example($client, $input) {
        return $client->chat(["messages" => [["role" => "user", "content" => "hello"]]]);
      }
    expect_no_match: true
  description: OpenAI client chat request — tainted prompt/tool content reaches an LLM instruction surface.
  imports:
  - openaiphp
  - openaiphp/client
  - openaiphp\client
