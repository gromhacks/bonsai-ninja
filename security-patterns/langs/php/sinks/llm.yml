        return $bedrock->invokeModel(["body" => "{}"]);
      }
    expect_no_match: true
  description: Bedrock invokeModel — tainted model body reaches a foundation-model execution surface.
  imports:
  - aws
  - aws/awssdkphp
  - aws\awssdkphp
