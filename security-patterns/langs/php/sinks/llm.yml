- id: php.llm.bedrock_invoke_model
  enabled: true
  language: php
  tag: web-llm
  severity: medium
  packages:
  - aws/aws-sdk-php
  cwe:
  - CWE-20
  - CWE-200
  match:
    kind: call
    callee:
      attribute:
      - bedrock
      - invokeModel
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: bedrock invoke model
    code: |
      <?php
      use aws\awssdkphp;
      use aws\awssdkphp;
      use aws\aws-sdk-php;
      function example($bedrock, $input) {
        return $bedrock->invokeModel($input);
      }
    expect_match_text:
