- id: php.crypto.md5
  enabled: true
  language: php
  tag: weak-crypto
  category: source-independent
  severity: low
  cwe:
  - CWE-327
  - CWE-328
  match:
    kind: call
    callee:
      name: md5
  match_examples:
  - name: php.crypto.md5 example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  md5($input);\n}\n"
  description: "md5() - broken hash."
- id: php.crypto.md5_file
  enabled: true
  language: php
  tag: weak-crypto
  category: source-independent
  severity: low
  cwe:
  - CWE-327
  match:
    kind: call
