      name: mcrypt_encrypt
  match_examples:
  - name: php.crypto.mcrypt_encrypt example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  mcrypt_encrypt($input);\n}\n"
  description: "mcrypt_encrypt - removed PHP 7.2; legacy code is broken."
- id: php.crypto.openssl_encrypt_ecb
  enabled: true
  language: php
  tag: weak-crypto
  category: source-independent
  severity: high
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      name: openssl_encrypt
  constraints:
  - arg_matches_regex:
      index: 1
      regex: '(?i)^(?:"|\x27)(?:des(?:-[a-z0-9-]+)?|des-ede3(?:-[a-z0-9-]+)?|rc2(?:-[a-z0-9-]+)?|rc4|bf(?:-[a-z0-9-]+)?|[a-z0-9-]+-ecb)(?:"|\x27)$'
  match_examples:
  - name: OpenSSL ECB encryption
    code: |
      <?php
      function encrypt_legacy($input, $key) {
        return openssl_encrypt($input, "AES-128-ECB", $key);
      }
  - name: OpenSSL authenticated encryption negative
    code: |
      <?php
      function encrypt_modern($input, $key, $iv, &$tag) {
        return openssl_encrypt($input, "AES-256-GCM", $key, 0, $iv, $tag);
      }
    expect_no_match: true
  - name: OpenSSL CBC encryption negative
    code: |
      <?php
      function encrypt_cbc($input, $key, $iv) {
        return openssl_encrypt($input, "AES-256-CBC", $key, 0, $iv);
      }
    expect_no_match: true
  description: 'openssl_encrypt with an exact weak cipher or ECB algorithm is insecure; authenticated/non-ECB algorithms stay quiet. Merged aliases: php.crypto.openssl_encrypt_ecb_256.'
  aliases:
  - php.crypto.openssl_encrypt_ecb_256
- id: php.crypto.rand
  enabled: true
  language: php
  tag: weak-randomness
  category: source-independent
  severity: low
  cwe:
  - CWE-338
  match:
    kind: call
    callee:
      name: rand
  match_examples:
  - name: php.crypto.rand example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  rand($input);\n}\n"
