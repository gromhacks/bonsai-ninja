- id: php.crypto.crypt_des
  enabled: true
  language: php
  tag: weak-crypto
  category: source-independent
  severity: high
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      name: crypt
  constraints:
  - arg_matches_regex:
      index: 1
      regex: '^(?:"|\x27)[./0-9A-Za-z]{2}(?:"|\x27)$'
  match_examples:
  - name: classic DES crypt salt
    code: |
      <?php
      function legacy_hash($password) {
        return crypt($password, "ab");
      }
  - name: bcrypt crypt salt negative
    code: |
      <?php
      function modern_hash($password) {
        return crypt($password, '$2y$12$usesomesillystringforsalt$');
      }
    expect_no_match: true
  - name: dynamic crypt salt negative
    code: |
      <?php
      function configurable_hash($password, $salt) {
        return crypt($password, $salt);
      }
    expect_no_match: true
  description: "`crypt` with an exact two-character traditional DES salt selects the obsolete DES variant; modern modular salt prefixes and dynamic salts stay quiet."
- id: php.crypto.mcrypt_encrypt
  enabled: true
