- id: php.cors.allow_origin_wildcard_header
  enabled: true
  language: php
  tag: cors
  category: source-independent
  severity: high
  cwe:
  - CWE-942
  - CWE-113
  - CWE-444
  match:
    kind: call
    callee:
      regex: ^header$
  constraints:
  - arg_matches_regex:
      index: 0
      regex: 'Access-Control-Allow-Origin:\s*\*'
  match_examples:
  - name: php.cors.allow_origin_wildcard_header example
    code: |
      <?php
      use illuminate\http;
      use illuminate\http;
      function example($input, $url, $id, $payload, $request) {
        header("Access-Control-Allow-Origin: *");
      }
  - name: php.cors.allow_origin_wildcard_header content type negative
    code: |
      <?php
      use illuminate\http;
      function example($input, $url, $id, $payload, $request) {
        header("Content-Type: application/json");
      }
    expect_no_match: true
  description: 'header(''Access-Control-Allow-Origin: *'') - explicit wildcard CORS via header(). The arg_matches_regex gate keeps this off ordinary header() calls (Content-Type, Location, etc.) and fires only on the wildcard ACAO shape. Merged aliases: php.header.builtin, php.smuggle.header_dual_cl_te.'
  aliases:
  - php.header.builtin
  - php.smuggle.header_dual_cl_te
  - php.header.laravel_response_header
  packages:
  - illuminate/http
  imports:
  - illuminate\http
  - illuminate
