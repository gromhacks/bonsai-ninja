- id: php.ldap.ldap_search
  enabled: true
  language: php
  tag: ldap-injection
  severity: high
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      name: ldap_search
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: php.ldap.ldap_search example
    code: "<?php\nfunction example($ldap, $base, $input, $url, $id, $payload, $request) {\n  ldap_search($ldap, $base, $input);\n}\n"
  - name: arg tainted literal negative
    code: "<?php\nfunction example($ldap, $base, $input, $url, $id, $payload, $request) {\n  ldap_search($ldap, $base, \"(uid=alice)\");\n}\n"
    expect_no_match: true
  description: ldap_search() with tainted filter.
- id: php.ldap.ldap_list
  enabled: true
  language: php
  tag: ldap-injection
  severity: high
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      name: ldap_list
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: php.ldap.ldap_list example
    code: "<?php\nfunction example($ldap, $base, $input, $url, $id, $payload, $request) {\n  ldap_list($ldap, $base, $input);\n}\n"
  - name: arg tainted literal negative
    code: "<?php\nfunction example($ldap, $base, $input, $url, $id, $payload, $request) {\n  ldap_list($ldap, $base, \"(objectClass=person)\");\n}\n"
    expect_no_match: true
  description: ldap_list() — one-level LDAP search; tainted filter string allows LDAP injection and information disclosure.
