- id: php.ldap.ldap_bind
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: php
  tag: ldap-injection
  severity: medium
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      name: ldap_bind
  description: Disabled — bind is auth; flag DN-injection with constraint.
- id: php.ldap.symfony_ldap_search
  enabled: true
  language: php
  tag: ldap-injection
  severity: high
  packages:
  - symfony/ldap
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - Ldap
      - query
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: php.ldap.symfony_ldap_search example
    code: |
      <?php
      use symfony\ldap;
      use symfony\ldap;
      function example($input, $url, $id, $payload, $request) {
        Ldap::query("dc=example,dc=com", $input);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      use symfony\ldap;
      function example($input, $url, $id, $payload, $request) {
        Ldap::query("dc=example,dc=com", "(uid=alice)");
      }
    expect_no_match: true
  description: Symfony Ldap component Ldap::query — flag tainted DSL.
  imports:
  - symfony\ldap
  - symfony
- id: php.ldap.anonymous_bind_null_password
  enabled: true
  language: php
  tag: auth-bypass
  category: source-independent
  severity: medium
  cwe:
  - CWE-287
  match:
    kind: call
    callee:
      name: ldap_bind
  match_examples:
  - name: php.ldap.anonymous_bind_null_password example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  ldap_bind($input, \"cn=admin,dc=example,dc=com\", NULL);\n}\n"
    expect_match_text:
    - ldap_bind
  - name: php.ldap.anonymous_bind_empty_password example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  ldap_bind($input, \"cn=admin,dc=example,dc=com\", '');\n}\n"
    expect_match_text:
    - ldap_bind
  description: ldap_bind with NULL or empty password can create an anonymous LDAP bind instead of enforcing authentication.
