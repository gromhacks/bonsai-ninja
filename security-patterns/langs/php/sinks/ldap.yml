  - arg_tainted:
      index: 1
  match_examples:
  - name: php.ldap.ldap_modify dn example
    code: "<?php\nfunction example($ldap, $input, $entry, $url, $id, $payload, $request) {\n  ldap_modify($ldap, $input, $entry);\n}\n"
  - name: php.ldap.ldap_modify dn literal negative
    code: "<?php\nfunction example($ldap, $input, $entry, $url, $id, $payload, $request) {\n  ldap_modify($ldap, \"uid=alice,dc=example,dc=com\", $entry);\n}\n"
    expect_no_match: true
  description: "ldap_modify($ldap, tainted_dn, entry) — tainted DN allows unauthorized directory writes."
