- id: php.deser.symfony_yaml_parse_object
  enabled: true
  language: php
  tag: insecure-deserialization
  severity: high
  packages:
  - symfony/yaml
  cwe:
  - CWE-502
  match:
    kind: call
    callee:
      attribute:
      - Yaml
      - parse
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.deser.symfony_yaml_parse_object example
    code: |
      <?php
      use symfony\yaml;
      use symfony\yaml;
      function example($input, $url, $id, $payload, $request) {
        Yaml::parse($input, $input, flags: Yaml::PARSE_OBJECT);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      use symfony\yaml;
      function example($input, $url, $id, $payload, $request) {
        Yaml::parse("safe: true", flags: Yaml::PARSE_OBJECT);
      }
    expect_no_match: true
  description: Symfony Yaml::parse with PARSE_OBJECT.
  imports:
  - symfony\yaml
  - symfony
