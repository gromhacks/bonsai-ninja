- id: php.deser.unserialize
  enabled: true
  language: php
  tag: insecure-deserialization
  severity: critical
  cwe:
  - CWE-502
  match:
    kind: call
    callee:
      name: unserialize
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.deser.unserialize example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  unserialize($input);\n}\n"
  - name: arg tainted literal negative
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  unserialize('a:0:{}');\n}\n"
    expect_no_match: true
  description: unserialize() — POP-chain RCE via __wakeup / __destruct.
