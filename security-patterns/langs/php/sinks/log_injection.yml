- id: php.log_injection.logger_info_concat
  enabled: true
  language: php
  tag: log-injection
  severity: medium
  cwe:
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - logger
      - info
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.log_injection.logger_info_concat example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  $logger->info(\"bad\" . $payload);\n}\n"
  - name: arg tainted literal negative
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  $logger->info(\"safe\");\n}\n"
    expect_no_match: true
  description: "$logger->info(\"...\" . $tainted) - log-injection via concat (Monolog / PSR-3)."
