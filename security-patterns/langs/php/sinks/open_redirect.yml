- id: php.open_redirect.header_location
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: php
  tag: open-redirect
  severity: high
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      name: header
  description: 'Disabled - header("Location: $url") is the canonical sink, but constraint requires literal-prefix detection.'
- id: php.open_redirect.symfony_redirect
  enabled: true
  language: php
  tag: open-redirect
  severity: high
  packages:
  - symfony/http-foundation
  cwe:
  - CWE-601
  match:
    kind: new
    callee:
      name: RedirectResponse
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.open_redirect.symfony_redirect example
    code: |
      <?php
      use symfony\httpfoundation;
      use symfony\httpfoundation;
      use symfony\http-foundation;
      function example($input, $url, $id, $payload, $request) {
        new RedirectResponse($url);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      use symfony\httpfoundation;
      function example($input, $url, $id, $payload, $request) {
        new RedirectResponse("/dashboard");
      }
    expect_no_match: true
  description: Symfony RedirectResponse(tainted).
  imports:
  - symfony
  - symfony/httpfoundation
  - symfony\httpfoundation
- id: php.open_redirect.laravel_redirect_to
  enabled: true
  language: php
  tag: open-redirect
  severity: high
  packages:
  - illuminate/routing
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - Redirect
      - to
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.open_redirect.laravel_redirect_to example
    code: |
      <?php
      use illuminate\routing;
      use illuminate\routing;
      function example($input, $url, $id, $payload, $request) {
        $input = $_GET['next'];
        Redirect::to($input);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      use illuminate\routing;
      function example($input, $url, $id, $payload, $request) {
        Redirect::to("/dashboard");
      }
    expect_no_match: true
  description: Laravel Redirect::to(tainted).
  imports:
  - illuminate\routing
  - illuminate
