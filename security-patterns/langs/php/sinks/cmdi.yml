- id: php.cmdi.system
  enabled: true
  language: php
  tag: command-injection
  severity: critical
  category: process-exec
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      name: system
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.cmdi.system example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  system($input);\n}\n"
  - name: arg tainted literal negative
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  system(\"safe\");\n}\n"
    expect_no_match: true
  description: system() - runs command via shell.
- id: php.cmdi.exec
  enabled: true
  language: php
  tag: command-injection
  severity: critical
  category: process-exec
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      regex: ^exec$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.cmdi.exec example
    code: |
      <?php
      function example($input, $url, $id, $payload, $request) {
        exec($input);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      function example($input, $url, $id, $payload, $request) {
        exec("safe");
      }
    expect_no_match: true
  description: 'exec() - PHP builtin shell command execution; attacker-controlled argv concatenation lets the attacker execute arbitrary commands as the web-server user.'
