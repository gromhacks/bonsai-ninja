- id: php.cmdi.mb_send_mail_params
  enabled: true
  language: php
  tag: command-injection
  severity: high
  category: process-exec
  cwe:
  - CWE-78
  - CWE-88
  match:
    kind: call
    callee:
      name: mb_send_mail
  constraints:
  - arg_tainted:
      index: 4
  match_examples:
  - name: php.cmdi.mb_send_mail_params example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  mb_send_mail('to@example.com', 'subject', 'body', 'From: noreply@example.com', $input);\n}\n"
  - name: arg tainted literal negative
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  mb_send_mail('to@example.com', 'subject', 'body', 'From: noreply@example.com', '-f noreply@example.com');\n}\n"
    expect_no_match: true
  description: mb_send_mail - 5th arg (additional_params) goes to sendmail shell; tainted -> RCE.
