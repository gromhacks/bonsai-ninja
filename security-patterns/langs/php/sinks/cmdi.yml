- id: php.cmdi.symfony_process_from_shell_commandline
  enabled: true
  language: php
  tag: command-injection
  severity: critical
  category: process-exec
  packages:
  - symfony/process
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      attribute:
      - Process
      - fromShellCommandline
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.cmdi.symfony_process_from_shell_commandline example
    code: |
      <?php
      use symfony\process;
      use symfony\process;
      function example($input, $url, $id, $payload, $request) {
        Process::fromShellCommandline($input);
      }
  - name: arg tainted literal negative
    code: |
      <?php
      use symfony\process;
      function example($input, $url, $id, $payload, $request) {
        Process::fromShellCommandline("php bin/console cache:clear");
      }
    expect_no_match: true
  description: Symfony Process::fromShellCommandline - explicitly shell-evaluated.
  imports:
  - symfony\process
  - symfony
- id: php.cmdi.symfony_process_new
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: php
  tag: command-injection
  severity: medium
  category: process-exec
  packages:
  - symfony/process
  cwe:
  - CWE-78
  match:
    kind: new
    callee:
      name: Process
  description: Disabled - Process(array) is safe; flag only when string command.
- id: php.cmdi.backtick_exec
