- id: php.eval.builtin_eval
  enabled: true
  language: php
  tag: code-injection
  severity: critical
  cwe:
  - CWE-94
  - CWE-943
  match:
    kind: call
    callee:
      regex: ^eval$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.eval.builtin_eval example
    code: |
      <?php
      use predis\predis;
      use predis\predis;
      function example($input, $url, $id, $payload, $request) {
        eval($input);
      }
  - name: literal eval negative
    code: |
      <?php
      use predis\predis;
      function example() {
        eval("return 1;");
      }
    expect_no_match: true
  description: 'eval() - arbitrary PHP code. Merged collision aliases: php.nosql.redis_eval.'
  aliases:
  - php.nosql.redis_eval
  packages:
  - predis/predis
  imports:
  - predis\predis
  - predis
- id: php.eval.assert_string
  enabled: true
  language: php
  tag: code-injection
  severity: critical
  cwe:
  - CWE-94
  match:
    kind: call
    callee:
      name: assert
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.eval.assert_string example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  assert($input);\n}\n"
  - name: arg tainted literal negative
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  assert(\"1 === 1\");\n}\n"
    expect_no_match: true
  description: assert(string) - pre-PHP-8 evaluates as code.
- id: php.eval.create_function
  enabled: true
  language: php
  tag: code-injection
  severity: critical
  cwe:
  - CWE-94
  match:
    kind: call
    callee:
      name: create_function
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: php.eval.create_function example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  create_function('$x', $input);\n}\n"
  - name: arg tainted literal negative
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  create_function('$x', 'return $x;');\n}\n"
    expect_no_match: true
  description: create_function - removed in PHP 8 but legacy code persists.
- id: php.eval.preg_replace_e
  enabled: true
  language: php
  tag: code-injection
  severity: critical
  cwe:
  - CWE-94
  match:
    kind: call
    callee:
      name: preg_replace
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: php.eval.preg_replace_e example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  preg_replace(\"/x/e\", $payload, \"x\");\n}\n"
  - name: arg tainted literal negative
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  preg_replace(\"/x/e\", \"safe\", \"x\");\n}\n"
    expect_no_match: true
  description: preg_replace() with /e (PREG_REPLACE_EVAL) modifier - replacement string is eval()'d as PHP code. Removed in PHP 7 but still appears in legacy code paths and PHP <7 deployments. Constraint matches a quoted regex literal whose trailing modifier flags include `e`.
- id: php.eval.preg_replace_callback
