    callee:
      name: preg_replace_callback
  description: Disabled - callback variant is safe unless callback tainted.
- id: php.eval.include_tainted
  enabled: true
  language: php
  tag: code-injection
  severity: critical
  cwe:
  - CWE-94
  - CWE-98
  match:
    kind: call
    callee:
      name: include
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: php.eval.include_tainted example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  include $input;\n}\n"
  - name: arg tainted literal negative
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  include \"safe.php\";\n}\n"
    expect_no_match: true
  description: 'include(tainted) - LFI/RFI = RCE. Limitation: PHP parses include/require as include_expression AST nodes, not function calls; adapter must surface these as calls for this rule to fire. `top_level: true` excludes any `$obj->include(...)` userland method decoys.'
