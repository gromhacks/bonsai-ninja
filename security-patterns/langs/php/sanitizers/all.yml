  match_examples:
  - name: php.sanitizer.openssl_random_pseudo_bytes_strong example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  openssl_random_pseudo_bytes($input);\n}\n"
    expect_match_text:
    - openssl_random_pseudo_bytes
  description: openssl_random_pseudo_bytes() - CSPRNG bytes. The 2nd by-ref parameter `$crypto_strong` returns true when OpenSSL
    used a cryptographically strong RNG; callers must check it before using the output for crypto. The bare-call match here
    is the source-visible site; the by-ref-check is enforced as a manual review item.
- id: php.sanitizer.pdo_quote_value
