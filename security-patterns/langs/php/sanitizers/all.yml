      name: filter_var
  constraints:
  - arg_equals:
      index: 1
      value: FILTER_VALIDATE_INT
  description: "Disabled duplicate - php.sanitizer.filter_var_validate_int is the enabled constrained FILTER_VALIDATE_INT
    rule with examples."
- id: php.sanitizer.htmlspecialchars_ent_quotes
  enabled: true
  language: php
  tag: html-encode
  match:
    kind: call
    callee:
      name: htmlspecialchars
  constraints:
  - arg_equals:
      index: 1
      value: ENT_QUOTES
  match_examples:
  - name: php.sanitizer.htmlspecialchars_ent_quotes example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  htmlspecialchars($input, ENT_QUOTES);\n}\n"
    expect_match_text:
    - htmlspecialchars
  - name: php.sanitizer.htmlspecialchars_ent_quotes example negative constraint boundary
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  htmlspecialchars();\n}\n"
    expect_no_match: true
  description: htmlspecialchars(..., ENT_QUOTES) - encodes both single and double quotes, making output safe for double- AND
    single-quoted attribute contexts. Without ENT_QUOTES the default (ENT_HTML401|ENT_QUOTES varies by PHP version; in <8.1
    single quotes were not escaped) leaves single-quoted attribute injection possible, so this constrained variant is a stronger
    sanitizer than the bare-name rule above.
- id: php.sanitizer.htmlentities_ent_quotes
  enabled: true
  language: php
  tag: html-encode
  match:
    kind: call
    callee:
      name: htmlentities
  constraints:
  - arg_equals:
      index: 1
      value: ENT_QUOTES
  match_examples:
  - name: php.sanitizer.htmlentities_ent_quotes example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  htmlentities($input, ENT_QUOTES);\n}\n"
    expect_match_text:
    - htmlentities
  - name: php.sanitizer.htmlentities_ent_quotes example negative constraint boundary
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  htmlentities();\n}\n"
    expect_no_match: true
  description: 'htmlentities(..., ENT_QUOTES) - same rationale as htmlspecialchars_ent_quotes: only the ENT_QUOTES variant
    is safe for single-quoted attribute contexts.'
