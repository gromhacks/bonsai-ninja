  match_examples:
  - name: php.sanitizer.array_key_exists_allowlist example
    code: "<?php\nfunction example($role) {\n  array_key_exists($role, $allowedRoles);\n}\n"
    expect_match_text:
    - array_key_exists
  - name: php.sanitizer.array_key_exists_allowlist example negative constraint boundary
    code: "<?php\nfunction example($role) {\n  array_key_exists();\n}\n"
    expect_no_match: true
  description: Disabled - this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
