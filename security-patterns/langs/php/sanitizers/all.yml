  disabled_reason:
    code: over-broad
  language: php
  tag: sql-parameter
  match:
    kind: call
    callee:
      name: addslashes
  description: "Disabled - addslashes is a naive string escape and is not database-charset-aware; it can leave SQL injection
    exploitable under multibyte encodings or non-string SQL contexts."
