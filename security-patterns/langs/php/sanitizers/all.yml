    code: "<?php\nfunction example($role) {\n  in_array($role, ['user', 'admin'], true);\n}\n"
    expect_match_text:
    - in_array
  - name: php.sanitizer.in_array_strict_allowlist example negative constraint boundary
    code: "<?php\nfunction example($role) {\n  in_array();\n}\n"
    expect_no_match: true
  description: in_array($value, $allowed, true) - strict enum allowlist check; third argument avoids PHP loose-comparison
    bypasses.
- id: php.sanitizer.array_key_exists_allowlist
  enabled: false
  language: php
  tag: allowlist-validate
  match:
