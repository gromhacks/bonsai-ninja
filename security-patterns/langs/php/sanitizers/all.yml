- id: php.sanitizer.htmlspecialchars
  enabled: true
  language: php
  tag: html-encode
  match:
    kind: call
    callee:
      name: htmlspecialchars
  constraints:
  - max_args: 1
  match_examples:
  - name: php.sanitizer.htmlspecialchars example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  htmlspecialchars($input);\n}\n"
    expect_match_text:
    - htmlspecialchars
  description: htmlspecialchars - entity-encodes <>&"'.
