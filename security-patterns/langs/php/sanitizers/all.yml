  match:
    kind: call
    callee:
      attribute:
      - PDO
      - quote
  description: Disabled - PDO::quote is a partial escape helper and v1 matching cannot prove it is used only for value literals;
    prefer prepared statements.
- id: php.sanitizer.addslashes
