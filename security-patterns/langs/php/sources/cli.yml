- id: php.source.argv
  enabled: true
  language: php
  tag: cli-input
  trust: local
  analysis_semantics:
    flow_classes: [process-input]
  match:
    kind: read
    target:
      name: argv
  match_examples:
  - name: php.source.argv example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  $value = $argv;;\n}\n"
  description: $argv - CLI arguments.
- id: php.source.argc_read
  enabled: false
  disabled_reason:
    code: over-broad
  language: php
  tag: cli-input
  trust: local
  match:
    kind: read
    target:
      name: argc
  description: Disabled - argc is a count, not a string source.
- id: php.source.stdin_fopen
  enabled: true
  language: php
  tag: cli-input
  trust: local
  match:
    kind: call
    callee:
      name: fopen
  constraints:
  - arg_equals:
      index: 0
      value: '"php://stdin"'
  match_examples:
  - name: php.source.stdin_fopen example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  fopen(\"php://stdin\");\n}\n"
  - name: php.source.stdin_fopen example negative constraint boundary
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  fopen();\n}\n"
    expect_no_match: true
  description: fopen('php://stdin', 'r') - reads CLI stdin.
- id: php.source.stdin_file_get_contents
  enabled: true
  language: php
  tag: cli-input
  trust: local
  match:
    kind: call
    callee:
      name: file_get_contents
  constraints:
  - arg_equals:
      index: 0
      value: '"php://stdin"'
  match_examples:
  - name: php.source.stdin_file_get_contents example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  file_get_contents(\"php://stdin\");\n}\n"
  - name: php.source.stdin_file_get_contents example negative constraint boundary
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  file_get_contents();\n}\n"
    expect_no_match: true
  description: file_get_contents('php://stdin').
- id: php.source.getenv
  enabled: true
  language: php
  tag: env-input
  trust: local
  payload_types: [text]
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: call
    callee:
      name: getenv
  match_examples:
  - name: getenv source
    code: "<?php\nfunction example() {\n  return getenv('HOME');\n}\n"
    expect_match_text: [getenv]
  description: getenv(name) - process environment value; local trust but attacker-controlled through shells, service managers, CI, and container configuration.
- id: php.source.env_super
  enabled: true
  language: php
  tag: env-input
  trust: local
  payload_types: [text]
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: read
    target:
      name: _ENV
  match_examples:
  - name: env superglobal
    code: "<?php\nfunction example() {\n  return $_ENV;\n}\n"
    expect_match_text: [_ENV]
  description: $_ENV - environment superglobal; local trust but attacker-controlled through the process environment.
- id: php.source.readline
  enabled: true
  language: php
  tag: cli-input
  trust: local
  analysis_semantics:
    flow_classes: [process-input]
  match:
    kind: call
    callee:
      name: readline
  match_examples:
  - name: php.source.readline example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  readline($input);\n}\n"
  description: readline() - interactive CLI input.
- id: php.source.symfony_console_input_get_argument
  enabled: true
  language: php
  tag: cli-input
  trust: local
  packages:
  - symfony/console
  match:
    kind: call
    callee:
      attribute:
      - input
      - getArgument
  match_examples:
  - name: php.source.symfony_console_input_get_argument example
    code: |
      <?php
      use symfony\console;
      use symfony\console;
      function example($input, $url, $id, $payload, $request) {
        $input->getArgument($input);
      }
  description: Symfony Console $input->getArgument - CLI-supplied argument.
  imports:
  - symfony\console
  - symfony
- id: php.source.symfony_console_input_get_option
  enabled: true
  language: php
  tag: cli-input
  trust: local
  packages:
  - symfony/console
  match:
    kind: call
    callee:
      attribute:
      - input
      - getOption
  match_examples:
  - name: php.source.symfony_console_input_get_option example
    code: |
      <?php
      use symfony\console;
      use symfony\console;
      function example($input, $url, $id, $payload, $request) {
        $input->getOption($input);
      }
  description: Symfony Console $input->getOption.
  imports:
  - symfony\console
  - symfony
