# PHP queue/messaging sources. Laravel queue jobs, Beanstalkd, SQS consumers.
- id: php.source.laravel_job_handle
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: php
  tag: queue-message
  trust: service
  packages: [illuminate/queue]
  match:
    kind: call
    callee:
      name: handle
  description: "Disabled - too broad (handle is ubiquitous); enable with ShouldQueue class constraint."

- id: php.source.pheanstalk_reserve
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: php
  tag: queue-message
  trust: service
  packages: [pda/pheanstalk]
  match:
    kind: call
    callee:
      attribute: [Pheanstalk, reserve]
  description: "Disabled - adapters index local receivers like `$pheanstalk->reserve()`, not Pheanstalk type facts; a bare `reserve` fallback would match unrelated APIs."

- id: php.source.pheanstalk_watch
  enabled: false
  disabled_reason:
    code: over-broad
  language: php
  tag: queue-message
  trust: service
  packages: [pda/pheanstalk]
  match:
    kind: call
    callee:
      attribute: [Pheanstalk, watch]
  description: "Disabled - watch selects a tube; reserve is the source."

