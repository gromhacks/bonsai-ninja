# PHP queue/messaging sources. Laravel queue jobs, Beanstalkd, SQS consumers.
- id: php.source.laravel_job_handle
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: php
  tag: queue-message
  trust: service
  packages: [illuminate/queue]
  match:
    kind: call
    callee:
      name: handle
  description: "Disabled - too broad (handle is ubiquitous); enable with ShouldQueue class constraint."

- id: php.source.pheanstalk_reserve
  enabled: true
  language: php
  tag: queue-message
  trust: service
  packages: [pda/pheanstalk]
  match:
    kind: call
    callee:
      name: reserve
  constraints:
  - receiver_type_in: [Pheanstalk]
  match_examples:
  - name: pheanstalk reserve
    code: |
      <?php
      use Pheanstalk\Pheanstalk;
      function run(Pheanstalk $pheanstalk) {
        $job = $pheanstalk->reserve();
        return $job;
      }
  description: "Pheanstalk.reserve() - beanstalkd job payload reserved on a typed Pheanstalk receiver."

  imports:
  - Pheanstalk

- id: php.source.pheanstalk_watch
  enabled: false
  disabled_reason:
    code: over-broad
  language: php
  tag: queue-message
  trust: service
  packages: [pda/pheanstalk]
  match:
    kind: call
    callee:
      attribute: [Pheanstalk, watch]
  description: "Disabled - watch selects a tube; reserve is the source."

- id: php.source.amqp_envelope_get_body
  enabled: true
  language: php
  tag: queue-message
  trust: service
  packages: [php-amqplib/php-amqplib]
  match:
    kind: call
    callee:
      name: getBody
  constraints:
  - receiver_type_in: [AMQPEnvelope]
  match_examples:
  - name: amqp envelope get body
    code: |
      <?php
      use PhpAmqpLib\Message\AMQPEnvelope;
      function handle(AMQPEnvelope $message) {
        $b = $message->getBody();
        return $b;
      }
  description: "AMQPEnvelope.getBody() - broker-supplied message body read on a typed AMQPEnvelope receiver."

  imports:
  - PhpAmqpLib

- id: php.source.sqs_message_body
  enabled: true
  language: php
  tag: queue-message
  trust: service
  packages: [aws/aws-sdk-php]
  match:
    kind: call
    callee:
      name: getBody
  constraints:
  - receiver_type_in: [Message]
  match_examples:
  - name: sqs message get body
    code: |
      <?php
      use Aws\Sqs\Message;
      function run(Message $message) {
        $b = $message->getBody();
        return $b;
      }
  description: "AWS SQS Message.getBody() - broker-supplied body read on a typed Message receiver."

  imports:
  - Aws
