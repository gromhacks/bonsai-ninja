# PHP queue/messaging sources. Laravel queue jobs, Beanstalkd, SQS consumers.
- id: php.source.pheanstalk_reserve
  enabled: true
  language: php
  tag: queue-message
  trust: service
  packages: [pda/pheanstalk]
  match:
    kind: call
    callee:
      name: reserve
  constraints:
  - receiver_type_in: [Pheanstalk]
  match_examples:
  - name: pheanstalk reserve
    code: |
      <?php
      use Pheanstalk\Pheanstalk;
      function run(Pheanstalk $pheanstalk) {
        $job = $pheanstalk->reserve();
        return $job;
      }
  - name: unrelated reserve method is not a queue source
    code: |
      <?php
      use Pheanstalk\Pheanstalk;
      class Inventory {
        public function reserve() { return "local"; }
      }
      function run(Inventory $inventory) {
        return $inventory->reserve();
      }
    expect_no_match: true
  description: "Pheanstalk.reserve() - beanstalkd job payload reserved on a typed Pheanstalk receiver."

  imports:
  - Pheanstalk

- id: php.source.amqp_envelope_get_body
  enabled: true
  language: php
  tag: queue-message
  trust: service
  packages: [php-amqplib/php-amqplib]
  match:
    kind: call
    callee:
      name: getBody
  constraints:
  - receiver_type_in: [AMQPEnvelope]
  match_examples:
  - name: amqp envelope get body
    code: |
      <?php
      use PhpAmqpLib\Message\AMQPEnvelope;
      function handle(AMQPEnvelope $message) {
        $b = $message->getBody();
        return $b;
      }
  - name: unrelated getBody method is not an AMQP source
    code: |
      <?php
      use PhpAmqpLib\Message\AMQPEnvelope;
      class Document {
        public function getBody() { return "local"; }
      }
      function handle(Document $document) {
        return $document->getBody();
      }
    expect_no_match: true
  description: "AMQPEnvelope.getBody() - broker-supplied message body read on a typed AMQPEnvelope receiver."

  imports:
  - PhpAmqpLib

- id: php.source.sqs_message_body
  enabled: true
  language: php
  tag: queue-message
  trust: service
  packages: [aws/aws-sdk-php]
  match:
    kind: call
    callee:
      name: getBody
  constraints:
  - receiver_type_in: [Message]
  match_examples:
  - name: sqs message get body
    code: |
      <?php
      use Aws\Sqs\Message;
      function run(Message $message) {
        $b = $message->getBody();
        return $b;
      }
  - name: unrelated getBody method is not an SQS source
    code: |
      <?php
      use Aws\Sqs\Message;
      class Response {
        public function getBody() { return "local"; }
      }
      function run(Response $response) {
        return $response->getBody();
      }
    expect_no_match: true
  description: "AWS SQS Message.getBody() - broker-supplied body read on a typed Message receiver."

  imports:
  - Aws
