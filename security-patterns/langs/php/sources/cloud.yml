# PHP cloud sources. AWS Lambda PHP runtime bootstrap handler events.
# trust: service.
- id: php.source.aws_lambda_handler_event
  enabled: false
  disabled_reason:
    code: over-broad
  language: php
  tag: cloud-event
  trust: service
  packages: [bref/bref]
  match:
    kind: param
    target:
      name: event
  description: "Disabled - too broad; enable per-project via a narrower rule."

- id: php.source.bref_handler_handle
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: php
  tag: cloud-event
  trust: service
  packages: [bref/bref]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_method: [handle]
      in_class: [Handler]
      param_index_in: [0]
      param_count_in: [2]
  match_examples:
  - name: bref handler event parameter
    code: |
      <?php
      use Bref\Event\Handler;
      use Bref\Context\Context;
      final class FunctionHandler implements Handler {
        public function handle($event, Context $context): mixed {
          return $event;
        }
      }
  - name: ordinary handle method negative
    code: |
      <?php
      use Bref\Event\Handler;
      final class LocalHandler {
        public function handle($event, $context): mixed {
          return $event;
        }
      }
    expect_no_match: true
  description: "Disabled - Bref supplies parameter zero of Handler.handle(event, context), but the PHP adapter does not yet retain enough implemented-interface ancestry to prove that an arbitrary handle/2 method implements Bref\\Event\\Handler. The old call-result rule was wrong-direction because handle() returns the application response."

  imports:
  - Bref
