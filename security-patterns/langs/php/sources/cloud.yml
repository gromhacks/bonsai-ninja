# PHP cloud sources. AWS Lambda PHP runtime bootstrap handler events.
# trust: service.
- id: php.source.aws_lambda_handler_event
  enabled: false
  disabled_reason:
    code: over-broad
  language: php
  tag: cloud-event
  trust: service
  packages: [bref/bref]
  match:
    kind: param
    target:
      name: event
  description: "Disabled - too broad; enable per-project via a narrower rule."

- id: php.source.bref_handler_handle
  enabled: true
  language: php
  tag: cloud-event
  trust: service
  packages: [bref/bref]
  match:
    kind: call
    callee:
      name: handle
  constraints:
  - receiver_type_in: [Handler]
  match_examples:
  - name: bref handler handle
    code: |
      <?php
      use Bref\Event\Handler;
      function run(Handler $handler, $event) {
        $r = $handler->handle($event, $event);
        return $r;
      }
  description: "Bref Handler.handle() - Lambda event payload processed by a typed Bref Handler receiver."

  imports:
  - Bref
