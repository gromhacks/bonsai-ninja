# PHP cloud sources. AWS Lambda PHP runtime bootstrap handler events.
# trust: service.
- id: php.source.bref_handler_handle
  enabled: true
  language: php
  tag: cloud-event
  trust: service
  packages: [bref/bref]
  match:
    kind: param
    target:
      regex: "^\\$?[A-Za-z_][A-Za-z0-9_]*$"
      in_method: [handle]
      in_class: [Handler]
      param_index_in: [0]
      param_count_in: [2]
  match_examples:
  - name: bref handler event parameter
    code: |
      <?php
      use Bref\Event\Handler;
      use Bref\Context\Context;
      final class FunctionHandler implements Handler {
        public function handle($event, Context $context): mixed {
          return $event;
        }
      }
    expect_match_text: [$event]
  - name: ordinary handle method negative
    code: |
      <?php
      use Bref\Event\Handler;
      final class LocalHandler {
        public function handle($event, $context): mixed {
          return $event;
        }
      }
    expect_no_match: true
  description: "Parameter zero of Bref Handler.handle(event, context), constrained by method name, arity, implemented-interface ancestry, and imported Bref identity. The handle return remains the application response, not a source."

  imports:
  - Bref

- id: php.source.google_functions_http_callback
  enabled: true
  language: php
  tag: cloud-event
  trust: service
  category: cloud-event
  payload_types: [event, json]
  packages: [google/cloud-functions-framework]
  imports: [Google\CloudFunctions\FunctionsFramework]
  match:
    kind: call
    callee:
      attribute: [FunctionsFramework, http]
  constraints:
  - arg_count: 2
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: Google Functions Framework inline HTTP handler
    code: |
      <?php
      use Google\CloudFunctions\FunctionsFramework;
      use Psr\Http\Message\ServerRequestInterface;
      FunctionsFramework::http('audit', function (ServerRequestInterface $request): string {
          return $request->getUri()->getQuery();
      });
    expect_match_text: ["FunctionsFramework::http"]
  - name: unrelated framework registration is not cloud input
    code: |
      <?php
      use Google\CloudFunctions\FunctionsFramework;
      Router::http('audit', function ($request): string {
          return 'local';
      });
    expect_no_match: true
  description: "Google Cloud FunctionsFramework::http(name, callback) supplies the PSR-7 request as callback parameter zero; the registration call result is not a source."
