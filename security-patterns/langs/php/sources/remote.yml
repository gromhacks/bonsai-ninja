  tag: http-input
  packages:
  - yiisoft/yii2
  match:
    kind: call
    callee:
      attribute:
      - request
      - post
  constraints:
  - max_args: 2
  match_examples:
  - name: php.source.yii_request_post example
    code: |
      <?php
      use yiisoft\yii2;
      use yiisoft\yii2;
      function example($input, $url, $id, $payload, $request) {
        $request->post($input);
      }
  description: 'Yii request->post. Signature `post($name = null, $defaultValue = null)`; `max_args: 2` rejects same-name decoys with extra args.'
  imports:
  - yiisoft\yii2
  - yiisoft
