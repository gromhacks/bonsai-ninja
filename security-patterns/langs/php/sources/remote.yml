      function handle(Request $request) { return $request->post("title"); }
  - name: HTTP client post call is not inbound request input
    code: |
      <?php
      use Illuminate\Http\Request;
      class Client { function post($url) { return "response"; } }
      function helper(Client $client) { return $client->post("https://example.test"); }
    expect_no_match: true
  description: "Laravel Illuminate Request::post() - form/body input on a compiler-typed Request receiver."
  imports: [Illuminate]
