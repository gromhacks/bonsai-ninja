      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.(get|post|put|patch|delete|options|any|map)$'
  constraints:
  - receiver_type_in: [App]
  - arg_count: 2
  - arg_is_inline_callback: 1
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [2]
  match_examples:
  - name: Slim route argument array
    code: |
      <?php
      use Slim\Factory\AppFactory;
      use Psr\Http\Message\ServerRequestInterface;
      use Psr\Http\Message\ResponseInterface;
      $app = AppFactory::create();
      $app->get('/users/{id}', function (ServerRequestInterface $request, ResponseInterface $response, array $args) {
          return $args['id'];
      });
    expect_match_text: [$app.get]
  - name: unrelated get callback in a Slim project is not a route boundary
    code: |
      <?php
      use Slim\Factory\AppFactory;
      $cache = new LocalCache();
      $cache->get('/users/{id}', function ($left, $right, array $options) { return $options; });
    expect_no_match: true
  description: "Slim App route registration supplies route captures as inline callback parameter two. Compiler factory typing proves the receiver is Slim App; callback-source semantics taints the parameter without relying on its spelling."
  imports: [Slim, Psr]

