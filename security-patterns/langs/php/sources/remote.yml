      name: getServerParams
  constraints:
  - receiver_type_in: [ServerRequestInterface]
  - max_args: 0
  match_examples:
  - name: PSR-7 server request parameters
    code: |
      <?php
      use Psr\Http\Message\ServerRequestInterface;
      function handle(ServerRequestInterface $request) {
          return $request->getServerParams();
      }
    expect_match_text: [$request.getServerParams]
  - name: unrelated server parameter accessor
    code: |
