- id: php.source.symfony_request_request_get
  enabled: true
  language: php
  trust: remote
  tag: http-input
  packages:
  - symfony/http-foundation
  - yiisoft/yii2
  match:
    kind: call
    callee:
      attribute:
      - request
      - get
  constraints:
  - min_args: 1
  match_examples:
  - name: php.source.symfony_request_request_get example
    code: |
      <?php
      use symfony\httpfoundation;
      use symfony\httpfoundation;
      use symfony\http-foundation;
      function example($input, $url, $id, $payload, $request) {
        $request->get($input);
      }
  description: 'Symfony/Yii request->get — request body/query accessor. Signature: `get($key, $default = null)`; `min_args: 1` rejects unrelated 0-arg `request->get()` decoys (container.get, Map.get accessors).'
  imports:
  - symfony
  - symfony/httpfoundation
  - symfony\httpfoundation
