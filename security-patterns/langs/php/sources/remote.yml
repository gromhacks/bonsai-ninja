- id: php.source.laravel_auth_user
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: php
  trust: remote
  tag: http-input
  packages:
  - laravel/framework
  match:
    kind: call
    callee:
      name: auth
  description: Disabled — auth()->user() returns the authenticated identity; values are session-bound but identity fields (name, email) are user-editable. Enable in projects that treat identity as untrusted; currently off because bare `auth` would match unrelated helpers and the chain `auth()->user()->name` resolves through the typed-receiver path that the v1 adapter does not model.
