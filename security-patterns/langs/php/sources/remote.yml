- id: php.source.superglobal_get
  enabled: true
  language: php
  trust: remote
  tag: http-input
  analysis_semantics:
    flow_classes: [http-input]
  match:
    kind: read
    target:
      name: _GET
  match_examples:
  - name: php.source.superglobal_get example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  $value = $_GET;;\n}\n"
  description: $_GET - query parameters.
- id: php.source.superglobal_post
  enabled: true
  language: php
  trust: remote
  tag: http-input
  match:
    kind: read
    target:
      name: _POST
  match_examples:
  - name: php.source.superglobal_post example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  $value = $_POST;;\n}\n"
  description: $_POST - form body.
- id: php.source.superglobal_request
  enabled: true
  language: php
  trust: remote
  tag: http-input
  match:
    kind: read
    target:
      name: _REQUEST
  match_examples:
  - name: php.source.superglobal_request example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  $value = $_REQUEST;;\n}\n"
  description: $_REQUEST - combined GET/POST/COOKIE.
- id: php.source.superglobal_cookie
  enabled: true
  language: php
  trust: remote
  tag: http-input
  match:
    kind: read
    target:
      name: _COOKIE
  match_examples:
  - name: php.source.superglobal_cookie example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  $value = $_COOKIE;;\n}\n"
  description: $_COOKIE superglobal - attacker-controlled cookie values sent with every request. Values are trust-boundary user input and can be spoofed via CSRF or a malicious site if SameSite isn't set.
- id: php.source.superglobal_files
  enabled: true
  language: php
  trust: remote
  tag: http-input
  match:
    kind: read
    target:
      name: _FILES
  match_examples:
  - name: php.source.superglobal_files example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  $value = $_FILES;;\n}\n"
  description: $_FILES - uploaded file metadata; name is client-controlled.
- id: php.source.superglobal_server
  enabled: true
  language: php
  trust: remote
  tag: http-input
  analysis_semantics:
    flow_classes: [http-input]
  match:
    kind: read
    target:
      regex: "^_SERVER\\.(HTTP_[A-Z0-9_]+|CONTENT_TYPE|CONTENT_LENGTH|QUERY_STRING|REQUEST_URI|PATH_INFO|REMOTE_ADDR)$"
  match_examples:
  - name: PHP client-supplied server header
    code: |
      <?php
      function example() {
        return $_SERVER["HTTP_HOST"];
      }
    expect_match_text: [_SERVER.HTTP_HOST]
  - name: server software metadata is not client input
    code: |
      <?php
      function example() {
        return $_SERVER["SERVER_SOFTWARE"];
      }
    expect_no_match: true
  description: "Exact static $_SERVER request fields: HTTP_*, content headers, request URI/query/path, and REMOTE_ADDR. Server/process metadata keys remain excluded by the compiler-projected key regex."
- id: php.source.php_input_stream
  enabled: true
  language: php
  trust: remote
  tag: http-input
  match:
    kind: call
    callee:
      name: file_get_contents
  constraints:
  - arg_equals:
      index: 0
      value: '"php://input"'
  match_examples:
  - name: php.source.php_input_stream example
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  file_get_contents(\"php://input\");\n}\n"
  - name: php.source.php_input_stream example negative constraint boundary
    code: "<?php\nfunction example($input, $url, $id, $payload, $request) {\n  file_get_contents();\n}\n"
    expect_no_match: true
  description: file_get_contents('php://input') - raw request body.

- id: php.source.request_parse_body
  enabled: true
  language: php
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [form, multipart, file]
  match:
    kind: call
    callee:
      name: request_parse_body
  constraints:
  - top_level: true
  - max_args: 1
  match_examples:
  - name: PHP 8.4 request body parser
    code: |
      <?php
      [$post, $files] = request_parse_body();
      sink($post["name"]);
  - name: object method with the same name is not the PHP builtin
    code: |
      <?php
      [$post, $files] = $parser->request_parse_body();
    expect_no_match: true
  description: "PHP 8.4 request_parse_body() - parses the current HTTP request body into POST fields and uploaded-file metadata. The optional argument is an INI-options array; the function's returned tuple is the source carrier."

- id: php.source.filter_input_http
  enabled: true
  language: php
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query, form, cookie]
  match:
    kind: call
    callee:
      name: filter_input
  constraints:
  - top_level: true
  - min_args: 2
  - max_args: 4
  - arg_matches_regex:
      index: 0
      regex: "^INPUT_(GET|POST|COOKIE)$"
  match_examples:
  - name: filter_input default query value
    code: |
      <?php
      $query = filter_input(INPUT_GET, "q");
    expect_match_text: [filter_input]
  - name: explicitly filtered input remains an origin for context-specific analysis
    code: |
      <?php
      $query = filter_input(INPUT_GET, "q", FILTER_SANITIZE_SPECIAL_CHARS);
    expect_match_text: [filter_input]
  - name: environment input is not an HTTP source
    code: |
      <?php
      $token = filter_input(INPUT_ENV, "TOKEN");
    expect_no_match: true
  description: "filter_input(INPUT_GET|INPUT_POST|INPUT_COOKIE, name, ...) - the return originates at the HTTP boundary for every filter choice. Rulepack sanitizers may later constrain a specific payload/sink context; source analysis must not erase the origin merely because a filter argument is present."

- id: php.source.filter_input_array_http
  enabled: true
  language: php
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query, form, cookie]
  match:
    kind: call
    callee:
      name: filter_input_array
  constraints:
  - top_level: true
  - min_args: 1
  - max_args: 2
  - arg_matches_regex:
      index: 0
      regex: "^INPUT_(GET|POST|COOKIE)$"
  match_examples:
  - name: filter_input_array default request values
    code: |
      <?php
      $query = filter_input_array(INPUT_GET);
    expect_match_text: [filter_input_array]
  - name: explicit filter definition still originates at the request boundary
    code: |
      <?php
      $query = filter_input_array(INPUT_GET, ["q" => FILTER_SANITIZE_SPECIAL_CHARS]);
    expect_match_text: [filter_input_array]
  - name: environment array is not an HTTP source
    code: |
      <?php
      $vars = filter_input_array(INPUT_ENV);
    expect_no_match: true
  description: "filter_input_array(INPUT_GET|INPUT_POST|INPUT_COOKIE, ...) - returns request-origin values. Per-field filter definitions are separate context-sensitive sanitizer evidence, not a reason to discard the source boundary."
