- id: ruby.typing.serialport_new
  enabled: true
  language: ruby
  packages: [serialport]
  imports: [serialport]
  returns_type: SerialPort
  match:
    kind: new
    callee:
      attribute: [SerialPort, new]
      binding_origin: imported
  match_examples:
  - name: SerialPort constructor return type
    code: |
      require "serialport"
      port = SerialPort.new("/dev/ttyUSB0", 115200)
      port.read(128)
    expect_match_text: [SerialPort.new]
  - name: unrelated serial constructor is not typed
    code: |
      require "serialport"
      class SerialPort
        def self.new(path, speed = nil); Object.new; end
      end
      port = SerialPort.new("local")
    expect_no_match: true
  description: "serialport SerialPort.new returns a SerialPort receiver. Typing-only; never a finding."
