- id: ruby.typing.nokogiri_xml_node
  enabled: true
  language: ruby
  packages: [nokogiri]
  imports: [nokogiri]
  returns_type: NokogiriNode
  match:
    kind: call
    callee:
      attribute: [Nokogiri, XML]
      binding_origin: imported
  match_examples:
  - name: Nokogiri XML document factory
    code: |
      require "nokogiri"
      arbitrary_node = Nokogiri::XML("<root/>")
    expect_match_text: ["Nokogiri.XML"]
  - name: unrelated XML factory is not Nokogiri
    code: |
      require "nokogiri"
      module Nokogiri
        def self.XML(value) = value
      end
      arbitrary_node = Nokogiri::XML("<root/>")
    expect_no_match: true
  description: "Nokogiri::XML returns a parsed node/document receiver. Typing-only."

