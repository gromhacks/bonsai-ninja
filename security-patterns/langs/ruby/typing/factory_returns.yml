# External-library factory return types. These rules only supply compiler type
# evidence for receiver-constrained rules and never emit findings.
- id: ruby.typing.openssl_ssl_context
  enabled: true
  language: ruby
  packages: [openssl]
  imports: [openssl, OpenSSL]
  returns_type: "OpenSSL::SSL::SSLContext"
  match:
    kind: new
    callee:
      attribute: ["OpenSSL::SSL::SSLContext", new]
      binding_origin: imported
  match_examples:
  - name: OpenSSL SSL context constructor
    code: |
      require "openssl"
      context = OpenSSL::SSL::SSLContext.new
  - name: same terminal local context constructor negative
    code: |
      require "openssl"
      module Local
        class SSLContext; end
      end
      context = Local::SSLContext.new
    expect_no_match: true
  - name: lexically nearer OpenSSL constant is not the imported package
    code: |
      require "openssl"
      module Application
        module OpenSSL
          module SSL
            class SSLContext; end
          end
        end
        context = OpenSSL::SSL::SSLContext.new
      end
    expect_no_match: true
  description: "OpenSSL::SSL::SSLContext.new returns an exact TLS-context receiver. Typing-only; never a finding."

- id: ruby.typing.active_record_connection
  enabled: true
  language: ruby
  packages: [activerecord]
  imports: [activerecord]
  returns_type: ActiveRecordConnection
  match:
    kind: call
    callee:
      attribute: ["ActiveRecord::Base", connection]
      binding_origin: imported
  match_examples:
  - name: ActiveRecord connection factory
    code: |
      require "activerecord"
      arbitrary_handle = ActiveRecord::Base.connection
    expect_match_text: ["ActiveRecord::Base.connection"]
  - name: unrelated connection factory is not ActiveRecord
    code: |
      require "activerecord"
      module ActiveRecord
        class Base
          def self.connection = Object.new
        end
      end
      arbitrary_handle = ActiveRecord::Base.connection
    expect_no_match: true
  description: "ActiveRecord::Base.connection returns a database connection receiver. Typing-only."

