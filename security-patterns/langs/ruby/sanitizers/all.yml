# Ruby sanitizers — declared safe by us; downstream taint stops here.
- id: ruby.sanitizer.cgi_escape_html
  enabled: true
  language: ruby
  tag: html-encode
  match:
    kind: call
    callee:
      attribute: [CGI, escapeHTML]
  match_examples:
  - name: ruby.sanitizer.cgi_escape_html example
    code: |
      def example(input, url, id, payload, request, params)
        CGI.escapeHTML(input)
      end
    expect_match_text: ["CGI.escapeHTML"]
  description: "CGI.escapeHTML — HTML entity escape."

