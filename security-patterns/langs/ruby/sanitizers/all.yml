  match_examples:
  - name: ruby.sanitizer.jwt_decode_verify example
    code: |
      require "jwt"
      def example(input, url, id, payload, request, params)
        JWT.decode(input, input, verify: true)
      end
    expect_match_text: ["JWT.decode"]
  - name: ruby.sanitizer.jwt_decode_verify example negative constraint boundary
    code: "require \"jwt\"\ndef example(input, url, id, payload, request, params)\n  JWT.decode()\nend\n"
    expect_no_match: true
  description: "JWT.decode(..., verify: true, algorithm: 'HS256'/'RS256') - signature verified; clears JWT taint."

# -- Open-redirect mitigations -------------------------------------------------
- id: ruby.sanitizer.url_for_only_path
