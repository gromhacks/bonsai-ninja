    code: |
      require "rack-attack"
      def example(input, url, id, payload, request, params)
        Rack::Attack.throttle(input)
      end
    expect_match_text: ["Rack::Attack.throttle"]
  description: "Rack::Attack.throttle declaration — sensitive-route throttling."
