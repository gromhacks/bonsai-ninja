    kind: call
    callee:
      name: url_for
  description: "Disabled - Rails url_for(only_path: true) is safe but bare url_for is not. Enable with kwarg-presence narrowing."

- id: ruby.sanitizer.redirect_to_only_path
  enabled: false
  disabled_reason:
    code: over-broad
  language: ruby
  tag: open-redirect-sanitize
  packages: [actionpack]
  match:
    kind: call
    callee:
      name: redirect_to
  description: "Disabled - redirect_to(allow_other_host: false) is safe in Rails 7+. Enable with kwarg-presence narrowing
    for allow_other_host."

# -- Audit-derived validation / binding sanitizers -----------------------------
- id: ruby.sanitizer.same_origin_start_with
  enabled: true
  language: ruby
  tag: same-origin-path
  match:
    kind: call
    callee:
      name: start_with?
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^['\"]/"
  match_examples:
  - name: ruby.sanitizer.same_origin_start_with example
    code: |
      def example(url)
        url.start_with?("/")
      end
    expect_match_text: ["url.start_with?"]
  - name: ruby.sanitizer.same_origin_start_with example negative constraint boundary
    code: "def example(url)\n  url.start_with?()\nend\n"
    expect_no_match: true
  description: "String#start_with?(\"/\") — same-origin redirect/path guard for root-relative targets."

- id: ruby.sanitizer.include_allowlist
  enabled: false
  language: ruby
  tag: allowlist-validate
  match:
    kind: call
    callee:
      regex: "^(ALLOWED|ALLOWLIST|allowed|allowlist|allowed_roles|permitted|valid_values)\\.include\\?$"
  match_examples:
  - name: ruby.sanitizer.include_allowlist example
    code: |
      ALLOWED = %w[user admin]
      def example(role)
        ALLOWED.include?(role)
      end
    expect_match_text: ["ALLOWED.include?"]
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    allowlist.include?(value) on known allowlist receiver names — enum/set membership validator for constrained values."

  disabled_reason:
    code: over-broad
- id: ruby.sanitizer.match_full_string_shape
  enabled: true
  language: ruby
  tag: regex-validate
  match:
    kind: call
    callee:
      name: match?
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "(\\\\A|\\^).*(\\\\z|\\$)"
  match_examples:
  - name: ruby.sanitizer.match_full_string_shape example
    code: |
      def example(slug)
        slug.match?(/\A[a-z0-9_-]+\z/)
      end
    expect_match_text: ["slug.match?"]
  - name: ruby.sanitizer.match_full_string_shape example negative constraint boundary
    code: "def example(slug)\n  slug.match?()\nend\n"
    expect_no_match: true
  description: "String#match? with full-string anchors — shape validator for UUIDs, slugs, emails, and similar bounded formats."

- id: ruby.sanitizer.activerecord_where_bind_array
  enabled: true
  language: ruby
  tag: db-bind-parameter
  packages: [activerecord]
  match:
    kind: call
    callee:
      name: where
  constraints:
  - any_arg_matches_regex: "\\?"
  match_examples:
  - name: ruby.sanitizer.activerecord_where_bind_array example
    code: |
      require "activerecord"
      def example(id)
        User.where(["id = ?", id])
      end
    expect_match_text: [User.where]
  - name: ruby.sanitizer.activerecord_where_bind_array example negative constraint boundary
    code: "require \"activerecord\"\ndef example(id)\n  User.where()\nend\n"
    expect_no_match: true
  description: "ActiveRecord where([\"col = ?\", value]) — bind-array form keeps values outside the SQL template."

- id: ruby.sanitizer.activerecord_find_by_sql_bind_array
  enabled: true
  language: ruby
  tag: db-bind-parameter
  packages: [activerecord]
  match:
    kind: call
    callee:
      name: find_by_sql
  constraints:
  - any_arg_matches_regex: "\\?"
  match_examples:
  - name: ruby.sanitizer.activerecord_find_by_sql_bind_array example
    code: |
      require "activerecord"
      def example(id)
        User.find_by_sql(["select * from users where id = ?", id])
      end
    expect_match_text: [User.find_by_sql]
  - name: ruby.sanitizer.activerecord_find_by_sql_bind_array example negative constraint boundary
    code: "require \"activerecord\"\ndef example(id)\n  User.find_by_sql()\nend\n"
    expect_no_match: true
  description: "ActiveRecord find_by_sql([sql, binds...]) — bind-array form parameterizes dynamic values."

- id: ruby.sanitizer.gsub_char_allowlist
  enabled: true
  language: ruby
  tag: char-allowlist
  match:
    kind: call
    callee:
      name: gsub
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "\\[\\^"
  - arg_equals:
      index: 1
      value: "\"\""
  match_examples:
  - name: ruby.sanitizer.gsub_char_allowlist example
    code: |
      def example(input)
        input.gsub(/[^A-Za-z0-9_-]/, "")
      end
    expect_match_text: [input.gsub]
  - name: ruby.sanitizer.gsub_char_allowlist example negative constraint boundary
    code: "def example(input)\n  input.gsub()\nend\n"
    expect_no_match: true
  description: "String#gsub(/[^safe]/, \"\") — strips every character outside an explicit allowlist."

# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) — taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: ruby.passthrough.cgi_unescape
  enabled: true
  language: ruby
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [CGI, unescape]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: ruby.passthrough.cgi_unescape example
    code: |
      def example(input, url, id, payload, request, params)
        CGI.unescape(input)
      end
    expect_match_text: ["CGI.unescape"]
  description: "CGI.unescape(s) — preserves taint; classic Rack/CGI decode."
- id: ruby.passthrough.uri_decode_www_form_component
  enabled: true
  language: ruby
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [URI, decode_www_form_component]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: ruby.passthrough.uri_decode_www_form_component example
    code: |
      def example(input, url, id, payload, request, params)
        URI.decode_www_form_component(input)
      end
    expect_match_text: ["URI.decode_www_form_component"]
  description: "URI.decode_www_form_component(s) — preserves taint."

# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: ruby.csrf.protect_from_forgery
  enabled: true
  language: ruby
  tag: csrf-protect
  match:
    kind: call
    callee:
      name: protect_from_forgery
  match_examples:
  - name: ruby.csrf.protect_from_forgery example
    code: |
      def example(input, url, id, payload, request, params)
        protect_from_forgery(input)
      end
    expect_match_text: ["protect_from_forgery"]
  description: "Rails ApplicationController#protect_from_forgery — global CSRF token check."

# Lock-acquire sanitizers (T502). Tagged `lock-acquire` so
# reviewer enumerates guarded sections; the in-scope-cleanse
# semantics handle 'while lock is held, accesses are safe'.
- id: ruby.lock.mutex_synchronize
  enabled: true
  language: ruby
  tag: lock-acquire
  match:
    kind: call
    callee:
      attribute: [Mutex, synchronize]
  match_examples:
  - name: ruby.lock.mutex_synchronize example
    code: |
      def example(input, url, id, payload, request, params)
        Mutex.synchronize(input)
      end
    expect_match_text: ["Mutex.synchronize"]
  description: "Mutex#synchronize { ... } — guards the block body."

# Cookie-secure sanitizers (T402). Cookie-set calls with
# httpOnly + secure flags are the SAFE shape; reviewer
# enumerates with `security sanitizers --tag cookie-secure`
# and audits routes that set cookies WITHOUT them.
- id: ruby.cookie.cookies_set_httponly
  enabled: true
  language: ruby
  tag: cookie-secure
  match:
    kind: call
    callee:
      attribute: [cookies, signed]
  constraints:
  - any_arg_matches_regex: |-
      httponly.*true|secure.*true
  match_examples:
  - name: ruby.cookie.cookies_set_httponly example
    code: |
      def example(input, url, id, payload, request, params)
        cookies.signed(httponly: true)
      end
    expect_match_text: ["cookies.signed"]
  - name: ruby.cookie.cookies_set_httponly example negative constraint boundary
    code: "def example(input, url, id, payload, request, params)\n  cookies.signed()\nend\n"
    expect_no_match: true
  description: "Rails cookies.signed[name] = {value: ..., httponly: true, secure: true}."

# Rate-limit middleware presence sanitizers (architectural).
- id: ruby.ratelimit.rack_attack_throttle
  enabled: true
  language: ruby
  tag: rate-limit
  packages: [rack-attack]
  match:
    kind: call
    callee:
      attribute: [Rack::Attack, throttle]
  match_examples:
