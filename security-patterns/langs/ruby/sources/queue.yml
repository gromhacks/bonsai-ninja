# Ruby background-job / queue sources. Payloads come from another process,
# often JSON-decoded (Sidekiq/ActiveJob) - deserialization-adjacent.
# trust: service - upstream producer.
- id: ruby.source.sidekiq_perform_args
  enabled: true
  language: ruby
  tag: queue-input
  trust: service
  payload_types: [event, json, text, binary]
  packages: [sidekiq]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_method: [perform]
      in_class: ["Sidekiq::Job", "Sidekiq::Worker"]
  match_examples:
  - name: Sidekiq job arguments
    code: |
      require "sidekiq"
      class ImportJob
        include Sidekiq::Job
        def perform(payload, tenant)
          payload
        end
      end
    expect_match_text: [payload, tenant]
  - name: similarly named application method is not a queue boundary
    code: |
      require "sidekiq"
      class LocalRunner
        def perform(payload)
          payload
        end
      end
    expect_no_match: true
  description: "Arguments of `perform` on a class that exactly includes Sidekiq::Job or its legacy Sidekiq::Worker module. Compiler mixin ancestry establishes the worker boundary without guessing from class, method-parameter, or file names."

- id: ruby.source.activejob_perform_args
  enabled: true
  language: ruby
  tag: queue-input
  trust: service
  packages: [activejob, active_job, rails]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_method: [perform]
      in_class: ["ActiveJob::Base"]
  match_examples:
  - name: Active Job perform argument
    code: |
      require "active_job"
      class ApplicationJob < ActiveJob::Base
      end
      class ImportJob < ApplicationJob
        def perform(payload)
          payload
        end
      end
    expect_match_text: [payload]
  - name: ordinary perform method is not a queue boundary
    code: |
      require "active_job"
      class LocalRunner
        def perform(payload)
          payload
        end
      end
    expect_no_match: true
  - name: local ApplicationJob name does not prove Active Job ancestry
    code: |
      require "active_job"
      class ApplicationJob
      end
      class LocalJob < ApplicationJob
        def perform(payload)
          payload
        end
      end
    expect_no_match: true
  description: "Arguments of `perform` on an exact ActiveJob::Base descendant. The compiler supplies transitive, qualified superclass ancestry, so a locally named ApplicationJob does not satisfy the boundary."

- id: ruby.source.shoryuken_perform_body_param
  enabled: true
  language: ruby
  tag: queue-input
  trust: service
  packages: [shoryuken]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_method: [perform]
      in_class: ["Shoryuken::Worker"]
      param_index_in: [1]
      param_count_in: [2]
  match_examples:
  - name: Shoryuken worker body argument
    code: |
      require "shoryuken"
      class OrdersWorker
        include Shoryuken::Worker
        def perform(sqs_message, body)
          body
        end
      end
    expect_match_text: [body]
  - name: one-argument worker does not satisfy the two-argument body contract
    code: |
      require "shoryuken"
      class OrdersWorker
        include Shoryuken::Worker
        def perform(message)
          message
        end
      end
    expect_no_match: true
  - name: unrelated two-argument perform method is not a Shoryuken boundary
    code: |
      require "shoryuken"
      class LocalWorker
        def perform(message, body)
          body
        end
      end
    expect_no_match: true
  description: "Parameter one of the exact two-argument `perform(message, body)` contract on a class that includes Shoryuken::Worker. The compiler records parsed include/prepend module ancestry rather than guessing from the worker or parameter spelling."

- id: ruby.source.delayed_job_payload
  enabled: true
  language: ruby
  tag: queue-input
  trust: service
  packages: [delayed_job]
  match:
    kind: call
    callee:
      name: payload_object
  match_examples:
  - name: ruby.source.delayed_job_payload example
    code: |
      require "delayed_job"
      def example(input, url, id, item, req_obj, options)
        payload_object(input)
      end
  - name: ruby.source.delayed_job_payload unrelated call negative
    code: |
      require "delayed_job"
      def example(input)
        enqueue(input)
      end
    expect_no_match: true
  description: "Delayed::Job payload_object - YAML-deserialised job instance."

- id: ruby.source.karafka_payload
  enabled: true
  language: ruby
  tag: queue-input
  trust: service
  packages: [karafka]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.payload$
  match_examples:
  - name: ruby.source.karafka_payload example
    code: |
      require "karafka"
      def example(input, url, id, item, req_obj, options)
        message.payload(input)
      end
  - name: ruby.source.karafka_payload unrelated accessor negative
    code: |
      require "karafka"
      def example(input)
        message.metadata(input)
      end
    expect_no_match: true
  description: "Karafka consumer message.payload - Kafka record body."

- id: ruby.source.sneakers_deserialize
  enabled: true
  language: ruby
  tag: queue-input
  trust: service
  packages: [sneakers]
  match:
    kind: call
    callee:
      attribute: [Sneakers, parse_to]
  match_examples:
  - name: ruby.source.sneakers_deserialize example
    code: |
      require "sneakers"
      def example(input, url, id, item, req_obj, options)
        Sneakers.parse_to(input)
      end
  description: "Sneakers worker deserialize hook - RabbitMQ payload."
