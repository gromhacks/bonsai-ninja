# Ruby background-job / queue sources. Payloads come from another process,
# often JSON-decoded (Sidekiq/ActiveJob) — deserialization-adjacent.
# trust: service — upstream producer.
- id: ruby.source.sidekiq_perform_args
  enabled: false
  disabled_reason:
    code: over-broad
  language: ruby
  tag: queue-input
  trust: service
  packages: [sidekiq, activejob]
  match:
    kind: param
    target:
      name: perform
  description: "Disabled — `perform` is the worker method name, not the job-argument parameter identifier."

- id: ruby.source.activejob_perform_args
  enabled: false
  disabled_reason:
    code: over-broad
  language: ruby
  tag: queue-input
  trust: service
  packages: [activejob]
  match:
    kind: param
    target:
      name: perform
  description: "Disabled — bare `param name: perform` is FP-prone (`perform` is the worker method name, not the job-argument parameter identifier); no canonical exists. Re-enable when adapter supports class-scoped ActiveJob `perform` method-arg matching."

- id: ruby.source.shoryuke_message_body
  enabled: true
  language: ruby
  tag: queue-input
  trust: service
  packages: [shoryuken]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.body$
  constraints:
  - min_args: 1
  match_examples:
  - name: ruby.source.shoryuke_message_body example
    code: |
      require "shoryuken"
      def example(input, url, id, item, req_obj, options)
        message.body(input)
      end
  description: "Shoryuken worker message.body(payload) — SQS payload accessor invoked with at least one argument. min_args:1 disambiguates from the 0-arg `request.body` Rails getter."

- id: ruby.source.delayed_job_payload
  enabled: true
  language: ruby
  tag: queue-input
  trust: service
  packages: [delayed_job]
  match:
    kind: call
    callee:
      name: payload_object
  match_examples:
  - name: ruby.source.delayed_job_payload example
    code: |
      require "delayed_job"
      def example(input, url, id, item, req_obj, options)
        payload_object(input)
      end
  description: "Delayed::Job payload_object — YAML-deserialised job instance."

- id: ruby.source.karafka_payload
  enabled: true
  language: ruby
  tag: queue-input
  trust: service
  packages: [karafka]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.payload$
  match_examples:
  - name: ruby.source.karafka_payload example
    code: |
      require "karafka"
      def example(input, url, id, item, req_obj, options)
        message.payload(input)
      end
  description: "Karafka consumer message.payload — Kafka record body."

- id: ruby.source.resque_perform_args
  enabled: false
  disabled_reason:
    code: over-broad
  language: ruby
  tag: queue-input
  trust: service
  packages: [resque]
  match:
    kind: param
    target:
      name: perform
  description: "Disabled — Resque worker .perform args carry attacker-influenced JSON; bare `param name: perform` overmatches helper methods. Enable only with class-context narrowing."

- id: ruby.source.sneakers_deserialize
  enabled: true
  language: ruby
  tag: queue-input
  trust: service
  packages: [sneakers]
  match:
    kind: call
    callee:
      attribute: [Sneakers, parse_to]
  match_examples:
  - name: ruby.source.sneakers_deserialize example
    code: |
      require "sneakers"
      def example(input, url, id, item, req_obj, options)
        Sneakers.parse_to(input)
      end
  description: "Sneakers worker deserialize hook — RabbitMQ payload."
