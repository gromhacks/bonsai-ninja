# Ruby cloud serverless sources. Handlers take attacker-controlled event
# payloads. trust: service - upstream gateway brokered.
- id: ruby.source.gcf_request
  enabled: true
  language: ruby
  tag: cloud-event
  trust: service
  packages: [functions_framework]
  match:
    kind: call
    callee:
      attribute: [FunctionsFramework, http]
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: Google Functions Framework HTTP request block
    code: |
      require "functions_framework"
      FunctionsFramework.http "audit" do |request|
        sink(request.params["q"])
      end
    expect_match_text: [FunctionsFramework.http]
  - name: startup callback is not an HTTP request
    code: |
      require "functions_framework"
      FunctionsFramework.on_startup do |function|
        sink(function)
      end
    expect_no_match: true
  description: "FunctionsFramework.http(name) block parameter zero is the Rack::Request delivered for a Google Cloud HTTP invocation; the DSL registration result remains clean."
