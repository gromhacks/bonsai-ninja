# Ruby cloud serverless sources. Handlers take attacker-controlled event
# payloads. trust: service - upstream gateway brokered.
- id: ruby.source.aws_lambda_event
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: ruby
  tag: cloud-event
  trust: service
  packages: [aws_lambda_ric]
  match:
    kind: param
    target:
      name: event
  description: "Disabled - Ruby Lambda handlers are configured externally, so a bare `event` parameter plus aws_lambda_ric does not prove a runtime entry boundary."

- id: ruby.source.gcf_request
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: ruby
  tag: cloud-event
  trust: service
  packages: [functions_framework]
  match:
    kind: param
    target:
      name: request
  description: "Disabled - Ruby Functions Framework HTTP handlers are registered through a DSL block; a bare `request` method parameter does not prove registration. Re-enable when callback-block parameters retain their registration call target."

- id: ruby.source.azure_function_req
  enabled: false
  disabled_reason:
    code: over-broad
  language: ruby
  tag: cloud-event
  trust: service
  match:
    kind: param
    target:
      name: req
  description: "Disabled - bare `req` has no Azure runtime, custom-handler, type, or registration evidence and matches ordinary Ruby methods."
