# UploadedFile.original_filename is client-controlled metadata - it is a
# SOURCE, not a sink. Keeps taint through path-construction into file sinks.
- id: ruby.source.rails_uploaded_file_filename
  enabled: true
  language: ruby
  tag: http-input
  trust: remote
  packages: [actionpack]
  match:
    kind: call
    callee:
      name: original_filename
  match_examples:
  - name: ruby.source.rails_uploaded_file_filename example
    code: |
      require "actionpack"
      def example(input, url, id, item, req_obj, options)
        original_filename(input)
      end
  - name: ruby.source.rails_uploaded_file_filename unrelated call negative
    code: |
      require "actionpack"
      def example(input)
        content_type(input)
      end
    expect_no_match: true
  description: "ActionDispatch::Http::UploadedFile#original_filename - client-controlled filename."

