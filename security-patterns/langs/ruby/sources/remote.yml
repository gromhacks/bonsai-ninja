# Generic untrusted-blob parameter for YAML.load / Marshal.load /
# Oj.load deserialization-style entry points. The canonical shape is
# `def import(blob); YAML.load(blob); end`. Bare-name match
# overmatches, but the deser sinks are the second gate.
- id: ruby.source.bytes_blob_param
  enabled: true
  language: ruby
  trust: remote
  tag: caller-input
  payload_types: [binary]
  match:
    kind: param
    target:
      regex: "^(blob|payload|data|raw|bytes)$"
  match_examples:
  - name: ruby.source.bytes_blob_param example
    code: |
      def handler(payload)
        payload
      end
  description: "Generic `blob | payload | data | raw | bytes` parameter on deserialization-style entry points. Pairs with ruby.deser.* sinks (YAML.load, Marshal.load, Oj.load). Engine taint flow + sink shape are the second gate."
