- id: ruby.source.graphql_resolver_args
  enabled: true
  language: ruby
  trust: remote
  tag: graphql-input
  payload_types: [graphql]
  packages: [graphql]
  imports: [graphql]
  match:
    kind: param
    target:
      name: args
      in_method: [resolve]
  match_examples:
  - name: graphql ruby resolver args
    code: |
      require "graphql"
      class ProductResolver
        def resolve(args)
          args
        end
      end
  - name: graphql ruby sibling helper negative
    code: |
      require "graphql"
      def helper(args)
        args
      end
    expect_no_match: true
  description: "graphql-ruby resolver `resolve(args)` parameter - GraphQL caller-supplied arguments. Scoped to the resolver method name so ordinary helper parameters named args stay clean."

