# Generic untrusted-blob parameter for YAML.load / Marshal.load /
# Oj.load deserialization-style entry points. The canonical shape is
# `def import(blob); YAML.load(blob); end`. Bare-name match
# overmatches, but the deser sinks are the second gate.
- id: ruby.source.roda_route_request
  enabled: true
  language: ruby
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [path, query, form, cookie, header, multipart, file, json, text, binary]
  packages: [roda]
  match:
    kind: call
    callee:
      name: route
      in_class: [Roda]
  constraints:
  - arg_is_inline_callback: 0
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 0
      source_param_indices: [0]
  match_examples:
  - name: Roda request parameters
    code: |
      require "roda"
      class App < Roda
        route do |r|
          sink(r.params["q"])
        end
      end
    expect_match_text: [route]
  - name: application parameter object is not the Roda request
    code: |
      require "roda"
      class App < Roda
        configure do |request|
          sink(request.params)
        end
      end
    expect_no_match: true
  description: "Parameter zero of the inline `route` block on an exact Roda descendant is the inbound request carrier. One compiler-owned callback boundary covers params, GET, POST, path, headers, cookies, and body reads without guessing the block variable name."

