    code: |
      require "actionpack"
      def example(input, url, id, item, req_obj, options)
        original_filename(input)
      end
  - name: ruby.source.rails_uploaded_file_filename unrelated call negative
    code: |
      require "actionpack"
      def example(input)
        content_type(input)
      end
    expect_no_match: true
  description: "ActionDispatch::Http::UploadedFile#original_filename - client-controlled filename."

- id: ruby.source.actioncable_receive
  enabled: true
  language: ruby
  tag: http-input
  trust: remote
  packages: [action_cable]
  match:
    kind: param
    target:
      name: data
      in_method: [receive, received]
      in_class: ["ActionCable::Channel::Base"]
      param_index_in: [0]
  match_examples:
  - name: Action Cable inbound channel payload
    code: |
      require "action_cable"
      class MessagesChannel < ActionCable::Channel::Base
        def receive(data)
          broadcast_to(current_user, data)
        end
      end
    expect_match_text: [data]
  - name: ordinary data parameter outside the callback signature
    code: |
      require "action_cable"
      def helper(data)
        data
      end
    expect_no_match: true
  description: "Action Cable receive(data)/received(data) parameter zero - client-supplied channel payload constrained by callback name/index and the adapter-emitted qualified channel superclass."
  imports: [action_cable]

