- id: ruby.source.rack_env_request_fields
  enabled: true
  language: ruby
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [header, path, query]
  packages: [rack, actionpack, sinatra, padrino, cuba, roda]
  match:
    kind: read
    target:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.(HTTP_[A-Z0-9_]+|CONTENT_TYPE|CONTENT_LENGTH|PATH_INFO|REQUEST_URI)$"
  match_examples:
  - name: Rack client header environment entry
    code: |
      require "rack"
      def call(env)
        env["HTTP_X_FORWARDED_HOST"]
      end
    expect_match_text: [env.HTTP_X_FORWARDED_HOST]
  - name: Rack server software metadata is not client input
    code: |
      require "rack"
      def call(env)
        env["SERVER_SOFTWARE"]
      end
    expect_no_match: true
  description: "Rack environment request fields - HTTP_*/content headers plus client-selected path/URI values. Process/server metadata keys are intentionally excluded."
