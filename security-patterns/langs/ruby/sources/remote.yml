# Ruby HTTP / RPC / external sources. Rails, Sinatra, Grape, Hanami, Rack, Roda.
# trust: remote - network-reachable, attacker-controlled.

# `params` is implicit-receiver in every Rack-based controller (Rails,
# Sinatra, Grape, Hanami, Roda). A single rule avoids duplicate firing.
- id: ruby.source.params
  enabled: true
  language: ruby
  tag: http-input
  trust: remote
  packages: [actionpack, sinatra, grape, hanami, roda]
  match:
    kind: call
    callee:
      name: params
  constraints:
  - top_level: true
  match_examples:
  - name: ruby.source.params example
    code: |
      require "actionpack"
      def example(input, url, id, item, req_obj, options)
        params(input)
      end
  - name: ruby.source.params unrelated call negative
    code: |
      require "actionpack"
      def example(input)
        permit(input)
      end
    expect_no_match: true
  description: "Controller/action `params` - HTTP request parameters (Rails, Sinatra, Grape, Hanami, Roda)."

- id: ruby.source.params_read
  enabled: true
  language: ruby
  tag: http-input
  trust: remote
  payload_types: [query, form, json]
  packages: [actionpack, sinatra, grape, hanami, roda]
  match:
    kind: read
    target:
      name: params
  match_examples:
  - name: ruby params subscript read
    code: |
      require "actionpack"
      def example
        value = params["name"]
      end
    expect_match_text: [params]
  description: "Controller/action params hash read - covers `params[:id]` / `params[\"id\"]` source use where the adapter emits a read rather than a call."

