# Ruby HTTP / RPC / external sources. Rails, Sinatra, Grape, Hanami, Rack, Roda.
# trust: remote - network-reachable, attacker-controlled.

# `params` is implicit-receiver in every Rack-based controller (Rails,
# Sinatra, Grape, Hanami, Roda). A single rule avoids duplicate firing.
- id: ruby.source.params
  enabled: true
  language: ruby
  tag: http-input
  trust: remote
  packages: [actionpack, sinatra, grape, hanami, roda]
  match:
    kind: call
    callee:
      name: params
      in_class: ["ActionController::Base", "Sinatra::Base", "Grape::API", "Hanami::Action", Roda]
  constraints:
  - top_level: true
  match_examples:
  - name: ruby.source.params example
    code: |
      require "actionpack"
      class UsersController < ActionController::Base
        def show
          params("id")
        end
      end
  - name: ruby.source.params unrelated call negative
    code: |
      require "actionpack"
      def example(input)
        params(input)
      end
    expect_no_match: true
  description: "Controller/action params(name) - HTTP request parameters constrained to an adapter-emitted qualified framework superclass. The compiler-owned enclosing class/base supplies provenance; package evidence is optional corroboration rather than a second gate."

- id: ruby.source.params_read
  enabled: true
  language: ruby
  tag: http-input
  trust: remote
  payload_types: [query, form, json]
  packages: [actionpack, sinatra, grape, hanami, roda]
  match:
    kind: read
    target:
      name: params
      in_class: ["ActionController::Base", ApplicationController, "Sinatra::Base", "Grape::API", "Hanami::Action", Roda]
  match_examples:
  - name: ruby params subscript read
    code: |
      require "actionpack"
      class UsersController < ActionController::Base
        def show
          value = params["name"]
        end
      end
    expect_match_text: [params]
  - name: unrelated params binding in framework project
    code: |
      require "actionpack"
      def helper(params)
        params["name"]
      end
    expect_no_match: true
  - name: Rails application controller parameters
    code: |
      require "actionpack"
      class SearchController < ApplicationController
        def show
          params[:q]
        end
      end
    expect_match_text: [params]
  description: "Controller/action params hash read - covers params[:id] / params[\"id\"] only inside a class with an adapter-emitted qualified framework superclass. The exact enclosing class/base is sufficient provenance, while a package manifest alone cannot taint unrelated helpers."

- id: ruby.source.rails_request_body
  enabled: true
  language: ruby
  tag: http-input
  trust: remote
  packages: [actionpack]
  match:
    kind: call
    callee:
      attribute: [request, body]
  constraints:
  - max_args: 0
  match_examples:
  - name: ruby.source.rails_request_body example
    code: |
      require "actionpack"
      def example(input, url, id, item, req_obj, options)
        request.body()
      end
  - name: body method with an argument is not the Rails request accessor
    code: |
      require "actionpack"
      def example(value)
        request.body(value)
      end
    expect_no_match: true
  description: "Rails/Sinatra request.body - raw HTTP body IO. Property-style getter (no args); `max_args: 0` rejects unrelated `request.body(...)` setter/builder decoys."

