  language: ruby
  tag: sql-injection
  severity: critical
  packages: [activerecord, sqlite3]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.execute$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.sqli.ar_execute example
    code: |
      require "activerecord"
      def example(input, url, id, payload, request, params)
        connection.execute(input)
      end
  - name: ruby.sqli.ar_execute literal negative
    code: |
      require "activerecord"
      def example(input, url, id, payload, request, params)
        connection.execute("SELECT * FROM users WHERE id = 1")
      end
    expect_no_match: true
  description: "connection.execute — raw SQL (ActiveRecord / PG / SQLite3 / arbitrary driver)."

