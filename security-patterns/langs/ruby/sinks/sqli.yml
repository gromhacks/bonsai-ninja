# .where(tainted_string) is dangerous; .where("col = ?", x) is safe.
# This rule fires on ALL .where calls — rely on downstream taint-flow +
# arg-shape review to distinguish.
- id: ruby.sqli.ar_where_string
  enabled: true
  language: ruby
  tag: sql-injection
  severity: high
  packages: [activerecord]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: where
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.sqli.ar_where_string example
    code: |
      require "activerecord"
      def example(input, url, id, payload, request, params)
        where(input)
      end
  - name: ruby.sqli.ar_where_string literal negative
    code: |
      require "activerecord"
      def example(input, url, id, payload, request, params)
        where("id = 1")
      end
    expect_no_match: true
  description: "ActiveRecord where(\"col = #{x}\") — tainted string fragment; safe when used with placeholder + bind array."

