# Ruby SQL-injection sinks. ActiveRecord, Sequel, raw drivers.
- id: ruby.sqli.ar_find_by_sql
  enabled: true
  language: ruby
  tag: sql-injection
  severity: critical
  packages: [activerecord]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: find_by_sql
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.sqli.ar_find_by_sql example
    code: |
      require "activerecord"
      def example(input, url, id, payload, request, params)
        find_by_sql(input)
      end
  - name: ruby.sqli.ar_find_by_sql literal negative
    code: |
      require "activerecord"
      def example(input, url, id, payload, request, params)
        find_by_sql("SELECT * FROM users")
      end
    expect_no_match: true
  description: "ActiveRecord find_by_sql — raw SQL, no automatic binding."

