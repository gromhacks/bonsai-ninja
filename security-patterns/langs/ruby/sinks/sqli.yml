- id: ruby.sqli.mysql2_query
  enabled: true
  language: ruby
  tag: sql-injection
  severity: critical
  packages: [mysql2]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      attribute: [Mysql2::Client, query]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.sqli.mysql2_query example
    code: |
      require "mysql2"
      def example(input, url, id, payload, request, params)
        client = Mysql2::Client.new
        client.query(input)
      end
  - name: ruby.sqli.mysql2_query literal negative
    code: |
      require "mysql2"
      def example(input, url, id, payload, request, params)
        client = Mysql2::Client.new
        client.query("SELECT * FROM users")
      end
    expect_no_match: true
  description: "Mysql2::Client#query — raw SQL sent through a semantic Mysql2 client receiver."

- id: ruby.sqli.pg_exec
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: ruby
  tag: sql-injection
  severity: critical
  packages: [pg]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: exec
  description: "Disabled — bare `name: exec` collides with ruby.cmdi.kernel_exec (Kernel#exec = cmdi sink). Without receiver-type narrowing (PG::Connection vs Kernel) we cannot distinguish; Kernel#exec is the far more common dangerous call."

