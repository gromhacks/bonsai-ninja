# ruby CORS misconfiguration sinks (T403).
- id: ruby.cors.rack_cors_wildcard
  enabled: true
  language: ruby
  tag: cors
  category: source-independent
  severity: medium
  packages: [rack-cors]
  cwe: [CWE-942]
  match:
    kind: call
    callee:
      name: origins
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^(?:"\*"|\x27\*\x27)$'
  match_examples:
  - name: ruby.cors.rack_cors_wildcard example
    code: |
      require "rack-cors"
      def example(input, url, id, payload, request, params)
        origins("*")
      end
  - name: rack cors explicit origin negative
    code: |
      require "rack-cors"
      def example
        origins "https://app.example"
      end
    expect_no_match: true
  description: |-
    rack-cors `origins "*"` permits every origin; the exact scalar argument keeps explicit origin allowlists quiet.
