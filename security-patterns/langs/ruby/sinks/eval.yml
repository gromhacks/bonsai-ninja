- id: ruby.eval.builtin_eval
  enabled: true
  language: ruby
  tag: code-injection
  severity: critical
  cwe:
  - CWE-94
  match:
    kind: call
    callee:
      name: eval
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.eval.builtin_eval example
    code: "def example(input, url, id, payload, request, params)\n  eval(input)\nend\n"
  - name: arg tainted literal negative
    code: "def example(input, url, id, payload, request, params)\n  eval(\"safe\")\nend\n"
    expect_no_match: true
  description: "Kernel#eval - evaluates tainted Ruby source code; arbitrary code execution. Merged collision aliases: ruby.eval.binding_eval."
  aliases:
  - ruby.eval.binding_eval
