- id: ruby.eval.active_support_constantize
  enabled: true
  language: ruby
  tag: code-injection
  severity: high
  packages:
  - activesupport
  cwe:
  - CWE-94
  - CWE-470
  match:
    kind: call
    callee:
      name: constantize
  constraints:
  - receiver_tainted: true
  match_examples:
  - name: ruby.eval.active_support_constantize example
    code: |
      require "activesupport"
      def example(input, url, id, payload, request, params)
        input.constantize()
      end
    expect_match_text:
    - input.constantize
  - name: ruby.eval.active_support_constantize literal negative
    code: |
      require "activesupport"
      def example(input)
        "User".constantize()
      end
    expect_no_match: true
  description: "ActiveSupport String#constantize resolves a tainted receiver as a runtime constant name."
