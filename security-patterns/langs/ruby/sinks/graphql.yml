- id: ruby.graphql.schema_execute
  enabled: true
  language: ruby
  tag: graphql-injection
  severity: high
  packages: [graphql]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.execute$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: schema execute
    code: |
      require "graphql"
      def example(schema, query, context)
        schema.execute(query, context: context)
      end
    expect_match_text: [schema.execute]
  - name: ruby.graphql.schema_execute literal negative
    code: |
      require "graphql"
      def example(schema, query, context)
        schema.execute("{ viewer { id } }", context: context)
      end
    expect_no_match: true
  description: "schema.execute(query, context:) — tainted GraphQL document or context reaches resolver execution."

- id: ruby.graphql.query_new
  enabled: true
  language: ruby
  tag: graphql-injection
  severity: high
  packages: [graphql]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      attribute: [GraphQL, Query, new]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: graphql query new
    code: |
      require "graphql"
      def example(schema, query)
        GraphQL::Query.new(schema, query)
      end
    expect_match_text: ["GraphQL::Query.new"]
  - name: ruby.graphql.query_new literal negative
    code: |
      require "graphql"
      def example(schema, query)
        GraphQL::Query.new(schema, "{ viewer { id } }")
      end
    expect_no_match: true
  description: "GraphQL::Query.new(schema, tainted_query) — dynamic documents enter GraphQL parsing and execution planning."

