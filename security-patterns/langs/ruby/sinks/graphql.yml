- id: ruby.graphql.schema_execute_async
  enabled: true
  language: ruby
  tag: graphql-injection
  severity: high
  packages: [graphql]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.multiplex$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: schema multiplex tainted
    code: |
      require "graphql"
      def example(schema, queries)
        schema.multiplex(queries)
      end
    expect_match_text: [schema.multiplex]
  - name: schema multiplex literal negative
    code: |
      require "graphql"
      def example(schema)
        schema.multiplex([{ query: "{ viewer { id } }" }])
      end
    expect_no_match: true
  description: "schema.multiplex(tainted_queries) — graphql-ruby batched execution; attacker-controlled query bodies enter resolver chain."
