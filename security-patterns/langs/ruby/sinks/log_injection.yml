- id: ruby.log_injection.logger_newline
  enabled: true
  language: ruby
  tag: header-injection
  severity: medium
  cwe:
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - Logger
      - info
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.log_injection.logger_newline example
    code: "def example(input, url, id, payload, request, params)\n  Logger.info(input)\nend\n"
  - name: ruby.log_injection.logger_newline literal negative
    code: "def example(input, url, id, payload, request, params)\n  Logger.info(\"safe line\")\nend\n"
    expect_no_match: true
  description: "Logger.info(\"...#{user}...\\n\") - newline in interpolated user text forges log entries."
