- id: ruby.ldap.ruby_ldap_search
  enabled: false
  language: ruby
  tag: ldap-injection
  severity: high
  packages:
  - ruby-ldap
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - LDAP::Conn
      - search
  match_examples:
  - name: ruby.ldap.ruby_ldap_search example
    code: "require \"ruby-ldap\"\ndef example(input, url, id, payload, request, params)\n\
      \  LDAP::Conn.search(\"(uid=user)\")\nend\n"
  description: ruby-ldap LDAP::Conn#search.
  disabled_reason:
    code: over-broad
