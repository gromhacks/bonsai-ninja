- id: ruby.info_disclosure.logger_info_secret
  enabled: true
  language: ruby
  tag: information-disclosure
  severity: medium
  cwe:
  - CWE-200
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - logger
      - info
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: logger info secret
    code: "def example(secret_token)\n  logger.info(secret_token)\nend\n"
    expect_match_text:
    - logger.info
  - name: literal logger info negative
    code: "def example(secret_token)\n  logger.info(\"startup ok\")\nend\n"
    expect_no_match: true
  description: "logger.info(secret/token/password) - secret-shaped data written to application logs. Interpolated newline forging requires a separate log-injection constraint."
- id: ruby.info_disclosure.better_errors_middleware
  enabled: true
  language: ruby
  tag: information-disclosure
  severity: high
  packages:
  - better_errors
  cwe:
  - CWE-209
  match:
    kind: call
    callee:
      attribute:
      - BetterErrors
      - Middleware
      - new
  match_examples:
  - name: better errors middleware
    code: "require \"better_errors\"\ndef configure(app)\n  BetterErrors::Middleware.new(app)\n\
      end\n"
    expect_match_text:
    - BetterErrors::Middleware.new
  description: "BetterErrors::Middleware.new - interactive debug error pages\
    \ can expose stack, environment, and request data if reachable."
