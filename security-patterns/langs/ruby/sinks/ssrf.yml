- id: ruby.ssrf.net_http_get
  enabled: true
  language: ruby
  tag: ssrf
  severity: high
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute:
      - Net::HTTP
      - get
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.ssrf.net_http_get example
    code: "def example(input, url, id, payload, request, params)\n  Net::HTTP.get(input)\n\
      end\n"
  - name: ruby.ssrf.net_http_get literal negative
    code: "def example(input, url, id, payload, request, params)\n  Net::HTTP.get(\"\
      https://example.com\")\nend\n"
    expect_no_match: true
  description: Net::HTTP.get with tainted URL.
