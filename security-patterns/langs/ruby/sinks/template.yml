- id: ruby.template.erb_new
  enabled: true
  language: ruby
  tag: ssti
  severity: critical
  cwe:
  - CWE-94
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - ERB
      - new
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.template.erb_new example
    code: "def example(input, url, id, payload, request, params)\n  ERB.new(input)\nend\n"
  - name: ruby.template.erb_new literal negative
    code: "def example(input, url, id, payload, request, params)\n  ERB.new(\"hello <%= user %>\")\nend\n"
    expect_no_match: true
  description: "ERB.new(tainted) - Ruby code execution via templates."
- id: ruby.template.liquid_template_parse
  enabled: true
  language: ruby
  tag: ssti
  severity: high
  packages:
  - liquid
  cwe:
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - Liquid::Template
      - parse
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.template.liquid_template_parse example
    code: |
      require "liquid"
      def example(input, url, id, payload, request, params)
        Liquid::Template.parse(input)
      end
  - name: ruby.template.liquid_template_parse literal negative
    code: |
      require "liquid"
      def example(input, url, id, payload, request, params)
        Liquid::Template.parse("hello {{ user }}")
      end
    expect_no_match: true
  description: "Liquid::Template.parse(tainted) - restricted DSL but still injection."
