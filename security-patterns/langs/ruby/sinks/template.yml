- id: ruby.template.actionview_render_inline
  enabled: false
  disabled_reason:
    code: over-broad
  language: ruby
  tag: ssti
  severity: critical
  packages:
  - actionview
  cwe:
  - CWE-1336
  match:
    kind: call
    callee:
      name: render
  description: "Disabled - render() fires on every controller action. Enable only with LLM-assisted per-call review of the inline: kwarg."
- id: ruby.template.html_safe
  enabled: false
  disabled_reason:
    code: subsumed
  language: ruby
  tag: xss
  severity: high
  packages:
  - actionview
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - String
      - html_safe
  match_examples:
  - name: ruby.template.html_safe example
    code: |
      require "actionview"
      def example(input, url, id, payload, request, params)
        String.html_safe("{{ user }}")
      end
  description: "Disabled duplicate - covered by ruby.xss.html_safe. Receiver typing is not available in YAML, so keeping both rules makes the same ActionView html_safe call produce duplicate sink facts."
- id: ruby.template.raw_helper
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: ruby
  tag: xss
  severity: high
  packages:
  - actionview
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      name: raw
  description: "Disabled - bare `raw` is too ambiguous (collides with local variables named `raw`); enable with a Rails view-context constraint when one becomes available."

- id: ruby.template.tilt_new_with_block
  enabled: true
  language: ruby
  tag: ssti
  severity: critical
  packages:
  - tilt
  cwe:
  - CWE-94
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - Tilt::ERBTemplate
      - new
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby template tilt erbtemplate new tainted
    code: |
      require "tilt"
      def example(user_input)
        Tilt::ERBTemplate.new(user_input)
      end
    expect_match_text: ["Tilt::ERBTemplate.new"]
  - name: ruby template tilt erbtemplate new literal negative
    code: |
      require "tilt"
      def example
        Tilt::ERBTemplate.new("views/show.erb")
      end
    expect_no_match: true
  description: "Tilt::ERBTemplate.new(tainted) - explicit ERB template constructor with attacker-controlled source enables Ruby code execution."

