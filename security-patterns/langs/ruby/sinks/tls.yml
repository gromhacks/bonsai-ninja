# Ruby TLS misconfiguration.
# NOTE: `kind: write` rules here match assignment TARGET names only - the
# assigned RHS value is not checked by the current engine (writes don't carry
# args). So these rules fire on ANY assignment to a matching target name.
# We keep the names specific enough that the noise is tolerable.
- id: ruby.tls.verify_none
  enabled: true
  language: ruby
  tag: weak-tls
  category: source-independent
  severity: high
  cwe: [CWE-295]
  match:
    kind: write
    target:
      name: verify_mode
  match_examples:
  - name: ruby.tls.verify_none example
    code: |
      def example(input, url, id, payload, request, params)
        verify_mode = false
      end
  description: "verify_mode = OpenSSL::SSL::VERIFY_NONE - disables peer verification."

- id: ruby.tls.httparty_verify_ssl
  enabled: true
  language: ruby
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [httparty, rest-client]
  cwe: [CWE-295]
  match:
    kind: write
    target:
      name: verify_ssl
  match_examples:
  - name: ruby.tls.httparty_verify_ssl example
    code: |
      require "httparty"
      def example(input, url, id, payload, request, params)
        verify_ssl = false
      end
  description: "verify_ssl = false - covers HTTParty and RestClient (same `write target name: verify_ssl` shape)."

- id: ruby.tls.rest_client_verify_ssl
  enabled: false
  disabled_reason:
    code: over-broad
  language: ruby
  tag: weak-tls
  severity: high
  packages: [rest-client]
  cwe: [CWE-295]
  match:
    kind: write
    target:
      name: verify_ssl
  description: "Disabled - merged into ruby.tls.httparty_verify_ssl (same `write target name: verify_ssl` shape)."

# Faraday pattern is `faraday.ssl.verify = false` or `ssl: { verify: false }`.
# Bare `verify =` would match any method / DSL that assigns a field called
# verify. Disabled by default because it's too common a name.
- id: ruby.tls.faraday_ssl_verify_false
  enabled: false
  disabled_reason:
    code: over-broad
  language: ruby
  tag: weak-tls
  severity: high
  packages: [faraday]
  cwe: [CWE-295]
  match:
    kind: write
    target:
      name: verify
  description: "Disabled - bare `verify =` is ambiguous; Faraday-specific verify: hash is better flagged by LLM review."

- id: ruby.tls.typhoeus_ssl_verifypeer
  enabled: true
  language: ruby
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [typhoeus]
  cwe: [CWE-295]
  match:
    kind: write
    target:
      name: ssl_verifypeer
  match_examples:
  - name: ruby.tls.typhoeus_ssl_verifypeer example
    code: |
      require "typhoeus"
      def example(input, url, id, payload, request, params)
        ssl_verifypeer = false
      end
  description: "Typhoeus ssl_verifypeer = false."
