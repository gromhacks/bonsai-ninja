- id: ruby.xxe.nokogiri_xml
  enabled: true
  language: ruby
  tag: xxe
  severity: high
  packages:
  - nokogiri
  cwe:
  - CWE-611
  match:
    kind: call
    callee:
      regex: ^Nokogiri\.XML$
  constraints:
  - arg_tainted:
      index: 0
  - any_arg_matches_regex: '(?i)(?:\bNOENT\b|\bDTDLOAD\b|[.]noent\b|[.]dtdload\b)'
  match_examples:
  - name: Nokogiri XML with explicit entity expansion
    code: |
      require "nokogiri"
      def example(input, url, id, payload, request, params)
        Nokogiri.XML(input, nil, nil, Nokogiri::XML::ParseOptions::NOENT)
      end
  - name: ruby.xxe.nokogiri_xml literal negative
    code: |
      require "nokogiri"
      def example(input, url, id, payload, request, params)
        Nokogiri.XML("<root/>")
      end
    expect_no_match: true
  - name: Nokogiri XML trailing block enables entities and DTD loading
    code: |
      require "nokogiri"
      def example(input)
        Nokogiri::XML(input) { |config| config.noent.dtdload }
      end
    expect_match_text: [Nokogiri.XML]
  - name: Nokogiri XML trailing block keeps network and entities disabled
    code: |
      require "nokogiri"
      def example(input)
        Nokogiri::XML(input) { |config| config.nonet }
      end
    expect_no_match: true
  - name: Nokogiri network-disabled configuration is not XXE
    code: |
      require "nokogiri"
      def example(input)
        Nokogiri.XML(input, nil, nil, Nokogiri::XML::ParseOptions::NONET)
      end
    expect_no_match: true
  description: "Nokogiri::XML on tainted XML is an XXE sink only when an exact argument or compiler-lowered trailing block explicitly enables NOENT or DTDLOAD; safe/default and NONET configurations remain quiet."
