- id: ruby.xxe.nokogiri_xml
  enabled: true
  language: ruby
  tag: xxe
  severity: high
  packages:
  - nokogiri
  cwe:
  - CWE-611
  match:
    kind: call
    callee:
      regex: ^Nokogiri\.XML$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.xxe.nokogiri_xml example
    code: |
      require "nokogiri"
      def example(input, url, id, payload, request, params)
        Nokogiri.XML(input)
      end
  - name: ruby.xxe.nokogiri_xml literal negative
    code: |
      require "nokogiri"
      def example(input, url, id, payload, request, params)
        Nokogiri.XML("<root/>")
      end
    expect_no_match: true
  description: "Nokogiri::XML — flag if NOENT or DTDLOAD set."
