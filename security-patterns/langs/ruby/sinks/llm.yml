- id: ruby.llm.bedrock_invoke_model
  enabled: true
  language: ruby
  tag: web-llm
  severity: medium
  packages: [aws-sdk-bedrockruntime]
  cwe: [CWE-20, CWE-200]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.invoke_model$
      receiver_type_in: [BedrockRuntimeClient]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: bedrock invoke model
    code: |
      require "aws-sdk-bedrockruntime"
      def example(input)
        arbitrary_handle = Aws::BedrockRuntime::Client.new
        arbitrary_handle.invoke_model(body: input)
      end
    expect_match_text: [arbitrary_handle.invoke_model]
  - name: ruby.llm.bedrock_invoke_model literal negative
    code: |
      require "aws-sdk-bedrockruntime"
      def example(input)
        arbitrary_handle = Aws::BedrockRuntime::Client.new
        arbitrary_handle.invoke_model(body: "{\"prompt\":\"hello\"}")
      end
    expect_no_match: true
  - name: unrelated invoke_model method is not Bedrock
    code: |
      require "aws-sdk-bedrockruntime"
      def example(input)
        arbitrary_handle = LocalClient.new
        arbitrary_handle.invoke_model(body: input)
      end
    expect_no_match: true
  description: "bedrock.invoke_model(body:) - tainted model body reaches a foundation-model execution surface."
