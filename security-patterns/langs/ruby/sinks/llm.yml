- id: ruby.llm.openai_client_chat
  enabled: true
  language: ruby
  tag: web-llm
  severity: medium
  packages: [ruby-openai]
  cwe: [CWE-20, CWE-94]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.chat$
      receiver_type_in: [OpenAIClient]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: openai client chat
    code: |
      require "ruby-openai"
      def example(input)
        arbitrary_handle = OpenAI::Client.new
        arbitrary_handle.chat(parameters: input)
      end
    expect_match_text: [arbitrary_handle.chat]
  - name: ruby.llm.openai_client_chat literal negative
    code: |
      require "ruby-openai"
      def example(input)
        arbitrary_handle = OpenAI::Client.new
        arbitrary_handle.chat(parameters: {messages: [{role: "user", content: "hello"}]})
      end
    expect_no_match: true
  - name: unrelated chat method is not OpenAI
    code: |
      require "ruby-openai"
      def example(input)
        arbitrary_handle = LocalClient.new
        arbitrary_handle.chat(parameters: input)
      end
    expect_no_match: true
  description: "OpenAI client.chat(parameters:) - tainted prompt/tool content reaches an LLM instruction surface."

