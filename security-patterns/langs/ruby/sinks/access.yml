    code: |
      require "aws-sdk-s3"
      def example(input, url, id, payload, request, params)
        put_object(input)
      end
  - name: ruby.access.aws_put_object literal negative
    code: |
      require "aws-sdk-s3"
      def example(input, url, id, payload, request, params)
        put_object(bucket: "public", key: "readme.txt", body: "ok")
      end
    expect_no_match: true
  description: "aws-sdk-s3 put_object - tainted bucket/key selector overwrites attacker-chosen object keys."

