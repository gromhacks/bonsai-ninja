- id: ruby.access.aws_get_object
  enabled: true
  language: ruby
  tag: access-control
  severity: high
  packages: [aws-sdk-s3]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      name: get_object
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.access.aws_get_object example
    code: |
      require "aws-sdk-s3"
      def example(input, url, id, payload, request, params)
        get_object(input)
      end
  - name: ruby.access.aws_get_object literal negative
    code: |
      require "aws-sdk-s3"
      def example(input, url, id, payload, request, params)
        get_object(bucket: "public", key: "readme.txt")
      end
    expect_no_match: true
  description: "aws-sdk-s3 get_object - tainted bucket/key selector reads arbitrary object data."

- id: ruby.access.aws_put_object
  enabled: true
  language: ruby
  tag: access-control
  severity: high
