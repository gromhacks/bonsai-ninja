- id: ruby.cmdi.kernel_system
  enabled: true
  language: ruby
  tag: command-injection
  severity: critical
  category: process-exec
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      name: system
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.cmdi.kernel_system example
    code: "def example(input, url, id, payload, request, params)\n  system(input)\nend\n"
  - name: arg tainted literal negative
    code: "def example(input, url, id, payload, request, params)\n  system(\"safe\")\nend\n"
    expect_no_match: true
  description: "Kernel#system — single-string form spawns a shell."
