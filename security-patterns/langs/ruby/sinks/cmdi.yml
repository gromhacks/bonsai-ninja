- id: ruby.cmdi.kernel_open_pipe
  enabled: true
  language: ruby
  tag: command-injection
  severity: high
  cwe:
  - CWE-78
  - CWE-22
  - CWE-918
  match:
    kind: call
    callee:
      regex: ^open$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.cmdi.kernel_open_pipe example
    code: |
      require "rubyzip"
      def example(input, url, id, payload, request, params)
        open(input)
      end
  - name: ruby.cmdi.kernel_open_pipe literal negative
    code: |
      require "rubyzip"
      def example(input, url, id, payload, request, params)
        open("|whoami")
      end
    expect_no_match: true
  description: "Kernel#open with leading '|' executes a command — flag when path is tainted (also overlaps with open-uri SSRF rule). Merged collision aliases: ruby.path.file_open, ruby.path.zip_file_open, ruby.ssrf.uri_open."
  aliases:
  - ruby.path.file_open
  - ruby.path.zip_file_open
  - ruby.ssrf.uri_open
  packages:
  - rubyzip
