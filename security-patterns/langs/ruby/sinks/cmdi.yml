- id: ruby.cmdi.kernel_backtick
  enabled: true
  language: ruby
  tag: command-injection
  severity: critical
  category: process-exec
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      name: '`'
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.cmdi.kernel_backtick example
    code: "def example(input, url, id, payload, request, params)\n  `#{input}`\nend\n"
  - name: literal backtick negative
    code: "def example(input, url, id, payload, request, params)\n  `whoami`\nend\n"
    expect_no_match: true
  description: Backtick command execution (literal `%x{...}` is a separate AST node and needs adapter support).
- id: ruby.cmdi.backticks_interp
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: ruby
  tag: command-injection
  severity: critical
  category: process-exec
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      name: '`'
  match_examples:
  - name: ruby.cmdi.backticks_interp example
    code: "def example(input, url, id, payload, request, params)\n  `echo #{payload}`\nend\n"
  description: "Disabled duplicate — ruby.cmdi.kernel_backtick owns the backtick execution fact. The adapter's backtick call fact is not currently separable enough for a second interpolation-specific sink without duplicate matches."
- id: ruby.cmdi.io_popen
  enabled: true
  language: ruby
  tag: command-injection
  severity: critical
  category: process-exec
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      attribute:
      - IO
      - popen
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.cmdi.io_popen example
    code: "def example(input, url, id, payload, request, params)\n  IO.popen(input)\nend\n"
  - name: arg tainted literal negative
    code: "def example(input, url, id, payload, request, params)\n  IO.popen(\"safe\")\nend\n"
    expect_no_match: true
  description: "IO.popen — single-string form invokes a shell. `io_popen` core class has no canonical ecosystem package, so strict `['IO', 'popen']` match only."
