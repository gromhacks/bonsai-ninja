- id: ruby.deser.marshal_restore
  enabled: true
  language: ruby
  tag: insecure-deserialization
  severity: critical
  cwe:
  - CWE-502
  match:
    kind: call
    callee:
      attribute:
      - Marshal
      - restore
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.deser.marshal_restore example
    code: "def example(input, url, id, payload, request, params)\n  Marshal.restore(input)\nend\n"
  - name: ruby.deser.marshal_restore literal negative
    code: "def example(input, url, id, payload, request, params)\n  Marshal.restore(\"\\x04\\bo:\\vObject\\x00\")\nend\n"
    expect_no_match: true
  description: "Marshal.restore — alias for load. `marshal_restore` core class has no canonical ecosystem package, so strict `['Marshal', 'restore']` match only."
