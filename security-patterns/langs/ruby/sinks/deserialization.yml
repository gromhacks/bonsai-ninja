- id: ruby.deser.yaml_load
  enabled: true
  language: ruby
  tag: insecure-deserialization
  severity: critical
  cwe:
  - CWE-502
  - CWE-22
  - CWE-94
  - CWE-611
  match:
    kind: call
    callee:
      attribute:
      - YAML
      - load
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.deser.yaml_load example
    code: |
      require "oj"
      def example(input, url, id, payload, request, params)
        YAML.load(input)
      end
  - name: ruby.deser.yaml_load literal negative
    code: |
      require "oj"
      def example(input, url, id, payload, request, params)
        YAML.load("---\nname: alice\n")
      end
    expect_no_match: true
  description: "YAML.load — accepts arbitrary classes; RCE via crafted document. Merged collision aliases: ruby.deser.psych_load, ruby.deser.marshal_load, ruby.deser.oj_load_default, ruby.deser.json_load, ruby.path.kernel_load, ruby.xxe.ox_load."
  aliases:
  - ruby.deser.psych_load
  - ruby.deser.marshal_load
  - ruby.deser.oj_load_default
  - ruby.deser.json_load
  - ruby.path.kernel_load
  - ruby.xxe.ox_load
  packages:
  - oj
  - ox
