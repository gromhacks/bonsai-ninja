- id: ruby.xss.html_safe
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: ruby
  tag: xss
  severity: high
  packages:
  - actionview
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      name: html_safe
  match_examples:
  - name: ruby.xss.html_safe example
    code: |
      require "actionview"
      def example(input, url, id, payload, request, params)
        html_safe(input)
      end
  description: "Disabled — html_safe marks the receiver string safe; needs receiver-taint tracking."
- id: ruby.xss.raw
  enabled: true
  language: ruby
  tag: xss
  severity: high
  packages:
  - actionview
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      name: raw
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.xss.raw example
    code: |
      require "actionview"
      def example(input, url, id, payload, request, params)
        raw(input)
      end
  - name: ruby.xss.raw literal negative
    code: |
      require "actionview"
      def example(input, url, id, payload, request, params)
        raw("<p>Hello</p>")
      end
    expect_no_match: true
  description: 'raw() in ERB / view helpers. Deliberately not top_level-constrained: ERB preprocessing can wrap embedded expressions in a synthetic block context, while ActionView package metadata plus taint flow gate real findings.'
