- id: ruby.nosql.mongo_collection_find
  enabled: true
  language: ruby
  tag: nosql-injection
  severity: high
  packages:
  - mongo
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      attribute:
      - Mongo::Collection
      - find
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.nosql.mongo_collection_find example
    code: |
      require "mongo"
      def example(input, url, id, payload, request, params)
        Mongo::Collection.find(payload)
      end
  - name: ruby.nosql.mongo_collection_find literal negative
    code: |
      require "mongo"
      def example(input, url, id, payload, request, params)
        Mongo::Collection.find({"name" => "alice"})
      end
    expect_no_match: true
  description: "Mongo::Collection#find (class-qualified form) — flag tainted filter Hash with operators. Merged collision aliases: ruby.nosql.mongo_collection_find_filter_value_object."
  aliases:
  - ruby.nosql.mongo_collection_find_filter_value_object
