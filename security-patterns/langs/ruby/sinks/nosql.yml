- id: ruby.nosql.redis_eval
  enabled: true
  language: ruby
  tag: nosql-injection
  severity: high
  packages:
  - redis
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_][A-Za-z0-9_]*\\.eval$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.nosql.redis_eval example
    code: |
      require "redis"
      def example(redis, input)
        redis.eval(input)
      end
    expect_match_text: ["redis.eval"]
  - name: ruby.nosql.redis_eval literal negative
    code: |
      require "redis"
      def example(redis)
        redis.eval("return redis.call('PING')")
      end
    expect_no_match: true
  description: "Redis#eval(script, ...) on a local Redis client receiver - package-gated receiver regex avoids colliding with bare Kernel#eval."
