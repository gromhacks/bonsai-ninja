# Ruby open-redirect sinks (Rails / Sinatra / Grape / Hanami).
# Rails `redirect_to` and Hanami `redirect_to` match identically on name.
# Sinatra `redirect` and Grape `redirect` also match identically.
# Consolidated to avoid double-firing on the same call site.
- id: ruby.open_redirect.redirect_to
  enabled: true
  language: ruby
  tag: open-redirect
  severity: high
  packages: [actionpack, hanami]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      name: redirect_to
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ruby.open_redirect.redirect_to example
    code: |
      require "actionpack"
      def example(input, url, id, payload, request, params)
        redirect_to(url)
      end
  - name: ruby.open_redirect.redirect_to literal negative
    code: |
      require "actionpack"
      def example(input, url, id, payload, request, params)
        redirect_to("/dashboard")
      end
    expect_no_match: true
  description: "redirect_to(tainted) — Rails / Hanami controller action."

