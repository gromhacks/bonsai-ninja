- id: ruby.crypto.bcrypt_low_cost
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: ruby
  tag: weak-crypto
  severity: medium
  packages:
  - bcrypt
  cwe:
  - CWE-916
  match:
    kind: call
    callee:
      attribute:
      - BCrypt::Password
      - create
  description: "Disabled \u2014 BCrypt::Password.create cost defaults to 12 in bcrypt-ruby; flag only when explicit cost:\
    \ < 10 (requires per-call value check)."
