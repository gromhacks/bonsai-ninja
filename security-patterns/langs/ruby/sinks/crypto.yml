- id: ruby.crypto.openssl_cipher_des
  enabled: true
  language: ruby
  tag: weak-crypto
  category: source-independent
  severity: high
  cwe:
  - CWE-327
  packages: [openssl]
  imports: [openssl]
  match:
    kind: call
    callee:
      attribute:
      - OpenSSL
      - Cipher
      - new
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)^(?:"|\x27)(?:des(?:-[a-z0-9-]+)?|des-ede3(?:-[a-z0-9-]+)?|rc2(?:-[a-z0-9-]+)?|rc4|bf(?:-[a-z0-9-]+)?|blowfish(?:-[a-z0-9-]+)?|[a-z0-9-]+-ecb)(?:"|\x27)$'
  match_examples:
  - name: OpenSSL weak cipher
    code: |
      require "openssl"
      def example
        OpenSSL::Cipher.new("DES-CBC")
      end
  - name: OpenSSL authenticated cipher negative
    code: |
      require "openssl"
      def example
        OpenSSL::Cipher.new("AES-256-GCM")
      end
    expect_no_match: true
  - name: application Cipher constructor collision negative
    code: |
      module OpenSSL
        class Cipher
          def self.new(name) = name
        end
      end
      def example
        OpenSSL::Cipher.new("DES-CBC")
      end
    expect_no_match: true
  description: "OpenSSL::Cipher.new with an exact weak cipher or ECB algorithm is insecure; authenticated/non-ECB algorithms and workspace-local providers stay quiet. Merged aliases: ruby.crypto.openssl_cipher_des_cbc, ruby.crypto.openssl_cipher_rc4, ruby.crypto.openssl_cipher_bf, ruby.crypto.openssl_cipher_aes128_ecb, ruby.crypto.openssl_cipher_aes256_ecb."
  aliases:
  - ruby.crypto.openssl_cipher_des_cbc
  - ruby.crypto.openssl_cipher_rc4
  - ruby.crypto.openssl_cipher_bf
  - ruby.crypto.openssl_cipher_aes128_ecb
  - ruby.crypto.openssl_cipher_aes256_ecb
- id: ruby.crypto.bcrypt_low_cost
  enabled: true
  language: ruby
  tag: weak-crypto
  category: source-independent
  severity: medium
  packages:
  - bcrypt
  cwe:
  - CWE-916
  match:
    kind: call
    callee:
      attribute:
      - BCrypt::Password
      - create
  constraints:
  - arg_matches_regex:
      index: 1
      # The adapter exposes Ruby's `cost:` key separately; positional index
      # one is therefore the exact scalar value, not source-shaped pair text.
      regex: '^[0-9]\b'
  match_examples:
  - name: bcrypt low cost
    code: |
      require "bcrypt"
      def hash(password)
        BCrypt::Password.create(password, cost: 4)
      end
    expect_match_text: ["BCrypt::Password.create"]
  - name: bcrypt default cost negative
    code: |
      require "bcrypt"
      def hash(password)
        BCrypt::Password.create(password)
      end
    expect_no_match: true
  - name: bcrypt acceptable cost negative
    code: |
      require "bcrypt"
      def hash(password)
        BCrypt::Password.create(password, cost: 12)
      end
    expect_no_match: true
  description: "BCrypt::Password.create(password, cost: N) with explicit cost < 10 - too cheap to compute; the default cost remains safe."
