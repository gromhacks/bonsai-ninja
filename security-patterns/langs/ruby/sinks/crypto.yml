- id: ruby.crypto.digest_md5
  enabled: true
  language: ruby
  tag: weak-crypto
  severity: low
  cwe:
  - CWE-327
  - CWE-328
  match:
    kind: call
    callee:
      regex: ^Digest\.MD5$
  match_examples:
  - name: ruby.crypto.digest_md5 example
    code: "def example(input, url, id, payload, request, params)\n  Digest.MD5(input)\nend\n"
  description: "Digest::MD5 \u2014 broken hash."
