- id: ruby.crypto.openssl_cipher_des
  enabled: true
  language: ruby
  tag: weak-crypto
  severity: high
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      attribute:
      - Cipher
      - new
  match_examples:
  - name: ruby.crypto.openssl_cipher_des example
    code: "def example(input, url, id, payload, request, params)\n  Cipher.new(\"DES\")\nend\n"
  description: "OpenSSL::Cipher.new('DES') \u2014 broken cipher. Merged aliases: ruby.crypto.openssl_cipher_des_cbc, ruby.crypto.openssl_cipher_rc4,\
    \ ruby.crypto.openssl_cipher_bf, ruby.crypto.openssl_cipher_aes128_ecb, ruby.crypto.openssl_cipher_aes256_ecb."
  aliases:
  - ruby.crypto.openssl_cipher_des_cbc
  - ruby.crypto.openssl_cipher_rc4
  - ruby.crypto.openssl_cipher_bf
  - ruby.crypto.openssl_cipher_aes128_ecb
  - ruby.crypto.openssl_cipher_aes256_ecb
- id: ruby.crypto.kernel_rand
  enabled: false
  disabled_reason:
    code: over-broad
  language: ruby
  tag: weak-randomness
  severity: medium
  cwe:
  - CWE-338
  match:
    kind: call
    callee:
      name: rand
  description: "Disabled \u2014 Kernel#rand only matters for security-sensitive ID/token gen and fires on every rand() call."
