- id: erlang.sanitizer.crypto_hash_equals
  enabled: true
  language: erlang
  tag: constant-time
  match:
    kind: call
    callee:
      regex: "^crypto:hash_equals(_constant_time)?$"
  match_examples:
  - name: hash_equals shape
    code: |
      -module(example).
      -export([test/2]).
      test(A, B) ->
        crypto:hash_equals(A, B).
    expect_match_text: ["crypto:hash_equals"]
  - name: hash_equals_constant_time shape
    code: |
      -module(example).
      -export([test/2]).
      test(A, B) ->
        crypto:hash_equals_constant_time(A, B).
    expect_match_text: ["crypto:hash_equals_constant_time"]
  description: "Constant-time comparison — defeats MAC/token timing oracles."
- id: erlang.sanitizer.binary_to_term_safe
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: erlang
  tag: validation
  match:
    kind: call
    callee:
      regex: "^binary_to_term$"
  description: "Disabled — same `^binary_to_term$` regex as erlang.deser.binary_to_term sink; without list-contains constraint
    support we cannot distinguish the safe arity-2 [{safe,true}] form from the unsafe form. Defaulting to the sink (flag everywhere)
    is safer than spuriously sanitizing."

- id: erlang.sanitizer.lists_prefix_same_origin
  enabled: true
  language: erlang
  tag: same-origin-path
  match:
    kind: call
    callee:
      regex: "^lists:prefix$"
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^"/[^"]*"$'
  match_examples:
  - name: lists prefix local path
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        lists:prefix("/app/", Input).
    expect_match_text: ["lists:prefix"]
  - name: lists prefix local path negative constraint boundary
    code: "-module(example).\n-export([test/1]).\ntest(Input) ->\n  lists:prefix().\n"
    expect_no_match: true
  description: "lists:prefix(\"/...\", Input) — same-origin redirect/path guard for slash-rooted local paths."

- id: erlang.sanitizer.allowlist_lookup
  enabled: false
  language: erlang
  tag: allowlist-validate
  match:
    kind: call
    callee:
      regex: "^(sets:is_element|ordsets:is_element|maps:is_key|proplists:is_defined)$"
  constraints:
  - any_arg_matches_regex: "^(Allowed|Allowlist|Whitelist|SafeValues|SafePaths)$"
  match_examples:
  - name: sets allowlist lookup
    code: |
      -module(example).
      -export([test/2]).
      test(Input, Allowed) ->
        sets:is_element(Input, Allowed).
    expect_match_text: ["sets:is_element"]
  - name: sets allowlist lookup negative constraint boundary
    code: "-module(example).\n-export([test/2]).\ntest(Input, Allowed) ->\n  sets:is_element().\n"
    expect_no_match: true
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    sets/ordsets/maps/proplists finite allowlist lookup — validates a tainted value against accepted values or keys."

  disabled_reason:
    code: over-broad
- id: erlang.sanitizer.re_run_full_match
  enabled: true
  language: erlang
  tag: regex-validate
  match:
    kind: call
    callee:
      regex: "^re:run$"
  constraints:
  - any_arg_matches_regex: "\\^.*\\$"
  match_examples:
  - name: anchored re run
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        re:run(Input, "^[a-z0-9_-]+$", [{capture, none}]).
    expect_match_text: ["re:run"]
  - name: anchored re run negative constraint boundary
    code: "-module(example).\n-export([test/1]).\ntest(Input) ->\n  re:run().\n"
    expect_no_match: true
  description: "re:run with an anchored full-string allowlist pattern — validates UUID/slug/token shape."

- id: erlang.sanitizer.re_replace_char_allowlist
  enabled: true
  language: erlang
  tag: char-allowlist
  match:
    kind: call
    callee:
      regex: "^re:replace$"
  constraints:
  - any_arg_matches_regex: "\\[\\^[^\\]]+\\]"
  - any_arg_matches_regex: '^""$'
  match_examples:
  - name: strip non slug chars
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        re:replace(Input, "[^A-Za-z0-9_-]", "", [global, {return, binary}]).
    expect_match_text: ["re:replace"]
  - name: strip non slug chars negative constraint boundary
    code: "-module(example).\n-export([test/1]).\ntest(Input) ->\n  re:replace().\n"
    expect_no_match: true
  description: "re:replace(Input, \"[^safe]\", \"\", ...) — strips characters outside a safe allowlist."

# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) — taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: erlang.passthrough.uri_string_percent_decode
  enabled: true
  language: erlang
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [uri_string, percent_decode]
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        uri_string:percent_decode(Input).
    expect_match_text: ["uri_string:percent_decode"]
  description: ":uri_string:percent_decode(s) — Erlang stdlib URL decode; preserves taint."
