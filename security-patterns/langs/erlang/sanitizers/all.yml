- id: erlang.sanitizer.epgsql_prepared_query
  enabled: true
  language: erlang
  tag: sql-parameter
  match:
    kind: call
    callee:
      regex: "^epgsql:prepared_query$"
  match_examples:
  - name: declared shape
    code: |
      -module(example).
