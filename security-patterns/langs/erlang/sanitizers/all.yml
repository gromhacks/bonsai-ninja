- id: erlang.sanitizer.binary_to_integer
  enabled: true
  language: erlang
  tag: numeric-coerce
  match:
    kind: call
    callee:
      regex: "^(binary|list)_to_(integer|float)$"
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        binary_to_integer(Input).
    expect_match_text: [binary_to_integer]
  description: "Numeric coercion — non-digit input raises badarg; result is safe for path/SQL/cmdi interpolation."
- id: erlang.sanitizer.list_to_existing_atom
  enabled: true
  language: erlang
  tag: validation
  match:
    kind: call
    callee:
      regex: "^(list|binary)_to_existing_atom$"
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        list_to_existing_atom(Input).
    expect_match_text: [list_to_existing_atom]
  description: "list_to_existing_atom / binary_to_existing_atom — only resolves to atoms already in the table; defeats atom-exhaustion
    and constrains arbitrary-MFA shape."
