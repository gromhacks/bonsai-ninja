- id: erlang.sanitizer.uri_string_quote
  enabled: true
  language: erlang
  tag: url-encode
  match:
    kind: call
    callee:
      regex: "^uri_string:quote"
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        uri_string:quote(Input).
    expect_match_text: ["uri_string:quote"]
  description: "uri_string:quote - modern OTP URL-escaper; reserved chars are percent-encoded. Defangs redirect/SSRF path-parts."
- id: erlang.sanitizer.http_uri_encode
  enabled: true
  language: erlang
  tag: url-encode
  match:
    kind: call
    callee:
      regex: "^http_uri:encode$"
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        http_uri:encode(Input).
    expect_match_text: ["http_uri:encode"]
  description: "http_uri:encode - DEPRECATED in OTP 23+ (replaced by uri_string:quote); still encodes correctly when present
    in legacy code, so honor it as a sanitizer."
