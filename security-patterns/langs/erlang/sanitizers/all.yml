    expect_match_text: ["epgsql:prepared_query"]
  description: "epgsql:prepared_query(C, Statement, Params) - runs a server-side prepared statement with bound parameters; the tainted value travels as a bind param, not concatenated SQL, so it is SQLi-safe."
