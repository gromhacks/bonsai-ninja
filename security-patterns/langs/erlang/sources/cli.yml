# Erlang CLI / env / stdin sources (trust: local).
- id: erlang.source.init_get_plain_arguments
  enabled: true
  language: erlang
  trust: local
  tag: cli-input
  match:
    kind: call
    callee:
      regex: "^init:get_plain_arguments$"
  match_examples:
    - name: declared shape
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          init:get_plain_arguments(Input).
  description: "init:get_plain_arguments/0 - command-line args."

