- id: erlang.source.os_getenv
  enabled: true
  language: erlang
  trust: config
  tag: env-input
  payload_types: [text]
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: call
    callee:
      regex: "^os:getenv$"
  match_examples:
    - name: declared shape
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          os:getenv(Input).
    - name: os putenv negative
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          os:putenv(Input).
      expect_no_match: true
  description: "os:getenv/1,2 - environment variable value; whoever launched the process controls these."

- id: erlang.source.application_get_env
