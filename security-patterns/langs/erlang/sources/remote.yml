- id: erlang.source.cowboy_request_metadata
  enabled: true
  language: erlang
  trust: remote
  tag: http-input
  payload_types: [text, url, header]
  match:
    kind: call
    callee:
      regex: "^cowboy_req:(method|scheme|host|port|peer|path_info|host_info|parse_header|match_cookies)$"
  constraints:
  - min_args: 1
  match_examples:
  - name: Cowboy request host
    code: |
      -module(example).
      -include_lib("cowboy/include/cowboy.hrl").
      -export([host/1]).
      host(Req) -> cowboy_req:host(Req).
    expect_match_text: ["cowboy_req:host"]
  - name: Cowboy response setter is not input
    code: |
      -module(example).
      -include_lib("cowboy/include/cowboy.hrl").
      -export([reply/1]).
      reply(Req) -> cowboy_req:set_resp_header(<<"x">>, <<"local">>, Req).
    expect_no_match: true
  - name: same host reader on another module is not Cowboy
    code: |
      -module(example).
      -export([host/1]).
      host(Req) -> application_req:host(Req).
    expect_no_match: true
  description: "Exact Cowboy request metadata accessors - method, authority, peer, path segments, parsed headers, and cookies supplied by the HTTP peer."

- id: erlang.source.elli_request_value
  enabled: true
  language: erlang
  trust: remote
  tag: http-input
  payload_types: [query, form, header, binary]
  frameworks: [elli]
  packages: [elli]
  match:
    kind: call
    callee:
      regex: '^elli_request:(get_arg|post_arg|headers|body)$'
  constraints:
  - min_args: 1
  - max_args: 3
  match_examples:
  - name: elli request query argument
    code: |
      -module(handler).
      -include_lib("elli/include/elli.hrl").
      -export([handle/1]).
      handle(Req) -> elli_request:get_arg(<<"q">>, Req, <<>>).
    expect_match_text: ["elli_request:get_arg"]
  - name: elli response helper is not request input
    code: |
      -module(handler).
      -include_lib("elli/include/elli.hrl").
      -export([handle/1]).
      handle(Req) -> elli_request:to_proplist(Req).
    expect_no_match: true
  description: "Exact Elli request accessors for query/form arguments, headers, and request-body bytes."

- id: erlang.source.webmachine_request_value
  enabled: true
  language: erlang
  trust: remote
  tag: http-input
  payload_types: [query, header, binary]
  frameworks: [webmachine]
  packages: [webmachine]
  match:
    kind: call
    callee:
      regex: '^wrq:(get_qs_value|get_req_header|req_body)$'
  constraints:
  - min_args: 1
  - max_args: 3
  match_examples:
  - name: webmachine query value
    code: |
      -module(resource).
      -include_lib("webmachine/include/webmachine.hrl").
      -export([content_types_provided/2]).
      content_types_provided(ReqData, State) ->
        {wrq:get_qs_value("q", ReqData), ReqData, State}.
    expect_match_text: ["wrq:get_qs_value"]
  - name: webmachine response header setter is not input
    code: |
      -module(resource).
      -include_lib("webmachine/include/webmachine.hrl").
      -export([render/2]).
      render(ReqData, State) -> wrq:set_resp_header("x-test", "ok", ReqData).
    expect_no_match: true
  description: "Exact Webmachine request accessors for query values, request headers, and body bytes."
