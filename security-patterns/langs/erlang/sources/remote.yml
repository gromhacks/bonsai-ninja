- id: erlang.source.gen_tcp_recv
  enabled: true
  language: erlang
  trust: remote
  tag: socket-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      regex: "^gen_tcp:recv$"
  constraints:
  - min_args: 2
  - max_args: 3
  match_examples:
  - name: TCP receive
    code: |
      -module(example).
      -export([read/1]).
      read(Socket) ->
        gen_tcp:recv(Socket, 0).
    expect_match_text: ["gen_tcp:recv"]
  - name: wrong recv arity negative
    code: |
      -module(example).
      -export([read/1]).
      read(Socket) -> gen_tcp:recv(Socket).
    expect_no_match: true
  - name: gen_tcp send negative
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        gen_tcp:send(Input).
    expect_no_match: true
  description: "gen_tcp:recv - raw TCP bytes from peer; protocol-level attacker input."

