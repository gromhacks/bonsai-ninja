- id: erlang.source.gen_tcp_recv
  enabled: true
  language: erlang
  trust: remote
  tag: socket-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      regex: "^gen_tcp:recv$"
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        gen_tcp:recv(Input).
  - name: gen_tcp send negative
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        gen_tcp:send(Input).
    expect_no_match: true
  description: "gen_tcp:recv - raw TCP bytes from peer; protocol-level attacker input."

