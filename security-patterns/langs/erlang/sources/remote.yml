# Erlang HTTP sources (Cowboy + Mochiweb + Webmachine + Yaws).
- id: erlang.source.cowboy_handler_req
  enabled: false
  disabled_reason:
    code: over-broad
  language: erlang
  trust: remote
  tag: http-input
  payload_types: [query]
  packages: [cowboy]
  match:
    kind: param
    target:
      name: Req
  description: "Disabled - whole Cowboy Req container is too broad without field-sensitive request access tracking; specific cowboy_req accessors stay enabled."

- id: erlang.source.cowboy_parse_qs
  enabled: true
  language: erlang
  trust: remote
  tag: http-input
  payload_types: [query]
  packages: [cowboy]
  match:
    kind: call
    callee:
      regex: "^cowboy_req:parse_qs"
  match_examples:
  - name: declared shape
    code: |
      -include_lib("cowboy/include/cowboy.hrl").
      -module(example).
      -export([test/1]).
      test(Input) ->
        cowboy_req:parse_qs(Input).
  description: "cowboy_req:parse_qs - parsed query string key/value list from the URL."

