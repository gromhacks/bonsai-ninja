# Erlang HTTP sources (Cowboy + Mochiweb + Webmachine + Yaws).
- id: erlang.source.cowboy_parse_qs
  enabled: true
  language: erlang
  trust: remote
  tag: http-input
  payload_types: [query]
  match:
    kind: call
    callee:
      regex: "^cowboy_req:parse_qs$"
  match_examples:
  - name: declared shape
    code: |
      -include_lib("cowboy/include/cowboy.hrl").
      -module(example).
      -export([test/1]).
      test(Input) ->
        cowboy_req:parse_qs(Input).
  - name: same query parser on another module is not Cowboy
    code: |
      -module(example).
      -export([test/1]).
      test(Input) -> application_req:parse_qs(Input).
    expect_no_match: true
  description: "cowboy_req:parse_qs - parsed query string key/value list from the URL."

