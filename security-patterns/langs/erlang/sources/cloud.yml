# Erlang cloud-runtime event sources (trust: service).
- id: erlang.source.aws_lambda_event
  enabled: true
  language: erlang
  trust: service
  tag: cloud-event
  packages: [erlang_aws_lambda]
  payload_types: [json]
  match:
    kind: param
    target:
      regex: "^[A-Z_][A-Za-z0-9_]*$"
      in_method: [handle]
      param_index_in: [0]
      param_count_in: [1, 2]
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -include_lib("erlang_aws_lambda/include/erlang_aws_lambda.hrl").
      -export([handle/1]).
      handle(Event) ->
        Event.
  - name: non event param negative
    code: |
      -module(example).
      -include_lib("erlang_aws_lambda/include/erlang_aws_lambda.hrl").
      -export([handle/1]).
      helper(Context) ->
        Context.
    expect_no_match: true
  description: "First parameter of an erlang_aws_lambda handle/1 or handle/2 callback - invocation event payload proven by function name, arity, and position."
