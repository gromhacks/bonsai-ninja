  description: "RabbitMQ amqp_channel:cast - Basic.Get / publish flow; payload originates off-box."

- id: erlang.source.gen_server_handle_call
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: erlang
  trust: local
  tag: ipc-message
  match:
    kind: call
    callee:
      regex: "^gen_server:call$"
  description: "Disabled - gen_server:call return value is the *response*, not the inbound message; handle_call/handle_cast payload is param-shaped and not yet field-accessible. Re-enable when adapter exposes the Request param."
