# Erlang queue/broker message sources (trust: service).
- id: erlang.source.brod_consume
  enabled: true
  language: erlang
  trust: service
  tag: queue-message
  packages: [brod]
  match:
    kind: call
    callee:
      regex: "^brod:fetch$"
  match_examples:
  - name: declared shape
    code: |
      -include_lib("brod/include/brod.hrl").
      -module(example).
      -export([test/1]).
      test(Input) ->
        brod:fetch(Input).
  - name: brod produce negative
    code: |
      -include_lib("brod/include/brod.hrl").
      -module(example).
      -export([test/1]).
      test(Input) ->
        brod:produce(Input).
    expect_no_match: true
  description: "brod:fetch - returned Kafka message set originates from the broker. subscribe and consume_ack are control operations and are intentionally excluded."

- id: erlang.source.brod_handle_message
  enabled: true
  language: erlang
  trust: service
  tag: queue-message
  packages: [brod]
  match:
    kind: param
    target:
      regex: "^[A-Z_][A-Za-z0-9_]*$"
      in_method: [handle_message]
      param_index_in: [2]
      param_count_in: [4]
  match_examples:
  - name: brod group subscriber message
    code: |
      -module(example).
      -behaviour(brod_group_subscriber_v2).
      -include_lib("brod/include/brod.hrl").
      -export([handle_message/4]).
      handle_message(Topic, Partition, Message, State) ->
        {ok, ack, State}.
  - name: ordinary helper negative
    code: |
      -module(example).
      -include_lib("brod/include/brod.hrl").
      helper(Topic, Partition, Message, State) ->
        Message.
    expect_no_match: true
  description: "Third parameter of brod_group_subscriber_v2 handle_message/4 - Kafka message payload proven by callback name, arity, position, and brod package evidence."

- id: erlang.source.gen_server_handle_call
  enabled: true
  language: erlang
  trust: local
  tag: ipc-message
  match:
    kind: param
    target:
      regex: "^[A-Z_][A-Za-z0-9_]*$"
      in_method: [handle_call]
      param_index_in: [0]
      param_count_in: [3]
      in_owner_base: [gen_server]
  match_examples:
  - name: gen server request
    code: |
      -module(example).
      -behaviour(gen_server).
      -export([handle_call/3]).
      handle_call(Request, From, State) ->
        {reply, Request, State}.
  - name: ordinary helper negative
    code: |
      -module(example).
      helper(Request, From, State) ->
        Request.
    expect_no_match: true
  - name: same callback signature without gen_server behaviour negative
    code: |
      -module(example).
      -export([handle_call/3]).
      handle_call(Request, From, State) ->
        {reply, Request, State}.
    expect_no_match: true
  description: "gen_server handle_call/3 request parameter 0 - local IPC input proven by parsed module behaviour ownership, callback arity, and parameter position."

- id: erlang.source.gen_server_handle_cast
  enabled: true
  language: erlang
  trust: local
  tag: ipc-message
  match:
    kind: param
    target:
      regex: "^[A-Z_][A-Za-z0-9_]*$"
      in_method: [handle_cast]
      param_index_in: [0]
      param_count_in: [2]
      in_owner_base: [gen_server]
  match_examples:
  - name: gen server cast request
    code: |
      -module(example).
      -behaviour(gen_server).
      -export([handle_cast/2]).
      handle_cast(Request, State) ->
        {noreply, State}.
  - name: wrong arity negative
    code: |
      -module(example).
      handle_cast(Request, From, State) ->
        Request.
    expect_no_match: true
  - name: same callback without behaviour negative
    code: |
      -module(example).
      handle_cast(Request, State) ->
        {noreply, State}.
    expect_no_match: true
  description: "gen_server handle_cast/2 request parameter 0 - local IPC input proven by parsed module behaviour ownership, callback arity, and parameter position."
