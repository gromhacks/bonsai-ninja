- id: erlang.sqli.emysql_execute
  enabled: true
  language: erlang
  tag: sql-injection
  severity: critical
  packages: [emysql]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: "^emysql:execute$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted emysql sql
    code: |
      -include_lib("emysql/include/emysql.hrl").
      -module(example).
      -export([test/1]).
      test(Input) ->
        emysql:execute(Input).
  - name: literal emysql sql negative
    code: |
      -include_lib("emysql/include/emysql.hrl").
      -module(example).
      -export([test/0]).
      test() ->
        emysql:execute("select 1").
    expect_no_match: true
  description: "emysql:execute — flag when SQL string built from tainted input rather than stmt_id + bindings."
