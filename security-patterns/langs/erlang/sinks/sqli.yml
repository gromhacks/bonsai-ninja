# Erlang SQL injection sinks across the major DB drivers.
- id: erlang.sqli.epgsql_squery
  enabled: true
  language: erlang
  tag: sql-injection
  severity: critical
  category: sql-exec
  packages: [epgsql]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: "^epgsql:squery$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: declared shape
    code: |
      -include_lib("epgsql/include/epgsql.hrl").
      -module(example).
      -export([test/2]).
      test(Conn, Input) ->
        epgsql:squery(Conn, Input).
  - name: arg tainted literal negative
    code: |
      -include_lib("epgsql/include/epgsql.hrl").
      -module(example).
      -export([test/1]).
      test(Conn) ->
        epgsql:squery(Conn, "select 1").
    expect_no_match: true
  description: "epgsql:squery - executes raw SQL string; no parameterization. Use equery with $1 placeholders."
