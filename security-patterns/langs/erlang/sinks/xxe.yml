# Erlang XXE sinks (xmerl + erlsom). Default DTD/external-entity resolution.
- id: erlang.xxe.xmerl_scan_file
  enabled: true
  language: erlang
  tag: xxe
  severity: high
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      regex: "^xmerl_scan:file"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        xmerl_scan:file(Input).
  - name: arg tainted literal negative
    code: |
      -module(example).
      -export([test/0]).
      test() ->
        xmerl_scan:file("priv/feed.xml").
    expect_no_match: true
  description: "xmerl_scan:file - resolves external DTD entities by default; attacker DTD -> file read / SSRF."

