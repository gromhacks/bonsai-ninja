- id: erlang.eval.code_ensure_loaded
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: erlang
  tag: code-injection
  severity: medium
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^code:(ensure_loaded|load_file)$"
  description: "Disabled — code:load_file/ensure_loaded loads a module by atom from code path; risky only when atom is attacker-derived. Pair with list_to_existing_atom check before enabling."
