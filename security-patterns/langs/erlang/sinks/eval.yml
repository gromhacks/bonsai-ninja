  enabled: true
  language: erlang
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^compile:forms"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          compile:forms(Input).
    - name: arg tainted literal negative
      code: |
        -module(example).
        -export([test/0]).
        test() ->
          compile:forms([]).
      expect_no_match: true
  description: "compile:forms — compiles AST to BEAM; tainted forms → arbitrary module loaded (RCE)."
- id: erlang.eval.code_load_binary
  enabled: true
  language: erlang
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^code:load_binary"
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
    - name: declared shape
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          code:load_binary(example, "nofile", Input).
    - name: arg tainted literal negative
      code: |
        -module(example).
        -export([test/0]).
        test() ->
          code:load_binary(example, "nofile", <<"safe">>).
      expect_no_match: true
  description: "code:load_binary/3 — hot-loads attacker-supplied BEAM bytes into the VM (RCE)."
- id: erlang.eval.erlang_apply_module
  enabled: true
  language: erlang
  tag: code-injection
  severity: high
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^(erlang:)?apply$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: tainted module
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          erlang:apply(Input, run, []).
    - name: literal module negative
      code: |
        -module(example).
        -export([test/0]).
        test() ->
          erlang:apply(example, run, []).
      expect_no_match: true
  description: "erlang:apply/3 (and bare apply/3) — tainted module atom selects attacker-controlled code to invoke."
