- id: erlang.eval.erlang_spawn_mfa
  aliases:
  - erlang.cmdi.erlang_spawn_mfa
  enabled: true
  language: erlang
  tag: code-injection
  severity: high
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^erlang:spawn$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted spawn module
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        erlang:spawn(Input, run, []).
  - name: tainted spawn args negative
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        erlang:spawn(safe_module, run, [Input]).
    expect_no_match: true
  description: "erlang:spawn(Module, Function, Args) with a tainted Module operand — attacker controls dynamic dispatch. Tainted Args alone are intentionally not a sink."

