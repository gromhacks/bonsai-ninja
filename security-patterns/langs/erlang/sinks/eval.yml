# Erlang dynamic-code evaluation sinks — tainted code/forms → RCE.
- id: erlang.eval.erl_eval
  enabled: true
  language: erlang
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^erl_eval:(exprs|expr|eval_str)"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          erl_eval:exprs(Input).
    - name: arg tainted literal negative
      code: |
        -module(example).
        -export([test/0]).
        test() ->
          erl_eval:exprs([]).
      expect_no_match: true
  description: "erl_eval — evaluates parsed Erlang AST; tainted forms execute as code (RCE)."
- id: erlang.eval.erl_scan_string
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: erlang
  tag: code-injection
  severity: medium
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^erl_scan:string"
  description: "Disabled — tokenizing alone is harmless; flag only when paired with erl_eval."
