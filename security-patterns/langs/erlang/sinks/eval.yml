- id: erlang.eval.code_ensure_loaded
  enabled: true
  language: erlang
  tag: code-injection
  severity: medium
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^code:(ensure_loaded|load_file)$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: tainted module load
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          code:ensure_loaded(Input).
    - name: literal module load negative
      code: |
        -module(example).
        -export([test/0]).
        test() ->
          code:ensure_loaded(safe_module).
      expect_no_match: true
  description: "code:ensure_loaded/load_file with a tainted module atom — attacker controls runtime code loading."
