- id: erlang.redos.re_compile
  enabled: true
  language: erlang
  tag: redos
  severity: medium
  packages: [stdlib]
  cwe: [CWE-1333]
  match:
    kind: call
    callee:
      regex: "^re:compile$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -include_lib("stdlib/include/stdlib.hrl").
      -export([test/1]).
      test(Input) ->
        re:compile(Input).
  - name: arg tainted literal negative
    code: |
      -module(example).
      -include_lib("stdlib/include/stdlib.hrl").
      -export([test/0]).
      test() ->
        re:compile("^[a-z]+$").
    expect_no_match: true
  description: "re:compile(tainted_pattern) — attacker-controlled regular expressions can trigger catastrophic backtracking."
