# Erlang JWT sinks. jose / erljwt - unverified or weak-alg decode.
- id: erlang.jwt.jose_jwt_verify
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: erlang
  tag: jwt
  severity: high
  packages: [jose]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      regex: "^jose_jwt:verify"
  match_examples:
  - name: declared shape
    code: |
      -include_lib("jose/include/jose.hrl").
      -module(example).
      -export([test/1]).
      test(Input) ->
        jose_jwt:verify(Input).
  description: "Disabled - requires a rulepack constraint that proves the unsafe JWT
    configuration, not just the broad API shape. jose_jwt:verify - flag when caller
    omits alg whitelist (none/HS256 with RSA pubkey confusion)."

- id: erlang.jwt.jose_jwt_peek
  enabled: true
  language: erlang
  tag: jwt
  severity: high
  packages: [jose]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      regex: "^jose_jwt:peek"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      -include_lib("jose/include/jose.hrl").
      -module(example).
      -export([test/1]).
      test(Input) ->
        jose_jwt:peek(Input).
  - name: literal jwt negative
    code: "-include_lib(\"jose/include/jose.hrl\").\n-module(example).\n-export([test/1]).\n\
      test(Input) ->\n  jose_jwt:verify(Input).\n"
    expect_no_match: true
  description: "jose_jwt:peek - decodes payload WITHOUT verifying signature; must
    be followed by verify."

- id: erlang.jwt.erljwt_decode
  enabled: true
  language: erlang
  tag: jwt
  severity: high
  packages: [erljwt]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      regex: "^erljwt:decode"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      -include_lib("erljwt/include/erljwt.hrl").
      -module(example).
      -export([test/1]).
      test(Input) ->
        erljwt:decode(Input).
  - name: literal jwt negative
    code: "-include_lib(\"erljwt/include/erljwt.hrl\").\n-module(example).\n-export([test/1]).\n\
      test(Input) ->\n  erljwt:encode(Input).\n"
    expect_no_match: true
  description: "erljwt:decode - does not verify signature unless explicitly invoked;
    trusts attacker claims."
