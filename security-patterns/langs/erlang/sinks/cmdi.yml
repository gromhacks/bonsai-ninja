- id: erlang.cmdi.rebar3_sh
  enabled: true
  language: erlang
  tag: command-injection
  severity: medium
  packages: [rebar3]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^rebar_utils:sh$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted rebar sh
    code: |
      -module(example).
      -include_lib("rebar3/include/rebar.hrl").
      -export([test/1]).
      test(Input) ->
        rebar_utils:sh(Input).
  - name: literal rebar sh negative
    code: |
      -module(example).
      -include_lib("rebar3/include/rebar.hrl").
      -export([test/0]).
      test() ->
        rebar_utils:sh("git --version").
    expect_no_match: true
  description: "rebar_utils:sh/1 — build-tool shell execution; tainted command strings are CI/build RCE."
