# Erlang command-injection sinks. Erlang stdlib + popular libs.
- id: erlang.cmdi.os_cmd
  enabled: true
  language: erlang
  tag: command-injection
  severity: critical
  category: process-exec
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^os:cmd$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        os:cmd(Input).
  - name: literal os cmd negative
    code: |
      -module(example).
      -export([test/0]).
      test() ->
        os:cmd("whoami").
    expect_no_match: true
  description: "os:cmd/1 — runs argument under /bin/sh -c; any tainted substring → RCE."

- id: erlang.cmdi.os_cmd_2
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: erlang
  tag: command-injection
  severity: critical
  category: process-exec
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^os:cmd/2$"
  description: "Disabled — adapter emits callee without arity; os_cmd above already matches."

- id: erlang.cmdi.erlang_open_port
  enabled: true
  language: erlang
  tag: command-injection
  severity: critical
  category: process-exec
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^erlang:open_port$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        erlang:open_port({spawn, Input}, []).
  - name: arg tainted literal negative
    code: |
      -module(example).
      -export([test/0]).
      test() ->
        erlang:open_port({spawn, "ls"}, []).
    expect_no_match: true
  description: "erlang:open_port({spawn, Cmd}, _) — Cmd runs under a shell; {spawn_executable, _} is the safer form."

