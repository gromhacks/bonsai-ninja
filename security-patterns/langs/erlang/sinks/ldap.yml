# Erlang LDAP-injection (eldap). Tainted filter enables ACL bypass / enumeration.
- id: erlang.ldap.eldap_search
  enabled: true
  language: erlang
  tag: ldap-injection
  severity: high
  packages: [eldap]
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      regex: "^eldap:search"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: declared shape
    code: |
      -include_lib("eldap/include/eldap.hrl").
      -module(example).
      -export([test/2]).
      test(Conn, Input) ->
        eldap:search(Conn, Input).
  - name: arg tainted literal negative
    code: |
      -include_lib("eldap/include/eldap.hrl").
      -module(example).
      -export([test/1]).
      test(Conn) ->
        eldap:search(Conn, [{base, "dc=example,dc=com"}]).
    expect_no_match: true
  description: "eldap:search - tainted filter term (e.g. {equalityMatch, ...}) enables LDAP injection/ACL bypass."

- id: erlang.ldap.eldap_modify_dn
