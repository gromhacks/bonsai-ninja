      index: 1
  match_examples:
  - name: tainted modify dn
    code: |
      -include_lib("eldap/include/eldap.hrl").
      -module(example).
      -export([test/2]).
      test(Conn, Input) ->
        eldap:modify(Conn, Input, [{add, "mail", ["a@example.com"]}]).
  - name: literal modify dn negative
    code: |
      -include_lib("eldap/include/eldap.hrl").
      -module(example).
      -export([test/1]).
      test(Conn) ->
        eldap:modify(Conn, "uid=alice,dc=example,dc=com", [{add, "mail", ["a@example.com"]}]).
    expect_no_match: true
  description: "eldap:modify - tainted DN modifies unintended directory entries."
