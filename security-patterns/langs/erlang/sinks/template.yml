# Erlang server-side template injection.
- id: erlang.template.erlydtl_compile
  enabled: true
  language: erlang
  tag: ssti
  severity: high
  packages: [erlydtl]
  cwe: [CWE-1336]
  match:
    kind: call
    callee:
      regex: "^erlydtl:(compile|compile_file|compile_template)"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      -include_lib("erlydtl/include/erlydtl.hrl").
      -module(example).
      -export([test/1]).
      test(Input) ->
        erlydtl:compile(Input).
  - name: arg tainted literal negative
    code: |
      -include_lib("erlydtl/include/erlydtl.hrl").
      -module(example).
      -export([test/0]).
      test() ->
        erlydtl:compile("Hello {{ name }}").
    expect_no_match: true
  description: "erlydtl:compile - Django-template port; compiling a tainted template string enables SSTI."

