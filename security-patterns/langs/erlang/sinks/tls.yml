# Erlang TLS misconfig - peer verification disabled.
- id: erlang.tls.ssl_verify_none
  enabled: true
  language: erlang
  tag: weak-tls
  category: source-independent
  severity: high
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      regex: "^ssl:connect"
  match_examples:
    - name: declared shape
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          ssl:connect(Input).
  description: "ssl:connect - flag when options include {verify, verify_none}; no cert chain validation -> MITM."

- id: erlang.tls.httpc_request_no_verify
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: erlang
  tag: weak-tls
  severity: medium
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      regex: "^httpc:request"
  description: "Disabled - duplicates erlang.ssrf.httpc_request regex; tls check needs [{ssl,[{verify,verify_none}]}] constraint support."
