# Erlang insecure deserialization - binary_to_term without {safe, true}.
- id: erlang.deser.binary_to_term
  enabled: true
  language: erlang
  tag: insecure-deserialization
  severity: critical
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      regex: "^binary_to_term$"
  constraints:
  - arg_count: 1
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          binary_to_term(Input).
    - name: arg tainted literal negative
      code: |
        -module(example).
        -export([test/0]).
        test() ->
          binary_to_term(<<131,100,0,2,111,107>>).
      expect_no_match: true
  description: "binary_to_term/1 - crafted term triggers atom-table exhaustion (DoS) and record/pid forging. Use binary_to_term/2 with [safe]."
- id: erlang.deser.binary_to_term_2
  enabled: true
  language: erlang
  tag: insecure-deserialization
  severity: medium
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      regex: "^binary_to_term$"
  constraints:
  - arg_count: 2
  - arg_tainted:
      index: 0
  match_examples:
  - name: untrusted term with dynamic decoding options
    code: |
      -module(example).
      -export([test/2]).
      test(Input, Options) ->
        binary_to_term(Input, Options).
  - name: literal term is not attacker controlled
    code: |
      -module(example).
      -export([test/0]).
      test() ->
        binary_to_term(<<131,100,0,2,111,107>>, []).
    expect_no_match: true
  description: "binary_to_term/2 with attacker-controlled bytes remains an unsafe decode unless an exact safe-option sanitizer is proven on the call."
- id: erlang.deser.list_to_atom
  enabled: true
  language: erlang
  tag: atom-exhaustion
  severity: high
  cwe: [CWE-400]
  match:
    kind: call
    callee:
      regex: "^(list|binary)_to_atom$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          list_to_atom(Input).
    - name: arg tainted literal negative
      code: |
        -module(example).
        -export([test/0]).
        test() ->
          list_to_atom("safe_atom").
      expect_no_match: true
    - name: existing atom safe form negative
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          list_to_existing_atom(Input).
      expect_no_match: true
  description: "list_to_atom/binary_to_atom on tainted input - atom table is global, never GC'd; unbounded keys exhaust the VM. Use list_to_existing_atom."

- id: erlang.deser.ets_match_spec
  enabled: true
  language: erlang
  tag: ets-match-dos
  severity: medium
  cwe: [CWE-400]
  match:
    kind: call
    callee:
      regex: "^ets:(select|match|match_object|match_delete)$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
    - name: declared shape
      code: |
        -module(example).
        -export([test/2]).
        test(Table, Input) ->
          ets:select(Table, Input).
    - name: arg tainted literal negative
      code: |
        -module(example).
        -export([test/1]).
        test(Table) ->
          ets:select(Table, [{{'$1'}, [], ['$1']}]).
      expect_no_match: true
  description: "ets:select/match/match_object/match_delete - tainted match-spec or pattern enables full-table scan DoS or unauthorized row read."
