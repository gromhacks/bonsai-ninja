  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: "^eredis:q$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: declared shape
    code: |
      -include_lib("eredis/include/eredis.hrl").
      -module(example).
      -export([test/2]).
      test(Client, Input) ->
        eredis:q(Client, Input).
  - name: arg tainted literal negative
    code: |
      -include_lib("eredis/include/eredis.hrl").
      -module(example).
      -export([test/1]).
      test(Client) ->
        eredis:q(Client, ["GET", "key"]).
    expect_no_match: true
  description: "eredis:q - tainted command list enables Redis command injection; EVAL path is Lua RCE-adjacent."

- id: erlang.nosql_mongoc_aggregate
  enabled: true
  language: erlang
  tag: nosql-injection
  severity: high
  packages: [mongodb]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: "^mongo:aggregate"
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: erlang mongo aggregate pipeline
    code: |
      -module(example).
      -include_lib("mongodb/include/mongodb.hrl").
      -export([test/3]).
      test(Conn, Collection, Input) ->
        mongo:aggregate(Conn, Collection, Input).
    expect_match_text: ["mongo:aggregate"]
  - name: arg tainted literal negative
    code: |
      -module(example).
      -include_lib("mongodb/include/mongodb.hrl").
      -export([test/2]).
      test(Conn, Collection) ->
        mongo:aggregate(Conn, Collection, []).
    expect_no_match: true
  description: "mongodb-erlang mongo:aggregate - tainted aggregation pipeline can inject operators such as $lookup / $where and bypass authorization logic."
- id: erlang.nosql.mnesia_select_matchspec
  enabled: true
  language: erlang
  tag: nosql-injection
  severity: medium
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: "^mnesia:select$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted mnesia match spec
    code: |
      -module(example).
      -export([test/2]).
      test(Table, Input) ->
        mnesia:select(Table, Input).
  - name: literal mnesia match spec negative
    code: |
      -module(example).
      -export([test/1]).
      test(Table) ->
        mnesia:select(Table, [{{'$1'}, [], ['$1']}]).
    expect_no_match: true
  description: "mnesia:select(Table, tainted_match_spec) - attacker-controlled match specs can bypass intended filters or force expensive table scans."
- id: erlang.nosql.mnesia_match_object
  enabled: true
  language: erlang
  tag: nosql-injection
  severity: medium
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: "^mnesia:match_object$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted mnesia match object pattern
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        mnesia:match_object(Input).
  - name: literal mnesia match object negative
    code: |
      -module(example).
      -export([test/0]).
      test() ->
        mnesia:match_object({users, '_', '_'}).
    expect_no_match: true
  description: "mnesia:match_object(tainted_pattern) - attacker-controlled term patterns can bypass application-level query restrictions."
