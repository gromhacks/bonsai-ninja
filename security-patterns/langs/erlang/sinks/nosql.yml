# Erlang NoSQL injection (mongodb-erlang / eredis EVAL).
- id: erlang.nosql.mongoc_find
  enabled: true
  language: erlang
  tag: nosql-injection
  severity: high
  packages: [mongodb]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: "^mongo:find"
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: declared shape
    code: |
      -module(example).
      -include_lib("mongodb/include/mongodb.hrl").
      -export([test/3]).
      test(Conn, Collection, Input) ->
        mongo:find(Conn, Collection, Input).
  - name: arg tainted literal negative
    code: |
      -module(example).
      -include_lib("mongodb/include/mongodb.hrl").
      -export([test/2]).
      test(Conn, Collection) ->
        mongo:find(Conn, Collection, #{}).
    expect_no_match: true
  description: "mongodb-erlang mongo:find - tainted selector map (e.g. $where operator) enables query injection/auth bypass."

- id: erlang.nosql.eredis_q
