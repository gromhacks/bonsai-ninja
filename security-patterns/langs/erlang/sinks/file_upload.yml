# Erlang file-upload sinks. Multipart readers are sources; upload risk begins
# only when client-controlled metadata reaches a filesystem destination.
- id: erlang.upload_file_copy_client_filename
  enabled: true
  language: erlang
  tag: file-upload
  severity: medium
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      regex: "^file:copy"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: erlang copy upload to filename
    code: |
      -module(example).
      -export([test/2]).
      test(Upload, Filename) ->
        file:copy(Upload, Filename).
    expect_match_text: ["file:copy"]
  - name: arg tainted literal negative
    code: |
      -module(example).
      -export([test/1]).
      test(Upload) ->
        file:copy(Upload, "uploads/avatar.png").
    expect_no_match: true
  description: "file:copy(upload, filename) - copying multipart content to a client-named destination can overwrite arbitrary files."
