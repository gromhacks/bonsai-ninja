# Erlang path-traversal sinks. file:* module + archive extraction.
- id: erlang.path.file_read_file
  enabled: true
  language: erlang
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      regex: "^file:read_file$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          file:read_file(Input).
    - name: arg tainted literal negative
      code: |
        -module(example).
        -export([test/0]).
        test() ->
          file:read_file("priv/app.config").
      expect_no_match: true
  description: "file:read_file/1 — reads arbitrary path; traversal via ../ leaks secrets (/etc/passwd, keys)."
- id: erlang.path.file_write_file
  aliases:
  - erlang.upload_file_write_client_filename
  enabled: true
  language: erlang
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      regex: "^file:write_file"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: tainted write file path
      code: |
        -module(example).
        -export([test/2]).
        test(Input, Body) ->
          file:write_file(Input, Body).
    - name: tainted write file body negative
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          file:write_file("tmp/report.txt", Input).
      expect_no_match: true
  description: "file:write_file/2,3 — tainted path lets attacker clobber arbitrary files; tainted file content alone is not a traversal finding."
