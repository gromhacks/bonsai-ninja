# Erlang path-traversal sinks. file:* module + archive extraction.
- id: erlang.path.file_read_file
  enabled: true
  language: erlang
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      regex: "^file:read_file$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        -module(example).
        -export([test/1]).
        test(Input) ->
          file:read_file(Input).
    - name: arg tainted literal negative
      code: |
        -module(example).
        -export([test/0]).
        test() ->
          file:read_file("priv/app.config").
      expect_no_match: true
  description: "file:read_file/1 — reads arbitrary path; traversal via ../ leaks secrets (/etc/passwd, keys)."
- id: erlang.path.file_write_file
  enabled: false
  disabled_reason:
    code: over-broad
  language: erlang
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      regex: "^file:write_file"
  description: "Disabled — only arg 0 is a traversal sink; v1 sink taint checks any arg and over-fires on tainted file content."
