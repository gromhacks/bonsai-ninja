- id: erlang.ssrf.ibrowse_send_req
  enabled: true
  language: erlang
  tag: ssrf
  severity: high
  packages: [ibrowse]
  cwe: [CWE-918]
  match:
    kind: call
    callee:
      regex: "^ibrowse:send_req"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      -include_lib("ibrowse/include/ibrowse.hrl").
      -module(example).
      -export([test/1]).
      test(Input) ->
        ibrowse:send_req(Input, [], get, []).
  - name: arg tainted literal negative
    code: |
      -include_lib("ibrowse/include/ibrowse.hrl").
      -module(example).
      -export([test/0]).
      test() ->
        ibrowse:send_req("https://example.com", [], get, []).
    expect_no_match: true
  description: "ibrowse:send_req - tainted URL reaches attacker-picked host."
