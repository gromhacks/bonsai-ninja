# Erlang SSRF sinks - HTTP clients. Tainted URL -> attacker picks destination host.
- id: erlang.ssrf.httpc_request_url
  enabled: true
  language: erlang
  tag: ssrf
  severity: high
  cwe: [CWE-918]
  match:
    kind: call
    callee:
      regex: "^httpc:request"
  constraints:
  - max_args: 1
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted unary request url
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        httpc:request(Input).
  - name: literal unary request url negative
    code: |
      -module(example).
      -export([test/0]).
      test() ->
        httpc:request("https://example.com").
    expect_no_match: true
  description: "inets httpc:request/1 - tainted URL reaches internal metadata (169.254.169.254)."
- id: erlang.ssrf.httpc_request_tuple
  enabled: true
  language: erlang
  tag: ssrf
  severity: high
  cwe: [CWE-918]
  match:
    kind: call
    callee:
      regex: "^httpc:request"
  constraints:
  - min_args: 2
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted method request tuple
    code: |
      -module(example).
      -export([test/1]).
      test(Input) ->
        httpc:request(get, {Input, []}, [], []).
  - name: literal method request tuple negative
    code: |
      -module(example).
      -export([test/0]).
      test() ->
        httpc:request(get, {"https://example.com", []}, [], []).
    expect_no_match: true
  description: "inets httpc:request/4 - tainted request URL tuple reaches internal metadata (169.254.169.254)."
- id: erlang.ssrf.gun_method_path
  enabled: true
  language: erlang
  tag: ssrf
  severity: high
  packages: [gun]
  cwe: [CWE-918]
  match:
    kind: call
    callee:
      regex: "^gun:(get|post|put|delete)$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted gun path
    code: |
      -include_lib("gun/include/gun.hrl").
      -module(example).
      -export([test/2]).
      test(Conn, Input) ->
        gun:get(Conn, Input).
  - name: literal gun path negative
    code: |
      -include_lib("gun/include/gun.hrl").
      -module(example).
      -export([test/1]).
      test(Conn) ->
        gun:get(Conn, "/health").
    expect_no_match: true
  description: "gun HTTP client - tainted request path reaches arbitrary upstream route."
