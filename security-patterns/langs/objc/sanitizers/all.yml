# Objective-C sanitizers (canonical tags: url-sanitizer, sql-sanitizer, xss-sanitizer, crypto-sanitizer).
- id: objc.sanitizer.snprintf_bounded
  enabled: true
  language: objc
  tag: validation
  match:
    kind: call
    callee:
      name: snprintf
  taint_semantics:
    clean_output_overwrite:
      output_arg_index: 0
      value_start_arg_index: 2
  match_examples:
  - name: bounded clean overwrite
    code: |
      void example(char *buf) {
        snprintf(buf, 128, "%s", "safe");
      }
    expect_match_text: [snprintf]
  description: "snprintf - bounded format; configured as a clean output overwrite only when value-bearing inputs are clean."

- id: objc.sanitizer.adding_percent_encoding
  enabled: true
  language: objc
  tag: url-encode
  match:
    kind: call
    callee:
      regex: "^(stringByAddingPercentEncodingWithAllowedCharacters|stringByAddingPercentEscapesUsingEncoding)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; stringByAddingPercentEncodingWithAllowedCharacters(input); }
    expect_match_text: [stringByAddingPercentEncodingWithAllowedCharacters]
  description: "NSString -stringByAddingPercentEncodingWithAllowedCharacters: - percent-encodes for URL path/query components;
    neutralizes URL-injection."

- id: objc.sanitizer.nsurlcomponents_build
  enabled: true
  language: objc
  tag: url-build
  match:
    kind: call
    callee:
      regex: "^(componentsWithString|componentsWithURL|setQueryItems|queryItemWithName)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; componentsWithString(input); }
    expect_match_text: [componentsWithString]
  description: "NSURLComponents / NSURLQueryItem builders - structured URL assembly that escapes path/query components per
    RFC 3986; safer than +URLWithString: on a concatenated string."

- id: objc.sanitizer.sqlite3_bind
  enabled: true
  language: objc
  tag: sql-parameter
  match:
    kind: call
    callee:
      regex: "^(sqlite3_bind_text|sqlite3_bind_text16|sqlite3_bind_blob|sqlite3_bind_blob64|sqlite3_bind_int|sqlite3_bind_int64|sqlite3_bind_double|sqlite3_bind_null|sqlite3_bind_value|sqlite3_bind_zeroblob)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; sqlite3_bind_text(input); }
    expect_match_text: [sqlite3_bind_text]
  description: "sqlite3_bind_* family - parameterized binding for prepared statements; values cannot be interpreted as SQL."

- id: objc.sanitizer.fmdb_arguments_array
  enabled: true
  language: objc
  tag: sql-parameter
  packages: [fmdb]
  match:
    kind: call
    callee:
      regex: "^(executeQueryWithFormat|executeUpdateWithFormat|executeUpdate:withArgumentsInArray:|executeQuery:withArgumentsInArray:)$"
  match_examples:
  - name: declared shape
    code: |
      #import <fmdb/fmdb.h>
      void test(id input) { id target = input; int amount = 1; executeQueryWithFormat(input); }
    expect_match_text: [executeQueryWithFormat]
  description: "FMDB parameterized forms (-executeUpdate:withArgumentsInArray:, -executeQueryWithFormat:) - binds values as
    SQLite parameters."

- id: objc.sanitizer.gtm_string_escape_html
  enabled: true
  language: objc
  tag: html-encode
  match:
    kind: call
    callee:
      regex: "^(gtm_stringByEscapingForHTML|gtm_stringByEscapingForAsciiHTML)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; gtm_stringByEscapingForHTML(input); }
    expect_match_text: [gtm_stringByEscapingForHTML]
  description: "GTMStringAdditions -gtm_stringByEscapingForHTML - HTML-entity escapes `<`/`>`/`&`/`\"`."

- id: objc.sanitizer.sec_random_copy_bytes
  enabled: true
  language: objc
  tag: validation
  match:
    kind: call
    callee:
      name: SecRandomCopyBytes
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; SecRandomCopyBytes(input); }
    expect_match_text: [SecRandomCopyBytes]
  description: "SecRandomCopyBytes - Darwin CSPRNG; use instead of rand()/arc4random_uniform for keys/tokens."

- id: objc.sanitizer.commoncrypto_constant_compare
  enabled: true
  language: objc
  tag: constant-time
  match:
    kind: call
    callee:
      regex: "^(CCHmacVerify|timingsafe_bcmp|timingsafe_memcmp)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; CCHmacVerify(input); }
    expect_match_text: [CCHmacVerify]
  description: "Constant-time comparison helper (CCHmacVerify / timingsafe_bcmp / timingsafe_memcmp) - avoids MAC/HMAC timing
    oracles. Replaces memcmp on CC_SHA256/CC_SHA512 digest pairs."

- id: objc.sanitizer.cccryptor_create_with_mode
  enabled: true
  language: objc
  tag: crypto-mode
  match:
    kind: call
    callee:
      name: CCCryptorCreateWithMode
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; CCCryptorCreateWithMode(input); }
    expect_match_text: [CCCryptorCreateWithMode]
  description: "CommonCrypto CCCryptorCreateWithMode - explicit mode/IV selection (CBC/GCM); use over CCCrypt's positional
    defaults to avoid silent ECB. Sanitizer effect requires a non-ECB mode literal at the call site (rule fires regardless;
    pair with weak-crypto detector)."

- id: objc.sanitizer.cccryptor_update
  enabled: true
  language: objc
  tag: crypto-bounds
  match:
    kind: call
    callee:
      regex: "^(CCCryptorUpdate|CCCryptorFinal|CCCryptorGetOutputLength)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; CCCryptorUpdate(input); }
    expect_match_text: [CCCryptorUpdate]
  description: "CommonCrypto CCCryptorUpdate / CCCryptorFinal - bounds-checked block updates over CCCryptorRef; safer than
    CCCrypt one-shot when input length isn't statically known."

- id: objc.sanitizer.cc_keyderivation_pbkdf
  enabled: true
  language: objc
  tag: kdf
  match:
    kind: call
    callee:
      regex: "^(CCKeyDerivationPBKDF|CCCalibratePBKDF)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; CCKeyDerivationPBKDF(input); }
    expect_match_text: [CCKeyDerivationPBKDF]
  description: "CommonCrypto CCKeyDerivationPBKDF - PBKDF2 password stretching; neutralizes raw-password-as-key crypto antipattern."

- id: objc.sanitizer.plist_secure_coding
  enabled: true
  language: objc
  tag: deser-secure
  match:
    kind: call
    callee:
      regex: "^(?:.*\\.)?(unarchivedObjectOfClass|unarchivedObjectOfClasses|initForReadingFromData)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; [NSKeyedUnarchiver unarchivedObjectOfClass:input fromData:input error:nil]; }
    expect_match_text: [NSKeyedUnarchiver.unarchivedObjectOfClass]
  description: "NSKeyedUnarchiver +unarchivedObjectOfClass:fromData:error: / +unarchivedObjectOfClasses:fromData:error: -
    secure-coding-enforced decode that requires the target class to conform to NSSecureCoding; neutralizes class-substitution
    RCE."

- id: objc.sanitizer.requires_secure_coding_yes
  enabled: true
  language: objc
  tag: deser-secure
  match:
    kind: write
    target:
      attribute:
      - NSKeyedUnarchiver
      - requiresSecureCoding
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; NSKeyedUnarchiver.requiresSecureCoding = input; }
    expect_match_text: [NSKeyedUnarchiver.requiresSecureCoding]
  description: "NSKeyedUnarchiver .requiresSecureCoding = YES - forces NSSecureCoding enforcement on legacy unarchive paths.
    Sanitizer effect on insecure-deserialization sinks earlier on the same path."

- id: objc.sanitizer.nsnumber_integervalue
  enabled: true
  language: objc
  tag: numeric-coerce
  match:
    kind: call
    callee:
      regex: "^(integerValue|intValue|longLongValue|doubleValue|boolValue)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; integerValue(input); }
    expect_match_text: [integerValue]
  description: "NSString/NSScanner numeric coercion - converts tainted text to integer/double/bool, neutralizing SQL/command
    injection when value is reserialized as a number."

- id: objc.sanitizer.has_prefix_same_origin
  enabled: true
  language: objc
  tag: same-origin-path
  match:
    kind: call
    callee:
      name: hasPrefix
  constraints:
  - any_arg_matches_regex: '^@?"/[^"]*"$'
  match_examples:
  - name: NSString hasPrefix local path
    code: |
      void test(id input) { [input hasPrefix:@"/app/"]; }
    expect_match_text: [input.hasPrefix]
  - name: NSString hasPrefix local path negative constraint boundary
    code: "void example() {\n  input.hasPrefix();\n}\n"
    expect_no_match: true
  description: "NSString -hasPrefix:@\"/...\" - slash-rooted same-origin redirect/path guard."

- id: objc.sanitizer.contains_object_allowlist
  enabled: false
  language: objc
  tag: allowlist-validate
  match:
    kind: call
    callee:
      regex: "(^|\\.)(containsObject|containsObject:|objectForKey|objectForKeyedSubscript)$"
  match_examples:
  - name: NSArray containsObject allowlist
    code: |
      void test(id input) { [allowed containsObject:input]; }
    expect_match_text: [allowed.containsObject]
  description: "Disabled - receiver-name allowlist heuristics are not semantic enough to grant sanitizer credit. NSArray/NSSet/NSDictionary
    lookup on allowlist-named receivers - finite set/map validation."

  disabled_reason:
    code: over-broad
- id: objc.sanitizer.nspredicate_self_matches
  enabled: true
  language: objc
  tag: regex-validate
  match:
    kind: call
    callee:
      regex: "^(predicateWithFormat|evaluateWithObject)$"
  constraints:
  - any_arg_matches_regex: "SELF\\s+MATCHES|^@?\"\\^.*\\$\"$"
  match_examples:
  - name: NSPredicate SELF MATCHES
    code: |
      void test(id input) { predicateWithFormat(@"SELF MATCHES %@", @"^[A-Za-z0-9_-]+$"); }
    expect_match_text: [predicateWithFormat]
  - name: NSPredicate SELF MATCHES negative constraint boundary
    code: "void test(id input) { predicateWithFormat(); }\n"
    expect_no_match: true
  description: "NSPredicate SELF MATCHES with an anchored allowlist regex - validates the whole input shape."

- id: objc.sanitizer.regex_replace_char_allowlist
  enabled: true
  language: objc
  tag: char-allowlist
  match:
    kind: call
    callee:
      name: stringByReplacingOccurrencesOfString
  constraints:
  - any_arg_matches_regex: "\\[\\^[^\\]]+\\]"
  - any_arg_matches_regex: '^@?""$'
  - any_arg_matches_regex: "NSRegularExpressionSearch"
  match_examples:
  - name: strip non slug chars
    code: |
      void test(id input) { [input stringByReplacingOccurrencesOfString:@"[^A-Za-z0-9_-]" withString:@"" options:NSRegularExpressionSearch range:NSMakeRange(0, 1)]; }
    expect_match_text: [input.stringByReplacingOccurrencesOfString]
  - name: strip non slug chars negative constraint boundary
    code: "void example() {\n  input.stringByReplacingOccurrencesOfString();\n}\n"
    expect_no_match: true
  description: "NSString regex replacement of `[^safe]` with empty string - strips characters outside an allowlist."

- id: objc.sanitizer.nsregularexpression_validate
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  tag: validation
  match:
    kind: call
    callee:
      name: numberOfMatchesInString
  description: "Disabled - NSRegularExpression -numberOfMatchesInString: is only a sanitizer when used as an allowlist guard;
    cannot prove guard semantics from the call shape alone. Enable per-project with rule-narrowing."

# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) - taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: objc.passthrough.string_by_removing_percent
  enabled: true
  language: objc
  tag: passthrough-decode
  match:
    kind: call
    callee:
      name: stringByRemovingPercentEncoding
  taint_semantics:
    call_result_passthrough_receiver: true
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; stringByRemovingPercentEncoding(input); }
    expect_match_text: [stringByRemovingPercentEncoding]
  description: "NSString stringByRemovingPercentEncoding - instance method; preserves taint."
