- id: objc.typing.lifecycle_released_receiver
  enabled: true
  language: objc
  match:
    kind: call
    callee:
      regex: '(?:^|\.)(?:release|dealloc|autorelease)$'
  lifecycle_transition:
    state: freed
    binding: { kind: receiver }
  match_examples:
  - name: release changes the receiver state
    code: 'void f(NSObject *object) { [object release]; }'
    expect_match_text: [object.release]
  description: "Objective-C release/dealloc/autorelease moves the receiver to freed. Typing-only; never a finding."

- id: objc.typing.lifecycle_closed_receiver
  enabled: true
  language: objc
  match: { kind: call, callee: { name: close } }
  lifecycle_transition:
    state: closed
    binding: { kind: receiver }
  match_examples:
  - name: close changes the receiver state
    code: 'void f(NSInputStream *stream) { [stream close]; }'
    expect_match_text: [stream.close]
  description: "Objective-C close moves the receiver to closed. Typing-only; never a finding."

- id: objc.typing.lifecycle_freed_argument
  enabled: true
  language: objc
  match:
    kind: call
    callee:
      regex: '^(?:CFRelease|free)$'
  lifecycle_transition:
    state: freed
    binding: { kind: argument, index: 0 }
  match_examples:
  - name: CFRelease changes the argument state
    code: 'void f(CFTypeRef value) { CFRelease(value); }'
    expect_match_text: [CFRelease]
  description: "C-compatible release functions move argument zero to freed. Typing-only; never a finding."

- id: objc.typing.lifecycle_cancelled_receiver
  enabled: true
  language: objc
  match: { kind: call, callee: { name: cancel } }
  lifecycle_transition:
    state: cancelled
    binding: { kind: receiver }
  match_examples:
  - name: cancel changes the receiver state
    code: 'void f(NSOperation *operation) { [operation cancel]; }'
    expect_match_text: [operation.cancel]
  description: "Objective-C cancel moves the receiver to cancelled. Typing-only; never a finding."
