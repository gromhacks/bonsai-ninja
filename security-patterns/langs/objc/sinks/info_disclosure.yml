# Objective-C information-disclosure sinks (logs, debug output, error responses).
- id: objc.info_disclosure.ddlogerror_secret
  enabled: true
  language: objc
  tag: information-disclosure
  severity: medium
  packages: [CocoaLumberjack]
  cwe: [CWE-200]
  match:
    kind: call
    callee:
      name: DDLogError
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: objc cocoa lumberjack secret log
    code: |
      #import <CocoaLumberjack/CocoaLumberjack.h>
      void test(id input) { DDLogError(@"api_key=%@", input); }
    expect_match_text: [DDLogError]
  - name: literal lumberjack log negative
    code: |
      #import <CocoaLumberjack/CocoaLumberjack.h>
      void test(void) { DDLogError(@"startup complete"); }
    expect_no_match: true
  description: "DDLogError with secret-shaped data - structured logs can persist credentials. Fires only when an argument is attacker/secret-tainted; constant diagnostic strings are quiet."

- id: objc.info_disclosure.gcdwebserver_error_response
  enabled: true
  language: objc
  tag: information-disclosure
  severity: high
  packages: [GCDWebServer]
  cwe: [CWE-209]
  match:
    kind: call
    callee:
      name: responseWithStatusCode
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: objc gcdwebserver error response
    code: |
      #import <GCDWebServer/GCDWebServer.h>
      void test(id input) { [GCDWebServerDataResponse responseWithStatusCode:500 text:input]; }
    expect_match_text: [GCDWebServerDataResponse.responseWithStatusCode]
  - name: literal gcdwebserver error response negative
    code: |
      #import <GCDWebServer/GCDWebServer.h>
      void test(void) { [GCDWebServerDataResponse responseWithStatusCode:500 text:@"Internal Error"]; }
    expect_no_match: true
  description: "GCDWebServer responseWithStatusCode:500 text:error - sends internal diagnostics in HTTP error pages. Fires only when the response body argument is tainted; constant error pages are quiet."
