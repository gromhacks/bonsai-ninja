- id: objc.ldap.ldap_modify
  enabled: true
  language: objc
  tag: ldap-injection
  severity: high
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      regex: "^(ldap_modify|ldap_modify_s|ldap_modify_ext|ldap_modify_ext_s)$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; ldap_modify(input); }
  - name: literal arg 1 negative
    code: |
      void example(void) {
        ldap_modify("safe", "safe");
      }
    expect_no_match: true
  description: "OpenLDAP ldap_modify(_s/_ext/_ext_s) — tainted DN/mods permit DIT modification."

