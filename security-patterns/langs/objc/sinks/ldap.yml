# Objective-C LDAP-injection sinks (OpenLDAP C library via bridge).
- id: objc.ldap.ldap_search_ext
  enabled: true
  language: objc
  tag: ldap-injection
  severity: high
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      regex: "^(ldap_search_ext|ldap_search_ext_s)$"
  constraints:
  - arg_tainted:
      index: 3
  match_examples:
  - name: declared shape
    code: |
      void test(LDAP *ld, const char *input) { id target = input; int amount = 1; ldap_search_ext(ld, "dc=example,dc=com", 0, input, NULL, 0, NULL, NULL, NULL, 0, NULL); }
  - name: literal ldap search filter negative
    code: |
      void test(LDAP *ld, const char *input) { ldap_search_ext(ld, input, 0, "(uid=safe)", NULL, 0, NULL, NULL, NULL, 0, NULL); }
    expect_no_match: true
  description: "OpenLDAP ldap_search_ext(_s) — tainted filter string permits LDAP filter injection."

