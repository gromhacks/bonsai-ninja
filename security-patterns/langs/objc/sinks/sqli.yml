- id: objc.sqli.fmdb_executequery
  enabled: true
  language: objc
  tag: sql-injection
  severity: high
  packages: [fmdb]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: executeQuery
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      #import <fmdb/fmdb.h>
      void test(id input) { id target = input; int amount = 1; [FMDatabase executeQuery:input]; }
  - name: literal fmdb query negative
    code: |
      #import <fmdb/fmdb.h>
      void test(void) { [FMDatabase executeQuery:@"SELECT 1"]; }
    expect_no_match: true
  description: "FMDB -executeQuery: with tainted SQL string. Safe form: -executeQuery:withArgumentsInArray:. Constrained to FMDB receivers to avoid overlap with unrelated `executeQuery` selectors."

- id: objc.sqli.fmdb_executeupdate
  enabled: true
  language: objc
  tag: sql-injection
  severity: high
  packages: [fmdb]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: executeUpdate
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      #import <fmdb/fmdb.h>
      void test(id input) { id target = input; int amount = 1; [FMDatabase executeUpdate:input]; }
  - name: literal fmdb update negative
    code: |
      #import <fmdb/fmdb.h>
      void test(void) { [FMDatabase executeUpdate:@"UPDATE users SET seen = 1"]; }
    expect_no_match: true
  description: "FMDB -executeUpdate: with tainted SQL. Safe form uses -executeUpdate:withArgumentsInArray: (parameterized)."

- id: objc.sqli.fmdb_executestatements
  enabled: true
  language: objc
  tag: sql-injection
  severity: critical
  packages: [fmdb]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: executeStatements
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      #import <fmdb/fmdb.h>
      void test(id input) { id target = input; int amount = 1; [FMDatabase executeStatements:input]; }
  - name: literal fmdb statements negative
    code: |
      #import <fmdb/fmdb.h>
      void test(void) { [FMDatabase executeStatements:@"CREATE TABLE safe(id INTEGER)"]; }
    expect_no_match: true
  description: "FMDB -executeStatements: — runs multiple semicolon-separated statements; no parameter form exists, so tainted input is always injection."
