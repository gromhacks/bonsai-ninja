# Objective-C SQL-injection sinks (SQLite C API + FMDB wrapper).
- id: objc.sqli.sqlite3_exec
  enabled: true
  language: objc
  tag: sql-injection
  severity: critical
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: sqlite3_exec
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: declared shape
    code: |
      void test(sqlite3 *db, const char *input) { id target = input; int amount = 1; sqlite3_exec(db, input, NULL, NULL, NULL); }
  - name: literal sql negative
    code: |
      void test(sqlite3 *db) { sqlite3_exec(db, "SELECT 1", NULL, NULL, NULL); }
    expect_no_match: true
  description: "sqlite3_exec — runs concatenated SQL; no placeholders possible so tainted input is always injection."

- id: objc.sqli.sqlite3_prepare_v2
  enabled: true
  language: objc
  tag: sql-injection
  severity: high
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: "^sqlite3_prepare(_v2|_v3)?$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: declared shape
    code: |
      void test(sqlite3 *db, const char *input) { id target = input; int amount = 1; sqlite3_prepare_v2(db, input, -1, NULL, NULL); }
  - name: literal prepare sql negative
    code: |
      void test(sqlite3 *db) { sqlite3_prepare_v2(db, "SELECT 1", -1, NULL, NULL); }
    expect_no_match: true
  description: "sqlite3_prepare(_v2/_v3) — SQL text argument must not be built with stringWithFormat: / string concatenation."

