# Objective-C TLS misconfiguration sinks.
- id: objc.tls.urlsession_disable_evaluation
  enabled: true
  language: objc
  tag: weak-tls
  category: source-independent
  severity: critical
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: URLSessionDidReceiveChallenge
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; URLSessionDidReceiveChallenge(input); }
  description: "NSURLSessionDelegate URLSession:didReceiveChallenge: completionHandler returning NSURLSessionAuthChallengeUseCredential without SecTrustEvaluate - disables cert validation."

- id: objc.tls.afnetworking_pinningmode_none
  enabled: true
  language: objc
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [AFNetworking]
  cwe: [CWE-295]
  match:
    kind: write
    target:
      regex: "^[^\\.\\s]+\\.SSLPinningMode$"
      receiver_type_in: [AFSecurityPolicy]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^AFSSLPinningModeNone$'
  match_examples:
  - name: AFNetworking certificate pinning disabled
    code: |
      #import <AFNetworking/AFNetworking.h>
      void configure(AFSecurityPolicy *policy) { policy.SSLPinningMode = AFSSLPinningModeNone; }
  - name: AFNetworking certificate pinning enabled negative
    code: |
      #import <AFNetworking/AFNetworking.h>
      void configure(AFSecurityPolicy *policy) { policy.SSLPinningMode = AFSSLPinningModeCertificate; }
    expect_no_match: true
  - name: local pinning-mode collision negative
    code: |
      void configure(void) { NSInteger SSLPinningMode = AFSSLPinningModeNone; }
    expect_no_match: true
  description: "`AFSecurityPolicy.SSLPinningMode = AFSSLPinningModeNone` disables certificate pinning; exact member and constant-value constraints reject secure modes and local collisions."

- id: objc.tls.afnetworking_allow_invalid
  enabled: true
  language: objc
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [AFNetworking]
  cwe: [CWE-295]
  match:
    kind: write
    target:
      regex: "^[^\\.\\s]+\\.allowInvalidCertificates$"
      receiver_type_in: [AFSecurityPolicy]
  constraints:
  - arg_equals: {index: 0, value: "YES"}
  match_examples:
  - name: AFNetworking accepts invalid certificates
    code: |
      #import <AFNetworking/AFNetworking.h>
      void configure(AFSecurityPolicy *policy) { policy.allowInvalidCertificates = YES; }
  - name: AFNetworking rejects invalid certificates negative
    code: |
      #import <AFNetworking/AFNetworking.h>
      void configure(AFSecurityPolicy *policy) { policy.allowInvalidCertificates = NO; }
    expect_no_match: true
  - name: local allow-invalid collision negative
    code: |
      void configure(void) { BOOL allowInvalidCertificates = YES; }
    expect_no_match: true
  description: "`AFSecurityPolicy.allowInvalidCertificates = YES` accepts invalid certificates; exact member and scalar-value constraints reject secure settings and local collisions."

- id: objc.tls.afnetworking_validate_domain_no
  enabled: true
  language: objc
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [AFNetworking]
  cwe: [CWE-295]
  match:
    kind: write
    target:
      regex: "^[^\\.\\s]+\\.validatesDomainName$"
      receiver_type_in: [AFSecurityPolicy]
  constraints:
  - arg_equals: {index: 0, value: "NO"}
  match_examples:
  - name: AFNetworking hostname validation disabled
    code: |
      #import <AFNetworking/AFNetworking.h>
      void configure(AFSecurityPolicy *policy) { policy.validatesDomainName = NO; }
  - name: AFNetworking hostname validation enabled negative
    code: |
      #import <AFNetworking/AFNetworking.h>
      void configure(AFSecurityPolicy *policy) { policy.validatesDomainName = YES; }
    expect_no_match: true
  - name: local validates-domain collision negative
    code: |
      void configure(void) { BOOL validatesDomainName = NO; }
    expect_no_match: true
  description: "`AFSecurityPolicy.validatesDomainName = NO` skips hostname verification; exact member and scalar-value constraints reject secure settings and local collisions."
