# Objective-C code-injection sinks (NSPredicate/NSExpression format, JSContext, WKWebView JS).
- id: objc.eval.nspredicate_format
  enabled: true
  language: objc
  tag: code-injection
  severity: high
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: predicateWithFormat
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; predicateWithFormat(input); }
  - name: literal predicate format negative
    code: |
      void test(void) { predicateWithFormat(@"name == 'safe'"); }
    expect_no_match: true
  description: "NSPredicate +predicateWithFormat: with tainted format — KVC key paths / SELF evaluation allow arbitrary object access."

- id: objc.eval.nsexpression_format
  enabled: true
  language: objc
  tag: code-injection
  severity: high
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: expressionWithFormat
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; expressionWithFormat(input); }
  - name: literal expression format negative
    code: |
      void test(void) { expressionWithFormat(@"1 + 1"); }
    expect_no_match: true
  description: "NSExpression +expressionWithFormat: — tainted format allows FUNCTION() invocation of arbitrary selectors."

- id: objc.eval.evaluate_javascript
  enabled: true
  language: objc
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: evaluateJavaScript
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; [WKWebView evaluateJavaScript:input]; }
  - name: literal javascript negative
    code: |
      void test(void) { [WKWebView evaluateJavaScript:@"1 + 1"]; }
    expect_no_match: true
  description: "WKWebView -evaluateJavaScript:completionHandler: with tainted JS — executes in webview origin. Constrained to WKWebView receivers."

- id: objc.eval.jscontext_evaluatescript
  enabled: true
  language: objc
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: evaluateScript
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { [JSContext evaluateScript:input]; }
  - name: literal evaluateScript negative
    code: |
      void test(void) { [JSContext evaluateScript:@"1 + 1"]; }
