- id: objc.xss.uiwebview_load_html
  enabled: true
  language: objc
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - UIWebView
      - loadHTMLString
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: 'void test(id input) { id target = input; int amount = 1; [UIWebView loadHTMLString:input]; }

      '
  - name: literal html negative
    code: |
      void test(void) { [UIWebView loadHTMLString:@"<p>safe</p>"]; }
    expect_no_match: true
  description: "UIWebView (deprecated, removed iOS 12+) / WKWebView -loadHTMLString:baseURL: with tainted HTML \u2014 script\
    \ executes in webview origin. The baseURL controls the SOP origin (file:// vs https://app/), so a tainted baseURL widens\
    \ the blast radius. Constrained to webview receivers. Merged collision aliases: objc.xss.wkwebview_loadhtml_concat."
  aliases:
  - objc.xss.wkwebview_loadhtml_concat
- id: objc.xss.webview_loaddata
  enabled: true
  language: objc
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      regex: ^(?:.*\.)?(loadData|loadData:MIMEType:characterEncodingName:baseURL:|loadData:MIMEType:textEncodingName:baseURL:)$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: 'void test(id input) { id target = input; int amount = 1; [UIWebView loadData:input]; }

      '
  - name: literal webview data negative
    code: |
      void test(void) { [UIWebView loadData:@"safe"]; }
    expect_no_match: true
  description: "WKWebView -loadData:MIMEType:characterEncodingName:baseURL: \u2014 same XSS surface as loadHTMLString when\
    \ MIMEType is text/html and data is tainted. Constrained to webview receivers."
- id: objc.xss.wkwebview_evaluatejavascript
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  tag: xss
  severity: critical
  cwe:
  - CWE-79
  - CWE-94
  match:
    kind: call
    callee:
      name: evaluateJavaScript
  description: "Disabled \u2014 canonical rule is objc.eval.evaluate_javascript in eval.yml. evaluateJavaScript:completionHandler:\
    \ is code-injection, not pure XSS."
- id: objc.xss.webview_stringbyevaluatingjs
  enabled: true
  language: objc
  tag: xss
  severity: critical
  cwe:
  - CWE-79
  - CWE-94
  match:
    kind: call
    callee:
      name: stringByEvaluatingJavaScriptFromString
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: 'void test(id input) { id target = input; int amount = 1; stringByEvaluatingJavaScriptFromString(input); }

      '
  - name: literal uiwebview javascript negative
    code: |
      void test(void) { stringByEvaluatingJavaScriptFromString(@"1 + 1"); }
    expect_no_match: true
  description: "UIWebView -stringByEvaluatingJavaScriptFromString: (deprecated) \u2014 runs tainted JS synchronously in webview\
    \ origin."
- id: objc.xss.nsattributedstring_inithtml
  enabled: true
  language: objc
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      name: initWithHTML
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: 'void test(id input) { id target = input; int amount = 1; [NSAttributedString initWithHTML:input]; }

      '
  - name: literal attributed html negative
    code: |
      void test(void) { [NSAttributedString initWithHTML:@"<p>safe</p>"]; }
    expect_no_match: true
  description: "NSAttributedString -initWithHTML:documentAttributes: \u2014 parses HTML and may fetch remote subresources\
    \ (NSHTMLTextDocumentType). Constrained to attributed string receivers."
- id: objc.xss.nsattributedstring_initdata
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: objc
  tag: xss
  severity: medium
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      name: initWithData
  description: "Disabled \u2014 NSAttributedString -initWithData:options:documentAttributes:error: renders HTML only when\
    \ NSHTMLTextDocumentType option set; cannot observe dict keys."
