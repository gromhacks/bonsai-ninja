- id: objc.xss.mutable_string_append_html
  enabled: true
  language: objc
  tag: xss
  severity: high
  packages: [Foundation]
  cwe: [CWE-79]
  match:
    kind: call
    callee: {name: appendString}
  constraints:
  - receiver_type_in: [NSMutableString]
  - arg_tainted:
      index: 0
  - arg_count: 1
  analysis_semantics:
    character_escape:
      required_mappings:
      - {input: "&", output: "&amp;"}
      - {input: "<", output: "&lt;"}
      - {input: ">", output: "&gt;"}
      - {input: '"', output: "&quot;"}
      - {input: "'", output: "&#39;"}
  match_examples:
  - name: tainted value appended to mutable HTML buffer
    code: |
      #import <Foundation/Foundation.h>
      void render(NSString *input) {
        NSMutableString *page = [NSMutableString stringWithString:@"<html><body>"];
        [page appendString:input];
      }
    expect_match_text: [page.appendString]
  - name: literal append negative
    code: |
      #import <Foundation/Foundation.h>
      void render(void) {
        NSMutableString *page = [NSMutableString string];
        [page appendString:@"<p>safe</p>"];
      }
    expect_no_match: true
  - name: unrelated appendString receiver negative
    code: |
      #import <Foundation/Foundation.h>
      @interface LocalBuffer : NSObject
      - (void)appendString:(NSString *)value;
      @end
      void render(LocalBuffer *buffer, NSString *input) { [buffer appendString:input]; }
    expect_no_match: true
  description: "NSMutableString appendString: composes a raw HTML buffer from caller-controlled text; complete entity escaping suppresses the finding."

- id: objc.xss.uiwebview_load_html
  enabled: true
  language: objc
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - UIWebView
      - loadHTMLString
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: 'void test(id input) { id target = input; int amount = 1; [UIWebView loadHTMLString:input]; }

      '
  - name: literal html negative
    code: |
      void test(void) { [UIWebView loadHTMLString:@"<p>safe</p>"]; }
    expect_no_match: true
  description: "UIWebView loadHTMLString: with tainted HTML executes attacker-controlled markup in the legacy webview origin."

- id: objc.xss.wkwebview_loadhtml_concat
  enabled: true
  language: objc
  tag: xss
  severity: high
  packages: [WebKit]
  imports: [WebKit]
  cwe: [CWE-79]
  match:
    kind: call
    callee:
      attribute: [WKWebView, "loadHTMLString:baseURL:"]
      receiver_type_in: [WKWebView]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: typed WKWebView loads tainted HTML
    code: |
      #import <WebKit/WebKit.h>
      void render(WKWebView *view, NSString *input) {
        [view loadHTMLString:input baseURL:nil];
      }
    expect_match_text: ["view.loadHTMLString:baseURL:"]
  - name: typed WKWebView loads literal HTML negative
    code: |
      #import <WebKit/WebKit.h>
      void render(WKWebView *view) {
        [view loadHTMLString:@"<p>safe</p>" baseURL:nil];
      }
    expect_no_match: true
  - name: local same-named webview type negative
    code: |
      #import <WebKit/WebKit.h>
      @interface WKWebView
      - (void)loadHTMLString:(NSString *)html baseURL:(NSURL *)url;
      @end
      void render(WKWebView *view, NSString *input) {
        [view loadHTMLString:input baseURL:nil];
      }
    expect_no_match: true
  description: "WKWebView loadHTMLString:baseURL: with tainted HTML executes attacker-controlled markup in the configured web origin."
- id: objc.xss.webview_loaddata
  enabled: true
  language: objc
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      regex: ^(?:.*\.)?(loadData|loadData:MIMEType:characterEncodingName:baseURL:|loadData:MIMEType:textEncodingName:baseURL:)$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: 'void test(id input) { id target = input; int amount = 1; [UIWebView loadData:input]; }

      '
  - name: literal webview data negative
    code: |
      void test(void) { [UIWebView loadData:@"safe"]; }
    expect_no_match: true
  description: "WKWebView -loadData:MIMEType:characterEncodingName:baseURL: - same XSS surface as loadHTMLString when\
    \ MIMEType is text/html and data is tainted. Constrained to webview receivers."
- id: objc.xss.webview_stringbyevaluatingjs
  enabled: true
  language: objc
  tag: xss
  severity: critical
  cwe:
  - CWE-79
  - CWE-94
  match:
    kind: call
    callee:
      name: stringByEvaluatingJavaScriptFromString
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: 'void test(id input) { id target = input; int amount = 1; stringByEvaluatingJavaScriptFromString(input); }

      '
  - name: literal uiwebview javascript negative
    code: |
      void test(void) { stringByEvaluatingJavaScriptFromString(@"1 + 1"); }
    expect_no_match: true
  description: "UIWebView -stringByEvaluatingJavaScriptFromString: (deprecated) - runs tainted JS synchronously in webview\
    \ origin."
- id: objc.xss.nsattributedstring_inithtml
  enabled: true
  language: objc
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      name: initWithHTML
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: 'void test(id input) { id target = input; int amount = 1; [NSAttributedString initWithHTML:input]; }

      '
  - name: literal attributed html negative
    code: |
      void test(void) { [NSAttributedString initWithHTML:@"<p>safe</p>"]; }
    expect_no_match: true
  description: "NSAttributedString -initWithHTML:documentAttributes: - parses HTML and may fetch remote subresources\
    \ (NSHTMLTextDocumentType). Constrained to attributed string receivers."
