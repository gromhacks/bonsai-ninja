# Objective-C weak-crypto sinks (CommonCrypto).
- id: objc.crypto.cc_md5
  enabled: true
  language: objc
  tag: weak-crypto
  category: source-independent
  severity: low
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      regex: "^CC_MD5(_Init|_Update|_Final)?$"
  match_examples:
    - name: declared shape
      code: |
        void test(const void *input, unsigned char *digest) { CC_MD5(input, 1, digest); }
  description: "CommonCrypto CC_MD5 - MD5 is collision-broken; unsafe for signatures/integrity."

- id: objc.crypto.cc_md2_md4
  enabled: true
  language: objc
  tag: weak-crypto
  category: source-independent
  severity: low
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      regex: "^CC_MD[24](_Init)?$"
  match_examples:
    - name: declared shape
      code: |
        void test(const void *input, unsigned char *digest) { CC_MD2(input, 1, digest); }
  description: "CommonCrypto CC_MD2 / CC_MD4 - pre-MD5 hashes; entirely broken."

- id: objc.crypto.cc_sha1
  enabled: true
  language: objc
