- id: objc.path.nsinputstream_filepath
  enabled: true
  language: objc
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      regex: "^(?:.*\\.)?(inputStreamWithFileAtPath|initWithFileAtPath)$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; [NSInputStream inputStreamWithFileAtPath:input]; }
    - name: literal input stream path negative
      code: |
        void test(void) { [NSInputStream inputStreamWithFileAtPath:@"/tmp/safe.txt"]; }
      expect_no_match: true
  description: "NSInputStream/NSOutputStream +inputStreamWithFileAtPath: / -initWithFileAtPath: — opens arbitrary file. Constrained to stream receivers to avoid collisions with other initWithFileAtPath: consumers."

