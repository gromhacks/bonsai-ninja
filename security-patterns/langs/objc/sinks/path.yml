# Objective-C path-traversal sinks (NSFileManager, NSData, NSInputStream, NSFileHandle, libc).
- id: objc.path.contents_at_path
  enabled: true
  language: objc
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: contentsAtPath
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; contentsAtPath(input); }
    - name: literal path negative
      code: |
        void test(void) { contentsAtPath(@"/tmp/safe.txt"); }
      expect_no_match: true
  description: "NSFileManager -contentsAtPath: — reads arbitrary file; tainted path allows reading outside intended directory."

