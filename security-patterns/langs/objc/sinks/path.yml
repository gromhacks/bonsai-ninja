  match:
    kind: call
    callee:
      regex: "^(fopen|freopen)$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; fopen(input, "r"); }
    - name: literal fopen path negative
      code: |
        void test(void) { fopen("safe.txt", "r"); }
      expect_no_match: true
  description: "libc fopen/freopen — opens arbitrary file when path is tainted (C bridging). Bare `open` excluded as too ubiquitous."

# Archive extraction (Zip Slip class). SSZipArchive is the canonical
# iOS archive library; trusts entry names from the archive.
- id: objc.path.sszip_unzip_file_at_path
  enabled: true
  language: objc
  tag: zip-slip
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: unzipFileAtPath
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; unzipFileAtPath(input); }
    - name: literal archive path negative
      code: |
        void test(void) { [SSZipArchive unzipFileAtPath:@"bundle.zip" toDestination:@"/tmp/out"]; }
      expect_no_match: true
  description: "SSZipArchive unzipFileAtPath:toDestination: — extracts archive entries; entry names are attacker-controlled, so any name with `..` escapes the destination dir."
- id: objc.path.sszip_unzip_with_password
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  tag: zip-slip
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: unzipFileAtPath
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; [SSZipArchive unzipFileAtPath:input toDestination:input overwrite:YES password:input error:nil]; }
  description: "Disabled duplicate — Objective-C selector facts expose the same `unzipFileAtPath` call shape as objc.path.sszip_unzip_file_at_path, which is the canonical SSZipArchive Zip Slip rule."
