- id: objc.deser.requires_secure_coding_no
  enabled: true
  language: objc
  tag: insecure-deserialization
  category: source-independent
  severity: high
  cwe: [CWE-502]
  match:
    kind: write
    target:
      regex: "^[^\\.\\s]+\\.requiresSecureCoding$"
      receiver_type_in: [NSKeyedUnarchiver]
  constraints:
  - arg_equals: {index: 0, value: "NO"}
  match_examples:
    - name: secure coding disabled on keyed unarchiver
      code: |
        #import <Foundation/Foundation.h>
        void configure(NSKeyedUnarchiver *unarchiver) { unarchiver.requiresSecureCoding = NO; }
    - name: secure coding enabled on keyed unarchiver negative
      code: |
        #import <Foundation/Foundation.h>
        void configure(NSKeyedUnarchiver *unarchiver) { unarchiver.requiresSecureCoding = YES; }
      expect_no_match: true
    - name: local requires-secure-coding collision negative
      code: |
        void configure(void) { BOOL requiresSecureCoding = NO; }
      expect_no_match: true
  description: "`NSKeyedUnarchiver.requiresSecureCoding = NO` disables secure coding; exact member and scalar-value constraints reject secure settings and local collisions."

