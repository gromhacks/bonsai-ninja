- id: objc.deser.requires_secure_coding_no
  enabled: true
  language: objc
  tag: insecure-deserialization
  category: source-independent
  severity: high
  cwe: [CWE-502]
  match:
    kind: write
    target:
      name: requiresSecureCoding
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; NSKeyedUnarchiver.requiresSecureCoding = input; }
  description: "NSKeyedUnarchiver .requiresSecureCoding = NO - disables NSSecureCoding enforcement, reintroducing class-substitution RCE."

