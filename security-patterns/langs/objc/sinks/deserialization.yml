# Objective-C insecure-deserialization sinks (NSKeyedUnarchiver, NSPropertyListSerialization).
- id: objc.deser.nskeyedunarchiver_data
  enabled: true
  language: objc
  tag: insecure-deserialization
  severity: critical
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: unarchiveObjectWithData
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; unarchiveObjectWithData(input); }
    - name: literal archive data negative
      code: |
        void test(void) { unarchiveObjectWithData(@"safe"); }
      expect_no_match: true
  description: "NSKeyedUnarchiver +unarchiveObjectWithData: (deprecated) - decodes arbitrary classes without secure-coding check = RCE on tainted data."

