# Objective-C command-injection sinks (NSTask, libc exec family, libc system/popen).
- id: objc.cmdi.system
  enabled: true
  language: objc
  tag: command-injection
  severity: critical
  category: process-exec
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: system
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; system(input); }
  - name: arg tainted literal negative
    code: "void test(id input) { id target = input; int amount = 1; system(\"safe\"); }\n"
    expect_no_match: true
  description: "libc system() - spawns /bin/sh -c; tainted argument yields shell-metacharacter injection."

- id: objc.cmdi.popen
  enabled: true
  language: objc
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: popen
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; popen(input); }
  - name: literal command negative
    code: |
      void test(void) { popen("safe", "r"); }
    expect_no_match: true
  description: "libc popen() - shell-backed pipe; tainted command string is parsed by /bin/sh."

- id: objc.cmdi.execvp
  enabled: true
  language: objc
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: execvp
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; execvp(input, NULL); }
  - name: literal program negative
    code: |
      void test(id input) { execvp("safe", input); }
    expect_no_match: true
  description: "libc execvp() - PATH-resolved exec; tainted argv[0] can select arbitrary binary."

- id: objc.cmdi.exec_family
  enabled: true
  language: objc
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^(execv|execve|execvP|execl|execle|execlp|fexecve)$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; execv(input); }
  - name: literal arg 0 negative
    code: |
      void example(void) {
        exec_family("safe");
      }
    expect_no_match: true
  description: "libc exec family - tainted program path or argv is executed directly."

- id: objc.cmdi.nstask_launch
  enabled: true
  language: objc
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^(launchedTaskWithLaunchPath|launchAndReturnError|runTaskWithLaunchPath)$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; launchedTaskWithLaunchPath(input); }
  - name: literal launch path negative
    code: |
      void test(void) { launchedTaskWithLaunchPath(@"/bin/echo"); }
    expect_no_match: true
  description: "NSTask +launchedTaskWithLaunchPath:arguments: / -launchAndReturnError: - spawns child process with tainted argv/path."

- id: objc.cmdi.nstask_launch_bare
  enabled: true
  language: objc
  tag: command-injection
  severity: critical
  packages: [Foundation]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: launch
  constraints:
  - receiver_type_in: [NSTask]
  - receiver_tainted: true
  - arg_count: 0
  - requires_prior_receiver_write:
      target:
        name: launchPath
      accepted_values:
      - kind: string
        value: /bin/sh
      - kind: string
        value: /bin/bash
      - kind: string
        value: /bin/zsh
      - kind: string
        value: /usr/bin/sh
      - kind: string
        value: /usr/bin/bash
      - kind: string
        value: /usr/bin/zsh
  match_examples:
  - name: NSTask shell launch after tainted arguments
    code: |
      #import <Foundation/Foundation.h>
      void test(NSString *input) {
        NSTask *task = [[NSTask alloc] init];
        task.launchPath = @"/bin/sh";
        task.arguments = @[@"-c", input];
        [task launch];
      }
    expect_match_text: [task.launch]
  - name: NSTask direct executable with tainted argv negative
    code: |
      #import <Foundation/Foundation.h>
      void test(NSString *input) {
        NSTask *task = [[NSTask alloc] init];
        task.launchPath = @"/usr/bin/printf";
        task.arguments = @[input];
        [task launch];
      }
    expect_no_match: true
  - name: conditional shell state negative
    code: |
      #import <Foundation/Foundation.h>
      void test(NSString *input, BOOL useShell) {
        NSTask *task = [[NSTask alloc] init];
        task.launchPath = @"/bin/sh";
        if (useShell) { task.launchPath = @"/usr/bin/printf"; }
        task.arguments = @[@"-c", input];
        [task launch];
      }
    expect_no_match: true
  - name: unrelated launch receiver negative
    code: |
      #import <Foundation/Foundation.h>
      @interface Worker : NSObject
      - (void)launch;
      @end
      void test(Worker *worker, NSString *input) { worker.command = input; [worker launch]; }
    expect_no_match: true
  description: "NSTask launch on a compiler-typed receiver with tainted state is command injection only when the exact reaching launchPath selects a shell; direct executable argv remains quiet."

- id: objc.cmdi.nstask_setters
  enabled: true
  language: objc
  tag: command-injection
  severity: high
  packages: [Foundation]
  cwe: [CWE-78]
  match:
    kind: write
    target:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.(launchPath|executableURL)$"
  constraints:
  - receiver_type_in: [NSTask]
  - arg_tainted:
      index: 0
  match_examples:
  - name: nstask member setter
    code: |
      #import <Foundation/Foundation.h>
      void test(NSTask *task, NSString *input) { task.launchPath = input; }
    expect_match_text: [task.launchPath]
  - name: local task property name negative
    code: |
      #import <Foundation/Foundation.h>
      void test(id input) { id launchPath = input; }
    expect_no_match: true
  - name: direct executable tainted argv negative
    code: |
      #import <Foundation/Foundation.h>
      void test(NSTask *task, NSString *input) {
        task.arguments = @[input];
      }
    expect_no_match: true
  description: "NSTask .launchPath / .executableURL - tainted executable selection feeds a subsequent launch. Argument arrays alone are direct argv and are not command injection without proven shell state."

- id: objc.cmdi.posix_spawn
  enabled: true
  language: objc
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^(posix_spawn|posix_spawnp)$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { posix_spawn(pid, input); }
  - name: literal arg 1 negative
    code: |
      void example(void) {
        posix_spawn("safe", "safe");
      }
    expect_no_match: true
  description: "posix_spawn / posix_spawnp - direct exec of tainted path/argv."

# Explicit `launchPath = "/bin/sh"; arguments = ["-c", concat]` shape.
# The receiver-narrowed `objc.cmdi.nstask_setters` rule already fires
# on each individual write; this complement keys on the assignment to
# `launchPath` with shell-binary literal so the shell-path corner case
# is callable as its own ID for triage / audit metrics.
