- id: objc.xxe.shouldresolveexternalentities_yes
  enabled: true
  language: objc
  tag: xxe
  category: source-independent
  severity: high
  cwe: [CWE-611]
  match:
    kind: write
    target:
      regex: "^[^\\.\\s]+\\.shouldResolveExternalEntities$"
  match_examples:
  - name: nsxmlparser external entities member write
    code: |
      void test(id input) { id target = input; int amount = 1; parser.shouldResolveExternalEntities = input; }
    expect_match_text: [parser.shouldResolveExternalEntities]
  - name: local shouldResolveExternalEntities variable negative
    code: |
      void test(id input) { id shouldResolveExternalEntities = input; }
    expect_no_match: true
  description: "NSXMLParser.shouldResolveExternalEntities = YES - explicitly enables external entity resolution (XXE)."

