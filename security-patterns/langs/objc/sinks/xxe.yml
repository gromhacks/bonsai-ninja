# Objective-C XXE sinks (NSXMLParser, NSXMLDocument, libxml2 bridge).

- id: objc.xxe.nsxmldocument_initwithcontentsofurl
  enabled: true
  language: objc
  tag: xxe
  severity: high
  cwe: [CWE-611, CWE-918]
  match:
    kind: call
    callee:
      attribute: [NSXMLDocument, initWithContentsOfURL]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; [NSXMLDocument initWithContentsOfURL:input]; }
  - name: literal xml url negative
    code: |
      void test(void) { [NSXMLDocument initWithContentsOfURL:@"https://safe.example/feed.xml"]; }
    expect_no_match: true
  description: "NSXMLDocument -initWithContentsOfURL: - fetches and parses remote XML; both XXE and SSRF."

- id: objc.xxe.shouldresolveexternalentities_yes
  enabled: true
  language: objc
  tag: xxe
  category: source-independent
  severity: high
  cwe: [CWE-611]
  match:
    kind: write
    target:
      regex: "^[^\\.\\s]+\\.shouldResolveExternalEntities$"
      receiver_type_in: [NSXMLParser]
  constraints:
  - arg_equals: {index: 0, value: "YES"}
  match_examples:
  - name: NSXMLParser external entity resolution enabled
    code: |
      #import <Foundation/Foundation.h>
      void configure(NSXMLParser *parser) { parser.shouldResolveExternalEntities = YES; }
    expect_match_text: [parser.shouldResolveExternalEntities]
  - name: NSXMLParser external entity resolution disabled negative
    code: |
      #import <Foundation/Foundation.h>
      void configure(NSXMLParser *parser) { parser.shouldResolveExternalEntities = NO; }
    expect_no_match: true
  - name: local shouldResolveExternalEntities collision negative
    code: |
      void test(void) { BOOL shouldResolveExternalEntities = YES; }
    expect_no_match: true
  description: "`NSXMLParser.shouldResolveExternalEntities = YES` enables external entity resolution; exact member and scalar-value constraints reject disabled settings and local-name collisions."

- id: objc.xxe.nsxmldocument_initwithxmlstring
  enabled: true
  language: objc
  tag: xxe
  severity: high
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      regex: '^NSXMLDocument(?:\.alloc)?\.initWithXMLString:options:error:$'
  constraints:
  - arg_tainted:
      index: 0
  - arg_not_matches_regex:
      index: 1
      regex: "(?:NSXMLNodeLoadExternalEntitiesNever|NSXMLNodeOptionsNone)"
  match_examples:
  - name: declared shape
    code: |
      #import <Foundation/Foundation.h>
      void test(NSString *input, NSError **error) {
        [[[NSXMLDocument alloc] initWithXMLString:input options:NSXMLDocumentTidyXML error:error] self];
      }
    expect_match_text: ["NSXMLDocument.alloc.initWithXMLString:options:error:"]
  - name: literal xml string negative
    code: |
      #import <Foundation/Foundation.h>
      void test(NSError **error) {
        [[NSXMLDocument alloc] initWithXMLString:@"<root/>" options:NSXMLDocumentTidyXML error:error];
      }
    expect_no_match: true
  - name: external entities explicitly disabled negative
    code: |
      #import <Foundation/Foundation.h>
      void test(NSString *input, NSError **error) {
        [[NSXMLDocument alloc] initWithXMLString:input options:NSXMLNodeLoadExternalEntitiesNever error:error];
      }
    expect_no_match: true
  description: "NSXMLDocument -initWithXMLString:options: - parses tainted XML; if options include NSXMLNodeLoadExternalEntitiesAlways allows XXE."

- id: objc.xxe.libxml2_xmlread
  enabled: true
  language: objc
  tag: xxe
  severity: high
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      regex: "^(xmlReadMemory|xmlReadFile|xmlReadDoc|xmlReadIO|xmlCtxtReadMemory|xmlCtxtReadFile|xmlParseMemory|xmlParseFile)$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; xmlReadMemory(input); }
  - name: literal arg 0 negative
    code: |
      void example(void) {
        libxml2_xmlread("safe");
      }
    expect_no_match: true
  description: "libxml2 xmlRead*/xmlParse* - tainted XML parsed with default options allows DTD-based XXE (XML_PARSE_NOENT)."
