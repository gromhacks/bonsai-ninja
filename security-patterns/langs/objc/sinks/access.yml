- id: objc.access.aws_get_object
  enabled: true
  language: objc
  tag: access-control
  severity: high
  packages: [AWSS3]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      name: getObject
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      #import <AWSS3/AWSS3.h>
      void test(id input) { id target = input; int amount = 1; getObject(input); }
  - name: literal s3 get request negative
    code: |
      #import <AWSS3/AWSS3.h>
      void test(void) { getObject(@"safe-key"); }
    expect_no_match: true
  description: "AWSS3 getObject — tainted bucket/key selector reads arbitrary object data."

