# Objective-C queue/messaging sources (AWS SDK iOS SQS, MQTT).
- id: objc.source.aws_sqs_receive_message
  enabled: true
  language: objc
  trust: service
  tag: queue-input
  payload_types: [json, text]
  packages: [AWSSQS]
  match:
    kind: call
    callee:
      regex: "(?:^|\\.)receiveMessage:completionHandler:$"
  constraints:
  - receiver_type_in: [AWSSQS]
  - arg_count: 2
  - arg_is_inline_callback: 1
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: SQS receive completion result
    code: |
      #import <AWSSQS/AWSSQS.h>
      void receive(AWSSQS *client, AWSSQSReceiveMessageRequest *request) {
        [client receiveMessage:request completionHandler:^(AWSSQSReceiveMessageResult *result, NSError *error) { NSLog(@"%@", result.messages); }];
      }
    expect_match_text: ["client.receiveMessage:completionHandler:"]
  - name: same selector on an application client is not SQS input
    code: |
      #import <AWSSQS/AWSSQS.h>
      @interface LocalQueue : NSObject
      - (void)receiveMessage:(id)request completionHandler:(void (^)(id, NSError *))handler;
      @end
      void receive(LocalQueue *client, id request) {
        [client receiveMessage:request completionHandler:^(id result, NSError *error) { NSLog(@"%@", result); }];
      }
    expect_no_match: true
  description: "AWSSQS receiveMessage:completionHandler: delivers an AWSSQSReceiveMessageResult from the broker through callback parameter zero; the registration return is not sourced."
