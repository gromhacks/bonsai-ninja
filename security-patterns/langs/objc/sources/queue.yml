# Objective-C queue/messaging sources (AWS SDK iOS SQS, MQTT).
- id: objc.source.aws_sqs_receive_message
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: service
  tag: queue-input
  payload_types: [json, text]
  packages: [AWSSQS]
  match:
    kind: call
    callee:
      name: receiveMessage
  description: "Disabled - AWSSQS receiveMessage: - message body is attacker-controlled when producer is untrusted. Enable for iOS apps consuming SQS."

- id: objc.source.mqtt_message_received
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: service
  tag: queue-input
  payload_types: [binary, text]
  packages: [MQTTClient]
  match:
    kind: param
    target:
      name: newMessage
  description: "Disabled - MQTTSessionDelegate newMessage:data:onTopic: - MQTT payload from broker. Enable when broker is untrusted."
