# Objective-C remote-trust HTTP / IPC / push / deeplink sources (Cocoa + UIKit).
#
# -- Adapter gap (audited 2026-04) --------------------------------------------
# UIKit/Foundation deliver remote input through Objective-C selector handlers
# whose taintable values are *individual selector pieces* of a multi-part
# message, e.g.
#
#   - application:openURL:options:                     -> `url`, `options`
#   - application:didReceiveRemoteNotification:        -> `userInfo`
#   - application:continueUserActivity:restorationHandler:
#                                                      -> `userActivity`
#   - userContentController:didReceiveScriptMessage:   -> `message`
#   - URLSession:dataTask:didReceiveData:              -> `data`
#   - completionHandler:(NSData*, NSURLResponse*, NSError*)
#                                                      -> `data`
#
# `kind: param` matches against the parameter identifier. The
# push-notification `userInfo` shape is enabled because that parameter name
# is stable in ordinary UIKit delegates. Other selector-piece-driven handler
# values remain disabled until the adapter binds selector pieces to parameter
# identities, and ObjC dot-notation property reads (e.g.
# `notification.userInfo`, `pasteboard.string`) still need `read` facts.
#
# Per docs/pattern-guide.mdx the fix belongs in the ObjC adapter
# (crates/lang_objc), not in YAML. Tracking task: extend the adapter to
# (a) emit param facts keyed by selector-piece, and (b) emit `read` events
# for property_expression accesses. Once shipped, flip the remaining
# `enabled: false` rules below to true and re-run `pack --audit`.
#
# Below this header: rules using call-shape with receiver narrowing - these
# work today.

- id: objc.source.nsurlsession_datataskwithurl
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  payload_types: [url, binary, json]
  match:
    kind: call
    callee:
      name: dataTaskWithURL
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; dataTaskWithURL(input); }
  description: "NSURLSession -dataTaskWithURL: / -dataTaskWithURL:completionHandler: - remote HTTP fetch. Response body becomes tainted input."

- id: objc.source.nsurlsession_datataskwithrequest
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  payload_types: [binary, json]
  match:
    kind: call
    callee:
      name: dataTaskWithRequest
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; dataTaskWithRequest(input); }
  description: "NSURLSession -dataTaskWithRequest: / -dataTaskWithRequest:completionHandler: - outbound HTTP; response body becomes tainted input."

- id: objc.source.nsurlsession_downloadtask
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      regex: "^(downloadTaskWithURL|downloadTaskWithRequest)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; downloadTaskWithURL(input); }
  - name: unrelated call negative
    code: |
      void test(id input) { id target = input; int amount = 1; uploadTaskWithRequest(input); }
    expect_no_match: true
  description: "NSURLSession -downloadTaskWithURL: / -downloadTaskWithRequest: - file downloaded from remote endpoint; bytes are tainted input."

- id: objc.source.nsurlconnection_send_synchronous
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  payload_types: [binary, text]
  match:
    kind: call
    callee:
      regex: "^(sendSynchronousRequest|sendAsynchronousRequest)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; sendSynchronousRequest(input); }
  - name: unrelated call negative
    code: |
      void test(id input) { id target = input; int amount = 1; cancelRequest(input); }
    expect_no_match: true
  description: "NSURLConnection +sendSynchronousRequest:returningResponse:error: / +sendAsynchronousRequest:queue:completionHandler: (deprecated) - returns server-controlled NSData."

- id: objc.source.nsdata_contents_of_url
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  match:
    kind: call
    callee:
      name: dataWithContentsOfURL
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; dataWithContentsOfURL(input); }
  description: "NSData +dataWithContentsOfURL: - blocking fetch. Response bytes are remote input."

- id: objc.source.nsstring_contents_of_url
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  match:
    kind: call
    callee:
      name: stringWithContentsOfURL
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; stringWithContentsOfURL(input); }
  description: "NSString +stringWithContentsOfURL: - blocking HTTP GET returning tainted text."

- id: objc.source.afnetworking_response
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  payload_types: [json, binary]
  packages: [AFNetworking]
  match:
    kind: call
    callee:
      regex: "^(?:.*\\.)?(GET|POST|PUT|DELETE|PATCH|HEAD)$"
  constraints:
  - receiver_type_in: [AFHTTPSessionManager, AFHTTPRequestOperationManager]
  match_examples:
  - name: declared shape
    code: |
      #import <AFNetworking/AFNetworking.h>
      void test(AFHTTPSessionManager *manager, id input) { id target = input; int amount = 1; [manager GET:input]; }
  - name: non-http-verb method negative
    code: |
      #import <AFNetworking/AFNetworking.h>
      void test(AFHTTPSessionManager *manager, id input) { id target = input; int amount = 1; [manager invalidateSessionCancelingTasks:input]; }
    expect_no_match: true
  description: "AFNetworking AFHTTPSessionManager -GET:/-POST: - success block receives server-controlled responseObject (deserialized JSON)."

- id: objc.source.nsurlrequest_param
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: objc
  trust: remote
  tag: http-input
  payload_types: [url]
  match:
    kind: param
    target:
      name: request
  description: "Disabled - bare param name 'request' fires on every handler arg. Re-enable once adapter binds selector-pieces to param identifiers."

- id: objc.source.nsurlsession_completion_data
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: objc
  trust: remote
  tag: http-input
  payload_types: [binary, json]
  match:
    kind: param
    target:
      name: completionHandler
  description: "Disabled - NSURLSession completion block `data` arg is not observable by param-name match; needs adapter selector-piece -> param binding (see header)."

- id: objc.source.openurl_options_url
  enabled: true
  language: objc
  trust: remote
  tag: deep-link
  payload_types: [url]
  match:
    kind: param
    target:
      annotation: openURL
  match_examples:
  - name: openurl handler url param
    code: |
      #import <UIKit/UIKit.h>
      @implementation AppDelegate
      - (BOOL)application:(UIApplication *)app openURL:(NSURL *)url options:(NSDictionary *)options {
        return [self handle:url];
      }
      @end
  description: "application:openURL:options: - the openURL: deep-link URL param is attacker-controlled (scoped by the openURL: selector piece)."

- id: objc.source.openurl_options_dict
  enabled: true
  language: objc
  trust: remote
  tag: deep-link
  payload_types: [json]
  match:
    kind: param
    target:
      annotation: options
  match_examples:
  - name: openurl handler options param
    code: |
      #import <UIKit/UIKit.h>
      @implementation AppDelegate
      - (BOOL)application:(UIApplication *)app openURL:(NSURL *)url options:(NSDictionary *)options {
        return [self handle:options];
      }
      @end
  description: "application:openURL:options: - the options: dict (UIApplicationOpenURLOptionsKey) carries the attacker-controlled source-app payload (scoped by the options: selector piece)."

- id: objc.source.universal_link_continueuseractivity
  enabled: true
  language: objc
  trust: remote
  tag: deep-link
  payload_types: [url]
  match:
    kind: param
    target:
      annotation: continueUserActivity
  match_examples:
  - name: universal link continue user activity param
    code: |
      #import <UIKit/UIKit.h>
      @implementation AppDelegate
      - (BOOL)application:(UIApplication *)app continueUserActivity:(NSUserActivity *)userActivity restorationHandler:(void (^)(NSArray *))handler {
        return [self handle:userActivity];
      }
      @end
  description: "application:continueUserActivity:restorationHandler: - Universal Link handler; NSUserActivity.webpageURL is attacker-controlled (scoped by the continueUserActivity: selector piece)."

- id: objc.source.push_notification_userinfo
  enabled: true
  language: objc
  trust: remote
  tag: push-input
  payload_types: [json]
  match:
    kind: param
    target:
      name: userInfo
  match_examples:
  - name: declared shape
    code: |
      void handle(id userInfo) { }
  description: "`application:didReceiveRemoteNotification:` / `:fetchCompletionHandler:` APNS `userInfo` payload - remote push-notification data."

- id: objc.source.push_notification_userinfo_property
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: objc.source.notification_userinfo
  language: objc
  trust: remote
  tag: push-input
  payload_types: [json]
  match:
    kind: read
    target:
      attribute: [notification, userInfo]
  description: "Subsumed by objc.source.notification_userinfo (`name: userInfo`), which already matches `notification.userInfo` reads regardless of receiver name."

- id: objc.source.wkwebview_usercontentcontroller_message
  enabled: true
  language: objc
  trust: remote
  tag: ipc-input
  payload_types: [json, text]
  match:
    kind: param
    target:
      annotation: didReceiveScriptMessage
  match_examples:
  - name: wkwebview script message param
    code: |
      #import <WebKit/WebKit.h>
      @implementation Bridge
      - (void)userContentController:(WKUserContentController *)controller didReceiveScriptMessage:(WKScriptMessage *)message {
        [self handle:message];
      }
      @end
  description: "userContentController:didReceiveScriptMessage: - JS->native bridge payload (WKScriptMessage.body) is attacker-controlled (scoped by the didReceiveScriptMessage: selector piece)."

- id: objc.source.message_compose_body
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: objc
  trust: remote
  tag: deep-link
  payload_types: [text]
  match:
    kind: write
    target:
      name: body
  description: "Disabled - MFMessageComposeViewController.body assignment with attacker-controlled deep-link content; can hijack outbound SMS draft. Reflects sink-direction; enable only when modeling outbound-SMS surfaces."

- id: objc.source.app_extension_input_items
  enabled: true
  language: objc
  trust: remote
  tag: ipc-input
  payload_types: [json]
  match:
    kind: read
    target:
      attribute: [extensionContext, inputItems]
  match_examples:
  - name: extension context input items read
    code: |
      #import <Foundation/Foundation.h>
      @implementation ShareViewController
      - (void)handle {
        NSArray *items = self.extensionContext.inputItems;
        NSLog(@"%@", items);
      }
      @end
  description: "NSExtensionContext.inputItems - Share/Action extension input items from the host app, read via `self.extensionContext.inputItems`."

- id: objc.source.nsurlprotocol_canonical_request
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: remote
  tag: http-input
  match:
    kind: param
    target:
      name: canonicalRequestForRequest
  description: "Disabled - NSURLProtocol subclass hook sees every outbound request; too noisy without receiver narrowing."
