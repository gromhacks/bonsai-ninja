# Objective-C remote-trust HTTP / IPC / push / deeplink sources (Cocoa + UIKit).
#
# UIKit/Foundation deliver remote input through Objective-C selector handlers
# whose taintable values are individual selector pieces of a multi-part
# message, e.g.
#
#   - application:openURL:options:                     -> `url`, `options`
#   - application:didReceiveRemoteNotification:        -> `userInfo`
#   - application:continueUserActivity:restorationHandler:
#                                                      -> `userActivity`
#   - userContentController:didReceiveScriptMessage:   -> `message`
#   - URLSession:dataTask:didReceiveData:              -> `data`
#   - completionHandler:(NSData*, NSURLResponse*, NSError*)
#                                                      -> `data`
#
# The adapter emits selector-piece annotations for declared parameters, so
# delegate sources below use `target.annotation` instead of parameter-name
# guesses. Completion-block parameters still need exact ownership by the
# enclosing selector call; do not approximate those values by sourcing the
# NSURLSession task object returned from the request-creation call.

- id: objc.source.nsurlsession_datataskwithurl
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  payload_types: [url, binary, json]
  match:
    kind: call
    callee:
      regex: "(?:^|\\.)dataTaskWithURL:completionHandler:$"
  constraints:
  - receiver_type_in: [NSURLSession]
  - arg_count: 2
  - arg_is_inline_callback: 1
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: url session response callback data
    code: |
      #import <Foundation/Foundation.h>
      void test(NSURLSession *session, NSURL *url) {
        [session dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) { NSLog(@"%@", data); }];
      }
    expect_match_text: ["session.dataTaskWithURL:completionHandler:"]
  - name: assigned task without callback is not response data
    code: |
      #import <Foundation/Foundation.h>
      NSURLSessionDataTask *test(NSURLSession *session, NSURL *url) { return [session dataTaskWithURL:url]; }
    expect_no_match: true
  description: "NSURLSession dataTaskWithURL:completionHandler: callback parameter 0 is the remote response Data; the returned task object is not sourced."

