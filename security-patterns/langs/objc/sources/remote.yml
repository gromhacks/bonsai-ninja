- id: objc.source.nsurlsession_downloadtask
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      regex: "(?:^|\\.)(?:downloadTaskWithURL:completionHandler:|downloadTaskWithRequest:completionHandler:)$"
  constraints:
  - receiver_type_in: [NSURLSession]
  - arg_count: 2
  - arg_is_inline_callback: 1
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: download callback temporary location
    code: |
      #import <Foundation/Foundation.h>
      void test(NSURLSession *session, NSURL *url) {
        [session downloadTaskWithURL:url completionHandler:^(NSURL *location, NSURLResponse *response, NSError *error) { NSLog(@"%@", location); }];
      }
    expect_match_text: ["session.downloadTaskWithURL:completionHandler:"]
  - name: assigned download task without callback is not payload
    code: |
      #import <Foundation/Foundation.h>
      NSURLSessionDownloadTask *test(NSURLSession *session, NSURL *url) { return [session downloadTaskWithURL:url]; }
    expect_no_match: true
  description: "NSURLSession download task completion callback parameter 0 is the downloaded response's temporary-file URL; the returned task object is not sourced."

- id: objc.source.nsurlconnection_send_synchronous
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  payload_types: [binary, text]
  packages: [Foundation]
  match:
    kind: call
    callee:
      regex: "(?:^|\\.)sendSynchronousRequest:returningResponse:error:$"
  match_examples:
  - name: synchronous response data
    code: |
      #import <Foundation/Foundation.h>
      void test(NSURLRequest *input) {
        NSData *data = [NSURLConnection sendSynchronousRequest:input returningResponse:nil error:nil];
      }
    expect_match_text: ["NSURLConnection.sendSynchronousRequest:returningResponse:error:"]
  - name: asynchronous completion negative
    code: |
      #import <Foundation/Foundation.h>
      void test(NSURLRequest *input) {
        [NSURLConnection sendAsynchronousRequest:input queue:nil completionHandler:nil];
      }
    expect_no_match: true
  description: "NSURLConnection +sendSynchronousRequest:returningResponse:error: (deprecated) - the call result is server-controlled NSData. The asynchronous API is excluded because its call result is not the response payload."

