- id: objc.source.gcdwebserver_request_param
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [url, path, query, header, form, multipart, binary, json, text]
  packages: [GCDWebServer]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      param_type_in:
      - GCDWebServerRequest
      - GCDWebServerURLEncodedFormRequest
      - GCDWebServerMultiPartFormRequest
      - GCDWebServerDataRequest
  match_examples:
  - name: GCDWebServer inbound request parameter
    code: |
      #import <GCDWebServer/GCDWebServer.h>
      void handle(GCDWebServerDataRequest *request) { NSLog(@"%@", request.text); }
    expect_match_text: [request]
  - name: same name with non-request type negative
    code: |
      #import <GCDWebServer/GCDWebServer.h>
      void handle(NSString *request) { NSLog(@"%@", request); }
    expect_no_match: true
  - name: workspace type collision is not the external request carrier
    code: |
      @interface GCDWebServerRequest : NSObject
      @end
      void handle(GCDWebServerRequest *request) { NSLog(@"%@", request); }
    expect_no_match: true
  description: "Typed GCDWebServer request parameters carry the inbound URL/query/header/form/upload/body surfaces; sourcing the carrier preserves field-sensitive compiler flow through its accessors."

- id: objc.source.cocoahttpserver_request_uri
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [url, path, query]
  packages: [CocoaHTTPServer]
  match:
    kind: call
    callee: {name: requestURI}
  constraints:
  - receiver_type_in: [HTTPConnection]
  - arg_count: 0
  match_examples:
  - name: CocoaHTTPServer connection request URI
    code: |
      #import <CocoaHTTPServer/HTTPConnection.h>
      NSString *uri(HTTPConnection *connection) { return [connection requestURI]; }
    expect_match_text: [connection.requestURI]
  - name: same selector on unrelated receiver negative
    code: |
      #import <CocoaHTTPServer/HTTPConnection.h>
      @interface Cache : NSObject
      - (NSString *)requestURI;
      @end
      NSString *uri(Cache *cache) { return [cache requestURI]; }
    expect_no_match: true
  description: "CocoaHTTPServer HTTPConnection requestURI returns the URI supplied by the connected HTTP client; receiver type excludes ordinary requestURI helpers."

