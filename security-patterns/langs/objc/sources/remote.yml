# Objective-C remote-trust HTTP / IPC / push / deeplink sources (Cocoa + UIKit).
#
# UIKit/Foundation deliver remote input through Objective-C selector handlers
# whose taintable values are individual selector pieces of a multi-part
# message, e.g.
#
#   - application:openURL:options:                     -> `url`, `options`
#   - application:didReceiveRemoteNotification:        -> `userInfo`
#   - application:continueUserActivity:restorationHandler:
#                                                      -> `userActivity`
#   - userContentController:didReceiveScriptMessage:   -> `message`
#   - URLSession:dataTask:didReceiveData:              -> `data`
#   - completionHandler:(NSData*, NSURLResponse*, NSError*)
#                                                      -> `data`
#
# The adapter emits selector-piece annotations for declared parameters, so
# delegate sources below use `target.annotation` instead of parameter-name
# guesses. Completion-block parameters still need exact ownership by the
# enclosing selector call; do not approximate those values by sourcing the
# NSURLSession task object returned from the request-creation call.

- id: objc.source.nsurlsession_datataskwithurl
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: remote
  tag: http-input
  payload_types: [url, binary, json]
  match:
    kind: call
    callee:
      name: dataTaskWithURL
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; dataTaskWithURL(input); }
  description: "Disabled - dataTaskWithURL: returns an NSURLSessionDataTask, not response bytes. Enable a source on the completion block's data parameter once the adapter can bind that callback parameter to this selector call."

- id: objc.source.nsurlsession_datataskwithrequest
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: remote
  tag: http-input
  payload_types: [binary, json]
  match:
    kind: call
    callee:
      name: dataTaskWithRequest
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; dataTaskWithRequest(input); }
  description: "Disabled - dataTaskWithRequest: returns an NSURLSessionDataTask, not response bytes. Enable a source on the completion block's data parameter once callback ownership is available."

- id: objc.source.nsurlsession_downloadtask
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: remote
  tag: http-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      regex: "^(downloadTaskWithURL|downloadTaskWithRequest)$"
  match_examples:
  - name: declared shape
    code: |
      void test(id input) { id target = input; int amount = 1; downloadTaskWithURL(input); }
  - name: unrelated call negative
    code: |
      void test(id input) { id target = input; int amount = 1; uploadTaskWithRequest(input); }
    expect_no_match: true
  description: "Disabled - downloadTaskWithURL:/downloadTaskWithRequest: return a task object. The downloaded file URL belongs to the completion/delegate callback and must not be approximated as the call result."

- id: objc.source.nsurlconnection_send_synchronous
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  payload_types: [binary, text]
  packages: [Foundation]
  match:
    kind: call
    callee:
      name: sendSynchronousRequest
  match_examples:
  - name: synchronous response data
    code: |
      #import <Foundation/Foundation.h>
      void test(NSURLRequest *input) {
        NSData *data = [NSURLConnection sendSynchronousRequest:input returningResponse:nil error:nil];
      }
  - name: asynchronous completion negative
    code: |
      #import <Foundation/Foundation.h>
      void test(NSURLRequest *input) {
        [NSURLConnection sendAsynchronousRequest:input queue:nil completionHandler:nil];
      }
    expect_no_match: true
  description: "NSURLConnection +sendSynchronousRequest:returningResponse:error: (deprecated) - the call result is server-controlled NSData. The asynchronous API is excluded because its call result is not the response payload."

- id: objc.source.nsdata_contents_of_url
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  packages: [Foundation]
  match:
    kind: call
    callee:
      name: dataWithContentsOfURL
  match_examples:
  - name: foundation data response
    code: |
      #import <Foundation/Foundation.h>
      void test(NSURL *input) { NSData *data = [NSData dataWithContentsOfURL:input]; }
  description: "NSData +dataWithContentsOfURL: - blocking fetch. Response bytes are remote input."

- id: objc.source.nsstring_contents_of_url
  enabled: true
  language: objc
  trust: remote
  tag: http-input
  packages: [Foundation]
  match:
    kind: call
    callee:
      name: stringWithContentsOfURL
  match_examples:
  - name: foundation string response
    code: |
      #import <Foundation/Foundation.h>
      void test(NSURL *input) { NSString *text = [NSString stringWithContentsOfURL:input encoding:NSUTF8StringEncoding error:nil]; }
  description: "NSString +stringWithContentsOfURL: - blocking HTTP GET returning tainted text."

- id: objc.source.afnetworking_response
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: remote
  tag: http-input
  payload_types: [json, binary]
  packages: [AFNetworking]
  match:
    kind: call
    callee:
      regex: "^(?:.*\\.)?(GET|POST|PUT|DELETE|PATCH|HEAD)$"
  constraints:
  - receiver_type_in: [AFHTTPSessionManager, AFHTTPRequestOperationManager]
  match_examples:
  - name: declared shape
    code: |
      #import <AFNetworking/AFNetworking.h>
      void test(AFHTTPSessionManager *manager, id input) { id target = input; int amount = 1; [manager GET:input]; }
  - name: non-http-verb method negative
    code: |
      #import <AFNetworking/AFNetworking.h>
      void test(AFHTTPSessionManager *manager, id input) { id target = input; int amount = 1; [manager invalidateSessionCancelingTasks:input]; }
    expect_no_match: true
  description: "Disabled - AFHTTPSessionManager request methods return a task/progress object. The remote responseObject is a success-block parameter and needs exact callback ownership rather than sourcing the request call result."

- id: objc.source.nsurlrequest_param
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: objc
  trust: remote
  tag: http-input
  payload_types: [url]
  match:
    kind: param
    target:
      name: request
  description: "Disabled - bare param name 'request' fires on every handler arg. Re-enable once adapter binds selector-pieces to param identifiers."

- id: objc.source.nsurlsession_completion_data
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: objc
  trust: remote
  tag: http-input
  payload_types: [binary, json]
  match:
    kind: param
    target:
      name: data
  description: "Disabled - a completion block's `data` parameter is remote only when the block belongs to an NSURLSession request call. It needs exact enclosing-call/callback ownership rather than a global parameter-name match."

- id: objc.source.openurl_options_url
  enabled: true
  language: objc
  trust: remote
  tag: deep-link
  payload_types: [url]
  match:
    kind: param
    target:
      annotation: openURL
  match_examples:
  - name: openurl handler url param
    code: |
      #import <UIKit/UIKit.h>
      @implementation AppDelegate
      - (BOOL)application:(UIApplication *)app openURL:(NSURL *)url options:(NSDictionary *)options {
        return [self handle:url];
      }
      @end
  description: "application:openURL:options: - the openURL: deep-link URL param is attacker-controlled (scoped by the openURL: selector piece)."

- id: objc.source.openurl_options_dict
  enabled: true
  language: objc
  trust: remote
  tag: deep-link
  payload_types: [json]
  match:
    kind: param
    target:
      annotation: options
  match_examples:
  - name: openurl handler options param
    code: |
      #import <UIKit/UIKit.h>
      @implementation AppDelegate
      - (BOOL)application:(UIApplication *)app openURL:(NSURL *)url options:(NSDictionary *)options {
        return [self handle:options];
      }
      @end
  description: "application:openURL:options: - the options: dict (UIApplicationOpenURLOptionsKey) carries the attacker-controlled source-app payload (scoped by the options: selector piece)."

- id: objc.source.universal_link_continueuseractivity
  enabled: true
  language: objc
  trust: remote
  tag: deep-link
  payload_types: [url]
  match:
    kind: param
    target:
      annotation: continueUserActivity
  match_examples:
  - name: universal link continue user activity param
    code: |
      #import <UIKit/UIKit.h>
      @implementation AppDelegate
      - (BOOL)application:(UIApplication *)app continueUserActivity:(NSUserActivity *)userActivity restorationHandler:(void (^)(NSArray *))handler {
        return [self handle:userActivity];
      }
      @end
  description: "application:continueUserActivity:restorationHandler: - Universal Link handler; NSUserActivity.webpageURL is attacker-controlled (scoped by the continueUserActivity: selector piece)."

- id: objc.source.push_notification_userinfo
  enabled: true
  language: objc
  trust: remote
  tag: push-input
  payload_types: [json]
  match:
    kind: param
    target:
      annotation: didReceiveRemoteNotification
  match_examples:
  - name: apns remote notification payload
    code: |
      #import <UIKit/UIKit.h>
      @implementation AppDelegate
      - (void)application:(UIApplication *)application didReceiveRemoteNotification:(NSDictionary *)userInfo {
        [self handle:userInfo];
      }
      @end
    expect_match_text: [userInfo]
  - name: ordinary user info parameter negative
    code: |
      void handle(id userInfo) { }
    expect_no_match: true
  description: "APNS didReceiveRemoteNotification selector parameter - remote notification payload matched from the compiler-emitted Objective-C selector piece."

- id: objc.source.push_notification_userinfo_property
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: remote
  tag: push-input
  payload_types: [json]
  match:
    kind: read
    target:
      attribute: [notification, userInfo]
  description: "Disabled - a generic `notification.userInfo` read does not prove an APNS boundary. The selector-scoped objc.source.push_notification_userinfo parameter rule is the canonical APNS source."

- id: objc.source.wkwebview_usercontentcontroller_message
  enabled: true
  language: objc
  trust: remote
  tag: ipc-input
  payload_types: [json, text]
  match:
    kind: param
    target:
      annotation: didReceiveScriptMessage
  match_examples:
  - name: wkwebview script message param
    code: |
      #import <WebKit/WebKit.h>
      @implementation Bridge
      - (void)userContentController:(WKUserContentController *)controller didReceiveScriptMessage:(WKScriptMessage *)message {
        [self handle:message];
      }
      @end
  description: "userContentController:didReceiveScriptMessage: - JS->native bridge payload (WKScriptMessage.body) is attacker-controlled (scoped by the didReceiveScriptMessage: selector piece)."

- id: objc.source.message_compose_body
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: objc
  trust: remote
  tag: deep-link
  payload_types: [text]
  match:
    kind: write
    target:
      name: body
  description: "Disabled - MFMessageComposeViewController.body assignment with attacker-controlled deep-link content; can hijack outbound SMS draft. Reflects sink-direction; enable only when modeling outbound-SMS surfaces."

- id: objc.source.app_extension_input_items
  enabled: true
  language: objc
  trust: remote
  tag: ipc-input
  payload_types: [json]
  match:
    kind: read
    target:
      attribute: [extensionContext, inputItems]
  match_examples:
  - name: extension context input items read
    code: |
      #import <Foundation/Foundation.h>
      @implementation ShareViewController
      - (void)handle {
        NSArray *items = self.extensionContext.inputItems;
        NSLog(@"%@", items);
      }
      @end
  description: "NSExtensionContext.inputItems - Share/Action extension input items from the host app, read via `self.extensionContext.inputItems`."

- id: objc.source.nsurlprotocol_canonical_request
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: remote
  tag: http-input
  match:
    kind: param
    target:
      name: canonicalRequestForRequest
  description: "Disabled - NSURLProtocol subclass hook sees every outbound request; too noisy without receiver narrowing."
