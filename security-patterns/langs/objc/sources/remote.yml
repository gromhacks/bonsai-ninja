- id: objc.source.openurl_options_url
  enabled: true
  language: objc
  trust: remote
  tag: deep-link
  payload_types: [url]
  match:
    kind: param
    target:
      annotation: openURL
      in_method: [application]
      param_index_in: [1]
      param_type_in: [NSURL]
      param_count_in: [3]
      signature_param_types:
      - index: 0
        type_in: [UIApplication]
      - index: 2
        type_in: [NSDictionary]
  match_examples:
  - name: openurl handler url param
    code: |
      #import <UIKit/UIKit.h>
      @implementation AppDelegate
      - (BOOL)application:(UIApplication *)app openURL:(NSURL *)url options:(NSDictionary *)options {
        return [self handle:url];
      }
      @end
    expect_match_text: [url]
  - name: same selector piece outside UIApplication signature negative
    code: |
      #import <UIKit/UIKit.h>
      @implementation Router
      - (BOOL)route:(NSObject *)app openURL:(NSURL *)url options:(NSDictionary *)options {
        return [self handle:url];
      }
      @end
    expect_no_match: true
  description: "application:openURL:options: - the openURL: deep-link URL param is attacker-controlled (scoped by the openURL: selector piece)."

