- id: objc.source.nsurlrequest_param
  enabled: true
  language: objc
  trust: remote
  tag: network-response
  payload_types: [url]
  packages: [Foundation]
  match:
    kind: param
    target:
      annotation: newRequest
      param_type_in: [NSURLRequest]
      in_method: [URLSession]
  match_examples:
  - name: redirected URL session request
    code: |
      #import <Foundation/Foundation.h>
      @implementation Client
      - (void)URLSession:(NSURLSession *)session task:(NSURLSessionTask *)task willPerformHTTPRedirection:(NSHTTPURLResponse *)response newRequest:(NSURLRequest *)redirected completionHandler:(void (^)(NSURLRequest *))completion {
        [self consume:redirected];
      }
      @end
    expect_match_text: [redirected]
  - name: ordinary request parameter negative
    code: |
      #import <Foundation/Foundation.h>
      void consume(NSURLRequest *request) { }
    expect_no_match: true
  description: "The NSURLRequest bound to the exact URLSession redirection selector piece `newRequest:` is derived from the remote Location response; ordinary outbound NSURLRequest parameters remain clean."

