- id: objc.source.nsfilehandle_read_data
  enabled: true
  language: objc
  trust: local
  tag: cli-input
  payload_types: [binary, text]
  packages: [Foundation]
  match:
    kind: call
    callee:
      regex: "^(?:.*\\.)?(?:readDataToEndOfFile|readDataOfLength|availableData|readToEnd)$"
  constraints:
  - receiver_type_in: [NSFileHandle]
  match_examples:
  - name: typed file handle read
    code: |
      #import <Foundation/Foundation.h>
      NSData *read_input(NSFileHandle *handle) { return [handle readDataToEndOfFile]; }
    expect_match_text: [handle.readDataToEndOfFile]
  - name: unrelated reader negative
    code: |
      #import <Foundation/Foundation.h>
      @interface CacheReader : NSObject
      - (NSData *)readDataToEndOfFile;
      @end
      NSData *read_cache(CacheReader *reader) { return [reader readDataToEndOfFile]; }
    expect_no_match: true
  description: "NSFileHandle readDataToEndOfFile/readDataOfLength/availableData/readToEnd returns bytes from a file, pipe, terminal, or communications channel with local trust."

- id: objc.source.user_defaults_object
  enabled: true
  language: objc
  trust: config
  tag: local-input
  payload_types: [json, text]
  match:
    kind: call
    callee:
      attribute: [NSUserDefaults, objectForKey]
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; [NSUserDefaults objectForKey:input]; }
  description: "NSUserDefaults -objectForKey: - local prefs storage. Untrusted when shared via app group / extension (suiteName:), since any group member can write. Constrained to NSUserDefaults receivers."

- id: objc.source.user_defaults_string
  enabled: true
  language: objc
  trust: config
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      regex: "^(?:.*\\.)?(stringForKey|arrayForKey|dictionaryForKey|dataForKey|stringArrayForKey|URLForKey)$"
  constraints:
    - receiver_type_in: [NSUserDefaults]
  match_examples:
    - name: declared shape
      code: |
        void test(NSUserDefaults *defaults, id input) { id target = input; int amount = 1; [defaults stringForKey:input]; }
    - name: primitive accessor negative
      code: |
        void test(NSUserDefaults *defaults, id input) { id target = input; int amount = 1; [defaults boolForKey:input]; }
      expect_no_match: true
  description: "NSUserDefaults -stringForKey: / -dictionaryForKey: / -URLForKey: - typed accessors over the same shared-prefs store; same untrusted-when-shared risk as objectForKey:. The method-name allowlist excludes primitive accessors like boolForKey:/integerForKey: that cannot carry a string/data payload."
