# Objective-C CLI / local-trust sources (NSProcessInfo, libc, stdin).
- id: objc.source.stdin_fgets
  enabled: true
  language: objc
  trust: local
  tag: cli-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: fgets
  taint_semantics:
    source_output_args: [0]
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; fgets(input); }
  description: "fgets(buf, size, stdin) - interactive stdin read; buf is tainted via output argument 0."

- id: objc.source.nsprocessinfo_arguments
  enabled: true
  language: objc
  trust: local
  tag: cli-input
  payload_types: [text]
  match:
    kind: read
    target:
      name: arguments
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; id result = [NSProcessInfo processInfo].arguments; }
  description: "NSProcessInfo.processInfo.arguments - CLI argv. Local trust; still attacker-controllable via launch agents."

- id: objc.source.nsprocessinfo_environment
  enabled: true
  language: objc
  trust: local
  tag: env-input
  payload_types: [text]
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: read
    target:
      name: environment
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; id result = [NSProcessInfo processInfo].environment; }
  description: "NSProcessInfo.processInfo.environment - env vars. Local trust but crosses boundaries when spawned from untrusted parent."

- id: objc.source.cli_argv
  enabled: true
  language: objc
  trust: local
  tag: cli-input
  match:
    kind: param
    target:
      in_method: [main]
      param_index_in: [1]
      param_type_in: [char]
      param_count_in: [2, 3]
  match_examples:
    - name: Objective-C main argv can use any binding name
      code: |
        int main(int count, const char *values[]) {
          return 0;
        }
      expect_match_text: [values]
    - name: unrelated char array parameter is not process input
      code: |
        void helper(int count, const char *values[]) {
        }
      expect_no_match: true
  description: "The char** parameter at argv's runtime position in Objective-C/C main(...) - matched from the grammar-declared signature, independent of the binding name."

- id: objc.source.env_getenv
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: local
  tag: env-input
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: call
    callee:
      name: getenv
  description: "Disabled - libc getenv is local; enable when reading security-sensitive env vars in a privileged context."

- id: objc.source.nsfilehandle_standardinput
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: local
  tag: cli-input
  match:
    kind: call
    callee:
      name: fileHandleWithStandardInput
  description: "Disabled - NSFileHandle standardInput is stdin; rarely used in iOS apps, enable for CLI/macOS tools."

- id: objc.source.readline
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: local
  tag: cli-input
  match:
    kind: call
    callee:
      name: readline
  description: "Disabled - GNU readline; enable for interactive CLI tools bridging libreadline."

- id: objc.source.uitextfield_text
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: local
  tag: ui-input
  payload_types: [text]
  match:
    kind: read
    target:
      name: text
  description: "Disabled - bare `.text` read matches every UIKit attribute named text and every NSAttributedString; enable only with receiver narrowing."

- id: objc.source.uitextview_text
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: local
  tag: ui-input
  match:
    kind: read
    target:
      name: text
  description: "Disabled - duplicate of objc.source.uitextfield_text. Bare name 'text' matches every UIKit .text accessor."

- id: objc.source.user_defaults_object
  enabled: true
  language: objc
  trust: config
  tag: local-input
  payload_types: [json, text]
  match:
    kind: call
    callee:
      attribute: [NSUserDefaults, objectForKey]
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; [NSUserDefaults objectForKey:input]; }
  description: "NSUserDefaults -objectForKey: - local prefs storage. Untrusted when shared via app group / extension (suiteName:), since any group member can write. Constrained to NSUserDefaults receivers."

- id: objc.source.user_defaults_string
  enabled: true
  language: objc
  trust: config
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      regex: "^(?:.*\\.)?(stringForKey|arrayForKey|dictionaryForKey|dataForKey|stringArrayForKey|URLForKey)$"
  constraints:
    - receiver_type_in: [NSUserDefaults]
  match_examples:
    - name: declared shape
      code: |
        void test(NSUserDefaults *defaults, id input) { id target = input; int amount = 1; [defaults stringForKey:input]; }
    - name: primitive accessor negative
      code: |
        void test(NSUserDefaults *defaults, id input) { id target = input; int amount = 1; [defaults boolForKey:input]; }
      expect_no_match: true
  description: "NSUserDefaults -stringForKey: / -dictionaryForKey: / -URLForKey: - typed accessors over the same shared-prefs store; same untrusted-when-shared risk as objectForKey:. The method-name allowlist excludes primitive accessors like boolForKey:/integerForKey: that cannot carry a string/data payload."

- id: objc.source.uipasteboard_string
  enabled: true
  language: objc
  trust: ipc
  tag: clipboard-input
  payload_types: [text]
  match:
    kind: call
    callee:
      regex: "^(?:.*\\.)?(stringForType|valueForPasteboardType|dataForPasteboardType)$"
  constraints:
    - receiver_type_in: [UIPasteboard, NSPasteboard]
  match_examples:
    - name: declared shape
      code: |
        void test(UIPasteboard *pasteboard, id input) { id target = input; int amount = 1; [pasteboard stringForType:input]; }
    - name: non-accessor method negative
      code: |
        void test(UIPasteboard *pasteboard, id input) { id target = input; int amount = 1; [pasteboard setPersistent:input]; }
      expect_no_match: true
  description: "UIPasteboard/NSPasteboard typed accessors - clipboard contents originate from any other app or user paste action; treat as untrusted IPC input. The method-name allowlist excludes mutators/metadata methods (setPersistent:, numberOfItems) that do not return clipboard payload."

- id: objc.source.nspasteboard_string
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: ipc
  tag: clipboard-input
  payload_types: [text]
  match:
    kind: call
    callee:
      attribute: [NSPasteboard, generalPasteboard]
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; [NSPasteboard generalPasteboard:input]; }
  description: "Disabled - +generalPasteboard returns the pasteboard object rather than clipboard data. objc.source.uipasteboard_string models the typed string/data accessors that actually return cross-app input."
