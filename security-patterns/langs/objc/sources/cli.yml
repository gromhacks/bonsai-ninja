# Objective-C CLI / local-trust sources (NSProcessInfo, libc, stdin).
- id: objc.source.stdin_fgets
  enabled: true
  language: objc
  trust: local
  tag: cli-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: fgets
  taint_semantics:
    source_output_args: [0]
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; fgets(input); }
  description: "fgets(buf, size, stdin) - interactive stdin read; buf is tainted via output argument 0."

- id: objc.source.nsprocessinfo_arguments
  enabled: true
  language: objc
  trust: local
  tag: cli-input
  payload_types: [text]
  packages: [Foundation]
  match:
    kind: read
    target:
      attribute: [NSProcessInfo, processInfo, arguments]
  match_examples:
  - name: exact process arguments property
    code: |
      #import <Foundation/Foundation.h>
      NSArray *arguments(void) { return [NSProcessInfo processInfo].arguments; }
    expect_match_text: [NSProcessInfo.processInfo.arguments]
  - name: unrelated arguments property negative
    code: |
      #import <Foundation/Foundation.h>
      id arguments(ProcessState *state) { return state.processInfo.arguments; }
    expect_no_match: true
  description: "The exact `[NSProcessInfo processInfo].arguments` compiler place carries process argv; matching the complete chain avoids every application `arguments` property."

- id: objc.source.nsprocessinfo_arguments_message
  enabled: true
  language: objc
  trust: local
  tag: cli-input
  payload_types: [text]
  packages: [Foundation]
  match:
    kind: call
    callee:
      attribute: [NSProcessInfo, processInfo, arguments]
  constraints:
  - arg_count: 0
  match_examples:
  - name: exact process arguments message
    code: |
      #import <Foundation/Foundation.h>
      NSArray *arguments(void) { return [[NSProcessInfo processInfo] arguments]; }
    expect_match_text: [NSProcessInfo.processInfo.arguments]
  - name: unrelated arguments message negative
    code: |
      #import <Foundation/Foundation.h>
      NSArray *arguments(ProcessState *state) { return [state arguments]; }
    expect_no_match: true
  description: "The message-send spelling `[[NSProcessInfo processInfo] arguments]` returns process argv; the complete nested receiver chain is compiler-derived."

