- id: objc.source.cli_argv
  enabled: true
  language: objc
  trust: local
  tag: cli-input
  match:
    kind: param
    target:
      in_method: [main]
      param_index_in: [1]
      param_type_in: [char]
      param_count_in: [2, 3]
  match_examples:
    - name: Objective-C main argv can use any binding name
      code: |
        int main(int count, const char *values[]) {
          return 0;
        }
      expect_match_text: [values]
    - name: unrelated char array parameter is not process input
      code: |
        void helper(int count, const char *values[]) {
        }
      expect_no_match: true
  description: "The char** parameter at argv's runtime position in Objective-C/C main(...) - matched from the grammar-declared signature, independent of the binding name."

- id: objc.source.env_getenv
  enabled: true
  language: objc
  trust: local
  tag: env-input
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: call
    callee:
      name: getenv
  match_examples:
  - name: libc environment lookup
    code: |
      #include <stdlib.h>
      const char *mode(void) { return getenv("APP_MODE"); }
    expect_match_text: [getenv]
  - name: setter is not an input source
    code: |
      #include <stdlib.h>
      void configure(void) { setenv("APP_MODE", "prod", 1); }
    expect_no_match: true
  description: "libc getenv(name) returns process-environment input with local trust."

- id: objc.source.readline
  enabled: true
  language: objc
  trust: local
  tag: cli-input
  match:
    kind: call
    callee:
      name: readline
  constraints:
  - min_args: 1
  - max_args: 1
  match_examples:
  - name: readline prompt input
    code: |
      #include <readline/readline.h>
      char *ask(void) { return readline("command> "); }
    expect_match_text: [readline]
  - name: history call negative
    code: |
      #include <readline/history.h>
      void remember(const char *line) { add_history(line); }
    expect_no_match: true
  description: "GNU readline(prompt) returns interactive terminal input."

- id: objc.source.uitextfield_text
  enabled: true
  language: objc
  trust: local
  tag: ui-input
  payload_types: [text]
  match:
    kind: read
    target:
      name: text
      receiver_type_in: [UITextField]
  match_examples:
  - name: typed text field value
    code: |
      #import <UIKit/UIKit.h>
      NSString *value(UITextField *field) { return field.text; }
    expect_match_text: [field.text]
  - name: unrelated text property negative
    code: |
      #import <UIKit/UIKit.h>
      @interface LabelModel : NSObject
      @property NSString *text;
      @end
      NSString *value(LabelModel *model) { return model.text; }
    expect_no_match: true
  description: "UITextField.text returns user-entered text on a compiler-typed UITextField receiver."

