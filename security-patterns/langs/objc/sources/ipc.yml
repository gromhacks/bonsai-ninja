# Objective-C IPC / cross-app input sources.
- id: objc.source.notification_userinfo
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: ipc
  tag: ipc-input
  payload_types: [json]
  match:
    kind: read
    target:
      name: userInfo
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; id notification; id result = notification.userInfo; }
  description: "Disabled - a bare `userInfo` property does not establish an IPC boundary. Ordinary NSNotificationCenter notifications are process-local, while Darwin notifications do not carry a userInfo payload. APNS input is modeled by the selector-scoped remote source."

- id: objc.source.pasteboard_string
  enabled: false
  disabled_reason:
    code: over-broad
  language: objc
  trust: ipc
  tag: ipc-input
  match:
    kind: call
    callee:
      attribute: [UIPasteboard, generalPasteboard]
  match_examples:
    - name: declared shape
      code: |
        void test(id input) { id target = input; int amount = 1; [UIPasteboard generalPasteboard:input]; }
  description: "Disabled - +generalPasteboard returns the pasteboard object, not clipboard content. Typed string/data accessors are modeled by objc.source.uipasteboard_string."
