# Objective-C IPC / cross-app input sources.
- id: objc.source.uipasteboard_string
  enabled: true
  language: objc
  trust: ipc
  tag: clipboard-input
  payload_types: [text, binary]
  match:
    kind: call
    callee:
      regex: "^(?:.*\\.)?(stringForType|valueForPasteboardType|dataForPasteboardType)$"
  constraints:
  - receiver_type_in: [UIPasteboard, NSPasteboard]
  - min_args: 1
  - max_args: 1
  match_examples:
  - name: typed pasteboard string value
    code: |
      #import <UIKit/UIKit.h>
      NSString *read(UIPasteboard *pasteboard) { return [pasteboard stringForType:@"public.text"]; }
    expect_match_text: [pasteboard.stringForType]
  - name: pasteboard mutator is not input
    code: |
      #import <UIKit/UIKit.h>
      void write(UIPasteboard *pasteboard) { [pasteboard setPersistent:YES]; }
    expect_no_match: true
  description: "UIPasteboard/NSPasteboard typed string/data accessors return clipboard payload supplied by another app or user paste action; pasteboard object factories and mutators are not sources."

- id: objc.source.uipasteboard_direct_value
  enabled: true
  language: objc
  trust: ipc
  tag: clipboard-input
  payload_types: [text, url]
  packages: [UIKit]
  match:
    kind: call
    callee:
      regex: "^(?:.*\\.)?(string|URL)$"
  constraints:
  - receiver_type_in: [UIPasteboard]
  - arg_count: 0
  match_examples:
  - name: typed pasteboard direct string
    code: |
      #import <UIKit/UIKit.h>
      NSString *read(UIPasteboard *pasteboard) { return [pasteboard string]; }
    expect_match_text: [pasteboard.string]
  - name: same selector on unrelated receiver negative
    code: |
      #import <UIKit/UIKit.h>
      @interface Document : NSObject
      - (NSString *)string;
      @end
      NSString *read(Document *document) { return [document string]; }
    expect_no_match: true
  description: "UIPasteboard string/URL accessors return clipboard or cross-application paste content; exact receiver typing keeps ubiquitous string/URL selectors quiet."
