- id: scala.typing.lifecycle_released_receiver
  enabled: true
  language: scala
  match:
    kind: call
    callee:
      regex: '(?:^|\.)(?:release|dispose)$'
  lifecycle_transition:
    state: freed
    binding: { kind: receiver }
  match_examples:
  - name: dispose changes the receiver state
    code: 'def f(resource: Resource): Unit = resource.dispose()'
    expect_match_text: [resource.dispose]
  description: "Scala release/dispose moves the receiver to freed. Typing-only; never a finding."
