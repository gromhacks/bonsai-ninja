- id: scala.typing.lifecycle_closed_receiver
  enabled: true
  language: scala
  match:
    kind: call
    callee:
      regex: '(?:^|\.)(?:close|shutdown)$'
  lifecycle_transition:
    state: closed
    binding: { kind: receiver }
  match_examples:
  - name: close changes the receiver state
    code: 'def f(stream: java.io.InputStream): Unit = stream.close()'
    expect_match_text: [stream.close]
  description: "Scala/JVM close/shutdown moves the receiver to closed. Typing-only; never a finding."

- id: scala.typing.lifecycle_cancelled_receiver
  enabled: true
  language: scala
  match: { kind: call, callee: { name: cancel } }
  lifecycle_transition:
    state: cancelled
    binding: { kind: receiver }
  match_examples:
  - name: cancel changes the receiver state
    code: 'def f(task: Task): Unit = task.cancel()'
    expect_match_text: [task.cancel]
  description: "Scala cancel moves the receiver to cancelled. Typing-only; never a finding."

- id: scala.typing.lifecycle_unlocked_receiver
  enabled: true
