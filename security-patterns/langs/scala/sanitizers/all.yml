- id: scala.sanitizer.xpath_evaluate_variable_placeholder
  enabled: true
  language: scala
  tag: xpath-parameter
  packages: ["javax.xml.xpath"]
  match:
    kind: call
    callee:
      attribute: [XPath, evaluate]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '\$[A-Za-z_][A-Za-z0-9_]*'
  - min_args: 2
  match_examples:
  - name: xpath evaluate placeholder
    code: |
      import javax.xml.xpath._
      object App {
        def find(xpath: XPath, doc: Any): Any = {
          xpath.evaluate("/users/user[@id=$id]", doc)
        }
      }
    expect_match_text: [xpath.evaluate]
  - name: xpath evaluate placeholder negative constraint boundary
    code: "import javax.xml.xpath._\nobject App {\n  def find(xpath: XPath, doc: Any): Any = {\n    xpath.evaluate()\n  }\n\
      }\n"
    expect_no_match: true
  description: "XPath.evaluate with `$name` placeholders is the parameterized side of XPath variable binding."

