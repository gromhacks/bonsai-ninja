# --- XXE parser hardening --------------------------------------------
- id: scala.sanitizer.xml_factory_disallow_doctype
  enabled: true
  language: scala
  tag: xxe-sanitizer
  packages: ["javax.xml.parsers", "jakarta.xml.parsers"]
  match:
    kind: call
    callee:
      name: setFeature
  constraints:
  - receiver_type_in:
    - DocumentBuilderFactory
    - SAXParserFactory
  - arg_matches_regex:
      index: 0
      regex: 'external-general-entities|external-parameter-entities|load-external-dtd|disallow-doctype-decl'
  match_examples:
  - name: scala document builder disable external entity feature
    code: |
      import javax.xml.parsers._
      object App {
        def configure(factory: DocumentBuilderFactory): Unit = {
          factory.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)
        }
      }
    expect_match_text: [factory.setFeature]
  - name: scala document builder disable external entity feature negative constraint boundary
    code: "import javax.xml.parsers._\nobject App {\n  def configure(factory: DocumentBuilderFactory): Unit = {\n    factory.setFeature()\n  }\n}\n"
    expect_no_match: true
  description: "XML parser feature hardening - disables external entity / external DTD loading or disallows DOCTYPE to block XXE (Scala via Java interop)."
- id: scala.passthrough.string_format
  enabled: true
  language: scala
  tag: passthrough-transform
  match:
    kind: call
    callee:
      attribute: [String, format]
  taint_semantics:
    call_result_passthrough_args: [0, 1, 2, 3, 4, 5, 6, 7]
  match_examples:
  - name: string format preserves arg taint
    code: |
      object App {
        def h(input: String): String = {
          String.format("q=%s", input)
        }
      }
    expect_match_text: [String.format]
  description: "Scala String.format(fmt, args...) - formatted string derives from its arguments; preserves taint."
- id: scala.passthrough.string_value_of
  enabled: true
  language: scala
  tag: passthrough-transform
  match:
    kind: call
    callee:
      attribute: [String, valueOf]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: string valueof preserves taint
    code: |
      object App {
        def h(input: String): String = {
          String.valueOf(input)
        }
      }
    expect_match_text: [String.valueOf]
  description: "Scala String.valueOf(x) - text coercion; the resulting string still carries attacker content, so it preserves taint (WS3 coercion passthrough; mirrors java.passthrough.string_value_of - per-language audit found scala had no String.valueOf passthrough though toString already worked)."
