# --- Path containment ------------------------------------------------
- id: scala.sanitizer.path_normalize
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: scala
  tag: path-sanitize
  match:
    kind: call
    callee:
      attribute: [Path, normalize]
  description: "Disabled - java.nio.file.Path.normalize collapses .. segments but still requires a trusted-root containment
    check."

- id: scala.sanitizer.path_startswith
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: scala
  tag: path-sanitize
  match:
    kind: call
    callee:
      attribute: [Path, startsWith]
  description: "Disabled - startsWith is only a sanitizer on normalized Path values with a trusted-root argument; v1 matching
    cannot prove receiver type."

# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) - taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: scala.passthrough.urldecoder_decode
  enabled: true
  language: scala
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [URLDecoder, decode]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(input: String): Unit = {
          URLDecoder.decode(input)
        }
      }
    expect_match_text: [URLDecoder.decode]
  description: "java.net.URLDecoder.decode(s, charset) - preserves taint (Scala via Java interop)."

# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: scala.csrf.play_csrf_filter
  enabled: true
  language: scala
  tag: csrf-protect
  match:
    kind: call
    callee:
      name: CSRFFilter
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(input: String): Unit = {
          CSRFFilter(input)
        }
      }
    expect_match_text: [CSRFFilter]
  description: "Play Framework CSRFFilter - global CSRF enforcement."

# Lock-acquire sanitizers (T502). Tagged `lock-acquire` so
# reviewer enumerates guarded sections; the in-scope-cleanse
# semantics handle 'while lock is held, accesses are safe'.
- id: scala.lock.reentrant_lock
  enabled: true
  language: scala
  tag: lock-acquire
  match:
    kind: call
    callee:
      attribute: [ReentrantLock, lock]
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(input: String): Unit = {
          ReentrantLock.lock(input)
        }
      }
    expect_match_text: [ReentrantLock.lock]
  description: "Java ReentrantLock.lock() (Scala via Java interop)."

# Cookie-secure sanitizers (T402). Cookie-set calls with
# httpOnly + secure flags are the SAFE shape; reviewer
# enumerates with `security sanitizers --tag cookie-secure`
# and audits routes that set cookies WITHOUT them.
- id: scala.cookie.cookie_with_httponly
  enabled: true
  language: scala
  tag: cookie-secure
  match:
    kind: call
    callee:
      name: Cookie
  constraints:
  - any_arg_matches_regex: |-
      httpOnly.*true|secure.*true
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(input: String): Unit = {
          Cookie(httpOnly = true)
        }
      }
    expect_match_text: [Cookie]
  - name: generated shape example negative constraint boundary
    code: "object App {\n  def handle(input: String): Unit = {\n    Cookie()\n  }\n}\n"
    expect_no_match: true
  description: "Play Cookie(name, value, httpOnly = true, secure = true)."

# False-positive audit fill: validators and parameter binding shapes.
- id: scala.sanitizer.same_origin_path_startswith_slash
  enabled: true
  language: scala
  tag: same-origin-path
  match:
    kind: call
    callee:
      name: startsWith
  constraints:
  - arg_equals:
      index: 0
      value: '"/"'
  - same_receiver_call_count_at_least: 2
  match_examples:
  - name: paired same-origin path guard
    code: |
      object App {
        def allow(next: String): Boolean = {
          next.startsWith("/") && !next.startsWith("//")
        }
      }
    expect_match_text: [next.startsWith]
  - name: paired same-origin path guard negative constraint boundary
    code: "object App {\n  def allow(next: String): Boolean = {\n    next.startsWith() && !next.startsWith(\"//\")\n  }\n\
      }\n"
    expect_no_match: true
  description: "Same-origin redirect path guard paired with a second startsWith call on the same receiver for the `!path.startsWith(\"\
    //\")` scheme-relative rejection shape."

- id: scala.sanitizer.same_origin_path_reject_scheme_relative
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: scala
  tag: same-origin-path
  match:
    kind: call
    callee:
      name: startsWith
  constraints:
  - arg_equals:
      index: 0
      value: '"//"'
  match_examples:
  - name: reject scheme-relative redirect target
    code: |
      object App {
        def allow(next: String): Boolean = {
          next.startsWith("/") && !next.startsWith("//")
        }
      }
    expect_match_text: [next.startsWith]
  - name: reject scheme-relative redirect target negative constraint boundary
    code: "object App {\n  def allow(next: String): Boolean = {\n    next.startsWith(\"/\") && !next.startsWith(\"http://\"\
      )\n  }\n}\n"
    expect_no_match: true
  description: "Disabled duplicate - the complete same-origin-path sanitizer is the paired startsWith(\"/\") + !startsWith(\"\
    //\") shape in scala.sanitizer.same_origin_path_startswith_slash."

- id: scala.sanitizer.allowlist_contains
  enabled: false
  language: scala
  tag: allowlist-validate
  match:
    kind: call
    callee:
      name: contains
  constraints:
  - arg_count: 1
  match_examples:
  - name: set allowlist contains
    code: |
      object App {
        def allow(role: String): Boolean = {
          val allowed = Set("user", "admin")
          allowed.contains(role)
        }
      }
    expect_match_text: [allowed.contains]
  description: "Disabled - receiver-name allowlist heuristics are not semantic enough to grant sanitizer credit. Set/List
    allowlist membership check on explicitly allowlist-named receivers."

  disabled_reason:
    code: over-broad
- id: scala.sanitizer.map_get_or_else_allowlist
  enabled: false
  language: scala
  tag: allowlist-validate
  match:
    kind: call
    callee:
      name: getOrElse
  constraints:
  - arg_count: 2
  match_examples:
  - name: map default allowlist
    code: |
      object App {
        def allow(key: String): String = {
          val allowed = Map("home" -> "/")
          allowed.getOrElse(key, "/")
        }
      }
    expect_match_text: [allowed.getOrElse]
  description: "Disabled - receiver-name allowlist heuristics are not semantic enough to grant sanitizer credit. Map.getOrElse
    on an allowlist-named mapping bounds attacker input to known values or a safe default."

  disabled_reason:
    code: over-broad
- id: scala.sanitizer.enum_withname_allowlist
  enabled: false
  language: scala
  tag: allowlist-validate
  match:
    kind: call
    callee:
      name: withName
  constraints:
  - arg_count: 1
  match_examples:
  - name: enum parse allowlist
    code: |
      object AllowedRole extends Enumeration { val User, Admin = Value }
      object App {
        def allow(role: String): AllowedRole.Value = {
          AllowedRole.withName(role)
        }
      }
    expect_match_text: [AllowedRole.withName]
  description: "Disabled - receiver-name allowlist heuristics are not semantic enough to grant sanitizer credit. Scala Enumeration.withName
    on narrowly named allowlist enums rejects values outside the enum domain."

  disabled_reason:
    code: over-broad
- id: scala.sanitizer.string_matches_safe_shape
  enabled: true
  language: scala
  tag: regex-validate
  match:
    kind: call
    callee:
      name: matches
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^["'']\^?(\[A-Za-z0-9_|\[A-Fa-f0-9)'
  match_examples:
  - name: slug shape validator
    code: |
      object App {
        def allow(slug: String): Boolean = {
          slug.matches("^[A-Za-z0-9_-]{1,64}$")
        }
      }
    expect_match_text: [slug.matches]
  - name: slug shape validator negative constraint boundary
    code: "object App {\n  def allow(slug: String): Boolean = {\n    slug.matches()\n  }\n}\n"
    expect_no_match: true
  description: "String.matches with a tight slug/UUID-style allowlist regex validates input shape before redirect, path, SQL,
    or XPath use."

- id: scala.sanitizer.replaceall_char_allowlist_strip
  enabled: true
  language: scala
  tag: char-allowlist
  match:
    kind: call
    callee:
      name: replaceAll
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^["'']\[\^[-A-Za-z0-9_ /]+\]["'']$'
  - arg_matches_regex:
      index: 1
      regex: '^["'']["'']$'
  match_examples:
  - name: strip to safe slug chars
    code: |
      object App {
        def clean(input: String): String = {
          input.replaceAll("[^A-Za-z0-9_-]", "")
        }
      }
    expect_match_text: [input.replaceAll]
  - name: strip to safe slug chars negative constraint boundary
    code: "object App {\n  def clean(input: String): String = {\n    input.replaceAll()\n  }\n}\n"
    expect_no_match: true
  description: "replaceAll with a negated safe character class and empty replacement strips characters outside the allowlist."

