# Scala sanitizers (mostly JVM interop + a few Scala-idiomatic helpers).
# Canonical tags only: html-encode, html-sanitize, url-encode, shell-escape,
# sql-parameter, constant-time, jwt-verify, path-sanitize, xxe-sanitizer,
# ldap-escape, numeric-coerce, validation.

# --- URL encoding -----------------------------------------------------
- id: scala.sanitizer.url_encoder
  enabled: true
  language: scala
  tag: url-encode
  match:
    kind: call
    callee:
      regex: "^URLEncoder\\.encode$"
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(input: String): Unit = {
          URLEncoder.encode(input)
        }
      }
    expect_match_text: [URLEncoder.encode]
  description: "java.net.URLEncoder.encode percent-encodes user data so it cannot break out of a URL query/path component."

