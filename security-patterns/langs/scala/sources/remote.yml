  imports: [play.api.mvc]
  manifests: [build.sbt]
  match:
    kind: call
    callee:
      attribute: [Action, async]
      binding_origin: imported
  constraints:
  - arg_is_inline_callback: 0
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 0
      source_param_indices: [0]
  match_examples:
  - name: Play asynchronous Action callback receives the remote request
    code: |
      import play.api.mvc._
      object Routes {
        val action = Action.async { inbound => service(inbound).map(Ok(_)) }
        def service(value: Any) = scala.concurrent.Future.successful(value.toString)
      }
    expect_match_text: [Action.async]
  - name: local asynchronous Action callable does not create a remote boundary
    code: |
      import play.api.mvc._
      object Action {
        def async(callback: String => String): String = callback("")
      }
      object Routes { val action = Action.async { value => value } }
    expect_no_match: true
  description: "Imported Play Action.async delivers the compiler-declared callback request value. The exact provider/callback contract remains rule data."

- id: scala.play.request_get_query_string
  enabled: true
  language: scala
