# Scala HTTP-input sources (Play, akka-http, http4s, sttp server, servlet).
- id: scala.gcp.functions_request
  enabled: true
  language: scala
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [event, json, query, path, header]
  frameworks: [gcp-functions]
  packages: [com.google.cloud.functions]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_class: [HttpFunction]
      in_method: [service]
      param_index_in: [0]
      param_type_in: [HttpRequest, com.google.cloud.functions.HttpRequest]
  match_examples:
  - name: google cloud scala http request
    code: |
      import com.google.cloud.functions.{HttpFunction, HttpRequest, HttpResponse}
      class Function extends HttpFunction {
        override def service(request: HttpRequest, response: HttpResponse): Unit = ()
      }
    expect_match_text: [request]
  - name: helper request negative
    code: |
      import com.google.cloud.functions.HttpRequest
      class Function { def helper(request: HttpRequest): Unit = () }
    expect_no_match: true
  description: "Google Cloud Scala HttpFunction.service request parameter - remote HTTP request proven by interface, method, position, and declared type."

- id: scala.servlet.get_parameter
  enabled: true
  language: scala
  trust: remote
  tag: http-input
  payload_types: [query]
  frameworks: [servlet, spring]
  packages: [jakarta.servlet, javax.servlet]
  match:
    kind: call
    callee:
      attribute: [HttpServletRequest, getParameter]
  match_examples:
  - name: generated shape example
    code: |
      import jakarta.servlet._
      object App {
        def handle(servletRequest: HttpServletRequest, value: String): Unit = {
          servletRequest.getParameter(value)
        }
      }
      trait HttpServletRequest {
        def getParameter(args: Any*): Any = null
      }
    expect_match_text: [servletRequest.getParameter]
  description: "HttpServletRequest.getParameter - Scala servlet / Spring handler parameter."

