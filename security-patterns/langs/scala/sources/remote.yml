- id: scala.tapir.input_query
  enabled: true
  language: scala
  trust: remote
  tag: http-input
  payload_types: [query]
  frameworks: [tapir]
  packages: ["sttp.tapir"]
  match:
    kind: call
    callee:
      name: query
  constraints:
  - top_level: true
  - min_args: 1
  - max_args: 1
  match_examples:
  - name: generated shape example
    code: |
      import sttp.tapir._
      object App {
        def handle(value: String): Unit = {
          query(value)
        }
      }
  description: "Tapir endpoint .in(query[T](\"name\")) — declares a query-string input bound into the handler. `top_level` rejects `obj.query(...)` ORM/SQL `query` decoys; `min/max_args: 1` matches Tapir's `query[T](name: String)` shape."

