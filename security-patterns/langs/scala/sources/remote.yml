  constraints:
  - max_args: 0
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(value: String): Unit = {
          request.body()
        }
      }
  description: "Play request.body — narrowed to attribute chain to avoid bare name FPs. Property-style getter (no args); `max_args: 0` rejects unrelated overloads."

