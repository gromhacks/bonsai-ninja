- id: scala.play.request_param
  enabled: true
  language: scala
  trust: remote
  tag: http-input
  payload_types: [json, query]
  frameworks: [play, akka-http, http4s]
  packages: [play.api, com.typesafe.play, com.typesafe.akka, http4s]
  imports: [play.api.mvc]
  manifests: [build.sbt]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      param_type_in: [Request, RequestHeader, play.api.mvc.Request, play.api.mvc.RequestHeader]
  match_examples:
  - name: typed play request parameter
    code: |
      import play.api.mvc.Request
      object App {
        def handle(request: Request[Any]): Unit = ()
      }
    expect_match_text: [request]
  - name: same name wrong type negative
    code: |
      import play.api.mvc.Request
      object App { def handle(request: String): Unit = () }
    expect_no_match: true
  description: "Play Request or RequestHeader parameter - remote request proven by its declared framework type rather than the name request."

