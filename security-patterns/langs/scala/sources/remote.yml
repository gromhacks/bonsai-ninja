    kind: call
    callee:
      name: getQueryString
      receiver_type_in: [Request, RequestHeader]
  match_examples:
  - name: typed Play query accessor
    code: |
      import play.api.mvc._
      object App {
        def handle(playRequest: Request[AnyContent], value: String): Unit = {
          playRequest.getQueryString(value)
        }
      }
    expect_match_text: [playRequest.getQueryString]
  - name: local query accessor is not Play input
    code: |
      import play.api.mvc._
      class LocalRequest { def getQueryString(name: String): Option[String] = None }
      object App {
        def handle(local: LocalRequest): Unit = {
          local.getQueryString("q")
        }
      }
    expect_no_match: true
  description: "Compiler-typed Play Request.getQueryString returns a query value supplied by the remote caller. The request parameter/callback remains the broader object boundary."

