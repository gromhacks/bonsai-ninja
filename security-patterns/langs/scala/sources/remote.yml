  packages: [com.twitter.finatra, com.twitter.finagle]
  match:
    kind: call
    callee:
      name: getParam
  constraints:
  - receiver_type_in: [Request, com.twitter.finagle.http.Request]
  - min_args: 1
  - max_args: 1
  match_examples:
  - name: finatra request parameter
    code: |
      import com.twitter.finagle.http.Request
      object Controller {
        def handle(request: Request): String = request.getParam("q")
      }
    expect_match_text: [request.getParam]
  - name: local parameter helper is not request input
    code: |
      import com.twitter.finagle.http.Request
      class Parameters { def getParam(name: String): String = name }
      object Helper {
        def read(params: Parameters): String = params.getParam("q")
      }
    expect_no_match: true
  description: "Finatra/Finagle HTTP Request.getParam(name) returns a query or form value supplied by the client."

