  constraints:
  - arg_is_inline_callback: 0
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 0
      source_param_indices_from: 0
  match_examples:
  - name: http4s captured inbound route request
    code: |
      import org.http4s._
      import org.http4s.dsl.io._
      object App {
        val routes = HttpRoutes.of[IO] {
          case request @ GET -> Root / "item" => Ok(request.uri)
        }
      }
    expect_match_text: [HttpRoutes.of]
  - name: route without a captured request negative
    code: |
      import org.http4s._
      import org.http4s.dsl.io._
      object App {
        val routes = HttpRoutes.of[IO] {
          case GET -> Root / "health" => Ok("ok")
        }
      }
    expect_no_match: true
