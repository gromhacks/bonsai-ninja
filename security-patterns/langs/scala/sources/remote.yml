- id: scala.tapir.input_query
  enabled: true
  language: scala
  trust: remote
  tag: http-input
  payload_types: [query, path, header, cookie, form, json]
  frameworks: [tapir]
  packages: ["sttp.tapir"]
  match:
    kind: call
    callee:
      regex: "[.]serverLogic$"
  constraints:
  - receiver_matches_regex: '(^|.*[^A-Za-z0-9_])endpoint[.]in[(]'
  - arg_is_inline_callback: 0
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 0
      source_param_indices_from: 0
  match_examples:
  - name: tapir endpoint server logic input
    code: |
      import sttp.tapir._
      object App {
        val route = endpoint.in(query[String]("q")).serverLogic {
          q => scala.concurrent.Future.successful(Right(q))
        }
      }
  - name: unrelated server logic receiver negative
    code: |
      import sttp.tapir._
      object App { def route(builder: Local) = builder.serverLogic(q => q) }
      class Local { def serverLogic(f: String => String) = f("safe") }
    expect_no_match: true
  description: "Tapir endpoint input values are delivered to the inline serverLogic callback. The exact compiler receiver contains the endpoint.in(...) descriptor; query/jsonBody descriptor objects themselves remain clean."

