  frameworks: [servlet, spring]
  packages: [jakarta.servlet, javax.servlet]
  match:
    kind: call
    callee:
      attribute: [HttpSession, getAttribute]
  constraints:
  - min_args: 1
  match_examples:
  - name: servlet session attribute
    code: |
      import jakarta.servlet._
      object App {
        def handle(session: HttpSession, key: String): Unit = {
          session.getAttribute(key)
        }
      }
      trait HttpSession {
        def getAttribute(args: Any*): Any = null
      }
    expect_match_text: [session.getAttribute]
  - name: same method on non-session receiver negative
    code: |
      import jakarta.servlet._
      object App {
        def handle(session: LocalSession, key: String): Unit = session.getAttribute(key)
      }
      class LocalSession { def getAttribute(key: String): Any = null }
    expect_no_match: true
  description: "HttpSession.getAttribute(name) - session data may originate from earlier remote requests and should be treated as untrusted when it reaches sensitive sinks."

- id: scala.play.request_param
  enabled: true
  language: scala
  trust: remote
  tag: http-input
  payload_types: [json, query]
  frameworks: [play, akka-http, http4s]
  packages: [play.api, com.typesafe.play, com.typesafe.akka, http4s]
  imports: [play.api.mvc]
  manifests: [build.sbt]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      param_type_in: [Request, RequestHeader, play.api.mvc.Request, play.api.mvc.RequestHeader]
  match_examples:
  - name: typed play request parameter
    code: |
      import play.api.mvc.Request
      object App {
        def handle(request: Request[Any]): Unit = ()
      }
    expect_match_text: [request]
  - name: same name wrong type negative
    code: |
      import play.api.mvc.Request
      object App { def handle(request: String): Unit = () }
    expect_no_match: true
  description: "Play Request or RequestHeader parameter - remote request proven by its declared framework type rather than the name request."

- id: scala.play.action_request_callback
  enabled: true
  language: scala
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query, form, json, text, binary, header, cookie, path]
  frameworks: [play]
  packages: [play.api, com.typesafe.play]
  imports: [play.api.mvc]
  manifests: [build.sbt]
  match:
    kind: call
    callee:
      name: Action
      binding_origin: imported
  constraints:
  - arg_is_inline_callback: 0
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 0
      source_param_indices: [0]
  match_examples:
  - name: Play Action callback receives the remote request
    code: |
      import play.api.mvc._
      object Routes {
        val action = Action { inbound => inbound.getQueryString("q") }
      }
    expect_match_text: [Action]
  - name: local Action callable does not create a remote boundary
    code: |
      import play.api.mvc._
      object Action { def apply(callback: String => String): String = callback("") }
      object Routes { val action = Action { value => value } }
    expect_no_match: true
  description: "Play Action delivers the compiler-declared callback request value. Accessor projections inherit that source provenance through the ordinary IDG; provider and payload meaning remain rule data."

- id: scala.play.action_async_request_callback
  enabled: true
  language: scala
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query, form, json, text, binary, header, cookie, path]
  frameworks: [play]
