- id: scala.akka.entity
  enabled: true
  language: scala
  trust: remote
  tag: http-input
  payload_types: [json]
  frameworks: [akka-http]
  match:
    kind: call
    callee:
      name: entity
  constraints:
  - top_level: true
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(value: String): Unit = {
          entity(value)
        }
      }
  - name: method receiver entity negative
    code: |
      object App {
        def handle(session: String): Unit = {
          session.entity(value)
        }
      }
    expect_no_match: true
  description: "akka-http entity(as[T]) directive - unmarshals request body. `top_level: true` rejects receiver-qualified `session.entity(...)` ORM/persistence calls that are not the akka-http directive."

