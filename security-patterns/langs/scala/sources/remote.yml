- id: scala.source.graphql_datafetching_getargument
  enabled: true
  language: scala
  trust: remote
  tag: graphql-input
  payload_types: [graphql]
  packages: ["graphql"]
  match:
    kind: call
    callee:
      name: getArgument
  constraints:
  - receiver_name_in: [env, environment, dataFetchingEnvironment]
  - min_args: 1
  match_examples:
  - name: graphql data fetching get argument
    code: |
      import graphql._
      object App {
        def handle(env: DataFetchingEnvironment, name: String): Any = {
          env.getArgument(name)
        }
      }
      class DataFetchingEnvironment {
        def getArgument(values: Any*): Any = null
      }
    expect_match_text: [env.getArgument]
  description: "graphql-java DataFetchingEnvironment.getArgument(name) — resolver argument supplied by the GraphQL caller."

  imports:
  - graphql
- id: scala.source.graphql_datafetching_getarguments
