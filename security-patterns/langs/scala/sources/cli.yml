# Scala local / CLI input sources.
- id: scala.cli.argv
  enabled: true
  language: scala
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: param
    target:
      name: args
      in_method: [main]
  match_examples:
    - name: generated shape example
      code: |
        object App {
          def main(args: Array[String]): Unit = {
          }
        }
  description: "Scala `def main(args: Array[String])` - CLI args."

- id: scala.cli.stdin_readline
  enabled: true
  language: scala
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      attribute: [StdIn, readLine]
  match_examples:
    - name: generated shape example
      code: |
        object App {
          def handle(value: String): Unit = {
            StdIn.readLine(value)
          }
        }
  description: "scala.io.StdIn.readLine - interactive CLI input."

