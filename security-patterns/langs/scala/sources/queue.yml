# Scala queue / broker event sources.
- id: scala.queue.alpakka_kafka_record
  enabled: true
  language: scala
  trust: service
  tag: event-input
  payload_types: [event]
  frameworks: [alpakka-kafka]
  packages: ["com.typesafe.akka.alpakka-kafka"]
  match:
    kind: param
    target:
      name: record
  match_examples:
  - name: generated shape example
    code: |
      import com.typesafe.akka.alpakkakafka._
      object App {
        def handle(record: String): Unit = {
        }
      }
  description: "Alpakka Kafka ConsumerRecord — attacker-controlled message payload."

  imports:
  - com
  - com.typesafe.akka.alpakkakafka
