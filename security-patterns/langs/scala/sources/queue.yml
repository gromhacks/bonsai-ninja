# Scala queue / broker event sources.
- id: scala.queue.alpakka_kafka_record
  enabled: true
  language: scala
  trust: service
  tag: event-input
  payload_types: [event]
  frameworks: [alpakka-kafka]
  packages: ["com.typesafe.akka:akka-stream-kafka", akka.kafka, org.apache.kafka]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      param_type_in: [ConsumerRecord, org.apache.kafka.clients.consumer.ConsumerRecord]
  match_examples:
  - name: alpakka kafka consumer record
    code: |
      import akka.kafka._
      import org.apache.kafka.clients.consumer.ConsumerRecord
      object App {
        def handle(record: ConsumerRecord[String, String]): Unit = ()
      }
    expect_match_text: [record]
  - name: same name wrong type negative
    code: |
      import akka.kafka._
      object App { def handle(record: String): Unit = () }
    expect_no_match: true
  imports: [akka.kafka, org.apache.kafka]
  description: "Alpakka Kafka ConsumerRecord parameter - broker message proven by its declared Kafka record type."
- id: scala.queue.akka_amqp_message
  enabled: true
  language: scala
  trust: service
  tag: event-input
  payload_types: [event]
  frameworks: [akka-amqp]
  packages: ["com.lightbend.akka:akka-stream-alpakka-amqp", akka.stream.alpakka.amqp]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      param_type_in: [ReadResult, CommittableReadResult]
  match_examples:
  - name: alpakka amqp read result
    code: |
      import akka.stream.alpakka.amqp._
      object App {
        def handle(delivery: ReadResult): Unit = ()
      }
    expect_match_text: [delivery]
  - name: same name wrong type negative
    code: |
      import akka.stream.alpakka.amqp._
      object App { def handle(delivery: String): Unit = () }
    expect_no_match: true
  imports: [akka.stream.alpakka.amqp]
  description: "Alpakka AMQP ReadResult parameter - RabbitMQ delivery proven by its declared stream result type."

- id: scala.queue.aws_sqs_message
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: scala.aws.lambda_event
  language: scala
  trust: service
  tag: event-input
  payload_types: [event]
  frameworks: [aws-sqs]
  match:
    kind: param
    target:
      name: sqsEvent
  description: "Subsumed by scala.aws.lambda_event, which matches the first RequestHandler input regardless of its concrete AWS event type or variable name."
