# Scala physical-device sources.
- id: scala.physical.pi4j_input_value
  enabled: true
  language: scala
  trust: physical
  tag: hw-input
  payload_types: [sensor-frame]
  packages: [com.pi4j]
  match:
    kind: call
    callee:
      regex: '(^|[.])(state|value|isHigh|isLow)$'
  constraints:
  - receiver_type_in: [DigitalInput, AnalogInput, com.pi4j.io.gpio.digital.DigitalInput, com.pi4j.io.gpio.analog.AnalogInput]
  - max_args: 0
  match_examples:
  - name: Pi4J digital input state from Scala
    code: |
      import com.pi4j.io.gpio.digital.DigitalInput
      object App { def sample(input: DigitalInput) = input.state() }
    expect_match_text: [input.state]
  - name: application model state is not hardware input
    code: |
      import com.pi4j.io.gpio.digital.DigitalInput
      class StateModel { def state(): String = "constant" }
      object App { def sample(input: StateModel) = input.state() }
    expect_no_match: true
  description: "Typed Pi4J digital/analog input reads used from Scala - samples received from attached hardware."
