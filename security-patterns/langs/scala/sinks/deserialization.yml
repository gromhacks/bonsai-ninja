  description: "Disabled — spray-json is generally safe (static typeclass format); enable only with polymorphic discriminator."

- id: scala.deser.poi_xssfworkbook_stream
  enabled: false
  disabled_reason:
    code: subsumed
  language: scala
  tag: insecure-deserialization
  severity: high
  packages: ["org.apache.poi"]
  cwe: [CWE-502, CWE-611]
  match:
    kind: new
    callee:
      name: XSSFWorkbook
  match_examples:
  - name: xssf workbook input stream
    code: |
      import org.apache.poi._
      object App {
        def handle(stream: Any): Any = {
          new XSSFWorkbook(stream)
        }
      }
      class XSSFWorkbook(args: Any*)
    expect_match_text: [XSSFWorkbook]
  description: "Disabled — Apache POI XSSFWorkbook is classified as XXE (CWE-611) in xxe.yml, not generic deserialization, to avoid duplicate/wrong-CWE findings."
  imports:
  - org
