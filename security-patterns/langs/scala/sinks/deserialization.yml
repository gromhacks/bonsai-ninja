# Scala deserialization sinks (JVM interop + Scala-native).
- id: scala.deser.object_input_stream
  enabled: true
  language: scala
  tag: insecure-deserialization
  severity: critical
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: readObject
      receiver_type_in: [ObjectInputStream]
  constraints:
  - receiver_tainted: true
  match_examples:
  - name: generated shape example
    code: |
      import java.io._
      object App {
        def handle(input: Array[Byte]): Any = {
          val stream = new ObjectInputStream(new ByteArrayInputStream(input))
          stream.readObject()
        }
      }
    expect_match_text: [stream.readObject]
  - name: local readObject receiver is not an object input stream
    code: |
      import java.io._
      class LocalReader { def readObject(): Any = null }
      object App { def handle(reader: LocalReader, input: String): Any = reader.readObject() }
    expect_no_match: true
  description: "ObjectInputStream.readObject on a receiver whose constructor state carries untrusted bytes."

- id: scala.deser.kryo_readobject
  enabled: true
  language: scala
  tag: insecure-deserialization
  severity: high
  packages: ["com.esotericsoftware"]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [Kryo, readClassAndObject]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.esotericsoftware._
      object App {
        def handle(input: String): Unit = {
          Kryo.readClassAndObject(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import com.esotericsoftware._
      object App {
        def handle(input: String): Unit = {
          Kryo.readClassAndObject("safe")
        }
      }
    expect_no_match: true
  description: "Kryo readClassAndObject - class registration bypass risk."

