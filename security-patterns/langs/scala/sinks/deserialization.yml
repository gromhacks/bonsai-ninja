# Scala deserialization sinks (JVM interop + Scala-native).
- id: scala.deser.object_input_stream
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: scala
  tag: insecure-deserialization
  severity: critical
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      regex: "^ObjectInputStream\\.readObject$"
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(input: String): Unit = {
          ObjectInputStream.readObject(input)
        }
      }
  description: "Disabled — ObjectInputStream.readObject() has no payload argument; needs receiver state showing the stream wraps untrusted bytes."

- id: scala.deser.kryo_readobject
  enabled: true
  language: scala
  tag: insecure-deserialization
  severity: high
  packages: ["com.esotericsoftware"]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [Kryo, readClassAndObject]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.esotericsoftware._
      object App {
        def handle(input: String): Unit = {
          Kryo.readClassAndObject(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import com.esotericsoftware._
      object App {
        def handle(input: String): Unit = {
          Kryo.readClassAndObject("safe")
        }
      }
    expect_no_match: true
  description: "Kryo readClassAndObject — class registration bypass risk."

