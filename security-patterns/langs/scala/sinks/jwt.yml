- id: scala.jwt.jwt_circe_decode
  enabled: true
  language: scala
  tag: jwt
  severity: high
  packages:
  - com.pauldijou.jwt
  cwe:
  - CWE-347
  match:
    kind: call
    callee:
      attribute:
      - JwtCirce
      - decode
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.pauldijou.jwt._
      // uses com.pauldijou.jwt
      object App {
        def handle(input: String): Unit = {
          JwtCirce.decode(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import com.pauldijou.jwt._
      // uses com.pauldijou.jwt
      object App {
        def handle(input: String): Unit = {
          JwtCirce.decode("safe")
        }
      }
    expect_no_match: true
  description: "jwt-circe decode - without signature verification, `decode` returns
    claims even if sig bad."
