# Scala code-evaluation sinks.
- id: scala.eval.scala_reflect_toolbox
  enabled: true
  language: scala
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [ToolBox, eval]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(input: String): Unit = {
          ToolBox.eval(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      object App {
        def handle(input: String): Unit = {
          ToolBox.eval("safe")
        }
      }
    expect_no_match: true
  description: "scala.tools.reflect.ToolBox.eval — runtime Scala compile + execute."

