  description: "TODO(only-when-packaged): java.lang.ProcessBuilder is auto-imported in Scala/JVM — ProcessBuilder.command(cmd) — tainted command tokens execute directly; no shell escaping performed."
- id: scala.cmdi.processbuilder_new
  enabled: true
  language: scala
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: new
    callee:
      name: ProcessBuilder
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(input: String): Unit = {
          new ProcessBuilder(input)
        }
      }
      class ProcessBuilder(args: Any*)
  - name: arg tainted literal negative
    code: |
      object App {
        def handle(input: String): Unit = {
          new ProcessBuilder("safe")
        }
      }
      class ProcessBuilder(args: Any*)
    expect_no_match: true
  description: "new java.lang.ProcessBuilder(cmd, ...) constructor — cmd is the tainted sink."
- id: scala.cmdi.os_proc_call
  enabled: true
  language: scala
  tag: command-injection
  severity: critical
  packages: ["com.lihaoyi.os-lib"]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [os, proc, call]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.lihaoyi.oslib._
      object App {
        def handle(input: String): Unit = {
          os.proc.call(input)
        }
      }
  - name: literal command negative
    code: |
      import com.lihaoyi.oslib._
      object App {
        def handle(input: String): Unit = {
          os.proc.call("/usr/bin/id")
        }
      }
    expect_no_match: true
  description: "os-lib os.proc(cmd).call() — executes cmd; tainted argv tokens run without shell escaping."
  imports:
  - com.lihaoyi.oslib
  - com
