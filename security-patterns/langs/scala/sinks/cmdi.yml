- id: scala.cmdi.bang
  enabled: true
  language: scala
  tag: command-injection
  severity: critical
  category: process-exec
  packages: ["scala.sys.process"]
  imports: ["scala.sys.process", "sys.process"]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "\\.!$"
  constraints:
  - receiver_tainted: true
  - receiver_not_matches_regex: '^(?:Seq|List|Vector|Array)\s*\('
  match_examples:
  - name: tainted receiver command
    code: |
      import scala.sys.process._
      object App {
        def handle(input: String): Unit = {
          val cmd = input
          cmd.!
        }
      }
  - name: literal command negative
    code: |
      import scala.sys.process._
      object App {
        def handle(input: String): Unit = {
          val cmd = "/usr/bin/id"
          cmd.!
        }
      }
    expect_no_match: true
  description: "Scala `s.!` runs s as a shell command via scala.sys.process ProcessBuilder implicits."
- id: scala.cmdi.bang_bang
  enabled: true
  language: scala
  tag: command-injection
  severity: critical
  packages: ["scala.sys.process"]
  imports: ["scala.sys.process", "sys.process"]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "\\.!!$"
  constraints:
  - receiver_tainted: true
  - receiver_not_matches_regex: '^(?:Seq|List|Vector|Array)\s*\('
  match_examples:
  - name: tainted receiver command
    code: |
      import scala.sys.process._
      object App {
        def handle(input: String): Unit = {
          val cmd = input
          cmd.!!
        }
      }
  - name: literal command negative
    code: |
      import scala.sys.process._
      object App {
        def handle(input: String): Unit = {
          val cmd = "/usr/bin/id"
          cmd.!!
        }
      }
    expect_no_match: true
  - name: direct argv sequence keeps tainted data out of shell syntax
    code: |
      import scala.sys.process._
      object App {
        def handle(input: String): Unit = {
          Seq("/bin/ping", "-c", "1", input).!!
        }
      }
    expect_no_match: true
  description: "Scala string `s.!!` captures stdout through scala.sys.process shell parsing; direct sequence argv execution remains outside this shell-specific boundary."
- id: scala.cmdi.argv_shell_wrapper_bang
  enabled: true
  language: scala
  tag: command-injection
  severity: critical
  category: process-exec
  packages: ["scala.sys.process"]
  imports: ["scala.sys.process", "sys.process"]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "\\.!$"
  constraints:
  - receiver_tainted: true
  - receiver_matches_regex: '^(?:Seq|List|Vector|Array)\s*\(\s*["''](?:/bin/)?(?:sh|bash|zsh)["'']\s*,\s*["'']-c["'']\s*,'
  match_examples:
  - name: tainted shell command inside argv wrapper
    code: |
      import scala.sys.process._
      object App {
        def handle(input: String): Unit = {
          Seq("sh", "-c", input).!
        }
      }
  - name: direct argv sequence remains data
    code: |
      import scala.sys.process._
      object App {
        def handle(input: String): Unit = {
          Seq("/bin/ping", "-c", "1", input).!
        }
      }
    expect_no_match: true
  description: "Scala argv execution through sh/bash/zsh with `-c` interprets the following tainted value as shell syntax; ordinary direct argv execution remains data-only."
