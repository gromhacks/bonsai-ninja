- id: scala.header.play_with_headers
  enabled: true
  language: scala
  tag: header-injection
  severity: high
  packages:
  - play
  cwe:
  - CWE-113
  match:
    kind: call
    callee:
      regex: ^Result\.withHeaders$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import play._
      object App {
        def handle(input: String): Unit = {
          Result.withHeaders(input)
        }
      }
  - name: literal header negative
    code: |
      import play._
      object App {
        def handle(input: String): Unit = {
          Result.withHeaders("X-Name" -> "safe")
        }
      }
    expect_no_match: true
  description: "Play Result.withHeaders(name -> tainted) — CRLF-injectable header value."
