- id: scala.header.akka_http_raw_header
  enabled: true
  language: scala
  tag: header-injection
  severity: high
  packages:
  - akka.http.scaladsl
  cwe:
  - CWE-113
  match:
    kind: new
    callee:
      name: RawHeader
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated shape example
    code: |
      import akka.http.scaladsl._
      object App {
        def handle(input: String): Unit = {
          new RawHeader("X-Name", input)
        }
      }
      class RawHeader(args: Any*)
  - name: arg tainted literal negative
    code: |
      import akka.http.scaladsl._
      object App {
        def handle(input: String): Unit = {
          new RawHeader(input, "safe")
        }
      }
      class RawHeader(args: Any*)
    expect_no_match: true
  description: "akka-http new RawHeader(name, tainted) — unvalidated header; pair with respondWithHeaders."
  imports:
  - akka.http.scaladsl
- id: scala.header.spring_responseentity_header
  enabled: true
  language: scala
  tag: header-injection
  severity: high
  packages:
  - org.springframework.web
  cwe:
  - CWE-113
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - ResponseEntity
      - header
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: responseentity header
    code: |
      import org.springframework.web._
      // uses org.springframework.web
      object App {
        def handle(value: String): Any = {
          ResponseEntity.header("X-Name", value)
        }
      }
    expect_match_text:
    - ResponseEntity.header
  - name: arg tainted literal negative
    code: |
      import org.springframework.web._
      // uses org.springframework.web
      object App {
        def handle(value: String): Any = {
          ResponseEntity.header(value, "safe")
        }
      }
    expect_no_match: true
  description: "ResponseEntity.header(name, tainted) — CRLF response header injection. Merged aliases: scala.header.spring_responseentity_content_disposition, scala.open_redirect.spring_responseentity_header_location."
  aliases:
  - scala.header.spring_responseentity_content_disposition
  - scala.open_redirect.spring_responseentity_header_location
  imports:
  - org.springframework.web
