- id: scala.crypto.message_digest_md5
  enabled: true
  language: scala
  tag: weak-crypto
  category: source-independent
  severity: low
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      attribute:
      - MessageDigest
      - getInstance
  constraints:
  - arg_matches_regex:
      index: 0
      regex: (?i)\b(MD5|SHA-?1)\b
  match_examples:
  - name: generated shape example
    code: "object App {\n  def handle(input: String): Unit = {\n    MessageDigest.getInstance(\"MD5\")\n  }\n}\n"
  - name: safe digest negative
    code: |
      object App {
        def handle(): Unit = {
          MessageDigest.getInstance("SHA-256")
        }
      }
    expect_no_match: true
  description: "MessageDigest.getInstance(\"MD5\") — broken hash. Merged aliases: scala.crypto.message_digest_sha1."
  aliases:
  - scala.crypto.message_digest_sha1
- id: scala.crypto.cipher_des
  enabled: true
  language: scala
  tag: weak-crypto
  category: source-independent
  severity: medium
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      attribute:
      - Cipher
      - getInstance
  constraints:
  - arg_matches_regex:
      index: 0
      regex: (?i)(\b(DES|DESede|3DES|RC4|ARCFOUR|Blowfish)\b|/ECB/)
  match_examples:
  - name: generated shape example
    code: "object App {\n  def handle(input: String): Unit = {\n    Cipher.getInstance(\"DES\")\n  }\n}\n"
  - name: safe aead cipher negative
    code: |
      object App {
        def handle(): Unit = {
          Cipher.getInstance("AES/GCM/NoPadding")
        }
      }
    expect_no_match: true
  description: "Cipher.getInstance(\"DES\") — broken symmetric cipher. Merged aliases: scala.crypto.cipher_3des, scala.crypto.cipher_rc4, scala.crypto.cipher_ecb, scala.crypto.cipher_blowfish."
  aliases:
  - scala.crypto.cipher_3des
  - scala.crypto.cipher_rc4
  - scala.crypto.cipher_ecb
  - scala.crypto.cipher_blowfish
