- id: scala.open_redirect.akka_http_redirect
  enabled: true
  language: scala
  tag: open-redirect
  severity: high
  packages:
  - akka.http.scaladsl
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - Directives
      - redirect
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import akka.http.scaladsl._
      // uses akka.http.scaladsl
      object App {
        def handle(input: String): Unit = {
          Directives.redirect(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import akka.http.scaladsl._
      // uses akka.http.scaladsl
      object App {
        def handle(input: String): Unit = {
          Directives.redirect("/home")
        }
      }
    expect_no_match: true
  description: Akka HTTP redirect(tainted Uri).
  imports:
  - akka.http.scaladsl
