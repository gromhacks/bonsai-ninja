- id: scala.open_redirect.play_redirect
  enabled: true
  language: scala
  tag: open-redirect
  severity: high
  packages:
  - play
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      name: Redirect
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import play._
      object App {
        def handle(input: String): Unit = {
          Redirect(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import play._
      object App {
        def handle(input: String): Unit = {
          Redirect("/home")
        }
      }
    expect_no_match: true
  description: Play Redirect(tainted url).
