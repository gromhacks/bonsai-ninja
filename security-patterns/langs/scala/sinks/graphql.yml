- id: scala.graphql.graphql_execute_async
  enabled: true
  language: scala
  tag: graphql-injection
  severity: high
  packages: ["graphql"]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      attribute: [GraphQL, executeAsync]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: graphql execute async tainted
    code: |
      import graphql._
      object App {
        def handle(input: String): Unit = {
          GraphQL.executeAsync(input)
        }
      }
    expect_match_text: [GraphQL.executeAsync]
  - name: graphql execute async literal negative
    code: |
      import graphql._
      object App {
        def handle(): Unit = {
          GraphQL.executeAsync("{ viewer { id } }")
        }
      }
    expect_no_match: true
  description: "graphql-java GraphQL.executeAsync with a tainted document can drive unexpected resolver execution."

- id: scala.graphql.executioninput_query
  enabled: true
  language: scala
  tag: graphql-injection
  severity: high
  packages: ["graphql"]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      attribute: [ExecutionInput, query]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: execution input query tainted
    code: |
      import graphql._
      object App {
        def handle(input: String): Unit = {
          ExecutionInput.query(input)
        }
      }
    expect_match_text: [ExecutionInput.query]
  - name: execution input query literal negative
    code: |
      import graphql._
      object App {
        def handle(): Unit = {
          ExecutionInput.query("{ viewer { id } }")
        }
      }
    expect_no_match: true
  description: "ExecutionInput.query(tainted) constructs a dynamic GraphQL document for later execution."
