# Scala race / TOCTOU / transaction-after-error audit-pair sites.

- id: scala.race.connection_commit
  enabled: true
  language: scala
  tag: race
  category: source-independent
  severity: medium
  packages: [java.sql]
  cwe: [CWE-662, CWE-367]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.commit$
  match_examples:
    - name: connection commit audit
      code: |
        import java.sql.Connection
        object App {
          def handle(conn: Connection): Unit = {
            conn.commit()
          }
        }
      expect_match_text: [conn.commit]
  description: "Audit-pair site — engine surfaces the lifecycle event; correlate with subsequent uses of the same value once the must-alias + lifecycle-state primitives ship (see docs/contributing/analysis-roadmap.mdx). Connection.commit() — transaction-after-error race-pair; later writes on the same connection without a fresh begin run outside the intended transaction window."
- id: scala.race.connection_rollback
  enabled: true
  language: scala
  tag: race
  category: source-independent
  severity: medium
  packages: [java.sql]
  cwe: [CWE-662, CWE-367]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.rollback$
  match_examples:
    - name: connection rollback audit
      code: |
        import java.sql.Connection
        object App {
          def handle(conn: Connection): Unit = {
            conn.rollback()
          }
        }
      expect_match_text: [conn.rollback]
  description: "Audit-pair site — engine surfaces the lifecycle event; correlate with subsequent uses of the same value once the must-alias + lifecycle-state primitives ship (see docs/contributing/analysis-roadmap.mdx). Connection.rollback() — transaction-after-error race-pair; later statement.execute on the same connection persists writes the rollback was supposed to undo."
