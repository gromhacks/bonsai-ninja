- id: scala.ssrf.apache_httpget_ctor
  enabled: true
  language: scala
  tag: ssrf
  severity: high
  packages:
  - org.apache.httpcomponents
  cwe:
  - CWE-918
  match:
    kind: new
    callee:
      name: HttpGet
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: apache httpget url
    code: "import org.apache.httpcomponents._\nobject App {\n  def handle(url: String):\
      \ Any = {\n    new HttpGet(url)\n  }\n}\nclass HttpGet(args: Any*)\n"
    expect_match_text:
    - HttpGet
  - name: arg tainted literal negative
    code: "import org.apache.httpcomponents._\nobject App {\n  def handle(url: String):\
      \ Any = {\n    new HttpGet(\"https://example.test/\")\n  }\n}\nclass HttpGet(args:\
      \ Any*)\n"
    expect_no_match: true
  description: "Apache HttpClient HttpGet(url) - request target controlled by\
    \ attacker input."
