- id: scala.ssrf.play_ws_url
  enabled: true
  language: scala
  tag: ssrf
  severity: high
  frameworks:
  - play
  packages:
  - play.api.libs.ws
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      name: url
      receiver_type_in: [WSClient]
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    url_network_guard:
      root:
        kind: sink-argument-parser-input
        sink_argument_index: 0
        parser_argument_index: 0
      parser: {name: URI}
      scheme:
        component:
          field: getScheme
        comparison_predicate: {name: "=="}
        allowed_values: [https]
      host_allowlist:
        component:
          field: getHost
        membership_predicate: {name: contains}
        static_collection_factories:
        - {name: Set}
      redirect:
        kind: post-sink-call
        call: {name: withFollowRedirects}
        argument_index: 0
        required_value:
          kind: boolean
          value: false
  match_examples:
  - name: generated shape example
    code: |
      import play.api.libs.ws._
      object App {
        def handle(ws: WSClient, input: String): Unit = {
          ws.url(input)
        }
      }
    expect_match_text: [ws.url]
  - name: arg tainted literal negative
    code: |
      import play.api.libs.ws._
      object App {
        def handle(ws: WSClient): Unit = {
          ws.url("https://example.test/")
        }
      }
    expect_no_match: true
  - name: local url receiver is not Play WS
    code: |
      import play.api.libs.ws._
      class LocalClient { def url(value: String): Unit = () }
      object App {
        def handle(client: LocalClient, input: String): Unit = {
          client.url(input)
        }
      }
    expect_no_match: true
  - name: finite host allowlist and disabled redirects remain a match for guard attribution
    code: |
      import java.net.URI
      import play.api.libs.ws._
      import scala.util.Try
      object App {
        private val hosts = Set("api.example.test")
        def handle(ws: WSClient, input: String): Unit = {
          val parsed = Try(new URI(input)).toOption
          parsed match {
            case Some(uri) if uri.getScheme == "https" && hosts.contains(uri.getHost) =>
              ws.url(input).withFollowRedirects(false).get()
            case _ => ()
          }
        }
      }
    expect_match_text: [ws.url]
  description: "Compiler-typed Play WSClient.url(tainted) builds a WSRequest; downstream .get/.post fire."
  imports:
  - play.api.libs.ws
