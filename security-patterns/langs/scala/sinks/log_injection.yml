- id: scala.log_injection.slf4j_info_format
  enabled: true
  language: scala
  tag: header-injection
  severity: medium
  packages:
  - slf4j
  cwe:
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - Logger
      - info
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import slf4j._
      object App {
        def handle(input: String): Unit = {
          Logger.info("\\n" + input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import slf4j._
      object App {
        def handle(input: String): Unit = {
          Logger.info("safe")
        }
      }
    expect_no_match: true
  description: "Scala SLF4J Logger.info with embedded newline in user text — log forging. Merged aliases: scala.log_injection.logger_info_concat."
  aliases:
  - scala.log_injection.logger_info_concat
