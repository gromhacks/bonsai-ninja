- id: scala.nosql.reactivemongo_find
  enabled: true
  language: scala
  tag: nosql-injection
  severity: high
  packages:
  - reactivemongo
  - org.mongodb.scala
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      attribute:
      - BSONCollection
      - find
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import reactivemongo._
      object App {
        def handle(input: String): Unit = {
          BSONCollection.find(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import reactivemongo._
      object App {
        def handle(input: String): Unit = {
          BSONCollection.find("safe")
        }
      }
    expect_no_match: true
  description: "ReactiveMongo BSONCollection.find - tainted BSON filter object. Merged collision aliases: scala.nosql.mongo_collection_find, scala.nosql.mongo_collection_find_local_document."
  aliases:
  - scala.nosql.mongo_collection_find
  - scala.nosql.mongo_collection_find_local_document
