- id: scala.nosql.bson_document_from_map
  enabled: true
  language: scala
  tag: nosql-injection
  severity: high
  packages:
  - org.mongodb.scala
  cwe:
  - CWE-943
  match:
    kind: new
    callee:
      name: Document
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: bson document from caller map
    code: |
      import org.mongodb.scala._
      object App {
        def handle(callerMap: Map[String, Any]): Any = {
          new Document(callerMap)
        }
      }
      class Document(args: Any*)
    expect_match_text:
    - Document
  - name: arg tainted literal negative
    code: |
      import org.mongodb.scala._
      object App {
        def handle(callerMap: Map[String, Any]): Any = {
          new Document(Map("name" -> "safe"))
        }
      }
      class Document(args: Any*)
    expect_no_match: true
  description: "new Document(callerMap) - MongoDB selector built from a caller-controlled map can carry operators such as $ne or $where."
  imports:
  - org.mongodb.scala
- id: scala.nosql.basicdbobject_operator_ctor
  enabled: true
  language: scala
  tag: nosql-injection
  severity: high
  packages:
  - org.mongodb.scala
  - casbah
  cwe:
  - CWE-943
  match:
    kind: new
    callee:
      name: BasicDBObject
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: basic db object operator constructor
    code: |
      import casbah._
      object App {
        def handle(operator: String): Any = {
          new BasicDBObject(operator, "value")
        }
      }
      class BasicDBObject(args: Any*)
    expect_match_text:
    - BasicDBObject
  - name: literal basicdbobject operator negative
    code: |
      import casbah._
      object App {
        def handle(): Any = {
          new BasicDBObject("$ne", "value")
        }
      }
      class BasicDBObject(args: Any*)
    expect_no_match: true
  description: "new BasicDBObject(\"$ne\", value) and related operator keys - caller-controlled operator objects can bypass intended equality checks."
- id: scala.nosql.spring_mongo_template_criteria_is
  enabled: true
  language: scala
  tag: nosql-injection
  severity: high
  packages:
  - org.springframework.data.mongodb
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      attribute:
      - Criteria
      - is
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: spring criteria operator object
    code: |
      import org.springframework.data.mongodb._
      object App {
        def handle(operatorObject: Any): Any = {
          Criteria.is(operatorObject)
        }
      }
    expect_match_text:
    - Criteria.is
  - name: arg tainted literal negative
    code: |
      import org.springframework.data.mongodb._
      object App {
        def handle(operatorObject: Any): Any = {
          Criteria.is("safe")
        }
      }
    expect_no_match: true
  description: "Spring Data Mongo Criteria.is(operator object) - caller-controlled criteria value can inject Mongo operators when maps/documents are passed through."
  imports:
  - org.springframework.data.mongodb
