- id: scala.xxe.jaxb_unmarshaller_unmarshal
  enabled: true
  language: scala
  tag: xxe
  severity: high
  packages: ["javax.xml.bind", "jakarta.xml.bind"]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [Unmarshaller, unmarshal]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: jaxb unmarshaller unmarshal
    code: |
      import javax.xml.bind._
      // uses javax.xml.bind
      object App {
        def handle(input: Any): Unit = {
          Unmarshaller.unmarshal(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import javax.xml.bind._
      // uses javax.xml.bind
      object App {
        def handle(input: Any): Unit = {
          Unmarshaller.unmarshal("safe.xml")
        }
      }
    expect_no_match: true
  description: "JAXB Unmarshaller.unmarshal - wraps SAX parser; same XXE rules apply."
