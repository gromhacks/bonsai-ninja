- id: scala.xxe.document_builder_parse
  enabled: true
  language: scala
  tag: xxe
  severity: high
  packages: [javax.xml.parsers]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      name: parse
      receiver_type_in: [DocumentBuilder]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import javax.xml.parsers._
      object App {
        def handle(input: String): Unit = {
          val factory = DocumentBuilderFactory.newInstance()
          val builder = factory.newDocumentBuilder()
          builder.parse(input)
        }
      }
    expect_match_text: [builder.parse]
  - name: arg tainted literal negative
    code: |
      import javax.xml.parsers._
      object App {
        def handle(): Unit = {
          val factory = DocumentBuilderFactory.newInstance()
          val builder = factory.newDocumentBuilder()
          builder.parse("safe.xml")
        }
      }
    expect_no_match: true
  - name: local parser is not a document builder
    code: |
      import javax.xml.parsers._
      class LocalParser { def parse(value: String): Unit = () }
      object App {
        def handle(parser: LocalParser, input: String): Unit = parser.parse(input)
      }
    expect_no_match: true
  description: "Compiler-typed javax.xml.parsers.DocumentBuilder.parse - unsafe unless FEATURE_SECURE_PROCESSING is set."

