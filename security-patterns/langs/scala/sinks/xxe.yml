- id: scala.xxe.jaxb_unmarshaller_unmarshal
  enabled: true
  language: scala
  tag: xxe
  severity: high
  packages: ["javax.xml.bind", "jakarta.xml.bind"]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [Unmarshaller, unmarshal]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: jaxb unmarshaller unmarshal
    code: |
      import javax.xml.bind._
      // uses javax.xml.bind
      object App {
        def handle(input: Any): Unit = {
          Unmarshaller.unmarshal(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import javax.xml.bind._
      // uses javax.xml.bind
      object App {
        def handle(input: Any): Unit = {
          Unmarshaller.unmarshal("safe.xml")
        }
      }
    expect_no_match: true
  description: "JAXB Unmarshaller.unmarshal - wraps SAX parser; same XXE rules apply."

- id: scala.xxe.apache_poi_xssfworkbook_inputstream
  enabled: false
  disabled_reason:
    code: over-broad
  language: scala
  tag: xxe
  severity: high
  packages: ["org.apache.poi"]
  cwe: [CWE-611]
  match:
    kind: new
    callee:
      name: XSSFWorkbook
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: apache poi xssf workbook input stream
    code: |
      import org.apache.poi._
      object App {
        def handle(stream: InputStream): Any = {
          new XSSFWorkbook(stream)
        }
      }
      class InputStream
      class XSSFWorkbook(args: Any*)
    expect_match_text: [XSSFWorkbook]
  - name: arg tainted literal negative
    code: |
      import org.apache.poi._
      object App {
        def handle(stream: InputStream): Any = {
          new XSSFWorkbook("safe.xlsx")
        }
      }
      class InputStream
      class XSSFWorkbook(args: Any*)
    expect_no_match: true
  description: "Disabled - XSSFWorkbook(InputStream) is not itself an external-entity boundary. Apache POI's historical XXE affected XSSFExportToXml before 4.1.1; archive resource exhaustion requires a separate, version/config-aware rule."
