# Scala XXE sinks (scala.xml + JVM javax.xml parsers).
- id: scala.xxe.xml_load
  enabled: true
  language: scala
  tag: xxe
  severity: high
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [XML, load]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(input: String): Unit = {
          XML.load(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      object App {
        def handle(input: String): Unit = {
          XML.load("safe.xml")
        }
      }
    expect_no_match: true
  description: "scala.xml.XML.load - uses JDK parser with default (unsafe) settings."

