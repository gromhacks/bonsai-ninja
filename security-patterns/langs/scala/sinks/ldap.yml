- id: scala.ldap.unboundid_search
  enabled: true
  language: scala
  tag: ldap-injection
  severity: high
  packages:
  - com.unboundid.ldap.sdk
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - LDAPConnection
      - search
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: generated shape example
    code: |
      import com.unboundid.ldap.sdk._
      object App {
        def handle(input: String): Unit = {
          LDAPConnection.search("ou=users", SearchScope.SUB, "(uid=" + input + ")")
        }
      }
  - name: literal unboundid search negative
    code: |
      import com.unboundid.ldap.sdk._
      object App {
        def handle(): Unit = {
          LDAPConnection.search("ou=users", SearchScope.SUB, "(uid=alice)")
        }
      }
    expect_no_match: true
  description: "unboundid-ldapsdk LDAPConnection.search - tainted filter enables\
    \ LDAP injection unless built via Filter.create*()."
  imports:
  - com.unboundid.ldap.sdk
- id: scala.ldap.unboundid_modify
  enabled: true
  language: scala
  tag: ldap-injection
  severity: high
  packages:
  - com.unboundid.ldap.sdk
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - LDAPConnection
      - modify
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "import com.unboundid.ldap.sdk._\n// uses com.unboundid.ldap.sdk\nobject App {\n  def\
      \ handle(input: String): Unit = {\n    LDAPConnection.modify(\"(uid=\" + input)\n\
      \  }\n}\n"
  - name: arg tainted literal negative
    code: "import com.unboundid.ldap.sdk._\n// uses com.unboundid.ldap.sdk\nobject App {\n  def\
      \ handle(input: String): Unit = {\n    LDAPConnection.modify(\"uid=alice,dc=example,dc=com\"\
      )\n  }\n}\n"
    expect_no_match: true
  description: "unboundid-ldapsdk LDAPConnection.modify - tainted DN/attribute\
    \ enables LDAP-injection / unauthorized mutation."
  imports:
  - com.unboundid.ldap.sdk
