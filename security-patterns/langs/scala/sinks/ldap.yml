- id: scala.ldap.initial_dir_context_search
  enabled: false
  language: scala
  tag: ldap-injection
  severity: high
  packages:
  - javax.naming.directory
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - InitialDirContext
      - search
  match_examples:
  - name: generated shape example
    code: "import javax.naming.directory._\n// uses javax.naming.directory\nobject\
      \ App {\n  def handle(input: String): Unit = {\n    InitialDirContext.search(\"\
      (uid=\" + input)\n  }\n}\n"
  description: "JNDI InitialDirContext.search \u2014 tainted filter string splices\
    \ into LDAP query, enabling LDAP injection (CWE-90)."
  disabled_reason:
    code: over-broad
- id: scala.ldap.initial_dir_context_lookup
  enabled: true
  language: scala
  tag: ldap-injection
  severity: critical
  packages:
  - javax.naming.directory
  cwe:
  - CWE-90
  - CWE-94
  match:
    kind: call
    callee:
      attribute:
      - InitialDirContext
      - lookup
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "import javax.naming.directory._\n// uses javax.naming.directory\nobject\
      \ App {\n  def handle(input: String): Unit = {\n    InitialDirContext.lookup(\"\
      (uid=\" + input)\n  }\n}\n"
  - name: arg tainted literal negative
    code: "import javax.naming.directory._\n// uses javax.naming.directory\nobject\
      \ App {\n  def handle(input: String): Unit = {\n    InitialDirContext.lookup(\"\
      safe\")\n  }\n}\n"
    expect_no_match: true
  description: "InitialDirContext.lookup \u2014 JNDI lookup vector."
