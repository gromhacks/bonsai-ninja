  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      regex: "^Storage\\.readAllBytes$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.google.cloud.googlecloudstorage._
      object App {
        def handle(input: String): Unit = {
          Storage.readAllBytes(input)
        }
      }
  - name: literal gcs object read negative
    code: |
      import com.google.cloud.googlecloudstorage._
      object App {
        def handle(): Unit = {
          Storage.readAllBytes("reports/safe.json")
        }
      }
    expect_no_match: true
  description: "Storage.readAllBytes(bucket, blob) — tainted selector reads arbitrary GCS objects."

  imports:
  - com.google.cloud.googlecloudstorage
  - com
