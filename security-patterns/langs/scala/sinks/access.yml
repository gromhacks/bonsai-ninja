- id: scala.access.initialcontext_lookup
  enabled: true
  language: scala
  tag: jndi-injection
  severity: critical
  packages: ["javax.naming", "jakarta.naming"]
  cwe: [CWE-917, CWE-502]
  match:
    kind: call
    callee:
      attribute: [InitialContext, lookup]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: initial context lookup
    code: |
      import javax.naming._
      // uses javax.naming
      object App {
        def handle(name: String): Unit = {
          InitialContext.lookup(name)
        }
      }
  - name: arg tainted literal negative
    code: |
      import javax.naming._
      // uses javax.naming
      object App {
        def handle(name: String): Unit = {
          InitialContext.lookup("safe")
        }
      }
    expect_no_match: true
  description: "javax.naming.InitialContext.lookup(tainted) — remote JNDI lookup can trigger class loading or deserialization."
