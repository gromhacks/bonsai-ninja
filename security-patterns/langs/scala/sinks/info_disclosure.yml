# Scala information-disclosure sinks (stdout, logging, HTTP error bodies).
- id: scala.info_disclosure.println_secret
  enabled: true
  language: scala
  tag: information-disclosure
  severity: medium
  cwe: [CWE-200]
  match:
    kind: call
    callee:
      attribute: [Console, out, println]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(input: String): Unit = {
          Console.out.println("password=" + input)
        }
      }
    expect_match_text: [Console.out.println]
  - name: literal println negative
    code: |
      object App {
        def handle(input: String): Unit = {
          Console.out.println("startup ok")
        }
      }
    expect_no_match: true
  description: "TODO(only-when-packaged): scala.Console / java.lang.System is auto-imported in Scala — Console.out.println of secret-shaped values can disclose credentials through stdout logs."

