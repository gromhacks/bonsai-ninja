- id: scala.info_disclosure.play_internalservererror_exception
  enabled: true
  language: scala
  tag: information-disclosure
  severity: high
  frameworks: [play]
  cwe: [CWE-209]
  match:
    kind: call
    callee:
      attribute: [Results, InternalServerError]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      object App {
        def handle(input: String): Unit = {
          Results.InternalServerError("Exception stack trace: " + input)
        }
      }
    expect_match_text: [Results.InternalServerError]
  - name: literal internal server error negative
    code: |
      object App {
        def handle(input: String): Unit = {
          Results.InternalServerError("Internal Server Error")
        }
      }
    expect_no_match: true
  description: "Play Results.InternalServerError with exception or stack details exposes internals to clients."
