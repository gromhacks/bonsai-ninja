# Scala file-upload sinks (Play + Akka HTTP + http4s).
- id: scala.upload.play_filepart_filename
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: scala
  tag: file-upload
  severity: medium
  packages: [play]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [FilePart, filename]
  match_examples:
  - name: generated shape example
    code: |
      import play._
      // uses play
      object App {
        def handle(input: String): Unit = {
          FilePart.filename(input)
        }
      }
  description: "Disabled - FilePart.filename returns client-controlled state; report the later file-write/move sink until return-state tracking exists."

- id: scala.upload.play_ref_movetofile
  enabled: true
  language: scala
  tag: file-upload
  severity: high
  packages: [play]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [TemporaryFile, moveTo]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import play._
      object App {
        def handle(input: String): Unit = {
          TemporaryFile.moveTo(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import play._
      object App {
        def handle(input: String): Unit = {
          TemporaryFile.moveTo("safe.txt")
        }
      }
    expect_no_match: true
  description: "Play TemporaryFile.moveTo(dest) - tainted dest => arbitrary file write."

- id: scala.upload.play_ref_atomicmoveto
  enabled: true
  language: scala
  tag: file-upload
  severity: high
  packages: [play]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [TemporaryFile, atomicMoveWithFallback]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import play._
      object App {
        def handle(input: String): Unit = {
          TemporaryFile.atomicMoveWithFallback(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import play._
      object App {
        def handle(input: String): Unit = {
          TemporaryFile.atomicMoveWithFallback("safe.txt")
        }
      }
    expect_no_match: true
  description: "Play TemporaryFile.atomicMoveWithFallback - same risk as moveTo."

