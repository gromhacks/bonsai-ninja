- id: scala.xss.akka_http_complete_html
  enabled: true
  language: scala
  tag: xss
  severity: high
  frameworks:
  - akka-http
  packages:
  - com.typesafe.akka
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - HttpEntity
      - apply
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated shape example
    code: |
      import com.typesafe.akka._
      // uses com.typesafe.akka
      object App {
        def handle(input: String): Unit = {
          HttpEntity.apply("text/html", input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import com.typesafe.akka._
      // uses com.typesafe.akka
      object App {
        def handle(input: String): Unit = {
          HttpEntity.apply(input, "safe")
        }
      }
    expect_no_match: true
  description: "akka-http HttpEntity(ContentTypes.text/html, tainted) - interpolated HTML response body; risk only if marshalled with text/html and tainted."
- id: scala.xss.spring_responseentity_ok_html_concat
  enabled: true
  language: scala
  tag: xss
  severity: high
  packages:
  - org.springframework.web
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - ResponseEntity
      - ok
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: responseentity ok raw html
    code: |
      import org.springframework.web._
      object App {
        def handle(name: String): Any = {
          ResponseEntity.ok(s"<p>$name</p>")
        }
      }
    expect_match_text:
    - ResponseEntity.ok
  - name: arg tainted literal negative
    code: |
      import org.springframework.web._
      object App {
        def handle(name: String): Any = {
          ResponseEntity.ok("<p>safe</p>")
        }
      }
    expect_no_match: true
  description: "ResponseEntity.ok(raw HTML concat) - reflected HTML response built from attacker-controlled text."
  imports:
  - org.springframework.web
