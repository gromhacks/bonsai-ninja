      index: 0
  match_examples:
  - name: responseentity ok raw html
    code: |
      import org.springframework.web._
      object App {
        def handle(name: String): Any = {
          ResponseEntity.ok(s"<p>$name</p>")
        }
      }
    expect_match_text:
    - ResponseEntity.ok
  - name: arg tainted literal negative
    code: |
      import org.springframework.web._
      object App {
        def handle(name: String): Any = {
          ResponseEntity.ok("<p>safe</p>")
        }
      }
    expect_no_match: true
  description: "ResponseEntity.ok(raw HTML concat) - reflected HTML response built from attacker-controlled text."
  imports:
  - org.springframework.web
