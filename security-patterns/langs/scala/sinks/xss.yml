- id: scala.xss.twirl_html_constructor
  enabled: true
  language: scala
  tag: xss
  severity: high
  packages: [play.twirl.api]
  imports: [play.twirl.api.Html]
  frameworks:
  - play
  cwe:
  - CWE-79
  match:
    kind: new
    callee:
      name: Html
      binding_origin: imported
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)(?:<\s*!?\s*[a-z]|&(?:lt|gt|quot|#(?:x0*3[cCeE]|0*6[02]));)'
  - arg_tainted:
      index: 0
  match_examples:
  - name: imported Twirl constructor receives tainted markup
    code: |
      import play.twirl.api.Html
      object Page {
        def render(input: String): Html = new Html("<p>" + input + "</p>")
      }
    expect_match_text: [Html]
  - name: literal Twirl markup negative
    code: |
      import play.twirl.api.Html
      object Page {
        def render(): Html = new Html("<p>safe</p>")
      }
    expect_no_match: true
  - name: local Html constructor does not acquire Twirl identity
    code: |
      import play.twirl.api.{Html => TwirlHtml}
      class Html(value: String)
      object Page {
        def render(input: String): Html = new Html("<p>" + input + "</p>")
      }
    expect_no_match: true
  description: "Imported Twirl Html construction with tainted markup bypasses template escaping; constructor identity and markup shape are compiler/rule proven."
- id: scala.xss.twirl_html_apply
  enabled: true
  language: scala
  tag: xss
  severity: high
  packages: [play.twirl.api]
  frameworks:
  - play
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - Html
      - apply
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import play.twirl.api._
      // uses play.twirl.api
      object App {
        def handle(input: String): Unit = {
          Html.apply(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import play.twirl.api._
      // uses play.twirl.api
      object App {
        def handle(input: String): Unit = {
          Html.apply("safe")
        }
      }
    expect_no_match: true
  description: "Twirl Html.apply(tainted) - companion-object form of Html(...)."

- id: scala.xss.twirl_html_companion
  enabled: true
  language: scala
  tag: xss
  severity: high
  packages: [play.twirl.api]
  frameworks: [play]
  imports: [play.twirl.api.Html]
  cwe: [CWE-79]
  match:
    kind: call
    callee:
      name: Html
      binding_origin: imported
      call_kind_in: [function]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)(?:<\s*!?\s*[a-z]|&(?:lt|gt|quot|#(?:x0*3[cCeE]|0*6[02]));)'
  - arg_tainted:
      index: 0
  match_examples:
  - name: imported Twirl Html companion receives tainted markup
    code: |
      import play.twirl.api.Html
      object Page {
        def render(value: String) = Html(s"<html><body>$value</body></html>")
      }
    expect_match_text: [Html]
  - name: local Html object is not the Twirl companion
    code: |
      import play.twirl.api.Html
      object Html { def apply(value: String): String = value }
      object Page {
        def render(value: String) = Html(s"<html><body>$value</body></html>")
      }
    expect_no_match: true
  description: "Imported Twirl Html companion called with tainted HTML markup bypasses template escaping."
