- id: scala.xss.html_string_concat
  enabled: false
  disabled_reason:
    code: over-broad
  language: scala
  tag: xss
  severity: medium
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      name: +
  match_examples:
  - name: generated shape example
    code: "object App {\n  def handle(input: String): Unit = {\n    +(\"<b>\" + input)\n  }\n}\n"
  description: Disabled broad concat shape. Raw HTML response APIs should be modeled as sinks; `+` alone is not an API sink in the taint-first rulepack.
