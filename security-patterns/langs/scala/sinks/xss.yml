      index: 0
      regex: '<'
  match_examples:
  - name: play ok raw html
    code: |
      import play._
      object App {
        def handle(name: String): Unit = {
          Ok(s"<p>$name</p>")
        }
      }
  - name: arg tainted literal negative
    code: |
      import play._
      object App {
        def handle(name: String): Unit = {
          Ok("<p>safe</p>")
        }
      }
    expect_no_match: true
  - name: tainted non-HTML response is not an XSS sink
    code: |
      import play._
      object App {
        def handle(host: String): Unit = {
          Ok(service.run(host))
        }
      }
    expect_no_match: true
  description: "Play Ok(raw HTML concat) - reflected HTML response built from attacker-controlled text."
