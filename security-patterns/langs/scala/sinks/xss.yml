- id: scala.xss.twirl_html_constructor
  enabled: true
  language: scala
  tag: xss
  severity: high
  frameworks:
  - play
  cwe:
  - CWE-79
  match:
    kind: new
    callee:
      name: Html
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "object App {\n  def handle(input: String): Unit = {\n    new Html(input)\n  }\n}\nclass Html(args: Any*)\n"
  - name: arg tainted literal negative
    code: "object App {\n  def handle(input: String): Unit = {\n    new Html(\"safe\")\n  }\n}\nclass Html(args: Any*)\n"
    expect_no_match: true
  description: "Twirl Html(tainted) - bypasses auto-escaping."
- id: scala.xss.twirl_html_apply
  enabled: true
  language: scala
  tag: xss
  severity: high
  packages: [play.twirl.api]
  frameworks:
  - play
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - Html
      - apply
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import play.twirl.api._
      // uses play.twirl.api
      object App {
        def handle(input: String): Unit = {
          Html.apply(input)
        }
      }
  - name: arg tainted literal negative
    code: |
      import play.twirl.api._
      // uses play.twirl.api
      object App {
        def handle(input: String): Unit = {
          Html.apply("safe")
        }
      }
    expect_no_match: true
  description: "Twirl Html.apply(tainted) - companion-object form of Html(...)."
