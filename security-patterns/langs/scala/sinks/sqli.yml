        def createQuery(args: Any*): Any = null
      }
    expect_no_match: true
  description: "JDBI Handle.createQuery(sql) — raw SQL text remains injectable when built from attacker-controlled input. Merged collision aliases: scala.sqli.hibernate_create_query."
  aliases:
  - scala.sqli.hibernate_create_query
