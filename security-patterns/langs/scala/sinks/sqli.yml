- id: scala.sqli.slick_sql_interpolator
  enabled: true
  language: scala
  tag: sql-injection
  severity: high
  packages:
  - slick
  - org.tpolecat.doobie
  - scalikejdbc
  cwe:
  - CWE-89
  match:
    kind: call
    callee:
      regex: ^sql"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import slick._
      object App {
        def handle(input: String): Unit = {
          sql"select"(input)
        }
      }
  - name: literal slick sql interpolator negative
    code: |
      import slick._
      object App {
        def handle(): Unit = {
          sql"select"("safe")
        }
      }
    expect_no_match: true
  description: "sql\"\" interpolator — covers Slick, doobie, scalikejdbc (same `^sql\"` regex). ${} binds but #${} / string-built fragments splice raw."
