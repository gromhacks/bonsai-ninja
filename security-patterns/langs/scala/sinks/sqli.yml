    code: |
      import org.jdbi._
      object App {
        def handle(handle: Handle, sql: String): Any = {
          handle.createQuery(sql)
        }
      }
      class Handle {
        def createQuery(args: Any*): Any = null
      }
    expect_match_text:
    - handle.createQuery
  - name: arg tainted literal negative
    code: |
      import org.jdbi._
      object App {
