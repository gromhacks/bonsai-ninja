# Scala LLM sinks (OpenAI, Anthropic, Bedrock, LangChain4j).
- id: scala.llm.openai_chat_completion
  enabled: true
  language: scala
  tag: web-llm
  severity: medium
  packages: [openai4s]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      attribute: [OpenAI, chatCompletion]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import openai4s._
      object App {
        def handle(input: String): Unit = {
          OpenAI.chatCompletion(input)
        }
      }
    expect_match_text: [OpenAI.chatCompletion]
  - name: arg tainted literal negative
    code: |
      import openai4s._
      object App {
        def handle(input: String): Unit = {
          OpenAI.chatCompletion("safe")
        }
      }
    expect_no_match: true
  description: "Scala OpenAI chatCompletion - tainted prompt content reaches an LLM instruction and tool surface."

