- id: scala.template.freemarker_template_process_local
  enabled: false
  disabled_reason:
    code: over-broad
  language: scala
  tag: ssti
  severity: high
  packages:
  - freemarker
  cwe:
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - template
      - process
  match_examples:
  - name: freemarker local template process
    code: "import freemarker._\nobject App {\n  def handle(template: Template, model:\
      \ Any, out: Any): Unit = {\n    template.process(model, out)\n  }\n}\nclass\
      \ Template {\n  def process(args: Any*): Unit = {}\n}\n"
    expect_match_text:
    - template.process
  description: "Disabled - bare `template.process` overmatches any object named `template` with a `process` method; no canonical exists (scala.template.freemarker_process is also disabled). Re-enable when adapter supports receiver-type narrowing for FreeMarker Template instances."
- id: scala.template.spel_parseexpression
  enabled: true
  language: scala
  tag: ssti
  severity: critical
  packages:
  - org.springframework.expression
  cwe:
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - SpelExpressionParser
      - parseExpression
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: spel parse expression
    code: "import org.springframework.expression._\nobject App {\n  def handle(template: String):\
      \ Unit = {\n    SpelExpressionParser.parseExpression(template)\n  }\n}\n"
    expect_match_text:
    - SpelExpressionParser.parseExpression
  - name: arg tainted literal negative
    code: "import org.springframework.expression._\nobject App {\n  def handle(template: String):\
      \ Unit = {\n    SpelExpressionParser.parseExpression(\"safe\")\n  }\n}\n"
    expect_no_match: true
  description: "Spring SpEL parseExpression(template) - server-side template\
    \ expression parsing from attacker-controlled text."
  imports:
  - org.springframework.expression
- id: scala.template.thymeleaf_fragment_concat
  enabled: true
  language: scala
  tag: ssti
  severity: high
  packages:
  - org.thymeleaf
  cwe:
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - TemplateEngine
      - process
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: thymeleaf fragment expression concat
    code: "import org.thymeleaf._\n// uses org.thymeleaf\nobject App {\n  def handle(fragment:\
      \ String, ctx: Any): Any = {\n    TemplateEngine.process(\"layout :: \" + fragment,\
      \ ctx)\n  }\n}\n"
    expect_match_text:
    - TemplateEngine.process
  - name: arg tainted literal negative
    code: "import org.thymeleaf._\n// uses org.thymeleaf\nobject App {\n  def handle(fragment:\
      \ String, ctx: Any): Any = {\n    TemplateEngine.process(\"layout :: safe\"\
      , ctx)\n  }\n}\n"
    expect_no_match: true
  description: "Thymeleaf TemplateEngine.process(\"layout :: \" + fragment, ctx) -\
    \ attacker-controlled fragment expressions can become server-side template injection."
