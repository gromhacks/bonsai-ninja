- id: scala.template.velocity_evaluate
  enabled: true
  language: scala
  tag: ssti
  severity: critical
  packages:
  - velocity
  cwe:
  - CWE-94
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - Velocity
      - evaluate
  constraints:
  - arg_tainted:
      index: 3
  match_examples:
  - name: generated shape example
    code: "import velocity._\n// uses velocity\nobject App {\n  def handle(ctx: Any,\
      \ writer: Any, template: String): Unit = {\n    Velocity.evaluate(ctx, writer,\
      \ \"log\", \"{{\" + template)\n  }\n}\n"
  - name: arg tainted literal negative
    code: "import velocity._\n// uses velocity\nobject App {\n  def handle(ctx: Any,\
      \ writer: Any, template: String): Unit = {\n    Velocity.evaluate(ctx, writer,\
      \ template, \"safe\")\n  }\n}\n"
    expect_no_match: true
  description: "Velocity.evaluate(tainted template) - RCE."
