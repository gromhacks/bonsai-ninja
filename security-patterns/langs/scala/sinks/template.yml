- id: scala.template.scalate_layout
  enabled: true
  language: scala
  tag: ssti
  severity: critical
  packages:
  - scalate
  cwe:
  - CWE-94
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - TemplateEngine
      - layout
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "import scalate._\n// uses scalate\nobject App {\n  def handle(input: String):\
      \ Unit = {\n    TemplateEngine.layout(\"{{\" + input)\n  }\n}\n"
  - name: arg tainted literal negative
    code: "import scalate._\n// uses scalate\nobject App {\n  def handle(input: String):\
      \ Unit = {\n    TemplateEngine.layout(\"safe\")\n  }\n}\n"
    expect_no_match: true
  description: "Scalate TemplateEngine.layout(tainted) - SSTI."
