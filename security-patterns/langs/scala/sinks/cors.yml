# scala CORS misconfiguration sinks (T403).
- id: scala.cors.wildcard_origin_akka
  enabled: true
  language: scala
  tag: cors
  category: source-independent
  severity: medium
  packages: [ch.megard.akka.http.cors]
  cwe: [CWE-942]
  match:
    kind: call
    callee:
      attribute: [CorsSettings, allowedOrigins]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^HttpOriginMatcher\.(?:Star|\*)$'
  match_examples:
  - name: generated shape example
    code: |
      import ch.megard.akka.http.cors._
      object App {
        def handle(input: String): Unit = {
          CorsSettings.allowedOrigins(HttpOriginMatcher.Star)
        }
      }
  - name: Akka HTTP CORS explicit origin negative
    code: |
      import ch.megard.akka.http.cors._
      object App {
        def configure(settings: CorsSettings): Unit = {
          settings.allowedOrigins(HttpOriginMatcher("https://app.example"))
        }
      }
    expect_no_match: true
  description: |-
    Akka HTTP CORS with the exact `HttpOriginMatcher.Star`/wildcard value permits every origin; explicit origin matchers stay quiet.
