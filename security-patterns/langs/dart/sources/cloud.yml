# Dart cloud / serverless handler sources (Firebase, AWS Lambda Dart runtime).
- id: dart.cloud.lambda_registered_handler_event
  enabled: true
  language: dart
  trust: service
  tag: cloud-input
  payload_types: [event, json]
  frameworks: [aws_lambda_dart_runtime]
  packages: [aws_lambda_dart_runtime]
  match:
    kind: call
    callee:
      name: registerHandler
  constraints:
  - receiver_type_in: [Runtime]
  - arg_count: 2
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [1]
  match_examples:
  - name: AWS Lambda registered event handler
    code: |
      import 'package:aws_lambda_dart_runtime/aws_lambda_dart_runtime.dart';
      void configure(Runtime runtime) {
        runtime.registerHandler<AwsApiGatewayEvent>('hello', (context, event) async {
          sink(event);
          return InvocationResult(context.requestId, 'ok');
        });
      }
    expect_match_text: [runtime.registerHandler]
  - name: unrelated handler registry is not Lambda
    code: |
      import 'package:aws_lambda_dart_runtime/aws_lambda_dart_runtime.dart';
      class Registry { void registerHandler(String name, Function callback) {} }
      void configure(Registry registry) {
        registry.registerHandler('local', (context, event) => sink(event));
      }
    expect_no_match: true
  description: "aws_lambda_dart_runtime Runtime.registerHandler callback parameter one is the decoded invocation event; context and the registration result remain clean."
