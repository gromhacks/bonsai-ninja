# Dart queue / messaging sources (FCM, PubSub).
- id: dart.queue.fcm_message_handler
  enabled: true
  language: dart
  trust: service
  tag: push-message
  packages: [firebase_messaging]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      param_type_in: [RemoteMessage]
  match_examples:
  - name: firebase remote message parameter
    code: |
      import 'package:firebase_messaging/firebase_messaging.dart';
      void handle(RemoteMessage message) { print(message.data); }
    expect_match_text: [message]
  - name: same name wrong type negative
    code: |
      import 'package:firebase_messaging/firebase_messaging.dart';
      void handle(String message) { print(message); }
    expect_no_match: true
  description: "Firebase Messaging RemoteMessage callback parameter - push payload proven by its declared runtime type."

  imports:
  - firebase_messaging/firebase_messaging.dart
- id: dart.queue.fcm_remote_message_data
  enabled: true
  language: dart
  trust: service
  tag: push-message
  packages: [firebase_messaging]
  match:
    kind: read
    target:
      name: data
      receiver_type_in: [RemoteMessage]
  match_examples:
  - name: fcm remote message data read
    code: |
      import 'package:firebase_messaging/firebase_messaging.dart';
      Map<String, dynamic> handle(RemoteMessage message) {
        var d = message.data;
        return d;
      }
  description: "RemoteMessage.data - FCM push payload read via `message.data` on a typed RemoteMessage receiver."

- id: dart.queue.fcm_notification_title
  enabled: true
  language: dart
  trust: service
  tag: push-message
  packages: [firebase_messaging]
  match:
    kind: read
    target:
      name: notification
      receiver_type_in: [RemoteMessage]
  match_examples:
  - name: fcm remote message notification read
    code: |
      import 'package:firebase_messaging/firebase_messaging.dart';
      RemoteNotification? handle(RemoteMessage message) {
        var n = message.notification;
        return n;
      }
  description: "RemoteMessage.notification - FCM notification block read via `message.notification` on a typed RemoteMessage receiver."
