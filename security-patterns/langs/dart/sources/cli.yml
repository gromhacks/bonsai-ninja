# Dart CLI / local sources.
- id: dart.cli.main_arguments
  enabled: true
  language: dart
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_method: [main]
      param_index_in: [0]
      param_count_in: [1]
      param_type_in: [List]
  match_examples:
  - name: dart main arguments
    code: |
      void main(List<String> arguments) { print(arguments); }
    expect_match_text: [arguments]
  - name: helper list parameter negative
    code: |
      void handle(List<String> arguments) { print(arguments); }
    expect_no_match: true
  description: "First and only List parameter of Dart main - local command-line arguments, independent of the parameter name."

- id: dart.cli.stdin_readline_sync
  enabled: true
  language: dart
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      attribute: [stdin, readLineSync]
  match_examples:
  - name: declared shape
    code: |
      void test() { var input = "x"; var amount = 1; stdin.readLineSync(input); }
  - name: unrelated stdin method negative
    code: |
      void test() { var input = "x"; stdin.flush(); }
    expect_no_match: true
  description: "stdin.readLineSync - interactive input."

- id: dart.cli.stdin_read_byte_sync
  enabled: true
  language: dart
  trust: local
  tag: local-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      attribute: [stdin, readByteSync]
  match_examples:
  - name: declared shape
    code: |
      void test() { var input = "x"; var amount = 1; stdin.readByteSync(input); }
  - name: unrelated stdin method negative
    code: |
      void test() { var input = "x"; stdin.flush(); }
    expect_no_match: true
  description: "stdin.readByteSync."

- id: dart.os.platform_environment
  enabled: true
  language: dart
  trust: config
  tag: local-input
  payload_types: [text]
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: read
    target:
      attribute: [Platform, environment]
  match_examples:
  - name: platform environment read
    code: |
      import 'dart:io';
      Map<String, String> run() {
        var e = Platform.environment;
        return e;
      }
  - name: platform executable arguments are not environment values
    code: |
      import 'dart:io';
      List<String> run() => Platform.executableArguments;
    expect_no_match: true
  description: "Platform.environment - process environment variables read via the static `Platform.environment` map."

- id: dart.flutter.text_editing_controller
  enabled: true
  language: dart
  trust: local
  tag: ui-input
  payload_types: [text]
  frameworks: [flutter]
  packages: [flutter]
  match:
    kind: read
    target:
      name: text
      receiver_type_in: [TextEditingController]
  match_examples:
  - name: Flutter text editing value
    code: |
      import 'package:flutter/widgets.dart';
      String read(TextEditingController controller) => controller.text;
    expect_match_text: [controller.text]
  - name: unrelated text property negative
    code: |
      import 'package:flutter/widgets.dart';
      class Label { final String text = 'local'; }
      String read(Label label) => label.text;
    expect_no_match: true
  description: "TextEditingController.text - local user-entered UI text. The rule requires the adapter-emitted receiver type, so unrelated application `.text` fields remain clean."

- id: dart.local.file_content_read
  enabled: true
  language: dart
  trust: local
  tag: file-input
  payload_types: [text, binary]
  packages: ["dart:io"]
  match:
    kind: call
    callee:
      regex: '(^|[.])(readAsString|readAsStringSync|readAsBytes|readAsBytesSync|readAsLines|readAsLinesSync)$'
  constraints:
  - receiver_type_in: [File]
  - max_args: 1
  match_examples:
  - name: Dart file text read
    code: |
      import 'dart:io';
      Future<String> load(File file) => file.readAsString();
    expect_match_text: [file.readAsString]
  - name: local document reader is not a filesystem source
    code: |
      import 'dart:io';
      class Document { String readAsString() => 'constant'; }
      String load(Document document) => document.readAsString();
    expect_no_match: true
  description: "Typed dart:io File content-reading operations - values read from the local filesystem."
