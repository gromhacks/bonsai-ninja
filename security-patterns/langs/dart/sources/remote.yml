- id: dart.cloud.firebase_oncall_data
  enabled: true
  language: dart
  trust: remote
  tag: cloud-input
  payload_types: [json]
  frameworks: [firebase_functions]
  packages: [firebase_functions]
  match:
    kind: call
    callee:
      name: onCall
  constraints:
  - receiver_type_in: [Firebase]
  - receiver_matches_regex: "\\.https$"
  - arg_count: 2
  - arg_is_inline_callback: 1
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: Firebase callable request callback
    code: |
      import 'package:firebase_functions/firebase_functions.dart';
      void registerFunctions() {
        runFunctions((firebase) {
          firebase.https.onCall(name: 'lookup', handler: (request) async => sink(request.data));
        });
      }
    expect_match_text: [firebase.https.onCall]
  - name: application onCall method is not a Firebase boundary
    code: |
      import 'package:firebase_functions/firebase_functions.dart';
      class LocalHttps { void onCall({required String name, required Function handler}) {} }
      class LocalFirebase { final https = LocalHttps(); }
      void main() {
        final firebase = LocalFirebase();
        firebase.https.onCall(name: 'lookup', handler: (request) => sink(request));
      }
    expect_no_match: true
  description: "firebase_functions HttpsNamespace.onCall callback parameter 0 - callable request data delivered by the runtime. Callback position, inline binding, and the Firebase type of the enclosing runFunctions callback are compiler-proven; the registration result remains clean."

- id: dart.cloud.firebase_interop_oncall_data
  enabled: true
  language: dart
  trust: remote
  tag: cloud-input
  payload_types: [json]
  frameworks: [firebase_functions_interop]
  packages: [firebase_functions_interop]
  analysis_semantics:
    allow_file_package_evidence: false
  match:
    kind: call
    callee:
      name: onCall
  constraints:
  - receiver_matches_regex: "\\.https$"
  - arg_count: 1
  - arg_is_inline_callback: 0
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 0
      source_param_indices: [0]
  match_examples:
  - name: firebase functions interop callable data callback
    code: |
      import 'package:firebase_functions_interop/firebase_functions_interop.dart' as functions;
      void main() {
        functions.https.onCall((data, context) => sink(data));
      }
    expect_match_text: [functions.https.onCall]
  - name: application onCall receiver is not the imported functions namespace
    code: |
      import 'package:firebase_functions_interop/firebase_functions_interop.dart' as functions;
      class Registry { void onCall(Function callback) {} }
      void main(Registry registry) {
        registry.onCall((data) => sink(data));
      }
    expect_no_match: true
  description: "firebase_functions_interop https.onCall callback parameter 0 - legacy callable payload delivery, bound to the exact imported namespace and inline callback fact."
- id: dart.grpc.service_method_request
  enabled: true
  language: dart
  trust: remote
  tag: rpc-input
  payload_types: [protobuf]
  frameworks: [grpc]
  packages: [grpc]
  match:
    kind: param
    target:
      param_index_in: [1]
      param_count_in: [2]
      in_class_suffix: [ServiceBase]
      signature_param_types:
      - index: 0
        type_in: [ServiceCall, grpc.ServiceCall]
  constraints:
  - enclosing_decorator_in: [override]
  match_examples:
  - name: generated gRPC service override payload
    code: |
      import 'package:grpc/grpc.dart';
      class GreeterService extends GreeterServiceBase {
        @override
        Future<Reply> sayHello(ServiceCall call, HelloRequest payload) async {
          sink(payload);
          return Reply();
        }
      }
  - name: same signature outside a generated service negative
    code: |
      import 'package:grpc/grpc.dart';
      class LocalHandler extends LocalBase {
        @override
        void handle(ServiceCall call, Object payload) { sink(payload); }
      }
    expect_no_match: true
  - name: generated-looking class without ServiceCall context negative
    code: |
      import 'package:grpc/grpc.dart';
      class LocalService extends LocalServiceBase {
        @override
        void handle(Object context, Object payload) { sink(payload); }
      }
    expect_no_match: true
  description: "Dart gRPC generated service override parameter 1 - remote protobuf request proven by generated ServiceBase inheritance, override syntax, complete arity, and the compiler-typed ServiceCall context at parameter 0; independent of payload variable and message type names."
