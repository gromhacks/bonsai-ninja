- id: dart.conduit.request_controller_request
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  trust: remote
  tag: http-input
  payload_types: [json, query, header]
  frameworks: [aqueduct, conduit]
  packages: [aqueduct, conduit]
  match:
    kind: param
    target:
      name: request
  description: "Disabled - bare `param name: request` is FP-prone; no canonical exists. Use the attribute-chain rule dart.conduit.request_body_decode for body access. Re-enable when adapter supports class-scoped Conduit Request param matching."

- id: dart.conduit.request_body_decode
  enabled: true
  language: dart
  trust: remote
  tag: http-input
  payload_types: [json, form]
  frameworks: [aqueduct, conduit]
  packages: [aqueduct, conduit]
  match:
    kind: call
    callee:
      attribute: [body, decode]
  match_examples:
  - name: declared shape
    code: |
      import 'package:aqueduct/aqueduct.dart';
      void test() { var input = "x"; var amount = 1; body.decode(input); }
  - name: unrelated body method negative
    code: |
      import 'package:aqueduct/aqueduct.dart';
      void test() { var input = "x"; body.encode(input); }
    expect_no_match: true
  description: "Aqueduct/Conduit Request.body.decode() - parsed body payload."

  imports:
  - aqueduct/aqueduct.dart
