# `comment` parameter — the canonical "user-supplied content" name for
# blog/forum/CMS request handlers (matches the F3 dart.xss.innerhtml
# miss case). Bare-name match: also fires on functions with unrelated
# `comment` params; treat findings outside controller/handler context
# as audit hints.
  imports:
  - shelf_multipart/shelf_multipart.dart
- id: dart.input.comment_param
  enabled: true
  language: dart
  trust: remote
  tag: http-input
  payload_types: [text]
  match:
    kind: param
    target:
      name: comment
  match_examples:
  - name: declared shape
    code: |
      void handle(String comment) { var seen = comment; }
  description: "Handler `comment` parameter — user-supplied content from a blog/forum/CMS POST. Engine taint flow gates findings; broad name means non-handler usage will surface as audit hints."
