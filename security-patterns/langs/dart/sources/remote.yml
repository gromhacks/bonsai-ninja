- id: dart.flutter.method_channel_invoke
  enabled: true
  language: dart
  trust: service
  tag: ipc-input
  payload_types: [text, json]
  frameworks: [flutter]
  packages: [flutter]
  match:
    kind: call
    callee:
      name: invokeMethod
  constraints:
  - receiver_type_in: [MethodChannel]
  match_examples:
  - name: typed Flutter method channel invocation
    code: |
      import 'package:flutter/services.dart';
      Future<String?> read(MethodChannel channel) => channel.invokeMethod<String>('read');
    expect_match_text: [channel.invokeMethod]
  - name: same method on a local object negative
    code: |
      import 'package:flutter/services.dart';
      class LocalChannel { String invokeMethod(String name) => 'local'; }
      String read(LocalChannel channel) => channel.invokeMethod('read');
    expect_no_match: true
  description: "Flutter MethodChannel.invokeMethod - return value crosses platform boundary (e.g. JS bridge, native plugin)."

- id: dart.flutter.event_channel_receive
  enabled: true
  language: dart
  trust: service
  tag: ipc-input
  payload_types: [text, json]
  frameworks: [flutter]
  packages: [flutter]
  match:
    kind: call
    callee:
      name: receiveBroadcastStream
  constraints:
  - receiver_type_in: [EventChannel]
  match_examples:
  - name: typed Flutter event channel stream
    code: |
      import 'package:flutter/services.dart';
      Stream<dynamic> events(EventChannel channel) => channel.receiveBroadcastStream();
    expect_match_text: [channel.receiveBroadcastStream]
  - name: local event stream is not a platform channel
    code: |
      import 'package:flutter/services.dart';
      class LocalChannel { Stream<int> receiveBroadcastStream() => const Stream.empty(); }
      Stream<int> events(LocalChannel channel) => channel.receiveBroadcastStream();
    expect_no_match: true
  description: "Flutter EventChannel.receiveBroadcastStream - values arrive from native/JS over platform channel."

