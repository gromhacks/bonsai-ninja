- id: dart.dart_frog.request_json
  analysis_semantics:
    source_specificity_rank: 5
  enabled: true
  language: dart
  trust: remote
  tag: http-input
  payload_types: [json]
  frameworks: [dart_frog]
  packages: [dart_frog]
  match:
    kind: call
    callee:
      attribute: [request, json]
  constraints:
  - max_args: 0
  match_examples:
  - name: declared shape
    code: |
      import 'package:dart_frog/dart_frog.dart';
      void test() { var input = "x"; var amount = 1; request.json(); }
  - name: json serializer with arg negative
    code: |
      import 'package:dart_frog/dart_frog.dart';
      void test() { var input = "x"; request.json(input); }
    expect_no_match: true
  description: "Dart Frog Request.json() - parsed body. `json()` takes no args; `max_args: 0` rejects same-name decoys (JSON serializers `json(value)` etc.)."

  imports:
  - dart_frog/dart_frog.dart
