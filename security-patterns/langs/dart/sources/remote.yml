  payload_types: [json]
  frameworks: [firebase_functions]
  packages: [firebase_functions_interop, cloud_functions]
  match:
    kind: call
    callee:
      attribute: [data, onCall]
  constraints:
  - min_args: 1
  match_examples:
  - name: declared shape
    code: |
      import 'package:firebase_functions_interop/firebase_functions_interop.dart';
      import 'package:firebase_functions_interop/firebase_functions_interop.dart';
      import 'package:firebase_functions_interop/firebase_functions_interop.dart';
      import 'package:firebase_functions_interop/firebase_functions_interop.dart';
      import 'package:firebase_functions_interop/firebase_functions_interop.dart'; // firebase_functions_interop
      void test() { var input = "x"; var amount = 1; data.onCall(input); }
  description: "Firebase Cloud Functions onCall handler — `data.data` is the caller-supplied payload. `onCall(handler)` is a registration call with at least one handler arg; `min_args: 1` rejects unrelated `data.onCall()` 0-arg accessors."

  imports:
  - firebase_functions_interop/firebase_functions_interop.dart
