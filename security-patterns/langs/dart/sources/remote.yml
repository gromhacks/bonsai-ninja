# Dart remote / network-trust sources.
- id: dart.shelf.request_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  trust: remote
  tag: http-input
  payload_types: [query, json, path, header, form]
  frameworks: [shelf, angel, dart_frog]
  packages: [shelf, angel_framework, dart_frog]
  manifests: [pubspec.yaml]
  lockfiles: [pubspec.lock]
  match:
    kind: param
    target:
      name: request
  description: "Disabled — whole request object taints too broadly without field-sensitive Request access tracking; body-reader rules stay enabled."

- id: dart.shelf.req_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  trust: remote
  tag: http-input
  frameworks: [shelf]
  packages: [shelf]
  match:
    kind: param
    target:
      name: req
  description: "Disabled duplicate — merged into dart.shelf.request_param."

- id: dart.shelf.context_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  trust: remote
  tag: http-input
  frameworks: [dart_frog]
  packages: [dart_frog]
  match:
    kind: param
    target:
      name: context
  description: "Disabled — whole context object taints too broadly without field-sensitive Request access tracking."

- id: dart.http.request_query_parameters
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: dart
  trust: remote
  tag: http-input
  payload_types: [query]
  match:
    kind: read
    target:
      name: queryParameters
  description: "Disabled — the current Dart adapter does not index property reads like `uri.queryParameters`."

- id: dart.http.request_query_parameters_all
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: dart
  trust: remote
  tag: http-input
  payload_types: [query]
  match:
    kind: read
    target:
      name: queryParametersAll
  description: "Disabled — the current Dart adapter does not index property reads like `uri.queryParametersAll`."

- id: dart.http.request_headers
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: dart
  trust: remote
  tag: http-input
  payload_types: [header]
  match:
    kind: read
    target:
      name: headers
  description: "Disabled — FP-prone. Bare name 'headers' matches every .headers attribute. Re-enable with attribute chain."

- id: dart.http.request_read_as_string
  enabled: true
  language: dart
  trust: remote
  tag: http-input
  payload_types: [form]
  frameworks: [shelf]
  packages: [shelf]
  match:
    kind: call
    callee:
      attribute: [request, readAsString]
  constraints:
  - max_args: 1
  match_examples:
  - name: declared shape
    code: |
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      void test() { var input = "x"; var amount = 1; request.readAsString(input); }
  description: "shelf Request.readAsString — body read. Signature: `readAsString([Encoding])` (0 or 1 arg); `max_args: 1` rejects same-name decoys with extra args."

  imports:
  - shelf/shelf.dart
- id: dart.http.request_read
  enabled: true
  language: dart
  trust: remote
  tag: http-input
  payload_types: [form]
  frameworks: [shelf]
  packages: [shelf]
  match:
    kind: call
    callee:
      attribute: [request, read]
  constraints:
  - max_args: 0
  match_examples:
  - name: declared shape
    code: |
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      void test() { var input = "x"; var amount = 1; request.read(); }
  description: "shelf Request.read — byte stream body. Signature: `read()` (0 args); `max_args: 0` rejects unrelated `read(n)` decoys (e.g. file readers)."

  imports:
  - shelf/shelf.dart
- id: dart.http.response_body
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: dart
  trust: remote
  tag: network-response
  payload_types: [form]
  packages: [http, dio]
  match:
    kind: read
    target:
      name: body
  description: "Disabled — FP-prone. Bare name 'body' matches every .body attribute. Re-enable with attribute chain."

# --- Re-enabled / new framework-scoped HTTP request handlers ---

- id: dart.shelf.request_url
  enabled: true
  language: dart
  trust: remote
  tag: http-input
  payload_types: [url, query]
  frameworks: [shelf]
  packages: [shelf]
  match:
    kind: call
    callee:
      attribute: [request, url]
  constraints:
  - max_args: 0
  match_examples:
  - name: declared shape
    code: |
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      void test() { var input = "x"; var amount = 1; request.url(); }
  description: "shelf Request.url — tainted Uri (path + query). Property-style getter (no args); `max_args: 0` rejects unrelated `request.url(...)` setters/builders elsewhere."

  imports:
  - shelf/shelf.dart
