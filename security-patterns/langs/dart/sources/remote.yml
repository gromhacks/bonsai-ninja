# Dart remote / network-trust sources.
- id: dart.shelf.request_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  trust: remote
  tag: http-input
  payload_types: [query, json, path, header, form]
  frameworks: [shelf, angel, dart_frog]
  packages: [shelf, angel_framework, dart_frog]
  manifests: [pubspec.yaml]
  lockfiles: [pubspec.lock]
  match:
    kind: param
    target:
      name: request
  description: "Disabled - whole request object taints too broadly without field-sensitive Request access tracking; body-reader rules stay enabled."

- id: dart.shelf.req_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  trust: remote
  tag: http-input
  frameworks: [shelf]
  packages: [shelf]
  match:
    kind: param
    target:
      name: req
  description: "Disabled duplicate - merged into dart.shelf.request_param."

- id: dart.shelf.context_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  trust: remote
  tag: http-input
  frameworks: [dart_frog]
  packages: [dart_frog]
  match:
    kind: param
    target:
      name: context
  description: "Disabled - whole context object taints too broadly without field-sensitive Request access tracking."

- id: dart.http.request_query_parameters
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: dart
  trust: remote
  tag: http-input
  payload_types: [query]
  match:
    kind: read
    target:
      name: queryParameters
      receiver_type_in: [Uri]
  match_examples:
  - name: uri query parameters read
    code: |
      Map<String, String> handle(Uri uri) {
        var q = uri.queryParameters;
        return q;
      }
  description: "Disabled - Uri is also constructed from literals and trusted configuration. Query fields inherit provenance from a proven inbound Request.url/requestedUri boundary."

- id: dart.http.request_query_parameters_all
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: dart
  trust: remote
  tag: http-input
  payload_types: [query]
  match:
    kind: read
    target:
      name: queryParametersAll
      receiver_type_in: [Uri]
  match_examples:
  - name: uri query parameters all read
    code: |
      Map<String, List<String>> handle(Uri uri) {
        var q = uri.queryParametersAll;
        return q;
      }
  description: "Disabled - Uri.queryParametersAll is an accessor, not an input origin. It requires proven inbound Request/Intent provenance."

- id: dart.http.request_headers
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: dart
  trust: remote
  tag: http-input
  payload_types: [header]
  match:
    kind: read
    target:
      name: headers
  description: "Disabled - FP-prone. Bare name 'headers' matches every .headers attribute. Re-enable with attribute chain."

- id: dart.http.request_read_as_string
  enabled: true
  language: dart
  trust: remote
  tag: http-input
  payload_types: [form]
  frameworks: [shelf]
  packages: [shelf]
  match:
    kind: call
    callee:
      name: readAsString
  constraints:
  - receiver_type_in: [Request]
  - max_args: 1
  match_examples:
  - name: shelf request body text
    code: |
      import 'package:shelf/shelf.dart';
      Future<String> readBody(Request request) => request.readAsString();
    expect_match_text: [request.readAsString]
  - name: local reader is not a shelf request
    code: |
      import 'package:shelf/shelf.dart';
      class Reader { String readAsString() => 'local'; }
      String readBody(Reader reader) => reader.readAsString();
    expect_no_match: true
  description: "shelf Request.readAsString - body read. Signature: `readAsString([Encoding])` (0 or 1 arg); `max_args: 1` rejects same-name decoys with extra args."

  imports:
  - shelf/shelf.dart
- id: dart.http.request_read
  enabled: true
  language: dart
  trust: remote
  tag: http-input
  payload_types: [form]
  frameworks: [shelf]
  packages: [shelf]
  match:
    kind: call
    callee:
      name: read
  constraints:
  - receiver_type_in: [Request]
  - max_args: 0
  match_examples:
  - name: shelf request byte stream
    code: |
      import 'package:shelf/shelf.dart';
      Stream<List<int>> readBody(Request request) => request.read();
    expect_match_text: [request.read]
  - name: local reader is not a shelf request
    code: |
      import 'package:shelf/shelf.dart';
      class Reader { String read() => 'local'; }
      String readBody(Reader reader) => reader.read();
    expect_no_match: true
  description: "shelf Request.read - byte stream body. Signature: `read()` (0 args); `max_args: 0` rejects unrelated `read(n)` decoys (e.g. file readers)."

  imports:
  - shelf/shelf.dart
- id: dart.http.response_body
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: dart
  trust: remote
  tag: network-response
  payload_types: [form]
  packages: [http]
  match:
    kind: read
    target:
      name: body
      receiver_type_in: [Response, http.Response]
  match_examples:
  - name: package http response body
    code: |
      import 'package:http/http.dart' as http;
      String consume(http.Response response) => response.body;
    expect_match_text: [response.body]
  - name: local response body is not network input
    code: |
      import 'package:http/http.dart' as http;
      class LocalResponse { final String body = 'local'; }
      String consume(LocalResponse response) => response.body;
    expect_no_match: true
  description: "Disabled - package:http Response.body is a real network-response boundary, but precise receiver-type evidence is not yet adapter-visible on Dart property reads. A bare `.body` source would overmatch application models."

# --- Re-enabled / new framework-scoped HTTP request handlers ---

- id: dart.shelf.request_url
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: dart
  trust: remote
  tag: http-input
  payload_types: [url, query]
  frameworks: [shelf]
  packages: [shelf]
  match:
    kind: read
    target:
      name: url
      receiver_type_in: [Request]
  match_examples:
  - name: shelf request URL property
    code: |
      import 'package:shelf/shelf.dart';
      Uri requestUrl(Request request) => request.url;
    expect_match_text: [request.url]
  - name: local URL property is not a shelf request
    code: |
      import 'package:shelf/shelf.dart';
      class LocalRequest { final Uri url = Uri.parse('https://example.test'); }
      Uri requestUrl(LocalRequest request) => request.url;
    expect_no_match: true
  description: "Disabled - Shelf Request.url is an inbound value, but the Dart adapter does not yet prove the receiver type on property reads; matching bare `.url` would include local URL models."

  imports:
  - shelf/shelf.dart
