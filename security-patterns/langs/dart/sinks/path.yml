- id: dart.path.file_constructor
  enabled: true
  language: dart
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: new
    callee:
      name: File
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted file constructor
    code: |
      class File { File([dynamic input, {dynamic htmlEscapeValues}]); }
      void test() { var input = "x"; var result = File(input); }
  - name: literal file constructor negative
    code: |
      class File { File([dynamic input, {dynamic htmlEscapeValues}]); }
      void test() { var result = File("config/app.txt"); }
    expect_no_match: true
  description: "File(path) constructor — tainted path stored on the File receiver before later read/write/delete operations."

