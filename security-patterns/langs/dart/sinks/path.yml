- id: dart.path.archive_extract_archive_to
  enabled: true
  language: dart
  tag: path-traversal
  severity: high
  packages: [archive]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: extractArchiveToDisk
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted archive extraction input
    code: |
      import 'package:archive/archive.dart';
      import 'package:archive/archive.dart';
      import 'package:archive/archive.dart';
      import 'package:archive/archive.dart';
      import 'package:archive/archive.dart';
      void test(dynamic input) { extractArchiveToDisk(input); }
  - name: literal archive extraction input negative
    code: |
      import 'package:archive/archive.dart';
      void test() { extractArchiveToDisk("fixtures/safe.zip"); }
    expect_no_match: true
  description: "archive extractArchiveToDisk — zip-slip if member filenames contain ../ and are not validated before write."

  imports:
  - archive/archive.dart
