# Dart path-traversal sinks (dart:io File/Directory + archive zip-slip).
- id: dart.path.file_read_as_string
  enabled: true
  language: dart
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      attribute: [File, readAsString]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted file read path
    code: |
      void test(String input) { File.readAsString(input); }
  - name: literal file read path negative
    code: |
      void test() { File.readAsString("config/app.txt"); }
    expect_no_match: true
  description: "File.readAsString."

