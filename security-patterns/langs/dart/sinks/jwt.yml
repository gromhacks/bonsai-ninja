# Dart JWT sinks.
- id: dart.jwt.dart_jsonwebtoken_decode
  enabled: true
  language: dart
  tag: jwt
  severity: high
  packages: [dart_jsonwebtoken]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [JWT, decode]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart'; // dart_jsonwebtoken
      // uses dart_jsonwebtoken
      void test(String input) { var amount = 1; JWT.decode(input); }
  - name: literal jwt negative
    code: |
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      void test() { JWT.decode("safe"); }
    expect_no_match: true
  description: "dart_jsonwebtoken JWT.decode - does not verify signature."

  imports:
  - dart_jsonwebtoken/dart_jsonwebtoken.dart
- id: dart.jwt.jose_unverified
  enabled: true
  language: dart
  tag: jwt
  severity: critical
  packages: [jose]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
