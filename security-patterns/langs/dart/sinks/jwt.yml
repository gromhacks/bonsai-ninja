# Dart JWT sinks.
- id: dart.jwt.dart_jsonwebtoken_verify
  aliases:
  - dart.jwt.alg_confusion
  enabled: true
  language: dart
  tag: jwt
  severity: high
  packages: [dart_jsonwebtoken]
  cwe: [CWE-347, CWE-345]
  match:
    kind: call
    callee:
      attribute: [JWT, verify]
  match_examples:
  - name: declared shape
    code: |
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart'; // dart_jsonwebtoken
      // uses dart_jsonwebtoken
      void test() { var input = "x"; var amount = 1; JWT.verify(input); }
  description: "dart_jsonwebtoken JWT.verify — check algorithm whitelist + key pinning. Also covers merged aliases: dart.jwt.alg_confusion."

  imports:
  - dart_jsonwebtoken/dart_jsonwebtoken.dart
