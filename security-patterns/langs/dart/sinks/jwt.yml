- id: dart.jwt.corsac_parse
  enabled: true
  language: dart
  tag: jwt
  severity: high
  packages: [corsac_jwt]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [JWT, parse]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import 'package:corsac_jwt/corsac_jwt.dart';
      import 'package:corsac_jwt/corsac_jwt.dart';
      import 'package:corsac_jwt/corsac_jwt.dart';
      import 'package:corsac_jwt/corsac_jwt.dart';
      import 'package:corsac_jwt/corsac_jwt.dart'; // corsac_jwt
      // uses corsac_jwt
      void test() { var input = "x"; var amount = 1; JWT.parse(input); }
  - name: literal jwt negative
    code: "import 'package:corsac_jwt/corsac_jwt.dart';\nimport 'package:corsac_jwt/corsac_jwt.dart';\n\
      import 'package:corsac_jwt/corsac_jwt.dart';\nimport 'package:corsac_jwt/corsac_jwt.dart';\n\
      import 'package:corsac_jwt/corsac_jwt.dart'; // corsac_jwt\n// uses corsac_jwt\n\
      void test() { var \"safe\" = \"x\"; var amount = 1; JWT.parse(\"safe\"); }\n"
    expect_no_match: true
  description: "corsac_jwt JWT.parse — does not verify signature."

# JWT alg-confusion (T400). HMAC verify with an RSA public
# key — when both HS* and RS* algorithms are allowed in the
# verifier's algorithm list, an attacker can sign their own
# token with the public key as the HMAC secret. Detect by
# matching the algorithm-list shape at the verify call.
  imports:
  - corsac_jwt/corsac_jwt.dart
