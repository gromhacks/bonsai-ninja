# Dart JWT sinks.
- id: dart.jwt.dart_jsonwebtoken_verify
  aliases:
  - dart.jwt.alg_confusion
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: dart
  tag: jwt
  severity: high
  packages: [dart_jsonwebtoken]
  cwe: [CWE-347, CWE-345]
  match:
    kind: call
    callee:
      attribute: [JWT, verify]
  match_examples:
  - name: declared shape
    code: |
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart'; // dart_jsonwebtoken
      // uses dart_jsonwebtoken
      void test() { var input = "x"; var amount = 1; JWT.verify(input); }
  description: "Disabled — requires a rulepack constraint that proves the unsafe JWT
    configuration, not just the broad API shape. dart_jsonwebtoken JWT.verify — check
    algorithm whitelist + key pinning. Also covers merged aliases: dart.jwt.alg_confusion."

  imports:
  - dart_jsonwebtoken/dart_jsonwebtoken.dart
- id: dart.jwt.dart_jsonwebtoken_decode
  enabled: true
  language: dart
  tag: jwt
  severity: high
  packages: [dart_jsonwebtoken]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [JWT, decode]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart'; // dart_jsonwebtoken
      // uses dart_jsonwebtoken
      void test() { var input = "x"; var amount = 1; JWT.decode(input); }
  - name: literal jwt negative
    code: "import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';\nimport 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';\n\
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';\nimport 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart';\n\
      import 'package:dart_jsonwebtoken/dart_jsonwebtoken.dart'; // dart_jsonwebtoken\n\
      // uses dart_jsonwebtoken\nvoid test() { var \"safe\" = \"x\"; var amount =
      1; JWT.decode(\"safe\"); }\n"
    expect_no_match: true
  description: "dart_jsonwebtoken JWT.decode — does not verify signature."

  imports:
  - dart_jsonwebtoken/dart_jsonwebtoken.dart
- id: dart.jwt.jose_unverified
  enabled: true
  language: dart
  tag: jwt
  severity: critical
  packages: [jose]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [JsonWebToken, unverified]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import 'package:jose/jose.dart';
      import 'package:jose/jose.dart';
      import 'package:jose/jose.dart';
      import 'package:jose/jose.dart';
      import 'package:jose/jose.dart'; // jose
      // uses jose
      void test() { var input = "x"; var amount = 1; JsonWebToken.unverified(input); }
  - name: literal jwt negative
    code: "import 'package:jose/jose.dart';\nimport 'package:jose/jose.dart';\nimport
      'package:jose/jose.dart';\nimport 'package:jose/jose.dart';\nimport 'package:jose/jose.dart';
      // jose\n// uses jose\nvoid test() { var \"safe\" = \"x\"; var amount = 1; JsonWebToken.unverified(\"\
      safe\"); }\n"
    expect_no_match: true
  description: "jose JsonWebToken.unverified — explicit no-verify."

  imports:
  - jose/jose.dart
