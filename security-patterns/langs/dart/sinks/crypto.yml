- id: dart.crypto.random_default
  enabled: true
  language: dart
  tag: weak-randomness
  category: source-independent
  severity: medium
  cwe: [CWE-330, CWE-338]
  match:
    kind: new
    callee:
      name: Random
  match_examples:
  - name: declared shape
    code: |
      class Random { Random([dynamic input, {dynamic htmlEscapeValues}]); }
      void test() { var input = "x"; var result = Random(input); }
  description: "Random() default - non-crypto PRNG. Use Random.secure()."

- id: dart.crypto.ecb_cipher
  enabled: true
  language: dart
  tag: weak-crypto
  category: source-independent
  severity: high
  packages: [pointycastle, encrypt, cryptography]
  cwe: [CWE-327]
  match:
    kind: new
    callee:
      name: ECBCipher
  match_examples:
  - name: declared shape
    code: |
      import 'package:pointycastle/pointycastle.dart' show ECBCipher;
      class ECBCipher { ECBCipher([dynamic input]); }
      void test() { var input = "x"; var result = ECBCipher(input); }
  description: "pointycastle ECBCipher - deterministic/leaks plaintext structure."

  imports:
  - pointycastle/pointycastle.dart
- id: dart.crypto.aes_mode_ecb
  enabled: true
  language: dart
  tag: weak-crypto
  category: source-independent
  severity: high
  packages: [encrypt]
  cwe: [CWE-327]
  match:
    kind: new
    callee:
      name: AES
  constraints:
  - keyword_arg_equals:
      name: mode
      value: AESMode.ecb
  match_examples:
  - name: ecb mode shape
    code: |
      import 'package:encrypt/encrypt.dart' show AES;
      class AES { AES([dynamic input, {dynamic mode}]); }
      void test(dynamic key) { var result = AES(key, mode: AESMode.ecb); }
  - name: cbc mode negative
    code: |
      import 'package:encrypt/encrypt.dart' show AES;
      class AES { AES([dynamic input, {dynamic mode}]); }
      void test(dynamic key) { var result = AES(key, mode: AESMode.cbc); }
    expect_no_match: true
  description: "encrypt package AES(mode: AESMode.ecb) - ECB mode leaks plaintext structure (identical blocks encrypt identically). The keyword-arg value is now captured whole (`AESMode.ecb`), so ECB is distinguished from CBC/CTR."
  imports:
  - encrypt/encrypt.dart
