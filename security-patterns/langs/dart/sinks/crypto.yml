# Dart weak-crypto sinks.
- id: dart.crypto.md5_convert
  enabled: true
  language: dart
  tag: weak-crypto
  severity: low
  packages: [crypto]
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      attribute: [md5, convert]
  match_examples:
  - name: declared shape
    code: |
      import 'package:crypto/crypto.dart';
      import 'package:crypto/crypto.dart';
      import 'package:crypto/crypto.dart';
      import 'package:crypto/crypto.dart';
      import 'package:crypto/crypto.dart'; // crypto
      void test() { var input = "x"; var amount = 1; md5.convert(input); }
  description: "package:crypto md5.convert — collision-broken hash."

  imports:
  - crypto/crypto.dart
