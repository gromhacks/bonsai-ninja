- id: dart.xss.innerhtml
  enabled: true
  language: dart
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: write
    target:
      regex: ^[^\.\s]+\.innerHtml$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: element innerhtml member write
    code: 'void test(el, input) { el.innerHtml = input; }

      '
  - name: local innerhtml variable negative
    code: 'void test(input) { var innerHtml = input; }

      '
    expect_no_match: true
  description: dart:html element.innerHtml = tainted.
- id: dart.xss.set_innerhtml
  enabled: true
  language: dart
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      name: setInnerHtml
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted set inner html
    code: 'void test(String input) { setInnerHtml(input); }

      '
  - name: literal set inner html negative
    code: 'void test() { setInnerHtml("<p>safe</p>"); }

      '
    expect_no_match: true
  description: Element.setInnerHtml with permissive validator.
- id: dart.xss.document_write
  enabled: true
  language: dart
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - document
      - write
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(String input) { var amount = 1; document.write(input); }
  - name: literal document write negative
    code: 'void test() { document.write("<p>safe</p>"); }

      '
    expect_no_match: true
  description: "document.write(taintedHtml) - writes unescaped attacker-controlled markup into the DOM."
