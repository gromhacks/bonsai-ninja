# Dart open-redirect.
- id: dart.open_redirect.shelf_response_found
  enabled: true
  language: dart
  tag: open-redirect
  severity: high
  packages: [shelf]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      attribute: [Response, found]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted found redirect url
    code: |
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      import 'package:shelf/shelf.dart';
      void test(String input) { Response.found(input); }
  - name: literal found redirect url negative
    code: |
      import 'package:shelf/shelf.dart';
      void test() { Response.found("/home"); }
    expect_no_match: true
  description: "Shelf Response.found(tainted URL)."

  imports:
  - shelf/shelf.dart
