# Dart LDAP-injection (dartdap / ldap_dart).
# Bare `search` / `query` are ubiquitous method names; packages guard is
# essential to keep these narrow.
- id: dart.ldap.dartdap_search
  enabled: true
  language: dart
  tag: ldap-injection
  severity: high
  packages: [dartdap, ldap_dart]
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.search$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted ldap filter
    code: |
      import 'package:dartdap/dartdap.dart';
      import 'package:dartdap/dartdap.dart';
      import 'package:dartdap/dartdap.dart';
      import 'package:dartdap/dartdap.dart';
      import 'package:dartdap/dartdap.dart';
      void test(String input) { connection.search(input); }
  - name: literal ldap filter negative
    code: |
      import 'package:dartdap/dartdap.dart';
      void test() { connection.search("(cn=safe)"); }
    expect_no_match: true
  description: "dartdap LdapConnection.search with tainted filter."

  imports:
  - dartdap/dartdap.dart
- id: dart.ldap.dartdap_search_ldap
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: dart.ldap.dartdap_search
  language: dart
  tag: ldap-injection
  severity: high
  packages: [dartdap, ldap_dart]
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.search$
  description: "Subsumed by dart.ldap.dartdap_search - same receiver-agnostic search shape and canonical package gate cover dartdap and ldap_dart."
- id: dart.ldap.dartdap_query
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  tag: ldap-injection
  severity: high
  packages: [dartdap, ldap_dart]
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      attribute: [connection, query]
  description: "Disabled - `query` overlaps SQL driver query shapes; enable as a semantic LdapConnection receiver rule once Dart receiver-type facts distinguish it from database Connection.query."
