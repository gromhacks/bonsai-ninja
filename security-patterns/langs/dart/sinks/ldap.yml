# Dart LDAP-injection (dartdap / ldap_dart).
# Bare `search` / `query` are ubiquitous method names; packages guard is
# essential to keep these narrow.
- id: dart.ldap.dartdap_search
  enabled: true
  language: dart
  tag: ldap-injection
  severity: high
  packages: [dartdap, ldap_dart]
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      name: search
      receiver_type_in: [LdapConnection, LDAPConnection]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted ldap filter
    code: |
      import 'package:dartdap/dartdap.dart';
      void test(LdapConnection connection, String input) { connection.search(input); }
  - name: literal ldap filter negative
    code: |
      import 'package:dartdap/dartdap.dart';
      void test(LdapConnection connection) { connection.search("(cn=safe)"); }
    expect_no_match: true
  - name: unrelated local search method is not LDAP
    code: |
      import 'package:dartdap/dartdap.dart';
      class LocalConnection { dynamic search(String value) => value; }
      void test(LocalConnection connection, String input) { connection.search(input); }
    expect_no_match: true
  description: "dartdap LdapConnection.search with tainted filter."

  imports:
  - dartdap/dartdap.dart
