# Dart dynamic-code / eval sinks.
- id: dart.eval.webview_run_javascript
  enabled: true
  language: dart
  tag: code-injection
  severity: critical
  packages: [webview_flutter]
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [controller, runJavaScript]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted javascript string
    code: |
      import 'package:webview_flutter/webview_flutter.dart';
      import 'package:webview_flutter/webview_flutter.dart';
      import 'package:webview_flutter/webview_flutter.dart';
      import 'package:webview_flutter/webview_flutter.dart';
      import 'package:webview_flutter/webview_flutter.dart';
      void test(String input) { controller.runJavaScript(input); }
  - name: literal javascript string negative
    code: |
      import 'package:webview_flutter/webview_flutter.dart';
      void test() { controller.runJavaScript("console.log('safe')"); }
    expect_no_match: true
  description: "webview_flutter WebViewController.runJavaScript(tainted). Signature is `runJavaScript(String)` - exactly one arg; bounds reject same-name decoys with different overload shapes."

  imports:
  - webview_flutter/webview_flutter.dart
