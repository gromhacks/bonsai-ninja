- id: dart.eval.isolate_spawn_uri
  enabled: true
  language: dart
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [Isolate, spawnUri]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      void test(Uri input) { Isolate.spawnUri(input); }
  - name: literal isolate uri negative
    code: |
      void test() { Isolate.spawnUri(Uri.parse("package:safe/main.dart")); }
    expect_no_match: true
  description: "Isolate.spawnUri(tainted URI) - loads arbitrary Dart script."

- id: dart.eval.expressions_new
  enabled: true
  language: dart
  tag: code-injection
  severity: high
  packages: [expressions]
  cwe: [CWE-94]
  match:
    kind: new
    callee:
      name: Expression
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted expression source
    code: |
      import 'package:expressions/expressions.dart';
      import 'package:expressions/expressions.dart';
      import 'package:expressions/expressions.dart';
      import 'package:expressions/expressions.dart';
      import 'package:expressions/expressions.dart';
      class Expression { Expression([dynamic input, {dynamic htmlEscapeValues}]); }
      void test(String input) { var result = Expression(input); }
  - name: literal expression source negative
    code: |
      import 'package:expressions/expressions.dart';
      class Expression { Expression([dynamic input, {dynamic htmlEscapeValues}]); }
      void test() { var result = Expression("1 + 1"); }
    expect_no_match: true
  description: "package:expressions Expression(tainted) - evaluated expression."

  imports:
  - expressions/expressions.dart
