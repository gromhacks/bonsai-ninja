- id: dart.eval.mirror_invoke
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: dart
  tag: code-injection
  severity: medium
  packages: ["dart:mirrors"]
  cwe: [CWE-94, CWE-470]
  match:
    kind: call
    callee:
      attribute: [instanceMirror, invoke]
  description: "Disabled - dart:mirrors InstanceMirror.invoke; flag only when method Symbol is tainted."

# Receiver-agnostic mirrors invoke. Inline `reflect(obj).invoke(...)`
# has no `instanceMirror` receiver name so the rule above misses it.
# Match `.invoke(...)` directly with a min-args=2 narrower (Symbol +
# args list) to skip same-name decoys (e.g. Function.invoke,
# arbitrary user methods named `invoke`).
- id: dart.eval.mirrors_invoke
  enabled: true
  language: dart
  tag: code-injection
  severity: critical
  packages: ["dart:mirrors"]
  cwe: [CWE-94, CWE-470]
  match:
    kind: call
    callee:
      name: invoke
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted mirror symbol
    code: |
      import 'dart:mirrors';
      void test(String args) { invoke(Symbol(args), []); }
  - name: literal mirror symbol negative
    code: |
      import 'dart:mirrors';
      void test(String args) { invoke(Symbol("run"), [args]); }
    expect_no_match: true
  description: "reflect(obj).invoke(Symbol(name), args) - dart:mirrors reflective dispatch with tainted method name = arbitrary method invocation (CWE-470 / CWE-94). Narrowed by `Symbol(...)` arg-0 shape."
