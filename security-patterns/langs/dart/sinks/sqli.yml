- id: dart.sqli.postgres_execute
  enabled: true
  language: dart
  tag: sql-injection
  severity: high
  packages: [postgres, sqlite3, mysql_client]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.execute$
      base_name_in:
      - connection
      - conn
      - db
      - database
      - session
      - ctx
      - c
      - stmt
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted postgres execute
    code: |
      import 'package:postgres/postgres.dart';
      void test(String input) { connection.execute(input); }
  - name: literal postgres execute negative
    code: |
      import 'package:postgres/postgres.dart';
      void test(String input) { connection.execute("SELECT * FROM users WHERE id = @id", parameters: {"id": input}); }
    expect_no_match: true
  description: "Dart driver Connection.execute (postgres / sqlite3 / mysql_client) with tainted SQL string - driver runs concatenated SQL. Use parameterised statements / placeholders. Subsumes dart.sqli.sqlite3_execute and dart.sqli.mysql_client_execute."
  aliases:
  - dart.sqli.sqlite3_execute
  - dart.sqli.mysql_client_execute

  imports:
  - postgres/postgres.dart
- id: dart.sqli.postgres_query
  enabled: true
  language: dart
  tag: sql-injection
  severity: high
  packages: [postgres, mysql1]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.query$
      base_name_in:
      - connection
      - conn
      - db
      - database
      - session
      - ctx
      - c
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted postgres query
    code: |
      import 'package:postgres/postgres.dart';
      void test(String input) { connection.query(input); }
  - name: literal postgres query negative
    code: |
      import 'package:postgres/postgres.dart';
      void test(String input) { connection.query("SELECT * FROM users WHERE id = @id", substitutionValues: {"id": input}); }
    expect_no_match: true
  description: "Dart driver Connection.query (postgres / mysql1) with tainted SQL string. Subsumes dart.sqli.mysql1_query."
  aliases:
  - dart.sqli.mysql1_query

  imports:
  - postgres/postgres.dart
