- id: dart.sqli.sqlite3_execute
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: dart.sqli.postgres_execute
  language: dart
  tag: sql-injection
  severity: high
  packages: [sqlite3]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.execute$
  description: "Subsumed by dart.sqli.postgres_execute - same receiver-agnostic regex covers all Dart SQL driver `Connection.execute` shapes."
