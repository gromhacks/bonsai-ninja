# Dart SQL-injection sinks.
- id: dart.sqli.sqflite_raw_query
  enabled: true
  language: dart
  tag: sql-injection
  severity: high
  packages: [sqflite]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: rawQuery
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted sqflite raw query
    code: |
      import 'package:sqflite/sqflite.dart';
      import 'package:sqflite/sqflite.dart';
      import 'package:sqflite/sqflite.dart';
      import 'package:sqflite/sqflite.dart';
      import 'package:sqflite/sqflite.dart';
      void test(String input) { rawQuery(input); }
  - name: literal sqflite raw query negative
    code: |
      import 'package:sqflite/sqflite.dart';
      void test(String input) { rawQuery("SELECT * FROM users WHERE id = ?", [input]); }
    expect_no_match: true
  description: "sqflite Database.rawQuery - concatenated SQL."

  imports:
  - sqflite/sqflite.dart
