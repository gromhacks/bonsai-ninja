# Dart NoSQL-injection sinks.
- id: dart.nosql.mongo_dart_find
  enabled: true
  language: dart
  tag: nosql-injection
  severity: high
  packages: [mongo_dart]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      name: find
      receiver_type_in: [DbCollection]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted mongo selector
    code: |
      import 'package:mongo_dart/mongo_dart.dart';
      void test(DbCollection collection, dynamic input) { collection.find(input); }
  - name: literal mongo selector negative
    code: |
      import 'package:mongo_dart/mongo_dart.dart';
      void test(DbCollection collection) { collection.find({"name": "safe"}); }
    expect_no_match: true
  - name: unrelated local find method is not mongo dart
    code: |
      import 'package:mongo_dart/mongo_dart.dart';
      class LocalCollection { dynamic find(dynamic value) => value; }
      void test(LocalCollection collection, dynamic input) { collection.find(input); }
    expect_no_match: true
  description: "mongo_dart DbCollection.find(selector)."

  imports:
  - mongo_dart/mongo_dart.dart
