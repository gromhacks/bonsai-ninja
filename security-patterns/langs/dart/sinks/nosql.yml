      index: 0
  match_examples:
  - name: tainted redis lua script
    code: |
      import 'package:redis/redis.dart';
      import 'package:redis/redis.dart';
      import 'package:redis/redis.dart';
      import 'package:redis/redis.dart';
      import 'package:redis/redis.dart'; // redis
      void test(String input) { redis.eval(input); }
  - name: literal redis lua script negative
    code: |
      import 'package:redis/redis.dart';
      void test() { redis.eval("return 1"); }
    expect_no_match: true
  description: "redis package Redis.eval — Lua injection."

  imports:
