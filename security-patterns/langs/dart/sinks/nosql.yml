- id: dart.nosql.redis_eval
  enabled: true
  language: dart
  tag: nosql-injection
  severity: high
  packages: [redis]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.eval$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted redis lua script
    code: |
      import 'package:redis/redis.dart';
      import 'package:redis/redis.dart'; // redis
      void test(String input) { redis.eval(input); }
  - name: literal redis lua script negative
    code: |
      import 'package:redis/redis.dart';
      void test() { redis.eval("return 1"); }
    expect_no_match: true
  description: "redis package Redis.eval - Lua injection."

  imports:
  - redis/redis.dart
- id: dart.nosql.realm_query_string
  enabled: true
  language: dart
  tag: nosql-injection
  severity: high
  packages: [realm]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.query$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted realm query
    code: |
      import 'package:realm/realm.dart';
      import 'package:realm/realm.dart'; // realm
      void test(String input) { realm.query(input); }
  - name: literal realm query negative
    code: |
      import 'package:realm/realm.dart';
      void test() { realm.query("name == $0"); }
    expect_no_match: true
  description: "Realm .query(String rqlFilter) - RQL injection when filter is concatenated with user input instead of using $0/$1 placeholders."
  imports:
  - realm/realm.dart
