# Dart NoSQL-injection sinks.
- id: dart.nosql.mongo_dart_find
  enabled: true
  language: dart
  tag: nosql-injection
  severity: high
  packages: [mongo_dart]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.find$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted mongo selector
    code: |
      import 'package:mongo_dart/mongo_dart.dart';
      import 'package:mongo_dart/mongo_dart.dart';
      import 'package:mongo_dart/mongo_dart.dart';
      import 'package:mongo_dart/mongo_dart.dart';
      import 'package:mongo_dart/mongo_dart.dart';
      void test(dynamic input) { collection.find(input); }
  - name: literal mongo selector negative
    code: |
      import 'package:mongo_dart/mongo_dart.dart';
      void test() { collection.find({"name": "safe"}); }
    expect_no_match: true
  description: "mongo_dart DbCollection.find(selector)."

  imports:
  - mongo_dart/mongo_dart.dart
