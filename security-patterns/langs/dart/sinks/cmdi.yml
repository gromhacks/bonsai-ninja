- id: dart.cmdi.process_runsync_shell_args
  enabled: true
  language: dart
  tag: command-injection
  severity: critical
  packages: [dart:io]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [Process, runSync]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: "^[\"'](?:/bin/)?(?:sh|bash)[\"']$"
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted explicit shell args
    code: |
      import 'dart:io';
      void test(List<String> args) { Process.runSync("sh", args); }
  - name: single quoted sh c with tainted command
    code: |
      import 'dart:io';
      void test(String host) { Process.runSync('sh', ['-c', 'ping ' + host]); }
    expect_match_text: [Process.runSync]
  - name: literal explicit shell args negative
    code: |
      import 'dart:io';
      void test() { Process.runSync("sh", ["-c", "whoami"]); }
    expect_no_match: true
  - name: single quoted literal shell args negative
    code: |
      import 'dart:io';
      void test() { Process.runSync('sh', ['-c', 'whoami']); }
    expect_no_match: true
  description: "Process.runSync(\"sh\", tainted_argv) - synchronous explicit shell invocation interprets attacker-controlled command strings."
