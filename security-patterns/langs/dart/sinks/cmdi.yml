# Dart command-injection sinks (dart:io Process + shell wrappers).
- id: dart.cmdi.process_run
  enabled: true
  language: dart
  tag: command-injection
  severity: high
  category: process-exec
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [Process, run]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted executable
    code: |
      import 'dart:io';
      void test(String input) { Process.run(input, []); }
  - name: literal executable negative
    code: |
      import 'dart:io';
      void test(String input) { Process.run("echo", [input]); }
    expect_no_match: true
  description: "Process.run(tainted_executable, argv) - attacker-controlled executable paths can spawn unintended programs. Shell-command string injection is covered by dart.cmdi.process_run_in_shell."

- id: dart.cmdi.process_run_in_shell
  aliases:
  - dart.cmdi.process_run_sh_c
  enabled: true
  language: dart
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [Process, run]
  constraints:
  - keyword_arg_equals:
      name: runInShell
      value: "true"
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted shell argument list
    code: |
      void test(String input) { Process.run("sh", ["-c", input], runInShell: true); }
  - name: literal shell argument list negative
    code: |
      void test() { Process.run("sh", ["-c", "whoami"], runInShell: true); }
    expect_no_match: true
  - name: argv mode negative
    code: |
      void test(String input) { Process.run("sh", ["-c", input], runInShell: false); }
    expect_no_match: true
  description: "Process.run(runInShell: true) - passes command arguments through /bin/sh or cmd.exe; metacharacters in the argument list execute arbitrary commands. Also covers merged aliases: dart.cmdi.process_run_sh_c."

