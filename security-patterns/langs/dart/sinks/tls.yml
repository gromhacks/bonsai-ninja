# Dart TLS misconfig.
- id: dart.tls.disable_verify_bad_cert_callback
  enabled: true
  language: dart
  tag: weak-tls
  category: source-independent
  severity: high
  cwe: [CWE-295]
  packages: ["dart:io"]
  imports: ["dart:io"]
  match:
    kind: write
    target:
      regex: '^[A-Za-z_][A-Za-z0-9_]*\.badCertificateCallback$'
      receiver_type_in: [HttpClient, dart.io.HttpClient]
  constraints:
  - arg_inline_callback_returns_static:
      index: 0
      value: {kind: boolean, value: true}
  match_examples:
  - name: typed HTTP client callback always accepts
    code: |
      import 'dart:io';
      void configure(HttpClient client) {
        client.badCertificateCallback = (certificate, host, port) => true;
      }
    expect_match_text: [client.badCertificateCallback]
  - name: typed HTTP client callback rejects
    code: |
      import 'dart:io';
      void configure(HttpClient client) {
        client.badCertificateCallback = (certificate, host, port) => false;
      }
    expect_no_match: true
  - name: typed HTTP client callback is conditional
    code: |
      import 'dart:io';
      void configure(HttpClient client, bool allow) {
        client.badCertificateCallback =
          (certificate, host, port) => allow ? true : false;
      }
    expect_no_match: true
  - name: named HTTP client callback remains unproven
    code: |
      import 'dart:io';
      bool validate(X509Certificate certificate, String host, int port) => true;
      void configure(HttpClient client) { client.badCertificateCallback = validate; }
    expect_no_match: true
  - name: unrelated callback member collision
    code: |
      import 'dart:io';
      class LocalClient { dynamic badCertificateCallback; }
      void configure(LocalClient client) {
        client.badCertificateCallback = (certificate, host, port) => true;
      }
    expect_no_match: true
  - name: local HTTP client type collision
    code: |
      import 'dart:io';
      class HttpClient { dynamic badCertificateCallback; }
      void configure(HttpClient client) {
        client.badCertificateCallback = (certificate, host, port) => true;
      }
    expect_no_match: true
  description: "HttpClient.badCertificateCallback = (cert, host, port) => true - accepts any certificate."
