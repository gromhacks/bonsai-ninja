# dart CORS misconfiguration sinks (T403).
- id: dart.cors.shelf_cors_headers_wildcard
  enabled: true
  language: dart
  tag: cors
  category: source-independent
  severity: medium
  packages: [shelf_cors_headers]
  cwe: [CWE-942]
  match:
    kind: call
    callee:
      name: corsHeaders
  constraints:
  - any_arg_matches_regex: '\*'
  match_examples:
  - name: wildcard origin header
    code: |
      import 'package:shelf_cors_headers/shelf_cors_headers.dart';
      import 'package:shelf_cors_headers/shelf_cors_headers.dart';
      import 'package:shelf_cors_headers/shelf_cors_headers.dart';
      import 'package:shelf_cors_headers/shelf_cors_headers.dart';
      import 'package:shelf_cors_headers/shelf_cors_headers.dart'; // shelf_cors_headers
      void test() { corsHeaders({"Access-Control-Allow-Origin": "*"}); }
    expect_match_text: [corsHeaders]
  - name: restricted origin header negative
    code: |
      import 'package:shelf_cors_headers/shelf_cors_headers.dart';
      void test() { corsHeaders({"Access-Control-Allow-Origin": "https://app.example.com"}); }
    expect_no_match: true
  description: |-
    shelf_cors_headers with Access-Control-Allow-Origin: * - wildcard origin allows any site to read authenticated responses. The `any_arg_matches_regex: '\*'` gate fires only when a wildcard origin is configured, so explicitly-restricted origins stay quiet.
  imports:
  - shelf_cors_headers/shelf_cors_headers.dart
