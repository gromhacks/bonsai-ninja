- id: dart.redos.regexp_constructor
  enabled: true
  language: dart
  tag: redos
  severity: medium
  packages: [dart:core]
  cwe: [CWE-1333]
  match:
    kind: call
    callee:
      name: RegExp
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted regexp pattern
    code: |
      import 'package:dart_core/dart_core.dart';
      import 'package:dart_core/dart_core.dart';
      import 'package:dart_core/dart_core.dart';
      import 'package:dart_core/dart_core.dart';
      void test(String input) { RegExp(input); }
  - name: literal regexp pattern negative
    code: |
      import 'package:dart_core/dart_core.dart';
      void test() { RegExp(r"^[a-z]+$"); }
    expect_no_match: true
  description: "RegExp(tainted_pattern) — attacker-controlled regular expressions can trigger catastrophic backtracking."
  imports:
  - dart_core
  - dart_core/dart_core.dart
