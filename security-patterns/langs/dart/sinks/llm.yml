# Dart LLM sinks (OpenAI / Anthropic / Bedrock client wrappers).
- id: dart.llm.dart_openai_chat_create
  enabled: true
  language: dart
  tag: web-llm
  severity: medium
  packages: [dart_openai]
  imports:
  - dart_openai
  - dart_openai/dart_openai.dart
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      attribute: [OpenAI, instance, chat, create]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: dart openai chat create
    code: |
      import 'package:dart_openai/dart_openai.dart';
      import 'package:dart_openai/dart_openai.dart';
      import 'package:dart_openai/dart_openai.dart';
      import 'package:dart_openai/dart_openai.dart';
      import 'package:dart_openai/dart_openai.dart'; // dart_openai
      void test(dynamic input) { OpenAI.instance.chat.create(input); }
    expect_match_text: [OpenAI.instance.chat.create]
  - name: literal dart openai chat create negative
    code: |
      import 'package:dart_openai/dart_openai.dart';
      void test() { OpenAI.instance.chat.create("summarize safe text"); }
    expect_no_match: true
  description: "dart_openai OpenAI.instance.chat.create - tainted prompt content reaches an LLM instruction / tool surface."

- id: dart.llm.openai_dart_create_chat_completion
