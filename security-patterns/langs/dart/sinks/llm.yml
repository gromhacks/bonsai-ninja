  tag: web-llm
  severity: medium
  packages: [openai_dart]
  imports:
  - openai_dart
  - openai_dart/openai_dart.dart
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      name: createChatCompletion
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: dart openai create chat completion
    code: |
      import 'package:openai_dart/openai_dart.dart';
      import 'package:openai_dart/openai_dart.dart';
      import 'package:openai_dart/openai_dart.dart';
      import 'package:openai_dart/openai_dart.dart';
      import 'package:openai_dart/openai_dart.dart';
      void test(dynamic input) { createChatCompletion(input); }
