- id: dart.llm.bedrock_invoke_model
  enabled: true
  language: dart
  tag: web-llm
  severity: medium
  packages: [aws_bedrock_runtime_api]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      name: invokeModel
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: dart bedrock invoke model
    code: |
      import 'package:aws_bedrock_runtime_api/aws_bedrock_runtime_api.dart';
      import 'package:aws_bedrock_runtime_api/aws_bedrock_runtime_api.dart';
      import 'package:aws_bedrock_runtime_api/aws_bedrock_runtime_api.dart';
      import 'package:aws_bedrock_runtime_api/aws_bedrock_runtime_api.dart';
      import 'package:aws_bedrock_runtime_api/aws_bedrock_runtime_api.dart';
      void test(dynamic input) { invokeModel(input); }
    expect_match_text: [invokeModel]
  - name: literal dart bedrock invoke model negative
    code: |
      import 'package:aws_bedrock_runtime_api/aws_bedrock_runtime_api.dart';
      void test() { invokeModel("safe prompt"); }
    expect_no_match: true
  description: "Bedrock Runtime invokeModel - tainted request body steers the underlying foundation model."
  imports:
  - aws_bedrock_runtime_api/aws_bedrock_runtime_api.dart
