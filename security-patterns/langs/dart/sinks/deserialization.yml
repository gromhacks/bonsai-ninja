# Dart deserialization sinks — yaml + protobuf + json-with-reviver.
#
# Pure Dart doesn't have a gadget-chain deserialization primitive
# like pickle or Java's ObjectInputStream — `jsonDecode` is
# type-bounded. The real risks are:
#   - package:yaml, which supports type tags and can instantiate
#     unexpected Dart types on tainted input.
#   - JSON reviver callbacks that call arbitrary functions per
#     decoded value.
#   - protobuf generic message parsing where the schema is derived
#     from tainted input.

- id: dart.deser.json_decode
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  tag: insecure-deserialization
  severity: low
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: jsonDecode
  description: "Disabled — jsonDecode without a reviver is type-bounded. Enable when the codebase passes `reviver:` and the reviver is attacker-influenceable."

- id: dart.deser.json_decode_reviver
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  tag: insecure-deserialization
  severity: medium
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: jsonDecode
  description: "Disabled — jsonDecode(json, reviver:) with a reviver can dispatch into arbitrary code paths, but the bonsai engine doesn't yet model `keyword_arg_present` narrowing. Enable manually after reviewer confirms `reviver:` is passed."

- id: dart.deser.json_utf8_decoder
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  tag: insecure-deserialization
  severity: low
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [JsonUtf8Decoder, convert]
  description: "Disabled — JsonUtf8Decoder is type-bounded; listed so auditors can trace UTF-8 JSON ingestion paths."

- id: dart.deser.yaml_load
  enabled: true
  language: dart
  tag: insecure-deserialization
  severity: high
  packages: [yaml]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: loadYaml
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted yaml document
    code: |
      import 'package:yaml/yaml.dart';
      import 'package:yaml/yaml.dart';
      import 'package:yaml/yaml.dart';
      import 'package:yaml/yaml.dart';
      import 'package:yaml/yaml.dart'; // yaml
      void test(String input) { loadYaml(input); }
  - name: literal yaml document negative
    code: |
      import 'package:yaml/yaml.dart';
      void test() { loadYaml("name: safe"); }
    expect_no_match: true
  description: "yaml.loadYaml — parses a YAML document; tainted input with type tags (!!perl/code, !!python/object) or aliases can materialise unexpected types / cause billion-laughs DoS."

  imports:
  - yaml/yaml.dart
- id: dart.deser.yaml_load_all
  enabled: true
  language: dart
  tag: insecure-deserialization
  severity: high
  packages: [yaml]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: loadYamlStream
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted yaml stream
    code: |
      import 'package:yaml/yaml.dart';
      import 'package:yaml/yaml.dart';
      import 'package:yaml/yaml.dart';
      import 'package:yaml/yaml.dart';
      import 'package:yaml/yaml.dart'; // yaml
      void test(String input) { loadYamlStream(input); }
  - name: literal yaml stream negative
    code: |
      import 'package:yaml/yaml.dart';
      void test() { loadYamlStream("---\nname: safe\n"); }
    expect_no_match: true
  description: "yaml.loadYamlStream — multi-doc parser; tainted stream has the same type-tag and alias-bomb risks as loadYaml."

  imports:
  - yaml/yaml.dart
- id: dart.deser.yaml_load_safe
  enabled: false
  disabled_reason:
    code: over-broad
  language: dart
  tag: insecure-deserialization
  severity: low
  packages: [yaml]
  cwe: [CWE-502]
  match:
