# Dart deserialization boundaries with application-supplied interpretation.
# package:yaml does not instantiate Python/Perl objects; parsing alone is not
# evidence of unsafe object construction. Resource limits are a separate concern.

- id: dart.deser.protobuf_message_merge
  enabled: true
  language: dart
  tag: insecure-deserialization
  severity: medium
  packages: [protobuf]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [GeneratedMessage, mergeFromBuffer]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted protobuf bytes
    code: |
      import 'package:protobuf/protobuf.dart';
      void test(List<int> input) { GeneratedMessage.mergeFromBuffer(input); }
  - name: literal protobuf bytes negative
    code: |
      import 'package:protobuf/protobuf.dart';
      void test() { GeneratedMessage.mergeFromBuffer([8, 1]); }
    expect_no_match: true
  description: "protobuf GeneratedMessage.mergeFromBuffer - when the message type is derived from tainted input, attacker chooses which message gets instantiated."

  imports:
  - protobuf/protobuf.dart
- id: dart.deser.protobuf_any_unpack
  enabled: true
  language: dart
  tag: insecure-deserialization
  severity: high
  packages: [protobuf]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      regex: "(?:^|\\.)unpackInto$"
  constraints:
  - receiver_type_in: [Any]
  - receiver_tainted: true
  match_examples:
  - name: tainted protobuf Any receiver
    code: |
      import 'package:protobuf/protobuf.dart';
      void test(Any input, GeneratedMessage target) {
        input.unpackInto(target);
      }
    expect_match_text: [input.unpackInto]
  - name: clean protobuf Any receiver
    code: |
      import 'package:protobuf/protobuf.dart';
      void test(GeneratedMessage target) {
        Any().unpackInto(target);
      }
    expect_no_match: true
  description: "protobuf Any.unpackInto(target) dispatches a runtime-selected embedded message type. The Any receiver, rather than the destination argument, is the attacker-controlled deserialization payload."

  imports:
  - protobuf/protobuf.dart
- id: dart.deser.msgpack_decode
  enabled: true
  language: dart
  tag: insecure-deserialization
  severity: medium
  packages: [msgpack_dart]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [Deserializer, decode]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted msgpack bytes
    code: |
      import 'package:msgpack_dart/msgpack_dart.dart';
      import 'package:msgpack_dart/msgpack_dart.dart'; // msgpack_dart
      void test(List<int> input) { Deserializer.decode(input); }
  - name: literal msgpack bytes negative
    code: |
      import 'package:msgpack_dart/msgpack_dart.dart';
      void test() { Deserializer.decode([0x81, 0xa4, 0x6e, 0x61, 0x6d, 0x65]); }
    expect_no_match: true
  description: "msgpack_dart Deserializer.decode - tainted MsgPack bytes can be crafted to trigger nested-type instantiation and resource exhaustion."

  imports:
  - msgpack_dart/msgpack_dart.dart
- id: dart.deser.bson_decode
  enabled: true
  language: dart
  tag: insecure-deserialization
  severity: medium
  packages: [bson]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [BSON, deserialize]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted bson bytes
    code: |
      import 'package:bson/bson.dart';
      import 'package:bson/bson.dart'; // bson
      void test(List<int> input) { BSON.deserialize(input); }
  - name: literal bson bytes negative
    code: |
      import 'package:bson/bson.dart';
      void test() { BSON.deserialize([5, 0, 0, 0, 0]); }
    expect_no_match: true
  description: "bson.BSON.deserialize - tainted BSON bytes with cyclic references or oversized nesting trigger memory exhaustion / stack blow-up."
  imports:
  - bson/bson.dart
