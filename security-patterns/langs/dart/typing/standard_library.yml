# Non-finding Dart core-library summaries. Receiver constraints are compiler
# facts; same-spelled methods on application classes do not acquire these
# transfer semantics. Return typing uses exact call identities so later calls
# in a flattened selector chain can consume the prior result safely.
- id: dart.typing.list_add_all_mutates_receiver
  enabled: true
  language: dart
  match:
    kind: call
    callee: {name: addAll}
  constraints:
  - receiver_type_in: [List]
  taint_semantics:
    taint_receiver_from_args: true
  match_examples:
  - name: Dart List addAll stores iterable elements in the list
    code: |
      void collect(String input) {
        final values = <String>[]..addAll([input]);
      }
    expect_match_text: [values.addAll]
  - name: same-spelled application method is not Dart List
    code: 'class Bag { void addAll(Object x) {} } void collect(Bag bag, Object x) { bag.addAll(x); }'
    expect_no_match: true
  description: "Dart List.addAll stores argument elements in compiler-typed receiver state. Typing-only transfer summary; never a finding."

- id: dart.typing.iterable_map_result
  enabled: true
  language: dart
  returns_type: Iterable
  match:
    kind: call
    callee: {name: map}
  constraints:
  - receiver_type_in: [Iterable, List, Set]
  taint_semantics: {call_result_passthrough_receiver: true}
  match_examples:
  - name: Dart Iterable map derives its result from receiver elements
    code: 'Iterable<String> transform(List<String> values) => values.map((value) => value.trim());'
    expect_match_text: [values.map]
  - name: unrelated map method is not an Iterable transfer
    code: 'class Mapper { Object map(Object f) => f; } Object transform(Mapper m, Object f) => m.map(f);'
    expect_no_match: true
  description: "Dart Iterable.map returns an iterable derived from receiver elements. Typing-only transfer summary; never a finding."

