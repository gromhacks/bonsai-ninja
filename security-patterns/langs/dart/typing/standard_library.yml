- id: dart.typing.string_trim
  enabled: true
  language: dart
  returns_type: String
  match: {kind: call, callee: {name: trim}}
  constraints:
  - receiver_type_in: [String]
  taint_semantics: {call_result_passthrough_receiver: true}
  match_examples:
  - name: Dart String trim preserves value provenance
    code: 'String normalize(String input) => input.trim();'
    expect_match_text: [input.trim]
  - name: same-spelled application method is not Dart String
    code: 'class Token { Token trim() => this; } Token normalize(Token input) => input.trim();'
    expect_no_match: true
  description: "Dart String.trim returns a String derived from the receiver. Typing-only transfer summary; never a finding."

