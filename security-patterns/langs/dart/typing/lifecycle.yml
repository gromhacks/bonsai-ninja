- id: dart.typing.lifecycle_closed_receiver
  enabled: true
  language: dart
  match: { kind: call, callee: { name: close } }
  lifecycle_transition:
    state: closed
    binding: { kind: receiver }
  match_examples:
  - name: close changes the receiver state
    code: 'void f(dynamic sink) { sink.close(); }'
    expect_match_text: [sink.close]
  description: "Dart close moves the receiver to closed. Typing-only; never a finding."

