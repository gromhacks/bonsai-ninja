- id: dart.sanitizer.bcrypt_checkpw
  enabled: true
  language: dart
  tag: auth-sanitizer
  packages: [bcrypt, dbcrypt]
  match:
    kind: call
    callee:
      attribute: [BCrypt, checkpw]
  constraints:
  - min_args: 2
  match_examples:
  - name: bcrypt checkpw verify
    code: |
      import 'package:bcrypt/bcrypt.dart';
      void test(String password, String hash) { BCrypt.checkpw(password, hash); }
    expect_match_text: [BCrypt.checkpw]
  - name: bcrypt checkpw negative constraint boundary
    code: "import 'package:bcrypt/bcrypt.dart';\nvoid test() { BCrypt.checkpw(); }\n"
    expect_no_match: true
  description: "package:bcrypt BCrypt.checkpw(password, hash) - constant-time-ish bcrypt password verification; the safe credential-check primitive."

  imports:
  - bcrypt/bcrypt.dart
- id: dart.sanitizer.starts_with_same_origin
  enabled: true
  language: dart
  tag: same-origin-path
  match:
    kind: call
    callee:
      name: startsWith
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^"/[^"]*"$'
  match_examples:
  - name: startsWith local path
    code: |
      void test(String target) { target.startsWith("/app/"); }
    expect_match_text: [target.startsWith]
  - name: startsWith local path negative constraint boundary
    code: "void test(String target) { target.startsWith(); }\n"
    expect_no_match: true
  description: "String.startsWith('/...') - same-origin redirect/path guard for slash-rooted local paths."

- id: dart.sanitizer.xml_declaration_rejection
  enabled: true
  language: dart
  tag: xxe-sanitizer
  match:
    kind: call
    callee:
      name: contains
  constraints:
  - receiver_type_in: [String]
  - any_arg_matches_regex: '(?i)^["'']<!\s*(?:DOCTYPE|ENTITY)'
  analysis_semantics:
    sanitizer_guard:
      use_receiver: true
      require_terminal_rejection: true
      accepted_predicate_value: false
  match_examples:
  - name: XML declaration rejection predicate
    code: |
      void parse(String input) {
        if (input.contains('<!DOCTYPE') || input.contains('<!ENTITY')) {
          throw FormatException('XML declarations are not accepted');
        }
        consume(input);
      }
    expect_match_text: [input.contains]
  - name: unrelated substring predicate is not an XML declaration guard
    code: |
      void parse(String input) {
        if (input.contains('note')) throw FormatException('bad note');
        consume(input);
      }
    expect_no_match: true
  - name: same method on a non-string receiver is not an XML declaration guard
    code: |
      class Collection {
        bool contains(String value) => true;
      }
      void parse(Collection input) {
        if (input.contains('<!DOCTYPE')) throw FormatException('rejected');
        consume(input);
      }
    expect_no_match: true
  description: "A terminal branch rejecting XML DOCTYPE or ENTITY declarations before parsing prevents entity-expansion input from reaching the parser."

- id: dart.sanitizer.validators_matches_full
  enabled: true
  language: dart
  tag: regex-validate
  packages: [validators]
  match:
    kind: call
    callee:
      name: matches
  constraints:
  - any_arg_matches_regex: "\\^.*\\$"
  match_examples:
  - name: anchored validators matches
    code: |
      import 'package:validators/validators.dart';
      void test(String input) { matches(input, r'^[a-z0-9_-]+$'); }
    expect_match_text: [matches]
  - name: anchored validators matches negative constraint boundary
    code: |
      import 'package:validators/validators.dart';
      void test(String input) { matches(); }
    expect_no_match: true
  description: "package:validators matches(input, anchoredPattern) - full-string UUID/slug-style regex validation."

  imports:
  - validators/validators.dart
- id: dart.sanitizer.raw_query_bind_args
  enabled: true
  language: dart
  tag: db-bind-parameter
  packages: [sqflite]
  match:
    kind: call
    callee:
      regex: "(^|\\.)raw(Query|Insert|Update|Delete)$"
  constraints:
  - min_args: 2
  match_examples:
  - name: sqflite rawQuery bind args
    code: |
      import 'package:sqflite/sqflite.dart';
      void test(db, String input) { db.rawQuery("select * from users where name = ?", [input]); }
    expect_match_text: [db.rawQuery]
  description: "sqflite rawQuery/rawInsert/rawUpdate/rawDelete with a second positional arguments list - binds placeholder
    values instead of SQL concatenation."

  imports:
  - sqflite/sqflite.dart
- id: dart.sanitizer.replace_all_char_allowlist
  enabled: true
  language: dart
  tag: char-allowlist
  match:
    kind: call
    callee:
      name: replaceAll
  constraints:
  - any_arg_matches_regex: "\\[\\^[^\\]]+\\]"
  - any_arg_matches_regex: '^""$'
  match_examples:
  - name: strip non slug chars
    code: |
      void test(String input) { input.replaceAll(RegExp(r'[^A-Za-z0-9_-]'), ""); }
    expect_match_text: [input.replaceAll]
  - name: strip non slug chars negative constraint boundary
    code: "void test(String input) { input.replaceAll(); }\n"
    expect_no_match: true
  description: "String.replaceAll(RegExp(r'[^safe]'), '') - strips characters outside a safe allowlist."

# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) - taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: dart.passthrough.uri_decode_component
  enabled: true
  language: dart
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [Uri, decodeComponent]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: declared shape
    code: |
      void test() { var input = "x"; var amount = 1; Uri.decodeComponent(input); }
    expect_match_text: [Uri.decodeComponent]
  description: "Uri.decodeComponent(s) - preserves taint."
- id: dart.passthrough.uri_parse
  enabled: true
  language: dart
  tag: passthrough-transform
  match:
    kind: call
    callee:
      attribute: [Uri, parse]
      binding_origin: runtime-global
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: SDK URI parsing preserves attacker-controlled components
    code: |
      Uri parsed(String input) => Uri.parse(input);
    expect_match_text: [Uri.parse]
  - name: same-spelled local class is not the SDK URI provider
    code: |
      class Uri {
        static String parse(String input) => "fixed";
      }
      String parsed(String input) => Uri.parse(input);
    expect_no_match: true
  description: "Uri.parse(s) constructs a URI while preserving attacker control over its parsed components."
- id: dart.passthrough.json_decode
  enabled: true
  language: dart
  tag: passthrough-decode
  packages: ["dart:convert"]
  imports: ["dart:convert"]
  match:
    kind: call
    callee:
      name: jsonDecode
      binding_origin: imported
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: imported JSON decoder preserves attacker-controlled values
    code: |
      import 'dart:convert';
      dynamic decode(String input) => jsonDecode(input);
    expect_match_text: [jsonDecode]
  - name: local same-named decoder is not the SDK decoder
    code: |
      import 'dart:convert';
      dynamic jsonDecode(String input) => {'fixed': true};
      dynamic decode(String input) => jsonDecode(input);
    expect_no_match: true
  description: "dart:convert jsonDecode parses attacker-controlled JSON into values that remain attacker-controlled; it preserves taint rather than sanitizing."
- id: dart.passthrough.uri_decode_full
  enabled: true
  language: dart
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [Uri, decodeFull]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: declared shape
    code: |
      void test() { var input = "x"; var amount = 1; Uri.decodeFull(input); }
    expect_match_text: [Uri.decodeFull]
  description: "Uri.decodeFull(s) - preserves taint."

- id: dart.passthrough.mirrors_symbol
  enabled: true
  language: dart
  tag: passthrough-transform
  packages: ["dart:mirrors"]
  imports: ["dart:mirrors"]
  match:
    kind: call
    callee:
      name: Symbol
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: mirror symbol preserves dynamic name
    code: |
      import 'dart:mirrors';
      void test(String input) { Symbol(input); }
    expect_match_text: [Symbol]
  description: "dart:mirrors Symbol(name) preserves attacker control in the reflective name value."

# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: dart.csrf.shelf_csrf
  enabled: true
  language: dart
  tag: csrf-protect
  match:
    kind: call
    callee:
      name: csrfProtect
  match_examples:
  - name: declared shape
    code: |
      void test() { var input = "x"; var amount = 1; csrfProtect(input); }
    expect_match_text: [csrfProtect]
  description: "shelf_csrf csrfProtect middleware - Dart server-side CSRF enforcement."

# Cookie-secure sanitizers (T402). Cookie-set calls with
# httpOnly + secure flags are the SAFE shape; reviewer
# enumerates with `security sanitizers --tag cookie-secure`
# and audits routes that set cookies WITHOUT them.
- id: dart.cookie.cookie_httponly_secure
  enabled: true
  language: dart
  tag: cookie-secure
  match:
    kind: call
    callee:
      attribute: [Cookie, httpOnly]
  constraints:
  - any_arg_matches_regex: |-
      true
  match_examples:
  - name: declared shape
    code: |
      void test() { var input = "x"; var amount = 1; Cookie.httpOnly(true); }
    expect_match_text: [Cookie.httpOnly]
  - name: declared shape negative constraint boundary
    code: "void test() { var input = \"x\"; var amount = 1; Cookie.httpOnly(); }\n"
    expect_no_match: true
  description: "dart:io Cookie httpOnly = true; secure = true."
