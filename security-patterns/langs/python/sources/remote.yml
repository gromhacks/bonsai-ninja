- id: python.graphql.graphene_resolver_kwargs
  enabled: true
  language: python
  trust: remote
  tag: graphql-input
  payload_types: [graphql]
  frameworks: [graphene, ariadne]
  packages: [graphene, ariadne]
  match:
    kind: param
    target:
      name: kwargs
      in_method: [resolve, resolver]
      in_method_prefix: [resolve_]
  match_examples:
  - name: graphene resolver kwargs
    code: |
      import graphene
      def resolve_user(parent, info, **kwargs):
          return kwargs
    expect_match_text: [kwargs]
  - name: ordinary kwargs helper negative
    code: |
      import graphene
      def helper(**kwargs):
          return kwargs
    expect_no_match: true
  description: "Graphene resolver resolve_* **kwargs - client-supplied GraphQL field arguments, narrowed by the compiler-declared resolver method name."

- id: python.graphql.graphene_resolver_field_arg
  enabled: true
  language: python
  trust: remote
  tag: graphql-input
  payload_types: [graphql]
  frameworks: [graphene, ariadne]
  packages: [graphene, ariadne]
  imports: [graphene, ariadne]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_method: [resolve, resolve_field, resolver]
      in_method_prefix: [resolve_]
      param_index_in: [2]
      base_name_not_in: [args, kwargs]
  match_examples:
  - name: graphene resolver named field argument
    code: |
      import graphene
      def resolve_products_by_name(root, info, name):
          return name
    expect_match_text: [name]
  - name: ariadne resolver named field argument
    code: |
      import ariadne
      def resolve_product(root, info, sku):
          return sku
    expect_match_text: [sku]
  - name: resolver field argument wrong position negative
    code: |
      import graphene
      def resolve_products_by_name(name, info):
          return name
    expect_no_match: true
  - name: non resolver helper field argument negative
    code: |
      import graphene
      def helper(root, info, name):
          return name
    expect_no_match: true
  description: "Graphene/Ariadne resolver named field argument at position 2 - client-supplied GraphQL field arguments such as `def resolve_user(root, info, id)`. Excludes the dedicated `args`/`kwargs` resolver shapes so example replay attributes those to their narrower rules."

- id: python.graphql.graphene_resolver_args
  enabled: true
  language: python
  trust: remote
  tag: graphql-input
  payload_types: [graphql]
  frameworks: [graphene, ariadne]
  packages: [graphene, ariadne]
  match:
    kind: read
    target:
      name: args
      in_method: [resolve, resolve_field, resolver]
      in_method_prefix: [resolve_]
      base_name_in: [args]
      base_param_index_in: [2]
  match_examples:
  - name: ariadne resolver args
    code: |
      import graphene
      def resolve_user(obj, info, args):
          return args
    expect_match_text: [args]
  - name: generated resolver field args
    code: |
      import graphene
      def resolve_products(obj, info, args):
          return args
    expect_match_text: [args]
  - name: non resolver args helper negative
    code: |
      import graphene
      def helper(args, other):
          return args
    expect_no_match: true
  - name: resolver shaped helper wrong args position negative
    code: |
      import graphene
      def resolve_products(args, other):
          return args
    expect_no_match: true
  - name: graphene resolver indexed args field
    code: |
      import graphene
      def resolve_user(parent, info, args):
          return args["filter"]
    expect_match_text: [args]
  - name: ariadne resolver indexed args field
    code: |
      import ariadne
      def resolve_products(obj, info, args):
          return args["query"]
    expect_match_text: [args]
  - name: non resolver indexed args helper negative
    code: |
      import graphene
      def helper(args, other):
          return args["filter"]
    expect_no_match: true
  - name: resolver indexed args wrong position negative
    code: |
      import graphene
      def resolve_products(args, other):
          return args["filter"]
    expect_no_match: true
  description: "GraphQL resolver `args` reads in Graphene/Ariadne-style handlers - field arguments supplied by the client. Resolver-name scoping and third-parameter position keep ordinary helpers named `args` quiet while covering indexed reads like args[\"filter\"]."
