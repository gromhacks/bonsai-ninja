    expect_no_match: true
  - name: resolver shaped helper wrong args position negative
    code: |
      import graphene
      def resolve_products(args, other):
          return args
    expect_no_match: true
  description: "GraphQL resolver `args` parameter in Graphene/Ariadne-style handlers — field arguments supplied by the client. Resolver-name scoping keeps ordinary helpers named `args` quiet."
