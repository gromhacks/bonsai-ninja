- id: python.fastapi.path_param_marker
  enabled: true
  language: python
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [path]
  frameworks: [fastapi]
  packages: [fastapi]
  match:
    kind: param
    target:
      annotation: Path
      default_call: Path
  match_examples:
  - name: FastAPI path parameter marker
    code: |
      from fastapi import FastAPI, Path
      app = FastAPI()
      @app.get("/items/{item_id}")
      def read_item(item_id: str = Path(...)):
          return item_id
    expect_match_text: [item_id]
  - name: unrelated default factory is not a path parameter
    code: |
      from fastapi import FastAPI
      def PathSetting(): return "local"
      def helper(item_id: str = PathSetting()): return item_id
    expect_no_match: true
  - name: local Path function shadows the FastAPI marker
    code: |
      from fastapi import FastAPI, Path
      app = FastAPI()
      def Path(value): return value
      def helper(item_id: str = Path("local")): return item_id
    expect_no_match: true
  description: "FastAPI `Path(...)` parameter binder - URL path value."

