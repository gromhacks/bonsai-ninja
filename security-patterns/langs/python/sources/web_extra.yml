# Additional web-framework remote sources that complement
# remote.yml. These all use attribute-chain receivers (or call
# attribute chains) so they avoid bare-name false positives.

# ---------------------------------------------------------------------------
# Flask
# ---------------------------------------------------------------------------

- id: python.flask.request_get_json
  enabled: true
  language: python
  trust: remote
  tag: http-input
  payload_types: [json]
  frameworks: [flask, google-cloud-functions]
  packages: [flask, functions_framework]
  match:
    kind: call
    callee:
      attribute: [request, get_json]
  constraints:
  - max_args: 3
  match_examples:
  - name: flask request get json
    code: |
      import flask
      def example(user_input):
          return request.get_json(user_input)
    expect_match_text: [request.get_json]
  - name: google cloud functions flask request json
    code: |
      import flask
      def gcf_handler(request):
          return request.get_json(silent=True)
    expect_match_text: [request.get_json]
  description: "Flask / Google Cloud Functions request.get_json() — JSON request body parsed from a remote client. Signature `get_json(force=False, silent=False, cache=True)`; `max_args: 3` rejects unrelated overloads."

- id: python.flask.request_get_data
  enabled: true
  language: python
  trust: remote
  tag: http-input
  payload_types: [binary]
  frameworks: [flask]
  packages: [flask]
