- id: python.bottle.request_body_read
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: python.pyramid.request_body
    reenable_when: "Reading `request.body` is a kind:read source on its own; the .read(size) tail flows through normally via taint propagation. The pyramid rule now lists Bottle in frameworks/packages and covers this idiom."
  language: python
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [binary]
  frameworks: [bottle]
  packages: [bottle]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.body\\.read$"
  constraints:
  - max_args: 1
  description: "Disabled — pyramid.request_body covers Bottle via merged frameworks/packages. The .read() tail propagates through taint without needing a separate kind:call source."

