- id: python.fastapi.body_param_marker
  enabled: true
  language: python
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [json]
  frameworks: [fastapi]
  packages: [fastapi, pydantic]
  cwe: [CWE-20]
  match:
    kind: param
    target:
      annotation: Body
  match_examples:
  - name: fastapi body marker
    code: |
      from fastapi import Body, FastAPI
      app = FastAPI()
      def handler(payload: dict = Body(...)):
          return payload
    expect_match_text: [payload]
  description: "FastAPI `Body(...)` parameter binder — request-body envelope. Per the python adapter's binder-marker support, the annotation `Body` is recorded only when the parameter's default-value is a `Body(...)` call, so this rule no longer over-fires on unrelated `Body` constructors (G1, R7)."

