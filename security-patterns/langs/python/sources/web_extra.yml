- id: python.fastapi.body_param_marker
  enabled: true
  language: python
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [json]
  frameworks: [fastapi]
  packages: [fastapi, pydantic]
  cwe: [CWE-20]
  match:
    kind: param
    target:
      annotation: Body
      default_call: Body
  match_examples:
  - name: fastapi body marker
    code: |
      from fastapi import Body, FastAPI
      app = FastAPI()
      def handler(payload: dict = Body(...)):
          return payload
    expect_match_text: [payload]
  - name: unrelated default constructor is not a body binder
    code: |
      from fastapi import Body, FastAPI
      class LocalBody:
          pass
      def handler(payload: dict = LocalBody()):
          return payload
    expect_no_match: true
  description: "FastAPI `Body(...)` parameter binder - request-body envelope. The rule owns both `Annotated[..., Body()]` metadata and the generic direct parameter-default-call fact, so the framework API name remains in the rulepack and unrelated constructors stay quiet (G1, R7)."

