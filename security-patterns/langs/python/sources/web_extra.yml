# Additional web-framework remote sources that complement
# remote.yml. These all use attribute-chain receivers (or call
# attribute chains) so they avoid bare-name false positives.

# ---------------------------------------------------------------------------
# Flask
# ---------------------------------------------------------------------------

- id: python.flask.request_get_json
  enabled: true
  language: python
  trust: remote
  tag: http-input
  payload_types: [json]
  frameworks: [flask, google-cloud-functions]
  packages: [flask, functions_framework]
  analysis_semantics:
    source_specificity_rank: 5
  match:
    kind: call
    callee:
      attribute: [request, get_json]
  constraints:
  - max_args: 3
  match_examples:
  - name: flask request get json
    code: |
      import flask
      def example(user_input):
          return request.get_json(user_input)
    expect_match_text: [request.get_json]
  - name: google cloud functions flask request json
    code: |
      import flask
      def gcf_handler(request):
          return request.get_json(silent=True)
    expect_match_text: [request.get_json]
  - name: unrelated get json overload is not request input
    code: |
      import flask
      def example(request, a, b, c, d):
          return request.get_json(a, b, c, d)
    expect_no_match: true
  description: "Flask / Google Cloud Functions request.get_json() - JSON request body parsed from a remote client. Signature `get_json(force=False, silent=False, cache=True)`; `max_args: 3` rejects unrelated overloads."

- id: python.flask.request_json_field_get
  enabled: true
  language: python
  trust: remote
  tag: http-input
  payload_types: [json]
  frameworks: [flask]
  packages: [flask]
  analysis_semantics:
    source_specificity_rank: 0
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.get$"
      base_name_in: [body, payload, data, json_body, json_data, request_json]
  constraints:
  - min_args: 1
  - max_args: 2
  match_examples:
  - name: flask parsed json body field get
    code: |
      import flask
      def login():
          body = request.get_json(force=True) or {}
          return body.get("email")
    expect_match_text: [body.get]
  - name: unrelated receiver get negative
    code: |
      import flask
      def lookup(cache):
          return cache.get("email")
    expect_no_match: true
  description: "Parsed Flask JSON body field extraction, e.g. `body = request.get_json(...)`; `body.get(name)` is remote JSON input at the field-read line."

