  payload_types: [text]
  frameworks: [fastapi, starlette]
  packages: [fastapi, starlette]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.receive_text$"
  constraints:
  - max_args: 0
  match_examples:
  - name: starlette websocket receive text
    code: |
      import fastapi
      async def example(websocket):
          return await websocket.receive_text()
    expect_match_text: [websocket.receive_text]
  - name: starlette websocket receive text alias
    code: |
      import fastapi
      async def example(ws):
          return await ws.receive_text()
    expect_match_text: [ws.receive_text]
  - name: receive text method with an argument is not the websocket contract
    code: |
      import fastapi
      async def example(websocket, value):
          return await websocket.receive_text(value)
    expect_no_match: true
  description: "FastAPI/Starlette WebSocket.receive_text() - text frame received from a remote peer."

