- id: python.tornado.websocket_on_message_param
  enabled: true
  language: python
  trust: remote
  category: ws-input
  tag: ws-input
  payload_types: [text, binary]
  frameworks: [tornado]
  packages: [tornado]
  match:
    kind: param
    target:
      name: message
      in_method: [on_message]
      in_class: [WebSocketHandler]
  match_examples:
  - name: tornado websocket on_message
    code: |
      from tornado.websocket import WebSocketHandler
      class Echo(WebSocketHandler):
          def on_message(self, message):
              return message
    expect_match_text: [message]
  - name: ordinary on_message method is not a Tornado callback
    code: |
      from tornado.websocket import WebSocketHandler
      class LocalEcho:
          def on_message(self, message):
              return message
    expect_no_match: true
  description: "Tornado WebSocketHandler.on_message(self, message) - remote-supplied WebSocket payload, pinned to exact compiler-emitted superclass ancestry plus the callback method."

