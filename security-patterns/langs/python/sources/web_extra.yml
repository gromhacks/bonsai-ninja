- id: python.aiohttp.bounded_stream_read
  enabled: true
  language: python
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [binary]
  frameworks: [aiohttp, falcon]
  packages: [aiohttp, falcon]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.bounded_stream\\.read$"
  constraints:
  - max_args: 1
  match_examples:
  - name: aiohttp bounded stream read
    code: |
      import aiohttp
      async def example(size):
          return await request.bounded_stream.read(size)
    expect_match_text: [request.bounded_stream.read]
  - name: falcon bounded stream read
    code: |
      import falcon
      def example(size):
          return req.bounded_stream.read(size)
    expect_match_text: [req.bounded_stream.read]
  description: "aiohttp/Falcon bounded_stream.read(...) - raw request-body bytes read from the client stream. Both `request.` (aiohttp) and `req.` (falcon convention) prefixes accepted; per-file package gate keeps the regex scoped to those frameworks."

- id: python.aiohttp.request_content_iter_chunked
  enabled: true
  language: python
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [binary]
  frameworks: [aiohttp]
  packages: [aiohttp]
  cwe: [CWE-20]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.content\\.iter_chunked$"
  match_examples:
  - name: aiohttp content iter_chunked
    code: |
      import aiohttp
      async def example():
          async for chunk in request.content.iter_chunked(1024):
              yield chunk
    expect_match_text: [request.content.iter_chunked]
  description: "aiohttp `request.content.iter_chunked(N)` — chunked async-iterator over raw client body bytes. The yielded chunk is attacker-controlled. (G2)"

- id: python.starlette.request_stream
  enabled: true
  language: python
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [binary]
  frameworks: [starlette, fastapi]
  packages: [starlette, fastapi]
  cwe: [CWE-20]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.stream$"
  match_examples:
  - name: starlette request stream
    code: |
      from starlette.requests import Request
      async def example(request: Request):
          async for chunk in request.stream():
              yield chunk
    expect_match_text: [request.stream]
  description: "Starlette / FastAPI `request.stream()` — async iterator over the raw request-body bytes. Each chunk is attacker-controlled. (G2)"

