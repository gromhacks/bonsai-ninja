      def example(user_input):
          return request.get_data(user_input)
  description: "Flask request.get_data() — raw request body bytes. Signature `get_data(cache=True, as_text=False, parse_form_data=False)`; `max_args: 3` rejects unrelated overloads."

- id: python.web.request_headers_get
