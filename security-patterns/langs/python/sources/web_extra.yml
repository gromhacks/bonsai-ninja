- id: python.flask.route_path_param
  enabled: true
  language: python
  trust: remote
  tag: http-input
  payload_types: [path]
  frameworks: [flask]
  packages: [flask, werkzeug]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
  constraints:
  - enclosing_decorator_in: [route, get, post, put, patch, delete]
  match_examples:
  - name: flask blueprint route path param
    code: |
      import flask
      bp = flask.Blueprint("files", __name__)
      @bp.get("/<name>")
      def fetch(name):
          return name
    expect_match_text: [name]
  - name: flask helper param negative
    code: |
      import flask
      def helper(name):
          return name
    expect_no_match: true
  description: "Flask route handler parameters on decorated routes are URL path variables supplied by the remote client."

