- id: python.tornado.websocket_on_message_param
  enabled: true
  language: python
  trust: remote
  category: ws-input
  tag: ws-input
  payload_types: [text, binary]
  frameworks: [tornado]
  packages: [tornado]
  match:
    kind: param
    target:
      name: message
      in_method: [on_message]
  match_examples:
  - name: tornado websocket on_message
    code: |
      from tornado.websocket import WebSocketHandler
      class Echo(WebSocketHandler):
          def on_message(self, message):
              return message
    expect_match_text: [message]
  description: "Tornado WebSocketHandler.on_message(self, message) — remote-supplied WebSocket payload. The `in_method: [on_message]` constraint pins the framework signature so a bare `message` parameter on an unrelated helper does not match. Tighter superclass narrowing (`Decl.bases`) is pending adapter coverage; the `packages: [tornado]` per-file gate keeps over-firing scoped to tornado-importing files."

