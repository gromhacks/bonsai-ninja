  packages: [aiohttp, bottle, fastapi, flask, pyramid, sanic, starlette, tornado]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.headers\\.get$"
  constraints:
  - min_args: 1
  - max_args: 2
  match_examples:
  - name: request headers get
    code: |
