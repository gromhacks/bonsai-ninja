- id: python.aws.lambda_event_param
  enabled: true
  language: python
  trust: service
  tag: event-input
  payload_types: [event, json]
  frameworks: [aws-lambda]
  packages: [boto3]
  imports: [boto3]
  match:
    kind: param
    target:
      name: event
  match_examples:
  - name: aws lambda event param
    code: |
      import boto3
      def handler(event):
          return event
  description: AWS Lambda handler event parameter.
- id: python.aws.lambda_event_body
  enabled: true
  language: python
  trust: service
  tag: event-input
  payload_types: [event, json]
  frameworks: [aws-lambda]
  packages: [boto3]
  match:
    kind: read
    target:
      attribute: [event, body]
  match_examples:
  - name: aws lambda event body
    code: |
      import boto3
      def example():
          value = event.body
          return value
  description: "AWS Lambda/APIGateway event['body'] / event.body — cloud-delivered request payload."

