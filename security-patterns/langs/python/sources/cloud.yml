- id: python.gcp.function_request_json
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: python
  trust: service
  tag: event-input
  payload_types: [event, json]
  frameworks: [google-cloud-functions]
  packages: [functions_framework]
  match:
    kind: call
    callee:
      attribute: [request, get_json]
  constraints:
  - max_args: 3
  match_examples:
  - name: gcp function request json
    code: |
      import functions_framework
      def example(user_input):
          return request.get_json(user_input)
    expect_match_text: [request.get_json]
  description: "Disabled duplicate - same `request.get_json(...)` shape as python.flask.request_get_json; canonical rule carries Flask and Google Cloud Functions metadata."

- id: python.azure.function_req_get_json
  enabled: true
  language: python
  trust: service
  tag: event-input
  payload_types: [event, json]
  frameworks: [azure-functions]
  packages: [azure.functions]
  imports: [azure.functions]
  match:
    kind: call
    callee:
      attribute: [req, get_json]
  constraints:
  - max_args: 0
  match_examples:
  - name: azure function req get json
    code: |
      import azure.functions
      def example(user_input):
          return req.get_json()
  description: "Azure Functions HttpRequest.get_json() — cloud-delivered request body. `get_json()` takes 0 args; `max_args: 0` rejects unrelated overloads."

- id: python.azure.function_req_get_body
  enabled: true
  language: python
  trust: service
  tag: event-input
