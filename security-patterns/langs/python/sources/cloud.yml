- id: python.aws.lambda_event_param
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: python
  trust: service
  tag: event-input
  payload_types: [event, json]
  frameworks: [aws-lambda]
  packages: [boto3]
  imports: [boto3]
  match:
    kind: param
    target:
      name: event
  description: "Disabled - Python Lambda handlers are configured externally and boto3 is a client SDK, so a bare `event` parameter plus that import does not prove a runtime entry boundary."
- id: python.aws.lambda_event_body
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: python
  trust: service
  tag: event-input
  payload_types: [event, json]
  frameworks: [aws-lambda]
  packages: [boto3]
  match:
    kind: read
    target:
      attribute: [event, body]
  match_examples:
  - name: aws lambda event body
    code: |
      import boto3
      def example():
          value = event.body
          return value
  description: "Disabled - event.body alone does not prove a Lambda/API Gateway handler, and boto3 is a client SDK rather than runtime registration evidence."

