      def example(user_input):
          return req.get_body()
  description: "Azure Functions HttpRequest.get_body() — raw cloud-delivered request body. `get_body()` takes 0 args; `max_args: 0` rejects unrelated overloads."
- id: python.azure.function_req_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: python
  trust: service
  tag: event-input
  payload_types: [event, json]
  frameworks: [azure-functions]
  packages: [azure.functions]
  imports: [azure.functions]
  match:
    kind: param
    target:
      name: req
  description: "Disabled — bare `req` parameter collides with Falcon request handlers; Azure get_json/get_body accessors remain enabled for concrete HttpRequest input."
