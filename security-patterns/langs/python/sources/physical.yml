# Python hardware / physical-input sources (GPIO, I2C/SMBus, SPI, UART).
- id: python.physical.rpigpio_input
  enabled: true
  language: python
  trust: physical
  tag: hw-input
  category: hardware-io
  frameworks: [raspberry-pi]
  packages: [RPi.GPIO]
  match:
    kind: call
    callee:
      attribute: [GPIO, input]
  match_examples:
  - name: physical rpigpio input
    code: |
      import RPi.GPIO
      def example(user_input):
          return GPIO.input(user_input)
  description: "RPi.GPIO GPIO.input(pin) - physical pin state read."

