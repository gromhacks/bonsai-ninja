- id: python.graphql.graphql_core_execute
  enabled: true
  language: python
  tag: graphql-injection
  severity: medium
  packages: [graphql]
  imports: [graphql]
  cwe: [CWE-20]
  match:
    kind: call
    callee:
      attribute: [graphql, graphql_sync]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: graphql graphql core execute
    code: |
      import graphql
      def example(schema, user_input):
          return graphql.graphql_sync(schema, user_input)
  - name: graphql core execute literal negative
    code: |
      import graphql

      def example(schema, user_input):
          return graphql.graphql_sync(schema, 'safe')
    expect_no_match: true
  description: "graphql.graphql_sync(tainted_query) — dynamic GraphQL documents can expose introspection or resolver-side injection paths."

