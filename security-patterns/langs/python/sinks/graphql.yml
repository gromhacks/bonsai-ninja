- id: python.graphql.strawberry_schema_execute
  enabled: true
  language: python
  tag: graphql-injection
  severity: high
  packages: [strawberry]
  imports: [strawberry]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: "^Schema\\.execute_sync$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: strawberry schema execute_sync tainted
    code: |
      import strawberry
      def example(user_input):
          schema = Schema()
          return schema.execute_sync(user_input)
      class Schema:
          def execute_sync(self, *args): pass
    expect_match_text: [schema.execute_sync]
  - name: strawberry schema execute_sync literal negative
    code: |
      import strawberry
      def example(user_input):
          schema = Schema()
          return schema.execute_sync('{ viewer { id } }')
      class Schema:
          def execute_sync(self, *args): pass
    expect_no_match: true
  description: "Strawberry GraphQL schema.execute_sync(tainted_query) — attacker-controlled query string drives resolver execution and may probe introspection."

