- id: python.graphql.gql_client_execute
  enabled: true
  language: python
  tag: graphql-injection
  severity: medium
  packages: [gql]
  imports: [gql]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: "^Client\\.execute$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: gql client execute tainted
    code: |
      import gql
      def example(user_input):
          client = Client()
          return client.execute(user_input)
      class Client:
          def execute(self, *args): pass
    expect_match_text: [client.execute]
  - name: gql client execute literal negative
    code: |
      import gql
      def example(user_input):
          client = Client()
          return client.execute('{ viewer { id } }')
      class Client:
          def execute(self, *args): pass
    expect_no_match: true
  - name: unrelated execute receiver negative
    code: |
      import gql
      def example(self, cmd):
          return self.runner.execute(cmd)
    expect_no_match: true
  description: "gql Client.execute(tainted_query) - sends attacker-controlled GraphQL document upstream to a remote API."
