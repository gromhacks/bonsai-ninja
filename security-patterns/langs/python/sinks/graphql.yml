- id: python.graphql.schema_execute
  enabled: false
  disabled_reason:
    code: over-broad
  language: python
  tag: graphql-injection
  severity: medium
  packages: [graphql, graphene]
  imports: [graphql, graphene]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      attribute: [schema, execute]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: schema execute tainted query
    code: |
      import graphene
      def example(schema, user_input):
          return schema.execute(user_input)
    expect_match_text: [schema.execute]
  - name: schema execute literal negative
    code: |
      import graphene

      def example(schema, user_input):
          return schema.execute('safe')
    expect_no_match: true
  description: "Disabled - schema.execute is a normal GraphQL server boundary. Resolver dataflow to concrete sinks is the security boundary; treating every request document as injection creates unavoidable endpoint false positives."

- id: python.graphql.strawberry_schema_execute
  enabled: false
  disabled_reason:
    code: over-broad
  language: python
  tag: graphql-injection
  severity: high
  packages: [strawberry]
  imports: [strawberry]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: "^Schema\\.execute_sync$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: strawberry schema execute_sync tainted
    code: |
      import strawberry
      def example(user_input):
          schema = Schema()
          return schema.execute_sync(user_input)
      class Schema:
          def execute_sync(self, *args): pass
    expect_match_text: [schema.execute_sync]
  - name: strawberry schema execute_sync literal negative
    code: |
      import strawberry
      def example(user_input):
          schema = Schema()
          return schema.execute_sync('{ viewer { id } }')
      class Schema:
          def execute_sync(self, *args): pass
    expect_no_match: true
  description: "Disabled - Strawberry executes attacker-authored GraphQL documents by design. Introspection and query-complexity policy require dedicated configuration evidence; resolver injection remains covered at concrete sinks."

