- id: python.tls.aiohttp_ssl_false
  enabled: true
  language: python
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [aiohttp]
  imports: [aiohttp]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: get
  constraints:
  - receiver_type_in: [ClientSession]
  - keyword_arg_equals: {name: ssl, value: "False"}
  match_examples:
  - name: aiohttp session get explicitly disables TLS verification
    code: |
      import aiohttp
      async def fetch(session: aiohttp.ClientSession, url):
          return await session.get(url, ssl=False)
    expect_match_text: [session.get]
  - name: unrelated get method cannot provide aiohttp TLS evidence
    code: |
      import aiohttp
      class Registry:
          def get(self, key, **options): return key
      def fetch(registry: Registry, key):
          return registry.get(key, ssl=False)
    expect_no_match: true
  description: "aiohttp ClientSession.get(..., ssl=False) disables TLS certificate verification for the request."
