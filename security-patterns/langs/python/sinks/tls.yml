- id: python.tls.session_verify_assign
  enabled: true
  language: python
  tag: weak-tls
  category: source-independent
  severity: high
  packages:
  - requests
  cwe:
  - CWE-295
  match:
    kind: write
    target:
      name: verify
  match_examples:
  - name: tls session verify assign
    code: |
      import requests
      def example(value):
          session.verify = value
          return value
  description: Session.verify = False.
- id: python.tls.ssl_create_unverified_context
  enabled: true
  language: python
  tag: weak-tls
  category: source-independent
  severity: critical
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      attribute:
      - ssl
      - _create_unverified_context
  match_examples:
  - name: tls ssl create unverified context
    code: "def example(user_input):\n    return ssl._create_unverified_context(user_input)\n"
  description: ssl._create_unverified_context().
- id: python.tls.ssl_default_https_unverified
  enabled: true
  language: python
  tag: weak-tls
  category: source-independent
  severity: critical
  cwe:
  - CWE-295
  match:
    kind: write
    target:
      name: _create_default_https_context
  match_examples:
  - name: tls ssl default https unverified
    code: "def example(value):\n    _create_default_https_context = value\n    return value\n"
  description: ssl._create_default_https_context = ssl._create_unverified_context (global override).
