- id: python.tls.session_verify_assign
  enabled: true
  language: python
  tag: weak-tls
  category: source-independent
  severity: high
  packages:
  - requests
  imports: [requests]
  cwe:
  - CWE-295
  match:
    kind: write
    target:
      regex: '^[^\.\s]+\.verify$'
      receiver_type_in: [Session, requests.Session]
  constraints:
  - arg_equals: {index: 0, value: "False"}
  match_examples:
  - name: requests session verification disabled
    code: |
      import requests
      def configure(session: requests.Session):
          session.verify = False
  - name: requests session verification enabled negative
    code: |
      import requests
      def configure(session: requests.Session):
          session.verify = True
    expect_no_match: true
  - name: bare local verify collision negative
    code: |
      import requests
      def configure():
          verify = False
          return verify
    expect_no_match: true
  description: "requests Session `verify = False` disables certificate verification; exact member and RHS constraints keep enabled settings and local names quiet."
- id: python.tls.ssl_create_unverified_context
  enabled: true
  language: python
  tag: weak-tls
  category: source-independent
  severity: critical
  imports: [ssl]
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      attribute:
      - ssl
      - _create_unverified_context
      binding_origin: imported
  match_examples:
  - name: tls ssl create unverified context
    code: "import ssl\ndef example(user_input):\n    return ssl._create_unverified_context(user_input)\n"
  - name: local ssl call collision negative
    code: |
      class ssl:
          @staticmethod
          def _create_unverified_context(value):
              return value
      def example(value):
          return ssl._create_unverified_context(value)
    expect_no_match: true
  description: ssl._create_unverified_context().
- id: python.tls.ssl_default_https_unverified
  enabled: true
  language: python
  tag: weak-tls
  category: source-independent
  severity: critical
  imports: [ssl]
  cwe:
  - CWE-295
  match:
    kind: write
    target:
      attribute: [ssl, _create_default_https_context]
      binding_origin: imported
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^(?:ssl\.)?_create_unverified_context$'
  match_examples:
  - name: global default HTTPS context override
    code: |
      import ssl
      ssl._create_default_https_context = ssl._create_unverified_context
  - name: verified default HTTPS context negative
    code: |
      import ssl
      ssl._create_default_https_context = ssl.create_default_context
    expect_no_match: true
  - name: local default context collision negative
    code: |
      import ssl
      _create_default_https_context = ssl._create_unverified_context
    expect_no_match: true
  - name: local ssl module collision negative
    code: |
      import ssl
      class ssl:
          _create_unverified_context = staticmethod(lambda: object())
      ssl._create_default_https_context = ssl._create_unverified_context
    expect_no_match: true
  description: "`ssl._create_default_https_context = ssl._create_unverified_context` disables verification globally; compiler-proven imported ownership and callable-value constraints reject local providers, local names, and verified assignments."
