- id: python.tls.sslcontext_verify_mode_none
  enabled: true
  language: python
  tag: weak-tls
  category: source-independent
  severity: critical
  imports: [ssl]
  cwe:
  - CWE-295
  match:
    kind: write
    target:
      regex: '^[^\.\s]+\.verify_mode$'
      receiver_type_in: [SSLContext, ssl.SSLContext]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^(?:ssl\.)?CERT_NONE$'
  match_examples:
  - name: SSL context certificate verification disabled
    code: |
      import ssl
      def configure(context: ssl.SSLContext):
          context.verify_mode = ssl.CERT_NONE
  - name: SSL context required verification negative
    code: |
      import ssl
      def configure(context: ssl.SSLContext):
          context.verify_mode = ssl.CERT_REQUIRED
    expect_no_match: true
  - name: bare local verify mode collision negative
    code: |
      import ssl
      verify_mode = ssl.CERT_NONE
    expect_no_match: true
  description: "SSLContext `verify_mode = ssl.CERT_NONE` disables certificate verification; exact member/value constraints reject secure modes and local names."
- id: python.tls.pyopenssl_verify_off
  enabled: true
  language: python
  tag: weak-tls
  category: source-independent
  severity: medium
  packages:
  - pyOpenSSL
  - OpenSSL
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      name: set_verify
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(^|\.)(VERIFY_NONE)$'
  match_examples:
  - name: pyopenssl verify none
    code: |
      from OpenSSL import SSL
      def configure(ctx):
          ctx.set_verify(SSL.VERIFY_NONE, lambda *args: True)
    expect_match_text: [ctx.set_verify]
  - name: pyopenssl verify peer negative
    code: |
      from OpenSSL import SSL
      def configure(ctx):
          ctx.set_verify(SSL.VERIFY_PEER, callback)
    expect_no_match: true
  description: "OpenSSL.SSL.Context.set_verify(VERIFY_NONE, ...) - disables certificate verification."

- id: python.tls.requests_verify_false
  enabled: true
  language: python
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [requests]
  imports: [requests]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      attribute: [requests, get]
  constraints:
  - keyword_arg_equals: {name: verify, value: "False"}
  match_examples:
  - name: requests get explicitly disables certificate verification
    code: |
      import requests
      def fetch(url):
          return requests.get(url, verify=False)
    expect_match_text: [requests.get]
  - name: requests get keeps certificate verification enabled
    code: |
      import requests
      def fetch(url):
          return requests.get(url, verify=True)
    expect_no_match: true
  description: "requests.get(..., verify=False) disables TLS certificate verification."

