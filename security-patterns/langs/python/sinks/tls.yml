- id: python.tls.urllib3_disable_warnings
  enabled: false
  disabled_reason:
    code: over-broad
  language: python
  tag: weak-tls
  severity: low
  packages:
  - urllib3
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      attribute:
      - urllib3
      - disable_warnings
  description: "Disabled - disable_warnings is a smell, not a vuln; flag manually."
- id: python.tls.pyopenssl_verify_off
  enabled: true
  language: python
  tag: weak-tls
  category: source-independent
  severity: medium
  packages:
  - pyOpenSSL
  - OpenSSL
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      name: set_verify
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(^|\.)(VERIFY_NONE)$'
  match_examples:
  - name: pyopenssl verify none
    code: |
      from OpenSSL import SSL
      def configure(ctx):
          ctx.set_verify(SSL.VERIFY_NONE, lambda *args: True)
    expect_match_text: [ctx.set_verify]
  - name: pyopenssl verify peer negative
    code: |
      from OpenSSL import SSL
      def configure(ctx):
          ctx.set_verify(SSL.VERIFY_PEER, callback)
    expect_no_match: true
  description: "OpenSSL.SSL.Context.set_verify(VERIFY_NONE, ...) - disables certificate verification."
