- id: python.xxe.suds_client
  enabled: true
  language: python
  tag: xxe
  severity: high
  packages: [suds]
  cwe: [CWE-611]
  match:
    kind: new
    callee:
      attribute: [client, Client]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: xxe suds client
    code: |
      import suds
      class Client:
          pass

      def example(user_input):
          return client.Client(user_input)
  - name: suds client literal negative
    code: |
      import suds

      class Client:
          pass

      def example(user_input):
          return client.Client('safe')
    expect_no_match: true
  description: "suds Client - SOAP/XML-RPC, vulnerable to XXE. Constructor takes a WSDL URL as first arg; `min_args: 1` rejects unrelated 0-arg `client.Client()` decoys."
