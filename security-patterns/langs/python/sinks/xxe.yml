# Python XXE sinks. lxml + xml stdlib + xmltodict + BeautifulSoup.
- id: python.xxe.lxml_parse
  enabled: true
  language: python
  tag: xxe
  severity: high
  packages: [lxml]
  imports: [lxml, lxml.etree]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [etree, parse]
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    configured_argument_factory_guard:
      sink_argument_index: 1
      factory:
        attribute: [etree, XMLParser]
      required_named_arguments:
      - name: resolve_entities
        value:
          kind: boolean
          value: false
      - name: no_network
        value:
          kind: boolean
          value: true
  match_examples:
  - name: xxe lxml parse
    code: |
      from lxml import etree
      def example(user_input):
          return etree.parse(user_input)
  - name: lxml parse literal negative
    code: |
      from lxml import etree

      def example(user_input):
          return etree.parse('safe')
    expect_no_match: true
  description: "lxml.etree.parse - enable DEFUSEDXML or set resolve_entities=False."

