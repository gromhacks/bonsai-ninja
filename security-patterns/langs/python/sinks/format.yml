# Python format-string injection.
#
# Python `"{}".format(...)` and `"%s" % args` both substitute values
# into a format string. Distinct from C printf-family because Python
# raises on arg-count mismatch and `%n`-style memory writes don't
# exist. The real risk is attacker-controlled FORMAT TEMPLATES
# pulling out attribute/dict access via `{0.__class__}` /
# `{user.private_field}`. The matcher needs to detect calls with a
# tainted FORMAT STRING (not tainted arguments).
# Receiver taint is the security boundary: attacker-controlled replacement
# values are ordinary data, while an attacker-controlled template can traverse
# attributes and mapping keys during formatting.
- id: python.format.str_format_tainted_template
  enabled: true
  language: python
  tag: format-string
  severity: medium
  cwe: [CWE-134]
  match:
    kind: call
    callee:
      regex: "(?:^|\\.)format$"
  constraints:
  - receiver_tainted: true
  match_examples:
  - name: tainted Python format template
    code: |
      def render(input, user):
          return input.format(user=user)
    expect_match_text: [input.format]
  - name: literal Python format template
    code: |
      def render(input, user):
          return "Hello, {user}".format(user=user)
    expect_no_match: true
  description: "Python str.format on a tainted receiver lets an attacker-controlled template traverse supplied objects and mappings."
