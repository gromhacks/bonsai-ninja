- id: python.smtpinj.smtp_sendmail_message
  enabled: true
  language: python
  tag: smtp-injection
  severity: medium
  imports: [smtplib]
  cwe: [CWE-93]
  match:
    kind: call
    callee:
      attribute: [SMTP, sendmail]
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: smtpinj smtp sendmail message
    code: |
      import smtplib
      def example(smtp, user_input):
          return smtp.sendmail("from@example.com", ["to@example.com"], user_input)
    expect_match_text: [smtp.sendmail]
  - name: smtp sendmail message literal negative
    code: |
      import smtplib
      def example(smtp, user_input):
          return smtp.sendmail("from@example.com", ["to@example.com"], "Subject: safe\n\nbody")
    expect_no_match: true
  description: "SMTP.sendmail(from_addr, to_addrs, msg=tainted_message) — tainted message headers can inject SMTP headers or commands."

