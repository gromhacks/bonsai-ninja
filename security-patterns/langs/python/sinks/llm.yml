- id: python.llm.langchain_llmchain_invoke
  enabled: true
  language: python
  tag: web-llm
  severity: medium
  cwe:
  - CWE-74
  - CWE-1427
  owasp:
  - A03-2021
  packages:
  - langchain
  - langchain.chains
  imports:
  - langchain
  match:
    kind: call
    callee:
      attribute:
      - LLMChain
      - invoke
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: langchain LLMChain invoke tainted
    code: |
      import langchain
      from langchain.chains import LLMChain
      def example(user_input):
          return LLMChain.invoke(user_input)
    expect_match_text: [LLMChain.invoke]
  - name: langchain LLMChain invoke literal negative
    code: |
      import langchain
      from langchain.chains import LLMChain
      def example():
          return LLMChain.invoke({"question": "What is 2+2?"})
    expect_no_match: true
  description: "LangChain LLMChain.invoke(tainted) - attacker-controlled chain input drives the LLM, can hijack instructions, exfiltrate tool data, or drive tool calls."

- id: python.llm.langchain_agent_run
  enabled: true
  language: python
  tag: web-llm
  severity: high
  cwe:
  - CWE-74
  - CWE-1427
  owasp:
  - A03-2021
  packages:
  - langchain
  imports:
  - langchain
  match:
    kind: call
    callee:
      regex: ^(AgentExecutor|LLMChain|Chain)\.run$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: langchain agent.run tainted
    code: |
      import langchain
      def example(user_input):
          agent = AgentExecutor()
          return agent.run(user_input)
      class AgentExecutor:
          def run(self, *args): pass
    expect_match_text: [agent.run]
  - name: langchain agent.run literal negative
    code: |
      import langchain
      def example():
          agent = AgentExecutor()
          return agent.run("What is the capital of France?")
      class AgentExecutor:
          def run(self, *args): pass
    expect_no_match: true
  description: "LangChain agent.run(tainted) / executor.run(tainted) - agent instruction surface; attacker can steer tool calls, leak data, or escape system prompt."

- id: python.llm.langchain_chain_ainvoke
  enabled: true
  language: python
  tag: web-llm
  severity: medium
  cwe:
  - CWE-74
  - CWE-1427
  owasp:
  - A03-2021
  packages:
  - langchain
  - langchain_core
  imports:
  - langchain
  match:
    kind: call
    callee:
      regex: ^(Runnable|RunnableSequence|LLMChain|AgentExecutor)\.ainvoke$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: langchain chain.ainvoke tainted
    code: |
      import langchain
      async def example(user_input):
          chain = Runnable()
          return await chain.ainvoke(user_input)
      class Runnable:
          async def ainvoke(self, *args): pass
    expect_match_text: [chain.ainvoke]
  - name: langchain chain.ainvoke literal negative
    code: |
      import langchain
      async def example():
          chain = Runnable()
          return await chain.ainvoke({"question": "What is 2+2?"})
      class Runnable:
          async def ainvoke(self, *args): pass
    expect_no_match: true
  description: "LangChain chain.ainvoke(tainted) / runnable.ainvoke - async LCEL invocation with attacker-controlled input drives downstream LLM/tool surface."

