- id: python.llm.openai_chat
  enabled: true
  language: python
  tag: web-llm
  severity: medium
  cwe:
  - CWE-74
  - CWE-1427
  owasp:
  - A03-2021
  packages:
  - openai
  imports:
  - openai
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.ChatCompletion\.create$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: llm openai chat
    code: "import openai\ndef example(user_input):\n    return openai.ChatCompletion.create(user_input)\n"
  - name: llm openai chat literal negative
    code: "import openai\ndef example(user_input):\n    return openai.ChatCompletion.create({\"messages\": [{\"role\": \"user\", \"content\": \"safe\"}]})\n"
    expect_no_match: true
  description: "OpenAI ChatCompletion.create - prompt may include tainted input."
