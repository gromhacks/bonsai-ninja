- id: python.jwt.pyjwt_decode_alg_none
  enabled: true
  language: python
  tag: jwt
  category: source-independent
  severity: critical
  packages: [pyjwt]
  imports: [jwt]
  cwe: [CWE-347, CWE-327]
  match:
    kind: call
    callee:
      attribute: [jwt, decode]
  constraints:
  - keyword_arg_equals:
      name: algorithms
      value: '["none"]'
  match_examples:
  - name: pyjwt decode alg none accepted
    code: |
      import jwt
      def example(token, key):
          return jwt.decode(token, key, algorithms=["none"])
  - name: pyjwt decode alg HS256 negative
    code: |
      import jwt
      def example(token, key):
          return jwt.decode(token, key, algorithms=["HS256"])
    expect_no_match: true
  description: 'jwt.decode(..., algorithms=["none"]) — accepts unsigned tokens; classic alg-none OAuth/OIDC bypass.'
