- id: python.jwt.pyjwt_decode_verify_false
  enabled: true
  language: python
  tag: jwt
  severity: critical
  packages:
  - pyjwt
  imports:
  - jwt
  cwe:
  - CWE-347
  - CWE-327
  - CWE-345
  match:
    kind: call
    callee:
      attribute:
      - jwt
      - decode
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: jwt pyjwt decode verify false
    code: |
      import pyjwt
      def example(user_input):
          return jwt.decode(user_input, verify=False)
  - name: pyjwt decode verify false literal negative
    code: |
      import pyjwt

      def example(user_input):
          return jwt.decode('safe', verify=False)
    expect_no_match: true
  description: "jwt.decode(verify=False) — accepts any token. Merged aliases: python.jwt.pyjwt_decode_algorithms_none, python.jwt.pyjwt_decode_options_verify_signature_false, python.jwt.alg_confusion."
  aliases:
  - python.jwt.pyjwt_decode_algorithms_none
  - python.jwt.pyjwt_decode_options_verify_signature_false
  - python.jwt.alg_confusion
