# Reflection-based dynamic invocation (T406). Tag
# code-injection so reviewer enumerates with `security sinks
# --tag code-injection`. Treats reflection as eval-equivalent
# when the dispatched name comes from attacker input.
- id: python.eval.getattr_dynamic_chain
  enabled: true
  language: python
  tag: code-injection
  severity: high
  cwe: [CWE-470]
  match:
    kind: call
    callee:
      name: getattr
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: eval getattr dynamic chain
    code: |
      def example(obj, user_input):
          return getattr(obj, user_input)
  - name: getattr dynamic chain literal negative
    code: |
      def example(obj, user_input):
          return getattr(obj, 'safe')
    expect_no_match: true
  description: "getattr(obj, attacker_name) — attribute name from input. Reaching `__call__` after this is eval-equivalent."
