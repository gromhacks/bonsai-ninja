# Python eval / dynamic-code sinks. Builtins + import + ast hooks.
#
# Note: builtin_eval / builtin_exec use bare-name match (`eval` / `exec`).
# This is intentional — both are real Python builtins and have no library
# scope to attach a `packages:` constraint to. The same applies to
# `compile`, `__import__`, and `execfile`. Negative fixtures live in
# tests/fixtures/python/eval/.
- id: python.eval.builtin_eval
  enabled: true
  language: python
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^eval$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: eval builtin eval
    code: |
      def example(user_input):
          return eval(user_input)
  - name: literal eval negative
    code: |
      def example():
          return eval("1 + 1")
    expect_no_match: true
  description: "eval() — executes attacker-controlled Python."

- id: python.eval.builtin_exec
  enabled: true
  language: python
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: exec
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: eval builtin exec
    code: |
      def example(user_input):
          return exec(user_input)
  - name: arg tainted literal negative
    code: "def example(user_input):\n    return exec(\"safe\")\n"
    expect_no_match: true
  description: "exec() — executes attacker-controlled Python."

