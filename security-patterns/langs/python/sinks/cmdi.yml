- id: python.cmdi.subprocess_run_shell
  enabled: true
  language: python
  tag: command-injection
  severity: critical
  imports:
  - subprocess
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      attribute:
      - subprocess
      - run
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: cmdi subprocess run shell
    code: "import subprocess\ndef example(user_input):\n    return subprocess.run(user_input,\
      \ shell=True)\n"
    expect_match_text:
    - subprocess.run
  - name: cmdi subprocess run shell f string
    code: "import subprocess\ndef example(user_input):\n    return subprocess.run(f\"\
      tar xf {user_input}\", shell=True)\n"
    expect_match_text:
    - subprocess.run
  - name: cmdi subprocess run shell concat
    code: "import subprocess\ndef example(user_input):\n    return subprocess.run(\"\
      tar xf \" + user_input, shell=True)\n"
    expect_match_text:
    - subprocess.run
  - name: arg tainted literal negative
    code: "import subprocess\ndef example(user_input):\n    return subprocess.run(\"\
      safe\", shell=True)\n"
    expect_no_match: true
  description: subprocess.run(shell=True) with tainted command, including f-string
    or concatenated command strings.
