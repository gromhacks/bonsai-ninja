- id: python.cmdi.os_system
  enabled: true
  language: python
  tag: command-injection
  severity: critical
  category: process-exec
  imports:
  - os
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      attribute:
      - os
      - system
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: cmdi os system
    code: "import os\ndef example(user_input):\n    return os.system(user_input)\n"
  - name: arg tainted literal negative
    code: "import os\ndef example(user_input):\n    return os.system(\"safe\")\n"
    expect_no_match: true
  description: "os.system - runs the whole string through /bin/sh -c; any tainted\
    \ component is command injection."
