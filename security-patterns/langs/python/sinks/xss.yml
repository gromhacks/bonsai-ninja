- id: python.xss.markupsafe_markup
  enabled: true
  language: python
  tag: xss
  severity: high
  packages:
  - markupsafe
  imports:
  - markupsafe
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - markupsafe
      - Markup
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: xss markupsafe markup
    code: |
      import markupsafe
      def example(user_input):
          return markupsafe.Markup(user_input)
  - name: markupsafe markup literal negative
    code: |
      import markupsafe

      def example(user_input):
          return markupsafe.Markup('safe')
    expect_no_match: true
  description: "Markup() declares content safe — tainted input yields XSS."
