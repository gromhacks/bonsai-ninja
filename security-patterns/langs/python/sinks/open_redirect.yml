- id: python.open_redirect.aiohttp_httpfound_location_kw
  enabled: true
  language: python
  tag: open-redirect
  severity: high
  packages: [aiohttp]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      attribute: [web, HTTPFound]
  constraints:
  - arg_tainted:
      kw: location
  match_examples:
  - name: aiohttp httpfound keyword location
    code: |
      import aiohttp
      def example(user_input):
          return web.HTTPFound(location=user_input)
    expect_match_text: [web.HTTPFound]
  - name: aiohttp httpfound keyword literal negative
    code: |
      import aiohttp
      def example(user_input):
          return web.HTTPFound(location="/home")
    expect_no_match: true
  description: "aiohttp web.HTTPFound(location=tainted) - keyword form of redirect target."

- id: python.open_redirect.response_redirect
  enabled: true
  language: python
  tag: open-redirect
  severity: high
  packages: [sanic, aiohttp]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      attribute: [response, redirect]
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    same_origin_path_constraint:
      require_scheme_rejection: true
      require_authority_rejection: true
      require_absolute_path: true
      require_scheme_relative_rejection: true
  match_examples:
  - name: open redirect response redirect
    code: |
      import sanic
      def example(user_input):
          return response.redirect(user_input)
    expect_match_text: [response.redirect]
  - name: response redirect literal negative
    code: |
      import sanic

      def example(user_input):
          return response.redirect('safe')
    expect_no_match: true
  description: "response.redirect(tainted) in Sanic/aiohttp-style response helpers - returns a redirect with attacker-controlled Location."

