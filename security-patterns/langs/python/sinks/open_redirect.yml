# Python open-redirect sinks (Flask, Django, FastAPI, Starlette, Tornado, aiohttp).
- id: python.open_redirect.flask_redirect
  enabled: true
  language: python
  tag: open-redirect
  severity: high
  packages: [flask]
  imports: [flask]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      attribute: [flask, redirect]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: open redirect flask redirect
    code: |
      import flask
      def example(user_input):
          return flask.redirect(user_input)
  - name: flask redirect literal negative
    code: |
      import flask

      def example(user_input):
          return flask.redirect('safe')
    expect_no_match: true
  description: "flask.redirect(tainted) - fully-qualified form; returns a 302 with a tainted Location."

- id: python.open_redirect.flask_redirect_bare
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: python
  tag: open-redirect
  severity: high
  packages: [flask]
  imports: [flask]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      name: redirect
  description: "Disabled - bare `redirect(...)` collides with app-defined helpers. Re-enable per-project when imports of `flask.redirect` / `django.shortcuts.redirect` can be resolved and gated."

