- id: python.open_redirect.authlib_authorize_redirect_tainted
  enabled: true
  language: python
  tag: open-redirect
  severity: high
  packages: [authlib]
  imports: [authlib]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      attribute: [oauth, authorize_redirect]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: authlib authorize_redirect tainted redirect_uri
    code: |
      import authlib
      def example(request, user_input):
          return oauth.authorize_redirect(request, user_input)
    expect_match_text: [oauth.authorize_redirect]
  - name: authlib authorize_redirect literal negative
    code: |
      import authlib
      def example(request):
          return oauth.authorize_redirect(request, '/callback')
    expect_no_match: true
  description: "Authlib oauth.authorize_redirect(request, tainted_redirect_uri) - attacker-controlled redirect URI permits OAuth open-redirect / token theft via callback hijack."
