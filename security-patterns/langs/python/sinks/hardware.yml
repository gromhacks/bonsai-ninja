# Python hardware-control / bus-write sinks (GPIO, PWM, I2C/SMBus, SPI, UART).
- id: python.hardware.rpigpio_output
  enabled: true
  language: python
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [RPi.GPIO]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      attribute: [GPIO, output]
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: rpigpio output tainted pin
    code: |
      import RPi.GPIO
      def example(user_input):
          return GPIO.output(user_input, True)
  - name: rpigpio output literal negative
    code: |
      import RPi.GPIO
      def example():
          return GPIO.output(17, True)
    expect_no_match: true
  description: "RPi.GPIO GPIO.output(pin, value) - attacker-controlled pin or value drives a physical output."

- id: python.hardware.smbus_write_byte
  enabled: true
  language: python
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [smbus, smbus2]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      name: write_byte
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: smbus write byte tainted value
    code: |
      import smbus
      def example(user_input):
          return write_byte(user_input)
  - name: smbus write byte literal negative
