- id: python.hardware.spidev_writebytes
  enabled: true
  language: python
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [spidev]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      name: writebytes
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: hardware spidev writebytes
    code: |
      import spidev
      def example(user_input):
          return writebytes(user_input)
  - name: spidev writebytes literal negative
    code: |
      import spidev

      def example(user_input):
          return writebytes('safe')
    expect_no_match: true
  description: "spidev writebytes — tainted SPI frame bytes are sent to external hardware."

