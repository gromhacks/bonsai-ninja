# Python hardware-control / bus-write sinks (GPIO, PWM, I2C/SMBus, SPI, UART).
- id: python.hardware.rpigpio_output
  enabled: true
  language: python
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [RPi.GPIO]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      attribute: [GPIO, output]
  match_examples:
  - name: hardware rpigpio output
    code: |
      import RPi.GPIO
      def example(user_input):
          return GPIO.output(user_input)
  description: "RPi.GPIO GPIO.output(pin, value) — tainted pin/value drives a physical output."

