- id: python.log_injection.format_arg_user
  enabled: true
  language: python
  tag: code-injection
  severity: medium
  cwe:
  - CWE-134
  - CWE-117
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.info$"
      base_name_in: [logger, log, logging, lgr, _logger, _log, structlog]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: log injection format arg user
    code: |
      import structlog
      def example(user_input):
          return logger.info(user_input, '%sd0-9')
  - name: log injection abbreviated logger name
    code: |
      import structlog
      def example(user_input):
          return log.info(user_input, '%sd0-9')
    expect_match_text: [log.info]
  - name: format arg user literal negative
    code: |
      import structlog

      def example(user_input):
          return logger.info('safe', '%sd0-9')
    expect_no_match: true
  description: "logger.info(user_msg) where user_msg contains `%s` / `{0}` markers - log message becomes a format-string attack. Merged aliases: python.log_injection.logger_info_concat."
  aliases:
  - python.log_injection.logger_info_concat
  - python.log_injection.structlog_info_concat
  packages:
  - structlog
  imports:
  - structlog
- id: python.log_injection.logging_info_constructed_message
  enabled: true
  language: python
  tag: log-injection
  severity: medium
  cwe:
  - CWE-117
  packages:
  - logging
  imports:
  - logging
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.info$"
      base_name_in: [logger, log, logging, lgr, _logger, _log]
  constraints:
  - arg_tainted:
      index: 0
  - arg_matches_regex:
      index: 0
      regex: "\\+|\\.format\\(|^f[\"']"
  match_examples:
  - name: stdlib logger info constructed tainted message
    code: |
      import logging
      logger = logging.getLogger("audit")
      def record(user_input):
          return logger.info("actor=" + user_input)
    expect_match_text: [logger.info]
  - name: stdlib logger info placeholder negative
    code: |
      import logging
      logger = logging.getLogger("audit")
      def record(user_input):
          return logger.info("actor=%s", user_input)
    expect_no_match: true
  description: "logging logger.info(constructed tainted message) - concatenated or formatted CRLF-tainted text can forge log entries; parameterized placeholder logging remains safe."
- id: python.log_injection.logger_debug_concat
  enabled: true
  language: python
  tag: log-injection
  severity: low
  cwe:
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - logger
      - debug
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: log injection logger debug concat
    code: "def example(user_input):\n    return logger.debug(user_input, '`f\"f\\'format')\n"
  - name: logger debug concat literal negative
    code: |
      def example(user_input):
          return logger.debug('safe', '`f"f\'format')
    expect_no_match: true
  description: "logger.debug - log-injection via concat / f-string / .format()."
