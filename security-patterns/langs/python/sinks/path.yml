- id: python.path.zipfile_extract
  enabled: true
  language: python
  tag: zip-slip
  category: source-independent
  severity: high
  packages:
  - zipfile
  imports:
  - zipfile
  cwe:
  - CWE-22
  match:
    kind: call
    callee:
      attribute:
      - ZipFile
      - extractall
  match_examples:
  - name: zipfile extractall
    code: |
      import zipfile
      def example(path, dest):
          zf = zipfile.ZipFile(path)
          zf.extractall(dest)
    expect_match_text: ["zf.extractall"]
  description: "ZipFile.extractall() - Zip Slip (CWE-22): a crafted archive entry with `../` traversal escapes the destination directory. extractall() performs no member-path validation. Source-independent (archive contents are not statically known) - flag on every call; remediate with a guarded per-member extract that rejects absolute/`..` paths."
