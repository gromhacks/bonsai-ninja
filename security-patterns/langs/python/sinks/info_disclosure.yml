- id: python.info_disclosure.logging_error_secret
  enabled: true
  language: python
  tag: information-disclosure
  severity: medium
  cwe:
  - CWE-200
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - logging
      - error
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: logging error secret
    code: |
      import structlog
      def example(secret_token):
          return logging.error(secret_token)
    expect_match_text:
    - logging.error
  - name: logging error secret literal negative
    code: |
      import structlog

      def example(secret_token):
          return logging.error('safe')
    expect_no_match: true
  description: "logging.error(secret/token/password) - secret-shaped data written to application logs. Merged collision aliases: python.log_injection.logger_error_concat, python.log_injection.structlog_error_concat."
  aliases:
  - python.log_injection.logger_error_concat
  - python.log_injection.structlog_error_concat
  packages:
  - structlog
  imports:
  - structlog
- id: python.info_disclosure.flask_jsonify_exception
  enabled: true
  language: python
  tag: information-disclosure
  severity: high
  packages:
  - flask
  cwe:
  - CWE-209
  match:
    kind: call
    callee:
      name: jsonify
  constraints:
  - any_arg_matches_regex: "(?i)(traceback|format_exc|exc\\b|exception|sys\\.exc_info|TracebackException)"
  match_examples:
  - name: flask jsonify exception
    code: |
      import flask
      def handler(exc):
          return jsonify({"error": str(exc), "traceback": traceback.format_exc()})
    expect_match_text:
    - jsonify
  - name: flask jsonify ordinary response negative
    code: |
      import flask
      def handler(result):
          return jsonify({"ok": True, "result": result})
    expect_no_match: true
  - name: flask jsonify constant error negative
    code: |
      import flask
      def handler():
          return jsonify({"error": "empty"}), 400
    expect_no_match: true
  description: "Flask jsonify(exception/traceback) - returns internal exception details to the client."
- id: python.info_disclosure.django_technical_500_response
  enabled: true
  language: python
  tag: information-disclosure
  severity: high
  packages:
  - django
  cwe:
  - CWE-209
  match:
    kind: call
    callee:
      name: technical_500_response
  match_examples:
  - name: django technical 500 response
    code: |
      import django
      def handler(request):
          return technical_500_response(request, *sys.exc_info())
    expect_match_text:
    - technical_500_response
  description: "Django technical_500_response - debug error page exposes stack frames, settings, and request context."
