- id: python.crypto.rsa_weak_key_size
  enabled: true
  language: python
  tag: weak-crypto
  severity: high
  packages: [cryptography, Crypto]
  cwe: [CWE-326]
  match:
    kind: call
    callee:
      attribute: [rsa, generate_private_key]
  constraints:
  - keyword_arg_equals: { name: key_size, value: '1024' }
  match_examples:
  - name: rsa generate 1024 weak
    code: |
      from cryptography.hazmat.primitives.asymmetric import rsa
      def gen():
          return rsa.generate_private_key(public_exponent=65537, key_size=1024)
    expect_match_text: [rsa.generate_private_key]
  - name: rsa generate 2048 strong negative
    code: |
      from cryptography.hazmat.primitives.asymmetric import rsa
      def gen():
          return rsa.generate_private_key(public_exponent=65537, key_size=2048)
    expect_no_match: true
  description: "rsa.generate_private_key(key_size=1024) — RSA below 2048 bits is broken in 2026. Use 2048+ (3072 for long-lived keys)."
