- id: python.crypto.bcrypt_low_rounds
  enabled: true
  language: python
  tag: weak-crypto
  severity: medium
  packages: [bcrypt]
  cwe: [CWE-916]
  match:
    kind: call
    callee:
      attribute: [bcrypt, gensalt]
  constraints:
  - arg_lt: { index: 0, value: 10 }
  match_examples:
  - name: bcrypt gensalt low rounds
    code: |
      import bcrypt
      def hash_pw(pw):
          return bcrypt.hashpw(pw, bcrypt.gensalt(4))
    expect_match_text: [bcrypt.gensalt]
  - name: bcrypt gensalt high rounds negative
    code: |
      import bcrypt
      def hash_pw(pw):
          return bcrypt.hashpw(pw, bcrypt.gensalt(12))
    expect_no_match: true
  description: "bcrypt.gensalt(rounds) with rounds < 10 — too cheap to compute, attackers can brute-force the hash. Use 10-12 for typical hardware."

