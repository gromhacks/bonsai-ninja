# Python weak / broken cryptography. hashlib + Crypto + cryptography + bcrypt.
- id: python.crypto.hashlib_md5
  enabled: true
  language: python
  tag: weak-crypto
  severity: low
  imports: [hashlib]
  cwe: [CWE-327, CWE-328]
  match:
    kind: call
    callee:
      attribute: [hashlib, md5]
  match_examples:
  - name: crypto hashlib md5
    code: |
      import hashlib
      def example(user_input):
          return hashlib.md5(user_input)
  description: "hashlib.md5 — broken hash."

