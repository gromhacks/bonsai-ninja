- id: python.cors.flask_cors_wildcard_with_credentials
  enabled: true
  language: python
  tag: cors
  category: source-independent
  severity: medium
  cwe: [CWE-942, CWE-346]
  owasp: [A05-2021]
  packages: [flask_cors]
  imports: [flask_cors]
  match:
    kind: call
    callee:
      name: CORS
      binding_origin: imported
  constraints:
  - keyword_arg_equals: {name: origins, value: '"*"'}
  match_examples:
  - name: cors flask cors wildcard with credentials
    code: |
      import flask_cors
      def example(app):
          return flask_cors.CORS(app, origins="*")
  - name: flask cors explicit origin negative
    code: |
      import flask_cors
      def example(app):
          return flask_cors.CORS(app, origins="https://app.example")
    expect_no_match: true
  - name: application CORS constructor collision negative
    code: |
      import flask_cors
      class CORS:
          def __init__(self, app, **options): pass
      def example(app):
          return CORS(app, origins="*")
    expect_no_match: true
  description: "Flask-CORS with the exact `origins=\"*\"` option permits every origin; exact keyword-value and imported-provider identity keep explicit allowlists and local constructors quiet."

- id: python.cors.starlette_cors_wildcard_origin
  enabled: true
  language: python
  tag: cors
  category: source-independent
  severity: medium
  cwe: [CWE-942, CWE-346]
  owasp: [A05-2021]
  packages: [starlette, fastapi]
  imports: [starlette.middleware.cors]
  match:
    kind: call
    callee:
      name: CORSMiddleware
      binding_origin: imported
  constraints:
  - keyword_arg_equals: {name: allow_origins, value: '["*"]'}
  match_examples:
  - name: cors starlette wildcard origin
    code: |
      from starlette.middleware.cors import CORSMiddleware
      def example(app):
          return CORSMiddleware(app, allow_origins=["*"])
    expect_match_text: [CORSMiddleware]
  - name: starlette explicit origin negative
    code: |
      from starlette.middleware.cors import CORSMiddleware
      def example(app):
          return CORSMiddleware(app, allow_origins=["https://app.example"])
    expect_no_match: true
  - name: application CORSMiddleware collision negative
    code: |
      import starlette.middleware.cors
      class CORSMiddleware:
          def __init__(self, app, **options): pass
      def example(app):
          return CORSMiddleware(app, allow_origins=["*"])
    expect_no_match: true
  description: "Starlette/FastAPI `CORSMiddleware(..., allow_origins=[\"*\"])` permits every origin; exact keyword-value and imported-provider identity keep allowlists and local constructors quiet."
