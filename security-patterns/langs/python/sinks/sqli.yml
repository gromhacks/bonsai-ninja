# Python SQL-injection sinks. DB-API + every popular ORM/driver.
- id: python.sqli.cursor_execute
  enabled: true
  language: python
  tag: sql-injection
  severity: critical
  cwe: [CWE-89]
  packages: [sqlite3, psycopg2, mysql.connector, pymysql, pyodbc, oracledb]
  match:
    kind: call
    callee:
      attribute: [cursor, execute]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: sqli cursor execute
    code: |
      import sqlite3
      def example(user_input):
          return cursor.execute(user_input)
  - name: cursor execute literal negative
    code: |
      import sqlite3
      def example(user_input):
          return cursor.execute('safe')
    expect_no_match: true
  description: "DB-API cursor.execute — flag string-built SQL. Package gate names the canonical DB-API drivers (sqlite3 stdlib + popular wheels) so the rule is constrained to files that actually load one."

