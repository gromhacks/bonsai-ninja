- id: python.sqli.asyncpg_conn_fetch
  enabled: false
  disabled_reason:
    code: subsumed
  language: python
  tag: sql-injection
  severity: critical
  packages: [asyncpg]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: "^[a-z_][A-Za-z0-9_]*\\.fetch$"
  description: "Disabled — subsumed by python.sqli.asyncpg_connection_fetch under OnlyWhenPackaged lax-tail policy. When a file imports `asyncpg`, the canonical `[Connection, fetch]` rule lax-matches `conn.fetch(...)` directly."

