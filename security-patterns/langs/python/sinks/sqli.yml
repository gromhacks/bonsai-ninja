- id: python.sqli.graphene_resolver_db_execute
  enabled: true
  language: python
  tag: sql-injection
  severity: high
  packages: [graphene, ariadne]
  imports: [graphene, ariadne]
  cwe: [CWE-943, CWE-89]
  analysis_semantics:
    sink_terminal_priority: 100
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_][A-Za-z0-9_]*\\.execute$"
      base_name_in: [engine, engine_mod, db, database, conn, connection]
  constraints:
  - arg_tainted:
      index: 0
  - arg_matches_regex:
      index: 0
      regex: "(?i)\\b(select|insert|update|delete|from|where)\\b"
  - arg_not_matches_regex:
      index: 0
      regex: "(\\?|%s|:[A-Za-z_][A-Za-z0-9_]*|\\$[0-9]+)"
  match_examples:
  - name: graphene resolver tainted sql execute
    code: |
      import graphene
      def example(engine_mod, user_input):
          sql = "SELECT id FROM products WHERE name = '" + user_input + "'"
          return engine_mod.execute(sql)
    expect_match_text: [engine_mod.execute]
  - name: graphene resolver parameterized execute negative
    code: |
      import graphene
      def example(engine_mod, user_input):
          return engine_mod.execute("SELECT id FROM products WHERE name = %s", (user_input,))
    expect_no_match: true
  description: "Graphene/Ariadne resolver-tainted SQL passed to a project DB execute wrapper without bind placeholders."
