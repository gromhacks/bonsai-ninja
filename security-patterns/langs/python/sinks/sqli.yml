- id: python.sqli.connection_execute
  enabled: true
  language: python
  tag: sql-injection
  severity: critical
  cwe: [CWE-89]
  packages: [sqlite3, asyncpg, aiosqlite]
  match:
    kind: call
    callee:
      attribute: [Connection, execute]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: sqli connection execute
    code: |
      import sqlite3
      def example(conn: sqlite3.Connection, user_input):
          return conn.execute(user_input)
  - name: sqli graphene resolver args to connection execute
    code: |
      import sqlite3
      def resolve_user(conn: sqlite3.Connection, parent, info, **args):
          sql = args["query"]
          return conn.execute(sql)
    expect_match_text: [conn.execute]
  - name: sqli asyncpg connection execute
    code: |
      import asyncpg
      async def example(conn: asyncpg.Connection, user_input):
          return await conn.execute(user_input)
    expect_match_text: [conn.execute]
  - name: connection execute literal negative
    code: |
      import sqlite3
      def example(conn: sqlite3.Connection, user_input):
          return conn.execute('safe')
    expect_no_match: true
  description: "Connection.execute - sqlite3/asyncpg/aiosqlite typed connection receivers. DB-API exempt from SQL-keyword arg shape (per PATTERN_GUIDE: `cursor.execute(query_var)` is canonical)."

