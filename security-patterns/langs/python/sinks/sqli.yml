- id: python.sqli.cursor_execute_abbrev
  enabled: true
  language: python
  tag: sql-injection
  severity: critical
  cwe: [CWE-89]
  packages: [sqlite3, psycopg2, mysql.connector, pymysql, pyodbc, oracledb]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.execute$"
      base_name_in: [cur, crsr, csr, dbcur, db_cursor, cur1]
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    parameterized_query:
      query_arg_index: 0
      bindings_arg_index: 1
  match_examples:
  - name: abbreviated cursor execute
    code: |
      import sqlite3
      def example(user_input):
          cur = sqlite3.connect("x").cursor()
          return cur.execute(user_input)
    expect_match_text: [cur.execute]
  - name: abbreviated cursor execute literal negative
    code: |
      import sqlite3
      def example():
          cur = sqlite3.connect("x").cursor()
          return cur.execute("SELECT 1")
    expect_no_match: true
  - name: unrelated receiver negative
    code: |
      import sqlite3
      def example(client, user_input):
          return client.execute(user_input)
    expect_no_match: true
  description: "DB-API cursor.execute on abbreviated cursor variable names (cur/crsr/csr/...) - companion to cursor_execute, which matches the literal `cursor` receiver and inline `.cursor().execute` chains. base_name_in keeps it precise + package-gated."

