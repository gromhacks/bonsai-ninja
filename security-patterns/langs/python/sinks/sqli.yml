- id: python.sqli.connection_execute
  enabled: true
  language: python
  tag: sql-injection
  severity: critical
  cwe: [CWE-89]
  packages: [sqlite3, asyncpg, aiosqlite]
  match:
    kind: call
    callee:
      attribute: [conn, execute]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: sqli connection execute
    code: |
      import sqlite3
      def example(user_input):
          return conn.execute(user_input)
  - name: sqli graphene resolver args to connection execute
    code: |
      import sqlite3
      def resolve_user(parent, info, **args):
          sql = args["query"]
          return conn.execute(sql)
    expect_match_text: [conn.execute]
  - name: sqli asyncpg conn execute sql variable
    code: |
      import asyncpg
      async def example(conn, user_input):
          sql_var = "select * from users where name = '" + user_input + "'"
          return await conn.execute(sql_var)
    expect_match_text: [conn.execute]
  - name: connection execute literal negative
    code: |
      import sqlite3
      def example(user_input):
          return conn.execute('safe')
    expect_no_match: true
  description: "Connection.execute — sqlite3/asyncpg/aiosqlite. DB-API exempt from SQL-keyword arg shape (per PATTERN_GUIDE: `cursor.execute(query_var)` is canonical); `min_args: 1` rejects 0-arg `conn.execute()` decoys. Gated on those three driver imports."

