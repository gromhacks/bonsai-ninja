- id: python.header.werkzeug_headers_add
  enabled: true
  language: python
  tag: header-injection
  severity: high
  packages:
  - werkzeug
  - flask
  cwe:
  - CWE-113
  match:
    kind: call
    callee:
      attribute:
      - Headers
      - add
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: header werkzeug headers add
    code: |
      import werkzeug
      def example(user_input):
          headers = werkzeug.Headers()
          return headers.add("X-Name", user_input)
  - name: werkzeug headers add literal negative
    code: |
      import werkzeug

      def example(user_input):
          headers = werkzeug.Headers()
          return headers.add('X-Name', 'safe')
    expect_no_match: true
  description: "werkzeug/flask Headers.add - CRLF possible if value tainted."
