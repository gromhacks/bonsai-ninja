- id: python.header.django_response_setitem
  enabled: true
  language: python
  tag: header-injection
  severity: high
  packages:
  - django
  cwe:
  - CWE-113
  match:
    kind: call
    callee:
      attribute:
      - HttpResponse
      - __setitem__
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: django response setitem tainted name
    code: |
      from django.http import HttpResponse
      def view(request):
          response = HttpResponse()
          name = request.GET.get('h')
          response[name] = "x"
          return response
    expect_match_text: ["response.__setitem__"]
  - name: django response setitem literal negative
    code: |
      from django.http import HttpResponse
      def view(request):
          response = HttpResponse()
          response["Content-Type"] = "text/html"
          return response
    expect_no_match: true
  description: "Django `response[name] = value` (HttpResponse.__setitem__) - a tainted header name or value is CRLF/header injection. Subscript-assign is surfaced as a synthetic __setitem__ call on the typed HttpResponse receiver."
