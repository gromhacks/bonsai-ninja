      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.headers\.(add|set)$
      base_name_in:
      - response
      - resp
      - res
      - r
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: response headers add
    code: |
      import flask
      def set_header(response, user_input):
          return response.headers.add("X-Name", user_input)
    expect_match_text:
    - response.headers.add
  - name: response headers set
    code: |
      import flask
      def set_header(resp, user_input):
          return resp.headers.set("X-Name", user_input)
    expect_match_text:
    - resp.headers.set
  - name: pyramid response headers add
    code: |
      import pyramid
      def set_header(response, user_input):
          return response.headers.add("X-Name", user_input)
    expect_match_text:
    - response.headers.add
  - name: response headers add literal negative
    code: |
