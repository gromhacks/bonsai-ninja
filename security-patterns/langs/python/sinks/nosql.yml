- id: python.nosql.pymongo_find
  enabled: true
  language: python
  tag: nosql-injection
  severity: high
  packages:
  - pymongo
  - motor
  imports:
  - pymongo
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      name: find
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: nosql pymongo find
    code: |
      import pymongo
      def example(user_input):
          return collection.find({"$where": user_input})
  - name: nosql pymongo nested receiver find
    code: |
      import pymongo
      def example(_DB, user_input):
          return _DB.users.find({"email": user_input})
    expect_match_text:
    - _DB.users.find
  - name: pymongo find literal negative
    code: |
      import pymongo

      def example(user_input):
          return collection.find('safe')
    expect_no_match: true
  description: "pymongo collection.find - tainted filter interpolation. Merged collision aliases: python.nosql.pymongo_find_one, python.nosql.pymongo_find_filter_value_object, python.nosql.mongo_find_one_credential_object, python.nosql.motor_collection_find, python.nosql.motor_collection_find_one, python.nosql.motor_find_filter_value_object."
  aliases:
  - python.nosql.pymongo_find_filter_value_object
  - python.nosql.motor_collection_find
  - python.nosql.motor_find_filter_value_object
- id: python.nosql.pymongo_find_one
  enabled: true
  language: python
  tag: nosql-injection
  severity: high
  packages:
  - pymongo
  - motor
  imports:
  - pymongo
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      name: find_one
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: nosql pymongo find one
    code: |
      import pymongo
      def example(collection, user_input):
          return collection.find_one({"email": user_input})
  - name: nosql motor nested receiver find one
    code: |
      import pymongo
      async def example(_DB, email, password):
          return await _DB.users.find_one({"email": email, "password": password})
    expect_match_text:
    - _DB.users.find_one
  - name: pymongo find one literal negative
    code: |
      import pymongo

      def example(collection, user_input):
          return collection.find_one('safe')
    expect_no_match: true
  description: "pymongo/motor find_one(filter) - tainted filter values can be operator-typed objects such as {'$ne': ''}. Merged aliases: python.nosql.mongo_find_one_credential_object, python.nosql.motor_collection_find_one."
  aliases:
  - python.nosql.mongo_find_one_credential_object
  - python.nosql.motor_collection_find_one
