    code: |
      import jinja2
      from jinja2.sandbox import SandboxedEnvironment
      def example(env, user_input):
          return SandboxedEnvironment.from_string(user_input)
    expect_match_text: [SandboxedEnvironment.from_string]
  - name: jinja2 sandboxed environment from_string literal negative
