- id: python.template.jinja2_environment_from_string
  enabled: true
  language: python
  tag: ssti
  severity: critical
  packages:
  - jinja2
  imports:
  - jinja2
  cwe:
  - CWE-94
  - CWE-1336
  match:
    kind: call
    callee:
      attribute:
      - Environment
      - from_string
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: template jinja2 environment from string
    code: |
      import jinja2
      def example(user_input):
          return Environment.from_string(user_input)
    expect_match_text:
    - Environment.from_string
  - name: jinja2 environment from string literal negative
    code: |
      import jinja2

      def example(user_input):
          return Environment.from_string('safe')
    expect_no_match: true
  description: "Jinja2 Environment.from_string(tainted) — SSTI to RCE in default config."
