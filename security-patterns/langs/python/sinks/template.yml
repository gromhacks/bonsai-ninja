- id: python.template.jinja2_sandboxed_environment_from_string
  enabled: true
  language: python
  tag: ssti
  severity: high
  packages:
  - jinja2
  imports:
  - jinja2
  cwe:
  - CWE-94
  - CWE-1336
  match:
    kind: call
