# Python file-upload sinks. Flask/Django/FastAPI/Tornado.
- id: python.upload.werkzeug_save
  enabled: true
  language: python
  tag: file-upload
  severity: high
  packages: [werkzeug, flask]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [FileStorage, save]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: upload werkzeug save
    code: |
      import werkzeug
      def example(user_input):
          return FileStorage.save(user_input)
  - name: werkzeug save literal negative
    code: |
      import werkzeug

      def example(user_input):
          return FileStorage.save('safe')
    expect_no_match: true
  description: "werkzeug FileStorage.save — flag if destination is tainted (filename)."

