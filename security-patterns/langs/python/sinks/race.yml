- id: python.race.os_path_exists_then_open
  enabled: false
  disabled_reason:
    code: over-broad
  language: python
  tag: race
  category: source-independent
  severity: medium
  cwe: [CWE-367]
  match:
    kind: call
    callee:
      attribute: [os, path, exists]
  description: "TOCTOU: os.path.exists check then open — race window. Disabled by default."

# TOCTOU check sites — pair with subsequent open/chmod use-sites
# in source order to identify the race window.
- id: python.toctou.os_access
  enabled: true
  language: python
  tag: race
  category: source-independent
  severity: medium
  cwe: [CWE-367]
  match:
    kind: call
    callee:
      attribute: [os, access]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: toctou os access
    code: |
      def example(user_input):
          return os.access(user_input)
  - name: os access literal negative
    code: |
      def example(user_input):
          return os.access('safe')
    expect_no_match: true
  description: "os.access(path) — check site; pair with subsequent os.open/os.stat to find TOCTOU."
