- id: python.race.connection_commit
  enabled: true
  language: python
  tag: race
  category: lifecycle-audit
  severity: medium
  packages: [sqlite3, psycopg2]
  cwe: [CWE-662, CWE-367]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.commit$
  match_examples:
    - name: connection commit audit
      code: |
        import sqlite3
        def handle(conn):
          conn.commit()
      expect_match_text: [conn.commit]
  description: "Audit-pair site — engine surfaces the lifecycle event; correlate with subsequent uses of the same value once the must-alias + lifecycle-state primitives ship (see docs/contributing/analysis-roadmap.mdx). DB-API Connection.commit() — transaction-after-error race-pair; later cursor.execute on the same connection runs outside the intended transaction window."
- id: python.race.connection_rollback
  enabled: true
  language: python
  tag: race
  category: lifecycle-audit
  severity: medium
  packages: [sqlite3, psycopg2]
  cwe: [CWE-662, CWE-367]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.rollback$
  match_examples:
    - name: connection rollback audit
      code: |
        import sqlite3
        def handle(conn):
          conn.rollback()
      expect_match_text: [conn.rollback]
  description: "Audit-pair site — engine surfaces the lifecycle event; correlate with subsequent uses of the same value once the must-alias + lifecycle-state primitives ship (see docs/contributing/analysis-roadmap.mdx). DB-API Connection.rollback() — transaction-after-error race-pair; later cursor.execute on the same connection persists writes the rollback was supposed to undo."
