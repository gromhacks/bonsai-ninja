- id: python.access.boto3_get_object
  enabled: true
  language: python
  tag: access-control
  severity: high
  packages: [boto3]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      name: get_object
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: access boto3 get object
    code: |
      import boto3
      def example(user_input):
          return get_object(user_input)
  - name: literal boto3 get object negative
    code: |
      import boto3
      def example():
          return get_object({"Bucket": "app", "Key": "reports/fixed.csv"})
    expect_no_match: true
  description: "boto3 S3 get_object(bucket/key) — tainted selector can read arbitrary object data."

