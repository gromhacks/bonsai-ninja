- id: python.access.boto3_get_object
  enabled: true
  language: python
  tag: access-control
  severity: high
  packages: [boto3]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      name: get_object
  match_examples:
  - name: access boto3 get object
    code: |
      import boto3
      def example(user_input):
          return get_object(user_input)
  description: "boto3 S3 get_object(bucket/key) — tainted selector can read arbitrary object data."

