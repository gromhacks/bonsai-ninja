- id: python.access.azure_blob_download_blob
  enabled: false
  disabled_reason:
    code: over-broad
  language: python
  tag: access-control
  severity: high
  packages: [azure.storage.blob]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      name: download_blob
  match_examples:
  - name: access azure blob download blob
    code: |
      import azure.storage.blob
      def example(user_input):
          return download_blob(user_input)
  description: "Disabled — BlobClient.download_blob() reads the receiver-selected blob; selector taint belongs on BlobClient construction."

  imports:
  - azure.storage.blob
