# Python sanitizers. Tag values follow the spec-canonical names
# (html-encode, html-sanitize, url-encode, shell-escape, sql-parameter,
# constant-time, jwt-verify, path-sanitize, xxe-sanitizer, ldap-escape,
# numeric-coerce, auth-sanitizer).

# -- HTML ------------------------------------------------------------
- id: python.sanitizer.html_escape
  enabled: true
  language: python
  tag: html-encode
  packages: [html]
  imports: [html]
  match:
    kind: call
    callee:
      regex: "^html\\.escape$"
  match_examples:
  - name: sanitizer html escape
    code: |
      import html
      def example(user_input):
          return html.escape(user_input)
    expect_match_text: [html.escape]
  description: html.escape — HTML-encodes `<`, `>`, `&` (and optionally quotes); neutralises reflected XSS.

- id: python.sanitizer.markupsafe_escape
  enabled: true
  language: python
  tag: html-encode
  packages: [markupsafe]
  match:
    kind: call
    callee:
      regex: "^markupsafe\\.escape$"
  match_examples:
  - name: sanitizer markupsafe escape
    code: |
      import markupsafe
      def example(user_input):
          return markupsafe.escape(user_input)
    expect_match_text: [markupsafe.escape]
  description: markupsafe.escape — HTML-encodes and returns a Markup-safe value.

- id: python.sanitizer.flask_escape
  enabled: true
  language: python
  tag: html-encode
  packages: [flask, markupsafe]
  match:
    kind: call
    callee:
      regex: "^flask\\.escape$"
  match_examples:
  - name: sanitizer flask escape
    code: |
      import flask
      def example(user_input):
          return flask.escape(user_input)
    expect_match_text: [flask.escape]
  description: flask.escape — MarkupSafe-backed HTML escaping for Flask response/template contexts.

- id: python.sanitizer.jinja2_escape
  enabled: true
  language: python
  tag: html-encode
  packages: [jinja2, markupsafe]
  match:
    kind: call
    callee:
      regex: "^jinja2\\.escape$"
  match_examples:
  - name: sanitizer jinja2 escape
    code: |
      import jinja2
      def example(user_input):
          return jinja2.escape(user_input)
    expect_match_text: [jinja2.escape]
  description: jinja2.escape — HTML-encodes a value using MarkupSafe semantics.

- id: python.sanitizer.bleach_clean
  enabled: true
  language: python
  tag: html-sanitize
  packages: [bleach]
  match:
    kind: call
    callee:
      regex: "^bleach\\.clean$"
  match_examples:
  - name: sanitizer bleach clean
    code: |
      import bleach
      def example(user_input):
          return bleach.clean(user_input)
    expect_match_text: [bleach.clean]
  description: bleach.clean — strips or allow-lists tags / attributes; safe HTML fragment.

- id: python.sanitizer.html_unescape_not_applicable
  enabled: false
  disabled_reason:
    code: over-broad
  language: python
  tag: non-sanitizer
  match:
    kind: call
    callee:
      attribute: [html, unescape]
  description: "Disabled — placeholder; html.unescape is the INVERSE of escape (it reintroduces taint). Kept only so tooling
    sees it explicitly marked as not-a-sanitizer."

