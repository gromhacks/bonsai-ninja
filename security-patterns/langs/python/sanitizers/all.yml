# Representation-transform passthroughs. These are not sanitizer
# credit; they declare value-preserving container/string transforms
# so the exact IDG can carry taint through common Python pipelines
# without hardcoding API names in the engine.
- id: python.passthrough.builtin_list
  enabled: true
  language: python
  tag: passthrough-transform
  match:
    kind: call
    callee:
      name: list
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: list materializes tainted iterable
    code: |
      def example(items):
          return list(items)
    expect_match_text: [list]
  description: "list(iterable) — materializes iterable elements; preserves taint from the iterable value."
- id: python.passthrough.builtin_map
  enabled: true
  language: python
  tag: passthrough-transform
  match:
    kind: call
    callee:
      name: map
  taint_semantics:
    call_result_passthrough_args: [1]
  match_examples:
  - name: map preserves tainted iterable
    code: |
      def example(items):
          return map(lambda item: item, items)
    expect_match_text: [map]
  description: "map(func, iterable) — transformed elements derive from iterable elements; preserves taint from the iterable argument."
- id: python.passthrough.functools_reduce_iterable
  enabled: true
  language: python
  tag: passthrough-transform
  match:
    kind: call
    callee:
      name: reduce
  taint_semantics:
    call_result_passthrough_args: [1]
  match_examples:
  - name: reduce folds tainted iterable
    code: |
      from functools import reduce
      def example(items):
          return reduce(lambda a, b: a + b, items, "")
    expect_match_text: [reduce]
  description: "functools.reduce(func, iterable, initial) — folded value derives from iterable elements; preserves taint from the iterable argument."
- id: python.passthrough.str_split_receiver
  enabled: true
  language: python
  tag: passthrough-transform
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_$][A-Za-z0-9_$\\.]*\\.split$"
  taint_semantics:
    call_result_passthrough_receiver: true
  match_examples:
