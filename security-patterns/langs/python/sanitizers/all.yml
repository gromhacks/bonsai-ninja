    code: |
      def example(user_input):
          return Lock.__enter__(user_input)
    expect_match_text: [Lock.__enter__]
  description: "`with lock:` enters the guarded block."

# Cookie-secure sanitizers (T402). Cookie-set calls with
# httpOnly + secure flags are the SAFE shape; reviewer
# enumerates with `security sanitizers --tag cookie-secure`
# and audits routes that set cookies WITHOUT them.
- id: python.cookie.set_cookie_with_httponly
  enabled: true
  language: python
  tag: cookie-secure
  match:
    kind: call
    callee:
      attribute: [response, set_cookie]
  constraints:
  - any_arg_matches_regex: |-
      httponly.*True|secure.*True
  match_examples:
  - name: cookie set cookie with httponly
    code: |
      def example(user_input):
          return response.set_cookie(user_input, "httponly=True")
    expect_match_text: [response.set_cookie]
  - name: cookie set cookie with httponly negative constraint boundary
    code: "def example(user_input):\n    return response.set_cookie()\n"
    expect_no_match: true
  description: "response.set_cookie(name, val, httponly=True, secure=True) — Django/Flask."

