    code: |
      def example(user_input):
          return validators.is_safe_url(user_input)
    expect_match_text: [validators.is_safe_url]
  description: "validators.is_safe_url(url) / is_safe_url(url) - boolean redirect-target check (Flask/Flask-Login canonical
    mitigation); pair with a host allowlist. CTFd uses the bare `is_safe_url` form; Flask-Login exposes it as `flask_login.utils.is_safe_url`."

