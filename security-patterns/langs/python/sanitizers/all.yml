    code: |
      import sqlalchemy
      def example(user_input):
          return bindparam(user_input)
    expect_match_text: [bindparam]
  description: SQLAlchemy bindparam — forces a parameterised placeholder instead of string concat.

- id: python.sanitizer.sqlalchemy_text_bindparams
  enabled: true
  language: python
  tag: sql-parameter
  frameworks: [sqlalchemy]
  packages: [sqlalchemy]
  match:
    kind: call
    callee:
      attribute: [text, bindparams]
  constraints:
  - min_args: 1
  match_examples:
  - name: sanitizer sqlalchemy text bindparams
    code: |
      import sqlalchemy
      def by_id(stmt, user_id):
          return text.bindparams(user_id)
    expect_match_text: [text.bindparams]
  description: SQLAlchemy TextClause.bindparams — binds values separately from the SQL text.

# -- Path / file upload ---------------------------------------------
- id: python.sanitizer.os_path_normpath
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: python
  tag: path-sanitize
  match:
    kind: call
    callee:
      attribute: [os, path, normpath]
  description: "Disabled — os.path.normpath collapses .. and . segments but still requires a trusted-root containment check."

- id: python.sanitizer.werkzeug_secure_filename
  enabled: true
  language: python
  tag: path-sanitize
  packages: [werkzeug]
  match:
    kind: call
    callee:
      attribute: [werkzeug, secure_filename]
  match_examples:
  - name: sanitizer werkzeug secure filename
    code: |
      import werkzeug
      def example(user_input):
          return werkzeug.secure_filename(user_input)
    expect_match_text: [werkzeug.secure_filename]
  description: werkzeug.utils.secure_filename — strips separators and unsafe chars from a client-supplied filename.

- id: python.sanitizer.os_path_commonpath
  enabled: true
  language: python
  tag: path-sanitize
  packages: [os]
  imports: [os]
  match:
    kind: call
    callee:
      attribute: [os, path, commonpath]
  constraints:
  - min_args: 1
  match_examples:
  - name: sanitizer os path commonpath
    code: |
      import os
      def example(root, candidate):
          return os.path.commonpath([root, candidate])
    expect_match_text: [os.path.commonpath]
  description: os.path.commonpath — containment primitive used to verify a normalized candidate remains under a trusted root.

- id: python.sanitizer.pathlib_relative_to
  enabled: true
  language: python
  tag: path-sanitize
  packages: [pathlib]
  imports: [pathlib]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_][A-Za-z0-9_]*\\.relative_to$"
  constraints:
  - min_args: 1
  match_examples:
  - name: sanitizer pathlib relative to
    code: |
      from pathlib import PurePath
      def example(raw, root):
          candidate = PurePath(raw)
          return candidate.relative_to(root)
    expect_match_text: [candidate.relative_to]
  description: pathlib Path.relative_to(root) — raises unless candidate is contained by the trusted root path.

- id: python.sanitizer.pathlib_is_relative_to
  enabled: true
  language: python
  tag: path-sanitize
  packages: [pathlib]
  imports: [pathlib]
  match:
    kind: call
    callee:
      regex: "^[A-Za-z_][A-Za-z0-9_]*\\.is_relative_to$"
  constraints:
  - min_args: 1
  match_examples:
  - name: sanitizer pathlib is relative to
    code: |
      from pathlib import PurePath
      def example(raw, root):
          candidate = PurePath(raw)
          return candidate.is_relative_to(root)
    expect_match_text: [candidate.is_relative_to]
  description: pathlib Path.is_relative_to(root) — boolean containment check for path traversal defenses.

