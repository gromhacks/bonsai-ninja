- id: python.sanitizer.lxml_xmlparser_safe_flags
  enabled: true
  language: python
  tag: xxe-sanitizer
  packages: [lxml]
  imports: [lxml]
  match:
    kind: call
    callee:
      attribute: [etree, XMLParser]
  constraints:
  - keyword_arg_equals:
      name: resolve_entities
      value: "False"
  match_examples:
  - name: sanitizer lxml xmlparser safe flags
    code: |
      import lxml
      def example():
          return etree.XMLParser(resolve_entities=False, no_network=True)
    expect_match_text: [etree.XMLParser]
  - name: sanitizer lxml xmlparser safe flags negative constraint boundary
    code: "import lxml\ndef example():\n    return etree.XMLParser()\n"
    expect_no_match: true
  description: lxml.etree.XMLParser(resolve_entities=False, ...) — prevents external entity expansion in lxml parsing.

