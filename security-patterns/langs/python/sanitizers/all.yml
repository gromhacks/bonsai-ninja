# -- JWT verify ------------------------------------------------------
- id: python.sanitizer.pyjwt_decode_verified
  enabled: true
  language: python
  tag: jwt-verify
  packages: [pyjwt]
  imports: [jwt]
  match:
    kind: call
    callee:
      attribute: [jwt, decode]
  constraints:
  - keyword_arg_equals:
      name: verify
      value: "True"
  match_examples:
  - name: sanitizer pyjwt decode verified
    code: |
      import pyjwt
      def example(user_input):
          return jwt.decode(user_input, verify=True)
    expect_match_text: [jwt.decode]
  - name: sanitizer pyjwt decode verified negative constraint boundary
    code: "import pyjwt\ndef example(user_input):\n    return jwt.decode()\n"
    expect_no_match: true
  description: jwt.decode(..., verify=True) — strict verify form; pair with an `algorithms=[...]` allow-list upstream.

- id: python.sanitizer.pyjwt_decode_algorithms_allowlist
  enabled: true
  language: python
  tag: jwt-verify
  packages: [pyjwt]
  imports: [jwt]
  match:
    kind: call
    callee:
      attribute: [jwt, decode]
  constraints:
  - arg_matches_regex:
      index: 2
      regex: "^\\[\\s*['\"](?:RS|ES|PS|HS)[0-9A-Za-z_-]+['\"]"
  - arg_not_matches_regex:
      index: 0
      regex: "verify\\s*=\\s*False|verify_signature['\"]\\s*:\\s*False|['\"]none['\"]"
  match_examples:
  - name: sanitizer pyjwt decode algorithms allowlist
    code: |
      import pyjwt
      def example(user_input, key):
          return jwt.decode(user_input, key, algorithms=["RS256"])
    expect_match_text: [jwt.decode]
  - name: sanitizer pyjwt decode algorithms allowlist negative constraint boundary
    code: "import pyjwt\ndef example(user_input, key):\n    return jwt.decode()\n"
    expect_no_match: true
  description: jwt.decode(..., algorithms=[...]) without disabled signature verification — verifies token signatures with
    an explicit algorithm allowlist.

