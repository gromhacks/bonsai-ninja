# Lock-acquire sanitizers (T502). Tagged `lock-acquire` so
# reviewer enumerates guarded sections; the in-scope-cleanse
# semantics handle 'while lock is held, accesses are safe'.
- id: python.lock.threading_lock_acquire
  enabled: true
  language: python
  tag: lock-acquire
  match:
    kind: call
    callee:
      attribute: [Lock, acquire]
  match_examples:
  - name: lock threading lock acquire
    code: |
      def example(user_input):
          return Lock.acquire(user_input)
    expect_match_text: [Lock.acquire]
  description: "threading.Lock.acquire() — guards subsequent shared-state access."
- id: python.lock.threading_rlock_acquire
  enabled: true
  language: python
  tag: lock-acquire
  match:
    kind: call
    callee:
      attribute: [RLock, acquire]
  match_examples:
  - name: lock threading rlock acquire
    code: |
      def example(user_input):
          return RLock.acquire(user_input)
    expect_match_text: [RLock.acquire]
  description: "threading.RLock.acquire() — re-entrant lock acquire."
- id: python.lock.with_lock_context
  enabled: true
  language: python
  tag: lock-acquire
  match:
    kind: call
    callee:
      attribute: [Lock, __enter__]
  match_examples:
