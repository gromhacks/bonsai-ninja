    kind: call
    callee:
      regex: "^[A-Za-z_][A-Za-z0-9_]*\\.execute$"
  constraints:
  - min_args: 2
  - arg_matches_regex:
      index: 0
      regex: "^(['\"])[^'\"]*(SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|VALUES)[^'\"]*(\\?|%s|:[A-Za-z_][A-Za-z0-9_]*|\\$[0-9]+)"
  - arg_not_matches_regex:
      index: 0
      regex: "f['\"]|\\+|\\.format\\("
  match_examples:
  - name: dbapi execute with params
    code: |
      from sqlite3 import Connection
      def by_id(user_id):
          conn = Connection("db.sqlite")
          return conn.execute("SELECT * FROM users WHERE id = %s", (user_id,))
    expect_match_text: [conn.execute]
  - name: dbapi execute with params negative constraint boundary
    code: "from sqlite3 import Connection\ndef by_id(user_id):\n    conn = Connection('db.sqlite')\n    return conn.execute()\n"
    expect_no_match: true
  description: "Python DB-API execute(sql, params) with a literal placeholder SQL string and separate parameter argument.
    Receiver-agnostic; package context gate on canonical DB-API drivers prevents over-matching."

