- id: python.typing.lifecycle_closed_receiver
  enabled: true
  language: python
  match:
    kind: call
    callee:
      regex: '(?:^|\.)(?:close|shutdown)$'
  lifecycle_transition:
    state: closed
    binding: { kind: receiver }
  match_examples:
  - name: close changes the receiver state
    code: "def f(resource):\n    resource.close()"
    expect_match_text: [resource.close]
  description: "Python close/shutdown moves the receiver to closed. Typing-only; never a finding."

- id: python.typing.lifecycle_cancelled_receiver
  enabled: true
  language: python
  match: { kind: call, callee: { name: cancel } }
