  imports: [os]
  match: { kind: call, callee: { attribute: [os, unlink] } }
  lifecycle_transition:
    state: freed
    binding: { kind: argument, index: 0 }
  match_examples:
  - name: os unlink changes the path state
    code: "import os\ndef f(path):\n    os.unlink(path)"
    expect_match_text: [os.unlink]
  description: "os.unlink moves argument zero to freed. Typing-only; never a finding."
