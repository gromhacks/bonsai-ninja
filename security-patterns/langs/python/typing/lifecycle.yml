- id: python.typing.lifecycle_os_closed_argument
  enabled: true
  language: python
  imports: [os]
  match: { kind: call, callee: { attribute: [os, close] } }
  lifecycle_transition:
    state: closed
    binding: { kind: argument, index: 0 }
  match_examples:
  - name: os close changes the descriptor state
    code: "import os\ndef f(fd):\n    os.close(fd)"
    expect_match_text: [os.close]
  description: "os.close moves argument zero to closed. Typing-only; never a finding."

- id: python.typing.lifecycle_os_freed_argument
