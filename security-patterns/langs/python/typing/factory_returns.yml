- id: python.typing.dbapi_cursor
  enabled: true
  language: python
  packages: [sqlite3, psycopg2, psycopg, mysql.connector, pymysql, pyodbc, oracledb, aiosqlite, asyncpg]
  returns_type: DBAPI.Cursor
  match:
    kind: call
    callee:
      name: cursor
  constraints:
  - receiver_type_in:
    - DBAPI.Connection
    - sqlite3.Connection
    - psycopg2.extensions.connection
    - psycopg.Connection
    - mysql.connector.connection.MySQLConnection
    - pymysql.connections.Connection
    - pyodbc.Connection
    - oracledb.Connection
    - aiosqlite.Connection
    - asyncpg.Connection
  match_examples:
  - name: cursor from an imported DB-API connection is typed
    code: |
      import sqlite3
      def example(user_input):
          conn = sqlite3.connect("app.db")
          c = conn.cursor()
          c.execute(user_input)
    expect_match_text: [conn.cursor]
  - name: unrelated cursor method is not a DB-API factory
    code: |
      import sqlite3
      class Report:
          def cursor(self): return object()
      def example(report: Report):
          return report.cursor()
    expect_no_match: true
  description: "A cursor created from an exactly typed DB-API connection receives the rulepack-owned DBAPI.Cursor identity. The method spelling alone is insufficient. Typing-only — never a finding."

