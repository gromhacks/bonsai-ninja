# Typing-only rules (RuleKind::Typing). They declare a factory method's
# return type via `returns_type` so the matcher resolves a sink's
# receiver type on a local assigned from that factory chain
# (`c = sqlite3.connect("db").cursor()` -> `c: cursor`), without the
# engine owning any method-name list. These NEVER produce findings; they
# feed `build_rulepack_typing`. The match_example MUST construct the
# receiver so a paired receiver-typed sink replays.
- id: python.typing.django_queryset_from_manager_filter
  enabled: true
  language: python
  packages: [django]
  returns_type: QuerySet
  match:
    kind: call
    callee:
      attribute: [objects, filter]
  match_examples:
  - name: django model manager filter returns QuerySet
    code: |
      from django.db import models
      class Product(models.Model):
          name = models.TextField()
      def example(user_input):
          qs = Product.objects.filter(active=True)
          return qs.extra(order_by=[user_input])
    expect_match_text: [Product.objects.filter]
  description: "A Django model manager's objects.filter(...) call returns a QuerySet. The model-manager syntax is rulepack-owned framework semantics; it types the assigned receiver so raw QuerySet escape-hatch sinks do not depend on local variable spelling."

