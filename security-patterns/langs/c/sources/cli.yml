# C local / CLI / environment sources.
- id: c.input.argv_param
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: param
    target:
      name: argv
      in_method: [main]
  match_examples:
  - name: main argv
    code: |
      int main(int argc, char **argv) {
        return argc;
      }
  - name: helper argv is not process argv
    code: |
      int helper(int argc, char **argv) {
        return argc;
      }
    expect_no_match: true
  description: "argv parameter of main()."
- id: c.input.environ
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [text]
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: read
    target:
      name: environ
  match_examples:
  - name: generated direct match
    code: |
      struct env_holder { char *environ; } env;
      void example(void) {
        char *x = env.environ;
      }
  description: "environ global - process environment."
- id: c.input.getenv
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [text]
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: call
    callee:
      name: getenv
  match_examples:
  - name: generated direct match
    code: |
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        getenv(arg);
      }
  description: "libc getenv - environment lookup including CGI variables (HTTP_*, QUERY_STRING)."
- id: c.input.fgets
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: fgets
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: generated direct match
    code: |
      void example(void) {
        char buf[256];
        fgets(buf, sizeof(buf), stdin);
      }
  description: "fgets - reads a line from stdin or file."
- id: c.input.fread
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      name: fread
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: fread output buffer
    code: |
      #include <stdio.h>
      void example(FILE *fp) {
        char buf[256];
        fread(buf, 1, sizeof(buf), fp);
      }
    expect_match_text: [fread]
  description: "fread(ptr, size, nmemb, stream) - libc binary read from a FILE* (stdin/file); the destination buffer becomes attacker-influenced. Unique libc name (no C++ stream collision)."
- id: c.input.fscanf
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: fscanf
  taint_semantics:
    source_output_args: [2, 3, 4, 5]
  match_examples:
  - name: fscanf output buffers
    code: |
      #include <stdio.h>
      void example(FILE *fp) {
        char user[64];
        char host[64];
        fscanf(fp, "%63s %63s", user, host);
      }
    expect_match_text: [fscanf]
  description: "fscanf(stream, format, ...) - reads formatted text from a FILE* into caller-supplied output arguments."
- id: c.input.gets_unsafe
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: gets
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: generated direct match
    code: |
      void example(void) {
        char buf[256];
        gets(buf);
      }
  description: "gets - unbounded stdin read (also a memory sink)."
- id: c.input.read
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [binary]
  packages: [unistd]
  match:
    kind: call
    callee:
      name: read
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: read output buffer
    code: |
      #include <unistd.h>
      void example(int fd) {
        char buf[256];
        read(fd, buf, sizeof(buf));
      }
    expect_match_text: [read]
  description: "POSIX read(fd, buf, count) - reads bytes from a file descriptor into the caller-supplied buffer. Trust is local because the descriptor may be a file, pipe, tty, or socket."
- id: c.input.pread
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      name: pread
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: pread output buffer
    code: |
      #include <unistd.h>
      void example(int fd) {
        char buf[256];
        pread(fd, buf, sizeof(buf), 0);
      }
    expect_match_text: [pread]
  description: "POSIX pread(fd, buf, count, offset) - reads descriptor bytes into the caller-supplied buffer without changing file offset."
- id: c.input.readv
  enabled: true
  language: c
  trust: local
  tag: local-input
