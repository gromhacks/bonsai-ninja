  match_examples:
  - name: mmap returned region
    code: |
      #include <sys/mman.h>
      void *example(int fd) {
        return mmap(0, 4096, PROT_READ, MAP_PRIVATE, fd, 0);
      }
    expect_match_text: [mmap]
  description: "POSIX mmap(..., fd, offset) - maps descriptor-backed bytes into memory; the returned region derives from file/device input."
