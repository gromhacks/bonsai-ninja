    expect_match_text: [readv]
  description: "POSIX readv(fd, iov, iovcnt) - scatter-read descriptor bytes into caller-supplied iovec buffers."
- id: c.input.preadv
  enabled: true
  language: c
  trust: local
  tag: local-input
