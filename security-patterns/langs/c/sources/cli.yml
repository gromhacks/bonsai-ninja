  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: generated direct match
    code: |
      void example(void) {
        char *line = 0;
        unsigned long len = 0;
        getline(&line, &len, stdin);
      }
  description: "POSIX getline(3) - reads a line from a stream into a heap buffer; stdin/file content is user-supplied."
