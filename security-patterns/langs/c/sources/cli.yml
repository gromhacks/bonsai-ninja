    expect_match_text: [preadv]
  description: "POSIX preadv(fd, iov, iovcnt, offset) - positioned scatter-read into caller-supplied iovec buffers."
- id: c.input.sscanf
  enabled: false
  disabled_reason:
    code: over-broad
  language: c
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: sscanf
  description: "Disabled - sscanf parses an in-memory buffer; taint comes from the buffer, not sscanf itself."
- id: c.input.scanf
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: scanf
  taint_semantics:
    source_output_args: [1, 2, 3, 4]
  match_examples:
  - name: generated direct match
    code: |
      void example(void) {
        char a[64];
        char b[64];
        char c[64];
        char d[64];
        scanf("%63s %63s %63s %63s", a, b, c, d);
      }
  description: "scanf - reads from stdin."
