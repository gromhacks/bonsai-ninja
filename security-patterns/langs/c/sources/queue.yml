# C queue / service-bus sources.
- id: c.input.kafka_consumer_poll
  enabled: true
  language: c
  trust: service
  tag: queue-input
  payload_types: [binary]
  packages: [rdkafka]
  match:
    kind: call
    callee:
      name: rd_kafka_consumer_poll
  match_examples:
  - name: generated direct match
    code: |
      #include <rdkafka/rdkafka.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        rd_kafka_consumer_poll(arg);
      }
  - name: librdkafka consumer close returns no message
    code: |
      #include <rdkafka/rdkafka.h>
      void close_consumer(rd_kafka_t *consumer) {
        rd_kafka_consumer_close(consumer);
      }
    expect_no_match: true
  description: "librdkafka rd_kafka_consumer_poll - message broker delivers producer-supplied payload; treat as untrusted service input."

- id: c.input.zmq_recv
  enabled: true
  language: c
  trust: service
  tag: queue-input
  payload_types: [binary]
  packages: [libzmq]
  match:
    kind: call
    callee:
      name: zmq_recv
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: generated direct match
    code: |
      #include <libzmq/zmq.h>
      void example(void) {
        char buf[4096];
        zmq_recv(0, buf, sizeof(buf), 0);
      }
  - name: zeromq send is outbound
    code: |
      #include <libzmq/zmq.h>
      void publish(void *socket, const char *buf, unsigned len) {
        zmq_send(socket, buf, len, 0);
      }
    expect_no_match: true
  description: "libzmq zmq_recv - receives a frame from the socket; peer is another service but payload is still untrusted."
