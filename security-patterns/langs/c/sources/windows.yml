- id: c.input.win_wsa_recv
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [winsock]
  match:
    kind: call
    callee:
      name: WSARecv
  description: "Disabled — WSARecv writes into a caller-supplied WSABUF; needs pointer-out source modeling."
- id: c.input.win_recv
  enabled: false
