# C Windows API input sources (Win32 environment, registry, command line, sockets).
# Bare-name matching is unavoidable here: Win32 functions are real exported globals
# from kernel32/advapi32/ws2_32 and headers do not place them in a namespace or
# package the loader can scope on. They are uniquely named (no libc collision risk).
- id: c.input.win_get_environment_variable_a
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [text]
  analysis_semantics:
    flow_classes: [environment-input]
  packages: [win32]
  match:
    kind: call
    callee:
      name: GetEnvironmentVariableA
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: win32 environment output buffer
    code: |
      #include <windows.h>
      void example(void) {
        char value[256];
        GetEnvironmentVariableA("APP_MODE", value, sizeof(value));
      }
    expect_match_text: [GetEnvironmentVariableA]
  - name: win32 environment setter is outbound
    code: |
      #include <windows.h>
      void configure(void) {
        SetEnvironmentVariableA("APP_MODE", "production");
      }
    expect_no_match: true
  description: "Win32 GetEnvironmentVariableA(name, buffer, size) writes process-environment text to output buffer argument 1; the return is a length/status."
  imports:
  - windows
  - windows.h
