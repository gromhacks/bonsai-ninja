- id: c.input.win_reg_query_value_ex_a
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [text]
  packages: [win32-advapi32]
  match:
    kind: call
    callee:
      name: RegQueryValueExA
  taint_semantics:
    source_output_args: [4]
  match_examples:
  - name: registry query data output
    code: |
      #include <winreg.h>
      void example(HKEY key) {
        char data[256]; DWORD size = sizeof(data), type = 0;
        RegQueryValueExA(key, "Endpoint", 0, &type, (BYTE *) data, &size);
      }
    expect_match_text: [RegQueryValueExA]
  - name: registry ANSI value setter is outbound
    code: |
      #include <winreg.h>
      void configure(HKEY key, const BYTE *data, DWORD size) {
        RegSetValueExA(key, "Endpoint", 0, REG_SZ, data, size);
      }
    expect_no_match: true
  description: "Win32 RegQueryValueExA writes registry value data to output buffer argument 4; the LSTATUS return is not the payload."
  imports:
  - winreg.h
  - winreg
  - advapi32
  - advapi32.h
