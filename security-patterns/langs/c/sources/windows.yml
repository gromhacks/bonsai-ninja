# C Windows API input sources (Win32 environment, registry, command line, sockets).
# Bare-name matching is unavoidable here: Win32 functions are real exported globals
# from kernel32/advapi32/ws2_32 and headers do not place them in a namespace or
# package the loader can scope on. They are uniquely named (no libc collision risk).
- id: c.input.win_get_environment_variable_a
  enabled: true
  language: c
  trust: local
  tag: local-input
  payload_types: [text]
  packages: [win32]
  match:
    kind: call
    callee:
      name: GetEnvironmentVariableA
  match_examples:
  - name: generated direct match
    code: |
      #include <windows.h>
      #include <windows.h>
      #include <windows.h> /* win32 */
      #include <windows.h> /* win32 */
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        GetEnvironmentVariableA(arg);
      }
  description: "Win32 GetEnvironmentVariableA — process environment lookup; same trust profile as getenv()."
  imports:
  - windows
  - windows.h
