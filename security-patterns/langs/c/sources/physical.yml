# C hardware / physical-input sources (GPIO, I2C/SMBus, SPI, UART, ADC).
- id: c.phys.gpio_get_value
  enabled: true
  language: c
  trust: physical
  tag: hw-input
  category: hardware-io
  packages: [linux-gpio]
  match:
    kind: call
    callee:
      name: gpio_get_value
  match_examples:
  - name: generated direct match
    code: |
      #include <linux/gpio.h>
      #include <linux/gpio.h>
      #include <linux/gpio.h> /* linux-gpio */
      #include <linux/gpio.h> /* linux-gpio */
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        gpio_get_value(arg);
      }
  description: "Linux gpio_get_value - GPIO pin read; physical-origin bit."

  imports:
  - linux
  - linux/gpio.h
