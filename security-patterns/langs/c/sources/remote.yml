# TLS / SSL record header fields parsed from a peer-controlled record.
# The Heartbleed (CVE-2014-0160) shape: a 16-bit length pulled from
# the heartbeat request reaches memcpy and reads server memory back.
# Param-name regex covers the OpenSSL / GnuTLS / mbedTLS conventions.
- id: c.input.tls_record_payload_len
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [openssl, libssl, gnutls, mbedtls]
  match:
    kind: param
    target:
      regex: "^(payload_length|payload_len|hbtype|hblen|record_length|frag_len)$"
  match_examples:
  - name: generated direct match
    code: |
      #include <openssl/evp.h>
      int example(int argc, char **payload_length) {
        return argc;
      }
  description: "TLS / DTLS record-header length / type fields parsed from a peer-controlled record (Heartbleed CVE-2014-0160 shape - `payload_length` flows from heartbeat request to memcpy). Scoped by openssl/libssl/gnutls/mbedtls package context."

# Generic untrusted-input parameter for shell-handling / path-handling
# C entry points. Names are deliberately narrow (the more aggressive
# wider list - user/arg/cmd/name/path/host/url/query/body - caused
# the c mega_flow fixture to report duplicate findings on construct-
# coverage param names). Tightened to obviously-untrusted nouns:
# `user_input`, `untrusted`, `attacker_input` plus the specific
# `cshell` shape `user`-prefix patterns. Disabled by default; flip
# in projects that want the broader audit hint.
- id: c.input.untrusted_string_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: c
  trust: remote
  tag: cli-input
  payload_types: [text]
  match:
    kind: param
    target:
      regex: "^(user_input|untrusted|attacker_input|tainted)$"
  description: "Disabled by default - narrow audit hint for C entry-point fns whose param name explicitly states the value is attacker-controlled. The broader `user`/`cmd`/`path`/`host` variant collides with mega_flow construct-coverage param names; enable per-project."
