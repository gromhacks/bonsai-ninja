# C remote-input sources (network syscalls returning attacker-controlled bytes).
- id: c.input.recv
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  match:
    kind: call
    callee:
      name: recv
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: recv output buffer
    code: |
      #include <sys/socket.h>
      void handle(int fd) {
        char buf[4096];
        recv(fd, buf, sizeof(buf), 0);
      }
    expect_match_text: [recv]
  description: "recv(fd, buf, len, flags) - remote bytes taint the caller-supplied buffer argument."
- id: c.input.recvfrom
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  match:
    kind: call
    callee:
