  match_examples:
  - name: recvmsg output message
    code: |
      #include <sys/socket.h>
      void handle(int fd, struct msghdr *msg) {
        recvmsg(fd, msg, 0);
      }
    expect_match_text: [recvmsg]
  description: "recvmsg(fd, msg, flags) - remote bytes taint the caller-supplied message/iov buffer state."
- id: c.input.recvmmsg
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  match:
    kind: call
    callee:
