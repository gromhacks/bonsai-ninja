        recvmmsg(fd, msgs, 8, 0, 0);
      }
    expect_match_text: [recvmmsg]
  description: "recvmmsg(fd, msgvec, vlen, flags, timeout) - Linux scatter-gather multi-message receive; remote bytes taint the caller-supplied mmsghdr/iov buffers."
