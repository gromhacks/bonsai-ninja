# TLS / SSL record header fields parsed from a peer-controlled record.
# The Heartbleed (CVE-2014-0160) shape: a 16-bit length pulled from
# the heartbeat request reaches memcpy and reads server memory back.
# Param-name regex covers the OpenSSL / GnuTLS / mbedTLS conventions.
- id: c.input.tls_record_payload_len
  enabled: false
  disabled_reason:
    code: over-broad
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [openssl, libssl, gnutls, mbedtls]
  match:
    kind: param
    target:
      regex: "^(payload_length|payload_len|hbtype|hblen|record_length|frag_len)$"
  description: "Disabled - a length-like parameter in a project using TLS does not prove it was parsed from a peer record. Socket/read sources and compiler propagation must establish that flow instead."

# Generic untrusted-input parameter for shell-handling / path-handling
# C entry points. Names are deliberately narrow (the more aggressive
# wider list - user/arg/cmd/name/path/host/url/query/body - reports
# ordinary construct parameters as duplicate sources). Tightened to
# obviously-untrusted nouns:
# `user_input`, `untrusted`, `attacker_input` plus the specific
# `cshell` shape `user`-prefix patterns. Disabled by default; flip
# in projects that want the broader audit hint.
- id: c.input.untrusted_string_param
  enabled: false
  disabled_reason:
    code: over-broad
  language: c
  trust: remote
  tag: cli-input
  payload_types: [text]
  match:
    kind: param
    target:
      regex: "^(user_input|untrusted|attacker_input|tainted)$"
  description: "Disabled by default - narrow audit hint for C entry-point functions whose parameter name explicitly states that the value is attacker-controlled. Broader generic identifier lists overmatch ordinary parameters; enable per project."
