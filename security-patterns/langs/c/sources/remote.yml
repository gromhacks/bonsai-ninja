- id: c.source.civetweb_handler_body_param
  enabled: true
  language: c
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [binary, text]
  packages: [civetweb]
  match:
    kind: param
    target:
      param_index_in: [1]
      param_type_in: [char]
      param_count_in: [3]
      signature_param_types:
      - index: 0
        type_in: [mg_connection, "struct mg_connection"]
      - index: 2
        type_in: [size_t]
  match_examples:
  - name: typed CivetWeb body callback parameter
    code: |
      #include <civetweb.h>
      void handle(struct mg_connection *connection, char *payload, size_t payload_size) {
        consume(payload, payload_size);
      }
    expect_match_text: [payload]
  - name: same payload position with an application context negative
    code: |
      #include <civetweb.h>
      struct local_context;
      void handle(struct local_context *connection, char *payload, size_t payload_size) {
        consume(payload, payload_size);
      }
    expect_no_match: true
  - name: CivetWeb metadata parameter is not the body negative
    code: |
      #include <civetweb.h>
      void handle(struct mg_connection *connection, const char *metadata, char *payload) {
        consume(metadata);
      }
    expect_no_match: true
  description: "The body byte parameter of a typed CivetWeb request callback. Exact parameter position, arity, and sibling parameter types identify the externally delivered body independently of callback or binding names."

