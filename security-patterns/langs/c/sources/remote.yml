# TLS / SSL record header fields parsed from a peer-controlled record.
# The Heartbleed (CVE-2014-0160) shape: a 16-bit length pulled from
# the heartbeat request reaches memcpy and reads server memory back.
# Param-name regex covers the OpenSSL / GnuTLS / mbedTLS conventions.
- id: c.source.civetweb_request_metadata
  enabled: true
  language: c
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query, path, header, text]
  packages: [civetweb]
  match:
    kind: call
    callee:
      regex: "^(mg_get_header|mg_get_request_info)$"
  match_examples:
  - name: civetweb request header
    code: |
      #include <civetweb.h>
      const char *header(struct mg_connection *conn) { return mg_get_header(conn, "X-Value"); }
    expect_match_text: [mg_get_header]
  - name: unrelated local getter negative
    code: |
      #include <civetweb.h>
      const char *get_header(void *object, const char *name) { return 0; }
      const char *header(void *object) { return get_header(object, "X-Value"); }
    expect_no_match: true
  description: "CivetWeb request header and request-info accessors; the returned request metadata originates at the connected HTTP client."

- id: c.source.civetweb_form_value_output
  enabled: true
  language: c
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query, form, text]
  match:
    kind: call
    callee:
      name: mg_get_var
      binding_origin: runtime-global
  taint_semantics:
    source_output_args: [3]
  constraints:
  - arg_count: 5
  match_examples:
  - name: civetweb decoded form value output
    code: |
      #include <civetweb.h>
      void value(const char *data, size_t len) {
        char out[128]; mg_get_var(data, len, "name", out, sizeof(out));
      }
    expect_match_text: [mg_get_var]
  - name: civetweb call without destination negative
    code: |
      #include <civetweb.h>
      void value(const char *data, size_t len) { mg_get_var(data, len, "name"); }
    expect_no_match: true
  - name: workspace mg_get_var collision negative
    code: |
      int mg_get_var(const char *data, unsigned long len, const char *name,
                     char *destination, unsigned long capacity) { return 0; }
      void value(const char *data, unsigned long len) {
        char out[128]; mg_get_var(data, len, "name", out, sizeof(out));
      }
    expect_no_match: true
  description: "CivetWeb mg_get_var(data,len,name,dst,dst_len) decodes request form/query data into output buffer argument 3; its integer return is only a status/length."

