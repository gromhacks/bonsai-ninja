- id: c.input.ssl_read_ex
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [openssl]
  match:
    kind: call
    callee:
      name: SSL_read_ex
  taint_semantics:
    source_output_args: [1]
  constraints:
  - min_args: 4
  - max_args: 4
  match_examples:
  - name: openssl read ex output buffer
    code: |
      #include <openssl/ssl.h>
      void handle(SSL *ssl) {
        unsigned char buf[4096]; size_t readbytes = 0;
        SSL_read_ex(ssl, buf, sizeof(buf), &readbytes);
      }
    expect_match_text: [SSL_read_ex]
  - name: openssl write ex is not input
    code: |
      #include <openssl/ssl.h>
      void send(SSL *ssl, const void *buf, size_t len) {
        size_t written = 0; SSL_write_ex(ssl, buf, len, &written);
      }
    expect_no_match: true
  description: "SSL_read_ex(ssl, buf, num, readbytes) writes TLS peer bytes to output buffer argument 1; readbytes is only the count."
