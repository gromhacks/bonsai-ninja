# C embedded-stack input sources (FreeRTOS queues/streams, lwIP network stack).
# These RTOS APIs deliver bytes that originated outside the firmware (peer device,
# network peer, ISR) so are inherently untrusted at the application layer.
- id: c.input.freertos_xqueue_receive
  enabled: true
  language: c
  trust: service
  tag: network-input
  payload_types: [binary]
  packages: [freertos]
  match:
    kind: call
    callee:
      name: xQueueReceive
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: FreeRTOS queue receive output buffer
    code: |
      #include <freertos/FreeRTOS.h>
      void handle(void *queue) {
        char item[128];
        xQueueReceive(queue, item, 0);
      }
    expect_match_text: [xQueueReceive]
  description: "FreeRTOS xQueueReceive(queue, pvBuffer, ticks) - queue data taints the caller-supplied buffer."
- id: c.input.freertos_xstream_buffer_receive
  enabled: true
  language: c
  trust: service
  tag: network-input
  payload_types: [binary]
  packages: [freertos]
  match:
    kind: call
    callee:
      name: xStreamBufferReceive
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: FreeRTOS stream buffer receive output buffer
    code: |
      #include <freertos/FreeRTOS.h>
      void handle(void *stream) {
        char buf[128];
        xStreamBufferReceive(stream, buf, sizeof(buf), 0);
      }
    expect_match_text: [xStreamBufferReceive]
  description: "FreeRTOS xStreamBufferReceive(stream, pvRxData, len, ticks) - received bytes taint the caller buffer."
