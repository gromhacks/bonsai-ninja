- id: c.input.lwip_netconn_recv
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [lwip]
  match:
    kind: call
    callee:
      name: netconn_recv
  match_examples:
  - name: generated direct match
    code: |
      #include <lwip/sockets.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        netconn_recv(arg);
      }
  description: "lwIP netconn_recv - returns a netbuf populated from the network peer; payload is attacker-controlled."
- id: c.input.lwip_netconn_recv_tcp_pbuf
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [lwip]
  match:
    kind: call
    callee:
      name: netconn_recv_tcp_pbuf
  match_examples:
  - name: generated direct match
    code: |
      #include <lwip/sockets.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        netconn_recv_tcp_pbuf(arg);
      }
  description: "lwIP netconn_recv_tcp_pbuf - returns a pbuf chain holding TCP segment payload from the network."
- id: c.input.lwip_netbuf_data
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [lwip]
  match:
    kind: call
    callee:
      name: netbuf_data
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: lwIP netbuf_data output pointer
    code: |
      #include <lwip/api.h>
      void handle(struct netbuf *nb) {
        void *data;
        unsigned short len;
        netbuf_data(nb, &data, &len);
      }
    expect_match_text: [netbuf_data]
  description: "lwIP netbuf_data(netbuf, dataptr, len) - exposes network-payload bytes through the data out-parameter."
