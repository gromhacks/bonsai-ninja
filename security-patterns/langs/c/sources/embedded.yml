- id: c.input.lwip_netconn_recv
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [lwip]
  match:
    kind: call
    callee:
      name: netconn_recv
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: lwip netconn receive output
    code: |
      #include <lwip/api.h>
      void example(struct netconn *conn) {
        struct netbuf *buf;
        netconn_recv(conn, &buf);
      }
    expect_match_text: [netconn_recv]
  - name: lwip netconn send is outbound
    code: |
      #include <lwip/api.h>
      void publish(struct netconn *conn, struct netbuf *buf) {
        netconn_send(conn, buf);
      }
    expect_no_match: true
  description: "lwIP netconn_recv(conn, &buf) writes the received network buffer through output argument 1; the return is an err_t status."
- id: c.input.lwip_netconn_recv_tcp_pbuf
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [lwip]
