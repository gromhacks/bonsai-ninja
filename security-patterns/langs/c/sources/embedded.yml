  match_examples:
  - name: lwip tcp pbuf receive output
    code: |
      #include <lwip/api.h>
      void example(struct netconn *conn) {
        struct pbuf *buf;
        netconn_recv_tcp_pbuf(conn, &buf);
      }
    expect_match_text: [netconn_recv_tcp_pbuf]
  - name: lwip netconn write is outbound
    code: |
      #include <lwip/api.h>
      void publish(struct netconn *conn, const void *data, unsigned len) {
        netconn_write(conn, data, len, NETCONN_COPY);
      }
    expect_no_match: true
  description: "lwIP netconn_recv_tcp_pbuf(conn, &pbuf) writes the received TCP pbuf through output argument 1; the return is an err_t status."
- id: c.input.lwip_netbuf_data
