  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [lwip]
  match:
    kind: call
    callee:
      name: netbuf_data
  taint_semantics:
    source_output_args: [1]
  match_examples:
  - name: lwIP netbuf_data output pointer
    code: |
      #include <lwip/api.h>
      void handle(struct netbuf *nb) {
        void *data;
        unsigned short len;
        netbuf_data(nb, &data, &len);
      }
    expect_match_text: [netbuf_data]
  description: "lwIP netbuf_data(netbuf, dataptr, len) - exposes network-payload bytes through the data out-parameter."
