# C embedded-stack input sources (FreeRTOS queues/streams, lwIP network stack).
# These RTOS APIs deliver bytes that originated outside the firmware (peer device,
# network peer, ISR) so are inherently untrusted at the application layer.
- id: c.input.freertos_xqueue_receive
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: c
  trust: service
  tag: network-input
  payload_types: [binary]
  packages: [freertos]
  match:
    kind: call
    callee:
      name: xQueueReceive
  description: "Disabled — FreeRTOS xQueueReceive writes into the caller-supplied pvBuffer; needs pointer-out source modeling."
- id: c.input.freertos_xstream_buffer_receive
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: c
  trust: service
  tag: network-input
  payload_types: [binary]
  packages: [freertos]
  match:
    kind: call
    callee:
      name: xStreamBufferReceive
  description: "Disabled — FreeRTOS xStreamBufferReceive copies into a caller buffer; needs pointer-out modeling."
- id: c.input.freertos_xmessage_buffer_receive
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: c
  trust: service
  tag: network-input
  payload_types: [binary]
  packages: [freertos]
  match:
    kind: call
    callee:
      name: xMessageBufferReceive
  description: "Disabled — FreeRTOS xMessageBufferReceive copies a message frame into a caller buffer; needs pointer-out modeling."
- id: c.input.lwip_netconn_recv
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [lwip]
  match:
    kind: call
    callee:
      name: netconn_recv
  match_examples:
  - name: generated direct match
    code: |
      #include <lwip/sockets.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        netconn_recv(arg);
      }
  description: "lwIP netconn_recv — returns a netbuf populated from the network peer; payload is attacker-controlled."
- id: c.input.lwip_netconn_recv_tcp_pbuf
  enabled: true
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [lwip]
  match:
    kind: call
    callee:
      name: netconn_recv_tcp_pbuf
  match_examples:
  - name: generated direct match
    code: |
      #include <lwip/sockets.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        netconn_recv_tcp_pbuf(arg);
      }
  description: "lwIP netconn_recv_tcp_pbuf — returns a pbuf chain holding TCP segment payload from the network."
- id: c.input.lwip_netbuf_data
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: c
  trust: remote
  tag: network-input
  payload_types: [binary]
  packages: [lwip]
  match:
    kind: call
    callee:
      name: netbuf_data
  description: "Disabled — netbuf_data writes the data pointer/len through out-params; needs pointer-out modeling."
