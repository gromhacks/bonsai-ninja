  match_examples:
  - name: strip non slug chars
    code: |
      #include <glib.h>
      void example(char *input) {
        g_regex_replace("[^A-Za-z0-9_-]", input, -1, 0, "", 0, 0);
      }
    expect_match_text: [g_regex_replace]
  - name: strip non slug chars negative constraint boundary
    code: "#include <glib.h>\nvoid example(char *input) {\n  g_regex_replace();\n}\n"
    expect_no_match: true
  description: "GLib regex replace that removes characters outside a safe allowlist by replacing `[^...]` with empty string."

# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) — taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: c.passthrough.curl_easy_unescape
  enabled: true
  language: c
  tag: passthrough-decode
  match:
    kind: call
    callee:
      name: curl_easy_unescape
  match_examples:
  - name: generated direct match
    code: |
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        curl_easy_unescape(arg);
      }
    expect_match_text: [curl_easy_unescape]
  description: "libcurl curl_easy_unescape(curl, s, len, &outlen) — preserves taint."

