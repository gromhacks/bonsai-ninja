- id: c.sanitizer.path_prefix_strncmp
  enabled: true
  language: c
  tag: same-origin-path
  match:
    kind: call
    callee:
      regex: "^(strncmp|memcmp)$"
  constraints:
  - arg_matches_regex:
      index: 1
      regex: '^"/[^"]*"$'
  - min_args: 3
  match_examples:
  - name: relative redirect prefix check
    code: |
      void example(char *target) {
        strncmp(target, "/app/", 5);
      }
    expect_match_text: [strncmp]
  - name: relative redirect prefix check negative constraint boundary
    code: "void example(char *target) {\n  strncmp();\n}\n"
    expect_no_match: true
  description: "strncmp/memcmp against a literal slash-prefixed path prefix — common C guard for same-origin redirects or
    chrooted path routing. Scoped to prefix literals and three-arg compare calls."

