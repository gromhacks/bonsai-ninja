- id: c.format.printf_tainted
  aliases:
    - c.info_disclosure.printf_secret
  enabled: true
  language: c
  tag: format-string
  severity: high
  cwe: [CWE-134, CWE-200]
  match:
    kind: call
    callee:
      name: printf
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted format string
    code: |
      void example(char *input) {
        char *fmt = input;
        printf(fmt);
      }
  - name: literal format negative
    code: |
      void example(void) {
        printf("%s", "safe");
      }
    expect_no_match: true
  description: "printf — tainted format string. Also covers merged aliases: c.info_disclosure.printf_secret."
