- id: c.cmdi.system
  enabled: true
  language: c
  tag: command-injection
  severity: critical
  category: process-exec
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: system
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted command string
    code: |
      void example(char *input) {
        system(input);
      }
  - name: literal command negative
    code: |
      void example(void) {
        system("safe");
      }
    expect_no_match: true
  description: "libc system() - passes the string to /bin/sh -c; any attacker metacharacter (;|`$()) runs arbitrary commands."
- id: c.cmdi.popen
  enabled: true
