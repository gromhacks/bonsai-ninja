  - windows
  - windows.h
- id: c.cmdi.fexecve
  enabled: true
  language: c
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: fexecve
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: |
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        fexecve(arg);
      }
  - name: literal arg 1 negative
    code: |
      void example(void) {
        fexecve("safe", "safe");
      }
    expect_no_match: true
  description: "fexecve(fd, argv, envp) - exec from an open fd; tainted fd / argv runs attacker-chosen binary."
- id: c.cmdi.fexecve_envp
  enabled: true
  language: c
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: fexecve
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: tainted arg 2
    code: |
      void example(char *input) {
        fexecve("safe", "safe", input);
      }
  - name: literal arg 2 negative
    code: |
      void example(void) {
        fexecve("safe", "safe", "safe");
      }
    expect_no_match: true
  description: "fexecve(fd, argv, envp) - tainted envp reaches the spawned process."
- id: c.cmdi.fork_exec
  enabled: false
  disabled_reason:
    code: over-broad
  language: c
  tag: command-injection
  severity: medium
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: fork
  description: "Disabled - fork by itself is fine; flag with adjacent execve."
