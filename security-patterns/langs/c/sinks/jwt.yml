# C JWT (libjwt + cjose + l8w8jwt).
- id: c.jwt.libjwt_decode
  enabled: true
  language: c
  tag: jwt
  severity: high
  packages: [libjwt]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      name: jwt_decode
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <libjwt/jwt.h>
      void example(char *arg) {
        char *fmt = arg;
        jwt_decode(arg);
      }
  - name: literal jwt negative
    code: "#include <libjwt/jwt.h>\nvoid example(void) {\n  char *arg = \"tainted\";\n  char *fmt = arg;\n  jwt_decode(arg);\n}\n"
    expect_no_match: true
  description: "libjwt jwt_decode - flag if jwt_set_alg not pinned."

