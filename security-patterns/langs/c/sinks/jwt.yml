# C JWT (libjwt + cjose + l8w8jwt).
- id: c.jwt.libjwt_decode
  enabled: true
  language: c
  tag: jwt
  severity: high
  packages: [libjwt]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      name: jwt_decode
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <libjwt/jwt.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        jwt_decode(arg);
      }
  - name: literal jwt negative
    code: "#include <libjwt/jwt.h>\nvoid example(void) {\n  char *arg = \"tainted\"\
      ;\n  char *fmt = arg;\n  jwt_decode(arg);\n}\n"
    expect_no_match: true
  description: "libjwt jwt_decode — flag if jwt_set_alg not pinned."

- id: c.jwt.libjwt_new_with_string
  enabled: false
  disabled_reason:
    code: over-broad
  language: c
  tag: jwt
  severity: medium
  packages: [libjwt]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      name: jwt_new
  description: "Disabled — jwt_new creates token; flag with alg=none only."

- id: c.jwt.cjose_jws_verify
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: c
  tag: jwt
  severity: high
  packages: [cjose]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      name: cjose_jws_verify
  match_examples:
  - name: generated direct match
    code: |
      #include <cjose.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        cjose_jws_verify(arg);
      }
  description: "Disabled — requires a rulepack constraint that proves the unsafe JWT
    configuration, not just the broad API shape. cjose cjose_jws_verify — flag if
    alg whitelist missing."

