      expect_no_match: true
  description: "calloc(nmemb, size) — tainted element size can overflow nmemb*size and under-allocate."
- id: c.memory.realloc_tainted_size
  enabled: true
  language: c
  tag: memory-safety
  severity: high
  cwe: [CWE-190, CWE-789, CWE-787]
  match:
    kind: call
    callee:
      name: realloc
  constraints:
    - arg_tainted:
        index: 1
  match_examples:
    - name: tainted new size
      code: |
        void *realloc(void *ptr, unsigned long size);
        int main(int argc, char **argv) {
          void *ptr = 0;
          realloc(ptr, argv);
          return argc;
        }
    - name: tainted pointer is not tainted new size
      code: |
        void *realloc(void *ptr, unsigned long size);
        int main(int argc, char **argv) {
          realloc(argv, 64);
          return argc;
        }
      expect_no_match: true
  description: "realloc(ptr, n) — tainted size with multiplicative computation overflows to small allocation; subsequent writes against original size go OOB."
- id: c.memory.aligned_alloc_tainted_size
  enabled: true
  language: c
  tag: memory-safety
