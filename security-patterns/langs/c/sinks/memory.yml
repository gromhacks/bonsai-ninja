- id: c.memory.memcpy
  enabled: true
  language: c
  tag: memory-safety
  severity: high
  cwe: [CWE-120, CWE-125, CWE-787]
  match:
    kind: call
    callee:
      name: memcpy
  constraints:
    - arg_tainted:
        index: 2
  match_examples:
    - name: tainted length
      code: |
        void example(char *dst, char *src, unsigned long n) {
          memcpy(dst, src, n);
        }
    - name: fixed length is not tainted n
      code: |
        #define FIXED_LEN 40
        void example(char *dst, char *src) {
          memcpy(dst, src, FIXED_LEN);
        }
      expect_no_match: true
  description: "memcpy(dst, src, n) — tainted n past dst is OOB write (CWE-787); tainted n past src is OOB read (CWE-125, e.g. Heartbleed); generic copy-overflow is CWE-120."
