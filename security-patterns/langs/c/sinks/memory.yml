- id: c.memory.free_double
  enabled: true
  language: c
  tag: memory-safety
  severity: high
  cwe: [CWE-415]
  match:
    kind: call
    callee:
      name: free
  constraints:
  - requires_state:
      name: p
      expected: freed
  match_examples:
  - name: double free
    code: |
      void example(int *p) {
          free(p);
          free(p);
      }
    expect_match_text: [free]
  - name: single free
    code: |
      void example(int *p) {
          free(p);
      }
    expect_no_match: true
  description: "Double-free — `free(p)` called when the binding is already `freed` from a preceding `free(p)`. Re-freeing is a heap-corruption primitive (CWE-415); glibc tcache / dlmalloc poisoning attacks pivot off this. The `requires_state` constraint gates on the binding's actual `freed` lifecycle state, so the single-free case stays silent."
- id: c.memory.realloc_zero
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: c
  tag: memory-safety
  severity: medium
  cwe: [CWE-401]
  match:
    kind: call
    callee:
      name: realloc
  description: "Disabled — realloc with zero size returns NULL on some libc."
# Allocation-size sinks. malloc/calloc/realloc/aligned_alloc with a
# tainted size argument is the classic CWE-190 (integer overflow ->
# smaller-than-expected buffer -> OOB write on subsequent copy).
# Sinks fire only when taint reaches the size parameter — the engine
# decides reachability; the rule just labels the site.
- id: c.memory.malloc_tainted_size
  enabled: true
  language: c
  tag: memory-safety
  severity: high
  cwe: [CWE-190, CWE-789, CWE-787]
  match:
    kind: call
    callee:
      name: malloc
  constraints:
    - arg_tainted:
        index: 0
  match_examples:
    - name: tainted allocation size
      code: |
        void *malloc(unsigned long size);
        int main(int argc, char **argv) {
          malloc(argv);
          return argc;
        }
    - name: sizeof operand is not runtime size taint
      code: |
        void *malloc(unsigned long size);
        int main(int argc, char **argv) {
          unsigned long cap = 32;
          malloc(sizeof(argv) * cap);
          return argc;
        }
      expect_no_match: true
  description: "malloc(n) with a tainted/computed size — CWE-190 integer overflow when arithmetic on attacker-controlled values wraps to a smaller allocation, leading to OOB writes (CWE-787) by later copies sized against the un-overflowed value."
- id: c.memory.calloc_tainted_size
  enabled: true
  language: c
  tag: memory-safety
  severity: high
  cwe: [CWE-190, CWE-789, CWE-787]
  match:
    kind: call
    callee:
      name: calloc
  constraints:
    - arg_tainted:
        index: 0
  match_examples:
    - name: tainted element count
      code: |
        void *calloc(unsigned long count, unsigned long size);
        int main(int argc, char **argv) {
          calloc(argv, sizeof(char));
          return argc;
        }
    - name: fixed element count and size
      code: |
        void *calloc(unsigned long count, unsigned long size);
        int main(int argc, char **argv) {
          calloc(32, sizeof(char));
          return argc;
        }
      expect_no_match: true
  description: "calloc(nmemb, size) — tainted nmemb can overflow size_t producing a small allocation."
- id: c.memory.calloc_tainted_element_size
