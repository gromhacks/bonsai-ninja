- id: c.memory.strcpy
  enabled: true
  language: c
  tag: memory-safety
  severity: critical
  cwe: [CWE-120]
  match:
    kind: call
    callee:
      name: strcpy
  match_examples:
    - name: generated direct match
      code: |
        void example(void) {
          char *arg = "tainted";
          char *fmt = arg;
          strcpy(arg);
        }
  description: "strcpy(dst, tainted_src) — copies until NUL with no length check; classic stack/heap buffer overflow."
