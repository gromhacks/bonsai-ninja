# C open-redirect.
- id: c.open_redirect.mg_http_reply_location
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: c
  tag: open-redirect
  severity: high
  packages: [mongoose]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      name: mg_http_reply
  description: "Disabled - open redirect needs header/status-aware constraints for Location responses; c.xss.mongoose_http_reply only covers the tainted response-body surface."

