# C hardware-control / bus-write sinks (GPIO, PWM, I2C/SMBus, SPI, UART).
- id: c.hardware.gpio_set_value
  enabled: true
  language: c
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [linux-gpio]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      name: gpio_set_value
  match_examples:
  - name: generated direct match
    code: |
      #include <linux/gpio.h>
      #include <linux/gpio.h>
      #include <linux/gpio.h> /* linux-gpio */
      #include <linux/gpio.h> /* linux-gpio */
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        gpio_set_value(arg);
      }
  description: "gpio_set_value - tainted pin/value drives physical hardware state."

  imports:
  - linux
  - linux/gpio.h
