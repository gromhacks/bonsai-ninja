- id: c.hardware.serialport_blocking_write
  enabled: true
  language: c
  tag: state-manipulation
  severity: high
  category: hardware-io
  packages: [libserialport]
  cwe: [CWE-15, CWE-284]
  match:
    kind: call
    callee:
      name: sp_blocking_write
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: serialport blocking write tainted buffer
    code: |
      #include <libserialport.h>
      void example(struct sp_port *port, char *user_input) {
        sp_blocking_write(port, user_input, 4, 1000);
      }
  - name: serialport blocking write literal negative
    code: |
      #include <libserialport.h>
      void example(struct sp_port *port) {
        char safe[] = "ok";
        sp_blocking_write(port, safe, 2, 1000);
      }
    expect_no_match: true
  description: "sp_blocking_write(port, buffer, count, timeout) - attacker-controlled bytes are transmitted to a serial-attached device."

