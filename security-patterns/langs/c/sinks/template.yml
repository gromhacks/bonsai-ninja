- id: c.template.mustach_render
  enabled: true
  language: c
  tag: ssti
  severity: medium
  packages: [mustach]
  cwe: [CWE-1336]
  match:
    kind: call
    callee:
      name: mustach
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: mustach render tainted template
    code: |
      #include <mustach.h>
      void example(char *tmpl) {
        mustach(tmpl);
      }
    expect_match_text: [mustach]
  - name: literal arg 0 negative
    code: |
      void example(void) {
        mustach("safe");
      }
    expect_no_match: true
  description: "mustach(tainted template) - rendering attacker-controlled template source can expose SSTI-like template expansion behavior."

