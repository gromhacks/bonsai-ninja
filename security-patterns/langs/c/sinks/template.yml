# C template / format-string sinks.
- id: c.template.mustach_mem
  enabled: true
  language: c
  tag: ssti
  severity: medium
  packages: [mustach]
  cwe: [CWE-1336]
  match:
    kind: call
    callee:
      name: mustach_mem
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <mustach.h>
      void example(char *arg) {
        char *fmt = arg;
        mustach_mem(arg);
      }
  - name: literal arg 0 negative
    code: |
      void example(void) {
        mustach_mem("safe");
      }
    expect_no_match: true
  description: "mustach_mem with tainted template source."

