# C dynamic-code / dlopen / embedded interpreters.
- id: c.eval.dlopen
  enabled: true
  language: c
  tag: code-injection
  severity: critical
  cwe: [CWE-94, CWE-470]
  match:
    kind: call
    callee:
      name: dlopen
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        dlopen(arg);
      }
  - name: literal arg 0 negative
    code: |
      void example(void) {
        dlopen("safe");
      }
    expect_no_match: true
  description: "dlopen(tainted) - loads arbitrary shared library."

