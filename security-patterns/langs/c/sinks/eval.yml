- id: c.eval.dlsym
  enabled: true
  language: c
  tag: code-injection
  severity: medium
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: dlsym
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted symbol name
    code: |
      void example(void *handle, char *symbol) {
        dlsym(handle, symbol);
      }
  - name: literal symbol name negative
    code: |
      void example(void *handle) {
        dlsym(handle, "plugin_init");
      }
    expect_no_match: true
  description: "dlsym(handle, tainted_symbol) - resolves an attacker-chosen symbol from a loaded library; unsafe plugin dispatch can become code execution."

