- id: c.xss.fcgi_print
  enabled: true
  language: c
  tag: xss
  severity: low
  packages: [fcgi]
  cwe: [CWE-79]
  match:
    kind: call
    callee:
      name: FCGI_printf
  constraints:
  - any_arg_tainted: true
  match_examples:
  - name: tainted fcgi response body
    code: |
      #include <fcgi.h>
      #include <fcgi_stdio.h>
      void example(char *body) {
        FCGI_printf("%s", body);
      }
  - name: literal fcgi response body negative
    code: |
      #include <fcgi.h>
      #include <fcgi_stdio.h>
      void example(void) {
        FCGI_printf("%s", "safe");
      }
    expect_no_match: true
  description: "FCGI_printf(..., tainted) - writes attacker-controlled bytes into a FastCGI HTTP response body; dangerous when the response is HTML."
