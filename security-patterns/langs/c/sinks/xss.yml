  match:
    kind: call
    callee:
      name: mg_printf
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <mongoose.h>
      void example(void) {
        char *arg = "tainted";
