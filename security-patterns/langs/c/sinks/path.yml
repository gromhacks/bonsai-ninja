- id: c.path.fopen
  enabled: true
  language: c
  tag: path-traversal
  severity: high
  cwe:
  - CWE-22
  match:
    kind: call
    callee:
      name: fopen
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: "void example(void) {\n  char *arg = \"tainted\";\n  char *fmt = arg;\n  fopen(arg);\n}\n"
