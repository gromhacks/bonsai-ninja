- id: c.xxe.libxml2_xml_read_file
  enabled: true
  language: c
  tag: xxe
  severity: high
  packages: [libxml2]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      name: xmlReadFile
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <libxml2/libxml/parser.h>
      void example(char *arg) {
        char *fmt = arg;
        xmlReadFile(arg);
      }
  - name: literal arg 0 negative
    code: |
      void example(void) {
        xmlReadFile("safe");
      }
    expect_no_match: true
  description: "libxml2 xmlReadFile - disable external entities."
