- id: c.xxe.expat_set_entity_decl_handler
  enabled: true
  language: c
  tag: xxe
  category: source-independent
  severity: high
  packages: [expat]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      name: XML_SetEntityDeclHandler
  match_examples:
  - name: generated direct match
    code: |
      #include <expat.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        XML_SetEntityDeclHandler(arg);
      }
  description: "libexpat XML_SetEntityDeclHandler - registering an entity-decl handler implies the parser resolves external entities; disable or reject SYSTEM/PUBLIC refs."

