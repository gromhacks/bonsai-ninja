- id: c.xxe.libxml2_xml_read_file
  enabled: true
  language: c
  tag: xxe
  severity: high
  packages: [libxml2]
  imports: [libxml/parser.h, libxml2/libxml/parser.h]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      name: xmlReadFile
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated direct match
    code: |
      #include <libxml2/libxml/parser.h>
      void example(char *arg) {
        char *fmt = arg;
        xmlReadFile(arg);
      }
  - name: literal arg 0 negative
    code: |
      void example(void) {
        xmlReadFile("safe");
      }
    expect_no_match: true
  description: "libxml2 xmlReadFile - disable external entities."
- id: c.xxe.libxml2_xml_read_memory
  enabled: true
  language: c
  tag: xxe
  severity: high
  packages: [libxml2]
  imports: [libxml/parser.h, libxml2/libxml/parser.h]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      name: xmlReadMemory
  constraints:
  - arg_tainted:
      index: 0
  - arg_matches_regex:
      index: 4
      regex: '(?:XML_PARSE_NOENT|XML_PARSE_DTDLOAD)'
  match_examples:
  - name: libxml2 entity-expanding memory parse
    code: |
      #include <libxml2/libxml/parser.h>
      void example(char *arg) {
        xmlReadMemory(arg, 1, 0, 0, XML_PARSE_NOENT | XML_PARSE_DTDLOAD);
      }
    expect_match_text: [xmlReadMemory]
  - name: literal XML input negative
    code: |
      void example(void) {
        xmlReadMemory("<safe/>", 7, 0, 0, XML_PARSE_NOENT);
      }
    expect_no_match: true
  - name: non-network parser without entity expansion negative
    code: |
      #include <libxml2/libxml/parser.h>
      void example(char *arg) {
        xmlReadMemory(arg, 1, 0, 0, XML_PARSE_NONET);
      }
    expect_no_match: true
  description: "libxml2 xmlReadMemory on tainted XML with XML_PARSE_NOENT or XML_PARSE_DTDLOAD explicitly enables external-entity/DTD processing; safe option sets remain quiet."
