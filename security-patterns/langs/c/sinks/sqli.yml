- id: c.sqli.sqlite3_exec
  enabled: true
  language: c
  tag: sql-injection
  severity: critical
  packages: [sqlite3]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: sqlite3_exec
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: |
      #include <sqlite3.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        sqlite3_exec(arg);
      }
  - name: literal arg 1 negative
    code: |
      void example(void) {
        sqlite3_exec("safe", "safe");
      }
    expect_no_match: true
  description: "sqlite3_exec(db, tainted_sql, ...) - runs raw SQL; no parameterisation, concatenating user input = SQLi."
