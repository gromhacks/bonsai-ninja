- id: c.crypto.md5_init
  enabled: true
  language: c
  tag: weak-crypto
  category: source-independent
  severity: low
  packages: [openssl]
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      name: MD5_Init
  match_examples:
  - name: generated direct match
    code: |
      #include <openssl/evp.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        MD5_Init(arg);
      }
  description: "OpenSSL MD5_Init."
