# C unsafe native-record reconstruction sinks.
#
# The adapter proves only that argument 0 is the address of one complete
# struct/union object. This rule assigns security meaning to `memcpy` and the
# tainted source operand; byte-buffer copies and field-address copies do not
# satisfy the destination-shape constraint.
- id: c.deser.memcpy_into_aggregate
  enabled: true
  language: c
  tag: insecure-deserialization
  severity: high
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: memcpy
  constraints:
  - arg_value_kind:
      index: 0
      kind: address_of_aggregate
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted bytes copied into complete native record
    code: |
      #include <string.h>
      typedef struct { unsigned role; char name[32]; } session_t;
      void restore(const unsigned char *input, unsigned n) {
        session_t state;
        memcpy(&state, input, n < sizeof(state) ? n : sizeof(state));
      }
  - name: bounded byte-buffer copy is not native-record reconstruction
    code: |
      #include <string.h>
      void restore(const unsigned char *input, unsigned n) {
        unsigned char bytes[64];
        if (n > sizeof(bytes)) n = sizeof(bytes);
        memcpy(bytes, input, n);
      }
    expect_no_match: true
  - name: trusted literal bytes are not tainted deserialization
    code: |
      #include <string.h>
      typedef struct { unsigned role; } session_t;
      void restore(void) {
        static const unsigned char trusted[] = { 0, 0, 0, 0 };
        session_t state;
        memcpy(&state, trusted, sizeof(state));
      }
    expect_no_match: true
  description: "memcpy(&record, tainted_bytes, size) reconstructs a native struct/union directly from attacker-controlled representation bytes. Length bounds can prevent overflow but do not validate the record's semantic fields."
