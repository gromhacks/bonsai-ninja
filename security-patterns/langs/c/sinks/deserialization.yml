# C deserialization sinks.
- id: c.deser.libxml2_xmlreadmemory
  enabled: false
  disabled_reason:
    code: over-broad
  language: c
  tag: insecure-deserialization
  severity: high
  packages: [libxml2]
  cwe: [CWE-502, CWE-611]
  match:
    kind: call
    callee:
      name: xmlReadMemory
  description: "Disabled — canonical rule is c.xxe.libxml2_xml_read_memory in xxe.yml. libxml2 readers are XXE, not deserialization."

