# C TLS misconfig (OpenSSL + libcurl + GnuTLS).
- id: c.tls.openssl_set_verify_none
  enabled: true
  language: c
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [openssl]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: SSL_CTX_set_verify
  constraints:
  - arg_equals: {index: 1, value: SSL_VERIFY_NONE}
  match_examples:
  - name: OpenSSL context peer verification disabled
    code: |
      #include <openssl/ssl.h>
      void configure(SSL_CTX *context) {
        SSL_CTX_set_verify(context, SSL_VERIFY_NONE, NULL);
      }
  - name: OpenSSL context peer verification required negative
    code: |
      #include <openssl/ssl.h>
      void configure(SSL_CTX *context) {
        SSL_CTX_set_verify(context, SSL_VERIFY_PEER, NULL);
      }
    expect_no_match: true
  description: "`SSL_CTX_set_verify(ctx, SSL_VERIFY_NONE, ...)` disables peer verification; the exact compiler-decoded mode argument rejects verified configurations."
- id: c.tls.ssl_set_verify_none
  enabled: true
  language: c
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [openssl]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: SSL_set_verify
  constraints:
  - arg_equals: {index: 1, value: SSL_VERIFY_NONE}
  match_examples:
  - name: OpenSSL connection peer verification disabled
    code: |
      #include <openssl/ssl.h>
      void configure(SSL *connection) {
        SSL_set_verify(connection, SSL_VERIFY_NONE, NULL);
      }
  - name: OpenSSL connection peer verification required negative
    code: |
      #include <openssl/ssl.h>
      void configure(SSL *connection) {
        SSL_set_verify(connection, SSL_VERIFY_PEER, NULL);
      }
    expect_no_match: true
  description: "`SSL_set_verify(ssl, SSL_VERIFY_NONE, ...)` disables per-connection peer verification; the exact compiler-decoded mode argument rejects verified configurations."
- id: c.tls.openssl_min_proto_tls10
  enabled: true
  language: c
  tag: weak-tls
  category: source-independent
  severity: medium
  packages: [openssl]
  cwe: [CWE-326]
  match:
    kind: call
    callee:
      name: SSL_CTX_set_min_proto_version
  constraints:
  - arg_matches_regex:
      index: 1
      regex: '^(?:TLS1_VERSION|TLS1_1_VERSION)$'
  match_examples:
  - name: generated direct match
    code: |
      #include <openssl/evp.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        SSL_CTX_set_min_proto_version(arg, TLS1_VERSION);
      }
  - name: modern TLS minimum negative
    code: |
      #include <openssl/ssl.h>
      void example(SSL_CTX *ctx) {
        SSL_CTX_set_min_proto_version(ctx, TLS1_2_VERSION);
      }
    expect_no_match: true
  description: "SSL_CTX_set_min_proto_version with TLS 1.0/1.1 explicitly permits obsolete protocol versions."

- id: c.tls.openssl_min_proto_ssl3
  enabled: true
  language: c
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [openssl]
  cwe: [CWE-326]
  match:
    kind: call
    callee:
      name: SSL_CTX_set_min_proto_version
  constraints:
  - arg_equals:
      index: 1
      value: SSL3_VERSION
  match_examples:
  - name: SSLv3 minimum protocol
    code: |
      #include <openssl/ssl.h>
      void example(SSL_CTX *ctx) {
        SSL_CTX_set_min_proto_version(ctx, SSL3_VERSION);
      }
    expect_match_text: [SSL_CTX_set_min_proto_version]
  - name: modern TLS minimum negative
    code: |
      #include <openssl/ssl.h>
      void example(SSL_CTX *ctx) {
        SSL_CTX_set_min_proto_version(ctx, TLS1_2_VERSION);
      }
    expect_no_match: true
  description: "SSL_CTX_set_min_proto_version(ctx, SSL3_VERSION) explicitly enables obsolete SSLv3."
