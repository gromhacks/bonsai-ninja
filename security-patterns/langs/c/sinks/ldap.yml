# C LDAP-injection (OpenLDAP).
- id: c.ldap.ldap_search_ext_s
  enabled: true
  language: c
  tag: ldap-injection
  severity: high
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      name: ldap_search_ext_s
  constraints:
  - arg_tainted:
      index: 3
  match_examples:
  - name: generated direct match
    code: |
      void example(char *input) {
        ldap_search_ext_s("safe", "safe", "safe", input);
      }
  - name: literal arg 3 negative
    code: |
      void example(void) {
        ldap_search_ext_s("safe", "safe", "safe", "safe");
      }
    expect_no_match: true
  description: "OpenLDAP ldap_search_ext_s - flag tainted filter (5th arg)."

