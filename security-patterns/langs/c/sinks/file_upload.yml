# C file-upload sinks. Framework/API identity remains rulepack data; the C
# adapter contributes only exact call/argument facts.

- id: c.upload.mongoose_http_upload
  enabled: true
  language: c
  tag: file-upload
  severity: high
  packages: [mongoose]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      name: mg_http_upload
  constraints:
  - min_args: 5
  - max_args: 5
  - arg_tainted:
      index: 1
  match_examples:
  - name: Mongoose chunked HTTP upload request
    code: |
      #include <mongoose.h>
      void receive(struct mg_connection *c, struct mg_http_message *request) {
        mg_http_upload(c, request, &mg_fs_posix, "/srv/uploads", 1048576);
      }
    expect_match_text: [mg_http_upload]
  - name: obsolete three argument spelling is not the current upload API
    code: |
      #include <mongoose.h>
      void helper(void *a, void *b, void *c) {
        mg_http_upload(a, b, c);
      }
    expect_no_match: true
  description: "Mongoose mg_http_upload(c, hm, fs, dir, max_size) appends the HTTP request body to a client-named file under dir. Mongoose rejects path traversal and enforces max_size, but accepting arbitrary uploaded content still crosses the unrestricted-file-upload sink boundary."

- id: c.upload.mongoose_http_start_upload
  enabled: true
  language: c
  tag: file-upload
  severity: high
  packages: [mongoose]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      name: mg_http_start_upload
  constraints:
  - min_args: 6
  - max_args: 6
  - arg_tainted:
      index: 1
  match_examples:
  - name: Mongoose streaming HTTP upload request
    code: |
      #include <mongoose.h>
      void receive(struct mg_connection *c, struct mg_http_message *request,
                   struct mg_str name) {
        mg_http_start_upload(c, request, name, mg_str("/srv/uploads"),
                             &mg_fs_posix, upload_done);
      }
    expect_match_text: [mg_http_start_upload]
  - name: unrelated short helper call is not the streaming upload API
    code: |
      #include <mongoose.h>
      void helper(void *a, void *b) {
        mg_http_start_upload(a, b);
      }
    expect_no_match: true
  description: "Mongoose mg_http_start_upload(c, hm, name, dir, fs, callback) streams an HTTP request body into a file. Its path-sanity check prevents traversal, but it does not itself establish an application allowlist for uploaded content."
