# C header injection (microhttpd / mongoose / civetweb).
- id: c.header.mhd_add_response_header
  aliases:
  - c.open_redirect.mhd_redirect_header
  enabled: true
  language: c
  tag: header-injection
  severity: high
  packages: [libmicrohttpd]
  cwe: [CWE-113, CWE-601]
  match:
    kind: call
    callee:
      name: MHD_add_response_header
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: generated direct match
    code: |
      #include <libmicrohttpd/microhttpd.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        MHD_add_response_header(arg, "X-User", arg);
      }
  - name: literal arg 2 negative
    code: |
      void example(void) {
        MHD_add_response_header("safe", "safe", "safe");
      }
    expect_no_match: true
  description: "MHD_add_response_header(response, name, tainted). Also covers merged aliases: c.open_redirect.mhd_redirect_header."

