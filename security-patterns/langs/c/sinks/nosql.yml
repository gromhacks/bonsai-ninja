- id: c.nosql.hiredis_command_eval
  enabled: true
  language: c
  tag: nosql-injection
  severity: high
  packages: [hiredis]
  cwe: [CWE-943, CWE-134]
  match:
    kind: call
    callee:
      name: redisCommand
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted redisCommand format
    code: |
      #include <hiredis/hiredis.h>
      void example(redisContext *ctx) {
        char *arg = "tainted";
        redisCommand(ctx, arg);
      }
  - name: tainted value with literal format negative
    code: |
      #include <hiredis/hiredis.h>
      void example(redisContext *ctx) {
        char *arg = "tainted";
        redisCommand(ctx, "GET %s", arg);
      }
    expect_no_match: true
  description: "redisCommand(ctx, fmt, ...) - tainted Redis command format allows arbitrary Redis operations such as EVAL, FLUSHDB, or CONFIG SET."

