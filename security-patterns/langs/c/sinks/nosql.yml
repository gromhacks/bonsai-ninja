# C NoSQL-injection sinks. libmongoc + hiredis + leveldb + lmdb +
# memcached. BSON / command-string interpolation from tainted input
# lets an attacker rewrite the query predicate or inject operators
# (`$ne`, `$where`, `$regex`) that bypass filters.

- id: c.nosql.mongoc_collection_find
  enabled: true
  language: c
  tag: nosql-injection
  severity: high
  packages: [libmongoc]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      name: mongoc_collection_find_with_opts
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated direct match
    code: |
      #include <libmongoc/mongoc.h>
      void example(void) {
        char *arg = "tainted";
        char *fmt = arg;
        mongoc_collection_find_with_opts(arg);
      }
  - name: literal arg 1 negative
    code: |
      void example(void) {
        mongoc_collection_find_with_opts("safe", "safe");
      }
    expect_no_match: true
  description: "libmongoc mongoc_collection_find_with_opts(coll, tainted_filter, ...) - attacker-built BSON filter yields NoSQL-injection (e.g. {$ne: null})."

- id: c.nosql.mongoc_collection_find_legacy
