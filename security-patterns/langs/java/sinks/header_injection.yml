- id: java.header.servlet_response_setheader
  enabled: true
  language: java
  tag: header-injection
  severity: high
  packages:
  - javax.servlet
  - jakarta.servlet
  cwe:
  - CWE-113
  - CWE-601
  - CWE-444
  match:
    kind: call
    callee:
      regex: ^HttpServletResponse\.setHeader$
  constraints:
  - arg_tainted:
      index: 1
  analysis_semantics:
    same_origin_path_constraint:
      require_scheme_rejection: true
      require_authority_rejection: true
      require_absolute_path: true
      require_scheme_relative_rejection: true
      sink_argument_index: 1
      static_context_argument:
        index: 0
        accepted_renderings: [HttpHeaders.LOCATION, '"Location"']
  match_examples:
  - name: servlet response header tainted value
    code: |
      import javax.servlet.*;
      class App {
        void handle(String input) throws Exception {
          HttpServletResponse.setHeader("X-Name", input);
        }
      }
  - name: arg tainted literal negative
    code: |
      import javax.servlet.*;
      class App {
        void handle(String input) throws Exception {
          HttpServletResponse.setHeader(input, "safe");
        }
      }
    expect_no_match: true
  description: "HttpServletResponse.setHeader - flag tainted value (CRLF). Merged aliases: java.header.content_disposition_setheader, java.open_redirect.servlet_response_setheader_location."
  aliases:
  - java.header.content_disposition_setheader
  - java.open_redirect.servlet_response_setheader_location
  - java.smuggle.set_dual_cl_te_headers
