- id: java.xss.response_writer_write
  enabled: true
  language: java
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - getWriter
      - write
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "class App {\n  void handle(String input) throws Exception {\n    getWriter.write(input);\n  }\n}\n"
  - name: arg tainted literal negative
    code: |
      class App {
        void handle(String input) throws Exception {
          getWriter.write("safe");
        }
      }
    expect_no_match: true
  description: HttpServletResponse.getWriter().write(tainted).
