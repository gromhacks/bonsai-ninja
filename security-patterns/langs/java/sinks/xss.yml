- id: java.xss.wicket_label_escape_disabled
  enabled: true
  language: java
  tag: xss
  severity: high
  packages:
  - org.apache.wicket
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - Label
      - setEscapeModelStrings
  constraints:
  - receiver_tainted: true
  - arg_equals:
      index: 0
      value: 'false'
  match_examples:
  - name: wicket tainted label escaping disabled
    code: |
      import org.apache.wicket.*;
      class App {
        void render(String input) {
          Label label = new Label("result", new Model<>(input));
          label.setEscapeModelStrings(false);
        }
      }
      class Model<T> {
        Model(Object... args) {}
      }
      class Label {
        Label(Object... args) {}
        void setEscapeModelStrings(Object... args) {}
      }
    expect_match_text:
    - label.setEscapeModelStrings
  - name: wicket literal label escaping disabled negative
    code: |
      import org.apache.wicket.*;
      class App {
        void render() {
          Label label = new Label("result", new Model<>("safe"));
          label.setEscapeModelStrings(false);
        }
      }
      class Model<T> {
        Model(Object... args) {}
      }
      class Label {
        Label(Object... args) {}
        void setEscapeModelStrings(Object... args) {}
      }
    expect_no_match: true
  - name: wicket label escaping enabled negative
    code: |
      import org.apache.wicket.*;
      class App {
        void render(String input) {
          Label label = new Label("result", new Model<>(input));
          label.setEscapeModelStrings(true);
        }
      }
      class Model<T> {
        Model(Object... args) {}
      }
      class Label {
        Label(Object... args) {}
        void setEscapeModelStrings(Object... args) {}
      }
    expect_no_match: true
  description: "Wicket Label.setEscapeModelStrings(false) on a label whose model carries tainted text disables HTML escaping and renders that model verbatim."
