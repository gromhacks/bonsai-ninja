- id: java.xss.raw_html_return
  enabled: true
  language: java
  tag: xss
  severity: high
  cwe:
  - CWE-79
  match:
    kind: return
    target:
      regex: '(?is)<\s*(?:!doctype|html|body|script|div|span|p|a|img|svg|iframe|h[1-6]|ul|ol|li|table|form|input|textarea|button|br|hr)\b|&lt;'
  match_examples:
  - name: raw html return with tainted expression
    code: |
      class App {
        String handle(String name) {
          return "<!doctype html><body>" + name + "</body>";
        }
      }
    expect_match_text: ['"<!doctype html><body>" + name + "</body>"']
  - name: plain text return negative
    code: |
      class App {
        String handle(String name) {
          return "hello " + name;
        }
      }
    expect_no_match: true
  description: "Direct return of raw HTML markup; taint reachability is required for attacker-controlled content in the returned expression."
