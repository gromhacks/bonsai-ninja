- id: java.xss.spring_responseentity_ok_html_concat
  enabled: true
  language: java
  tag: xss
  severity: high
  packages:
  - org.springframework.http
  cwe:
  - CWE-79
  match:
    kind: call
    callee:
      attribute:
      - ResponseEntity
      - ok
  constraints:
  - arg_tainted:
      index: 0
  - arg_matches_regex:
      index: 0
      regex: '(?i)(<\s*(?:!doctype|html|body|script|div|span|p|a|img|svg|iframe|h[1-6]|ul|ol|li|table|form|input|textarea|button|br|hr)\b|&lt;)'
  match_examples:
  - name: responseentity ok raw html
    code: |
      import org.springframework.http.*;
      class App {
        Object handle(String name) {
          return ResponseEntity.ok("<p>" + name);
        }
      }
    expect_match_text:
    - ResponseEntity.ok
  - name: arg tainted literal negative
    code: |
      import org.springframework.http.*;
      class App {
        void handle(String input) throws Exception {
          ResponseEntity.ok("safe");
        }
      }
    expect_no_match: true
  - name: responseentity ok object response negative
    code: |
      import org.springframework.http.*;
      class App {
        Object handle(String id, Service svc) {
          return ResponseEntity.ok(svc.statusOf(id));
        }
      }
      class Service {
        Object statusOf(String id) { return new Object(); }
      }
    expect_no_match: true
  - name: responseentity ok non-html string negative
    code: |
      import org.springframework.http.*;
      class App {
        Object handle(String input) {
          return ResponseEntity.ok(input == null ? "null" : input.toString());
        }
      }
    expect_no_match: true
  description: "ResponseEntity.ok(raw HTML concat) - reflected HTML response built from attacker-controlled text."
  imports:
  - org.springframework.http
