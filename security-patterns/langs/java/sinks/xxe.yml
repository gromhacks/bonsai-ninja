# Java XXE sinks (SAX / DOM / StAX / DocumentBuilder / Transformer / XPath / Schema).
- id: java.xxe.saxparser_parse
  enabled: true
  language: java
  tag: xxe
  severity: high
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [SAXParser, parse]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      class App {
        void handle(String input) throws Exception {
          SAXParser.parse(input);
        }
      }
  - name: arg tainted literal negative
    code: |
      class App {
        void handle(String input) throws Exception {
          SAXParser.parse("safe");
        }
      }
    expect_no_match: true
  description: "SAXParser.parse - disable external entities."

