# Package-scoped local DocumentBuilder parse shape. This keeps the local
# receiver fallback explicit and import-gated until all Java adapters surface
# receiver-type facts for `DocumentBuilder` locals.
- id: java.xxe.documentbuilder_parse_local
  enabled: true
  language: java
  tag: xxe
  severity: high
  packages: ["javax.xml.parsers"]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      regex: "\\.parse$"
  constraints:
  - receiver_type_in:
    - DocumentBuilder
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import javax.xml.parsers.*;
      class App {
        void handle(DocumentBuilder db, String input) throws Exception {
          db.parse(input);
        }
      }
    expect_match_text: [db.parse]
  - name: arg tainted literal negative
    code: |
      import javax.xml.parsers.*;
      class App {
        void handle(DocumentBuilder db) throws Exception {
          db.parse("safe");
        }
      }
    expect_no_match: true
  - name: non document builder receiver negative
    code: |
      import javax.xml.parsers.*;
      class FeedParser {
        void parse(String body) {}
      }
      class App {
        void handle(FeedParser parser, String body) {
          parser.parse(body);
        }
      }
    expect_no_match: true
  description: "DocumentBuilder local receiver parse(...) - import-gated XML parse of tainted input while receiver-type facts are still adapter-dependent."

  imports:
  - javax.xml.parsers

- id: java.xxe.documentbuilderfactory_newinstance
  enabled: false
  disabled_reason:
    code: over-broad
  language: java
  tag: xxe
  category: source-independent
  severity: high
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      regex: "^DocumentBuilderFactory\\.newInstance$"
  match_examples:
  - name: generated shape example
    code: |
      class App {
        void handle(String input) throws Exception {
          DocumentBuilderFactory.newInstance(input);
        }
      }
  description: "Disabled - source-independent DocumentBuilderFactory.newInstance cannot distinguish immediately hardened factories from vulnerable parsers. Tainted DocumentBuilder.parse / JAXB / SAX parse sinks carry the real XXE signal with sanitizer credit."

