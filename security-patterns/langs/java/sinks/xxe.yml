- id: java.xxe.apache_poi_xssfworkbook_inputstream
  enabled: true
  language: java
  tag: xxe
  severity: high
  packages: ["org.apache.poi"]
  cwe: [CWE-611]
  match:
    kind: new
    callee:
      name: XSSFWorkbook
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: apache poi xssf workbook input stream
    code: |
      import org.apache.poi.*;
      class App {
        Object handle(InputStream stream) throws Exception {
          return new XSSFWorkbook(stream);
        }
      }
      class InputStream {}
      class XSSFWorkbook {
        XSSFWorkbook(Object... args) {}
      }
    expect_match_text: [XSSFWorkbook]
  - name: arg tainted literal negative
    code: |
      import org.apache.poi.*;
      class App {
        void handle(String input) throws Exception {
          new XSSFWorkbook("safe");
        }
      }
    expect_no_match: true
  description: "Apache POI XSSFWorkbook(InputStream) - parses attacker-controlled Office XML archives through XML parsers; keep XXE and zip-bomb protections enabled."
