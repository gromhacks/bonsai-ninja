# Java JWT sinks (jjwt / nimbus-jose-jwt / auth0 java-jwt).
- id: java.jwt.jjwt_parse_claims_jwt
  enabled: true
  language: java
  tag: jwt
  severity: critical
  packages: ["io.jsonwebtoken"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [JwtParser, parseClaimsJwt]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import io.jsonwebtoken.*;
      class App {
        void handle(String input) throws Exception {
          JwtParser.parseClaimsJwt(input);
        }
      }
  - name: literal jwt negative
    code: "import io.jsonwebtoken.*;\nclass App {\n  void handle(String \"safe\")
      throws Exception {\n    JwtParser.parseClaimsJwt(\"safe\");\n  }\n}\n"
    expect_no_match: true
  description: "jjwt JwtParser.parseClaimsJwt - parses UNSIGNED JWT (alg=none style)."

- id: java.jwt.nimbus_plainjwt_parse
  enabled: true
  language: java
  tag: jwt
  severity: critical
  packages: [com.nimbusds.jwt]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [PlainJWT, parse]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.nimbusds.jwt.*;
      class App {
        void handle(String input) throws Exception {
          PlainJWT.parse(input);
        }
      }
  - name: literal jwt negative
    code: "import com.nimbusds.jwt.*;\nclass App {\n  void handle(String \"safe\"\
      ) throws Exception {\n    PlainJWT.parse(\"safe\");\n  }\n}\n"
    expect_no_match: true
  description: "Nimbus PlainJWT.parse - explicit unsigned token."

  imports:
  - com.nimbusds.jwt
- id: java.jwt.auth0_jwt_decode
  enabled: true
  language: java
  tag: jwt
  severity: high
  packages: ["com.auth0.jwt"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [JWT, decode]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.auth0.jwt.*;
      class App {
        void handle(String input) throws Exception {
          JWT.decode(input);
        }
      }
  - name: literal jwt negative
    code: "import com.auth0.jwt.*;\nclass App {\n  void handle(String \"safe\") throws
      Exception {\n    JWT.decode(\"safe\");\n  }\n}\n"
    expect_no_match: true
  description: "auth0 JWT.decode - does NOT verify signature."

- id: java.jwt.auth0_jwt_require_alg_none
  enabled: true
  language: java
  tag: jwt
  category: source-independent
  severity: critical
  packages: ["com.auth0.jwt"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [Algorithm, none]
  match_examples:
  - name: generated shape example
    code: |
      import com.auth0.jwt.*;
      class App {
        void handle(String input) throws Exception {
          Algorithm.none(input);
        }
      }
  description: "auth0 Algorithm.none() - accepts unsigned tokens."

- id: java.jwt.nimbus_alg_none
  enabled: true
  language: java
  tag: jwt
  category: source-independent
  severity: critical
  packages: [com.nimbusds.jose, com.nimbusds.jwt]
  imports: [com.nimbusds.jose.JWSAlgorithm]
  cwe: [CWE-347, CWE-327]
  match:
    kind: read
    target:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.NONE$'
      receiver_type_in: [com.nimbusds.jose.JWSAlgorithm]
  match_examples:
  - name: imported Nimbus JOSE none algorithm constant
    code: |
      import com.nimbusds.jose.JWSAlgorithm;
      class App {
        Object algorithm() { return JWSAlgorithm.NONE; }
      }
    expect_match_text: [JWSAlgorithm.NONE]
  - name: local algorithm type collision
    code: |
      import com.nimbusds.jose.JOSEException;
      class JWSAlgorithm { static final Object NONE = new Object(); }
      class App {
        Object algorithm() throws JOSEException { return JWSAlgorithm.NONE; }
      }
    expect_no_match: true
  description: "JWSAlgorithm.NONE - explicitly accepts unsigned JWTs; classic alg-none
    token bypass when used at verification time."
