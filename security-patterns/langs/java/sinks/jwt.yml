# JWT alg-confusion (T400). HMAC verify with an RSA public
# key - when both HS* and RS* algorithms are allowed in the
# verifier's algorithm list, an attacker can sign their own
# token with the public key as the HMAC secret. Detect by
# matching the algorithm-list shape at the verify call.
- id: java.jwt.alg_confusion_jjwt
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: java
  tag: untrusted-token
  severity: high
  packages: [io.jsonwebtoken]
  cwe: [CWE-345]
  match:
    kind: call
    callee:
      attribute: [Jwts, parser]
  match_examples:
  - name: generated shape example
    code: |
      import io.jsonwebtoken.*;
      class App {
        void handle(String input) throws Exception {
          Jwts.parser("HS256 RS256");
        }
      }
  description: "Disabled - requires a rulepack constraint that proves the unsafe JWT
    configuration, not just the broad API shape. JJWT Jwts.parser() chain with mixed
    HMAC+RSA algorithms allowed - alg-confusion vector."

- id: java.jwt.nimbus_alg_none
  enabled: true
  language: java
  tag: jwt
  category: source-independent
  severity: critical
  packages: [com.nimbusds.jose, com.nimbusds.jwt]
  imports: [com.nimbusds.jose]
  cwe: [CWE-347, CWE-327]
  match:
    kind: new
    callee:
      attribute: [JWSAlgorithm, NONE]
  match_examples:
  - name: nimbus JOSE alg none header
    code: |
      import com.nimbusds.jose.*;
      class App {
        void handle() throws Exception {
          new JWSAlgorithm.NONE();
        }
      }
    expect_match_text: [JWSAlgorithm.NONE]
  description: "JWSAlgorithm.NONE - explicitly accepts unsigned JWTs; classic alg-none
    token bypass when used at verification time."
