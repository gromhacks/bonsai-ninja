# Java JWT sinks (jjwt / nimbus-jose-jwt / auth0 java-jwt).
- id: java.jwt.jjwt_parser_unsigned
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: java
  tag: jwt
  severity: medium
  packages: ["io.jsonwebtoken"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [Jwts, parser]
  description: "Disabled - Jwts.parser() is only dangerous without a later setSigningKey/verifyWith
    call; needs stateful check."

- id: java.jwt.jjwt_parser_builder
  enabled: false
  disabled_reason:
    code: over-broad
  language: java
  tag: jwt
  severity: info
  packages: ["io.jsonwebtoken"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [Jwts, parserBuilder]
  description: "Disabled - parserBuilder() alone is not a sink; the danger is parseClaimsJwt
    (unsigned) vs parseClaimsJws (signed)."

- id: java.jwt.jjwt_parse_claims_jws
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: java
  tag: jwt
  severity: medium
  packages: ["io.jsonwebtoken"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [JwtParser, parseClaimsJws]
  match_examples:
  - name: generated shape example
    code: |
      import io.jsonwebtoken.*;
      class App {
        void handle(String input) throws Exception {
          JwtParser.parseClaimsJws(input);
        }
      }
  description: "Disabled - requires a rulepack constraint that proves the unsafe JWT
    configuration, not just the broad API shape. jjwt JwtParser.parseClaimsJws - safe
    IF a signing key was set on the builder; flag for review."

- id: java.jwt.jjwt_parse_claims_jwt
  enabled: true
  language: java
  tag: jwt
  severity: critical
  packages: ["io.jsonwebtoken"]
  cwe: [CWE-347]
  match:
    kind: call
    callee:
      attribute: [JwtParser, parseClaimsJwt]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import io.jsonwebtoken.*;
      class App {
        void handle(String input) throws Exception {
          JwtParser.parseClaimsJwt(input);
        }
      }
  - name: literal jwt negative
    code: "import io.jsonwebtoken.*;\nclass App {\n  void handle(String \"safe\")
      throws Exception {\n    JwtParser.parseClaimsJwt(\"safe\");\n  }\n}\n"
    expect_no_match: true
  description: "jjwt JwtParser.parseClaimsJwt - parses UNSIGNED JWT (alg=none style)."

