# Java LLM sinks (OpenAI, Anthropic, Bedrock, LangChain4j).
- id: java.llm.openai_create_chat_completion
  enabled: true
  language: java
  tag: web-llm
  severity: medium
  packages: [com.openai.api]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      attribute: [OpenAiService, createChatCompletion]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import com.openai.api.*;
      class App {
        void handle(String input) throws Exception {
          OpenAiService.createChatCompletion(input);
        }
      }
    expect_match_text: [OpenAiService.createChatCompletion]
  - name: arg tainted literal negative
    code: |
      import com.openai.api.*;
      class App {
        void handle(String input) throws Exception {
          OpenAiService.createChatCompletion("safe");
        }
      }
    expect_no_match: true
  description: "OpenAI Java createChatCompletion - tainted prompt content reaches an LLM instruction and tool surface."

  imports:
  - com.openai.api
