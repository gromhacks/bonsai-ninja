- id: java.ldap.spring_ldap_template_bind
  enabled: true
  language: java
  tag: ldap-injection
  severity: high
  packages:
  - org.springframework.ldap
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - LdapTemplate
      - bind
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "import org.springframework.ldap.*;\nclass App {\n  void handle(String input)\
      \ throws Exception {\n    LdapTemplate.bind(\"(uid=\" + input);\n  }\n}\n"
  - name: arg tainted literal negative
    code: "import org.springframework.ldap.*;\nclass App {\n  void handle(String input)\
      \ throws Exception {\n    LdapTemplate.bind(\"uid=alice,dc=example,dc=com\"\
      );\n  }\n}\n"
    expect_no_match: true
  description: "Spring LdapTemplate.bind - tainted DN lets the attacker write\
    \ to arbitrary directory entries."
- id: java.ldap.spring_ldap_template_authenticate
  enabled: true
  language: java
  tag: ldap-injection
  severity: critical
  packages:
  - org.springframework.ldap
  cwe:
  - CWE-90
  - CWE-287
  match:
    kind: call
    callee:
      attribute:
      - LdapTemplate
      - authenticate
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "import org.springframework.ldap.*;\nclass App {\n  void handle(String input)\
      \ throws Exception {\n    LdapTemplate.authenticate(\"(uid=\" + input);\n  }\n\
      }\n"
  - name: arg tainted literal negative
    code: "import org.springframework.ldap.*;\nclass App {\n  void handle(String input)\
      \ throws Exception {\n    LdapTemplate.authenticate(\"uid=alice,dc=example,dc=com\"\
