- id: java.template.freemarker_template_ctor
  enabled: true
  language: java
  tag: ssti
  severity: critical
  packages:
  - freemarker.template
  cwe:
  - CWE-94
  - CWE-1336
  match:
    kind: new
    callee:
      name: Template
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: freemarker template tainted source
    code: "import freemarker.template.*;\nclass App {\n  void handle(String source,\
      \ Object cfg) throws Exception {\n    new Template(\"name\", source, cfg);\n\
      \  }\n}\nclass Template {\n  Template(Object... args) {}\n}\n"
  - name: arg tainted literal negative
    code: "import freemarker.template.*;\nclass App {\n  void handle(String source,\
      \ Object cfg) throws Exception {\n    new Template(source, \"safe\", cfg);\n\
      \  }\n}\nclass Template {\n  Template(Object... args) {}\n}\n"
    expect_no_match: true
  description: "new freemarker.template.Template(name, tainted-source, cfg) -\
    \ compiles template text at runtime."
