- id: java.template.thymeleaf_processstring
  enabled: true
  language: java
  tag: ssti
  severity: high
  packages:
  - org.thymeleaf
  - freemarker.template
  cwe:
  - CWE-1336
  match:
    kind: call
    callee:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.process$'
  constraints:
  - receiver_type_in:
    - TemplateEngine
    - Template
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "import org.thymeleaf.*;\nclass App {\n  void handle(TemplateEngine engine,\
      \ String input) throws Exception {\n    engine.process(\"{{\" + input);\n  }\n\
      }\n}\n"
  - name: thymeleaf fragment expression concat
    code: "import org.thymeleaf.*;\nclass App {\n  Object handle(TemplateEngine engine,\
      \ String fragment, Object ctx) {\n    return engine.process(\"layout :: \" +\
      \ fragment, ctx);\n  }\n}\n"
    expect_match_text:
    - engine.process
  - name: freemarker template process local
    code: "import freemarker.template.*;\nclass App {\n  Object handle(Template template,\
      \ Object model) throws Exception {\n    return template.process(model);\n  }\n\
      }\nclass Template {\n  Object process(Object... args) { return null; }\n}\n"
    expect_match_text:
    - template.process
  - name: arg tainted literal negative
    code: "import org.thymeleaf.*;\nclass App {\n  void handle(TemplateEngine engine,\
      \ String input) throws Exception {\n    engine.process(\"safe\");\n  }\n}\n\
      "
    expect_no_match: true
  description: "Thymeleaf TemplateEngine.process - flag when template source\
    \ is tainted. Merged collision aliases: java.template.freemarker_process, java.template.freemarker_template_process_local,\
    \ java.template.thymeleaf_fragment_concat."
  aliases:
  - java.template.freemarker_process
  - java.template.freemarker_template_process_local
  - java.template.thymeleaf_fragment_concat
