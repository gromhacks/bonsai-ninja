- id: java.access.aws_s3_get_object
  enabled: true
  language: java
  tag: access-control
  severity: high
  packages: ["software.amazon.awssdk.s3"]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      regex: "^S3Client\\.getObject$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import software.amazon.awssdk.s3.*;
      class App {
        void handle(String input) throws Exception {
          S3Client.getObject(input);
        }
      }
  - name: arg tainted literal negative
    code: |
      import software.amazon.awssdk.s3.*;
      class App {
        void handle(String input) throws Exception {
          S3Client.getObject("safe");
        }
      }
    expect_no_match: true
  description: "S3Client.getObject(bucket/key) — tainted selector can read arbitrary object data."

  imports:
  - software.amazon.awssdk.s3
