- id: java.access.jndi_initialcontext_lookup
  enabled: true
  language: java
  tag: jndi-injection
  severity: critical
  packages: ["javax.naming"]
  cwe: [CWE-074, CWE-502]
  match:
    kind: call
    callee:
      regex: "^InitialContext\\.lookup$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import javax.naming.*;
      class App {
        void handle(String input) throws Exception {
          InitialContext.lookup(input);
        }
      }
  - name: arg tainted literal negative
    code: |
      import javax.naming.*;
      class App {
        void handle(String input) throws Exception {
          InitialContext.lookup("safe");
        }
      }
    expect_no_match: true
  description: "javax.naming.InitialContext.lookup(tainted) — Log4Shell-style remote class load and deserialization (LDAP/RMI/CORBA URI). Instance-form `initialContext.lookup` is covered by the OnlyWhenPackaged lax-tail policy when the file imports javax.naming."

- id: java.access.jndi_initialcontext_lookup_local
  enabled: false
  disabled_reason:
    code: over-broad
  language: java
  tag: jndi-injection
  severity: critical
  packages: ["javax.naming"]
  cwe: [CWE-074, CWE-502]
  match:
    kind: call
    callee:
      name: lookup
  match_examples:
  - name: local initial context lookup
    code: |
      import javax.naming.*;
      class App {
        Object handle(InitialContext initialContext, String name) throws Exception {
          return initialContext.lookup(name);
        }
      }
      class InitialContext {
        Object lookup(Object... args) { return null; }
      }
    expect_match_text: [initialContext.lookup]
  description: "InitialContext.lookup(name) on a local naming context — attacker-controlled JNDI name can trigger remote lookup and deserialization."
  imports:
  - javax.naming
- id: java.access.jndi_context_lookup
  enabled: true
  language: java
  tag: jndi-injection
  severity: critical
  packages: ["javax.naming"]
  cwe: [CWE-074, CWE-502]
  match:
    kind: call
    callee:
      attribute: [Context, lookup]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import javax.naming.*;
      class App {
        void handle(String input) throws Exception {
          Context.lookup(input);
        }
      }
  - name: local context lookup
    code: |
      import javax.naming.*;
      class App {
        Object handle(Context ctx, String name) throws Exception {
          return ctx.lookup(name);
        }
      }
      interface Context {
        Object lookup(Object... args);
      }
    expect_match_text: [ctx.lookup]
  - name: arg tainted literal negative
    code: |
      import javax.naming.*;
      class App {
        void handle(String input) throws Exception {
          Context.lookup("safe");
        }
      }
    expect_no_match: true
  description: "javax.naming.Context.lookup(tainted) — same JNDI remote class load risk via the abstract Context API. JNDI signature is `lookup(Name|String)` — exactly 1 arg; `min_args: 1` + `max_args: 1` rejects unrelated `lookup()` decoys (Map.lookup overloads etc.)."

