- id: java.graphql.executioninput_query_chain
  enabled: true
  language: java
  tag: graphql-injection
  severity: high
  packages:
  - graphql
  imports:
  - graphql
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      attribute:
      - newExecutionInput
      - query
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: ExecutionInput.newExecutionInput().query(tainted)
    code: |
      import graphql.*;
      class App {
        void handle(String input) throws Exception {
          ExecutionInput ei = ExecutionInput.newExecutionInput().query(input).build();
        }
      }
    expect_match_text: ["ExecutionInput.newExecutionInput().query"]
  - name: ExecutionInput.newExecutionInput().query literal negative
    code: |
      import graphql.*;
      class App {
        void handle(String input) throws Exception {
          ExecutionInput ei = ExecutionInput.newExecutionInput().query("{ viewer { id } }").build();
        }
      }
    expect_no_match: true
  description: "ExecutionInput.newExecutionInput().query(tainted) — fluent GraphQL builder; attacker-controlled GraphQL document drives later GraphQL.executeAsync."

- id: java.graphql.parser_parsedocument
  enabled: true
  language: java
  tag: graphql-injection
  severity: medium
  packages:
  - graphql
  imports:
  - graphql
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      attribute:
      - Parser
      - parseDocument
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: Parser.parseDocument tainted
    code: |
      import graphql.parser.*;
      class App {
        void handle(String input) throws Exception {
          Parser.parseDocument(input);
        }
      }
    expect_match_text: [Parser.parseDocument]
  - name: Parser.parseDocument literal negative
    code: |
      import graphql.parser.*;
      class App {
        void handle(String input) throws Exception {
          Parser.parseDocument("{ viewer { id } }");
        }
      }
    expect_no_match: true
  description: "graphql.parser.Parser.parseDocument(tainted_source) — attacker-controlled GraphQL source becomes a Document AST consumed by downstream execution."
