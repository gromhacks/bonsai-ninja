- id: java.graphql.graphql_execute_async
  enabled: true
  language: java
  tag: graphql-injection
  severity: high
  packages:
  - graphql
  cwe:
  - CWE-943
  match:
    kind: call
    callee:
      attribute:
      - GraphQL
      - executeAsync
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: |
      import graphql.*;
      class App {
        void handle(String input) throws Exception {
          GraphQL.executeAsync(input);
        }
      }
    expect_match_text:
    - GraphQL.executeAsync
  - name: arg tainted literal negative
    code: |
      import graphql.*;
      class App {
        void handle(String input) throws Exception {
          GraphQL.executeAsync("safe");
        }
      }
    expect_no_match: true
  description: graphql-java GraphQL.executeAsync with a tainted document can drive unexpected resolver execution.
  imports:
  - graphql
