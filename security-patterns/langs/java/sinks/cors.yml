# java CORS misconfiguration sinks (T403).
- id: java.cors.crossorigin_origins_wildcard
  enabled: true
  language: java
  tag: cors
  category: source-independent
  severity: medium
  packages: [org.springframework.web.bind.annotation]
  cwe: [CWE-942]
  match:
    kind: call
    callee:
      attribute: [CrossOrigin, allowedOrigins]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^"\*"$'
  match_examples:
  - name: generated shape example
    code: |
      import org.springframework.web.bind.annotation.*;
      class App {
        void handle(String input) throws Exception {
          CrossOrigin.allowedOrigins("*");
        }
      }
  - name: explicit origin negative
    code: |
      import org.springframework.web.bind.annotation.*;
      class App {
        void handle() throws Exception {
          CrossOrigin.allowedOrigins("https://app.example.com");
        }
      }
    expect_no_match: true
  description: |-
    @CrossOrigin(origins = "*") - Spring controller-level allow-all CORS.
- id: java.cors.cors_config_addallowedorigin_wildcard
  enabled: true
  language: java
  tag: cors
  category: source-independent
  severity: medium
  packages: [org.springframework.web.cors]
  cwe: [CWE-942]
  match:
    kind: call
    callee:
      attribute: [CorsConfiguration, addAllowedOrigin]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^"\*"$'
  match_examples:
  - name: generated shape example
    code: |
      import org.springframework.web.cors.*;
      class App {
        void handle(String input) throws Exception {
          CorsConfiguration.addAllowedOrigin("*");
        }
      }
  - name: explicit origin negative
    code: |
      import org.springframework.web.cors.*;
      class App {
        void handle() throws Exception {
          CorsConfiguration.addAllowedOrigin("https://app.example.com");
        }
      }
    expect_no_match: true
  description: |-
    CorsConfiguration.addAllowedOrigin('*') - Spring filter-chain allow-all CORS.
