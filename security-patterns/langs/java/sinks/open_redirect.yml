- id: java.open_redirect.send_redirect
  enabled: true
  language: java
  tag: open-redirect
  severity: high
  cwe:
  - CWE-601
  match:
    kind: call
    callee:
      attribute:
      - HttpServletResponse
      - sendRedirect
  constraints:
  - arg_tainted:
      index: 0
  analysis_semantics:
    same_origin_path_constraint:
      require_scheme_rejection: true
      require_authority_rejection: true
      require_absolute_path: true
      require_scheme_relative_rejection: true
      sink_argument_index: 0
  match_examples:
  - name: generated shape example
    code: "class App {\n  void handle(String input) throws Exception {\n    HttpServletResponse.sendRedirect(input);\n  }\n}\n"
  - name: arg tainted literal negative
    code: |
      class App {
        void handle(String input) throws Exception {
          HttpServletResponse.sendRedirect("/home");
        }
      }
    expect_no_match: true
  description: HttpServletResponse.sendRedirect(tainted).
