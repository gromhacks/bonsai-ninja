- id: java.open_redirect.spring_modelandview_redirect
  enabled: true
  language: java
  tag: open-redirect
  severity: medium
  packages:
  - org.springframework.web.servlet
  cwe:
  - CWE-601
  match:
    kind: new
    callee:
      name: ModelAndView
  constraints:
  - arg_matches_regex:
      index: 0
      regex: 'redirect:'
  - arg_tainted:
      index: 0
  match_examples:
  - name: spring modelandview redirect concat
    code: |
      import org.springframework.web.servlet.*;
      class App {
        Object handle(String next) {
          return new ModelAndView("redirect:" + next);
        }
      }
      class ModelAndView {
        ModelAndView(Object... args) {}
      }
    expect_match_text:
    - ModelAndView
  - name: arg tainted literal negative
    code: |
      import org.springframework.web.servlet.*;
      class App {
        void handle(String input) throws Exception {
          new ModelAndView("home");
        }
      }
    expect_no_match: true
  - name: tainted non redirect view negative
    code: |
      import org.springframework.web.servlet.*;
      class App {
        Object handle(String view) {
          return new ModelAndView(view);
        }
      }
      class ModelAndView {
        ModelAndView(Object... args) {}
      }
    expect_no_match: true
  description: "Spring ModelAndView(\"redirect:\" + target) - tainted redirect view suffix can send users to attacker-controlled locations."
  imports:
  - org.springframework.web.servlet
