- id: java.nosql.basicdbobject_where_ctor
  enabled: true
  language: java
  tag: nosql-injection
  severity: high
  packages:
  - org.mongodb
  cwe:
  - CWE-943
  - CWE-94
  match:
    kind: new
    callee:
      name: BasicDBObject
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: basic db object where constructor
    code: |
      import org.mongodb.*;
      class App {
        Object handle(String js) {
          return new BasicDBObject("$where", js);
        }
      }
      class BasicDBObject {
        BasicDBObject(Object... args) {}
      }
    expect_match_text:
    - BasicDBObject
  - name: literal basicdbobject where script negative
    code: |
      import org.mongodb.*;
      class App {
        Object handle() {
          return new BasicDBObject("$where", "return true");
        }
      }
      class BasicDBObject {
        BasicDBObject(Object... args) {}
      }
    expect_no_match: true
  description: "new BasicDBObject(\"$where\", script) - MongoDB server-side JavaScript predicate; attacker-controlled script is NoSQL injection. Merged aliases: java.nosql.basicdbobject_operator_ctor."
  aliases:
  - java.nosql.basicdbobject_operator_ctor
