- id: java.crypto.cipher_dynamic_algorithm
  enabled: true
  language: java
  tag: weak-crypto
  category: source-independent
  severity: medium
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      attribute:
      - Cipher
      - getInstance
  constraints:
  - arg_not_matches_regex:
      index: 0
      regex: '(?i)^"(AES/(GCM|CCM)/NoPadding|ChaCha20-Poly1305)"$'
  - arg_not_matches_regex:
      index: 0
      regex: '(?i)(^"(DES|DESede|TripleDES|3DES|RC4|ARCFOUR)(/.*)?"$|^"[^"]*/ECB/[^"]*"$)'
  match_examples:
  - name: dynamic cipher algorithm
    code: |
      class App {
        void handle(String algorithm) throws Exception {
          Cipher.getInstance(algorithm);
        }
      }
    expect_match_text: [Cipher.getInstance]
  - name: AES GCM cipher negative
    code: |
      class App {
        void handle() throws Exception {
          Cipher.getInstance("AES/GCM/NoPadding");
        }
      }
    expect_no_match: true
  - name: AES CCM cipher negative
    code: |
      class App {
        void handle() throws Exception {
          Cipher.getInstance("AES/CCM/NoPadding", java.security.Security.getProvider("BC"));
        }
      }
    expect_no_match: true
  description: "Cipher.getInstance(dynamicAlgorithm) - algorithm is not a literal known-safe authenticated mode."

- id: java.crypto.random_next
  enabled: false
  disabled_reason:
    code: over-broad
  language: java
  tag: weak-randomness
  category: source-independent
  severity: medium
  packages:
  - java.util
  imports:
  - java.util
  cwe:
  - CWE-330
  - CWE-338
  match:
    kind: call
    callee:
      regex: '(^|[.])next(Int|Long|Float|Double|Gaussian|Bytes)$'
  constraints:
  - receiver_type_in:
    - Random
  - receiver_type_not_in:
    - SecureRandom
  match_examples:
  - name: java util Random nextInt
    code: |
      import java.util.*;
      class App {
        void handle(Random random) throws Exception {
          random.nextInt();
        }
      }
    expect_match_text: [random.nextInt]
  - name: SecureRandom receiver negative
    code: |
      class App {
        void handle() throws Exception {
          java.security.SecureRandom random = java.security.SecureRandom.getInstance("SHA1PRNG");
          random.nextInt();
        }
      }
    expect_no_match: true
  description: "Disabled - a java.util.Random next* call is not inherently security-sensitive without evidence that the value is used as a token, secret, nonce, or other unpredictable value. The enabled constructor rule retains the explicit weak-PRNG inventory signal without reporting every ordinary random draw."

