- id: java.crypto.md5_digest
  enabled: true
  language: java
  tag: weak-crypto
  category: source-independent
  severity: low
  cwe:
  - CWE-328
  match:
    kind: call
    callee:
      attribute:
      - MessageDigest
      - getInstance
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)^"MD[245]"$'
  match_examples:
  - name: MessageDigest MD5
    code: "class App {\n  void handle(String input) throws Exception {\n    MessageDigest.getInstance(\"MD5\");\n  }\n}\n"
  - name: safe message digest negative
    code: |
      class App {
        void handle() throws Exception {
          MessageDigest.getInstance("SHA-256");
        }
      }
    expect_no_match: true
  description: 'MessageDigest.getInstance("MD5"/"MD4"/"MD2") - collision-broken hash.'

- id: java.crypto.cipher_des
  enabled: true
  language: java
  tag: weak-crypto
  category: source-independent
  severity: high
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      attribute:
      - Cipher
      - getInstance
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)^"(DES|DESede|TripleDES|3DES)(/.*)?"$'
  match_examples:
  - name: DES cipher
    code: "class App {\n  void handle(String input) throws Exception {\n    Cipher.getInstance(\"DES\");\n  }\n}\n"
  - name: safe cipher negative
    code: |
      class App {
        void handle() throws Exception {
          Cipher.getInstance("AES/GCM/NoPadding");
        }
      }
    expect_no_match: true
  description: 'Cipher.getInstance("DES"/"DESede"/"3DES") - obsolete block cipher family.'
  aliases:
  - java.crypto.cipher_des_cbc
  - java.crypto.cipher_3des

