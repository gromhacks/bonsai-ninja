- id: java.crypto.cipher_dynamic_algorithm
  enabled: true
  language: java
  tag: weak-crypto
  severity: medium
  cwe:
  - CWE-327
  match:
    kind: call
    callee:
      attribute:
      - Cipher
      - getInstance
  constraints:
  - arg_not_matches_regex:
      index: 0
      regex: '(?i)^"(AES/GCM/NoPadding|ChaCha20-Poly1305)"$'
  - arg_not_matches_regex:
      index: 0
      regex: '(?i)(^"(DES|DESede|TripleDES|3DES|RC4|ARCFOUR)(/.*)?"$|^"[^"]*/ECB/[^"]*"$)'
  match_examples:
  - name: dynamic cipher algorithm
    code: |
      class App {
        void handle(String algorithm) throws Exception {
          Cipher.getInstance(algorithm);
        }
      }
    expect_match_text: [Cipher.getInstance]
  - name: AES GCM cipher negative
    code: |
      class App {
        void handle() throws Exception {
          Cipher.getInstance("AES/GCM/NoPadding");
        }
      }
    expect_no_match: true
  description: "Cipher.getInstance(dynamicAlgorithm) — algorithm is not a literal known-safe authenticated mode."

- id: java.crypto.random_next
  enabled: true
  language: java
  tag: weak-randomness
  severity: medium
  packages:
  - java.util
  imports:
  - java.util
  cwe:
  - CWE-330
  - CWE-338
  match:
    kind: call
    callee:
      regex: '(^|[.])next(Int|Long|Float|Double|Gaussian|Bytes)$'
  constraints:
  - receiver_name_in:
    - random
    - rand
    - rng
    - r
    - new Random()
  match_examples:
  - name: java util Random nextInt
    code: |
      import java.util.*;
      class App {
        void handle() throws Exception {
          random.nextInt();
        }
      }
    expect_match_text: [random.nextInt]
  description: "java.util.Random next* output — non-cryptographic PRNG used where unpredictable values are required."

- id: java.crypto.random_ctor
  enabled: true
  language: java
  tag: weak-randomness
  severity: medium
  cwe:
  - CWE-330
  - CWE-338
  match:
    kind: new
    callee:
      name: Random
  match_examples:
  - name: generated shape example
    code: "class App {\n  void handle(String input) throws Exception {\n    new Random();\n  }\n}\nclass Random {\n  Random(Object... args) {}\n}\n"
  description: "new java.util.Random — non-cryptographic."

