- id: java.crypto.keygenerator_low_bits
  enabled: true
  language: java
  tag: weak-crypto
  severity: medium
  cwe:
  - CWE-326
  match:
    kind: call
    callee:
      attribute:
      - KeyGenerator
      - init
  constraints:
  - arg_lt:
      index: 0
      value: 128
  match_examples:
  - name: KeyGenerator low bit size
    code: |
      class App {
        void handle(KeyGenerator keyGenerator) throws Exception {
          keyGenerator.init(56);
        }
      }
      class KeyGenerator {
        void init(Object... args) {}
      }
    expect_match_text: [keyGenerator.init]
  - name: KeyGenerator safe bit size negative
    code: |
      class App {
        void handle(KeyGenerator keyGenerator) throws Exception {
          keyGenerator.init(256);
        }
      }
      class KeyGenerator {
        void init(Object... args) {}
      }
    expect_no_match: true
  description: "KeyGenerator.init(bits) with a literal key size below 128 bits — cryptographically weak symmetric key strength."
