- id: java.trustbound.session_setattribute
  enabled: true
  language: java
  tag: access-control
  severity: high
  packages:
  - javax.servlet.http
  - jakarta.servlet.http
  cwe:
  - CWE-501
  match:
    kind: call
    callee:
      attribute: [HttpSession, setAttribute]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted session attribute name
    code: |
      import javax.servlet.http.*;
      class App {
        void handle(HttpSession session, String input) throws Exception {
          session.setAttribute(input, "value");
        }
      }
    expect_match_text: [session.setAttribute]
  - name: literal session attribute name negative
    code: |
      import javax.servlet.http.*;
      class App {
        void handle(HttpSession session, String input) throws Exception {
          session.setAttribute("role", input);
        }
      }
    expect_no_match: true
  description: "HttpSession.setAttribute(taintedName, value) — attacker controls a session key across a trust boundary."

- id: java.trustbound.session_setattribute_chained
  enabled: true
  language: java
  tag: access-control
  severity: high
  packages:
  - javax.servlet.http
  - jakarta.servlet.http
  cwe:
  - CWE-501
  match:
    kind: call
    callee:
      attribute: [getSession, setAttribute]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: request session setAttribute tainted name
    code: |
      import javax.servlet.http.*;
      class App {
        void handle(HttpServletRequest request, String input) throws Exception {
          request.getSession().setAttribute(input, "value");
        }
      }
    expect_match_text: [request.getSession().setAttribute]
  - name: request session setAttribute literal name negative
    code: |
      import javax.servlet.http.*;
      class App {
        void handle(HttpServletRequest request) throws Exception {
          request.getSession().setAttribute("role", "value");
        }
      }
    expect_no_match: true
  description: "HttpServletRequest.getSession().setAttribute(taintedName, value) — attacker controls a session key across a trust boundary."
