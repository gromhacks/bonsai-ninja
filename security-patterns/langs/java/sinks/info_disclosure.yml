- id: java.info_disclosure.logger_error_secret
  enabled: true
  language: java
  tag: information-disclosure
  severity: medium
  cwe:
  - CWE-200
  - CWE-117
  match:
    kind: call
    callee:
      attribute:
      - Logger
      - error
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: generated shape example
    code: "class App {\n  void handle(String input) throws Exception {\n    Logger.error(\"token value\", input);\n  }\n}\n"
    expect_match_text:
    - Logger.error
  - name: literal logger error value negative
    code: |
      class App {
        void handle() throws Exception {
          Logger.error("token value", "redacted");
        }
      }
    expect_no_match: true
  description: 'Logger.error with secret-shaped values persists sensitive data in application logs.'
