- id: java.info_disclosure.system_out_secret
  enabled: true
  language: java
  tag: information-disclosure
  severity: medium
  cwe:
  - CWE-200
  match:
    kind: call
    callee:
      regex: ^System\.out\.println$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "class App {\n  void handle(String input) throws Exception {\n    System.out.println(\"password=\" + input);\n \
      \ }\n}\n"
    expect_match_text:
    - System.out.println
  - name: literal system out negative
    code: |
      class App {
        void handle() throws Exception {
          System.out.println("password=redacted");
        }
      }
    expect_no_match: true
  description: System.out.println of secret-shaped values can disclose credentials through stdout logs.
