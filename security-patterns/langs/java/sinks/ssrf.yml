- id: java.ssrf.url_ctor
  enabled: true
  language: java
  tag: ssrf
  severity: medium
  cwe:
  - CWE-918
  analysis_semantics:
    url_network_guard:
      root:
        kind: sink-assignment-target
      parser: {name: URL}
      scheme:
        component:
          accessor: {name: getProtocol}
        comparison_predicate: {name: equalsIgnoreCase}
        allowed_values: [https]
      host_allowlist:
        component:
          accessor: {name: getHost}
        membership_predicate: {name: contains}
        static_collection_factories:
        - {name: of}
      dns:
        resolver: {name: getByName}
        private_address_predicates:
        - {name: isLoopbackAddress}
        - {name: isSiteLocalAddress}
        - {name: isLinkLocalAddress}
        - {name: isAnyLocalAddress}
        - {name: isMulticastAddress}
  match:
    kind: new
    callee:
      name: URL
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: generated shape example
    code: "class App {\n  void handle(String input) throws Exception {\n    new URL(input);\n  }\n}\nclass URL {\n  URL(Object... args) {}\n}\n"
  - name: arg tainted literal negative
    code: |
      class App {
        void handle(String input) throws Exception {
          new URL("https://example.test/");
        }
      }
    expect_no_match: true
  description: "new URL(tainted) - flag construction of URLs from user input."
