- id: java.tls.apache_httpclient_noopverifier
  enabled: true
  language: java
  tag: weak-tls
  category: source-independent
  severity: critical
  packages:
  - org.apache.http
  imports: [org.apache.http.conn.ssl.NoopHostnameVerifier]
  cwe:
  - CWE-295
  match:
    kind: new
    callee:
      name: NoopHostnameVerifier
      binding_origin: imported
  match_examples:
  - name: imported no-op hostname verifier
    code: |
      import org.apache.http.conn.ssl.NoopHostnameVerifier;
      class App {
        Object verifier() { return new NoopHostnameVerifier(); }
      }
    expect_match_text: [NoopHostnameVerifier]
  - name: same constructor name on a local type
    code: |
      import org.apache.http.HttpHost;
      class NoopHostnameVerifier { NoopHostnameVerifier() {} }
      class App {
        Object verifier(HttpHost host) { return new NoopHostnameVerifier(); }
      }
    expect_no_match: true
  description: Apache HttpClient new NoopHostnameVerifier().
- id: java.tls.apache_httpclient_trustself
  enabled: true
  language: java
  tag: weak-tls
  category: source-independent
  severity: high
  packages:
  - org.apache.http
  imports: [org.apache.http.ssl.SSLContextBuilder, org.apache.http.ssl.TrustSelfSignedStrategy]
  cwe:
  - CWE-295
  match:
    kind: call
    callee:
      name: loadTrustMaterial
      receiver_type_in: [org.apache.http.ssl.SSLContextBuilder]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^(?:TrustSelfSignedStrategy\.)?INSTANCE$'
  match_examples:
  - name: imported self-signed trust strategy
    code: |
      import org.apache.http.ssl.SSLContextBuilder;
      import org.apache.http.ssl.TrustSelfSignedStrategy;
      class App {
        void configure(SSLContextBuilder builder) throws Exception {
          builder.loadTrustMaterial(TrustSelfSignedStrategy.INSTANCE);
        }
      }
    expect_match_text: [builder.loadTrustMaterial]
  - name: ordinary trust material strategy
    code: |
      import org.apache.http.ssl.SSLContextBuilder;
      class App {
        void configure(SSLContextBuilder builder, Object strategy) throws Exception {
          builder.loadTrustMaterial(strategy);
        }
      }
    expect_no_match: true
  - name: local builder with the same method is not Apache HttpClient
    code: |
      import org.apache.http.ssl.TrustSelfSignedStrategy;
      class SSLContextBuilder {
        void loadTrustMaterial(Object strategy) {}
      }
      class App {
        void configure(SSLContextBuilder builder) {
          builder.loadTrustMaterial(TrustSelfSignedStrategy.INSTANCE);
        }
      }
    expect_no_match: true
  description: Apache HttpClient loadTrustMaterial(TrustSelfSignedStrategy).
- id: java.tls.sslcontext_getinstance_ssl
  enabled: true
  language: java
  tag: weak-tls
  category: source-independent
  severity: high
  cwe:
  - CWE-327
  - CWE-326
  match:
    kind: call
    callee:
      attribute:
      - SSLContext
      - getInstance
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)^"(SSL|SSLv2|SSLv3|TLSv1|TLSv1\.1)"$'
  match_examples:
  - name: generated shape example
    code: "class App {\n  void handle(String input) throws Exception {\n    SSLContext.getInstance(\"SSL\");\n  }\n}\n"
  - name: modern tls protocol negative
    code: |
      class App {
        void handle() throws Exception {
          SSLContext.getInstance("TLSv1.2");
        }
      }
    expect_no_match: true
  description: "SSLContext.getInstance(\"SSL\"/\"SSLv3\"/\"TLSv1\"/\"TLSv1.1\") - obsolete protocol versions; use TLSv1.2 or newer. Merged aliases: java.tls.sslcontext_getinstance_sslv3, java.tls.sslcontext_getinstance_tlsv10, java.tls.sslcontext_getinstance_tlsv11."
  aliases:
  - java.tls.sslcontext_getinstance_sslv3
  - java.tls.sslcontext_getinstance_tlsv10
  - java.tls.sslcontext_getinstance_tlsv11
