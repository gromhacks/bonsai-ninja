- id: java.tls.set_default_hostname_verifier_allow
  enabled: true
  language: java
  tag: weak-tls
  category: source-independent
  severity: critical
  cwe:
  - CWE-295
  imports: [javax.net.ssl.HttpsURLConnection]
  match:
    kind: call
    callee:
      attribute:
      - HttpsURLConnection
      - setDefaultHostnameVerifier
      binding_origin: imported
  constraints:
  - arg_inline_callback_returns_static:
      index: 0
      value: {kind: boolean, value: true}
  match_examples:
  - name: imported inline hostname verifier always accepts
    code: |
      import javax.net.ssl.HttpsURLConnection;
      class App {
        void configure() { HttpsURLConnection.setDefaultHostnameVerifier((host, session) -> true); }
      }
    expect_match_text: [HttpsURLConnection.setDefaultHostnameVerifier]
  - name: rejecting hostname verifier
    code: |
      import javax.net.ssl.HttpsURLConnection;
      class App {
        void configure() { HttpsURLConnection.setDefaultHostnameVerifier((host, session) -> false); }
      }
    expect_no_match: true
  - name: mixed hostname verifier result
    code: |
      import javax.net.ssl.HttpsURLConnection;
      class App {
        void configure(boolean allow) {
          HttpsURLConnection.setDefaultHostnameVerifier((host, session) -> {
            if (allow) return true;
            return false;
          });
        }
      }
    expect_no_match: true
  - name: named hostname verifier remains unproven
    code: |
      import javax.net.ssl.HttpsURLConnection;
      class App {
        boolean verify(String host, Object session) { return true; }
        void configure() { HttpsURLConnection.setDefaultHostnameVerifier(this::verify); }
      }
    expect_no_match: true
  - name: local connection type collision
    code: |
      import javax.net.ssl.HttpsURLConnection;
      class HttpsURLConnection {
        static void setDefaultHostnameVerifier(Object value) {}
      }
      class App {
        void configure() { HttpsURLConnection.setDefaultHostnameVerifier((Object value) -> true); }
      }
    expect_no_match: true
  description: "HttpsURLConnection.setDefaultHostnameVerifier((h,s) -> true) - global bypass."
- id: java.tls.set_hostname_verifier_allow
  enabled: true
  language: java
  tag: weak-tls
  category: source-independent
  severity: critical
  cwe:
  - CWE-295
  imports: [javax.net.ssl.HttpsURLConnection]
  match:
    kind: call
    callee:
      name: setHostnameVerifier
      receiver_type_in: [javax.net.ssl.HttpsURLConnection]
  constraints:
  - arg_inline_callback_returns_static:
      index: 0
      value: {kind: boolean, value: true}
  match_examples:
  - name: typed connection inline verifier always accepts
    code: |
      import javax.net.ssl.HttpsURLConnection;
      class App {
        void configure(HttpsURLConnection connection) {
          connection.setHostnameVerifier((host, session) -> true);
        }
      }
    expect_match_text: [connection.setHostnameVerifier]
  - name: same method on unrelated receiver
    code: |
      class LocalConnection { void setHostnameVerifier(Object value) {} }
      class App {
        void configure(LocalConnection connection) {
          connection.setHostnameVerifier((Object value) -> true);
        }
      }
    expect_no_match: true
  - name: typed connection rejecting verifier
    code: |
      import javax.net.ssl.HttpsURLConnection;
      class App {
        void configure(HttpsURLConnection connection) {
          connection.setHostnameVerifier((host, session) -> false);
        }
      }
    expect_no_match: true
  description: "HttpsURLConnection.setHostnameVerifier - accepts any."
