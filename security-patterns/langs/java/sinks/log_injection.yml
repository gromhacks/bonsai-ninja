- id: java.log_injection.logger_info_instance_concat
  enabled: true
  language: java
  tag: log-injection
  severity: medium
  cwe:
  - CWE-117
  packages:
  - org.slf4j
  - org.apache.logging.log4j
  imports:
  - org.slf4j
  - org.apache.logging.log4j
  match:
    kind: call
    callee:
      regex: '(^|[.])info$'
      receiver_type_in:
      - Logger
      - org.slf4j.Logger
      - org.apache.logging.log4j.Logger
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: slf4j instance logger info concat
    code: |
      import org.slf4j.Logger;
      class App {
        private final Logger log = null;
        void handle(String input) {
          log.info("actor=" + input);
        }
      }
    expect_match_text: [log.info]
  - name: instance logger info literal negative
    code: |
      import org.slf4j.Logger;
      class App {
        private final Logger log = null;
        void handle(String input) {
          log.info("actor=system");
        }
      }
    expect_no_match: true
  description: "Logger.info tainted message on a typed SLF4J/Log4j receiver - log forging via CRLF/control characters."
