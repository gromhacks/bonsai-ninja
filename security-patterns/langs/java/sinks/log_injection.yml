- id: java.log_injection.log4j_jndi_lookup
  enabled: true
  language: java
  tag: code-injection
  severity: critical
  packages:
  - org.apache.logging.log4j.core
  cwe:
  - CWE-117
  - CWE-502
  match:
    kind: call
    callee:
      attribute:
      - Logger
      - info
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: log4j tainted message
    code: |
      import org.apache.logging.log4j.core.*;
      class App {
        void handle(String input) throws Exception {
          Logger.info(input);
        }
      }
  - name: arg tainted literal negative
    code: |
      import org.apache.logging.log4j.core.*;
      class App {
        void handle(String input) throws Exception {
          Logger.info("safe");
        }
      }
    expect_no_match: true
  description: 'Log4j 2 lookup-enabled appender + attacker-controlled message containing `${jndi:...}` is the Log4Shell CVE-2021-44228 shape. Merged aliases: java.log_injection.logger_info_concat.'
  aliases:
  - java.log_injection.logger_info_concat
  imports:
  - org.apache.logging.log4j.core
