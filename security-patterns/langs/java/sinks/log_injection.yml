- id: java.log_injection.mdc_put
  enabled: true
  language: java
  tag: log-injection
  severity: high
  packages:
  - org.slf4j
  - org.apache.logging.log4j
  - org.mongodb
  cwe:
  - CWE-117
  - CWE-943
  - CWE-94
  analysis_semantics:
    context_flow:
      channel: logging.mdc
      role: producer
      value_label: MDC context
      parameter_name: mdc
  match:
    kind: call
    callee:
      attribute:
      - MDC
      - put
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: mdc put tainted value
    code: |
      import org.slf4j.*;
      class App {
        void handle(String header) throws Exception {
          MDC.put("x-request-id", header);
        }
      }
  - name: mdc put request header
    code: |
      import org.slf4j.*;
      class App {
        void handle(String header) {
          MDC.put("x-request-id", header);
        }
      }
    expect_match_text:
    - MDC.put
  - name: arg tainted literal negative
    code: |
      import org.slf4j.*;
      class App {
        void handle(String header) throws Exception {
          MDC.put(header, "safe");
        }
      }
    expect_no_match: true
  description: "MDC.put(key, tainted header) - attacker-controlled logging context value can forge structured logs or poison downstream log correlation. Merged collision aliases: java.nosql.basicdbobject_where_put, java.nosql.basicdbobjectbuilder_where."
  aliases:
  - java.nosql.basicdbobject_where_put
  - java.nosql.basicdbobjectbuilder_where
  - java.nosql.basicdbobject_operator_put
- id: java.log_injection.mdc_context_logger_info
  enabled: true
  language: java
  tag: log-injection
  severity: high
  cwe:
  - CWE-117
  packages:
  - org.slf4j
  - org.apache.logging.log4j
  imports:
  - org.slf4j
  - org.apache.logging.log4j
  analysis_semantics:
    context_flow:
      channel: logging.mdc
      role: consumer
      value_label: MDC context
      parameter_name: mdc
  match:
    kind: call
    callee:
      regex: '(^|[.])info$'
  constraints:
  - receiver_type_in:
    - Logger
    - org.slf4j.Logger
    - org.apache.logging.log4j.Logger
  - enclosing_decorator_in:
    - RequestMapping
    - GetMapping
    - PostMapping
    - PutMapping
    - DeleteMapping
    - PatchMapping
  match_examples:
  - name: slf4j mapped handler literal info
    code: |
      import org.slf4j.Logger;
      import org.springframework.web.bind.annotation.*;
      class App {
        private final Logger log = null;
        @PostMapping("/audit")
        void handle() {
          log.info("audit event recorded");
        }
      }
    expect_match_text: [log.info]
  - name: non handler literal info negative
    code: |
      import org.slf4j.Logger;
      class App {
        private final Logger log = null;
        void handle() {
          log.info("audit event recorded");
        }
      }
    expect_no_match: true
  description: "Typed logger call in a Spring request handler that consumes thread-local MDC context; taint reachability is via a proven tainted MDC.put flow."
