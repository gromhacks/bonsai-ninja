# Java physical-device sources.
- id: java.physical.pi4j_input_value
  enabled: true
  language: java
  trust: physical
  tag: hw-input
  payload_types: [sensor-frame]
  packages: [com.pi4j]
  match:
    kind: call
    callee:
      regex: '(^|[.])(state|value|isHigh|isLow)$'
  constraints:
  - receiver_type_in: [DigitalInput, AnalogInput, com.pi4j.io.gpio.digital.DigitalInput, com.pi4j.io.gpio.analog.AnalogInput]
  - max_args: 0
  match_examples:
  - name: Pi4J digital input state
    code: |
      import com.pi4j.io.gpio.digital.DigitalInput;
      class App { Object sample(DigitalInput input) { return input.state(); } }
    expect_match_text: [input.state]
  - name: application model state is not hardware input
    code: |
      import com.pi4j.io.gpio.digital.DigitalInput;
      class StateModel { Object state() { return "constant"; } }
      class App { Object sample(StateModel input) { return input.state(); } }
    expect_no_match: true
  description: "Typed Pi4J digital/analog input state and value reads - samples received from attached hardware."
