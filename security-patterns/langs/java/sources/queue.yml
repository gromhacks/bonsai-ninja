- id: java.source.rabbitmq_basicdeliver_body
  enabled: true
  language: java
  trust: service
  tag: queue-input
  payload_types: [event, binary]
  packages: [com.rabbitmq.client]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*$"
      in_class: [DefaultConsumer]
      in_method: [handleDelivery]
      param_index_in: [3]
      param_type_in: [byte]
  match_examples:
  - name: rabbitmq default consumer delivery body
    code: |
      import com.rabbitmq.client.AMQP;
      import com.rabbitmq.client.DefaultConsumer;
      import com.rabbitmq.client.Envelope;
      class Consumer extends DefaultConsumer {
        public void handleDelivery(String tag, Envelope envelope,
            AMQP.BasicProperties properties, byte[] body) { }
      }
    expect_match_text: [body]
  - name: same method wrong position negative
    code: |
      import com.rabbitmq.client.DefaultConsumer;
      class Consumer extends DefaultConsumer {
        public void handleDelivery(byte[] body) { }
      }
    expect_no_match: true
  description: "RabbitMQ DefaultConsumer.handleDelivery body parameter - broker-delivered message bytes at the callback's fixed fourth parameter."

