# Callable-shape rules (work today) ----------------------------------------

- id: java.source.kafka_record_value
  enabled: true
  language: java
  trust: service
  tag: queue-input
  packages: [org.apache.kafka.clients.consumer]
  match:
    kind: call
    callee:
      name: value
  constraints:
  - receiver_name_in:
    - record
    - consumerRecord
    - msg
    - message
  match_examples:
  - name: generated shape example
    code: |
      import org.apache.kafka.clients.consumer.*;
      class App {
        void handle(String input) throws Exception {
          record.value(input);
        }
      }
  description: "Kafka ConsumerRecord.value() — message payload via the typical `record` receiver name."

  imports:
  - org.apache.kafka.clients.consumer
- id: java.source.kafka_record_key
  enabled: true
  language: java
  trust: service
  tag: queue-input
  packages: [org.apache.kafka.clients.consumer]
  match:
    kind: call
    callee:
      name: key
  constraints:
  - receiver_name_in:
    - record
    - consumerRecord
  match_examples:
  - name: generated shape example
    code: |
      import org.apache.kafka.clients.consumer.*;
      class App {
        void handle(String input) throws Exception {
          record.key(input);
        }
      }
  description: "Kafka ConsumerRecord.key() — partitioning key from the broker."

  imports:
  - org.apache.kafka.clients.consumer
- id: java.source.kafka_consumer_poll
  enabled: true
  language: java
  trust: service
  tag: queue-input
  packages: [org.apache.kafka.clients.consumer]
  match:
    kind: call
    callee:
      attribute: [KafkaConsumer, poll]
  match_examples:
  - name: generated shape example
    code: |
      import org.apache.kafka.clients.consumer.*;
      class App {
        void handle(String input) throws Exception {
          KafkaConsumer.poll(input);
        }
      }
  description: "KafkaConsumer.poll(timeout) — returns ConsumerRecords whose payloads are broker-supplied."

  imports:
  - org.apache.kafka.clients.consumer
