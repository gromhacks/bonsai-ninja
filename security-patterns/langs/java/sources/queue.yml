# Java message-queue input sources (Kafka, JMS, RabbitMQ, AMQP, SQS, Camel, Pub/Sub).
#
# Listener methods and their parameters are compiler-visible. These rules use
# enclosing method annotations plus declared parameter types, or an exact
# @Payload parameter annotation. They do not infer a queue boundary from a
# conventional parameter name.

- id: java.source.azure_queue_trigger
  enabled: true
  language: java
  trust: service
  tag: queue-input
  payload_types: [event, text, binary, json]
  packages: [com.microsoft.azure.functions]
  match:
    kind: param
    target: { annotation: QueueTrigger }
  match_examples:
  - name: azure storage queue trigger payload
    code: |
      import com.microsoft.azure.functions.annotation.QueueTrigger;
      class Function {
        void run(@QueueTrigger(name = "message", queueName = "orders") String message) { }
      }
    expect_match_text: [message]
  - name: ordinary queue parameter negative
    code: |
      import com.microsoft.azure.functions.annotation.QueueTrigger;
      class Function { void helper(String message) { } }
    expect_no_match: true
  description: "Azure Functions Java @QueueTrigger parameter - message supplied by Azure Queue Storage."

