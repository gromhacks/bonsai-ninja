# Java message-queue input sources (Kafka, JMS, RabbitMQ, AMQP, SQS, Camel, Pub/Sub).
#
# ── Adapter gap (audited 2026-04) ────────────────────────────────────────────
# Spring's queue listeners bind payloads via annotations on handler methods
# (@KafkaListener, @RabbitListener, @JmsListener, @SqsListener, AMQP
# `handleDelivery`). The Java adapter currently surfaces parameter
# identifiers but not their annotation decorators, so `kind: param` rules
# on annotation names cannot fire (see remote.yml for the same gap).
#
# Likewise, typed receiver matching (e.g. `attribute: [ConsumerRecord, value]`)
# under-fires because adapters key call sites by the local receiver
# identifier, not by its declared type.
#
# Per docs/pattern-guide.mdx the fix lives in the adapter, not in YAML.
# Below this header: callable-shape rules using receiver-name constraints
# that DO work today.

- id: java.source.kafka_consumer_record
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: java
  trust: service
  tag: queue-input
  packages: [org.apache.kafka.clients.consumer]
  match:
    kind: call
    callee:
      attribute: [ConsumerRecord, value]
  description: "Disabled — adapters index local receivers like `record.value`, not receiver types like `ConsumerRecord.value`."

- id: java.source.kafka_listener_annot
  enabled: false
  disabled_reason:
    code: over-broad
  language: java
  trust: service
  tag: queue-input
  packages: [org.springframework.kafka.annotation]
  match:
    kind: param
    target:
      name: KafkaListener
  description: "Disabled — matcher only sees parameter identifiers, not Spring @KafkaListener annotations."

