- id: java.source.scanner_nextline
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: java
  trust: local
  tag: cli-input
  match:
    kind: call
    callee:
      attribute: [Scanner, nextLine]
  match_examples:
    - name: Scanner nextLine
      code: |
        import java.util.*;
        class App {
          void handle(Scanner scanner) throws Exception {
            scanner.nextLine();
          }
        }
      expect_match_text: [scanner.nextLine]
  description: "Disabled - Scanner.nextLine() is a parser over any Scanner source, including constant strings and trusted files. Re-enable only when receiver construction/origin facts can prove System.in or another configured input boundary."

- id: java.source.scanner_next
  enabled: false
  disabled_reason:
    code: over-broad
  language: java
  trust: local
  tag: cli-input
  match:
    kind: call
    callee:
      attribute: [Scanner, next]
  match_examples:
    - name: Scanner next
      code: |
        import java.util.*;
        class App {
          void handle(Scanner scanner) throws Exception {
            scanner.next();
          }
        }
      expect_match_text: [scanner.next]
  description: "Scanner.next() on a scanner-named receiver - token supplied by a local input stream."

- id: java.source.bufferedreader_readline
  enabled: false
  disabled_reason:
    code: over-broad
  language: java
  trust: local
  tag: cli-input
  match:
    kind: call
    callee:
      attribute: [BufferedReader, readLine]
  description: "Disabled - BufferedReader.readLine is too generic; sources are better inferred from the wrapped stream (stdin vs file vs socket)."

- id: java.source.nio_files_read
  enabled: true
  language: java
  trust: local
  tag: file-input
  payload_types: [text, binary]
  packages: [java.nio.file]
  match:
    kind: call
    callee:
      regex: '^Files\.(readString|readAllBytes|readAllLines|lines)$'
  constraints:
  - min_args: 1
  match_examples:
  - name: NIO file text read
    code: |
      import java.nio.file.Files;
      import java.nio.file.Path;
      class App { String load(Path path) throws Exception { return Files.readString(path); } }
    expect_match_text: [Files.readString]
  - name: NIO file write is not input
    code: |
      import java.nio.file.Files;
      import java.nio.file.Path;
      class App { void save(Path path) throws Exception { Files.writeString(path, "constant"); } }
    expect_no_match: true
  description: "Exact java.nio.file.Files content-reading operations - values read from a local filesystem boundary."

- id: java.source.fileinputstream_read_buffer
  enabled: true
  language: java
  trust: local
  tag: file-input
  payload_types: [binary]
  packages: [java.io]
  match:
    kind: call
    callee:
      regex: '(^|[.])read$'
  constraints:
  - receiver_type_in: [FileInputStream, java.io.FileInputStream]
  - min_args: 1
  taint_semantics:
    source_output_args: [0]
  match_examples:
  - name: file input stream fills byte buffer
    code: |
      import java.io.FileInputStream;
      class App { int load(FileInputStream stream, byte[] buffer) throws Exception { return stream.read(buffer); } }
    expect_match_text: [stream.read]
  - name: byte array stream is not a filesystem boundary
    code: |
      import java.io.ByteArrayInputStream;
      class App { int load(ByteArrayInputStream stream, byte[] buffer) throws Exception { return stream.read(buffer); } }
    expect_no_match: true
  description: "FileInputStream.read writes local-file bytes into argument 0; its integer return is only the copied-byte count."
