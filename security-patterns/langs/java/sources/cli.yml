# Java CLI / environment / config local-trust sources.
- id: java.source.main_args
  enabled: true
  language: java
  trust: local
  tag: cli-input
  match:
    kind: param
    target:
      in_method: [main]
      param_index_in: [0]
      param_type_in: [String]
      param_count_in: [1]
  constraints:
    - enclosing_modifier_in: [static]
  match_examples:
    - name: Java main args
      code: |
        class App {
          public static void main(String[] args) {
          }
        }
      expect_match_text: [args]
    - name: instance method named main is not the process entry point
      code: |
        class App {
          public void main(String[] args) {
          }
        }
      expect_no_match: true
  description: "The String[] parameter of static Java main(...) - command-line arguments supplied by the local invoker. Matched from signature position/type, independent of the parameter name."

- id: java.source.system_getenv
  enabled: true
  language: java
  trust: config
  tag: config-input
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: call
    callee:
      attribute: [System, getenv]
  match_examples:
    - name: generated shape example
      code: |
        class App {
          void handle(String input) throws Exception {
            System.getenv(input);
          }
        }
  description: "System.getenv - environment variable (config trust)."

