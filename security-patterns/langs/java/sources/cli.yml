# Java CLI / environment / config local-trust sources.
- id: java.source.main_args
  enabled: false
  disabled_reason:
    code: over-broad
  language: java
  trust: local
  tag: cli-input
  match:
    kind: param
    target:
      name: args
  description: "Disabled — `String[] args` matches every function named with an `args` parameter; enable per-project or key off a scan-time heuristic (enclosing function == 'main')."

- id: java.source.system_getenv
  enabled: true
  language: java
  trust: config
  tag: config-input
  match:
    kind: call
    callee:
      attribute: [System, getenv]
  match_examples:
    - name: generated shape example
      code: |
        class App {
          void handle(String input) throws Exception {
            System.getenv(input);
          }
        }
  description: "System.getenv — environment variable (config trust)."

- id: java.source.system_getproperty
  enabled: true
  language: java
  trust: config
  tag: config-input
  match:
    kind: call
    callee:
      attribute: [System, getProperty]
  match_examples:
    - name: generated shape example
      code: |
        class App {
          void handle(String input) throws Exception {
            System.getProperty(input);
          }
        }
  description: "System.getProperty — JVM property (config trust)."

