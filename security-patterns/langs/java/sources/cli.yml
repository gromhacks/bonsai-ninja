- id: java.source.console_readline
  enabled: true
  language: java
  trust: local
  tag: cli-input
  match:
    kind: call
    callee:
      attribute: [Console, readLine]
  match_examples:
    - name: Console readLine
      code: |
        import java.io.*;
        class App {
          void handle(Console console) throws Exception {
            console.readLine();
          }
        }
      expect_match_text: [console.readLine]
  description: "Console.readLine() on a console-named receiver - line supplied by the local user."

