# Java CLI / environment / config local-trust sources.
- id: java.source.main_args
  enabled: true
  language: java
  trust: local
  tag: cli-input
  match:
    kind: param
    target:
      name: args
      in_method: [main]
  match_examples:
    - name: Java main args
      code: |
        class App {
          public static void main(String[] args) {
          }
        }
      expect_match_text: [args]
  description: "String[] args on Java main(...) — command-line arguments supplied by the local invoker."

- id: java.source.system_getenv
  enabled: true
  language: java
  trust: config
  tag: config-input
  match:
    kind: call
    callee:
      attribute: [System, getenv]
  match_examples:
    - name: generated shape example
      code: |
        class App {
          void handle(String input) throws Exception {
            System.getenv(input);
          }
        }
  description: "System.getenv — environment variable (config trust)."

- id: java.source.system_getproperty
  enabled: true
  language: java
  trust: config
  tag: config-input
  match:
    kind: call
    callee:
      attribute: [System, getProperty]
  match_examples:
    - name: generated shape example
      code: |
        class App {
          void handle(String input) throws Exception {
            System.getProperty(input);
          }
        }
  description: "System.getProperty — JVM property (config trust)."

- id: java.source.console_readline
  enabled: true
  language: java
  trust: local
  tag: cli-input
  match:
    kind: call
    callee:
      name: readLine
  constraints:
  - receiver_name_in: [console, con, sysConsole]
  match_examples:
    - name: Console readLine
      code: |
        class App {
          void handle() throws Exception {
            console.readLine();
          }
        }
      expect_match_text: [console.readLine]
  description: "Console.readLine() on a console-named receiver — line supplied by the local user."

