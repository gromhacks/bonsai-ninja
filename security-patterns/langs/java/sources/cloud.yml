# Java cloud-function handlers (event-driven/serverless payloads).
# HTTP-triggered functions live in remote.yml because they are
# network-attacker reachable.
- id: java.source.aws_lambda_handler
  enabled: true
  language: java
  trust: service
  tag: cloud-event
  payload_types: [event, json, text, binary]
  packages: ["com.amazonaws:aws-lambda-java-core"]
  imports: [com.amazonaws.services.lambda.runtime]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*$"
      in_class: [RequestHandler, RequestStreamHandler]
      in_method: [handleRequest]
      decl_kind_in: [method]
      param_index_in: [0]
  match_examples:
  - name: aws lambda request handler input
    code: |
      import com.amazonaws.services.lambda.runtime.Context;
      import com.amazonaws.services.lambda.runtime.RequestHandler;
      class Function implements RequestHandler<Order, String> {
        public String handleRequest(Order event, Context context) { return "ok"; }
      }
      class Order { }
    expect_match_text: [event]
  - name: same method outside handler negative
    code: |
      import com.amazonaws.services.lambda.runtime.RequestHandler;
      class Helper {
        public void handleRequest(String event) { }
      }
    expect_no_match: true
  description: "First parameter of an AWS Lambda Java RequestHandler or RequestStreamHandler handleRequest method - invocation event payload proven by interface, method, and position."

- id: java.source.azure_blob_trigger
  enabled: true
  language: java
  trust: service
  tag: cloud-event
  payload_types: [event, file, binary]
  packages: [com.microsoft.azure.functions]
  match:
    kind: param
    target: { annotation: BlobTrigger }
  match_examples:
  - name: azure blob trigger payload
    code: |
      import com.microsoft.azure.functions.annotation.BlobTrigger;
      class Function {
        void run(@BlobTrigger(name = "blob", path = "incoming/{name}") byte[] blob) { }
      }
    expect_match_text: [blob]
  - name: ordinary blob parameter negative
    code: |
      import com.microsoft.azure.functions.annotation.BlobTrigger;
      class Function { void helper(byte[] blob) { } }
    expect_no_match: true
  description: "Azure Functions Java @BlobTrigger parameter - object content supplied by the triggering storage blob."
