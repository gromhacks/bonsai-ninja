# Generic untrusted-bytes parameter for deserialization-style entry
# points. The typical shape is `void deserialize(byte[] data)` /
# `Object readObject(byte[] payload)` — the byte-array param is the
# wire/cache/queue blob. Bare-name match overmatches, but the deser
# sinks (ObjectInputStream.readObject, Kryo, XMLDecoder,
# jackson-databind default typing) are the second gate.
- id: java.source.bytes_blob_param
  enabled: true
  language: java
  trust: remote
  tag: caller-input
  payload_types: [binary]
  match:
    kind: param
    target:
      regex: "^(data|blob|payload|bytes|buf|buffer)$"
  match_examples:
  - name: generated shape example
    code: |
      class App {
        void handle(String payload) {
        }
      }
  description: "Generic `byte[] data | blob | payload | bytes | buf | buffer` parameter on deserialization-style entry points. Pairs with java.deser.* sinks (ObjectInputStream.readObject, Kryo, XMLDecoder, jackson-databind). Engine taint flow + sink shape are the second gate."

