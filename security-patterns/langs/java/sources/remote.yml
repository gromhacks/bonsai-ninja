- id: java.source.spring_multipart_originalfilename
  enabled: true
  language: java
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [file]
  packages: [org.springframework.web.multipart]
  match:
    kind: call
    callee:
      regex: "\\.getOriginalFilename$"
  match_examples:
  - name: generated shape example
    code: |
      import org.springframework.web.multipart.*;
      class App {
        void handle(MultipartFile file) throws Exception {
          file.getOriginalFilename();
        }
      }
      interface MultipartFile {
        String getOriginalFilename();
      }
    expect_match_text: [file.getOriginalFilename]
  description: "Spring MultipartFile.getOriginalFilename() — client-supplied upload filename from a package-scoped local receiver call."

  imports:
  - org.springframework.web.multipart
