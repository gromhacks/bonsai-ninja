# Java HTTP / Servlet / JAX-RS / Spring remote input sources.
#
# -- Adapter coverage notes (audited 2026-04) ---------------------------------
# Most modern Java web frameworks bind HTTP input to method parameters via
# annotations: Spring MVC (@RequestParam, @RequestBody, @PathVariable,
# @RequestHeader, @CookieValue, @RequestPart, @MatrixVariable,
# @ModelAttribute), JAX-RS (@QueryParam, @PathParam, @HeaderParam,
# @FormParam, @CookieParam, @MatrixParam, @BeanParam), and several
# cloud/event triggers (@HttpTrigger, @KafkaListener, @RabbitListener,
# @JmsListener, @SqsListener, @OnMessage). The shared adapter kit now emits
# parameter annotation metadata for common Java grammar shapes, so the Spring
# annotation rules below are enabled. The current Java adapter:
#
#   1. Surfaces parameter identifiers plus common parameter annotations.
#   2. Does not consistently surface receiver-type facts for local variables,
#      so rules that need local receivers must either use adapter-visible
#      semantic facts or stay tightly scoped with package/import-gated callable
#      regexes.
#
# Per docs/pattern-guide.mdx:
#
#   > If a source-visible value flow is missing, fix adapter extraction or
#   > the semantic graph. Do not encode the missing edge in YAML.
#
# The bundled pack contains only executable rules. New framework shapes belong
# here only after their required compiler facts and collision-negative examples
# exist.

- id: java.source.spring_request_param
  enabled: true
  language: java
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [query]
  packages: [org.springframework.web.bind.annotation]
  match:
    kind: param
    target:
      annotation: RequestParam
  match_examples:
  - name: generated shape example
    code: |
      import org.springframework.web.bind.annotation.*;
      class App {
        void handle(@RequestParam String value) {
        }
      }
    expect_match_text: [value]
  - name: request param identifier is not an annotation
    code: |
      import org.springframework.web.bind.annotation.*;
      class App { void handle(String RequestParam) {} }
    expect_no_match: true
  description: "Spring @RequestParam annotated parameter - query/form value bound from the HTTP request, including raw String values that can flow to XSS sinks."

  imports:
  - org.springframework.web.bind.annotation
