# Java database-origin sources (JDBC / Hibernate).
- id: java.jdbc.resultset_getstring
  enabled: true
  language: java
  trust: database
  tag: db-input
  packages: ["java.sql"]
  match:
    kind: call
    callee:
      attribute: [ResultSet, getString]
  match_examples:
  - name: ResultSet getString
    code: |
      import java.sql.*;
      class App {
        Object handle(ResultSet rs) throws Exception {
          return rs.getString("name");
        }
      }
    expect_match_text: [rs.getString]
  description: "ResultSet.getString(...) on a result-set receiver - value read from the database boundary."

