# Java sanitizers - calls that neutralise a specific taint tag.
# SQL ----------------------------------------------------------------
- id: java.sanitizer.prepared_statement
  enabled: true
  language: java
  tag: sql-parameter
  packages: ["java.sql"]
  match:
    kind: call
    callee:
      attribute: [Connection, prepareStatement]
  constraints:
  - min_args: 1
  - arg_matches_regex:
      index: 0
      regex: '^"([^"\\]|\\.)*(\?|:[A-Za-z_][A-Za-z0-9_]*)([^"\\]|\\.)*"$'
  match_examples:
  - name: generated shape example
    code: |
      import java.sql.*;
      class App {
        void handle(String input) throws Exception {
          Connection.prepareStatement("select * from users where id = ?");
        }
      }
    expect_match_text: [Connection.prepareStatement]
  - name: prepare statement without placeholder negative
    code: |
      import java.sql.*;
      class App {
        void handle(String input) throws Exception {
          Connection.prepareStatement(input);
        }
      }
    expect_no_match: true
  - name: prepare statement tainted template with placeholder negative
    code: |
      import java.sql.*;
      class App {
        void handle(Connection conn, String table) throws Exception {
          String sql = "select * from " + table + " where id = ?";
          conn.prepareStatement(sql);
        }
      }
    expect_no_match: true
  description: "Connection.prepareStatement(static SQL with placeholders) - bound args via setX neutralise SQL value injection.
    Dynamic SQL text is handled by java.sqli.connection_preparestatement_tainted_sql."

- id: java.sanitizer.prepared_statement_setstring
  enabled: true
  language: java
  tag: sql-parameter
  packages: ["java.sql"]
