# Path ---------------------------------------------------------------
- id: java.sanitizer.path_normalize
  enabled: false
  disabled_reason:
    code: over-broad
  language: java
  tag: path-sanitize
  match:
    kind: call
    callee:
      attribute: [Path, normalize]
  description: "Disabled - Path.normalize removes .. segments but does not by itself enforce trusted-root containment."

- id: java.sanitizer.path_startswith
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: java
  tag: path-sanitize
  match:
    kind: call
    callee:
      attribute: [Path, startsWith]
  description: "Disabled - startsWith is only a sanitizer when the receiver is a normalized Path and the argument is the trusted
    root; receiver type is not available in v1 matching."

