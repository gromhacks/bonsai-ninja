    kind: call
    callee:
      name: startsWith
  constraints:
  - arg_equals:
      index: 0
      value: '"/"'
  - same_receiver_call_count_at_least: 2
  match_examples:
  - name: paired same-origin path guard
    code: |
      class App {
        boolean allow(String next) {
          return next.startsWith("/") && !next.startsWith("//");
        }
      }
    expect_match_text: [next.startsWith]
  - name: paired same-origin path guard negative constraint boundary
    code: "class App {\n  boolean allow(String next) {\n    return next.startsWith() && !next.startsWith(\"//\");\n  }\n}\n"
    expect_no_match: true
  description: "Same-origin redirect path guard - the leading slash check is only credited when another startsWith call is
    present on the same receiver, allowing the paired `!path.startsWith(\"//\")` scheme-relative guard shape."

