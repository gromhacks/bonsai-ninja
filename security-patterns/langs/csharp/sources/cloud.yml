# C# cloud / FaaS sources. AWS Lambda, Azure Functions, GCF.
- id: csharp.source.aws_lambda_handler
  enabled: false
  disabled_reason:
    code: over-broad
  language: csharp
  tag: cloud-event
  trust: service
  packages: [Amazon.Lambda.Core]
  match:
    kind: param
    target:
      name: FunctionHandler
  description: "Disabled - `FunctionHandler` is the delegate/type name; `kind: param` only matches parameter identifiers."

- id: csharp.source.azure_function_blob_trigger
  enabled: true
  language: csharp
  tag: cloud-event
  trust: service
  payload_types: [event, file, binary]
  packages: [Microsoft.Azure.WebJobs, Microsoft.Azure.Functions.Worker.Extensions.Storage.Blobs]
  match:
    kind: param
    target:
      annotation: BlobTrigger
  match_examples:
  - name: azure blob trigger payload
    code: |
      using Microsoft.Azure.WebJobs;
      class Functions {
        void Run([BlobTrigger("incoming/{name}")] byte[] blob) { }
      }
    expect_match_text: [blob]
  - name: blob output binding negative
    code: |
      using Microsoft.Azure.WebJobs;
      class Functions {
        void Run([Blob("outgoing/{name}")] byte[] blob) { }
      }
    expect_no_match: true
  description: "Azure Functions [BlobTrigger] parameter - storage object bytes supplied by the triggering blob event."

- id: csharp.source.azure_function_eventhub_trigger
  enabled: true
  language: csharp
  tag: cloud-event
  trust: service
  payload_types: [event, text, binary, json]
  packages: [Microsoft.Azure.WebJobs, Microsoft.Azure.Functions.Worker.Extensions.EventHubs]
  match:
    kind: param
    target:
      annotation: EventHubTrigger
  match_examples:
  - name: azure event hub trigger payload
    code: |
      using Microsoft.Azure.WebJobs;
      class Functions {
        void Run([EventHubTrigger("events")] string message) { }
      }
    expect_match_text: [message]
  - name: ordinary event parameter negative
    code: |
      using Microsoft.Azure.WebJobs;
      class Functions {
        void Helper(string message) { }
      }
    expect_no_match: true
  description: "Azure Functions [EventHubTrigger] parameter - event payload supplied by Event Hubs."
