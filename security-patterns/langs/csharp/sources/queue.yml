- id: csharp.source.kafka_consume
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: csharp
  tag: queue-input
  trust: service
  packages: [Confluent.Kafka]
  match:
    kind: call
    callee:
      attribute: [Consumer, Consume]
  description: "Disabled — adapters index local receivers like `consumer.Consume`, not receiver types like `Consumer.Consume`."

- id: csharp.source.sqs_receivemessage
  enabled: true
  language: csharp
  tag: queue-input
  trust: service
  packages: [AWSSDK.SQS]
  match:
    kind: call
    callee:
      name: ReceiveMessageAsync
  match_examples:
  - name: declared shape
    code: |
      using AWSSDK.SQS;
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; ReceiveMessageAsync(input); } }
  description: "AmazonSQSClient.ReceiveMessageAsync — tail-match across local client variable names."
