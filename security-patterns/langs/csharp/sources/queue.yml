# C# queue / broker sources. Service Bus, SQS, MassTransit, RabbitMQ, Kafka.
- id: csharp.source.azure_servicebus_queue_trigger
  enabled: false
  disabled_reason:
    code: over-broad
  language: csharp
  tag: queue-input
  trust: service
  packages: [Microsoft.Azure.WebJobs]
  match:
    kind: param
    target:
      name: QueueTrigger
  description: "Disabled — matcher only sees parameter identifiers, not Azure [QueueTrigger] attributes."

