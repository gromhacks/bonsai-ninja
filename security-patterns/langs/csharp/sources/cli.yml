# C# CLI / environment sources. trust: local.
- id: csharp.source.console_readline
  enabled: true
  language: csharp
  tag: cli-input
  trust: local
  match:
    kind: call
    callee:
      name: ReadLine
  match_examples:
    - name: declared shape
      code: |
        class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; ReadLine(input); } }
  description: "Console.ReadLine - local CLI input from stdin."

- id: csharp.source.environment_args
  enabled: true
  language: csharp
  tag: cli-input
  trust: local
  payload_types: [text]
  match:
    kind: call
    callee:
      attribute: [Environment, GetCommandLineArgs]
  match_examples:
    - name: command line args
      code: |
        using System;
        class App { string[] Args() { return Environment.GetCommandLineArgs(); } }
      expect_match_text: [Environment.GetCommandLineArgs]
  description: "Environment.GetCommandLineArgs() - process argv; local trust but attacker-controlled in CLI/batch invocations."

- id: csharp.source.environment_getenv
  enabled: true
  language: csharp
  tag: env-input
  trust: local
  payload_types: [text]
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: call
    callee:
      attribute: [Environment, GetEnvironmentVariable]
  match_examples:
    - name: environment variable
      code: |
        using System;
        class App { string Home() { return Environment.GetEnvironmentVariable("HOME"); } }
      expect_match_text: [Environment.GetEnvironmentVariable]
  description: "Environment.GetEnvironmentVariable(name) - process environment value; local trust but attacker-controlled through shells, service managers, CI, and container configuration."

- id: csharp.source.main_args_param
  enabled: true
  language: csharp
  tag: cli-input
  trust: local
  payload_types: [text]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_method: [Main]
      param_index_in: [0]
      param_type_in: [string, String]
      param_count_in: [1]
  constraints:
    - enclosing_modifier_in: [static]
  match_examples:
    - name: main args parameter
      code: |
        class App { static void Main(string[] commandLine) { } }
      expect_match_text: [commandLine]
    - name: helper args parameter negative
      code: |
        class App { void Helper(string[] args) { } }
      expect_no_match: true
  description: "The string[] parameter of static C# Main(...) - command-line arguments matched from signature position/type, independent of the parameter name."
