# C# HTTP / RPC external sources. ASP.NET Core + WebForms + WCF + SignalR + gRPC + Blazor.
#
# -- Adapter coverage notes (audited 2026-04) ---------------------------------
# ASP.NET request property reads are now represented as `kind: read`
# attribute-chain facts, so the Request.Query/Form/Body/Header/etc rules
# below are enabled. The C# adapter also emits exact parameter-attribute
# metadata, so ASP.NET Core MVC binder attributes
# ([FromBody]/[FromQuery]/[FromForm]/[FromRoute]/[FromHeader]) are matched at
# the bound parameter rather than by parameter spelling. Per
# docs/pattern-guide.mdx the fix for unsupported shapes is in the C# adapter,
# not here:
#
#   > If a source-visible value flow is missing, fix adapter extraction or
#   > the semantic graph. Do not encode the missing edge in YAML.
#
# Below this header: callable-shape sources, ASP.NET attribute-read sources,
# and compiler-proven parameter binder sources.

- id: csharp.source.azure_function_http_trigger
  enabled: true
  language: csharp
  tag: http-input
  trust: remote
  payload_types: [event, json]
  packages: [Microsoft.Azure.WebJobs, Microsoft.Azure.Functions.Worker]
  match:
    kind: param
    target:
      annotation: HttpTrigger
  match_examples:
  - name: azure http trigger request
    code: |
      using Microsoft.Azure.WebJobs;
      class Functions {
        void Run([HttpTrigger("get", "post")] HttpRequest request) { }
      }
      class HttpRequest { }
    expect_match_text: [request]
  - name: ordinary request parameter negative
    code: |
      using Microsoft.Azure.WebJobs;
      class Functions {
        void Helper(HttpRequest request) { }
      }
      class HttpRequest { }
    expect_no_match: true
  description: "Azure Functions [HttpTrigger] parameter - request data supplied by the remote HTTP caller."

- id: csharp.source.gcf_function
  enabled: true
  language: csharp
  tag: http-input
  trust: remote
  payload_types: [event, json]
  packages: [Google.Cloud.Functions.Framework]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_class: [IHttpFunction]
      in_method: [HandleAsync]
      param_type_in: [HttpContext, Microsoft.AspNetCore.Http.HttpContext]
  match_examples:
  - name: google cloud http function request context
    code: |
      using Google.Cloud.Functions.Framework;
      using Microsoft.AspNetCore.Http;
      class Function : IHttpFunction {
        public Task HandleAsync(HttpContext context) { return Task.CompletedTask; }
      }
    expect_match_text: [context]
  - name: helper http context negative
    code: |
      using Google.Cloud.Functions.Framework;
      using Microsoft.AspNetCore.Http;
      class Function : IHttpFunction {
        public Task Helper(HttpContext context) { return Task.CompletedTask; }
      }
    expect_no_match: true
  description: "Google Cloud Functions IHttpFunction.HandleAsync(HttpContext) request context supplied by the remote caller."

- id: csharp.source.httputility_parsequerystring
  enabled: true
  language: csharp
  trust: remote
  tag: http-input
  payload_types: [query]
  packages: [System.Web]
  match:
    kind: call
    callee:
      attribute: [HttpUtility, ParseQueryString]
  match_examples:
  - name: declared shape
    code: |
      using System.Web;
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; HttpUtility.ParseQueryString(input); } }
  - name: unrelated httputility encode negative
    code: |
      using System.Web;
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; HttpUtility.HtmlEncode(input); } }
    expect_no_match: true
  description: "HttpUtility.ParseQueryString(rawQuery) - parses the request query-string into a NameValueCollection; the input is attacker-controlled."

- id: csharp.source.streamreader_readtoend
  enabled: false
  disabled_reason:
    code: over-broad
  language: csharp
  trust: remote
  tag: http-input
  packages: [System.IO]
  match:
    kind: call
    callee:
      attribute: [StreamReader, ReadToEnd]
  description: "Disabled - StreamReader.ReadToEnd is generic file/stream IO; enable in audits where Request.Body wrapping is the primary surface."

- id: csharp.source.signalr_hub_method_arg
  enabled: true
  language: csharp
  trust: remote
  tag: rpc-input
  payload_types: [event, text, binary, json]
  packages: [Microsoft.AspNetCore.SignalR]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_class: [Hub]
      decl_kind_in: [method]
      visibility_in: [public]
  match_examples:
  - name: public signalr hub argument
    code: |
      using Microsoft.AspNetCore.SignalR;
      public class ChatHub : Hub {
        public void Send(string payload) { }
      }
    expect_match_text: [payload]
  - name: private hub helper negative
    code: |
      using Microsoft.AspNetCore.SignalR;
      public class ChatHub : Hub {
        private void Normalize(string payload) { }
      }
    expect_no_match: true
  - name: ordinary public method negative
    code: |
      using Microsoft.AspNetCore.SignalR;
      public class Helper {
        public void Send(string payload) { }
      }
    expect_no_match: true
  description: "Parameter of a public method on an ASP.NET Core SignalR Hub - client-supplied RPC invocation argument, proven from declaration visibility and Hub inheritance."

