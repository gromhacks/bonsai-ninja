# C# HTTP / RPC external sources. ASP.NET Core + WebForms + WCF + SignalR + gRPC + Blazor.
#
# -- Adapter coverage notes (audited 2026-04) ---------------------------------
# ASP.NET request property reads are now represented as `kind: read`
# attribute-chain facts, so the Request.Query/Form/Body/Header/etc rules
# below are enabled. ASP.NET Core MVC parameter binding via attributes
# ([FromBody]/[FromQuery]/[FromForm]/[FromRoute]/[FromHeader]) is still kept
# off until C# parameter-attribute metadata is emitted precisely enough for
# rule matching. Per docs/pattern-guide.mdx the fix for unsupported shapes is
# in the C# adapter, not here:
#
#   > If a source-visible value flow is missing, fix adapter extraction or
#   > the semantic graph. Do not encode the missing edge in YAML.
#
# Tracking task: surface C# parameter-attribute metadata so the matcher can
# pivot on attribute name. Once that ships, flip the remaining
# `enabled: false` attribute rules below to true and re-run the audit.
#
# Below this header: callable-shape sources plus enabled ASP.NET
# attribute-read sources that work today.

- id: csharp.source.httputility_parsequerystring
  enabled: true
  language: csharp
  trust: remote
  tag: http-input
  payload_types: [query]
  packages: [System.Web]
  match:
    kind: call
    callee:
      attribute: [HttpUtility, ParseQueryString]
  match_examples:
  - name: declared shape
    code: |
      using System.Web;
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; HttpUtility.ParseQueryString(input); } }
  - name: unrelated httputility encode negative
    code: |
      using System.Web;
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; HttpUtility.HtmlEncode(input); } }
    expect_no_match: true
  description: "HttpUtility.ParseQueryString(rawQuery) - parses the request query-string into a NameValueCollection; the input is attacker-controlled."

- id: csharp.source.streamreader_readtoend
  enabled: false
  disabled_reason:
    code: over-broad
  language: csharp
  trust: remote
  tag: http-input
  packages: [System.IO]
  match:
    kind: call
    callee:
      attribute: [StreamReader, ReadToEnd]
  description: "Disabled - StreamReader.ReadToEnd is generic file/stream IO; enable in audits where Request.Body wrapping is the primary surface."

- id: csharp.source.signalr_hub_method_arg
