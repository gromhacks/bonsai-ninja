- id: csharp.source.websocket_receiveasync
  enabled: true
  language: csharp
  trust: remote
  tag: ws-input
  payload_types: [binary]
  packages: [System.Net.WebSockets]
  match:
    kind: call
    callee:
      attribute: [WebSocket, ReceiveAsync]
  constraints:
  - min_args: 1
  match_examples:
  - name: websocket receive async
    code: |
      using System.Net.WebSockets;
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; WebSocket.ReceiveAsync(input); } }
    expect_match_text: [WebSocket.ReceiveAsync]
  - name: websocket send async negative
    code: |
      using System.Net.WebSockets;
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; WebSocket.SendAsync(input); } }
    expect_no_match: true
  description: "System.Net.WebSockets WebSocket.ReceiveAsync - frame bytes supplied by the websocket peer."

- id: csharp.source.graphql_resolvefieldcontext_getargument
  enabled: true
  language: csharp
  trust: remote
  tag: graphql-input
  payload_types: [graphql]
  packages: [GraphQL]
  match:
    kind: call
    callee:
      regex: '(^|[.])GetArgument(<[^>]+>)?$'
  constraints:
  - min_args: 1
  - receiver_type_in: [IResolveFieldContext, ResolveFieldContext]
  match_examples:
  - name: graphql resolve context argument
    code: |
      using GraphQL;
      class App {
        string Resolve(IResolveFieldContext context) {
          return context.GetArgument<string>("q");
        }
      }
  - name: non graphql argument helper negative
    code: |
      using GraphQL;
      class App {
        string Resolve(Helper context) {
          return context.GetArgument("q");
        }
      }
      class Helper { public string GetArgument(string name) => name; }
    expect_no_match: true
  description: "GraphQL.NET IResolveFieldContext.GetArgument(name) - resolver argument supplied by the GraphQL caller. Receiver type is required so generic helper GetArgument methods stay clean."
