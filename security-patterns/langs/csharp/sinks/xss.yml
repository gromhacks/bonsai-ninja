# C# XSS sinks. ASP.NET MVC / Core / Razor / WebForms.
- id: csharp.xss.response_write
  aliases:
  - csharp.info_disclosure.response_write_exception
  enabled: true
  language: csharp
  tag: xss
  severity: high
  cwe: [CWE-79, CWE-209]
  match:
    kind: call
    callee:
      attribute: [Response, Write]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      class App { void Test(string input) { Response.Write(input); } }
  - name: literal html negative
    code: |
      class App { void Test() { Response.Write("<p>safe</p>"); } }
    expect_no_match: true
  description: "Response.Write - tainted data escapes HTML encoding. Also covers merged aliases: csharp.info_disclosure.response_write_exception."

