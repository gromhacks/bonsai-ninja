- id: csharp.xss.raw_html_return
  enabled: true
  language: csharp
  tag: xss
  severity: high
  cwe: [CWE-79]
  match:
    kind: return
    target:
      regex: '(?is)<\s*(?:!doctype|html|body|script|div|span|p|a|img|svg|iframe|h[1-6]|ul|ol|li|table|form|input|textarea|button|br|hr)\b'
  analysis_semantics:
    character_escape:
      required_mappings:
      - {input: "&", output: "&amp;"}
      - {input: "<", output: "&lt;"}
      - {input: ">", output: "&gt;"}
      - {input: '"', output: "&quot;"}
      - {input: "'", output: "&#39;"}
  match_examples:
  - name: interpolated HTML return
    code: |
      class Page {
        string Render(string value) {
          return $"<html><body>{value}</body></html>";
        }
      }
    expect_match_text: ['$"<html><body>{value}</body></html>"']
  - name: plain text interpolation is not an HTML sink
    code: |
      class Page {
        string Render(string value) {
          return $"result: {value}";
        }
      }
    expect_no_match: true
  - name: literal HTML return is not tainted
    code: |
      class Page {
        string Render() {
          return "<html><body>safe</body></html>";
        }
      }
    expect_no_match: true
  description: "Direct return of raw HTML markup; taint reachability is required for attacker-controlled content in the returned expression."
