- id: csharp.xss.aspnet_innerhtml
  enabled: true
  language: csharp
  tag: xss
  severity: high
  cwe: [CWE-79]
  match:
    kind: write
    target:
      regex: ^(?:[A-Za-z_$][A-Za-z0-9_$]*\.)+InnerHtml$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: aspnet inner html property
    code: |
      class App { void Test(string input) { control.InnerHtml = input; } }
  - name: local innerhtml variable negative
    code: |
      class App { void Test(string input) { var InnerHtml = input; } }
    expect_no_match: true
  description: "Control.InnerHtml = tainted (WebForms / HtmlGenericControl)."

