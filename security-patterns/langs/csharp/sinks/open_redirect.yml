# C# open-redirect sinks.
- id: csharp.open_redirect.controller_redirect
  enabled: true
  language: csharp
  tag: open-redirect
  severity: high
  packages: [Microsoft.AspNetCore.Mvc]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      attribute: [Microsoft, AspNetCore, Mvc, Redirect]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using Microsoft.AspNetCore.Mvc;
      class App { void Test(string input) { Microsoft.AspNetCore.Mvc.Redirect(input); } }
  - name: literal local redirect negative
    code: |
      using Microsoft.AspNetCore.Mvc;
      class App { void Test() { Microsoft.AspNetCore.Mvc.Redirect("/home"); } }
    expect_no_match: true
  description: "Controller.Redirect(tainted url) — scoped to MVC namespace to avoid colliding with other Redirect helpers."

