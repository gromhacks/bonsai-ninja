# C# open-redirect sinks.
- id: csharp.open_redirect.controller_redirect
  enabled: true
  language: csharp
  tag: open-redirect
  severity: high
  packages: [Microsoft.AspNetCore.Mvc]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      name: Redirect
  constraints:
  - receiver_type_in: [Controller, ControllerBase, Microsoft.AspNetCore.Mvc.Controller, Microsoft.AspNetCore.Mvc.ControllerBase]
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using Microsoft.AspNetCore.Mvc;
      class App : Controller { IActionResult Test(string input) { return Redirect(input); } }
  - name: literal local redirect negative
    code: |
      using Microsoft.AspNetCore.Mvc;
      class App : Controller { IActionResult Test() { return Redirect("/home"); } }
    expect_no_match: true
  description: "Controller.Redirect(tainted url) requires compiler-proven MVC controller receiver or ancestry; unrelated Redirect helpers remain outside the model."

- id: csharp.open_redirect.controller_redirectpermanent
  enabled: true
  language: csharp
  tag: open-redirect
  severity: high
  packages: [Microsoft.AspNetCore.Mvc]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      name: RedirectPermanent
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using Microsoft.AspNetCore.Mvc;
      class App { void Test(string input) { Microsoft.AspNetCore.Mvc.RedirectPermanent(input); } }
  - name: literal local redirect negative
    code: |
      using Microsoft.AspNetCore.Mvc;
      class App { void Test() { Microsoft.AspNetCore.Mvc.RedirectPermanent("/home"); } }
    expect_no_match: true
  description: "Controller.RedirectPermanent - scoped to MVC. Same literal-constant filter as controller_redirect."

