# C# LLM sinks (OpenAI, Anthropic, Bedrock, Semantic Kernel).
- id: csharp.llm.openai_chatclient_completechat
  enabled: true
  language: csharp
  tag: web-llm
  severity: medium
  packages: [OpenAI]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      attribute: [ChatClient, CompleteChat]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using OpenAI;
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; ChatClient.CompleteChat(input); } }
    expect_match_text: [ChatClient.CompleteChat]
  - name: literal chat prompt negative
    code: |
      using OpenAI;
      class App { void Test() { ChatClient.CompleteChat("hello"); } }
    expect_no_match: true
  description: "OpenAI .NET ChatClient.CompleteChat - tainted prompt content reaches an LLM instruction and tool surface."

