- id: csharp.access.aws_s3_get_object
  enabled: true
  language: csharp
  tag: access-control
  severity: high
  packages: [AWSSDK.S3]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      attribute: [AmazonS3Client, GetObjectAsync]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using AWSSDK.S3;
      class App { void Test(dynamic input) { dynamic target = input; dynamic amount = 1; AmazonS3Client.GetObjectAsync(input); } }
  - name: literal s3 request negative
    code: |
      using AWSSDK.S3;
      class App { void Test() { AmazonS3Client.GetObjectAsync("reports"); } }
    expect_no_match: true
  description: "AmazonS3Client.GetObjectAsync(bucket/key) - tainted selector can read arbitrary object data."

- id: csharp.access.aws_s3_get_object_key
