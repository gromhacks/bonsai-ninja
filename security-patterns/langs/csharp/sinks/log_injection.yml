# csharp log_injection sinks.

# Log-injection sinks. Newline / control-char / format-string
# slipping into log calls fed attacker text.
- id: csharp.log_injection.logger_loginformation_concat
  enabled: true
  language: csharp
  tag: log-injection
  severity: medium
  cwe: [CWE-117]
  match:
    kind: call
    callee:
      attribute: [_logger, LogInformation]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; _logger.LogInformation($"{input}"); } }
    - name: literal log information negative
      code: |
        class App { void Test() { _logger.LogInformation("safe"); } }
      expect_no_match: true
  description: '_logger.LogInformation($"...{tainted}...") - CRLF in attacker text forges log entries.'

