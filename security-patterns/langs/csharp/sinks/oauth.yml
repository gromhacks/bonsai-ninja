# csharp oauth sinks.

# OAuth misconfig sinks. State-CSRF disabled, PKCE missing,
# id_token verify off, redirect_uri substring match.
- id: csharp.oauth.aspnet_signin_no_state
  enabled: true
  language: csharp
  tag: oauth
  severity: high
  packages: [Microsoft.AspNetCore.Authentication.OpenIdConnect]
  cwe: [CWE-352]
  match:
    kind: call
    callee:
      attribute: [OpenIdConnectOptions, RequireHttpsMetadata]
  match_examples:
  - name: declared shape
    code: |
      using Microsoft.AspNetCore.Authentication.OpenIdConnect;
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; OpenIdConnectOptions.RequireHttpsMetadata(false); } }
  description: "OpenIdConnectOptions.RequireHttpsMetadata = false - allows the metadata endpoint over plain HTTP, MitM-attackable."
