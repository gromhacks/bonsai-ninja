# csharp oauth sinks.

# OAuth misconfig sinks. State-CSRF disabled, PKCE missing,
# id_token verify off, redirect_uri substring match.
- id: csharp.oauth.aspnet_signin_no_state
  enabled: true
  language: csharp
  tag: oauth
  severity: high
  packages: [Microsoft.AspNetCore.Authentication.OpenIdConnect]
  cwe: [CWE-352]
  match:
    kind: call
    callee:
      attribute: [OpenIdConnectOptions, RequireHttpsMetadata]
  constraints:
  - arg_equals:
      index: 0
      value: "false"
  match_examples:
  - name: declared shape
    code: |
      using Microsoft.AspNetCore.Authentication.OpenIdConnect;
      class App { void Test() { OpenIdConnectOptions.RequireHttpsMetadata(false); } }
    expect_match_text: [OpenIdConnectOptions.RequireHttpsMetadata]
  - name: require https metadata enabled negative
    code: |
      using Microsoft.AspNetCore.Authentication.OpenIdConnect;
      class App { void Test() { OpenIdConnectOptions.RequireHttpsMetadata(true); } }
    expect_no_match: true
  description: "OpenIdConnectOptions.RequireHttpsMetadata = false - allows the metadata endpoint over plain HTTP, MitM-attackable. The arg_equals constraint flags only the explicit `false` setting; the secure default (`true`) stays quiet."
