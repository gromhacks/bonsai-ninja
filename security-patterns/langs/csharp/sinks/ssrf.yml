- id: csharp.ssrf.httpclient_getasync
  enabled: true
  language: csharp
  tag: ssrf
  severity: high
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute:
      - HttpClient
      - GetAsync
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: 'class App { void Test(string input) { HttpClient.GetAsync(input); } }

      '
  - name: literal url negative
    code: 'class App { void Test() { HttpClient.GetAsync("https://example.com/status"); } }

      '
    expect_no_match: true
  description: HttpClient.GetAsync(tainted URL).
