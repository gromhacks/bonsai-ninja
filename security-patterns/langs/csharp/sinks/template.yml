# C# template-injection / SSTI. Razor / Liquid / Scriban / Handlebars.NET.
- id: csharp.template.razor_engine_compile
  enabled: true
  language: csharp
  tag: ssti
  severity: critical
  packages: [RazorEngine]
  cwe: [CWE-94, CWE-1336]
  match:
    kind: call
    callee:
      attribute: [Engine, RunCompile]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using RazorEngine;
      class App { void Test(string input) { Engine.RunCompile(input); } }
  - name: literal template negative
    code: |
      using RazorEngine;
      class App { void Test() { Engine.RunCompile("Hello @Model.Name"); } }
    expect_no_match: true
  description: "RazorEngine Engine.RunCompile(tainted) — full SSTI to RCE."

