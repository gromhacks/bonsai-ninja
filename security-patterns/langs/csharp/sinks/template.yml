# Templating engine autoescape disabled (T302). Config-shape
# sinks: when the developer explicitly turns off the engine's
# default HTML autoescape, every subsequent render is XSS-prone.
- id: csharp.template.razor_writeliteral
  enabled: true
  language: csharp
  tag: xss
  severity: high
  packages: [Microsoft.AspNetCore.Mvc.Razor]
  cwe: [CWE-79]
  match:
    kind: call
    callee:
      attribute: [Razor, WriteLiteral]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using Microsoft.AspNetCore.Mvc.Razor;
      class App { void Test(string input) { Razor.WriteLiteral(input); } }
  - name: literal html negative
    code: |
      using Microsoft.AspNetCore.Mvc.Razor;
      class App { void Test() { Razor.WriteLiteral("<p>safe</p>"); } }
    expect_no_match: true
  description: "Razor WriteLiteral(tainted) — bypasses HTML encoding; XSS for tainted input."
