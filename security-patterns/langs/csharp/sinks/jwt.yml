# C# JWT sinks. System.IdentityModel + JWT.NET.
- id: csharp.jwt.tokenhandler_validate
  aliases:
  - csharp.jwt.alg_confusion
  enabled: true
  language: csharp
  tag: jwt
  severity: high
  packages: [System.IdentityModel.Tokens.Jwt]
  cwe: [CWE-347, CWE-345]
  match:
    kind: call
    callee:
      attribute: [JwtSecurityTokenHandler, ValidateToken]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using System.IdentityModel.Tokens.Jwt;
      class App { void Test(dynamic input) { dynamic target = input; dynamic amount = 1; JwtSecurityTokenHandler.ValidateToken(input); } }
  - name: literal validate token negative
    code: |
      using System.IdentityModel.Tokens.Jwt;
      class App { void Test() { JwtSecurityTokenHandler.ValidateToken("eyJhbGciOiJIUzI1NiJ9.safe.sig"); } }
    expect_no_match: true
  description: "JwtSecurityTokenHandler.ValidateToken - verify signing key is set. Also covers merged aliases: csharp.jwt.alg_confusion."

