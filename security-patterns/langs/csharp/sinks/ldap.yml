# C# LDAP-injection sinks. System.DirectoryServices.
- id: csharp.ldap.directorysearcher_ctor
  enabled: true
  language: csharp
  tag: ldap-injection
  severity: high
  cwe: [CWE-90]
  match:
    kind: new
    callee:
      name: DirectorySearcher
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: tainted filter constructor
    code: |
      class DirectorySearcher { public DirectorySearcher(dynamic input) { } } class App { void Test(string input) { var result = new DirectorySearcher(input); } }
  - name: literal filter constructor negative
    code: |
      class DirectorySearcher { public DirectorySearcher(dynamic input) { } } class App { void Test() { var result = new DirectorySearcher("(cn=safe)"); } }
    expect_no_match: true
  description: "new DirectorySearcher(tainted_filter) — LDAP filter injection."

- id: csharp.ldap.directorysearcher_filter_assign
  enabled: true
  language: csharp
  tag: ldap-injection
  severity: high
  cwe: [CWE-90]
  match:
    kind: write
    target:
      regex: ^(?:[A-Za-z_$][A-Za-z0-9_$]*\.)+Filter$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: directory searcher filter property
    code: |
      class App { void Test(string input) { DirectorySearcher.Filter = input; } }
  - name: local filter variable negative
    code: |
      class App { void Test(string input) { var Filter = input; } }
    expect_no_match: true
  description: "DirectorySearcher.Filter = tainted."

- id: csharp.ldap.directorysearcher_findall
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: csharp
  tag: ldap-injection
  severity: high
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      attribute: [DirectorySearcher, FindAll]
  match_examples:
  - name: declared shape
    code: |
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; DirectorySearcher.FindAll("(cn=input)"); } }
  description: "Disabled — DirectorySearcher.FindAll() executes the receiver Filter state; use constructor/Filter assignment sinks until receiver-state tracking exists."

