- id: csharp.ldap.s_ds_p_search_request
  enabled: true
  language: csharp
  tag: ldap-injection
  severity: high
  packages: [System.DirectoryServices.Protocols]
  cwe: [CWE-90]
  match:
    kind: new
    callee:
      name: SearchRequest
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: declared shape
    code: |
      using System.DirectoryServices.Protocols;
      class SearchRequest { public SearchRequest(string dn, string filter) { } } class App { void Test(string input) { var result = new SearchRequest("dc=example,dc=com", input); } }
  - name: literal filter negative
    code: |
      using System.DirectoryServices.Protocols;
      class SearchRequest { public SearchRequest(string dn, string filter) { } } class App { void Test() { var result = new SearchRequest("dc=example,dc=com", "(cn=safe)"); } }
    expect_no_match: true
  description: "new SearchRequest(distinguishedName, filter, ...) — tainted filter."

- id: csharp.ldap.novell_search
  enabled: true
  language: csharp
  tag: ldap-injection
  severity: high
  packages: [Novell.Directory.Ldap]
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      attribute: [LdapConnection, Search]
  constraints:
  - arg_tainted:
      index: 2
  match_examples:
  - name: declared shape
    code: |
      using Novell.Directory.Ldap;
      class App { void Test(string input) { LdapConnection.Search("ou=users", 2, input); } }
  - name: literal filter negative
    code: |
      using Novell.Directory.Ldap;
      class App { void Test() { LdapConnection.Search("ou=users", 2, "(cn=safe)"); } }
    expect_no_match: true
  description: "Novell LdapConnection.Search."
