# C# path-traversal sinks. System.IO + ASP.NET PhysicalFile.
- id: csharp.path.file_open
  enabled: true
  language: csharp
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      attribute: [File, Open]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      class App { void Test(string input) { File.Open(input); } }
  - name: literal path negative
    code: |
      class App { void Test() { File.Open("data/safe.txt"); } }
    expect_no_match: true
  description: "File.Open with tainted path."

