# csharp CORS misconfiguration sinks (T403).
- id: csharp.cors.addcors_allowanyorigin
  enabled: true
  language: csharp
  tag: cors
  category: source-independent
  severity: medium
  packages: [Microsoft.AspNetCore.Cors]
  cwe: [CWE-942]
  match:
    kind: call
    callee:
      name: AllowAnyOrigin
  match_examples:
  - name: declared shape
    code: |
      using Microsoft.AspNetCore.Cors;
      class App { void Test() { AllowAnyOrigin(); } }
    expect_match_text: [AllowAnyOrigin]
  - name: explicit origin policy negative
    code: |
      using Microsoft.AspNetCore.Cors;
      class App { void Test() { WithOrigins("https://trusted.example.com"); } }
    expect_no_match: true
  description: |-
    ASP.NET Core CORS policy.AllowAnyOrigin() - wildcard allow-all. Config-shape sink: the call itself is the misconfiguration. A scoped WithOrigins(...) policy stays quiet.
