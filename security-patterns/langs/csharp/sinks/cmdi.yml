- id: csharp.cmdi.process_start
  enabled: true
  language: csharp
  tag: command-injection
  severity: critical
  category: process-exec
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      attribute:
      - Process
      - Start
  constraints:
  - arg_not_matches_regex:
      index: 0
      regex: ^"(/bin/)?(sh|bash|cmd(\.exe)?|powershell(\.exe)?|pwsh(\.exe)?)"$
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: 'class App { void Test(string input) { Process.Start(input); } }

      '
  - name: literal process start negative
    code: 'class App { void Test() { Process.Start("calc.exe"); } }

      '
    expect_no_match: true
  description: "System.Diagnostics.Process.Start - flag if FileName/Arguments tainted."
- id: csharp.cmdi.process_start_shell_wrapper
  enabled: true
  language: csharp
  tag: command-injection
  severity: critical
  category: process-exec
  cwe:
  - CWE-78
  match:
    kind: call
    callee:
      attribute:
      - Process
      - Start
  constraints:
  - arg_matches_regex:
      index: 0
      regex: ^"(/bin/)?(sh|bash|cmd(\.exe)?|powershell(\.exe)?|pwsh(\.exe)?)"$
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted shell command argument
    code: 'class App { void Test(string input) { Process.Start("sh", "-c " + input); } }

      '
    expect_match_text:
    - Process.Start
  - name: literal shell command argument negative
    code: 'class App { void Test() { Process.Start("sh", "-c whoami"); } }

      '
    expect_no_match: true
  description: "Process.Start(shell, tainted arguments) - shell command string is interpreted by the selected shell."
- id: csharp.cmdi.process_start_info_args
  enabled: true
  language: csharp
  tag: command-injection
  severity: high
  category: process-exec
  cwe:
  - CWE-78
  match:
    kind: write
    target:
      regex: ^(?:[A-Za-z_$][A-Za-z0-9_$]*\.)+Arguments$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: process start info arguments property
    code: 'class App { void Test(string input) { var psi = new ProcessStartInfo(); psi.Arguments = input; } }

      '
  - name: local arguments variable negative
    code: 'class App { void Test(string input) { var Arguments = input; } }

      '
    expect_no_match: true
  description: "ProcessStartInfo.Arguments = tainted - argv passed verbatim."
