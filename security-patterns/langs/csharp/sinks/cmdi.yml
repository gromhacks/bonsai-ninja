    kind: call
    callee:
      attribute:
      - ManagementObject
      - InvokeMethod
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using System.Management;
      class App { void Test(dynamic input) { dynamic target = input; dynamic amount = 1; ManagementObject.InvokeMethod(input); } }
  - name: literal wmi method negative
    code: |
      using System.Management;
      class App { void Test() { ManagementObject.InvokeMethod("Create"); } }
    expect_no_match: true
  description: "ManagementObject.InvokeMethod (WMI Create) - used to spawn processes via Win32_Process; tainted command-line argument is RCE."
