    kind: write
    target:
      name: UseShellExecute
  match_examples:
  - name: declared shape
    code: 'class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; UseShellExecute = input; } }

      '
  description: "Disabled - UseShellExecute is only dangerous with receiver FileName/Arguments state; enable when receiver-state constraints can join those writes."
