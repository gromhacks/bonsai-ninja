- id: csharp.queue.aws_sqs_send_message
  enabled: true
  language: csharp
  tag: queue-injection
  severity: high
  packages: [AWSSDK.SQS]
  cwe: [CWE-20]
  match:
    kind: call
    callee:
      attribute: [AmazonSQSClient, SendMessageAsync]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using AWSSDK.SQS;
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; AmazonSQSClient.SendMessageAsync(input); } }
  - name: literal sqs request negative
    code: |
      using AWSSDK.SQS;
      class App { void Test() { AmazonSQSClient.SendMessageAsync("queue-url"); } }
    expect_no_match: true
  description: "AmazonSQSClient.SendMessageAsync - tainted queue target/body injects arbitrary SQS messages."

- id: csharp.queue.aws_sqs_send_message_body
  enabled: true
  language: csharp
  tag: queue-injection
  severity: high
  packages: [AWSSDK.SQS]
  cwe: [CWE-20]
  match:
    kind: call
    callee:
      attribute: [AmazonSQSClient, SendMessageAsync]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted sqs message body
    code: |
      using AWSSDK.SQS;
      class App { void Test(string input) { AmazonSQSClient.SendMessageAsync("queue-url", input); } }
  - name: literal sqs message body negative
    code: |
      using AWSSDK.SQS;
      class App { void Test() { AmazonSQSClient.SendMessageAsync("queue-url", "safe"); } }
    expect_no_match: true
  description: "AmazonSQSClient.SendMessageAsync(queueUrl, taintedBody) - tainted body injects arbitrary SQS messages."

