# C# weak / broken cryptography.
- id: csharp.crypto.md5_create
  enabled: true
  language: csharp
  tag: weak-crypto
  severity: low
  cwe: [CWE-327, CWE-328]
  match:
    kind: call
    callee:
      attribute: [MD5, Create]
  match_examples:
  - name: declared shape
    code: |
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; MD5.Create(input); } }
  description: "MD5.Create — broken hash."

- id: csharp.crypto.md5_new
  enabled: true
  language: csharp
  tag: weak-crypto
  severity: low
  cwe: [CWE-327]
  match:
    kind: new
    callee:
      name: MD5CryptoServiceProvider
  match_examples:
  - name: declared shape
    code: |
      class MD5CryptoServiceProvider { public MD5CryptoServiceProvider(dynamic input) { } } class App { void Test() { dynamic input = "x"; var result = new MD5CryptoServiceProvider(input); } }
  description: "new MD5CryptoServiceProvider."

