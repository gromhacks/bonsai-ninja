- id: csharp.crypto.rsa_pkcs1_key_exchange_formatter
  enabled: true
  language: csharp
  tag: weak-crypto
  severity: medium
  cwe: [CWE-780]
  match:
    kind: call
    callee:
      attribute: [RSAPKCS1KeyExchangeFormatter, CreateKeyExchange]
  match_examples:
  - name: rsa pkcs1 exchange formatter
    code: |
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; RSAPKCS1KeyExchangeFormatter.CreateKeyExchange(input); } }
    expect_match_text: [RSAPKCS1KeyExchangeFormatter.CreateKeyExchange]
  description: "RSAPKCS1KeyExchangeFormatter.CreateKeyExchange — PKCS#1 v1.5 RSA encryption padding; use OAEP."
