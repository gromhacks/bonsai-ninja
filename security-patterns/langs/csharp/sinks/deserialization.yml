- id: csharp.deser.jsonconvert_type_name_handling
  enabled: true
  language: csharp
  tag: insecure-deserialization
  category: source-independent
  severity: critical
  packages: [Newtonsoft.Json]
  cwe: [CWE-502]
  match:
    kind: write
    target:
      regex: '^[A-Za-z_][A-Za-z0-9_]*\.TypeNameHandling$'
      receiver_type_in: [JsonSerializerSettings, Newtonsoft.Json.JsonSerializerSettings]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^(?:TypeNameHandling\.)?(?:Auto|All|Arrays|Objects)$'
  match_examples:
  - name: typed serializer settings enable runtime type names
    code: |
      using Newtonsoft.Json;
      class App {
        void Configure(JsonSerializerSettings settings) {
          settings.TypeNameHandling = TypeNameHandling.Auto;
        }
      }
    expect_match_text: [settings.TypeNameHandling]
  - name: typed serializer settings disable runtime type names
    code: |
      using Newtonsoft.Json;
      class App {
        void Configure(JsonSerializerSettings settings) {
          settings.TypeNameHandling = TypeNameHandling.None;
        }
      }
    expect_no_match: true
  - name: unrelated settings collision
    code: |
      using Newtonsoft.Json;
      class LocalSettings { public TypeNameHandling TypeNameHandling { get; set; } }
      class App {
        void Configure(LocalSettings settings) {
          settings.TypeNameHandling = TypeNameHandling.Auto;
        }
      }
    expect_no_match: true
  - name: local serializer settings type collision
    code: |
      using Newtonsoft.Json;
      class JsonSerializerSettings { public TypeNameHandling TypeNameHandling { get; set; } }
      class App {
        void Configure(JsonSerializerSettings settings) {
          settings.TypeNameHandling = TypeNameHandling.Auto;
        }
      }
    expect_no_match: true
  description: "JsonSerializerSettings.TypeNameHandling != None - gadget-chain RCE."

