# Inline-new shape: `new BinaryFormatter().Deserialize(stream)`. The
# attribute rule above keys on `[BinaryFormatter, Deserialize]` which
# requires receiver-name `BinaryFormatter`; the inline-new shape has
# no receiver name and is missed. Match the temp-receiver Deserialize
# call directly. Engine taint flow remains the second gate.
- id: csharp.deser.binaryformatter
  enabled: false
  disabled_reason:
    code: subsumed
  language: csharp
  tag: insecure-deserialization
  severity: critical
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [BinaryFormatter, Deserialize]
  match_examples:
  - name: declared shape
    code: |
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; BinaryFormatter.Deserialize(input); } }
  description: "Disabled — duplicate of csharp.deser.binaryformatter_deserialize with the current matcher shape."
