# C# deserialization sinks. BinaryFormatter, Json.NET TypeNameHandling,
# JavaScriptSerializer, NetDataContractSerializer, etc.
- id: csharp.deser.binaryformatter_deserialize
  enabled: true
  language: csharp
  tag: insecure-deserialization
  severity: critical
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [BinaryFormatter, Deserialize]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      class App { void Test(object input) { BinaryFormatter.Deserialize(input); } }
  - name: literal payload negative
    code: |
      class App { void Test() { BinaryFormatter.Deserialize("safe"); } }
    expect_no_match: true
  description: "BinaryFormatter.Deserialize — gadget-chain RCE; deprecated in .NET 5+."

- id: csharp.deser.binaryformatter_new
  enabled: true
  language: csharp
  tag: insecure-deserialization
  severity: critical
  cwe: [CWE-502]
  match:
    kind: new
    callee:
      name: BinaryFormatter
  match_examples:
  - name: binaryformatter constructor
    code: |
      class BinaryFormatter { public BinaryFormatter(dynamic input) { } } class App { void Test() { dynamic input = "x"; var result = new BinaryFormatter(input); } }
    expect_match_text: [BinaryFormatter]
  description: "new BinaryFormatter — dangerous formatter API even before the Deserialize call; do not process untrusted data with it."

