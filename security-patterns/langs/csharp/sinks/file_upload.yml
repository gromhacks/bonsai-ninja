# C# file-upload sinks. ASP.NET Core IFormFile + Web API HttpPostedFile.
- id: csharp.upload.iformfile_copyto
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: csharp
  tag: file-upload
  severity: high
  packages: [Microsoft.AspNetCore.Http]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [IFormFile, CopyTo]
  match_examples:
  - name: declared shape
    code: |
      using Microsoft.AspNetCore.Http;
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; IFormFile.CopyTo(input); } }
  description: "Disabled - IFormFile.CopyTo(stream) writes to a stream; unsafe filename/path state is established before this call."

