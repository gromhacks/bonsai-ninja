# C# file-upload sinks. ASP.NET Core IFormFile + Web API HttpPostedFile.
- id: csharp.upload.httppostedfile_saveas
  enabled: true
  language: csharp
  tag: file-upload
  severity: high
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [HttpPostedFile, SaveAs]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      class App { void Test(string input) { HttpPostedFile.SaveAs(input); } }
  - name: literal save path negative
    code: |
      class App { void Test() { HttpPostedFile.SaveAs("uploads/safe.txt"); } }
    expect_no_match: true
  description: "HttpPostedFile.SaveAs (legacy ASP.NET)."

