# C# eval / dynamic-code sinks. Roslyn + reflection.
- id: csharp.eval.csharpscript_evaluate
  enabled: true
  language: csharp
  tag: code-injection
  severity: critical
  packages: [Microsoft.CodeAnalysis.CSharp.Scripting]
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [CSharpScript, EvaluateAsync]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using Microsoft.CodeAnalysis.CSharp.Scripting;
      class App { void Test(string input) { CSharpScript.EvaluateAsync(input); } }
  - name: literal script negative
    code: |
      using Microsoft.CodeAnalysis.CSharp.Scripting;
      class App { void Test() { CSharpScript.EvaluateAsync("1 + 1"); } }
    expect_no_match: true
  description: "CSharpScript.EvaluateAsync — Roslyn dynamic compilation."

