      index: 0
  match_examples:
    - name: declared shape
      code: |
        class XmlTextReader { public XmlTextReader(dynamic input) { } } class App { void Test() { dynamic input = "x"; var result = new XmlTextReader(input); } }
    - name: literal xmltextreader negative
      code: |
        class XmlTextReader { public XmlTextReader(dynamic input) { } } class App { void Test() { var result = new XmlTextReader("safe.xml"); } }
