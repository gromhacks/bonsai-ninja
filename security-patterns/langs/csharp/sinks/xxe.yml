# C# XXE sinks. System.Xml.
- id: csharp.xxe.xmldocument_loadxml
  enabled: true
  language: csharp
  tag: xxe
  severity: high
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [XmlDocument, LoadXml]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      class App { void Test(dynamic input) { dynamic target = input; dynamic amount = 1; XmlDocument.LoadXml(input); } }
  - name: literal loadxml negative
    code: |
      class App { void Test() { XmlDocument.LoadXml("<root />"); } }
    expect_no_match: true
  description: "XmlDocument.LoadXml - set XmlResolver=null to disable entities."

- id: csharp.xxe.xmldocument_load
  enabled: true
  language: csharp
  tag: xxe
  severity: high
  imports: [System.Xml]
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [XmlDocument, Load]
  constraints:
  - receiver_type_in:
    - XmlDocument
    - System.Xml.XmlDocument
  - arg_tainted:
      index: 0
  analysis_semantics:
    configured_argument_factory_guard:
      sink_argument_index: 0
      factory:
        attribute: [XmlReader, Create]
      required_aggregate_argument:
        argument_index: 1
        required_fields:
        - path: [XmlResolver]
          value: {kind: null}
  match_examples:
  - name: imported XML document load
    code: |
      using System.Xml;
      class App {
        void Parse(XmlDocument document, XmlReader input) { document.Load(input); }
      }
    expect_match_text: [document.Load]
  - name: literal xmldocument load negative
    code: |
      using System.Xml;
      class App { void Test(XmlDocument document) { document.Load("safe.xml"); } }
    expect_no_match: true
  - name: local XML document collision
    code: |
      using System.Xml;
      class XmlDocument { public void Load(dynamic value) {} }
      class App { void Test(XmlDocument document, dynamic input) { document.Load(input); } }
    expect_no_match: true
  description: "XmlDocument.Load - file/stream loader."

