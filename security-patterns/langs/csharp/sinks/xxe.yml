- id: csharp.xxe.dtd_processing_parse
  enabled: true
  language: csharp
  tag: xxe
  category: source-independent
  severity: high
  cwe: [CWE-611]
  imports: [System.Xml]
  match:
    kind: write
    target:
      regex: ^[^\.\s]+\.DtdProcessing$
      receiver_type_in: [XmlReaderSettings, System.Xml.XmlReaderSettings]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^(?:DtdProcessing\.)?Parse$'
  match_examples:
  - name: typed XML reader settings parse DTDs
    code: |
      using System.Xml;
      class App { void Configure(XmlReaderSettings settings) { settings.DtdProcessing = DtdProcessing.Parse; } }
    expect_match_text: [settings.DtdProcessing]
  - name: typed XML reader settings prohibit DTDs
    code: |
      using System.Xml;
      class App { void Configure(XmlReaderSettings settings) { settings.DtdProcessing = DtdProcessing.Prohibit; } }
    expect_no_match: true
  - name: unrelated dtd processing member
    code: |
      using System.Xml;
      class LocalSettings { public DtdProcessing DtdProcessing { get; set; } }
      class App { void Configure(LocalSettings settings) { settings.DtdProcessing = DtdProcessing.Parse; } }
    expect_no_match: true
  - name: local XML reader settings collision
    code: |
      using System.Xml;
      class XmlReaderSettings { public DtdProcessing DtdProcessing { get; set; } }
      class App { void Configure(XmlReaderSettings settings) { settings.DtdProcessing = DtdProcessing.Parse; } }
    expect_no_match: true
  description: "XmlReaderSettings.DtdProcessing = Parse - explicitly re-enables DTD/XXE parsing on otherwise-safe XmlReader."

- id: csharp.xxe.prohibitdtd_false
  enabled: true
  language: csharp
  tag: xxe
  category: source-independent
  severity: high
  cwe: [CWE-611]
  imports: [System.Xml]
  match:
    kind: write
    target:
      regex: ^[^\.\s]+\.ProhibitDtd$
      receiver_type_in: [XmlReaderSettings, System.Xml.XmlReaderSettings]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^false$'
  match_examples:
  - name: typed XML reader settings permit DTDs
    code: |
      using System.Xml;
      class App { void Configure(XmlReaderSettings settings) { settings.ProhibitDtd = false; } }
    expect_match_text: [settings.ProhibitDtd]
  - name: typed XML reader settings prohibit DTDs
    code: |
      using System.Xml;
      class App { void Configure(XmlReaderSettings settings) { settings.ProhibitDtd = true; } }
    expect_no_match: true
  - name: unrelated prohibit DTD member
    code: |
      using System.Xml;
      class LocalSettings { public bool ProhibitDtd { get; set; } }
      class App { void Configure(LocalSettings settings) { settings.ProhibitDtd = false; } }
    expect_no_match: true
  - name: local XML reader settings collision
    code: |
      using System.Xml;
      class XmlReaderSettings { public bool ProhibitDtd { get; set; } }
      class App { void Configure(XmlReaderSettings settings) { settings.ProhibitDtd = false; } }
    expect_no_match: true
  description: "XmlReaderSettings.ProhibitDtd = false (legacy .NET) - re-enables DTD parsing."
