# C# XXE sinks. System.Xml.
- id: csharp.xxe.xmldocument_loadxml
  enabled: true
  language: csharp
  tag: xxe
  severity: high
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      attribute: [XmlDocument, LoadXml]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; XmlDocument.LoadXml(input); } }
    - name: literal loadxml negative
      code: |
        class App { void Test() { XmlDocument.LoadXml("<root />"); } }
      expect_no_match: true
  description: "XmlDocument.LoadXml - set XmlResolver=null to disable entities."

