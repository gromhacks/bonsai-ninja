# C# NoSQL injection. MongoDB / RavenDB / Cosmos / Redis.
- id: csharp.nosql.mongo_find
  enabled: true
  language: csharp
  tag: nosql-injection
  severity: high
  packages: [MongoDB.Driver]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      attribute: [IMongoCollection, Find]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      using MongoDB.Driver;
      class App { void Test(dynamic input) { dynamic target = input; dynamic amount = 1; IMongoCollection.Find(input); } }
  - name: literal mongo find filter negative
    code: |
      using MongoDB.Driver;
      class App { void Test() { IMongoCollection.Find("{ status: 'active' }"); } }
    expect_no_match: true
  description: "MongoDB IMongoCollection.Find with tainted filter."

