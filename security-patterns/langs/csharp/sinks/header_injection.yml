# C# response header / CRLF injection.
- id: csharp.header.response_headers_add
  aliases:
    - csharp.smuggle.headers_add_dual_cl_te
  enabled: true
  language: csharp
  tag: header-injection
  severity: high
  cwe: [CWE-113, CWE-444]
  match:
    kind: call
    callee:
      attribute: [Headers, Add]
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
    - name: tainted header value
      code: |
        class App { void Test(string input) { Headers.Add("X-Name", input); } }
    - name: literal header value negative
      code: |
        class App { void Test() { Headers.Add("X-Name", "safe"); } }
      expect_no_match: true
  description: "Response.Headers.Add(name, tainted_value) - flag tainted header value (CRLF). Also covers merged aliases: csharp.smuggle.headers_add_dual_cl_te."

