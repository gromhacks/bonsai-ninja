- id: csharp.typing.lifecycle_disposed_receiver
  enabled: true
  language: csharp
  match:
    kind: call
    callee:
      regex: '(?:^|\.)(?:Dispose|DisposeAsync)$'
  lifecycle_transition:
    state: freed
    binding: { kind: receiver }
  match_examples:
  - name: Dispose changes the receiver state
    code: 'class C { void F(System.IO.Stream s) { s.Dispose(); } }'
    expect_match_text: [s.Dispose]
  description: "IDisposable disposal moves the receiver to freed. Typing-only; never a finding."

