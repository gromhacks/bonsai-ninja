# False-positive audit fill: validators and parameter binding shapes.
- id: csharp.sanitizer.same_origin_path_startswith_slash
  enabled: true
  language: csharp
  tag: same-origin-path
  match:
    kind: call
    callee:
      name: StartsWith
  constraints:
  - arg_equals:
      index: 0
      value: '"/"'
  - same_receiver_call_count_at_least: 2
  match_examples:
  - name: paired same-origin path guard
    code: |
      class App { bool Allow(string next) { return next.StartsWith("/") && !next.StartsWith("//"); } }
    expect_match_text: [next.StartsWith]
  - name: paired same-origin path guard negative constraint boundary
    code: "class App { bool Allow(string next) { return next.StartsWith() && !next.StartsWith(\"//\"); } }\n"
    expect_no_match: true
  description: "Same-origin redirect path guard paired with a second StartsWith call on the same receiver for the `!path.StartsWith(\"\
    //\")` scheme-relative rejection shape."

- id: csharp.sanitizer.enum_tryparse_allowlist
  enabled: true
  language: csharp
  tag: allowlist-validate
  match:
    kind: call
    callee:
      attribute: [Enum, TryParse]
  constraints:
  - min_args: 2
  match_examples:
  - name: enum tryparse allowlist
    code: |
      enum AllowedRole { User, Admin }
      class App { bool Allow(string role) { AllowedRole parsed; return Enum.TryParse(role, out parsed); } }
    expect_match_text: [Enum.TryParse]
  description: "Enum.TryParse rejects values outside the enum domain before downstream use."

- id: csharp.sanitizer.regex_ismatch_safe_shape
  enabled: true
  language: csharp
  tag: regex-validate
  match:
    kind: call
    callee:
      attribute: [Regex, IsMatch]
  constraints:
  - arg_matches_regex:
      index: 1
      regex: '^["'']\^?(\[A-Za-z0-9_|\[A-Fa-f0-9)'
  - min_args: 2
  match_examples:
  - name: slug shape validator
    code: |
      class App { bool Allow(string slug) { return Regex.IsMatch(slug, "^[A-Za-z0-9_-]{1,64}$"); } }
    expect_match_text: [Regex.IsMatch]
  - name: slug shape validator negative constraint boundary
    code: "class App { bool Allow(string slug) { return Regex.IsMatch(); } }\n"
    expect_no_match: true
  description: "Regex.IsMatch with a bounded UUID/slug-style allowlist regex validates string shape."

- id: csharp.sanitizer.regex_replace_char_allowlist_strip
  enabled: true
  language: csharp
  tag: char-allowlist
  match:
    kind: call
    callee:
      attribute: [Regex, Replace]
  constraints:
  - arg_matches_regex:
      index: 1
      regex: '^["'']\[\^[-A-Za-z0-9_ /]+\]["'']$'
  - arg_matches_regex:
      index: 2
      regex: '^["'']["'']$'
  match_examples:
  - name: strip to safe slug chars
    code: |
      class App { string Clean(string input) { return Regex.Replace(input, "[^A-Za-z0-9_-]", ""); } }
    expect_match_text: [Regex.Replace]
  - name: strip to safe slug chars negative constraint boundary
    code: "class App { string Clean(string input) { return Regex.Replace(); } }\n"
    expect_no_match: true
  description: "Regex.Replace with a negated safe character class and empty replacement strips characters outside the allowlist."

