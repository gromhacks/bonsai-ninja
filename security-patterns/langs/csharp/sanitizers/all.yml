- id: csharp.sanitizer.dtd_processing_prohibit
  enabled: true
  language: csharp
  tag: xxe-sanitizer
  imports: [System.Xml]
  match:
    kind: write
    target:
      regex: ^[^\.\s]+\.DtdProcessing$
      receiver_type_in: [XmlReaderSettings, System.Xml.XmlReaderSettings]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^(?:DtdProcessing\.)?(?:Prohibit|Ignore)$'
  match_examples:
  - name: typed XML reader settings prohibit DTDs
    code: |
      using System.Xml;
      class App { void Configure(XmlReaderSettings settings) { settings.DtdProcessing = DtdProcessing.Prohibit; } }
    expect_match_text: [settings.DtdProcessing]
  - name: parse mode is not a sanitizer negative
    code: |
      using System.Xml;
      class App { void Configure(XmlReaderSettings settings) { settings.DtdProcessing = DtdProcessing.Parse; } }
    expect_no_match: true
  - name: unrelated member with the same terminal name negative
    code: |
      using System.Xml;
      class LocalSettings { public DtdProcessing DtdProcessing { get; set; } }
      class App { void Configure(LocalSettings settings) { settings.DtdProcessing = DtdProcessing.Prohibit; } }
    expect_no_match: true
  - name: local XML reader settings collision negative
    code: |
      using System.Xml;
      class XmlReaderSettings { public DtdProcessing DtdProcessing { get; set; } }
      class App { void Configure(XmlReaderSettings settings) { settings.DtdProcessing = DtdProcessing.Prohibit; } }
    expect_no_match: true
  description: "XmlReaderSettings.DtdProcessing = Prohibit/Ignore - blocks DTD/XXE."

