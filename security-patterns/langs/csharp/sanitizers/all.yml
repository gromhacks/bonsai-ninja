# False-positive audit fill: validators and parameter binding shapes.
- id: csharp.sanitizer.same_origin_path_startswith_slash
  enabled: true
  language: csharp
  tag: same-origin-path
  match:
    kind: call
    callee:
      name: StartsWith
  constraints:
  - arg_equals:
      index: 0
      value: '"/"'
  - same_receiver_call_count_at_least: 2
  match_examples:
  - name: paired same-origin path guard
    code: |
      class App { bool Allow(string next) { return next.StartsWith("/") && !next.StartsWith("//"); } }
    expect_match_text: [next.StartsWith]
  - name: paired same-origin path guard negative constraint boundary
    code: "class App { bool Allow(string next) { return next.StartsWith() && !next.StartsWith(\"//\"); } }\n"
    expect_no_match: true
  description: "Same-origin redirect path guard paired with a second StartsWith call on the same receiver for the `!path.StartsWith(\"\
    //\")` scheme-relative rejection shape."

- id: csharp.sanitizer.same_origin_path_reject_scheme_relative
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: csharp
  tag: same-origin-path
  match:
    kind: call
    callee:
      name: StartsWith
  constraints:
  - arg_equals:
      index: 0
      value: '"//"'
  match_examples:
  - name: reject scheme-relative redirect target
    code: |
      class App { bool Allow(string next) { return next.StartsWith("/") && !next.StartsWith("//"); } }
    expect_match_text: [next.StartsWith]
  - name: reject scheme-relative redirect target negative constraint boundary
    code: "class App { bool Allow(string next) { return next.StartsWith(\"/\") && !next.StartsWith(\"http://\"); } }\n"
    expect_no_match: true
  description: "Disabled — same-receiver StartsWith(\"/\") + StartsWith(\"//\") is modeled by csharp.sanitizer.same_origin_path_startswith_slash."

