# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: csharp.csrf.aspnet_antiforgery
  enabled: true
  language: csharp
  tag: csrf-protect
  match:
    kind: call
    callee:
      name: AddAntiforgery
  match_examples:
  - name: declared shape
    code: |
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; AddAntiforgery(input); } }
    expect_match_text: [AddAntiforgery]
  description: "ASP.NET Core services.AddAntiforgery() - registers anti-forgery token services."
- id: csharp.cookie.cookie_options_httponly_secure
  enabled: true
  language: csharp
  tag: cookie-secure
  match:
    kind: write
    target:
      regex: "(^|\\.)(HttpOnly|Secure)$"
  constraints:
  - any_arg_matches_regex: "^true$"
  match_examples:
  - name: declared shape
    code: |
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; CookieOptions.HttpOnly = true; } }
    expect_match_text: [CookieOptions.HttpOnly]
  - name: false cookie flag negative
    code: "class Example { void ExampleMethod() { CookieOptions.HttpOnly = false; } }\n"
    expect_no_match: true
  description: "ASP.NET CookieOptions HttpOnly/Secure true assignment. Each required hardening flag is recorded independently; audit cookie setup for both flags."

