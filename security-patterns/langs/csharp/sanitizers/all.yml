- id: csharp.sanitizer.parameter_add_value
  enabled: true
  language: csharp
  tag: sql-parameter
  match:
    kind: call
    callee:
      name: AddWithValue
  constraints:
  - min_args: 2
  match_examples:
  - name: declared shape
    code: |
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; AddWithValue("@id", input); } }
    expect_match_text: [AddWithValue]
  - name: bare add with value zero-arg negative
    code: "class App { void Test() { AddWithValue(); } }\n"
    expect_no_match: true
  description: "SqlCommand.Parameters.AddWithValue(name, value) - parameterised SQL. `min_args: 2` rejects 0/1-arg decoys that cannot be the bound name+value form."

