# C# sanitizers — taint stops here.
- id: csharp.sanitizer.htmlencoder_encode
  enabled: true
  language: csharp
  tag: html-encode
  match:
    kind: call
    callee:
      attribute: [HtmlEncoder, Encode]
  match_examples:
  - name: declared shape
    code: |
      class App { void Test() { dynamic input = "x"; dynamic target = input; dynamic amount = 1; HtmlEncoder.Encode(input); } }
    expect_match_text: [HtmlEncoder.Encode]
  description: "HtmlEncoder.Default.Encode."

