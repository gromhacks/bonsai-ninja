# C# sanitizers - taint stops here.
- id: csharp.sanitizer.htmlencoder_encode
  enabled: true
  language: csharp
  tag: html-encode
  imports: [System.Text.Encodings.Web]
  match:
    kind: call
    callee:
      attribute: [HtmlEncoder, Default, Encode]
      binding_origin: imported
  match_examples:
  - name: imported default HTML encoder
    code: |
      using System.Text.Encodings.Web;
      class App { string Render(string input) => HtmlEncoder.Default.Encode(input); }
    expect_match_text: [HtmlEncoder.Default.Encode]
  - name: local HtmlEncoder collision
    code: |
      using System.Text.Encodings.Web;
      class HtmlEncoder {
        public static HtmlEncoder Default { get; } = new HtmlEncoder();
        public string Encode(string input) => input;
      }
      class App { string Render(string input) => HtmlEncoder.Default.Encode(input); }
    expect_no_match: true
  description: "System.Text.Encodings.Web.HtmlEncoder.Default.Encode returns context-safe HTML text."

