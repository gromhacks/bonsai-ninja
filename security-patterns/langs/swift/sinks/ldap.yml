# Swift LDAP-injection (OpenLDAP via C bridge).
- id: swift.ldap.ldap_search_ext_s
  enabled: true
  language: swift
  tag: ldap-injection
  severity: high
  cwe: [CWE-90]
  match:
    kind: call
    callee:
      name: ldap_search_ext_s
  constraints:
  - arg_tainted:
      index: 3
  match_examples:
  - name: declared shape
    code: |
      func test(input: String) { ldap_search_ext_s(ld, "dc=example,dc=com", 0, input, nil, 0, nil, nil, nil, 0, nil) }
  - name: literal ldap search ext filter negative
    code: |
      func test(input: String) { ldap_search_ext_s(ld, input, 0, "(uid=safe)", nil, 0, nil, nil, nil, 0, nil) }
    expect_no_match: true
  description: "OpenLDAP ldap_search_ext_s — tainted filter."

