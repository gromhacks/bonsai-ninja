# Swift LLM sinks (OpenAI / Anthropic / Bedrock client wrappers).
- id: swift.llm.openai_chats_create
  enabled: true
  language: swift
  tag: web-llm
  severity: medium
  packages: [OpenAI]
  imports: [OpenAI]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.chats\.create$
      base_name_in:
      - chats
      - messages
      - client
      - completions
      - c
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: swift openai chats create
    code: |
      import OpenAI
      func test(input: String) { client.chats.create(input) }
    expect_match_text: [client.chats.create]
  - name: literal openai chat negative
    code: |
      import OpenAI
      func test() { client.chats.create("Summarize the release notes") }
    expect_no_match: true
  description: "OpenAI Swift client.chats.create - tainted prompt content reaches an LLM instruction / tool surface."

