- id: swift.llm.bedrock_invoke_model
  enabled: true
  language: swift
  tag: web-llm
  severity: medium
  packages: [AWSSDKSwift]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      name: invokeModel
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: swift bedrock invoke model
    code: |
      import AWSSDKSwift // AWSSDKSwift
      func test(input: String) { invokeModel(input) }
    expect_match_text: [invokeModel]
  - name: literal bedrock invoke model negative
    code: |
      import AWSSDKSwift // AWSSDKSwift
      func test() { invokeModel("Summarize the release notes") }
    expect_no_match: true
  description: "AWS Bedrock invokeModel - tainted request body steers the underlying foundation model."
