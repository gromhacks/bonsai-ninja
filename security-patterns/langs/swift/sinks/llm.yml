# Swift LLM sinks (OpenAI / Anthropic / Bedrock client wrappers).
- id: swift.llm.openai_chats
  enabled: true
  language: swift
  tag: web-llm
  severity: medium
  packages: [OpenAI]
  imports: [OpenAI]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.chats$
      receiver_type_in: [OpenAIProtocol]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: swift openai chats create
    code: |
      import OpenAI
      func test(client: OpenAIProtocol, input: ChatQuery) async throws { _ = try await client.chats(query: input) }
    expect_match_text: [client.chats]
  - name: literal openai chat negative
    code: |
      import OpenAI
      func test(client: OpenAIProtocol) async throws {
        _ = try await client.chats(query: "fixed prompt")
      }
    expect_no_match: true
  - name: local OpenAIProtocol is not the imported SDK
    code: |
      import OpenAI
      protocol OpenAIProtocol {}
      func test(client: OpenAIProtocol, input: ChatQuery) async throws { _ = try await client.chats(query: input) }
    expect_no_match: true
  description: "MacPaw OpenAI OpenAIProtocol.chats(query:) - a tainted ChatQuery reaches the chat-completions instruction surface."

- id: swift.llm.bedrock_invoke_model
  enabled: true
  language: swift
  tag: web-llm
  severity: medium
  packages: [AWSBedrockRuntime]
  imports: [AWSBedrockRuntime]
  cwe: [CWE-20, CWE-94, CWE-200]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.invokeModel$
      receiver_type_in: [BedrockRuntimeClient]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: swift bedrock invoke model
    code: |
      import AWSBedrockRuntime
      func test(client: BedrockRuntimeClient, input: InvokeModelInput) async throws { _ = try await client.invokeModel(input: input) }
    expect_match_text: [client.invokeModel]
  - name: literal bedrock invoke model negative
    code: |
      import AWSBedrockRuntime
      func test(client: BedrockRuntimeClient) async throws {
        _ = try await client.invokeModel(input: "fixed request")
      }
    expect_no_match: true
  - name: local BedrockRuntimeClient is not AWS Bedrock
    code: |
      import AWSBedrockRuntime
      struct BedrockRuntimeClient {}
      func test(client: BedrockRuntimeClient, input: InvokeModelInput) async throws { _ = try await client.invokeModel(input: input) }
    expect_no_match: true
  description: "AWS Bedrock invokeModel - tainted request body steers the underlying foundation model."
