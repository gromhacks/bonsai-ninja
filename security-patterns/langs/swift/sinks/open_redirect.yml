# Swift open-redirect.
- id: swift.open_redirect.vapor_redirect
  enabled: true
  language: swift
  tag: open-redirect
  severity: high
  packages: [Vapor]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      attribute: [Request, redirect]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: vapor request redirect
    code: |
      import Vapor
      func test(_ req: Request, _ input: String) { req.redirect(input) }
    expect_match_text: [req.redirect]
  - name: vapor request redirect literal negative
    code: |
      import Vapor
      func test(_ req: Request) { req.redirect("/home") }
    expect_no_match: true
  description: "Vapor Request.redirect(to: tainted)."

- id: swift.open_redirect.vapor_response_location
  enabled: true
  language: swift
  tag: open-redirect
  severity: high
  packages: [Vapor]
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      attribute: [Response, redirect]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import Vapor
      func test(_ input: String) { let amount = 1; Response.redirect(input) }
  - name: literal vapor redirect negative
    code: |
      import Vapor
      func test() { Response.redirect("/home") }
    expect_no_match: true
  description: "Vapor Response.redirect(to: tainted)."

- id: swift.open_redirect.uiapplication_openurl
  enabled: true
  language: swift
  tag: open-redirect
  severity: high
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      attribute: [UIApplication, shared, open]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(_ input: String) { let amount = 1; UIApplication.shared.open(input) }
  - name: literal uiapplication open negative
    code: |
      func test() { UIApplication.shared.open("https://safe.example") }
    expect_no_match: true
  description: "UIApplication.shared.open(tainted URL). Suffix-match — won't fire on bare `.open()` calls."

- id: swift.open_redirect.safariview_url
  enabled: true
  language: swift
  tag: open-redirect
  severity: medium
  cwe: [CWE-601]
  match:
    kind: call
    callee:
      name: SFSafariViewController
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(_ input: String) { let amount = 1; SFSafariViewController(input) }
  - name: literal safari view negative
    code: |
      func test() { SFSafariViewController("https://safe.example") }
    expect_no_match: true
  description: "SFSafariViewController(url: tainted) — init call form."
