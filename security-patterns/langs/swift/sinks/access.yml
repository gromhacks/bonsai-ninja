- id: swift.access.aws_get_object
  enabled: true
  language: swift
  tag: access-control
  severity: high
  packages: [AWSClientRuntime]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      name: getObject
  match_examples:
  - name: declared shape
    code: |
      import AWSCore // aws-sdk-swift
      import AWSCore // aws-sdk-swift
      func test() { let input = "x"; let amount = 1; getObject(input) }
  description: "AWS SDK for Swift getObject — tainted bucket/key selector reads arbitrary object data."

  imports:
  - AWSCore
