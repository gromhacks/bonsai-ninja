- id: swift.access.aws_get_object
  enabled: true
  language: swift
  tag: access-control
  severity: high
  packages: [AWSClientRuntime]
  cwe: [CWE-284, CWE-639]
  match:
    kind: call
    callee:
      name: getObject
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import AWSCore // aws-sdk-swift
      import AWSCore // aws-sdk-swift
      func test(input: String) { let amount = 1; getObject(input) }
  - name: literal aws get object negative
    code: |
      import AWSCore // aws-sdk-swift
      func test() { getObject("reports/fixed.csv") }
    expect_no_match: true
  description: "AWS SDK for Swift getObject - tainted bucket/key selector reads arbitrary object data."

  imports:
  - AWSCore
