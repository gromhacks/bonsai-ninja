# Swift weak-crypto sinks.
- id: swift.crypto.cc_md5
  enabled: true
  language: swift
  tag: weak-crypto
  category: source-independent
  severity: low
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      name: CC_MD5
  match_examples:
    - name: declared shape
      code: |
        func test() { let input = "x"; let amount = 1; CC_MD5(input) }
  description: "CC_MD5 - MD5 is broken."
