  description: "CommonCrypto CCCrypt - flag kCCAlgorithmDES / kCCAlgorithm3DES / kCCAlgorithmRC4 / kCCAlgorithmRC2 as weak."
- id: swift.crypto.arc4_random
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  tag: weak-randomness
  severity: low
  cwe: [CWE-330]
  match:
    kind: call
    callee:
      name: arc4random
  description: "Disabled - arc4random on Darwin is a CSPRNG; not a vuln."
- id: swift.crypto.int_random_security
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  tag: weak-randomness
  severity: low
  cwe: [CWE-330]
  match:
    kind: call
    callee:
      name: random
  description: "Disabled - bare `.random()` matches every Swift random; use context (security token/session-id) to enable."
- id: swift.crypto.non_constant_time_compare
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  tag: weak-crypto
  severity: medium
  cwe: [CWE-208]
  match:
    kind: call
    callee:
      name: isEqual
  description: "Disabled - bare `isEqual` MAC/hash compare matches every NSObject equality; enable with receiver narrowing to HashedAuthenticationCode / Data."
