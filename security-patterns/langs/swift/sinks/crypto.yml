- id: swift.crypto.cccrypt
  enabled: true
  language: swift
  tag: weak-crypto
  category: source-independent
  severity: medium
  packages: [CommonCrypto]
  imports: [CommonCrypto]
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      name: CCCrypt
      binding_origin: imported
  constraints:
  - any_arg_matches_regex: '^(kCCAlgorithmDES|kCCAlgorithm3DES|kCCAlgorithmRC4|kCCAlgorithmRC2|kCCOptionECBMode)$'
  match_examples:
    - name: CommonCrypto DES operation
      code: |
        import CommonCrypto
        func encrypt(_ key: UnsafeRawPointer, _ input: UnsafeRawPointer, _ output: UnsafeMutableRawPointer) {
          CCCrypt(kCCEncrypt, kCCAlgorithmDES, kCCOptionPKCS7Padding, key, 8, nil, input, 8, output, 8, nil)
        }
      expect_match_text: [CCCrypt]
    - name: CommonCrypto AES CBC operation is not weak by this rule
      code: |
        import CommonCrypto
        func encrypt(_ key: UnsafeRawPointer, _ iv: UnsafeRawPointer, _ input: UnsafeRawPointer, _ output: UnsafeMutableRawPointer) {
          CCCrypt(kCCEncrypt, kCCAlgorithmAES, kCCOptionPKCS7Padding, key, 32, iv, input, 16, output, 16, nil)
        }
      expect_no_match: true
    - name: local CCCrypt function is not CommonCrypto
      code: |
        import CommonCrypto
        func CCCrypt(_ operation: Int, _ algorithm: Int) {}
        func encrypt() { CCCrypt(kCCEncrypt, kCCAlgorithmDES) }
      expect_no_match: true
  description: "CommonCrypto CCCrypt - flag kCCAlgorithmDES / kCCAlgorithm3DES / kCCAlgorithmRC4 / kCCAlgorithmRC2 as weak."
