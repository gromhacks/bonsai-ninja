- id: swift.redos.nsregular_expression
  enabled: true
  language: swift
  tag: redos
  severity: medium
  packages: [Foundation]
  cwe: [CWE-1333]
  match:
    kind: call
    callee:
      name: NSRegularExpression
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import Foundation
      func test(input: String) { NSRegularExpression(input) }
  - name: literal regex negative
    code: |
      import Foundation
      func test() { NSRegularExpression("^[a-z]+$") }
    expect_no_match: true
  description: "NSRegularExpression(pattern: tainted) - attacker-controlled regular expressions can trigger catastrophic backtracking."
