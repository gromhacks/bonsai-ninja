# Swift XSS sinks (Vapor response emission / WKWebView / UIWebView).
- id: swift.xss.vapor_response_body_constructor
  enabled: true
  language: swift
  tag: xss
  severity: high
  packages: [Vapor]
  imports: [Vapor]
  cwe: [CWE-79]
  match:
    kind: call
    callee:
      name: Response
      binding_origin: imported
  constraints:
  - arg_tainted:
      index: 1
  analysis_semantics:
    character_escape:
      value_arg_indices: [1]
      required_mappings:
      - {input: "&", output: "&amp;"}
      - {input: "<", output: "&lt;"}
      - {input: ">", output: "&gt;"}
      - {input: '"', output: "&quot;"}
      - {input: "'", output: "&#39;"}
  match_examples:
  - name: Vapor Response constructed from a dynamic body
    code: |
      import Vapor
      func emit(_ body: String) -> Response {
        Response(status: .ok, body: .init(string: body))
      }
    expect_match_text: [Response]
  - name: constant Vapor Response body is not tainted
    code: |
      import Vapor
      func emit() -> Response {
        Response(status: .ok, body: .init(string: "<p>safe</p>"))
      }
    expect_no_match: true
  - name: local Response type is not the imported Vapor response
    code: |
      import Vapor
      struct Response { init(status: Int, body: String) {} }
      func emit(_ body: String) -> Response { Response(status: 200, body: body) }
    expect_no_match: true
  description: "Vapor's imported Response initializer is the framework emission boundary for a dynamic response body, including bodies produced by a separate view helper."

- id: swift.xss.wkwebview_loadhtmlstring
  enabled: true
  language: swift
  tag: xss
  severity: high
  cwe: [CWE-79]
  match:
    kind: call
    callee:
      name: loadHTMLString
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(input: String) { loadHTMLString(input) }
  - name: literal html string negative
    code: |
      func test() { loadHTMLString("<p>safe</p>") }
    expect_no_match: true
  description: "WKWebView.loadHTMLString / UIWebView.loadHTMLString with tainted HTML."

- id: swift.xss.wkwebview_evaluate_javascript
  enabled: true
  language: swift
  tag: xss
  severity: high
  packages: [WebKit]
  cwe: [CWE-79, CWE-94]
  match:
    kind: call
    callee:
      name: evaluateJavaScript
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: swift wkwebview evaluate javascript
    code: |
      import WebKit
      func test(input: String) { evaluateJavaScript(input) }
    expect_match_text: [evaluateJavaScript]
  - name: literal evaluate javascript negative
    code: |
      import WebKit
      func test() { evaluateJavaScript("document.title") }
    expect_no_match: true
  description: "WKWebView.evaluateJavaScript with tainted JavaScript - executes attacker-controlled script in the webview."

- id: swift.xss.wkwebview_call_async_javascript
  enabled: true
  language: swift
  tag: xss
  severity: high
  packages: [WebKit]
  cwe: [CWE-79, CWE-94]
  match:
    kind: call
    callee:
      name: callAsyncJavaScript
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: swift wkwebview call async javascript
    code: |
      import WebKit
      func test(input: String) { callAsyncJavaScript(input) }
    expect_match_text: [callAsyncJavaScript]
  - name: literal call async javascript negative
    code: |
      import WebKit
      func test() { callAsyncJavaScript("return document.title") }
    expect_no_match: true
  description: "WKWebView.callAsyncJavaScript (iOS 14+) with tainted JavaScript body - executes attacker-controlled script in the webview, same risk as evaluateJavaScript."

- id: swift.xss.wkusercontentcontroller_add_user_script
  enabled: true
  language: swift
  tag: xss
  severity: high
  packages: [WebKit]
  cwe: [CWE-79, CWE-94]
  match:
    kind: call
    callee:
      attribute: [userContentController, add]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: swift wk user content controller add script
    code: |
      import WebKit
      func test(input: WKUserScript) { userContentController.add(input) }
    expect_match_text: [userContentController.add]
  - name: literal user script negative
    code: |
      import WebKit
      func test() { userContentController.add("safe-script") }
    expect_no_match: true
  description: "WKUserContentController.add(WKUserScript) - untrusted user scripts can inject DOM code into every matching page."
