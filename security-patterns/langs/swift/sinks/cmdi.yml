# Swift command-injection sinks.
- id: swift.cmdi.process_launch
  enabled: true
  language: swift
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: launch
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(input: String) { let amount = 1; launch(input) }
  - name: literal arg 0 negative
    code: |
      func test() { launch("safe") }
    expect_no_match: true
  description: "Process / NSTask launch (deprecated) - subprocess execution. May FP on AppKit/SwiftUI launch() - rare."
- id: swift.cmdi.process_run
  enabled: true
  language: swift
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [process, run]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(input: String) { process.run(input) }
  - name: literal process run negative
    code: |
      func test() { process.run("whoami") }
    expect_no_match: true
  description: "Process.run() / task.run() - Foundation subprocess execution. Kept narrow through the Process-shaped call target and tainted command argument."
