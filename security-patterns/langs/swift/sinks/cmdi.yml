- id: swift.cmdi.execl_family
  enabled: true
  language: swift
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^execl[pev]*$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(input: String) { let amount = 1; execlp(input) }
  - name: literal arg 0 negative
    code: |
      func test() { execl_family("safe") }
    expect_no_match: true
  description: "POSIX execl/execle/execlp/execv/execvp bridged via Darwin."
- id: swift.cmdi.posix_spawn
  enabled: true
  language: swift
  tag: command-injection
  severity: critical
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      regex: "^posix_spawn(p)?$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: declared shape
    code: |
      func test(input: String) { posix_spawn(pid, input) }
  - name: literal arg 1 negative
    code: |
      func test() { posix_spawn("safe", "safe") }
    expect_no_match: true
  description: "posix_spawn / posix_spawnp bridged via Darwin."
- id: swift.cmdi.launchpath_write
  enabled: true
  language: swift
  tag: command-injection
  severity: high
  cwe: [CWE-78]
  match:
    kind: write
    target:
      regex: ^(?:process|task|proc|p)\.launchPath$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: process launch path member write
    code: |
      import Foundation
      func test(input: String) {
        let process = Process()
        process.launchPath = input
      }
  - name: local launchpath variable negative
    code: |
      import Foundation
      func test(input: String) {
        let launchPath = input
      }
    expect_no_match: true
  description: "Process.launchPath = tainted - path to executable."
