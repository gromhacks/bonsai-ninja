# Swift command-injection sinks.
- id: swift.cmdi.process_launch
  enabled: true
  language: swift
  tag: command-injection
  severity: critical
  packages: [Foundation]
  imports: [Foundation]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      name: launch
  constraints:
  - receiver_type_in: [Process]
  - receiver_tainted: true
  - arg_count: 0
  - requires_prior_receiver_write:
      target: {name: launchPath}
      accepted_values:
      - {kind: string, value: /bin/sh}
      - {kind: string, value: /bin/bash}
      - {kind: string, value: /bin/zsh}
      - {kind: string, value: /usr/bin/sh}
      - {kind: string, value: /usr/bin/bash}
      - {kind: string, value: /usr/bin/zsh}
  match_examples:
  - name: Process launch after tainted shell argv configuration
    code: |
      import Foundation
      func test(input: String) {
        let process = Process()
        process.launchPath = "/bin/sh"
        process.arguments = ["-c", input]
        process.launch()
      }
    expect_match_text: [process.launch]
  - name: literal Process configuration negative
    code: |
      import Foundation
      func test() {
        let process = Process()
        process.launchPath = "/bin/sh"
        process.arguments = ["-c", "echo safe"]
        process.launch()
      }
    expect_no_match: true
  - name: direct executable argv does not invoke a shell
    code: |
      import Foundation
      func test(input: String) {
        let process = Process()
        process.launchPath = "/usr/bin/printf"
        process.arguments = ["%s", input]
        process.launch()
      }
    expect_no_match: true
  - name: unrelated launch receiver negative
    code: |
      import Foundation
      struct Worker { var command: String; func launch() {} }
      func test(input: String) { Worker(command: input).launch() }
    expect_no_match: true
  description: "Foundation Process.launch() is a shell-injection boundary when compiler-typed receiver state contains tainted arguments and a dominating launchPath write selects a known shell; direct executable argv remains data."
- id: swift.cmdi.process_launch_executable_url
  enabled: true
  language: swift
  tag: command-injection
  severity: critical
  packages: [Foundation]
  imports: [Foundation]
  cwe: [CWE-78]
  match:
    kind: call
    callee: {name: launch}
  constraints:
  - receiver_type_in: [Process]
  - receiver_tainted: true
  - arg_count: 0
  - requires_prior_receiver_write:
      target: {name: executableURL}
      accepted_calls:
      - call: {name: URL, binding_origin: imported}
        items:
        - index: 0
          accepted_values:
          - {kind: string, value: /bin/sh}
          - {kind: string, value: /bin/bash}
          - {kind: string, value: /bin/zsh}
          - {kind: string, value: /usr/bin/sh}
          - {kind: string, value: /usr/bin/bash}
          - {kind: string, value: /usr/bin/zsh}
  match_examples:
  - name: Process launch after exact shell URL and tainted argv
    code: |
      import Foundation
      func test(input: String) {
        let process = Process()
        process.executableURL = URL(fileURLWithPath: "/bin/sh")
        process.arguments = ["-c", input]
        process.launch()
      }
    expect_match_text: [process.launch]
  - name: direct executable URL argv remains data
    code: |
      import Foundation
      func test(input: String) {
        let process = Process()
        process.executableURL = URL(fileURLWithPath: "/usr/bin/printf")
        process.arguments = ["%s", input]
        process.launch()
      }
    expect_no_match: true
  description: "Foundation Process.launch() with an exact shell executableURL and tainted receiver argv; the rule joins compiler-decoded URL constructor arguments to dominating receiver state."
