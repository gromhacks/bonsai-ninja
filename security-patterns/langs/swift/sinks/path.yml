# Swift path-traversal sinks.
#
- id: swift.path.data_init_contents
  enabled: true
  language: swift
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: Data
  constraints:
  - arg_tainted:
      kw: contentsOf
  analysis_semantics:
    guard_profile: path-consumer-containment
    path_consumer_containment_guard:
      canonicalizer: {name: standardizedFileURL}
      canonicalizer_input_from_receiver: true
      base_canonicalizer: {name: standardizedFileURL}
      path_constructor: {name: appendingPathComponent}
      path_constructor_base_from_receiver: true
      containment_check: {name: hasPrefix}
      containment_candidate_projection: {regex: "(?:^|[.:])path$"}
      containment_base_projection: {regex: "(?:^|[.:])path$"}
      accepted_boundary_values:
      - {kind: string, value: "/"}
      static_base_factories:
      - {name: URL}
      sink_path_arg_index: 0
      path_constructor_base_arg_index: 0
      boundary_places: []
  match_examples:
  - name: Foundation Data contents-of URL
    code: |
      import Foundation
      func read(_ input: URL) { _ = try? Data(contentsOf: input) }
    expect_match_text: [Data]
  - name: ordinary Data construction negative
    code: |
      import Foundation
      func build(_ input: [UInt8]) { _ = Data(input) }
    expect_no_match: true
  - name: literal contents URL negative
    code: |
      import Foundation
      func read() { _ = try? Data(contentsOf: URL(fileURLWithPath: "/tmp/safe")) }
    expect_no_match: true
  description: "Foundation Data(contentsOf:) reads from a tainted file URL; the labeled compiler argument distinguishes it from ordinary Data construction."
- id: swift.path.fm_create_file
  enabled: true
  language: swift
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: createFile
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(input: String) { createFile(input) }
  - name: literal create file negative
    code: |
      func test() { createFile("/tmp/safe.txt") }
    expect_no_match: true
  description: "FileManager.default.createFile(atPath:)."
