# Swift path-traversal sinks.
#
# NOTE: Swift labeled-init forms like String(contentsOfFile:),
# FileHandle(forReadingAtPath:), URL(fileURLWithPath:), Data(contentsOf:)
# appear as init calls keyed only on the type name. The engine has no
# keyword-arg-presence constraint (only equals), and matching bare
# `String(...)` / `URL(...)` fires on every stringification. Those rules
# are therefore disabled until a presence constraint is added.
- id: swift.path.string_contents_of_init
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: String
  description: "Disabled - String(contentsOfFile:) init; bare `String(...)` is ubiquitous without kwarg-presence filter."
- id: swift.path.file_handle_init
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: swift
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: FileHandle
  description: "Disabled - FileHandle(forReadingAtPath:) init; needs kwarg-presence constraint."
- id: swift.path.url_fileurl_init
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  tag: path-traversal
  severity: medium
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: URL
  description: "Disabled - URL(fileURLWithPath:) init; bare `URL(...)` is ubiquitous."
- id: swift.path.data_init_contents
  enabled: false
  disabled_reason:
    code: over-broad
