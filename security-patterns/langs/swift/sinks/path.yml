  description: "Disabled - Data(contentsOf:) init; bare `Data(...)` is ubiquitous."
- id: swift.path.fm_create_file
  enabled: true
  language: swift
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: createFile
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(input: String) { createFile(input) }
  - name: literal create file negative
    code: |
      func test() { createFile("/tmp/safe.txt") }
    expect_no_match: true
  description: "FileManager.default.createFile(atPath:)."
