# FileManager.default.contents(atPath:) - read-arbitrary-file. The
# `String(contentsOfFile:)` family above is disabled until the engine
# has labeled-init kwarg-presence narrowers, but FileManager's
# `contents` method is unambiguous and has stable receiver+selector
# shape, so it's safe to enable.
- id: swift.path.zip_unzip_dest
  enabled: true
  language: swift
  tag: path-traversal
  severity: high
  packages: [ZIPFoundation]
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: unzipItem
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted arg 1
    code: |
      import ZIPFoundation // ZIPFoundation
      func test(input: String) { unzipItem("safe", input) }
  - name: literal arg 1 negative
    code: |
      func test() { unzipItem("safe", "safe") }
    expect_no_match: true
  description: "ZIPFoundation unzipItem(at:to:) - tainted destinations can extract outside the intended directory."

# FileManager.default.contents(atPath:) - read-arbitrary-file. The
# `String(contentsOfFile:)` family above is disabled until the engine
# has labeled-init kwarg-presence narrowers, but FileManager's
# `contents` method is unambiguous and has stable receiver+selector
# shape, so it's safe to enable.
- id: swift.path.filemanager_contents
  enabled: true
  language: swift
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: contents
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(input: String) { FileManager.contents(input) }
  - name: literal filemanager contents negative
    code: |
      func test() { FileManager.contents("/tmp/safe.txt") }
    expect_no_match: true
  description: "FileManager.default.contents(atPath: \"...\" + name) - reads arbitrary file when path is tainted; first-arg concat shape is the canonical traversal vector."
