- id: swift.path.fm_copy_item_dest
  enabled: true
  language: swift
  tag: path-traversal
  severity: high
  cwe: [CWE-22]
  match:
    kind: call
    callee:
      name: copyItem
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted arg 1
    code: |
      func test(input: String) { copyItem("safe", input) }
  - name: literal arg 1 negative
    code: |
      func test() { copyItem("safe", "safe") }
    expect_no_match: true
  description: "FileManager.copyItem(at:to:) - tainted destinations can overwrite files outside the intended directory."
