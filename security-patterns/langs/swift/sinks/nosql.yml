# Swift NoSQL / predicate-injection (Realm, CoreData, MongoDB Swift).
- id: swift.nosql.nspredicate_format
  enabled: true
  language: swift
  tag: nosql-injection
  severity: high
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      name: predicateWithFormat
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(input: String) { predicateWithFormat(input) }
  - name: literal predicate format negative
    code: |
      func test() { predicateWithFormat("name == 'safe'") }
    expect_no_match: true
  description: "NSPredicate.predicateWithFormat - Realm/CoreData filter injection."

- id: swift.nosql.coredata_fetch_predicate
  enabled: true
  language: swift
  tag: nosql-injection
  severity: high
  cwe: [CWE-943]
  match:
    kind: write
    target:
      regex: ^[^\.\s]+\.predicate$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: CoreData fetch request predicate member write
    code: |
      func test(input: NSPredicate) {
        let request = NSFetchRequest<NSManagedObject>(entityName: "User")
        request.predicate = input
      }
    expect_match_text: [request.predicate]
  - name: local predicate variable negative
    code: |
      func test(input: NSPredicate) { let predicate = input }
    expect_no_match: true
  description: "NSFetchRequest.predicate = tainted."

- id: swift.nosql.mongodb_swift_find
  enabled: true
  language: swift
  tag: nosql-injection
  severity: high
  packages: [MongoSwift]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      attribute: [MongoCollection, find]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import mongoswiftdriver
      func test(input: String) { MongoCollection.find(input) }
  - name: literal mongo find negative
    code: |
      import mongoswiftdriver
      func test() { MongoCollection.find("{\"name\":\"safe\"}") }
    expect_no_match: true
  description: "mongo-swift-driver MongoCollection.find."

  imports:
  - mongoswiftdriver
