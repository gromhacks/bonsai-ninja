- id: swift.ssrf.urlsession_data_task
  enabled: true
  language: swift
  tag: ssrf
  severity: high
  packages: [Foundation]
  imports: [Foundation]
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      name: dataTask
      receiver_type_in: [URLSession]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import Foundation
      func test(session: URLSession, input: URL) { session.dataTask(with: input) }
  - name: literal data task negative
    code: |
      import Foundation
      func test(session: URLSession) {
        session.dataTask(with: URL(string: "https://safe.example")!)
      }
    expect_no_match: true
  description: URLSession dataTask(with:) with tainted URL.
