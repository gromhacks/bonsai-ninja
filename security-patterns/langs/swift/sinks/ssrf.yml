- id: swift.ssrf.urlsession_data_task
  enabled: true
  language: swift
  tag: ssrf
  severity: high
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      name: dataTask
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: 'func test(input: String) { dataTask(input) }

      '
  - name: literal data task negative
    code: 'func test() { dataTask("https://safe.example") }

      '
    expect_no_match: true
  description: URLSession dataTask(with:) with tainted URL.
