- id: swift.ssrf.urlsession_data_async
  enabled: true
  language: swift
  tag: ssrf
  severity: high
  packages: [Foundation]
  imports: [Foundation]
  cwe:
  - CWE-918
  match:
    kind: call
    callee:
      attribute: [URLSession, shared, data]
      binding_origin: imported
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import Foundation
      func test(input: URL) async throws { _ = try await URLSession.shared.data(from: input) }
  - name: literal urlsession data negative
    code: |
      import Foundation
      func test() async throws {
        _ = try await URLSession.shared.data(from: URL(string: "https://safe.example")!)
      }
    expect_no_match: true
  - name: local URLSession collision negative
    code: |
      import Foundation
      struct URLSession { static let shared = URLSession(); func data(from: String) {} }
      func test(input: String) { URLSession.shared.data(from: input) }
    expect_no_match: true
  description: "URLSession.data(from:) async - suffix-match via `URLSession.data`."
