# Swift deserialization sinks.
- id: swift.deser.nskeyedunarchiver_unarchiveobject
  enabled: true
  language: swift
  tag: insecure-deserialization
  severity: critical
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: unarchiveObject
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(input: Data) { unarchiveObject(input) }
  - name: literal archive data negative
    code: |
      func test() { unarchiveObject("safe") }
    expect_no_match: true
  description: "NSKeyedUnarchiver.unarchiveObject — without secureCoding = RCE."

