- id: swift.deser.nskeyedunarchiver_init
  enabled: true
  language: swift
  tag: insecure-deserialization
  category: source-independent
  severity: high
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: NSKeyedUnarchiver
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; NSKeyedUnarchiver(input) }
  description: "NSKeyedUnarchiver(forReadingFrom:/forReadingWith:) - review requiresSecureCoding."

- id: swift.deser.requiressecurecoding_false
  enabled: true
  language: swift
  tag: insecure-deserialization
  category: source-independent
  severity: high
  cwe: [CWE-502]
  match:
    kind: write
    target:
      regex: '^[^\.\s]+\.requiresSecureCoding$'
      receiver_type_in: [NSKeyedUnarchiver]
  constraints:
  - arg_equals: {index: 0, value: "false"}
  match_examples:
  - name: secure coding disabled on keyed unarchiver
    code: |
      import Foundation
      func configure(_ unarchiver: NSKeyedUnarchiver) {
        unarchiver.requiresSecureCoding = false
      }
  - name: secure coding enabled on keyed unarchiver negative
    code: |
      import Foundation
      func configure(_ unarchiver: NSKeyedUnarchiver) {
        unarchiver.requiresSecureCoding = true
      }
    expect_no_match: true
  - name: local requires-secure-coding collision negative
    code: |
      func configure() {
        var requiresSecureCoding = false
        _ = requiresSecureCoding
      }
    expect_no_match: true
  description: "`NSKeyedUnarchiver.requiresSecureCoding = false` disables secure coding; exact member and scalar-value constraints reject secure settings and local collisions."

- id: swift.deser.nskeyedunarchiver_decode_insecure_state
  enabled: true
  language: swift
  tag: insecure-deserialization
  severity: critical
  packages: [Foundation]
  imports: [Foundation]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: decodeObject
  constraints:
  - receiver_type_in: [NSKeyedUnarchiver]
  - receiver_tainted: true
  - requires_prior_receiver_write:
      target: {name: requiresSecureCoding}
      accepted_values:
      - {kind: boolean, value: false}
  match_examples:
  - name: decode tainted archive after disabling secure coding
    code: |
      import Foundation
      func decode(_ data: Data) {
          let unarchiver = NSKeyedUnarchiver(forReadingFrom: data)
          unarchiver.requiresSecureCoding = false
          _ = unarchiver.decodeObject(forKey: "root")
      }
    expect_match_text: [unarchiver.decodeObject]
  - name: secure decoding state is not insecure
    code: |
      import Foundation
      func decode(_ data: Data) {
          let unarchiver = NSKeyedUnarchiver(forReadingFrom: data)
          unarchiver.requiresSecureCoding = true
          _ = unarchiver.decodeObject(forKey: "root")
      }
    expect_no_match: true
  description: "Decoding from a tainted NSKeyedUnarchiver after a dominating requiresSecureCoding=false write is unsafe; typed receiver state and the exact scalar write distinguish secure decoding and unrelated APIs."

- id: swift.deser.propertylist_serialization
  enabled: true
  language: swift
  tag: insecure-deserialization
  severity: medium
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [PropertyListSerialization, propertyList]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(input: Data) { PropertyListSerialization.propertyList(input) }
  - name: literal property list data negative
    code: |
      func test() { PropertyListSerialization.propertyList("safe") }
    expect_no_match: true
  description: "PropertyListSerialization.propertyList(from:) with MutableContainers allows object substitution."

