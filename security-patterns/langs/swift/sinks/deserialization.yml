- id: swift.deser.nskeyedunarchiver_init
  enabled: true
  language: swift
  tag: insecure-deserialization
  category: source-independent
  severity: high
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: NSKeyedUnarchiver
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; NSKeyedUnarchiver(input) }
  description: "NSKeyedUnarchiver(forReadingFrom:/forReadingWith:) — review requiresSecureCoding."

- id: swift.deser.requiressecurecoding_false
  enabled: true
  language: swift
  tag: insecure-deserialization
  category: source-independent
  severity: high
  cwe: [CWE-502]
  match:
    kind: write
    target:
      name: requiresSecureCoding
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; requiresSecureCoding = input }
  description: "NSKeyedUnarchiver.requiresSecureCoding = false — disables secure coding enforcement."

- id: swift.deser.nskeyedunarchiver_unarchivedobject_class
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: swift
  tag: insecure-deserialization
  severity: medium
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      name: unarchivedObject
  description: "Disabled — class-bounded unarchive; flag with [Any].self constraint."

- id: swift.deser.propertylist_serialization
  enabled: true
  language: swift
  tag: insecure-deserialization
  severity: medium
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [PropertyListSerialization, propertyList]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      func test(input: Data) { PropertyListSerialization.propertyList(input) }
  - name: literal property list data negative
    code: |
      func test() { PropertyListSerialization.propertyList("safe") }
    expect_no_match: true
  description: "PropertyListSerialization.propertyList(from:) with MutableContainers allows object substitution."

- id: swift.deser.propertylistdecoder_decode
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  tag: insecure-deserialization
  severity: low
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [PropertyListDecoder, decode]
  description: "Disabled — type-bounded decoder; not directly exploitable."

- id: swift.deser.yams_load
  enabled: true
  language: swift
  tag: insecure-deserialization
  severity: high
  packages: [Yams]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [Yams, load]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import Yams // Yams
      func test(input: String) { Yams.load(input) }
  - name: literal yaml load negative
    code: |
      import Yams // Yams
      func test() { Yams.load("name: safe") }
    expect_no_match: true
  description: "Yams.load — flag if untrusted input."

