# Swift XXE sinks.
- id: swift.xxe.xmlparser_init
  enabled: true
  language: swift
  tag: xxe
  severity: high
  cwe: [CWE-611]
  match:
    kind: call
    callee:
      name: XMLParser
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: declared shape
      code: |
        func test(input: Data) { XMLParser(input) }
    - name: literal xml parser negative
      code: |
        func test() { XMLParser("<root/>") }
      expect_no_match: true
  description: "XMLParser(data:) — review shouldResolveExternalEntities setting."

- id: swift.xxe.should_resolve_external_entities
  enabled: true
  language: swift
  tag: xxe
  category: source-independent
  severity: high
  cwe: [CWE-611]
  match:
    kind: write
    target:
      regex: ^[^\.\s]+\.shouldResolveExternalEntities$
  match_examples:
    - name: XMLParser external entities member write
      code: |
        func test(input: Bool) {
          let parser = XMLParser(data: Data())
          parser.shouldResolveExternalEntities = input
        }
      expect_match_text: [parser.shouldResolveExternalEntities]
    - name: local shouldResolveExternalEntities variable negative
      code: |
        func test(input: Bool) { let shouldResolveExternalEntities = input }
      expect_no_match: true
  description: "XMLParser.shouldResolveExternalEntities = true — enables XXE."

