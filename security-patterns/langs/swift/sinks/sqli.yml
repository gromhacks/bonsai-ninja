- id: swift.sqli.grdb_execute
  enabled: true
  language: swift
  tag: sql-injection
  severity: high
  packages: [GRDB]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*\.execute$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import GRDB
      func test(input: String) { db.execute(input) }
  - name: literal grdb execute negative
    code: |
      import GRDB
      func test() { db.execute("SELECT 1") }
    expect_no_match: true
  description: "GRDB Database.execute with raw SQL."
- id: swift.sqli.sqlite_swift_run
  enabled: true
  language: swift
  tag: sql-injection
  severity: high
  packages: [SQLite.swift]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      attribute: [Connection, run]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: declared shape
    code: |
      import SQLite // SQLite.swift
      import SQLite // SQLite.swift
      func test(input: String) { Connection.run(input) }
  - name: literal sqlite swift run negative
    code: |
      import SQLite // SQLite.swift
      import SQLite // SQLite.swift
      func test() { Connection.run("SELECT 1") }
    expect_no_match: true
  description: "SQLite.swift Connection.run with raw SQL. Typed-receiver sqli (PATTERN_GUIDE-exempt from SQL-keyword arg shape); `min_args: 1` rejects 0-arg decoys."
  imports:
  - SQLite
