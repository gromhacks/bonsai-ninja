# Swift SQL injection sinks.
- id: swift.sqli.sqlite3_exec
  enabled: true
  language: swift
  tag: sql-injection
  severity: critical
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: sqlite3_exec
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: declared shape
    code: |
      func test(input: String) { sqlite3_exec(db, input, nil, nil, nil) }
  - name: literal sqlite3 exec negative
    code: |
      func test(input: String) { sqlite3_exec(db, "SELECT 1", nil, nil, nil) }
    expect_no_match: true
  description: "sqlite3_exec - concatenated SQL."
