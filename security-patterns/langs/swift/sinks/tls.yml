# Swift TLS misconfig.
- id: swift.tls.alamofire_servertrust_disabled
  enabled: true
  language: swift
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [Alamofire]
  imports: [Alamofire]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: DisabledTrustEvaluator
      binding_origin: imported
  constraints:
  - arg_count: 0
  match_examples:
  - name: Alamofire disabled trust evaluator
    code: |
      import Alamofire
      func configure() { _ = DisabledTrustEvaluator() }
    expect_match_text: [DisabledTrustEvaluator]
  - name: local disabled evaluator name is not Alamofire
    code: |
      import Alamofire
      struct DisabledTrustEvaluator { init() {} }
      func configure() { _ = DisabledTrustEvaluator() }
    expect_no_match: true
  description: "Alamofire DisabledTrustEvaluator - explicitly disables server trust validation."

- id: swift.tls.ssl_break_on_server_auth
  enabled: true
  language: swift
  tag: weak-tls
  category: source-independent
  severity: high
  packages: [Security]
  imports: [Security]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: SSLSetSessionOption
      binding_origin: imported
  constraints:
  - arg_matches_regex:
      index: 1
      regex: '^kSSLSessionOptionBreakOnServerAuth$'
  - arg_equals: {index: 2, value: "true"}
  match_examples:
  - name: Security framework server-auth break enabled
    code: |
      import Security
      func configure(_ context: SSLContext) {
        SSLSetSessionOption(context, kSSLSessionOptionBreakOnServerAuth, true)
      }
    expect_match_text: [SSLSetSessionOption]
  - name: Security framework server-auth break disabled
    code: |
      import Security
      func configure(_ context: SSLContext) {
        SSLSetSessionOption(context, kSSLSessionOptionBreakOnServerAuth, false)
      }
    expect_no_match: true
  - name: unrelated Security session option negative
    code: |
      import Security
      func configure(_ context: SSLContext) {
        SSLSetSessionOption(context, kSSLSessionOptionFalseStart, true)
      }
    expect_no_match: true
  - name: local session-option function is not Security
    code: |
      import Security
      func SSLSetSessionOption(_ context: Int, _ option: Int, _ value: Bool) {}
      func configure() { SSLSetSessionOption(0, kSSLSessionOptionBreakOnServerAuth, true) }
    expect_no_match: true
  description: "SSLSetSessionOption(kSSLSessionOptionBreakOnServerAuth) - manual cert validation, often skipped."

- id: swift.tls.alamofire_revocation_skip
  enabled: true
  language: swift
  tag: weak-tls
  category: source-independent
  severity: medium
  packages: [Alamofire]
  imports: [Alamofire]
  cwe: [CWE-295]
  match:
    kind: call
    callee:
      name: RevocationTrustEvaluator
      binding_origin: imported
  constraints:
  - keyword_arg_equals:
      name: performRevocationFlags
      value: '[]'
  match_examples:
  - name: Alamofire revocation checks explicitly empty
    code: |
      import Alamofire
      func configure() {
        _ = RevocationTrustEvaluator(performRevocationFlags: [])
      }
    expect_match_text: [RevocationTrustEvaluator]
  - name: Alamofire revocation checks configured negative
    code: |
      import Alamofire
      func configure() {
        _ = RevocationTrustEvaluator(performRevocationFlags: [.ocsp])
      }
    expect_no_match: true
  - name: local revocation evaluator name is not Alamofire
    code: |
      import Alamofire
      struct RevocationTrustEvaluator { init(performRevocationFlags: [Int]) {} }
      func configure() { _ = RevocationTrustEvaluator(performRevocationFlags: []) }
    expect_no_match: true
  description: "Alamofire RevocationTrustEvaluator with `performRevocationFlags: []` skips OCSP/CRL revocation checks - review args."
