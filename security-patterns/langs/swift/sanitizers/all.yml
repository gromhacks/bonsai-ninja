# Swift sanitizers.
- id: swift.sanitizer.url_query_allowed
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: swift.sanitizer.adding_percent_encoding
  language: swift
  tag: url-encode
  match:
    kind: call
    callee:
      attribute: [URLComponents, addingPercentEncoding]
  description: "Disabled — `URLComponents.addingPercentEncoding` is not a real method (it lives on `String`); covered by swift.sanitizer.adding_percent_encoding."
- id: swift.sanitizer.adding_percent_encoding
  enabled: true
  language: swift
  tag: url-encode
  match:
    kind: call
    callee:
      name: addingPercentEncoding
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; addingPercentEncoding(input) }
    expect_match_text: [addingPercentEncoding]
  description: "String.addingPercentEncoding(withAllowedCharacters:)."
- id: swift.sanitizer.cc_secure_random
  enabled: true
  language: swift
  tag: validation
  match:
    kind: call
    callee:
      name: SecRandomCopyBytes
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; SecRandomCopyBytes(input) }
    expect_match_text: [SecRandomCopyBytes]
  description: "SecRandomCopyBytes — crypto-secure RNG."
- id: swift.sanitizer.html_escape_kanna
  enabled: true
  language: swift
  tag: html-sanitize
  packages: [Kanna]
  match:
    kind: call
    callee:
      name: htmlEscape
  match_examples:
  - name: declared shape
    code: |
      import Kanna // Kanna
      func test() { let input = "x"; let amount = 1; htmlEscape(input) }
    expect_match_text: [htmlEscape]
  description: "Kanna htmlEscape."
- id: swift.sanitizer.swiftsoup_clean
  enabled: true
  language: swift
  tag: html-sanitize
  packages: [SwiftSoup]
  match:
    kind: call
    callee:
      regex: "^SwiftSoup\\.clean$"
  match_examples:
  - name: declared shape
    code: |
      import SwiftSoup // SwiftSoup
      func test() { let input = "x"; let amount = 1; SwiftSoup.clean(input) }
    expect_match_text: [SwiftSoup.clean]
  description: "SwiftSoup.clean — HTML whitelist sanitization."
- id: swift.sanitizer.bcrypt_verify
  enabled: true
  language: swift
  tag: auth-sanitizer
  packages: [Vapor]
  match:
    kind: call
    callee:
      regex: "^Bcrypt\\.verify$"
  match_examples:
  - name: declared shape
    code: |
      import Vapor
      func test() { let input = "x"; let amount = 1; Bcrypt.verify(input) }
    expect_match_text: [Bcrypt.verify]
  description: "Vapor Bcrypt.verify — constant-time password check."
- id: swift.sanitizer.sqlite_swift_bind
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  tag: sql-parameter
  packages: [SQLite.swift]
  match:
    kind: call
    callee:
      name: bind
  description: "Disabled — bare `.bind` matches SwiftUI `@State.bind`, Combine, etc.; would over-sanitize. Enable with receiver
    narrowing to Statement/Connection."
- id: swift.sanitizer.grdb_arguments
  enabled: true
  language: swift
  tag: sql-parameter
  packages: [GRDB]
  match:
    kind: call
    callee:
      name: StatementArguments
  match_examples:
  - name: declared shape
    code: |
      import GRDB
      func test() { let input = "x"; let amount = 1; StatementArguments(input) }
    expect_match_text: [StatementArguments]
  description: "GRDB StatementArguments — parameterized query."
- id: swift.sanitizer.fmdb_bind_args
  enabled: true
  language: swift
  tag: sql-parameter
  packages: [fmdb]
  match:
    kind: call
    callee:
      name: executeQueryWithArgumentsInArray
  match_examples:
  - name: declared shape
    code: |
      import fmdb // fmdb
      func test() { let input = "x"; let amount = 1; executeQueryWithArgumentsInArray(input) }
    expect_match_text: [executeQueryWithArgumentsInArray]
  description: "FMDB bound-argument query variants."
- id: swift.sanitizer.int_coerce
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  tag: numeric-coerce
  match:
    kind: call
    callee:
      name: Int
  description: "Disabled — bare `Int(...)` fires on every numeric literal/type conversion (Int(x), Int(exactly:)); would over-sanitize.
    Enable only with kwarg-presence filter for Int(String-var)."
- id: swift.sanitizer.uuid_coerce
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  tag: numeric-coerce
  match:
    kind: call
    callee:
      name: UUID
  description: "Disabled — bare `UUID()` is the common no-arg random-UUID form; the tainted-string form `UUID(uuidString:)`
    isn't distinguishable without kwarg-presence filter."
- id: swift.sanitizer.resolving_symlinks
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  tag: path-sanitize
  match:
    kind: call
    callee:
      name: resolvingSymlinksInPath
  description: "Disabled — path normalisation (normpath / canonical / clean / realpath / expand_path) does NOT prevent directory
    traversal. `/var/www/../etc/passwd` canonicalises to `/etc/passwd`, which is still outside the intended root. A real sanitizer
    must be normalisation PLUS a containment check (startswith / strip_prefix / basename that drops the directory component).
    Marking these as sanitizers produced false negatives on attacker-controlled paths."

# --- URL build sanitizers --------------------------------------------------
- id: swift.sanitizer.urlcomponents_query_items
  enabled: true
  language: swift
  tag: url-encode
  match:
    kind: write
    target:
      name: queryItems
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; queryItems = input }
    expect_match_text: [queryItems]
  description: "URLComponents.queryItems = [URLQueryItem(...)] — Foundation builds the URL with proper percent-encoding per
    RFC 3986; safer than string concatenation into a URL."

# --- SQLite prepared-bind sanitizers ---------------------------------------
- id: swift.sanitizer.sqlite3_bind_text
  enabled: true
  language: swift
  tag: sql-parameter
  match:
    kind: call
    callee:
      name: sqlite3_bind_text
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; sqlite3_bind_text(input) }
    expect_match_text: [sqlite3_bind_text]
  description: "sqlite3_bind_text(stmt, idx, value, ...) — bound parameter on a prepared statement; value is not interpreted
    as SQL."
- id: swift.sanitizer.sqlite3_bind_blob
  enabled: true
  language: swift
  tag: sql-parameter
  match:
    kind: call
    callee:
      name: sqlite3_bind_blob
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; sqlite3_bind_blob(input) }
    expect_match_text: [sqlite3_bind_blob]
  description: "sqlite3_bind_blob — bound BLOB parameter on a prepared statement."
- id: swift.sanitizer.sqlite3_bind_int
  enabled: true
  language: swift
  tag: sql-parameter
  match:
    kind: call
    callee:
      regex: "^sqlite3_bind_(int|int64|double)$"
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; sqlite3_bind_int(input) }
    expect_match_text: [sqlite3_bind_int]
  description: "sqlite3_bind_int / int64 / double — typed bound parameter; value cannot inject SQL syntax."

# --- SQLite.swift parameterized prepare ------------------------------------
- id: swift.sanitizer.sqlite_swift_prepare
  enabled: true
  language: swift
  tag: sql-parameter
  packages: [SQLite.swift]
  match:
    kind: call
    callee:
      attribute: [Connection, prepare]
  constraints:
  - min_args: 1
  match_examples:
  - name: declared shape
    code: |
      import SQLite // SQLite.swift
      import SQLite // SQLite.swift
      func test() { let input = "x"; let amount = 1; Connection.prepare(input) }
    expect_match_text: [Connection.prepare]
  description: "SQLite.swift Connection.prepare(sql, bindings...) — when called with the bindings overload, parameters are
    bound, not concatenated. (The raw `Connection.execute` path is the SQLi sink in sqli.yml.) `min_args: 1` rejects 0-arg
    `Connection.prepare()` decoys."

# --- CryptoKit / constant-time compare -------------------------------------
  imports:
  - SQLite
- id: swift.sanitizer.crypto_kit_constant_time_compare
  enabled: true
  language: swift
  tag: constant-time-compare
  packages: [CryptoKit]
  match:
    kind: call
    callee:
      name: safeCompare
  match_examples:
  - name: declared shape
    code: |
      import CryptoKit
      func test() { let input = "x"; let amount = 1; safeCompare(input) }
    expect_match_text: [safeCompare]
  description: "CryptoKit / common helper `safeCompare(_:_:)` — constant-time byte comparison built on SymmetricKey.withUnsafeBytes
    + memcmp_constant_time / timingsafe_bcmp; mitigates CWE-208 timing leaks on MAC/hash equality."
- id: swift.sanitizer.hashed_authentication_code_equality
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  tag: constant-time-compare
  packages: [CryptoKit]
  match:
    kind: call
    callee:
      attribute: [HashedAuthenticationCode, ==]
  description: "CryptoKit HashedAuthenticationCode `==` — Apple's overload performs a constant-time compare; safe MAC verification."
- id: swift.sanitizer.timingsafe_bcmp
  enabled: true
  language: swift
  tag: constant-time-compare
  match:
    kind: call
    callee:
      regex: "^(timingsafe_bcmp|memcmp_constant_time|CC_constant_time_cmp)$"
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; timingsafe_bcmp(input) }
    expect_match_text: [timingsafe_bcmp]
  description: "Constant-time byte comparison primitives bridged from libc / CommonCrypto."

