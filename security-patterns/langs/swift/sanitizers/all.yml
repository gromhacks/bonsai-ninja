# --- CoreData / NSPredicate parameterized form -----------------------------
- id: swift.sanitizer.nspredicate_argument_array
  enabled: true
  language: swift
  tag: nosql-parameter
  match:
    kind: call
    callee:
      name: NSPredicate
  constraints:
  - any_arg_matches_regex: "argumentArray\\s*:"
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; NSPredicate("argumentArray: [input]") }
    expect_match_text: [NSPredicate]
  - name: declared shape negative constraint boundary
    code: "func test() { let input = \"x\"; let amount = 1; NSPredicate() }\n"
    expect_no_match: true
  description: "NSPredicate(format: \"name == %@\", argumentArray: [tainted]) — `%@` placeholder + argumentArray binds the
    value as a literal; CoreData/Realm cannot interpret it as predicate syntax. Mirror sink: swift.eval.nspredicate_format
    / swift.nosql.nspredicate_format."

- id: swift.sanitizer.has_prefix_same_origin
  enabled: true
  language: swift
  tag: same-origin-path
  match:
    kind: call
    callee:
      name: hasPrefix
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '^"/[^"]*"$'
  match_examples:
  - name: hasPrefix local path
    code: |
      func test(target: String) { target.hasPrefix("/app/") }
    expect_match_text: [target.hasPrefix]
  - name: hasPrefix local path negative constraint boundary
    code: "func test(target: String) { target.hasPrefix() }\n"
    expect_no_match: true
  description: "String.hasPrefix(\"/...\") — slash-rooted local path prefix check used to keep redirects and path routing
    same-origin."

- id: swift.sanitizer.set_contains_allowlist
  enabled: false
  language: swift
  tag: allowlist-validate
  match:
    kind: call
    callee:
      regex: "^(allowed|allowlist|whitelist|safeValues|safePaths)\\.contains$"
  match_examples:
  - name: finite set contains
    code: |
      func test(input: String) { allowed.contains(input) }
    expect_match_text: [allowed.contains]
  description: "Disabled — this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    Allowlist-named Set/Dictionary membership check — validates a tainted value against a finite accepted set before dispatch,
    redirects, or queries."

  disabled_reason:
    code: over-broad
- id: swift.sanitizer.regex_whole_match
  enabled: true
  language: swift
  tag: regex-validate
  match:
    kind: call
    callee:
      name: wholeMatch
  match_examples:
  - name: Swift Regex whole match
    code: |
      func test(input: String, slug: Regex<AnyRegexOutput>) { slug.wholeMatch(in: input) }
    expect_match_text: [slug.wholeMatch]
  description: "Swift Regex.wholeMatch(in:) — validates that the entire input matches a UUID/slug/full-string allowlist regex."

- id: swift.sanitizer.grdb_execute_arguments
  enabled: true
  language: swift
  tag: db-bind-parameter
  packages: [GRDB]
  match:
    kind: call
    callee:
      name: execute
  constraints:
  - min_args: 2
  match_examples:
  - name: GRDB execute arguments
    code: |
      import GRDB
      func test(input: String) { db.execute(sql: "select * from users where name = ?", arguments: [input]) }
    expect_match_text: [db.execute]
  description: "GRDB Database.execute(sql:arguments:) — binds Swift values to SQL placeholders through StatementArguments."

- id: swift.sanitizer.regex_replace_char_allowlist
  enabled: true
  language: swift
  tag: char-allowlist
  match:
    kind: call
    callee:
      name: replacingOccurrences
  constraints:
  - any_arg_matches_regex: "\\[\\^[^\\]]+\\]"
  - any_arg_matches_regex: '^""$'
  - any_arg_matches_regex: "regularExpression"
  match_examples:
  - name: strip non slug chars
    code: |
      func test(input: String) { input.replacingOccurrences(of: "[^A-Za-z0-9_-]", with: "", options: .regularExpression) }
    expect_match_text: [input.replacingOccurrences]
  - name: strip non slug chars negative constraint boundary
    code: "func test(input: String) { input.replacingOccurrences() }\n"
    expect_no_match: true
  description: "String.replacingOccurrences(of: \"[^safe]\", with: \"\", options: .regularExpression) — strips characters
    outside an allowlist."

# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) — taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: swift.passthrough.removing_percent_encoding
  enabled: true
  language: swift
  tag: passthrough-decode
  match:
    kind: call
    callee:
      name: removingPercentEncoding
  taint_semantics:
    call_result_passthrough_receiver: true
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; removingPercentEncoding(input) }
    expect_match_text: [removingPercentEncoding]
  description: "String.removingPercentEncoding — instance member; preserves taint."

# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: swift.csrf.vapor_session_token
  enabled: true
  language: swift
  tag: csrf-protect
  match:
    kind: call
    callee:
      attribute: [req, session]
  constraints:
  - max_args: 0
  match_examples:
  - name: declared shape
    code: |
      func test() { let input = "x"; let amount = 1; req.session() }
    expect_match_text: [req.session]
  description: "Vapor req.session — session-token presence; pair with custom CSRF check (no built-in middleware in Vapor 4).
    Property-style getter (no args); `max_args: 0` rejects unrelated overloads."

# Cookie-secure sanitizers (round 3).
- id: swift.cookie.vapor_cookie_is_http_only
  enabled: true
  language: swift
  tag: cookie-secure
  packages: [vapor]
  match:
    kind: call
    callee:
      attribute: [Cookie, isHttpOnly]
  constraints:
  - any_arg_matches_regex: |-
      true
  match_examples:
  - name: declared shape
    code: |
      import vapor
      import Vapor // vapor
      import Vapor // vapor
      func test() { let input = "x"; let amount = 1; Cookie.isHttpOnly(true) }
    expect_match_text: [Cookie.isHttpOnly]
  - name: declared shape negative constraint boundary
    code: "import vapor\nimport Vapor // vapor\nimport Vapor // vapor\nfunc test() { let input = \"x\"; let amount = 1; Cookie.isHttpOnly()
      }\n"
    expect_no_match: true
  description: 'Vapor Cookie.isHttpOnly = true — explicit HttpOnly flag.'
