# External-library constructor return types. These compile into receiver type
# facts and never produce findings.
- id: swift.typing.foundation_process
  enabled: true
  language: swift
  packages: [Foundation]
  imports: [Foundation]
  returns_type: Process
  match:
    kind: call
    callee:
      name: Process
      binding_origin: imported
  match_examples:
  - name: Foundation Process constructor returns Process
    code: |
      import Foundation
      func example(input: String) {
          let process = Process()
          process.arguments = [input]
      }
    expect_match_text: [Process]
  - name: local Process shadows Foundation member
    code: |
      import Foundation
      struct Process { var arguments: [String] = [] }
      func example(input: String) {
          var process = Process()
          process.arguments = [input]
      }
    expect_no_match: true
  description: "Foundation.Process() returns Process; compiler import and local-shadow facts type the assigned receiver. Typing-only — never a finding."

- id: swift.typing.foundation_xml_parser
  enabled: true
  language: swift
  packages: [Foundation]
  imports: [Foundation]
  returns_type: XMLParser
  match:
    kind: call
    callee:
      name: XMLParser
      binding_origin: imported
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: Foundation XMLParser constructor returns XMLParser
    code: |
      import Foundation
      func example(input: Data) {
          let parser = XMLParser(data: input)
          parser.shouldResolveExternalEntities = true
      }
    expect_match_text: [XMLParser]
  - name: local XMLParser shadows Foundation member
    code: |
      import Foundation
      struct XMLParser { init(data: Data) {} }
      func example(input: Data) {
          let parser = XMLParser(data: input)
          _ = parser
      }
    expect_no_match: true
  description: "Foundation.XMLParser(data:) returns XMLParser; compiler import and local-shadow facts type the assigned receiver without treating every same-spelled constructor as Foundation. Typing-only — never a finding."

- id: swift.typing.foundation_nskeyedunarchiver
  enabled: true
  language: swift
  packages: [Foundation]
  imports: [Foundation]
  returns_type: NSKeyedUnarchiver
  match:
    kind: call
    callee:
      name: NSKeyedUnarchiver
      binding_origin: imported
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: Foundation keyed unarchiver preserves archive bytes
    code: |
      import Foundation
      func example(input: Data) {
          let unarchiver = NSKeyedUnarchiver(forReadingFrom: input)
          consume(unarchiver)
      }
    expect_match_text: [NSKeyedUnarchiver]
  - name: local keyed unarchiver shadows Foundation member
    code: |
      import Foundation
      struct NSKeyedUnarchiver { init(forReadingFrom: Data) {} }
      func example(input: Data) {
          let unarchiver = NSKeyedUnarchiver(forReadingFrom: input)
          consume(unarchiver)
      }
    expect_no_match: true
  description: "Foundation.NSKeyedUnarchiver construction preserves attacker influence from archive bytes and produces a typed receiver; imported-binding and local-shadow facts keep the transfer library-specific. Typing-only — never a finding."

