- id: swift.typing.foundation_data_value
  enabled: true
  language: swift
  packages: [Foundation, Vapor]
  imports: [Foundation, Vapor]
  returns_type: Data
  match:
    kind: call
    callee:
      name: Data
      binding_origin: imported
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: Foundation Data preserves bytes from its input value
    code: |
      import Foundation
      func example(input: [UInt8]) {
          let bytes = Data(input)
          consume(bytes)
      }
    expect_match_text: [Data]
  - name: Vapor-visible Data preserves request-buffer bytes
    code: |
      import Vapor
      func example(input: ByteBuffer) {
          let bytes = Data(buffer: input)
          consume(bytes)
      }
    expect_match_text: [Data]
  - name: local Data constructor is not Foundation Data
    code: |
      import Foundation
      struct Data { init(_ value: String) {} }
      func example(input: String) {
          let bytes = Data(input)
          consume(bytes)
      }
    expect_no_match: true
  description: "Foundation.Data construction preserves bytes from its input value and returns a typed Data receiver. Module evidence and local-shadow checks make this a rule-owned library transfer rather than a language-wide constructor guess. Typing-only — never a finding."

- id: swift.typing.sqlite_statement
  enabled: true
  language: swift
  packages: [SQLite.swift]
  imports: [SQLite]
  returns_type: Statement
  match:
    kind: call
    callee:
      attribute: [SQLite, Statement]
      binding_origin: imported
  match_examples:
  - name: SQLite.swift constructor returns Statement
    code: |
      import SQLite
      import struct SQLite.Statement
      func example(input: String) {
          let statement = Statement()
          statement.bind(input)
      }
    expect_match_text: [Statement]
  - name: local Statement constructor is not SQLite.swift
    code: |
      import SQLite
      struct Statement {}
      func example(input: String) {
          let statement = Statement()
          statement.bind(input)
      }
    expect_no_match: true
  description: "`SQLite.Statement(...)` returns `Statement`; imported member aliases are resolved through compiler import facts so bind rules do not depend on local variable names. Typing-only — never a finding."
