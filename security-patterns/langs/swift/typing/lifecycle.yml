- id: swift.typing.lifecycle_cancelled_receiver
  enabled: true
  language: swift
  match:
    kind: call
    callee:
      regex: '(?:^|\.)(?:cancel|invalidate)$'
  lifecycle_transition:
    state: cancelled
    binding: { kind: receiver }
  match_examples:
  - name: cancel changes the receiver state
    code: 'func f(task: URLSessionTask) { task.cancel() }'
    expect_match_text: [task.cancel]
  description: "Swift cancel/invalidate moves the receiver to cancelled. Typing-only; never a finding."

- id: swift.typing.lifecycle_closed_receiver
  enabled: true
  language: swift
  match: { kind: call, callee: { name: close } }
  lifecycle_transition:
    state: closed
    binding: { kind: receiver }
  match_examples:
  - name: close changes the receiver state
    code: 'func f(resource: Resource) { resource.close() }'
    expect_match_text: [resource.close]
  description: "Swift close moves the receiver to closed. Typing-only; never a finding."

- id: swift.typing.lifecycle_released_receiver
  enabled: true
  language: swift
  match:
    kind: call
    callee:
      regex: '(?:^|\.)(?:release|deinit)$'
  lifecycle_transition:
    state: freed
    binding: { kind: receiver }
  match_examples:
  - name: release changes the receiver state
    code: 'func f(resource: Resource) { resource.release() }'
    expect_match_text: [resource.release]
  description: "Swift release/deinit moves the receiver to freed. Typing-only; never a finding."
