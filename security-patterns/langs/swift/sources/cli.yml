# Swift CLI/local-trust sources.
- id: swift.cli.argv
  enabled: true
  language: swift
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: read
    target:
      attribute: [CommandLine, arguments]
  match_examples:
  - name: command line arguments read
    code: |
      import Foundation
      func run() -> [String] {
        let a = CommandLine.arguments
        return a
      }
  description: "CommandLine.arguments - process argv read via the `CommandLine.arguments` static property."
- id: swift.cli.readline
  enabled: true
  language: swift
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: readLine
  match_examples:
    - name: declared shape
      code: |
        func test() { let input = "x"; let amount = 1; readLine(input) }
  description: "readLine() - stdin."
- id: swift.os.environment
  enabled: true
  language: swift
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: read
    target:
      attribute: [ProcessInfo, processInfo, environment]
  match_examples:
  - name: process info environment read
    code: |
      import Foundation
      func run() -> [String: String] {
        let e = ProcessInfo.processInfo.environment
        return e
      }
  description: "ProcessInfo.processInfo.environment - process environment variables read via the `environment` property."
- id: swift.argparser_argument
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  trust: local
  tag: local-input
  payload_types: [text]
  packages: [ArgumentParser]
  match:
    kind: read
    target:
      name: Argument
  description: "Disabled - swift-argument-parser @Argument/@Option are property wrappers; not directly observable as reads without annotation support."

- id: swift.ui.text_field_text
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  trust: local
  tag: ui-input
  payload_types: [text]
  match:
    kind: read
    target:
      name: text
  description: "Disabled - bare `.text` read matches too broadly without receiver narrowing to UITextField."

- id: swift.ui.textview_text
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  trust: local
  tag: ui-input
  payload_types: [text]
  match:
    kind: read
    target:
      name: string
  description: "Disabled - NSTextView.string overlaps with every Swift String."

- id: swift.ui.textfield_text
  enabled: true
  language: swift
  trust: local
  tag: ui-input
  payload_types: [text]
  match:
    kind: read
    target:
      name: text
      receiver_type_in: [UITextField]
  match_examples:
  - name: uitextfield text read
    code: |
      import UIKit
      func run(field: UITextField) -> String? {
        let t = field.text
        return t
      }
  description: "UITextField.text - user-entered text read on a typed UITextField receiver."

- id: swift.ui.textview_string
  enabled: true
  language: swift
  trust: local
  tag: ui-input
  payload_types: [text]
  match:
    kind: read
    target:
      name: string
      receiver_type_in: [NSTextView]
  match_examples:
  - name: nstextview string read
    code: |
      import AppKit
      func run(view: NSTextView) -> String {
        let s = view.string
        return s
      }
  description: "NSTextView.string - user-entered text read on a typed NSTextView receiver."

- id: swift.swiftui.textfield_binding
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  trust: local
  tag: ui-input
  payload_types: [text]
  frameworks: [swiftui]
  match:
    kind: call
    callee:
      attribute: [TextField, init]
  description: "Disabled - SwiftUI TextField(_:text:) binds a local @State string; match fires on the declaration rather than the read, and property-wrapper flow isn't tracked."
