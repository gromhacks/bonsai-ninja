- id: swift.uipasteboard_value_read
  enabled: true
  language: swift
  trust: local
  tag: clipboard-input
  payload_types: [text, binary, url]
  packages: [UIKit]
  match:
    kind: read
    target:
      regex: "(?:^|\\.)(?:string|strings|items|url|urls)$"
      base_name_not_in: [UIPasteboard]
      receiver_type_in: [UIPasteboard]
  match_examples:
  - name: typed clipboard string read
    code: |
      import UIKit
      func read(board: UIPasteboard) -> String? { board.string }
    expect_match_text: [board.string]
  - name: unrelated string property negative
    code: |
      import UIKit
      struct Document { let string: String }
      func read(document: Document) -> String { document.string }
    expect_no_match: true
  description: "UIPasteboard string/strings/items/url/urls property reads return clipboard or cross-application paste content on a compiler-typed instance receiver; the imported singleton chain is modeled separately."

- id: swift.uipasteboard_general_value_read
  enabled: true
  language: swift
  trust: local
  tag: clipboard-input
  payload_types: [text, binary, url]
  packages: [UIKit]
  match:
    kind: read
    target:
      regex: '^UIPasteboard\.general\.(?:string|strings|items|url|urls)$'
  match_examples:
  - name: UIKit singleton clipboard URL read
    code: |
      import UIKit
      func read() -> URL? { UIPasteboard.general.url }
    expect_match_text: [UIPasteboard.general.url]
  - name: local singleton-shaped type negative
    code: |
      import UIKit
      struct LocalPasteboard { let url: URL? }
      struct UIPasteboard { static let general = LocalPasteboard(url: nil) }
      func read() -> URL? { UIPasteboard.general.url }
    expect_no_match: true
  description: "An exact UIKit UIPasteboard.general value-property read returns clipboard or cross-application paste content; imported binding identity prevents local singleton-shaped types from matching."
