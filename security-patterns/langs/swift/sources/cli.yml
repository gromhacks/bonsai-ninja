  trust: local
  tag: ui-input
  payload_types: [text]
  match:
    kind: read
    target:
      name: string
      receiver_type_in: [NSTextView]
  match_examples:
  - name: nstextview string read
    code: |
      import AppKit
      func run(view: NSTextView) -> String {
        let s = view.string
        return s
      }
  description: "NSTextView.string - user-entered text read on a typed NSTextView receiver."

- id: swift.ui.uitextview_text
  enabled: true
  language: swift
  trust: local
  tag: ui-input
  payload_types: [text]
  packages: [UIKit]
  match:
    kind: read
    target:
      name: text
      receiver_type_in: [UITextView]
  match_examples:
  - name: uitextview text read
    code: |
      import UIKit
      func run(view: UITextView) -> String { view.text }
    expect_match_text: [view.text]
  - name: unrelated text property negative
    code: |
      import UIKit
      struct Label { let text: String }
      func run(label: Label) -> String { label.text }
    expect_no_match: true
  description: "UITextView.text returns user-entered text from a compiler-typed UITextView receiver."

- id: swift.uipasteboard_value_read
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: swift
  trust: local
  tag: clipboard-input
  payload_types: [text, binary, url]
  packages: [UIKit]
  match:
    kind: read
    target:
      regex: "^(string|strings|items|url|urls)$"
      receiver_type_in: [UIPasteboard]
  match_examples:
  - name: typed clipboard string read
    code: |
      import UIKit
      func read(board: UIPasteboard) -> String? { board.string }
    expect_match_text: [board.string]
  - name: unrelated string property negative
    code: |
      import UIKit
      struct Document { let string: String }
      func read(document: Document) -> String { document.string }
    expect_no_match: true
  description: "Disabled pending Swift receiver-type facts for UIPasteboard property reads. UIPasteboard.general itself is not a source, and a bare string/items/url property would overmatch."

- id: swift.swiftui.textfield_binding
  enabled: false
  disabled_reason:
    code: over-broad
  language: swift
  trust: local
  tag: ui-input
  payload_types: [text]
  frameworks: [swiftui]
  match:
    kind: call
    callee:
      attribute: [TextField, init]
  description: "Disabled - SwiftUI TextField(_:text:) binds a local @State string; match fires on the declaration rather than the read, and property-wrapper flow isn't tracked."
