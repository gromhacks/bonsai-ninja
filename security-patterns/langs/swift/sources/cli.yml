# Swift CLI/local-trust sources.
- id: swift.notif.user_info
  enabled: true
  language: swift
  trust: local
  tag: local-input
  payload_types: [json]
  packages: [Foundation]
  match:
    kind: read
    target:
      name: userInfo
      receiver_type_in: [Notification]
  match_examples:
  - name: in process notification payload
    code: |
      import Foundation
      func handle(notification: Notification) -> [AnyHashable: Any]? { notification.userInfo }
    expect_match_text: [notification.userInfo]
  - name: unrelated user info field negative
    code: |
      import Foundation
      struct Account { let userInfo: [String: String] }
      func handle(account: Account) -> [String: String] { account.userInfo }
    expect_no_match: true
  description: "Notification.userInfo is an in-process observer payload with local trust. DistributedNotificationCenter needs a separate ownership-qualified IPC rule."

- id: swift.cli.argv
  enabled: true
  language: swift
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: read
    target:
      attribute: [CommandLine, arguments]
  match_examples:
  - name: command line arguments read
    code: |
      import Foundation
      func run() -> [String] {
        let a = CommandLine.arguments
        return a
      }
  description: "CommandLine.arguments - process argv read via the `CommandLine.arguments` static property."
- id: swift.cli.readline
  enabled: true
  language: swift
  trust: local
  tag: local-input
  payload_types: [text]
  match:
    kind: call
    callee:
      name: readLine
  match_examples:
    - name: declared shape
      code: |
        func test() { let input = "x"; let amount = 1; readLine(input) }
  description: "readLine() - stdin."
- id: swift.os.environment
  enabled: true
  language: swift
  trust: local
  tag: local-input
  payload_types: [text]
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: read
    target:
      attribute: [ProcessInfo, processInfo, environment]
  match_examples:
  - name: process info environment read
    code: |
      import Foundation
      func run() -> [String: String] {
        let e = ProcessInfo.processInfo.environment
        return e
      }
  description: "ProcessInfo.processInfo.environment - process environment variables read via the `environment` property."
- id: swift.ui.textfield_text
  enabled: true
  language: swift
  trust: local
  tag: ui-input
  payload_types: [text]
  match:
    kind: read
    target:
      name: text
      receiver_type_in: [UITextField]
  match_examples:
  - name: uitextfield text read
    code: |
      import UIKit
      func run(field: UITextField) -> String? {
        let t = field.text
        return t
      }
  - name: same text property on unrelated receiver negative
    code: |
      import UIKit
      struct SearchState { let text: String }
      func run(field: SearchState) -> String { field.text }
    expect_no_match: true
  description: "UITextField.text - user-entered text read on a typed UITextField receiver."

