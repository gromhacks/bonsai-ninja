# Swift physical sensor sources.
- id: swift.physical.coremotion_latest_sample
  enabled: true
  language: swift
  trust: physical
  tag: hw-input
  category: hardware-io
  payload_types: [sensor-frame]
  packages: [CoreMotion]
  match:
    kind: read
    target:
      regex: "^[A-Za-z_$][A-Za-z0-9_$]*\\.(accelerometerData|gyroData|magnetometerData|deviceMotion)$"
      receiver_type_in: [CMMotionManager]
  match_examples:
  - name: swift core motion sample
    code: |
      import CoreMotion
      func sample(manager: CMMotionManager) -> CMAccelerometerData? { manager.accelerometerData }
    expect_match_text: [manager.accelerometerData]
  - name: unrelated motion property negative
    code: |
      import CoreMotion
      struct Playback { let deviceMotion: String }
      func sample(playback: Playback) -> String { playback.deviceMotion }
    expect_no_match: true
  description: "CMMotionManager accelerometerData/gyroData/magnetometerData/deviceMotion returns the latest sample from device motion sensors."
