# Swift cloud-trust sources (AWS Lambda Swift runtime, etc.).
- id: swift.cloud.aws_lambda_event
  enabled: true
  language: swift
  trust: service
  tag: cloud-input
  payload_types: [json]
  packages: ["AWSLambdaRuntime"]
  match:
    kind: call
    callee:
      name: LambdaRuntime
  constraints:
  - arg_count: 1
  - arg_is_inline_callback: 0
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 0
      source_param_indices: [0]
  match_examples:
  - name: AWS Lambda runtime event closure
    code: |
      import AWSLambdaRuntime
      struct Event: Decodable { let body: String }
      struct Reply: Encodable { let ok: Bool }
      let runtime = LambdaRuntime { (event: Event, context: LambdaContext) in
        sink(event.body)
        return Reply(ok: true)
      }
    expect_match_text: [LambdaRuntime]
  - name: application runtime closure is not an AWS event
    code: |
      import AWSLambdaRuntime
      struct LocalRuntime { init(_ handler: (String) -> Void) {} }
      let runtime = LocalRuntime { value in sink(value) }
    expect_no_match: true
  description: "AWSLambdaRuntime LambdaRuntime(handler) supplies the decoded invocation event as closure parameter zero; the constructed runtime object is not sourced."
