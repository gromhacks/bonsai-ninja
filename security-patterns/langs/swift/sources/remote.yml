- id: swift.vapor.route_handler_request
  enabled: true
  language: swift
  trust: remote
  tag: http-input
  category: http-input
  payload_types: [url, path, query, header, form, multipart, binary, json, text]
  frameworks: [vapor]
  packages: [Vapor]
  match:
    kind: call
    callee:
      regex: '(?:^|\.)(?:get|post|put|patch|delete|options|head)$'
  constraints:
  - receiver_type_in: [RoutesBuilder]
  - arg_count: 2
  - arg_is_inline_callback: 1
  taint_semantics:
    source_callback_only: true
    source_callback_args:
    - callback_arg_index: 1
      source_param_indices: [0]
  match_examples:
  - name: Vapor one-component route handler request
    code: |
      import Vapor
      func boot(routes: RoutesBuilder) throws {
        routes.post("restore") { request async throws -> String in request.body.string ?? "" }
      }
    expect_match_text: [routes.post]
  - name: local route builder collision negative
    code: |
      struct RoutesBuilder { func post(_ path: String, _ body: (String) -> String) {} }
      func boot(routes: RoutesBuilder) {
        routes.post("restore") { value in value }
      }
    expect_no_match: true
  description: "A compiler-typed Vapor RoutesBuilder one-component route registration supplies the inbound Request as callback parameter zero; the callback result is never sourced."

