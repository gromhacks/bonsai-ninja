- id: swift.urlsession_response_data
  enabled: true
  language: swift
  trust: remote
  tag: network-response
  payload_types: [text, json]
  match:
    kind: call
    callee:
      regex: "\\.data$"
  constraints:
  - receiver_type_in: [URLSession]
  - min_args: 1
  - max_args: 1
  match_examples:
  - name: declared shape
    code: |
      import Foundation
      func test(session: URLSession, request: URLRequest) async throws {
        let (data, _) = try await session.data(for: request)
        _ = data
      }
    expect_match_text: [session.data]
  - name: unrelated session method negative
    code: |
      import Foundation
      func test(session: URLSession) { session.invalidateAndCancel() }
    expect_no_match: true
  description: "URLSession.data(for:/from:) returns remote response Data on a compiler-typed URLSession receiver."

- id: swift.nio.channel_read
  enabled: true
  language: swift
  trust: remote
  tag: network-input
  payload_types: [text]
  frameworks: ["swift-nio"]
  packages: ["NIO"]
  match:
    kind: param
    target:
      regex: "^[A-Za-z_][A-Za-z0-9_]*$"
      in_method: [channelRead]
      param_index_in: [1]
      param_type_in: [NIOAny]
  match_examples:
  - name: nio channel read
    code: |
      import NIO
      final class Handler: ChannelInboundHandler {
        func channelRead(context: ChannelHandlerContext, data: NIOAny) { consume(data) }
      }
    expect_match_text: [data]
  - name: ordinary nioany parameter negative
    code: |
      import NIO
      func transform(data: NIOAny) { consume(data) }
    expect_no_match: true
  description: "The NIOAny parameter at index 1 of ChannelInboundHandler.channelRead(context:data:) carries inbound channel bytes/messages. Outbound fireChannelRead calls are not sources."

