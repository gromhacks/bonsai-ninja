# Swift remote-trust sources - Vapor / Hummingbird / URLSession / Perfect / Kitura.
#
# Vapor is the dominant server-side Swift framework; Hummingbird is its
# async competitor. Both expose request data through attribute-read
# and decode-call shapes. We target the specific receiver-qualified
# call sites (Request.query.decode, Request.content.decode, etc.) so
# the match doesn't leak into unrelated `.decode` calls on Codable
# types.
#
# -- Adapter coverage notes (audited 2026-04) ---------------------------------
# Swift HTTP frameworks (Vapor, Hummingbird, Perfect, Kitura) expose almost
# every request surface as a property access on `Request` (req.query,
# req.content, req.headers, req.parameters, req.cookies, req.body). The
# shared adapter kit now emits member-access reads for the Vapor shapes
# below, so those rules are enabled. Framework/callback shapes that still
# need result binding or semantic receiver facts remain disabled. Per
# docs/pattern-guide.mdx the fix for unsupported shapes is in the Swift
# adapter, not YAML.
#
# Below this header: callable-shape rules plus enabled Vapor property-read
# rules that work today.

- id: swift.vapor.request_content_decode
  enabled: true
  language: swift
  trust: remote
  tag: http-input
  frameworks: [vapor]
  packages: [Vapor]
  match:
    kind: call
    callee:
      attribute: [content, decode]
  match_examples:
  - name: declared shape
    code: |
      import Vapor
      func test() { let input = "x"; let amount = 1; content.decode(input) }
  - name: unrelated decode receiver negative
    code: |
      import Vapor
      func test() { let input = "x"; cache.decode(input) }
    expect_no_match: true
  description: "Vapor req.content.decode(T.self) - decodes the request body into a model; payload is attacker-controlled."

