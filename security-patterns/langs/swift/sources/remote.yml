  language: swift
  trust: remote
  tag: network-input
  payload_types: [text]
  frameworks: ["swift-nio"]
  packages: ["NIO"]
  match:
    kind: call
    callee:
      attribute: [ChannelHandlerContext, fireChannelRead]
  match_examples:
  - name: nio channel read
    code: |
      import NIO
      func test(input: Any) { ChannelHandlerContext.fireChannelRead(input) }
    expect_match_text: [ChannelHandlerContext.fireChannelRead]
  - name: unrelated fireChannelRead receiver negative
    code: |
      import NIO
      func test(input: Any) { other.fireChannelRead(input) }
    expect_no_match: true
  description: "SwiftNIO ChannelHandlerContext.fireChannelRead(_:) - inbound network bytes/messages; local receiver calls require semantic ChannelHandlerContext receiver-type facts."

