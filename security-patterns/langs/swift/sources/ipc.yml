# Swift IPC / cross-process input sources.
- id: swift.notif.user_info
  enabled: true
  language: swift
  trust: ipc
  tag: ipc-input
  payload_types: [json]
  match:
    kind: read
    target:
      name: userInfo
      receiver_type_in: [Notification]
  match_examples:
  - name: notification user info read
    code: |
      import Foundation
      func handle(notification: Notification) -> [AnyHashable: Any]? {
        let u = notification.userInfo
        return u
      }
  description: "Notification.userInfo - cross-process notification payload read via the `userInfo` dictionary on a typed Notification receiver."
