# Swift queue/messaging sources (less common in Swift ecosystem).
- id: swift.source.kafka_consumer_messages
  enabled: true
  language: swift
  trust: service
  tag: queue-input
  payload_types: [queue-message, binary]
  packages: [Kafka, swift-kafka-client]
  imports: [Kafka]
  match:
    kind: read
    target:
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.messages$'
      receiver_type_in: [KafkaConsumer]
  match_examples:
  - name: Swift Kafka consumer message sequence
    code: |
      import Kafka
      func consume(_ consumer: KafkaConsumer) async throws {
        for try await message in consumer.messages {
          sink(message)
        }
      }
    expect_match_text: [consumer.messages]
  - name: local messages property is not Kafka input
    code: |
      import Kafka
      struct LocalInbox { let messages: [String] }
      func consume(_ inbox: LocalInbox) {
        for message in inbox.messages { sink(message) }
      }
    expect_no_match: true
  description: "swift-kafka-client KafkaConsumer.messages is the AsyncSequence of broker-delivered records on a compiler-typed consumer."
