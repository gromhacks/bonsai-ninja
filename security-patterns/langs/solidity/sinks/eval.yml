# Solidity code-injection / eval-equivalent sinks.

- id: solidity.eval.inline_assembly_call
  enabled: true
  language: solidity
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^call$"
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
    - name: tainted yul call target
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { assembly { call(gas(), target, 0, 0, 0, 0, 0) } } }
    - name: literal yul call target negative
      code: |
        pragma solidity ^0.8.0;
        contract App { function test() public { assembly { call(gas(), 0, 0, 0, 0, 0, 0) } } }
      expect_no_match: true
  description: "Yul inline-assembly `call(gas(), target, ...)` — dispatches to an attacker-controlled address when the target operand is tainted. The adapter lowers assembly-block Yul calls into normal call facts; min_args scopes this to the EVM opcode shape rather than high-level Solidity member calls."
