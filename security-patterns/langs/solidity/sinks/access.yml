        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { setOwner(input); } }
  description: "setOwner(addr) — rewrites the privileged owner slot; unrestricted variant is a full takeover primitive."
- id: solidity.access.withdraw
  enabled: true
  language: solidity
  tag: access-control
  severity: high
  cwe: [CWE-284]
  match:
    kind: call
    callee:
      name: withdraw
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { withdraw(input); } }
  description: "withdraw(...) — moves contract-held funds out; must restrict to caller's own balance or an authz role, else attackers drain the contract."
- id: solidity.access.pause
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: solidity
  tag: access-control
  severity: medium
  cwe: [CWE-284]
  match:
    kind: call
    callee:
      name: pause
  description: "Disabled — pause is often intentionally public for emergency; re-enable only with modifier analysis."
