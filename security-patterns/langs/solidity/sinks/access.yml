- id: solidity.access.transfer_ownership
  enabled: true
  language: solidity
  tag: access-control
  severity: high
  cwe: [CWE-284]
  match:
    kind: call
    callee:
      name: transferOwnership
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { transferOwnership(input); } }
  description: "transferOwnership(newOwner) — privileged state change; unauthenticated callers can seize the contract. Requires onlyOwner / role guard."
- id: solidity.access.mint
  enabled: true
  language: solidity
  tag: access-control
  severity: high
  cwe: [CWE-284]
  match:
    kind: call
    callee:
      name: mint
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { mint(input); } }
  description: "mint(to, amount) — arbitrary supply inflation breaks token economics; must be authz-gated (onlyOwner / MINTER_ROLE)."
- id: solidity.access.burn
  enabled: true
  language: solidity
  tag: access-control
  severity: high
  cwe: [CWE-284]
  match:
    kind: call
    callee:
      name: burn
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { burn(input); } }
  description: "burn(from, amount) — destroys balances; if not restricted to from==msg.sender or authz role, attackers can burn arbitrary holders."
- id: solidity.access.set_owner
