# CREATE2 family — deterministic-address deployment sinks.
#
# CREATE2 derives the deployed address from
#   keccak256(0xff, deployer, salt, keccak256(initcode))[12..]
# so a contract at a known address can be:
#   * pre-computed by an attacker (front-run / address-squatting),
#   * re-deployed at the same address after selfdestruct (logic
#     swap / proxy substitution).
# Both hazards require attacker control of `salt` (or `initcode`).
- id: solidity.create2.attacker_controlled_salt
  enabled: true
  language: solidity
  tag: address-squatting
  severity: high
  cwe: [CWE-345]
  match:
    kind: call
    callee:
      name: create2
  constraints:
  - arg_tainted:
      index: 3
  match_examples:
  - name: tainted create2 salt
    code: |
      pragma solidity ^0.8.0;
      contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(bytes32 salt) public { assembly { create2(0, 0, 0, salt) } } }
  - name: literal create2 salt negative
    code: |
      pragma solidity ^0.8.0;
      contract App { function test() public { assembly { create2(0, 0, 0, 0) } } }
    expect_no_match: true
  description: "CREATE2 with attacker-controlled salt — address is deterministic from (deployer, salt, initcode). Attacker can squat the address ahead of deployment, or (post-selfdestruct) redeploy different code at a previously-trusted address."
- id: solidity.create2.openzeppelin_create2
  enabled: true
  language: solidity
  tag: address-squatting
  severity: high
  cwe: [CWE-345]
  packages: ["@openzeppelin/contracts"]
  match:
    kind: call
    callee:
      name: deploy
  constraints:
  - arg_tainted:
      index: 1
  match_examples:
  - name: tainted openzeppelin create2 salt
    code: |
      pragma solidity ^0.8.0;
      import "@openzeppelin/contracts/Foo.sol";
      contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(bytes32 salt, bytes memory data) public { deploy(0, salt, data); } }
  - name: literal openzeppelin create2 salt negative
    code: |
      pragma solidity ^0.8.0;
      import "@openzeppelin/contracts/Foo.sol";
      contract App { function test(bytes memory data) public { deploy(0, bytes32(0), data); } }
    expect_no_match: true
  description: "OZ Create2.deploy(amount, salt, bytecode) — same address-squatting hazards as raw CREATE2 when salt is attacker-influenced."
