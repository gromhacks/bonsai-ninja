- id: solidity.selfdestruct.call
  enabled: true
  language: solidity
  tag: access-control
  category: source-independent
  severity: critical
  cwe: [CWE-284]
  match:
    kind: call
    callee:
      name: selfdestruct
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { selfdestruct(input); } }
  description: "selfdestruct(recipient) - erases code, forwards entire balance to recipient. Unauthenticated caller = bricked contract + stolen funds."
- id: solidity.selfdestruct.suicide_legacy
  enabled: true
  language: solidity
  tag: access-control
  category: source-independent
  severity: critical
  cwe: [CWE-284]
  match:
    kind: call
    callee:
      name: suicide
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { suicide(input); } }
  description: "Deprecated `suicide(recipient)` - pre-0.5 alias of selfdestruct; same contract-destroy + balance-forward hazard."
