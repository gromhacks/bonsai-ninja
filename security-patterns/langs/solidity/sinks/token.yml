# Untrusted-ERC20 transfer sinks.
#
# transferFrom and safeTransferFrom move tokens from `from` to `to`
# using the caller's allowance. When `from` is attacker-controlled, the
# call is benign (attacker only spends own allowance). When `from` is
# user-supplied AND the token contract address is also user-supplied
# (e.g. generic vault deposit), the call interacts with arbitrary
# bytecode at the token address — reentrancy, malicious token hooks,
# fee-on-transfer accounting bugs. The taint we care about is the
# token-address argument, not the amount.
- id: solidity.token.transfer_from_untrusted
  enabled: true
  language: solidity
  tag: untrusted-token
  severity: high
  cwe: [CWE-829]
  match:
    kind: call
    callee:
      name: transferFrom
  match_examples:
  - name: declared shape
    code: |
      pragma solidity ^0.8.0;
      contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { transferFrom(input); } }
  description: "ERC20.transferFrom(from, to, amount) — when invoked on an attacker-supplied token address, the call dispatches into arbitrary bytecode and may reenter, lie about the transferred amount (fee-on-transfer / rebasing), or revert selectively. Pair with allowlist of trusted token addresses or a balance-delta accounting wrapper."
- id: solidity.token.safe_transfer_from_untrusted
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: solidity
  tag: untrusted-token
  severity: medium
  cwe: [CWE-829]
  packages: ["@openzeppelin/contracts"]
  match:
    kind: call
    callee:
      name: safeTransferFrom
  description: "Disabled — OZ SafeERC20.safeTransferFrom is also a sanitizer (return-value checked). Re-enable as an audit-only sink when receiver-typing can distinguish the SafeERC20-library call from the underlying low-level transferFrom; until then the sanitizer rule wins."
- id: solidity.token.superfluid_decode_ctx
  enabled: true
  language: solidity
  tag: context-injection
  severity: high
  cwe: [CWE-20]
  packages: ["@superfluid-finance/ethereum-contracts"]
  match:
    kind: call
    callee:
      name: decodeCtx
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: superfluid context decode
    code: |
      pragma solidity ^0.8.0;
      import "@superfluid-finance/ethereum-contracts/Foo.sol";
      contract App { function test(address agreement, bytes memory ctx) public { agreement.decodeCtx(ctx); } }
  - name: literal superfluid context negative
    code: |
      pragma solidity ^0.8.0;
      import "@superfluid-finance/ethereum-contracts/Foo.sol";
      contract App { function test(address agreement) public { agreement.decodeCtx(hex""); } }
    expect_no_match: true
  description: "Superfluid decodeCtx(ctx) parses user-controllable context bytes. Review callers for trusted-host validation before using decoded sender/account fields."
