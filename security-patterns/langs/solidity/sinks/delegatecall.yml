# delegatecall family - proxy-hijack / arbitrary-storage-write sinks.
#
# delegatecall executes the target's bytecode in THIS contract's
# storage and msg context. A tainted target address gives the attacker
# arbitrary write access to every storage slot - including the
# implementation-pointer slot in EIP-1967 proxies (proxy hijack), the
# owner slot, and the balance accounting. Severity is `critical`
# regardless of payload because target-control alone is fatal.
- id: solidity.delegatecall.unrestricted
  enabled: true
  language: solidity
  tag: access-control
  severity: critical
  cwe: [CWE-829, CWE-94]
  match:
    kind: call
    callee:
      name: delegatecall
  constraints:
  - receiver_tainted: true
  match_examples:
    - name: tainted delegatecall target
      code: |
        pragma solidity ^0.8.0;
        contract App { function test(address target) public { target.delegatecall(""); } }
    - name: literal delegatecall target negative
      code: |
        pragma solidity ^0.8.0;
        contract App { function test() public { address(0).delegatecall(""); } }
      expect_no_match: true
  description: "delegatecall(target, data) executes target's code in THIS contract's storage/context - a tainted target gains full write access to state, owner slot, implementation slot, and balance (arbitrary takeover / proxy hijack)."
- id: solidity.delegatecall.oz_function_delegate_call
  enabled: true
  language: solidity
  tag: access-control
  severity: critical
  cwe: [CWE-829, CWE-94]
  packages: ["@openzeppelin/contracts"]
  match:
    kind: call
    callee:
      name: functionDelegateCall
  constraints:
  - receiver_tainted: true
  match_examples:
    - name: tainted oz function delegate call target
      code: |
        pragma solidity ^0.8.0;
        import "@openzeppelin/contracts/utils/Address.sol";
        contract App { function test(address target, bytes memory data) public { target.functionDelegateCall(data); } }
    - name: literal oz function delegate call target negative
      code: |
        pragma solidity ^0.8.0;
        import "@openzeppelin/contracts/utils/Address.sol";
        contract App { function test(bytes memory data) public { address(0).functionDelegateCall(data); } }
      expect_no_match: true
  description: "OZ Address.functionDelegateCall(target, data) - library wrapper around delegatecall with the same proxy-hijack / arbitrary-storage-write hazard. A tainted target executes attacker code in this contract's storage/context."
- id: solidity.delegatecall.callcode_legacy
  enabled: true
  language: solidity
  tag: access-control
  severity: critical
  cwe: [CWE-829, CWE-94]
  match:
    kind: call
    callee:
      name: callcode
  constraints:
  - receiver_tainted: true
  match_examples:
    - name: tainted callcode target
      code: |
        pragma solidity ^0.8.0;
        contract App { function test(address target) public { target.callcode(""); } }
    - name: literal callcode target negative
      code: |
        pragma solidity ^0.8.0;
        contract App { function test() public { address(0).callcode(""); } }
      expect_no_match: true
  description: "Deprecated `callcode` - same hazards as delegatecall (pre-0.5 alias)."
- id: solidity.delegatecall.assembly_opcode
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: solidity.delegatecall.unrestricted
  language: solidity
  tag: access-control
  severity: critical
  cwe: [CWE-829, CWE-94]
  match:
    kind: call
    callee:
      name: delegatecall
  description: "Disabled - placeholder for inline-assembly `delegatecall(gas, addr, in, insize, out, outsize)` opcode. Solidity inline-assembly bodies use the same identifier `delegatecall`, so the v1 matcher already fires on the assembly form via solidity.delegatecall.unrestricted. Re-enable as a distinct rule once the adapter exposes assembly-block context so we can split severity/remediation."

# `address(this).call(<calldata-derived bytes>)` - selector dispatch
# off attacker-controlled bytes is code injection (CWE-94 family):
# the contract's own functions get invoked with attacker-chosen
# selector + args, bypassing public ABI guards. Distinct from
# `delegatecall` (which targets external code) and from generic
# `*.call` (covered by reentrancy rules).
- id: solidity.code.self_call_dispatch
  enabled: false
  disabled_reason:
    code: over-broad
  language: solidity
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: ["this", call]
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { this.call(input); } }
  description: "Disabled duplicate - current matcher facts cannot exclude `this.call(...)` from the generic low-level `.call(...)` reentrancy sink. Re-enable once receiver-negative constraints or Solidity receiver typing can split self-dispatch from arbitrary address calls."
