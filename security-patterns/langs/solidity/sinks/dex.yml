- id: solidity.dex.uniswap_v2_swap
  enabled: true
  language: solidity
  tag: slippage
  severity: high
  cwe: [CWE-682]
  match:
    kind: call
    callee:
      regex: "(^|\\.)(swapExactTokensForTokens|swapExactTokensForTokensSupportingFeeOnTransferTokens|swapExactTokensForETH|swapExactTokensForETHSupportingFeeOnTransferTokens|swapExactETHForTokens|swapExactETHForTokensSupportingFeeOnTransferTokens|swapTokensForExactTokens|swapTokensForExactETH|swapETHForExactTokens)$"
  match_examples:
    - name: router swap
      code: |
        pragma solidity ^0.8.0;
        interface Router { function swapExactTokensForTokens(uint256 amountIn, uint256 amountOutMin, address[] memory path, address to, uint256 deadline) external returns (uint256[] memory); }
        contract App { function test(Router router, uint256 amountIn, uint256 amountOutMin, address[] memory path, address to, uint256 deadline) public { router.swapExactTokensForTokens(amountIn, amountOutMin, path, to, deadline); } }
  description: "Uniswap V2-style router swap. Review slippage limits, path trust, recipient, and deadline; a zero or attacker-controlled minimum output can be sandwiched."
- id: solidity.dex.uniswap_v3_exact_input
  enabled: true
  language: solidity
  tag: slippage
  severity: high
  cwe: [CWE-682]
  match:
    kind: call
    callee:
      regex: "(^|\\.)(exactInput|exactInputSingle|exactOutput|exactOutputSingle)$"
  match_examples:
    - name: v3 exact input
      code: |
        pragma solidity ^0.8.0;
        interface V3Router { function exactInput(bytes memory params) external returns (uint256); }
        contract App { function test(V3Router router, bytes memory params) public { router.exactInput(params); } }
  description: "Uniswap V3 exactInput/exactOutput swap. Review amountOutMinimum/amountInMaximum, path construction, recipient, and deadline."
- id: solidity.dex.pool_swap
  enabled: true
  language: solidity
  tag: slippage
  severity: high
  cwe: [CWE-682]
  match:
    kind: call
    callee:
      regex: "(^|\\.)swap$"
  match_examples:
    - name: pool swap
      code: |
        pragma solidity ^0.8.0;
        interface Pool { function swap(address recipient, bool zeroForOne, int256 amountSpecified, uint160 sqrtPriceLimitX96, bytes memory data) external returns (int256, int256); }
        contract App { function test(Pool pool, address recipient, bool zeroForOne, int256 amountSpecified, uint160 sqrtPriceLimitX96, bytes memory data) public { pool.swap(recipient, zeroForOne, amountSpecified, sqrtPriceLimitX96, data); } }
  description: "Direct AMM pool swap. Review price limits and callback handling; zero or attacker-controlled price limits can remove slippage protection."
