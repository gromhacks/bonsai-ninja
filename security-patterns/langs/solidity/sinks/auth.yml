# Auth-bypass family.
- id: solidity.auth.tx_origin
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: solidity.tx.origin
  language: solidity
  tag: access-control
  severity: high
  cwe: [CWE-284]
  match:
    kind: read
    target:
      name: origin
  description: "Disabled - duplicate of solidity.tx.origin source (same `read name: origin` shape). The source rule (with trust/phishing classification) already fires on every tx.origin read; the analyst will see tx.origin flowing into an auth comparison in the flow report. Encoding this as a sink without structural context (require/==) would double-count."
- id: solidity.auth.extcodesize_eoa_check
  enabled: true
  language: solidity
  tag: access-control
  category: source-independent
  severity: medium
  cwe: [CWE-287]
  match:
    kind: call
    callee:
      name: extcodesize
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { extcodesize(input); } }
    - name: unrelated callee negative
      code: |
        pragma solidity ^0.8.0;
        contract App { function test(address input) public view returns (uint256) { return input.balance; } }
      expect_no_match: true
  description: "extcodesize(addr) - used as an 'is-this-an-EOA' guard, but returns 0 for a contract that calls during its own constructor. Trivially bypassed by performing the protected action from a constructor. Use tx.origin == msg.sender (with care) or accept the attack surface."
- id: solidity.auth.is_contract_check
  enabled: false
  disabled_reason:
    code: over-broad
  language: solidity
  tag: access-control
  severity: low
  cwe: [CWE-287]
  packages: ["@openzeppelin/contracts"]
  match:
    kind: call
    callee:
      name: isContract
  description: "Disabled by default - OZ Address.isContract has the same constructor-bypass caveat as raw extcodesize. Enable in audits that ban the EOA-only pattern entirely."
