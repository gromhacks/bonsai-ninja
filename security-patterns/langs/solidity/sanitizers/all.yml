- id: solidity.sanitizer.openzeppelin_address_is_contract
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: solidity
  tag: validation
  packages: ["@openzeppelin/contracts"]
  match:
    kind: call
    callee:
      name: isContract
  description: "Disabled by default - OZ Address.isContract is commonly relied on as a sanitizer but returns FALSE for an address that calls during its own constructor (EIP-150 caveat). Enabling it as a sanitizer would silence true positives where attackers exploit the constructor-bypass. Re-enable only inside flows where constructor-time call is structurally impossible."
