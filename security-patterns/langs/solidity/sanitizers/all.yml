- id: solidity.sanitizer.require
  enabled: true
  language: solidity
  tag: validation
  match:
    kind: call
    callee:
      name: require
  constraints:
  - top_level: true
  match_examples:
  - name: declared shape
    code: |
      pragma solidity ^0.8.0;
      contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable target, bytes memory data, uint256 amount) public { require(input); } }
    expect_match_text: [require]
  - name: member require negative
    code: |
      pragma solidity ^0.8.0;
      contract App { function test(string memory input) public { obj.require(input); } }
    expect_no_match: true
  description: "require(cond, reason) - revert-on-false guard; canonical authz / precondition / input-validation sanitizer. Includes the inline `require(msg.sender == owner, ...)` pattern used by hand-rolled access control. `top_level: true` keeps it on the Solidity statement form and rejects unrelated `obj.require(...)` member calls that share the verb."
- id: solidity.sanitizer.assert
  enabled: true
  language: solidity
  tag: validation
  match:
    kind: call
    callee:
