# External-input sources for Solidity beyond msg/tx/block - function
# calldata params and cross-contract reads (oracle returns, ERC20
# allowances, bridged-asset balances) where the value originates
# outside the contract's own state and is therefore attacker-
# influenceable.
# solidity.calldata.input removed - required a bare-regex
# placeholder that fired on every parameter, not only external /
# public calldata. Re-add once the adapter exposes visibility-aware
# parameter facts (function visibility + data location).

- id: solidity.oracle.chainlink_latest_round_data
  enabled: true
  language: solidity
  trust: service
  tag: oracle-input
  match:
    kind: call
    callee:
      name: latestRoundData
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable dst, bytes memory payload, uint256 amount) public { latestRoundData(input); } }
  description: "Chainlink AggregatorV3Interface.latestRoundData() - returns (roundId, answer, startedAt, updatedAt, answeredInRound). Caller MUST verify answer > 0, updatedAt is fresh, and answeredInRound >= roundId; otherwise stale/negative price taints downstream pricing."

- id: solidity.oracle.chainlink_latest_answer
  enabled: true
  language: solidity
  trust: service
  tag: oracle-input
  match:
    kind: call
    callee:
      name: latestAnswer
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable dst, bytes memory payload, uint256 amount) public { latestAnswer(input); } }
  description: "Chainlink AggregatorV2.latestAnswer() - deprecated single-value oracle read; no freshness/round metadata. Treat returned price as untrusted-staleness."

- id: solidity.erc20.allowance_read
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: solidity
  trust: remote
  tag: token-input
  match:
    kind: call
    callee:
      name: allowance
  description: "Disabled - bare-name `allowance` overmatches non-ERC20 helpers. Re-enable with token-receiver scoping. ERC20.allowance(owner, spender) returns an attacker-controllable value when the caller is the spender; flowing it into transfer-amount math enables fee-on-transfer / front-run / unlimited-pull bugs."

- id: solidity.erc20.balance_of_read
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: solidity
  trust: remote
  tag: token-input
  match:
    kind: call
    callee:
      name: balanceOf
  description: "Disabled - bare-name `balanceOf` overmatches and is also legitimately used for accounting. Re-enable with token-receiver scoping. balanceOf(this) on a bridged / rebasing / fee-on-transfer asset is attacker-manipulable (donation attack, share-price inflation against empty-vault); treat as a tainted oracle for any vault/share-price math."

# Untrusted-address parameter source for external/public callers.
# Pairs with solidity.delegatecall.unrestricted (CWE-94) and
# solidity.reentrancy.call (CWE-841). Param-name match overmatches
# internal helpers; engine taint flow + the sink callee shape gates
# real findings.
- id: solidity.source.address_param
  enabled: true
  language: solidity
  trust: remote
  tag: calldata
  match:
    kind: param
    target:
      name: target
      decl_kind_in: [method]
      visibility_in: [public]
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { function test(address target) public { } }
  description: "External-function `address target` parameter - caller-controlled call target. Pairs with delegatecall (CWE-94 unrestricted-delegatecall) and call sinks (CWE-841 reentrancy)."

# Untrusted bytes-calldata parameter. Distinct from the removed
# solidity.calldata.input rule which used a tautology regex that
# fired on every parameter; this rule keys on the canonical `data`
# parameter name.
- id: solidity.source.bytes_calldata_param
  enabled: true
  language: solidity
  trust: remote
  tag: calldata
  match:
    kind: param
    target:
      name: data
      decl_kind_in: [method]
      visibility_in: [public]
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { function test(bytes calldata data) public { } }
  description: "External-function `bytes calldata data` parameter - peer-controlled raw bytes payload. Pairs with solidity.reentrancy.call (untrusted call data = arbitrary external contract dispatch)."
