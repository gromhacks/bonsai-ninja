- id: solidity.block.number
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: solidity
  trust: service
  tag: block-context
  match:
    kind: read
    target:
      name: number
  description: "Disabled - `.number` field name collides with too many ordinary struct/var reads (e.g. `token.number`, `req.number`); re-enable only with block-expression context (attribute chain [block, number])."
