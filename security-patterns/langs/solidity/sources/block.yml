# Solidity block-context sources.
#
# Every value in the `block` magic global is influenced by the block
# proposer/miner. Treat these as `service`-trust seeds: not
# attacker-from-network, but attacker-from-validator. Manipulation
# matters for: weak randomness, time-locks, fee math, MEV.
- id: solidity.block.timestamp
  enabled: true
  language: solidity
  trust: service
  tag: block-context
  match:
    kind: read
    target:
      name: timestamp
  match_examples:
    - name: declared shape
      code: |
        pragma solidity ^0.8.0;
        contract App { event Seen(string value); mapping(address => uint256) balances; mapping(address => uint256) allowances; mapping(address => address) owners; mapping(address => bool) whitelist; uint256 Balance; function test(string memory input, address payable dst, bytes memory payload, uint256 amount) public { uint256 result = uint256(block.timestamp); } }
    - name: unrelated field negative
      code: |
        pragma solidity ^0.8.0;
        contract App { uint256 height; function test() public { uint256 result = block.number; } }
      expect_no_match: true
  description: "block.timestamp - proposer-influenceable within ~15s drift. Unsafe as entropy source, deadline boundary, or strict ordering key."
