# Lua file-upload sinks (OpenResty lua-resty-upload).
- id: lua.upload.io_open_tainted_destination
  enabled: true
  language: lua
  tag: file-upload
  severity: high
  packages: [lua-resty-upload]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [io, open]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua-resty-upload tainted destination
    code: |
      local upload = require("lua-resty-upload")
      function example(input)
        io.open(input, "wb")
      end
  - name: lua-resty-upload literal destination negative
    code: |
      local upload = require("lua-resty-upload")
      function example(input)
        io.open("var/uploads/avatar.bin", "wb")
      end
    expect_no_match: true
  description: "Writing an upload to an attacker-controlled destination path can store executable or otherwise dangerous content outside the intended upload location. The lua-resty-upload package gate keeps this upload-specific classification off ordinary filesystem operations."

- id: lua.upload.resty_upload_filename
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: lua
  tag: file-upload
  severity: medium
  packages: [lua-resty-upload]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [upload, read]
  match_examples:
  - name: lua.upload.resty_upload_filename example
    code: |
      local _lua_resty_upload = require("lua-resty-upload")
      function example(input, url, id, payload, request, params, user)
        upload.read(input)
      end
  description: "Disabled until return-value/state tracking exists - upload:read() exposes a client filename, but the sink is the later filesystem write using that returned header."

- id: lua.upload.resty_upload_receive
  enabled: false
  disabled_reason:
    code: pending-adapter-fact
  language: lua
  tag: file-upload
  severity: medium
  packages: [lua-resty-upload]
  cwe: [CWE-434]
  match:
    kind: call
    callee:
      attribute: [form, read]
  match_examples:
  - name: lua resty upload form read
    code: |
      local _lua_resty_upload = require("lua-resty-upload")
      function example(input)
        form.read(input)
      end
    expect_match_text: [form.read]
  description: "Disabled until return-value/state tracking exists - form:read() exposes multipart metadata, but upload risk depends on a later write path."
