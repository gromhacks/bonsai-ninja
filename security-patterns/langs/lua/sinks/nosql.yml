  language: lua
  tag: nosql-injection
  severity: medium
  packages: [openresty]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      attribute: [red, script_load]
  description: "Disabled — script_load caches a script but does not execute it; the sink is eval/evalsha."
