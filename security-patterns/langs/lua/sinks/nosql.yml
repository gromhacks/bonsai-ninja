# Lua NoSQL-injection sinks (lua-resty-mongol / lua-resty-redis / mongorover).
- id: lua.nosql.resty_mongol_find
  enabled: true
  language: lua
  tag: nosql-injection
  severity: high
  packages: [lua-resty-mongol, mongorover]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]find$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.nosql.resty_mongol_find example
    code: |
      local _lua_resty_mongol = require("lua-resty-mongol")
      function example(input, url, id, payload, request, params, user)
        collection.find(payload)
      end
  - name: literal filter negative
    code: |
      local _lua_resty_mongol = require("lua-resty-mongol")
      function example(input, url, id, payload, request, params, user)
        collection.find({ name = "alice" })
      end
    expect_no_match: true
  description: "lua-resty-mongol collection:find(filter) — tainted filter table enables operator injection ($where / $ne)."

