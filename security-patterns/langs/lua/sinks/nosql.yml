- id: lua.nosql.cjson_encode_injection
  enabled: false
  disabled_reason:
    code: over-broad
  language: lua
  tag: nosql-injection
  severity: low
  packages: [cjson]
  cwe: [CWE-943]
  match:
    kind: call
    callee:
      attribute: [cjson, encode]
  description: "Disabled — cjson.encode is serialisation; only flag when output is embedded in a NoSQL query string."

- id: lua.nosql.openresty_cosocket_redis_script
  enabled: false
  disabled_reason:
