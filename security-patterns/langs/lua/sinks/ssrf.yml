# Lua SSRF sinks (OpenResty / lua-resty-http / LuaSocket / lua-requests).
- id: lua.ssrf.luaresty_http_request_uri
  enabled: true
  language: lua
  tag: ssrf
  severity: high
  frameworks: [openresty]
  packages: [lua-resty-http, resty.http]
  imports: [resty.http]
  cwe: [CWE-918, CWE-295]
  analysis_semantics:
    compiler_guard:
      capability: terminal-predicate.compound-static-allowlist
      required_evidence:
      - predicate-complete:true
      - finite-static-string-membership:true
      - extractor-call:match
      - extractor-value:string:^https://([^/]+)
      - guarded-argument:0=predicate-argument:0
      - guarded-static-field:1.redirect=boolean:false
      sanitizer_tag: ssrf
      category: finite-host-allowlist-and-no-redirect
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]request_uri$
      receiver_type_in: [RestyHttpClient]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.ssrf.luaresty_http_request_uri example
    code: |
      local http = require("resty.http")
      function example(input)
        local arbitrary_client = http.new()
        arbitrary_client:request_uri(input)
      end
  - name: literal url negative
    code: |
      local http = require("resty.http")
      function example()
        local arbitrary_client = http.new()
        arbitrary_client:request_uri("https://api.example.test/health")
      end
    expect_no_match: true
  - name: unrelated request_uri method is not lua-resty-http
    code: |
      local http = require("resty.http")
      function example(input)
        local arbitrary_client = LocalClient.new()
        arbitrary_client:request_uri(input)
      end
    expect_no_match: true
  description: "lua-resty-http httpc:request_uri(url) - tainted URL reaches arbitrary internal/cloud endpoint. TLS verification options require an independent configuration rule."

