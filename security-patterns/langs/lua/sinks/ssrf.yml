# Lua SSRF sinks (OpenResty / lua-resty-http / LuaSocket / lua-requests).
- id: lua.ssrf.luaresty_http_request_uri
  aliases:
  - lua.tls.resty_http_ssl_verify_false
  enabled: true
  language: lua
  tag: ssrf
  severity: high
  frameworks: [openresty]
  packages: [lua-resty-http]
  cwe: [CWE-918, CWE-295]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]request_uri$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.ssrf.luaresty_http_request_uri example
    code: |
      local _lua_resty_http = require("lua-resty-http")
      function example(input, url, id, payload, request, params, user)
        httpc.request_uri(input)
      end
  - name: literal url negative
    code: |
      local _lua_resty_http = require("lua-resty-http")
      function example(input, url, id, payload, request, params, user)
        httpc.request_uri("https://api.example.test/health")
      end
    expect_no_match: true
  description: "lua-resty-http httpc:request_uri(url) - tainted URL reaches arbitrary internal/cloud endpoint. Also covers merged aliases: lua.tls.resty_http_ssl_verify_false."

