    code: |
      local http = require("resty.http")
      function example(input)
        local arbitrary_client = http.new()
        arbitrary_client:request(input)
      end
  - name: literal request negative
    code: |
      local http = require("resty.http")
      function example(input)
        local arbitrary_client = http.new()
        arbitrary_client:request({ path = "/health" })
      end
    expect_no_match: true
  - name: unrelated request method is not lua-resty-http
    code: |
      local http = require("resty.http")
      function example(input)
        local arbitrary_client = LocalClient.new()
        arbitrary_client:request(input)
      end
    expect_no_match: true
  description: "lua-resty-http httpc:request{} - tainted URI/path hits arbitrary origin."

- id: lua.ssrf.ngx_location_capture
  enabled: true
  language: lua
  tag: ssrf
  severity: high
  frameworks: [openresty]
  cwe: [CWE-918]
  match:
    kind: call
    callee:
      attribute: [ngx, location, capture]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.ssrf.ngx_location_capture example
    code: |
      function example(input, url, id, payload, request, params, user)
        ngx.location.capture(input)
      end
  - name: literal path negative
    code: |
      function example(input, url, id, payload, request, params, user)
        ngx.location.capture("/health")
      end
    expect_no_match: true
  description: "ngx.location.capture(uri) - issues internal subrequest; tainted URI pivots to any internal location."

