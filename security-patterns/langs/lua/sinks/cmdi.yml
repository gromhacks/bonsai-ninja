- id: lua.cmdi.posix_spawn
  enabled: true
  language: lua
  tag: command-injection
  severity: critical
  packages: [luaposix]
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [posix, spawn]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.cmdi.posix_spawn example
    code: |
      local _luaposix = require("luaposix")
      function example(input, url, id, payload, request, params, user)
        posix.spawn(input)
      end
  - name: literal program negative
    code: |
      local _luaposix = require("luaposix")
      function example(input, url, id, payload, request, params, user)
        posix.spawn("/bin/true")
      end
    expect_no_match: true
  description: "luaposix posix.spawn - forks and execs; tainted argv/path becomes arbitrary process."

