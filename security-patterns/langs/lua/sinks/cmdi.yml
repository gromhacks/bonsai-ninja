# Lua command-injection + destructive-path sinks.
- id: lua.cmdi.os_execute
  enabled: true
  language: lua
  tag: command-injection
  severity: critical
  category: process-exec
  cwe: [CWE-78]
  match:
    kind: call
    callee:
      attribute: [os, execute]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.cmdi.os_execute example
    code: |
      function example(input, url, id, payload, request, params, user)
        os.execute(input)
      end
  - name: literal command negative
    code: |
      function example(input, url, id, payload, request, params, user)
        os.execute("safe")
      end
    expect_no_match: true
  description: "os.execute(cmd) - runs cmd via /bin/sh -c; tainted string yields shell injection."

