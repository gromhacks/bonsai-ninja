- id: lua.template.lapis_render
  enabled: true
  language: lua
  tag: ssti
  severity: high
  packages: [lapis]
  cwe: [CWE-1336]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:](render|render_html)$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.template.lapis_render example
    code: |
      local _lapis = require("lapis")
      function example(input, url, id, payload, request, params, user)
        self:render(input)
      end
  - name: literal view negative
    code: |
      local _lapis = require("lapis")
      function example(input, url, id, payload, request, params, user)
        self:render("profile")
      end
    expect_no_match: true
  description: "Lapis self:render / render_html — tainted view name enables traversal / render of attacker templates."

- id: lua.template.lapis_raw
  enabled: true
  language: lua
  tag: xss
  severity: high
  packages: [lapis]
  cwe: [CWE-79]
  match:
    kind: call
    callee:
      attribute: [html, raw]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.template.lapis_raw example
    code: |
      local _lapis = require("lapis")
      function example(input, url, id, payload, request, params, user)
        html.raw(payload)
      end
  - name: literal html negative
    code: |
      local _lapis = require("lapis")
      function example(input, url, id, payload, request, params, user)
        html.raw("<strong>ok</strong>")
      end
    expect_no_match: true
  description: "lapis.html raw(x) — emits x without HTML-escaping; tainted value = stored/reflected XSS."

# Templating engine autoescape disabled (T302). Config-shape
# sinks: when the developer explicitly turns off the engine's
# default HTML autoescape, every subsequent render is XSS-prone.
- id: lua.template.openresty_template_no_escape
  enabled: false
  disabled_reason:
    code: over-broad
  language: lua
  tag: xss
  severity: high
  cwe: [CWE-79]
  match:
    kind: call
    callee:
      attribute: [template, render]
  description: "OpenResty lua-resty-template render — values are not autoescaped by default; reviewer must verify caller escapes (this rule is informational, paired with sanitizer rules)."
