# Lua SSTI sinks (lustache / etlua / lua-resty-template / Lapis).
- id: lua.template.lustache_render_dynamic
  enabled: true
  language: lua
  tag: ssti
  severity: high
  packages: [lustache]
  cwe: [CWE-1336]
  match:
    kind: call
    callee:
      attribute: [lustache, render]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.template.lustache_render_dynamic example
    code: |
      local _u = require("lustache")
      function example(input, url, id, payload, request, params, user)
        lustache.render(payload)
      end
  - name: literal template negative
    code: |
      local _u = require("lustache")
      function example(input, url, id, payload, request, params, user)
        lustache.render("Hello {{name}}")
      end
    expect_no_match: true
  description: "lustache.render(template, ctx) — tainted template enables Mustache expression injection."

