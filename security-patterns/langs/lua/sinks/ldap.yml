- id: lua.ldap.lualdap_search
  enabled: true
  language: lua
  tag: ldap-injection
  severity: high
  packages:
  - lualdap
  cwe:
  - CWE-90
  match:
    kind: call
    callee:
      attribute:
      - conn
      - search
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.ldap.lualdap_search example
    code: "local _lualdap = require(\"lualdap\")\nfunction example(input, url, id,\
      \ payload, request, params, user)\n  conn.search(input)\nend\n"
  - name: literal filter negative
    code: "local _lualdap = require(\"lualdap\")\nfunction example(input, url, id,\
      \ payload, request, params, user)\n  conn.search(\"(uid=user)\")\nend\n"
    expect_no_match: true
  description: "lualdap conn:search{ filter = tainted } \u2014 filter string concatenation\
    \ enables LDAP injection."
