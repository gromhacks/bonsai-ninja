# Lua XSS sinks (OpenResty / Lapis).
- id: lua.xss.ngx_say
  enabled: true
  language: lua
  tag: xss
  severity: medium
  frameworks: [openresty]
  cwe: [CWE-79, CWE-209]
  match:
    kind: call
    callee:
      attribute: [ngx, say]
  analysis_semantics:
    character_constraint:
      required_mappings:
      - {input: "&", output: "&amp;"}
      - {input: "<", output: "&lt;"}
      - {input: ">", output: "&gt;"}
      - {input: '"', output: "&quot;"}
      - {input: "'", output: "&#39;"}
      accepted_providers:
      - operation: {name: gsub}
  constraints:
  - arg_tainted:
      index: 0
  - arg_matches_regex:
      index: 0
      regex: '<[A-Za-z!/][^>]*>'
  match_examples:
    - name: lua.xss.ngx_say example
      code: |
        function example(input, url, id, payload, request, params, user)
          ngx.say("<p>" .. input)
        end
    - name: literal body negative
      code: |
        function example(input, url, id, payload, request, params, user)
          ngx.say("<p>ok</p>")
        end
      expect_no_match: true
    - name: raw dynamic body has no proven HTML execution context
      code: |
        function example(input)
          ngx.say(render(input))
        end
      expect_no_match: true
  description: "ngx.say(body) is an XSS boundary only when the exact argument syntax contains HTML markup. Raw dynamic response bytes require independent Content-Type evidence and remain outside this rule."

- id: lua.xss.ngx_print
  enabled: true
  language: lua
  tag: xss
  severity: medium
  frameworks: [openresty]
  cwe: [CWE-79, CWE-209]
  match:
    kind: call
    callee:
      attribute: [ngx, print]
  analysis_semantics:
    character_constraint:
      required_mappings:
      - {input: "&", output: "&amp;"}
      - {input: "<", output: "&lt;"}
      - {input: ">", output: "&gt;"}
      - {input: '"', output: "&quot;"}
      - {input: "'", output: "&#39;"}
      accepted_providers:
      - operation: {name: gsub}
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
    - name: lua.xss.ngx_print example
      code: |
        function example(input, url, id, payload, request, params, user)
          ngx.print("<p>" .. input)
        end
    - name: literal body negative
      code: |
        function example(input, url, id, payload, request, params, user)
          ngx.print("<p>ok</p>")
        end
      expect_no_match: true
  description: "ngx.print(body) - writes raw response body; XSS when Content-Type is text/html and body is tainted. Error disclosure is a separate value shape."
