- id: lua.deser.loadstring
  enabled: false
  disabled_reason:
    code: over-broad
  language: lua
  tag: insecure-deserialization
  severity: critical
  cwe: [CWE-94, CWE-502]
  match:
    kind: call
    callee:
      name: loadstring
  description: "Disabled - canonical rule is lua.eval.loadstring; tracked in eval.yml as code-injection."

