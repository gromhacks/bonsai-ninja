  - name: lua.deser.pickle_unpickle example
    code: |
      local _luapickle = require("luapickle")
      function example(input, url, id, payload, request, params, user)
        pickle.unpickle(input)
      end
  - name: literal pickle negative
    code: |
      local _luapickle = require("luapickle")
      function example(input, url, id, payload, request, params, user)
