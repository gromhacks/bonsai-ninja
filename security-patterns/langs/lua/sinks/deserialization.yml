# Lua insecure-deserialization sinks.
- id: lua.deser.lua_marshal_load
  enabled: true
  language: lua
  tag: insecure-deserialization
  severity: high
  packages: [lua-marshal]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [marshal, decode]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.deser.lua_marshal_load example
    code: |
      local _lua_marshal = require("lua-marshal")
      function example(input, url, id, payload, request, params, user)
        marshal.decode(input)
      end
  - name: literal blob negative
    code: |
      local _lua_marshal = require("lua-marshal")
      function example(input, url, id, payload, request, params, user)
        marshal.decode("cached-state")
      end
    expect_no_match: true
  description: "lua-marshal marshal.decode - deserialises arbitrary Lua values including functions/upvalues; tainted blob = RCE."

