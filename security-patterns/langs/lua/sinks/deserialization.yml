# Lua insecure-deserialization sinks.
- id: lua.deser.load_return_expression
  enabled: true
  language: lua
  tag: insecure-deserialization
  severity: critical
  cwe: [CWE-502, CWE-94]
  match:
    kind: call
    callee:
      regex: "^load$"
  constraints:
  - top_level: true
  - arg_tainted:
      index: 0
  - arg_string_composition_starts_with:
      index: 0
      value: "return "
  match_examples:
  - name: tainted serialized Lua expression is compiled
    code: |
      function restore(input)
        return load("return " .. input)
      end
  - name: ordinary dynamic chunk remains code injection rather than deserialization
    code: |
      function execute(input)
        return load(input)
      end
    expect_no_match: true
  - name: static expression is not tainted deserialization
    code: |
      function restore()
        return load("return { role = 'reader' }")
      end
    expect_no_match: true
  - name: receiver method named load is not the Lua builtin
    code: |
      function restore(loader, input)
        return loader:load("return " .. input)
      end
    expect_no_match: true
  description: "load(\"return \" .. tainted_value) compiles attacker-controlled serialized Lua expression syntax. The exact compiler-lowered prefix shape receives the specialized CWE-502 attribution; ordinary dynamic chunks remain covered by lua.eval.load."

- id: lua.deser.lua_marshal_load
  enabled: true
  language: lua
  tag: insecure-deserialization
  severity: high
  packages: [lua-marshal]
  cwe: [CWE-502]
  match:
    kind: call
    callee:
      attribute: [marshal, decode]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.deser.lua_marshal_load example
    code: |
      local _lua_marshal = require("lua-marshal")
      function example(input, url, id, payload, request, params, user)
        marshal.decode(input)
      end
  - name: literal blob negative
    code: |
      local _lua_marshal = require("lua-marshal")
      function example(input, url, id, payload, request, params, user)
        marshal.decode("cached-state")
      end
    expect_no_match: true
  description: "lua-marshal marshal.decode - deserialises arbitrary Lua values including functions/upvalues; tainted blob = RCE."

