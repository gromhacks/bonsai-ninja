# Lua weak-crypto + weak-randomness sinks.
- id: lua.crypto.md5_sum
  enabled: true
  language: lua
  tag: weak-crypto
  category: source-independent
  severity: low
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      attribute: [md5, sum]
  match_examples:
  - name: lua.crypto.md5_sum example
    code: |
      function example(input, url, id, payload, request, params, user)
        md5.sum(input)
      end
  description: "md5.sum — MD5 is broken (collisions); unsafe for signatures, password-hashing, or integrity."

- id: lua.crypto.md5_sumhexa
  enabled: true
