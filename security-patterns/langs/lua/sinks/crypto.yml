- id: lua.crypto.openssl_md5
  enabled: true
  language: lua
  tag: weak-crypto
  category: source-independent
  severity: low
  packages: [luacrypto, lua-openssl]
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      attribute: [crypto, digest]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)^["''](md5|md4|md2|sha1|sha-1)["'']$'
  match_examples:
  - name: lua.crypto.openssl_md5 example
    code: |
      local _luacrypto = require("luacrypto")
      function example(input, url, id, payload, request, params, user)
        crypto.digest("md5", payload)
      end
  - name: strong digest algorithm negative
    code: |
      local _luacrypto = require("luacrypto")
      function example(input, url, id, payload, request, params, user)
        crypto.digest("sha256", payload)
      end
    expect_no_match: true
  description: "crypto.digest(algo, ...) - flagged when algo is a broken hash (md5/md4/md2/sha1). Strong algorithms (sha256+) are exempt via the algorithm-name constraint."

- id: lua.crypto.openssl_evp_digest
  enabled: true
  language: lua
  tag: weak-crypto
  category: source-independent
  severity: low
  packages: [lua-openssl]
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      attribute: [evp, digest]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)^["''](md5|md4|md2|sha1|sha-1)["'']$'
  match_examples:
  - name: lua.crypto.openssl_evp_digest example
    code: |
      local _lua_openssl = require("lua-openssl")
      function example(input, url, id, payload, request, params, user)
        evp.digest("sha1", payload)
      end
  - name: strong digest algorithm negative
    code: |
      local _lua_openssl = require("lua-openssl")
      function example(input, url, id, payload, request, params, user)
        evp.digest("sha512", payload)
      end
    expect_no_match: true
  description: "lua-openssl evp.digest(algo) - flagged for broken hashes (md5/md4/md2/sha1); strong algorithms exempt via the algorithm-name constraint."

- id: lua.crypto.openssl_cipher_des
  enabled: true
  language: lua
  tag: weak-crypto
  category: source-independent
  severity: high
  packages: [lua-openssl]
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      attribute: [cipher, new]
  constraints:
  - arg_matches_regex:
      index: 0
      regex: '(?i)(^des|3des|des-ede|^rc4|^rc2|blowfish|^bf-|-ecb)'
  match_examples:
  - name: lua.crypto.openssl_cipher_des example
    code: |
      local _lua_openssl = require("lua-openssl")
      function example(input, url, id, payload, request, params, user)
        cipher.new("des-ede3-cbc")
      end
  - name: aes-gcm strong cipher negative
    code: |
      local _lua_openssl = require("lua-openssl")
      function example(input, url, id, payload, request, params, user)
        cipher.new("aes-256-gcm")
      end
    expect_no_match: true
  description: "openssl.cipher.new - flagged when algorithm is DES/3DES/RC4/RC2/Blowfish or any ECB mode (no confidentiality). Strong AEAD ciphers (aes-*-gcm) exempt via the algorithm-name constraint."

- id: lua.crypto.openssl_cipher_encrypt_ecb
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: lua
  tag: weak-crypto
  severity: high
  packages: [lua-openssl]
  cwe: [CWE-327]
  match:
    kind: call
    callee:
      attribute: [cipher, encrypt]
  description: "Disabled - cipher:encrypt is context-dependent; flag with ECB-mode narrowing."

