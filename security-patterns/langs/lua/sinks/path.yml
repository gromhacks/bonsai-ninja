# Lua path-traversal sinks (stdlib io / LuaFileSystem / lua-luv).
- id: lua.path.io_open_read
  aliases:
  - lua.upload_io_open_client_filename
  enabled: true
  language: lua
  tag: path-traversal
  severity: high
  cwe: [CWE-22, CWE-434]
  match:
    kind: call
    callee:
      attribute: [io, open]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.path.io_open_read example
    code: |
      function example(input, url, id, payload, request, params, user)
        io.open(input)
      end
  - name: literal path negative
    code: |
      function example(input, url, id, payload, request, params, user)
        io.open("data/report.txt")
      end
    expect_no_match: true
  description: "io.open(path, mode) — reads/writes arbitrary filesystem path when tainted. Also covers merged aliases: lua.upload_io_open_client_filename."

