# Lua SQL-injection sinks (LuaSQL / lua-resty-{mysql,postgres} / cqueues / LuaDBI).
- id: lua.sqli.luasql_execute
  enabled: true
  language: lua
  tag: sql-injection
  severity: critical
  packages: [luasql, luasql-mysql, luasql-postgres, luasql-sqlite3]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]execute$
      receiver_type_in: [LuaSqlConnection]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.sqli.luasql_execute example dot form
    code: |
      local luasql = require("luasql.mysql")
      function example(input)
        local environment = luasql.mysql()
        local arbitrary_handle = environment:connect("app", "user", "password")
        arbitrary_handle.execute("SELECT * FROM users WHERE id = " .. input)
      end
  - name: lua.sqli.luasql_execute example colon form
    code: |
      local luasql = require("luasql.mysql")
      function example(name)
        local environment = luasql.mysql()
        local arbitrary_handle = environment:connect("app", "user", "password")
        arbitrary_handle:execute("SELECT id FROM users WHERE name = '" .. name .. "'")
      end
    expect_match_text: ['arbitrary_handle.execute']
  - name: literal sql negative
    code: |
      local luasql = require("luasql.mysql")
      function example()
        local environment = luasql.mysql()
        local arbitrary_handle = environment:connect("app", "user", "password")
        arbitrary_handle:execute("SELECT 1")
      end
    expect_no_match: true
  - name: unrelated execute method is not LuaSQL
    code: |
      local luasql = require("luasql.mysql")
      function example(input)
        local arbitrary_handle = LocalExecutor.new()
        arbitrary_handle:execute(input)
      end
    expect_no_match: true
  description: "LuaSQL connection execute(sql) proven through exact module factory and environment-connect receiver typing. Both dot and colon call shapes work for arbitrary local bindings; unrelated execute methods remain excluded."

- id: lua.sqli.luaresty_postgres_query
  enabled: true
  language: lua
  tag: sql-injection
  severity: critical
  packages: [lua-resty-postgres, resty.postgres, lua-resty-mysql, resty.mysql, pgmoon]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]query$
      receiver_type_in: [RestyMysqlClient, RestyPostgresClient, PgmoonClient]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.sqli.luaresty_postgres_query example
    code: |
      local mysql = require("resty.mysql")
      function example(input)
        local arbitrary_client = mysql:new()
        arbitrary_client:query("SELECT * FROM users WHERE id = " .. input)
      end
  - name: literal sql negative
    code: |
      local mysql = require("resty.mysql")
      function example()
        local arbitrary_client = mysql:new()
        arbitrary_client:query("SELECT 1")
      end
    expect_no_match: true
  - name: unrelated query method is not a database client
    code: |
      local mysql = require("resty.mysql")
      function example(input)
        local arbitrary_client = LocalClient.new()
        arbitrary_client:query(input)
      end
    expect_no_match: true
  description: "lua-resty-mysql, lua-resty-postgres, and pgmoon client query(sql) proven by exact rulepack factory-return typing; local receiver names have no semantic role."

- id: lua.sqli.cqueues_sqlite3_exec
  enabled: true
  language: lua
  tag: sql-injection
  severity: critical
  packages: [lsqlite3]
  imports: [lsqlite3]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]exec$
      receiver_type_in: [LuaSqliteConnection]
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.sqli.cqueues_sqlite3_exec example
    code: |
      local sqlite3 = require("lsqlite3")
      function example(input)
        local arbitrary_handle = sqlite3.open("app.db")
        arbitrary_handle:exec("SELECT * FROM users WHERE id = " .. input)
      end
  - name: literal sql negative
    code: |
      local sqlite3 = require("lsqlite3")
      function example()
        local arbitrary_handle = sqlite3.open("app.db")
        arbitrary_handle:exec("SELECT 1")
      end
    expect_no_match: true
  - name: unrelated exec method is not SQLite
    code: |
      local sqlite3 = require("lsqlite3")
      function example(input)
        local arbitrary_handle = LocalExecutor.new()
        arbitrary_handle:exec(input)
      end
    expect_no_match: true
  description: "lsqlite3 connection exec(sql), proven by exact factory-return receiver typing, executes multi-statement SQL without binding."
