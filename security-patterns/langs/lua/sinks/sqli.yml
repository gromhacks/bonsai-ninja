# Lua SQL-injection sinks (LuaSQL / lua-resty-{mysql,postgres} / cqueues / LuaDBI).
- id: lua.sqli.luasql_execute
  enabled: true
  language: lua
  tag: sql-injection
  severity: critical
  packages: [luasql, luasql-mysql, luasql-postgres, luasql-sqlite3]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: ^(conn|cur|cursor|stmt|db|env|database|connection|sql)[.:]execute$
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.sqli.luasql_execute example dot form
    code: |
      local _luasql = require("luasql")
      function example(input, url, id, payload, request, params, user)
        conn.execute("SELECT * FROM users WHERE id = " .. id)
      end
  - name: lua.sqli.luasql_execute example colon form
    code: |
      local _luasql = require("luasql")
      function example(conn, name)
        conn:execute("SELECT id FROM users WHERE name = '" .. name .. "'")
      end
    expect_match_text: ['conn:execute']
  - name: literal sql negative
    code: |
      local _luasql = require("luasql")
      function example(conn)
        conn:execute("SELECT 1")
      end
    expect_no_match: true
  description: "LuaSQL conn:execute(sql) / conn.execute(sql) — driver runs concatenated SQL; bind via ? placeholders + cursor. Receiver alternation (conn/cur/cursor/stmt/db/env/database/connection/sql) covers the documented LuaSQL convention without colliding with stdlib `os.execute(cmd)`. Both `.` and `:` call shapes are matched."

