- id: lua.sqli.luadbi_prepare
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: lua
  tag: sql-injection
  severity: medium
  packages: [luadbi]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      attribute: [dbh, prepare]
  description: "Disabled — LuaDBI dbh:prepare is safe when placeholders are used; only dangerous if SQL is concatenated."
# Generic Lua method-call SQL-injection sink. Lua's metatable DB
# clients all converge on `<conn>:execute(sql)`, but the receiver
# can be `conn`, `db`, `cur`, `cx`, ... A package-anchored rule
# misses bare receivers; this catches the call shape via name-only
# match + a SQL-keyword + concat constraint.
- id: lua.sqli.method_execute_concat
  enabled: false
  disabled_reason:
    code: subsumed
  language: lua
  tag: sql-injection
  severity: critical
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      name: execute
  match_examples:
  - name: lua.sqli.method_execute_concat example
    code: |
      function example(input, url, id, payload, request, params, user)
        execute("SELECT " .. user)
      end
  description: "Disabled duplicate/overbroad variant — receiver-specific LuaSQL/LuaDBI execute rules cover shipped examples; bare name `execute` collides across unrelated Lua APIs."

# LuaDBI-specific complement. `dbh:execute` carries the same shape but
# with LuaDBI's `dbh` receiver convention; named-package gate for the
# LuaDBI ecosystem (statement-prepare-then-execute or direct execute).
- id: lua.sqli.luadbi_execute
  enabled: false
  disabled_reason:
    code: subsumed
    subsumed_by: lua.sqli.luasql_execute_db
  language: lua
  tag: sql-injection
  severity: critical
  packages: [luadbi]
  cwe: [CWE-89]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]execute$
  description: "Subsumed by lua.sqli.luasql_execute_db — same regex; canonical rule should add luadbi to its packages list."
