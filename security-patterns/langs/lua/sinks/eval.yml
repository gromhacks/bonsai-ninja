# Lua code-injection sinks (bytecode + script loaders).
#
# NOTE on bare-name 'load': Lua's `load` is a real built-in global (Lua 5.2+),
# not a generic verb. Unlike `open`/`exec`/`query` it has no common shadowing
# in Lua codebases — there is no module-prefixed alternative. Keeping the
# bare-name match is intentional; tighten with `top_level: true` so that
# `obj:load()`/`module.load()` calls do not match. Audit reports flag this
# as fragile but it is the canonical Lua spelling.
- id: lua.eval.loadstring
  enabled: true
  language: lua
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: loadstring
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.eval.loadstring example
    code: |
      function example(input, url, id, payload, request, params, user)
        loadstring(input)
      end
  - name: literal source negative
    code: |
      function example(input, url, id, payload, request, params, user)
        loadstring("return 1")
      end
    expect_no_match: true
  description: "loadstring(src) — compiles and returns a function from a tainted string (Lua 5.1 / LuaJIT)."

- id: lua.eval.load
  enabled: true
  language: lua
  tag: code-injection
  severity: critical
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      regex: "^load$"
  constraints:
  - arg_tainted:
      index: 0
  match_examples:
  - name: lua.eval.load example
    code: |
      function example(input, url, id, payload, request, params, user)
        load(input)
      end
  - name: literal source negative
    code: |
      function example(input, url, id, payload, request, params, user)
        load("return 1")
      end
    expect_no_match: true
  description: "load(chunk) — Lua 5.2+ chunk loader; string chunk is compiled as Lua source."

