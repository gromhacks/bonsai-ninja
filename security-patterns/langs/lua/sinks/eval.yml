- id: lua.eval.debug_sethook
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: lua
  tag: code-injection
  severity: high
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      attribute: [debug, sethook]
  description: "Disabled — debug.sethook installs a hook function; dangerous only when the hook is built from tainted source."

- id: lua.eval.require
  enabled: false
  disabled_reason:
    code: over-broad
  language: lua
  tag: code-injection
  severity: medium
  cwe: [CWE-94]
  match:
    kind: call
    callee:
      name: require
  description: "Disabled — require(tainted) loads an arbitrary module; enable with module-name narrowing."
