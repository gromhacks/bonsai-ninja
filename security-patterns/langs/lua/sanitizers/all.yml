  description: "ngx.encode_base64 - base64 output cannot contain shell/SQL/HTML metacharacters; treat as opaque-encode sanitizer."

- id: lua.sanitizer.resty_template_escape
  enabled: true
  language: lua
  tag: html-encode
  packages: [lua-resty-template]
  match:
    kind: call
    callee:
      regex: "^(template\\.)?escape$"
  match_examples:
  - name: lua.sanitizer.resty_template_escape example
    code: |
      local _lua_resty_template = require("lua-resty-template")
      function example(input, url, id, payload, request, params, user)
        template.escape(input)
      end
    expect_match_text: ["template.escape"]
  description: "lua-resty-template escape - HTML-entity encodes a string for safe template interpolation."

- id: lua.sanitizer.resty_string_sha256_bin
  enabled: true
  language: lua
  tag: hash
  packages: [lua-resty-string]
  match:
    kind: call
    callee:
      attribute: [resty_sha256, sha256_bin]
  match_examples:
  - name: lua.sanitizer.resty_string_sha256_bin example
