    expect_match_text: ["resty_sha256.sha256_bin"]
  description: "lua-resty-string sha256_bin - one-way SHA-256 digest; downstream cannot recover original taint payload (use
    only as identifier, not for auth)."

- id: lua.sanitizer.ngx_unescape_uri
  enabled: false
  disabled_reason:
    code: over-broad
  language: lua
  tag: url-decode
  frameworks: [openresty]
  match:
    kind: call
    callee:
      attribute: [ngx, unescape_uri]
  description: "Disabled - ngx.unescape_uri is the DECODE inverse of escape_uri; it re-introduces percent-encoded metacharacters
    and MUST NOT be treated as a sanitizer. Listed for audit visibility only."

# -- Audit-derived validation / binding sanitizers -----------------------------
- id: lua.sanitizer.same_origin_string_match
  enabled: true
  language: lua
  tag: same-origin-path
  match:
    kind: call
    callee:
      attribute: [string, match]
  constraints:
  - arg_matches_regex:
      index: 1
      regex: "^['\"]\\^/"
  match_examples:
  - name: lua.sanitizer.same_origin_string_match example
    code: |
      function example(next)
        string.match(next, "^/")
      end
    expect_match_text: [string.match]
  - name: lua.sanitizer.same_origin_string_match example negative constraint boundary
    code: "function example(next)\n  string.match()\nend\n"
    expect_no_match: true
  description: "string.match(value, '^/') - same-origin redirect/path guard for root-relative targets."

- id: lua.sanitizer.table_allowlist_lookup
  enabled: false
  language: lua
  tag: allowlist-validate
  match:
    kind: read
    target:
      regex: "(?i)allow(ed|list)|permitted|valid"
  match_examples:
  - name: lua.sanitizer.table_allowlist_lookup example
    code: |
      function example(role)
        local allowed = { user = true, admin = true }
        return allowed[role]
      end
    expect_match_text: [allowed]
  description: "Disabled - this rule depends on naming conventions rather than semantic finite-set, guard, or regex facts.
    allowed[value] table lookup - table-backed enum/set allowlist membership check."

  disabled_reason:
    code: over-broad
- id: lua.sanitizer.string_match_full_shape
  enabled: true
  language: lua
  tag: regex-validate
  match:
    kind: call
    callee:
      attribute: [string, match]
  constraints:
  - arg_matches_regex:
      index: 1
      regex: "^['\"]\\^.*\\$['\"]$"
  match_examples:
  - name: lua.sanitizer.string_match_full_shape example
    code: |
      function example(slug)
        string.match(slug, "^[%w_-]+$")
      end
    expect_match_text: [string.match]
  - name: lua.sanitizer.string_match_full_shape example negative constraint boundary
    code: "function example(slug)\n  string.match()\nend\n"
    expect_no_match: true
  description: "string.match(value, '^...$') - full-string shape validator for slugs, identifiers, and similar bounded formats."

- id: lua.sanitizer.statement_bind_values
  enabled: true
  language: lua
  tag: db-bind-parameter
  packages: [lsqlite3]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]bind_values$
  constraints:
  - min_args: 1
  match_examples:
  - name: lua.sanitizer.statement_bind_values example
    code: |
      local _sqlite = require("lsqlite3")
      function example(stmt, id)
        stmt:bind_values(id)
      end
    expect_match_text: [stmt.bind_values]
  description: "prepared statement bind_values(...) - binds values to SQL placeholders."

- id: lua.sanitizer.gsub_char_allowlist
  enabled: true
  language: lua
  tag: char-allowlist
  match:
    kind: call
    callee:
      attribute: [string, gsub]
  constraints:
  - arg_matches_regex:
      index: 1
      regex: "\\[\\^"
  - arg_equals:
      index: 2
      value: "\"\""
  match_examples:
  - name: lua.sanitizer.gsub_char_allowlist example
    code: |
      function example(input)
        string.gsub(input, "[^%w_-]", "")
      end
    expect_match_text: [string.gsub]
  - name: lua.sanitizer.gsub_char_allowlist example negative constraint boundary
    code: "function example(input)\n  string.gsub()\nend\n"
    expect_no_match: true
  description: "string.gsub(value, '[^safe]', '') - strips every character outside an explicit allowlist."

# -- SQL escaping (pgmoon) ------------------------------------------------------
# pgmoon is the canonical OpenResty Postgres driver; its db:query(sql)
# sink (lua.sqli.luaresty_postgres_query) has no parameter binding, so
# escape_literal / escape_identifier are the documented safe primitives.
- id: lua.sanitizer.pgmoon_escape_literal
  enabled: true
  language: lua
  tag: sql-parameter
  packages: [pgmoon]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]escape_literal$
  constraints:
  - min_args: 1
  match_examples:
  - name: lua.sanitizer.pgmoon_escape_literal example
    code: |
      local _pgmoon = require("pgmoon")
      function example(pg, value)
        pg:escape_literal(value)
      end
    expect_match_text: ["pg.escape_literal"]
  - name: lua.sanitizer.pgmoon_escape_literal negative constraint boundary
    code: "local _pgmoon = require(\"pgmoon\")\nfunction example(pg)\n  pg:escape_literal()\nend\n"
    expect_no_match: true
  description: "pgmoon escape_literal(value) - quotes and escapes a value for safe SQL literal interpolation (the documented binding primitive for pgmoon's unparameterised db:query)."

- id: lua.sanitizer.pgmoon_escape_identifier
  enabled: true
  language: lua
  tag: sql-parameter
  packages: [pgmoon]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]escape_identifier$
  constraints:
  - min_args: 1
  match_examples:
  - name: lua.sanitizer.pgmoon_escape_identifier example
    code: |
      local _pgmoon = require("pgmoon")
      function example(pg, col)
        pg:escape_identifier(col)
      end
    expect_match_text: ["pg.escape_identifier"]
  - name: lua.sanitizer.pgmoon_escape_identifier negative constraint boundary
    code: "local _pgmoon = require(\"pgmoon\")\nfunction example(pg)\n  pg:escape_identifier()\nend\n"
    expect_no_match: true
  description: "pgmoon escape_identifier(name) - double-quotes and escapes a table/column identifier for safe SQL interpolation."

# -- JWT algorithm allowlist (lua-resty-jwt) -----------------------------------
# Complements the lua.jwt.* sinks: lua-resty-jwt accepts alg=none unless
# an explicit algorithm whitelist is configured. set_alg_whitelist is the
# canonical mitigation, so credit it as a jwt-verify sanitizer.
- id: lua.sanitizer.resty_jwt_set_alg_whitelist
  enabled: true
  language: lua
  tag: jwt-verify
  packages: [lua-resty-jwt]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]set_alg_whitelist$
  constraints:
  - min_args: 1
  match_examples:
  - name: lua.sanitizer.resty_jwt_set_alg_whitelist example
    code: |
      local _lua_resty_jwt = require("lua-resty-jwt")
      function example(jwt)
        jwt:set_alg_whitelist({ RS256 = 1 })
      end
    expect_match_text: ["jwt.set_alg_whitelist"]
  - name: lua.sanitizer.resty_jwt_set_alg_whitelist negative constraint boundary
    code: "local _lua_resty_jwt = require(\"lua-resty-jwt\")\nfunction example(jwt)\n  jwt:set_alg_whitelist()\nend\n"
    expect_no_match: true
  description: "lua-resty-jwt set_alg_whitelist({...}) - pins accepted signature algorithms, rejecting alg=none forgeries before jwt:verify trusts claims."

# URL decode passthrough sanitizers (T301). Tagged
# `passthrough-decode` so the engine treats the call as an
# identity edge (T104) - taint propagates THROUGH instead of
# being cleared. Bludit CVE-2019-16113 used urldecode to
# turn %2F%2E%2E%2F into /../ AFTER the path safety check.
- id: lua.passthrough.ngx_unescape_uri
  enabled: true
  language: lua
  tag: passthrough-decode
  match:
    kind: call
    callee:
      attribute: [ngx, unescape_uri]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: lua.passthrough.ngx_unescape_uri example
    code: |
      function example(input, url, id, payload, request, params, user)
        ngx.unescape_uri(input)
      end
    expect_match_text: ["ngx.unescape_uri"]
  description: "ngx.unescape_uri(s) - OpenResty URL decode; preserves taint."
- id: lua.passthrough.string_upper
  enabled: true
  language: lua
  tag: passthrough-transform
  match:
    kind: call
    callee:
      attribute: [string, upper]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: string.upper preserves taint
    code: |
      function example(input)
        return string.upper(input)
      end
    expect_match_text: ["string.upper"]
  description: "string.upper(s) - case-normalizes but preserves taint from s."
- id: lua.passthrough.tostring
  enabled: true
  language: lua
  tag: passthrough-transform
  match:
    kind: call
    callee:
      name: tostring
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: tostring preserves taint
    code: |
      function example(input)
        return tostring(input)
      end
    expect_match_text: [tostring]
  description: "tostring(v) - changes representation but preserves attacker-controlled content (WS3 coercion passthrough; mirrors python str()/go string()). (tonumber is numeric and intentionally NOT passthrough.)"
- id: lua.passthrough.string_lower
  enabled: true
  language: lua
  tag: passthrough-transform
  match:
    kind: call
    callee:
      attribute: [string, lower]
  taint_semantics:
    call_result_passthrough_args: [0]
  match_examples:
  - name: string.lower preserves taint
    code: |
      function example(input)
        return string.lower(input)
      end
    expect_match_text: ["string.lower"]
  description: "string.lower(s) - case-normalizes but preserves taint from s."

# CSRF middleware / decorator presence sanitizers (T303).
# Tagged `csrf-protect` so the engine credits the `csrf` sink
# class. Reviewer enumerates with `security sanitizers --tag
# csrf-protect` to find sites that DO have CSRF protection;
# absence is the architectural finding (no taint chain).
- id: lua.csrf.lapis_csrf
  enabled: true
  language: lua
  tag: csrf-protect
  match:
    kind: call
    callee:
      attribute: [csrf, generate_token]
  match_examples:
  - name: lua.csrf.lapis_csrf example
    code: |
      function example(input, url, id, payload, request, params, user)
        csrf.generate_token(input)
      end
    expect_match_text: ["csrf.generate_token"]
  description: "Lapis lapis.csrf - generate_token / validate_token pair signals CSRF protection."
