# Lua sanitizers - canonical tags only.
#
# NOTE: ngx.unescape_uri is intentionally NOT a sanitizer - it is the
# inverse (decode) operation and re-introduces metacharacters. See the
# disabled stub `lua.sanitizer.ngx_unescape_uri` below.
- id: lua.sanitizer.ngx_escape_uri
  enabled: true
  language: lua
  tag: url-encode
  frameworks: [openresty]
  match:
    kind: call
    callee:
      attribute: [ngx, escape_uri]
  match_examples:
  - name: lua.sanitizer.ngx_escape_uri example
    code: |
      function example(input, url, id, payload, request, params, user)
        ngx.escape_uri(input)
      end
    expect_match_text: ["ngx.escape_uri"]
  description: "ngx.escape_uri - percent-encodes URI components; neutralises path/query injection."

- id: lua.sanitizer.ngx_quote_sql_str
  enabled: true
  language: lua
  tag: sql-parameter
  frameworks: [openresty]
  match:
    kind: call
    callee:
      attribute: [ngx, quote_sql_str]
  match_examples:
  - name: lua.sanitizer.ngx_quote_sql_str example
    code: |
      function example(input, url, id, payload, request, params, user)
        ngx.quote_sql_str(input)
      end
    expect_match_text: ["ngx.quote_sql_str"]
  description: "ngx.quote_sql_str - single-quotes and escapes a Lua string for SQL literal use."

- id: lua.sanitizer.html_escape_lapis
  enabled: true
  language: lua
  tag: html-encode
  packages: [lapis]
  match:
    kind: call
    callee:
      regex: "^lapis\\.html\\.escape$"
  match_examples:
  - name: lua.sanitizer.html_escape_lapis example
    code: |
      local _u = require("lapis")
      function example(input, url, id, payload, request, params, user)
        lapis.html.escape(input)
      end
    expect_match_text: ["lapis.html.escape"]
  description: "lapis.html.escape - HTML-entity encoding prevents reflected/stored XSS."

- id: lua.sanitizer.html_entities_encode
  enabled: true
  language: lua
  tag: html-encode
  packages: [lua-resty-html]
  match:
    kind: call
    callee:
      regex: "^html\\.encode$"
  match_examples:
  - name: lua.sanitizer.html_entities_encode example
    code: |
      local _lua_resty_html = require("lua-resty-html")
      function example(input, url, id, payload, request, params, user)
        html.encode(input)
      end
    expect_match_text: ["html.encode"]
  description: "html.encode (lua-resty-html / html-entities) - HTML-entity encoder."

- id: lua.sanitizer.tonumber
  enabled: true
  language: lua
  tag: numeric-coerce
  match:
    kind: call
    callee:
      name: tonumber
  match_examples:
  - name: lua.sanitizer.tonumber example
    code: |
      function example(input, url, id, payload, request, params, user)
        tonumber(input)
      end
    expect_match_text: ["tonumber"]
  description: "tonumber - coerces input to number; removes shell/SQL/path payloads when non-numeric yields nil."

- id: lua.sanitizer.resty_string_to_hex
  enabled: true
  language: lua
  tag: validation
  packages: [lua-resty-string]
  match:
    kind: call
    callee:
