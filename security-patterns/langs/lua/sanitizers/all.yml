  description: "lua-resty-string to_hex - hex-encodes bytes; output cannot contain shell/SQL/HTML metacharacters."

- id: lua.sanitizer.string_format_q
  enabled: false
  disabled_reason:
    code: over-broad
  language: lua
  tag: shell-escape
