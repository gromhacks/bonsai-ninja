# Lua CLI / env sources - trust: local.
- id: lua.source.cli_arg
  enabled: true
  language: lua
  trust: local
  tag: cli-input
  match:
    kind: read
    target:
      name: arg
  match_examples:
    - name: lua.source.cli_arg example
      code: |
        function example(input, url, id, payload, request, params, user)
          local value = arg
        end
  description: "Lua arg table - local CLI argv input."

- id: lua.source.os_getenv
  enabled: true
  language: lua
  trust: local
  tag: env-input
  analysis_semantics:
    flow_classes: [environment-input]
  match:
    kind: call
    callee:
      attribute: [os, getenv]
  match_examples:
    - name: lua.source.os_getenv example
      code: |
        function example(input, url, id, payload, request, params, user)
          os.getenv(input)
        end
  description: "os.getenv - local environment variable input."

- id: lua.source.io_read
  enabled: true
  language: lua
  trust: local
  tag: file-input
  payload_types: [text, binary]
  match:
    kind: call
    callee:
      attribute: [io, read]
  match_examples:
  - name: Lua default input read
    code: |
      function example()
        return io.read()
      end
    expect_match_text: [io.read]
  - name: unrelated receiver read is not io input
    code: |
      function example(reader)
        return reader:read()
      end
    expect_no_match: true
  description: "io.read - data from Lua's current default input stream. That stream is stdin initially, but io.input(file) can redirect it to a local file; the explicit io.stdin:read rule retains the narrower CLI-input classification."

- id: lua.source.io_stdin_read
  enabled: true
  language: lua
  trust: local
  tag: cli-input
  match:
    kind: call
    callee:
      attribute: [io, stdin, read]
  match_examples:
  - name: Lua explicit stdin read
    code: |
      function example()
        return io.stdin:read("*l")
      end
    expect_match_text: [io.stdin.read]
  - name: file handle read is not explicit stdin
    code: |
      function example(file)
        return file:read("*l")
      end
    expect_no_match: true
  description: "io.stdin:read - text or bytes supplied through the process standard input stream."
