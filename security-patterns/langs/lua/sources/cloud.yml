# Lua cloud / serverless sources - trust: service.
# AWS Lambda custom runtime (Lua) handler receives an event table.
# Typical pattern: function handler(event, context) - event.body is attacker-controlled.
# Lua adapter cannot pin handler signature; rely on the http-input sources invoked
# inside handler bodies. Keep disabled stub for canonical coverage.
- id: lua.source.lambda_event
  enabled: false
  disabled_reason:
    code: over-broad
  language: lua
  trust: service
  tag: cloud-event
  match:
    kind: read
    target:
      name: event
  description: "Disabled - AWS Lambda Lua custom runtime handler event table (too broad without handler narrowing)."
