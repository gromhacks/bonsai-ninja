# Lua HTTP sources (OpenResty / Lapis / Kong).
- id: lua.source.openresty_get_uri_args
  enabled: true
  language: lua
  trust: remote
  tag: http-input
  payload_types: [query]
  match:
    kind: call
    callee:
      attribute: [ngx, req, get_uri_args]
      binding_origin: runtime-global
  constraints:
  - max_args: 1
  match_examples:
  - name: lua.source.openresty_get_uri_args example
    code: |
      function example(input, url, id, payload, request, params, user)
        ngx.req.get_uri_args(input)
      end
  - name: OpenResty URI argument parser invalid arity
    code: |
      ngx.req.get_uri_args(10, 20)
    expect_no_match: true
  - name: locally shadowed ngx table is not the OpenResty runtime global
    code: |
      local ngx = { req = { get_uri_args = function() return {} end } }
      ngx.req.get_uri_args()
    expect_no_match: true
  description: "ngx.req.get_uri_args - parsed query-string; attacker-controlled."

