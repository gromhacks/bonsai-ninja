# Property-read shape for OpenResty. `ngx.req.get_uri_args()` is a
# call (covered above); `ngx.var.uri_args` style accesses surface
# as reads. Provide a coarser-trust source-rule that matches the
# `ngx.var.<name>` family without listing each property.
- id: lua.source.ngx_uri_args
  enabled: true
  language: lua
  trust: remote
  tag: http-input
  payload_types: [query]
  packages: [openresty]
  match:
    kind: read
    target:
      attribute: [ngx, var, uri_args]
  match_examples:
  - name: lua.source.ngx_uri_args example
    code: |
      local _openresty = require("openresty")
      function example(input, url, id, payload, request, params, user)
        local value = ngx.var.uri_args
      end
  description: "ngx.var.uri_args - OpenResty parsed query-string variable; attacker-controlled. Property-read shape complementary to the call-shape ngx.req.get_uri_args() rule."

- id: lua.source.openresty_session_data
  enabled: false
  disabled_reason:
    code: requires-constraint
  language: lua
  trust: remote
  tag: http-input
  packages: [lua-resty-session]
  match:
    kind: read
    target:
      attribute: [session, data]
  description: "Disabled - lua-resty-session session.data is HMAC/AES-protected by default; enable only when secret is weak/static or when modeling second-order taint from session payloads."
