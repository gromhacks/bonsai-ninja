  description: "Disabled - client IP; spoofable via X-Forwarded-For only if downstream proxy trusted. Enable for log-injection / rate-limit bypass analyses."

- id: lua.source.lapis_params
  enabled: true
  language: lua
  trust: remote
  tag: http-input
  payload_types: [query]
  packages: [lapis]
  match:
    kind: read
    target:
      attribute: [self, params]
  match_examples:
  - name: lapis self params read
    code: |
      local lapis = require("lapis")
      local app = lapis.Application()
      function app:index()
        local p = self.params
        return p
      end
  description: "Lapis self.params - request params read via `self.params` in a Lapis action (the `self.` receiver avoids matching a bare `params` local)."

- id: lua.source.lapis_get_params
  enabled: true
  language: lua
  trust: remote
  tag: http-input
  payload_types: [query]
  packages: [lapis]
  match:
    kind: read
    target:
      attribute: [self, GET]
  match_examples:
  - name: Lapis query parameters
    code: |
      local lapis = require("lapis")
      local app = lapis.Application()
      app:get("/search", function(self)
        return self.GET.q
      end)
    expect_match_text: [self.GET.q]
  - name: Lapis response fields are not request query parameters
    code: |
      local lapis = require("lapis")
      local app = lapis.Application()
      app:get("/", function(self)
        return self.res.GET
      end)
    expect_no_match: true
  description: "Lapis self.GET - query parameters parsed from the inbound request URL."

- id: lua.source.lapis_post_params
  enabled: true
  language: lua
  trust: remote
  tag: http-input
  payload_types: [form]
  packages: [lapis]
  match:
    kind: read
    target:
      attribute: [self, POST]
  match_examples:
  - name: Lapis form parameters
    code: |
      local lapis = require("lapis")
      local app = lapis.Application()
      app:post("/submit", function(self)
        return self.POST.title
      end)
    expect_match_text: [self.POST.title]
  - name: ordinary POST field is not a Lapis request carrier
    code: |
      local lapis = require("lapis")
      local record = { POST = { title = "local" } }
      return record.POST.title
    expect_no_match: true
  description: "Lapis self.POST - form-encoded parameters parsed from the inbound request body."

