- id: lua.source.openresty_resty_upload_read
  enabled: true
  language: lua
  trust: remote
  tag: http-input
  payload_types: [multipart]
  packages: [lua-resty-upload, openresty]
  match:
    kind: call
    callee:
      regex: ^[A-Za-z_$][A-Za-z0-9_$]*[.:]read$
  constraints:
  - max_args: 0
  match_examples:
  - name: lua.source.openresty_resty_upload_read example
    code: |
      local _lua_resty_upload = require("lua-resty-upload")
      function example(form)
        form.read()
      end
  - name: lua.source.openresty_resty_upload_read with args negative
    code: |
      local _lua_resty_upload = require("lua-resty-upload")
      function example(form, size)
        form.read(size)
      end
    expect_no_match: true
  description: "lua-resty-upload form:read() - multipart headers/body chunks, including browser-supplied filename metadata. The `max_args: 0` constraint pins the no-argument reader call so argument-bearing `x.read(n)` byte-count readers do not over-match."

