- id: lua.source.lua_http_stream_headers
  enabled: true
  language: lua
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [header]
  packages: [lua-http, http.server]
  imports: [http.server]
  match:
    kind: call
    callee:
      name: get_headers
  constraints:
  - receiver_type_in: [HttpServerStream]
  match_examples:
  - name: lua-http server stream headers
    code: |
      local http_server = require "http.server"
      http_server.listen({
        onstream = function(server, stream)
          local headers = stream:get_headers()
          consume(headers)
        end
      })
    expect_match_text: [stream.get_headers]
  - name: outbound or application stream is not inbound
    code: |
      local http_server = require "http.server"
      function consume_response(stream)
        local headers = stream:get_headers()
        consume(headers)
      end
    expect_no_match: true
  description: "lua-http inbound request headers read from the compiler-typed stream parameter of http.server.listen's exact onstream configuration callback; outbound client streams with the same method stay untrusted-source free."
