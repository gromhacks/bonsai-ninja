  packages: [lapis]
  match:
    kind: read
    target:
      attribute: [self, req, parsed_url]
  match_examples:
  - name: Lapis parsed inbound URL
    code: |
      local lapis = require("lapis")
      local app = lapis.Application()
      app:get("/", function(self)
        return self.req.parsed_url.path
      end)
    expect_match_text: [self.req.parsed_url.path]
  - name: application URL setting is not the request URL
    code: |
      local lapis = require("lapis")
      local app = { parsed_url = { path = "/local" } }
      return app.parsed_url.path
    expect_no_match: true
  description: "Lapis self.req.parsed_url - components of the client-requested URL."

