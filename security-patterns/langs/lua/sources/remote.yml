- id: lua.source.kong_request_get_path
  enabled: true
  language: lua
  trust: remote
  tag: http-input
  payload_types: [path]
  packages: [kong]
  match:
    kind: call
    callee:
      attribute: [kong, request, get_path]
  constraints:
  - max_args: 0
  match_examples:
  - name: Kong normalized request path
    code: |
      local _u = require("kong")
      function example()
        return kong.request.get_path()
      end
    expect_match_text: [kong.request.get_path]
  - name: same API with invalid arguments is not the documented carrier
    code: |
      local _u = require("kong")
      function example(path)
        return kong.request.get_path(path)
      end
    expect_no_match: true
  description: "Kong PDK kong.request.get_path - request path; attacker-controlled."

