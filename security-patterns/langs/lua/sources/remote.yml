- id: lua.source.openresty_var_remote_addr
  enabled: false
  disabled_reason:
    code: over-broad
  language: lua
  trust: remote
  tag: http-input
  packages: [openresty]
  match:
    kind: read
    target:
      attribute: [ngx, var, remote_addr]
  description: "Disabled - client IP; spoofable via X-Forwarded-For only if downstream proxy trusted. Enable for log-injection / rate-limit bypass analyses."

- id: lua.source.lapis_params
  enabled: true
  language: lua
  trust: remote
  tag: http-input
  payload_types: [query]
  packages: [lapis]
  match:
    kind: read
    target:
      attribute: [self, params]
  match_examples:
  - name: lapis self params read
    code: |
      local lapis = require("lapis")
      local app = lapis.Application()
      function app:index()
        local p = self.params
        return p
      end
  description: "Lapis self.params - request params read via `self.params` in a Lapis action (the `self.` receiver avoids matching a bare `params` local)."

- id: lua.source.lapis_session
