  language: lua
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [file, path]
  match:
    kind: call
    callee:
      attribute: [ngx, req, get_body_file]
      binding_origin: runtime-global
  constraints:
  - max_args: 0
  match_examples:
  - name: OpenResty buffered request-body file
    code: |
      local path = ngx.req.get_body_file()
    expect_match_text: [ngx.req.get_body_file]
  - name: locally shadowed ngx body-file table is not the OpenResty runtime global
    code: |
      local ngx = { req = { get_body_file = function() return "/tmp/fixed" end } }
      local path = ngx.req.get_body_file()
    expect_no_match: true
  description: "ngx.req.get_body_file() - temporary file path containing a client request body when the body was buffered to disk."

- id: lua.source.turbo_request_argument
  enabled: true
  language: lua
  trust: remote
  category: http-input
  tag: http-input
  payload_types: [query, form]
  packages: [turbo]
  match:
    kind: call
    callee:
      attribute: [self, get_argument]
  constraints:
  - min_args: 1
  - max_args: 3
  match_examples:
  - name: Turbo request argument
    code: |
      local turbo = require "turbo"
      local Handler = class("Handler", turbo.web.RequestHandler)
      function Handler:get()
        return self:get_argument("q")
      end
    expect_match_text: [self.get_argument]
  - name: different receiver is not the Turbo handler request
    code: |
      local turbo = require "turbo"
      return form:get_argument("q")
    expect_no_match: true
  description: "Turbo RequestHandler self:get_argument(name, default, strip) - decoded query/form input on the canonical handler receiver."

