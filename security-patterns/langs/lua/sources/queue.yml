# Lua queue / broker sources.
- id: lua.queue.lzmq_socket_recv
  enabled: true
  language: lua
  trust: service
  tag: queue-input
  category: queue-input
  payload_types: [binary, text]
  packages: [lzmq]
  imports: [lzmq]
  match:
    kind: call
    callee:
      name: recv
  constraints:
  - receiver_type_in: [ZmqSocket]
  - max_args: 1
  match_examples:
  - name: lzmq broker message
    code: |
      local zmq = require("lzmq")
      local context = zmq.context()
      local socket = context:socket(zmq.PULL)
      local message = socket:recv()
      sink(message)
    expect_match_text: [socket.recv]
  - name: application recv method is not a broker source
    code: |
      local zmq = require("lzmq")
      local buffer = LocalBuffer()
      local message = buffer:recv()
      sink(message)
    expect_no_match: true
  description: "lzmq Socket:recv returns a message received from a ZeroMQ peer on a compiler-typed socket."
