- id: lua.typing.lifecycle_closed_receiver
  enabled: true
  language: lua
  match: { kind: call, callee: { name: close } }
  lifecycle_transition:
    state: closed
    binding: { kind: receiver }
  match_examples:
  - name: close changes the receiver state
    code: 'local function f(resource) resource:close() end'
    expect_match_text: [resource.close]
  description: "Lua close moves the receiver to closed. Typing-only; never a finding."

- id: lua.typing.lifecycle_cancelled_receiver
  enabled: true
  language: lua
  match: { kind: call, callee: { name: cancel } }
  lifecycle_transition:
    state: cancelled
    binding: { kind: receiver }
  match_examples:
  - name: cancel changes the receiver state
    code: 'local function f(task) task:cancel() end'
    expect_match_text: [task.cancel]
  description: "Lua cancel moves the receiver to cancelled. Typing-only; never a finding."
