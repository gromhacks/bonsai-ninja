- id: lua.typing.lua_http_server_onstream
  enabled: true
  language: lua
  packages: [lua-http, http.server]
  imports: [http.server]
  callback_arg_index: 0
  callback_field_path: [onstream]
  callback_param_types:
  - [HttpServer]
  - [HttpServerStream]
  match:
    kind: call
    callee:
      attribute: [http_server, listen]
      binding_origin: imported
  match_examples:
  - name: lua-http server onstream configuration callback
    code: |
      local http_server = require "http.server"
      local server = http_server.listen({
        onstream = function(server, stream)
          local headers = stream:get_headers()
        end
      })
    expect_match_text: [http_server.listen]
  - name: unrelated listen factory is not lua-http
    code: |
      local imported_http_server = require "http.server"
      local http_server = LocalFactory
      local server = http_server.listen({
        onstream = function(server, stream) consume(stream) end
      })
    expect_no_match: true
  description: "http.server.listen's exact onstream configuration field receives the server and inbound request stream. Typing-only; the compiler supplies the parsed aggregate-field callback relationship."

