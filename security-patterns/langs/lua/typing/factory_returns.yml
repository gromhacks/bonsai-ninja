# External-library constructor return types. These rules only provide receiver
# evidence for exact downstream source matching.
- id: lua.typing.resty_aws_root
  enabled: true
  language: lua
  packages: [lua-resty-aws, resty.aws]
  imports: [resty.aws]
  returns_type: AwsSdk
  match:
    kind: call
    callee:
      name: AWS
      binding_origin: imported
  match_examples:
  - name: lua-resty-aws root instance
    code: |
      local AWS = require("resty.aws")
      local aws = AWS({ region = "us-east-1" })
    expect_match_text: [AWS]
  - name: unrelated callable is not an AWS instance
    code: |
      local imported_aws = require("resty.aws")
      local AWS = LocalFactory
      local aws = AWS({ region = "us-east-1" })
    expect_no_match: true
  description: "The module returned by require('resty.aws') is callable and yields an AWS SDK instance. Typing-only."

- id: lua.typing.resty_aws_s3
  enabled: true
  language: lua
  packages: [lua-resty-aws, resty.aws]
  imports: [resty.aws]
  returns_type: AwsS3Client
  match:
    kind: call
    callee:
      name: S3
  constraints:
  - receiver_type_in: [AwsSdk]
  match_examples:
  - name: typed lua-resty-aws S3 service
    code: |
      local AWS = require("resty.aws")
      local aws = AWS({ region = "us-east-1" })
      local s3 = aws:S3()
    expect_match_text: [aws.S3]
  - name: unrelated S3 method is not an AWS service
    code: |
      local AWS = require("resty.aws")
      local local_sdk = LocalSdk()
      local s3 = local_sdk:S3()
    expect_no_match: true
  description: "lua-resty-aws AwsSdk:S3 returns an S3 service receiver. Typing-only."

