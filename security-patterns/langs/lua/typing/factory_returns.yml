- id: lua.typing.luasql_connection
  enabled: true
  language: lua
  packages: [luasql, luasql-mysql, luasql-postgres, luasql-sqlite3, luasql.mysql]
  imports: [luasql.mysql, luasql.postgres, luasql.sqlite3]
  returns_type: LuaSqlConnection
  match:
    kind: call
    callee:
      name: connect
  constraints:
  - receiver_type_in: [LuaSqlEnvironment]
  match_examples:
  - name: typed LuaSQL environment connection
    code: |
      local luasql = require("luasql.mysql")
      local environment = luasql.mysql()
      local arbitrary_handle = environment:connect("app", "user", "password")
    expect_match_text: [environment.connect]
  - name: unrelated connect method is not a LuaSQL connection
    code: |
      local luasql = require("luasql.mysql")
      local environment = LocalEnvironment.new()
      local arbitrary_handle = environment:connect("app")
    expect_no_match: true
  description: "LuaSQL Environment:connect returns a connection receiver; the environment type, not a variable spelling, proves ownership. Typing-only."

