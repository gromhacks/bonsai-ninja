      - .build/
      - target/
      - benches/
      - vendor/
      - third_party/
      - third-party/
      - _deps/
      - CMakeFiles/
      - cmake-build
      - Pods/
      - Carthage/
      - dist/
      - build/
      - out/
      - generated/
      - autogen/
      - .gen.
      - _gen.
      - proto/gen/
      - migrations/
      - docs/
      - docs_src/
      - doc/
      - scripts/
      - deploy/
      - deployments/
