languages:
  ruby:
    dependency_manifest_patterns: [Gemfile, Gemfile.lock, "*.gemspec"]
    package_matching:
      package_separators: [".", "::", "/"]

  javascript: &ecmascript_ecosystem
    dependency_manifest_patterns:
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - yarn.lock
      - bun.lock
      - bun.lockb
      - deno.json
      - deno.jsonc
      - deno.lock
    package_matching:
      strip_import_prefixes: ["node:"]
      package_separators: ["/", "."]
  typescript: *ecmascript_ecosystem

  elixir:
    dependency_manifest_patterns: [mix.exs, mix.lock]
    package_matching:
      package_separators: ["."]
  erlang:
    dependency_manifest_patterns: [rebar.config, rebar.lock]
    package_matching:
      # `-include_lib("cowboy/include/cowboy.hrl")` exposes the OTP
      # application as the first path component; ordinary module names remain
      # dot-qualified. Package identity therefore accepts both grammar-proven
      # separators without teaching the shared matcher Erlang spellings.
      package_separators: ["/", "."]

  go:
    dependency_manifest_patterns: [go.mod, go.sum, go.work, go.work.sum]
    package_matching:
      package_separators: ["/", "."]
      call_qualifier_from_package_tail:
        package_separator: "/"
        call_separators: ["."]
    sink_tag_semantics:
      header-injection:
        character_constraint:
          required_excluded_characters: ["\r", "\n"]
          accepted_providers: &go_control_filter_providers
            - factory: {name: strings.Map}
              operation: {name: strings.Map}
      log-injection:
        character_constraint:
          required_excluded_characters: ["\r", "\n"]
          accepted_providers: *go_control_filter_providers
      open-redirect:
        same_origin_path_constraint:
          require_scheme_rejection: true
          require_authority_rejection: true
          require_absolute_path: true
          require_scheme_relative_rejection: true
          sink_argument_index: 1

  rust:
    dependency_manifest_patterns: [Cargo.toml, Cargo.lock]
    normalize_hyphen_to_underscore: true
    package_matching:
      package_separators: ["::", "/"]

  php:
    dependency_manifest_patterns: [composer.json, composer.lock]
    package_matching:
      package_separators: ["\\", "/", "::", "->"]

  python:
    dependency_manifest_patterns:
      - pyproject.toml
      - requirements*.txt
      - setup.py
      - Pipfile
      - Pipfile.lock
      - poetry.lock
      - uv.lock
    normalize_hyphen_to_underscore: true
    package_aliases:
      argon2-cffi: [argon2]
      beautifulsoup4: [bs4]
      cx-oracle: [cx_Oracle]
      djangorestframework: [rest_framework]
      flask-limiter: [flask_limiter]
      google-cloud-storage: [google.cloud.storage]
      msgpack-python: [msgpack]
      mysql-connector-python: [mysql.connector]
      pillow: [PIL]
      psycopg2-binary: [psycopg2]
      pycryptodome: [Crypto]
      python-jose: [jose]
      python-ldap: [ldap]
      python3-saml: [onelogin.saml2]
      pyyaml: [yaml]
    package_matching:
      package_separators: [".", "/"]
    sink_tag_semantics:
      open-redirect:
        same_origin_path_constraint:
          require_scheme_rejection: true
          require_authority_rejection: true
          require_absolute_path: true
          require_scheme_relative_rejection: true
          sink_argument_index: 0
          accepted_providers:
            - name: urllib.parse.urlparse
      path-traversal:
        character_constraint:
          required_excluded_characters: ["/", "\\"]
          accepted_providers:
            - factory:
                name: re.compile
              operation:
                regex: '^[A-Za-z_][A-Za-z0-9_]*\.(match|fullmatch)$'
      header-injection:
        character_constraint:
          required_excluded_characters: ["\r", "\n"]
          accepted_providers:
            - factory:
                name: re.compile
              operation:
                regex: '^[A-Za-z_][A-Za-z0-9_]*\.sub$'

  java: &jvm_ecosystem
    dependency_manifest_patterns:
      - pom.xml
      - build.gradle
      - build.gradle.kts
      - settings.gradle
      - settings.gradle.kts
      - gradle.lockfile
      - gradle.properties
    package_matching:
      package_separators: ["."]
  kotlin: *jvm_ecosystem
  scala: *jvm_ecosystem

  swift:
    dependency_manifest_patterns:
      - Package.swift
      - Package.resolved
      - Cartfile
      - Cartfile.resolved
      - Podfile
      - Podfile.lock
    package_matching:
      package_separators: [".", "/"]
  objc:
    dependency_manifest_patterns: [Podfile, Podfile.lock]
    package_matching:
      strip_import_suffixes: [".h", ".hpp", ".hxx"]
      package_separators: ["/", "."]

  csharp:
    dependency_manifest_patterns:
      - packages.config
      - "*.csproj"
      - "*.fsproj"
      - "*.vbproj"
      - "*.sln"
      - "*.slnx"
      - "*.props"
      - "*.targets"
    package_matching:
      package_separators: [".", "/"]

  c:
    not_applicable_sink_families: [deserialization]
    package_matching: &native_header_packages
      strip_import_suffixes: [".h", ".hpp", ".hxx"]
      package_separators: ["/"]

  cpp:
    package_matching: *native_header_packages

  dart:
    package_matching:
      package_separators: [".", "/"]

  lua:
    package_matching:
      package_separators: [".", "/"]

  perl:
    package_matching:
      package_separators: ["::", "->", "/"]
