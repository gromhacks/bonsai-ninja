# Rulepack-owned ecosystem metadata. Shared Rust crates consume these values
# generically; package-manager names, distribution aliases, security-model
# exceptions, and tag-level guard requirements belong here rather than in the
# analyzer engine.
canonical_sink_families:
  - cmdi
  - sqli
  - nosql
  - path
  - ssrf
  - xss
  - eval
  - deserialization
  - xxe
  - ldap
  - jwt
  - crypto
  - tls
  - template
  - open_redirect
  - file_upload
  - header_injection

# Compact audit-table labels are pack presentation data. Keeping them beside
# the canonical taxonomy lets custom packs add a family without changing or
# recompiling the CLI.
sink_family_short_labels:
  cmdi: cmdi
  sqli: sqli
  nosql: nosq
  path: path
  ssrf: ssrf
  xss: xss
  eval: eval
  deserialization: dser
  xxe: xxe
  ldap: ldap
  jwt: jwt
  crypto: cryp
  tls: tls
  template: tmpl
  open_redirect: oredr
  file_upload: upld
  header_injection: hdr

sink_family_aliases:
  deser: deserialization
  ssti: template
  code: eval
  header: header_injection
  host_header: header_injection
  file: path
  path_traversal: path
  open: open_redirect
  upload: file_upload
  upload_file_write_client_filename: file_upload
  upload_file_copy_client_filename: file_upload

# Sanitizer tag -> sink tags it can sanitize. A sanitizer always credits a
# sink with the exact same tag, so only cross-tag relationships and explicitly
# non-crediting vocabulary need entries here. Empty lists are passthrough or
# inventory markers: they are recognized but never clear taint.
sanitizer_credits:
  open-redirect-sanitize: [open-redirect]
  url-encode: [open-redirect]
  url-build: [ssrf, open-redirect]
  same-origin-path: [open-redirect, header-injection]
  nosql-sanitize: [nosql-injection]
  nosql-parameter: [nosql-injection]
  signed-token-verify: [code-injection, insecure-deserialization]
  signature-verify: [code-injection, insecure-deserialization, untrusted-token]
  html-encode: [xss]
  html-sanitize: [xss]
  js-encode: [xss]
  css-encode: [xss]
  path-sanitize: [path-traversal]
  regex-validate: [path-traversal, open-redirect, sql-injection, xpath-injection]
  allowlist-validate: [path-traversal, open-redirect, sql-injection, ssrf, xpath-injection, ssti]
  char-allowlist: [path-traversal, open-redirect, sql-injection, command-injection, header-injection, xpath-injection]
  csrf-protect: [csrf]
  ssrf-sanitize: [ssrf]
  ldap-escape: [ldap-injection]
  shell-escape: [command-injection]
  sql-parameter: [sql-injection]
  sql-parameterize: [sql-injection]
  db-bind-parameter: [sql-injection]
  xxe-sanitizer: [xxe]
  xpath-parameter: [xpath-injection]
  auth-sanitizer: [weak-auth, access-control]
  password-verify: [weak-auth]
  deser-secure: [insecure-deserialization]
  jwt-verify: [jwt, untrusted-token]
  constant-time: [timing-attack]
  constant-time-compare: [timing-attack]
  bounds-check: [memory-safety]
  crypto-bounds: [memory-safety, weak-crypto]
  crypto-mode: [weak-crypto]
  kdf: [weak-crypto]
  numeric-coerce: []
  regex-escape: [redos]
  lock-acquire: [race]
  cookie-secure: [cookie-misconfig]
  # Inventory-only until the pack defines a rate-limit-missing sink family.
  rate-limit: []
  passthrough-decode: []
  passthrough-transform: []
  validation: []
  schema-validate: []
  base64-encode: []
  hash: []
  url-decode: []
  non-sanitizer: []

# Pack-wide finding/attachment policy by sink tag. These are inherited by
# every language; a per-language tag default or an explicit rule field wins.
sink_tag_semantics:
  race:
    allow_file_package_evidence: true
    skip_call_package_gate: true
  memory-safety:
    allow_file_package_evidence: true
    skip_call_package_gate: true
  xxe:
    sanitizer_attachment_policy: receiver-factory-lineage
    receiver_factory_lineage_builders:
      - name: newDocumentBuilder

sink_category_semantics:
  source-independent:
    allow_file_package_evidence: true
    non_taint_evaluation: pattern
  lifecycle-audit:
    non_taint_evaluation: lifecycle

# Generic guard-call value roles by sanitizer tag. Shared analysis reads these
# roles and exact compiler call facts; it never switches on the tag spelling.
sanitizer_tag_semantics:
  same-origin-path:
    sanitizer_guard:
      use_receiver: true
  ssrf-sanitize:
    sanitizer_guard:
      all_arguments: true
  allowlist-validate:
    sanitizer_guard:
      all_arguments: true
  nosql-sanitize:
    sanitizer_guard:
      argument_indices: [0]
      require_terminal_rejection: true

