      - demo/
      - demos/
      - e2e/
      - integration/
      - acceptance/
      - _test.
      - .test.
      - _spec.
      - .spec.
      - _mock.
      - .mock.
      - node_modules/
      - bower_components/
      - coverage/
      - cypress/
      - playwright/
      - storybook/
      - .storybook/
      - .next/
      - .nuxt/
      - .svelte-kit/
      - conftest.py
      - .venv/
      - venv/
      - site-packages/
      - _pb2.py
      - src/test/
      - src/it/
      - Test.java
      - Tests.java
      - IT.java
      - Test.kt
      - Tests.kt
      - IT.kt
      - Test.scala
      - Tests.scala
      - IntegrationTest
      - _test.go
      - testdata/
