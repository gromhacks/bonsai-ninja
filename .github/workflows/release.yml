name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: bonsai-ninja
            package: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: bonsai-ninja
            package: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: bonsai-ninja
            package: tar
          - os: macos-14
            target: aarch64-apple-darwin
            bin: bonsai-ninja
            package: tar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bin: bonsai-ninja.exe
            package: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: bonsai-ninja.exe
            package: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build release binary
        run: cargo build --release --locked -p bonsai_cli --target ${{ matrix.target }}

      - name: Verify CLI smoke tests (Unix)
        if: matrix.package == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          "$bin" --version
          "$bin" --help >/dev/null
          "$bin" index examples/python/micro >/tmp/bonsai-index.json
          "$bin" diagnostics examples/python/micro >/tmp/bonsai-diagnostics.txt
          "$bin" inspect examples/python/micro --query os.system --context 4k >/tmp/bonsai-inspect.txt
          "$bin" trace examples/python/micro handle_request --format json >/tmp/bonsai-trace.json
          "$bin" security examples/python/micro taint-analysis --format json >/tmp/bonsai-taint.json
          "$bin" export examples/python/micro --format networkx >/tmp/bonsai-networkx.json

      - name: Verify CLI smoke tests (Windows)
        if: matrix.package == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "target/${{ matrix.target }}/release/${{ matrix.bin }}"

          & $bin --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bin --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bin index examples/python/micro > "$env:RUNNER_TEMP/bonsai-index.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bin diagnostics examples/python/micro > "$env:RUNNER_TEMP/bonsai-diagnostics.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bin inspect examples/python/micro --query os.system --context 4k > "$env:RUNNER_TEMP/bonsai-inspect.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bin trace examples/python/micro handle_request --format json > "$env:RUNNER_TEMP/bonsai-trace.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bin security examples/python/micro taint-analysis --format json > "$env:RUNNER_TEMP/bonsai-taint.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bin export examples/python/micro --format networkx > "$env:RUNNER_TEMP/bonsai-networkx.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package tarball
        if: matrix.package == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          artifact="bonsai-ninja-${{ matrix.target }}"
          mkdir -p "dist/$artifact"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$artifact/"
          cp README.md SKILLS.md AGENTS.md LICENSE docs.json "dist/$artifact/"
          mkdir -p "dist/$artifact/.agents/skills"
          cp -R .agents/skills/bonsai-ninja "dist/$artifact/.agents/skills/bonsai-ninja"
          cp -R docs "dist/$artifact/docs"
          cp -R security-patterns "dist/$artifact/security-patterns"
          tar -czf "$artifact.tar.gz" -C dist "$artifact"
          shasum -a 256 "$artifact.tar.gz" > "$artifact.tar.gz.sha256"

      - name: Package zip
        if: matrix.package == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifact = "bonsai-ninja-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$artifact" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$artifact/"
          Copy-Item README.md, SKILLS.md, AGENTS.md, LICENSE, docs.json "dist/$artifact/"
          New-Item -ItemType Directory -Force "dist/$artifact/.agents/skills" | Out-Null
          Copy-Item .agents/skills/bonsai-ninja "dist/$artifact/.agents/skills/bonsai-ninja" -Recurse
          Copy-Item docs "dist/$artifact/docs" -Recurse
          Copy-Item security-patterns "dist/$artifact/security-patterns" -Recurse
          Compress-Archive -Path "dist/$artifact" -DestinationPath "$artifact.zip" -Force
          $hash = (Get-FileHash "$artifact.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $artifact.zip" | Out-File -Encoding ascii "$artifact.zip.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bonsai-ninja-${{ matrix.target }}
          if-no-files-found: error
          path: |
            bonsai-ninja-${{ matrix.target }}.tar.gz
            bonsai-ninja-${{ matrix.target }}.tar.gz.sha256
            bonsai-ninja-${{ matrix.target }}.zip
            bonsai-ninja-${{ matrix.target }}.zip.sha256

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify checksums before publish
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c *.sha256

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
