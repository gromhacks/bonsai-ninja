[package]
name = "bonsai-ninja-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
description = "Reusable conformance test macros for language adapters."

[lib]
name = "bonsai_conformance"
path = "src/lib.rs"

[dependencies]
bonsai_common = { workspace = true }
bonsai_lang_api = { workspace = true }
bonsai_workspace = { workspace = true }
bonsai_testkit = { workspace = true }

[dev-dependencies]
bonsai_adapters = { package = "bonsai-ninja-adapters", path = "../adapters" }
bonsai_diagnostics = { package = "bonsai-ninja-diagnostics", path = "../diagnostics" }
bonsai_vfs = { package = "bonsai-ninja-vfs", path = "../vfs" }
parking_lot = { workspace = true }
serde_yaml = { workspace = true }
tree-sitter = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# `tree-sitter` is referenced by the public macro's compiled doctest; machete
# does not inspect doctest source. `bonsai_common` is expanded through macros.
ignored = ["bonsai_common", "tree-sitter"]
