[package]
name = "bonsai_conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable conformance test macros for language adapters."

[dependencies]
bonsai_common = { workspace = true }
bonsai_lang_api = { workspace = true }
bonsai_workspace = { workspace = true }
bonsai_testkit = { workspace = true }

[dev-dependencies]
bonsai_adapters = { workspace = true }
bonsai_diagnostics = { workspace = true }
bonsai_vfs = { workspace = true }
parking_lot = { workspace = true }
serde_yaml = { workspace = true }
tree-sitter = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# `tree-sitter` is referenced by the public macro's compiled doctest; machete
# does not inspect doctest source. `bonsai_common` is expanded through macros.
ignored = ["bonsai_common", "tree-sitter"]
