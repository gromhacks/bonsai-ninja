[package]
name = "bonsai-ninja"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "bonsai-ninja analyzer CLI."

[[bin]]
name = "bonsai-ninja"
path = "src/main.rs"

[dependencies]
bonsai_common = { workspace = true }
bonsai_diagnostics = { workspace = true }
bonsai_hash = { workspace = true }
bonsai_callgraph = { workspace = true }
bonsai_lang_api = { workspace = true }
bonsai_retrieval = { workspace = true }
bonsai_sdk = { workspace = true }
bonsai_adapters = { workspace = true }

clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
indicatif = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ahash = { workspace = true }
once_cell = { workspace = true }
rayon = { workspace = true }
ignore = { workspace = true }
dirs = { workspace = true }
mimalloc = { workspace = true }
owo-colors = { workspace = true }
comfy-table = { workspace = true }

# Tree-sitter is the CLI's only syntax layer: `dump-ast` walks the parse
# tree directly and source rendering uses the adapters' grammars plus the
# language pack's highlight queries.
tree-sitter = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }

[lints]
workspace = true
